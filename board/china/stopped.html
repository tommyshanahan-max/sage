<!doctype html>
<!-- THEY CLOSED STRIPE HALFWAY. It happens, and a dead end here sends them
     away for good. The first line says nothing changed, because that is the
     thing somebody who backed out of a bank form is actually worried about.
     Two ways forward and a way to leave without deciding. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Nothing connected — China Business Solutions</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif&display=swap">
<link rel="stylesheet" href="./china.css">
</head>
<body>
<main class="sheet">
  <div class="body" style="padding:calc(2.6rem + env(safe-area-inset-top,0px)) 1.3rem 0">
    <h1 style="margin:0;font-family:var(--serif);font-size:1.85rem;line-height:1.15;font-weight:400">Nothing was connected.</h1>
    <p style="margin:.6rem 0 0;font-size:.95rem;line-height:1.6;color:var(--body)">You closed Stripe before it finished. Nothing was saved and nothing on your account changed.</p>

    <div class="rows" style="margin-top:1.8rem">
      <a class="door" href="connect.html">
        <span class="head"><span class="dot"></span><b>Try again</b></span>
        <p>Back to Stripe. Same button, about a minute.</p>
      </a>
      <a class="door" href="beijing.html">
        <span class="head"><span class="dot other"></span><b>Use our Beijing company</b></span>
        <p>We invoice your client and pay you as our supplier. Slower, and there is a contract.</p>
      </a>
    </div>
    <div class="grow"></div>
  </div>
  <footer class="foot" style="text-align:center">
    <a class="quietgo" href="index.html">Decide later</a>
  </footer>
</main>
</body>
</html>
