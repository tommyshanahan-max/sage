<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="/favicon.png" sizes="192x192">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#EEF0F4">
<meta name="theme-color" content="#0B0E15" media="(prefers-color-scheme: dark)">
<!-- iOS reads these rather than the manifest for a home-screen install:
     no browser chrome, and a name short enough not to be truncated under
     the icon. -->
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="留学生">
<title>{{NAME}} · Liuxuesheng</title>
<meta name="description" content="{{ABOUT}}">

<!-- The card somebody sees when this is forwarded into a chat. WeChat's
     crawler fetches it once and runs no JavaScript, so the name and the face
     are written into the HTML by the server before it answers — a profile
     shared as a link should look like the person, not like the site. -->
<meta property="og:type" content="profile">
<meta property="og:title" content="{{NAME}}">
<meta property="og:description" content="{{ABOUT}}">
<meta property="og:image" content="{{CARD}}">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:url" content="{{ORIGIN}}/p/{{HANDLE}}">
<meta name="twitter:card" content="summary">
<meta http-equiv="Cache-Control" content="no-cache">
<meta name="color-scheme" content="light dark">
<style>
  :root{
    --paper:#EEF0F4; --raise:#F7F8FB; --ink:#151B28; --ink-2:#4E5968;
    --muted:#8A939F; --line:#E3E6EC; --hair:#EAECF1;
    --accent:#3F68D8; --accent-ink:#FFFFFF; --accent-soft:#E8ECF7;
    --t1:#3F68D8; --t2:#2A9D63; --t3:#D99038; --t4:#7268C4; --t5:#D4485C; --t6:#2F8C9E;
    --serif:Georgia,"Songti SC","Noto Serif CJK SC",'Times New Roman',serif;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",
      "Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;
    --shadow:0 2px 6px rgba(21,27,40,.07),0 10px 28px rgba(21,27,40,.09);
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --paper:#0B0E15; --raise:#141924; --ink:#E9EDF5; --ink-2:#A3B0C4;
      --muted:#6F7D92; --line:#232B39; --hair:#1E2531;
      --accent:#5C8DFF; --accent-ink:#0B0E15; --accent-soft:#18233D;
      --t1:#5C8DFF; --t2:#4EBE88; --t3:#E4A65A; --t4:#9187E0; --t5:#F0687C; --t6:#4FA9BC;
      --shadow:0 2px 6px rgba(0,0,0,.4),0 12px 32px rgba(0,0,0,.34);
    }
  }
  :root[data-theme="dark"]{
    --paper:#0B0E15; --raise:#141924; --ink:#E9EDF5; --ink-2:#A3B0C4;
    --muted:#6F7D92; --line:#232B39; --hair:#1E2531;
    --accent:#5C8DFF; --accent-ink:#0B0E15; --accent-soft:#18233D;
    --t1:#5C8DFF; --t2:#4EBE88; --t3:#E4A65A; --t4:#9187E0; --t5:#F0687C; --t6:#4FA9BC;
    --shadow:0 2px 6px rgba(0,0,0,.4),0 12px 32px rgba(0,0,0,.34);
  }
  :root[data-lang="zh"]{
    --serif:"Songti SC","Noto Serif CJK SC","Source Han Serif SC","STSong",Georgia,serif;
    --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB",
      "Microsoft YaHei","Noto Sans SC","Segoe UI",sans-serif;
  }
  :root[data-lang="zh"] body{line-height:1.75}
  :root[data-lang="zh"] .fact dt,
  :root[data-lang="zh"] .theirs h3{text-transform:none;letter-spacing:.02em}
  [hidden]{display:none!important}

  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);
    font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
  main{max-width:34rem;margin:0 auto;padding:0 0 4rem}
  button{font:inherit;cursor:pointer}
  a{color:inherit}
  img{max-width:100%}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}

  /* The strip that says this is not open yet. Quiet, full width, above
     everything — it is a status, not an announcement, and it is the first
     thing somebody arriving from a friend's link should read. */
  .invite{margin:0 0 .9rem;padding:.5rem 1.15rem;background:var(--accent-soft);
    color:var(--accent);font-size:.78rem;letter-spacing:.02em;text-align:center}
  .bar{display:flex;align-items:center;gap:.7rem;padding:.9rem 1.15rem}
  .bar a.back{color:var(--ink);text-decoration:none;display:grid;place-items:center;
    margin-left:-.3rem}
  .bar svg{width:1.5rem;height:1.5rem;stroke:currentColor;fill:none;stroke-width:1.8;
    stroke-linecap:round;stroke-linejoin:round}
  .lang{margin-left:auto;border:1px solid var(--line);background:var(--raise);
    color:var(--ink-2);border-radius:99px;padding:.42rem .9rem;font-size:.85rem;line-height:1}

  /* The same card as the top of the app, at the same size.
     A profile reached from the deck used to shrink the face to a six-rem
     circle over a decorative band — the photograph is the thing somebody
     followed the link for, so it keeps the size it had. */
  .shot{position:relative;margin:0 1.15rem 1rem;border-radius:1.3rem;overflow:hidden;
    height:max(15rem, min(66vh, 36rem));
    background:var(--raise);box-shadow:var(--shadow);
    display:flex;flex-direction:column;justify-content:flex-end}
  /* The same face-biased crop as the deck card: a landscape photograph in a
     tall frame loses its top, and the top is where the person is. */
  .shot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
    object-position:50% 32%;display:block}
  .shot .noshot{position:absolute;inset:0;display:grid;place-items:center;
    background:linear-gradient(160deg,var(--accent),var(--t6));color:var(--accent-ink);
    font-family:var(--serif);font-size:8rem;line-height:1}
  /* Words on a scrim, because white on a photograph is legible right up until
     somebody uploads a bright one. */
  .shot .scrim{position:relative;padding:5rem 1.2rem 1.2rem;
    background:linear-gradient(to top,rgba(10,14,22,.86),rgba(10,14,22,.5) 44%,rgba(10,14,22,0))}

  .head{display:flex;flex-direction:column;align-items:center;text-align:center;
    padding:0 1.15rem 1.2rem}
  .shot .nameline{display:flex;align-items:baseline;gap:.65rem;flex-wrap:wrap}
  .shot h1{margin:0;font-family:var(--serif);font-weight:400;font-size:2rem;
    line-height:1.1;color:#fff}
  .shot .type{flex:0 0 auto;font-weight:500;font-size:.82rem;letter-spacing:.1em;
    background:rgba(255,255,255,.2);color:#fff;border-radius:99px;
    padding:.28rem .6rem .28rem .7rem}
  /* The mark, in the same family as the four letters and with its name beside
     it — see index.html, where it sits on the browsing card. */
  .shot .rank{display:inline-flex;align-items:center;gap:.35rem;flex:0 0 auto;
    font-weight:500;font-size:.82rem;background:rgba(255,255,255,.2);color:#fff;
    border-radius:99px;padding:.28rem .65rem}
  .shot .where{margin:.35rem 0 0;font-size:.95rem;color:rgba(255,255,255,.82)}
  /* A link off this board. Underlined rather than merely coloured: it leaves,
     and somebody should be able to tell that before they press it. */
  .facts .out{color:var(--accent);text-decoration:underline;text-underline-offset:2px}
  /* How many follow them, on the paper under the card rather than on the
     photograph — it is a fact about them, not part of their picture. */
  .count{margin:.9rem 0 0;font-size:.9rem;color:var(--muted);
    font-variant-numeric:tabular-nums}
  .goal{margin:1rem 0 0;font-family:var(--serif);font-size:1.1rem;line-height:1.6;
    color:var(--ink-2);text-align:left;width:100%;max-width:28rem}

  .facts{margin:1.3rem 0 0;width:100%;max-width:28rem}
  .fact{display:flex;gap:1rem;padding:.75rem 0;border-top:1px solid var(--hair);
    align-items:baseline;text-align:left}
  .fact dt{flex:0 0 6.6rem;margin:0;font-size:.7rem;letter-spacing:.12em;
    text-transform:uppercase;color:var(--muted)}
  .fact dd{margin:0;flex:1;font-size:.96rem}
  .days{display:flex;gap:.25rem;flex-wrap:wrap}
  .days b{width:1.8rem;height:1.8rem;display:grid;place-items:center;border-radius:.4rem;
    font-size:.73rem;font-weight:500;background:var(--raise);border:1px solid var(--line);
    color:var(--muted)}
  .days b.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

  .theirs{margin:1.6rem 0 0;padding:0 1.15rem;width:100%}
  .theirs h3{margin:0 0 .3rem;font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;
    color:var(--muted);font-weight:600}
  .theirs p{margin:0;padding:.75rem 0;border-top:1px solid var(--hair);
    font-family:var(--serif);font-size:1.02rem;line-height:1.55;color:var(--ink-2);
    overflow-wrap:anywhere}
  .theirs .no{font-family:var(--sans);font-size:.92rem;color:var(--muted)}

  .acts{display:flex;gap:.5rem;margin:1.6rem 0 0;padding:0 1.15rem;flex-wrap:wrap}
  /* Directly under the photograph, so Follow is the first thing under the face
     rather than the last thing after the reading. */
  /* Side by side, directly under the photograph. Follow is the decision;
     Back to browsing is what you do either way. Flex hands a child its longest
     word before it takes space from a sibling, so both need telling they may
     be narrower than their content. */
  .acts.meet{margin:0 0 .4rem}
  .acts.meet>*{flex:1 1 0;min-width:0;padding:.8rem .8rem;font-size:1rem}
  /* Share sits with them but does not compete: Follow is the decision on
     somebody else's page, and on your own there is no decision to make. */
  .acts .share{color:var(--ink-2)}
  .acts button,.acts a{flex:1;min-width:9rem;text-align:center;text-decoration:none;
    border:1px solid var(--line);background:var(--raise);color:var(--ink);
    border-radius:99px;padding:.7rem 1rem;font-size:.93rem}
  .acts .primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
  .acts .warn{color:var(--t5)}

  .keybox{margin:1.6rem 1.15rem 0;padding-top:1.1rem;border-top:1px solid var(--hair)}
  .keybox h3{margin:0;font-family:var(--serif);font-weight:400;font-size:1.05rem}
  .keybox p{margin:.4rem 0 0;font-size:.85rem;line-height:1.55;color:var(--ink-2)}
  .keybox .warn{color:var(--accent)}
  .keyval{display:flex;margin:.7rem 0 0}
  .keyval code{flex:1;min-width:0;overflow-x:auto;white-space:nowrap;
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.82rem;
    background:var(--raise);border:1px solid var(--line);border-radius:.5rem;
    padding:.6rem .7rem}
  .keyrow{display:flex;gap:.5rem;margin:.7rem 0 0;flex-wrap:wrap}
  .keyrow button{border:1px solid var(--line);background:var(--raise);color:var(--ink);
    border-radius:99px;padding:.5rem 1.1rem;font-size:.9rem}
  .keyrow button.go{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

  .safety{margin:1.6rem 1.15rem 0;padding:.95rem 1.05rem;background:var(--raise);
    border:1px solid var(--line);border-left:3px solid var(--t3);border-radius:.6rem;
    font-size:.86rem;line-height:1.6;color:var(--ink-2)}

  .none{padding:4rem 1.15rem;text-align:center;color:var(--muted)}

  /* Writing to somebody. A sheet rather than a page: the profile behind it is
     what you are deciding about, and losing sight of it to write two lines is
     the wrong trade. */
  .sheet{position:fixed;inset:0;z-index:60;display:grid;place-items:end center;
    background:rgba(12,16,24,.42);padding:0}
  .sheet .card{width:min(34rem,100%);background:var(--raise);color:var(--ink);
    border-radius:18px 18px 0 0;padding:1.2rem 1.15rem calc(1.2rem + env(safe-area-inset-bottom));
    box-shadow:0 -8px 40px rgba(12,16,24,.28);max-height:88vh;overflow:auto}
  .sheet h2{margin:0 0 .35rem;font-size:1.05rem}
  .sheet .how{margin:0 0 .8rem;font-size:.86rem;line-height:1.55;color:var(--ink-2)}
  .sheet textarea{width:100%;min-height:7.5rem;resize:vertical;font:inherit;
    padding:.7rem .8rem;border-radius:12px;border:1px solid var(--line);
    background:var(--paper);color:var(--ink)}
  .sheet .row{display:flex;gap:.5rem;margin:.8rem 0 0}
  .sheet .row button{flex:1 1 auto;min-width:0}
  .sheet .said{margin:.6rem 0 0;font-size:.85rem;color:var(--muted)}
  .sheet .said.bad{color:#B4232A}
  /* A line saying where a thread has got to, where the button used to be. */
  .held{margin:0 1.15rem .7rem;padding:.75rem .9rem;background:var(--raise);
    border:1px solid var(--line);border-left:3px solid var(--t3);border-radius:.6rem;
    font-size:.88rem;line-height:1.55;color:var(--ink-2)}
  .stateline{margin:0;padding:.75rem .9rem;border-radius:12px;font-size:.88rem;
    background:var(--accent-soft);color:var(--ink-2)}
  .none b{display:block;font-family:var(--serif);font-weight:400;font-size:1.35rem;
    color:var(--ink);margin:0 0 .4rem}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main>
  <!-- While it is true. An empty room reads as a dead product unless it says
       it is not open yet. -->
  <p class="invite" id="invite"></p>
  <div class="bar">
    <a class="back" href="/browse" id="back" aria-label="Back">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 19l-7-7 7-7"/></svg>
    </a>
    <span id="langslot" style="margin-left:auto;display:flex"></span>
  </div>
  <div id="body"></div>
</main>

<script type="module">
import { T, when, lang, setLang, pickLang, langButton } from "/i18n.js";
import { stageFor, stageName, crownMark } from "/crown.js";

const HANDLE = "{{HANDLE}}";
const IN_WECHAT = /micromessenger/i.test(navigator.userAgent);

/* The clipboard API where there is one and a secure context, an off-screen
 * textarea where there is not — which is most of the browsers this has to work
 * in. Same two routes as the feed. */
function copyText(text) {
  try {
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text);
      return true;
    }
  } catch (e) { /* fall through */ }
  try {
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.setAttribute("readonly", "");
    ta.style.cssText = "position:absolute;left:-9999px;top:0";
    document.body.appendChild(ta);
    ta.select();
    ta.setSelectionRange(0, text.length);   // iOS ignores select() alone
    const ok = document.execCommand("copy");
    document.body.removeChild(ta);
    return ok;
  } catch (e) { return false; }
}

const $ = (id) => document.getElementById(id);
const el = (t, c, x) => { const n = document.createElement(t); if (c) n.className = c;
  if (x !== undefined) n.textContent = x; return n; };
const fill = (n) => { while (n.firstChild) n.removeChild(n.firstChild); };
const initial = (name) => (String(name || "?").trim()[0] || "?").toLowerCase();

let device = "";
try { device = localStorage.getItem("board:device") || ""; } catch { /* private window */ }

let PERSON = null, POSTS = [], THREAD = { can: false, why: "" };

async function load() {
  try {
    const d = await fetch("/api/person?handle=" + encodeURIComponent(HANDLE),
      { headers: device ? { "x-board-device": device } : {} }).then((r) => r.json());
    PERSON = d.person; POSTS = d.posts || [];
    THREAD = (d.person && d.person.thread) || { can: false, why: "" };
  } catch { PERSON = null; }
  paint();
}

function paint() {
  $("invite").textContent = T("site.invite");
  const box = $("body");
  fill(box);
  if (!PERSON) {
    const n = el("div", "none");
    n.append(el("b", null, T("bud.noProfile")),
      el("p", null, T("bud.noProfileBody", { who: HANDLE })));
    box.append(n);
    return;
  }
  const q = PERSON;

  /* One card, the size it is on the home screen. The cover is gone with it:
     it was a decorative band above a small circle, and both existed to make
     room for each other. */
  const shot = el("div", "shot");
  if (q.photo) {
    const img = Object.assign(document.createElement("img"),
      { src: "/api/public-media?id=" + encodeURIComponent(q.photo), alt: "", loading: "eager" });
    img.addEventListener("error", () => { img.remove(); shot.prepend(el("div", "noshot", initial(q.handle))); });
    shot.append(img);
  } else {
    shot.append(el("div", "noshot", initial(q.handle)));
  }
  const scrim = el("div", "scrim");
  // The name, and the four letters beside it. It was a row in the fact list,
  // which is where you put a thing somebody has to go looking for.
  const line = el("div", "nameline");
  line.append(el("h1", null, q.handle));
  if (q.type) line.append(el("b", "type", q.type));
  const rank = stageFor(q.levelBand);
  if (rank) {
    const worn = el("b", "rank");
    worn.append(crownMark(rank, "1.05rem"));
    worn.append(el("span", null, stageName(rank)));
    line.append(worn);
  }
  scrim.append(line);
  const where = [q.campus, q.here].filter(Boolean).join(" · ");
  if (where) scrim.append(el("p", "where", where));
  shot.append(scrim);
  box.append(shot);

  /* Your own page, while your photograph is still in the queue.
   *
   * You can see your face here; nobody else can, and there is nothing on the
   * page that says so — which turns a shared link into a mystery. Somebody
   * sends their page to a friend, the friend opens it and sees a letter, and
   * the obvious conclusion is that the upload failed. It did not; it is
   * waiting for a person, and this is the line that says which. */
  if (q.mine && q.photoPending) {
    box.append(el("p", "held", T("me.photoHeldShare")));
  }

  /* The two things somebody who just opened a WeChat link is here to do, and
     they go above everything they would have to read first. The row is built
     empty and filled further down, where the follow state and the note rules
     are already worked out — putting it in the page here is what fixes the
     order, not moving the logic. */
  const meet = el("div", "acts meet");
  box.append(meet);

  const head = el("div", "head");
  if (q.goal) head.append(el("p", "goal", q.goal));

  const facts = el("dl", "facts");
  const fact = (label, value) => {
    const d = el("div", "fact");
    d.append(el("dt", null, label));
    const dd = el("dd");
    if (typeof value === "string") dd.textContent = value; else dd.append(value);
    d.append(dd); facts.append(d);
  };
  if (q.level) fact(T("bud.level"), q.level);
  if (q.trade) fact(T("bud.trades"), q.trade);
  if (q.speaks && q.speaks.length) fact(T("bud.speaks"), q.speaks.join(" · "));
  /* Somewhere to be found that is not this board.
   *
   * A link and not just text, but the handle is the visible part on purpose:
   * instagram.com does not open in the mainland without a VPN, and this app's
   * whole pitch is that it needs neither. So the useful thing here is a name
   * that can be read, held up, or long-pressed and copied into the app where
   * it does work — the link is a convenience for everybody else. */
  if (q.ig) {
    const a = el("a", "out");
    a.href = "https://instagram.com/" + encodeURIComponent(q.ig);
    a.target = "_blank";
    a.rel = "noopener nofollow";
    a.textContent = "@" + q.ig;
    fact(T("me.igName"), a);
  }
  // The free-days week is out for V1 everywhere it appeared. Two people who
  // want to study together arrange it between themselves, and a timetable
  // nobody goes back to edit is worse than no timetable.
  if (facts.children.length) head.append(facts);
  box.append(head);

  // What they have actually put on the feed. For a stranger deciding whether
  // to say hello, this is worth more than anything in the profile itself.
  const theirs = el("div", "theirs");
  theirs.append(el("h3", null, T("bud.theirPosts")));
  if (POSTS.length) {
    for (const p of POSTS) theirs.append(el("p", null, p.note || "—"));
  } else {
    theirs.append(el("p", "no", T("bud.nothingYet")));
  }
  box.append(theirs);

  // How many people follow them, under the name. A count and never a list:
  // who follows whom among foreign students is a social graph, and this is
  // not the product that publishes one.
  if (q.followers) {
    head.append(el("p", "count",
      q.followers === 1 ? T("bud.followers1") : T("bud.followers", { n: q.followers })));
  }

  const acts = el("div", "acts");
  if (!q.mine) {
    const fol = el("button", q.following ? "" : "primary",
      T(q.following ? "bud.following" : "bud.follow"));
    fol.type = "button";
    fol.addEventListener("click", async () => {
      const want = !q.following;
      fol.disabled = true;
      try {
        const d = await fetch("/api/follow", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ who: q.id, on: want, device }),
        }).then((r) => r.json());
        if (d && d.ok) { q.following = d.following; q.followers = d.count; paint(); return; }
      } catch { /* fall through */ }
      fol.disabled = false;
      fol.textContent = T("act.again");
    });
    meet.append(fol);

    /* Saying hello is held back for V1, with Messages.
     *
     * Not because it does not work — it does, and the rule about who may write
     * and when is still enforced on the server. It is that the inbox it lands
     * in has no tab on it, so a hello sent today arrives somewhere its
     * recipient cannot open. A button that quietly fails is worse than one
     * that is not there.
     *
     * Everything below stays wired: put the Messages tab back and this is one
     * `if` away from working again.
     *
     * if (THREAD.can) {
     *   const hi = el("button", "primary", T(THREAD.answering ? "note.answerIt" : "note.say"));
     *   hi.type = "button";
     *   hi.addEventListener("click", () => sheet(q));
     *   meet.append(hi);
     * }
     */
  }

  /* Share, on every profile — including your own, which is the whole point:
   * this is the page you send a friend so they can find you. It is the address
   * WeChat renders with a face and a name on it.
   *
   * The deck has one of these per card; this is the same thing at the place
   * somebody arrives when they follow one. */
  const sh = el("button", "share", T("act.share"));
  sh.type = "button";
  sh.addEventListener("click", () => {
    const url = location.origin + "/p/" + encodeURIComponent((q.handle || "").toLowerCase());
    const say = (w, hold) => {
      sh.textContent = w;
      setTimeout(() => { sh.textContent = T("act.share"); }, hold || 2200);
    };
    // Inside WeChat a page may not open a share sheet: the ⋯ menu is the only
    // way, so the honest version is the clipboard and where the real control is.
    if (IN_WECHAT) { say(T(copyText(url) ? "act.wxCopied" : "act.wxUseMenu"), 3600); return; }
    if (navigator.share) {
      navigator.share({ title: q.handle || T("board.someone"),
                        text: (q.goal || "").slice(0, 120), url })
        .catch(() => { /* dismissed is not a failure */ });
      return;
    }
    say(T(copyText(url) ? "act.copied" : "act.copyFail"));
  });
  meet.append(sh);

  // Directly under Follow, because somebody who opened a shared link has two
  // things they might do and this is the second one: look at the rest. It was
  // at the bottom of the page, past everything they would have to read first.
  const feed = el("a", null, T("bud.back"));
  feed.href = "/browse";
  meet.append(feed);
  if (!q.mine) {
    const rep = el("button", "warn", T("bud.reportThem"));
    rep.type = "button";
    rep.addEventListener("click", () => {
      // Reporting a profile is reporting its owner, and the queue this lands
      // in is the same one a reported post lands in.
      rep.disabled = true;
      rep.textContent = T("act.reported");
      fetch("/api/report", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ id: q.id, why: "Reported from a profile", device }),
      }).catch(() => { /* it is already gone from their view */ });
    });
    acts.append(rep);
  }
  box.append(acts);

  /* Where a note got to. Held back with the button that starts one: with no
   * way to write, "you have written, it is theirs to answer" explains a state
   * nobody on this page can be in or get out of. It comes back when Say hello
   * does.
   *
   * if (!q.mine && !THREAD.can && THREAD.why) {
   *   box.append(el("p", "stateline",
   *     T(THREAD.why === "closed" ? "note.closed" : "note.waiting", { who: q.handle })));
   * }
   */
  /* YOUR KEY, on your own page.
   *
   * The line that makes a second browser you. It lives here because this is
   * the page the Profile tab opens once you have one — telling somebody to
   * find it in the editor means telling them a different route depending on
   * whether they have a page yet, and an instruction with an "if" in it is one
   * people get wrong. */
  if (q.mine) {
    const kb = el("div", "keybox");
    kb.append(el("h3", null, T("key.title")), el("p", null, T("key.body")));
    const open = el("div");
    open.hidden = true;
    const val = el("code", null, device || "\u2014");
    const row = el("div", "keyrow");
    const show = el("button", null, T("key.show"));
    show.type = "button";
    show.addEventListener("click", () => {
      open.hidden = !open.hidden;
      show.textContent = open.hidden ? T("key.show") : T("key.hide");
    });
    const copy = el("button", "go", T("key.copy"));
    copy.type = "button";
    copy.addEventListener("click", () => {
      copy.textContent = T(copyText(device) ? "key.copied" : "act.copyFail");
      setTimeout(() => { copy.textContent = T("key.copy"); }, 2000);
    });
    open.append(el("div", "keyval", null), el("p", "warn", T("key.warn")));
    open.firstChild.append(val);
    const crow = el("div", "keyrow");
    crow.append(copy);
    open.append(crow);
    row.append(show);
    kb.append(row, open);
    if (device) box.append(kb);
  }

  box.append(el("p", "safety", T("bud.safety")));
}

/* The sheet. Two lines and a send, and an honest sentence about what happens
 * to them. */
function sheet(q) {
  const wrap = el("div", "sheet");
  const card = el("div", "card");
  const answering = Boolean(THREAD.answering);

  card.append(el("h2", null, T("note.title", { who: q.handle })));
  card.append(el("p", "how", answering ? T("note.answerHow") : T("note.how", { who: q.handle })));

  const box = document.createElement("textarea");
  box.maxLength = 600;
  box.placeholder = T("note.placeholder");
  card.append(box);

  const said = el("p", "said");
  const row = el("div", "row");
  const shut = el("button", null, T("bud.close"));
  shut.type = "button";
  shut.addEventListener("click", () => wrap.remove());
  const go = el("button", "primary", T("note.send"));
  go.type = "button";

  go.addEventListener("click", async () => {
    const text = box.value.trim();
    if (!text) { box.focus(); return; }
    go.disabled = true; shut.disabled = true;
    said.classList.remove("bad");
    said.textContent = T("note.sending");
    try {
      const r = await fetch("/api/note", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ device, who: q.id, text }),
      });
      const d = await r.json().catch(() => ({}));
      if (!r.ok) {
        // The server's word for what stopped it, said in the reader's own
        // language rather than passed through as a code.
        const known = { profile: "note.needProfile", enough: "note.enough",
                        gone: "note.gone", closed: "note.closed", waiting: "note.waiting" };
        said.classList.add("bad");
        said.textContent = T(known[d.error] || "note.failed", { who: q.handle });
        go.disabled = false; shut.disabled = false;
        return;
      }
      said.textContent = T("note.sent");
      go.remove();
      shut.disabled = false;
      shut.textContent = T("bud.close");
      // The profile behind the sheet is now wrong about what can be pressed.
      await load();
    } catch {
      said.classList.add("bad");
      said.textContent = T("note.failed");
      go.disabled = false; shut.disabled = false;
    }
  });

  row.append(shut, go);
  card.append(row, said);
  wrap.append(card);
  // Pressing the dimmed area behind it closes; pressing the card does not.
  wrap.addEventListener("click", (e) => { if (e.target === wrap) wrap.remove(); });
  document.body.append(wrap);
  box.focus();
}

setLang(pickLang());
$("langslot").append(langButton(paint));
load();
</script>

<script>
/* Registering the worker.
 *
 * Classic script rather than a module so this runs before anything else and
 * on browsers that do not do modules — the worker is what makes the board
 * survive a bad connection, which is exactly the browser least likely to be
 * new.
 *
 * Deferred to load: registration competes with the page's own requests, and
 * the first paint matters more than the second visit.
 */
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("/sw.js").catch(() => { /* not fatal */ });
  });
}
</script>
