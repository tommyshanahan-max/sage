<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="/favicon.png" sizes="192x192">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#EEF0F4">
<meta name="theme-color" content="#0B0E15" media="(prefers-color-scheme: dark)">
<!-- iOS reads these rather than the manifest for a home-screen install:
     no browser chrome, and a name short enough not to be truncated under
     the icon. -->
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="交换">
<title>{{NAME}} · The Exchange</title>
<meta name="description" content="{{ABOUT}}">

<!-- The card somebody sees when this is forwarded into a chat. WeChat's
     crawler fetches it once and runs no JavaScript, so the name and the face
     are written into the HTML by the server before it answers — a profile
     shared as a link should look like the person, not like the site. -->
<meta property="og:type" content="profile">
<meta property="og:title" content="{{NAME}}">
<meta property="og:description" content="{{ABOUT}}">
<meta property="og:image" content="{{CARD}}">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:url" content="{{ORIGIN}}/p/{{HANDLE}}">
<meta name="twitter:card" content="summary">
<meta http-equiv="Cache-Control" content="no-cache">
<meta name="color-scheme" content="light dark">
<style>
  :root{
    --paper:#EEF0F4; --raise:#F7F8FB; --ink:#151B28; --ink-2:#4E5968;
    --muted:#8A939F; --line:#E3E6EC; --hair:#EAECF1;
    --accent:#3F68D8; --accent-ink:#FFFFFF; --accent-soft:#E8ECF7;
    --t1:#3F68D8; --t2:#2A9D63; --t3:#D99038; --t4:#7268C4; --t5:#D4485C; --t6:#2F8C9E;
    --serif:Georgia,"Songti SC","Noto Serif CJK SC",'Times New Roman',serif;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",
      "Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;
    --shadow:0 2px 6px rgba(21,27,40,.07),0 10px 28px rgba(21,27,40,.09);
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --paper:#0B0E15; --raise:#141924; --ink:#E9EDF5; --ink-2:#A3B0C4;
      --muted:#6F7D92; --line:#232B39; --hair:#1E2531;
      --accent:#5C8DFF; --accent-ink:#0B0E15; --accent-soft:#18233D;
      --t1:#5C8DFF; --t2:#4EBE88; --t3:#E4A65A; --t4:#9187E0; --t5:#F0687C; --t6:#4FA9BC;
      --shadow:0 2px 6px rgba(0,0,0,.4),0 12px 32px rgba(0,0,0,.34);
    }
  }
  :root[data-theme="dark"]{
    --paper:#0B0E15; --raise:#141924; --ink:#E9EDF5; --ink-2:#A3B0C4;
    --muted:#6F7D92; --line:#232B39; --hair:#1E2531;
    --accent:#5C8DFF; --accent-ink:#0B0E15; --accent-soft:#18233D;
    --t1:#5C8DFF; --t2:#4EBE88; --t3:#E4A65A; --t4:#9187E0; --t5:#F0687C; --t6:#4FA9BC;
    --shadow:0 2px 6px rgba(0,0,0,.4),0 12px 32px rgba(0,0,0,.34);
  }
  :root[data-lang="zh"]{
    --serif:"Songti SC","Noto Serif CJK SC","Source Han Serif SC","STSong",Georgia,serif;
    --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB",
      "Microsoft YaHei","Noto Sans SC","Segoe UI",sans-serif;
  }
  :root[data-lang="zh"] body{line-height:1.75}
  :root[data-lang="zh"] .fact dt,
  :root[data-lang="zh"] .theirs h3{text-transform:none;letter-spacing:.02em}
  [hidden]{display:none!important}

  *{box-sizing:border-box}
  /* THE WHOLE APP, ONE SIZE UP.
     Everything here is set in rem, so the root is the one dial: 17px instead
     of the browser's 16 puts about six per cent on every size, every gap and
     every tap target at once, which is what "it is all a bit small" actually
     asks for. Not a per-element pass — that is how a page ends up with three
     sizes of the same thing. */
  html{font-size:17px;-webkit-text-size-adjust:100%}
  /* A hole in your own page, as a row that fills it. Dashed, so it reads as
     something not yet there rather than as a fact about you. */
  .gap{display:block;margin:.5rem 0 0;padding:.6rem .85rem;border:1px dashed var(--line);
    border-radius:.7rem;color:var(--accent);text-decoration:none;font-size:.95rem}
  .gap:hover{border-color:var(--accent);background:var(--accent-soft)}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);
    font-size:1rem;line-height:1.5;-webkit-font-smoothing:antialiased}
  main{max-width:34rem;margin:0 auto;padding:0 0 4rem}
  button{font:inherit;cursor:pointer}
  a{color:inherit}
  img{max-width:100%}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}

  /* The strip that says this is not open yet. Quiet, full width, above
     everything — it is a status, not an announcement, and it is the first
     thing somebody arriving from a friend's link should read. */
  .invite{margin:0 0 .9rem;padding:.5rem 1.15rem;background:var(--accent-soft);
    color:var(--accent);font-size:.78rem;letter-spacing:.02em;text-align:center}
  .bar{display:flex;align-items:center;gap:.7rem;padding:.9rem 1.15rem}
  .bar a.back{color:var(--ink);text-decoration:none;display:grid;place-items:center;
    margin-left:-.3rem}
  .bar svg{width:1.5rem;height:1.5rem;stroke:currentColor;fill:none;stroke-width:1.8;
    stroke-linecap:round;stroke-linejoin:round}
  /* The four tabs, copied from index.html. Named .tabs and not .bar because
     .bar on this page is already the row at the top with the back arrow in it,
     and one class doing two jobs on one page is a rule nobody can change
     safely afterwards. */
  .tabs{position:fixed;left:50%;transform:translateX(-50%);bottom:0;z-index:35;
    width:100%;max-width:34rem;display:flex;
    align-items:center;justify-content:space-around;
    padding:.35rem .5rem calc(.35rem + env(safe-area-inset-bottom));
    background:var(--paper);border-top:1px solid var(--line)}
  @media (min-width:36rem){
    .tabs{border-left:1px solid var(--line);border-right:1px solid var(--line);
      border-radius:1rem 1rem 0 0}
  }
  .tabs a{flex:1;min-width:0;color:var(--muted);
    display:flex;flex-direction:column;align-items:center;gap:.15rem;
    padding:.45rem .2rem;font-size:.64rem;text-decoration:none;letter-spacing:.02em}
  .tabs a span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tabs a[aria-current="page"]{color:var(--accent)}
  .tabs svg{width:1.5rem;height:1.5rem;stroke:currentColor;fill:none;stroke-width:1.7;
    stroke-linecap:round;stroke-linejoin:round}
  /* Room for it, or the last thing on the page sits under it. */
  body.hastabs main{padding-bottom:5rem}

  .lang{margin-left:auto;border:1px solid var(--line);background:var(--raise);
    color:var(--ink-2);border-radius:99px;padding:.42rem .9rem;font-size:.85rem;line-height:1}

  /* The same card as the top of the app, at the same size.
     A profile reached from the deck used to shrink the face to a six-rem
     circle over a decorative band — the photograph is the thing somebody
     followed the link for, so it keeps the size it had. */
  /* NAMED .looks AND NOT .shots, WHICH IS TAKEN. site.css already defines
     .shots as a three-column grid for the marketing page, this file loads
     site.css, and the first version of this silently inherited it — six
     portraits laid out as a wide grid running off the left edge of a phone.
     The fourth collision of its kind on this board. Grep before naming one:
       grep -rn '\.thename\b' public/*.css public/*.html
     A STRIP THAT SCROLLS, NOT A GRID THAT WRAPS. Six pictures in a grid push
     everything below them off a phone screen; a row you swipe keeps the
     sentence and the buttons where they were, and swiping sideways through
     someone's looks is the gesture every casting app already taught. */
  /* scroll-padding AS WELL AS padding, and it is not decoration. A snap port
     snaps the first cell to the start of the SCROLL area, which ignores the
     container's own padding — so the strip opened with the first portrait
     jammed against the left edge of the phone while every other block on the
     page sat inside a gutter, and the padding was there the whole time doing
     nothing anybody could see. scroll-padding is what tells the snap where
     "start" actually is. */
  .looks{display:flex;gap:.5rem;overflow-x:auto;margin:0 0 1.2rem;padding:0 1.15rem .2rem;
    scroll-padding-inline:1.15rem;
    scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch}
  .looks::-webkit-scrollbar{display:none}
  .lookcell{position:relative;flex:0 0 auto;width:7.2rem;aspect-ratio:3/4;
    border-radius:.9rem;overflow:hidden;background:var(--raise);scroll-snap-align:start}
  .lookcell img{width:100%;height:100%;object-fit:cover;display:block}
  /* Dimmed, with the reason on it. Its owner is the only person who is sent a
     held picture at all, and to them "waiting" and "failed" look the same
     without this. */
  .lookcell.waiting img{opacity:.45}
  .lookcell .wait{position:absolute;left:.35rem;right:.35rem;bottom:.35rem;
    text-align:center;font-size:.68rem;letter-spacing:.02em;padding:.15rem .3rem;
    border-radius:.4rem;background:var(--paper);color:var(--muted)}
  .shot{position:relative;margin:0 1.15rem 1rem;border-radius:1.3rem;overflow:hidden;
    height:max(15rem, min(66vh, 36rem));
    background:var(--raise);box-shadow:var(--shadow);
    display:flex;flex-direction:column;justify-content:flex-end}
  .shot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
  .shot .noshot{position:absolute;inset:0;display:grid;place-items:center;
    background:linear-gradient(160deg,var(--accent),var(--t6));color:var(--accent-ink);
    font-family:var(--serif);font-size:8rem;line-height:1}
  /* Words on a scrim, because white on a photograph is legible right up until
     somebody uploads a bright one. */
  .shot .scrim{position:relative;padding:5rem 1.2rem 1.2rem;
    background:linear-gradient(to top,rgba(10,14,22,.86),rgba(10,14,22,.5) 44%,rgba(10,14,22,0))}

  .head{display:flex;flex-direction:column;align-items:center;text-align:center;
    padding:0 1.15rem 1.2rem}
  .shot .nameline{display:flex;align-items:baseline;gap:.65rem;flex-wrap:wrap}
  .shot h1{margin:0;font-family:var(--serif);font-weight:400;font-size:2rem;
    line-height:1.1;color:#fff}
  .shot .type{flex:0 0 auto;font-weight:500;font-size:.82rem;letter-spacing:.1em;
    background:rgba(255,255,255,.2);color:#fff;border-radius:99px;
    padding:.28rem .6rem .28rem .7rem}
  /* The mark, in the same family as the four letters and with its name beside
     it — see index.html, where it sits on the browsing card. */
  .shot .rank{display:inline-flex;align-items:center;gap:.35rem;flex:0 0 auto;
    font-weight:500;font-size:.82rem;background:rgba(255,255,255,.2);color:#fff;
    border-radius:99px;padding:.28rem .65rem}
  .shot .where{margin:.35rem 0 0;font-size:.95rem;color:rgba(255,255,255,.82)}
  /* A link off this board. Underlined rather than merely coloured: it leaves,
     and somebody should be able to tell that before they press it. */
  .facts .out{color:var(--accent);text-decoration:underline;text-underline-offset:2px}
  /* How many follow them, on the paper under the card rather than on the
     photograph — it is a fact about them, not part of their picture. */
  .count{margin:.9rem 0 0;font-size:.9rem;color:var(--muted);
    font-variant-numeric:tabular-nums}
  /* THE SAME LINE, WHEN IT IS YOURS AND IT OPENS SOMETHING.
     It has to LOOK pressable or it is a link nobody presses: a grey sentence
     that happens to be an anchor is the state this was already in. The
     chevron rather than an underline, because the row is a destination and
     not a word in a paragraph. */
  a.count.go{display:inline-flex;align-items:center;gap:.3rem;
    color:var(--accent);text-decoration:none;font-weight:500}
  a.count.go::after{content:"\203a";font-size:1.15em;line-height:1}
  a.count.go:hover{text-decoration:underline}
  a.count.go:focus-visible{outline:2px solid var(--accent);outline-offset:3px;
    border-radius:.3rem}
  .brought{margin:.7rem 0 0;font-size:.88rem;color:var(--ink-2)}
  .brought b{font-weight:500;color:var(--ink)}
  .goal{margin:1rem 0 0;font-family:var(--serif);font-size:1.1rem;line-height:1.6;
    color:var(--ink-2);text-align:left;width:100%;max-width:28rem}

  /* THE SENTENCE THE WHOLE BOARD TURNS ON — see where it is built.
     Bigger than the words under it and in the serif, because it is the one
     line on the page doing that work; the two answers carry the accent and the
     scaffolding between them does not, so it reads as a sentence and scans as
     two words. Left, at the same width as everything else in the column. */
  .says{margin:1.1rem 0 0;font-family:var(--serif);font-weight:400;
    font-size:1.45rem;line-height:1.35;color:var(--ink);
    text-align:left;width:100%;max-width:28rem;text-wrap:balance}
  .says em{font-style:normal;color:var(--ink-2)}
  /* THE GAP IS A MARGIN AND NOT A SPACE CHARACTER, the same as .tsay b on the
     waiting card — say.iam is "I am" with no space on it, and Chinese does not
     want one between 我是 and the role anyway. Matched to that rule so one
     sentence does not sit differently in two places. */
  .says b{font-weight:400;color:var(--accent);
    border-bottom:1px solid var(--accent);padding-bottom:1px;margin:0 .28rem}

  /* ---- what they are looking for, and the card ---------------------------- */
  .chipcap{margin:1.1rem 0 -.5rem;font-size:.66rem;letter-spacing:.09em;
    text-transform:uppercase;color:var(--muted);text-align:center;width:100%}
  .chips{display:flex;flex-wrap:wrap;gap:.35rem;margin:1rem 0 0;justify-content:center}
  .chip{font-size:.78rem;padding:.3rem .65rem;border-radius:99px;
    background:var(--accent-soft);color:var(--accent);border:1px solid var(--line)}
  /* What the two of you have in common, said before anybody presses anything.
     Grey when there is nothing: "you can still follow" is the point of the
     line, so it cannot read as a refusal. */
  .shared{margin:.75rem 0 0;font-size:.9rem;color:var(--accent);max-width:28rem}
  .shared.no{color:var(--muted)}

  .match{width:100%;max-width:28rem;margin:1.5rem 0 0;padding:1.1rem;
    border:1px solid var(--line);border-radius:1rem;background:var(--card);
    text-align:left;box-shadow:var(--shadow)}
  .match h3{margin:0;font-family:var(--serif);font-weight:400;font-size:1.25rem;
    line-height:1.25}
  .match .why{margin:.6rem 0 0;font-size:.88rem;color:var(--ink-2);line-height:1.55}
  /* THE WARNING IS THE IMPORTANT ELEMENT ON THIS SCREEN. Red, above the
     button, and phrased as what happens rather than as a policy. */
  .match .warn{margin:.9rem 0 0;padding:.75rem .85rem;border-radius:.8rem;
    background:#FCF1F2;border:1px solid #F2D6DA;color:#8C3242;
    font-size:.84rem;line-height:1.55}
  .match button{width:100%;margin:.7rem 0 0;padding:.7rem;border-radius:99px;
    border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);
    font-size:.94rem}
  .match button.q{background:transparent;color:var(--ink-2);border-color:var(--line)}
  /* THE CHAT, above the card and set off from it by a rule: they are two
     separate decisions and the screen should not read as one long form. */
  .match .chat{margin:.9rem 0 0;padding:0 0 1rem;border-bottom:1px solid var(--line)}
  .match .chat textarea{width:100%;margin:.7rem 0 0;padding:.7rem .8rem;font:inherit;
    font-size:.95rem;line-height:1.5;border:1px solid var(--line);
    border-radius:.7rem;background:var(--paper);color:var(--ink);resize:vertical}
  .match .k{font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;
    color:var(--muted);font-weight:600;display:block;margin:.9rem 0 0}
  .match .v{margin:.15rem 0 0;font-size:1.05rem;word-break:break-all}
  .match .line{margin:.5rem 0 0;font-size:.88rem;color:var(--ink-2);line-height:1.55}
  .match .said{margin:.7rem 0 0;font-size:.85rem;color:var(--ink-2)}
  .match .tiny{margin:.6rem 0 0;font-size:.76rem;color:var(--muted);line-height:1.5}
  /* A WeChat code, theirs or your own. White behind it whatever the theme: a
     code inverted by a dark page is a code a scanner will not read. */
  .match .qr{display:block;width:100%;max-width:11rem;aspect-ratio:1;
    object-fit:contain;background:#fff;border-radius:.55rem;padding:.4rem;
    margin:.6rem 0 0}
  .match .qrrow{margin:.5rem 0 0}
  .match .qrpick{display:block;margin:.5rem 0 0;font-size:.8rem;color:var(--ink-2);
    max-width:100%}
  .match input{width:100%;margin:.45rem 0 0;padding:.65rem .8rem;font:inherit;
    font-size:.95rem;border:1px solid var(--line);border-radius:.7rem;
    background:var(--paper);color:var(--ink)}
  .match .row{display:flex;gap:.6rem}
  .match .row button{flex:1}

  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]) .match .warn{background:#2A1720;border-color:#4A2530;color:#F0A8B4}
  }
  :root[data-theme="dark"] .match .warn{background:#2A1720;border-color:#4A2530;color:#F0A8B4}

  /* THE FACTS AS ONE OBJECT, which is the shape of the design Tom sent over.
     Bare rows on the page read as a list of leftovers; inside a card with the
     labels drawn as chips they read as a record — which is what they are, and
     none of the words in them changed. The icon is the fixed part of the
     label column so the values line up down the card whatever the chip says. */
  .facts{margin:1.3rem 0 0;width:100%;max-width:28rem;
    border:1px solid var(--line);border-radius:1rem;
    background:var(--raise);overflow:hidden}
  .fact{display:flex;gap:.75rem;padding:.8rem .9rem;
    border-top:1px solid var(--hair);align-items:center;text-align:left}
  .fact:first-child{border-top:0}
  .fact .fk{flex:0 0 7.6rem;display:flex;align-items:center;gap:.45rem;min-width:0}
  .fact .ico{flex:0 0 auto;width:1.05rem;height:1.05rem;color:var(--muted);
    fill:none;stroke:currentColor;stroke-width:1.7;
    stroke-linecap:round;stroke-linejoin:round}
  .fact dt{margin:0;font-size:.63rem;letter-spacing:.07em;line-height:1.35;
    text-transform:uppercase;color:var(--ink-2);
    background:var(--paper);border:1px solid var(--line);
    border-radius:.38rem;padding:.2rem .4rem;min-width:0}
  .fact dd{margin:0;flex:1;min-width:0;font-size:.96rem;font-weight:500}
  /* The places left, under the layer it belongs to. Quieter than the value
     above it: the layer is the fact, this is the thing you can still do
     something about, and two lines of equal weight read as two facts. */
  .fact dd small{display:block;font-size:.8rem;color:var(--muted);margin-top:.15rem}
  /* A ROW OF TAGS, NOT A TABLE. Three rows of "LEVEL / Just starting" in a
     bordered box was the tallest thing on the page after the photograph, and
     every label in it was a word nobody reads twice. The values say it: "Just
     starting", "Speaking part", "First ten · 3 left". The labels stay for a
     screen reader and go from the screen. */
  .facts{display:flex;flex-wrap:wrap;justify-content:center;gap:.5rem;
    border:0;background:none;overflow:visible;max-width:30rem}
  .fact{border:1px solid var(--line);border-radius:99px;background:var(--raise);
    padding:.45rem .85rem;gap:.4rem}
  .fact:first-child{border-top:1px solid var(--line)}
  .fact .fk{flex:0 0 auto}
  .fact dt{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);
    white-space:nowrap;padding:0;border:0}
  .fact dd{flex:0 1 auto;font-weight:600}
  .fact dd small{display:inline;margin:0 0 0 .3rem}
  /* The bio, three lines and a More — coarse first, the rest on a tap. */
  .goal.clamp{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
  .biomore{border:0;background:none;padding:.2rem 0 0;font:inherit;font-size:.95rem;
    font-weight:600;color:var(--accent);cursor:pointer;align-self:flex-start}
  /* THE KEY, GOOGLE AND THE SAFETY NOTE, FOLDED. Each is read once; together
     they were most of the scroll on a page opened every day. */
  .keyfold{margin:1.6rem 1.15rem 0;background:var(--raise);border:1px solid var(--line);
    border-radius:1rem}
  .keyfold summary{list-style:none;display:flex;justify-content:space-between;align-items:center;
    padding:1rem 1.05rem;font-weight:600;cursor:pointer}
  .keyfold summary::-webkit-details-marker{display:none}
  .keyfold summary::after{content:"\203A";font-size:1.3rem;color:var(--muted);
    transition:transform .15s}
  .keyfold[open] summary::after{transform:rotate(90deg)}
  .keyfold .keybox{margin:0 1.05rem 1rem;border-top:1px solid var(--hair)}
  .keyfold .safety{margin:0 1.05rem 1rem}
  .days{display:flex;gap:.25rem;flex-wrap:wrap}
  .days b{width:1.8rem;height:1.8rem;display:grid;place-items:center;border-radius:.4rem;
    font-size:.73rem;font-weight:500;background:var(--raise);border:1px solid var(--line);
    color:var(--muted)}
  .days b.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

  .theirs{margin:1.6rem 0 0;padding:0 1.15rem;width:100%}
  .theirs h3{margin:0 0 .3rem;font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;
    color:var(--muted);font-weight:600}
  .theirs p{margin:0;padding:.75rem 0;border-top:1px solid var(--hair);
    font-family:var(--serif);font-size:1.02rem;line-height:1.55;color:var(--ink-2);
    overflow-wrap:anywhere}
  .theirs .no{font-family:var(--sans);font-size:.92rem;color:var(--muted)}

  .acts{display:flex;gap:.5rem;margin:1.6rem 0 0;padding:0 1.15rem;flex-wrap:wrap}
  /* Directly under the photograph, so Follow is the first thing under the face
     rather than the last thing after the reading. */
  /* Side by side, directly under the photograph. Follow is the decision;
     Back to browsing is what you do either way. Flex hands a child its longest
     word before it takes space from a sibling, so both need telling they may
     be narrower than their content. */
  .acts.meet{margin:0 0 .4rem}
  .acts.meet>*{flex:1 1 0;min-width:0;padding:.8rem .8rem;font-size:1rem}
  /* Share sits with them but does not compete: Follow is the decision on

  /* Your own page's one control. Filled, because on your own profile it is the

  .acts .edit{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
  .acts button,.acts a{flex:1;min-width:9rem;text-align:center;text-decoration:none;
    border:1px solid var(--line);background:var(--raise);color:var(--ink);
    border-radius:99px;padding:.7rem 1rem;font-size:.93rem}
  .acts .primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
  .acts .warn{color:var(--t5)}

  /* EARNED HERE. One colour of its own, and nothing else on this page uses
     it, so the number is never mistaken for a control. One rule only, above
     the sentence saying what the number is not — three hairlines in a card
     this small cut it into strips. */
  .earned{margin:1.4rem 1.15rem 0;padding:1.05rem 1.1rem;border-radius:1rem;
    background:var(--raise);border:1px solid var(--line)}

  .esecond{font-family:var(--serif);font-size:1.25rem;margin:.3rem 0 0;
    color:var(--ink-2);font-variant-numeric:tabular-nums}
  .esplit{display:flex;gap:.9rem;margin:.85rem 0 0}
  .esplit div{flex:1;min-width:0}
  .esplit dt{margin:0 0 .12rem;font-size:.72rem;color:var(--muted)}
  .esplit dd{margin:0;font-size:.95rem;font-variant-numeric:tabular-nums}
  .esaid{margin:.8rem 0 0;padding-top:.7rem;border-top:1px solid var(--line);

  .eacts{display:flex;gap:.6rem;align-items:center;flex-wrap:wrap;margin:.85rem 0 0}
  .eacts button{border:1px solid var(--line);background:var(--raise);color:var(--ink);
    font:inherit;font-size:.85rem;padding:.5rem 1rem;border-radius:99px}
  .eonly{padding:.22rem .6rem;border-radius:99px;background:#FBEBD9;color:#B8661A;
    font-size:.72rem}
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]) .ebig{color:#E89A4A}
    :root:not([data-theme="light"]) .eonly{background:#2B2014;color:#E89A4A}
  }
  :root[data-theme="dark"] .ebig{color:#E89A4A}
  :root[data-theme="dark"] .eonly{background:#2B2014;color:#E89A4A}
  .esheet{position:fixed;inset:0;background:rgba(0,0,0,.55);display:grid;
    place-items:center;padding:1rem;z-index:60}
  .ecard{background:var(--raise);border:1px solid var(--line);border-radius:1rem;

  .erow{display:flex;gap:.8rem;align-items:baseline;padding:.75rem 0;

  .ewho{flex:1;min-width:0}

  .eamt{font-variant-numeric:tabular-nums;font-size:.97rem;white-space:nowrap}
  .keybox{margin:1.6rem 1.15rem 0;padding-top:1.1rem;border-top:1px solid var(--hair)}
  .keybox h3{margin:0;font-family:var(--serif);font-weight:400;font-size:1.05rem}
  .keybox p{margin:.4rem 0 0;font-size:.85rem;line-height:1.55;color:var(--ink-2)}
  .keybox .warn{color:var(--accent)}
  .keyval{display:flex;margin:.7rem 0 0}
  .keyval code{flex:1;min-width:0;overflow-x:auto;white-space:nowrap;
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.82rem;
    background:var(--raise);border:1px solid var(--line);border-radius:.5rem;
    padding:.6rem .7rem}
  .keyrow{display:flex;gap:.5rem;margin:.7rem 0 0;flex-wrap:wrap}
  .keyrow button{border:1px solid var(--line);background:var(--raise);color:var(--ink);
    border-radius:99px;padding:.5rem 1.1rem;font-size:.9rem}
  .keyrow button.go{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
  /* The other way to be yourself on a second phone, under the key that is the
     first way. A rule between them, because they are alternatives rather than
     two halves of one thing. */
  .gtie{margin:1.1rem 0 0;padding-top:1rem;border-top:1px solid var(--hair)}

  .safety{margin:1.6rem 1.15rem 0;padding:.95rem 1.05rem;background:var(--raise);
    border:1px solid var(--line);border-left:3px solid var(--t3);border-radius:.6rem;
    font-size:.86rem;line-height:1.6;color:var(--ink-2)}

  .none{padding:4rem 1.15rem;text-align:center;color:var(--muted)}

  /* Writing to somebody. A sheet rather than a page: the profile behind it is
     what you are deciding about, and losing sight of it to write two lines is
     the wrong trade. */
  .sheet{position:fixed;inset:0;z-index:60;display:grid;place-items:end center;
    background:rgba(12,16,24,.42);padding:0}
  .sheet .card{width:min(34rem,100%);background:var(--raise);color:var(--ink);
    border-radius:18px 18px 0 0;padding:1.2rem 1.15rem calc(1.2rem + env(safe-area-inset-bottom));
    box-shadow:0 -8px 40px rgba(12,16,24,.28);max-height:88vh;overflow:auto}
  .sheet h2{margin:0 0 .35rem;font-size:1.05rem}
  .sheet .how{margin:0 0 .8rem;font-size:.86rem;line-height:1.55;color:var(--ink-2)}
  .sheet textarea{width:100%;min-height:7.5rem;resize:vertical;font:inherit;
    padding:.7rem .8rem;border-radius:12px;border:1px solid var(--line);
    background:var(--paper);color:var(--ink)}
  .sheet .row{display:flex;gap:.5rem;margin:.8rem 0 0}
  .sheet .row button{flex:1 1 auto;min-width:0}
  .sheet .said{margin:.6rem 0 0;font-size:.85rem;color:var(--muted)}
  .sheet .said.bad{color:#B4232A}
  /* MO'S OFFER TO WRITE THE FIRST ONE. Quieter than Send, deliberately: he is
     a way to start the message and not the way, and a button that shouts
     louder than the one that actually sends it would be read as the one to
     press. Its own width and margin because it lives inside two different
     boxes — the sheet and the match card — and the match card makes every
     button a full-width pill. */
  .draft{display:flex;flex-wrap:wrap;align-items:center;gap:.5rem;margin:.6rem 0 0}
  .draft button{flex:0 0 auto;width:auto;margin:0;padding:.45rem .85rem;
    font:inherit;font-size:.85rem;border-radius:99px;border:1px solid var(--line);
    background:transparent;color:var(--ink-2);cursor:pointer}
  .draft button:disabled{opacity:.55;cursor:default}
  .draft .tiny{margin:0;flex:1 1 10rem;font-size:.78rem;line-height:1.45;
    color:var(--muted)}
  /* A line saying where a thread has got to, where the button used to be. */
  .held{margin:0 1.15rem .7rem;padding:.75rem .9rem;background:var(--raise);
    border:1px solid var(--line);border-left:3px solid var(--t3);border-radius:.6rem;
    font-size:.88rem;line-height:1.55;color:var(--ink-2)}
  .stateline{margin:0;padding:.75rem .9rem;border-radius:12px;font-size:.88rem;
    background:var(--accent-soft);color:var(--ink-2)}
  .none b{display:block;font-family:var(--serif);font-weight:400;font-size:1.35rem;
    color:var(--ink);margin:0 0 .4rem}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<body>
<main>
  <!-- While it is true. An empty room reads as a dead product unless it says
       it is not open yet. -->
  <p class="invite" id="invite"></p>
  <div class="bar">
    <!-- href is the fallback for a cold open; the handler prefers the real
         history so the arrow returns where you came from — the group, the
         thread, the deck — rather than dropping everybody on Browse. -->
    <a class="back" href="/browse" id="back" aria-label="Back">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 19l-7-7 7-7"/></svg>
    </a>
    <span id="langslot" style="margin-left:auto;display:flex"></span>
  </div>
  <div id="body"></div>
</main>

<!-- THE FOUR TABS, BUT ONLY ON YOUR OWN PAGE.
     Profile is a tab in the bar now, and this is where it lands — so arriving
     here and finding no bar means the tab you just pressed deleted the bar
     you pressed it with. Somebody ELSE's profile keeps the back arrow and no
     bar, because that is a screen you were pushed into from somewhere, which
     is exactly how WeChat treats the same two cases. Drawn by the painter
     below, off q.mine. -->
<nav class="tabs" id="tabs" hidden>
  <a href="/notes">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 11.5a8.4 8.4 0 0 1-9 8.4 9 9 0 0 1-3.8-.8L3 21l1.9-5A8.4 8.4 0 0 1 12 3.1a8.4 8.4 0 0 1 9 8.4z"/></svg>
    <span id="tabnotes"></span>
  </a>
  <a href="/cards">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10.6 13.4a4 4 0 0 0 5.7 0l2.4-2.4a4 4 0 0 0-5.7-5.7l-1.4 1.4 M13.4 10.6a4 4 0 0 0-5.7 0l-2.4 2.4a4 4 0 0 0 5.7 5.7l1.4-1.4"/></svg>
    <span id="tabcards"></span>
  </a>
  <a href="/browse">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4h10a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2Z M9 15c1.5-2 4.5-2 6 0"/><circle cx="12" cy="10" r="2.2"/></svg>
    <span id="tabbrowse"></span>

    <span id="tabmelabel"></span>
  </a>
  <!-- THE FIFTH TAB, WHICH THIS PAGE NEVER HAD. Messages, Cards, Browse and
       Money all draw five; Profile drew four, so the bar lost a tab and every
       other one slid sideways each time somebody came here — "it can't decide
       which iteration it is". Hidden in the app by the server's own
       {{INAPP}}, the same rule as everywhere else: see webOnly in server.js. -->
  <a href="/dealio?in=1" id="tabmoneygo">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7h18v10H3z"/><circle cx="12" cy="12" r="2.4"/></svg>
    <span id="tabmoney"></span>
