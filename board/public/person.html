<script type="module">
import { T, when, lang, setLang, pickLang, langButton, pick } from "/i18n.js";
import { mountMo } from "/mo.js";
import { stageFor, stageName, crownMark } from "/crown.js";
import { OFF } from "/off.js";
import { NATIVE } from "/native.js";

/* DID SOMEBODY PUSH US HERE, or is this where they landed?
 *
 * The difference decides whether the back arrow is honest. Same origin and a
 * different path means a tap inside the app — a face in a group, a name in a
 * thread, a card in Browse — and there is a real screen behind this one. An
 * empty referrer is a typed address, a bookmark or a cold open of the
 * home-screen install, where going back leads out of the app or nowhere.
 *
 * Read once: it is a property of this navigation and does not change while
 * the page is open, and reading it inside a painter that runs on every
 * language switch would be four reads of the same fact. */
const pushedHere = (() => {
  let yes = false;
  try {
    const r = document.referrer;
    if (r) {
      const u = new URL(r);
      yes = u.origin === location.origin && u.pathname !== location.pathname;
    }
  } catch (e) { /* an opaque referrer is a no */ }
  return () => yes;
})();

/* The arrow returns where you came from when there is a there — the group's
   members grid, a thread, the deck — instead of dropping everybody on Browse.
   The href stays as the fallback and is what a cold open follows. */
document.addEventListener("DOMContentLoaded", () => {
  const b = document.getElementById("back");
  if (!b) return;
  b.addEventListener("click", (e) => {
    if (!pushedHere()) return;          // let the href do its job
    e.preventDefault();
    history.back();
  });
});
import { mountWalletCard } from "/wallet-card.js";
import { mountMoneyCard } from "/money-card.js";

const HANDLE = "{{HANDLE}}";
const IN_WECHAT = /micromessenger/i.test(navigator.userAgent);

/* The clipboard API where there is one and a secure context, an off-screen
 * textarea where there is not — which is most of the browsers this has to work
 * in. Same two routes as the feed. */
function copyText(text) {
  try {
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text);
      return true;
    }
  } catch (e) { /* fall through */ }
  try {
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.setAttribute("readonly", "");
    ta.style.cssText = "position:absolute;left:-9999px;top:0";
    document.body.appendChild(ta);
    ta.select();
    ta.setSelectionRange(0, text.length);   // iOS ignores select() alone
    const ok = document.execCommand("copy");
    document.body.removeChild(ta);
    return ok;
  } catch (e) { return false; }
}

const $ = (id) => document.getElementById(id);
const el = (t, c, x) => { const n = document.createElement(t); if (c) n.className = c;
  if (x !== undefined) n.textContent = x; return n; };
const fill = (n) => { while (n.firstChild) n.removeChild(n.firstChild); };
const initial = (name) => (String(name || "?").trim()[0] || "?").toLowerCase();

let device = "";
try { device = localStorage.getItem("board:device") || ""; } catch { /* private window */ }

/* WHAT GOOGLE SAID, ON THE WAY BACK IN.
 *
 * The callback is a redirect and a redirect cannot hand a page a JSON body, so
 * the outcome rides in the address. Kept as a KEY rather than a sentence: the
 * language is picked further down and resolving it here gives a Chinese reader
 * an English answer. The address is cleaned at once — a reload an hour later
 * must not say "done" a second time. */
const GSAID = (() => {
  const said = new URLSearchParams(location.search).get("signin");
  if (!said) return "";
  try {
    const u = new URL(location.href);
    u.searchParams.delete("signin");
    history.replaceState(null, "", u.pathname + (u.search || "") + u.hash);
  } catch { /* an old kernel keeps the query string and nothing else breaks */ }
  return ["ok", "joined", "unknown", "here", "other", "again", "failed"]
    .includes(said) ? "g." + said : "";
})();

let PERSON = null, POSTS = [], THREAD = { can: false, why: "" };
/* Everything true about the reader and this person, straight from the server —
   see pairState there. Never recomputed here: a page that decides for itself
   whether two people may swap contact details is a second opinion, and the
   two will disagree eventually. */
let PAIR = { mutual: false, shared: [], can: false, gave: false, given: false, card: null };
/* The layer still filling, and how many places are left in it. Sent with your
   own page and with nobody else's — see /api/person. */
let LEFT = null;
let MYCARD = null;

async function load() {
  /* Outside the try, because the mount below is outside it too — `d` is
     scoped to the block and reading it there is a ReferenceError, not a
     falsy value. */
  let hasMo = false;
  try {
    const d = await fetch("/api/person?handle=" + encodeURIComponent(HANDLE),
      { headers: device ? { "x-board-device": device } : {} }).then((r) => r.json());
    hasMo = Boolean(d.butler);
    PERSON = d.person; POSTS = d.posts || [];
    LEFT = d.layerNow || null;
    THREAD = (d.person && d.person.thread) || { can: false, why: "" };
    await loadCard();
    if (d.person) tellSeen(d.person.id, d.person.mine);
    PAIR = (d.person && d.person.pair)
      || { mutual: false, shared: [], can: false, gave: false, given: false, card: null };
  } catch { PERSON = null; }
  paint();

  /* HIM, HERE TOO — and this was the page he was missing from.
   *
   * He is on Browse, on Messages and at the door, and the one screen a member
   * spends longest on is their own page: the photograph they have not added,
   * the line they have not written, the sentence that is quietly matching
   * nobody. That is the screen where "why is it quiet" has an answer they can
   * act on in a minute, and there was nobody standing on it.
   *
   * TWO SCREENS IN ONE FILE. Their own page and somebody else's are the same
   * HTML and are not the same room: on theirs he is told what is missing from
   * it, and on a stranger's he is told nothing about that person at all —
   * they are looking straight at the card and can read it. See screenFacts
   * in server.js.
   *
   * No onKeep: there is nothing on this screen for him to propose into. The
   * sentence is changed through Edit your page, like everything else here.
   */
  mountMo({
    /* THE FLOATING MO IS OFF, and this line is the whole of the switch.
    *
    * There are two of him now and only one of them is load-bearing. He is a
    * member of every room — silent, woken by the tripwire, answered when
    * somebody starts a line with his name — and that is the one people met
    * and understood. A second Mo as a button in the corner of three other
    * screens is the same character in two places with two different jobs,
    * which is how a doorman turns into a widget.
    *
    * Nothing else is removed: the conversation is still mounted, mo.js is
    * untouched, and the waiting room still opens with him on purpose. Put
    * `on:` back to the expression beside it to bring the button back.
    */
    on: false,   // hasMo && Boolean(PERSON)
    where: PERSON && PERSON.mine ? "profile" : "person",
    first: () => [{ from: "you", text: T("but.hookIn") }],
  });
}


/* ---- the match, and the card ------------------------------------------------
 *
 * WHAT HAS TO BE TRUE BEFORE THIS APPEARS: you follow each other, and you
 * ticked boxes that answer one another. Both halves are checked on the server
 * (pairState) and this block only draws what it was told. Following alone
 * draws nothing — that is most of the board and it is meant to be quiet.
 *
 * THE ORDER ON THIS SCREEN IS THE ARGUMENT. Why you are seeing it, then what
 * pressing the button actually does to you, then the button. A warning under a
 * button is a warning nobody read.
 */
function sharedLine(pair) {
  if (!pair) return "";
  return pair.mine === pair.theirs
    ? T("room.both", { what: T("room." + pair.mine + ".s") })
    : T("room.bothPair", { mine: T("room." + pair.mine + ".s"),
                           theirs: T("room." + pair.theirs + ".s") });
}

function matchBox(q) {
  const wrap = el("div", "match");
  const first = PAIR.shared[0];
  wrap.append(el("h3", null, T("match.head", { who: q.handle })));
  wrap.append(el("p", "why", first.mine === first.theirs
    ? T("match.becauseOne", { what: T("room." + first.mine + ".s") })
    : T("match.becausePair", { mine: T("room." + first.mine + ".s"),
                               theirs: T("room." + first.theirs + ".s") })));

  /* THE CHAT, BEFORE THE CARD.
   *
   * This is the order that makes the whole match safe. A match used to lead
   * straight to "give them your WeChat id", which asks somebody to hand over
   * the way they are reached before they have exchanged a sentence with the
   * person. Now the first thing a match opens is a room that only the two of
   * them can see, on this board, where every message is reportable and either
   * of them can walk out with one press.
   *
   * The card is still there, underneath, for the pair who decide they want to
   * carry on somewhere else. It is a second decision now instead of the only
   * one.
   */
  if (THREAD.open) {
    const chat = el("div", "chat");
    chat.append(el("p", "why", T("match.chatWhy", { who: q.handle })));
    const go = el("button", null, T("match.chatGo", { who: q.handle }));
    go.type = "button";
    go.addEventListener("click", () => {
      go.remove();
      const ta = document.createElement("textarea");
      ta.maxLength = 600;
      ta.rows = 3;
      ta.placeholder = T("note.placeholder");
      const send = el("button", null, T("note.send"));
      send.type = "button";
      const out = el("p", "said");
      const draft = draftRow(ta, q);
      send.addEventListener("click", async () => {
        const text = ta.value.trim();
        if (!text) { ta.focus(); return; }
        send.disabled = true;
        out.textContent = T("note.sending");
        try {
          const r = await fetch("/api/note", {
            method: "POST", headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ device, who: q.id, text }),
          });
          if (!r.ok) throw new Error("no");
          ta.remove(); send.remove(); draft.remove();
          out.textContent = T("match.chatSent");
        } catch { out.textContent = T("act.again"); send.disabled = false; }
      });
      chat.append(ta, draft, send, out);
      ta.focus();
    });
    chat.append(go);
    wrap.append(chat);
  }

  /* THEIR CARD, when they have handed it over. Above your own decision on
     purpose: somebody who has already been given something should see it
     before being asked for anything. */
  if (PAIR.card) {
    wrap.append(el("span", "k", T("card.theirs", { who: q.handle })));
    /* THE CODE FIRST, WHERE THERE IS ONE. An id has to be typed into WeChat's
       search and plenty of accounts cannot be found that way at all; a code is
       saved to the photo roll and read back through Scan · from album, which
       is how people here add each other. */
    if (PAIR.card.qr) {
      const img = Object.assign(document.createElement("img"),
        { className: "qr", src: "/api/public-media?id=" + encodeURIComponent(PAIR.card.qr),
          alt: "", loading: "lazy" });
      wrap.append(img);
      wrap.append(el("p", "tiny", T("card.qrHow")));
    }
    if (PAIR.card.wechat) wrap.append(el("p", "v", PAIR.card.wechat));
    if (PAIR.card.line) {
      wrap.append(el("span", "k", T("card.theyAdded")));
      wrap.append(el("p", "line", PAIR.card.line));
    }
    wrap.append(el("p", "tiny", T("card.offPlatform")));
  }

  const say = el("p", "said");
  say.hidden = true;

  const send = async (on) => {
    const d = await fetch("/api/card/give", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ device, who: q.id, on }),
    }).then((r) => r.json()).catch(() => ({ error: "net" }));
    if (d.error === "nocard") { drawCardForm(wrap, say, q); return; }
    if (d.error) { say.hidden = false; say.textContent = T("act.again"); return; }
    await load();
  };

  if (!PAIR.gave) {
    // The warning, then the two buttons. "Just keep following" is a real
    // option and it is styled as one: a screen with one button on it is not
    // offering a choice, it is telling somebody what to do.
    wrap.append(el("p", "warn", T("card.warn", { who: q.handle })));
    const go = el("button", null, T("card.give", { who: q.handle }));
    go.type = "button";
    go.addEventListener("click", () => { go.disabled = true; send(true); });
    const no = el("button", "q", T("card.keep"));
    no.type = "button";
    no.addEventListener("click", () => { wrap.remove(); });
    wrap.append(go, no);
  } else {
    if (!PAIR.given) wrap.append(el("p", "said", T("card.waiting", { who: q.handle })));
    const back = el("button", "q", T("card.takeBack"));
    back.type = "button";
    back.addEventListener("click", () => { back.disabled = true; send(false); });
    wrap.append(back);
    wrap.append(el("p", "tiny", T("card.takeBackWhy", { who: q.handle })));
  }
  wrap.append(say);
  return wrap;
}

/* The card itself, asked for at the moment it is needed rather than as a field
   on a form nobody has a reason to fill in yet. */
function drawCardForm(wrap, say, q) {
  wrap.textContent = "";
  wrap.append(el("h3", null, T("card.title")));
  wrap.append(el("p", "why", T("card.what")));
  const wx = el("input");
  wx.placeholder = T("card.wechat");
  wx.maxLength = 60;
  wx.autocapitalize = "off";
  wx.spellcheck = false;
  const ln = el("input");
  ln.placeholder = T("card.line");
  ln.maxLength = 200;
  if (MYCARD) { wx.value = MYCARD.wechat || ""; ln.value = MYCARD.line || ""; }
  wrap.append(wx, ln);

  /* THEIR OWN CODE, UPLOADED BY THEM. This server has no way to make somebody's
     WeChat code and must never appear to: what is stored is the picture they
     took of their own, and it goes out only to the people they hand a card to.
     Not held for review, unlike a face — a face goes on a public browser and
     cannot be taken back, and a code is shown to nobody but somebody they have
     already decided to give their WeChat id to. */
  const qrRow = el("div", "qrrow");
  const pick = el("input");
  pick.type = "file";
  pick.accept = "image/*";
  pick.className = "qrpick";
  const qrSaid = el("p", "tiny", "");
  const shot = Object.assign(document.createElement("img"), { className: "qr", alt: "" });
  shot.hidden = true;
  if (MYCARD && MYCARD.qr) {
    shot.src = "/api/public-media?id=" + encodeURIComponent(MYCARD.qr);
    shot.hidden = false;
  }
  pick.addEventListener("change", async () => {
    const f = pick.files && pick.files[0];
    if (!f) return;
    qrSaid.textContent = T("card.qrSending");
    try {
      const buf = await f.arrayBuffer();
      let bin = "";
      const bytes = new Uint8Array(buf);
      for (let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
      const r = await fetch("/api/card/qr", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ device, qr: btoa(bin), qrType: f.type }),
      });
      const d = await r.json().catch(() => ({}));
      if (!r.ok || !d.qr) throw new Error(d.error || "no");
      shot.src = "/api/public-media?id=" + encodeURIComponent(d.qr);
      shot.hidden = false;
      qrSaid.textContent = T("card.qrSaved");
      await loadCard();
    } catch (err) {
      qrSaid.textContent = T(String(err.message) === "tooBig" ? "card.qrBig" : "card.qrFailed");
    }
  });
  wrap.append(el("span", "k", T("card.qrLab")));
  wrap.append(el("p", "why", T("card.qrWhy")));
  qrRow.append(shot, pick, qrSaid);
  wrap.append(qrRow);
  const save = el("button", null, T("card.save"));
  save.type = "button";
  save.addEventListener("click", async () => {
    if (!wx.value.trim() && !ln.value.trim() && !(MYCARD && MYCARD.qr)) return;
    save.disabled = true;
    await fetch("/api/card", {
      method: "PUT", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ device, wechat: wx.value, line: ln.value }),
    }).catch(() => {});
    // Saving a card is not giving it to anybody. They still have to press the
    // other button, which is the fourth of the four decisions.
    await loadCard();
    await load();
  });
  wrap.append(save);
  wrap.append(el("p", "tiny", T("card.warn", { who: q.handle })));
}

/* ---- the one bit this browser volunteers -------------------------------------
 *
 * The reader's own device is the only place that knows which pages it has
 * opened and when. It keeps that list here, on the phone, exactly the way the
 * block list is kept — and reports two things to the server, both of them a
 * single bit with no identity attached:
 *
 *   first    — the first time this device has opened this page TODAY
 *   regular  — this device has now opened this page on three separate days,
 *              said at most once a week
 *
 * That is what lets the owner's page count PEOPLE rather than page loads
 * without a reading history existing anywhere on the server. The list below
 * never leaves this phone, is capped, and goes when browsing data is cleared.
 *
 * Three days is what makes somebody a regular. Two is a coincidence — a person
 * who opened a page twice in one week is somebody who lost the tab.
 */
const SEENKEY = "board:seen";
const REGKEY = "board:seenreg";
const REGULAR_AT = 3;

function tellSeen(id, mine) {
  if (!id || mine || !device) return;
  const today = new Date();
  const day = today.getFullYear() + "-" + String(today.getMonth() + 1).padStart(2, "0")
    + "-" + String(today.getDate()).padStart(2, "0");
  let all = {};
  try { all = JSON.parse(localStorage.getItem(SEENKEY) || "{}") || {}; } catch { all = {}; }
  const days = Array.isArray(all[id]) ? all[id] : [];
  const first = !days.includes(day);
  // Their last few visits and no more. This is a diary of somebody's reading
  // and it is kept only as long as it has to be to answer "is this a regular".
  const next = first ? [...days, day].slice(-8) : days;

  /* Once a week, and only after three separate days. Reported at most once per
     week per page so the server's weekly bucket counts one person once — that
     is the whole reason it can say "3 people" rather than "31 page loads". */
  const week = weekOf(today);
  let regs = {};
  try { regs = JSON.parse(localStorage.getItem(REGKEY) || "{}") || {}; } catch { regs = {}; }
  const regular = next.length >= REGULAR_AT && regs[id] !== week;

  if (!first && !regular) return;
  try {
    all[id] = next;
    localStorage.setItem(SEENKEY, JSON.stringify(all));
    if (regular) { regs[id] = week; localStorage.setItem(REGKEY, JSON.stringify(regs)); }
  } catch { /* a private window counts every visit as a first one, which is fine */ }

  fetch("/api/seen", {
    method: "POST", headers: { "Content-Type": "application/json" },
    keepalive: true,
    body: JSON.stringify({ device, who: id, first, regular }),
  }).catch(() => { /* a counter is never worth a message on somebody's screen */ });
}

/** Monday-based week, matching the server's bucket. */
function weekOf(d) {
  const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  const day = t.getUTCDay() || 7;
  t.setUTCDate(t.getUTCDate() + 4 - day);
  const jan1 = new Date(Date.UTC(t.getUTCFullYear(), 0, 1));
  const n = Math.ceil(((t - jan1) / 86400000 + 1) / 7);
  return t.getUTCFullYear() + "-W" + String(n).padStart(2, "0");
}

async function loadCard() {
  try {
    const d = await fetch("/api/card", { headers: device ? { "x-board-device": device } : {} })
      .then((r) => r.json());
    MYCARD = d.card || null;
  } catch { MYCARD = null; }
}

/* Drawn into the page after it, because it is one fetch behind: nothing else
   on this screen should wait on a number, and a page that renders in two
   stages beats one that renders late. */
async function drawEarned(box) {
  const slot = el("section", "earned");
  slot.hidden = true;
  box.append(slot);
  let d = null;
  try {
    const r = await fetch("/api/earned", {
      cache: "no-store",
      headers: device ? { "x-board-device": device } : {},
    });
    d = r.ok ? await r.json() : null;
  } catch { /* a page that cannot reach the board shows no card, not an error */ }
  if (!d || !(d.totals || []).length) { slot.remove(); return; }

  const top = el("p", "elab", T("earn.lab"));
  if (d.rows.length) top.append(el("span", null, " \u00b7 " + T("earn.n", { n: d.rows.length })));
  slot.append(top);

  /* One total per currency, never added together: ¥30,000 and A$2,000 are two
     numbers, and one of them needs a rate this board would have to invent. */
  d.totals.forEach((t, i) => {
    slot.append(el("p", i ? "esecond" : "ebig", (i ? "+ " : "") + t.all));
  });

  /* Only when both kinds are there. "All of it was seen" on a card where all
     of it was seen is a line that says nothing. */
  const seen = d.totals.filter((t) => t.seen), said = d.totals.filter((t) => t.said);
  if (seen.length && said.length) {
    const sp = el("div", "esplit");
    const cell = (label, list, pick) => {
      const c = el("div");
      c.append(el("dt", null, T(label)));
      c.append(el("dd", null, list.map(pick).join(" \u00b7 ")));
      return c;
    };
    sp.append(cell("earn.inApp", seen, (t) => t.seen),
              cell("earn.other", said, (t) => t.said));
    slot.append(sp);
  }

  slot.append(el("p", "esaid", T("earn.said")));

  const acts = el("div", "eacts");
  const go = el("button", "", T("earn.see"));
  go.type = "button";
  go.addEventListener("click", () => earnedList(d));
  acts.append(go, el("span", "eonly", T("earn.only")));
  slot.append(acts);
  slot.hidden = false;
}

/** Every settled row, newest first, each one a tap from the room it was in. */
function earnedList(d) {
  const day = (at) => {
    try {
      return new Date(at).toLocaleDateString(lang() === "zh" ? "zh-CN" : undefined,
        { day: "numeric", month: "short" });
    } catch { return ""; }
  };
  const back = el("div", "esheet");
  const card = el("div", "ecard");
  card.append(el("p", "elab", T("earn.lab")));
  for (const r of d.rows) {
    const line = el("a", "erow");
    line.href = "/groups?g=" + encodeURIComponent(r.group);
    const who = el("div", "ewho");
    who.append(el("b", null, r.title || r.label || T("earn.lab")));
    who.append(el("small", null, [r.from, r.label, day(r.at)].filter(Boolean).join(" \u00b7 ")));
    line.append(who, el("span", "eamt", r.amount));
    card.append(line);
  }
  if ((d.waiting || []).length) {
    card.append(el("p", "elab", T("earn.waiting")));
    for (const r of d.waiting) {
      const line = el("div", "erow");
      const who = el("div", "ewho");
      who.append(el("b", null, r.title || r.label));
      who.append(el("small", null, [r.from, r.due].filter(Boolean).join(" \u00b7 ")));
      line.append(who, el("span", "eamt", r.amount));
      card.append(line);
    }
    card.append(el("p", "esaid", T("earn.notYet")));
  }
  const acts = el("div", "eacts");
  const shut = el("button", "", T("pay.close"));
  shut.type = "button";
  shut.addEventListener("click", () => back.remove());
  acts.append(shut);
  card.append(acts);
  back.append(card);
  back.addEventListener("click", (e) => { if (e.target === back) back.remove(); });
  document.body.append(back);
}

function paint() {
  $("invite").textContent = T("site.invite");
  const box = $("body");
  fill(box);
  if (!PERSON) {
    const n = el("div", "none");
    n.append(el("b", null, T("bud.noProfile")),
      el("p", null, T("bud.noProfileBody", { who: HANDLE })));
    box.append(n);
    return;
  }
  const q = PERSON;

  /* One card, the size it is on the home screen. The cover is gone with it:
     it was a decorative band above a small circle, and both existed to make
     room for each other. */
  const shot = el("div", "shot");
  if (q.photo) {
    const img = Object.assign(document.createElement("img"),
      { src: "/api/public-media?id=" + encodeURIComponent(q.photo), alt: "", loading: "eager" });
    img.addEventListener("error", () => { img.remove(); shot.prepend(el("div", "noshot", initial(q.handle))); });
    shot.append(img);
  } else {
    shot.append(el("div", "noshot", initial(q.handle)));
  }
  const scrim = el("div", "scrim");
  // The name, and the four letters beside it. It was a row in the fact list,
  // which is where you put a thing somebody has to go looking for.
  const line = el("div", "nameline");
  line.append(el("h1", null, q.handle));
  if (q.type) line.append(el("b", "type", q.type));
  // The crowns are off — see off.js.
  const rank = OFF.crowns ? 0 : stageFor(q.levelBand);
  if (rank) {
    const worn = el("b", "rank");
    worn.append(crownMark(rank, "1.05rem"));
    worn.append(el("span", null, stageName(rank)));
    line.append(worn);
  }
  scrim.append(line);
  const where = [q.campus, q.here].filter(Boolean).join(" · ");
  if (where) scrim.append(el("p", "where", where));
  shot.append(scrim);
  box.append(shot);

  /* THE OTHER PICTURES, UNDER THE CARD.
   *
   * A performer is cast off several looks and the board was asking them to
   * choose one. Under the face rather than instead of it: the card is who they
   * are and stays the thing Browse shows, and this is the rest of the answer
   * for somebody who has already stopped on them.
   *
   * A held one is drawn for its owner with a mark on it, because "waiting to
   * be looked at" and "the upload failed" look identical otherwise and only
   * one of them is worth doing anything about. Nobody else is sent them at
   * all — see shownPerson. */
  const shots = Array.isArray(q.shots) ? q.shots : [];
  if (shots.length) {
    const strip = el("div", "looks");
    for (const sh of shots) {
      const cell = el("div", "lookcell" + (sh.state && sh.state !== "published" ? " waiting" : ""));
      const im = Object.assign(document.createElement("img"), {
        src: "/api/public-media?id=" + encodeURIComponent(sh.id), alt: "", loading: "lazy",
      });
      im.addEventListener("error", () => cell.remove());
      cell.append(im);
      if (sh.state && sh.state !== "published") cell.append(el("span", "wait", T("shot.waiting")));
      strip.append(cell);
    }
    box.append(strip);
  }

  /* Your own page, while your photograph is still in the queue.
   *
   * You can see your face here; nobody else can, and there is nothing on the
   * page that says so — which turns a shared link into a mystery. Somebody
   * sends their page to a friend, the friend opens it and sees a letter, and
   * the obvious conclusion is that the upload failed. It did not; it is
   * waiting for a person, and this is the line that says which. */
  if (q.mine && q.photoPending) {
    box.append(el("p", "held", T("me.photoHeldShare")));
  }

  /* The two things somebody who just opened a WeChat link is here to do, and
     they go above everything they would have to read first. The row is built
     empty and filled further down, where the follow state and the note rules
     are already worked out — putting it in the page here is what fixes the
     order, not moving the logic. */
  const meet = el("div", "acts meet");
  box.append(meet);

  const head = el("div", "head");

  /* THE SENTENCE, AND IT IS THE ONE THING ON THIS PAGE THAT DECIDES ANYTHING.
   *
   * "I am a ___ looking for a ___" is the whole of how this board works — it
   * is what puts two people in front of each other — and it was the one fact
   * a profile did not show. The room chips further down say which doors
   * somebody is standing at; they do not say what that person is, and a reader
   * deciding whether to follow was being asked to infer it from a bio.
   *
   * ABOVE THEIR OWN WORDS, NOT INSTEAD OF THEM. `goal` is what they wrote and
   * it is better than anything generated; this is the line that makes it make
   * sense. Same shape as the card on a door room and on a waiting row, so the
   * sentence reads identically everywhere it appears.
   *
   * WHOLE OR NOT AT ALL. Half of it — "I am a producer looking for" — is worse
   * than no line, and a row saved before both halves existed is a real row.
   */
  const pair = (Array.isArray(q.say) ? q.say : [])[0];
  if (pair && pair.me && pair.want) {
    const says = el("p", "says");
    says.append(
      el("em", null, T("say.iam")), el("b", null, T("role.a." + pair.me)),
      el("em", null, T("say.lookingFor")), el("b", null, T("role.a." + pair.want)));
    head.append(says);
  }

  /* IN THE LANGUAGE THIS READER IS READING IN. The same choice the deck makes
     — see personCard in index.html — between two strings the row already
     carries, rendered once when the line was written. The original when there
     is no rendering yet, which is always right and sometimes not theirs. */
  if (q.goal) {
    const bio = el("p", "goal clamp", pick(q.goal, q.goalAlt, q.goalAlt2, q.goalLang));
    head.append(bio);
    /* MORE ONLY WHEN THERE IS MORE. Measured once it is on the page; a More
       under a bio that already fits is a button that does nothing. */
    requestAnimationFrame(() => {
      if (bio.scrollHeight <= bio.clientHeight + 2) return;
      const more = el("button", "biomore", T("me.bioMore"));
      more.type = "button";
      more.addEventListener("click", () => { bio.classList.remove("clamp"); more.remove(); });
      bio.after(more);
    });
  }

  /* WHAT IS MISSING, ON YOUR OWN PAGE, AS THE THING THAT FIXES IT.
   *
   * There has always been an Edit button up there and it was still reported as
   * "I cannot see where any of this goes" — twice, by two of the first three
   * members. A button named after the verb tells nobody what is behind it, and
   * a page with a bio-shaped hole in it does not look like a page with a
   * missing bio. It looks finished.
   *
   * So the holes say what they are and open the form. Only your own page, only
   * the ones actually empty, and gone the moment they are filled — a prompt
   * that stays after it has been answered is furniture. */
  if (q.mine) {
    const gaps = [
      [!q.goal, "me.addBio"],
      [!q.li, "me.addLi"],
      [!q.photo && !q.photoPending, "me.gapPhoto"],
    ].filter((g) => g[0]);
    for (const [, key] of gaps) {
      const a2 = el("a", "gap", T(key));
      a2.href = "/feed?edit=1";
      head.append(a2);
    }
  }

  const facts = el("dl", "facts");
  /* ONE GLYPH PER KIND OF FACT, drawn rather than fetched — the board carries
     no icon font and one more request for seven small pictures is not worth a
     page load. Stroked, 1.05rem, the same weight as the tab bar's. */
  const GLYPH = {
    level:  ["m12 3 9 4.6-9 4.6-9-4.6z", "m3 12.2 9 4.6 9-4.6", "m3 16.6 9 4.6 9-4.6"],
    trade:  ["M4 8h13", "m14 5 3 3-3 3", "M20 16H7", "m10 19-3-3 3-3"],
    speaks: ["M4 5h16v11H9l-5 4z"],
    rank:   ["M12 3a3 3 0 0 1 3 3v5a3 3 0 0 1-6 0V6a3 3 0 0 1 3-3z",
             "M5.5 11a6.5 6.5 0 0 0 13 0", "M12 17.5V21"],
    layer:  ["M4 6h16v15H4z", "M4 10h16", "M8 3v4", "M16 3v4"],
    ig:     ["M4 8a4 4 0 0 1 4-4h8a4 4 0 0 1 4 4v8a4 4 0 0 1-4 4H8a4 4 0 0 1-4-4z",
             "M12 8.6a3.4 3.4 0 1 0 0 6.8 3.4 3.4 0 0 0 0-6.8z", "M17.2 7.2h.01"],
    li:     ["M4 6h16v14H4z", "M8 10.5V17", "M8 8.2h.01", "M12 17v-4a2.2 2.2 0 0 1 4.4 0v4"],
  };
  const fact = (label, value, glyph) => {
    const d = el("div", "fact");
    const fk = el("span", "fk");
    const paths = GLYPH[glyph];
    if (paths) {
      const ns = "http://www.w3.org/2000/svg";
      const svg = document.createElementNS(ns, "svg");
      svg.setAttribute("viewBox", "0 0 24 24");
      svg.setAttribute("class", "ico");
      svg.setAttribute("aria-hidden", "true");
      for (const dd of paths) {
        const path = document.createElementNS(ns, "path");
        path.setAttribute("d", dd);
        svg.appendChild(path);
      }
      fk.append(svg);
    }
    fk.append(el("dt", null, label));
    d.append(fk);
    const dd = el("dd");
    if (typeof value === "string") dd.textContent = value; else dd.append(value);
    d.append(dd); facts.append(d);
  };
  if (q.level) fact(T("bud.level"), q.level, "level");
  if (q.trade) fact(T("bud.trades"), q.trade, "trade");
  if (q.speaks && q.speaks.length) fact(T("bud.speaks"), q.speaks.join(" · "), "speaks");
  /* Somewhere to be found that is not this board.
   *
   * A link and not just text, but the handle is the visible part on purpose:
   * instagram.com does not open in the mainland without a VPN, and this app's
   * whole pitch is that it needs neither. So the useful thing here is a name
   * that can be read, held up, or long-pressed and copied into the app where
   * it does work — the link is a convenience for everybody else. */
  if (q.ig) {
    const a = el("a", "out");
    a.href = "https://instagram.com/" + encodeURIComponent(q.ig);
    a.target = "_blank";
    a.rel = "noopener nofollow";
    a.textContent = "@" + q.ig;
    fact(T("me.igName"), a, "ig");
  }

  /* LINKEDIN, and the reverse of the Instagram note above. That one shows the
   * handle because instagram.com does not open in the mainland; this one shows
   * the person's own vanity slug for a different reason — it is usually their
   * name, and a row that reads "tom-shanahan" tells you who you are about to
   * open before you open it. LinkedIn is also unreachable from the mainland
   * without a VPN, so the readable half matters here too. */
  /* WHERE THEY STAND, on somebody else's page. A title rather than a number
     on purpose — see rankOf in server.js. It is here because it answers the
     question a profile is actually being read to answer: is this somebody
     who does things with people, or somebody who signed up. */
  /* YOUR OWN PAGE SAYS "YOU", and it was saying "Tom" to Tom. The string for
     it already existed — the deck on Browse has used it all along — and this
     one call site simply never asked which page it was on. */
  if (q.rank && q.rank !== "guest") {
    fact(q.mine ? T("rank.head") : T("rank.headThem", { who: q.handle }),
      T("rank." + q.rank), "rank");
  }

  /* WHICH LAYER THEY ARE IN, which is the one fact on this page nobody can
     earn back later. A name and never the number underneath it: the server
     drops `seq` on the way out, because "the 47th member" invites a
     comparison between two people the scheme treats as identical, and it is
     not a thing anybody can repeat to a friend. See store.LAYERS. */
  if (q.layer) {
    const v = el("span");
    v.append(document.createTextNode(T("layer." + q.layer.key)));
    /* AND HOW MANY PLACES ARE LEFT, on your own page only. It is the one
       figure in the scheme that is true without anybody maintaining it, and
       the only one that makes an edge mean anything — a layer nobody can see
       filling is a layer nobody hurries for. */
    const now = q.mine && LEFT;
    if (now) v.append(el("small", null, now.left === 1
      ? T("layer.last") : T("layer.left", { n: now.left })));
    fact(T("layer.head"), v, "layer");
  }

  if (q.li) {
    const a = el("a", "out");
    a.href = "https://www.linkedin.com/in/" + encodeURIComponent(q.li);
    a.target = "_blank";
    a.rel = "noopener nofollow";
    a.textContent = q.li;
    fact(T("me.liName"), a, "li");
  }
  // The free-days week is out for V1 everywhere it appeared. Two people who
  // want to study together arrange it between themselves, and a timetable
  // nobody goes back to edit is worse than no timetable.
  if (facts.children.length) head.append(facts);
  box.append(head);

  /* MONEY, on your own page only — asking, sending, what is owed and the
     wallet in one card. See money-card.js. The app keeps the old wallet card:
     /dealio is web-only, so every button on the new one would bounce there. */
  /* FURTHER DOWN, AND QUIET. It was moved to the very top when it was a dark
     block of totals — 1074px down was too far for the question this page gets
     opened to answer. It is a folding Wallet row now, the shape of the rows
     around it (see money-card.js), and a row that quiet at the top of the
     page would be shouting from the wrong place. Closed it says what is owed
     and nothing else, so being further down costs a glance rather than a
     scroll. */
  if (q.mine) {
    if (NATIVE) mountWalletCard(box, device);
    else {
      const slot = el("div");
      box.append(slot);
      mountMoneyCard(slot, { device, T });
    }
  }

  /* Directly under the line that explains it, and above everything a stranger
     would read first. It was at the foot of the page under Report, which is
     the one place on this screen nobody scrolls to when they came here for
     this. Only when the server said so — see matchBox. */
  if (!q.mine && PAIR.can) box.append(matchBox(q));

  // What they have actually put on the feed. For a stranger deciding whether
  // to say hello, this is worth more than anything in the profile itself.
  const theirs = el("div", "theirs");
  theirs.append(el("h3", null, T("bud.theirPosts")));
  if (POSTS.length) {
    for (const p of POSTS) theirs.append(el("p", null, p.note || "—"));
  } else {
    theirs.append(el("p", "no", T("bud.nothingYet")));
  }
  box.append(theirs);

  // How many people follow them, under the name. A count and never a list:
  // who follows whom among foreign students is a social graph, and this is
  // not the product that publishes one.
  /* WHO BROUGHT THEM, under the name.
   *
   * The one line on this page that is about somebody else, and it is here on
   * purpose: it is what makes an invitation a vouch rather than a password.
   * Absent for anybody who arrived before the door existed, or on a code the
   * board itself made — see broughtBy on the server. */
  if (q.brought) head.append(el("p", "brought", T("inv.brought", { who: q.brought })));

  /* AND THE SAME ON THE LINE UNDER IT. "12 following them", read by the them
     in question, is the page talking about its owner as though they were not
     holding it. */
  if (q.followers) {
    const one = q.followers === 1;
    const words = q.mine
      ? T(one ? "bud.followersMine1" : "bud.followersMine", { n: q.followers })
      : T(one ? "bud.followers1" : "bud.followers", { n: q.followers });
    /* ON YOUR OWN PAGE IT IS A DOOR, because there is a room behind it.
     *
     * The list of who follows you has been drawn since the tray existed —
     * face, name, when — inside the bell on the home screen. This line is the
     * only place in the app that says the number, and it was a grey sentence
     * with nothing to press, on a different page from the list. "Why can't I
     * see who is following me": you could, and there was no way in.
     *
     * Only on your own page. Whose followers somebody else has is their
     * business and there is no such list to open. */
    if (q.mine) {
      const a = el("a", "count go", words);
      a.href = "/browse#followers";
      head.append(a);
    } else {
      head.append(el("p", "count", words));
    }
  }

  /* ---- what they are looking for -------------------------------------------
   *
   * Their boxes, then one line about the two of you. Both halves are already
   * public — their rooms are on their page and yours are on yours — so saying
   * what you have in common tells nobody anything they could not work out. It
   * is here so that nobody has to.
   */
  /* THE CHIPS NEEDED INTRODUCING THE MOMENT THE SENTENCE WENT IN ABOVE THEM.
   *
   * A room here is named as a first-person line — "A model or creative looking
   * for an agent" — which was fine while it was the only sentence-shaped thing
   * on the page. It is not now: the profile opens with "I am a Producer looking
   * for an Agent", and a bare pill under it saying something different reads as
   * a second, contradicting claim about the same person rather than as the
   * group they are standing in.
   *
   * Two words above them fixes it. The chips are unchanged and still say what
   * they always said; what changed is that the page now says what they are. */
  if (Array.isArray(q.rooms) && q.rooms.length) {
    head.append(el("p", "chipcap", T("bud.hereFor")));
    const chips = el("div", "chips");
    for (const r of q.rooms) chips.append(el("span", "chip", T("room." + r)));
    head.append(chips);
  }
  if (!q.mine && Array.isArray(q.rooms) && q.rooms.length) {
    const line = el("p", "shared" + (PAIR.shared.length ? "" : " no"));
    line.textContent = PAIR.shared.length ? sharedLine(PAIR.shared[0]) : T("room.nothing");
    head.append(line);
  }

  const acts = el("div", "acts");
  if (!q.mine) {
    const fol = el("button", q.following ? "" : "primary",
      T(q.following ? "bud.following" : "bud.follow"));
    fol.type = "button";
    fol.addEventListener("click", async () => {
      const want = !q.following;
      fol.disabled = true;
      try {
        const d = await fetch("/api/follow", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ who: q.id, on: want, device }),
        }).then((r) => r.json());
        if (d && d.ok) {
          q.following = d.following; q.followers = d.count;
          // See the note beside the same line on the feed: the grade needs the
          // day, and the day stays on this phone.
          if (d.following) {
            try {
              const t = new Date();
              localStorage.setItem("board:didfollow", t.getFullYear() + "-"
                + String(t.getMonth() + 1).padStart(2, "0") + "-"
                + String(t.getDate()).padStart(2, "0"));
            } catch { /* private window */ }
          }
          paint(); return;
        }
      } catch { /* fall through */ }
      fol.disabled = false;
      fol.textContent = T("act.again");
    });
    meet.append(fol);

    /* SAYING HELLO, and it is back. It was held back with Messages, for a
     * reason that was true then: the inbox it landed in had no tab on it, so
     * a hello arrived somewhere its recipient could not open. The tab is on
     * now — and the inbox can be written FROM as well as replied to, which
     * was the other half of what was missing. */
    if (THREAD.can) {
      const hi = el("button", "primary", T(THREAD.answering ? "note.answerIt" : "note.say"));
      hi.type = "button";
      hi.addEventListener("click", () => sheet(q));
      meet.append(hi);
    }
  }

  /* Share, on every profile — including your own, which is the whole point:
   * this is the page you send a friend so they can find you. It is the address
   * WeChat renders with a face and a name on it.
   *
   * The deck has one of these per card; this is the same thing at the place
   * somebody arrives when they follow one. */
  const sh = el("button", "share", T("act.share"));
  sh.type = "button";
  sh.addEventListener("click", () => {
    const url = location.origin + "/p/" + encodeURIComponent((q.handle || "").toLowerCase());
    const say = (w, hold) => {
      sh.textContent = w;
      setTimeout(() => { sh.textContent = T("act.share"); }, hold || 2200);
    };
    // Inside WeChat a page may not open a share sheet: the ⋯ menu is the only
    // way, so the honest version is the clipboard and where the real control is.
    if (IN_WECHAT) { say(T(copyText(url) ? "act.wxCopied" : "act.wxUseMenu"), 3600); return; }
    if (navigator.share) {
      navigator.share({ title: q.handle || T("board.someone"),
                        text: (q.goal || "").slice(0, 120), url })
        .catch(() => { /* dismissed is not a failure */ });
      return;
    }
    say(T(copyText(url) ? "act.copied" : "act.copyFail"));
  });
  meet.append(sh);

  /* EDIT, ON YOUR OWN PAGE, AND IT WAS NOT ANYWHERE.
   *
   * The form that makes a page was reachable from exactly two places: the
   * Professor's "set up your page" card, which stops being offered the moment
   * you have one, and your own card at the far end of the Browse deck. So
   * after somebody finished setting up there was no way back in: no changing
   * the photograph, no adding a line about themselves, no turning Browse on.
   * Reported from the outside as "there is no way to edit", which is exactly
   * what it was.
   *
   * It lives on the feed, where the sheet is — so this is a link that says
   * open it, and the feed opens it on arrival. */
  if (q.mine) {
    /* Named for what it opens, not for the verb. "Edit" is what a developer
       calls it; the person reading it wants to know whether their LinkedIn
       goes in there. */
    const ed = el("a", "edit", T("me.editWhat"));
    ed.href = "/feed?edit=1";
    meet.append(ed);
  }

  /* AND THE BAR, because this is where the Profile tab lands. A tab that
     deletes the bar it was pressed with is the disorientation the four fixed
     positions exist to remove. With it up, the back arrow goes: a root tab has
     nothing behind it, and an arrow that says otherwise is a lie about where
     somebody is. */
  if (q.mine) {
    $("tabnotes").textContent = T("note.inbox");
    $("tabcards").textContent = T("nav.cards");
    $("tabbrowse").textContent = T("nav.browse");
    $("tabmelabel").textContent = T("nav.profile");
    $("tabmoney").textContent = T("nav.money");
    $("tabmoneygo").hidden = "{{INAPP}}" === "1";
    $("tabme").href = location.pathname;
    $("tabs").hidden = false;
    document.body.classList.add("hastabs");
    /* THE ARROW GOES ONLY IF THIS IS A ROOT TAB, WHICH IT IS NOT ALWAYS.
     *
     * It was hidden on your own page full stop, on the reasoning above: the
     * tab bar is up, Profile is one of its four, and a root tab has nothing
     * behind it. True when you got here by pressing Profile. Not true at all
     * when somebody pushed you here — tapping your own face in a group's
     * members grid lands on this page with the bar up, no arrow, and, in a
     * home-screen install, no browser chrome either. A dead end on your own
     * profile, reachable in two taps.
     *
     * So it asks where this page came from instead of assuming. Same origin
     * and a different path means somebody navigated here from inside the app
     * and there is somewhere real to go back to; no referrer means a typed
     * address or a cold open, where the arrow would be the lie the note above
     * is about. */
    $("back").hidden = !pushedHere();
  }

  // Directly under Follow, because somebody who opened a shared link has two
  // things they might do and this is the second one: look at the rest. It was
  // at the bottom of the page, past everything they would have to read first.
  /* Not on your own page: the tab bar is up there and Browse is in it, and a
     third button pushed Share and Edit onto two lines each. */
  if (!q.mine) {
    const feed = el("a", null, T("bud.back"));
    feed.href = "/browse";
    meet.append(feed);
  }
  if (!q.mine) {
    const rep = el("button", "warn", T("bud.reportThem"));
    rep.type = "button";
    rep.addEventListener("click", () => {
      // Reporting a profile is reporting its owner, and the queue this lands
      // in is the same one a reported post lands in.
      rep.disabled = true;
      rep.textContent = T("act.reported");
      fetch("/api/report", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ id: q.id, why: "Reported from a profile", device }),
      }).catch(() => { /* it is already gone from their view */ });
    });
    acts.append(rep);
  }
  box.append(acts);

  /* WHERE A NOTE GOT TO, and it comes back with the button that starts one.
   * Without it the page shows no hello button and says nothing about why —
   * which reads as a missing feature rather than a thread that is waiting on
   * them or one somebody left. */
  if (!q.mine && !THREAD.can && THREAD.why) {
    /* "profile" is somebody at a door reading a member's page — they can see
       it and they have no page of their own, so there is nothing to write
       from. The line says the two things that would change it rather than
       describing a thread that does not exist. See threadState. */
    const key = THREAD.why === "closed" ? "note.closed"
      : THREAD.why === "profile" ? "note.needPage" : "note.waiting";
    box.append(el("p", "stateline", T(key, { who: q.handle })));
  }
  /* YOUR KEY, on your own page.
   *
   * The line that makes a second browser you. It lives here because this is
   * the page the Profile tab opens once you have one — telling somebody to
   * find it in the editor means telling them a different route depending on
   * whether they have a page yet, and an instruction with an "if" in it is one
   * people get wrong. */
  /* WHAT YOU HAVE EARNED HERE, AND ONLY EVER ON YOUR OWN PAGE.
   *
   * Never on anybody else's — /api/earned has no way to ask about somebody
   * else, deliberately, and this block is inside q.mine. A board that prints
   * what a person earned on their page is a board people decline to join, and
   * doubly so for the half of this one that reads Chinese.
   *
   * NOT A BALANCE, and the card says so under the number. The board never
   * holds the money and cannot see a bank. What it has is two kinds of record:
   * rows the payment page wrote, where Stripe watched the money arrive, and
   * rows where the two of them each tapped. The second is worth a great deal
   * and is still two people's word. Calling the sum a balance is the sort of
   * quiet lie somebody takes to an accountant.
   *
   * NOTHING IS DRAWN UNTIL THERE IS SOMETHING. A card reading ¥0 on every page
   * for the first six months teaches everybody that nobody earns here, which
   * is the opposite of the reason to have it.
   */
  if (q.mine) drawEarned(box);

  if (q.mine) {
    const kb = el("div", "keybox");
    kb.append(el("h3", null, T("key.title")), el("p", null, T("key.body")));
    const open = el("div");
    open.hidden = true;
    const val = el("code", null, device || "\u2014");
    const row = el("div", "keyrow");
    const show = el("button", null, T("key.show"));
    show.type = "button";
    show.addEventListener("click", () => {
      open.hidden = !open.hidden;
      show.textContent = open.hidden ? T("key.show") : T("key.hide");
    });
    const copy = el("button", "go", T("key.copy"));
    copy.type = "button";
    copy.addEventListener("click", () => {
      copy.textContent = T(copyText(device) ? "key.copied" : "act.copyFail");
      setTimeout(() => { copy.textContent = T("key.copy"); }, 2000);
    });
    open.append(el("div", "keyval", null), el("p", "warn", T("key.warn")));
    open.firstChild.append(val);
    const crow = el("div", "keyrow");
    crow.append(copy);
    open.append(crow);
    row.append(show);
    kb.append(row, open);

    /* AND THE SAME JOB WITHOUT A KEY TO KEEP — see board/lib/google.js.
     *
     * The key above is the honest mechanism and almost nobody saves it. This
     * is the same sentence said a second way: attach a Google account and any
     * phone signed into it finds you again. It belongs here and not in a sheet
     * somewhere for the reason written over the key box — this is the one
     * screen a member is sent to when they ask how to be themselves twice.
     *
     * DRAWN ONLY WHEN THE BOX CAN OFFER IT, and only on your own page, which
     * is the branch this whole block is already inside.
     */
    const gwrap = el("div", "gtie");
    gwrap.hidden = true;
    gwrap.append(el("p", null, T("g.tie")));
    const gbtn = el("button", null, T("g.in"));
    gbtn.type = "button";
    gbtn.addEventListener("click", async () => {
      gbtn.disabled = true;
      try {
        /* A POST AND THEN A NAVIGATION, not a link: the callback comes back as
           a redirect and a redirect carries no header, so the device this
           browser is has to be handed over before leaving. */
        const r = await fetch("/api/signin/google", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ device, next: location.pathname }),
        });
        const d = await r.json().catch(() => ({}));
        if (!r.ok || !d.url) throw new Error("no");
        location.assign(d.url);
      } catch {
        gbtn.disabled = false;
        gsaid.textContent = T("err.general");
      }
    });
    const grow = el("div", "keyrow");
    grow.append(gbtn);
    const gsaid = el("p", "warn", GSAID ? T(GSAID) : "");
    gwrap.append(grow, gsaid);
    kb.append(gwrap);
    /* Asked once, here, rather than on every page load: a board with no client
       id configured should cost somebody who never opens their own profile
       nothing at all. */
    fetch("/api/hello", { cache: "no-store" })
      .then((r) => r.json())
      /* AND NOT IN THE APP. Google will not run its sign-in screen inside an
         embedded webview — it refuses the user agent — and Capacitor hands
         accounts.google.com to Safari, where the cookies this flow set on the
         way out do not exist, so the callback fails the state check and
         redirects a browser the app cannot see. Nothing visible happens, twice.
         Attaching is offered in a tab, where it works; the key above is the
         road in the app, and it always was. */
      .then((d) => { if (d && d.google && !NATIVE) gwrap.hidden = false; })
      .catch(() => { /* no button, and the key above is untouched */ });

    const fold = el("details", "keyfold");
    fold.append(el("summary", null, T("me.keyFold")));
    if (device) fold.append(kb);
    fold.append(el("p", "safety", T("bud.safety")));
    box.append(fold);
    return;
  }

  box.append(el("p", "safety", T("bud.safety")));
}

/* MO WRITES THE FIRST ONE.
 *
 * The blank box in front of a stranger's card is where this whole board stops
 * working. Two people whose sentences answer each other exactly, a Send
 * button, and neither of them types — because writing cold to somebody in your
 * own industry, in your second language, is the part nobody does. Every other
 * screen here is about getting these two in front of each other and then they
 * both close the tab.
 *
 * HE PROPOSES, HE NEVER SENDS. The text lands in the box, the button under it
 * is still Send and it is still theirs to press, and the line underneath says
 * out loud that it goes out with their name on it. Same rule as the sentence
 * he proposes in the waiting room.
 *
 * WHATEVER THEY HAVE ALREADY TYPED IS KEPT. Half a sentence in the box is not
 * a thing to overwrite — it is the point they were trying to make, and he
 * makes it. The button says so once they have started.
 *
 * THE FIRST MESSAGE ONLY. The server refuses a pair who have already written
 * to each other, because drafting a reply means handing it what the other
 * person wrote — in a room this product says only the two of them can see.
 * If it refuses, the button goes away rather than explaining itself.
 */
function draftRow(box, q) {
  const row = el("div", "draft");
  const go = el("button", null, T("draft.go"));
  go.type = "button";
  const said = el("p", "tiny");
  said.hidden = true;

  go.addEventListener("click", async () => {
    go.disabled = true;
    const was = go.textContent;
    go.textContent = T("draft.doing");
    said.hidden = true;
    try {
      const r = await fetch("/api/butler-draft", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          device, who: q.id, lang: lang() === "zh" ? "zh" : "en",
          /* What is in the box goes up with it. He is finishing their
             sentence, not replacing it. */
          started: box.value.trim().slice(0, 300),
        }),
      });
      const d = await r.json().catch(() => ({}));
      if (!r.ok) {
        /* A pair who are already talking is not a failure to report — it is
           a button that should never have been on this screen. It leaves
           quietly. Anything else says so once. */
        if (d.error === "thread" || d.error === "gone") { row.remove(); return; }
        throw new Error("no");
      }
      box.value = d.say || "";
      box.focus();
      /* The cursor at the end, not the start: the next thing they do is
         change the last line of it. */
      box.setSelectionRange(box.value.length, box.value.length);
      said.textContent = T("draft.yours");
      said.hidden = false;
      go.textContent = T("draft.again");
      go.disabled = false;
    } catch {
      said.textContent = T("draft.failed");
      said.hidden = false;
      go.textContent = was;
      go.disabled = false;
    }
  });

  row.append(go, said);
  return row;
}

/* The sheet. Two lines and a send, and an honest sentence about what happens
 * to them. */
function sheet(q) {
  const wrap = el("div", "sheet");
  const card = el("div", "card");
  const answering = Boolean(THREAD.answering);

  card.append(el("h2", null, T("note.title", { who: q.handle })));
  card.append(el("p", "how", answering ? T("note.answerHow") : T("note.how", { who: q.handle })));

  const box = document.createElement("textarea");
  box.maxLength = 600;
  box.placeholder = T("note.placeholder");
  card.append(box);
  /* Not on an answer — see draftRow(). A reply would mean sending him what
     they wrote to you. */
  if (!answering) card.append(draftRow(box, q));

  const said = el("p", "said");
  const row = el("div", "row");
  const shut = el("button", null, T("bud.close"));
  shut.type = "button";
  shut.addEventListener("click", () => wrap.remove());
  const go = el("button", "primary", T("note.send"));
  go.type = "button";

  go.addEventListener("click", async () => {
    const text = box.value.trim();
    if (!text) { box.focus(); return; }
    go.disabled = true; shut.disabled = true;
    said.classList.remove("bad");
    said.textContent = T("note.sending");
    try {
      const r = await fetch("/api/note", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ device, who: q.id, text }),
      });
      const d = await r.json().catch(() => ({}));
      if (!r.ok) {
        // The server's word for what stopped it, said in the reader's own
        // language rather than passed through as a code.
        /* EVERY CODE THE ROUTE CAN RETURN, because the ones missing from
           here fell through to "It did not send. Try again." — advice that is
           wrong about all of them, since not one is a thing retrying fixes.
           `off` is the 404 from notesOff, which is a board with messages
           switched off answering every write identically for ever. */
        const known = { profile: "note.needProfile", enough: "note.enough",
                        gone: "note.gone", closed: "note.closed", waiting: "note.waiting",
                        shut: "note.shut", self: "note.self", contact: "note.noContact",
                        "not in this version": "note.off" };
        said.classList.add("bad");
        said.textContent = T(known[d.error] || "note.failed", { who: q.handle });
        go.disabled = false; shut.disabled = false;
        return;
      }
      said.textContent = T("note.sent");
      go.remove();
      shut.disabled = false;
      shut.textContent = T("bud.close");
      // The profile behind the sheet is now wrong about what can be pressed.
      await load();
    } catch {
      said.classList.add("bad");
      said.textContent = T("note.failed");
      go.disabled = false; shut.disabled = false;
    }
  });

  row.append(shut, go);
  card.append(row, said);
  wrap.append(card);
  // Pressing the dimmed area behind it closes; pressing the card does not.
  wrap.addEventListener("click", (e) => { if (e.target === wrap) wrap.remove(); });
  document.body.append(wrap);
  box.focus();
}

setLang(pickLang());
$("langslot").append(langButton(paint));
load();
</script>

<script>
/* Registering the worker.
 *
 * Classic script rather than a module so this runs before anything else and
 * on browsers that do not do modules — the worker is what makes the board
 * survive a bad connection, which is exactly the browser least likely to be
 * new.
 *
 * Deferred to load: registration competes with the page's own requests, and
 * the first paint matters more than the second visit.
 */
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("/sw.js").catch(() => { /* not fatal */ });
  });
}
</script>
</body>
</html>
