<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>At the door · The Exchange</title>
<!-- A page about one person, behind the door. Not for a crawler and not for a
     link card: see the note above OPEN_PATHS on why /p/ is shut too. -->
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/favicon.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="stylesheet" href="/site.css">
<style>
  /* ---- SOMEBODY AT THE DOOR, AS A PAGE ------------------------------------
   *
   * They are not members and have no /p/ page, so a member tapping their face
   * in a room landed in a conversation with somebody they knew nothing about.
   * Everything a page is made of is already on the board: a name, a sentence,
   * the line they wrote on the way in, a photograph, where they stand, and
   * who has spoken for them.
   *
   * IT LOOKS LIKE A MEMBER'S CARD ON PURPOSE. The same face over the same
   * sentence in the same order, because the point of the screen is that this
   * is a person on this board rather than a row in a queue — and because the
   * one thing it says that a member's page does not is that they are still
   * outside, which reads loudest against a page that is otherwise the same.
   */
  body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);
    font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%}
  main{max-width:34rem;margin:0 auto;padding:0 0 3rem}

  .top{display:flex;align-items:center;gap:.6rem;padding:.9rem 1.1rem;
    border-bottom:1px solid var(--hair)}
  .top a{color:var(--ink);text-decoration:none;font-size:1.2rem;line-height:1}
  .top b{font-weight:500;font-size:.95rem}
  .top span{margin-left:auto}

  .wrap{padding:1.2rem 1.1rem 0}

  /* THE FACE, at the size a face is worth. A letter where there is none — the
     mark of a missing picture rather than the card's whole content. */
  .face{width:6.5rem;height:6.5rem;border-radius:50%;display:grid;
    place-items:center;background:var(--accent);color:var(--accent-ink);
    font-family:var(--serif);font-size:2.6rem;overflow:hidden;margin:0 0 1rem}
  .face img{width:100%;height:100%;object-fit:cover;display:block}

  h1{margin:0;font-family:var(--serif);font-weight:400;font-size:2rem;
    line-height:1.1;letter-spacing:-.01em;text-wrap:balance}

  /* STILL OUTSIDE, said plainly and once. It is the only fact on this page a
     member's own page would not carry, and it is the one they are deciding
     about — so it is a line in ink under the name rather than a grey tag in a
     row of grey tags. */
  .state{margin:.5rem 0 0;font-size:.95rem;color:var(--ink-2)}
  .state b{font-weight:600;color:var(--ink)}

  /* THE SENTENCE. The only thing on this board that decides anything. */
  .say{margin:1.2rem 0 0;font-family:var(--serif);font-size:1.25rem;
    line-height:1.5}
  .say em{font-style:normal;color:var(--muted)}
  .say b{font-weight:600;margin:0 .3rem}

  .why{margin:.9rem 0 0;font-size:1.02rem;line-height:1.6;overflow-wrap:anywhere}

  .tags{margin:1rem 0 0;display:flex;gap:.35rem;flex-wrap:wrap}
  .tags span{padding:.2rem .6rem;border-radius:99px;background:var(--card);
    border:1px solid var(--hair);font-size:.8rem;color:var(--ink-2)}

  /* WHO SPOKE FOR THEM, named. A member reading "2 vouched" reads a number;
     the same line saying "Ivy vouched" is somebody they know standing behind
     a stranger, which is the only thing here that moves anybody. */
  .vouch{margin:1.1rem 0 0;padding:.8rem 1rem;border-radius:.8rem;
    background:var(--accent-soft);font-size:.92rem;line-height:1.5}
  .vouch b{font-weight:600}

  /* WHAT IS MISSING, and it is the reason this page exists twice over: a
     member sees what they are deciding on with a hole in it, and the person
     at the door finds out there is a page of theirs with a hole in it. */
  .gap{margin:1.1rem 0 0;padding:.8rem 1rem;border-radius:.8rem;
    border:1px dashed var(--line);font-size:.92rem;line-height:1.5;
    color:var(--ink-2)}

  .acts{margin:1.6rem 0 0;display:flex;gap:.5rem;flex-wrap:wrap}
  .acts a,.acts button{flex:1 1 9rem;text-align:center;padding:.8rem;
    border:0;border-radius:99px;font:inherit;font-size:.95rem;font-weight:600;
    text-decoration:none;cursor:pointer}
  .go{background:var(--accent);color:var(--accent-ink)}
  .second{background:var(--card);border:1px solid var(--hair);color:var(--ink)}
  .second.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}

  .quiet{margin:2rem 1.1rem;color:var(--muted)}
</style>
</head>
<body>
<main>
  <div class="top">
    <a href="#" id="back" aria-label="Back">‹</a>
    <b id="head"></b>
    <span id="langslot"></span>
  </div>
  <div class="wrap" id="body"><p class="quiet">…</p></div>
</main>

<script type="module">
import { T, when, lang, setLang, pickLang, langButton } from "/i18n.js";

const $ = (id) => document.getElementById(id);
const el = (t, c, x) => { const n = document.createElement(t);
  if (c) n.className = c; if (x !== undefined) n.textContent = x; return n; };
const fill = (n, ...kids) => { n.textContent = ""; n.append(...kids); return n; };

const ID = decodeURIComponent(location.pathname.split("/").filter(Boolean)[1] || "");
const device = (() => {
  try { return localStorage.getItem("board:device") || ""; } catch { return ""; }
})();

let W = null;

function initial(name) {
  const s = String(name || "").trim();
  return s ? s[0].toUpperCase() : "?";
}

async function load() {
  try {
    W = await fetch("/api/queue/" + encodeURIComponent(ID), { cache: "no-store",
      headers: { "x-board-device": device } }).then((r) => (r.ok ? r.json() : null));
  } catch { W = null; }
}

function draw() {
  const box = $("body");
  $("head").textContent = T("wp.head");
  if (!W) {
    fill(box, el("p", "quiet", T("wp.gone")));
    return;
  }
  document.title = W.name + " · " + T("site.title");
  fill(box);

  const face = el("div", "face", W.photo ? "" : initial(W.name));
  if (W.photo) {
    const img = Object.assign(document.createElement("img"),
      { src: "/api/wait-media?id=" + encodeURIComponent(W.photo), alt: "", loading: "lazy" });
    img.addEventListener("error", () => { img.remove(); face.textContent = initial(W.name); });
    face.append(img);
  }
  box.append(face);
  box.append(el("h1", null, W.name || T("board.someone")));

  /* WHERE THEY STAND, and which of the two states they are in. Somebody moved
     up is not in the queue any more, and telling them they are 12th of 40
     when they are past that is the page disagreeing with the door. */
  const state = el("p", "state");
  if (W.up) {
    state.append(el("b", null, T("wp.up")), document.createTextNode(" " + T("wp.upWhy")));
  } else {
    state.append(el("b", null, T("wp.place", { n: W.place, t: W.waiting })));
  }
  box.append(state);

  if (W.me && W.want) {
    const say = el("p", "say");
    say.append(el("em", null, T("say.iam")), el("b", null, T("role.a." + W.me)),
      el("em", null, T("say.lookingFor")), el("b", null, T("role.a." + W.want)));
    box.append(say);
  }
  if (W.why) box.append(el("p", "why", W.why));

  const tags = el("div", "tags");
  if (W.room) tags.append(el("span", null, T("waitroom." + W.room)));
  if (W.type) tags.append(el("span", null, W.type));
  if (W.at) tags.append(el("span", null, T("wp.came", { when: when(W.at) })));
  if (W.brought) tags.append(el("span", null, T("brw.qbrought", { n: W.brought })));
  if (tags.childNodes.length) box.append(tags);

  if (W.vouches) {
    const v = el("div", "vouch");
    const names = (W.vouchedBy || []).slice(0, 2).join(", ");
    v.append(el("b", null, names || T("board.someone")),
      document.createTextNode(" " + (W.vouches > 2
        ? T("wp.vouchedMore", { n: W.vouches - 2 })
        : T("wp.vouched"))));
    box.append(v);
  }

  /* THE HOLE, NAMED. Two of them and it is still one line: a member is
     deciding and needs to know what they are not being told, and the person
     at the door is the one who can fix it. */
  const missing = [];
  if (!W.photo) missing.push(T("wp.noFace"));
  if (!(W.me && W.want)) missing.push(T("wp.noSay"));
  if (!W.why) missing.push(T("wp.noLine"));
  if (missing.length) {
    /* Joined here rather than with the punctuation baked into each string:
       three of them read as a list and one of them read as a sentence that
       had been cut off. */
    const list = missing.length === 1 ? missing[0]
      : missing.slice(0, -1).join(T("wp.comma")) + T("wp.and") + missing[missing.length - 1];
    box.append(el("div", "gap", T("wp.missing") + " " + list + T("wp.stop")));
  }

  const acts = el("div", "acts");
  const write = el("a", "go", T("wp.write"));
  write.href = "/notes#w:" + encodeURIComponent(W.id);
  acts.append(write);

  /* VOUCHING IS THE ONE THING A MEMBER CAN DO ABOUT THE DOOR — admission is
     the operator's. It moves them one place and it is taken back the same
     way, so the button says which of the two it is about to do. */
  const vouch = el("button", "second" + (W.mine ? " on" : ""),
    T(W.mine ? "wp.vouchedBy" : "wp.vouch"));
  vouch.type = "button";
  vouch.addEventListener("click", async () => {
    vouch.disabled = true;
    try {
      await fetch("/api/vouch", {
        method: "POST",
        headers: { "Content-Type": "application/json", "x-board-device": device },
        body: JSON.stringify({ device, wait: W.id, on: !W.mine }),
      });
      await load();
    } catch { /* the page redraws with what it has */ }
    vouch.disabled = false;
    draw();
  });
  acts.append(vouch);
  box.append(acts);
}

$("back").addEventListener("click", (e) => {
  e.preventDefault();
  if (history.length > 1) history.back(); else location.href = "/browse";
});

setLang(pickLang());
$("langslot").append(langButton(draw));
draw();
load().then(draw);
</script>
</body>
</html>
