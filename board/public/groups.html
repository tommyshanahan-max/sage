 *
 * Read once and forgotten: it is an opening position, not a mode, and a
 * reload should not put somebody back at the start of something they have
 * moved on from. */
const WITH = new URLSearchParams(location.search).get("with") || "";
let usedWith = false;
/* BACK FROM A PAYMENT.
 *
 * Stripe sends the payer here when the frame finishes, with the session id on
 * the query string. It is not proof of anything — anybody can type it — and
 * nothing here reads it as proof. What tells the board a payment landed is the
 * webhook, signed, arriving on its own.
 *
 * But the webhook and the payer race, and the payer usually wins: they come
 * back a second after paying and the row still says Due, which reads as "it
 * did not work" and gets paid twice. So the room quietly asks again, twice,
 * and the row flips under them without anybody pressing refresh.
 *
 * The parameter is then wiped from the address, so a reload later is not
 * mistaken for another payment. */
const CAME_BACK = new URLSearchParams(location.search).get("paid") || "";
/* ADDING SOMEBODY IS ITS OWN SCREEN, NOT A BLOCK UNDER THE CONVERSATION.
 *
 * It lived at the bottom of the room, after the composer, which meant two
 * things went wrong as soon as a room had anything in it: you scrolled the
 * whole conversation to reach it, and opening it pushed the conversation off
 * the screen you were reading. A control you use twice in a room's life was
 * sitting in the middle of the thing you use every day.
 *
 * In the header now, where it is one tap from anywhere, and it opens over the
 * room rather than inside it. */
let ADDING = false;
/* THE ROOM'S OWN PAGE, BORROWED FROM THE ONE EVERY PERSON ON THIS BOARD
 * ALREADY USES.
 *
 * In WeChat everything about a group lives behind ⋯ in the top right: who is
 * in it as a grid of faces, a ＋ tile at the end of that grid to add somebody,
 * the name, and leaving at the bottom. A Chinese user does not read that
 * screen, they already know it.
 *
 * So the chat is the chat — faces and a leave button are not things anybody
 * needs in front of them while reading it — and all of it is one tap away, in
 * the place the hand already goes. */
let INFO = false;

/* A COLOUR PER PERSON, FROM THEIR OWN NAME — the same routine, and so the
   same colour, as notes.html and the card in room.html. This page never had
   it: every letter avatar was the one accent blue, so a picker listing four
   people who had not uploaded a photo was four identical blue circles.
   Not random: it has to be the same tomorrow, and the same to them as it is
   to the person reading. */
function wash(name) {
  let h = 0;
  for (const ch of String(name || "?")) h = (h * 31 + ch.codePointAt(0)) % 360;
  return "linear-gradient(150deg,hsl(" + h + " 26% 74%),hsl(" + ((h + 24) % 360) + " 24% 52%))";
}

/** A face, or a letter where there is none. */
/** Where a face goes when it is tapped, or nowhere.
 *
 *  One place, because the members grid and the conversation both need the
 *  same answer and two copies of it would disagree the first time somebody
 *  changed one. Mo is not a member and /p/ has nothing to show for him.
 */
function faceHref(p) {
  if (!p || !p.handle) return "";
  return p.bot ? "/mo" : "/p/" + encodeURIComponent(String(p.handle).toLowerCase());
}

/** The face, wrapped so it opens that page — or handed straight back when
 *  there is nowhere for it to go. */
function faceLink(p, node) {
  const href = faceHref(p);
  if (!href) return node;
  const a = el("a", "facego");
  a.href = href;
  a.append(node);
  return a;
}

function face(p, cls) {
  const a = el("span", "av" + (cls ? " " + cls : ""), initial(p.handle));
  a.style.background = wash(p.handle);
  if (p.photo) {
    const img = Object.assign(document.createElement("img"),
      { src: "/api/public-media?id=" + encodeURIComponent(p.photo), alt: "", loading: "lazy" });
    img.addEventListener("load", () => {
      a.textContent = "";
      a.style.background = "";
      a.append(img);
    });
  }
  return a;
}

async function load() {
  try {
    const d = await fetch("/api/groups", { cache: "no-store",
      headers: device ? { "x-board-device": device } : {} }).then((r) => r.json());
    GROUPS = d.groups || [];
    CANADD = d.canAdd || [];
    /* Only if they really are somebody this person may put in a room. An id in
       the address is a thing anybody can type; the picker's own gate decides,
       as it does for every other name in it. */
    if (WITH && !usedWith && !OPEN && CANADD.some((c) => c.who === WITH)) {
      /* Once. load() runs again after every add and every invite, and without
         this the picker would reopen under somebody who had just left it. */
      usedWith = true;
      PICKING = true;
      PICKED = [WITH];
    }
    MAX = Number(d.max) || 5;
    STAFF = Boolean(d.staff);
    LAYER = d.layer || null;
    LEFT = d.layerNow || null;
  } catch { GROUPS = []; CANADD = []; LAYER = null; LEFT = null; }
  paint();
}

function go(id) {
  ADDING = false;
  INFO = false;
  OPEN = id;
  const u = new URL(location.href);
  if (id) u.searchParams.set("g", id); else u.searchParams.delete("g");
  try { history.replaceState(null, "", u); } catch { /* fine */ }
  paint();
}

function paint() {
  $("safety").textContent = T("note.safety");
  $("back").setAttribute("aria-label", T("nav.back"));
  const room = GROUPS.find((g) => g.id === OPEN);
  if (room) return paintRoom(room);
  paintList();
}

/* --------------------------------------------------------------- the list */

function paintList() {
  $("topact").hidden = true;
  $("title").textContent = T("grp.title");
  $("sub").textContent = GROUPS.length
    ? T("grp.count", { n: GROUPS.length }) : T("grp.sub");
  const box = $("screen");
  fill(box);

  if (PICKING) { box.append(picker()); return; }

  /* The button first. Making one is the thing somebody opens this page to do
     while there are none, and it stays at the top afterwards because a list of
     three rooms is not long enough to bury it under. */
  const start = el("button", "start", T("grp.start"));
  start.type = "button";
  start.addEventListener("click", () => { PICKING = true; PICKED = []; paint(); });
  box.append(start);

  if (!GROUPS.length) {
    const none = el("div", "none");
    none.append(el("b", null, T("grp.none")), el("p", null, T("grp.noneBody")));
    box.append(none);
    return;
  }

  box.append(Object.assign(el("div", "rule"), {}));
  const r = el("div", "rule");
  r.append(el("span", null, T("grp.yours")), el("i"));
  box.append(r);

  for (const g of GROUPS) {
    const b = el("button", "room");
    b.type = "button";
    const faces = el("div", "faces");
    for (const p of g.who.slice(0, 4)) faces.append(face(p));
    const m = el("div", "m");
    m.append(el("b", null, g.name || nameOf(g)));
    const last = g.says[g.says.length - 1];
    m.append(el("p", null, last ? last.text : T("grp.quiet")));
    b.append(faces, m, el("span", "chev", "›"));
    b.addEventListener("click", () => go(g.id));
    box.append(b);
  }
}

/** What to call a room nobody named: the people in it. */
const nameOf = (g) => g.who.map((p) => p.handle).filter(Boolean).slice(0, 3).join(", ");

/* ------------------------------------------------------------- the picker */

function picker() {
  const box = el("div", "picker");
  const r = el("div", "rule");
  r.append(el("span", null, T("grp.start")), el("i"));
  box.append(r);

  if (!CANADD.length) {
    box.append(el("p", "lede", T("grp.nobody")));
    const back = el("button", "start", T("nav.back"));
    back.type = "button";
    back.addEventListener("click", () => { PICKING = false; paint(); });
    box.append(back);
    return box;
  }

  // You are always in it, so there is room for one fewer than the cap.
  const room = MAX - 1;
  box.append(el("p", "lede", T(STAFF ? "grp.whoAll" : "grp.who", { n: room })));

  /* TYPE A NAME RATHER THAN SCROLL FOR ONE.
   *
   * This was every person you could add, as a row, in one column. That is
   * readable at eight and useless at eighty, and the list only grows — so the
   * screen got worse at its job every time the board got better at its own.
   *
   * ALWAYS, NOT PAST SOME NUMBER. It was written to appear only over a dozen
   * people, which is a rule that hides the box on the board that asked for it
   * — there are eight members today. A search box over eight names costs a
   * line; a list of eighty with no search costs the feature. */
  const rows = el("div");
  let find = "";
  const q = document.createElement("input");
  q.className = "pfind";
  q.type = "search";
  q.autocomplete = "off";
  q.placeholder = T("grp.find");
  /* ONLY THE ROWS ARE REDRAWN, not the page. paint() rebuilds this whole
     screen and would take the keyboard down with it on the first letter. */
  q.addEventListener("input", () => { find = q.value.trim().toLowerCase(); draw(); });
  box.append(q, rows);

  function draw() {
    while (rows.firstChild) rows.removeChild(rows.firstChild);
    const full = PICKED.length >= room;
    /* ANYBODY ALREADY PICKED STAYS VISIBLE whatever is typed. Typing a third
       name and watching the first two vanish reads as having lost them. */
    const show = CANADD.filter((c) => PICKED.includes(c.who)
      || !find || String(c.handle || "").toLowerCase().includes(find));
    if (!show.length) {
      rows.append(el("p", "lede", T("grp.findNone")));
      return;
    }
    for (const c of show) {
      const on = PICKED.includes(c.who);
      const b = el("button", "pick" + (on ? " on" : ""));
      b.type = "button";
      b.disabled = !on && full;
      b.append(face(c), el("b", null, c.handle),
        el("span", "tag", T(on ? "grp.added" : "grp.add")));
      b.addEventListener("click", () => {
        PICKED = on ? PICKED.filter((x) => x !== c.who) : [...PICKED, c.who];
        paint();
      });
      rows.append(b);
    }
  }
  draw();

  const name = document.createElement("input");
  name.maxLength = 60;
  name.placeholder = T("grp.namePlaceholder");
  box.append(name);

  /* SOMEBODY WHO IS NOT ON HERE YET.
   *
   * This screen is where a member finds out the person they want is not a
   * member: one face in the list, a button that will not go, and the third
   * person sitting in their phone. Sending them away to find an invite code
   * somewhere else, and coming back, is how a room never gets made.
   *
   * It mints against the same daily allowance as the code in their header —
   * see /api/group-invite — so this is a different door to the same ceiling
   * and not a way round it. */
  const bringIn = outsider(() => PICKED, () => name.value.trim());

  const make = el("button", "make", T("grp.make", { n: PICKED.length + 1 }));
  make.type = "button";
  // Three, because two people already have a thread and a group of two would
  // be a second, worse version of it.
  make.disabled = PICKED.length < 2;
  const said = el("p", "limit");
  make.addEventListener("click", async () => {
    make.disabled = true;
    try {
      const r2 = await fetch("/api/group", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ device, who: PICKED, name: name.value.trim() }),
      });
      const d = await r2.json().catch(() => ({}));
      if (!r2.ok) throw new Error(d.error || "no");
      PICKING = false;
      await load();
      go(d.id);
    } catch {
      said.textContent = T("act.again");
      make.disabled = false;
    }
  });
  box.append(make, said);
  box.append(el("p", "limit", T("grp.limit")));
  /* UNDER THE PRIMARY ACTION AND NOT OVER IT. It sat above Create group and
     drew the eye off it — a solid accent button for the second thing on a
     screen whose first thing was a pale disabled one. Making a room is what
     this screen is for; bringing somebody in is the answer when it will not
     go. */
  box.append(bringIn);

  const back = el("button", "start", T("nav.back"));
  back.type = "button";
  back.addEventListener("click", () => { PICKING = false; paint(); });
  box.append(back);
  return box;
}

/* --------------------------------------------------------------- one room */

/* Tap his line to hear it — see moHear. Asked for, one at a time, and the cue
   goes for good on a box with no voice. */
function hearMo(bub, text) {
  bub.classList.add("hear");
  bub.setAttribute("role", "button");
  bub.setAttribute("tabindex", "0");
  const go = () => moHear(text, (on) => {
    if (on === "off") { bub.classList.remove("hear", "hearing"); return; }
    bub.classList.toggle("hearing", Boolean(on));
  });
  bub.addEventListener("click", go);
  bub.addEventListener("keydown", (e) => {
    if (e.key === "Enter" || e.key === " ") { e.preventDefault(); go(); }
  });
}

/* WHICH OF THE TWO A READER SEES, and it is a choice between two strings the
   message already carries — rendered once when it was said, see renderSay.
   The original when there is no rendering yet, or when it is already in the
   reader's language: what was typed is always right and sometimes unreadable
   to the person looking at it, which is the state this is fixing and the
   honest version of it while a render is in flight. */
function saidIn(m) {
  const words = m.text || "";
  /* NOT YOUR OWN. You wrote it, you know what it says, and reading your own
     English sentence handed back to you in Chinese is the app correcting you
     rather than helping. WeChat leaves yours alone for the same reason. */
  if (m.mine) return words;
  return pick(words, m.alt, m.alt2, m.lang);
}

/** The panel across the top of the hand-kept room. */
function ledger(g) {
  const box = el("div", "ledger");
  const row = (k, name, left) => {
    const r = el("div", "lrow");
    r.append(el("span", "lk", T(k)));
    r.append(el("b", null, T("layer." + name)));
    if (left) r.append(el("small", null, left === 1
      ? T("layer.last") : T("layer.left", { n: left })));
    box.append(r);
  };
  /* ONE ROW WHEN YOUR BAND IS THE BAND STILL FILLING, which for everybody
     here it will be for a long time. Two rows printed "First hundred" twice
     under two different labels, which reads as two facts and is one. */
  if (LAYER && LEFT && LAYER.key === LEFT.key) row("layer.head", LAYER.key, LEFT.left);
  else {
    if (LAYER) row("layer.head", LAYER.key, 0);
    if (LEFT) row("led.open", LEFT.key, LEFT.left);
  }
  /* NO COUNT OF THE ROOM IN HERE. The line under the title already says how
     many people are in it, and the same number twice on one screen reads as
     a banner rather than a fact. */
  /* SAID EVERY TIME, under the numbers rather than behind a tap. The panel is
     a record of who was early and it must not be read as a promise of money;
     a disclaimer somebody has to go looking for is a disclaimer nobody has
     read. One line, and it is the last thing in the box. */
  box.append(el("p", "lwhat", T("led.what")));
  return box;
}

/* The pinned memo.
 *
 *  READ-ONLY UNTIL IT IS YOURS TO SIGN. Everybody in the room sees the same
 *  words; only the two named sides get the button, and the third person — the
 *  one who made the introduction — is told in one line that they are a witness
 *  rather than left wondering why there is nothing to press.
 */
function dealPin(g) {
  const d = g.deal;
  const box = el("div", "dealpin");
  box.append(el("p", "dlab", T("deal.pin")));
  if (d.title) box.append(el("h3", "dtitle", d.title));
  box.append(el("p", "dwho", T("deal.hires", { a: d.hires, b: d.provides })));

  const rows = el("dl", "drows");
  for (const f of ["what", "where", "when", "fee", "deposit", "covers", "cancel"]) {
    if (!d[f]) continue;
    rows.append(el("dt", null, T("deal." + f)), el("dd", null, d[f]));
  }
  /* WHERE THE WORK IS DONE, on the terms with everything else. A bank asked
     for the contract reads this line; it is not a setting and it does not
     belong on a screen only the writer sees. */
  if (d.doneIn) {
    rows.append(el("dt", null, T("deal.doneIn")),
      el("dd", null, T(d.doneIn === "cn" ? "deal.doneCn" : "deal.doneOut")));
  }
  box.append(rows);

  /* WHO AGREED AND WHEN, as a line each. Not two ticks in a corner: the date
     is half the value of the record and a tick has nowhere to put one. */
  const marks = el("div", "dmarks");
  const when = (at) => new Date(at).toLocaleDateString(undefined,
    { day: "numeric", month: "short", year: "numeric" });
  for (const side of [d.hires, d.provides]) {
    const got = d.agreed.find((a) => a.who === side);
    marks.append(el("p", got ? "dyes" : "dno",
      got ? T("deal.agreedBy", { who: side, when: when(got.at) })
          : T("deal.waiting", { who: side })));
  }
  if (d.agreed.length >= 2) marks.append(el("p", "dboth", T("deal.both")));
  box.append(marks);

  const meIs = g.meHandle && (g.meHandle === d.hires || g.meHandle === d.provides);
  const already = d.agreed.some((a) => a.who === g.meHandle);
  /* THE FEE COMES FIRST, SAID BEFORE THE BUTTON IS PRESSED rather than after.
     The route refuses it either way; a person who has to press a thing to
     find out why it will not work has been made to feel stupid by software,
     which is a choice somebody made. */
  const feeDue = g.fee && !(g.fee.paid || []).some((r) => r.kind === "confirmed");
  const feeAsked = g.fee && (g.fee.paid || []).some((r) => r.kind === "claimed");
  /* THE FEE IS NOT SHOWN IN THE APP, and this is a decision about Apple
     rather than about the fee.
     
     An app that charges for something is expected to charge through in-app
     purchase, and the carve-out is for services delivered in the real world.
     A talent booking plainly is one; a fee for the introduction that arranged
     it is arguable, and a reviewer who decides it is a digital service asks
     for 15 to 30 per cent, which does not dent a two per cent margin, it
     erases it. So the app does not mention the fee at all, and says where to
     finish instead.
     
     THE SERVER GATE IS UNCHANGED, on purpose. This hides a row; it does not
     open a way round. Agreeing is refused until the fee has cleared no matter
     what is asking, so somebody who forged this flag would gain a tidier
     screen and nothing else. */
  if (meIs && !already && feeDue && NATIVE) {
    box.append(el("p", "dwait", T("deal.inBrowser", { where: location.host })));
  } else if (meIs && !already && feeDue) {
    box.append(el("p", "dwait", T(feeAsked ? "deal.feeWait" : "deal.feeFirst")));
  } else if (meIs && !already) {
    const go = el("button", "dgo", T("deal.agree"));
    go.type = "button";
    go.addEventListener("click", async () => {
      go.disabled = true;
      const r = await fetch("/api/group/deal/agree", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ device, group: g.id }),
      });
      if (r.ok) load(); else go.disabled = false;
    });
    box.append(go);
  } else if (!meIs) {
    box.append(el("p", "dsay", T("deal.witness")));
  }

  /* THE PAYEE SETS UP THEIR OWN PAYOUTS, and nobody can do it for them:
     Stripe wants their name, their bank and their identity, and this board
     should never be the thing holding any of it. Shown only to them, only
     when they have not, and never to somebody in the mainland, whom Stripe
     cannot pay at all. */
  if (g.needsPayout) box.append(payoutSetup(g));
  if (d.plan && d.plan.length) box.append(payPart(g, d));
  /* The route, between the plan and the board's own row: it is about the
     members' money, so it belongs with theirs and not with ours. */
  if (g.route) box.append(routePart(g, d));
  /* The board's own row, under the plan and outside it. Drawn only where the
     board names a page to pay it on, which is nowhere unless it is switched
     on. */
  if (g.fee && !NATIVE) box.append(feePart(g, d));

  box.append(el("p", "dlaw", T("deal.notlaw")));
  return box;
}

/** WHAT HAS BEEN PAID, AND WHO SAID SO.
 *
 *  The board is never told by a bank. Each row carries two half-facts — the
 *  payer says they paid, the other says it arrived — and reads as paid only
 *  when it has both. Anything less says which half is missing, in words.
 *
 *  The payment page is the other side's own. Following it leaves this board,
 *  and the line above the link says so rather than dressing it up as a button
 *  that pays somebody.
 */
/** PINNING THE TERMS, from inside the room.
 *
 *  The memo could only be written by an API call, which meant it existed for
 *  the operator and for nobody in the room it is about. This is the same seven
 *  lines the card prints, plus the payments, in the order two people would say
 *  them: who is hiring whom, what for, when, how much, and how it is paid.
 *
 *  NOTHING IS REQUIRED EXCEPT THE TWO SIDES. A memo saying only "Tom is hiring
 *  Damon, A$2,400, deposit on signing" is worth pinning; a form that refuses it
 *  until seven boxes are full is a form people close.
 */
function dealWriter(g, box) {
  const open = el("button", "dopen", T("deal.write"));
  open.type = "button";
  const form = el("div", "dwrite");
  form.hidden = true;
  open.addEventListener("click", () => { form.hidden = !form.hidden; if (!form.hidden) form.querySelector("input,select")?.focus(); });

  form.append(el("p", "wlab", T("deal.pin")));
  const people = g.who.filter((w) => !w.bot && w.handle).map((w) => w.handle);
  const pick = (name, label, value) => {
    const l = el("label", null, label);
    const sel = el("select");
    sel.name = name;
    for (const h of people) {
      const o = el("option", null, h);
      o.value = h;
      if (h === value) o.selected = true;
      sel.append(o);
    }
    l.append(sel);
    return l;
  };
  const line = (name, label, ph) => {
    const l = el("label", null, label);
    const i = el("input");
    i.name = name; i.placeholder = ph || "";
    l.append(i);
    return l;
  };
  const two = (a, b) => { const d = el("div", "two"); d.append(a, b); return d; };
  /* A fixed choice rather than a typed line: both of these are read by code —
     one decides which payment route is shown, the other decides whether
     Chinese tax applies — and a machine cannot act on "Macau, probably". */
  const one = (name, label, opts) => {
    const l = el("label", null, label);
    const sel = el("select");
    sel.name = name;
    for (const [v, t] of opts) {
      const o = el("option", null, t);
      o.value = v;
      sel.append(o);
    }
    l.append(sel);
    return l;
  };

  form.append(two(pick("hires", T("pay.sideHires"), g.meHandle),
                  pick("provides", T("pay.sideProvides"), people.find((h) => h !== g.meHandle))));
  form.append(line("title", T("deal.what"), ""));
  form.append(two(line("when", T("deal.when")), line("where", T("deal.where"))));
  form.append(two(
    line("fee", T("deal.fee")),
    one("cur", T("deal.cur"), [["cny", "CNY ¥"], ["aud", "AUD A$"], ["hkd", "HKD HK$"],
                               ["usd", "USD $"], ["eur", "EUR €"], ["gbp", "GBP £"],
                               ["jpy", "JPY ¥"]])));
  form.append(line("deposit", T("deal.deposit")));
  form.append(two(
    one("doneIn", T("deal.doneIn"), [["out", T("deal.doneOut")], ["cn", T("deal.doneCn")]]),
    one("payerIs", T("deal.payerIs"), [["person", T("deal.payerPerson")], ["company", T("deal.payerCompany")]])));
  form.append(el("p", "whint", T("deal.doneWhy")));

  form.append(el("p", "wlab", T("pay.plan")));
  const rows = [];
  for (let i = 0; i < 3; i++) {
    const r = el("div", "prowset");
    const lab = el("input"); lab.placeholder = i === 0 ? T("deal.deposit") : T("pay.rowLabel");
    const amt = el("input"); amt.placeholder = T("pay.rowAmount");
    const due = el("input"); due.placeholder = T("pay.rowDue");
    r.append(lab, amt, due);
    rows.push([lab, amt, due]);
    form.append(r);
  }

  const go = el("button", "wgo", T("deal.write"));
  go.type = "button";
  go.addEventListener("click", async () => {
    const v = (n) => (form.querySelector(`[name="${n}"]`)?.value || "").trim();
    const deal = {
      title: v("title"), hires: v("hires"), provides: v("provides"),
      what: v("title"), when: v("when"), where: v("where"), fee: v("fee"), deposit: v("deposit"),
      doneIn: v("doneIn"), payerIs: v("payerIs"), cur: v("cur"),
      plan: rows.map(([l, a, d]) => ({ label: l.value.trim(), amount: a.value.trim(), due: d.value.trim() }))
        .filter((r) => r.amount),
    };
    if (deal.hires === deal.provides) { go.textContent = T("deal.sides"); return; }
    go.disabled = true;
    const res = await fetch("/api/group/deal", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ device, group: g.id, deal }),
    });
    if (res.ok) load(); else { go.disabled = false; go.textContent = T("deal.sides"); }
  });
  form.append(go);
  form.append(el("p", "whint", T("deal.clears")));

  const holder = el("div");
  holder.append(open, form);
  return holder;
}

/** WHAT THE TWO OF THEM SAID, ON ONE PAGE, PRINTABLE.
 *
 *  Both statements with their dates, the row it belongs to, and where the
 *  money was sent. It is called a receipt and never an invoice: this board
 *  issued nothing, sold nothing and saw no money — and a page that implies
 *  otherwise is the one somebody will wave at a tax office.
 */
function showReceipt(g, d, i, claim, okd) {
  const row = d.plan[i];
  const when = (at) => new Date(at).toLocaleDateString(undefined,
    { day: "numeric", month: "short", year: "numeric" });
  const back = el("div", "rsheet");
  const card = el("div", "rcard");
  card.append(el("p", "rlab", T("pay.rTitle")));
  if (d.title) card.append(el("h3", "rtitle", d.title));
  const dl = el("dl", "rrows");
  const put = (k, v) => { if (v) dl.append(el("dt", null, k), el("dd", null, v)); };
  put(T("pay.rFor"), row.label || T("pay.plan"));
  /* WHAT THE MONEY WAS FOR, in the words of the job rather than the row. A
     bank asked to release a payment wants to see the service, and "Deposit"
     on its own is not one. */
  put(T("pay.rWork"), d.what || "");
  if (d.doneIn) put(T("deal.doneIn"), T(d.doneIn === "cn" ? "deal.doneCn" : "deal.doneOut"));
  put(T("pay.rAmount"), row.amount);
  put(T("pay.rFrom"), d.hires);
  put(T("pay.rTo"), d.provides);
  if (d.payTo) { try { put(T("pay.rWhere"), new URL(d.payTo).hostname); } catch { /* not a link any more */ } }
  card.append(dl);
  const said = el("div", "rsaid");
  said.append(el("p", "rk", T("pay.rSaid")));
  said.append(el("p", null, T("pay.claimed", { who: claim.who, when: when(claim.at) })));
  said.append(el("p", null, T("pay.confirmed", { who: okd.who, when: when(okd.at) })));
  card.append(said);
  card.append(el("p", "rlaw", T("pay.rNotTax")));

  const acts = el("div", "racts");
  const print = el("button", "go", T("pay.print"));
  print.type = "button";
  print.addEventListener("click", () => window.print());
  const shut = el("button", "", T("pay.close"));
  shut.type = "button";
  shut.addEventListener("click", () => back.remove());
  acts.append(print, shut);
  card.append(acts);

  back.addEventListener("click", (e) => { if (e.target === back) back.remove(); });
  back.append(card);
  document.body.append(back);
}

/* THE PLATFORM'S TWO PER CENT.
 *
 * Deliberately the plainest thing on the card and never folded into the plan:
 * a fee that looks like one of the rows the two of them wrote is a fee that
 * got in without being read. It says whose it is, what it is a percentage of,
 * and where it goes.
 *
 * WHEN THE FEE COULD NOT BE READ there is no figure, and the row says "2% of
 * the fee" rather than a number somebody's software invented. See readMoney in
 * lib/store.js for what counts as readable.
 */
function feePart(g, d) {
  const f = g.fee;
  const wrap = el("div", "dfee");
  const when = (at) => new Date(at).toLocaleDateString(undefined,
    { day: "numeric", month: "short" });
  const said = (kind) => (f.paid || []).filter((r) => r.kind === kind);
  const claim = said("claimed")[0];
  const okd = said("confirmed")[0];
  const no = said("denied").slice(-1)[0];

  const r = el("div", "prow");
  r.append(el("span", "pwhat", T("fee.row", { pct: f.pct })),
           el("span", "pamt", f.amount || T("fee.ofFee", { pct: f.pct })));
  r.append(el("span", "pchip" + (okd ? " on" : claim ? " half" : ""),
    okd ? T("pay.paidChip") : claim ? T("pay.waitingChip") : T("pay.dueChip")));

  for (const [row, key] of [[claim, "pay.claimed"], [okd, "fee.confirmed"], [no, "fee.denied"]]) {
    if (!row) continue;
    /* A row the payment page wrote has no name in it, so it gets its own
       sentence rather than "undefined confirmed it arrived". */
    const say = row.auto ? "fee.cleared" : key;
    r.append(el("p", "psaid", T(say, { who: row.who, when: when(row.at) })));
  }

  const acts = el("div", "pacts");
  if (g.meHandle === d.hires && !claim) {
    const b = el("button", "go", T("pay.iPaid"));
    b.type = "button";
    b.addEventListener("click", async () => {
      b.disabled = true;
      const res = await fetch("/api/group/deal/fee", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ device, group: g.id, kind: "claimed" }),
      });
      if (res.ok) load(); else b.disabled = false;
    });
    acts.append(b);
  }
  /* Confirming is staff's. STAFF is the reader's own flag, not a fact about
     anybody else in the room, so hiding the button from everyone else gives
     nothing away. The route checks it again regardless. */
  if (claim && !okd && STAFF) {
    const b = el("button", "go", T("pay.arrived"));
    b.type = "button";
    b.addEventListener("click", async () => {
      b.disabled = true;
      const res = await fetch("/api/group/deal/fee", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ device, group: g.id, kind: "confirmed" }),
      });
      if (res.ok) load(); else b.disabled = false;
    });
    acts.append(b);
  }
  if (acts.children.length) r.append(acts);
  wrap.append(el("p", "plab", T("fee.lab")), r);

  const line = el("p", "plink");
  line.append(document.createTextNode(T("fee.payAt", { where: new URL(f.to).hostname }) + " "));
  const a = el("a", "", T("fee.open"));
  a.href = f.to; a.target = "_blank"; a.rel = "noopener noreferrer";
  line.append(a);
  wrap.append(line);
  wrap.append(el("p", "pnote", T("fee.what", { pct: f.pct })));
  return wrap;
}

/* WHICH WAY THE MONEY SHOULD GO.
 *
 * Shown only where the border is actually crossed — g.route is empty
 * otherwise, and two people in the same place do not need a lecture on
 * foreign exchange.
 *
 * The "never split a payment" line is under every route rather than only the
 * ones with a cap in them. It is the one mistake here that is somebody's own
 * name on a bank's report, and a warning that appears only sometimes is a
 * warning people learn to scroll past.
 */
function routePart(g, d) {
  const wrap = el("div", "droute");
  wrap.append(el("p", "plab", T("route.lab")));
  wrap.append(el("p", "rsay", T("route." + g.route)));
  wrap.append(el("p", "rnever", T("route.never")));
  wrap.append(el("p", "pnote", T("route.notAdvice")));
  return wrap;
}

/* HOW THEY WANT TO PAY.
 *
 * Asked on this board rather than left to whatever the payee's page happens to
 * offer, because for a mainland payer the answer is the whole question: WeChat
 * and Alipay are what they have, and a page that opens on a card form is a
 * page they close.
 *
 * WHAT IT DOES WITH THE ANSWER, today: hands it to the payment page as a
 * `method` on the query string and lets that page decide. Stripe Checkout
 * reads exactly this and opens on the method asked for. A page that ignores it
 * loses nothing — the payer picks again there, which is where they would have
 * had to pick anyway.
 *
 * ONE SCREEN AND NO STEP ADDED, because without it they arrive at a stranger's
 * checkout and hunt. Three rows, the order a mainland payer expects, and the
 * line underneath says the one thing that matters: the money is not coming
 * here.
 */
function payoutSetup(g) {
  const wrap = el("div", "dwait");
  wrap.append(document.createTextNode(T("pay.setUp") + " "));
  const b = el("button", "linky", T("pay.setUpGo"));
  b.type = "button";
  b.addEventListener("click", async () => {
    b.disabled = true;
    try {
      const r = await fetch("/api/pay/onboard", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ device }),
      });
      const j = r.ok ? await r.json() : null;
      if (j?.url) { location.href = j.url; return; }
    } catch { /* below */ }
    b.disabled = false;
    b.textContent = T("pay.setUpNo");
  });
  wrap.append(b);
  return wrap;
}

/* Stripe's script, fetched the first time somebody presses a payment method
   and never before. A board that loads it on every room view is a board
   telling js.stripe.com who is reading which room, all day, for nothing.
   The promise is dropped on failure so a second press can try again — on a
   phone that changed network between the two presses, it will work. */
let stripeJs = null;
function loadStripeJs() {
  if (window.Stripe) return Promise.resolve(window.Stripe);
  if (stripeJs) return stripeJs;
  stripeJs = new Promise((ok, no) => {
    const tag = document.createElement("script");
    tag.src = "https://js.stripe.com/v3/";
    tag.async = true;
    tag.onload = () => (window.Stripe ? ok(window.Stripe) : no(new Error("no Stripe")));
    tag.onerror = () => no(new Error("blocked"));
    document.head.append(tag);
  });
  stripeJs.catch(() => { stripeJs = null; });
  return stripeJs;
}

/* THE PAYMENT, IN THE ROOM.
 *
 * What this replaces: location.href = session.url, which sent the payer to
 * checkout.stripe.com. For a payer in mainland China that is a foreign domain
 * appearing in the middle of a deal — unrecognised at best, unreachable at
 * worst — and it is the single thing Tom asked not to happen: the payment has
 * to be in the app.
 *
 * What is still Stripe's: the form inside the frame. WeChat Pay is a QR code
 * on a desktop and a handoff into the WeChat app on a phone; Alipay is a third
 * flow again. Reimplementing that with our own fields would be three untested
 * flows on three platforms handling other people's money.
 *
 * IF THE FRAME CANNOT LOAD the payer is not stranded. js.stripe.com blocked,
 * an ad blocker, a dead network — all land in the same place, which offers the
 * payee's own page instead. That is what the board did before Connect existed
 * and it still works.
 */
async function payFrame({ secret, pk, row, d, to, how, demo }) {
  const frame = el("div", "pframe");

  const head = el("div", "phead");
  head.append(el("b", null, (row && row.label) || d.title || ""));
  if (row && row.amount) head.append(el("span", "psub", row.amount));
  const back = el("button", "pback", T("pay.frameBack"));
  back.type = "button";
  head.append(back);

  const slot = el("div", "pslot");
  const wait = el("p", "pwait", T("pay.frameWait"));
  slot.append(wait);

  const note = el("p", "pnote", T("pay.frameNote", { who: d.provides }));
  frame.append(head, slot, note);
  document.body.append(frame);

  let mounted = null;
  const shut = () => {
    /* destroy() before the node goes, or Stripe keeps a listener on an iframe
       that is no longer in the document and warns on the next mount. */
    try { if (mounted) mounted.destroy(); } catch { /* already gone */ }
    frame.remove();
    /* Came back from a payment: ask the server what it thinks rather than
       trusting the screen. The webhook may have landed while the frame was up. */
    load();
  };
  back.addEventListener("click", shut);

  /* Offered when the frame cannot come up. Not a dead end and not an apology —
     one button that pays the same person the old way. */
  const stuck = () => {
    slot.textContent = "";
    const box = el("div", "pwait");
    box.append(el("b", null, T("pay.frameBlocked")));
    box.append(el("span", null, T("pay.frameWhy", { who: d.provides })));
    if (to) {
      const go = el("button", "", T("pay.frameGo"));
      go.type = "button";
      go.addEventListener("click", () => {
        window.open(to, "_blank", "noopener,noreferrer");
        shut();
      });
      box.append(go);
    }
    slot.append(box);
  };

  if (demo) {
    /* THE STAND-IN, AND IT SAYS SO. Not a payment screen pretending to be
       one: it names the method, says what Stripe draws in this space, and
       says in the same breath that nothing here takes money. The point is to
       be able to judge the frame — the heading, the amount, the way out, the
       line at the bottom — which is the part that is ours. */
    wait.remove();
    const box = el("div", "pdemo");
    box.append(el("b", null, T("pay." + (how || "card"))));
    box.append(el("span", null, T("pay.demoHere")));
    box.append(el("em", null, T("pay.demoNot")));
    slot.append(box);
    return;
  }

  try {
    const Stripe = await loadStripeJs();
    mounted = await Stripe(pk).initEmbeddedCheckout({ clientSecret: secret });
    wait.remove();
    mounted.mount(slot);
  } catch (err) {
    stuck();
  }
}

function payHow(g, d, row, to) {
  const back = el("div", "rsheet");
  const card = el("div", "rcard");
  card.append(el("p", "rlab", T("pay.how")));
  if (row) card.append(el("h3", "rtitle", (row.label || "") + " · " + (row.amount || "")));

  const ways = el("div", "ways");
  const way = (key, name, why) => {
    const b = el("button", "way");
    b.type = "button";
    b.append(el("b", null, name), el("span", null, why));
    b.addEventListener("click", async () => {
      /* THROUGH CONNECT WHERE IT CAN BE. The board asks Stripe for a checkout
         in the method they just picked, and the money goes to the payee's own
         account with the board's cut taken on the way past. Where it cannot —
         a mainland payee, or a plan whose amounts are words — this is the
         payee's own page with the method on the query string, which is what
         everybody had before. */
      if (g.pay === "stripe" && row) {
        b.disabled = true;
        try {
          const r = await fetch("/api/pay/start", {
            method: "POST", headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ device, group: g.id, i: row.i, method: key }),
          });
          const j = r.ok ? await r.json() : null;
          if (j?.secret && j?.pk) {
            back.remove();
            payFrame({ secret: j.secret, pk: j.pk, row, d, to, how: key });
            return;
          }
          /* A board stood up for a look, with no Stripe behind it. Every
             guard on the route still ran to get here. */
          if (j?.demo) {
            back.remove();
            payFrame({ demo: true, row, d, to, how: key });
            return;
          }
        } catch { /* fall through to the link */ }
        b.disabled = false;
      }
      let url = to;
      try {
        const u = new URL(to);
        u.searchParams.set("method", key);
        url = u.href;
      } catch { /* not a URL we can add to; send them as-is */ }
      if (!url) { back.remove(); return; }
      window.open(url, "_blank", "noopener,noreferrer");
      back.remove();
    });
    ways.append(b);
  };
  way("wechat", T("pay.wechat"), T("pay.wechatWhy"));
  way("alipay", T("pay.alipay"), T("pay.alipayWhy"));
  way("card", T("pay.card"), T("pay.cardWhy"));
  card.append(ways);
  card.append(el("p", "rnote", T("pay.howNote", { who: d.provides })));

  const acts = el("div", "racts");
  const no = el("button", "", T("pay.cancel"));
  no.type = "button";
  no.addEventListener("click", () => back.remove());
  acts.append(no);
  card.append(acts);

  back.append(card);
  back.addEventListener("click", (e) => { if (e.target === back) back.remove(); });
  document.body.append(back);
}

function payPart(g, d) {
  const wrap = el("div", "dpay");
  wrap.append(el("p", "plab", T("pay.plan")));
  const when = (at) => new Date(at).toLocaleDateString(undefined,
    { day: "numeric", month: "short" });
  const meHires = g.meHandle && g.meHandle === d.hires;
  const mePaid = g.meHandle && g.meHandle === d.provides;
  const said = (i, kind) => (d.paid || []).filter((r) => r.i === i && r.kind === kind);

  d.plan.forEach((row, i) => {
    const r = el("div", "prow");
    r.append(el("span", "pwhat", row.label || T("pay.plan")), el("span", "pamt", row.amount));
    if (row.due) r.append(el("span", "pwhen", T("pay.due", { when: row.due })));

    const claim = said(i, "claimed")[0];
    const okd = said(i, "confirmed")[0];
    const no = said(i, "denied").slice(-1)[0];
    const chip = el("span", "pchip" + (okd ? " on" : claim ? " half" : ""),
      okd ? T("pay.paidChip") : claim ? T("pay.waitingChip") : T("pay.dueChip"));
    r.append(chip);

    /* WHO SAID WHAT, in sentences with dates on them. A tick would lose the
       date, and the date is the half of this that settles arguments. */
    for (const [row2, key] of [[claim, "pay.claimed"], [okd, "pay.confirmed"], [no, "pay.denied"]]) {
      if (row2) r.append(el("p", "psaid", T(key, { who: row2.who, when: when(row2.at) })));
    }
    if (claim && okd) r.append(el("p", "psaid", T("pay.bothSaid")));

    const acts = el("div", "pacts");
    const tap = (kind, label, klass) => {
      const b = el("button", klass || "", label);
      b.type = "button";
      b.addEventListener("click", async () => {
        b.disabled = true;
        const res = await fetch("/api/group/deal/paid", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ device, group: g.id, i, kind }),
        });
        if (res.ok) load(); else b.disabled = false;
      });
      acts.append(b);
    };
    /* PAY COMES BEFORE "I PAID THIS", because that is the order it happens in.
       The first version offered only the claim, so the payer's one button on
       an unpaid row was a button that recorded a payment they had not made
       yet — and the thing they actually wanted was a link further down the
       card. */
    if (meHires && !claim && (g.pay === "stripe" || d.payTo)) {
      const b = el("button", "go", T("pay.go"));
      b.type = "button";
      b.addEventListener("click", () => payHow(g, d, { ...row, i }, d.payTo));
      acts.append(b);
    }
    /* Secondary now that Pay is the blue one: recording a payment is what you
       do after making it, not instead. */
    if (meHires && !claim) tap("claimed", T("pay.iPaid"));
    if (mePaid && claim && !okd) { tap("confirmed", T("pay.arrived"), "go"); if (!no) tap("denied", T("pay.notYet")); }

    /* A REMINDER SENT BY A PERSON, not by a clock — the due dates here are
       words, and a date this board guessed at is one it will be wrong about at
       seven in the morning. Once a day, and only by whoever is waiting. */
    if (mePaid && !okd) {
      const last = (d.nudges || []).filter((n) => n.i === i).slice(-1)[0];
      const soon = last && Date.now() - Date.parse(last.at) < 20 * 3600 * 1000;
      const b = el("button", "", soon ? T("pay.tooSoon") : T("pay.remind"));
      b.type = "button";
      b.disabled = Boolean(soon);
      b.addEventListener("click", async () => {
        b.disabled = true;
        const res = await fetch("/api/group/deal/nudge", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ device, group: g.id, i }),
        });
        b.textContent = res.ok ? T("pay.reminded") : T("pay.tooSoon");
      });
      acts.append(b);
    }

    /* THE RECEIPT IS THE TWO STATEMENTS, PRINTED. Not an invoice: nothing here
       was issued by a seller or seen by a tax office, and calling it one would
       be the most quietly expensive word on the screen. */
    if (okd) {
      const b = el("button", "", T("pay.receipt"));
      b.type = "button";
      b.addEventListener("click", () => showReceipt(g, d, i, claim, okd));
      acts.append(b);
    }
    if (acts.children.length) r.append(acts);
    wrap.append(r);
  });

  /* WHERE IT IS SENT.
     Only when the payment does NOT happen here. Once Connect is behind the
     Pay button the money goes through the app, and a line underneath saying
     "pay them at wise.com — paying happens on their page, not here" is the
     opposite of what the button above it does. Two instructions, contradicting
     each other, on the screen where somebody is about to send ¥30,000.
     The payee's own field is further down and stays either way: it is their
     fallback, and for a payee in the mainland it is still the only route. */
  if (g.pay === "stripe") {
    wrap.append(el("p", "phint", T("pay.inApp", { who: d.provides })));
  } else if (d.payTo) {
    const line = el("p", "plink");
    line.append(document.createTextNode(T("pay.payVia", { who: d.provides, where: new URL(d.payTo).hostname }) + " "));
    const a = el("a", null, T("pay.open"));
    a.href = d.payTo;
    a.target = "_blank";
    a.rel = "noopener noreferrer nofollow";
    line.append(a);
    wrap.append(line);
    if (meHires && d.payToAt) {
      const old = Date.now() - Date.parse(d.payToAt) > 7 * 864e5;
      if (!old) wrap.append(el("p", "pwarn", T("pay.linkChanged", { when: when(d.payToAt) })));
    }
    wrap.append(el("p", "phint", T("pay.leaves")));
  } else if (meHires) {
    wrap.append(el("p", "phint", T("pay.noLink", { who: d.provides })));
  }

  if (mePaid) {
    const set = el("div", "pset");
    const input = el("input");
    input.type = "url";
    input.placeholder = "https://paypal.me/…";
    input.value = d.payTo || "";
    input.setAttribute("aria-label", T("pay.setLink"));
    const save = el("button", null, T("pay.save"));
    save.type = "button";
    save.addEventListener("click", async () => {
      save.disabled = true;
      const res = await fetch("/api/group/deal/payto", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ device, group: g.id, link: input.value.trim() }),
      });
      if (res.ok) load(); else save.disabled = false;
    });
    set.append(input, save);
    wrap.append(set);
    wrap.append(el("p", "phint", T("pay.linkHint")));
  }
  return wrap;
}

function paintRoom(g) {
  $("title").textContent = g.name || nameOf(g);
  $("sub").textContent = T("grp.inIt", { n: g.who.length });
  const box = $("screen");
  fill(box);

  const act = $("topact");
  /* ⋯ AND NOT "ADD". Add is one of the things behind it, not the only one,
     and ⋯ in the top right of a chat is the gesture everybody already has. */
  act.hidden = false;
  act.textContent = "\u22EF";
  act.setAttribute("aria-label", T("grp.info"));
  act.onclick = () => { INFO = true; ADDING = false; OUTING = false; paint(); };

  if (ADDING) { act.hidden = true; box.append(addScreen(g)); return; }
  if (INFO) { act.hidden = true; box.append(infoScreen(g)); return; }

  /* THE LEDGER, ACROSS THE TOP OF THIS ONE ROOM.
   *
   * Only the room the operator keeps by hand. In an ordinary room a panel
   * that says the same thing every visit is the app talking about itself over
   * the top of a conversation — the reason the fourth state came out of
   * drawMine on the feed. This room is about the thing the panel describes and
   * everybody in it was put here on purpose, so here it is the point rather
   * than an interruption.
   *
   * Three facts and no currency. See /api/groups for why the figure is not
   * here and what has to happen before it could be. */
  /* ONE OF THE TWO, NEVER BOTH. A hand-kept room is where the rewards pin is
     looked at before any real door sees it — so when the pin is on it takes
     the top of this room, and the bands panel steps aside. Two panels both
     telling somebody where they stand, disagreeing about the maths, is worse
     than either of them on its own. */
  /* THE MEMO, ABOVE EVERYTHING. It is pinned because it is the thing both
     sides will point at in three weeks, and a fact that has to be scrolled
     back to is a fact that gets remembered differently by each of them. */
  if (g.deal) box.append(dealPin(g));
  else if (g.who.filter((w) => !w.bot).length >= 2) box.append(dealWriter(g, box));

  const slot = el("div", "pinslot");
  if (g.hand) box.append(slot);
  if (g.hand) {
    pin().then((m) => (m ? m.mountLedgerPin(slot, "", device, g.id) : false))
      .then((on) => { if (!on && (LAYER || LEFT)) slot.replaceWith(ledger(g)); });
  }

  /* THE FACES USED TO BE HERE, as a row of chips over the first message.
     Knowing who is reading still matters — that note was right — but it is
     something you check, not something you need in front of you while you
     read. The count is in the line under the title, and the faces are one tap
     away behind ⋯, which is where a WeChat user looks for them. */

  // Which of Mo's six welcomes the last one used, so the next is never it.
  let lastWel = -1;
  for (const m of g.says) {
    /* WHAT HAPPENED TO THE ROOM, drawn as a line across it rather than as a
       bubble from Mo. It is not somebody talking — it is the room reporting
       itself, which is what every group chat on this phone does with a thin
       grey line in the middle and no avatar beside it. */
    /* Two of his lines are bubbles rather than a rule across the room: the
       welcome, and the nudge to write a page. Both are him talking to
       somebody. A group room never carries the nudge — it is the door
       rooms that hold people without a page — but the branch matches so
       the three rooms cannot drift. */
    if (m.evt && m.evt.kind !== "welcome" && m.evt.kind !== "page") {
      box.append(el("p", "evt", T("mo." + m.evt.kind, { who: m.evt.who })));
      continue;
    }
    // What he said to somebody is a bubble from him — see moSays.
    /* SIX WELCOMES, AND NO TWO RUNNING THE SAME. Five people walking in got
       five identical bubbles, which is the loudest "a machine did this" on
       the first screen anybody sees; one in six then put the same sentence
       under itself twice, which reads the same way. The slot the last one
       landed in is carried down the room — see moWelcome. */
    let said;
    if (m.evt && m.evt.kind === "page") {
      said = T("mo.page", { who: m.evt.who });
    } else if (m.evt) {
      const w = moWelcome(m.evt.who, m.id, lastWel);
      lastWel = w.at;
      said = w.text;
    } else said = saidIn(m);
    const row = el("div", "said" + (m.mine ? " mine" : ""));
    /* THE FACE BESIDE A LINE OPENS WHOEVER SAID IT.
     *
     * The same gesture as the members grid, in the place people actually
     * reach for it: a name you do not recognise says something, and the face
     * next to it is the thing under your thumb. It was the members screen or
     * nothing, which is two taps and a screen you have to know exists.
     *
     * Mo goes to /mo, a member to their page, and anybody without a handle —
     * a guest who has not made one — stays a plain face, because a tile that
     * leads to a 404 is worse than one that does nothing. */
    if (!m.mine) row.append(faceLink(m, face(m, "small")));
    const wrap = el("div");
    const bub = el("div", "bub");
    /* @somebody drawn as a mention. Never innerHTML — see at.js. */
    atText(bub, said, g.who.map((x) => x.handle).filter(Boolean));
    /* HIS LINES ARE TAPPABLE AND NOBODY ELSE'S ARE. He has a voice and it was
       only reachable inside his own panel, which is off. A person's message
       read aloud by a machine is a different and worse idea. */
    if (m.bot && said) hearMo(bub, said);
    wrap.append(bub);
    const meta = el("div", "meta");
    meta.append(el("span", null, (m.mine ? "" : (m.handle || "") + " · ") + when(m.at)));
    // Reporting the doorman to the doorman is not a thing anybody means to do.
    if (!m.mine && !m.bot) {
      if (m.reported) {
        meta.append(el("span", null, T("note.reported")));
      } else {
        const rep = el("button", "rep", T("grp.flag"));
        rep.type = "button";
        rep.addEventListener("click", async () => {
          const why = window.prompt(T("note.reportWhy"), "");
          if (why === null) return;
          rep.disabled = true;
          await fetch("/api/group/report", {
            method: "POST", headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ device, id: m.id, why }),
          }).catch(() => {});
          await load();
        });
        meta.append(rep);
      }
    }
    wrap.append(meta);
    row.append(wrap);
    box.append(row);
  }

  /* THE PRICE OF SPEAKING, WHERE THE COMPOSER WOULD BE.
   *
   * Somebody invited straight into this room is reading it with no name. The
   * conversation above is the reason they came and they have already had it;
   * what they have not done is say who they are. So the ask sits exactly where
   * the answer would go, and it is the same sentence the rest of the board
   * runs on rather than a sign-up form wearing its clothes.
   *
   * LEAVING IS STILL UNDER IT. A room you cannot walk out of is not a room. */
  if (g.guest) { box.append(joinBox()); box.append(leaveButton(g)); return box; }

  const c = el("div", "compose");
  const ta = document.createElement("textarea");
  ta.rows = 1;
  ta.maxLength = 600;
  ta.placeholder = T("grp.placeholder");
  /* @ somebody in the room — the same module the door rooms use, so the
     gesture is one gesture and not two that drift apart. */
  /* g.who already carries him — the doorman is in every room's `who` rather
     than in its members; see the note in /api/groups. So he is offered here
     without anything extra, and @ him works the way @ anybody does. */
  atPicker(ta, () => g.who.map((x) => x.handle).filter(Boolean));
  const send = el("button", null, T("note.send"));
  send.type = "button";
  send.addEventListener("click", async () => {
    const text = ta.value.trim();
    if (!text) { ta.focus(); return; }
    send.disabled = true;
    try {
      const r = await fetch("/api/group/say", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ device, group: g.id, text }),
      });
      const d = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(d.error || "no");
      ta.value = "";
      said.textContent = "";
      await load();
      // It went, and something came out of it — see stripContact.
      if (Array.isArray(d.took) && d.took.length) said.textContent = T("note.tookOut");
    } catch (e) {
      /* THE TEXT STAYS IN THE BOX, and now the reason is under it. Every
         refusal here was silent: the send button came back enabled, the line
         was still typed, and nothing on the screen said why it had not gone.
         A composer that quietly does nothing is one somebody presses four more
         times. */
      said.textContent = T(String(e.message) === "contact"
        ? "note.noContact" : "act.again");
    }
    send.disabled = false;
  });
  c.append(ta, send);
  box.append(c);
  const said = el("p", "saycsaid");
  box.append(said);

  return box;
}

/** The add screen. Over the room, not inside it: your people, then a box for
 *  a name. Both at once, because whoever you have in mind is already either a
 *  face on this board or a name in your phone and you know which. */
function addScreen(g) {
  const box = el("div", "addscreen");
  const list = el("div", "addlist");
  // Made before draw() so the invite row can put the cursor in it.
  const find = document.createElement("input");

  /* ONE BOX, AND IT SEARCHES BEFORE IT OFFERS TO INVITE.
   *
   * The two halves used to be separate: your people as rows, a line saying OR,
   * and a name box under it that looked nobody up. So typing "Keith" minted a
   * code for a stranger called Keith while the real Keith sat in the list
   * directly above it. Nobody should have to know which kind of person
   * somebody is before they start typing their name.
   *
   * IT SEARCHES YOUR MATCHES AND NOTHING ELSE. Every name on the board would
   * be a directory, and a directory of the people on here is the one thing
   * this board has never been — see the note over cleanPerson. The list is
   * already in the page; no name leaves it to ask a question.
   */
  /* THE LINK IS THE FIRST ROW AND IT IS ALWAYS THERE.
   *
   * "Add somebody to this room" means, nine times out of ten, sending a link
   * into WeChat. It was reachable — type a name, and if nobody on the board
   * matched it, an invite row appeared under the empty result — which put the
   * commonest thing behind a search that had to fail first. Nobody finds that.
   *
   * And it appeared ONLY when nothing matched, so a room with a Keith in it
   * had no way to invite a different Keith at all.
   *
   * So it is the top row of the screen, before the people, with the typed name
   * on it when there is one and an ask for it when there is not.
   */
  const inviteRow = (nm) => {
    const row = el("button", "pick invite");
    row.type = "button";
    row.append(el("span", "av new", "\uFF0B"),
      el("b", null, nm ? T("grp.inviteName", { name: nm }) : T("grp.inviteNew")),
      el("span", "tag", T("grp.invite")));
    /* THE NAME IS NOT NEEDED, so it is not asked for. This used to put the
       cursor back in the box instead of minting, on the grounds that the door
       greets them by name — but the door asks whoever arrives what their name
       is, and that is the one they keep. All the typed name ever bought was
       "Welcome, Ray" over "Welcome" on one screen, at the price of a button
       that appeared to do nothing. Typed, it still travels; blank, it mints. */
    row.addEventListener("click", () => { mint(g, nm, list); });
    return row;
  };

  const draw = (q) => {
    fill(list);
    const want = q.trim().toLowerCase();
    list.append(inviteRow(q.trim()));
    const inRoom = new Set((g.who || []).map((m) => m.who));
    const left = (CANADD || []).filter((c) => !inRoom.has(c.who));
    const hit = want
      ? left.filter((c) => (c.handle || "").toLowerCase().includes(want))
      : left;

    for (const c of hit) {
      const row = el("button", "pick");
      row.type = "button";
      const tag = el("span", "tag", T("grp.add"));
      row.append(face(c), el("b", null, c.handle), tag);
      row.addEventListener("click", async () => {
        row.disabled = true;
        try {
          const r = await fetch("/api/group/add", {
            method: "POST", headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ device, group: g.id, who: c.who }),
          });
          const d = await r.json().catch(() => ({}));
          if (!r.ok) throw new Error(d.error || "no");
          /* STRAIGHT BACK TO THE ROOM. Adding somebody is finished the moment
             it works, and the thing worth seeing is their name in the faces at
             the top — not this screen with one fewer row on it. */
          ADDING = false;
          INFO = false;
          await load();
        } catch (e) {
          tag.textContent = T(String(e.message) === "full" ? "grp.outFullWhy" : "act.again");
          row.disabled = false;
        }
      });
      list.append(row);
    }

    // Nothing typed and nobody left to add: say which of the two it is.
    if (!want && !left.length) {
      list.append(el("p", "saidline", T("grp.addAllIn")));
    }
  };

  box.append(el("p", "addlede", T("grp.addLede", { room: g.name || nameOf(g) })));
  find.className = "fld find";
  find.maxLength = 40;
  find.placeholder = T("grp.findName");
  find.addEventListener("input", () => draw(find.value));
  box.append(find);
  box.append(list);
  draw("");
  return box;
}

/* THE LINK NEVER CARRIES THE CODE. Same rule as the header's invite and the
   same reason: a forwarded link would otherwise be a way in.
   THE NAME IN IT IS OPTIONAL, and `nm` is "" when nobody typed one. */
function enterUrl(nm, d) {
  const q = [];
  if (nm) q.push("for=" + encodeURIComponent(nm));
  q.push("from=" + encodeURIComponent(d.from || ""));
  if (d.until) q.push("t=" + Math.round(Date.parse(d.until) / 1000));
  return location.origin + "/enter?" + q.join("&");
}

/** The message that travels beside the link. The same words either way; the
 *  nameless pair simply has no "{name} — " on the front of it. Four strings
 *  rather than a name substituted with an empty string, because "\u00a0— come into
 *  this" is what that comes out as in a chat window. */
function inviteWords(nm, d, url) {
  return T("grp.shared" + (IN_WECHAT ? "Wx" : "") + (nm ? "" : "No"),
    { name: nm, room: d.name || T("grp.roomPlain"),
      /* THE SEPARATOR IS A WORD OF THE LANGUAGE, not punctuation that
         travels. \u3001 between two English names reads as a typo in the
         middle of a message somebody is about to send a stranger. */
      who: (d.who || []).join(lang() === "zh" ? "\u3001" : ", "),
      url, code: d.code });
}

/** Minting the code for somebody who is nobody on this board yet. `nm` is
 *  whatever was typed in the box above, and "" is allowed.
 *  The row it was tapped from is replaced by what it made — see done(). */
async function mint(g, nm, list) {
  fill(list);
  const said = el("p", "saidline", T("note.sending"));
  list.append(said);
  try {
    const r = await fetch("/api/group-invite", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ device, group: g.id }),
    });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(d.error || "no");
    const url = enterUrl(nm, d);
    const words = inviteWords(nm, d, url);
    fill(list);
    list.append(done(nm, d, words, url));
    if (!IN_WECHAT && navigator.share) {
      /* THE LINK IN THE FIELD THAT BUILDS THE CARD — see public/share.js.
         This went as one blob with the address inside it, so the room a
         member was inviting somebody into arrived as a grey square. */
      sheet({ title: T("site.title"), words, url }).catch(() => {});
    } else copyText(words);
  } catch (e) {
    const why = String(e.message);
    fill(list);
    list.append(el("p", "saidline", T(why === "standing" ? "grp.outNoStanding"
      : why === "spent" ? "grp.outSpent"
      : why === "full" ? "grp.outFullWhy"
      : "act.again")));
  }
}

/** What the invite came out as: who it is for, the six characters in full,
 *  and a button that puts the whole message back on the clipboard. The code is
 *  shown rather than only copied — a clipboard that silently did nothing is
 *  the failure this screen cannot afford, and six characters read off a screen
 *  are a way round it. */
function done(nm, d, words, url) {
  const box = el("div", "outdone");
  box.append(el("p", "line", d.name
    ? T(nm ? "grp.outMade" : "grp.outMadeNo", { name: nm, room: d.name })
    : T(nm ? "grp.outMadePlain" : "grp.outMadePlainNo", { name: nm })));
  /* BOTH HALVES ON THE SCREEN. The code was shown and the link was not — it
     existed only inside what the button put on the clipboard — under a line
     telling somebody to send the code WITH the link. Nothing to check the
     message against, and nothing to fall back on if the clipboard silently
     did nothing, which is the failure this box was built for. */
  /* THE CODE FIRST. It is the half that opens the door and the half nobody
     can reconstruct; the link is the same address every time and is here to
     be checked, not read. */
  box.append(el("b", "code", d.code));
  box.append(el("p", "url", url));
  const again = el("button", "go", T("grp.outCopy"));
  again.type = "button";
  again.addEventListener("click", () => {
    again.textContent = T(copyText(words) ? "inv.copied" : "inv.copyNo", { code: d.code });
    setTimeout(() => { again.textContent = T("grp.outCopy"); }, 2400);
  });
  box.append(again);
  /* Its own class, and NOT .note, which on this page is already a message row
     — display:flex and a bottom border, neither of which this wants.
     And not .saidline either: `.outform .saidline` is the red one for a
     refusal, and in the room this box sits inside an .outform, so a plain
     instruction came out looking like an error. */
  box.append(el("p", "hint", T("grp.outSend")));
  return box;
}

/** Bringing in somebody who has no account. `picked` and `label` are read at
 *  the moment of pressing rather than passed in, because both change under it
 *  while this is on screen. */
/** The invite half of the CREATE screen, where the list above it is a
 *  multi-select for building a room rather than a search. In a room that
 *  already exists this is one row in addScreen's own list instead — see the
 *  note there.
 *
 *  `bare` used to make it the lower half of a panel; the add screen stopped
 *  needing that, and a parameter with one caller and one value is a mode
 *  nobody is in. */
function outsider(picked, label, group) {
  const box = el("div", "outside");
  const open = el("button", "outbtn", T("grp.outside"));
  open.type = "button";
  box.append(open);

  const form = el("div", "outform");
  form.hidden = true;
  const who = document.createElement("input");
  who.className = "fld";
  who.maxLength = 40;
  who.placeholder = T("grp.outsideName");
  const go2 = el("button", "go", T("grp.outsideGo"));
  go2.type = "button";
  const said = el("p", "saidline");
  form.append(who, go2, said);
  box.append(form);

  open.addEventListener("click", () => {
    form.hidden = !form.hidden;
    if (!form.hidden) who.focus();
  });

  go2.addEventListener("click", async () => {
    /* Blank is allowed here for the same reason it is allowed on the add
       screen — the door asks them their name. See the note over enterUrl. */
    const nm = who.value.trim();
    go2.disabled = true;
    said.textContent = "";
    try {
      const r = await fetch("/api/group-invite", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify(group
          ? { device, group }
          : { device, who: picked(), name: label() }),
      });
      const d = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(d.error || "no");
      const url = enterUrl(nm, d);
      const words = inviteWords(nm, d, url);
      /* Inside WeChat a page may not open a share sheet — the ⋯ menu is the
         only way — so the clipboard is the honest version there, as it is
         everywhere else this app shares something. */
      /* THE FORM IS REPLACED BY WHAT IT MADE, and this is not decoration.
         It used to call load() on success, which repaints the screen and
         rebuilds this row shut — so the code was minted, the message was on
         the clipboard, and the screen said nothing at all. The next thing
         anybody does with a button that appears to have done nothing is press
         it again, and the second press spends the day's other code. */
      form.replaceWith(done(nm, d, words, url));
    } catch (e) {
      const why = String(e.message);
      said.textContent = T(why === "standing" ? "grp.outNoStanding"
        : why === "spent" ? "grp.outSpent"
        : why === "full" ? "grp.outFullWhy"
        : why === "alone" ? "grp.outAlone"
        : "act.again");
    }
    go2.disabled = false;
  });
  return box;
}

/* THE TWO HALVES OF THE SENTENCE, and the same two lists room.html offers.
   Copied rather than shared because these are three small files that do not
   import each other; if a role is ever added it goes in three places and this
   comment is where somebody finds that out. */
const MAKE = ["director", "writer", "performer", "crew", "founder", "maker", "student"];
const BACK = ["agent", "producer", "brand", "buyer", "distributor",
              "investor", "lawyer", "recruiter"];

/** A name and one sentence, which is everything this board asks anybody for.
 *  The article comes with the word — see the note in room.html — so the list
 *  reads "a Director / an Agent / Crew" and the sentence reads correctly for
 *  all three. */
function joinBox() {
  const box = el("div", "joinbox");
  box.append(el("p", "ask", T("grp.joinAsk")));

  const name = document.createElement("input");
  name.className = "fld";
  name.maxLength = 40;
  name.placeholder = T("grp.joinName");
  box.append(name);

  const sel = (now) => {
    const sl = document.createElement("select");
    for (const [head, keys] of [["say.make", MAKE], ["say.back", BACK]]) {
      const g = document.createElement("optgroup");
      g.label = T(head);
      for (const k of keys) {
        const o = el("option", null, T("role.a." + k));
        o.value = k;
        if (k === now) o.selected = true;
        g.append(o);
      }
      sl.append(g);
    }
    return sl;
  };
  const mine = sel("director"), want = sel("agent");
  const line = el("div", "sent");
  line.append(el("span", null, T("say.iam")), mine,
              el("span", null, T("say.lookingFor")), want);
  box.append(line);

  const go2 = el("button", "go", T("grp.joinGo"));
  go2.type = "button";
  const said = el("p", "saidline");
  go2.addEventListener("click", async () => {
    const handle = name.value.trim();
    /* THE NAME IS THE ONLY THING THAT CAN BE MISSING. Both halves of the
       sentence start on a real answer, so the one way to press this with
       nothing in it is to leave the name blank. Focus rather than a message:
       the box is right there and an error under it says less than the cursor
       being in it does. */
    if (!handle) { name.focus(); return; }
    go2.disabled = true;
    said.textContent = "";
    try {
      const r = await fetch("/api/me", {
        method: "PUT", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ device, handle, looking: true,
                               say: [{ me: mine.value, want: want.value }] }),
      });
      const d = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(d.error || "no");
      // The room redraws with them in it and a composer where this box was.
      await load();
      return;
    } catch (e) {
      /* THE ONE REFUSAL WORTH ITS OWN WORDS. A name with a phone number or a
         WeChat id in it is turned down by the server on purpose — see
         contactShaped — and "try again" would send somebody round the same
         loop for ever. */
      said.textContent = T(String(e.message) === "contact" ? "grp.joinNoContact" : "act.again");
    }
    go2.disabled = false;
  });
  box.append(go2, said);
  return box;
}

/* Whether the grid is a list of faces or a list of people to take out. Off
   every time the screen is opened: a destructive mode that is remembered is a
   destructive mode somebody walks back into. */
let OUTING = false;

/** Taking somebody out. Asked first, because there is no undo on this screen
 *  and putting them back means a code and a message — see /api/group/out. */
async function takeOut(g, handle) {
  if (!window.confirm(T("grp.outSure", { who: handle }))) return;
  try {
    const r = await fetch("/api/group/out", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ device, group: g.id, who: handle }),
    });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(d.error || "no");
    /* A room of two, minus one, is no room — the server says so and the screen
       has to agree rather than repaint an id that is gone. */
    if (d.gone) { OPEN = ""; INFO = false; }
    OUTING = false;
    await load();
  } catch { window.alert(T("act.again")); }
}

/** WHO IS IN IT, AND THE WAY OUT — one page, behind ⋯.
 *
 *  A grid of faces with a ＋ tile at the end, the same shape as the one in a
 *  WeChat group. The ＋ is only there for the room's maker: membership is
 *  drawn from their matches and the route refuses anybody else, and a tile
 *  that is drawn and refuses is worse than one that is not there. */
function infoScreen(g) {
  const box = el("div", "info");
  const grid = el("div", "faces" + (OUTING ? " outing" : ""));
  for (const m of g.who) {
    /* IN OUT MODE EVERY FACE IS A BUTTON THAT REMOVES, and only then. A room
       where a face always removes is a room where somebody removes a person by
       mis-tapping while scrolling — which is the one mistake here that cannot
       be undone from this screen. Same as WeChat: the － turns the grid into a
       thing you are choosing from, and the faces go back to being faces. */
    const can = OUTING && m.handle && !m.self && !m.bot;
    /* AND OTHERWISE IT OPENS THEIR PAGE.
     *
     * This grid was the one place on the board showing people who were not
     * tappable at all: four faces with names under them, and no way to find
     * out who any of them is. Somebody put in a room by a mutual friend has
     * the same question about everybody else in it that the whole board exists
     * to answer, and the answer was one tab away with no route to it.
     *
     * The mis-tap argument above is about REMOVING somebody and does not
     * reach this: opening a page is undone by the back arrow. So the grid is
     * faces you can read in the ordinary state and a thing you choose from in
     * out mode, which is the same two states it already had.
     *
     * MO GOES SOMEWHERE ELSE. He is not a member and /p/ would have nothing
     * to show, so his face opens /mo — what he is, what he can answer, and
     * what he will never do. That is the question a face in a room with no
     * page behind it was asking, and he was the only one of these that could
     * not be tapped at all.
     *
     * NOT A GUEST, though: somebody invited straight into the room has not
     * made a page yet, and a tile that leads to a 404 is worse than a tile
     * that does nothing. They arrive here with no handle. */
    const href = OUTING ? "" : faceHref(m);
    const cell = el(can ? "button" : href ? "a" : "div",
      "cell" + (can ? " out" : ""));
    if (can) cell.type = "button";
    if (href) cell.href = href;
    cell.append(face(m), el("span", null, m.handle));
    if (can) cell.addEventListener("click", () => takeOut(g, m.handle));
    grid.append(cell);
  }
  if (g.mine) {
    const add = el("button", "cell add");
    add.type = "button";
    add.append(el("span", "plus", "\uFF0B"), el("span", null, T("grp.addTop")));
    add.addEventListener("click", () => { OUTING = false; INFO = false; ADDING = true; paint(); });
    grid.append(add);
    /* THE OTHER HALF OF THE ＋, and beside it, which is where a WeChat group
       keeps it. Somebody put four people in a room and one of them turned out
       to be wrong for it; without this the only fix is abandoning the room. */
    if (g.who.filter((m) => m.handle && !m.self && !m.bot).length) {
      const out = el("button", "cell add");
      out.type = "button";
      out.append(el("span", "plus", "\uFF0D"),
        el("span", null, T(OUTING ? "grp.outDone" : "grp.outTop")));
      out.addEventListener("click", () => { OUTING = !OUTING; paint(); });
      grid.append(out);
    }
  }
  box.append(grid);
  if (OUTING) box.append(el("p", "hint", T("grp.outHow")));

  /* WHAT IS HOLDING THE OTHER SEATS.
   *
   * A code nobody has spent sits in one of the five until it runs out. Without
   * this a room of two refuses a third person and the only account of it is a
   * sentence about five people on a screen saying two — which reads as a bug,
   * and was one the first time somebody hit it. Here they are, by code, with
   * the way to stand one down. */
  const held = g.mine ? (g.held || []) : [];
  if (held.length) {
    box.append(el("p", "heldhead", T("grp.heldHead", { n: held.length })));
    for (const v of held) {
      const row = el("div", "heldrow");
      const left = el("div", "hm");
      left.append(el("b", null, v.code));
      left.append(el("span", null, v.until ? T("grp.heldTill", { when: when(v.until) })
                                           : T("grp.heldOpen")));
      const off = el("button", "heldoff", T("grp.heldOff"));
      off.type = "button";
      off.addEventListener("click", async () => {
        off.disabled = true;
        try {
          const r = await fetch("/api/group-invite/off", {
            method: "POST", headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ device, code: v.code }),
          });
          if (!r.ok) throw new Error("no");
          await load();
        } catch { off.textContent = T("act.again"); off.disabled = false; }
      });
      row.append(left, off);
      box.append(row);
    }
  }

  // The count is already under the title on this screen. Twice is noise.
  box.append(leaveButton(g));
  return box;
}

/** Walking out. Yours to take, guest or member, and the one control on this
 *  screen that is never conditional on anything. */
function leaveButton(g) {
  const out = el("button", "leave", T("grp.leave"));
  out.type = "button";
  out.addEventListener("click", async () => {
    if (!window.confirm(T("grp.leaveSure"))) return;
    out.disabled = true;
    await fetch("/api/group/leave", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ device, group: g.id }),
    }).catch(() => {});
    go("");
    await load();
  });
  return out;
}

$("back").addEventListener("click", () => {
  // Out of a room to the list, out of the list to the board. One button, and
  // it always goes back one step rather than off the page.
  if (PICKING) { PICKING = false; paint(); return; }
  if (ADDING) { ADDING = false; INFO = true; paint(); return; }
  if (INFO) { INFO = false; paint(); return; }
  if (OPEN) { go(""); return; }
  if (history.length > 1) history.back(); else location.href = "/feed";
});

setLang(pickLang());
$("langslot").append(langButton(paint));
load();

if (CAME_BACK) {
  /* Two looks, then stop. Stripe's webhook is normally in before the first;
     the second is for a slow one. Polling past that would be a room that
     never settles, and the row is one pull-to-refresh away anyway. */
  setTimeout(load, 2000);
  setTimeout(load, 6000);
  try {
    const u = new URL(location.href);
    u.searchParams.delete("paid");
    history.replaceState(null, "", u.pathname + u.search + u.hash);
  } catch { /* an address we cannot rewrite is one we can leave alone */ }
}
</script>
</body>
</html>
