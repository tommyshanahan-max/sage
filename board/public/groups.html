<style>
  :root{
    --paper:#EEF0F4; --raise:#F7F8FB; --ink:#151B28; --ink-2:#4E5968;
    --muted:#8A939F; --line:#E3E6EC; --hair:#EAECF1;
    --accent:#3F68D8; --accent-ink:#FFFFFF; --accent-soft:#E8ECF7;
    --t1:#3F68D8; --t2:#2A9D63; --t3:#D99038; --t4:#7268C4; --t5:#D4485C; --t6:#2F8C9E;
    --serif:Georgia,"Songti SC","Noto Serif CJK SC",'Times New Roman',serif;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",
      "Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;
    --shadow:0 2px 6px rgba(21,27,40,.07),0 10px 28px rgba(21,27,40,.09);
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --paper:#0B0E15; --raise:#141924; --ink:#E9EDF5; --ink-2:#A3B0C4;
      --muted:#6F7D92; --line:#232B39; --hair:#1E2531;
      --accent:#5C8DFF; --accent-ink:#0B0E15; --accent-soft:#18233D;
      --t1:#5C8DFF; --t2:#4EBE88; --t3:#E4A65A; --t4:#9187E0; --t5:#F0687C; --t6:#4FA9BC;
      --shadow:0 2px 6px rgba(0,0,0,.4),0 12px 32px rgba(0,0,0,.34);
    }
  }
  :root[data-theme="dark"]{
    --paper:#0B0E15; --raise:#141924; --ink:#E9EDF5; --ink-2:#A3B0C4;
    --muted:#6F7D92; --line:#232B39; --hair:#1E2531;
    --accent:#5C8DFF; --accent-ink:#0B0E15; --accent-soft:#18233D;
    --t1:#5C8DFF; --t2:#4EBE88; --t3:#E4A65A; --t4:#9187E0; --t5:#F0687C; --t6:#4FA9BC;
    --shadow:0 2px 6px rgba(0,0,0,.4),0 12px 32px rgba(0,0,0,.34);
  }
  :root[data-lang="zh"]{
    --serif:"Songti SC","Noto Serif CJK SC","Source Han Serif SC","STSong",Georgia,serif;
    --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB",
      "Microsoft YaHei","Noto Sans SC","Segoe UI",sans-serif;
  }
  :root[data-lang="zh"] body{line-height:1.75}
  :root[data-lang="zh"] .rule span,
  :root[data-lang="zh"] .fact dt{text-transform:none;letter-spacing:.02em}
  [hidden]{display:none!important}

  *{box-sizing:border-box}
  /* One size up, the same as everywhere else — see the note in index.html. */
  html{font-size:17px;-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);
    font-size:1rem;line-height:1.5;-webkit-font-smoothing:antialiased}
  main{max-width:34rem;margin:0 auto;padding:1.4rem 1.15rem 5rem}
  button{font:inherit;cursor:pointer}
  a{color:inherit}
  img{max-width:100%}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}

  .top{display:flex;align-items:center;gap:.8rem;margin:0 0 1.3rem}
  .top h1{margin:0;font-family:var(--serif);font-weight:400;font-size:1.75rem;line-height:1.1}
  .top p{margin:.15rem 0 0;font-size:.85rem;color:var(--muted)}
  .back{border:0;background:none;color:var(--ink);padding:.2rem;margin-left:-.3rem;
    display:grid;place-items:center;flex:0 0 auto}
  .back svg{width:1.5rem;height:1.5rem;stroke:currentColor;fill:none;stroke-width:1.8;
    stroke-linecap:round;stroke-linejoin:round}
  .lang{margin-left:auto;flex:0 0 auto;border:1px solid var(--line);background:var(--raise);
    color:var(--ink-2);border-radius:99px;padding:.42rem .9rem;font-size:.85rem;line-height:1}

  .rule{display:flex;align-items:center;gap:.9rem;margin:0 0 .3rem}
  .rule span{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;
    color:var(--muted);white-space:nowrap}
  .rule i{flex:1;height:1px;background:var(--line)}

  /* A person in the list. The same row the feed uses, so the two read as one
     product rather than two screens that happen to share a palette. */
  .who{display:flex;gap:.9rem;padding:1.2rem 0;border-bottom:1px solid var(--hair);
    width:100%;text-align:left;background:none;border-left:0;border-right:0;border-top:0;
    align-items:flex-start}
  .av{width:3.4rem;height:3.4rem;border-radius:50%;flex:0 0 auto;background:var(--accent);
    color:var(--accent-ink);display:grid;place-items:center;font-family:var(--serif);
    font-size:1.35rem;line-height:1;overflow:hidden;
    box-shadow:0 0 0 3px var(--paper),0 0 0 4px var(--accent-soft)}
  .av img{width:100%;height:100%;object-fit:cover;display:block}
  .m{flex:1;min-width:0}
  .nameline{display:flex;align-items:baseline;gap:.5rem}
  .nameline b{font-family:var(--serif);font-weight:400;font-size:1.15rem;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .nameline .lv{margin-left:auto;flex:0 0 auto;font-size:.72rem;letter-spacing:.05em;
    border:1px solid var(--line);border-radius:99px;padding:.16rem .55rem;color:var(--muted)}
  .where{margin:.15rem 0 0;font-size:.83rem;color:var(--muted)}
  .goal{margin:.45rem 0 0;font-family:var(--serif);font-size:1rem;line-height:1.5;
    color:var(--ink-2);overflow-wrap:anywhere}
  .days{display:flex;gap:.25rem;margin:.55rem 0 0;flex-wrap:wrap}
  .days b{width:1.75rem;height:1.75rem;display:grid;place-items:center;border-radius:.4rem;
    font-size:.72rem;font-weight:500;background:var(--paper);border:1px solid var(--line);
    color:var(--muted)}
  .days b.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

  .none{padding:3rem .5rem;text-align:center;color:var(--muted)}
  .none b{display:block;font-family:var(--serif);font-weight:400;font-size:1.3rem;
    color:var(--ink);margin:0 0 .4rem}
  .none p{margin:0 auto 1.3rem;max-width:26rem;font-size:.95rem;line-height:1.6}
  .none button{border:0;background:var(--accent);color:var(--accent-ink);border-radius:99px;
    padding:.75rem 1.6rem;font-size:1rem}

  .safety{margin:2rem 0 0;padding:.95rem 1.05rem;background:var(--raise);
    border:1px solid var(--line);border-left:3px solid var(--t3);border-radius:.6rem;
    font-size:.86rem;line-height:1.6;color:var(--ink-2)}

  /* A note. Two shapes, not one with a modifier: what somebody sent you is a
     thing to decide about, what you sent is a receipt. Making them look the
     same made a page where you could not tell at a glance which was which. */
  .note{padding:1.15rem 0;border-bottom:1px solid var(--hair);display:flex;gap:.9rem;
    align-items:flex-start}
  .note .m{flex:1 1 auto;min-width:0}
  .note .line{display:flex;align-items:baseline;gap:.5rem;flex-wrap:wrap}
  .note .line b{font-family:var(--serif);font-weight:400;font-size:1.08rem}
  .note .line time{margin-left:auto;font-size:.78rem;color:var(--muted);flex:0 0 auto}
  .note .text{margin:.45rem 0 0;font-family:var(--serif);font-size:1.02rem;line-height:1.55;
    overflow-wrap:anywhere;white-space:pre-wrap}
  .note.mine .text{color:var(--ink-2)}
  .note .acts{display:flex;gap:.5rem;margin:.75rem 0 0;flex-wrap:wrap}
  .note .acts button,.note .acts a{border:1px solid var(--line);background:var(--raise);
    color:var(--ink);border-radius:99px;padding:.5rem 1.05rem;font-size:.87rem;
    text-decoration:none;display:inline-block}
  .note .acts button.primary{background:var(--accent);border-color:var(--accent);
    color:var(--accent-ink)}
  .note .acts button.warn{color:var(--t5)}
  .note .said{margin:.55rem 0 0;font-size:.83rem;color:var(--muted)}
  .note .said.bad{color:var(--t5)}
  /* Unread. A dot rather than a colour wash: the message is what should be
     read, not the fact that it is new. */
  .dot{width:.55rem;height:.55rem;border-radius:50%;background:var(--accent);
    flex:0 0 auto;margin-top:.5rem}
  .dot.spent{background:transparent}
  a.av{color:var(--accent-ink);text-decoration:none}
  .av.small{width:2.8rem;height:2.8rem;font-size:1.1rem;box-shadow:none}

  /* Answering, in place. There is only ever one answer, so a sheet with its
     own screen would be more ceremony than the thing deserves. */
  .reply{margin:.75rem 0 0}
  .reply textarea{width:100%;min-height:5.5rem;resize:vertical;font:inherit;
    padding:.65rem .75rem;border-radius:.7rem;border:1px solid var(--line);
    background:var(--raise);color:var(--ink)}
  .reply .how{margin:.5rem 0 0;font-size:.82rem;line-height:1.55;color:var(--muted)}
</style>
<style>
  /* GROUPS. Two screens in one page: the list of rooms you are in, and one
     room open. A room is not worth its own route while there are three of
     them, and a page that changes what it shows without changing address is
     one back button rather than two. */

  /* THE PICKER, lifted in shape from Fern's Start a group: a collapsed button,
     then one row per person with a face, a name, and a word that changes when
     they are in. What is different here is who is in the list — only people
     who followed you back and share a room with you — and that difference is
     the whole safety story, so the note under the button says it. */
  .start{width:100%;margin:0 0 1.4rem;padding:.95rem 1rem;border:1px solid var(--accent);
    background:none;color:var(--accent);border-radius:99px;font-size:1rem}
  .picker{margin:0 0 1.6rem}
  .picker .lede{margin:.8rem 0 0;font-size:.92rem;line-height:1.6;color:var(--ink-2)}
  .pick{display:flex;width:100%;gap:.9rem;align-items:center;padding:.85rem 0;
    border:0;border-top:1px solid var(--hair);background:none;text-align:left}
  .pick:disabled{opacity:.4}
  .pick b{flex:1;min-width:0;font-family:var(--serif);font-weight:400;font-size:1.15rem;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  /* .tag AND NOT `.pick span`, WHICH IS WHAT IT WAS.
     The avatar is a <span> too, so `.pick span` painted the letter inside it
     --muted: rgb(138,147,159) on an accent-blue disc, measured. Every other
     face on the board is ink on its own colour; here the one screen whose
     whole job is picking people BY FACE had two grey smudges on it. The class
     is on the word, so the face is out of its reach. */
  .pick .tag{flex:0 0 auto;font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;
    color:var(--muted)}
  .pick.on .tag{color:var(--accent)}
  /* A ring rather than a filled disc: picked should not erase the face it is
     drawn over. Fern learned that one the hard way and wrote it down. */
  .pick.on .av{box-shadow:0 0 0 3px var(--paper),0 0 0 5px var(--accent)}
  .picker input{width:100%;margin:1.1rem 0 0;padding:.75rem .9rem;font:inherit;font-size:1rem;
    border:1px solid var(--line);border-radius:.7rem;background:var(--raise);color:var(--ink)}
  .picker .make{width:100%;margin:.7rem 0 0;padding:.8rem 1rem;border:0;border-radius:99px;
    background:var(--accent);color:var(--accent-ink);font-size:1rem}
  .picker .make:disabled{opacity:.45}
  .picker .limit{margin:.8rem 0 0;font-size:.82rem;line-height:1.6;color:var(--muted)}

  /* A room in the list. Faces stacked, because who is in it is the thing you
     recognise a room by long before its name. */
  .room{display:flex;width:100%;gap:.9rem;align-items:center;padding:1.1rem 0;
    border:0;border-bottom:1px solid var(--hair);background:none;text-align:left}
  .faces{display:flex;flex:0 0 auto}
  .faces .av{width:2.4rem;height:2.4rem;font-size:.95rem;margin-left:-.7rem;
    box-shadow:0 0 0 2px var(--paper)}
  .faces .av:first-child{margin-left:0}
  .room .m b{display:block;font-family:var(--serif);font-weight:400;font-size:1.15rem}
  .room .m p{margin:.15rem 0 0;font-size:.85rem;color:var(--muted);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .room .chev{margin-left:auto;color:var(--muted);font-size:1.3rem;flex:0 0 auto}

  /* THE ROOM ITSELF. Bubbles, oldest at the top, because that is what a
     conversation is and the inbox shape this page started from read as a pile
     of separate letters. */
  /* The room reporting itself: who came in, who went out. Centred and quiet —
     it is a fact between two people's sentences, not one of them. */
  .evt{margin:.9rem 0;text-align:center;font-size:.76rem;color:var(--muted)}
  .said{display:flex;gap:.6rem;margin:0 0 .9rem;align-items:flex-start}
  .said.mine{flex-direction:row-reverse}
  .said .av{width:2rem;height:2rem;font-size:.85rem;box-shadow:none}
  .bub{max-width:78%;padding:.6rem .85rem;border-radius:1.1rem;background:var(--raise);
    border:1px solid var(--line);font-size:1rem;line-height:1.5;overflow-wrap:anywhere;
    white-space:pre-wrap}
  .said.mine .bub{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
  /* One line under the bubble carrying everything small: who, when, and the
     way to report it. Reporting used to be its own line under every incoming
     message, which put a red-ish call to action beside every sentence anybody
     said — a room where every message is asking you whether to report it is
     not a room people relax in. */
  .said .meta{display:flex;gap:.45rem;align-items:baseline;margin:.3rem 0 0;
    font-size:.72rem;color:var(--muted)}
  .said.mine .meta{justify-content:flex-end}
  .said .rep{border:0;background:none;color:var(--muted);font-size:.72rem;padding:0;
    text-decoration:underline;text-underline-offset:2px;opacity:.75}
  .said .rep:hover{color:var(--t5);opacity:1}

  .compose{display:flex;gap:.6rem;align-items:flex-end;margin:1.4rem 0 0;
    position:relative}
  /* A name said at somebody, and the picker that puts it there. Over the box,
     because under it is where the phone's own keyboard is. */
  .bub .at{font-weight:600;color:var(--accent)}
  .said.mine .bub .at{color:inherit;text-decoration:underline;text-underline-offset:2px}
  .atmenu{position:absolute;bottom:100%;left:0;right:0;margin:0 0 .4rem;
    display:flex;flex-wrap:wrap;gap:.35rem;padding:.5rem;border-radius:.8rem;
    background:var(--raise);border:1px solid var(--line);
    box-shadow:0 10px 30px rgba(0,0,0,.12);z-index:30}
  .atmenu button{font:inherit;font-size:.85rem;padding:.35rem .7rem;border-radius:99px;
    border:1px solid var(--line);background:var(--paper);color:var(--ink);cursor:pointer}
  .compose textarea{flex:1;min-height:2.9rem;max-height:9rem;resize:vertical;font:inherit;
    padding:.65rem .8rem;border-radius:1rem;border:1px solid var(--line);
    background:var(--raise);color:var(--ink)}
  .compose button{flex:0 0 auto;border:0;border-radius:99px;background:var(--accent);
    color:var(--accent-ink);padding:.7rem 1.15rem;font-size:.95rem}
  .saycsaid{margin:.6rem 0 0;font-size:.85rem;line-height:1.55;color:var(--t5)}

  /* The join box. Deliberately the shape of the composer it replaces — same
     margin, same corner, same width — so the screen does not jump when
     somebody writes their name and the real composer takes its place. */
  .joinbox{margin:1.4rem 0 0;padding:1.1rem;border:1px solid var(--line);
    border-radius:1rem;background:var(--raise)}
  .joinbox .ask{margin:0 0 .9rem;font-size:.95rem;line-height:1.55;color:var(--ink)}
  .joinbox .fld{width:100%;font:inherit;font-size:1rem;padding:.6rem .75rem;
    border:1px solid var(--line);border-radius:.7rem;background:var(--paper);color:var(--ink)}
  /* A GRID AND NOT A WRAPPING LINE. Laid out as one flowing sentence it read
     "I am [a Director] looking for" and then dropped "[an Agent]" onto the
     next row on its own — the words of the sentence orphaned by the width of
     a select. Two rows of label-then-field keep it reading top to bottom as a
     sentence at every width, which is the thing that had to survive. */
  .joinbox .sent{display:grid;grid-template-columns:auto minmax(0,1fr);
    align-items:center;gap:.55rem .6rem;margin:.85rem 0 0}
  .joinbox .sent span{font-size:.95rem;color:var(--ink-2);white-space:nowrap}
  .joinbox select{width:100%;min-width:0;font:inherit;font-size:1rem;
    padding:.55rem .7rem;border:1px solid var(--line);border-radius:.7rem;
    background:var(--paper);color:var(--ink)}
  .joinbox .go{width:100%;margin:1.1rem 0 0;padding:.8rem;border:0;border-radius:99px;
    background:var(--accent);color:var(--accent-ink);font-size:1rem}
  .joinbox .go:disabled{opacity:.45}
  .joinbox .saidline{margin:.7rem 0 0;font-size:.85rem;color:var(--t5)}

  /* Shut until asked for. A name box sitting open under the list of people you
     matched with reads as a search field for them, which is the one thing it
     is not. */
  .outside{margin:1.3rem 0 0;padding:1rem 0 0;border-top:1px solid var(--hair)}
  .outbtn{width:100%;padding:.7rem;border:1px dashed var(--line);border-radius:.9rem;
    background:none;color:var(--accent);font:inherit;font-size:.95rem}
  /* An outline, not a fill. One solid button to a screen, and on this one it
     is Create group. */
  .outform .go{background:none;color:var(--accent);border:1px solid var(--accent)}
  /* The two answers to "who". Full width and stacked, because they are a
     question and not a toolbar. */
  .pickway{display:block;width:100%;margin:0 0 .6rem;padding:.8rem;border:1px solid var(--line);
    border-radius:.9rem;background:var(--paper);color:var(--ink);font:inherit;font-size:1rem;
    text-align:left}
  .outdone{margin:.9rem 0 0;padding:1rem;border:1px solid var(--line);
    border-radius:.9rem;background:var(--raise);text-align:center}
  .outdone .line{margin:0;font-size:.92rem;line-height:1.55;color:var(--ink)}
  .outdone .code{display:block;margin:.5rem 0 0;font-family:var(--serif);
    font-size:1.9rem;letter-spacing:.12em;color:var(--ink)}
  .orline{margin:1rem 0 .8rem;font-size:.78rem;letter-spacing:.08em;
    text-transform:uppercase;color:var(--muted);text-align:center}
  .addscreen{margin:.4rem 0 0}
  /* The member grid. Four across on a phone, which is what a roomful of five
     wants and what the eye reads as a group rather than as a list. */
  .info{margin:.4rem 0 0}
  .info .faces{display:grid;grid-template-columns:repeat(4,1fr);gap:1.1rem .6rem;margin:0 0 1.3rem}
  .info .cell{display:flex;flex-direction:column;align-items:center;gap:.45rem;
    background:none;border:0;padding:0;font:inherit;color:inherit;min-width:0}
  .info .cell span:last-child{font-size:.75rem;line-height:1.3;color:var(--muted);
    text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
  .info .cell .av{width:3.2rem;height:3.2rem;box-shadow:none}
  /* A face you are about to take out: the ring says it is a target, and the
     － tile is the only thing on this screen that turns it into one. */
  .faces.outing .cell.out .av{box-shadow:0 0 0 2px var(--t5)}
  .faces.outing .cell.out span:last-child{color:var(--t5)}
  .info .add .plus{width:3.2rem;height:3.2rem;border-radius:50%;display:grid;place-items:center;
    border:1px dashed var(--line);color:var(--muted);font-size:1.5rem;line-height:1}
  .info .leave{margin-top:.6rem}
  .heldhead{margin:0 0 .5rem;font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;
    color:var(--muted)}
  .heldrow{display:flex;align-items:center;gap:.8rem;padding:.7rem 0;
    border-bottom:1px solid var(--hair)}
  .heldrow .hm{flex:1;min-width:0}
  .heldrow .hm b{display:block;font-family:var(--serif);font-weight:400;font-size:1.15rem;
    letter-spacing:.08em}
  .heldrow .hm span{display:block;font-size:.78rem;color:var(--muted)}
  .heldoff{flex:0 0 auto;border:1px solid var(--line);background:none;color:var(--t5);
    border-radius:99px;padding:.35rem .8rem;font:inherit;font-size:.8rem}
  .addlede{margin:0 0 1.1rem;font-size:.92rem;line-height:1.6;color:var(--ink-2)}
  .addscreen .find{width:100%;font:inherit;font-size:1rem;padding:.7rem .85rem;
    border:1px solid var(--line);border-radius:.8rem;background:var(--raise);color:var(--ink)}
  .addscreen .find:focus{outline:none;border-color:var(--accent)}
  .addlist{margin:.8rem 0 0}
  .addlist .saidline{margin:1.2rem 0 0;font-size:.9rem;line-height:1.6;color:var(--muted)}
  .av.new{background:none;border:1px dashed var(--accent);color:var(--accent);font-size:1.4rem}
  /* One action in the header, beside the language switch. Text, not a filled
     button: the filled one on this screen is Send it. */
  .topact{margin-left:auto;flex:0 0 auto;border:1px solid var(--line);background:var(--raise);
    color:var(--ink-2);font:inherit;font-size:1.1rem;line-height:1;border-radius:99px;
    padding:.42rem .8rem}
  .topact + #langslot,.topact ~ #langslot{margin-left:.6rem}
  .outdone .go{width:100%;margin:.9rem 0 0;padding:.75rem;border:0;border-radius:99px;
    background:var(--accent);color:var(--accent-ink);font:inherit;font-size:1rem}
  .outdone .hint{margin:.7rem 0 0;font-size:.82rem;line-height:1.55;color:var(--muted)}
  /* Plain text, not a boxed field. It is there so the message can be checked
     and so there is something to read out when a clipboard fails; a bordered
     panel made it the loudest thing in a box whose point is six characters. */
  .outdone .url{margin:.5rem 0 0;font-size:.76rem;line-height:1.5;
    color:var(--muted);word-break:break-all}
  .outform{margin:.8rem 0 0}
  .outform .fld{width:100%;font:inherit;font-size:1rem;padding:.6rem .75rem;
    border:1px solid var(--line);border-radius:.7rem;background:var(--paper);color:var(--ink)}
  .outform .go{width:100%;margin:.7rem 0 0;padding:.75rem;border:0;border-radius:99px;
    background:var(--accent);color:var(--accent-ink);font-size:1rem}
  .outform .go:disabled{opacity:.45}
  .outform .saidline{margin:.7rem 0 0;font-size:.85rem;line-height:1.55;color:var(--t5)}

  .inroom{display:flex;gap:.5rem;flex-wrap:wrap;margin:0 0 1.2rem}
  .inroom span{font-size:.8rem;color:var(--muted);border:1px solid var(--line);
    border-radius:99px;padding:.28rem .7rem}
  .leave{margin:2rem 0 0;width:100%;padding:.7rem;border:1px solid var(--line);
    background:none;color:var(--t5);border-radius:99px;font-size:.9rem}
</style>

</head>
<body>
<main>
  <div class="top">
    <button class="back" id="back" aria-label="Back">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 19l-7-7 7-7"/></svg>
    </button>
    <div>
      <h1 id="title"></h1>
      <p id="sub"></p>
    </div>
    <button class="topact" id="topact" type="button" hidden></button>
    <span id="langslot"></span>
  </div>

  <div id="screen"></div>
  <p class="safety" id="safety"></p>
</main>

<script type="module">
import { T, when, setLang, pickLang, langButton, lang } from "/i18n.js";
import { atText, atPicker } from "/at.js";

const $ = (id) => document.getElementById(id);
const el = (t, c, x) => { const n = document.createElement(t); if (c) n.className = c;
  if (x !== undefined) n.textContent = x; return n; };
const fill = (n) => { while (n.firstChild) n.removeChild(n.firstChild); };
const initial = (name) => (String(name || "?").trim()[0] || "?").toLowerCase();

/* WeChat's own browser will not open a share sheet — the ⋯ menu at the top of
   ITS window is the only way — so the honest fallback there is the clipboard.
   Same test the rest of the app uses. */
const IN_WECHAT = /micromessenger/i.test(navigator.userAgent);

/** Put something on the clipboard, and say whether it worked. The modern API
 *  needs a secure context and a permission; the old one needs a node in the
 *  document. Both, in that order, because between them they cover every
 *  browser this board is opened in. Copied from notes.html rather than shared:
 *  these are three small pages that do not import each other. */
function copyText(text) {
  try {
    const t = document.createElement("textarea");
    t.value = text;
    t.setAttribute("readonly", "");
    t.style.position = "fixed";
    t.style.opacity = "0";
    document.body.append(t);
    t.select();
    const ok = document.execCommand && document.execCommand("copy");
    t.remove();
    if (ok) return true;
  } catch { /* fall through to the async one */ }
  if (navigator.clipboard) {
    navigator.clipboard.writeText(text).catch(() => {});
    return true;
  }
  return false;
}

let device = "";
try { device = localStorage.getItem("board:device") || ""; } catch { /* private window */ }

let GROUPS = [], CANADD = [], MAX = 5;
/* Which room is open, or "" for the list. Kept in the address so the back
   button leaves a room rather than the page. */
let OPEN = new URLSearchParams(location.search).get("g") || "";
let PICKED = [], PICKING = false;
/* ARRIVING FROM A CONVERSATION, with the person in it already picked.
 *
 * The ⋯ of a one-to-one offers "start a group with them" — see drawMenu in
 * notes.html — and it lands here. Without this that link would drop somebody
 * on an empty picker and ask them to find the person whose thread they were
 * reading a second ago.
 *
 * Read once and forgotten: it is an opening position, not a mode, and a
 * reload should not put somebody back at the start of something they have
 * moved on from. */
const WITH = new URLSearchParams(location.search).get("with") || "";
let usedWith = false;
/* ADDING SOMEBODY IS ITS OWN SCREEN, NOT A BLOCK UNDER THE CONVERSATION.
 *
 * It lived at the bottom of the room, after the composer, which meant two
 * things went wrong as soon as a room had anything in it: you scrolled the
 * whole conversation to reach it, and opening it pushed the conversation off
 * the screen you were reading. A control you use twice in a room's life was
 * sitting in the middle of the thing you use every day.
 *
 * In the header now, where it is one tap from anywhere, and it opens over the
 * room rather than inside it. */
let ADDING = false;
/* THE ROOM'S OWN PAGE, BORROWED FROM THE ONE EVERY PERSON ON THIS BOARD
 * ALREADY USES.
 *
 * In WeChat everything about a group lives behind ⋯ in the top right: who is
 * in it as a grid of faces, a ＋ tile at the end of that grid to add somebody,
 * the name, and leaving at the bottom. A Chinese user does not read that
 * screen, they already know it.
 *
 * So the chat is the chat — faces and a leave button are not things anybody
 * needs in front of them while reading it — and all of it is one tap away, in
 * the place the hand already goes. */
let INFO = false;

/* A COLOUR PER PERSON, FROM THEIR OWN NAME — the same routine, and so the
   same colour, as notes.html and the card in room.html. This page never had
   it: every letter avatar was the one accent blue, so a picker listing four
   people who had not uploaded a photo was four identical blue circles.
   Not random: it has to be the same tomorrow, and the same to them as it is
   to the person reading. */
function wash(name) {
  let h = 0;
  for (const ch of String(name || "?")) h = (h * 31 + ch.codePointAt(0)) % 360;
  return "linear-gradient(150deg,hsl(" + h + " 26% 74%),hsl(" + ((h + 24) % 360) + " 24% 52%))";
}

/** A face, or a letter where there is none. */
function face(p, cls) {
  const a = el("span", "av" + (cls ? " " + cls : ""), initial(p.handle));
  a.style.background = wash(p.handle);
  if (p.photo) {
    const img = Object.assign(document.createElement("img"),
      { src: "/api/public-media?id=" + encodeURIComponent(p.photo), alt: "", loading: "lazy" });
    img.addEventListener("load", () => {
      a.textContent = "";
      a.style.background = "";
      a.append(img);
    });
  }
  return a;
}

async function load() {
  try {
    const d = await fetch("/api/groups", { cache: "no-store",
      headers: device ? { "x-board-device": device } : {} }).then((r) => r.json());
    GROUPS = d.groups || [];
    CANADD = d.canAdd || [];
    /* Only if they really are somebody this person may put in a room. An id in
       the address is a thing anybody can type; the picker's own gate decides,
       as it does for every other name in it. */
    if (WITH && !usedWith && !OPEN && CANADD.some((c) => c.who === WITH)) {
      /* Once. load() runs again after every add and every invite, and without
         this the picker would reopen under somebody who had just left it. */
      usedWith = true;
      PICKING = true;
      PICKED = [WITH];
    }
    MAX = Number(d.max) || 5;
  } catch { GROUPS = []; CANADD = []; }
  paint();
}

function go(id) {
  ADDING = false;
  INFO = false;
  OPEN = id;
  const u = new URL(location.href);
  if (id) u.searchParams.set("g", id); else u.searchParams.delete("g");
  try { history.replaceState(null, "", u); } catch { /* fine */ }
  paint();
}

function paint() {
  $("safety").textContent = T("note.safety");
  $("back").setAttribute("aria-label", T("nav.back"));
  const room = GROUPS.find((g) => g.id === OPEN);
  if (room) return paintRoom(room);
  paintList();
}

/* --------------------------------------------------------------- the list */

function paintList() {
  $("topact").hidden = true;
  $("title").textContent = T("grp.title");
  $("sub").textContent = GROUPS.length
    ? T("grp.count", { n: GROUPS.length }) : T("grp.sub");
  const box = $("screen");
  fill(box);

  if (PICKING) { box.append(picker()); return; }

  /* The button first. Making one is the thing somebody opens this page to do
     while there are none, and it stays at the top afterwards because a list of
     three rooms is not long enough to bury it under. */
  const start = el("button", "start", T("grp.start"));
  start.type = "button";
  start.addEventListener("click", () => { PICKING = true; PICKED = []; paint(); });
  box.append(start);

  if (!GROUPS.length) {
    const none = el("div", "none");
    none.append(el("b", null, T("grp.none")), el("p", null, T("grp.noneBody")));
    box.append(none);
    return;
  }

  box.append(Object.assign(el("div", "rule"), {}));
  const r = el("div", "rule");
  r.append(el("span", null, T("grp.yours")), el("i"));
  box.append(r);

  for (const g of GROUPS) {
    const b = el("button", "room");
    b.type = "button";
    const faces = el("div", "faces");
    for (const p of g.who.slice(0, 4)) faces.append(face(p));
    const m = el("div", "m");
    m.append(el("b", null, g.name || nameOf(g)));
    const last = g.says[g.says.length - 1];
    m.append(el("p", null, last ? last.text : T("grp.quiet")));
    b.append(faces, m, el("span", "chev", "›"));
    b.addEventListener("click", () => go(g.id));
    box.append(b);
  }
}

/** What to call a room nobody named: the people in it. */
const nameOf = (g) => g.who.map((p) => p.handle).filter(Boolean).slice(0, 3).join(", ");

/* ------------------------------------------------------------- the picker */

function picker() {
  const box = el("div", "picker");
  const r = el("div", "rule");
  r.append(el("span", null, T("grp.start")), el("i"));
  box.append(r);

  if (!CANADD.length) {
    box.append(el("p", "lede", T("grp.nobody")));
    const back = el("button", "start", T("nav.back"));
    back.type = "button";
    back.addEventListener("click", () => { PICKING = false; paint(); });
    box.append(back);
    return box;
  }

  // You are always in it, so there is room for one fewer than the cap.
  const room = MAX - 1;
  box.append(el("p", "lede", T("grp.who", { n: room })));

  const full = PICKED.length >= room;
  for (const c of CANADD) {
    const on = PICKED.includes(c.who);
    const b = el("button", "pick" + (on ? " on" : ""));
    b.type = "button";
    b.disabled = !on && full;
    b.append(face(c), el("b", null, c.handle),
      el("span", "tag", T(on ? "grp.added" : "grp.add")));
    b.addEventListener("click", () => {
      PICKED = on ? PICKED.filter((x) => x !== c.who) : [...PICKED, c.who];
      paint();
    });
    box.append(b);
  }

  const name = document.createElement("input");
  name.maxLength = 60;
  name.placeholder = T("grp.namePlaceholder");
  box.append(name);

  /* SOMEBODY WHO IS NOT ON HERE YET.
   *
   * This screen is where a member finds out the person they want is not a
   * member: one face in the list, a button that will not go, and the third
   * person sitting in their phone. Sending them away to find an invite code
   * somewhere else, and coming back, is how a room never gets made.
   *
   * It mints against the same daily allowance as the code in their header —
   * see /api/group-invite — so this is a different door to the same ceiling
   * and not a way round it. */
  const bringIn = outsider(() => PICKED, () => name.value.trim());

  const make = el("button", "make", T("grp.make", { n: PICKED.length + 1 }));
  make.type = "button";
  // Three, because two people already have a thread and a group of two would
  // be a second, worse version of it.
  make.disabled = PICKED.length < 2;
  const said = el("p", "limit");
  make.addEventListener("click", async () => {
    make.disabled = true;
    try {
      const r2 = await fetch("/api/group", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ device, who: PICKED, name: name.value.trim() }),
      });
      const d = await r2.json().catch(() => ({}));
      if (!r2.ok) throw new Error(d.error || "no");
      PICKING = false;
      await load();
      go(d.id);
    } catch {
      said.textContent = T("act.again");
      make.disabled = false;
    }
  });
  box.append(make, said);
  box.append(el("p", "limit", T("grp.limit")));
  /* UNDER THE PRIMARY ACTION AND NOT OVER IT. It sat above Create group and
     drew the eye off it — a solid accent button for the second thing on a
     screen whose first thing was a pale disabled one. Making a room is what
     this screen is for; bringing somebody in is the answer when it will not
     go. */
  box.append(bringIn);

  const back = el("button", "start", T("nav.back"));
  back.type = "button";
  back.addEventListener("click", () => { PICKING = false; paint(); });
  box.append(back);
  return box;
}

/* --------------------------------------------------------------- one room */

function paintRoom(g) {
  $("title").textContent = g.name || nameOf(g);
  $("sub").textContent = T("grp.inIt", { n: g.who.length });
  const box = $("screen");
  fill(box);

  const act = $("topact");
  /* ⋯ AND NOT "ADD". Add is one of the things behind it, not the only one,
     and ⋯ in the top right of a chat is the gesture everybody already has. */
  act.hidden = false;
  act.textContent = "\u22EF";
  act.setAttribute("aria-label", T("grp.info"));
  act.onclick = () => { INFO = true; ADDING = false; OUTING = false; paint(); };

  if (ADDING) { act.hidden = true; box.append(addScreen(g)); return; }
  if (INFO) { act.hidden = true; box.append(infoScreen(g)); return; }

  /* THE FACES USED TO BE HERE, as a row of chips over the first message.
     Knowing who is reading still matters — that note was right — but it is
     something you check, not something you need in front of you while you
     read. The count is in the line under the title, and the faces are one tap
     away behind ⋯, which is where a WeChat user looks for them. */

  for (const m of g.says) {
    /* WHAT HAPPENED TO THE ROOM, drawn as a line across it rather than as a
       bubble from Mo. It is not somebody talking — it is the room reporting
       itself, which is what every group chat on this phone does with a thin
       grey line in the middle and no avatar beside it. */
    if (m.evt) {
      box.append(el("p", "evt", T("mo." + m.evt.kind, { who: m.evt.who })));
      continue;
    }
    const row = el("div", "said" + (m.mine ? " mine" : ""));
    if (!m.mine) row.append(face(m, "small"));
    const wrap = el("div");
    const bub = el("div", "bub");
    /* @somebody drawn as a mention. Never innerHTML — see at.js. */
    atText(bub, m.text || "", g.who.map((x) => x.handle).filter(Boolean));
    wrap.append(bub);
    const meta = el("div", "meta");
    meta.append(el("span", null, (m.mine ? "" : (m.handle || "") + " · ") + when(m.at)));
    // Reporting the doorman to the doorman is not a thing anybody means to do.
    if (!m.mine && !m.bot) {
      if (m.reported) {
        meta.append(el("span", null, T("note.reported")));
      } else {
        const rep = el("button", "rep", T("grp.flag"));
        rep.type = "button";
        rep.addEventListener("click", async () => {
          const why = window.prompt(T("note.reportWhy"), "");
          if (why === null) return;
          rep.disabled = true;
          await fetch("/api/group/report", {
            method: "POST", headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ device, id: m.id, why }),
          }).catch(() => {});
          await load();
        });
        meta.append(rep);
      }
    }
    wrap.append(meta);
    row.append(wrap);
    box.append(row);
  }

  /* THE PRICE OF SPEAKING, WHERE THE COMPOSER WOULD BE.
   *
   * Somebody invited straight into this room is reading it with no name. The
   * conversation above is the reason they came and they have already had it;
   * what they have not done is say who they are. So the ask sits exactly where
   * the answer would go, and it is the same sentence the rest of the board
   * runs on rather than a sign-up form wearing its clothes.
   *
   * LEAVING IS STILL UNDER IT. A room you cannot walk out of is not a room. */
  if (g.guest) { box.append(joinBox()); box.append(leaveButton(g)); return box; }

  const c = el("div", "compose");
  const ta = document.createElement("textarea");
  ta.rows = 1;
  ta.maxLength = 600;
  ta.placeholder = T("grp.placeholder");
  /* @ somebody in the room — the same module the door rooms use, so the
     gesture is one gesture and not two that drift apart. */
  atPicker(ta, () => g.who.map((x) => x.handle).filter(Boolean));
  const send = el("button", null, T("note.send"));
  send.type = "button";
  send.addEventListener("click", async () => {
    const text = ta.value.trim();
    if (!text) { ta.focus(); return; }
    send.disabled = true;
    try {
      const r = await fetch("/api/group/say", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ device, group: g.id, text }),
      });
      const d = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(d.error || "no");
      ta.value = "";
      said.textContent = "";
      await load();
    } catch (e) {
      /* THE TEXT STAYS IN THE BOX, and now the reason is under it. Every
         refusal here was silent: the send button came back enabled, the line
         was still typed, and nothing on the screen said why it had not gone.
         A composer that quietly does nothing is one somebody presses four more
         times. */
      said.textContent = T(String(e.message) === "contact"
        ? "note.noContact" : "act.again");
    }
    send.disabled = false;
  });
  c.append(ta, send);
  box.append(c);
  const said = el("p", "saycsaid");
  box.append(said);

  return box;
}

/** The add screen. Over the room, not inside it: your people, then a box for
 *  a name. Both at once, because whoever you have in mind is already either a
 *  face on this board or a name in your phone and you know which. */
function addScreen(g) {
  const box = el("div", "addscreen");
  const list = el("div", "addlist");

  /* ONE BOX, AND IT SEARCHES BEFORE IT OFFERS TO INVITE.
   *
   * The two halves used to be separate: your people as rows, a line saying OR,
   * and a name box under it that looked nobody up. So typing "Keith" minted a
   * code for a stranger called Keith while the real Keith sat in the list
   * directly above it. Nobody should have to know which kind of person
   * somebody is before they start typing their name.
   *
   * IT SEARCHES YOUR MATCHES AND NOTHING ELSE. Every name on the board would
   * be a directory, and a directory of the people on here is the one thing
   * this board has never been — see the note over cleanPerson. The list is
   * already in the page; no name leaves it to ask a question.
   */
  const draw = (q) => {
    fill(list);
    const want = q.trim().toLowerCase();
    const inRoom = new Set((g.who || []).map((m) => m.who));
    const left = (CANADD || []).filter((c) => !inRoom.has(c.who));
    const hit = want
      ? left.filter((c) => (c.handle || "").toLowerCase().includes(want))
      : left;

    for (const c of hit) {
      const row = el("button", "pick");
      row.type = "button";
      const tag = el("span", "tag", T("grp.add"));
      row.append(face(c), el("b", null, c.handle), tag);
      row.addEventListener("click", async () => {
        row.disabled = true;
        try {
          const r = await fetch("/api/group/add", {
            method: "POST", headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ device, group: g.id, who: c.who }),
          });
          const d = await r.json().catch(() => ({}));
          if (!r.ok) throw new Error(d.error || "no");
          /* STRAIGHT BACK TO THE ROOM. Adding somebody is finished the moment
             it works, and the thing worth seeing is their name in the faces at
             the top — not this screen with one fewer row on it. */
          ADDING = false;
          INFO = false;
          await load();
        } catch (e) {
          tag.textContent = T(String(e.message) === "full" ? "grp.outFullWhy" : "act.again");
          row.disabled = false;
        }
      });
      list.append(row);
    }

    /* THE INVITE IS WHAT A NAME NOBODY MATCHES MEANS. Not a second control and
       not a mode — the same typing, one row further down, once there is
       nothing on this board it could have meant. */
    if (want && !hit.length) {
      const row = el("button", "pick");
      row.type = "button";
      const tag = el("span", "tag", T("grp.invite"));
      const face2 = el("span", "av new", "\uFF0B");
      row.append(face2, el("b", null, T("grp.inviteName", { name: q.trim() })), tag);
      row.addEventListener("click", () => mint(g, q.trim(), list));
      list.append(row);
    }

    // Nothing typed and nobody left to add: say which of the two it is.
    if (!want && !left.length) {
      list.append(el("p", "saidline", T("grp.addAllIn")));
    }
  };

  box.append(el("p", "addlede", T("grp.addLede", { room: g.name || nameOf(g) })));
  const find = document.createElement("input");
  find.className = "fld find";
  find.maxLength = 40;
  find.placeholder = T("grp.findName");
  find.addEventListener("input", () => draw(find.value));
  box.append(find);
  box.append(list);
  draw("");
  return box;
}

/** Minting the code, once a name has turned out to be nobody on this board.
 *  The row it was tapped from is replaced by what it made — see done(). */
async function mint(g, nm, list) {
  fill(list);
  const said = el("p", "saidline", T("note.sending"));
  list.append(said);
  try {
    const r = await fetch("/api/group-invite", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ device, group: g.id }),
    });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(d.error || "no");
    /* THE LINK NEVER CARRIES THE CODE. Same rule as the header's invite and
       the same reason: a forwarded link would otherwise be a way in. The name
       goes in it so the door greets them; it opens nothing. */
    const url = location.origin + "/enter?for=" + encodeURIComponent(nm)
      + "&from=" + encodeURIComponent(d.from || "")
      + (d.until ? "&t=" + Math.round(Date.parse(d.until) / 1000) : "");
    const words = T(IN_WECHAT ? "grp.sharedWx" : "grp.shared",
      { name: nm, room: d.name || T("grp.roomPlain"),
        who: (d.who || []).join(lang() === "zh" ? "\u3001" : ", "),
        url, code: d.code });
    fill(list);
    list.append(done(nm, d, words, url));
    if (!IN_WECHAT && navigator.share) {
      navigator.share({ title: T("site.title"), text: words }).catch(() => {});
    } else copyText(words);
  } catch (e) {
    const why = String(e.message);
    fill(list);
    list.append(el("p", "saidline", T(why === "standing" ? "grp.outNoStanding"
      : why === "spent" ? "grp.outSpent"
      : why === "full" ? "grp.outFullWhy"
      : "act.again")));
  }
}

/** What the invite came out as: who it is for, the six characters in full,
 *  and a button that puts the whole message back on the clipboard. The code is
 *  shown rather than only copied — a clipboard that silently did nothing is
 *  the failure this screen cannot afford, and six characters read off a screen
 *  are a way round it. */
function done(nm, d, words, url) {
  const box = el("div", "outdone");
  box.append(el("p", "line", d.name
    ? T("grp.outMade", { name: nm, room: d.name })
    : T("grp.outMadePlain", { name: nm })));
  /* BOTH HALVES ON THE SCREEN. The code was shown and the link was not — it
     existed only inside what the button put on the clipboard — under a line
     telling somebody to send the code WITH the link. Nothing to check the
     message against, and nothing to fall back on if the clipboard silently
     did nothing, which is the failure this box was built for. */
  /* THE CODE FIRST. It is the half that opens the door and the half nobody
     can reconstruct; the link is the same address every time and is here to
     be checked, not read. */
  box.append(el("b", "code", d.code));
  box.append(el("p", "url", url));
  const again = el("button", "go", T("grp.outCopy"));
  again.type = "button";
  again.addEventListener("click", () => {
    again.textContent = T(copyText(words) ? "inv.copied" : "inv.copyNo", { code: d.code });
    setTimeout(() => { again.textContent = T("grp.outCopy"); }, 2400);
  });
  box.append(again);
  /* Its own class, and NOT .note, which on this page is already a message row
     — display:flex and a bottom border, neither of which this wants.
     And not .saidline either: `.outform .saidline` is the red one for a
     refusal, and in the room this box sits inside an .outform, so a plain
     instruction came out looking like an error. */
  box.append(el("p", "hint", T("grp.outSend")));
  return box;
}

/** Bringing in somebody who has no account. `picked` and `label` are read at
 *  the moment of pressing rather than passed in, because both change under it
 *  while this is on screen. */
/** The invite half of the CREATE screen, where the list above it is a
 *  multi-select for building a room rather than a search. In a room that
 *  already exists this is one row in addScreen's own list instead — see the
 *  note there.
 *
 *  `bare` used to make it the lower half of a panel; the add screen stopped
 *  needing that, and a parameter with one caller and one value is a mode
 *  nobody is in. */
function outsider(picked, label, group) {
  const box = el("div", "outside");
  const open = el("button", "outbtn", T("grp.outside"));
  open.type = "button";
  box.append(open);

  const form = el("div", "outform");
  form.hidden = true;
  const who = document.createElement("input");
  who.className = "fld";
  who.maxLength = 40;
  who.placeholder = T("grp.outsideName");
  const go2 = el("button", "go", T("grp.outsideGo"));
  go2.type = "button";
  const said = el("p", "saidline");
  form.append(who, go2, said);
  box.append(form);

  open.addEventListener("click", () => {
    form.hidden = !form.hidden;
    if (!form.hidden) who.focus();
  });

  go2.addEventListener("click", async () => {
    const nm = who.value.trim();
    if (!nm) { who.focus(); return; }
    go2.disabled = true;
    said.textContent = "";
    try {
      const r = await fetch("/api/group-invite", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify(group
          ? { device, group }
          : { device, who: picked(), name: label() }),
      });
      const d = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(d.error || "no");
      /* THE LINK NEVER CARRIES THE CODE. Same rule as the header's invite and
         the same reason: a forwarded link would otherwise be a way in. The
         name goes in it so the door greets them; it opens nothing. */
      const url = location.origin + "/enter?for=" + encodeURIComponent(nm)
        + "&from=" + encodeURIComponent(d.from || "")
        + (d.until ? "&t=" + Math.round(Date.parse(d.until) / 1000) : "");
      const words = T(IN_WECHAT ? "grp.sharedWx" : "grp.shared",
        { name: nm, room: d.name || T("grp.roomPlain"),
          /* THE SEPARATOR IS A WORD OF THE LANGUAGE, not punctuation that
             travels. \u3001 between two English names reads as a typo in the
             middle of a message somebody is about to send a stranger. */
          who: (d.who || []).join(lang() === "zh" ? "\u3001" : ", "),
          url, code: d.code });
      /* Inside WeChat a page may not open a share sheet — the ⋯ menu is the
         only way — so the clipboard is the honest version there, as it is
         everywhere else this app shares something. */
      /* THE FORM IS REPLACED BY WHAT IT MADE, and this is not decoration.
         It used to call load() on success, which repaints the screen and
         rebuilds this row shut — so the code was minted, the message was on
         the clipboard, and the screen said nothing at all. The next thing
         anybody does with a button that appears to have done nothing is press
         it again, and the second press spends the day's other code. */
      form.replaceWith(done(nm, d, words, url));
    } catch (e) {
      const why = String(e.message);
      said.textContent = T(why === "standing" ? "grp.outNoStanding"
        : why === "spent" ? "grp.outSpent"
        : why === "full" ? "grp.outFullWhy"
        : why === "alone" ? "grp.outAlone"
        : "act.again");
    }
    go2.disabled = false;
  });
  return box;
}

/* THE TWO HALVES OF THE SENTENCE, and the same two lists room.html offers.
   Copied rather than shared because these are three small files that do not
   import each other; if a role is ever added it goes in three places and this
   comment is where somebody finds that out. */
const MAKE = ["director", "writer", "performer", "crew", "founder", "maker", "student"];
const BACK = ["agent", "producer", "brand", "buyer", "distributor",
              "investor", "lawyer", "recruiter"];

/** A name and one sentence, which is everything this board asks anybody for.
 *  The article comes with the word — see the note in room.html — so the list
 *  reads "a Director / an Agent / Crew" and the sentence reads correctly for
 *  all three. */
function joinBox() {
  const box = el("div", "joinbox");
  box.append(el("p", "ask", T("grp.joinAsk")));

  const name = document.createElement("input");
  name.className = "fld";
  name.maxLength = 40;
  name.placeholder = T("grp.joinName");
  box.append(name);

  const sel = (now) => {
    const sl = document.createElement("select");
    for (const [head, keys] of [["say.make", MAKE], ["say.back", BACK]]) {
      const g = document.createElement("optgroup");
      g.label = T(head);
      for (const k of keys) {
        const o = el("option", null, T("role.a." + k));
        o.value = k;
        if (k === now) o.selected = true;
        g.append(o);
      }
      sl.append(g);
    }
    return sl;
  };
  const mine = sel("director"), want = sel("agent");
  const line = el("div", "sent");
  line.append(el("span", null, T("say.iam")), mine,
              el("span", null, T("say.lookingFor")), want);
  box.append(line);

  const go2 = el("button", "go", T("grp.joinGo"));
  go2.type = "button";
  const said = el("p", "saidline");
  go2.addEventListener("click", async () => {
    const handle = name.value.trim();
    /* THE NAME IS THE ONLY THING THAT CAN BE MISSING. Both halves of the
       sentence start on a real answer, so the one way to press this with
       nothing in it is to leave the name blank. Focus rather than a message:
       the box is right there and an error under it says less than the cursor
       being in it does. */
    if (!handle) { name.focus(); return; }
    go2.disabled = true;
    said.textContent = "";
    try {
      const r = await fetch("/api/me", {
        method: "PUT", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ device, handle, looking: true,
                               say: [{ me: mine.value, want: want.value }] }),
      });
      const d = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(d.error || "no");
      // The room redraws with them in it and a composer where this box was.
      await load();
      return;
    } catch (e) {
      /* THE ONE REFUSAL WORTH ITS OWN WORDS. A name with a phone number or a
         WeChat id in it is turned down by the server on purpose — see
         contactShaped — and "try again" would send somebody round the same
         loop for ever. */
      said.textContent = T(String(e.message) === "contact" ? "grp.joinNoContact" : "act.again");
    }
    go2.disabled = false;
  });
  box.append(go2, said);
  return box;
}

/* Whether the grid is a list of faces or a list of people to take out. Off
   every time the screen is opened: a destructive mode that is remembered is a
   destructive mode somebody walks back into. */
let OUTING = false;

/** Taking somebody out. Asked first, because there is no undo on this screen
 *  and putting them back means a code and a message — see /api/group/out. */
async function takeOut(g, handle) {
  if (!window.confirm(T("grp.outSure", { who: handle }))) return;
  try {
    const r = await fetch("/api/group/out", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ device, group: g.id, who: handle }),
    });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(d.error || "no");
    /* A room of two, minus one, is no room — the server says so and the screen
       has to agree rather than repaint an id that is gone. */
    if (d.gone) { OPEN = ""; INFO = false; }
    OUTING = false;
    await load();
  } catch { window.alert(T("act.again")); }
}

/** WHO IS IN IT, AND THE WAY OUT — one page, behind ⋯.
 *
 *  A grid of faces with a ＋ tile at the end, the same shape as the one in a
 *  WeChat group. The ＋ is only there for the room's maker: membership is
 *  drawn from their matches and the route refuses anybody else, and a tile
 *  that is drawn and refuses is worse than one that is not there. */
function infoScreen(g) {
  const box = el("div", "info");
  const grid = el("div", "faces" + (OUTING ? " outing" : ""));
  for (const m of g.who) {
    /* IN OUT MODE EVERY FACE IS A BUTTON, and only then. A room where a face
       is always tappable is a room where somebody removes a person by
       mis-tapping while scrolling — which is the one mistake here that cannot
       be undone from this screen. Same as WeChat: the － turns the grid into a
       thing you are choosing from, and the faces go back to being faces. */
    const can = OUTING && m.handle && !m.self && !m.bot;
    const cell = el(can ? "button" : "div", "cell" + (can ? " out" : ""));
    if (can) cell.type = "button";
    cell.append(face(m), el("span", null, m.handle));
    if (can) cell.addEventListener("click", () => takeOut(g, m.handle));
    grid.append(cell);
  }
  if (g.mine) {
    const add = el("button", "cell add");
    add.type = "button";
    add.append(el("span", "plus", "\uFF0B"), el("span", null, T("grp.addTop")));
    add.addEventListener("click", () => { OUTING = false; INFO = false; ADDING = true; paint(); });
    grid.append(add);
    /* THE OTHER HALF OF THE ＋, and beside it, which is where a WeChat group
       keeps it. Somebody put four people in a room and one of them turned out
       to be wrong for it; without this the only fix is abandoning the room. */
    if (g.who.filter((m) => m.handle && !m.self && !m.bot).length) {
      const out = el("button", "cell add");
      out.type = "button";
      out.append(el("span", "plus", "\uFF0D"),
        el("span", null, T(OUTING ? "grp.outDone" : "grp.outTop")));
      out.addEventListener("click", () => { OUTING = !OUTING; paint(); });
      grid.append(out);
    }
  }
  box.append(grid);
  if (OUTING) box.append(el("p", "hint", T("grp.outHow")));

  /* WHAT IS HOLDING THE OTHER SEATS.
   *
   * A code nobody has spent sits in one of the five until it runs out. Without
   * this a room of two refuses a third person and the only account of it is a
   * sentence about five people on a screen saying two — which reads as a bug,
   * and was one the first time somebody hit it. Here they are, by code, with
   * the way to stand one down. */
  const held = g.mine ? (g.held || []) : [];
  if (held.length) {
    box.append(el("p", "heldhead", T("grp.heldHead", { n: held.length })));
    for (const v of held) {
      const row = el("div", "heldrow");
      const left = el("div", "hm");
      left.append(el("b", null, v.code));
      left.append(el("span", null, v.until ? T("grp.heldTill", { when: when(v.until) })
                                           : T("grp.heldOpen")));
      const off = el("button", "heldoff", T("grp.heldOff"));
      off.type = "button";
      off.addEventListener("click", async () => {
        off.disabled = true;
        try {
          const r = await fetch("/api/group-invite/off", {
            method: "POST", headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ device, code: v.code }),
          });
          if (!r.ok) throw new Error("no");
          await load();
        } catch { off.textContent = T("act.again"); off.disabled = false; }
      });
      row.append(left, off);
      box.append(row);
    }
  }

  // The count is already under the title on this screen. Twice is noise.
  box.append(leaveButton(g));
  return box;
}

/** Walking out. Yours to take, guest or member, and the one control on this
 *  screen that is never conditional on anything. */
function leaveButton(g) {
  const out = el("button", "leave", T("grp.leave"));
  out.type = "button";
  out.addEventListener("click", async () => {
    if (!window.confirm(T("grp.leaveSure"))) return;
    out.disabled = true;
    await fetch("/api/group/leave", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ device, group: g.id }),
    }).catch(() => {});
    go("");
    await load();
  });
  return out;
}

$("back").addEventListener("click", () => {
  // Out of a room to the list, out of the list to the board. One button, and
  // it always goes back one step rather than off the page.
  if (PICKING) { PICKING = false; paint(); return; }
  if (ADDING) { ADDING = false; INFO = true; paint(); return; }
  if (INFO) { INFO = false; paint(); return; }
  if (OPEN) { go(""); return; }
  if (history.length > 1) history.back(); else location.href = "/feed";
});

setLang(pickLang());
$("langslot").append(langButton(paint));
load();
</script>
</body>
</html>
