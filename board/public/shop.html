<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>小店</title>
<meta name="robots" content="noindex">
<!--
  A STOREFRONT, OPENED IN WECHAT BY SOMEBODY WITH NO ACCOUNT.

  The whole screen is written for a woman holding a phone in a queue who was
  sent this by somebody she knows. So: whose shop it is, the things, a
  number that grows as she taps, and one button. Nothing to read.

  THE FOUR WORDS ARE NOT OURS — see lib/shop.js. Everything here uses the
  vocabulary she already has from every shop she has ever bought from:
  加入购物车, 去结算, 运费, 合计. A translation of our words would be the
  tell that this was built somewhere else.

  CHINESE FIRST, WITH THE SWITCH. Nobody but a Chinese buyer ever opens
  this to buy from it — so it opens in Chinese whatever the phone is set
  to, and the English is there for the one other person who looks at it,
  which is whoever runs the shop. Strings live in i18n.js under sh., both
  halves on one line.
-->
<style>
  :root{
    --bg:#F5F5F7; --card:#FFFFFF; --ink:#111214; --ink2:#5B6170; --mut:#8A8F9C;
    --line:#E7E8EC; --acc:#D6483B; --ok:#1FA463;
    --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB",
      "Microsoft YaHei","Noto Sans SC",sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink)}
  body{font-family:var(--sans);font-size:16px;line-height:1.5;
    padding:env(safe-area-inset-top,0) 0 calc(5.6rem + env(safe-area-inset-bottom,0))}
  main{max-width:34rem;margin:0 auto;padding:.9rem .8rem 1rem}

  /* THE PICTURE ACROSS THE TOP. Full bleed — it cancels main's own side
     padding rather than sitting inside it, because a banner with a margin
     down each side reads as a picture in a document, not as a shopfront.
     A fixed aspect keeps the page from jumping as it loads. */
  /* Two to one, because the pictures people actually have are of a family
     standing up, and 2.4:1 took the top of somebody's head off. */
  .ban{display:block;width:calc(100% + 1.6rem);aspect-ratio:2/1;object-fit:cover;
    margin:-.9rem -.8rem .9rem;background:var(--line)}

  /* THE TOP OF THE PAGE HAD NOTHING ON IT.
     A small dark name, a grey line and then the chips — which is a document
     header, and the first screen is the one that decides whether she scrolls
     at all. Most shops here have no banner photograph and never will, so the
     header has to hold on its own: a coloured band that runs the full width,
     her name large on it, and the three things she checks before buying from
     a stranger she was introduced to in a chat.
     Full bleed by cancelling main's padding, the same trick .ban uses — a
     band with a margin down each side is a card, not a shopfront. */
  .hero{margin:-.9rem -.8rem .9rem;padding:1.5rem 1.1rem 1.1rem;
    background:linear-gradient(160deg,#20303F 0%,#33495E 58%,#3C5871 100%);
    color:#fff;width:calc(100% + 1.6rem)}
  .ban + .hero{margin-top:-.9rem}
  .hero .top{display:flex;align-items:center;gap:.7rem}
  .hero .top>div{min-width:0;flex:1 1 auto}
  .hero img{width:2.9rem;height:2.9rem;border-radius:50%;object-fit:cover;
    flex:0 0 auto;border:2px solid rgba(255,255,255,.75)}
  .hero b{display:block;font-size:1.35rem;line-height:1.25;letter-spacing:.01em}
  .hero .lang{flex:0 0 auto;border:1px solid rgba(255,255,255,.45);
    background:transparent;color:#fff;font:inherit;font-size:.74rem;
    border-radius:999px;padding:.25rem .65rem}
  /* THREE, AND THEY WRAP RATHER THAN SCROLL. A row she has to swipe is a row
     with something hidden in it, and the third one is the one about money. */
  .trust{display:flex;flex-wrap:wrap;gap:.4rem;margin:.85rem 0 0}
  .trust span{font-size:.72rem;line-height:1;padding:.4rem .6rem;border-radius:999px;
    background:rgba(255,255,255,.14);color:rgba(255,255,255,.94)}

  .who{display:flex;align-items:center;gap:.7rem;padding:.2rem .3rem 1rem}
  .who img{width:3rem;height:3rem;border-radius:50%;object-fit:cover;flex:0 0 auto;
    background:var(--line)}
  /* min-width:0, or the nowrap line below pushes the flex row wider than the
     page and the ellipsis never fires — which is how a one-line bio ran off
     the right-hand edge of the screen. */
  .who>div{min-width:0}
  .who .lang{margin-left:auto;flex:0 0 auto;border:1px solid var(--line);
    background:var(--card);color:var(--ink2);font:inherit;font-size:.75rem;
    border-radius:999px;padding:.25rem .65rem}
  .who b{display:block;font-size:1.05rem}
  .who span{display:block;font-size:.82rem;color:var(--ink2);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  /* A CATALOGUE, NOT A LIST. Eight wide rows down a page is a receipt;
     two columns of pictures is what every shop she uses looks like, and
     her whole scan is photographs and prices in that order. The picture
     leads because it is the only part she reads at speed. */
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:.6rem;margin:0 0 .6rem}
  .item{display:flex;flex-direction:column;background:var(--card);
    border-radius:.9rem;overflow:hidden}
  .item .pic{width:100%;aspect-ratio:1/1;background:var(--line);object-fit:cover;
    display:block}
  /* A SHELF WITH ONE THING ON IT left half a row empty, which reads as a
     picture that failed to load rather than as a short shelf. It goes wide
     instead, picture left and the rest beside it — the shape a shop uses for
     the one thing it wants looked at, so a short shelf gains something
     instead of showing a hole. */
  .grid.one{grid-template-columns:1fr}
  .grid.one .item{flex-direction:row;align-items:stretch}
  .grid.one .item .pic{width:9.5rem;flex:0 0 auto;aspect-ratio:1/1}
  .grid.one .item .mid{padding:.8rem .9rem}
  .grid.one .item .nm{font-size:1rem;-webkit-line-clamp:2}
  .grid.one .item .row{padding-top:.6rem}
  .item .mid{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;
    gap:.15rem;padding:.55rem .6rem .6rem}
  .item .nm{font-size:.85rem;line-height:1.4;display:-webkit-box;
    -webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .item .un{font-size:.72rem;color:var(--mut)}

  /* The shelves, and the row of them across the top. 全部 first because
     most of the time she wants the lot. */
  /* THE SHELVES ARE THE STRUCTURE OF THE PAGE and were its quietest ink —
     .85rem grey over a wall of white cards, which is a caption, not a
     heading. She navigates this page by them. */
  .shelf{margin:1.4rem .3rem .55rem;font-size:1rem;font-weight:600;
    color:var(--ink);display:flex;align-items:center;gap:.55rem}
  .shelf::after{content:"";flex:1;height:1px;background:var(--line)}
  .tabs{display:flex;gap:.45rem;overflow-x:auto;padding:0 .3rem .8rem;
    scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tabs button{flex:0 0 auto;border:1px solid var(--line);background:var(--card);
    color:var(--ink2);font:inherit;font-size:.82rem;border-radius:999px;
    padding:.35rem .85rem}
  .tabs button.on{background:var(--ink);border-color:var(--ink);color:#fff}
  /* 评价, on the row. It only appears when there is one — an empty reviews
     line says nobody bought this, which is worse than not asking. */
  .item .rv{border:0;background:none;padding:0;font:inherit;font-size:.76rem;
    color:var(--mut);text-align:left}
  .item .rv b{color:#F5A623;font-weight:600}
  .revs{text-align:left;max-height:52vh;overflow:auto}
  .rev1{padding:.7rem 0;border-top:1px solid var(--line)}
  .rev1:first-child{border-top:0}
  .rev1 .top{display:flex;align-items:baseline;gap:.6rem}
  .rev1 .top b{font-size:.85rem;color:var(--ink2);font-weight:500}
  .rev1 .top span{font-size:.85rem;color:#F5A623}
  .rev1 p{margin:.3rem 0 0;font-size:.92rem;line-height:1.55}
  .rev1 img{width:5.5rem;height:5.5rem;object-fit:cover;border-radius:.5rem;
    margin:.45rem 0 0;display:block}
  .rev1 .src{margin:.3rem 0 0;font-size:.74rem;color:var(--mut)}
  .rev1 .back{margin:.45rem 0 0;padding:.5rem .65rem;background:var(--bg);
    border-radius:.5rem;font-size:.86rem;color:var(--ink2)}
  /* 问大家, above the reviews in the same sheet — the shape Taobao uses,
     and the right order: a question she is about to ask beats somebody
     else's verdict. */
  .sect{margin:0 0 1rem;text-align:left}
  .sect>h3,.shc>h3{margin:0 0 .5rem;font-size:.85rem;color:var(--mut);
    font-weight:500;text-align:left}
  .q{padding:.6rem 0;border-top:1px solid var(--line)}
  .q:first-of-type{border-top:0}
  .q>b{display:block;font-size:.95rem;font-weight:500}
  .q .a{margin:.35rem 0 0;font-size:.9rem;color:var(--ink2);line-height:1.5}
  .q .a i{font-style:normal;color:var(--acc);margin-right:.35rem}
  .q .none{padding:.25rem 0;font-size:.82rem;color:var(--mut);text-align:left}
  .q .reply{border:0;background:none;padding:.3rem 0 0;font:inherit;
    font-size:.82rem;color:var(--acc)}
  .askrow{display:flex;gap:.5rem;margin:.7rem 0 0}
  .askrow input{flex:1 1 auto;min-width:0;font:inherit;font-size:.95rem;
    padding:.55rem .7rem;border-radius:.7rem;border:1px solid var(--line);
    background:var(--card);color:var(--ink)}
  .askrow button{flex:0 0 auto;border:0;border-radius:999px;background:var(--acc);
    color:#fff;font:inherit;font-size:.9rem;padding:.55rem 1rem}
  .item .row{margin-top:auto;display:flex;align-items:center;
    justify-content:space-between;gap:.3rem;padding-top:.3rem}
  /* THE PRICE IS THE LOUDEST THING ON THE CARD, because it is what she is
     actually comparing. It was set at 1rem against a .85rem name, which is
     near enough the same size to read as another line of text. */
  .item .pr{font-size:1.15rem;font-weight:600;color:var(--acc);line-height:1.1}
  .item .pr i{font-style:normal;font-size:.78rem;font-weight:400}

  /* The stepper everybody in China already knows: − 2 +, nothing else. */
  .qty{display:flex;align-items:center;gap:.35rem}
  .qty button{width:1.65rem;height:1.65rem;border-radius:50%;border:1px solid var(--line);
    background:var(--card);color:var(--ink);font:inherit;font-size:1.05rem;line-height:1;
    display:grid;place-items:center;padding:0}
  .qty button:disabled{color:var(--line)}
  /* The lone + before anything is in the cart: filled, so it reads as the
     button on the card rather than as one of a pair she has half-used. */
  .qty button.add{background:var(--acc);border-color:var(--acc);color:#fff;
    width:1.8rem;height:1.8rem;font-size:1.15rem}
  .qty b{min-width:1.2rem;text-align:center;font-weight:600}
  .add{border:0;border-radius:999px;background:var(--acc);color:#fff;font:inherit;
    font-size:.85rem;padding:.42rem .9rem}
  .gone{font-size:.85rem;color:var(--mut)}

  /* The bar that follows her down the page, because the total is the thing
     she is actually watching. */
  .bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);
    border-top:1px solid var(--line);padding:.7rem .9rem;
    padding-bottom:calc(.7rem + env(safe-area-inset-bottom,0));
    display:flex;align-items:center;gap:.8rem;z-index:5}
  .bar .sum{flex:1 1 auto;min-width:0}
  .bar .sum b{display:block;font-size:1.25rem;color:var(--acc)}
  .bar .sum span{display:block;font-size:.75rem;color:var(--mut)}
  .bar .go{flex:0 0 auto;border:0;border-radius:999px;background:var(--acc);color:#fff;
    font:inherit;font-size:1rem;font-weight:600;padding:.85rem 1.7rem}
  .bar .go:disabled{background:var(--line);color:var(--mut)}
  /* Bottom left, beside the buy button, with a speech bubble over it —
     where 联系店家 is on every shop she has ever used. Copying the place is
     the point: she finds it without looking for it. */
  .bar .ask{flex:0 0 auto;border:0;background:none;color:var(--ink2);font:inherit;
    font-size:.68rem;display:flex;flex-direction:column;align-items:center;
    gap:.1rem;padding:0 .3rem 0 0}
  .bar .ask svg{width:1.45rem;height:1.45rem;fill:none;stroke:currentColor;
    stroke-width:1.6;stroke-linejoin:round}

  /* The sheet it opens. A name, a number she can copy, a code she can long
     press — and nothing that looks like a form. */
  .sh{position:fixed;inset:0;background:rgba(17,18,20,.45);z-index:9;
    display:flex;align-items:flex-end}
  .shc{background:var(--card);width:100%;border-radius:1.1rem 1.1rem 0 0;
    padding:1.2rem 1rem calc(1.2rem + env(safe-area-inset-bottom,0));
    max-height:88vh;overflow:auto;text-align:center}
  .shc h2{margin:0 0 1rem;font-size:1.05rem;font-weight:600}
  .shc .wx{display:flex;align-items:center;justify-content:center;gap:.6rem;
    margin:0 0 .4rem}
  .shc .wx b{font-size:1.15rem;letter-spacing:.02em}
  .shc .wx button{border:1px solid var(--line);background:var(--card);
    color:var(--ink2);font:inherit;font-size:.78rem;border-radius:999px;
    padding:.25rem .7rem}
  .shc .how{margin:0 0 1.1rem;font-size:.82rem;color:var(--mut)}
  .shc img{width:min(15rem,62vw);height:auto;border-radius:.6rem;display:block;
    margin:0 auto .5rem}
  .shc .shut{margin:1rem 0 0;border:0;background:none;color:var(--mut);
    font:inherit;font-size:.9rem}

  /* The thread. Hers on the right, the shop's on the left, which is the
     shape of every message app she has. */
  .thread{text-align:left;max-height:46vh;overflow:auto;margin:0 0 .8rem;
    display:flex;flex-direction:column;gap:.5rem}
  .msg{max-width:82%;padding:.55rem .75rem;border-radius:.9rem;font-size:.92rem;
    line-height:1.5;white-space:pre-wrap;word-break:break-word}
  .msg.them{align-self:flex-start;background:var(--bg)}
  .msg.me{align-self:flex-end;background:var(--acc);color:#fff}
  .msg.bot{align-self:flex-start;background:var(--bg);border:1px dashed var(--line)}
  .msg .who{display:block;font-size:.68rem;opacity:.65;margin:0 0 .15rem}
  .hint{text-align:left;font-size:.82rem;color:var(--mut);margin:0 0 .8rem}
  .say{display:flex;gap:.5rem;align-items:flex-end}
  .say textarea{flex:1 1 auto;min-width:0;font:inherit;font-size:1rem;
    padding:.6rem .7rem;border-radius:.7rem;border:1px solid var(--line);
    background:var(--card);color:var(--ink);resize:none;height:2.7rem;
    max-height:7rem;line-height:1.4}
  .say button{flex:0 0 auto;border:0;border-radius:999px;background:var(--acc);
    color:#fff;font:inherit;font-size:.95rem;padding:.65rem 1.1rem}
  .say button:disabled{background:var(--line);color:var(--mut)}
  .wxmore{margin:1rem 0 0;padding:.9rem 0 0;border-top:1px solid var(--line)}
  .wxmore>summary{list-style:none;cursor:pointer;font-size:.85rem;color:var(--ink2)}
  .wxmore>summary::-webkit-details-marker{display:none}

  .none{padding:3rem 1rem;text-align:center;color:var(--mut)}
  .foot{padding:1.4rem .4rem 0;font-size:.75rem;line-height:1.7;color:var(--mut)}
</style>

<main id="root"></main>
<div class="bar" id="bar" hidden>
  <button class="ask" type="button" id="ask" hidden>
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 11.5a8.5 8.5 0 0 1-12.3 7.6L3 20.5l1.5-5.2A8.5 8.5 0 1 1 21 11.5z"/></svg>
    <span id="askword"></span>
  </button>
  <div class="sum"><b id="sum">¥0</b><span id="note"></span></div>
  <button class="go" type="button" id="go" disabled></button>
</div>

<script type="module">
import { T, lang, setLang, pickLang, langButton } from "/i18n.js";

/* Chinese unless the reader has said otherwise — see pickLang. */
setLang(pickLang("zh"));

const $ = (id) => document.getElementById(id);
const el = (t, cls, text) => {
  const n = document.createElement(t);
  if (cls) n.className = cls;
  if (text != null) n.textContent = text;
  return n;
};
const HANDLE = decodeURIComponent((location.pathname.match(/^\/shop\/([^/]+)/) || [])[1] || "");

/* THE WHOLE OF WHO SHE IS. Minted here rather than at checkout, because the
   thread can be opened before anything is bought — and it has to be the same
   string both times or her question and her order belong to two strangers.
   Same key as everywhere else on this board. */
function device() {
  try {
    let d = localStorage.getItem("board:device");
    if (!d) {
      d = (crypto.randomUUID ? crypto.randomUUID() : String(Math.random()).slice(2));
      localStorage.setItem("board:device", d);
    }
    return d;
  } catch { return ""; }
}

/* Fen to ¥, once, at the edge — the arithmetic upstream is all integers.
   See the note over `fen` in lib/shop.js. */
const yuan = (n) => "¥" + (n / 100).toLocaleString("zh-CN", {
  minimumFractionDigits: (n % 100) ? 2 : 0, maximumFractionDigits: 2,
});

let SHOP = null, ITEMS = [], POST = 3000;
/* Which shelf she is looking at. "" is 全部. */
let SHELF = "";
const CART = new Map();

function total() {
  let n = 0;
  for (const [id, q] of CART) {
    const it = ITEMS.find((x) => x.id === id);
    if (it) n += it.price * q;
  }
  return n;
}

function paint() {
  const goods = total();
  $("sum").textContent = yuan(goods + (goods ? POST : 0));
  $("note").textContent = T(goods ? "sh.postIn" : "sh.post", { amount: yuan(POST) });
  $("go").textContent = T("sh.go");
  $("askword").textContent = T("sh.ask");
  $("go").disabled = !goods;
  $("bar").hidden = false;
}

/* ONE PLUS UNTIL SHE HAS TAPPED IT.
 *
 * This drew − 0 + on every card, so a shelf of six goods carried eighteen
 * controls and six zeros, none of which were telling her anything. It is
 * also not the shape she knows: every Chinese shop shows a single round +
 * and grows the stepper out of it on the first tap, so the minus exists
 * only once there is something to take away.
 *
 * The count is the only thing on the card that changes, so the wrap is
 * rebuilt rather than toggled — three nodes, on a tap she is watching. */
function stepper(it) {
  const wrap = el("div", "qty");
  const set = (q) => {
    if (q <= 0) CART.delete(it.id); else CART.set(it.id, Math.min(q, 99));
    fill();
    paint();
  };
  function fill() {
    wrap.textContent = "";
    const q = CART.get(it.id) || 0;
    const more = el("button", q ? null : "add", "+");
    more.type = "button";
    more.setAttribute("aria-label", T("sh.more"));
    more.addEventListener("click", () => set(q + 1));
    if (!q) { wrap.append(more); return; }
    const less = el("button", null, "−");
    less.type = "button";
    less.setAttribute("aria-label", T("sh.less"));
    less.addEventListener("click", () => set(q - 1));
    wrap.append(less, el("b", null, String(q)), more);
  }
  fill();
  return wrap;
}

/* 联系店家 — A MESSAGE THREAD, NOT A QR CODE.
 *
 * The first version of this opened a WeChat id and a code, and that is the
 * wrong thing behind this button: asking a stranger to add you as a friend
 * before she has bought anything is a bigger ask than the purchase. Both
 * shops this design was taken from open a thread, so this opens a thread.
 * WeChat stays underneath, one tap down, for whoever wants it. */
function askSheet(order = "") {
  const sheet = el("div", "sh");
  const card = el("div", "shc");
  const who = SHOP.name || SHOP.handle;
  card.append(el("h2", null, T("sh.askWho", { who })));

  const thread = el("div", "thread");
  const hint = el("p", "hint", T("sh.first", { who }));
  card.append(hint, thread);

  const paint = (lines) => {
    thread.textContent = "";
    for (const l of lines) {
      const m = el("div", l.who === "buyer" ? "msg me" : l.who === "ai" ? "msg bot" : "msg them");
      m.append(el("span", "who",
        l.who === "buyer" ? T("sh.me") : l.who === "ai" ? T("sh.robot") : who));
      m.append(document.createTextNode(l.text));
      thread.append(m);
    }
    hint.hidden = lines.length > 0;
    thread.hidden = !lines.length;
    thread.scrollTop = thread.scrollHeight;
  };
  paint([]);

  const row = el("div", "say");
  const box = document.createElement("textarea");
  box.rows = 1;
  box.placeholder = T("sh.say");
  box.addEventListener("input", () => {
    box.style.height = "2.7rem";
    box.style.height = Math.min(box.scrollHeight, 112) + "px";
  });
  const send = el("button", null, T("sh.send"));
  send.type = "button";
  send.addEventListener("click", async () => {
    const text = box.value.trim();
    if (!text) return;
    send.disabled = true;
    send.textContent = T("sh.sending");
    try {
      const r = await fetch("/api/shop/" + encodeURIComponent(HANDLE) + "/chat", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ device: device(), text, order }),
      });
      const j = await r.json().catch(() => null);
      if (r.ok && j?.ok) { box.value = ""; box.style.height = "2.7rem"; paint(j.lines); }
      else hint.textContent = T("sh.sendNo"), hint.hidden = false;
    } catch { hint.textContent = T("sh.sendNo"); hint.hidden = false; }
    send.disabled = false;
    send.textContent = T("sh.send");
  });
  row.append(box, send);
  card.append(row);
  card.append(el("p", "how", T("sh.chatPhone")));

  /* What is already there, fetched after the box is drawn so the sheet
     opens now rather than when the network says so. */
  fetch("/api/shop/" + encodeURIComponent(HANDLE) + "/chat",
    { cache: "no-store", headers: { "x-board-device": device() } })
    .then((r) => r.json())
    .then((j) => { if (j?.lines?.length) paint(j.lines); })
    .catch(() => {});

  /* WeChat, one tap down. Still the thing some people want, and no longer
     the thing everybody is asked for. */
  if (SHOP.wechat || SHOP.qr) {
    const more = document.createElement("details");
    more.className = "wxmore";
    const sum = document.createElement("summary");
    sum.textContent = T("sh.alsoWx");
    more.append(sum);
    wxInto(more);
    card.append(more);
  }

  const shut = el("button", "shut", T("sh.close"));
  shut.type = "button";
  shut.addEventListener("click", () => sheet.remove());
  card.append(shut);
  sheet.append(card);
  sheet.addEventListener("click", (e) => { if (e.target === sheet) sheet.remove(); });
  document.body.append(sheet);
  box.focus();
}

/* What people said about one thing. Ones with words first — a wall of bare
   five-star rows reads as bought, which is the opposite of the point. */
function revSheet(it, j, asks) {
  const sheet = el("div", "sh");
  const card = el("div", "shc");
  card.append(el("h2", null, it.name));

  /* 问大家 first: a question she is about to ask beats somebody else's
     verdict on a thing she has not bought. */
  card.append(askSection(it, asks));

  if (j?.n) card.append(el("h3", null, T("sh.reviews")));
  const list = el("div", "revs");
  for (const r of j.rows) {
    const box = el("div", "rev1");
    const top = el("div", "top");
    top.append(el("b", null, r.who || "***"));
    top.append(el("span", null, "★".repeat(r.stars)));
    box.append(top);
    if (r.text) box.append(el("p", null, r.text));
    /* Where it came from, when it did not come from an order here. Said
       rather than hidden: the whole value of the others is that they are
       tied to a purchase, and quietly mixing in ones that are not would
       spend that on nothing. */
    if (r.src) box.append(el("p", "src", T("sh.fromOld")));
    if (r.photo) {
      const img = el("img");
      img.src = r.photo;
      img.alt = "";
      img.loading = "lazy";
      img.addEventListener("error", () => img.remove());
      box.append(img);
    }
    if (r.back) {
      const b = el("p", "back");
      b.append(el("b", null, T("sh.shopSaid") + " "), document.createTextNode(r.back));
      box.append(b);
    }
    list.append(box);
  }
  card.append(list);
  const shut = el("button", "shut", T("sh.close"));
  shut.type = "button";
  shut.addEventListener("click", () => sheet.remove());
  card.append(shut);
  sheet.append(card);
  sheet.addEventListener("click", (e) => { if (e.target === sheet) sheet.remove(); });
  document.body.append(sheet);
}

/* 问大家 — the questions, whoever may answer them, and the box to add one.
   Answering is offered only to somebody the server says may: the page
   cannot see the orders and must not guess. */
function askSection(it, asks) {
  const sect = el("div", "sect");
  sect.append(el("h3", null, T("sh.asks")));

  for (const q of (asks?.rows || [])) {
    const box = el("div", "q");
    box.append(el("b", null, q.text));
    if (!q.answers.length) {
      box.append(el("p", "none", T("sh.noAnswer")));
    }
    for (const a of q.answers) {
      const p = el("p", "a");
      p.append(el("i", null, a.shop ? T("sh.shopSaid") : (a.who || T("sh.someone"))));
      p.append(document.createTextNode(a.text));
      box.append(p);
    }
    if (asks?.canAnswer) {
      const b = el("button", "reply", T("sh.answer"));
      b.type = "button";
      b.addEventListener("click", () => {
        b.remove();
        const row = el("div", "askrow");
        const i = document.createElement("input");
        i.placeholder = T("sh.answer");
        const go = el("button", null, T("sh.askGo"));
        go.type = "button";
        go.addEventListener("click", async () => {
          const text = i.value.trim();
          if (!text) return;
          go.disabled = true;
          try {
            const r = await fetch("/api/ask/" + encodeURIComponent(q.id) + "/answer", {
              method: "POST", headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ device: device(), text }),
            });
            if (r.ok) {
              row.remove();
              box.querySelector(".none")?.remove();
              const p = el("p", "a");
              p.append(el("i", null, T("sh.shopSaid")));
              p.append(document.createTextNode(text));
              box.append(p);
              return;
            }
          } catch { /* the words stay in the box */ }
          go.disabled = false;
        });
        row.append(i, go);
        box.append(row);
      });
      box.append(b);
    }
    sect.append(box);
  }

  /* Asking is open to anybody: she has not bought anything yet, and that
     is precisely why she is asking. */
  const row = el("div", "askrow");
  const i = document.createElement("input");
  i.placeholder = T("sh.askSay");
  const go = el("button", null, T("sh.askGo"));
  go.type = "button";
  const said = el("p", "none");
  said.hidden = true;
  go.addEventListener("click", async () => {
    const text = i.value.trim();
    if (!text) return;
    go.disabled = true;
    said.hidden = true;
    try {
      const r = await fetch("/api/product/" + encodeURIComponent(it.id) + "/ask", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ device: device(), text }),
      });
      const jj = await r.json().catch(() => null);
      if (r.ok && jj?.ok) {
        i.value = "";
        said.textContent = T("sh.askSent");
      } else {
        said.textContent = T(jj?.error === "waiting" ? "sh.askWait" : "sh.askNo");
      }
    } catch { said.textContent = T("sh.askNo"); }
    said.hidden = false;
    go.disabled = false;
  });
  row.append(i, go);
  sect.append(row, said);
  return sect;
}

/* The WeChat half, which used to be the whole sheet. */
function wxInto(card) {
  if (SHOP.wechat) {
    const row = el("div", "wx");
    row.append(el("b", null, SHOP.wechat));
    const c = el("button", null, T("sh.wechatCopy"));
    c.type = "button";
    c.addEventListener("click", async () => {
      /* execCommand first: the async clipboard is refused inside WeChat's
         own browser, which is where she is. */
      let done = false;
      try {
        const ta = document.createElement("textarea");
        ta.value = SHOP.wechat;
        ta.style.position = "fixed";
        ta.style.opacity = "0";
        document.body.append(ta);
        ta.select();
        done = document.execCommand("copy");
        ta.remove();
      } catch { done = false; }
      if (!done) { try { await navigator.clipboard.writeText(SHOP.wechat); done = true; } catch { } }
      if (done) c.textContent = T("sh.wechatDone");
    });
    row.append(c);
    card.append(row);
    card.append(el("p", "how", T("sh.wechatHow")));
  }

  if (SHOP.qr) {
    const img = el("img");
    img.src = SHOP.qr;
    img.alt = "";
    img.addEventListener("error", () => img.remove());
    card.append(img);
    card.append(el("p", "how", T("sh.qrHow")));
  }
}

function draw() {
  const root = $("root");
  root.textContent = "";

  /* The banner first, when there is one, then who it is. An <img> that
     fails is removed outright — see the note over the product pictures. */
  if (SHOP.banner) {
    const b = el("img", "ban");
    b.src = SHOP.banner;
    b.alt = "";
    b.addEventListener("error", () => b.remove());
    root.append(b);
  }

  /* THE BAND, AND WHAT IS ON IT.
     The name used to sit as small dark text over the page's own grey with
     one line under it, which is a document header — and the first screen is
     the one that decides whether she scrolls at all. Most of these shops
     have no banner photograph and never will, so this has to hold without
     one.
     The line under the name used to fall back through SHOP.say, which is
     who.goal — the sentence a member writes about themselves on the board,
     "I am a ___ looking for a ___". Under a shop selling infant formula it
     read "Spanish, learning Chinese from zero. I can help with English
     essays": the wrong person talking about the wrong thing, in the one
     line a buyer reads before deciding whether this is a real shop. The
     three chips answer what she is actually asking instead — is it real,
     how do I pay, where does it come from. */
  const hero = el("div", "hero");
  const top = el("div", "top");
  if (SHOP.photo) {
    const img = el("img");
    img.src = SHOP.photo;
    img.alt = "";
    /* NO EMPTY DISC WHERE A FACE ISN'T: a grey circle is not information,
       it is a hole that reads as something still loading. */
    img.addEventListener("error", () => img.remove());
    top.append(img);
  }
  const box = el("div");
  /* The shop's name when it has one, the handle only when it does not.
     Whoever is behind it is named once more at the foot of the page, and
     twice on one screen is a line she reads for nothing. */
  box.append(el("b", null, SHOP.name || SHOP.handle));
  top.append(box);
  /* The switch rides the band rather than sitting in a corner of the page:
     it belongs with who you are dealing with. Flipping it redraws the list
     and the bar together, because the total and the button live outside
     <main> and would otherwise be left behind in the other language. */
  top.append(langButton(() => { draw(); paint(); }));
  hero.append(top);
  const trust = el("div", "trust");
  for (const k of ["sh.tReal", "sh.tPay", "sh.tPost"]) trust.append(el("span", null, T(k)));
  hero.append(trust);
  root.append(hero);

  if (!ITEMS.length) {
    root.append(el("p", "none", T("sh.empty")));
    return;
  }

  /* THE SHELVES, IN THE ORDER THEY WERE PUT UP. Not alphabetical and not
     by size: the first thing added to a kind is the first thing she is
     shown, which is the seller's own judgement and better than a sort. */
  const kinds = [];
  for (const it of ITEMS) {
    const k = it.kind || "";
    if (!kinds.includes(k)) kinds.push(k);
  }
  const named = kinds.filter(Boolean);

  /* One shelf is not a shelf — the chips only earn their place when there
     is something to choose between. */
  if (named.length > 1) {
    const tabs = el("div", "tabs");
    for (const k of [""].concat(named)) {
      const b = el("button", (SHELF === k) ? "on" : null, k || T("sh.all"));
      b.type = "button";
      b.addEventListener("click", () => { SHELF = k; draw(); paint(); });
      tabs.append(b);
    }
    root.append(tabs);
  }

  const show = SHELF ? kinds.filter((k) => k === SHELF) : kinds;
  for (const k of show) {
    const mine = ITEMS.filter((it) => (it.kind || "") === k);
    if (!mine.length) continue;
    /* The heading only when there is more than one shelf on screen — a
       single heading over the whole page is a word she reads for nothing. */
    if (k && show.length > 1) root.append(el("p", "shelf", k));
    root.append(grid(mine));
  }

  root.append(el("p", "foot", T("sh.foot", { who: SHOP.handle })));
}

function grid(items) {
  /* A shelf of one gets the wide row rather than half an empty grid — see
     .grid.one. */
  const wrap = el("div", items.length === 1 ? "grid one" : "grid");
  for (const it of items) {
    const card = el("div", "item");
    /* NO PICTURE IS A BOX, NOT A BROKEN ONE. An <img> with an empty src
       draws the browser's torn-page icon, which reads as something failing
       rather than something missing. */
    if (it.photo) {
      const pic = el("img", "pic");
      pic.src = it.photo;
      pic.alt = "";
      pic.loading = "lazy";
      card.append(pic);
    } else {
      card.append(el("div", "pic"));
    }

    const mid = el("div", "mid");
    /* Asked per row, once, after the list is on screen. A shop with no
       reviews makes no extra request and shows no extra line. */
    const rv = el("button", "rv");
    rv.type = "button";
    rv.hidden = true;
    /* Her name for it, or the warehouse's when the page is being read in
       English — the same row, said to whoever is looking at it. */
    mid.append(el("div", "nm", (lang() === "en" && it.en) ? it.en : it.name));
    mid.append(rv);
    fetch("/api/product/" + encodeURIComponent(it.id) + "/reviews", { cache: "no-store" })
      .then((r) => r.json())
      .then(async (j) => {
        let asks = { rows: [], n: 0, canAnswer: false };
        try {
          const a = await fetch("/api/product/" + encodeURIComponent(it.id) + "/asks",
            { cache: "no-store", headers: { "x-board-device": device() } });
          asks = await a.json();
        } catch { /* questions are the optional half */ }
        /* Nothing to say yet? Then no line. An empty 评价 says nobody
           bought this, which is worse than not asking the question. */
        if (!j?.n && !asks.n) return;
        rv.textContent = "";
        if (j?.n) {
          rv.append(el("b", null, "★ " + j.stars.toFixed(1)));
          rv.append(document.createTextNode("  "
            + T(j.n === 1 ? "sh.stars1" : "sh.stars", { stars: j.stars.toFixed(1), n: j.n })
              .replace(/^[^·]*· /, "")));
        }
        if (asks.n) {
          rv.append(document.createTextNode((j?.n ? "  ·  " : "")
            + T(asks.n === 1 ? "sh.nAsks1" : "sh.nAsks", { n: asks.n })));
        }
        rv.hidden = false;
        rv.addEventListener("click", () => revSheet(it, j, asks));
      })
      .catch(() => {});
    if (it.unit) mid.append(el("div", "un", it.unit));
    const row = el("div", "row");
    const pr = el("div", "pr");
    pr.append(el("i", null, "¥"), document.createTextNode((it.price / 100).toLocaleString("zh-CN")));
    row.append(pr);
    row.append(it.out ? el("span", "gone", T("sh.out")) : stepper(it));
    mid.append(row);
    card.append(mid);
    wrap.append(card);
  }
  return wrap;
}

$("ask").addEventListener("click", askSheet);

$("go").addEventListener("click", () => {
  const lines = [...CART].map(([id, n]) => ({ id, n }));
  try { sessionStorage.setItem("shop:cart", JSON.stringify({ handle: HANDLE, lines })); } catch { }
  location.href = "/shop/" + encodeURIComponent(HANDLE) + "/checkout";
});

(async () => {
  try {
    const r = await fetch("/api/shop/" + encodeURIComponent(HANDLE), { cache: "no-store" });
    const j = await r.json();
    if (!r.ok || !j?.ok) throw new Error("gone");
    SHOP = j.shop; ITEMS = j.products || []; POST = j.post ?? 3000;
    /* Always there now. The thread exists whether or not the shop left a
       WeChat id, which is the point of having built it. */
    $("ask").hidden = false;
    document.title = SHOP.name || T("sh.here", { who: SHOP.handle });
    draw();
    paint();
  } catch {
    $("root").append(el("p", "none", T("sh.gone")));
  }
})();
</script>
