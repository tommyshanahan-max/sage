<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>我的订单</title>
<meta name="robots" content="noindex">
<!--
  HER OWN ORDERS, AND STILL NO ACCOUNT.

  One order was one link, and a link lost in a chat took the order with it.
  Every shop she has ever used has 我的订单 and she looks for it here.

  A ROW IS FOUR WORDS AND A NUMBER: what it was, how many, what state, what
  it cost. Not an id — twenty characters of hex is not how anybody recognises
  an order. The state word comes from the same four as everywhere else.

  The browser is the whole of her identity. That is the same bargain as the
  rest of this — no account, nothing to recover — and the page says so at the
  bottom rather than letting her find out on a new phone.
-->
<style>
  :root{
    --bg:#F5F5F7; --card:#FFFFFF; --ink:#111214; --ink2:#5B6170; --mut:#8A8F9C;
    --line:#E7E8EC; --acc:#D6483B; --ok:#1FA463;
    --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB",
      "Microsoft YaHei","Noto Sans SC",sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink)}
  body{font-family:var(--sans);font-size:16px;line-height:1.55;
    padding:env(safe-area-inset-top,0) 0 calc(1rem + env(safe-area-inset-bottom,0))}
  main{max-width:34rem;margin:0 auto;padding:.9rem .8rem 1rem}
  .head{display:flex;align-items:center;gap:.8rem;padding:.2rem .3rem 1rem}
  .head b{font-size:1.15rem}
  .lang{margin-left:auto;border:1px solid var(--line);background:var(--card);
    color:var(--ink2);font:inherit;font-size:.75rem;border-radius:999px;
    padding:.25rem .65rem}
  a.row{display:block;text-decoration:none;color:inherit;background:var(--card);
    border-radius:.9rem;padding:.85rem .9rem;margin:0 0 .6rem}
  .top{display:flex;align-items:baseline;justify-content:space-between;gap:.8rem}
  .top .st{font-size:.82rem;color:var(--acc);flex:0 0 auto}
  .top .st.ok{color:var(--ok)}
  .top .shop{font-size:.8rem;color:var(--mut);overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap}
  .nm{margin:.3rem 0 0;font-size:.95rem;display:-webkit-box;-webkit-line-clamp:1;
    -webkit-box-orient:vertical;overflow:hidden}
  .bot{display:flex;align-items:baseline;justify-content:space-between;
    gap:.8rem;margin:.35rem 0 0}
  .bot .n{font-size:.8rem;color:var(--mut)}
  .bot b{font-size:1.05rem;color:var(--acc)}
  .none{padding:3rem 1rem;text-align:center;color:var(--mut)}
  .foot{padding:1.4rem .4rem 0;font-size:.75rem;line-height:1.7;color:var(--mut);
    text-align:center}
</style>

<main id="root"></main>

<script type="module">
import { T, setLang, pickLang, langButton } from "/i18n.js";

/* Chinese unless the reader has said otherwise — see pickLang. */
setLang(pickLang("zh"));

const $ = (id) => document.getElementById(id);
const el = (t, cls, text) => {
  const n = document.createElement(t);
  if (cls) n.className = cls;
  if (text != null) n.textContent = text;
  return n;
};
const device = () => { try { return localStorage.getItem("board:device") || ""; } catch { return ""; } };

let ROWS = [];

function draw() {
  const root = $("root");
  root.textContent = "";
  document.title = T("od.mine");

  const head = el("div", "head");
  head.append(el("b", null, T("od.mine")));
  head.append(langButton(() => draw()));
  root.append(head);

  if (!ROWS.length) {
    root.append(el("p", "none", T("od.none")));
    return;
  }

  for (const o of ROWS) {
    const a = el("a", "row");
    a.href = "/order/" + encodeURIComponent(o.id);
    const top = el("div", "top");
    top.append(el("span", "shop", o.shop));
    top.append(el("span", o.state === "done" ? "st ok" : "st", T("od." + o.state)));
    a.append(top);
    a.append(el("p", "nm", o.first));
    const bot = el("div", "bot");
    bot.append(el("span", "n", o.n === 1 ? T("od.count1") : T("od.count", { n: o.n })));
    bot.append(el("b", null, o.total));
    a.append(bot);
    root.append(a);
  }

  root.append(el("p", "foot", T("od.thisPhone")));
}

(async () => {
  try {
    const r = await fetch("/api/orders", { cache: "no-store",
      headers: { "x-board-device": device() } });
    const j = await r.json();
    ROWS = j?.orders || [];
  } catch { ROWS = []; }
  draw();
})();
</script>
