<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- Empty on every deployment but the demo board, where it pins this
     browser to the one seeded identity. See BOARD_DEMO_DEVICE in server.js. -->
{{DEMO}}
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="/favicon.png" sizes="192x192">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#EEF0F4">
<meta name="theme-color" content="#0B0E15" media="(prefers-color-scheme: dark)">
<title>交换 · The Exchange — ask to join</title>
<meta name="description" content="Put your name down. Somebody already inside decides.">

<!-- WeChat's crawler fetches this once and runs no JavaScript, so the card is
     built from these. It says what the page does rather than what the board
     is: this link is pasted into groups, and the question a person in a group
     is answering is whether to bother tapping. -->
<meta property="og:type" content="website">
<meta property="og:title" content="交换 · The Exchange">
<meta property="og:description" content="A private board for people doing business across a border. Put your name down — somebody already inside decides.">
<meta property="og:image" content="{{ORIGIN}}/share.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:url" content="{{HERE}}">
<meta name="twitter:card" content="summary_large_image">
<meta name="color-scheme" content="light dark">
<link rel="stylesheet" href="/site.css">

<style>
  /* ONE SCREEN, ONE THING ON IT.
   *
   * Every other way in has something in front of the form. The public page
   * opens with what the board is, because it is written for somebody who has
   * never heard of it; the door asks for a code, because it is written for
   * somebody holding one; and inside WeChat the door puts a wall about
   * browsers ahead of both. All three are right for the person they were
   * written for, and all three are wrong for the one case this page is: a link
   * pasted into a group of forty strangers, where the only question is whether
   * to put your name down and nobody is going to scroll to find out.
   *
   * So: the mark, a sentence, the form. Nothing above it, nothing beside it,
   * and no other button on the page.
   */
  .jwrap{max-width:26rem;margin:0 auto;padding:2.2rem 1.15rem 3rem}
  .jbrand{display:flex;align-items:center;gap:.5rem;margin:0 0 1.6rem}
  .jbrand i{width:2.1rem;height:2.1rem;border-radius:.55rem;background:var(--ink);
    color:var(--paper);display:grid;place-items:center;font-style:normal;
    font:400 1rem/1 var(--serif)}
  .jbrand b{font:400 1.05rem/1.15 var(--serif);color:var(--ink)}
  .jbrand small{display:block;font-size:.7rem;color:var(--muted)}
  .jbrand .l{margin-left:auto}
  /* THE WAY BACK IN, AT THE TOP.
   *
   * There were two — one in the form box and one at the foot — and both were
   * fine while this page was a sentence and a form. The board went above the
   * form and made the page three times longer, which left somebody who is
   * already a member scrolling past everybody else's faces to find the door
   * they came for. It is small, because a returning member is not the reader
   * this page is written for; it is at the top, because they are the one
   * reader who knows exactly what they came to do. */
  .jin{font-size:.82rem;font-weight:650;color:var(--accent);text-decoration:none;
    padding:.35rem .7rem;border-radius:999px;border:1px solid var(--line);
    white-space:nowrap}
  .jin:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .jlede{font:400 clamp(1.35rem,5.4vw,1.7rem)/1.25 var(--serif);color:var(--ink);
    margin:0 0 .5rem}
  .jsub{font-size:.95rem;line-height:1.6;color:var(--ink-2);margin:0 0 1.5rem}
  /* The one link off this page, and it is small on purpose: somebody who has a
     code is not the reader here, and a second button beside a form is a
     decision that costs the form. */
  .jhas{display:block;margin:1.6rem 0 0;text-align:center;font-size:.82rem;
    color:var(--muted);text-decoration:none}
  .jhas b{color:var(--accent);font-weight:650}

  /* THE BOARD, BEFORE THE FORM.
   *
   * The note above said one screen with one thing on it, and that was right
   * while the only question was whether to put your name down. It is wrong
   * for somebody off an Instagram link who has never heard of this: they will
   * not fill a form to find out what is behind it. So the board goes first —
   * the rooms, then the people — and the form is underneath, where somebody
   * who has just seen a reason to fill it in can reach it.
   *
   * ROOMS RUN ACROSS AND PEOPLE RUN DOWN. A room is a place you walk past and
   * step into; a person is a row. Putting either in the other's shape is what
   * makes them read as the same thing.
   */
  .flab{font-size:1.02rem;font-weight:700;letter-spacing:-.01em;color:var(--ink);
    margin:1.9rem 0 .6rem}
  .flab em{font-style:normal;font-weight:400;font-size:.88rem;color:var(--muted)}
  .fstrip{display:flex;gap:.6rem;overflow-x:auto;margin:0 -1.15rem;
    padding:0 1.15rem .5rem;scrollbar-width:none}
  .fstrip::-webkit-scrollbar{display:none}
  .frm{flex:none;width:7.6rem;border:1px solid var(--line);background:var(--card);
    border-radius:.9rem;padding:.85rem .8rem;font:inherit;color:var(--ink);
    cursor:pointer;text-decoration:none;display:block;text-align:left}
  /* A COLOUR PER ROOM, and the same one everywhere on the board — see wash()
     below. Every mark was the one accent blue, so five doors side by side
     were five identical squares and the strip read as a list rather than as
     a row of different places. */
  .frm i{width:2.2rem;height:2.2rem;border-radius:.65rem;display:grid;
    place-items:center;font-style:normal;font-size:.95rem;font-weight:700;
    color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.35);margin-bottom:.6rem}
  /* The name wraps rather than being cut: "Factories & buyers" is two words
     and a room nobody can read the name of is not a door. */
  .frm b{display:block;font-weight:600;font-size:.9rem;line-height:1.25}
  .frm span{display:block;font-size:.76rem;color:var(--muted);margin-top:.25rem}

  /* One member at the size of a person. It is the only thing on this page a
     stranger cannot have, which is what makes it worth showing large. */
  /* THE CARD IS THE PHOTOGRAPH. The name, the line, the arrows and the count
     all sit on it, so the only furniture under a member is the next thing on
     the page. */
  /* CAPPED ON THE WIDTH, WHICH IS THE ONLY SAFE WAY TO CAP IT.
   *
   * The frame was height:clamp(180px,42vw,240px) and became aspect-ratio:4/5
   * with nothing holding it, when heads were being cropped off. Portrait was
   * the right shape — but the actual cause of the cropping was photoAt not
   * being sent, which is fixed, and the ratio on its own turned a 240px
   * picture into a 500px one on a phone. Said plainly: the old size was
   * better.
   *
   * IT CANNOT BE PUT BACK WITH max-height. A max-height on an aspect-ratio
   * box shrinks the WIDTH to keep the ratio, which leaves the card wider than
   * the photograph and a dark strip down the side of it — that was the bug in
   * a9b3735 and it only showed on short windows, which is why it survived a
   * check. Capping the width makes the width the driver and the height
   * follows, so there is nothing for the ratio to fight.
   *
   * 320px, which is 400px tall: between the 240 it was and the 500 it became,
   * and still the largest thing on the page. */
  .fdeck{position:relative;border:1px solid var(--line);background:var(--card);
    border-radius:1rem;overflow:hidden;
    width:100%;max-width:320px;margin-inline:auto}
  /* A FACE WHERE THERE IS ONE, A LETTER WHERE THERE IS NOT. Both are the
     same box, so the deck does not change height when somebody without a
     photograph comes round — a card that jumps as you page through it reads
     as broken. */
  .fface{position:relative;aspect-ratio:4/5;display:grid;
    place-items:center;font-size:clamp(2.6rem,11vw,3.4rem);font-weight:700;
    color:#fff;letter-spacing:-.03em;overflow:hidden}
  .fface img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
    display:block}
  /* The gradient is heavy on purpose. A Chinese line is dense and a
     photograph under it is not a flat colour — a light scrim reads fine
     against a grey studio wall and disappears against a window. */
  .ffoot{position:absolute;left:0;right:0;bottom:0;padding:1.8rem .95rem .9rem;
    background:linear-gradient(transparent,rgba(6,10,18,.55) 35%,rgba(6,10,18,.93));
    color:#fff;pointer-events:none}
  .fnm{font-size:1.12rem;font-weight:700;letter-spacing:-.015em;
    text-shadow:0 1px 3px rgba(0,0,0,.6)}
  /* Two lines and then it stops. Somebody's own sentence can be any length,
     and a paragraph creeping up a photograph is worse than a cut one. */
  .fln{font-size:.9rem;margin-top:.15rem;opacity:.94;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
    overflow:hidden;text-shadow:0 1px 3px rgba(0,0,0,.6)}
  .farw{position:absolute;top:44%;transform:translateY(-50%);width:2.4rem;height:2.4rem;
    border-radius:50%;border:0;background:rgba(10,14,22,.55);color:#fff;
    display:grid;place-items:center;font-size:1.1rem;font-weight:700;cursor:pointer;
    -webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
  .farw.l{left:.5rem} .farw.r{right:.5rem}
  .farw:focus-visible{outline:2px solid #fff;outline-offset:2px}
  /* WHAT MAKES THIS PERSON DIFFERENT, ON THE PERSON. The heading over the
     deck already says it, but a heading is not on the card — and the card is
     what gets screenshotted, sent on, and looked at alone. Gold rather than
     the accent: the accent is every button on the board, and this is not a
     thing to press.
     THERE IS NO OPPOSITE BADGE. Tier two is marked by the absence of this
     one; a chip that labelled somebody as the lesser kind would be a caste
     mark, and the heading over their list already says what they are. */
  .fvouch{position:absolute;left:.6rem;top:.6rem;display:flex;align-items:center;
    gap:.28rem;font-size:.72rem;font-weight:700;color:#F0DFAE;
    background:rgba(10,14,22,.55);border:1px solid rgba(240,223,174,.35);
    border-radius:999px;padding:.16rem .55rem .16rem .4rem;pointer-events:none;
    -webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
  .fvouch svg{width:.85rem;height:.85rem;display:block}

  .fof{position:absolute;right:.6rem;top:.6rem;font-size:.72rem;font-weight:700;
    color:#fff;background:rgba(10,14,22,.55);border-radius:999px;padding:.18rem .55rem;
    font-variant-numeric:tabular-nums;pointer-events:none;
    -webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}

  .frow{display:flex;gap:.8rem;align-items:center;padding:.8rem 0;
    border-bottom:1px solid var(--line)}
  .frow:last-child{border-bottom:0}
  .fav{position:relative;width:2.4rem;height:2.4rem;border-radius:50%;display:grid;
    place-items:center;font-weight:700;font-size:.88rem;color:#fff;flex:none;
    overflow:hidden}
  .fav img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
    display:block}
  .fw{flex:1;min-width:0}
  .fw b{display:block;font-weight:600;font-size:.96rem}
  .fw span{display:block;font-size:.85rem;color:var(--muted);margin-top:.05rem;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .fnone{font-size:.9rem;color:var(--muted);padding:.9rem 0}
  .fsoon{margin:1.6rem 0 0;padding:.9rem 1rem;border:1px dashed var(--line);
    border-radius:.8rem;background:none}
  .fsoon b{display:block;font-size:1rem;font-weight:700}
  .fsoon span{display:block;font-size:.88rem;color:var(--muted);margin-top:.15rem}
  .fsoon em{display:inline-block;font-style:normal;font-size:.72rem;font-weight:700;
    color:var(--accent);background:var(--accent-soft);border-radius:999px;
    padding:.16rem .55rem;margin-top:.55rem}
</style>
</head>
<body>

<div class="jwrap">
  <div class="jbrand">
    <i><svg viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="7" style="width:1em;height:1em;display:block" aria-hidden="true"><circle cx="38" cy="50" r="24"/><circle cx="62" cy="50" r="24"/></svg></i>
    <span><b>The Exchange</b><small>交换</small></span>
    <a class="l jin" id="signin" href="/enter"></a>
    <span id="langslot"></span>
  </div>

  <h1 class="jlede" id="lede"></h1>
  <p class="jsub" id="sub"></p>

  <div id="front" hidden>
    <div id="memBlock" hidden>
      <p class="flab" id="labMembers"></p>
      <div class="fdeck" id="deck"></div>
    </div>

    <p class="flab" id="labRooms"></p>
    <div class="fstrip" id="rooms"></div>

    <!-- THE OTHER REASON TO BE HERE, and it is not a person. Said once, in
         one line, with the word that makes it honest: it is not built yet.
         A board that quietly implied it could already move money would be
         lying to the one audience that would notice fastest. -->
    <p class="fsoon"><b id="soonHead"></b><span id="soonSub"></span>
      <em id="soonTag"></em></p>

    <div id="openBlock" hidden>
      <p class="flab" id="labOpen"></p>
      <div id="openRows"></div>
    </div>
  </div>

  <div id="waitslot"></div>

  <a class="jhas" id="has" href="/enter"></a>
</div>

<script type="module">
import { T, setLang, pickLang, langButton, lang } from "/i18n.js";
import { waitBox, tally } from "/wait.js";

const $ = (id) => document.getElementById(id);

/* THE BOARD ITSELF, FETCHED RATHER THAN DESCRIBED.
 *
 * Everything below is drawn from /api/front, which is open and takes no
 * device: this page is read by people who are nobody yet. If the fetch fails
 * the page is exactly what it was before — a sentence and a form — because
 * the block starts hidden and is only shown once there is something in it. A
 * front door that breaks into an error is worse than one that is plain. */
const COL = ["--t1", "--t2", "--t3", "--t4", "--t5", "--t6"];
const tint = (i) => "var(" + COL[i % COL.length] + ")";
const first = (s) => String(s || "?").trim().charAt(0).toUpperCase();
let FRONT = null, at = 0;

/* Their own line, in the reader's language when it has been rendered into it.
   Same rule the cards keep: written once when it was said, swapped here. */
function line(q) {
  const want = lang() === "zh" ? "zh" : "en";
  if (q.goalAlt && q.goalLang && q.goalLang !== want) return q.goalAlt;
  return q.goal || "";
}
function where(q) { return q.campus || q.here || ""; }

/* A COLOUR FROM THE NAME, NOT FROM THE ORDER — the same routine as
   groups.html, notes.html and room.html, so a room is the same colour here as
   it is inside it. Keyed on the room's KEY and never on its translated name:
   "trade" and "工厂与买家" must not be two different colours to two readers
   looking at the same door.
   Not random either. It has to be the same tomorrow. */
function hueOf(key) {
  let h = 0;
  for (const ch of String(key || "?")) h = (h * 31 + ch.codePointAt(0)) % 360;
  /* AND THEN SPREAD, which is where this parts company with wash() on the
     other pages and does so on purpose.
     That routine hashes a PERSON'S NAME, and there are hundreds of those:
     two landing near each other is a coincidence somebody might never see.
     There are five rooms, they sit side by side in one strip, and the plain
     hash put "film" on 244 and "invest" on 245 — one degree apart, which is
     the same colour to anybody looking at it. Multiplying by 137 walks the
     circle at roughly the golden angle, so the six keys land 32 degrees apart
     at the closest instead of one. Still only the key, so still the same
     tomorrow. */
  return (h * 137) % 360;
}
function wash(key) {
  const h = hueOf(key);
  return "linear-gradient(150deg,hsl(" + h + " 40% 58%),hsl("
    + ((h + 24) % 360) + " 38% 42%))";
}

function drawRooms() {
  const box = $("rooms");
  box.innerHTML = "";
  for (const r of FRONT.rooms) {
    const a = document.createElement("a");
    a.className = "frm";
    a.href = "/r/" + r.key;
    const nm = T("waitroom." + r.key);
    a.innerHTML = '<i>' + first(nm) + '</i><b></b><span></span>';
    a.querySelector("i").style.background = wash(r.key);
    /* The card carries the faintest wash of the same hue, so the colour is the
       room's rather than a decoration on its corner. Low enough that it holds
       on both papers — the board has a light skin and a dark one. */
    a.style.background = "hsl(" + hueOf(r.key) + " 45% 50% / .07)";
    a.querySelector("b").textContent = nm;
    a.querySelector("span").textContent = r.n ? T("front.inRoom", { n: r.n }) : "";
    box.append(a);
  }
}
function drawDeck() {
  const list = FRONT.members;
  if (!list.length) { $("memBlock").hidden = true; return; }
  $("memBlock").hidden = false;
  at = ((at % list.length) + list.length) % list.length;
  const q = list[at];
  const d = $("deck");
  d.innerHTML = '<div class="fface"></div>'
    + '<div class="ffoot"><div class="fnm"></div><div class="fln"></div></div>'
    + '<span class="fvouch">'
    + '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"'
    + ' stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'
    + '<path d="m5 13 4 4L19 7"/></svg><span></span></span>'
    + '<span class="fof"></span>'
    + '<button class="farw l" type="button" data-go="-1">\u2039</button>'
    + '<button class="farw r" type="button" data-go="1">\u203A</button>';
  for (const btn of d.querySelectorAll(".farw")) {
    const step = Number(btn.getAttribute("data-go"));
    btn.setAttribute("aria-label", T(step < 0 ? "front.back" : "front.next"));
    btn.addEventListener("click", () => { at += step; drawDeck(); });
  }
  const face = d.querySelector(".fface");
  face.style.background = tint(at);
  face.textContent = first(q.handle);
  /* The letter is written first and the photograph is laid over it, so a file
     that 404s or is slow leaves the initial showing rather than a grey box.
     onerror removes the image rather than hiding it — a broken <img> with
     alt text on top of a letter is two things in one square. */
  if (q.photo) {
    const img = document.createElement("img");
    img.alt = "";
    img.loading = "eager";
    img.addEventListener("error", () => img.remove());
    /* Where they put their own face in the frame. Everybody who has never
       dragged it sits at 50, which is the middle — and the middle of a
       portrait is a chest, so the frame above is shaped to crop as little as
       possible rather than this number being second-guessed. */
    if (Number.isFinite(Number(q.photoAt))) {
      img.style.objectPosition = "50% " + Number(q.photoAt) + "%";
    }
    img.src = "/api/front-face?id=" + encodeURIComponent(q.photo);
    face.append(img);
  }
  d.querySelector(".fnm").textContent = q.handle + (where(q) ? " · " + where(q) : "");
  d.querySelector(".fln").textContent = line(q);
  /* One of one is not a count, it is a fact nobody needed — and two arrows
     that only ever come back to the same person are worse than none. */
  d.querySelector(".fvouch span").textContent = T("front.vouched");
  const one = list.length < 2;
  d.querySelector(".fof").textContent = one
    ? "" : T("front.of", { n: at + 1, all: list.length });
  for (const b of d.querySelectorAll(".farw")) b.hidden = one;
}
function drawOpen() {
  const list = FRONT.open;
  $("openBlock").hidden = false;
  const box = $("openRows");
  box.innerHTML = "";
  if (!list.length) {
    const p = document.createElement("p");
    p.className = "fnone";
    p.textContent = T("front.noneOpen");
    box.append(p);
    return;
  }
  list.slice(0, 8).forEach((q, i) => {
    const row = document.createElement("div");
    row.className = "frow";
    row.innerHTML = '<span class="fav"></span><span class="fw"><b></b><span></span></span>';
    const av = row.querySelector(".fav");
    av.style.background = tint(i);
    av.textContent = first(q.handle);
    if (q.photo) {
      const img = document.createElement("img");
      img.alt = "";
      img.loading = "lazy";
      img.addEventListener("error", () => img.remove());
      if (Number.isFinite(Number(q.photoAt))) {
        img.style.objectPosition = "50% " + Number(q.photoAt) + "%";
      }
      img.src = "/api/front-face?id=" + encodeURIComponent(q.photo);
      av.append(img);
    }
    row.querySelector("b").textContent = q.handle + (where(q) ? " · " + where(q) : "");
    row.querySelector(".fw span").textContent = line(q);
    box.append(row);
  });
}
function drawFront() {
  if (!FRONT) return;
  $("labRooms").innerHTML = "";
  $("labRooms").append(document.createTextNode(T("front.rooms") + " "));
  const e1 = document.createElement("em"); e1.textContent = T("front.roomsSub");
  $("labRooms").append(e1);
  $("labMembers").innerHTML = "";
  $("labMembers").append(document.createTextNode(T("front.members") + " "));
  const e2 = document.createElement("em"); e2.textContent = T("front.membersSub");
  $("labMembers").append(e2);
  $("labOpen").innerHTML = "";
  $("labOpen").append(document.createTextNode(T("front.open") + " "));
  const e3 = document.createElement("em"); e3.textContent = T("front.openSub");
  $("labOpen").append(e3);
  $("soonHead").textContent = T("front.paidHead");
  $("soonSub").textContent = T("front.paidSub");
  $("soonTag").textContent = T("front.paidTag");
  drawRooms(); drawDeck(); drawOpen();
  $("front").hidden = false;
}

fetch("/api/front")
  .then((r) => (r.ok ? r.json() : null))
  .then((d) => { if (!d) return; FRONT = d; drawFront(); })
  .catch(() => {});

function paint() {
  document.title = T("join.tab");
  document.documentElement.lang = /* the page is the language it is read in */
    document.documentElement.lang;
  $("lede").textContent = T("join.lede");
  $("sub").textContent = T("join.sub");
  $("signin").textContent = T("join.signin");
  $("has").innerHTML = "";
  $("has").append(document.createTextNode(T("join.has") + " "));
  const b = document.createElement("b");
  b.textContent = T("join.hasGo");
  $("has").append(b);
}

setLang(pickLang());
paint();
$("langslot").append(langButton(() => {
  paint();
  /* The form is built from strings, so it is rebuilt rather than translated in
     place — half of it in one language is worse than either. */
  $("waitslot").textContent = "";
  $("waitslot").append(waitBox());
  // The board is drawn from strings too, and half of it in one language is
  // worse than either.
  drawFront();
}));

$("waitslot").append(waitBox());

/* Counted the same way every other door is: opened, begun, joined — three
   integers by day and room, and nothing in the record can name anybody. */
tally("door");
</script>
</body>
</html>
