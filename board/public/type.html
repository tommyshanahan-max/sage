<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="/favicon.png" sizes="192x192">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#EEF0F4">
<meta name="theme-color" content="#0B0E15" media="(prefers-color-scheme: dark)">

<meta name="apple-mobile-web-app-capable" content="yes">

<meta property="og:description" content="Twenty choices, two minutes. It shows where you sit, not just four letters.">
<meta property="og:image" content="{{ORIGIN}}/share.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">

<style>
  :root{
    --paper:#EEF0F4; --raise:#F7F8FB; --ink:#151B28; --ink-2:#4E5968;
    --muted:#8A939F; --line:#E3E6EC; --hair:#EAECF1;
    --accent:#3F68D8; --accent-ink:#FFFFFF; --accent-soft:#E8ECF7;
    --t3:#D99038; --t6:#2F8C9E;
    --serif:Georgia,"Songti SC","Noto Serif CJK SC",'Times New Roman',serif;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",
      "Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;
    --shadow:0 2px 6px rgba(21,27,40,.07),0 10px 28px rgba(21,27,40,.09);
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --paper:#0B0E15; --raise:#141924; --ink:#E9EDF5; --ink-2:#A3B0C4;
      --muted:#6F7D92; --line:#232B39; --hair:#1E2531;
      --accent:#5C8DFF; --accent-ink:#0B0E15; --accent-soft:#18233D;
      --t3:#E4A65A; --t6:#4FA9BC;
      --shadow:0 2px 6px rgba(0,0,0,.4),0 12px 32px rgba(0,0,0,.34);
    }
  }
  :root[data-theme="dark"]{
    --paper:#0B0E15; --raise:#141924; --ink:#E9EDF5; --ink-2:#A3B0C4;
    --muted:#6F7D92; --line:#232B39; --hair:#1E2531;
    --accent:#5C8DFF; --accent-ink:#0B0E15; --accent-soft:#18233D;
    --t3:#E4A65A; --t6:#4FA9BC;
    --shadow:0 2px 6px rgba(0,0,0,.4),0 12px 32px rgba(0,0,0,.34);
  }
  :root[data-lang="zh"]{
    --serif:"Songti SC","Noto Serif CJK SC","Source Han Serif SC","STSong",Georgia,serif;
    --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB",
      "Microsoft YaHei","Noto Sans SC","Segoe UI",sans-serif;
  }
  :root[data-lang="zh"] body{line-height:1.75}
  :root[data-lang="zh"] .eyebrow,
  :root[data-lang="zh"] .pole{text-transform:none;letter-spacing:.02em}
  [hidden]{display:none!important}

  *{box-sizing:border-box}
  /* One size up, the same as everywhere else — see the note in index.html. */
  html{font-size:17px;-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);
    font-size:1rem;line-height:1.5;-webkit-font-smoothing:antialiased}
  main{max-width:34rem;margin:0 auto;padding:0 1.15rem 4rem}
  button{font:inherit;cursor:pointer}
  a{color:inherit}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}

  /* The strip that says this is not open yet. Quiet, full width, above
     everything — it is a status, not an announcement, and it is the first
     thing somebody arriving from a friend's link should read. */
  .invite{margin:0 -1.15rem .9rem;padding:.5rem 1.15rem;background:var(--accent-soft);
    color:var(--accent);font-size:.78rem;letter-spacing:.02em;text-align:center}
  .bar{display:flex;align-items:center;gap:.7rem;padding:.9rem 0 1.2rem}
  .bar a.back{color:var(--ink);text-decoration:none;display:grid;place-items:center;
    margin-left:-.3rem}
  .bar svg{width:1.5rem;height:1.5rem;stroke:currentColor;fill:none;stroke-width:1.8;
    stroke-linecap:round;stroke-linejoin:round}
  .bar .lang{margin-left:auto;border:1px solid var(--line);background:var(--raise);
    color:var(--ink-2);border-radius:99px;padding:.42rem .9rem;font-size:.85rem;line-height:1}

  .eyebrow{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
  h1{margin:.5rem 0 0;font-family:var(--serif);font-weight:400;font-size:2rem;
    line-height:1.12}
  .egs{margin:.55rem 0 0;font-family:var(--serif);font-size:1.25rem;
    letter-spacing:.06em;color:var(--accent)}
  .lede{margin:.8rem 0 0;font-size:1.02rem;line-height:1.65;color:var(--ink-2)}
  /* The reason to take this one and not another. Set apart, because it is the
     claim the rest of the page has to make good on. */
  .lede.lean{margin-top:1rem;padding-left:.95rem;border-left:2px solid var(--accent);
    font-size:.98rem}
  .go{margin:1.6rem 0 0;border:0;background:var(--accent);color:var(--accent-ink);
    border-radius:99px;padding:.85rem 1.9rem;font-size:1.05rem}
  .quiet{margin:.8rem 0 0;border:1px solid var(--line);background:var(--raise);
    color:var(--ink);border-radius:99px;padding:.7rem 1.4rem;font-size:.95rem;
    text-decoration:none;display:inline-block}
  /* One loud button on this screen, and it is Share. Two would be a screen
     that has not decided what it wants. */
  .quiet.wide{display:block;width:100%;text-align:center;padding:.8rem 1rem;
    font-size:1rem}
  .note{margin:1.4rem 0 0;font-size:.86rem;line-height:1.6;color:var(--muted)}
  .feedwhat{margin:.5rem 0 0;font-size:.82rem;line-height:1.5;color:var(--muted);
    text-align:center}

  /* ---- one question at a time --------------------------------------------
   * A forced choice is the whole instrument, so the two options are the whole
   * screen: same size, same weight, nothing between them that could read as a
   * middle. */
  .count{font-size:.78rem;color:var(--muted);font-variant-numeric:tabular-nums}
  .track{height:3px;background:var(--line);border-radius:99px;margin:.5rem 0 1.8rem;
    overflow:hidden}
  .track i{display:block;height:100%;background:var(--accent);border-radius:99px;
    transition:width .22s ease}
  .ask{margin:0;font-family:var(--serif);font-weight:400;font-size:1.5rem;
    line-height:1.25;text-wrap:balance}
  .picks{display:grid;gap:.75rem;margin:1.7rem 0 0}
  .pick{border:1px solid var(--line);background:var(--raise);color:var(--ink);
    border-radius:1rem;padding:1.15rem 1.2rem;font-size:1.06rem;line-height:1.5;
    text-align:left;box-shadow:var(--shadow)}
  .pick:hover{border-color:var(--accent);color:var(--accent)}
  .undo{margin:1.4rem 0 0;border:0;background:none;color:var(--muted);
    font-size:.88rem;padding:.3rem 0}
  .undo:hover{color:var(--ink)}

  /* ---- the result --------------------------------------------------------
   * The four letters are what gets screenshotted, so they are set big — and
   * the caveat sits directly under them at a size nobody can skip. A giant
   * serif code with the qualification below the fold would be a better-looking
   * screen and a worse product. */
  .code{margin:.6rem 0 0;font-family:var(--serif);font-weight:400;
    font-size:clamp(3.4rem,17vw,5rem);line-height:1;letter-spacing:.06em;
    color:var(--accent)}
  .title{margin:.4rem 0 0;font-family:var(--serif);font-size:1.5rem;line-height:1.2}
  .caveat{margin:.9rem 0 0;padding:.85rem 1rem;background:var(--raise);
    border:1px solid var(--line);border-left:3px solid var(--t3);border-radius:.6rem;
    font-size:.9rem;line-height:1.6;color:var(--ink-2)}

  /* Four pills, two up and two down — the shape of the four letters. The one
     that is yours is in the accent and the other is not, which is the whole
     reading of it at a glance. */
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:.8rem .7rem;margin:1.5rem 0 0}
  .pill{display:flex;align-items:center;justify-content:center;gap:.6rem;
    border:2px solid var(--accent);border-radius:99px;padding:.75rem .5rem;
    font-family:var(--serif);font-size:1.6rem;line-height:1}
  .pill b{font-weight:400;color:var(--muted);display:inline-flex;
    width:2.4rem;height:2.4rem;align-items:center;justify-content:center;
    border-radius:99px}
  /* The letter they came out as is filled, not merely a different colour: at a
     glance, and at the size a shared picture is seen, colour alone does not
     say which of the two is theirs. */
  .pill b.on{color:var(--paper);background:var(--accent)}
  .pill i{width:1px;height:1.5rem;background:var(--line);font-style:normal}
  .under{margin:.4rem 0 0;text-align:center;font-size:.74rem;line-height:1.4;
    color:var(--muted)}
  :root[data-lang="zh"] .under{font-size:.78rem}

  .axis{margin:1.6rem 0 0;padding-top:1.1rem;border-top:1px solid var(--hair)}
  .poles{display:flex;align-items:baseline;gap:1rem}
  .pole{font-size:.72rem;letter-spacing:.13em;text-transform:uppercase;color:var(--muted)}
  .pole.on{color:var(--ink)}
  .poles .sp{flex:1}
  /* The position, drawn. The dot is where five forced choices put them; the
     line is the axis. Never a percentage — five items cannot carry one. */
  .line{position:relative;height:2px;background:var(--line);margin:.85rem 0 0;
    border-radius:99px}
  .line .mid{position:absolute;left:50%;top:-3px;width:1px;height:8px;
    background:var(--muted);opacity:.5}
  .line .dot{position:absolute;top:-5px;width:12px;height:12px;margin-left:-6px;
    border-radius:50%;background:var(--accent);box-shadow:0 0 0 3px var(--paper)}
  .said{margin:.7rem 0 0;font-size:.9rem;color:var(--ink-2)}
  .said b{font-weight:400;color:var(--ink)}

  .row{display:flex;gap:.6rem;margin:1.8rem 0 0;flex-wrap:wrap}
  .row>*{flex:1 1 0;min-width:9rem;margin:0;text-align:center}
  .said.ok{color:var(--accent)}
</style>
</head>
<body>
<main>
  <!-- While it is true. An empty room reads as a dead product unless it says
       it is not open yet. -->
  <p class="invite" id="invite"></p>
  <div class="bar">
    <a class="back" href="/browse" id="back" aria-label="Back">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 19l-7-7 7-7"/></svg>
    </a>
    <span id="langslot" style="margin-left:auto;display:flex"></span>
  </div>
  <div id="body"></div>
</main>

<script type="module">
import { T, lang, setLang, pickLang, langButton } from "/i18n.js";
import { ITEMS, AXES, TITLES, STRENGTH, score } from "/type-items.js";

const $ = (id) => document.getElementById(id);
const el = (t, c, x) => { const n = document.createElement(t); if (c) n.className = c;
  if (x !== undefined) n.textContent = x; return n; };
const fill = (n, ...kids) => { while (n.firstChild) n.removeChild(n.firstChild);
  for (const k of kids) if (k) n.appendChild(k); };
/** Both halves of a pair live in one file; this picks the one being read. */
const P = (pair) => (Array.isArray(pair) ? pair[lang() === "zh" ? 1 : 0] : pair);

const IN_WECHAT = /micromessenger/i.test(navigator.userAgent);

/* Same two routes as everywhere else on this board: the clipboard API where
 * there is one and a secure context, and an off-screen textarea where there is
 * not — which is most of the browsers this has to work in. */
function copyText(text) {
  try {
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text);
      return true;
    }
  } catch (e) { /* fall through */ }
  try {
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.setAttribute("readonly", "");
    ta.style.cssText = "position:absolute;left:-9999px;top:0";
    document.body.appendChild(ta);
    ta.select();
    ta.setSelectionRange(0, text.length);   // iOS ignores select() alone
    const ok = document.execCommand("copy");
    document.body.removeChild(ta);
    return ok;
  } catch (e) { return false; }
}

let device = "";
try { device = localStorage.getItem("board:device") || ""; } catch { /* private window */ }

const KEY = "board:type";
const load = () => { try { return JSON.parse(localStorage.getItem(KEY) || "null"); }
                     catch { return null; } };
const save = (r) => { try { localStorage.setItem(KEY, JSON.stringify(r)); }
                      catch { /* private window: the result is still on screen */ } };

/* Their own name, once the letters are on their page — which decides whether
 * Share sends their profile or sends the test. Read once, and re-read after
 * they press to put it up. */
let MINE = "";
async function whoAmI() {
  if (!device) return;
  try {
    const d = await fetch("/api/me", { cache: "no-store",
      headers: { "x-board-device": device } }).then((r) => r.json());
    MINE = (d && d.person && d.person.type && d.person.handle) ? d.person.handle : "";
  } catch { MINE = ""; }
}

let RESULT = load();
let ORDER = [];        // the items, shuffled
let AT = 0;
let CHOICES = {};

/* Shuffled every time, because the axes are grouped in the file and five EI
 * questions in a row teaches somebody what is being measured — after which
 * they answer the measurement rather than the question. */
function shuffle(xs) {
  const out = xs.slice();
  for (let i = out.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [out[i], out[j]] = [out[j], out[i]];
  }
  return out;
}

function start() {
  ORDER = shuffle(ITEMS);
  AT = 0;
  CHOICES = {};
  try { if (window.lx) window.lx("type-start"); } catch { /* not fatal */ }
  paint();
}

function answer(item, pole) {
  CHOICES[item.id] = pole;
  AT += 1;
  if (AT >= ORDER.length) {
    RESULT = score(CHOICES);
    if (RESULT) {
      save(RESULT);
      try { if (window.lx) window.lx("type-done"); } catch { /* not fatal */ }
    }
  }
  paint();
}


/* SHARING THE TEST ITSELF, before anybody has taken it.
 *
 * A result is worth sending because of what it says about the sender; the test
 * is worth sending because of what it asks of the person who gets it. They are
 * different shares and the second one is the one that brings somebody new —
 * which is the whole of how this board grows, since there is no feed to be
 * recommended by and no app store to be found in.
 *
 * So it is on the first screen, where somebody who has not started yet can
 * send it to the friend they were going to compare with anyway.
 */
function inviteTo(path, words, btn) {
  const url = location.origin + path;
  const back = (w, hold) => {
    btn.textContent = w;
    setTimeout(() => { btn.textContent = T("share.invite"); }, hold || 2200);
  };
  // Inside WeChat a page may not open a share sheet — the ⋯ menu is the only
  // way — so the honest version is the clipboard and where the real control is.
  if (IN_WECHAT) {
    back(T(copyText(words + " " + url) ? "act.wxCopied" : "act.wxUseMenu"), 3600);
    return;
  }
  if (navigator.share) {
    navigator.share({ title: T("site.title"), text: words, url })
      .catch(() => { /* dismissed is not a failure */ });
    return;
  }
  back(T(copyText(words + " " + url) ? "act.copied" : "act.copyFail"));
}

function drawIntro(box) {
  box.append(el("p", "eyebrow", T("type.eyebrow")));
  box.append(el("h1", null, T("type.title")));
  // Four of the sixteen, set in the accent. It says which test this is faster
  // than a sentence naming the instrument could.
  box.append(el("p", "egs", T("type.egs")));
  box.append(el("p", "lede", T("type.lede")));
  box.append(el("p", "lede lean", T("type.lean")));
  const go = el("button", "go", T("type.start"));
  go.type = "button";
  go.addEventListener("click", start);
  box.append(go);
  /* Send the test, not a result. Under the Start button, quiet: somebody who
     came here to take it should not have to step over an invitation first. */
  const inv = el("button", "quiet wide", T("share.invite"));
  inv.type = "button";
  inv.addEventListener("click", () => inviteTo("/type", T("share.inviteType"), inv));
  box.append(inv);
  box.append(el("p", "note", T("type.honest")));
}

function drawAsk(box) {
  const item = ORDER[AT];
  box.append(el("p", "count", T("type.count", { n: AT + 1, total: ORDER.length })));
  const track = el("div", "track");
  const bar = el("i");
  bar.style.width = Math.round((AT / ORDER.length) * 100) + "%";
  track.append(bar);
  box.append(track);

  box.append(el("p", "ask", P(item.prompt)));
  const picks = el("div", "picks");
  for (const side of ["a", "b"]) {
    const b = el("button", "pick", P(item[side]));
    b.type = "button";
    b.addEventListener("click", () => answer(item, item[side + "Pole"]));
    picks.append(b);
  }
  box.append(picks);

  // One step back, because a mis-tap on question fourteen should not mean
  // starting again — and because there is no other way to change an answer.
  if (AT > 0) {
    const undo = el("button", "undo", T("type.back"));
    undo.type = "button";
    undo.addEventListener("click", () => {
      AT -= 1;
      delete CHOICES[ORDER[AT].id];
      paint();
    });
    box.append(undo);
  }
}


/* PUTTING A RESULT ON THE FEED.
 *
 * A result somebody is pleased with is the one thing they will happily write a
 * post about, and a board with four people on it needs posts more than it
 * needs anything else. So the button is here, on the screen where they have
 * just been told something about themselves.
 *
 * It posts as them, under their own name — not as the house and not
 * anonymously. Their name is the one this browser already posts under; if
 * there is not one yet it is asked for once, the same way a reply asks.
 */
/* `go` is where the picture takes a reader who taps it, and `pic` is the card
 * drawn above. Both are optional: a post with neither is still a post. */
async function toFeed(words, topic, btn, say, go, pic) {
  let who = "";
  try { who = localStorage.getItem("board:who") || ""; } catch { /* private window */ }
  if (!who) who = (prompt(T("act.answerAs")) || "").trim();
  if (!who) return;
  try { localStorage.setItem("board:who", who); } catch { /* fine */ }

  btn.disabled = true;
  btn.textContent = T("act.sending");
  try {
    const r = await fetch("/api/post", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ note: words, handle: who, topic, device,
        go: go || "",
        photo: pic ? pic.data : "", photoType: pic ? pic.type : "" }),
    });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(d.error || "no");
    // Held and published are different outcomes and the words say which. A
    // post that is waiting and does not say so reads as one that failed.
    say.className = "said ok";
    say.textContent = T(d.state === "published" ? "share.up" : "act.replyHeld");
    btn.hidden = true;
  } catch {
    btn.disabled = false;
    btn.textContent = T("act.again");
  }
}


/* THE PICTURE THAT GOES WITH A RESULT.
 *
 * Drawn here, on a canvas, and sent up as the post's photograph — so the feed
 * carries a card somebody stops at rather than another paragraph of text.
 *
 * Why not a file on the server: there are sixteen type codes and twenty level
 * results, in two languages, and every one of them would need making, storing
 * and keeping in step with the words. The browser has the result and can draw
 * it in a millisecond, and the bytes it makes are the same bytes a photograph
 * would be.
 *
 * 1000x1000. Square survives every crop a chat app applies to a shared image,
 * and the feed shows it full width either way.
 */
function resultPicture(draw) {
  const S = 1000;
  const c = document.createElement("canvas");
  c.width = S; c.height = S;
  const x = c.getContext("2d");
  if (!x) return null;

  // Read the page's own tokens, so the card is the same colour as the app it
  // came from — including when somebody takes the test in the dark.
  const css = getComputedStyle(document.documentElement);
  const tok = (n, fallback) => (css.getPropertyValue(n) || "").trim() || fallback;
  const paper = tok("--paper", "#EEF0F4");
  const ink = tok("--ink", "#151B28");
  const muted = tok("--muted", "#8A939F");
  const accent = tok("--accent", "#3F68D8");
  const line = tok("--line", "#E3E6EC");
  const serif = 'Georgia, "Songti SC", "Noto Serif CJK SC", serif';
  const sans = '-apple-system, "PingFang SC", "Noto Sans SC", sans-serif';

  x.fillStyle = paper;
  x.fillRect(0, 0, S, S);
  draw({ x, S, paper, ink, muted, accent, line, serif, sans });

  // The board's own name along the bottom, because this picture will be seen
  // in places that do not say where it came from.
  x.fillStyle = muted;
  x.font = "28px " + sans;
  x.textAlign = "center";
  x.fillText("liuxuesheng.io", S / 2, S - 54);

  try {
    const url = c.toDataURL("image/jpeg", 0.9);
    const comma = url.indexOf(",");
    return comma < 0 ? null : { data: url.slice(comma + 1), type: "image/jpeg" };
  } catch { return null; }
}

/** A rounded rectangle, since older webviews have no roundRect. */
function pill(x, left, top, w, h, r) {
  x.beginPath();
  x.moveTo(left + r, top);
  x.arcTo(left + w, top, left + w, top + h, r);
  x.arcTo(left + w, top + h, left, top + h, r);
  x.arcTo(left, top + h, left, top, r);
  x.arcTo(left, top, left + w, top, r);
  x.closePath();
}

/* THE CARD THE FOUR LETTERS ARE SHARED AS.
 *
 * The same family as the level card — identity, then where you sit, then what
 * that means in words — so somebody who sees both in a chat sees one product.
 *
 * The words under each pill are the change worth having. The letters alone say
 * nothing to anybody who has not taken it: EFSP is four consonants until
 * something tells you that E is Extraverted and that this one is clear rather
 * than a coin flip. That is exactly what the screen shows and the card did not.
 */
function typePicture(r, titleWords) {
  return resultPicture(({ x, S, paper, ink, muted, accent, line, serif, sans }) => {
    x.textAlign = "center";

    x.fillStyle = accent;
    x.font = "170px " + serif;
    x.fillText(r.code, S / 2, 250);

    if (titleWords) {
      x.fillStyle = ink;
      x.font = "60px " + serif;
      x.fillText(titleWords, S / 2, 336);
    }

    /* The whole card is a fixed height, so these four numbers are a budget:
       two rows of pill plus two lines of label under each has to land above the
       invitation at the bottom. It did not, the first time — the second row's
       strength line was printed through "Tap to take it". */
    const w = 380, h = 124, gap = 34, rowGap = 116;
    const left = (S - (w * 2 + gap)) / 2;
    const top = 396;
    r.axes.forEach((a, i) => {
      const cx = left + (i % 2) * (w + gap);
      const cy = top + Math.floor(i / 2) * (h + rowGap);
      pill(x, cx, cy, w, h, h / 2);
      x.strokeStyle = accent;
      x.lineWidth = 4;
      x.stroke();

      x.font = "58px " + serif;
      x.textAlign = "center";
      const mid = cx + w / 2;
      const letter = (ch, at, on) => {
        if (on) {
          x.beginPath();
          x.arc(at, cy + h / 2, 44, 0, Math.PI * 2);
          x.fillStyle = accent;
          x.fill();
        }
        x.fillStyle = on ? paper : muted;
        x.fillText(ch, at, cy + h / 2 + 20);
      };
      letter(a.axis[0], mid - 62, a.letter === a.axis[0]);
      letter(a.axis[1], mid + 62, a.letter === a.axis[1]);

      x.strokeStyle = line;
      x.lineWidth = 2;
      x.beginPath();
      x.moveTo(mid, cy + 32);
      x.lineTo(mid, cy + h - 32);
      x.stroke();

      /* What that letter is called, and how firmly it landed. On two lines,
         not one: "Extraverted · Close to the middle" is wider than the pill it
         belongs to, and on one line the left column ran into the right. */
      x.fillStyle = ink;
      x.font = "32px " + sans;
      x.fillText(P(AXES[a.axis][a.letter === a.axis[0] ? "first" : "second"]),
        mid, cy + h + 46);
      x.fillStyle = muted;
      x.font = "27px " + sans;
      x.fillText(P(STRENGTH[a.strength]), mid, cy + h + 86);
    });

    // The invitation, on the picture itself — a card in a chat is seen by
    // people who never opened the app, and the post makes it tappable.
    x.fillStyle = accent;
    x.font = "36px " + sans;
    x.fillText(T("share.cardTap"), S / 2, 900);
  });
}

function drawResult(box) {
  const r = RESULT;
  box.append(el("p", "eyebrow", T("type.yours")));
  box.append(el("p", "code", r.code));

  const title = TITLES[r.code];
  if (title) box.append(el("p", "title", P(title)));

  /* The caveat, directly under the letters and never below the fold.
   *
   * An axis answered 3-2 produces a letter as confidently as one answered 5-0,
   * and nothing downstream can tell them apart. Saying which letter that is,
   * in the same breath as the code, is the one thing this does that no other
   * type product will. */
  const weak = AXES[r.weakest];
  box.append(el("p", "caveat", T(r.unstable ? "type.softTitle" : "type.soft", {
    a: P(weak.first), b: P(weak.second),
  })));

  /* SHARING THE RESULT.
   *
   * The link is the test, not a page about this answer — there is no page about
   * this answer, and inventing one that says INFJ to whoever opens it would be
   * a claim about somebody made by a URL. The four letters travel in the words
   * instead, where they belong to the person sending them, and whoever receives
   * it lands on the twenty questions.
   *
   * If they have put the letters on their page, that page is the better thing
   * to send, and the button says so — it carries their face and their name into
   * the chat, which a link to a questionnaire does not. */
  const shareRow = el("div", "row");
  const sh = el("button", "go", T("act.share"));
  sh.type = "button";
  const words = title ? T("type.shareTitled", { code: r.code, title: P(title) })
                      : T("type.share", { code: r.code });
  sh.addEventListener("click", () => {
    const url = location.origin + (MINE ? "/p/" + encodeURIComponent(MINE) : "/type");
    const say = (w, hold) => {
      sh.textContent = w;
      setTimeout(() => { sh.textContent = T("act.share"); }, hold || 2200);
    };
    if (IN_WECHAT) {
      say(T(copyText(words + " " + url) ? "act.wxCopied" : "act.wxUseMenu"), 3600);
      return;
    }
    if (navigator.share) {
      navigator.share({ title: r.code, text: words, url })
        .catch(() => { /* dismissed is not a failure */ });
      return;
    }
    say(T(copyText(words + " " + url) ? "act.copied" : "act.copyFail"));
  });
  shareRow.append(sh);
  box.append(shareRow);

  /* THE FOUR AXES, AS FOUR PILLS.
   *
   * The same shape the four letters are: two sides, one of them yours. It was
   * a row of dots on lines — accurate, and nobody screenshots a dot on a line.
   * This is the thing somebody sends to a friend, so it is drawn to be looked
   * at, and the lean is still under each one in words because a pill on its
   * own would be the confident version of a result this test is careful not to
   * be confident about.
   */
  const grid = el("div", "grid");
  for (const a of r.axes) {
    const cell = el("div");
    const pill = el("div", "pill");
    const first = el("b", a.letter === a.axis[0] ? "on" : "", a.axis[0]);
    const second = el("b", a.letter === a.axis[1] ? "on" : "", a.axis[1]);
    pill.append(first, el("i"), second);
    cell.append(pill);
    cell.append(el("p", "under", P(AXES[a.axis][a.letter === a.axis[0] ? "first" : "second"])
      + " \u00b7 " + P(STRENGTH[a.strength])));
    grid.append(cell);
  }
  box.append(grid);

  /* On the feed, as them. The four letters and what they are called is the
     whole post — the pills above are for the person who took it. */
  const feedRow = el("div", "row");
  const toBoard = el("button", "quiet wide", T("share.feed"));
  toBoard.type = "button";
  const fsaid = el("p", "said");
  toBoard.addEventListener("click", () => toFeed(
    title ? T("share.typeTitled", { code: r.code, title: P(title) })
          : T("share.type", { code: r.code }),
    "Tests", toBoard, fsaid, "/type", typePicture(r, title ? P(title) : "")));
  feedRow.append(toBoard);
  box.append(feedRow);
  box.append(el("p", "feedwhat", T("share.feedType")));
  box.append(fsaid);

  const row = el("div", "row");
  const again = el("button", "quiet", T("type.again"));
  again.type = "button";
  again.addEventListener("click", start);
  const done = el("a", "quiet", T("type.done"));
  done.href = "/browse";
  row.append(again, done);
  box.append(row);

  /* Putting it on your profile is a separate act from taking the test. The
   * result is yours on this phone whether or not anybody else ever sees it,
   * and a test that publishes its answer by default is a different product. */
  const mine = el("div");
  const put = el("button", "quiet wide", T("type.put"));
  put.type = "button";
  const say = el("p", "said");
  put.addEventListener("click", async () => {
    put.disabled = true;
    put.textContent = T("me.working");
    try {
      const out = await fetch("/api/me", {
        method: "PUT", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ device, type: r.code }),
      }).then((x) => x.json());
      if (out && out.person) {
        say.className = "said ok";
        say.textContent = T("type.puton");
        put.hidden = true;
        // Share now has a better thing to send: their page, with their face
        // and the letters on it, rather than the questionnaire.
        MINE = out.person.handle || "";
        return;
      }
    } catch { /* fall through to the retry */ }
    put.disabled = false;
    put.textContent = T("act.again");
  });
  mine.append(put, say);
  box.append(mine);
  box.append(el("p", "note", T("type.honest")));
}

function paint() {
  $("invite").textContent = T("site.invite");
  const box = $("body");
  fill(box);
  if (RESULT && !ORDER.length) drawResult(box);
  else if (!ORDER.length) drawIntro(box);
  else if (AT < ORDER.length) drawAsk(box);
  else drawResult(box);
  window.scrollTo(0, 0);
}

setLang(pickLang());
$("langslot").append(langButton(paint));
$("back").setAttribute("aria-label", T("nav.back"));
paint();
// After the first paint: it only changes what Share sends, and waiting for it
// would hold a page that is otherwise ready.
whoAmI().then(() => { if (RESULT && !ORDER.length) paint(); });
</script>
