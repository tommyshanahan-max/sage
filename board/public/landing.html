<!-- The card WeChat, and everything else, builds when this link is forwarded.
     The crawler fetches once and runs no JavaScript, so these are absolute and
     already here — {{ORIGIN}} is filled in per request by the server, which
     learns its own name from the request and nowhere else. -->
<meta property="og:type" content="website">
<meta property="og:title" content="交换 · The Exchange">

<style>
  /* THE HERO IS A QUESTION AND NOTHING ELSE.
     It used to hold a working copy of the matcher. That belongs inside — see
     the note above the hero markup. Nothing between the question and the form
     but air. */
  .hero{padding-bottom:.6rem}
  /* The gap under the buttons was measured when the sentence still sat here.
     With it moved down into the steps, a phone got two hundred pixels of grey
     between "I have a password" and HOW IT GOES — dead air exactly where
     somebody decides whether the page has more to say. */
  .cta{margin-top:1.4rem}
  /* AND NOT MUCH OF IT. The section brings 3rem of padding and the card
     another 2.4rem of margin, both measured against a matcher card that used
     to sit between them. With it gone that is 86px of empty grey under a
     two-line question — on the one page whose whole job is the form. Only
     here: /level ships its own .waitbox and site.css still serves it. */
  #waitsection{padding-top:1.2rem}

  /* WHAT IT DOES, IN ONE LINE, SHOWN RATHER THAN SAID.
   *
   * The headline names who you get. Nothing on this page said how, so a
   * stranger off a forwarded link read "Your business partner in China" over
   * a form asking for their name and had to guess — and the guesses are
   * directory, or agency, or scam.
   *
   * This is the sentence the whole product runs on, filled in with one real
   * pair, in the pills it wears inside. It is not the working matcher that
   * used to be here: no controls, nothing to operate, two lines tall. The
   * form stays above the fold, which is the thing that rule was protecting. */
  /* THE PILLS ARE THE PICTURE. Steps two and three each have a screenshot
     under the label and step one had a line of text with two tinted words in
     it — so the first step, which is the one thing a reader has to understand
     before the other two mean anything, was the quietest thing in the row.
     It read as a sentence that happened to have some colour in it.
     So the two blanks are filled in loudly and the words that join them get
     out of the way: "I am" and "looking for" are small, muted and lowercase
     furniture, and what a person actually types is a solid accent pill at
     nearly twice their size. Nobody has to be told which part is the answer. */
  .does{margin:.9rem 0 0;max-width:32rem}
  .doesline{display:flex;flex-wrap:wrap;align-items:center;gap:.45rem;
    font-size:.92rem;line-height:1.75;color:var(--ink)}
  .doesline b{font-weight:400;font-size:.92rem;color:var(--muted)}
  .doesline i{font-style:normal;font-weight:650;font-size:1.2rem;
    letter-spacing:-.01em;padding:.3rem .9rem;border-radius:99px;
    background:var(--accent);color:var(--accent-ink);white-space:nowrap;
    box-shadow:0 4px 14px rgba(43,85,222,.28)}
  /* THE SENTENCE, THEN THE SCREEN IT PRODUCES. One column, centred, nothing
     between them: the pills are the question and the card is the answer, and
     anything sitting in the gap turns two things into three. */
  /* The section already pads; this used to add its own on top of an eyebrow
     that is no longer there, which left a hand's width of empty dark above the
     pills — the first thing on the band being nothing. */
  .one{display:flex;flex-direction:column;align-items:center;gap:1.3rem;
    padding:.4rem 0 .6rem;text-align:center}
  .big{font-family:var(--serif);font-weight:400;font-size:clamp(2.1rem,9vw,3.4rem);
    line-height:1.05;margin:0;letter-spacing:-.01em}
  .say{margin:0;max-width:36rem;font-size:clamp(1.02rem,4.2vw,1.22rem);
    line-height:1.9;color:var(--ink-2)}
  /* ---- the two pickers ---------------------------------------------------
     A pill that opens looks like one: the caret is the whole difference
     between emphasis and a control. The one that cannot open (a role with a
     single partner) drops the caret rather than lying about itself. */
  .pickwrap{position:relative;display:inline-block;vertical-align:baseline}
  .pick{font:inherit;font-weight:700;font-size:.95em;line-height:1;
    display:inline-flex;align-items:center;gap:.35rem;cursor:pointer;
    padding:.3rem .55rem .3rem .85rem;border-radius:99px;white-space:nowrap;
    background:var(--accent);color:var(--accent-ink);border:2px solid var(--accent)}
  .pick s{text-decoration:none;font-size:.72em;opacity:.75}
  .pick.dead{cursor:default;padding-right:.85rem}
  .pick.dead s{display:none}
  .pick.open{background:transparent;color:var(--accent)}
  /* TWO COLUMNS, BECAUSE ONE SWALLOWED THE PHONE. Nine roles in a single
     column is a menu taller than the thing it is meant to be changing — you
     press a role and cannot see the card answer, which is the entire point of
     the control. Two columns is five rows and the screen stays visible. */
  .picklist{position:absolute;left:50%;transform:translateX(-50%);
    top:calc(100% + .45rem);z-index:20;text-align:left;
    display:grid;grid-template-columns:1fr 1fr;gap:.15rem;
    background:var(--card);border:1px solid var(--line);border-radius:.85rem;
    padding:.35rem;box-shadow:0 20px 44px rgba(0,0,0,.5)}
  .picklist button{display:block;width:100%;text-align:left;font:inherit;
    font-size:.92rem;padding:.45rem .65rem;border:0;border-radius:.55rem;
    background:none;color:var(--ink-2);cursor:pointer;white-space:nowrap}
  /* The right-hand pill never offers more than three, so a second column there
     would be one item beside a gap. */
  .pickwrap:last-of-type .picklist{grid-template-columns:1fr}
  .picklist button.on{background:var(--accent);color:var(--accent-ink);font-weight:700}

  /* ---- the app, drawn, so it can be anybody ------------------------------
     Close enough to the real screen to read as one — the bar, the eyebrow, the
     card, the two buttons — and no closer. It is not a replica; it is the one
     screen this page is about, with whoever the sentence asked for on it. */
  /* Named `appshot`, not `phone`. site.css already has a whole .phone / .ph-top
     / .ph-card system from an older landing page, and reusing those names
     inherited a second border, a second notch and a second card style on top
     of this one — which is what the black bar over the invite-only line was.
     A shared stylesheet is a namespace; this page does not get to squat in it. */
  .appshot{position:relative;width:min(78vw,292px);margin:0 auto;
    border-radius:1.6rem;overflow:hidden;padding-top:.4rem;
    background:#EEF0F4;color:#151B28;text-align:left;
    box-shadow:0 20px 48px rgba(8,12,20,.4)}
  /* One grey pill. Enough to read as a phone and not an imitation of anybody's
     hardware — the same call site.css made, made again here on purpose. */
  .appshot::before{content:"";position:absolute;top:.42rem;left:50%;
    transform:translateX(-50%);width:2.4rem;height:.26rem;border-radius:99px;
    background:rgba(21,27,40,.22);z-index:2}
  .as-top{margin:0;padding:.5rem;text-align:center;font-size:.68rem;
    background:#E4E9F5;color:#3F68D8}
  .as-head{display:flex;align-items:center;gap:.55rem;padding:.7rem .8rem .2rem}
  .as-mark{width:1.9rem;height:1.9rem;border-radius:.55rem;background:#151B28;color:#fff;
    display:grid;place-items:center;flex:0 0 auto}
  .as-mark svg{width:1.1rem;height:1.1rem}
  .as-head b{display:block;font-family:var(--serif);font-weight:400;font-size:1rem}
  .as-head small{display:block;font-size:.66rem;color:#7A8699}
  .as-eye{margin:.6rem .8rem .35rem;font-size:.6rem;letter-spacing:.13em;
    text-transform:uppercase;color:#7A8699;font-weight:600}
  .as-card{margin:0 .7rem;border-radius:.9rem;padding:.75rem;color:#fff;
    background:linear-gradient(170deg,#8FA6DE,#1D2536)}
  /* The letter had no colour of its own, so it was drawn in the card's dark
     text on a mid-tone circle and simply was not there. */
  .as-letter{float:right;width:2.3rem;height:2.3rem;border-radius:50%;
    display:grid;place-items:center;font-family:var(--serif);font-size:1.2rem;
    margin:0 0 .2rem .4rem;color:rgba(255,255,255,.92)}
  .as-card b{display:block;font-family:var(--serif);font-weight:400;font-size:1.15rem}
  .as-card small{display:block;font-size:.72rem;opacity:.8}
  .as-card p{margin:.45rem 0 0;font-size:.74rem;line-height:1.45;opacity:.92}
  /* "I am" and "looking for" were inheriting the card's 92% opacity on top of
     a small size on a gradient, and came out as grey on grey. */
  .as-say{display:flex;flex-wrap:wrap;align-items:center;gap:.25rem;
    font-size:.72rem;margin-top:.55rem!important;opacity:1;color:rgba(255,255,255,.8)}
  .as-say i{font-style:normal;font-weight:700;font-size:.68rem;padding:.16rem .45rem;
    border-radius:99px;background:rgba(255,255,255,.92);color:#151B28}
  .as-btns{display:flex;gap:.45rem;margin:.7rem;font-size:.8rem;font-weight:600}
  .as-go,.as-next{flex:1;text-align:center;padding:.5rem;border-radius:99px}
  .as-go{background:#3F68D8;color:#fff}
  .as-next{background:#F7F8FB;color:#151B28;border:1px solid #DFE4EC}

  .say i{font-style:normal;font-weight:700;font-size:.95em;
    padding:.22rem .85rem;border-radius:99px;white-space:nowrap;
    background:var(--accent);color:var(--accent-ink);
    /* The word changes; the pill should not appear to. A short fade reads as
       one control being set to a new value, where a hard swap reads as the
       page redrawing itself. */
    animation:pillin .32s ease-out}
  @keyframes pillin{from{opacity:0;transform:translateY(.18em)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){.say i{animation:none}}


  .one .shot.card{width:min(74vw,290px);height:auto;border-radius:1.3rem;
    box-shadow:0 18px 44px rgba(8,12,20,.34)}
  @media (min-width:620px){ .one .shot.card{width:320px} }

  /* Kept for now: the before/after cards are one commit back and this is the
     third layout tonight. Dead CSS is cheaper than retyping it. */
  .twocards{display:grid;gap:.9rem;width:100%;max-width:38rem;margin:.4rem 0 0;
    grid-template-columns:1fr;text-align:left}
  .minicard{background:var(--card);border:1px solid var(--line);border-radius:1.1rem;
    padding:.9rem}
  .mini-face{height:7.5rem;border-radius:.8rem;display:grid;place-items:center;
    background:linear-gradient(150deg,hsl(320 26% 64%),hsl(344 24% 42%));
    font-family:var(--serif);font-size:3rem;color:rgba(255,255,255,.85)}
  .mini-name{margin:.65rem 0 0;display:flex;align-items:baseline;gap:.5rem;flex-wrap:wrap}
  .mini-name b{font-family:var(--serif);font-weight:400;font-size:1.25rem}
  .mini-name small{color:var(--muted);font-size:.86rem}
  .mini-say{margin:.5rem 0 0;font-size:.92rem;color:var(--ink-2);
    display:flex;flex-wrap:wrap;align-items:center;gap:.3rem}
  .mini-say i{font-style:normal;font-weight:650;font-size:.86rem;padding:.18rem .6rem;
    border-radius:99px;background:var(--accent);color:var(--accent-ink)}
  .mini-btn{display:block;margin:.75rem 0 0;text-align:center;padding:.6rem;
    border-radius:99px;background:var(--accent);color:var(--accent-ink);font-weight:650}
  .mini-btn.ghost{background:none;border:1px solid var(--line);color:var(--ink)}
  .minicard.matched{display:flex;flex-direction:column;justify-content:center}
  .mini-tag{margin:0;font-size:.74rem;letter-spacing:.12em;text-transform:uppercase;
    font-weight:700;color:var(--accent)}
  .mini-why{margin:.55rem 0 0;color:var(--ink-2);line-height:1.5;font-size:.95rem}
  .mini-id{margin:.75rem 0 0;padding:.6rem .8rem;border:1px solid var(--line);
    border-radius:.6rem;background:var(--paper);
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.95rem}
  @media (min-width:620px){
    .twocards{grid-template-columns:1fr 1fr;gap:1rem}
  }
  .onewhy{margin:0;max-width:26rem;text-align:center;font-size:1.05rem;
    line-height:1.6;color:var(--ink-2)}
  @media (min-width:740px){
    .one{gap:1.9rem;padding:.8rem 0 1rem}
    .onewhy{font-size:1.1rem}
  }
  .doeswhy{margin:.7rem 0 0;font-size:1.02rem;line-height:1.55;
    color:var(--ink-2)}
  @media (max-width:380px){
    .doesline{gap:.35rem}
    .doesline i{font-size:1.06rem;padding:.28rem .75rem}
  }
  /* And it starts where the question starts. The card centres itself, which
     read as one object among several while the matcher sat above it; now
     that it leads the page, a left-aligned headline over a centred card is
     just two things that do not line up. */
  #waitsection .waitbox{margin-top:0;margin-left:0}

  /* THE PERSON ON THE DOOR. Deliberately quieter than the form above it:
     the form is the thing to do, this is the thing to do first if you are
     not sure. No avatar, no bubbles, no typing dots — it answers once and
     the answer sits there like a note. */
  .hostess{margin:1.6rem 0 0;padding:1.1rem 1.1rem .9rem;background:var(--raise);
    border:1px solid var(--line);border-radius:1rem;max-width:34rem}
  .hlab{margin:0 0 .7rem;font-size:.95rem;color:var(--ink-2)}
  .hasks{display:flex;flex-wrap:wrap;gap:.4rem;margin:0 0 .7rem}
  .hasks button{border:1px solid var(--line);background:var(--paper);color:var(--ink-2);
    border-radius:99px;padding:.4rem .75rem;font:inherit;font-size:.85rem}
  .hasks button:hover{border-color:var(--accent);color:var(--accent)}
  #hostessform{display:flex;gap:.5rem}
  #hostessq{flex:1;min-width:0;padding:.6rem .9rem;font:inherit;font-size:.95rem;
    border:1px solid var(--line);border-radius:99px;background:var(--paper);
    color:var(--ink)}
  #hostessq:focus{outline:2px solid var(--accent);outline-offset:1px}
  .hgo{border:0;border-radius:99px;background:var(--accent);color:var(--accent-ink);
    padding:.6rem 1.1rem;font:inherit;font-size:.95rem}
  .hgo[disabled]{opacity:.55}
  .hsaid{margin:.85rem 0 0;font-size:.95rem;line-height:1.6;color:var(--ink);
    white-space:pre-wrap}
  .hnote{margin:.7rem 0 0;font-size:.78rem;line-height:1.5;color:var(--muted)}

  /* The four doors, as doors. Rows rather than chips: each one is a place to
     go, and a row is a thing you tap where a chip is a thing you pick. */
  .doors{display:flex;flex-direction:column;margin:.4rem 0 0}
  .doors a{display:flex;align-items:center;gap:.9rem;padding:1.05rem .1rem;
    border-bottom:1px solid var(--line);text-decoration:none;color:inherit}
  .doors b{flex:1;font-family:var(--serif);font-weight:400;font-size:1.25rem}
  .doors small{display:block;font-family:var(--sans);font-size:.85rem;color:var(--muted);
    margin-top:.1rem}
  .doors i{font-style:normal;color:var(--muted);font-size:1.2rem}
  .quiet{background:var(--raise)}
  /* The footer columns stack, and their contents are lines rather than a
     paragraph run together. */
  .foot .col{display:flex;flex-direction:column;gap:.35rem}
  .foot .col b{font-weight:500}
  .foot .links{gap:.5rem;margin-top:1rem}
  .foot .links a{color:var(--accent);text-decoration:none}
  .foot .links a:hover{text-decoration:underline;text-underline-offset:3px}
  /* The wordmark is two words and was breaking between them in a narrow
     header. It is a name; it goes on one line. */
  .brand span b{white-space:nowrap}
  /* Three things on one line at 390px, and the blue button was winning. The
     door still has to be obvious, so the mark and the language button give up
     the room rather than the button giving up its label. */
  @media (max-width:26rem){
    .top .wrap{gap:.5rem}
    .brand i{width:1.9rem;height:1.9rem;font-size:1rem}
    .brand span b{font-size:1rem}
    .brand span small{font-size:.72rem}
    .top .go{padding:.5rem .8rem;font-size:.82rem}
  }
  .gonesaid{margin:0;padding:.9rem 1.1rem;background:var(--raise,#0E1512);
    border-bottom:1px solid var(--hair,#1E2A25);text-align:center;
    font-size:.92rem;line-height:1.55}
  /* THE FRAMES. A row that scrolls sideways on a phone rather than three
     pictures stacked into three screens of scrolling: they are one idea seen
     three ways, and a row says that where a stack says "keep going". */
  /* Under the headline and above the demonstration: the price of admission,
     before anybody is shown what they would be admitted to. */
  .only{margin:.8rem 0 0;font-size:.95rem;line-height:1.55;color:var(--ink-2);
    max-width:32ch}
  .only b{color:var(--ink);font-weight:600}
  /* Set in the serif and spaced like a line in a members' book rather than
     like a statistic. The numbers are the loud part; the words around them
     stay out of the way. */
  .fewline{margin:.9rem 0 0;font-family:var(--serif);font-size:1.02rem;
    line-height:1.6;color:var(--ink-2)}
  .fewline b{font-weight:400;color:var(--ink)}
  .eyeline{margin:0 0 .55rem;font-size:.76rem;font-weight:600;letter-spacing:.13em;
    text-transform:uppercase;color:var(--accent)}
  :root[data-lang="zh"] .eyeline{text-transform:none;letter-spacing:.06em;font-size:.82rem}
  /* THE TWO HALVES LEAN INTO EACH OTHER, AND THE THIRD STANDS STRAIGHT.
     Three phones in a row read as a product tour: here is a screen, here is
     another screen. The thing this board does is not a screen, it is two
     people finding each other — so the two people tilt towards one another
     with the mark where they meet, and the one thing that comes of it stands
     upright on its own, after an arrow. The composition carries the argument
     before a word of the captions is read.
     Angles are small (6deg). Anything more reads as a sticker sheet, and the
     text inside a phone at 10deg is genuinely harder to read. */
  .top .wrap{gap:.5rem}
  /* NO BUTTONS UP HERE AT ALL — the brand, the language, and nothing else.
     The bar held both doors for a few hours and it was too much: four things
     to read before the headline, two of them asking for a decision from
     somebody who has not been told yet what the decision is about. Both are in
     the hero, one screen down, under the sentence that makes anybody want
     either. A stranger reads before they are asked.
     A member is the exception and keeps one: "Go to the board" is not a pitch,
     it is the way home, and they have already made the decision. */
  .top #navopen,.top #navjoin{display:none}
  /* A member has no list to join and does not need the hero's buttons: their
     one button is "Go to the board", which is #navopen wearing new words. */
  body.inside #navjoin,body.inside #herocta{display:none}
  body.inside .top #navopen{display:inline-block;background:var(--accent);
    color:var(--accent-ink);border:0;margin-left:auto}
  /* ITS OWN SURFACE, so the page has two parts rather than one long scroll.
     On a phone the hero, the steps and the form ran together on one flat grey
     and a reader could not tell where the pitch stopped and the explanation
     started — everything above is what this is, everything in here is how it
     goes. A shade and two hairlines say that without a word, and the band runs
     edge to edge because a phone has no margins to spare. */
  /* DARK, and not a shade darker. A band one step off the page background was
     the honest minimum and it was not enough to see: on a phone, scrolling
     past at speed, two greys four percent apart are one grey. This half of
     the page is a different place — above it is what this is, in here is how
     it goes — so it gets a different set of colours rather than a different
     amount of the same one.
     The tokens are redefined on the section and everything inside reads them,
     so the eyebrow, the step labels and the three captions come right without
     a single one of them being restyled. The accent lifts to a blue that can
     be read on ink; the one at the top of this file is tuned for paper and
     goes muddy here. The screenshots keep their own light pixels and sit on
     the dark like product shots, which is the one thing this change also
     happens to improve. */
  .frames{
    --paper:#111722; --raise:#1A2130; --card:#222B3C;
    --line:#2C3546; --hair:#222A3A;
    --ink:#F2F5FA; --ink-2:#B6C2D4; --muted:#8A99B0;
    --accent:#7D9BFF; --accent-soft:#1E2A47; --accent-ink:#0B0E15;
    padding:2.4rem 0 2.6rem;background:#111722;color:var(--ink);
    border-top:1px solid #0A0E16;border-bottom:1px solid #0A0E16}
  /* The shadow under a phone was written for a light page and is invisible on
     ink; on dark a rim does the lifting a shadow did. */
  .frames .shot{box-shadow:0 14px 34px rgba(0,0,0,.45);border-color:#2C3546}
  /* Stacked on a phone so the arrow turns down and stays under the pair —
     wrapped as a row it landed beside them, pointing at the gutter. */
  .story{display:flex;flex-direction:column;align-items:center;
    justify-content:center;gap:.5rem}
  /* LEFT EDGE, LIKE EVERY OTHER LINE ON A PHONE. Centred figures put a column
     of ragged edges down a screen where everything else starts in the same
     place; the picture still centres itself inside the column. */
  .story figure{margin:0;display:flex;flex-direction:column;
    align-items:flex-start;width:100%}
  .step{align-self:flex-start}
  .lean,.payoff .shot.chat{align-self:center}
  .shot{display:block;height:auto;border-radius:14px;border:1px solid var(--line);
    background:var(--paper);box-shadow:0 10px 30px rgba(16,25,43,.13)}
  .lean{position:relative;display:flex;align-items:center;justify-content:center;
    padding:.6rem 0 1.2rem}
  /* AS WIDE AS THE PHONE ALLOWS. At 36vw each these were 140px on a 390px
     screen, and the card inside — the name, the line, the two pills that are
     the whole argument — was grey texture. A picture of an app that cannot be
     read is worse than no picture. */
  .lean .shot{width:min(47vw,210px)}
  /* Tops tip towards each other: the left one clockwise, the right one back.
     They nearly touch at the top and open into a V at the bottom, which is
     where the mark goes. An earlier version overlapped them by 20px, and the
     right-hand phone lost its name and its line behind the left one — two
     people is the whole point of the picture, so they must both be legible. */
  .lean .shot:first-of-type{transform:rotate(6deg);margin-right:3px}
  .lean .shot:last-of-type{transform:rotate(-6deg);margin-left:3px}
  /* In the gap the lean opens up at the bottom. Overlapping the phones rather
     than floating under them is what makes it read as the two of them meeting
     and not as a button. */
  .matchdot{position:absolute;left:50%;bottom:2.1rem;transform:translateX(-50%);
    z-index:2;display:grid;place-items:center;width:2.5rem;height:2.5rem;
    border-radius:50%;background:var(--accent);color:#fff;
    box-shadow:0 6px 18px rgba(43,85,222,.35)}
  .matchdot svg{width:1.35rem;height:1.35rem;display:block}
  .arrow{flex:0 0 auto;color:var(--muted);font-size:1.5rem;line-height:1;
    transform:rotate(90deg);margin:0;align-self:center}
  /* The two steps named out loud. The picture argued it on its own and people
     still asked what they were looking at — two words each is cheaper than
     another sentence of caption. */
  .step{display:block;margin:0 0 .7rem;font-size:.8rem;font-weight:700;
    letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
  :root[data-lang="zh"] .step{text-transform:none;letter-spacing:.08em;font-size:.78rem}
  /* The sentence, off the hero's left margin and into a column of its own.
     Centred like the two beside it, and the pills keep their own wrapping. */
  .sayfig .does{display:flex;justify-content:flex-start;margin:0}
  .sayfig .doesline{margin:0}
  .payoff{padding-top:.2rem}
  .payoff .shot.chat{width:min(92vw,360px)}
  /* READ, NOT SKIMMED PAST. These three lines are the only writing in the
     section and they were set as captions — small, grey, the size a photo
     credit gets. Under step one's pills, which are now loud, they vanished
     altogether. They are the argument, so they are set as sentences: body
     size, ink rather than grey.
     Centred again from the width where the three steps sit side by side —
     there a caption belongs to the thing above it rather than to the page. */
  .story figcaption{margin:.8rem .1rem 0;font-size:1.02rem;line-height:1.55;
    color:var(--ink-2);max-width:34ch;text-align:left}
  @media (min-width:52rem){
    .story{flex-direction:row;gap:1.8rem;align-items:flex-start}
    .story figure{align-items:center;width:auto}
    .step{align-self:auto}
    .sayfig .does{justify-content:center}
    .story figcaption{text-align:center;max-width:30ch;font-size:.92rem}
    .arrow{transform:none;margin-top:7rem}
    .lean .shot{width:142px}
    .payoff .shot.chat{width:288px}
    .payoff{padding-top:0}
    /* All three step labels sit on one line. The sentence has no phone
       under it, so its column got the breathing room instead. */
    .sayfig{width:250px}
    .sayfig .does{padding:2.2rem 0 1.4rem}
  }
</style>
</head>
<body>

<!-- WHERE SOMEBODY LANDS AFTER DELETING THEMSELVES. The press worked, their
     browser has been cleared, and without this they arrive at a page selling
     them the thing they just left with no word that it happened. -->
<p id="gonesaid" class="gonesaid" hidden></p>

<div class="top">
  <div class="wrap">
    <a class="brand" href="/">
      <i><svg viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="7" style="width:1em;height:1em;display:block" aria-hidden="true"><circle cx="38" cy="50" r="24"/><circle cx="62" cy="50" r="24"/></svg></i>
      <span><b id="brandname">The Exchange</b><small>交换</small></span>
    </a>
    <span id="langslot" style="margin-left:auto;display:flex;gap:.6rem;align-items:center"></span>
    <!-- TWO DOORS, IN THE ORDER MOST PEOPLE NEED THEM.
         "I have a password" was the only button up here and it was the blue
         one, which told a stranger that the way in is a password they do not
         have — a locked door with no bell. The bell is the list, so the list
         is the blue one now and the password is the quiet one beside it.
         Being asked to queue IS the pitch: it says out loud that not everybody
         gets in, which is the thing we are selling. -->
    <a class="go quiet" id="navopen" href="/enter"></a>
    <a class="go" id="navjoin" href="#waitsection"></a>
  </div>
</div>

<!-- A QUESTION, AND THEN THE FORM.
     The hero used to carry a working copy of the matcher — two dropdowns a
     stranger could move to see what the board does. It argued well and it sat
     in the wrong place: measured on a 390px phone it pushed the form to 471px,
     so the one thing a shared link is for was the third thing on the page and
     below the fold. Somebody arriving on a name they trust has already been
     persuaded; making them scroll past a demonstration is asking them to be
     persuaded twice. The matcher is the first thing they meet inside, which is
     where a control you can actually use belongs. -->
<div class="hero">
  <div class="wrap">
    <div class="asking">
      <!-- Three names a stranger already knows, above the human line. The
           comparison does the explaining; the line under it does the work. -->
      <p class="eyeline" id="eyeline"></p>
      <q id="asking"></q>
      <!-- THE OTHER HALF OF WHAT THIS IS. The comparison above says what it
           does; this says what it costs to be in it, which is the thing that
           makes the rest worth reading. It was only ever said on the form
           further down and in the door's own words — by which point somebody
           has already decided whether to bother. -->
      <p class="only" id="onlyline"></p>
      <!-- HOW FEW. The page says "invite only" and that is a policy; this is
           the fact underneath it, and a fact is what makes a policy believed.
           Drawn only when the server sends both numbers — it withholds the
           queue below a floor, because a number that small is nearly a name.
           Never a target and never rounded up: whatever it says tonight is
           what is actually in the file. -->
      <p class="fewline" id="fewline" hidden></p>
      <!-- HIGH, not at the bottom of the page. Somebody who has read "invite
           only" is at the exact moment of wanting in; the form was four
           screens below that, which spends the feeling on scrolling. -->
      <p class="cta" id="herocta">
        <a class="btn" id="ctajoin" href="#waitsection"></a>
        <a class="btn ghost" id="ctaenter" href="/enter"></a>
      </p>
    </div>
  </div>
</div>

<!-- WHAT IT IS, IN ONE COMPARISON AND TWO CARDS.
     Third attempt at this band and the first one people read. It was three
     numbered steps, then one sentence over a whole screenshot of the app, and
     both were still being explained to strangers by Tom in WeChat afterwards.

     The comparison does the work a paragraph could not: everybody already
     knows what both of those are, and the shape of the thing lands before the
     first sentence is finished. It was an eyebrow for a while, four words that
     scrolled past. It is the headline now.

     TWO CARDS RATHER THAN ONE SCREEN. The old frame showed a person you could
     follow and stopped, so the payoff — a contact actually crossing — was a
     sentence underneath. Before and after, side by side, is the whole product:
     here is somebody, and here is what happens when it goes both ways.

     DRAWN IN HTML, NOT SHOT FROM THE APP. Both cards are translated, both
     resize, and neither is a 300KB screenshot on a page opened over a phone
     connection in China. -->
<section class="frames">
  <div class="wrap">
    <div class="one">
      <h2 class="big" id="landbig"></h2>
      <!-- THE SENTENCE AS PILLS, not as bold text. Same slot, same words. The
           pills are the one thing on this page that looks like nothing else on
           the internet, and "I am a ___ looking for a ___" set in bold grey is
           a line somebody reads past. This is the mechanic; it should look
           like a control, because it is one. -->
      <p class="say" id="landsay"></p>

      <!-- THE OTHER HALF, DRAWN, INSIDE THE APP'S OWN FRAME.
           A screenshot is the thing a stranger believes, and this had one. It
           could only ever show one pair, so the moment the sentence above it
           became something you can change, it was a picture contradicting the
           line over it every time somebody touched the control.

           So it is drawn — the top bar, BROWSE PEOPLE, the card, Follow and
           Next — which keeps it reading as a screen rather than as a diagram,
           and lets it be anybody. Nine invented people, one per role that can
           stand on the right of the sentence. They are invented and they have
           to be: the alternative is putting real members on a public page,
           which would make a private board searchable from outside by role.
           That is a directory, and the line at the top of this page promises
           it is not one. -->
      <div class="appshot" aria-hidden="true">
        <p class="as-top" id="phTop"></p>
        <div class="as-head">
          <span class="as-mark"><svg viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="8"><circle cx="38" cy="50" r="24"/><circle cx="62" cy="50" r="24"/></svg></span>
          <span><b>The Exchange</b><small id="phFew"></small></span>
        </div>
        <p class="as-eye" id="phEye"></p>
        <div class="as-card">
          <span class="as-letter" id="phLetter"></span>
          <b id="phName"></b>
          <small id="phCity"></small>
          <p id="phLine"></p>
          <p class="as-say">
            <span id="phSay1"></span><i id="phSay2"></i>
            <span id="phSay3"></span><i id="phSay4"></i>
          </p>
        </div>
        <p class="as-btns"><span class="as-go" id="phFollow"></span><span class="as-next" id="phNext"></span></p>
      </div>

      <p class="onewhy" id="onewhy"></p>
    </div>
  </div>
</section>

<section id="waitsection">
  <div class="wrap">
    <div id="waitslot"></div>

    <!-- THE PERSON ON THE DOOR.
         A stranger deciding whether to trust a friend's link has questions
         this page did not anticipate, and at eleven at night there is nobody
         to ask. Under the form rather than above it: somebody who already
         knows they want in should not have to walk past a chat box to say so.
         Drawn only when the server says there is anybody there — see hostess
         in /api/hello — and it lives inside the section a member never sees,
         so it costs nothing to somebody already through the door. -->
    <div class="hostess" id="hostess" hidden>
      <p class="hlab" id="hostesslab"></p>
      <div class="hasks" id="hostessasks"></div>
      <form id="hostessform">
        <input id="hostessq" maxlength="300" autocomplete="off">
        <button class="hgo" type="submit" id="hostessgo"></button>
      </form>
      <p class="hsaid" id="hostesssaid" hidden></p>
      <p class="hnote" id="hostessnote"></p>
    </div>
  </div>
</section>

<!-- WHAT IS BEHIND THE DOOR, SHOWN RATHER THAN DESCRIBED. The shape of the
     newest posts and none of their words — see feedPeek in wait.js.

     UNDER THE FORM, not above it. It used to lead, on the reasoning that
     somebody should see the place is real before being asked for a name — but
     it is three screens of grey on a phone, and the thing this page exists to
     collect was below all of it. Somebody who wants proof scrolls; somebody
     who arrived persuaded, off a name they trust, should not have to. -->
<section class="quiet" id="peeksection" hidden>
  <div class="wrap">
    <div id="peekslot"></div>
  </div>
</section>

<!-- THE FOUR DOORS. Somebody who came in on the general page and knows what
     they do can go and stand in the right queue. -->
<section class="quiet">
  <div class="wrap">
    <div class="eyebrow"><span id="doorsEyebrow"></span><i></i></div>
    <div class="doors" id="doors"></div>
  </div>
</section>

<div class="foot">
  <div class="wrap">
    <div class="col">
      <b>The Exchange · 交换</b>
      <span id="footAbout"></span>
    </div>
    <div class="col links">
      <a href="/rules" id="footRules"></a>
      <a href="/privacy" id="footPrivacy"></a>
      <!-- The way in for whoever runs it. Visible to everybody, which costs
           nothing: the page behind it is behind the invitation door, and the
           figures on it need the admin key after that. A hidden address is
           not a lock, and a link the person who needs it cannot find is not
           a feature. -->
      <a href="/doors" id="footDoors"></a>
      <!-- The panel: the queue, who is in, what has been posted. On its own
           hostname behind its own login, which is why this is a link out and
           not a page here. -->
      <a href="/admin" id="footPanel"></a>
      <!-- Who is at the door, for the one person the form says reads it. -->
      <a href="/waiting" id="footWaiting"></a>
    </div>
  </div>
</div>

<script type="module">
import { T, setLang, pickLang, langButton } from "/i18n.js";
import { waitBox, feedPeek, roomFromPath, admitted, tally } from "/wait.js";

/* One line for somebody who has just deleted themselves. It is drawn before
   anything else on the page so the word arrives with the page rather than
   after it. */
if (new URLSearchParams(location.search).get("gone") === "1") {
  const said = document.getElementById("gonesaid");
  said.hidden = false;
  said.textContent = T("gone.done");
}

/* SOMEBODY OPENED THIS DOOR. Reported after the page is up rather than at the
   top of the script, so a browser that fell over on the way never counts as a
   visit — and not at all for a member, who is not somebody arriving. */
admitted().then((yes) => { if (!yes) tally("door"); }).catch(() => tally("door"));

const $ = (id) => document.getElementById(id);
const el = (t, c, x) => { const n = document.createElement(t); if (c) n.className = c;
  if (x !== undefined) n.textContent = x; return n; };
const fill = (n) => { while (n.firstChild) n.removeChild(n.firstChild); };

/* ---- the doors ---------------------------------------------------------- */
const DOORS = ["film", "invest", "raise", "trade", "other"];
function drawDoors() {
  const box = $("doors");
  fill(box);
  for (const k of DOORS) {
    const a = el("a");
    a.href = "/r/" + k;
    const b = el("b", null, T("waitroom." + k));
    b.append(el("small", null, T("door." + k + ".under")));
    a.append(b, el("i", null, "›"));
    box.append(a);
  }
}

/* HOW FEW, held here rather than drawn where it arrives. The numbers come
 * over the network once; the words are rebuilt every time the language
 * changes, and the two events have nothing to do with each other. */
let FEW = null;
function drawFew() {
  const line = $("fewline");
  if (!line || !FEW) return;
  line.replaceChildren();
  for (const bit of T("land.few").split(/(\{in\}|\{out\})/)) {
    if (bit === "{in}") line.append(el("b", null, String(FEW.in)));
    else if (bit === "{out}") line.append(el("b", null, String(FEW.out)));
    else if (bit) line.append(document.createTextNode(bit));
  }
  line.hidden = false;
}

/* ---- the words ---------------------------------------------------------- */
function paint() {
  document.title = T("site.title") + " — " + T("land.title");
  $("brandname").textContent = T("site.title");
  $("navopen").textContent = T("land.enter");
  $("navjoin").textContent = T("land.joinbar");
  $("ctajoin").textContent = T("land.join");
  $("ctaenter").textContent = T("land.enter");
  $("eyeline").textContent = T("land.eyebrow");
  // Rebuilt with the words, not only when the numbers land — the language
  // button calls this, and a line drawn once stays in the language it was
  // drawn in. The hostess box learnt the same lesson two hours ago.
  drawFew();
  $("asking").textContent = T("land.head");
  $("onlyline").textContent = T("land.only");
  $("onewhy").textContent = T("land.one");
  $("landbig").textContent = T("land.big");
  $("phTop").textContent = T("land.phTop");
  $("phFew").textContent = T("land.phFew");
  $("phEye").textContent = T("land.phEye");
  $("phFollow").textContent = T("land.phFollow");
  $("phNext").textContent = T("land.phNext");
  /* The blank sentence is the bold half and has to stay one unbroken run, so
     it is two nodes rather than a string with markup in it — this page never
     puts translated text through innerHTML. */
  drawSay();
  $("doorsEyebrow").textContent = T("land.doors");
  $("footAbout").textContent = T("land.foot");
  $("footRules").textContent = T("land.rules");
  $("footPrivacy").textContent = T("land.privacy");
  $("footDoors").textContent = T("land.counted");
  $("footPanel").textContent = T("land.panel");
  $("footWaiting").textContent = T("land.queue");
  drawDoors();
}

/* A room door writes over the one line it has better words for. After paint,
   never instead of it — see the note in the server for /r/:room.
   It used to write three: the eyebrow, the question and the paragraph. Two of
   those are gone from the page, so door.<room>.say and land.under/land.lede
   are unused now. Left in the strings rather than deleted — they are written
   and translated, and the day a room wants a line back it should not have to
   be written twice. */
/* THE SENTENCE, WITH OR WITHOUT ITS BLANKS FILLED IN.
 *
 * One function because there are two callers — the general page, which leaves
 * the blanks, and a room door, which knows the pair — and a sentence built in
 * two places is a sentence that will one day disagree with itself. Nothing
 * goes through innerHTML: the words are translated and the pills are elements.
 */
/* WHICH PAIRS ARE REAL.
 *
 * Not every combination is a match — "a Founder looking for a Performer" is
 * two people who will never come up for each other, and offering it on the
 * front page would teach the mechanic wrongly in the one place it has to be
 * taught right. So the right-hand pill only ever offers the roles that
 * actually pair with whatever is on the left, and changing the left resets it.
 *
 * A short list rather than all fifteen roles: these are the rooms with people
 * in them, and a menu of fifteen is a form. */
/* Which pair each /r/ door stands for. It was read out of the door's own
   strings, which meant the sentence had the words and the card underneath had
   no idea who it was drawing. */
const ROOMPAIR = {
  film: ["producer", "performer"],
  invest: ["investor", "founder"],
  raise: ["founder", "investor"],
  trade: ["buyer", "maker"],
};

const MATCH = {
  founder: ["investor"],
  investor: ["founder"],
  performer: ["agent", "producer"],
  agent: ["producer", "brand"],
  producer: ["performer", "writer"],
  writer: ["producer"],
  maker: ["buyer", "brand"],
  buyer: ["maker"],
  brand: ["maker", "agent"],
};
const MEROLES = Object.keys(MATCH);
let iAm = "founder", iWant = "investor", openPill = "";

/** The person on the other side: whoever the right-hand pill names. */
function drawWho() {
  const k = iWant;
  const set = (id, key) => { $(id).textContent = T(key); };
  $("phLetter").textContent = T("who." + k + ".name").trim().slice(0, 1);
  /* The same colour the app gives a name, so a person is the same colour here
     as they would be on the board. See wash() in index.html. */
  let h = 0;
  for (const ch of T("who." + k + ".name")) h = (h * 31 + ch.codePointAt(0)) % 360;
  $("phLetter").style.background =
    "linear-gradient(150deg,hsl(" + h + " 30% 62%),hsl(" + ((h + 24) % 360) + " 26% 38%))";
  set("phName", "who." + k + ".name");
  set("phCity", "who." + k + ".city");
  set("phLine", "who." + k + ".line");
  $("phSay1").textContent = T("land.does1") + " ";
  $("phSay2").textContent = T("art." + k);
  $("phSay3").textContent = " " + T("land.does3") + " ";
  // Their half is the mirror of yours: you said what you are, they are looking
  // for exactly that.
  $("phSay4").textContent = T("art." + iAm);
}

/* THE SENTENCE, AS TWO CONTROLS.
 *
 * A pill is the shape of a control and these did nothing, which teaches
 * somebody in the first two seconds that the page is a picture of a product
 * rather than one. Now the left one asks what you are and the right one asks
 * what you want, and the screen underneath answers with somebody who said it.
 *
 * Built out of buttons and a list rather than a <select>: a native select on a
 * phone opens a full-height wheel that covers the very thing it is meant to be
 * changing, and the whole point here is watching the card change while you
 * pick. Keyboard and screen readers get real buttons with aria-expanded.
 */
function drawSay() {
  const line = $("landsay");
  const bit = (t) => document.createTextNode(t);

  const picker = (side) => {
    const now = side === "me" ? iAm : iWant;
    const list = side === "me" ? MEROLES : (MATCH[iAm] || []);
    const wrap = document.createElement("span");
    wrap.className = "pickwrap";

    const b = document.createElement("button");
    b.type = "button";
    b.className = "pick" + (openPill === side ? " open" : "");
    b.setAttribute("aria-expanded", String(openPill === side));
    b.append(bit(T("art." + now)), Object.assign(document.createElement("s"),
      { textContent: "\u25be", ariaHidden: "true" }));
    /* One choice is not a choice. When the left-hand role pairs with exactly
       one other, the right-hand pill still says the word — it is half the
       sentence — but it does not pretend to open. */
    const dead = side === "want" && list.length < 2;
    if (dead) b.classList.add("dead");
    b.onclick = () => { if (!dead) { openPill = openPill === side ? "" : side; drawSay(); } };
    wrap.append(b);

    if (openPill === side && !dead) {
      const menu = document.createElement("span");
      menu.className = "picklist";
      for (const k of list) {
        const o = document.createElement("button");
        o.type = "button";
        o.className = k === now ? "on" : "";
        o.textContent = T("art." + k);
        o.onclick = () => {
          if (side === "me") {
            iAm = k;
            // The right-hand half has to stay a real pair — see MATCH.
            if (!(MATCH[iAm] || []).includes(iWant)) iWant = MATCH[iAm][0];
          } else { iWant = k; }
          openPill = "";
          drawSay(); drawWho();
        };
        menu.append(o);
      }
      wrap.append(menu);
    }
    return wrap;
  };

  line.replaceChildren(
    bit(T("land.say1") + " " + T("land.does1") + " "),
    picker("me"),
    bit(" " + T("land.does3") + " "),
    picker("want"),
    bit(" " + T("land.say3")));
  drawWho();
}

/* A room door says its own pair and does not offer to change it: /r/film is
   one link sent to one group, and a picker on it is a question that room has
   already answered. */
function pinSay(me, want) {
  iAm = me; iWant = want; openPill = "";
  const line = $("landsay");
  const pill = (k) => Object.assign(document.createElement("i"), { textContent: T("art." + k) });
  line.replaceChildren(
    document.createTextNode(T("land.say1") + " " + T("land.does1") + " "),
    pill(me),
    document.createTextNode(" " + T("land.does3") + " "),
    pill(want),
    document.createTextNode(" " + T("land.say3")));
  drawWho();
}

// Tapping anywhere else closes an open menu, which is what every menu does.
document.addEventListener("click", (e) => {
  if (openPill && !e.target.closest(".pickwrap")) { openPill = ""; drawSay(); }
});

function paintRoom() {
  const key = roomFromPath();
  if (!key) return;
  const name = T("waitroom." + key);
  document.title = name + " · " + T("site.title");
  $("asking").textContent = T("door." + key + ".head");
  // A room-flavoured door says its own thing; the general comparison over it
  // would be a second headline about somebody else's products.
  $("eyeline").hidden = true;
  /* THE SAME SENTENCE, THIS ROOM'S PAIR — and it moved when the band did.
   *
   * This used to write into two pills that stood on their own. Those pills are
   * gone: the sentence is now the bold half of one line under the headline,
   * with blanks in it. On a room door the blanks are exactly what the room
   * already knows — /r/film is producers and performers — so they are filled
   * in rather than left as underscores, which is a better door anyway: the
   * general page asks a question and a room door answers it.
   *
   * Missing the move broke every /r/ door outright, because the elements it
   * wrote into no longer existed and the whole function threw. T returning the
   * key itself is still the test for a room with no pair of its own.
   */
  /* The room's own pair, as role keys rather than as words — the sentence and
     the person underneath both need the key, and looking the words back up
     from a translated string is how a room door ends up in English. */
  const pair = ROOMPAIR[key];
  if (pair) pinSay(pair[0], pair[1]);
}

setLang(pickLang());
/* The door box is built in JavaScript like the rest of this page, so a
   language change has to rebuild it too — left out, the hostess went on
   offering her questions in English on a page that had switched to Chinese.
   Only when she is there: drawing her would un-hide nothing, but it would
   fill a box the server said not to show. */
$("langslot").append(langButton(() => {
  paint();
  paintRoom();
  if (!$("hostess").hidden) drawHostess();
}));
paint();
paintRoom();
$("waitslot").append(waitBox());

/* THE PRESS PUTS THE CURSOR IN THE BOX. A bare #waitsection jump leaves the
 * form on screen and the keyboard shut, and on a phone the section heading
 * alone fills the screen — it reads as nothing having happened. */
for (const id of ["navjoin", "ctajoin"]) $(id).addEventListener("click", (e) => {
  const box = $("waitsection");
  if (!box || box.hidden) return;
  e.preventDefault();
  box.scrollIntoView({ behavior: "smooth", block: "start" });
  const first = box.querySelector("input:not([type=hidden])");
  if (first) setTimeout(() => first.focus({ preventScroll: true }), 420);
});

/* THE PERSON ON THE DOOR, WIRED.
 *
 * One question, one answer, no history — see lib/hostess.js for why the
 * server keeps none. So this keeps none either: the last answer is replaced
 * by the next, which is also the honest shape for a doorway. Asking again is
 * asking again, not continuing a conversation.
 */
function drawHostess() {
  $("hostesslab").textContent = T("host.head");
  $("hostessq").placeholder = T("host.ask");
  $("hostessgo").textContent = T("host.go");
  $("hostessnote").textContent = T("host.note");
  const box = $("hostessasks");
  fill(box);
  /* Three questions people actually arrive with, so nobody has to compose one
     to find out whether it is worth composing one. */
  for (const k of ["what", "safe", "cost"]) {
    const b = el("button", null, T("host.q." + k));
    b.type = "button";
    b.addEventListener("click", () => { $("hostessq").value = T("host.q." + k); askNow(); });
    box.append(b);
  }
}

let ASKING = false;
async function askNow() {
  const q = $("hostessq").value.trim();
  if (!q || ASKING) return;
  ASKING = true;
  const go = $("hostessgo");
  go.disabled = true;
  const said = $("hostesssaid");
  said.hidden = false;
  said.textContent = T("host.thinking");
  try {
    const r = await fetch("/api/ask", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ q, device: askDevice() }),
    });
    const d = await r.json().catch(() => ({}));
    /* Their words, not the provider's. Busy, over its allowance, and broken
       are three different sentences to a reader and one shrug in a log. */
    said.textContent = d && d.text ? d.text
      : T(d && d.error === "slow-down" ? "host.slow"
        : d && d.error === "busy" ? "host.busy" : "host.no");
  } catch { said.textContent = T("host.no"); }
  go.disabled = false;
  ASKING = false;
}

/** The same random number the waiting form uses, so one visitor is one
 *  visitor to the rate limit rather than one per box on the page. */
function askDevice() {
  try {
    let d = localStorage.getItem("board:device") || "";
    if (!d) {
      d = (crypto.randomUUID ? crypto.randomUUID() : String(Math.random()).slice(2))
        .replace(/-/g, "");
      localStorage.setItem("board:device", d);
    }
    return d;
  } catch { return ""; }
}

$("hostessform").addEventListener("submit", (e) => { e.preventDefault(); askNow(); });

/* Whether this browser is already through the door. Two things on this page
   depend on it and they arrive over the network in either order, so the answer
   is held here rather than each of them asking separately — see the note at
   the foot of this file. */
let INSIDE = false;

/* The board out of focus. Words never leave the server — the shape of the
   newest posts and nothing else. */
const asked = roomFromPath();
fetch("/api/hello" + (asked ? "?room=" + encodeURIComponent(asked) : ""))
  .then((r) => r.json())
  .then((d) => {
    /* Only if there is anybody on the door. A box that answers every
       question with an error is worse than no box, and the server is the one
       that knows whether the key is configured — see hostess in /api/hello. */
    if (d && d.hostess && !INSIDE) { $("hostess").hidden = false; drawHostess(); }
    /* HOW FEW, in the hero. Both numbers or neither: "41 inside" on its own
       is a small company, and "120 waiting" on its own is a queue for nothing.
       Together they are the only argument for a door that this page can make
       out of facts rather than adjectives. */
    if (d && !INSIDE && d.people && d.waiting) {
      FEW = { in: d.people, out: d.waiting };
      drawFew();
    }
    if (!d || !Array.isArray(d.peek) || !d.peek.length) return;
    // A member does not need the feed out of focus. Checked here as well as
    // in the handler below because these two land in whichever order the
    // network gives them, and whichever is second has to be the one that wins.
    if (INSIDE) return;
    // Shown only when there is something to show. An empty band of raised
    // grey is a section that failed to load, which is the wrong thing to put
    // between the pitch and the door.
    $("peeksection").hidden = false;
    $("peekslot").append(feedPeek(d.peek, T("peek.head")));
  })
  .catch(() => { /* the page is the same page without it */ });

/* THIS PAGE HAS TWO READERS AND ONLY ONE OF THEM IS OUTSIDE.
 *
 * A member who taps their own link, or comes back to /about from a group
 * chat, was being shown a form asking to be put on the waiting list for the
 * board they are already on — and a blurred version of the feed they can read
 * in full one tap away. Both read as the app having forgotten them.
 *
 * So it asks. One public route, no names, no cookie beyond the one they
 * already have: is this browser through the door. If it is, the queue and the
 * blur come off and the button in the corner stops offering to take a
 * password it does not need.
 *
 * Drawn after, never instead: the answer arrives over the network and the
 * page has to be right before it does. Somebody outside sees the page they
 * should see with no wait, and a member sees a form for a moment. That is the
 * right way round — the stranger is the reader this page is for, and the
 * member has somewhere better to be anyway.
 */
/* ?new=1 SHOWS A MEMBER WHAT A STRANGER SEES.
 *
 * This page hides the queue and the form from anybody already in, which is
 * right — and it means whoever runs the board cannot check their own share
 * links. They open one, see a page with no way to join on it, and conclude the
 * link is broken; it is working perfectly and showing them the member's half.
 * The same switch the door has, for the same reason.
 *
 * Display only. Nothing about being admitted is touched: drop the parameter
 * and the member's page is back. */
const PREVIEW = new URLSearchParams(location.search).get("new") === "1";

admitted().then((inAlready) => {
  INSIDE = inAlready;
  if (!inAlready || PREVIEW) return;
  // The door box goes with the queue: a member has the Ask the Professor
  // panel inside, which is written answers and costs nothing.
  document.body.classList.add("inside");
  $("hostess").hidden = true;
  $("waitsection").hidden = true;
  $("peeksection").hidden = true;
  const go = $("navopen");
  go.textContent = T("land.inside");
  /* BROWSE, NOT "/". This said "/" — which is THIS PAGE unless BOARD_AT_ROOT
     is set, so the one button a member had on the public page put them back
     on the public page. Tapped from WeChat, where a member's link often lands
     here rather than on the board, that reads as the link being broken.
     The board's front door is /browse, whatever the root is pointed at. */
  go.href = "/browse";
}).catch(() => { /* not sure means outside, which is the safe half */ });
</script>
</body>
</html>
