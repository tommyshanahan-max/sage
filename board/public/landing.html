<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="/favicon.png" sizes="192x192">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<title>Liuxuesheng — a meeting place for exchange students in China</title>
<meta name="description" content="Find a study buddy, ask the question you are embarrassed to ask, and compare notes on how to actually get by. Nothing to install. No VPN.">

<!-- The card WeChat, and everything else, builds when this link is forwarded.
     The crawler fetches once and runs no JavaScript, so these are absolute and
     already here — {{ORIGIN}} is filled in per request by the server, which
     learns its own name from the request and nowhere else. -->
<meta property="og:type" content="website">
<meta property="og:title" content="Liuxuesheng — for exchange students in China">
<meta property="og:description" content="Somebody here worked it out last month. Study buddies, and notes on how to get by.">
<meta property="og:image" content="{{ORIGIN}}/share.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:url" content="{{ORIGIN}}/">
<meta name="twitter:card" content="summary_large_image">
<meta name="color-scheme" content="light dark">
<link rel="stylesheet" href="/site.css">
</head>
<body>

<div class="top">
  <div class="wrap">
    <a class="brand" href="/">
      <i>留</i>
      <span><b id="brandname">Liuxuesheng</b><small>留学生</small></span>
    </a>
    <span id="langslot" style="margin-left:auto;display:flex;gap:.6rem;align-items:center"></span>
    <a class="go" id="navopen" href="/feed">Open the feed</a>
  </div>
</div>

<div class="hero">
  <div class="wrap">
    <p class="kicker"><i></i><span id="kicker"></span></p>

    <div class="asking">
      <q id="asking"></q>
      <p class="under" id="askUnder"></p>
    </div>

    <p class="lede" id="lede"></p>
    <p class="hanzi" id="hanzi"></p>

    <div class="cta">
      <a class="btn" id="ctaopen" href="/feed"></a>
      <a class="btn ghost" id="ctahow" href="#how"></a>
    </div>
    <p class="under" id="under"></p>
  </div>
</div>

<section>
  <div class="wrap">
    <div class="eyebrow"><span id="shotEyebrow"></span><i></i></div>
    <h2 id="shotH2"></h2>
    <p class="sub" id="shotSub"></p>

    <div class="shots">
      <!-- The feed. Three cards and the bar underneath, which is the whole
           screen: read, and press + to add to it. -->
      <div class="shot">
        <div class="phone">
          <div class="ph-top"><b id="phFeedTitle"></b><i></i></div>
          <div class="ph-body">
            <div class="ph-card"><p id="phQ1"></p><span id="phQ1who"></span></div>
            <div class="ph-card"><p id="phQ2"></p><span id="phQ2who"></span></div>
            <div class="ph-card"><p id="phQ3"></p><span id="phQ3who"></span></div>
          </div>
          <div class="ph-bar"><u></u><em>+</em><u></u></div>
        </div>
        <b class="cap" id="shotFeed"></b>
        <p class="cap" id="shotFeedP"></p>
      </div>

      <!-- Your own page: a cover, a face, a name, and one line about what you
           are working on. Nothing is asked for beyond that. -->
      <div class="shot">
        <div class="phone">
          <div class="ph-cover"></div>
          <div class="ph-face">a</div>
          <p class="ph-name" id="phMeName"></p>
          <p class="ph-facts" id="phMeFacts"></p>
          <p class="ph-bio" id="phMeBio"></p>
          <div class="ph-body">
            <div class="ph-card"><p id="phMeQ"></p><span id="phMeQwho"></span></div>
          </div>
          <div class="ph-bar"><u></u><em>+</em><u></u></div>
        </div>
        <b class="cap" id="shotMe"></b>
        <p class="cap" id="shotMeP"></p>
      </div>

      <!-- The directory. A row per person and the days they are free, which
           is the only thing anybody needs to know to ask. -->
      <div class="shot">
        <div class="phone">
          <div class="ph-top"><b id="phBudsTitle"></b><i></i></div>
          <div class="ph-body">
            <div class="ph-row"><b>m</b><div><p id="phB1"></p><span id="phB1d"></span></div></div>
            <div class="ph-row"><b>y</b><div><p id="phB2"></p><span id="phB2d"></span></div></div>
            <div class="ph-row"><b>s</b><div><p id="phB3"></p><span id="phB3d"></span></div></div>
          </div>
          <div class="ph-bar"><u></u><em>+</em><u></u></div>
        </div>
        <b class="cap" id="shotBuds"></b>
        <p class="cap" id="shotBudsP"></p>
      </div>
    </div>
  </div>
</section>

<div class="band">
  <section>
    <div class="wrap">
      <div class="eyebrow"><span id="liveEyebrow"></span><i></i></div>
      <h2 id="liveH2"></h2>
      <p class="sub" id="liveSub"></p>
      <div class="live" id="live"></div>
      <div class="more"><a class="btn ghost" id="seeall" href="/feed"></a></div>
    </div>
  </section>
</div>

<section>
  <div class="wrap">
    <div class="eyebrow"><span id="ddEyebrow"></span><i></i></div>
    <h2 id="ddH2"></h2>
    <div class="dd">
      <div class="ddhead"><span id="ddDo"></span><span id="ddDont"></span></div>
      <div class="ddrow"><p id="dd1a"></p><p id="dd1b"></p></div>
      <div class="ddrow"><p id="dd2a"></p><p id="dd2b"></p></div>
      <div class="ddrow"><p id="dd3a"></p><p id="dd3b"></p></div>
      <div class="ddrow"><p id="dd4a"></p><p id="dd4b"></p></div>
      <div class="ddrow"><p id="dd5a"></p><p id="dd5b"></p></div>
    </div>
  </div>
</section>

<section>
  <div class="wrap">
    <div class="eyebrow"><span id="threeEyebrow"></span><i></i></div>
    <h2 id="threeH2"></h2>
    <p class="sub" id="threeSub"></p>
    <div class="three">
      <div class="thing"><span class="n">01</span><h3 id="t1h"></h3><p id="t1p"></p><p class="say" id="t1s"></p></div>
      <div class="thing"><span class="n">02</span><h3 id="t2h"></h3><p id="t2p"></p><p class="say" id="t2s"></p></div>
      <div class="thing"><span class="n">03</span><h3 id="t3h"></h3><p id="t3p"></p><p class="say" id="t3s"></p></div>
    </div>
  </div>
</section>

<div class="band">
  <section id="how">
    <div class="wrap">
      <div class="eyebrow"><span id="howEyebrow"></span><i></i></div>
      <h2 id="howH2"></h2>
      <p class="sub" id="howSub"></p>
      <div class="rules">
        <div class="rule"><h4 id="r1h"></h4><p id="r1p"></p></div>
        <div class="rule"><h4 id="r2h"></h4><p id="r2p"></p></div>
        <div class="rule"><h4 id="r3h"></h4><p id="r3p"></p></div>
        <div class="rule warn"><h4 id="r4h"></h4><p id="r4p"></p></div>
      </div>
    </div>
  </section>
</div>

<footer>
  <div class="wrap">
    <div class="col"><b>Liuxuesheng · 留学生</b><span id="footAbout"></span></div>
    <div class="col">
      <b id="footWrong"></b><span id="footWrongP"></span>
      <span id="contact" hidden></span>
      <!-- Quiet, and on the product's own domain, so the people who run this
           have one address to be sent rather than two. It is a redirect to a
           seat with its own login; nothing here is reachable without it. -->
      <a class="adminlink" href="/admin" id="adminLink"></a>
    </div>
  </div>
</footer>

<script type="module">
import { T, when, lang, setLang, pickLang, langButton } from "/i18n.js";
import { drawLive, topicColour } from "/live.js";

const $ = (id) => document.getElementById(id);
function el(t, c, x) {
  const n = document.createElement(t);
  if (c) n.className = c;
  if (x !== undefined) n.textContent = x;
  return n;
}
function fill(node) { while (node.firstChild) node.removeChild(node.firstChild); }

/* Every string on the page, in one function.
 *
 * A repaint rather than a DOM walk swapping text nodes: the page is written
 * once, painted from the dictionary, and repainted on a language change. There
 * is no second code path to go stale, which is the failure a bolted-on
 * translation always eventually has. */
const TEXT = ["kicker","lede","hanzi","askUnder","under",
  "liveEyebrow","liveH2","liveSub","threeEyebrow","threeH2","threeSub",
  "t1h","t1p","t1s","t2h","t2p","t2s","t3h","t3p","t3s",
  "howEyebrow","howH2","howSub","r1h","r1p","r2h","r2p","r3h","r3p","r4h","r4p",
  "footAbout","footWrong","footWrongP","adminLink"];

/* The drawn phones. Their own list because the ids do not match the keys
 * one-for-one: the markup names an element for where it sits, the dictionary
 * names a string for what it says, and forcing those to be the same word makes
 * one of them wrong. */
const SHOTS = {
  shotEyebrow: "shot.eyebrow", shotH2: "shot.h2", shotSub: "shot.sub",
  shotFeed: "shot.feed", shotFeedP: "shot.feedP",
  shotMe: "shot.me", shotMeP: "shot.meP",
  shotBuds: "shot.buds", shotBudsP: "shot.budsP",
  phFeedTitle: "shot.feed", phBudsTitle: "shot.buds",
  phQ1: "shot.q1", phQ1who: "shot.q1who",
  phQ2: "shot.q2", phQ2who: "shot.q2who",
  phQ3: "shot.q3", phQ3who: "shot.q3who",
  phMeName: "shot.meName", phMeFacts: "shot.meFacts", phMeBio: "shot.meBio",
  phMeQ: "shot.q1", phMeQwho: "shot.meReplies",
  phB1: "shot.bud1", phB1d: "shot.bud1d",
  phB2: "shot.bud2", phB2d: "shot.bud2d",
  phB3: "shot.bud3", phB3d: "shot.bud3d",
};

function paint() {
  document.title = T("site.title") + " — " + T("site.kicker");
  // Not painted from the dictionary: a name is not translated, and
  // site.title is "留学生" in Chinese — the same word the <small>
  // beneath it already carries, printed twice.
  for (const id of TEXT) $(id).textContent = T("site." + id);
  for (const [id, key] of Object.entries(SHOTS)) $(id).textContent = T(key);
  // The two-column list: its keys live under dd.* rather than site.*, since it
  // is content rather than chrome and reads as a block.
  $("ddEyebrow").textContent = T("dd.eyebrow");
  $("ddH2").textContent = T("dd.h2");
  $("ddDo").textContent = T("dd.do");
  $("ddDont").textContent = T("dd.dont");
  for (let i = 1; i <= 5; i++) {
    $("dd" + i + "a").textContent = T("dd." + i + "a");
    $("dd" + i + "b").textContent = T("dd." + i + "b");
  }
  $("navopen").textContent = T("site.open");
  $("ctaopen").textContent = T("site.open");
  $("ctahow").textContent = T("site.how");
  $("seeall").textContent = T("site.seeAll");
  askNow(true);
  drawLive($("live"), POSTS);
}

/* ---- the one moving thing on the page --------------------------------------
 *
 * Real questions, cycling. The fastest way to say what a board is for is to
 * show somebody asking — a feature list says "you can ask questions", this
 * says what the questions are.
 *
 * It stops for anyone who asked their system for less motion, and it stops
 * when the tab is not being looked at, because a timer running in a background
 * tab on a phone is somebody's battery. */
const ASKS = ["site.ask1","site.ask2","site.ask3","site.ask4","site.ask5","site.ask6"];
let askAt = 0, askTimer = null;
const stillMotion = window.matchMedia
  && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

function askNow(immediate) {
  const q = $("asking");
  if (immediate) { q.textContent = T(ASKS[askAt]); return; }
  q.classList.add("fade");
  setTimeout(() => {
    askAt = (askAt + 1) % ASKS.length;
    q.textContent = T(ASKS[askAt]);
    q.classList.remove("fade");
  }, stillMotion ? 0 : 350);
}
function askRun(on) {
  clearInterval(askTimer);
  askTimer = null;
  if (on && !stillMotion) askTimer = setInterval(() => askNow(false), 4200);
}
document.addEventListener("visibilitychange", () => askRun(!document.hidden));

// ---- the newest few, live from the board ------------------------------------
let POSTS = [];


// ---- go ---------------------------------------------------------------------
setLang(pickLang());
$("langslot").append(langButton(paint));
paint();
askRun(true);

fetch("/api/board")
  .then((r) => r.json())
  .then((d) => { POSTS = (d && d.posts) || []; drawLive($("live"), POSTS); })
  .catch(() => drawLive($("live"), []));

fetch("/api/contact")
  .then((r) => r.json())
  .then((d) => {
    if (!d || !d.contact) return;
    const box = $("contact");
    box.hidden = false;
    box.append(document.createTextNode(" " + T("board.contact") + " "));
    const a = document.createElement("a");
    a.href = /@/.test(d.contact) ? "mailto:" + d.contact : d.contact;
    a.textContent = d.contact;
    box.append(a, document.createTextNode("."));
  })
  .catch(() => { /* no contact set: say nothing */ });
</script>

</body>
</html>
