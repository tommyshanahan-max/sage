<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- Empty on every deployment but the demo board, where it pins this
     browser to the one seeded identity. See BOARD_DEMO_DEVICE in server.js. -->
{{DEMO}}
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Waiting · The Exchange</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="/favicon.png" sizes="192x192">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="stylesheet" href="/site.css">
<style>
  /* The queue, on a phone. `make waiting` is the same list and needs a
     terminal, and the decision it serves — is this somebody worth a code —
     gets made in the ten minutes after their name arrives, from wherever you
     happen to be standing. */
  body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans)}
  main{max-width:34rem;margin:0 auto;padding:1.4rem 1.2rem 4rem}
  h1{margin:0;font-family:var(--serif);font-weight:400;font-size:1.5rem;
     letter-spacing:-.01em}
  .sub{margin:.2rem 0 0;font-size:.85rem;color:var(--muted)}

  .askkey{margin:1.6rem 0 0;padding:1.1rem 1.2rem;background:var(--card);
    border:1px solid var(--hair);border-radius:.8rem}
  .askkey p{margin:0 0 .7rem;font-size:.9rem;color:var(--ink-2)}
  .askkey input{width:100%;padding:.7rem .9rem;border:1px solid var(--hair);
    border-radius:.6rem;background:var(--raise);color:var(--ink);
    font:inherit;font-size:1rem}
  .askkey button{margin:.7rem 0 0;width:100%;padding:.7rem 1rem;border:0;
    border-radius:99px;background:var(--accent);color:var(--accent-ink);
    font:inherit;font-weight:600;font-size:.95rem;cursor:pointer}
  .askkey .no{margin:.6rem 0 0;font-size:.84rem;color:#b3261e}

  .dhead{display:flex;align-items:center;gap:.8rem;margin:1.8rem 0 .2rem;
    font-size:.68rem;letter-spacing:.16em;text-transform:uppercase;
    color:var(--muted)}
  /* The waiting room, marked as the part with work in it. Everything below is
     a list to read; this is a list to act on, and it should not look the same. */
  .uphead span{color:var(--accent,#3F68D8)}
  .uphead b{background:var(--accent,#3F68D8);color:#fff;border-radius:99px;
    padding:.1rem .55rem;font-size:.72rem}
  .upsay{margin:.2rem 0 .8rem;font-size:.85rem;line-height:1.5;opacity:.7;max-width:34rem}
  .gap{height:1.6rem}
  .acts{display:flex;gap:.5rem;flex-wrap:wrap;margin:.7rem 0 0}
  .acts button{border:0;border-radius:99px;padding:.45rem 1rem;font:inherit;
    font-size:.85rem;cursor:pointer}
  .acts .in{background:var(--accent,#3F68D8);color:#fff}
  .acts .back{background:transparent;color:inherit;opacity:.6;
    box-shadow:inset 0 0 0 1px currentColor}
  .dhead i{flex:1;height:1px;background:var(--hair)}
  .dhead b{color:var(--accent);font-weight:600;letter-spacing:.04em}

  .who{margin:.7rem 0 0;padding:.95rem 1.05rem;background:var(--card);
    border:1px solid var(--hair);border-radius:.8rem}
  .who .wtop{display:flex;align-items:baseline;gap:.6rem}
  .who .nm{font-family:var(--serif);font-size:1.2rem}
  .who .when{margin-left:auto;font-size:.76rem;color:var(--muted);
    font-variant-numeric:tabular-nums}
  .who .why{margin:.35rem 0 0;font-size:.92rem;color:var(--ink-2);
    line-height:1.5}
  .who .reach{display:block;margin:.55rem 0 0;font-size:.85rem;
    color:var(--accent);word-break:break-all}
  .who .via{display:inline-block;margin:.55rem .4rem 0 0;padding:.15rem .55rem;
    border-radius:99px;background:var(--accent-soft);color:var(--accent);
    font-size:.74rem;font-weight:600}
  .who .done{display:inline-block;margin:.55rem 0 0;padding:.15rem .55rem;
    border-radius:99px;background:var(--raise);color:var(--muted);
    font-size:.74rem}
  .who.answered{opacity:.55}

  .none{margin:1.4rem 0 0;padding:1.1rem 1.2rem;border-radius:.8rem;
    background:var(--card);border:1px solid var(--hair);
    font-size:.92rem;color:var(--ink-2)}
  .note{margin:1.6rem 0 0;font-size:.79rem;color:var(--muted);line-height:1.5}
  .again{margin:1.2rem 0 0;width:100%;padding:.6rem 1rem;
    border:1px solid var(--hair);border-radius:99px;background:var(--card);
    color:var(--ink-2);font:inherit;font-size:.86rem;cursor:pointer}
</style>
</head>
<body>
<main>
  <h1>Waiting</h1>
  <p class="sub" id="sub">Who is at the door.</p>

  <div class="askkey" id="ask" hidden>
    <p>The admin key — the same one in your .env.</p>
    <input id="key" type="password" autocomplete="off" autocapitalize="off"
           spellcheck="false" placeholder="admin key">
    <button type="button" id="go">Show me</button>
    <p class="no" id="no" hidden></p>
  </div>

  <div id="out" hidden>
    <div id="rooms"></div>
    <p class="note">
      Only you see this. The form says one person reads it, so it is not in the
      app for anybody else — and the way to reach somebody is on here because
      reaching them is the whole point of the list.
    </p>
    <button class="again" type="button" id="forget">Forget the key on this phone</button>
  </div>
</main>

<script type="module">
const $ = (id) => document.getElementById(id);
const ORDER = ["film", "invest", "raise", "trade", "other"];
const LABEL = { film: "Film & TV", invest: "Investing", raise: "Raising",
                trade: "Factories & buyers", other: "Something else" };

const keep = {
  get() { try { return localStorage.getItem("board:adminkey") || ""; } catch { return ""; } },
  set(v) { try { localStorage.setItem("board:adminkey", v); } catch { /* fine */ } },
  drop() { try { localStorage.removeItem("board:adminkey"); } catch { /* fine */ } },
};

const el = (tag, cls, text) => {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text !== undefined) n.textContent = text;
  return n;
};

/* "3 days ago" rather than a date. The only question this list answers about
   time is how long somebody has been left standing there. */
function ago(iso) {
  const then = Date.parse(iso || "");
  if (!then) return "";
  const days = Math.floor((Date.now() - then) / 86400000);
  if (days <= 0) return "today";
  if (days === 1) return "yesterday";
  if (days < 14) return days + " days";
  return Math.floor(days / 7) + " weeks";
}

function card(w) {
  const box = el("div", "who" + (w.done ? " answered" : ""));
  const top = el("div", "wtop");
  top.append(el("span", "nm", w.name || "—"), el("span", "when", ago(w.at)));
  box.append(top);
  if (w.why) box.append(el("p", "why", w.why));
  /* The way to reach them, as something you can tap. mailto for an address and
     plain text for a WeChat id, because there is no scheme that opens WeChat
     at a person and a dead link is worse than a line to copy. */
  const reach = String(w.reach || "").trim();
  if (reach) {
    if (/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(reach)) {
      const a = el("a", "reach", reach);
      a.href = "mailto:" + reach;
      box.append(a);
    } else {
      box.append(el("span", "reach", reach));
    }
  }
  if (w.viaName) box.append(el("span", "via", "sent by " + w.viaName));
  if (w.done) {
    box.append(el("span", "done", w.done === "in" ? "let in" : "turned down"));
  }
  /* THE TWO DECISIONS, AND THEY ARE SEPARATE BUTTONS ON PURPOSE.
     "They can see the app" and "they are in" are different calls, and a panel
     that makes them one control is a panel that eventually makes the second by
     accident. Only on a row that is up — the queue below is a list to read,
     not a list to act on, and a Let in beside forty-seven names is an invitation
     to press the wrong one. */
  if (w.up && !w.done) {
    const row = el("div", "acts");
    const inb = el("button", "in", "Let them in");
    inb.type = "button";
    inb.onclick = () => act(inb, "/api/waiting/admit", { id: w.id });
    const back = el("button", "back", "Back to the list");
    back.type = "button";
    back.onclick = () => act(back, "/api/waiting/up", { id: w.id, on: false });
    row.append(inb, back);
    box.append(row);
  }
  return box;
}

/** One press, one request, and the whole page redrawn from what the server
 *  says afterwards — a panel that patches its own copy is a panel that
 *  disagrees with the board about who is in. */
async function act(btn, path, body) {
  btn.disabled = true;
  const was = btn.textContent;
  btn.textContent = "…";
  try {
    const r = await fetch(path, {
      method: "POST",
      headers: { "Content-Type": "application/json", "x-admin-secret": keep.get() || "" },
      body: JSON.stringify(body),
    });
    if (!r.ok) throw new Error("no");
    await tryKey(keep.get(), false);
  } catch {
    btn.disabled = false;
    btn.textContent = was;
  }
}

function draw(waits) {
  const rooms = $("rooms");
  rooms.replaceChildren();

  const open = waits.filter((w) => !w.done);

  /* THE WAITING ROOM, FIRST AND ABOVE EVERYTHING.
   *
   * Three a day arrive here on their own — see liftSome in server.js — and
   * this is the list that exists to be acted on. They can read the app and
   * finish their page; nobody is in until somebody presses a button here.
   *
   * Above the queue because it is the shorter list and the only one with
   * anything to do in it. A panel where the work is below forty-seven names
   * is a panel where the work does not get done. */
  const up = open.filter((w) => w.up);
  if (up.length) {
    /* Longest in the room first: somebody moved up four days ago and still not
       decided on is the one this section exists to nag about. */
    up.sort((a, b) => String(a.upAt || "").localeCompare(String(b.upAt || "")));
    const head = el("div", "dhead uphead");
    head.append(el("span", null, "THE WAITING ROOM"));
    head.append(el("i"));
    head.append(el("b", null, up.length + " to decide"));
    rooms.append(head);
    rooms.append(el("p", "upsay",
      "They can see the app and finish their page. Nothing works for them yet. "
      + "Read what they wrote, then let them in or put them back."));
    for (const w of up) rooms.append(card(w));
    rooms.append(el("div", "gap"));
  }
  $("sub").textContent = open.length
    ? open.length + (open.length === 1 ? " person is waiting." : " people are waiting.")
    : "Nobody is waiting.";

  if (!waits.length) {
    rooms.append(el("p", "none",
      "Nobody has put their name down yet. Post a room link and look again."));
    return;
  }

  for (const key of ORDER) {
    /* Not the ones upstairs. They have their own section above and a row in
       two places is a row somebody acts on twice. */
    const some = waits.filter((w) => (w.room || "other") === key && !(w.up && !w.done));
    if (!some.length) continue;
    /* Waiting first inside each room, oldest first: the person who has been
       standing there longest is the one this page exists to remind you of. */
    some.sort((a, b) => (Number(Boolean(a.done)) - Number(Boolean(b.done)))
      || String(a.at).localeCompare(String(b.at)));
    const n = some.filter((w) => !w.done).length;
    const head = el("div", "dhead");
    head.append(el("span", null, LABEL[key]));
    head.append(el("i"));
    if (n) head.append(el("b", null, n + " waiting"));
    rooms.append(head);
    for (const w of some) rooms.append(card(w));
  }
}

async function tryKey(key, fromBox) {
  let d = null;
  try {
    const r = await fetch("/api/waiting", { headers: { "x-admin-secret": key } });
    if (r.ok) d = await r.json();
  } catch { /* offline: the key box is the honest thing to show */ }
  if (!d) {
    keep.drop();
    $("ask").hidden = false;
    $("out").hidden = true;
    if (fromBox) { $("no").hidden = false; $("no").textContent = "That key was not accepted."; }
    return;
  }
  keep.set(key);
  $("ask").hidden = true;
  $("out").hidden = false;
  draw(Array.isArray(d.waits) ? d.waits : []);
}

$("go").addEventListener("click", () => {
  const v = $("key").value.trim();
  $("no").hidden = true;
  if (v) tryKey(v, true);
});
$("key").addEventListener("keydown", (e) => { if (e.key === "Enter") $("go").click(); });
$("forget").addEventListener("click", () => {
  keep.drop();
  $("key").value = "";
  $("out").hidden = true;
  $("ask").hidden = false;
});

const had = keep.get();
if (had) tryKey(had, false);
else $("ask").hidden = false;
</script>
</body>
</html>
