<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- Empty on every deployment but the demo board, where it pins this
     browser to the one seeded identity. See BOARD_DEMO_DEVICE in server.js. -->
{{DEMO}}
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>While you wait · The Exchange</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="/favicon.png" sizes="192x192">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="stylesheet" href="/site.css">
<style>
  /* THE ROOM FOR SOMEBODY ON THE LIST.
   *
   * The queue used to end at one sentence — "You are on the list." — and that
   * sentence was the whole of the product for everybody who had not been
   * brought in yet, which on most days is most of the people who have ever
   * heard of this board. This is what that sentence opens onto.
   *
   * THE RULE THAT GOVERNS EVERY LINE OF IT: this is how members find you,
   * never this is how you qualify. Nothing here admits anybody, nothing is
   * scored against a pass mark, and the moment it reads as an exam the busy
   * people stop bothering — and the busy people are who the board is for.
   */
  body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);
       /* The tab bar is fixed to the bottom, so the last card needs room to
          finish above it rather than under it. */
       padding-bottom:4.6rem}
  main{max-width:30rem;margin:0 auto;padding:0 1rem 1.6rem}

  /* .top and .wrap are site.css's header and are reused deliberately — it is
     the same bar this board draws on every page. Only what differs is set
     here: it sticks, and it is as narrow as the column under it. */
  .top{position:sticky;top:0;z-index:5;background:var(--card);
       border-bottom:1px solid var(--hair)}
  .top .wrap{max-width:30rem;margin:0 auto;padding:.7rem 1rem;
             display:flex;align-items:center;gap:.6rem}
  .top .mark{width:1.75rem;height:1.75rem;border-radius:.45rem;
    background:var(--accent);color:var(--accent-ink);display:flex;
    align-items:center;justify-content:center;font-family:var(--serif);
    font-size:.95rem}
  .top b{font-size:.95rem;font-weight:500}
  .top .pill{margin-left:auto;padding:.15rem .6rem;border-radius:99px;
    background:var(--accent-soft);color:var(--accent);font-size:.72rem;
    font-weight:600}

  .wrband{margin:1rem 0 0;padding:.85rem .95rem;border-radius:.75rem;
    background:var(--accent-soft);font-size:.86rem;color:var(--ink-2);
    line-height:1.5}
  /* ---- THE ARRIVAL --------------------------------------------------------
   *
   * The page opened on "You are on the list." — true, and the middle of a
   * conversation nobody has had. Somebody who has just tapped a link out of a
   * WeChat group does not know where they are, and the first thing a room does
   * with a person who has walked in is use their name.
   *
   * So: their name, large, and nothing else in the frame. The same move the
   * invite makes — see CLAUDE.md on why that one is settled — and the reason
   * it is a hero rather than a line is that a welcome the size of body text is
   * not a welcome, it is a label.
   */
  /* ---- THE ARRIVAL, AND IT IS THE FIRST THING ANYBODY SEES OF THIS PLACE ---
   *
   * The rest of this board is a working tool and looks like one, correctly.
   * This one screen is not: it is the door of somewhere, opened for somebody
   * by name, and for most people it is the only impression they will ever
   * form of the place.
   *
   * A RED CHOP ON DARK PAPER. 印章 — the seal that makes a document real in
   * China, and the reason it beat the four other directions it was drawn
   * against: it is the only one that is about the thing this board actually
   * is. Not a lobby, not a stage door, not an opening title — all of those
   * are somebody's industry. A chop is what turns a piece of paper into an
   * agreement between two sides, which is the whole product, and every
   * Chinese member reads it before they read a word.
   *
   * It is also the only one of the six nobody else in this market can copy
   * without looking like they copied it.
   *
   * Drawn, not loaded: a first impression that arrives in pieces over a
   * mainland connection is worse than none. No image, no font, no request.
   */
  .hero{margin:.6rem 0 0;padding:2.6rem 1.2rem 2rem;border-radius:1.3rem;
    text-align:center;position:relative;overflow:hidden;background:#12100E;
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.06)}
  /* The paper it is stamped on: warm, and lit from where the stamp lands. */
  .hero .paper{position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(95% 72% at 50% 34%,#221D18 0%,#161310 52%,#100E0C 100%)}
  /* THE CHOP. Square, red, the character reversed out of it, and off true by
     four degrees — a chop pressed by a person is never square to the page,
     and that is most of what stops this looking like an app icon. The inner
     ring is the carved border every seal has. */
  .hero .seal{position:relative;display:inline-grid;place-items:center;
    width:4.6rem;height:4.6rem;margin:0 0 1.2rem;border-radius:.45rem;
    background:#B22A1F;color:#F7EDE6;font:400 2.15rem/1 var(--serif);
    font-style:normal;transform:rotate(-4deg);
    box-shadow:inset 0 0 0 3px rgba(247,237,230,.32),
               0 10px 30px rgba(178,42,31,.38)}
  /* The ink that has soaked past the edge. Two degrees the other way so the
     bleed does not sit square under the stamp. */
  .hero .bleed{position:absolute;left:50%;top:2.2rem;width:9rem;height:9rem;
    transform:translate(-50%,-50%);border-radius:50%;pointer-events:none;
    background:radial-gradient(circle,rgba(178,42,31,.26),transparent 62%)}
  .wrhi{position:relative;display:block;margin:0;font-family:var(--serif);
    font-weight:400;font-size:clamp(2.1rem,10.5vw,3rem);line-height:1.02;
    letter-spacing:-.015em;color:#EFE6DC;text-wrap:balance}
  .heroq{position:relative;margin:1.1rem 0 0;font-size:.78rem;font-weight:600;
    letter-spacing:.1em;text-transform:uppercase;color:#B08A6A}

  /* ---- THE CIRCLE ---------------------------------------------------------
   *
   * Ray's invite is a message somebody sent you. This is the same thing: one
   * round thing in the middle of the screen that you press, and then somebody
   * talks to you. Not a labelled button in a row of controls — those are
   * furniture, and nobody presses furniture.
   *
   * IT DOES BOTH AT ONCE. The words are on the screen the whole time, greyed,
   * and light up as they are spoken. So it works with the sound off, it works
   * for somebody whose phone is on silent in a meeting, and for everybody else
   * it is a person reading you in. The text is not a transcript that appears
   * afterwards — following the words while they are said is most of what makes
   * a second language readable at all.
   */
  .orbwrap{position:relative;margin:1.3rem 0 0;display:grid;place-items:center}
  /* Paper on ink, so the one thing to press is the one bright thing. */
  .orb{width:5.4rem;height:5.4rem;border-radius:50%;border:0;cursor:pointer;
    background:#F2E7DC;color:#12100E;display:grid;place-items:center;padding:0;
    box-shadow:0 12px 34px rgba(0,0,0,.5);transition:transform .12s ease-out}
  .orb:active{transform:scale(.96)}
  .orb svg{width:1.9rem;height:1.9rem;fill:currentColor;stroke:none;
    margin-left:.18rem}
  .orb[aria-pressed="true"] svg{margin-left:0}
  .orb:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
  /* The ring only exists while it is talking, so the circle at rest is one
     clean shape rather than a control with decoration around it. */
  .ring{position:absolute;width:5.4rem;height:5.4rem;border-radius:50%;
    border:2px solid rgba(178,42,31,.85);opacity:0;pointer-events:none}
  .orbwrap.on .ring{animation:ping 1.8s ease-out infinite}
  .orbwrap.on .ring.b{animation-delay:.9s}
  @keyframes ping{0%{transform:scale(1);opacity:.5}100%{transform:scale(1.5);opacity:0}}
  @media (prefers-reduced-motion:reduce){.orbwrap.on .ring{animation:none;opacity:.35}}
  .orbsay{position:relative;margin:.75rem 0 0;font-size:.78rem;color:#8A7663}

  /* The message. Greyed until spoken, then it is ink. */
  /* The beats, each one landing under the last. Nothing is on screen before
     the first press — the name and the circle are the whole of it at rest. */
  .beats{position:relative;margin:0}
  .beat{margin:1.1rem auto 0;max-width:21rem;font-family:var(--serif);
    font-size:1.06rem;line-height:1.62;color:#6A5A4B}
  .beat w{color:inherit;transition:color .14s ease-out}
  .beat w.lit{color:#EFE6DC}
  .heroshow{position:relative;margin:1.2rem 0 0;border:0;border-radius:99px;
    background:#F2E7DC;color:#12100E;font:inherit;font-size:.95rem;
    font-weight:600;padding:.6rem 1.5rem;cursor:pointer}
  /* The card coming up to meet them on the last press. */
  .pc.arrive{animation:cardin .5s cubic-bezier(.2,.7,.3,1)}
  @keyframes cardin{from{opacity:0;transform:translateY(-14px) scale(.97)}}
  @media (prefers-reduced-motion:reduce){.pc.arrive{animation:none}}
  .wrband b{display:block;color:var(--ink);font-size:.98rem;font-weight:500}
  /* THE WAITING ROOM, WHICH IS A DIFFERENT BAND FROM BEING ON THE LIST.
     Warmer than the blue one above it so that being moved up reads as having
     happened rather than as the same notice with new words in it. */
  .wrband.up{background:var(--goldbg,#F6EEDA);
    border:1px solid var(--goldline,#E5D4A8)}
  .wrband .clock{display:block;margin:.4rem 0 0;font-size:.8rem;font-weight:600;
    color:var(--gold,#8A6A1F)}
  .wrband .todo{margin:.5rem 0 0;padding:0;list-style:none;font-size:.84rem}
  .wrband .todo li{margin:.15rem 0;color:var(--ink-2)}
  .wrband .todo li.on{color:var(--good,#1F7A4D)}
  .wrband .todo i{font-style:normal;margin-right:.4rem}

  /* ---- THE BUTLER ---------------------------------------------------------
   *
   * A conversation, not a form, and drawn as one: their words on the right,
   * his on the left, the box at the bottom. Everybody has used this screen
   * before, which is the point — the person who most needs it is the one least
   * likely to work out a novel one.
   */
  .but{margin:1rem 0 0;border:1px solid var(--hair);border-radius:.9rem;
    background:var(--card);overflow:hidden}
  .buthead{display:flex;align-items:center;gap:.6rem;padding:.7rem .9rem;
    border-bottom:1px solid var(--hair)}
  /* HIS FACE. It was the board's own 交 mark, which is also the app icon and
     also the welcome above — so he read as the software talking rather than
     somebody talking. A cap and shoulders is legible before anybody reads a
     word, and a peaked cap is one of the few uniforms that means the same
     thing in Guangzhou and in Sydney. */
  .butface{flex:0 0 auto;width:2.1rem;height:2.1rem;border-radius:50%;
    background:var(--accent-soft);color:var(--accent);display:grid;
    place-items:center;font-style:normal}
  .butface svg{width:1.45rem;height:1.45rem}
  .buthead small{color:var(--muted);font-size:.76rem}
  .buthead b{font-size:.92rem;font-weight:600;color:var(--ink)}
  .butshut{margin:1rem 0 0;text-align:center}
  .butgone{margin:0 0 .5rem;font-size:.82rem;color:var(--muted)}
  /* ---- THE CARD THEY CAN POST --------------------------------------------
     One image, made on their own device, and the only thing somebody standing
     outside can do that helps them and helps the board at once. */
  .mine{margin:1rem 0 0;padding:.9rem;border:1px solid var(--hair);
    border-radius:.9rem;background:var(--card);text-align:center}
  .mine p{margin:0 0 .7rem;font-size:.86rem;line-height:1.5;color:var(--ink-2)}
  .mine .go{border:0;border-radius:99px;background:var(--ink);color:var(--paper);
    font:inherit;font-size:.9rem;padding:.55rem 1.2rem;cursor:pointer}
  .mine img{display:block;width:100%;max-width:19rem;margin:.9rem auto 0;
    border-radius:.7rem;box-shadow:0 10px 26px rgba(0,0,0,.3)}
  .mine .how{margin:.6rem 0 0;font-size:.78rem;color:var(--muted)}
  .mine .row2{display:flex;gap:.5rem;justify-content:center;margin:.7rem 0 0}
  .butoff{display:block;margin:.5rem auto 0;border:0;background:none;
    color:var(--muted);font:inherit;font-size:.78rem;padding:.25rem;
    cursor:pointer;text-decoration:underline;text-underline-offset:2px}
  .butshut button{border:1px solid var(--line);background:var(--card);
    border-radius:99px;padding:.45rem 1.1rem;font:inherit;font-size:.85rem;
    color:var(--ink-2)}
  .buthead small{color:var(--muted);font-size:.76rem}
  /* A word, not a ×. A cross reads as closing a panel that will be back
     tomorrow, and this one will not come back until they ask for it. */
  .buthead .x{margin-left:auto;border:0;background:none;color:var(--muted);
    font:inherit;font-size:.78rem;padding:.2rem .1rem;cursor:pointer;
    text-decoration:underline;text-underline-offset:2px}
  .butsay{padding:.8rem .9rem;display:flex;flex-direction:column;gap:.55rem;
    max-height:20rem;overflow-y:auto}
  .bub{max-width:85%;padding:.55rem .8rem;border-radius:1rem;font-size:.9rem;
    line-height:1.5}
  .bub.him{align-self:flex-start;background:var(--raise);color:var(--ink);
    border-bottom-left-radius:.3rem}
  .bub.her{align-self:flex-end;background:var(--accent);color:var(--accent-ink);
    border-bottom-right-radius:.3rem}
  .bub.wait{color:var(--muted)}
  .butform{display:flex;gap:.5rem;align-items:center;padding:.7rem .9rem;
    border-top:1px solid var(--hair)}
  .butform input{flex:1;min-width:0;border:1px solid var(--line);
    background:var(--raise);border-radius:99px;padding:.55rem .9rem;font:inherit;
    font-size:.92rem;color:var(--ink);outline:none}
  .butform button{flex:0 0 auto;border:0;border-radius:99px;
    background:var(--accent);color:var(--accent-ink);font:inherit;font-size:.88rem;
    padding:.55rem 1rem}
  .butform .mic{width:2.3rem;height:2.3rem;border-radius:50%;padding:0;
    border:1px solid var(--line);background:var(--raise);color:var(--ink-2);
    display:grid;place-items:center}
  .butform .mic svg{width:1.05rem;height:1.05rem;fill:none;stroke:currentColor;
    stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
  .butform .mic[aria-pressed="true"]{background:var(--bad,#B3261E);color:#fff;
    border-color:transparent;animation:micon 1.4s ease-in-out infinite}
  @keyframes micon{0%,100%{opacity:1}50%{opacity:.62}}
  @media (prefers-reduced-motion:reduce){.butform .mic[aria-pressed="true"]{animation:none}}
  /* WHAT HE IS PROPOSING, shown as the thing itself — the sentence as it will
     read on their card — and not as "me: agent, want: talent". They are
     agreeing to a sentence, so a sentence is what they are shown. */
  .butput{margin:0;padding:.8rem .9rem;border-top:1px solid var(--hair);
    background:var(--accent-soft)}
  .butput .line{font-family:var(--serif);font-size:1rem;color:var(--ink);
    line-height:1.4;margin:0 0 .3rem}
  .butput .why{margin:0 0 .7rem;font-size:.86rem;color:var(--ink-2);line-height:1.5}
  .butput .row2{display:flex;gap:.5rem}
  .butput .keep{border:0;border-radius:99px;background:var(--ink);color:var(--paper);
    font:inherit;font-size:.88rem;padding:.5rem 1.1rem}
  .butput .no{border:1px solid var(--line);border-radius:99px;background:none;
    color:var(--ink-2);font:inherit;font-size:.88rem;padding:.5rem 1rem}
  .butno{margin:.5rem .9rem .8rem;font-size:.82rem;color:var(--bad,#B3261E)}
  /* Before it is opened: one line and a button, so the panel is an offer
     rather than a conversation somebody has to close. */
  .butoffer{margin:1rem 0 0;padding:.8rem .9rem;border-radius:.9rem;
    border:1px solid var(--hair);background:var(--card);display:flex;
    align-items:center;gap:.7rem}
  .butoffer p{margin:0;flex:1;font-size:.86rem;line-height:1.45;color:var(--ink-2)}
  .butoffer p b{display:block;color:var(--ink);font-weight:600;font-size:.92rem}
  .butoffer button{flex:0 0 auto;border:0;border-radius:99px;background:var(--accent);
    color:var(--accent-ink);font:inherit;font-size:.88rem;padding:.5rem 1.1rem}

  /* THE HOME SCREEN, OFFERED ON THEIR OWN PAGE. install.js decides whether
     there is anything to offer — WeChat cannot install and says so instead;
     iOS gets the share-sheet instruction; Chrome gets a button. Same strip as
     Browse and Messages, because a sentence that differs between screens
     reads as two different apps. */
  .ins{display:flex;align-items:center;justify-content:center;gap:.5rem;
    margin:1rem 0 0;padding:.55rem .9rem;border-radius:.75rem;
    background:var(--accent-soft);color:var(--accent);font-size:.78rem;
    letter-spacing:.02em;text-align:left}
  .ins button{border:0;background:none;color:inherit;font:inherit;padding:0;
    flex:0 0 auto;cursor:pointer}
  .insgo{background:var(--accent);color:var(--accent-ink);border-radius:99px;
    padding:.2rem .8rem;font-size:.78rem}
  .insno{font-size:1.1rem;line-height:1;opacity:.7;padding:0 .2rem}
  .insico{width:1em;height:1em;vertical-align:-.2em;display:inline-block}

  /* LOSING THE PLACE — the one warning on this page that is about something
     that cannot be undone. Its own colour, its own box, and the field that
     fixes it inside it: a warning that says to go and open a form somewhere
     else is a warning that gets read and not acted on. */
  .lose{margin:1rem 0 0;padding:.9rem .95rem;border-radius:.75rem;
    background:var(--badbg,#FBEAE8);border:1px solid var(--badline,#F2C9C4)}
  .lose b{display:block;color:var(--ink);font-size:.95rem;font-weight:600;
    margin:0 0 .25rem}
  .lose p{margin:0 0 .6rem;font-size:.84rem;line-height:1.55;color:var(--ink-2)}
  .lose .go{display:flex;gap:.5rem}
  .lose input{flex:1;min-width:0;border:1px solid var(--line);background:var(--paper);
    border-radius:99px;padding:.55rem .9rem;font:inherit;font-size:.92rem;
    color:var(--ink);outline:none}
  .lose button{flex:0 0 auto;border:0;border-radius:99px;background:var(--ink);
    color:var(--paper);font:inherit;font-size:.9rem;padding:.55rem 1.1rem}
  .lose button[disabled]{opacity:.5}
  .lose .said{margin:.5rem 0 0;font-size:.82rem;color:var(--good,#1F7A4D)}
  .lose .no{margin:.5rem 0 0;font-size:.82rem;color:var(--bad,#B3261E)}
  @media (prefers-color-scheme:dark){
    .wrband.up{background:#2A2312;border-color:#453A1C}
    .lose{background:#2A1614;border-color:#4A2420}
  }
  .wrband .q{display:block;margin:.35rem 0 0;font-size:.8rem;color:var(--accent);
    font-weight:600}

  /* THEIR CARD, DRAWN AS A MEMBER WILL SEE IT and not as a form they filled
     in. The whole argument of this screen is that the card is the thing, so
     it is shown as the thing. */
  .pc{position:relative;margin:1rem 0 0;aspect-ratio:4/3;border-radius:1rem;
      overflow:hidden;background:linear-gradient(150deg,#C9D3E6,#93A5C4)}
  /* NO PHOTOGRAPH IS NOT A HOLE. A wash and an initial — the same object the
     result card draws — so a card without a face is still a card, and the
     photograph becomes one more slot that fills rather than the thing
     standing between somebody and being seen at all. */
  .pc .ini{position:absolute;inset:0;display:flex;align-items:center;
    justify-content:center;font-family:var(--serif);font-size:5rem;
    color:rgba(255,255,255,.34);line-height:1;padding-bottom:2.6rem}
  .pc .face{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
    display:block}
  .pc .scrim{position:absolute;inset:0;
    background:linear-gradient(180deg,rgba(10,14,22,0) 34%,rgba(10,14,22,.84) 100%)}
  .pc .flag{position:absolute;top:.7rem;left:.7rem;padding:.18rem .6rem;
    border-radius:99px;background:rgba(10,14,22,.5);color:#fff;font-size:.68rem;
    font-weight:600;backdrop-filter:blur(6px)}
  .pc .said{position:absolute;left:.9rem;right:.9rem;bottom:.85rem;color:#fff}
  .pc .nm{font-family:var(--serif);font-size:1.35rem;line-height:1.15}
  .pc .ln{margin:.25rem 0 0;font-size:.82rem;line-height:1.45;opacity:.94}
  /* The pills, under the picture rather than laid over the bottom of it.
     On the photograph they were white-on-whatever — dashed outlines over a
     face, unreadable on a bright patch — and a thing somebody is meant to
     act on should not read as a caption. */
  .pcwrap{margin:1rem 0 0}
  .pcwrap .pc{margin:0}
  .pcwrap .chips{margin:.55rem 0 0;display:flex;gap:.35rem;flex-wrap:wrap}
  .pcwrap .chips span{padding:.2rem .62rem;border-radius:99px;font-size:.75rem;
    background:var(--accent-soft);color:var(--accent);border:1px solid transparent}
  .pcwrap .chips span.ghost{background:none;color:var(--muted);
    border:1px dashed var(--line)}
  .under{margin:.5rem 0 0;font-size:.79rem;color:var(--muted);text-align:center}
  .under.bad{color:#b3261e}
  .under.wait{color:var(--accent)}
  /* The card is a button ONLY where it is the photograph control — the
     Waiting tab. The same card is drawn on the You tab above a form that has
     its own button, and a pointer cursor on something that does nothing is a
     promise the page does not keep. The chip is the only thing that says the
     card is tappable, so it sits on the corner a thumb reaches and never
     covers the name or the line. */
  .pc.tap{cursor:pointer}
  .pc.tap.busy{opacity:.65;pointer-events:none}
  .shotchip{position:absolute;top:.7rem;right:.7rem;padding:.22rem .65rem;
    border-radius:99px;background:rgba(255,255,255,.92);color:#151B28;
    font-size:.7rem;font-weight:600}
  .shotchip.wait{background:rgba(255,255,255,.72)}
  .shotchip.bad{background:#b3261e;color:#fff}

  /* THE ARROW AT THE PHOTO CHIP, and it only exists because of what happens
     one press earlier. The arrival ends on "a photo and one line", presses
     Show me, and drops the card into view — and the card is a pretty
     lavender rectangle with a small white pill in the corner. Somebody who
     has just been told what to do is looking straight at the thing to do it
     with and cannot see it. So: an arrowhead under the pill and the reason
     beside it, which is the half the pill has no room for.
     Inside .pc, which is overflow:hidden — anything hung outside the card
     gets cut off, and this is why it sits under the chip rather than beside
     it. pointer-events:none so it never eats the tap it is pointing at. */
  .shotpoint{position:absolute;top:2.5rem;right:.7rem;display:flex;
    flex-direction:column;align-items:flex-end;gap:.2rem;pointer-events:none;
    animation:pointin .4s .5s backwards}
  .shotpoint i{width:0;height:0;margin-right:2rem;
    border-left:.42rem solid transparent;border-right:.42rem solid transparent;
    border-bottom:.46rem solid var(--accent);
    animation:pointbob 1.7s 1.1s ease-in-out 3}
  .shotpoint span{background:var(--accent);color:var(--accent-ink);
    border-radius:.6rem;padding:.32rem .62rem;font-size:.74rem;font-weight:600;

  /* NOT .rule — site.css already owns that, and it is the bordered card the

    background-repeat:no-repeat;background-position:right .6rem center;

  /* The others, as a list and not a deck. Somebody waiting is not choosing

  .who{display:flex;align-items:center;gap:.75rem;margin:.6rem 0 0;

  .who .mid small{display:block;margin:.1rem 0 0;font-size:.82rem;
    color:var(--ink-2);line-height:1.4;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .who .tags{margin:.25rem 0 0;display:flex;gap:.3rem;flex-wrap:wrap}
  .who .tags span{padding:.1rem .45rem;border-radius:99px;background:var(--raise);
    color:var(--muted);font-size:.7rem}

  /* ---- the seat ---- */
  .seat{margin:.6rem 0 0;padding:1rem;background:var(--card);
    border:1px solid var(--hair);border-radius:.85rem}
  .seatn{display:flex;align-items:baseline;gap:.5rem}
  .seatn b{font-family:var(--serif);font-weight:400;font-size:2.4rem;line-height:1;

  .seatn span{font-size:.9rem;color:var(--ink-2)}
  .seatleft{margin:.5rem 0 0;font-size:.82rem;color:var(--muted)}
  /* The hundred as a hundred dots: filled, yours, and the ones still open. A
     number out of a hundred is a claim; this is the same fact as a picture,

  .dots{display:grid;grid-template-columns:repeat(20,1fr);gap:3px;margin:.75rem 0 0}
  .dots i{aspect-ratio:1;border-radius:50%;background:var(--line)}
  .dots i.on{background:var(--accent);opacity:.5}
  .dots i.you{background:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
  .ways{margin:.85rem 0 0;border-top:1px solid var(--hair)}
  .way{display:flex;align-items:baseline;gap:.7rem;padding:.55rem 0;

  .way .t small{display:block;margin:.1rem 0 0;font-size:.76rem;color:var(--muted);

  .way .v{flex:none;font-size:.8rem;font-weight:600;color:var(--accent)}

  /* The share, and the one act that moves it. The block used to lead with the

  .seatnow{margin:0;font-size:.78rem;text-transform:uppercase;letter-spacing:.08em;
    color:var(--muted)}
  .seatbig{margin:.15rem 0 0;font-size:2.4rem;line-height:1.05;letter-spacing:-.025em;
    font-weight:650}
  .seatpts{margin:.3rem 0 0;font-size:.86rem;color:var(--ink-2)}
  .seatwhat{margin:.9rem 0 0;border-top:1px solid var(--hair);padding-top:.85rem}

  .soonnote{margin:1.4rem 0 0;padding:.9rem 1rem;border-left:2px solid var(--accent);

  .wrshare .shareurl{margin:0;padding:.6rem .7rem;background:var(--raise);

  .seatsaid{margin:.5rem 0 0;font-size:.83rem;color:var(--muted);text-align:center}

  .seatfine{margin:.7rem 0 0;font-size:.75rem;color:var(--muted);line-height:1.5}

  /* NOT .post, NOT .band. site.css owns both: .post is the feed's own card,
     laid out as a flex row with an avatar column — which squeezed this card's
     byline into a stripe down its right-hand side — and .band is the tinted
     full-width strip the marketing page is built from. Both were caught by

  .wrpost{margin:.6rem 0 0;padding:.95rem 1.05rem;background:var(--card);

  .locked{display:flex;align-items:center;gap:.5rem;margin:1.5rem 0 0;

  /* ---- the You tab ---- */

  .wrshot{margin:1rem 0 0;padding:1rem;background:var(--card);
    border:1px solid var(--hair);border-radius:.8rem}

  .shotgo{display:block;width:100%;padding:.7rem;border:1px solid var(--accent);

  .form .rooms{display:flex;flex-wrap:wrap;gap:.4rem}
  .form .rm{padding:.45rem .8rem;border:1px solid var(--line);border-radius:99px;

    color:var(--accent-ink)}
  .form .save{margin:.9rem 0 0;width:100%;padding:.7rem;border:0;
    border-radius:99px;background:var(--accent);color:var(--accent-ink);
    font:inherit;font-weight:600;font-size:.95rem;cursor:pointer}
  .form .said{margin:.55rem 0 0;font-size:.85rem;color:var(--good, #2E7D5B)}

  /* ---- the two tabs ----
     There were three. The third was a feed, and the feed is behind the door:
     the tab would have been either a locked screen or the blurred shape they
     already scrolled past on the way in, on their first evening. It arrives
     the day somebody brings them in, and its arriving is part of what that
     feels like. */
  .tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;
    background:var(--card);border-top:1px solid var(--hair);
    padding-bottom:env(safe-area-inset-bottom)}
  .tabs button{flex:1;padding:.9rem 0;border:0;background:none;font:inherit;
    font-size:.9rem;font-weight:600;color:var(--muted);cursor:pointer}
  .tabs button.on{color:var(--accent)}

  .quietlink{display:inline-block;margin:1rem 0 0;color:var(--accent);
    font-size:.9rem}

  /* ---- MO, FLOATING ------------------------------------------------------
     He was a panel in the page, between the two things that can be lost and
     the card. That is a doorman standing in the corridor: always there,
     always in the way, and scrolled past before he is needed. The waiting
     room is the screen this board asks the most of somebody, so everything
     on it that is not the two things is noise.
     So he stands in the corner of the screen instead and is dragged wherever
     they want him. Fixed, so he keeps up with the scroll; moveable, because
     a thing fixed over the one control somebody is reaching for is worse
     than no help at all — and on a 430pt screen there is always something
     under him. */
  .modock{position:fixed;z-index:6;width:3.1rem;height:3.1rem;border-radius:50%;
    border:0;background:var(--accent);color:var(--accent-ink);padding:0;
    display:flex;align-items:center;justify-content:center;cursor:grab;
    box-shadow:0 5px 18px rgba(10,14,24,.38);
    /* Pointer events do the dragging, so the browser must not also be
       scrolling the page under the finger. */
    touch-action:none;animation:dockin .35s .2s backwards}
  .modock svg{width:1.85rem;height:1.85rem;pointer-events:none}
  .modock.drag{cursor:grabbing;box-shadow:0 10px 26px rgba(10,14,24,.5);
    transform:scale(1.07)}
  @keyframes dockin{from{opacity:0;transform:scale(.5)}}

  /* HE OPENS UPWARDS FROM THE BOTTOM, not out of wherever he was parked. A
     panel hung off a draggable button lands half off-screen the moment
     somebody has parked it in a corner, and a conversation is a thing you
     read from the bottom anyway. */
  .moveil{position:fixed;inset:0;z-index:6;border:0;padding:0;
    background:rgba(8,11,18,.45);animation:veilin .25s}
  /* CLEAR OF THE TAB BAR, which is fixed at the bottom and stays there under
     the veil. Flush to the bottom edge put the kill switch straight across
     "Waiting" and "You" — two sets of words in the same place, one of them
     dimmed, and the eye cannot tell which layer it is reading. ~3.4rem of
     tabs plus a gap. */
  .mosheet{position:fixed;z-index:7;left:0;right:0;bottom:0;
    padding:0 .7rem calc(4.2rem + env(safe-area-inset-bottom));
    animation:sheetin .3s cubic-bezier(.2,.7,.3,1)}
  .mosheet .but{margin:0}
  .mosheet .butsay{max-height:46vh}
  /* The kill switch sits below the white panel, which on the sheet means it
     sits on the veil — grey-on-grey, over the dimmed tab bar showing through.
     It is the one control on this panel that has to stay legible to somebody
     who came looking for it. */
  .mosheet .butoff{margin:.75rem auto 0;color:rgba(255,255,255,.82)}
  @keyframes veilin{from{opacity:0}}
  @keyframes sheetin{from{transform:translateY(105%)}}
  @media (prefers-reduced-motion:reduce){
    .modock{animation:none}
    .mosheet{animation:none}
    .moveil{animation:none}
  }
</style>

<div class="top">

    <b id="brandname">The Exchange</b>
    <span id="langslot" style="margin-left:auto"></span>
    <span class="pill" id="statepill" hidden></span>
  </div>
