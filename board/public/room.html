<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- Empty on every deployment but the demo board, where it pins this
     browser to the one seeded identity. See BOARD_DEMO_DEVICE in server.js. -->
{{DEMO}}
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>While you wait · The Exchange</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="/favicon.png" sizes="192x192">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="stylesheet" href="/site.css">
<style>/* THE ROOM FOR SOMEBODY ON THE LIST.
   *
   * The queue used to end at one sentence — "You are on the list." — and that
   * sentence was the whole of the product for everybody who had not been
   * brought in yet, which on most days is most of the people who have ever
   * heard of this board. This is what that sentence opens onto.
   *
   * THE RULE THAT GOVERNS EVERY LINE OF IT: this is how members find you,
   * never this is how you qualify. Nothing here admits anybody, nothing is
   * scored against a pass mark, and the moment it reads as an exam the busy
   * people stop bothering — and the busy people are who the board is for.
   */
  
  body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);
       /* The tab bar is fixed to the bottom, so the last card needs room to
          finish above it rather than under it. */
       padding-bottom:4.6rem}
  main{max-width:30rem;margin:0 auto;padding:0 1rem 1.6rem}/* .top and .wrap are site.css's header and are reused deliberately — it is
     the same bar this board draws on every page. Only what differs is set
     here: it sticks, and it is as narrow as the column under it. */

  
  .top{position:sticky;top:0;z-index:5;background:var(--card);
       border-bottom:1px solid var(--hair)}
  .top .wrap{max-width:30rem;margin:0 auto;padding:.7rem 1rem;
             display:flex;align-items:center;gap:.6rem}
  .top .mark{width:1.75rem;height:1.75rem;border-radius:.45rem;
    background:var(--accent);color:var(--accent-ink);display:flex;
    align-items:center;justify-content:center;font-family:var(--serif);
    font-size:.95rem}
  .top b{font-size:.95rem;font-weight:500}
  .top .pill{margin-left:auto;padding:.15rem .6rem;border-radius:99px;
    background:var(--accent-soft);color:var(--accent);font-size:.72rem;
    font-weight:600}

  .wrband{margin:1rem 0 0;padding:.85rem .95rem;border-radius:.75rem;
    background:var(--accent-soft);font-size:.86rem;color:var(--ink-2);
    line-height:1.5}/* THE COUNT, AT A SIZE SOMEBODY READS FROM ARM'S LENGTH. It was body text
     over a tick list, which on a screen with a clock running is a status
     panel — glanced at, not acted on. */
  
  .wrband b.big{display:block;font-size:1.35rem;line-height:1.2;
    color:var(--ink);font-weight:600;margin:0 0 .1rem}/* AND THE THING THAT CLEARS IT, AS A BUTTON. Full width, because the whole
     point is that it cannot be mistaken for a label — an empty circle beside
     the words "A photo" is a status, and this is an instruction. */
  
  .wrgo{display:block;width:100%;margin:.7rem 0 0;border:0;border-radius:.7rem;
    background:var(--ink);color:var(--paper);font:inherit;font-size:1rem;
    font-weight:600;padding:.8rem 1rem;cursor:pointer}
  .wrgo + .wrgo{margin-top:.5rem}
  .wrgo:active{transform:translateY(1px)}/* ---- THEIR NAME AND THEIR PLACE ----------------------------------------
   *
   * This was a title page: 2.6rem of padding, a red chop on dark paper, the
   * name at 3rem, and the position under it in a small uppercase eyebrow.
   * See the note in the script where the arrival used to be built — it
   * belonged to a screen that was the first thing anybody saw, and this is
   * not that screen any more.
   *
   * One line now, and it is still the largest thing on the page, because it
   * is the only reason somebody opens this tab. Serif, ink on paper, no
   * frame: the page it sits on is the same working tool as the rest of the
   * board, which is what this screen honestly is.
   */
  
  .wrhi{margin:1rem 0 0;font-family:var(--serif);font-weight:400;
    font-size:clamp(1.5rem,6.5vw,1.95rem);line-height:1.2;
    letter-spacing:-.01em;color:var(--ink);text-wrap:balance}
    .wrband b{display:block;color:var(--ink);font-size:.98rem;font-weight:500}/* THE WAITING ROOM, WHICH IS A DIFFERENT BAND FROM BEING ON THE LIST.
     Warmer than the blue one above it so that being moved up reads as having
     happened rather than as the same notice with new words in it. */
  
  .wrband.up{background:var(--goldbg,#F6EEDA);
    border:1px solid var(--goldline,#E5D4A8)}
  .wrband .clock{display:block;margin:.4rem 0 0;font-size:.8rem;font-weight:600;
    color:var(--gold,#8A6A1F)}/* ---- THE CARD THEY CAN POST --------------------------------------------
     One image, made on their own device, and the only thing somebody standing
     outside can do that helps them and helps the board at once. */
  
  .mine{margin:1rem 0 0;padding:.9rem;border:1px solid var(--hair);
    border-radius:.9rem;background:var(--card);text-align:center}
  .mine p{margin:0 0 .7rem;font-size:.86rem;line-height:1.5;color:var(--ink-2)}
  .mine .go{border:0;border-radius:99px;background:var(--ink);color:var(--paper);
    font:inherit;font-size:.9rem;padding:.55rem 1.2rem;cursor:pointer}
  .mine img{display:block;width:100%;max-width:19rem;margin:.9rem auto 0;
    border-radius:.7rem;box-shadow:0 10px 26px rgba(0,0,0,.3)}
  .mine .how{margin:.6rem 0 0;font-size:.78rem;color:var(--muted)}
  .mine .row2{display:flex;gap:.5rem;justify-content:center;margin:.7rem 0 0}
  @keyframes micon{0%,100%{opacity:1}50%{opacity:.62}}
  @media (prefers-reduced-motion:reduce){.butform .mic[aria-pressed="true"]{animation:none}}/* THE HOME SCREEN, OFFERED ON THEIR OWN PAGE. install.js decides whether
     there is anything to offer — WeChat cannot install and says so instead;
     iOS gets the share-sheet instruction; Chrome gets a button. Same strip as
     Browse and Messages, because a sentence that differs between screens
     reads as two different apps. */

  
  .ins{display:flex;align-items:center;justify-content:center;gap:.5rem;
    margin:1rem 0 0;padding:.55rem .9rem;border-radius:.75rem;
    background:var(--accent-soft);color:var(--accent);font-size:.78rem;
    letter-spacing:.02em;text-align:left}
  .ins button{border:0;background:none;color:inherit;font:inherit;padding:0;
    flex:0 0 auto;cursor:pointer}
  .insgo{background:var(--accent);color:var(--accent-ink);border-radius:99px;
    padding:.2rem .8rem;font-size:.78rem}
  .insno{font-size:1.1rem;line-height:1;opacity:.7;padding:0 .2rem}
  .insico{width:1em;height:1em;vertical-align:-.2em;display:inline-block}/* LOSING THE PLACE — the one warning on this page that is about something
     that cannot be undone. Its own colour, its own box, and the field that
     fixes it inside it: a warning that says to go and open a form somewhere
     else is a warning that gets read and not acted on. */

  
  .lose{margin:1rem 0 0;padding:.9rem .95rem;border-radius:.75rem;
    background:var(--badbg,#FBEAE8);border:1px solid var(--badline,#F2C9C4)}
  .lose b{display:block;color:var(--ink);font-size:.95rem;font-weight:600;
    margin:0 0 .25rem}
  .lose p{margin:0 0 .6rem;font-size:.84rem;line-height:1.55;color:var(--ink-2)}
  .lose .go{display:flex;gap:.5rem}
  .lose input{flex:1;min-width:0;border:1px solid var(--line);background:var(--paper);
    border-radius:99px;padding:.55rem .9rem;font:inherit;font-size:.92rem;
    color:var(--ink);outline:none}
  .lose button{flex:0 0 auto;border:0;border-radius:99px;background:var(--ink);
    color:var(--paper);font:inherit;font-size:.9rem;padding:.55rem 1.1rem}
  .lose button[disabled]{opacity:.5}
  .lose .said{margin:.5rem 0 0;font-size:.82rem;color:var(--good,#1F7A4D)}
  .lose .no{margin:.5rem 0 0;font-size:.82rem;color:var(--bad,#B3261E)}
  @media (prefers-color-scheme:dark){
    .wrband.up{background:#2A2312;border-color:#453A1C}
    .lose{background:#2A1614;border-color:#4A2420}
  }
  .wrband .q{display:block;margin:.35rem 0 0;font-size:.8rem;color:var(--accent);
    font-weight:600}/* THEIR CARD, DRAWN AS A MEMBER WILL SEE IT and not as a form they filled
     in. The whole argument of this screen is that the card is the thing, so
     it is shown as the thing. */

  
  .pc{position:relative;margin:1rem 0 0;aspect-ratio:4/3;border-radius:1rem;
      overflow:hidden;background:linear-gradient(150deg,#C9D3E6,#93A5C4)}/* NO PHOTOGRAPH IS NOT A HOLE. A wash and an initial — the same object the
     result card draws — so a card without a face is still a card, and the
     photograph becomes one more slot that fills rather than the thing
     standing between somebody and being seen at all. */
  
  .pc .ini{position:absolute;inset:0;display:flex;align-items:center;
    justify-content:center;font-family:var(--serif);font-size:5rem;
    color:rgba(255,255,255,.34);line-height:1;padding-bottom:2.6rem}
  .pc .face{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
    display:block}
  .pc .scrim{position:absolute;inset:0;
    background:linear-gradient(180deg,rgba(10,14,22,0) 34%,rgba(10,14,22,.84) 100%)}
  .pc .flag{position:absolute;top:.7rem;left:.7rem;padding:.18rem .6rem;
    border-radius:99px;background:rgba(10,14,22,.5);color:#fff;font-size:.68rem;
    font-weight:600;backdrop-filter:blur(6px)}
  .pc .said{position:absolute;left:.9rem;right:.9rem;bottom:.85rem;color:#fff}
  .pc .nm{font-family:var(--serif);font-size:1.35rem;line-height:1.15}
  .pc .ln{margin:.25rem 0 0;font-size:.82rem;line-height:1.45;opacity:.94}/* The pills, under the picture rather than laid over the bottom of it.
     On the photograph they were white-on-whatever — dashed outlines over a
     face, unreadable on a bright patch — and a thing somebody is meant to
     act on should not read as a caption. */
  
  .pcwrap{margin:1rem 0 0}
  .pcwrap .pc{margin:0}
  .pcwrap .chips{margin:.55rem 0 0;display:flex;gap:.35rem;flex-wrap:wrap}
  .pcwrap .chips span{padding:.2rem .62rem;border-radius:99px;font-size:.75rem;
    background:var(--accent-soft);color:var(--accent);border:1px solid transparent}
  .pcwrap .chips span.ghost{background:none;color:var(--muted);
    border:1px dashed var(--line)}
  .under{margin:.5rem 0 0;font-size:.79rem;color:var(--muted);text-align:center}
  .under.bad{color:#b3261e}
  .under.wait{color:var(--accent)}/* The card is a button ONLY where it is the photograph control — the
     Waiting tab. The same card is drawn on the You tab above a form that has
     its own button, and a pointer cursor on something that does nothing is a
     promise the page does not keep. The chip is the only thing that says the
     card is tappable, so it sits on the corner a thumb reaches and never
     covers the name or the line. */
  
  .pc.tap{cursor:pointer}
  .pc.tap.busy{opacity:.65;pointer-events:none}
  .shotchip{position:absolute;top:.7rem;right:.7rem;padding:.22rem .65rem;
    border-radius:99px;background:rgba(255,255,255,.92);color:#151B28;
    font-size:.7rem;font-weight:600}
  .shotchip.wait{background:rgba(255,255,255,.72)}
  .shotchip.bad{background:#b3261e;color:#fff}/* THE ARROW AT THE PHOTO CHIP, and it only exists because of what happens
     one press earlier. The arrival ends on "a photo and one line", presses
     Show me, and drops the card into view — and the card is a pretty
     lavender rectangle with a small white pill in the corner. Somebody who
     has just been told what to do is looking straight at the thing to do it
     with and cannot see it. So: an arrowhead under the pill and the reason
     beside it, which is the half the pill has no room for.
     Inside .pc, which is overflow:hidden — anything hung outside the card
     gets cut off, and this is why it sits under the chip rather than beside
     it. pointer-events:none so it never eats the tap it is pointing at. */

  
  .shotpoint{position:absolute;top:2.5rem;right:.7rem;display:flex;
    flex-direction:column;align-items:flex-end;gap:.2rem;pointer-events:none;
    animation:pointin .4s .5s backwards}
  .shotpoint i{width:0;height:0;margin-right:2rem;
    border-left:.42rem solid transparent;border-right:.42rem solid transparent;
    border-bottom:.46rem solid var(--accent);
    animation:pointbob 1.7s 1.1s ease-in-out 3}
  .shotpoint span{background:var(--accent);color:var(--accent-ink);
    border-radius:.6rem;padding:.32rem .62rem;font-size:.74rem;font-weight:600;
    line-height:1.25;max-width:11rem;text-align:right;
    box-shadow:0 3px 12px rgba(10,14,24,.3)}
  @keyframes pointin{from{opacity:0;transform:translateY(-7px)}}
  @keyframes pointbob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
  @media (prefers-reduced-motion:reduce){
    .shotpoint{animation:none}
    .shotpoint i{animation:none}
  }/* NOT .rule — site.css already owns that, and it is the bordered card the
     house-rules page is made of. Checked against the stylesheet before this
     was written rather than after, which is the lesson from doors.html. */

  
  .wrhead{display:flex;align-items:center;gap:.7rem;margin:1.5rem 0 .1rem;
    font-size:.64rem;letter-spacing:.15em;text-transform:uppercase;
    color:var(--muted)}
  .wrhead i{flex:1;height:1px;background:var(--hair)}
  .wrwhy{margin:.45rem 0 0;font-size:.82rem;color:var(--ink-2);line-height:1.5}

  .row{display:flex;align-items:center;gap:.8rem;margin:.6rem 0 0;
    padding:.85rem .95rem;background:var(--card);border:1px solid var(--hair);
    border-radius:.75rem}
  .row .n{flex:none;width:1.6rem;height:1.6rem;border-radius:99px;
    border:1px solid var(--hair);display:flex;align-items:center;
    justify-content:center;font-size:.78rem;color:var(--muted)}
  .row.ok .n{border-color:transparent;background:var(--good, #2E7D5B);color:#fff}
  .row .mid{flex:1;min-width:0}
  .row .mid b{display:block;font-size:.94rem;font-weight:500}
  .row .mid small{display:block;margin:.1rem 0 0;font-size:.8rem;
    color:var(--muted);line-height:1.4}
  .row .go{flex:none;padding:.4rem .85rem;border:1px solid var(--accent);
    border-radius:99px;background:none;color:var(--accent);font:inherit;
    font-size:.82rem;font-weight:600;cursor:pointer;text-decoration:none}
  .row.ok .go{border-color:var(--hair);color:var(--muted)}
  .row .got{flex:none;font-size:.85rem;font-weight:600;
    color:var(--good, #2E7D5B)}/* The third one answers here rather than on a page of its own: it is two
     choices, and sending somebody to another screen and back for two choices
     is most of the reason people abandon a form. */

  
  .pick{margin:.6rem 0 0;padding:.95rem;background:var(--card);
    border:1px solid var(--hair);border-radius:.75rem}
  .pick .row.bare{margin:0 0 .85rem;padding:0;background:none;border:0}
  .pick .two{display:grid;grid-template-columns:auto minmax(0,1fr);
    gap:.6rem;align-items:center}
  .pick .w{font-size:.9rem;color:var(--ink-2)}
  .pick select{font:inherit;font-size:.95rem;font-weight:500;width:100%;
    color:var(--accent-ink);background-color:var(--accent);border:0;
    border-radius:99px;padding:.5rem 1.8rem .5rem 1rem;
    -webkit-appearance:none;appearance:none;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='white' stroke-width='2.4'><path d='M6 9l6 6 6-6'/></svg>");
    background-repeat:no-repeat;background-position:right .6rem center;
    background-size:.9rem}
  .pick .save{margin:.75rem 0 0;width:100%;padding:.6rem;border:0;
    border-radius:99px;background:var(--accent);color:var(--accent-ink);
    font:inherit;font-weight:600;font-size:.9rem;cursor:pointer}
  .pick .said{margin:.5rem 0 0;font-size:.83rem;color:var(--good, #2E7D5B)}/* ---- the seat ---- */

  
  .seat{margin:.6rem 0 0;padding:1rem;background:var(--card);
    border:1px solid var(--hair);border-radius:.85rem}
  .seatn{display:flex;align-items:baseline;gap:.5rem}
  .seatn b{font-family:var(--serif);font-weight:400;font-size:2.4rem;line-height:1;
    color:var(--accent);font-variant-numeric:tabular-nums}
  .seatn span{font-size:.9rem;color:var(--ink-2)}
  .seatleft{margin:.5rem 0 0;font-size:.82rem;color:var(--muted)}/* The hundred as a hundred dots: filled, yours, and the ones still open. A
     number out of a hundred is a claim; this is the same fact as a picture,
     and it needs no translating. */
  
  .dots{display:grid;grid-template-columns:repeat(20,1fr);gap:3px;margin:.75rem 0 0}
  .dots i{aspect-ratio:1;border-radius:50%;background:var(--line)}
  .dots i.on{background:var(--accent);opacity:.5}
  .dots i.you{background:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
  .ways{margin:.85rem 0 0;border-top:1px solid var(--hair)}
  .way{display:flex;align-items:baseline;gap:.7rem;padding:.55rem 0;
    border-bottom:1px solid var(--hair);font-size:.88rem}
  .way:last-child{border-bottom:0}
  .way .t{flex:1}
  .way .t small{display:block;margin:.1rem 0 0;font-size:.76rem;color:var(--muted);
    line-height:1.4}
  .way .v{flex:none;font-size:.8rem;font-weight:600;color:var(--accent)}
  .way .v.grey{color:var(--muted);font-weight:500}/* The share, and the one act that moves it. The block used to lead with the
     seat number — 41 points at seat 24, the smallest number on the screen in
     the largest type. It leads with what somebody actually gets now. */
  
  .seatnow{margin:0;font-size:.78rem;text-transform:uppercase;letter-spacing:.08em;
    color:var(--muted)}
  .seatbig{margin:.15rem 0 0;font-size:2.4rem;line-height:1.05;letter-spacing:-.025em;
    font-weight:650}
  .seatpts{margin:.3rem 0 0;font-size:.86rem;color:var(--ink-2)}
  .seatwhat{margin:.9rem 0 0;border-top:1px solid var(--hair);padding-top:.85rem}
  .seatwhat summary{cursor:pointer;color:var(--accent);font-size:.88rem;list-style:none}
  .seatwhat summary::-webkit-details-marker{display:none}
  .seatwhat summary::before{content:"›";display:inline-block;margin-right:.4rem}
  .seatwhat[open] summary::before{transform:rotate(90deg)}
  .seatwhat p{margin:.6rem 0 0;font-size:.86rem;color:var(--ink-2)}
  .seatlift{margin:1rem 0 0;background:var(--accent-soft);border:1px solid var(--line);
    border-radius:12px;padding:.95rem}
  .seatlift .lab{margin:0 0 .4rem;font-size:.78rem;text-transform:uppercase;
    letter-spacing:.08em;color:var(--accent)}
  .seatlad{display:flex;align-items:baseline;gap:.5rem;margin:0;flex-wrap:wrap}
  .seatlad .from{font-size:1rem;color:var(--muted);text-decoration:line-through}
  .seatlad .to{font-size:1.7rem;font-weight:650;letter-spacing:-.02em}
  .seatlift .x{margin:.45rem 0 0;font-size:.84rem;color:var(--ink-2)}
  .seatgate{margin:.55rem 0 0;font-size:.79rem;line-height:1.5;color:var(--muted)}
  .seatrest{margin:1.05rem 0 0;padding-top:.85rem;border-top:1px solid var(--hair)}
  .seatrest .h{margin:0 0 .5rem;font-size:.76rem;text-transform:uppercase;
    letter-spacing:.08em;color:var(--muted)}
  .seatex{margin:.8rem 0 0;font-size:.75rem;line-height:1.55;color:var(--muted)}/* What the way back is in, said above the box that changes it. */
  
  .backsay{margin:.15rem 0 .5rem;font-size:.82rem;line-height:1.5}
  .backsay.ok{color:var(--muted)}
  .backsay.warn{color:var(--accent)}
  .soonnote{margin:1.4rem 0 0;padding:.9rem 1rem;border-left:2px solid var(--accent);
    background:var(--raise);border-radius:0 8px 8px 0;font-size:.88rem;color:var(--ink-2)}/* Sharing, as its own panel rather than a line inside something else. */
  
  .wrshare{margin:1.4rem 0 0;background:var(--card);border:1px solid var(--line);
    border-radius:14px;padding:1.1rem}
  .wrshare .sharewhy{margin:0 0 .85rem;font-size:.88rem;color:var(--ink-2)}
  .wrshare .sharego{width:100%;border:0;border-radius:99px;background:var(--accent);
    color:var(--accent-ink);padding:.85rem;font-size:1rem;font-weight:600;
    font-family:inherit;cursor:pointer;display:flex;align-items:center;
    justify-content:center;gap:.5rem}
  .wrshare .sharego svg{width:1.1rem;height:1.1rem;fill:none;stroke:currentColor;
    stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .wrshare .hold{margin:.9rem 0 .35rem;font-size:.78rem;color:var(--muted)}/* The address itself, readable and selectable. WeChat's browser often has
     neither a share sheet nor a clipboard, and then this is the whole way. */
  
  .wrshare .shareurl{margin:0;padding:.6rem .7rem;background:var(--raise);
    border:1px solid var(--hair);border-radius:8px;font-size:.8rem;
    color:var(--ink-2);word-break:break-all;user-select:all;-webkit-user-select:all}
  .wrshare .said{margin:.6rem 0 0;font-size:.82rem;color:var(--accent);min-height:1.1em}
  .seatgo{display:block;width:100%;margin:.85rem 0 0;padding:.65rem;border:0;
    border-radius:99px;background:var(--accent);color:var(--accent-ink);
    font:inherit;font-weight:600;font-size:.9rem;cursor:pointer}
  .seatsaid{margin:.5rem 0 0;font-size:.83rem;color:var(--muted);text-align:center}
  .seatsaid.on{color:var(--good, #2E7D5B)}
  .seatfine{margin:.7rem 0 0;font-size:.75rem;color:var(--muted);line-height:1.5}/* NOT .post, NOT .band. site.css owns both: .post is the feed's own card,
     laid out as a flex row with an avatar column — which squeezed this card's
     byline into a stripe down its right-hand side — and .band is the tinted
     full-width strip the marketing page is built from. Both were caught by
     comparing every class in this file against the stylesheet, which is the
     check that should have run before the file was written. */

  
  .wrpost{margin:.6rem 0 0;padding:.95rem 1.05rem;background:var(--card);
    border:1px solid var(--hair);border-radius:.75rem}
  .wrpost p{margin:0;font-size:.93rem;line-height:1.55}
  .wrpost .by{margin:.5rem 0 0;font-size:.8rem;color:var(--muted)}

  .locked{display:flex;align-items:center;gap:.5rem;margin:1.5rem 0 0;
    padding:.85rem .95rem;border:1px dashed var(--hair);border-radius:.75rem;
    font-size:.85rem;color:var(--muted)}
  .locked svg{flex:none;width:.95rem;height:.95rem;stroke:currentColor;
    fill:none;stroke-width:2}

  .none{margin:.6rem 0 0;padding:.95rem 1.05rem;background:var(--card);
    border:1px solid var(--hair);border-radius:.75rem;font-size:.88rem;
    color:var(--ink-2);line-height:1.5}/* ---- the You tab ---- *//* NOT .shot — site.css owns that too, as a centred flex column for the
     phone mock-ups on the marketing page. It was quietly making this box
     centre its contents, which is why the photo button rendered as a narrow
     pill instead of the full-width button it is written as. */

  
  
  .form{margin:1rem 0 0;padding:1rem;background:var(--card);
    border:1px solid var(--hair);border-radius:.8rem}
  .form label{display:block;margin:.75rem 0 .25rem;font-size:.82rem;
    color:var(--ink-2)}
  .form label:first-of-type{margin-top:0}
  .form input,.form textarea{width:100%;padding:.7rem .85rem;font:inherit;
    font-size:1rem;border:1px solid var(--hair);border-radius:.6rem;
    background:var(--raise);color:var(--ink);resize:vertical}
  .form .rooms{display:flex;flex-wrap:wrap;gap:.4rem}
  .form .rm{padding:.45rem .8rem;border:1px solid var(--line);border-radius:99px;
    background:none;color:var(--ink-2);font:inherit;font-size:.86rem;
    cursor:pointer}
  .form .rm.on{background:var(--accent);border-color:var(--accent);
    color:var(--accent-ink)}
  .form .save{margin:.9rem 0 0;width:100%;padding:.7rem;border:0;
    border-radius:99px;background:var(--accent);color:var(--accent-ink);
    font:inherit;font-weight:600;font-size:.95rem;cursor:pointer}
  .form .said{margin:.55rem 0 0;font-size:.85rem;color:var(--good, #2E7D5B)}
  .form .no{margin:.55rem 0 0;font-size:.85rem;color:#b3261e}/* ---- the two tabs ----
     There were three. The third was a feed, and the feed is behind the door:
     the tab would have been either a locked screen or the blurred shape they
     already scrolled past on the way in, on their first evening. It arrives
     the day somebody brings them in, and its arriving is part of what that
     feels like. */

  
  .tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;
    background:var(--card);border-top:1px solid var(--hair);
    padding-bottom:env(safe-area-inset-bottom)}
/* FOUR, AND TWO OF THEM LEAVE THE PAGE. Room and Inside are anchors — the
     conversation they came from, and the people the whole thing is for. They
     are the same four in the same order as the bar on door.html, because a
     bar that changes under somebody as they move between two screens of the
     same app is a bar nobody learns. */
  
  .tabs button,.tabs a{flex:1;padding:.9rem 0;border:0;background:none;
    font:inherit;font-size:.9rem;font-weight:600;color:var(--muted);
    cursor:pointer;text-align:center;text-decoration:none}
  .tabs button.on,.tabs a.on{color:var(--accent)}

  .quietlink{display:inline-block;margin:1rem 0 0;color:var(--accent);
    font-size:.9rem}
  @keyframes dockin{from{opacity:0;transform:scale(.5)}}
  @keyframes pointnudge{0%,100%{transform:translateX(0)}50%{transform:translateX(3px)}}
  @keyframes pointnudgeL{0%,100%{transform:translateX(0)}50%{transform:translateX(-3px)}}/* Both transforms, or the centring is dropped for the length of the
     animation and the sheet slides up from the right. */
  
  @keyframes sheetin{from{transform:translateX(-50%) translateY(105%)}
    to{transform:translateX(-50%) translateY(0)}}
  /* THE ROOMS UNDER THE DOOR. A list, not a tab, because there is more than
     one of them now — see drawWait. */
  .wrrooms{margin:1.2rem 0 0;display:grid;gap:.4rem}
  .wrroomsk{margin:0 0 .1rem;font-size:.66rem;letter-spacing:.12em;
    text-transform:uppercase;color:var(--muted);font-weight:700}
  :root[data-lang="zh"] .wrroomsk{letter-spacing:0;text-transform:none;font-size:.76rem}
  .wrroom{display:flex;align-items:baseline;gap:.55rem;text-decoration:none;
    color:inherit;background:var(--card);border:1px solid var(--line);
    border-radius:.7rem;padding:.7rem .8rem}
  .wrroom b{font-size:.95rem;font-weight:700}
  .wrroom span{font-size:.78rem;color:var(--muted)}
</style>
</head>
<body>

<div class="top">
  <div class="wrap">
    <span class="mark"><svg viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="7" style="width:1em;height:1em;display:block" aria-hidden="true"><circle cx="38" cy="50" r="24"/><circle cx="62" cy="50" r="24"/></svg></span>
    <b id="brandname">The Exchange</b>
    <span id="langslot" style="margin-left:auto"></span>
    <span class="pill" id="statepill" hidden></span>
  </div>
</div>

<main>
  <div id="body"></div>
</main>

<nav class="tabs" id="tabs" hidden>
  <a id="tabRoom"></a>
  <a href="/browse" id="tabIn"></a>
  <button type="button" id="tabWait"></button>
  <button type="button" id="tabYou"></button>
</nav>

<script type="module">
import { T, setLang, pickLang, langButton, when } from "/i18n.js";
import { offerInstall } from "/install.js";
import { offerNotify } from "/notify.js";
/* Nothing on this page uses either any more — Mo owns the microphone and he
   lives in mo.js. Kept off the import list rather than left dangling. */
import { drawCard } from "/postcard.js";

/* THE PIN IS LOADED SEPARATELY AND ITS FAILURE IS NOT THIS PAGE'S.
 *
 * It was a static import at the top of the module. A static import that
 * cannot be resolved does not fail quietly and locally — it stops the whole
 * module from ever executing, so Messages renders as a blank white screen
 * with nothing in the console a person could see. One missing file and the
 * only screen this app opens on is dead.
 *
 * That can happen for reasons that have nothing to do with this feature: a
 * browser holding a cached copy of this page from before the file existed, a
 * deploy caught halfway, a worker serving one and not the other. The pin is
 * off by default and is the least important thing on the screen; it must not
 * be able to take the room with it.
 *
 * Loaded on demand and wrapped, so a missing or broken pin costs the pin. */
let PIN = null, pinTried = false;
async function pin() {
  if (pinTried) return PIN;
  pinTried = true;
  try { PIN = await import("/ledger-pin.js"); } catch { PIN = null; }
  return PIN;
}
import { beatUnits } from "/beat.js";
/* Mo is his own module so that every page can have him — see mo.js. What this
   page adds is the only thing it knows that he does not: how he opens to
   somebody standing at a door, and what to do when they keep the sentence he
   proposes. */
/* moDock, pointAtMo and MOFACE went with the arrival — they were the
   hand-off from the big circle in the middle of the page to the small one in
   the corner, and there is only one of him now. */
import { mountMo, moFloat, moOff, moGoneRow, moIsOpen } from "/mo.js";
import { device } from "/wait.js";
/* The same pipeline the board behind the door uses — HEIC in, JPEG out,
   the right way up, small enough to arrive over Chinese mobile data. */
import { shrink } from "/photo.js";

const $ = (id) => document.getElementById(id);
const el = (t, c, x) => { const n = document.createElement(t); if (c) n.className = c;
  if (x !== undefined) n.textContent = x; return n; };
const fill = (n) => { while (n.firstChild) n.removeChild(n.firstChild); };

/* The two halves of the sentence. The same lists the profile form inside
   offers — kept here rather than imported because the only shared module on
   this side of the door is wait.js, which is about the list and not about
   roles, and a third copy of two arrays is cheaper than a module that exists
   to hold two arrays. */
const MAKE = ["director", "writer", "performer", "crew", "founder", "maker", "student"];
const BACK = ["agent", "producer", "brand", "buyer", "distributor",
              "investor", "lawyer", "recruiter"];
const ROOMS = ["film", "invest", "raise", "trade", "other"];

/* A colour per person, from their own name. Not random: the card has to look
   the same tomorrow, and the same to them as it does to a member. */
function wash(name) {
  let h = 0;
  for (const ch of String(name || "?")) h = (h * 31 + ch.codePointAt(0)) % 360;
  return "linear-gradient(150deg,hsl(" + h + " 26% 74%),hsl(" + ((h + 24) % 360) + " 24% 52%))";
}
const initial = (name) => [...String(name || "?").trim()][0] || "?";

/* The clipboard, in whichever way this browser has one. The same routine four
   other pages on this board carry: the API where there is one and a secure
   context, an off-screen textarea where there is not — which is WeChat's
   webview, where most of these links get pasted. */
function copyText(text) {
  try {
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text);
      return true;
    }
  } catch { /* fall through */ }
  try {
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.setAttribute("readonly", "");
    ta.style.cssText = "position:absolute;left:-9999px;top:0";
    document.body.appendChild(ta);
    ta.select();
    ta.setSelectionRange(0, text.length);   // iOS ignores select() alone
    const ok = document.execCommand("copy");
    document.body.removeChild(ta);
    return ok;
  } catch { return false; }
}

let DATA = null;
let PANE = "wait";

/* ---- their card ---------------------------------------------------------- */

/** The three chips, in the order they fill. A slot with nothing in it is a
 *  dashed outline naming what is missing rather than an absence. */
function chips(w, ghosts) {
  const box = el("div", "chips");
  const add = (text, got) => {
    const c = el("span", got ? null : "ghost", text);
    box.append(c);
  };
  if (w.levelBand) add(bandWords(w.levelBand), true);
  else if (ghosts) add(T("wr.c1"), false);
  if (w.type) add(w.type, true);
  else if (ghosts) add(T("wr.c2"), false);
  if (w.want) add(T("wr.wants", { who: T("role.p." + w.want) }), true);
  else if (ghosts) add(T("wr.c3"), false);
  return box;
}

/* "ZH 7" is what the file holds and not what anybody says. */
function bandWords(band) {
  const [w, n] = String(band).split(" ");
  return T(w === "ZH" ? "wr.zh" : "wr.en", { n });
}

function cardOf(w, ghosts) {
  const pc = el("div", "pc");
  pc.style.background = wash(w.name);
  /* The wash and the initial are the ground, and a photograph covers them.
     Kept underneath rather than swapped out: a picture that fails to load
     then leaves a card rather than a hole. */
  pc.append(el("span", "ini", initial(w.name)));
  if (w.photo) {
    const img = document.createElement("img");
    img.className = "face";
    img.src = "/api/wait-media?id=" + encodeURIComponent(w.photo);
    img.alt = "";
    pc.append(img);
  }
  pc.append(el("span", "scrim"));
  pc.append(el("span", "flag", T("waitroom." + (w.room || "other")) + " · " + T("wr.flag")));
  const said = el("div", "said");
  said.append(el("div", "nm", w.name));
  if (w.why) said.append(el("p", "ln", w.why));
  pc.append(said);
  /* THE PILLS COME OFF THE PICTURE.
   *
   * They were the third line of the overlay, laid over whatever the bottom
   * of the photograph happened to be — dashed outlines on a face, or on a
   * bright patch where they could not be read at all. They are also the part
   * somebody is meant to act on, and a control sitting on top of a picture
   * reads as a caption.
   *
   * So the card is returned with them directly underneath it rather than
   * inside it, and the caller gets both as one block. */
  const wrap = el("div", "pcwrap");
  wrap.append(pc, chips(w, ghosts));
  return wrap;
}

/* ---- the three things to fill in ----------------------------------------- */

function testRow(n, key, sub, done, href) {
  const row = el("div", done ? "row ok" : "row");
  row.append(el("span", "n", done ? "✓" : String(n)));
  const mid = el("div", "mid");
  mid.append(el("b", null, T(key)));
  /* The subtitle stays what the test is, not what it said — the result is
     already the green mark two inches to the right, and printing it twice
     made the row read as a mistake. */
  mid.append(el("small", null, T(sub)));
  row.append(mid);
  if (done) row.append(el("span", "got", done));
  const go = el("a", "go", T(done ? "wr.again" : "wr.take"));
  go.href = href;
  row.append(go);
  return row;
}

/** The third one, answered in place. */
function pickRow(w, n) {
  const box = el("div", w.want ? "pick ok" : "pick");
  /* It carries its own numbered header rather than sitting under a row that
     says the same thing: two cards for one question read as two questions,
     one of which does nothing. */
  const head = el("div", "row bare");
  /* Numbered by what is actually on the screen. With the two tests off it is
     the first thing here, and calling it 3 asks the reader to look for two
     rows that are not there. */
  head.append(el("span", "n", w.want ? "✓" : String(n || 3)));
  const mid = el("div", "mid");
  mid.append(el("b", null, T("wr.t3")));
  mid.append(el("small", null, T("wr.t3sub")));
  head.append(mid);
  if (w.want) head.append(el("span", "got", T("wr.wants", { who: T("role.p." + w.want) })));
  box.append(head);

  const two = el("div", "two");
  const sel = (now, wanting) => {
    const s = document.createElement("select");
    for (const [head, keys] of [["say.make", MAKE], ["say.back", BACK]]) {
      const g = document.createElement("optgroup");
      g.label = T(head);
      for (const k of keys) {
        /* THE ARTICLE COMES WITH THE WORD, on this side too — see say.iam.
         A native select shows the option's own text when it is shut, so the
         pill cannot say one thing in the list and another in the sentence;
         the list reads "a Director / an Agent / Crew" and the sentence reads
         correctly for all three. */
      const o = el("option", null, T("role.a." + k));
        o.value = k;
        if (k === now) o.selected = true;
        g.append(o);
      }
      s.append(g);
    }
    return s;
  };
  const me = sel(w.me || "director", false);
  const want = sel(w.want || "agent", true);
  two.append(el("span", "w", T("say.iam")), me);
  two.append(el("span", "w", T("say.lookingFor")), want);
  box.append(two);

  const save = el("button", "save", T("wr.t3save"));
  save.type = "button";
  const said = el("p", "said");
  save.addEventListener("click", async () => {
    save.disabled = true;
    const ok = await putCard({ me: me.value, want: want.value });
    save.disabled = false;
    if (!ok) { save.textContent = T("act.again"); return; }
    said.textContent = T("wr.saved");
    draw();
  });
  box.append(save, said);
  return box;
}

/** One field or several, onto their own row. Returns whether it landed. */
async function putCard(body) {
  try {
    const out = await fetch("/api/wait/card", {
      method: "POST",
      headers: { "Content-Type": "application/json", "x-board-device": device() },
      body: JSON.stringify(body),
    }).then((r) => r.json());
    if (out && out.on && DATA && DATA.you) Object.assign(DATA.you, out.you);
    /* The one refusal worth its own word: somebody else is waiting with that
       address, and six digits sent to it would find their row rather than
       this one. Anything else is "that did not work". */
    if (out && out.error === "reachTaken") return "taken";
    return Boolean(out && out.on);
  } catch { return false; }
}

/* ---- the photograph ------------------------------------------------------
 *
 * One control, offered in two places. It began on the You tab alone, which
 * meant the one slot worth the most was two taps and a tab away from the
 * screen everybody actually looks at — so the card carries it too. Both call
 * this; neither owns it, and there is one upload path to get wrong.
 */

/** What to say about the photograph they have, or have not got. */
function photoWord(you) {
  if (you.photo) {
    return you.photoState === "published"
      ? { words: T("wr.photoLive"), how: "" }
      /* A picture that is up but not yet released looks identical to one that
         failed to send, and only one of those is worth worrying about. */
      : { words: T("wr.photoHeld"), how: "wait" };
  }
  /* Told, rather than quietly returned to the offer. A picture that vanishes
     with no explanation reads as a bug in the app, and the person tries the
     same photograph again. */
  if (you.photoState === "refused") return { words: T("wr.photoNo"), how: "bad" };
  return { words: T("wr.photoWhy"), how: "" };
}

/** The hidden input and the way to open it.
 *
 *  `ui.busy(on)` and `ui.say(words, how)` are however the caller wants to
 *  show those two things — a button that dims and a line under it on the You
 *  tab, a chip on the card in the Waiting tab. Everything between the tap and
 *  the row being written lives here.
 *
 *  A DETACHED INPUT, TRIGGERED WITH .click(). Not a <label> wrapping one:
 *  WeChat's webview — where most of the people this is for will open it —
 *  does not reliably pass a tap on a label through to the input inside, so
 *  the picker never opens and nothing at all happens, which reads as a photo
 *  that would not save.
 */
function photoPicker(you, ui) {
  const file = document.createElement("input");
  file.type = "file";
  file.accept = "image/*";
  file.hidden = true;

  file.addEventListener("change", async () => {
    const f = file.files && file.files[0];
    /* Cancelled. Not an error and not a state to leave the button in. */
    if (!f) return;
    ui.busy(true);
    ui.say(T("me.working"), "");
    const small = await shrink(f, 1200);
    if (small.error) {
      ui.busy(false);
      file.value = "";
      ui.say(small.error, "bad");
      return;
    }
    /* WHAT WENT WRONG, RATHER THAN "TRY AGAIN".
     *
     * Four things can stop this and they need four different actions from the
     * person holding the phone: the picture is too big, the file is not one
     * the server takes, this browser is not on the list any more, or the
     * network dropped. One message for all four is a message that helps with
     * none of them, and it is what somebody quotes back when they say it does
     * not work. */
    let ok = false, why = "act.again";
    try {
      const r = await fetch("/api/wait/photo", {
        method: "POST",
        headers: { "Content-Type": "application/json", "x-board-device": device() },
        body: JSON.stringify({ photo: small.data, photoType: small.type || "image/jpeg" }),
      });
      const out = await r.json().catch(() => null);
      ok = Boolean(r.ok && out && out.on);
      if (!ok) {
        if (r.status === 413) why = "wr.photoBig";
        else if (r.status === 415) why = "post.badPhoto";
        else if (out && out.on === false) why = "wr.gone";
      }
    } catch { /* the network. act.again is right for that one. */ }
    ui.busy(false);
    /* Cleared whatever happened: without this, picking the same photograph a
       second time fires no change event at all, so a failed upload could not
       be retried with the one file somebody actually wants to send. */
    file.value = "";
    if (!ok) { ui.say(T(why), "bad"); return; }
    await load();
    draw();
  });

  return { input: file, open: () => file.click() };
}

/* ---- the panes ----------------------------------------------------------- */

/** The hundred, drawn.
 *
 *  A number out of a hundred is a claim; a hundred dots with sixteen filled
 *  is the same fact as a picture, and a picture cannot be argued with. Theirs
 *  is the one that is solid.
 */
function hundred(seat) {
  const box = el("div", "dots");
  for (let n = 1; n <= seat.seats; n++) {
    const dot = el("i");
    if (n === seat.n) dot.className = "you";
    else if (n <= seat.taken) dot.className = "on";
    box.append(dot);
  }
  return box;
}

/** WHAT A PLACE IS, OUTSIDE THE DOOR.
 *
 *  TURNED THE RIGHT WAY UP. The block led with the seat number in the largest
 *  type on the screen, and a seat is worth FOUND(n) points — 41 at seat 24,
 *  20 at seat 100. One person who is let in and stays is worth 100. So the
 *  biggest type held the smallest number, the row that pays most was a grey
 *  line at the bottom, and nobody reading it could tell what they were being
 *  asked to do or why. Every row now ends in a number and the largest number
 *  is at the top.
 *
 *  MONEY ONLY IF SOMEBODY SET THE TWO NUMBERS. seat.money is null unless a
 *  sale figure and a members' share are both configured, and then the screen
 *  falls back to points and a percentage. Nothing invented reaches a reader.
 *
 *  THE GATE IS SAID OUT LOUD. Anybody may send their link; only a person who
 *  is let in and posts pays anything, and letting in is not theirs to do. A
 *  reward that looked like it paid per link sent is a reward that gets forty
 *  links sent to strangers.
 */
function seatBox(seat) {
  const wrap = document.createElement("div");
  const head = el("div", "wrhead");
  head.append(el("span", null, T("wr.seat") + " · " + T("wr.seatLeft", { n: seat.left })),
    el("i"));
  wrap.append(head);

  const card = el("div", "seat");
  const money = seat.money;
  /* Their share of the hundred, to two places — small numbers that climb
     rather than a big one that falls. See POOL in server.js. */
  const pc = (seat.pts * 100 / seat.pool).toFixed(2);
  const cash = (n) => "$" + Number(n).toLocaleString();

  card.append(el("p", "seatnow", T("wr.seatNow")));
  /* The figure on its own line and the arithmetic under it. Side by side, the
     points wrapped into a second line beside a 2.4rem number and the block
     opened on a ragged shape. */
  /* With no sale figure the headline is the share itself. It used to be the
     points, which the line underneath then repeated word for word. */
  card.append(el("p", "seatbig", money ? cash(money.at[0].money) : pc + "%"));
  /* No sale figure set: points and a percentage are true without one and
     carry the same ordering, so the block still works. */
  card.append(el("p", "seatpts",
    T(money ? "wr.seatPts" : "wr.seatNoMoney", { p: seat.pts, pc })));
  card.append(el("p", "seatleft", T("wr.seatShut")));

  const what = document.createElement("details");
  what.className = "seatwhat";
  const sum = document.createElement("summary");
  sum.textContent = T("wr.seatWhat");
  what.append(sum, el("p", null, T("wr.seatWhatP")));
  card.append(what);

  /* THE ONE ACT WORTH THE MOST, with the figure it moves. */
  const lift = el("div", "seatlift");
  lift.append(el("p", "lab", T("wr.seatLift")));
  const lad = el("p", "seatlad");
  if (money) {
    lad.append(el("span", "from", cash(money.at[0].money)));
    lad.append(el("span", "to", cash(money.at[1].money)));
  } else {
    lad.append(el("span", "from", String(seat.pts)));
    lad.append(el("span", "to", String(seat.pts + seat.worth.guest)));
  }
  lift.append(lad);
  lift.append(el("p", "x", T("wr.seatLiftP", { n: seat.worth.guest })));
  lift.append(el("p", "seatgate", T("wr.seatGate")));
  card.append(lift);

  /* The link, copied rather than opened. A share sheet is a different button
     on every phone and missing in WeChat's browser; the clipboard is the one
     that works everywhere, and pasting into a chat is what they were going to
     do with it anyway. */
  const go = el("button", "seatgo", T("wr.seatSend"));
  go.type = "button";
  const said = el("p", "seatsaid");
  go.addEventListener("click", () => {
    const link = location.origin + seat.link;
    said.textContent = T(copyText(link) ? "act.copied" : "act.copyFail");
    said.className = "seatsaid on";
  });
  card.append(go, said);

  /* EVERYTHING ELSE, each row ending in a number, with their own seat among
     them rather than above them — because that is its size. */
  const rest = el("div", "seatrest");
  rest.append(el("p", "h", T("wr.seatRest")));
  const rows = el("div", "ways");
  const row = (label, value, dim) => {
    const r = el("div", "way");
    r.append(el("span", "t", label), el("span", dim ? "v grey" : "v", value));
    rows.append(r);
  };
  row(T("wr.rowCard"), T("wr.rowEach", { n: seat.worth.card }));
  row(T("wr.rowHeard"), T("wr.rowEach", { n: seat.worth.heard }));
  row(T("wr.rowWeek"), T("wr.rowEach", { n: seat.worth.week }));
  row(T("wr.rowSeat", { n: seat.n }), T("wr.rowPts", { n: seat.pts }), true);
  rest.append(rows);
  card.append(rest);

  card.append(hundred(seat));

  if (money) {
    card.append(el("p", "seatex",
      T("wr.seatEx", { sale: cash(money.sale), cut: money.cut })));
    card.append(el("p", "seatex", T("wr.seatDilute")));
  }
  card.append(el("p", "seatfine", T("wr.seatFine")));
  wrap.append(card);
  return wrap;
}

/** THEIR LINK, AS THE ONE THING THIS ROOM ASKS ANYBODY TO DO.
 *
 *  It was a line inside the seat block, so turning that block off removed
 *  sharing from the room entirely. It is its own panel now, drawn whether the
 *  block is on or off, and high enough that nobody has to go looking.
 *
 *  THREE WAYS, because on the phones this runs on any one of them can be
 *  missing. navigator.share opens the real sheet — WeChat included — and is
 *  the one people expect; it exists on iOS Safari and not in much else. The
 *  clipboard is the fallback, and WeChat's webview sometimes refuses that
 *  too. So the address is printed underneath, selectable, for the case where
 *  both fail and somebody has to press and hold it like any other text.
 */
function shareBox(link) {
  const url = location.origin + link;
  const wrap = el("div", "wrshare");
  const head = el("div", "wrhead");
  head.append(el("span", null, T("wr.shareHead")), el("i"));

  /* THE PLACE IS AT THE TOP OF THE PAGE NOW, NOT IN HERE TOO.
     This block led with "You are #1 of 5 waiting" in a big number, which was
     right when the top of the page was a welcome and the position was an
     eyebrow under it. The first line of the page says it now, so saying it
     again three blocks down is the screen disagreeing with itself about
     which one is the fact.
     What is left is the only thing this block is for: what moves it, and
     the button that moves it. */
  wrap.append(el("p", "sharewhy", T("wr.shareWhy")));

  const go = el("button", "sharego");
  go.type = "button";
  const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  svg.setAttribute("viewBox", "0 0 24 24");
  const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
  path.setAttribute("d", "M4 12v7a1 1 0 001 1h14a1 1 0 001-1v-7M12 15V3m0 0L8 7m4-4l4 4");
  svg.append(path);
  /* The label is what the tap will actually do. Inside WeChat there is no
     share sheet — it blocks the API deliberately — so a button saying "Share
     to WeChat" did nothing when tapped, which is worse than no button. It
     copies; where a real sheet exists it offers that instead. */
  const sheet = Boolean(navigator.share);
  go.append(svg, document.createTextNode(T(sheet ? "wr.shareSheet" : "wr.shareGo")));

  const said = el("p", "said");
  go.addEventListener("click", async () => {
    if (sheet) {
      try {
        await navigator.share({ title: document.title, url });
        return;
      } catch (e) {
        /* Cancelling is somebody changing their mind, not a failure — say
           nothing. Anything else, fall through and copy instead. */
        if (e && e.name === "AbortError") return;
      }
    }
    said.textContent = T(copyText(url) ? "act.copied" : "act.copyFail");
  });

  wrap.append(go, said);
  /* WeChat's own menu is the only way to put this in a chat from inside
     WeChat, so the page says where that menu is rather than pretending it
     can do it — and says it only in there. In Safari the share sheet
     already offers WeChat, and an instruction about a menu that is not on
     the screen is a sentence somebody has to work out is not for them. */
  if (/MicroMessenger/i.test(navigator.userAgent)) {
    wrap.append(el("p", "hold", T("wr.shareWeChat")));
  }
  wrap.append(el("p", "hold", T("wr.shareHold")));
  wrap.append(el("p", "shareurl", url));

  const out = document.createElement("div");
  out.append(head, wrap);
  return out;
}

/* ---- THE BUTLER ----------------------------------------------------------
 *
 * The waiting room asks a stranger for one sentence in a vocabulary of
 * thirteen words nobody has been shown, and that sentence is the whole board.
 * This is the translator between what somebody says about themselves and the
 * word the matcher needs. See lib/butler.js for the rules it works under.
 *
 * IT PROPOSES AND NEVER WRITES. What comes back appears as the sentence it
 * would put on their card, with a button. Nothing is stored by talking.
 */
/* THE ARRIVAL IS AT THE DOOR NOW, NOT HERE.
 *
 * This page opened on a title page: a dark card with a red chop on it, the
 * person's name at 3rem, and Mo's circle in the middle reading them in over
 * two beats with the words lighting up as he said them. It was the right
 * screen when this WAS the first screen — somebody tapped a link out of a
 * WeChat group and landed here knowing nothing.
 *
 * They land in the room now. /r/:room opens the conversation, Mo greets them
 * in it by name, and this page is the second thing they see, reached from a
 * tab. A second welcome, with a seal on it, to somebody who has already been
 * welcomed and has come here to find out where they stand — so the ceremony
 * goes and the one fact it was wrapped around stays: their name and their
 * position, one line, at the top.
 *
 * WHAT WENT WITH IT, so it can be found: welcomeOrb() — the circle, the two
 * beats, the per-word lighting, the mp3-plus-timings loader under /voice, and
 * the scroll-settle that handed Mo from the middle of the page to the corner.
 * All of it is in the history of this file. If the beats are wanted again the
 * place for them is door.html, which is where people now arrive.
 */

/** THE FIRST THING HE SAYS, and it is the invite's job rather than a
 *  chatbot's.
 *
 *  The invite works because it is NAMED, carries one true number, and asks for
 *  one thing — and it never explains itself. This does the same with what the
 *  board already knows about the person standing in front of it: her name, and
 *  whether she was picked.
 *
 *  Written here rather than asked of the model, for three reasons. It is the
 *  only turn where the language cannot be inferred from what they typed, so it
 *  has to come from the page. It is the turn that must not be improvised — a
 *  wrong number in the first sentence is the whole impression. And it costs
 *  nothing: the conversation does not reach the model until somebody answers
 *  it.
 */
function butlerFirst() {
  const who = (DATA.you && DATA.you.name) || "";
  const total = DATA.waiting || 1;
  return DATA.up
    /* The fact worth leading with is the one that makes the place worth being
       in: she was picked and most people were not. UP_A_DAY is three on the
       box; the string says three because changing it is a deploy, and a number
       drawn from the air here would be the one thing in this sentence that was
       not true. */
    ? T("but.hookUp", { who, n: Math.max(0, total - 3) })
    /* And to somebody who has not been moved up, the same sentence would be a
       lie. The true one is better anyway: the page decides the order. */
    : T("but.hookList", { who });
}

/** HE IS ALREADY THERE. There used to be a card here first — "Not sure what
 *  to put? … Talk to him" — which is a feature introducing itself to somebody
 *  who has not been greeted yet, and one more thing to read before the thing
 *  itself. He opens having said his two lines, and they cost nothing: both are
 *  strings on this page, and the model is not reached until she answers.
 *
 *  Shut is a line, not a card. Closing him should not leave a panel behind
 *  advertising him. */
/** Turned off, and the way back.
 *
 *  A real kill switch rather than a session dismissal: plenty of people do
 *  not want to be talked to by a machine, and a board whose whole pitch is
 *  that a person decides is the worst possible place to insist otherwise. It
 *  stays shut across reloads until they ask for him back.
 *
 *  Said plainly on the way out. Somebody who shut it by accident needs to
 *  know there is a way back, and somebody who shut it on purpose is owed the
 *  confirmation that it stayed shut.
 */
/** THE CARD THEY CAN POST.
 *
 *  Nobody shares a waiting list. People share proof they are in, news about
 *  somebody impressive, and access they can give away — and this board had
 *  the third and nothing at all for the first. A person on the list had
 *  nothing to show for it.
 *
 *  Made in their own browser, so nothing about them travels anywhere to
 *  produce a picture of themselves, and the board never learns whether they
 *  posted it. See postcard.js.
 */
function mineBox(you) {
  const box = el("div", "mine");
  box.append(el("p", null, T("post.why")));
  const go = el("button", "go", T("post.mine"));
  go.type = "button";
  box.append(go);

  go.addEventListener("click", async () => {
    go.disabled = true;
    go.textContent = T("me.working");
    try {
      const url = await drawCard({
        name: you.name || "",
        why: you.why || "",
        /* Their own photograph whatever state it is in. It is theirs, it is
           already on their screen, and a card of themselves with a grey
           circle where their face goes is not a card anybody posts. */
        photo: you.photo ? "/api/wait-media?id=" + encodeURIComponent(you.photo) : "",
        member: false,
      }, T);
      const img = document.createElement("img");
      img.src = url;
      img.alt = "";
      go.remove();
      box.append(img);

      /* iOS Safari and WeChat both refuse a download a script started, and a
         button that silently does nothing is worse than no button. Press and
         hold is what everybody on those two already does with a picture, so
         that is what they are told; everywhere else gets the button. */
      const wx = /MicroMessenger/i.test(navigator.userAgent);
      const ios = /iPad|iPhone|iPod/.test(navigator.userAgent)
        || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
      if (wx || ios) {
        box.append(el("p", "how", T("post.hold")));
      } else {
        const row = el("div", "row2");
        const save = el("a", "go", T("post.keep"));
        save.href = url;
        save.download = "the-exchange.png";
        save.addEventListener("click", () => { save.textContent = T("post.kept"); });
        row.append(save);
        box.append(row);
      }
    } catch (e) {
      go.disabled = false;
      go.textContent = T("post.mine");
    }
  });
  return box;
}

/** The box that stops somebody losing their place.
 *
 *  It writes to the same route the edit form does and never reads the field
 *  it is writing: `reach` is the one thing on this row shown to nobody, so an
 *  empty box means "leave it alone" and a filled one replaces it. Somebody
 *  who typed a WeChat id and adds an address here loses the WeChat id, which
 *  is the trade and is why the text says what the address is FOR rather than
 *  asking for "your email".
 */
function loseBox() {
  const box = el("div", "lose");
  box.append(el("b", null, T("lose.head")));
  box.append(el("p", null, T("lose.why")));
  const go = el("div", "go");
  const input = el("input");
  input.type = "email";
  input.inputMode = "email";
  input.autocomplete = "email";
  input.maxLength = 80;
  input.placeholder = T("mail.ph");
  const save = el("button", null, T("lose.save"));
  save.type = "button";
  go.append(input, save);
  box.append(go);
  const said = el("p", "said");
  const no = el("p", "no");
  box.append(said, no);

  save.addEventListener("click", async () => {
    const want = input.value.trim().toLowerCase();
    no.textContent = "";
    said.textContent = "";
    if (!/^[^@\s]+@[^@\s]+\.[a-z]{2,}$/.test(want)) { no.textContent = T("mail.bad"); return; }
    save.disabled = true;
    save.textContent = T("me.working");
    const ok = await putCard({ reach: want });
    save.disabled = false;
    save.textContent = T("lose.save");
    /* TWO ROWS BEHIND ONE ADDRESS means six digits find the first of them and
       the other person is locked out of their own place — refused by the
       server rather than written. See /api/wait/card. */
    if (ok === "taken") { no.textContent = T("mail.taken"); return; }
    if (!ok) { no.textContent = T("act.again"); return; }
    input.value = "";
    said.textContent = T("lose.done");
    await load();
    draw();
  });
  return box;
}

function drawWait(box) {
  const you = DATA.you;

  /* THEIR NAME AND THEIR PLACE, ON ONE LINE, AND IT IS THE WHOLE TOP OF THE
     PAGE. First name only: a room says "Jack", never "Jack Daniels".

     NOT SMALL AND NOT GREY. It is the only reason this tab exists — somebody
     opens it to find out where they stand — so it is the largest thing on the
     screen. The position is IN the sentence rather than under it in an
     uppercase eyebrow: two lines saying one fact is how the eyebrow ends up
     being the half nobody reads.

     THE POSITION IS FOR PEOPLE STANDING IN THE QUEUE. Somebody who has been
     moved up is not in it any more, and telling them they are 56th of 56 on
     the screen that just congratulated them for getting out is the opposite
     of what happened to them — the band below carries their state instead. */
  const first = (you.name || "").split(/\s+/)[0] || you.name || "";
  you.first = first;
  const hero = el("p", "wrhi");
  hero.textContent = DATA.up
    ? T("wel.hi", { who: first })
    : T("wr.youAre", { who: first, n: (DATA.ahead || 0) + 1, t: DATA.waiting || 1 });

  const band = el("div", "wrband");

  /* MOVED UP, AND THE PAGE HAD NEVER SAID SO.
   *
   * The server has been sending up / upDone / upLeft since the waiting room
   * was built and nothing drew any of them — so the entire experience of
   * being moved up was a grey line on the app saying the buttons do not work
   * yet. That is a demotion with extra steps, and it is why the stage felt
   * flat.
   *
   * WHAT IS LEFT, ITEMISED, because "finish your page" with no idea what is
   * missing is a demand rather than an invitation. The clock is only shown
   * once it is running — it starts when they first open it, not when they
   * were lifted (see upSeen), so before that there is honestly no deadline
   * to name. */
  if (DATA.up) {
    band.className = "wrband up";
    fill(band);

    /* A COUNT AND THE BUTTONS THAT CLEAR IT.
     *
     * This was a heading, a line of prose, and a tick list: "You are in the
     * waiting room / Nothing works yet. One thing left — / ○ A photo / ✓ Your
     * sentence". Four facts, none of them a thing to press, and the one that
     * matters — go and add a photograph — was a small empty circle in a list.
     * It read as a status panel on a screen where somebody is on a clock, and
     * a status panel is a thing you glance at, not a thing you act on.
     *
     * So the count is the heading, and every outstanding item is a button
     * that does it. A tick list of one is not a list, and a list of two where
     * one is already ticked is a list of one with a distraction on it — the
     * finished half is not news, so it is not drawn at all.
     */
    const todo = [];
    if (!you.photo) todo.push({ key: "wr.photoAdd", go: "photo" });
    if (!(you.me && you.want)) todo.push({ key: "wroom.needSayGo", go: "say" });

    if (!todo.length) {
      /* Finished. Nothing to press and nothing to count — the clock line
         below carries the only thing still true. */
      band.append(el("b", null, T("wroom.head")));
    } else {
      band.append(el("b", "big", T(todo.length > 1 ? "wroom.needTwo" : "wroom.needOne")));
      for (const t of todo) {
        const go = el("button", "wrgo", T(t.key));
        go.type = "button";
        /* BOTH OF THESE LIVE ON THE YOU TAB NOW, so the button changes tab
           and then does the thing, rather than scrolling to something on
           this page that is no longer on it.

           THE PHOTOGRAPH CANNOT WAIT FOR A REDRAW. iOS opens a file chooser
           only inside the tap that asked for it, so drawing the other tab
           and then calling click() a frame later opens nothing at all. The
           draw is synchronous and the card exists by the time it returns —
           so the tap is still the same tap, and the picker opens. */
        go.addEventListener("click", () => {
          PANE = "you";
          draw();
          if (t.go === "photo") {
            const card = document.querySelector(".pc");
            if (card) card.click();
            return;
          }
          const form = document.querySelector(".wrq, .pcpills");
          if (form) { try { form.scrollIntoView({ behavior: "smooth", block: "center" }); } catch { /* old browser */ } }
        });
        band.append(go);
      }
    }

    if (DATA.upDone) band.append(el("span", "clock", T("wroom.done")));
    else if (typeof DATA.upLeft === "number") {
      band.append(el("span", "clock", T("wroom.left", { n: DATA.upLeft })));
    }
  }
  box.append(hero);
  if (DATA.up) box.append(band);

  /* THE REWARDS, BEFORE THE DOOR RATHER THAN BEHIND IT.
   *
   * Behind a door it can only be read by somebody already through one, which
   * makes it worthless as a reason to come in — and a link to it cannot be
   * shared, because the thing on the other end of the link is shut. Here it is
   * the first screen after an invite, which is the one moment somebody is
   * deciding whether to go on.
   *
   * They have no place yet. What they are shown is the place they would get
   * and what it is worth, and that number falls every time somebody else
   * finishes a page first — see pinFor. Dark unless the box lists `wait` in
   * BOARD_LEDGER_ROOMS, like everywhere else this appears. */
  const rew = el("div", "pinslot");
  box.append(rew);
  pin().then((m) => m && m.mountLedgerPin(rew, "wait", device()));

  /* THE ROOMS UNDER THE DOOR, AS A LIST.
   *
   * The Room tab is one link to the one door somebody was filed under, which
   * was right while every door was about what a person does. It is not right
   * now there is a door that is about all of them: a room nobody can find is
   * not a room, and the tab can only ever point at one.
   *
   * Their own first, because that is the one with their people in it. */
  const mine = DATA.room || "other";
  const rooms = el("div", "wrrooms");
  rooms.append(el("p", "wrroomsk", T("wr.rooms")));
  for (const key of [mine, "rewards"]) {
    if (key === "rewards" && mine === "rewards") continue;
    const a = el("a", "wrroom");
    a.href = "/r/" + encodeURIComponent(key);
    a.append(el("b", null, T("waitroom." + key)));
    /* The one that is not about what they do says so, because a row in a list
       of trades that is not a trade reads as a mistake otherwise. */
    if (key === "rewards") a.append(el("span", null, T("wr.roomsAll")));
    rooms.append(a);
  }
  box.append(rooms);

  /* THE ROOM IS THE ROOM TAB. IT WAS ON THIS SCREEN TOO.
   *
   * It was put here because this screen had been a form and a clock —
   * somebody fills in three fields and then waits, with nothing to do and no
   * way to tell whether anything is happening, which is how a queue loses the
   * people in it. Embedding the conversation was the fix, and it was the
   * right one while /room was the only page these people had.
   *
   * It is not any more. /r/:room is where they land and where they talk, and
   * the first tab in the bar goes straight back to it. Two copies of one
   * conversation on one screen, one of them a second scroll down from the
   * other — and the copy up here was a snapshot with no polling on it, so it
   * could sit there quietly disagreeing with the live one.
   *
   * What is left on this screen is the three things only this screen does:
   * where you stand, your card, and the link that moves you up.
   */

  /* AND THE THING THAT CANNOT BE UNDONE.
   *
   * Their place lives in this browser's storage and nowhere else. Change
   * phone, clear Safari, or — the common one — open the link in WeChat's
   * browser rather than the one they joined in, and they meet the join form:
   * fill it in and the list holds two rows for one person and they have lost
   * their place, their photograph and their card.
   *
   * Six digits to an address puts them back. Whoever typed a WeChat id into
   * the contact box has no way back at all, and the only place that said so
   * was a line inside the edit form further down this page, which somebody
   * who has not opened the form has never seen.
   *
   * SHOWN TO THE PEOPLE WITH SOMETHING TO LOSE, and not to all fifty-four. A
   * red box on every screen is a red box nobody reads. Somebody in the
   * waiting room is on a clock and about to spend real effort; somebody who
   * has uploaded a face has already spent it.
   *
   * WRITE ONLY, like the box in the edit form below: the page is told whether
   * a way back exists, never what it is. */
  if (!you.canSignIn && (DATA.up || you.photo || you.me)) box.append(loseBox());

  /* Offered once there is something on the card worth showing. A card with a
     name on it and nothing else is not a thing anybody posts, and offering it
     before there is would teach them the offer is worthless. */
  if (you.name && (you.photo || you.why)) box.append(mineBox(you));

  /* AND THE HOME SCREEN, on the page they were sent a link to.
   *
   * The order matters and is the order the things can be lost in: what you
   * are doing here, then the thing that cannot be undone, then the app. A
   * strip about the home screen above a warning about losing the row would be
   * the smaller ask on top of the larger one.
   *
   * WeChat's browser is the case this exists for. It cannot install anything
   * and its storage is the most fragile there is, and it is where most of
   * these links get opened — install.js says "open it in your browser"
   * there rather than drawing a button that cannot work. */
  /* THE BUTLER IS NOT IN THE PAGE ANY MORE — see moFloat(), called at the end
     of draw(). He was a panel here, above the card and below the two things
     that can be lost, which is a doorman standing in the corridor: always
     there, always in the way, scrolled past before he was needed.
     What stays in the flow is the way BACK. Somebody who sent him away has
     no floating button to press, so the offer to have him back has to live
     somewhere a person can find it, and it lives where he used to be. */
  /* The way back to him, for somebody who sent him away and has no floating
     button left to press. Whatever state they are in — see moFloat. */
  if (DATA.butler && moOff()) box.append(moGoneRow());

  const strip = el("p", "ins");
  strip.hidden = true;
  box.append(strip);
  offerInstall(strip, true);

  /* AND THE SWITCH THAT TELLS THEM WHEN SOMEBODY WANTS THEM.
   *
   * An @ in a room buzzes a phone now, and the people it matters most to —
   * standing at a door, waiting to be noticed — were never offered it. It was
   * on Messages, behind a test that hid it from exactly them: two asks at once
   * is neither, and Messages is where the home-screen ask lives.
   *
   * HERE INSTEAD, which is their own page and where they are already finishing
   * things. notify.js decides whether to show anything at all — never on load,
   * never before the app is on the home screen on iOS, never without keys on
   * the box — so on the screen this is one line that appears when it can work
   * and nothing when it cannot. */
  const buzz = el("p", "ins");
  buzz.hidden = true;
  box.append(buzz);
  offerNotify(buzz, true);

  /* THE CARD IS ON THE YOU TAB, WHICH IS WHAT THE YOU TAB IS.
   *
   * This screen carried the card, the photograph, the two tests and the
   * sentence — and so did the tab next to it. Two tabs, both mostly about
   * one card, and the one called "Waiting" was the busier of the two. It had
   * stopped being a waiting list and become a to-do page with a queue
   * position at the top of it.
   *
   * One thing each now. Waiting is where you stand, what is holding you and
   * what moves you up. You is your card, all of it, in one place — see
   * drawYou, which is where this block went.
   */

  /* SHARING, AFTER THE CARD IS FINISHED.
   *
   * It sat directly under the picture, which put the ask before the card was
   * worth sending — somebody who had not chosen what they are looking for
   * was being handed a link to a half-filled page. Below the dropdowns it
   * comes after the last thing they fill in, and before the people waiting
   * with them, so the proof sits next to the ask. */
  if (DATA.link) box.append(shareBox(DATA.link));

  /* THE SEAT, when the switch is on. See SEAT_OUTSIDE in server.js — the
     server sends nothing at all when it is off, so this whole block simply
     does not exist rather than being hidden.

     FOURTH, and the position is the argument. Above it the screen is about
     being findable, which is what they came for and what the busy people
     stay for. Directly below it are the other people waiting — so the moment
     after somebody taps Send your link, the next thing on the screen is four
     people who are here because somebody did. The proof sits next to the
     ask. */
  if (DATA.seat) box.append(seatBox(DATA.seat));
  /* Or, with the block off, the sentence. See `soon` in server.js. */
  else if (DATA.soon) box.append(el("p", "soonnote", T("wr.soon")));

  /* THE OTHERS ARE IN THE ROOM, NOT IN A LIST UNDER IT.
   *
   * This was "Waiting with you" and a row each — face, name, their room,
   * their line, their tags. It was the only way to know anybody else was
   * there when this screen was a form and a clock.
   *
   * The room is above it now and it says the same thing three times over:
   * Mo announces each arrival by name as it happens, the header counts them,
   * and then a list at the foot of the page names them again with no new
   * fact on it. A list of people you have just watched walk in is furniture.
   *
   * What it was carrying that the room was not — their line, and what they
   * are looking for — belongs on a card somebody can read, which is what
   * Browse is for and what the Inside tab now reaches.
   */
  if (DATA.featured.length) {
    const ih = el("div", "wrhead");
    ih.append(el("span", null, T("wr.inside")), el("i"));
    box.append(ih);
    const p = DATA.featured[0];
    const card = el("div", "wrpost");
    card.append(el("p", null, p.note));
    card.append(el("p", "by", p.handle + " · " + when(p.at)));
    box.append(card);
  }

  const lock = el("div", "locked");
  const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  svg.setAttribute("viewBox", "0 0 24 24");
  const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
  path.setAttribute("d", "M6 11V8a6 6 0 0112 0v3M5 11h14v9H5z");
  svg.append(path);
  lock.append(svg, el("span", null, T("wr.locked")));
  box.append(lock);
}

/** The room at this door, on the screen of somebody standing in it. */
/** What members see, and the only screen that can change it. */
function drawYou(box) {
  const you = DATA.you;
  const head = el("div", "wrhead");
  head.append(el("span", null, T("wr.edit")), el("i"));
  box.append(head);

  const full = Boolean(you.levelBand && you.type && you.want);

  /* THE CARD TAKES THE PHOTOGRAPH ITSELF.
   *
   * It was on the You tab only, which put the slot worth the most two taps
   * and a tab away from the screen everybody actually looks at — and the
   * thing a person taps when they want to change their picture is the
   * picture. So the card is the control: tapping it opens the same picker,
   * and a chip on it says so, because a tap target nobody can see is a tap
   * target nobody uses. The You tab keeps its button; this is the short way,
   * not the only way. */
  /* cardOf returns the picture with the pills underneath it, as one block.
     The tapping, the busy state and the chip all belong to the picture, so
     that is what is held here; the block is what goes on the page. */
  const cardWrap = cardOf(you, true);
  const card = cardWrap.querySelector(".pc");
  card.className = "pc tap";
  const under = el("p", "under", T(full ? "wr.full" : "wr.thin"));
  const chip = el("span", "shotchip");
  const setChip = () => {
    const w = photoWord(you);
    chip.className = "shotchip" + (w.how ? " " + w.how : "");
    chip.textContent = T(you.photo ? "wr.photoAgain" : "wr.photoAdd");
  };
  setChip();
  /* Only with no photograph on the card. Once there is one the arrow is
     pointing at a job already done, which is worse than not pointing. */
  let point = null;
  if (!you.photo) {
    point = el("div", "shotpoint");
    point.append(el("i"), el("span", null, T("wr.photoPoint")));
  }
  const picker = photoPicker(you, {
    busy: (on) => { card.className = on ? "pc tap busy" : "pc tap"; },
    /* On the card there is no room for a sentence, so the chip carries the
       short version and the line under the card carries the rest — which is
       where the reader is already looking after tapping it. */
    say: (words, how) => { under.className = "under" + (how ? " " + how : "");
      under.textContent = words; },
  });
  card.append(chip);
  if (point) card.append(point);
  card.addEventListener("click", () => {
    /* Gone on the first tap, not on a successful upload. They have been told;
       an arrow still pointing while the file picker is open is the page
       nagging somebody who is already doing it. */
    if (point) { point.remove(); point = null; }
    picker.open();
  });
  box.append(cardWrap, picker.input);
  box.append(under);
  /* AND WHERE THE PHOTOGRAPH HAS GOT TO, on the screen they took it from.
   *
   * A picture uploaded from the card appeared on the card and said nothing
   * else, so the honest answer to "has this saved?" was only on the other
   * tab. It is up, it is theirs, and nobody else can see it yet — three
   * facts, and the middle one is the reason the third is not alarming. */
  if (you.photo && you.photoState !== "published") {
    box.append(el("p", "under wait", T("wr.photoHeld")));
  }

  /* The heading and its line only when there is a section to head. With the
     two tests off it labelled a single row of dropdowns, which is a heading
     for nothing — and it stood between the profile and the thing somebody
     fills in. */
  if (DATA.tests) {
    const head = el("div", "wrhead");
    head.append(el("span", null, T(full ? "wr.done" : "wr.fill")), el("i"));
    box.append(head);
  }
  /* Said once, under the heading, and not repeated on each row: the rule is
     that this is optional, and a rule restated three times starts to sound
     like somebody protesting. Gone once all three are filled in — by then it
     is answering a question nobody still has. */
  if (DATA.tests && !full) box.append(el("p", "wrwhy", T("wr.fillWhy")));

  /* The two tests only where somebody has turned them on. See TESTS_ON. The
     picker is not one of them and is always here. */
  if (DATA.tests) {
    box.append(testRow(1, "wr.t1", "wr.t1sub",
      you.levelBand ? bandWords(you.levelBand) : "", "/level"));
    box.append(testRow(2, "wr.t2", "wr.t2sub", you.type || "", "/type"));
  }

  box.append(pickRow(you, DATA.tests ? 3 : 1));

  /* AND WHERE THE PHOTOGRAPH HAS GOT TO. A picture that is up but not yet
     released looks identical to one that failed to send, and only one of
     those is worth worrying about. */
  if (you.photo && you.photoState !== "published") {
    box.append(el("p", "under wait", T("wr.photoHeld")));
  }

  /* THERE WERE TWO OF THESE AND THEY DISAGREED. This tab had a card with an
     "Add a photo" button beside it; the waiting tab had a card you tapped,
     with a chip on it saying so. The tapped one is better — the thing a
     person reaches for when they want to change their picture is the
     picture — so it is the one that survived the merge, and the button is
     gone rather than sitting next to it doing the same job. */

  const form = el("div", "form");
  const name = el("input");
  name.value = you.name; name.maxLength = 40;
  const why = el("textarea");
  why.value = you.why || ""; why.maxLength = 300; why.rows = 3;

  form.append(el("label", null, T("wait.name")), name);
  form.append(el("label", null, T("wait.why")), why);

  form.append(el("label", null, T("wait.which")));
  const rooms = el("div", "rooms");
  let room = you.room || "other";
  const btns = [];
  for (const k of ROOMS) {
    const b = el("button", k === room ? "rm on" : "rm", T("waitroom." + k));
    b.type = "button";
    b.addEventListener("click", () => {
      room = k;
      for (const o of btns) o.className = o === b ? "rm on" : "rm";
    });
    btns.push(b);
    rooms.append(b);
  }
  form.append(rooms);

  /* THE WAY BACK IN, ON THE ROW IT BELONGS TO.
   *
   * Their place lives on this browser. Change phone, clear Safari, or open
   * the link in WeChat rather than the browser they joined in, and they meet
   * the join form — fill it in and the list has two rows for one person and
   * they have lost their place.
   *
   * Six digits to the address they gave puts them back on their own row, and
   * only if what they typed was an address. Whoever gave a WeChat id has no
   * way back and nothing had said so.
   *
   * WRITE ONLY. The page is told whether it works, never what it is: the
   * contact is the one field here shown to nobody, and a page holding it is a
   * page one bug away from showing it — see the note under Save. So this box
