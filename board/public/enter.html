<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="/favicon.png" sizes="192x192">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#EEF0F4">
<meta name="theme-color" content="#0B0E15" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="交换">
<title>You have been invited</title>
<meta name="description" content="A private community for people in China, and the people who want to reach them. Invite only.">
<meta property="og:type" content="website">
<meta property="og:title" content="交换 · The Exchange">
<!-- WHAT THE CARD SAYS, AND WHAT IT CANNOT SAY. The password is not in here
     and cannot be: this page is one address shared by everybody, the codes
     rotate daily per member, and a description is cached by whoever renders
     the preview. The code travels in the message the inviter types, which is
     the whole point of it being typed rather than carried in the link. -->
<meta property="og:description" content="Invite only. You will need the code from whoever sent you this.">
<meta property="og:image" content="{{ORIGIN}}/share.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:url" content="{{ORIGIN}}/enter">
<meta name="robots" content="noindex">
<meta http-equiv="Cache-Control" content="no-cache">
<meta name="color-scheme" content="light dark">
<style>
  :root{
    --paper:#EEF0F4; --raise:#F7F8FB; --ink:#151B28; --ink-2:#4E5968;
    --muted:#8A939F; --line:#E3E6EC; --hair:#EAECF1;
    --accent:#3F68D8; --accent-ink:#FFFFFF; --accent-soft:#E8ECF7;
    --t3:#D99038; --t6:#2F8C9E;
    --serif:Georgia,"Songti SC","Noto Serif CJK SC",'Times New Roman',serif;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",
      "Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;
    --shadow:0 2px 6px rgba(21,27,40,.07),0 10px 28px rgba(21,27,40,.09);
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --paper:#0B0E15; --raise:#141924; --ink:#E9EDF5; --ink-2:#A3B0C4;
      --muted:#6F7D92; --line:#232B39; --hair:#1E2531;
      --accent:#5C8DFF; --accent-ink:#0B0E15; --accent-soft:#18233D;
      --t3:#E4A65A; --t6:#4FA9BC;
      --shadow:0 2px 6px rgba(0,0,0,.4),0 12px 32px rgba(0,0,0,.34);
    }
  }
  :root[data-theme="dark"]{
    --paper:#0B0E15; --raise:#141924; --ink:#E9EDF5; --ink-2:#A3B0C4;
    --muted:#6F7D92; --line:#232B39; --hair:#1E2531;
    --accent:#5C8DFF; --accent-ink:#0B0E15; --accent-soft:#18233D;
    --t3:#E4A65A; --t6:#4FA9BC;
    --shadow:0 2px 6px rgba(0,0,0,.4),0 12px 32px rgba(0,0,0,.34);
  }
  :root[data-lang="zh"]{
    --serif:"Songti SC","Noto Serif CJK SC","Source Han Serif SC","STSong",Georgia,serif;
    --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB",
      "Microsoft YaHei","Noto Sans SC","Segoe UI",sans-serif;
  }
  :root[data-lang="zh"] body{line-height:1.75}
  :root[data-lang="zh"] .eyebrow,
  :root[data-lang="zh"] .pole{text-transform:none;letter-spacing:.02em}
  [hidden]{display:none!important}

  *{box-sizing:border-box}
  /* THE WHOLE APP, ONE SIZE UP.
     Everything here is set in rem, so the root is the one dial: 17px instead
     of the browser's 16 puts about six per cent on every size, every gap and
     every tap target at once, which is what "it is all a bit small" actually
     asks for. Not a per-element pass — that is how a page ends up with three
     sizes of the same thing. */
  html{font-size:17px;-webkit-text-size-adjust:100%}

  /* ---- WHO LEFT THIS FOR YOU -------------------------------------------
     One page, two things: a face to tap and the way in. The face is the mark
     from the share card, so somebody who has seen the link preview has
     already met it. */
  #hello{text-align:center;padding:1.4rem 0 0}
  #hello .tag{margin:0 0 1.5rem;font-size:.7rem;letter-spacing:.16em;
    text-transform:uppercase;color:var(--muted)}
  #hello .tag b{color:var(--ink-2);font-weight:500}
  .orb{position:relative;width:8.5rem;height:8.5rem;margin:0 auto 1.2rem;
    display:grid;place-items:center;border:0;background:none;padding:0}
  .orb u{position:absolute;inset:0;border-radius:50%;
    background:radial-gradient(circle at 50% 45%,var(--accent-soft),transparent 68%)}
  .orb s{position:absolute;inset:1.1rem;border-radius:50%;
    border:1px solid var(--accent);opacity:.32}
  .orb i{position:relative;width:5rem;height:5rem;border-radius:50%;
    background:#121110;color:#faf4ea;display:grid;place-items:center;
    font-family:var(--serif);font-size:2rem;font-style:normal;
    box-shadow:0 14px 34px -14px rgba(18,17,16,.8)}
  .orb .badge{position:absolute;right:1.5rem;bottom:1.5rem;width:1.3rem;
    height:1.3rem;border-radius:50%;background:var(--accent);
    border:2.5px solid var(--paper);background-repeat:no-repeat;
    background-position:57% 50%;background-size:.6rem;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='white'><path d='M9 5.5v13l10-6.5z'/></svg>")}
  /* Reading it aloud: the mark holds still and the ring breathes, which reads
     as speaking without anything jumping about on a small screen. */
  .orb.on s{animation:breathe 1.9s ease-in-out infinite}
  .orb.on .badge{background-size:.55rem;background-position:50% 50%;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='white' stroke-width='3' stroke-linecap='round'><path d='M9 6v12M15 6v12'/></svg>")}
  @keyframes breathe{0%,100%{transform:scale(1);opacity:.32}
                     50%{transform:scale(1.09);opacity:.6}}
  @media (prefers-reduced-motion:reduce){.orb.on s{animation:none;opacity:.6}}

  #hello .lead{margin:0 0 .35rem;font-family:var(--serif);font-weight:400;
    font-size:1.42rem;line-height:1.28;letter-spacing:-.01em}
  #hello .under{margin:0 0 1.6rem;font-size:.9rem;color:var(--muted)}
  /* What was just said, written down. */
  .spoke{margin:0 0 1.5rem;padding:.9rem 1rem;background:var(--accent-soft);
    border-radius:.9rem;font-size:.98rem;line-height:1.6;color:var(--ink);
    text-align:left}
  .orline{display:flex;align-items:center;gap:.7rem;margin:0 0 1rem;
    color:var(--muted);font-size:.72rem;letter-spacing:.12em;
    text-transform:uppercase}
  .orline::before,.orline::after{content:"";flex:1;height:1px;background:var(--hair)}
  #hello .go small{display:block;font-weight:400;font-size:.76rem;opacity:.85;
    margin-top:.12rem}
  #hello .note{margin:1rem 0 0}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);
    font-size:1rem;line-height:1.5;-webkit-font-smoothing:antialiased}
  main{max-width:34rem;margin:0 auto;padding:0 1.15rem 4rem}
  button{font:inherit;cursor:pointer}
  a{color:inherit}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}

  /* The strip that says this is not open yet. Quiet, full width, above
     everything — it is a status, not an announcement, and it is the first
     thing somebody arriving from a friend's link should read. */
  .invite{margin:0 -1.15rem .9rem;padding:.5rem 1.15rem;background:var(--accent-soft);
    color:var(--accent);font-size:.78rem;letter-spacing:.02em;text-align:center}
  .bar{display:flex;align-items:center;gap:.7rem;padding:.9rem 0 1.2rem}
  .bar a.back{color:var(--ink);text-decoration:none;display:grid;place-items:center;
    margin-left:-.3rem}
  .bar svg{width:1.5rem;height:1.5rem;stroke:currentColor;fill:none;stroke-width:1.8;
    stroke-linecap:round;stroke-linejoin:round}
  .bar .lang{margin-left:auto;border:1px solid var(--line);background:var(--raise);
    color:var(--ink-2);border-radius:99px;padding:.42rem .9rem;font-size:.85rem;line-height:1}

  .eyebrow{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
  h1{margin:.5rem 0 0;font-family:var(--serif);font-weight:400;font-size:2rem;
    line-height:1.12}
  .egs{margin:.55rem 0 0;font-family:var(--serif);font-size:1.25rem;
    letter-spacing:.06em;color:var(--accent)}
  .lede{margin:.8rem 0 0;font-size:1.02rem;line-height:1.65;color:var(--ink-2)}
  /* The reason to take this one and not another. Set apart, because it is the
     claim the rest of the page has to make good on. */
  .lede.lean{margin-top:1rem;padding-left:.95rem;border-left:2px solid var(--accent);
    font-size:.98rem}
  .go{margin:1.6rem 0 0;border:0;background:var(--accent);color:var(--accent-ink);
    border-radius:99px;padding:.85rem 1.9rem;font-size:1.05rem}
  .quiet{margin:.8rem 0 0;border:1px solid var(--line);background:var(--raise);
    color:var(--ink);border-radius:99px;padding:.7rem 1.4rem;font-size:.95rem;
    text-decoration:none;display:inline-block}
  /* One loud button on this screen, and it is Share. Two would be a screen
     that has not decided what it wants. */
  .quiet.wide{display:block;width:100%;text-align:center;padding:.8rem 1rem;
    font-size:1rem}
  .go.wide{display:block;width:100%;margin:1.4rem 0 0;padding:.85rem 1rem;
    font-size:1.02rem}
  .note{margin:1.4rem 0 0;font-size:.86rem;line-height:1.6;color:var(--muted)}

  /* ---- the door ----------------------------------------------------------
   * Three screens in one page, because they are one moment: get out of
   * WeChat, type six characters, come in. */
  .mark{width:3.2rem;height:3.2rem;border-radius:50%;background:var(--accent);
    color:var(--accent-ink);display:grid;place-items:center;font-size:1.6rem;
    line-height:1;-webkit-font-smoothing:antialiased}
  .top{display:flex;align-items:center;gap:.8rem;margin:1.4rem 0 0}
  .top h1{margin:0;font-size:1.5rem}
  .top p{margin:.15rem 0 0;font-size:.86rem;color:var(--muted)}

  .zh{margin:.5rem 0 0;font-size:.95rem;line-height:1.75;color:var(--muted)}

  /* The six boxes. One input under them, so the phone keyboard behaves and a
     paste of the whole code lands in one go — the boxes are a drawing of what
     the field holds, which is the only way this works on both keyboards. */
  .codewrap{position:relative;margin:1.5rem 0 0}
  .boxes{display:flex;gap:.45rem}
  .boxes i{flex:1 1 0;min-width:0;height:3.4rem;border-radius:.7rem;
    background:var(--raise);border:1px solid var(--line);display:grid;
    place-items:center;font-style:normal;font-family:var(--sans);
    font-size:1.5rem;font-weight:600;letter-spacing:.04em;color:var(--ink)}
  .boxes i.on{border-color:var(--accent)}
  .boxes i.err{border-color:var(--t3);color:var(--t3)}
  /* Invisible, on top, and the thing actually being typed into. */
  #code{position:absolute;inset:0;width:100%;height:100%;opacity:0;border:0;
    background:none;font-size:16px;letter-spacing:2em;padding:0;
    -webkit-text-fill-color:transparent;caret-color:transparent}
  #code:focus{outline:0}
  .codewrap:focus-within .boxes i.next{border-color:var(--accent);
    box-shadow:0 0 0 3px var(--accent-soft)}

  .said{margin:1rem 0 0;font-size:.92rem;line-height:1.6;color:var(--ink-2)}
  .said.bad{color:var(--t3)}
  .said.ok{color:var(--accent)}

  /* The way out of WeChat, drawn as the thing it points at. */
  /* The arrow lives above the words and reaches for the corner of the screen,
     because that is where WeChat keeps the button. Dotted, so it reads as a
     gesture rather than as part of the page's furniture. */
  .pointer{height:5.5rem;margin:.4rem 0 -.6rem;color:var(--accent);
    display:flex;justify-content:flex-end}
  .pointer svg{width:8rem;height:100%;overflow:visible}
  @media (prefers-reduced-motion:no-preference){
    .pointer svg{animation:nudge 2.4s ease-in-out infinite}
  }
  @keyframes nudge{
    0%,100%{transform:translate(0,0)}
    50%{transform:translate(4px,-4px)}
  }

  .steps{margin:1.2rem 0 0;padding:.9rem 1rem;background:var(--raise);
    border:1px solid var(--line);border-radius:.9rem}
  .steps .r{display:flex;align-items:center;gap:.6rem;font-size:.95rem}
  .steps .r + .r{margin-top:.5rem}
  .steps .k{flex:0 0 auto;min-width:1.9rem;height:1.9rem;padding:0 .4rem;
    border-radius:.45rem;background:var(--ink);color:var(--paper);
    display:grid;place-items:center;font-size:.85rem;letter-spacing:.1em}
  .copyrow{display:flex;gap:.6rem;margin:1.1rem 0 0;flex-wrap:wrap}
  .copyrow button{flex:1 1 0;min-width:9rem}
  .anyway{display:block;width:100%;margin:1rem 0 0;border:0;background:none;
    color:var(--muted);font-size:.88rem;padding:.4rem 0;text-decoration:underline}
  .anyway:hover{color:var(--ink)}

  /* Its own section now, so it needs the width the door used to give it. */
  #listwrap{width:100%;max-width:22rem;margin:0 auto}
  .keyopen{display:block;width:100%;margin:1.6rem 0 0;border:0;background:none;
    color:var(--muted);font-size:.9rem;padding:.5rem 0;text-decoration:underline;
    text-underline-offset:3px}
  .keyopen:hover{color:var(--ink)}
  .keybox .where{margin:.5rem 0 0;font-size:.85rem;line-height:1.55;color:var(--muted)}
  .keybox{margin:.7rem 0 0;padding:1rem 1.05rem;background:var(--raise);
    border:1px solid var(--line);border-radius:.9rem}
  .keybox h2{margin:0;font-family:var(--serif);font-weight:400;font-size:1.05rem}
  .keybox p{margin:.4rem 0 0;font-size:.88rem;line-height:1.55;color:var(--ink-2)}
  .keybox textarea{width:100%;margin:.7rem 0 0;border:1px solid var(--line);
    border-radius:.6rem;background:var(--paper);color:var(--ink);
    padding:.6rem .7rem;font:inherit;font-size:.9rem;resize:vertical}
  /* The clock. Tabular figures so the seconds do not shove the minutes about
     once a second, which is the difference between a countdown and a twitch. */
  .clock{display:flex;align-items:baseline;justify-content:center;gap:.5rem;
    margin:0 0 .9rem;font-size:.85rem;color:var(--muted)}
  .clock b{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    font-variant-numeric:tabular-nums;font-size:1.05rem;font-weight:500;
    color:var(--ink);letter-spacing:.02em}
  .clock.low b{color:var(--accent)}
  .clock.gone b{color:var(--bad,#B4232B)}
  .keybox input{width:100%;margin:.7rem 0 0;border:1px solid var(--line);
    border-radius:.6rem;background:var(--paper);color:var(--ink);
    padding:.6rem .7rem;font:inherit;font-size:.95rem}
  #sicode{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
    letter-spacing:.35em;text-align:center;font-size:1.15rem}
  /* The key is the second way in, and the rule says so without a word. */
  .keybox h2.second{margin:1.4rem 0 0;padding-top:1.1rem;
    border-top:1px solid var(--line)}
</style>
</head>
<body>
<main>
  <p class="invite" id="invite"></p>

  <!-- WHERE YOU ARE MATTERS MORE THAN WHAT YOU TYPE.
       In WeChat's browser this is the whole page: the code would work here and
       the profile built afterwards would be stranded in a browser the person
       never opens on purpose. -->
  <section id="wx" hidden>
    <!-- POINT AT THE THING. The ··· is WeChat's own, in the corner above this
         page — outside anything we can draw on. So the arrow runs up and to
         the right and stops at the edge of the viewport, which is as close to
         the button as a page inside a webview can get. -->
    <div class="pointer" aria-hidden="true">
      <svg viewBox="0 0 120 100" preserveAspectRatio="xMaxYMin meet">
        <path d="M8 92 C 8 52, 34 22, 96 12" fill="none" stroke="currentColor"
              stroke-width="4" stroke-linecap="round" stroke-dasharray="0.1 11"/>
        <path d="M78 4 L100 11 L84 27" fill="none" stroke="currentColor"
              stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <div class="top">
      <span class="mark" aria-hidden="true"><svg viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="7" style="width:1em;height:1em;display:block" aria-hidden="true"><circle cx="38" cy="50" r="24"/><circle cx="62" cy="50" r="24"/></svg></span>
      <div>
        <h1 id="wxtitle"></h1>
        <p id="wxsub"></p>
      </div>
    </div>
    <p class="lede" id="wxsay"></p>
    <p class="zh" id="wxzh"></p>
    <div class="steps">
      <div class="r"><span class="k">···</span><span id="wxstep1"></span></div>
      <div class="r"><span class="k">↗</span><span id="wxstep2"></span></div>
    </div>
    <div class="copyrow">
      <button class="go" type="button" id="wxcopy"></button>
    </div>
    <p class="note" id="wxnote"></p>
    <button class="anyway" type="button" id="wxanyway"></button>
  </section>

  <!-- WHO LEFT THIS FOR YOU.
       Shown only when the link carries a name — see `for` and `from` in the
       script. Two things on it and nothing else: a face to tap, and the way
       in. Everything the earlier version of this screen said in four
       paragraphs is behind the tap, and most people will never need it.
       The names are decoration on a greeting, not a claim about anybody: they
       are typed by whoever made the link, and they are escaped on the way in.
       The code is still the only thing that opens anything. -->
  <section id="hello" hidden>
    <p class="tag" id="hellotag"></p>
    <button class="orb" type="button" id="orb">
      <u aria-hidden="true"></u><s aria-hidden="true"></s>
      <i aria-hidden="true"><svg viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="7" style="width:1em;height:1em;display:block" aria-hidden="true"><circle cx="38" cy="50" r="24"/><circle cx="62" cy="50" r="24"/></svg></i>
      <b class="badge" aria-hidden="true"></b>
    </button>
    <h1 class="lead" id="hellolead"></h1>
    <p class="under" id="hellounder"></p>
    <!-- Said out loud AND written down. A voice is no use on a phone that is
         on silent, on a train, or to somebody who did not expect sound. -->
    <p class="spoke" id="hellospoke" hidden></p>
    <div class="orline" id="helloor"><span></span></div>
    <button class="go wide" type="button" id="helloaccept"></button>
    <p class="note" id="hellonote"></p>
  </section>

  <!-- THE DOOR ITSELF. -->
  <section id="door" hidden>
    <div class="top">
      <span class="mark" aria-hidden="true"><svg viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="7" style="width:1em;height:1em;display:block" aria-hidden="true"><circle cx="38" cy="50" r="24"/><circle cx="62" cy="50" r="24"/></svg></span>
      <div>
        <h1 id="doortitle"></h1>
        <p id="doorsub"></p>
      </div>
    </div>
    <p class="lede" id="doorsay"></p>
    <p class="zh" id="doorzh"></p>

    <!-- HOW LONG IT LASTS, TICKING. Above the boxes because it is the reason
         to type them now rather than tomorrow. Hidden unless the link carried
         a deadline — see the note on the clock. -->
    <p class="clock" id="clock" hidden>
      <span id="clocklab"></span>
      <b id="clockleft"></b>
    </p>

    <div class="codewrap">
      <div class="boxes" id="boxes" aria-hidden="true"></div>
      <input id="code" inputmode="text" autocomplete="one-time-code"
             autocapitalize="characters" autocorrect="off" spellcheck="false"
             maxlength="6" aria-label="Invite code">
    </div>
    <button class="go wide" type="button" id="go"></button>
    <p class="said" id="said" hidden></p>
    <p class="note" id="doornote"></p>

    <!-- SOMEBODY WITH NO CODE AT ALL, which is most of the people who arrive
         here. The link and the six characters are sent apart on purpose, so
         anybody who was forwarded the link, or whose code has already been
         spent, or who simply found the address, lands on a screen that asks
         for a thing they do not have and offers nothing else. That is not a
         door, it is a wall — and it was turning away exactly the people the
         board wants, at the only moment they were interested.

         The same box the public page uses, so there is one waiting list and
         one set of words about who reads it. -->
    <!-- SOMEBODY WHO HAS BEEN HERE BEFORE does not need a code at all — but
         almost nobody reading this screen is that person, and "paste your key"
         is a word they have never met. One quiet line until it is asked for. -->
    <button class="keyopen" type="button" id="keyopen"
            aria-expanded="false" aria-controls="keybox"></button>
    <div class="keybox" id="keybox" hidden>
      <!-- THE ADDRESS FIRST, THE KEY UNDER IT. This box used to open on the
           word "key", which almost nobody reading it has met — and the person
           who needs this screen is by definition the one who did not save
           theirs. Six digits to an address is the shape everybody knows, and
           underneath it does the same thing. -->
      <h2 id="sititle"></h2>
      <p id="sisay"></p>
      <input id="simail" type="email" inputmode="email" autocomplete="email"
             spellcheck="false" autocapitalize="off">
      <input id="sicode" inputmode="numeric" autocomplete="one-time-code"
             maxlength="6" spellcheck="false" hidden>
      <button class="quiet wide" type="button" id="sigo"></button>
      <p class="said" id="sisaid" hidden></p>

      <h2 id="keytitle" class="second"></h2>
      <p id="keysay"></p>
      <p class="where" id="keywhere"></p>
      <textarea id="key" rows="2" spellcheck="false" autocapitalize="off"></textarea>
      <button class="quiet wide" type="button" id="keygo"></button>
      <p class="said" id="keysaid" hidden></p>
    </div>
  </section>

  <!-- IN. -->
  <!-- THE WAY ONTO THE LIST, UNDER BOTH SCREENS.
       It started inside the door, which meant the one set of people most
       likely to need it never saw it: inside WeChat the wall comes first, and
       the wall is where most of these links are opened. Joining the list has
       nothing to do with what that wall is warning about — nobody is spending
       a code, and a row is keyed to a name and a way to be reached rather than
       to the browser it was typed in — so it works there exactly as well. -->
  <section id="listwrap" hidden>
    <button class="keyopen" type="button" id="listopen"
            aria-expanded="false" aria-controls="listbox"></button>
    <div class="keybox" id="listbox" hidden><div id="waitslot"></div></div>
  </section>

  <section id="inside" hidden>
    <div class="top">
      <span class="mark" aria-hidden="true"><svg viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="7" style="width:1em;height:1em;display:block" aria-hidden="true"><circle cx="38" cy="50" r="24"/><circle cx="62" cy="50" r="24"/></svg></span>
      <div>
        <h1 id="intitle"></h1>
        <p id="insub"></p>
      </div>
    </div>
    <p class="lede" id="insay"></p>
    <p class="zh" id="inzh"></p>
    <a class="go wide" id="ingo" href="/browse"></a>
    <p class="note" id="innote"></p>
    <!-- The key, one line under the thing most people will actually do. -->
    <p class="note" id="inkey"></p>
  </section>
</main>

<script type="module">
import { T, lang, setLang, pickLang, langButton } from "/i18n.js";
import { waitBox } from "/wait.js";

const $ = (id) => document.getElementById(id);
const IN_WECHAT = /micromessenger/i.test(navigator.userAgent);

/* ?new=1 HOLDS THE DOOR SHUT, for whoever runs this.
 *
 * A browser that has spent a code is recognised here and reloaded straight
 * through, which is right and makes the door impossible for a member to look
 * at: open the link on your own phone and you are inside before you see it,
 * so "is the way onto the list actually there" had no answer except borrowing
 * somebody else's phone.
 *
 * It skips the WeChat wall too. That wall is advice for somebody about to
 * spend a code in a browser that will forget them; whoever is previewing the
 * door is spending nothing, and stopping them at it would hide the one screen
 * they came to see.
 *
 * Nothing but display. Admission is a row in the file and a signed cookie and
 * neither is touched, so this is a preview and never a way out — reload
 * without it and you are through as before. */
const PREVIEW = new URLSearchParams(location.search).get("new") === "1";

/* The same browser identity the rest of the app uses. Made here if this is the
   first page somebody has opened, because admission is recorded against it —
   and it is what the recovery key carries. */
function uuid() {
  try {
    if (crypto && typeof crypto.randomUUID === "function") return crypto.randomUUID();
  } catch { /* older WeChat kernels have neither */ }
  const r = () => Math.random().toString(16).slice(2, 10);
  return r() + "-" + r() + "-" + r() + "-" + r();
}
let device = "";
try {
  device = localStorage.getItem("board:device") || "";
  if (!device) { device = uuid(); localStorage.setItem("board:device", device); }
} catch { device = uuid(); }

/* NOTHING IS TAKEN OUT OF THE ADDRESS.
 *
 * Links of the shape /i/CODE were handed out for a few hours and still open
 * this page, but the code in them is ignored — reading it would put us back
 * where we started, where opening a link IS accepting the invitation. Forward
 * one of those to somebody by mistake, or tap it on a friend's phone to show
 * them what you were sent, and their phone became the member.
 *
 * The link is an address. The six characters are the password, they arrive
 * separately, and somebody types them on purpose.
 */
let TYPED = "";
let ERR = false;

/* ---------------------------------------------------------------------------
 * THE CLOCK
 *
 * A code sent to one person now stops working on its own — see `until` in
 * cleanInvite — and the person holding it has no way of knowing that unless
 * whoever sent it remembered to say so in the message. So the deadline rides
 * in the link and the door counts it down.
 *
 * THE DEADLINE TRAVELS AND THE CODE DOES NOT. That is not an oversight, it is
 * the rule the note above this one is about: a code in an address is a code
 * that lets in whoever was forwarded the link. A deadline opens nothing.
 *
 * IT IS NOT AUTHORITY EITHER. Edit the query and you get a wrong clock; the
 * row is what the door checks, and it stops on time whatever this says. The
 * only person who can fool themselves with it is the person holding it.
 *
 * Seconds, because a countdown that moves is a countdown somebody believes,
 * and one that says "2 days" reads as a rounding of something nobody checked.
 * ------------------------------------------------------------------------- */
const UNTIL = (() => {
  // Seconds since 1970 — see the note in invite.mjs on why not an ISO string.
  const n = Number(new URLSearchParams(location.search).get("t"));
  return Number.isFinite(n) && n > 0 ? n * 1000 : 0;
})();

function tick() {
  if (!UNTIL) return;
  const box = $("clock");
  box.hidden = false;
  const left = UNTIL - Date.now();
  if (left <= 0) {
    box.className = "clock gone";
    $("clocklab").textContent = "";
    $("clockleft").textContent = T("door.clockGone");
    return;
  }
  // Days folded into hours on purpose: 71:59:58 is one number going down,
  // and "2d 23h 59m 58s" is four of them doing it at different speeds.
  const s = Math.floor(left / 1000);
  const two = (n) => String(n).padStart(2, "0");
  box.className = "clock" + (left < 6 * 3600e3 ? " low" : "");
  $("clocklab").textContent = T("door.clockLab");
  $("clockleft").textContent =
    two(Math.floor(s / 3600)) + ":" + two(Math.floor(s / 60) % 60) + ":" + two(s % 60);
}

function drawBoxes() {
  const box = $("boxes");
  box.textContent = "";
  for (let i = 0; i < 6; i++) {
    const cell = document.createElement("i");
    cell.textContent = TYPED[i] || "";
    if (TYPED[i]) cell.className = ERR && i === TYPED.length - 1 ? "err" : "on";
    else if (i === TYPED.length) cell.className = "next";
    box.append(cell);
  }
  $("go").disabled = TYPED.length !== 6;
}

$("code").addEventListener("input", (e) => {
  TYPED = String(e.target.value || "").toUpperCase().replace(/[^A-Z0-9]/g, "").slice(0, 6);
  e.target.value = TYPED;
  ERR = false;
  $("said").hidden = true;
  drawBoxes();
  // Six characters and nothing else to do: send it rather than making somebody
  // find a button they can already see the answer to.
  if (TYPED.length === 6) enter();
});
$("boxes").addEventListener("click", () => $("code").focus());

async function enter() {
  const btn = $("go");
  const said = $("said");
  btn.disabled = true;
  btn.textContent = T("door.going");
  try {
    const r = await fetch("/api/enter", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ code: TYPED, device }),
    });
    const d = await r.json().catch(() => ({}));
    /* A WAITING PERSON'S WAY BACK, not a way in. The server has already put
       their row on this browser and given it the cookie; the room is where
       their card is, so that is where they go. No "you are in" screen — they
       are not in, and telling them so for a second before the page changes
       would be the wrong thing to have said. */
    if (r.ok && d.waiting) { location.assign("/room"); return; }
    /* A MEMBER'S WAY BACK, and the same reasoning: they are already in, their
       rows are already on this browser, and the "you are in" screen is written
       for somebody arriving for the first time. Straight to the board. */
    if (r.ok && d.back) { location.assign("/browse"); return; }
    if (r.ok) return showIn(d.by || "");
    /* THE RIGHT CODE AT THE WRONG DOOR. Somebody who was sent a piece of work
       and landed here types the only code they have. Take them to it rather
       than telling them it is wrong — there is nothing for them to do on this
       screen, and the offer's own page is where accepting happens. */
    /* THIS BROWSER IS ALREADY SOMEBODY. A way-back code moves one person onto
       the browser that types it, and this browser already has a person on it —
       almost always a shared phone, occasionally somebody who got back in on
       this device an hour ago and forgot. Said plainly, because "wrong code"
       would send them looking for a better code that does not exist. */
    if (d.error === "taken") {
      said.hidden = false;
      said.classList.add("bad");
      said.textContent = T("door.backTaken");
      return;
    }
    if (d.error === "offer" && d.code) {
      said.hidden = false;
      said.className = "said";
      said.textContent = T("door.isOffer");
      location.assign("/o/" + encodeURIComponent(d.code));
      return;
    }
    ERR = true;
    drawBoxes();
    said.hidden = false;
    said.className = "said bad";
    /* Each refusal says the thing worth knowing. "Used" is the one that needs
       a second sentence, because the commonest cause of it is the same person
       in a different browser — which is a key problem, not an invite one. */
    said.textContent = d.error === "used" ? T("door.used")
      // Expired is its own answer — see door.over. It is the right code.
      : d.error === "over" ? T("door.over")
      : d.error === "slow-down" ? T("door.slow")
      : T("door.wrong", { n: Number(d.left) || 0 });
  } catch {
    said.hidden = false;
    said.className = "said bad";
    said.textContent = T("door.offline");
  }
  btn.disabled = TYPED.length !== 6;
  btn.textContent = T("door.go");
}

/* Been here before: the key is the identity, so pasting it admits the browser
   without spending anybody's code. */
async function useKey() {
  const said = $("keysaid");
  const val = String($("key").value || "").trim();
  if (!val) return;
  try { localStorage.setItem("board:device", val); } catch { /* private window */ }
  device = val;
  const r = await fetch("/api/admitted", { headers: { "x-board-device": device } })
    .then((x) => x.json()).catch(() => ({}));
  said.hidden = false;
  if (r && r.in) return showIn("");
  said.className = "said bad";
  said.textContent = T("door.keyNo");
}

function showIn(by) {
  $("wx").hidden = true;
  $("door").hidden = true;
  $("listwrap").hidden = true;
  /* AND THE GREETING, which is for somebody arriving. A member who taps a
     greet link — a forwarded one, or their own, to see what it looks like —
     is not arriving, and being welcomed in by name as though they were is
     worse than not being greeted at all. */
  $("hello").hidden = true;
  try { window.speechSynthesis.cancel(); } catch { /* nothing to stop */ }
  $("inside").hidden = false;
  /* Back where they were turned away from, if they were turned away from
     somewhere. Somebody sent to the door by pressing Post should land on the
     page they were reading, not at the top of the board. */
  try {
    const back = new URLSearchParams(location.search).get("back") || "";
    if (/^\/[A-Za-z0-9/_-]{0,60}$/.test(back)) $("ingo").href = back;
  } catch { /* the default is /browse */ }
  $("insub").textContent = by ? T("door.byWho", { who: by }) : T("door.inSub");
  window.scrollTo(0, 0);
}

/* WHO LEFT THIS, AND FOR WHOM.
 *
 * Both are plain text in the address, typed by whoever made the link. They
 * are a greeting and nothing more: no name in a URL is a claim about anybody,
 * and the six characters remain the only thing that opens anything. Trimmed
 * hard and set as text rather than markup, because a name in an address is
 * written by a stranger.
 */
function nameFrom(key) {
  try {
    const v = new URLSearchParams(location.search).get(key) || "";
    return v.replace(/[<>&"'\\]/g, "").trim().slice(0, 24);
  } catch { return ""; }
}
const FOR = nameFrom("for");
const FROM = nameFrom("from");

/* WHAT THE VOICE SAYS. Built here rather than fetched: it is four facts and a
   name, it must work with no network left, and a message about a private
   board should not need a request to a server to be read out. */
function message() {
  return [
    FOR ? T("hi.spokeName", { who: FOR }) : T("hi.spoke"),
    FROM ? T("hi.spokeFrom", { who: FROM }) : "",
    T("hi.spokeWhat"),
    T("hi.spokeHow"),
  /* Chinese sentences carry their own full stop and take no space after it;
     English needs one. Joining with the wrong one is the sort of thing that
     makes a welcome look machine-made. */
  ].filter(Boolean).join(lang() === "zh" ? "" : " ");
}

/* READ ALOUD BY THE BROWSER'S OWN VOICE.
 *
 * No vendor, no key, no audio leaving the phone, and it speaks Chinese. It
 * sounds like a phone rather than like a person, which is the honest register
 * for a machine reading a message anyway.
 *
 * The words go on screen at the same moment, every time. A voice is no use on
 * a phone that is on silent, on a train, or to somebody who did not expect
 * sound — and on the browsers where speech is missing altogether, reading it
 * is the whole feature rather than a fallback. */
let SPEAKING = false;
function hearIt() {
  const orb = $("orb");
  const said = $("hellospoke");
  said.hidden = false;
  said.textContent = message();

  let synth = null;
  try { synth = window.speechSynthesis; } catch { synth = null; }
  if (!synth) return;
  if (SPEAKING) { synth.cancel(); SPEAKING = false; orb.className = "orb"; return; }

  try {
    const u = new SpeechSynthesisUtterance(message());
    u.lang = lang() === "zh" ? "zh-CN" : "en-GB";
    u.rate = 0.98;
    u.onend = () => { SPEAKING = false; orb.className = "orb"; };
    u.onerror = () => { SPEAKING = false; orb.className = "orb"; };
    synth.cancel();
    synth.speak(u);
    SPEAKING = true;
    orb.className = "orb on";
  } catch { /* the words are on screen either way */ }
}

/* WeChat first, always. The code works in there and the profile built
   afterwards would be stranded in a browser nobody opens on purpose — the
   same split the recovery key exists to undo, and cheaper to prevent.
 *
 * And the greeting before the door, when the link carried a name. It is not a
 * second page: accepting swaps it for the six boxes on the same screen, so
 * there is no navigation to lose somebody in. Nobody without a name in their
 * link sees it at all — a "Welcome." to somebody nobody greeted is worse than
 * arriving at the lock. */
function route() {
  const wx = IN_WECHAT && !sessionStorage.getItem("board:anyway") && !PREVIEW;
  const greet = !wx && !PREVIEW && (FOR || FROM) && !sessionStorage.getItem("board:greeted");
  $("wx").hidden = !wx;
  $("hello").hidden = !greet;
  $("door").hidden = wx || greet;
  // With the wall and with the door. Not under the greeting, which is a
  // welcome to somebody who was named in a link and already has a code.
  $("listwrap").hidden = greet;
  if (!wx && !greet) setTimeout(() => $("code").focus(), 60);
}

$("orb").addEventListener("click", hearIt);
$("helloaccept").addEventListener("click", () => {
  try { window.speechSynthesis.cancel(); } catch { /* nothing to stop */ }
  sessionStorage.setItem("board:greeted", "1");
  route();
});

function words() {
  /* Not "not public yet" — somebody looking at this screen is looking at the
     lock itself, and the strip above it should say the same thing the lock
     does. */
  $("invite").textContent = T("inv.locked");
  $("wxtitle").textContent = T("door.wxTitle");
  $("wxsub").textContent = T("door.wxSub");
  $("wxsay").textContent = T("door.wxSay");
  $("wxzh").textContent = T("door.wxZh");
  $("wxstep1").textContent = T("door.wxStep1");
  $("wxstep2").textContent = T("door.wxStep2");
  $("wxcopy").textContent = T("door.wxCopy");
  $("wxnote").textContent = T("door.wxNote");
  $("wxanyway").textContent = T("door.wxAnyway");

  $("hellotag").textContent = FROM ? T("hi.tagFrom", { who: FROM }) : T("hi.tag");
  $("hellolead").textContent = FOR ? T("hi.leadName", { who: FOR }) : T("hi.lead");
  $("hellounder").textContent = T("hi.under");
  $("helloor").firstElementChild.textContent = T("hi.or");
  $("helloaccept").textContent = T("hi.accept");
  $("hellonote").textContent = T("hi.note");
  /* The spoken words follow the language too — somebody who switches after
     hearing it in English should not be reading English underneath. */
  if (!$("hellospoke").hidden) $("hellospoke").textContent = message();

  $("doortitle").textContent = T("door.title");
  $("doorsub").textContent = T("door.sub");
  $("doorsay").textContent = T("door.say");
  $("doorzh").textContent = T("door.zh");
  $("go").textContent = T("door.go");
  $("doornote").textContent = T("door.note");
  $("code").setAttribute("aria-label", T("door.title"));

  // The clock carries two words of its own and they are in both languages.
  if (UNTIL) tick();

  $("sititle").textContent = T("in.title");
  $("sisay").textContent = T("in.body");
  $("simail").placeholder = T("mail.ph");
  $("sigo").textContent = T("in.send");

  $("keyopen").textContent = T("door.keyOpen");
  $("listopen").textContent = T("door.noCode");
  $("keywhere").textContent = T("door.keyWhere");
  $("keytitle").textContent = T("door.keyTitle");
  $("keysay").textContent = T("door.keySay");
  $("key").placeholder = T("door.keyHint");
  $("keygo").textContent = T("door.keyGo");

  $("intitle").textContent = T("door.inTitle");
  $("insub").textContent = T("door.inSub");
  $("insay").textContent = T("door.inSay");
  $("inzh").textContent = T("door.inZh");
  $("ingo").textContent = T("door.inGo");
  $("innote").textContent = T("door.inNote");
  $("inkey").textContent = T("door.inKey");
  drawBoxes();
}

$("go").addEventListener("click", () => { if (TYPED.length === 6) enter(); });
/* SIGNING IN AT THE DOOR.
 *
 * Same two steps as the sheet inside — address, then the six digits that come
 * back to it — and the same reason for being here rather than only in there:
 * the person who needs this screen is the one who did not save a key, and in
 * "read" mode this page is the only one they can reach.
 *
 * On the way through the server sets the admission cookie, so a member who
 * signs in is admitted without spending anybody's code. That is not a hole:
 * they were admitted once already, and the invite row that says so moves with
 * them — see rebind. */
let SISTEP = "mail", SIMAIL = "";

function siSaid(msg, bad) {
  const said = $("sisaid");
  said.hidden = false;
  said.className = bad ? "said bad" : "said";
  said.textContent = msg;
}

async function signIn() {
  $("sigo").disabled = true;
  try {
    if (SISTEP === "mail") await siAsk();
    else await siSpend();
  } finally {
    $("sigo").disabled = false;
  }
}

async function siAsk() {
  const mail = String($("simail").value || "").trim().toLowerCase();
  if (!/^[^@\s]+@[^@\s]+\.[a-z]{2,}$/.test(mail)) return siSaid(T("mail.bad"), true);
  let r;
  try {
    r = await fetch("/api/signin", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ mail }),
    });
  } catch { return siSaid(T("door.offline"), true); }
  if (r.status === 503) return siSaid(T("in.off"), true);
  if (!r.ok) return siSaid(T("door.offline"), true);
  /* On to the digits whether or not anybody here uses that address: the server
     will not say which, and the line under the box is true either way. */
  SISTEP = "code";
  SIMAIL = mail;
  $("sititle").textContent = T("in.codeTitle");
  $("sisay").textContent = T("in.codeBody", { mail });
  $("simail").hidden = true;
  $("sicode").hidden = false;
  $("sigo").textContent = T("in.go");
  siSaid(T("in.sent"), false);
  $("sicode").focus();
}

async function siSpend() {
  const code = String($("sicode").value || "").replace(/\D/g, "").slice(0, 6);
  if (code.length !== 6) return siSaid(T("in.bad"), true);
  let r, d;
  try {
    r = await fetch("/api/signin/code", {
      method: "POST", headers: { "Content-Type": "application/json" },
      // `over` is always yes here: nobody standing at the door has a profile
      // in this browser — that is the one case this page is for.
      body: JSON.stringify({ mail: SIMAIL, code, device, over: "yes" }),
    });
    d = await r.json().catch(() => ({}));
  } catch { return siSaid(T("door.offline"), true); }
  if (!r.ok) {
    if (d.error === "old") return siSaid(T("in.old"), true);
    if (d.error === "spent") return siSaid(T("in.spent"), true);
    return siSaid(Number(d.left) > 0 ? T("in.left", { n: d.left }) : T("in.bad"), true);
  }
  /* The key, and this page is the only place it will ever exist — the server
     keeps a salted hash of it and never the line. Written before anything is
     said on screen, for that reason. */
  try { localStorage.setItem("board:device", d.key); } catch { /* private window */ }
  device = d.key;
  siSaid(T("in.done", { who: d.handle || "" }), false);
  /* Somebody on the waiting list is not being let in — they are being given
     their place back. This door has nothing to show them; their card does. */
  if (d.where) { setTimeout(() => location.replace(d.where), 700); return; }
  showIn("");
}

$("sigo").addEventListener("click", signIn);
$("sicode").addEventListener("keydown", (e) => {
  if (e.key === "Enter") { e.preventDefault(); signIn(); }
});
$("simail").addEventListener("keydown", (e) => {
  if (e.key === "Enter") { e.preventDefault(); signIn(); }
});

$("keygo").addEventListener("click", useKey);
/* Built on the first press rather than on load: it asks the server for the
   number waiting, and a door nobody has knocked on should not be making
   requests on behalf of a person who has a code in their hand. */
$("listopen").addEventListener("click", () => {
  const box = $("listbox");
  box.hidden = !box.hidden;
  $("listopen").setAttribute("aria-expanded", String(!box.hidden));
  if (box.hidden || $("waitslot").firstChild) return;
  $("waitslot").append(waitBox());
});

/* ARRIVED ASKING FOR IT. The join form sends somebody already on the list
   here with ?in=1 — see waitBox — and a link that lands them on a page and
   then asks them to find the right fold has done half its job. Read before
   anything else runs, for the same reason CAME_TO_EDIT is on the board. */
if (new URLSearchParams(location.search).get("in") === "1") {
  const box = $("keybox");
  if (box) {
    box.hidden = false;
    $("keyopen").setAttribute("aria-expanded", "true");
    setTimeout(() => $("simail")?.focus({ preventScroll: true }), 200);
  }
}

$("keyopen").addEventListener("click", () => {
  const box = $("keybox");
  box.hidden = !box.hidden;
  $("keyopen").setAttribute("aria-expanded", String(!box.hidden));
  if (!box.hidden) $("key").focus();
});
$("wxcopy").addEventListener("click", () => {
  const url = location.origin + "/enter";
  let ok = false;
  try {
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(url); ok = true;
    } else {
      const t = document.createElement("textarea");
      t.value = url; t.style.position = "fixed"; t.style.opacity = "0";
      document.body.append(t); t.select();
      ok = document.execCommand("copy");
      t.remove();
    }
  } catch { ok = false; }
  $("wxcopy").textContent = T(ok ? "door.wxCopied" : "door.wxCopyNo");
  setTimeout(() => { $("wxcopy").textContent = T("door.wxCopy"); }, 2600);
});
$("wxanyway").addEventListener("click", () => {
  try { sessionStorage.setItem("board:anyway", "1"); } catch { /* fine */ }
  route();
});

/* Every second, and drawn once before the first one so the line does not
   arrive a beat after the page. Nothing else on this page is on a timer. */
if (UNTIL) { tick(); setInterval(tick, 1000); }

setLang(pickLang());
$("invite").after(langButton(() => words()));
words();
route();


/* ALREADY IN, AND SHOULD NOT HAVE SEEN THIS AT ALL.
 *
 * Two people land here who are already admitted: somebody who pasted their
 * recovery key, and — the case that matters tonight — everybody who was using
 * the board before there was a door. They were let through in the file, but a
 * page request carries no localStorage, so the server had nothing to recognise
 * them by and served them the door.
 *
 * The check below is what recognises them: it sends the browser's own id, and
 * the server hands back a cookie. So the fix is to reload rather than to say
 * "you are in" — with the cookie set, the address they actually asked for is
 * served, and the door was a flicker instead of a wall.
 *
 * Once, guarded by a flag: if the cookie cannot be stored, a reload that lands
 * back here would otherwise loop for ever, and a door is a better failure than
 * a spinning page.
 */
fetch("/api/admitted", { headers: { "x-board-device": device } })
  .then((r) => r.json())
  .then((d) => {
    if (PREVIEW) return;
    if (!d || !d.in || !d.mode) return;
    let tried = "";
    try { tried = sessionStorage.getItem("board:doorloop") || ""; } catch { /* fine */ }
    if (tried) return showIn("");
    try { sessionStorage.setItem("board:doorloop", "1"); } catch { /* fine */ }
    location.reload();
  })
  .catch(() => { /* the door still works */ });
</script>
