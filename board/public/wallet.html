<!doctype html>
<html lang="en" data-lang="en">
<head>
<meta charset="utf-8">
<!-- Empty on every deployment but the demo board. See BOARD_DEMO_DEVICE in server.js. -->
{{DEMO}}
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#EEF0F4">
<meta name="theme-color" content="#0B0E15" media="(prefers-color-scheme: dark)">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<title>Wallet · The Exchange</title>
<style>
  /* THE WALLET. One page, many screens, because every step of paying somebody
     is a screen of its own and a phone's back gesture should walk back through
     them. The screen lives in the hash — #send, #activity/transfer/tr_… — so a
     reload, or coming back from the provider's page, lands where you were.

     The palette is site.css's, copied the way notes.html copies it, with one
     colour of its own: money. Everything that moves money is that colour, and
     nothing else on the page is. */
  :root{
    --paper:#EEF0F4; --raise:#F7F8FB; --card:#FCFCFD; --ink:#151B28; --ink-2:#4E5968;
    --muted:#6E7789; --line:#E3E6EC; --hair:#EAECF1;
    --accent:#3F68D8; --accent-ink:#FFFFFF; --accent-soft:#E8ECF7;
    /* MONEY IS INK, NOT A COLOUR. It was a burnt orange, and on a screen
       whose whole job is one number a coloured slab competes with the number
       for the only glance anybody gives it. Black on white reads as serious
       where a colour reads as promotional, and nothing here needs selling.
       Kept as its own token rather than folded into --ink so the day
       something does need a colour, it changes in one place. */
    --money:#14161A; --money-ink:#FFFFFF; --money-soft:#EFF0F2;
    --good:#1F8A57; --good-soft:#E3F4EA; --bad:#C7394E; --bad-soft:#FBE7EA; --warn-soft:#FFF4DB;
    --serif:Georgia,"Songti SC","Noto Serif CJK SC","Times New Roman",serif;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --paper:#0B0E15; --raise:#141924; --card:#1B212D; --ink:#E9EDF5; --ink-2:#A3B0C4;
      --muted:#8592A6; --line:#232B39; --hair:#1E2531;
      --accent:#5C8DFF; --accent-ink:#0B0E15; --accent-soft:#18233D;
      --money:#F3F5F7; --money-ink:#0B0C0E; --money-soft:rgba(255,255,255,.10);
      --good:#4EBE88; --good-soft:#12261C; --bad:#F0687C; --bad-soft:#2C1519; --warn-soft:#2A2414;
    }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
  button{font:inherit;color:inherit}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  [hidden]{display:none!important}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
  main{max-width:34rem;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column}
  .top{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:.3rem;padding:calc(.6rem + env(safe-area-inset-top)) .6rem .55rem;
    background:var(--paper);border-bottom:1px solid var(--hair)}
  .top h1{flex:1;margin:0;font-family:var(--serif);font-weight:400;font-size:1.2rem;text-align:center;line-height:1.25}
  .top h1:focus{outline:none}
  .ib{width:2.75rem;height:2.75rem;border:0;background:transparent;border-radius:50%;display:grid;place-items:center;cursor:pointer;color:var(--ink-2)}
  .ib svg{width:1.3rem;height:1.3rem;stroke:currentColor;fill:none;stroke-width:2}
  .ib.hide{visibility:hidden}
  /* The language switch. site.css styles .lang for the board's pages; this
     page loads no stylesheet at all, so it carries its own copy. */
  .lang{border:1px solid var(--line);background:var(--raise);color:var(--ink-2);
    border-radius:99px;padding:.3rem .6rem;font-size:.8rem;cursor:pointer;line-height:1}
  .lang:hover{color:var(--ink);border-color:var(--muted)}
  .dev{margin:.6rem 1rem 0;border-radius:10px;padding:.5rem .7rem;font-size:.86rem;background:var(--warn-soft);border:1px solid var(--line)}
  .screen{flex:1;padding:1rem 1rem calc(2rem + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:.9rem}
  p{margin:0}
  .lead{color:var(--ink-2)}
  .small{font-size:.88rem;color:var(--muted)}
  .k{font-size:.82rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600;margin:.3rem 0 -.3rem}
  .hero{font-family:var(--serif);font-size:1.6rem;line-height:1.2;font-weight:400;text-wrap:balance}
  .center{text-align:center}
  .list{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
  .row{display:flex;align-items:center;gap:.75rem;width:100%;min-height:3.4rem;padding:.7rem .85rem;border:0;border-top:1px solid var(--hair);background:transparent;text-align:left}
  .row:first-child{border-top:0}
  button.row{cursor:pointer}
  .row .m{flex:1;min-width:0}
  .row .m b{display:block;font-weight:600}
  .row .m span{display:block;font-size:.88rem;color:var(--ink-2)}
  .row .e{font-size:.94rem;color:var(--ink-2);text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
  .row .e.in{color:var(--good)}
  .row[aria-checked="true"]{background:var(--accent-soft)}
  .chev{width:1rem;height:1rem;stroke:var(--muted);fill:none;stroke-width:2;flex:0 0 auto}
  .tick{width:1.2rem;height:1.2rem;stroke:var(--accent);fill:none;stroke-width:2.6;visibility:hidden;flex:0 0 auto}
  .row[aria-checked="true"] .tick{visibility:visible}
  .badge{width:2.4rem;height:2.4rem;border-radius:.7rem;display:grid;place-items:center;flex:0 0 auto;background:var(--raise);border:1px solid var(--line);font-size:.78rem;font-weight:700;color:var(--ink-2)}
  .badge.face{border-radius:50%;border:0;color:#fff;font-size:1rem;background:linear-gradient(150deg,#AFC0D8,#5E6FA3)}
  .badge.money{background:var(--money-soft);color:var(--money);border-color:transparent}
  .btn{display:block;width:100%;border:0;border-radius:12px;padding:.9rem 1rem;font-size:1rem;font-weight:700;cursor:pointer;background:var(--accent);color:var(--accent-ink);text-align:center;text-decoration:none}
  .btn.money{background:var(--money);color:var(--money-ink)}
  .btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line);font-weight:600}
  .btn.danger{background:var(--card);color:var(--bad);border:1px solid var(--line);font-weight:600}
  .btn[disabled]{opacity:.45;cursor:not-allowed}
  .stack{display:grid;gap:.55rem}
  .push{margin-top:auto;display:grid;gap:.55rem}
  .note{border-radius:12px;padding:.7rem .8rem;font-size:.94rem;border:1px solid var(--line)}
  .note.info{background:var(--accent-soft)} .note.warn{background:var(--money-soft)} .note.bad{background:var(--bad-soft)} .note.good{background:var(--good-soft)}
  .field{display:grid;gap:.3rem}
  .field label{font-size:.94rem;font-weight:600}
  .field input,.field select{font:inherit;font-size:1rem;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:.7rem .75rem;width:100%}
  .field .hint{font-size:.85rem;color:var(--muted)}
  .check{display:flex;gap:.6rem;align-items:flex-start;font-size:.96rem}
  .check input{width:1.2rem;height:1.2rem;margin-top:.15rem;accent-color:var(--accent)}
  .sum{display:grid;border-top:1px solid var(--hair)}
  .sum div{display:flex;justify-content:space-between;gap:1rem;padding:.6rem 0;border-bottom:1px solid var(--hair)}
  .sum div > span:first-child{color:var(--ink-2)}
  .sum div > span:last-child{text-align:right;font-variant-numeric:tabular-nums}
  .sum .tot > span{font-weight:700;color:var(--ink)!important}
  .big{font-size:2.3rem;font-weight:700;text-align:center;font-variant-numeric:tabular-nums;line-height:1.15;margin:0}
  /* NO SLAB. The number sat on a coloured panel, which drew the eye to the
     panel. It sits on the page now, left-aligned, with nothing beside it —
     the loudest thing on the screen by size rather than by colour. */
  .balance{padding:.6rem .15rem 1.4rem}
  .balance p{margin:0 0 .45rem;font-size:.78rem;letter-spacing:.11em;text-transform:uppercase;color:var(--muted)}
  .balance .v{font-size:3.3rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1;letter-spacing:-.035em;color:var(--ink)}
  .balance p+p{margin-top:.75rem;font-size:.9rem;letter-spacing:0;text-transform:none;color:var(--muted)}
  /* ---- THE DEALS COLUMN -------------------------------------------------
     A COLUMN OF SUMMARIES THAT DROP DOWN. Every deal is one line until it is
     asked about, and then it opens where it stands rather than pushing the
     reader onto another screen. It is the same shape as the rest of the
     product — a list of rows, a row opens — with the difference that the
     reader never loses their place in the column.

     NATIVE <details>, NOT A DIV AND A CLICK HANDLER. It is open and closed to
     a screen reader without being told, it works from the keyboard, the
     browser draws the marker, and it survives a repaint with the right rows
     still open. Hand-rolling it costs all four. */
  .deal{border-bottom:1px solid var(--line)}
  .deal>summary{list-style:none;cursor:pointer;display:grid;
    grid-template-columns:1fr auto;gap:.1rem .8rem;align-items:baseline;
    padding:.85rem .1rem}
  .deal>summary::-webkit-details-marker{display:none}
  .deal>summary:focus-visible{outline:2px solid var(--money);outline-offset:2px;border-radius:.5rem}
  /* ONE LINE PER DEAL. "Beijing producer → Melbourne post house" wrapped onto
     two and shoved the figure down with it, so a column of deals stopped
     being a column you can run your eye down — which is the only thing this
     shape is for. min-width:0 is the half people forget: without it a grid
     track refuses to shrink below its content and the ellipsis never fires. */
  .deal .who{font-weight:650;min-width:0;overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap}
  /* THE FIGURE IS WHAT CAME IN, because that is the number somebody
     recognises a deal by — it is the one they agreed and the one they
     remember. The margin is what they came to find out and it is inside. */
  .deal .fig{font-variant-numeric:tabular-nums;font-weight:650}
  .deal .meta{grid-column:1/-1;font-size:.8rem;color:var(--muted);
    display:flex;align-items:center;gap:.4rem}
  /* THE MARKER TURNS, AND IT IS THE ONLY MOVING THING ON THE SCREEN. A column
     that opens with no sign of having opened reads as the page having jumped. */
  .deal .caret{display:inline-block;transition:transform .15s ease;color:var(--muted)}
  .deal[open] .caret{transform:rotate(90deg)}
  @media (prefers-reduced-motion:reduce){.deal .caret{transition:none}}
  .deal .inner{padding:.1rem .1rem 1rem}
  .dline{display:flex;justify-content:space-between;gap:1rem;
    padding:.42rem 0;font-size:.92rem}
  .dline span:first-child{color:var(--muted)}
  .dline span:last-child{font-variant-numeric:tabular-nums;text-align:right}
  /* THE MARGIN IS THE ONE LINE WORTH LIFTING, and it is lifted by weight and
     a rule rather than by a colour — it is a figure, not a status. */
  .dline.gap{border-top:1px solid var(--line);margin-top:.3rem;padding-top:.6rem;
    font-weight:700}
  .dline.gap span:first-child{color:var(--ink)}
  /* WHAT IS OWED ON PAPER. Two marks, scannable down the column. */
  .dpaper{display:flex;gap:.4rem;flex-wrap:wrap;margin:.7rem 0 0}
  .dchip{font-size:.66rem;letter-spacing:.1em;text-transform:uppercase;
    padding:.16rem .55rem;border-radius:999px;background:var(--line);color:var(--ink-2)}
  .dchip.ok{background:rgba(63,190,125,.16);color:#2E9E68}
  .dchip.no{background:rgba(217,83,79,.15);color:#C4635F}
  .acts{display:grid;grid-template-columns:repeat(2,1fr);gap:.6rem}
  /* Full-width pills, the two things anybody came to do. The icon went: a
     word and an arrow in a row this wide is one thing too many. */
  .act{border:0;background:var(--money);color:var(--money-ink);border-radius:999px;
    padding:1.05rem .6rem;display:flex;align-items:center;justify-content:center;gap:.4rem;
    cursor:pointer;font-size:1.02rem;font-weight:700}
  .act:last-child{background:var(--raise);color:var(--ink)}
  .act svg{width:1.05rem;height:1.05rem;stroke:currentColor;fill:none;stroke-width:2.2}
  .act[disabled]{opacity:.45;cursor:not-allowed}
  .amountbox{display:flex;align-items:baseline;justify-content:center;gap:.35rem}
  .amountbox label{font-size:1.5rem;font-weight:600;color:var(--ink-2)}
  .amountbox input{width:8ch;border:0;background:transparent;color:var(--ink);font:inherit;font-size:2.6rem;font-weight:700;padding:0;font-variant-numeric:tabular-nums}
  .amountbox input:focus{outline:none;box-shadow:0 2px 0 var(--accent)}
  .keys{display:grid;grid-template-columns:repeat(3,1fr);gap:.4rem}
  .keys button{border:1px solid var(--hair);border-radius:12px;background:var(--card);font-size:1.35rem;padding:.55rem 0;cursor:pointer;font-variant-numeric:tabular-nums}
  .timeline{list-style:none;margin:0;padding:0}
  .timeline li{position:relative;padding:0 0 .9rem 1.6rem}
  .timeline li::before{content:"";position:absolute;left:.35rem;top:.35rem;width:.6rem;height:.6rem;border-radius:50%;background:var(--good)}
  .timeline li.bad::before{background:var(--bad)}
  .timeline li::after{content:"";position:absolute;left:.62rem;top:1rem;bottom:0;width:2px;background:var(--hair)}
  .timeline li:last-child::after{display:none}
  .timeline b{display:block}
  .timeline span{font-size:.88rem;color:var(--ink-2)}
  .pill{display:inline-block;font-size:.82rem;font-weight:600;border-radius:99px;padding:.1rem .55rem;background:var(--good-soft);color:var(--good)}
  .pill.wait{background:var(--money-soft);color:var(--money)} .pill.bad{background:var(--bad-soft);color:var(--bad)}
  .spin{width:2.4rem;height:2.4rem;border-radius:50%;border:3px solid var(--line);border-top-color:var(--accent);margin:2.5rem auto .5rem;animation:sp 1s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  .done{width:3.6rem;height:3.6rem;border-radius:50%;display:grid;place-items:center;margin:1rem auto .2rem;background:var(--good-soft);color:var(--good)}
  .done svg{width:1.9rem;height:1.9rem;stroke:currentColor;fill:none;stroke-width:2.6}
  .seg{display:flex;gap:.4rem}
  .chip{font-size:.9rem;font-weight:600;border:1px solid var(--line);background:var(--card);border-radius:99px;padding:.4rem .8rem;cursor:pointer}
  .chip[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
  .scrim{position:fixed;inset:0;background:rgba(11,14,21,.45);z-index:40}
  .sheet{position:fixed;left:50%;transform:translateX(-50%);bottom:0;z-index:41;width:100%;max-width:34rem;background:var(--card);border-radius:18px 18px 0 0;
    padding:1rem 1rem calc(1.1rem + env(safe-area-inset-bottom));display:grid;gap:.7rem}
  .sheet h2{margin:0;font-family:var(--serif);font-weight:400;font-size:1.2rem;text-align:center}
  @media (prefers-reduced-motion:reduce){.spin{animation:none}}
</style>
</head>
<body>
<main>
  <div class="top">
    <button class="ib hide" type="button" id="back"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 19l-7-7 7-7"/></svg></button>
    <h1 id="title" tabindex="-1"></h1>
    <span id="langslot"></span>
    <button class="ib hide" type="button" id="act"><svg viewBox="0 0 24 24" aria-hidden="true" id="acticon"></svg></button>
  </div>
  <p class="dev" id="dev" role="note" hidden></p>
  <p class="dev" id="demobar" hidden></p>
  <div class="screen" id="screen"><div class="spin" role="img" aria-label="Loading"></div></div>
</main>
<div id="overlay"></div>
<div class="sr" role="status" aria-live="polite" id="live"></div>

<script type="module">
/* The wallet's screens, over the wallet API (board/lib/wallet/routes.js).
   A screen is a function returning { title, body, back?, action? }; the hash
   is the address; the server is the only thing that decides anything. */

/* BOTH LANGUAGES, AND THE SAME ONE THE REST OF THE BOARD IS IN.
   pickLang reads the choice this reader already made on /notes or the door
   before falling back to the browser, so arriving at the wallet does not
   silently put somebody back into English. Set before the first paint,
   because every screen below reads T at draw time. */
import { T, STRINGS, lang, setLang, pickLang, langButton } from "/i18n.js";
setLang(pickLang());

const $ = (id) => document.getElementById(id);
let device = "";
try { device = localStorage.getItem("board:device") || ""; } catch { /* private window */ }

function h(tag, attrs, ...kids) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v === false || v == null) continue;
    if (k === "class") n.className = v; else if (k === "text") n.textContent = v;
    else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v === true ? "" : v);
  }
  for (const c of kids.flat()) if (c != null && c !== false) n.append(c instanceof Node ? c : document.createTextNode(c));
  return n;
}
const ICON = {
  chev: '<path d="M9 5l7 7-7 7"/>', check: '<path d="M5 12.5l4.5 4.5L19 7.5"/>', gear: '<circle cx="12" cy="12" r="3.2"/><path d="M12 2.8v2.4M12 18.8v2.4M4.2 7.5l2.1 1.2M17.7 15.3l2.1 1.2M4.2 16.5l2.1-1.2M17.7 8.7l2.1-1.2"/>',
  send: '<path d="M5 12h14M13 6l6 6-6 6"/>', req: '<path d="M12 5v14M6 13l6 6 6-6"/>', add: '<path d="M12 5v14M5 12h14"/>', out: '<path d="M4 20h16M12 16V4M7 9l5-5 5 5"/>',
};
const svg = (name, cls) => { const s = document.createElementNS("http://www.w3.org/2000/svg", "svg"); s.setAttribute("viewBox", "0 0 24 24"); s.setAttribute("aria-hidden", "true"); if (cls) s.setAttribute("class", cls); s.innerHTML = ICON[name]; return s; };
const say = (t) => { const n = $("live"); n.textContent = ""; setTimeout(() => { n.textContent = t; }, 50); };
const frag = (...k) => { const f = document.createDocumentFragment(); for (const x of k.flat()) if (x) f.append(x); return f; };
const btn = (text, cls, onclick, extra = {}) => h("button", { class: "btn" + (cls ? " " + cls : ""), type: "button", onclick, ...extra, text });
const note = (cls, ...kids) => h("p", { class: "note " + cls }, ...kids);
const badge = (text, cls) => h("span", { class: "badge" + (cls ? " " + cls : ""), "aria-hidden": "true", text });
const face = (name) => badge([...String(name || "?")][0].toUpperCase(), "face");
function row(o) {
  if (!o.onclick && o.radio === undefined) {
    return h("div", { class: "row" }, o.lead, h("span", { class: "m" }, h("b", { text: o.title }), o.sub ? h("span", { text: o.sub }) : null), o.end ? h("span", { class: "e" + (o.in ? " in" : ""), text: o.end }) : null);
  }
  const b = h("button", { class: "row", type: "button", onclick: o.onclick, role: o.radio !== undefined ? "radio" : null, "aria-checked": o.radio !== undefined ? String(o.radio) : null, disabled: o.disabled });
  b.append(...[o.lead, h("span", { class: "m" }, h("b", { text: o.title }), o.sub ? h("span", { text: o.sub }) : null), o.end ? h("span", { class: "e" + (o.in ? " in" : ""), text: o.end }) : null].filter(Boolean));
  b.append(o.radio !== undefined ? svg("check", "tick") : svg("chev", "chev"));
  return b;
}
const spinner = (label) => frag(h("div", { class: "spin", role: "img", "aria-label": label }), h("p", { class: "center lead", text: label }));

/* ---- talking to the server ---- */
class ApiError extends Error { constructor(status, body) { super(body?.message || "Something went wrong."); this.status = status; this.code = body?.error; } }
async function api(path, body, method) {
  const res = await fetch(path, {
    method: method || (body ? "POST" : "GET"), cache: "no-store",
    headers: { "x-board-device": device, ...(body ? { "Content-Type": "application/json" } : {}) },
    body: body ? JSON.stringify(body) : undefined,
  });
  const d = await res.json().catch(() => ({}));
  if (!res.ok) throw new ApiError(res.status, d);
  return d;
}
let W = null;  // the last /api/wallet
async function load() { W = await api("/api/wallet"); return W; }

/* ---- passkeys: Face ID or the phone's passcode ---- */
const b64u = { enc: (buf) => btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, ""),
  dec: (s) => { s = s.replace(/-/g, "+").replace(/_/g, "/"); while (s.length % 4) s += "="; return Uint8Array.from(atob(s), (c) => c.charCodeAt(0)); } };
const canPasskey = () => Boolean(window.PublicKeyCredential && navigator.credentials);
async function addPasskey() {
  const { challengeId, options: o } = await api("/api/wallet/passkey/options", {});
  const cred = await navigator.credentials.create({ publicKey: {
    ...o, challenge: b64u.dec(o.challenge), user: { ...o.user, id: b64u.dec(o.user.id) },
    excludeCredentials: (o.excludeCredentials || []).map((c) => ({ ...c, id: b64u.dec(c.id) })),
  } });
  const r = cred.response;
  await api("/api/wallet/passkey/register", { challengeId, response: {
    id: cred.id, rawId: b64u.enc(cred.rawId), type: cred.type, clientExtensionResults: cred.getClientExtensionResults(),
    response: { clientDataJSON: b64u.enc(r.clientDataJSON), attestationObject: b64u.enc(r.attestationObject), transports: r.getTransports ? r.getTransports() : [] },
  } });
}
/** A confirmation for exactly this action, or null if the person backed out. */
async function confirmFor(action, ref) {
  if (W.testConfirm && (!canPasskey() || !W.wallet?.passkeys)) return { test: true };
  if (!W.wallet?.passkeys) {
    if (!canPasskey()) throw new ApiError(400, { message: T("wl.noPasskey") });
    await addPasskey(); await load();
  }
  const { challengeId, options: o, needsPasskey } = await api("/api/wallet/confirm/options", { action, ref });
  if (needsPasskey) throw new ApiError(400, { message: T("wl.setFaceFirst") });
  let a;
  try {
    a = await navigator.credentials.get({ publicKey: { ...o, challenge: b64u.dec(o.challenge), allowCredentials: (o.allowCredentials || []).map((c) => ({ ...c, id: b64u.dec(c.id) })) } });
  } catch { return null; }
  const r = a.response;
  return { challengeId, response: { id: a.id, rawId: b64u.enc(a.rawId), type: a.type, clientExtensionResults: a.getClientExtensionResults(),
    response: { clientDataJSON: b64u.enc(r.clientDataJSON), authenticatorData: b64u.enc(r.authenticatorData), signature: b64u.enc(r.signature), userHandle: r.userHandle ? b64u.enc(r.userHandle) : undefined } } };
}
function confirmButton(label, cls, action, ref, run) {
  const words = W.testConfirm && (!canPasskey() || !W.wallet?.passkeys) ? T("wl.confirmTest") : T("wl.confirmFace");
  const b = btn(words, cls, async () => {
    b.disabled = true; const was = b.textContent; b.textContent = T("wl.confirming"); say(T("wl.confirmingSay"));
    try {
      const c = await confirmFor(action, ref);
      if (!c) { b.disabled = false; b.textContent = was; say(T("wl.notConfirmedSay")); return; }
      await run(c);
    } catch (err) { b.disabled = false; b.textContent = was; showError(err); }
  });
  b.setAttribute("aria-label", `${label}. ${words}`);
  return b;
}

/* ---- errors, said where they happened ---- */
let errBox = null;
function showError(err) {
  const msg = err instanceof ApiError ? err.message : T("wl.cantReach");
  if (errBox && document.contains(errBox)) errBox.remove();
  errBox = note("bad", msg);
  errBox.setAttribute("role", "alert");
  $("screen").prepend(errBox);
  $("screen").scrollTop = 0; window.scrollTo(0, 0);
  // Some refusals are a step to take, not a dead end.
  if (err.code === "not_verified") errBox.append(" ", h("button", { type: "button", class: "chip", onclick: () => go("verify"), text: T("wl.confirmIdentity") }));
  if (err.code === "no_payout") errBox.append(" ", h("button", { type: "button", class: "chip", onclick: () => go("payout"), text: T("wl.addBankAccount") }));
  if (err.code === "no_wallet") errBox.append(" ", h("button", { type: "button", class: "chip", onclick: () => go("setup"), text: T("wl.setUp") }));
  if (["quote_expired", "quote_used", "quote_unknown"].includes(err.code)) errBox.append(" ", h("button", { type: "button", class: "chip", onclick: () => history.back(), text: T("wl.checkAmountAgain") }));
}

/* ---- router ---- */
const route = () => { const raw = location.hash.replace(/^#/, ""); const [path, qs] = raw.split("?"); return { parts: (path || "home").split("/"), q: new URLSearchParams(qs || "") }; };
const go = (path) => { location.hash = path; };
const replace = (path) => { history.replaceState(null, "", "#" + path); paint(); };
window.addEventListener("hashchange", () => paint());
$("back").addEventListener("click", () => history.back());

/* Coming back from the provider's own page lands on #…&back=ref; drop that
   and pick up where the person left off. */
function returning() {
  if (!/(^|[#&?])back=/.test(location.hash)) return false;
  const where = sessionStorage.getItem("wallet:return") || "home";
  sessionStorage.removeItem("wallet:return");
  history.replaceState(null, "", "#" + where);
  return true;
}
function leaveFor(url, returnTo) {
  sessionStorage.setItem("wallet:return", returnTo);
  location.assign(url);
}

async function paint() {
  const back = returning();
  const { parts, q } = route();
  const name = parts[0];
  const scr = SCREENS[name] || SCREENS.home;
  $("screen").textContent = "";
  $("screen").append(spinner(T("wl.loading")));
  let out;
  try {
    if (!W || back || scr.fresh !== false) await load();
    out = await scr(parts.slice(1), q);
  } catch (err) {
    if (err instanceof ApiError && err.status === 401) out = { title: T("wl.title"), body: frag(note("info", T("wl.membersOnly")), h("a", { class: "btn ghost", href: "/notes", text: T("wl.backToMessages") })) };
    else if (err instanceof ApiError && err.status === 404) out = { title: T("wl.title"), body: frag(note("info", T("wl.notOnHere"))) };
    else { out = { title: T("wl.title"), body: frag() }; setTimeout(() => showError(err)); }
  }
  $("title").textContent = out.title;
  document.title = `${out.title} · ${T("wl.suffix")}`;
  $("back").classList.toggle("hide", name === "home" || out.noBack);
  const act = $("act");
  if (out.action) { act.classList.remove("hide"); act.setAttribute("aria-label", out.action.label); $("acticon").innerHTML = ICON[out.action.icon]; act.onclick = out.action.run; }
  else { act.classList.add("hide"); act.onclick = null; act.removeAttribute("aria-label"); }
  $("screen").textContent = "";
  $("screen").append(out.body);
  const dev = $("dev");
  dev.hidden = !W || W.provider !== "test";
  dev.textContent = W?.demo
    ? T("wl.devDemo")
    : T("wl.devTest");
  /* THE PUBLIC DEMO: who you're trying it as, and a way to be somebody else.
     Only when the server says this is the demo (lib/wallet/demo.js). */
  const bar = $("demobar");
  bar.hidden = !W?.demo || name === "who";
  if (W?.demo) {
    const me = W.demo.personas.find((p) => p.key === W.demo.as);
    bar.textContent = "";
    bar.append(T("wl.tryingAs", { who: me.handle, role: me.role }), h("button", { type: "button", class: "chip", onclick: () => go("who"), text: T("wl.switchPerson") }));
  }
  $("title").focus({ preventScroll: true });
  window.scrollTo(0, 0);
}

/* ---- words for states ---- */
/* THE WORDS FOR A STATE, LOOKED UP RATHER THAN HELD.
   These were two objects of English built once at load. Read through T they
   have to be read at the moment of drawing, because the language can change
   under a rendered page — see paint(), which redraws on the switch. A frozen
   map would leave a Chinese screen with English state words on it, which is
   exactly the bolted-on-translation tell this file is trying not to have. */
const STEPS = ["sent", "charged", "accepted", "in_review", "paying_out", "completed",
  "declined", "cancelled", "returned", "failed", "payout_failed", "started"];
const step = (k) => (STEPS.includes(k) ? T("wl.st." + k) : k);
const TONE = {
  charging: "wait", waiting: "wait", paying_out: "wait", processing: "wait",
  completed: "", declined: "bad", cancelled: "bad", returned: "bad", failed: "bad",
  payout_failed: "bad", open: "wait", paid: "",
};
const status = (k) => (k in TONE ? [T("wl.stat." + k), TONE[k]] : [k, ""]);
/* A TIME, IN THE LANGUAGE THE PAGE IS IN — not the language the phone is in.
   This passed undefined, which means the browser's locale, and an English
   phone switched to 中文 kept "21 Sep" under every Chinese row. Dates in the
   other language are the tell that a translation was added rather than
   written. */
const when = (iso) => { const d = new Date(iso); const L = lang() === "zh" ? "zh-CN" : undefined; const today = new Date().toDateString() === d.toDateString(); return today ? d.toLocaleTimeString(L, { hour: "2-digit", minute: "2-digit" }) : d.toLocaleDateString(L, { day: "numeric", month: "short" }); };
/* The server names a region in English; this says it in the reader's
   language, and falls back to the server's word for anything it has not
   heard of. */
const regionName = (id, fallback) => (STRINGS["wl.rg." + id] ? T("wl.rg." + id) : fallback || id);
const sym = () => ({ EUR: "€", AUD: "A$", CNY: "¥", HKD: "HK$", USD: "US$" }[W.wallet?.currency] || "");

function amountEntry(initial, onChange, label) {
  let v = initial || "";
  const clean = (s) => { s = String(s).replace(/[^\d.]/g, ""); const i = s.indexOf("."); if (i >= 0) s = s.slice(0, i + 1) + s.slice(i + 1).replace(/\./g, "").slice(0, 2); if (s.length > 1 && s[0] === "0" && s[1] !== ".") s = s.replace(/^0+/, ""); return s.slice(0, 9); };
  const inp = h("input", { id: "amt", inputmode: "decimal", autocomplete: "off", placeholder: "0", "aria-label": label });
  inp.value = v;
  const set = (nv, speak) => { v = clean(nv); inp.value = v; onChange(v); if (speak) say(v || T("wl.zero")); };
  inp.addEventListener("input", () => set(inp.value));
  const keys = h("div", { class: "keys" });
  for (const k of ["1", "2", "3", "4", "5", "6", "7", "8", "9", ".", "0", "⌫"]) keys.append(h("button", { type: "button", text: k, "aria-label": k === "⌫" ? T("wl.delete") : k === "." ? T("wl.point") : k, onclick: () => set(k === "⌫" ? v.slice(0, -1) : v + k, true) }));
  setTimeout(() => onChange(v));
  return frag(h("div", { class: "amountbox" }, h("label", { for: "amt", text: sym() }), inp), keys);
}

      h("p", { text: T("earn.lab") }),

/* ONE DEAL: A SUMMARY LINE THAT DROPS DOWN.
 *
 * Coarse first, finer on a tap — but opening in place rather than on another
 * screen, so a column of them can be read down and two of them compared
 * without going back and forth. The line carries what a deal is called (the
 * two names) and what it was for (the figure that came in). Everything that
 * has to be worked out — what went out, what is left, whose invoice is
 * missing — is inside.
 */
function dealDrop(d, books) {
  const names = [d.in?.who || T("wl.someone"), d.out?.who || T("wl.noSupplier")].join(" → ");
  const sum = h("summary", null,
    h("span", { class: "who", text: names }),
    h("span", { class: "fig", text: d.in?.amount || d.out?.amount || "" }),
    h("span", { class: "meta" },
      h("span", { class: "caret", text: "›" }),
      h("span", { text: [d.no ? T("rq.no", { n: String(d.no).padStart(4, "0") }) : "",
        d.in?.what || ""].filter(Boolean).join(" · ") })));

  const inner = h("div", { class: "inner" });
  const line = (k, v, cls) => { if (v) inner.append(h("div", { class: "dline" + (cls ? " " + cls : "") }, h("span", { text: k }), h("span", { text: v }))); };
  line(T("wl.dIn"), d.in?.amount || "");
  /* WHAT ACTUALLY ARRIVED IN YUAN, at the rate on the day the code was drawn.
     A third number beside the other two rather than folded into them: those
     are the supplier's currency so the subtraction means something, and this
     is what was banked. */
  if (d.in?.cny) line(T("wl.dCny"), "¥" + (d.in.cny / 100).toLocaleString("en-US"));
  line(T("wl.dOut"), d.out?.amount || "");
  if (d.gap) line(T("wl.dGap"), d.gap.amount + "  ·  " + d.gap.pct + "%", "gap");
  /* AND WHY THERE IS NONE, WHERE THERE IS NONE. A missing figure in the one
     column this screen exists for reads as a bug every time. */
  else inner.append(h("div", { class: "dline gap" }, h("span", { text: T("wl.dGap") }),
    h("span", { text: T("bk.why." + (d.why || "noCur")) })));
  if (d.in?.inv) line(T("wl.dInvTo"), d.in.inv.title);

  /* THE PAPERWORK, ONLY ONCE THE MONEY HAS MOVED. A document that is not owed
     yet is not outstanding, and a row of red marks on a deal nobody has paid
     is a screen that cries wolf. */
  const chips = h("div", { class: "dpaper" });
  if (d.in && d.in.state === "paid") chips.append(h("span", { class: "dchip " + (d.in.invoice === "issued" ? "ok" : "no"), text: T(d.in.invoice === "issued" ? "bk.cIssued" : "bk.cIssue") }));
  if (d.out && d.out.state === "paid") chips.append(h("span", { class: "dchip " + (d.out.billed ? "ok" : "no"), text: T(d.out.billed ? "bk.cBilled" : "bk.cBill") }));
  if (chips.children.length) inner.append(chips);

  return h("details", { class: "deal" }, sum, inner);
}

/* SETUP — region, terms, then identity, Face ID, a way to pay, where money goes. */
/* WHERE SOMEBODY LIVES IS A QUESTION THE PROVIDER ASKS, NOT US.
 *
 * This opened with six radio rows — Finland, Australia, Mainland China, Hong
 * Kong, United States, Somewhere else — as the first thing a stranger saw,
 * before they knew what the wallet was. It decides real things (the currency,
 * whether a balance can be held at all, which bank fields, the daily limit)
 * and not one of them bites until the first payment.
 *
 * And under Stripe or Airwallex it is THEIR question. They run the identity
 * check, they set the limits, they take the bank details on their own page,
 * they decide what is allowed where. Asking it here was us re-implementing
 * the regulated party's onboarding in front of the customer — and a product
 * that collects identity and sets limits looks like the thing holding the
 * money, which is the one impression this board must not give.
 *
 * So it is guessed from the phone and changeable in Settings. A guess that is
 * wrong costs one tap later; a question on the door costs the person.
 */
function guessRegion() {
  const zone = (() => { try { return Intl.DateTimeFormat().resolvedOptions().timeZone || ""; } catch { return ""; } })();
  if (/^Australia\//.test(zone)) return "AU";
  if (/^Asia\/(Shanghai|Chongqing|Urumqi|Harbin)$/.test(zone)) return "CN";
  if (zone === "Asia/Hong_Kong") return "HK";
  if (zone === "Europe/Helsinki") return "FI";
  if (/^America\//.test(zone)) return "US";
  /* The language's region is a weaker signal than the clock — a phone set to
     en-AU in Beijing is commoner than a clock set to Melbourne there — so it
     is only read when the clock said nothing. */
  const tag = String((navigator.languages && navigator.languages[0]) || navigator.language || "");
  const m = /-([A-Z]{2})\b/.exec(tag.toUpperCase());
  if (m && W.regions && W.regions[m[1]]) return m[1];
  return "OTHER";
}

SCREENS.payout = async (_, q) => {
  /* REACHED DIRECTLY NOW, from the money screen, by somebody who may have no
     wallet at all — and the first thing below reads w.region off it. That
     threw, paint() caught it, and the address answered with a blank screen
     and an error toast. The same line SCREENS.home has had all along. */
  if (!W.wallet) return SCREENS.setup([]);
  const w = W.wallet;
  const setup = q.get("setup") === "1";
  /* AN ABN FIRST, BECAUSE WITHOUT ONE 47% OF THE PAYMENT IS WITHHELD.
     Not a preference — no-ABN withholding is the law, and a supplier who
     leaves it blank is paid 53 cents in the dollar. Asked once, here, rather
     than discovered on the first payment. Its own checksum is checked before
     anything is sent, so a typo is caught on this screen. */
  const fields = w.region === "AU" ? [["abn", T("wl.abn"), "text", T("wl.abnHint")], ["accountName", T("wl.accountName"), "text", T("wl.asOnAbn")], ["bsb", T("wl.bsb"), "text", T("wl.sixDigits")], ["accountNumber", T("wl.accountNumber"), "text", ""]]
    : w.region === "CN" ? [["accountName", T("wl.accountName"), "text", T("wl.asOnYourId")], ["bankName", T("wl.bankLabel"), "text", T("wl.bankEg")], ["accountNumber", T("wl.cnAccount"), "text", ""]]
    /* EVERYWHERE ELSE, AND THIS IS THE ONE THAT ACTUALLY WIRES MONEY. It
       asked for a name, a bank and an IBAN, which is not enough to send a
       payment anywhere — and half the world has no IBAN at all. SWIFT is how
       the money finds the bank; the address is why a correspondent bank lets
       it through. Both were missing. */
    : [["accountName", T("wl.accountName"), "text", ""],
       ["bankName", T("wl.bankLabel"), "text", ""],
       ["swift", T("wl.swift"), "text", T("wl.swiftHint")],
       ["iban", w.region === "FI" ? "IBAN" : T("wl.ibanOr"), "text", T("wl.ibanHint")],
       ["country", T("wl.bankCountry"), "text", ""],
       ["address", T("wl.yourAddress"), "text", T("wl.addressWhy")]];
  /* ALWAYS A BANK. It offered "keep it in your wallet" against "pay it out",
     and the first of those is the float this board cannot hold. */
  let mode = "bank";
  const form = h("div", { class: "stack" });
  const inputs = {};
  for (const [key, label, type, hint] of fields) {
    const id = "f_" + key;
    inputs[key] = h("input", { id, type, autocomplete: key === "accountName" ? "name" : key === "address" ? "street-address" : key === "country" ? "country-name" : "off", inputmode: ["bsb", "accountNumber", "abn"].includes(key) ? "numeric" : null });
    form.append(h("div", { class: "field" }, h("label", { for: id, text: label }), inputs[key], hint ? h("span", { class: "hint", text: hint }) : null));
  }
  /* GST IS A YES OR NO AND BOTH ARE NORMAL. Registered, they add 10% and it
     is claimed back; under the $75,000 threshold they charge none. A form
     that assumes one makes half its users wrong, so it is a question rather
     than a default. */
  const gst = h("input", { type: "checkbox", id: "f_gst" });
  if (w.region === "AU") {
    form.append(h("label", { class: "check" }, gst, h("span", { text: T("wl.gstReg") })));
    form.append(h("p", { class: "hint", text: T("wl.gstWhy") }));
  }

  const list = h("div", { class: "list", role: "radiogroup", "aria-label": T("wl.whereShouldGo") });
  const draw = () => {
    list.textContent = "";
    list.append(row({ radio: mode === "bank", title: w.payoutLabel ? T("wl.myBankIs", { label: w.payoutLabel }) : T("wl.straightToMine"), sub: w.region === "CN" ? T("wl.cnChecked") : T("wl.usuallyNextDay"), onclick: () => { mode = "bank"; draw(); } }));
    form.hidden = mode !== "bank" || (Boolean(w.payoutLabel) && !showNew);
  };
  let showNew = !w.payoutLabel;
  const change = w.payoutLabel ? h("button", { type: "button", class: "chip", text: T("wl.useDifferent"), onclick: () => { showNew = true; draw(); } }) : null;
  draw();
  const save = btn(setup ? T("wl.finish") : T("wl.save"), "", async () => {
    save.disabled = true;
    try {
      if (mode === "wallet") await api("/api/wallet/payout", { mode: "wallet" });
      else if (showNew) await api("/api/wallet/payout", { mode: "bank", details: {
        ...Object.fromEntries(Object.entries(inputs).map(([k, i]) => [k, i.value])),
        ...(w.region === "AU" ? { gst: gst.checked } : {}),
      } });
      await load(); say(T("wl.saved"));
      if (setup) go("ready"); else history.back();
    } catch (err) { save.disabled = false; showError(err); }
  });
  return { title: T("wl.gettingPaid"), body: frag(
    h("p", { class: "lead", text: T("wl.whereShouldGo") }),
    list, change, form,
    /* WHAT THEIR INVOICE HAS TO SAY, said here rather than after the first
       one is rejected. Four things, and a supplier who gets them wrong is
       paid late for a reason nobody explained. */
    w.region === "AU" ? h("div", { class: "list" },
      row({ title: T("wl.invNeeds"), sub: T("wl.invNeedsSub") })) : null,
    h("p", { class: "small", text: T("wl.detailsToProv") }),
    h("div", { class: "push" }, save, setup ? btn(T("wl.skipForNow"), "ghost", () => go("ready")) : null)) };
};

SCREENS.send = async (_, q) => {
  const room = q.get("room") || "";

  const pre = q.get("to");

  const search = h("input", { id: "who", autocomplete: "off", placeholder: T("wl.searchMembers") });

    list.textContent = "";

SCREENS.amount = async ([to], q, known) => {
  const w = W.wallet;
  if (!w) { replace("setup"); return { title: T("wl.title"), body: frag() }; }
  const people = known || (await api("/api/wallet/people")).people;
  const p = people.find((x) => x.id === to);
  if (!p) return { title: T("wl.send"), body: note("bad", T("wl.memberGone")) };
  if (!p.hasWallet) return { title: T("wl.payWho", { who: p.handle }), body: frag(note("info", T("wl.theyHaveNoWallet", { who: p.handle })), h("div", { class: "push" }, btn(T("wl.back"), "ghost", () => history.back()))) };
  const draft = JSON.parse(sessionStorage.getItem("wallet:draft") || "{}");
  const d = draft.to === to ? draft : { to, amount: "", note: "", reason: "", source: (w.sources.find((s) => s.default) || {}).id || "" };
  const chinese = p.region === "CN";
  const cont = btn(T("wl.continue"), "", async () => {
    cont.disabled = true;
    sessionStorage.setItem("wallet:draft", JSON.stringify(d));
    try {
      const quote = await api("/api/wallet/quote", { to, amount: d.amount, source: d.source });
      sessionStorage.setItem("wallet:quote", JSON.stringify({ ...quote, note: d.note, reason: d.reason, room: q.get("room") || "" }));
      go("review");
    } catch (err) { cont.disabled = false; showError(err); }
  }, { disabled: true });
  const reasonIn = h("input", { id: "reason", maxlength: "80", placeholder: T("wl.egConsulting") });
  const noteIn = h("input", { id: "note", maxlength: "60", placeholder: T("wl.egRead") });
  noteIn.value = d.note; reasonIn.value = d.reason;
  const check = () => { cont.disabled = !(Number(d.amount) > 0) || !d.source || (chinese && d.reason.trim().length < 3); };
  noteIn.addEventListener("input", () => { d.note = noteIn.value; });
  reasonIn.addEventListener("input", () => { d.reason = reasonIn.value; check(); });
  /* A CARD OR A BANK, AND NOTHING ELSE. "Wallet balance" was the first row
     here; there is no balance now, so it would be an option that can never
     be chosen. */
  const sources = w.sources.map((s) => ({ ...s, sub: s.fee ? T("wl.feePct", { p: s.fee / 100 }) : T("wl.noFee") }));
  const srcList = h("div", { class: "list", role: "radiogroup", "aria-label": T("wl.payFrom") });
  const drawSrc = () => { srcList.textContent = ""; for (const s of sources) srcList.append(row({ radio: d.source === s.id, title: s.label, sub: s.sub, onclick: () => { d.source = s.id; drawSrc(); check(); srcList.querySelector('[aria-checked="true"]').focus(); } })); };
  drawSrc();
  return { title: T("wl.payWho", { who: p.handle }), body: frag(
    w.verified !== "verified" ? note("warn", T("wl.confirmBeforeSend"), h("button", { type: "button", class: "chip", onclick: () => go("verify"), text: T("wl.confirmNow") })) : null,
    amountEntry(d.amount, (v) => { d.amount = v; check(); }, T("wl.amountToSend", { who: p.handle, cur: w.currency })),
    h("div", { class: "field" }, h("label", { for: "note", text: T("wl.whatFor") }), noteIn),
    chinese ? h("div", { class: "field" }, h("label", { for: "reason", text: T("wl.reasonCn") }), reasonIn, h("span", { class: "hint", text: T("wl.reasonCnHint") })) : null,
    h("p", { class: "k", text: T("wl.payFrom") }),
    sources.length ? srcList : note("warn", T("wl.connectToPay"), h("button", { type: "button", class: "chip", onclick: () => go("sources"), text: T("wl.connect") })),
    h("div", { class: "push" }, cont)) };
};

SCREENS.review = async () => {
  const qt = JSON.parse(sessionStorage.getItem("wallet:quote") || "null");
  if (!qt) { replace("home"); return { title: T("wl.title"), body: frag() }; }
  const expires = Date.parse(qt.expiresAt);
  const left = h("span", { text: "" });
  const tick = setInterval(() => { const s = Math.max(0, Math.round((expires - Date.now()) / 1000)); left.textContent = s ? `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}` : T("wl.expired"); if (!document.contains(left)) clearInterval(tick); }, 1000);
  const sendIt = confirmButton(T("wl.sendAmtTo", { amt: qt.total.text, who: qt.to.handle }), "money", "send", qt.quoteId, async (confirmation) => {
    const r = await api("/api/wallet/send", { quoteId: qt.quoteId, note: qt.note, reason: qt.reason, room: qt.room, confirmation, returnUrl: "/wallet#sent" });
    sessionStorage.removeItem("wallet:quote"); sessionStorage.removeItem("wallet:draft");

  return { title: T("wl.checkAndSend"), body: frag(
    h("p", { class: "big", text: qt.send.text }),
    h("p", { class: "center lead", text: T("wl.toWhoNote", { who: qt.to.handle }) + (qt.note ? " · " + qt.note : "") }),
    h("div", { class: "sum" },
      h("div", {}, h("span", { text: T("wl.fee") }), h("span", { text: qt.fee.text })),
      h("div", { class: "tot" }, h("span", { text: T("wl.youPay") }), h("span", { text: qt.total.text })),
      h("div", { class: "tot" }, h("span", { text: T("wl.theyReceive", { who: qt.to.handle }) }), h("span", { text: qt.receive.text })),

      qt.rateText ? h("div", {}, h("span", { text: T("wl.rateHeld") }), left) : null,
      h("div", {}, h("span", { text: T("wl.arrives") }), h("span", { text: qt.arrives })),
      h("div", {}, h("span", { text: T("wl.ifNotAccepted") }), h("span", { text: T("wl.backIn24") }))),
    qt.overBalance ? note("bad", T("wl.overBalance")) : null,
    qt.overLimit ? note("bad", T("wl.overLimit")) : null,

    qt.reasonRequired ? h("p", { class: "small", text: T("wl.reasonGiven", { why: qt.reason }) }) : null,
    h("div", { class: "push" }, qt.overBalance || qt.overLimit ? btn(T("wl.back"), "ghost", () => history.back()) : sendIt)) };
};

async function detailScreen(kind, id, q) {
  const x = await api(`/api/wallet/activity/${kind}/${id}`);
  const [state, tone] = status(x.state);
  const tl = h("ol", { class: "timeline" }, ...(x.timeline || []).map((s) => h("li", { class: /declined|cancelled|returned|failed/.test(s.state) ? "bad" : "" }, h("b", { text: step(s.state) }), h("span", { text: new Date(s.at).toLocaleString(lang() === "zh" ? "zh-CN" : undefined) }))));
  const refresh = () => paint();
  const body = frag(
    q.get("just") === "1" ? note("good", x.direction === "out" ? T("wl.sentHas24", { who: x.with.handle }) : T("wl.done")) : null,
    h("p", { class: "big", text: x.amount.text }),
    h("p", { class: "center" }, h("span", { class: "pill " + tone, text: state })),
    x.with ? h("p", { class: "center lead", text: T(x.direction === "out" ? "wl.toWho" : "wl.fromWho", { who: x.with.handle }) + (x.note ? " · " + x.note : "") }) : null,
    tl.children.length ? tl : null,
    kind === "transfer" ? h("div", { class: "sum" },
      x.direction === "out" ? h("div", {}, h("span", { text: T("wl.theyReceived") }), h("span", { text: x.received.text })) : h("div", {}, h("span", { text: T("wl.theySent") }), h("span", { text: x.sent.text })),
      x.fee.text && x.direction === "out" ? h("div", {}, h("span", { text: T("wl.fee") }), h("span", { text: x.fee.text })) : null,
      x.rateText ? h("div", {}, h("span", { text: T("wl.rate") }), h("span", { text: x.rateText })) : null,
      x.sourceLabel ? h("div", {}, h("span", { text: T("wl.paidFrom") }), h("span", { text: x.sourceLabel })) : null,
      x.payoutTo ? h("div", {}, h("span", { text: T("wl.paidTo") }), h("span", { text: x.payoutTo })) : null,
      x.reason ? h("div", {}, h("span", { text: T("wl.reason") }), h("span", { text: x.reason })) : null,
      h("div", {}, h("span", { text: T("wl.reference") }), h("span", { text: x.id }))) : null,
    kind === "topup" ? h("div", { class: "sum" }, h("div", {}, h("span", { text: T("wl.from") }), h("span", { text: x.sourceLabel })), x.fee.text ? h("div", {}, h("span", { text: T("wl.fee") }), h("span", { text: x.fee.text })) : null) : null,
    kind === "withdrawal" ? h("div", { class: "sum" }, h("div", {}, h("span", { text: T("wl.to") }), h("span", { text: x.payoutTo }))) : null,
  );
  const acts = h("div", { class: "push" });
  const doIt = (label, cls, path, doneMsg) => btn(label, cls, async (e) => { e.target.disabled = true; try { await api(path, {}); say(doneMsg); await refresh(); } catch (err) { e.target.disabled = false; showError(err); } });
  if (kind === "transfer" && x.canAccept) acts.append(doIt(T("wl.acceptAmt", { amt: x.amount.text }), "money", `/api/wallet/transfers/${id}/accept`, T("wl.accepted")), doIt(T("wl.declineSendBack"), "ghost", `/api/wallet/transfers/${id}/decline`, T("wl.declinedBack")));
  if (kind === "transfer" && x.canCancel) acts.append(doIt(T("wl.cancelPayment"), "danger", `/api/wallet/transfers/${id}/cancel`, T("wl.cancelledBack")));
  if (kind === "request" && x.state === "open" && x.direction === "in") {
    acts.append(btn(T("wl.payAmt", { amt: x.amount.text }), "money", async (e) => {
      e.target.disabled = true;
      try {
        const w = W.wallet;
        const source = (w.sources.find((s) => s.default) || {}).id || "";
        const qt = await api(`/api/wallet/requests/${id}/quote`, { source });
        sessionStorage.setItem("wallet:quote", JSON.stringify({ ...qt, note: x.note, reason: qt.reasonRequired ? x.note : "", room: x.room }));
        go("review");
      } catch (err) { e.target.disabled = false; showError(err); }
    }), doIt(T("wl.decline"), "ghost", `/api/wallet/requests/${id}/decline`, T("wl.requestDeclined")));
  }
  if (kind === "request" && x.state === "open" && x.direction === "out") acts.append(doIt(T("wl.cancelRequest"), "danger", `/api/wallet/requests/${id}/cancel`, T("wl.requestCancelled")));
  if (kind === "transfer") acts.append(btn(T("wl.reportProblem"), "ghost", () => go(`report/${id}`)));
  body.append(acts);
  // Keep a payment that is still moving up to date while it's on screen.
  if (["charging", "paying_out", "processing"].includes(x.state)) setTimeout(() => { if (location.hash.includes(id)) paint(); }, 2500);
  const title = kind === "transfer" ? T(x.direction === "out" ? "wl.toWho" : "wl.fromWho", { who: x.with.handle }) : kind === "request" ? T("wl.request1") : kind === "topup" ? T("wl.addedMoney") : T("wl.withdrawal");
  return { title, body };
}

SCREENS.report = async ([id]) => {
  const reasons = [T("wl.rNotMine"), T("wl.rUnlock"), T("wl.rNotDelivered"), T("wl.rOther")];
  let pick = "";
  const list = h("div", { class: "list", role: "radiogroup", "aria-label": T("wl.whatHappened") });
  const text = h("input", { id: "more", maxlength: "600" });
  const send = btn(T("wl.sendReport"), "", async () => {
    send.disabled = true;
    try { await api("/api/wallet/report", { ref: id, reason: pick, text: text.value }); say(T("wl.reportSent")); replace(`reported`); }
    catch (err) { send.disabled = false; showError(err); }
  }, { disabled: true });
  const draw = () => { list.textContent = ""; for (const r of reasons) list.append(row({ radio: pick === r, title: r, onclick: () => { pick = r; send.disabled = false; draw(); list.querySelector('[aria-checked="true"]').focus(); } })); };
  draw();
  return { title: T("wl.reportProblem"), body: frag(h("p", { class: "lead", text: T("wl.whatHappened") }), list,
    h("div", { class: "field" }, h("label", { for: "more", text: T("wl.anythingElse") }), text),
    note("warn", T("wl.scamWarn")), h("div", { class: "push" }, send)) };
};
SCREENS.reported = async () => ({ title: T("wl.reported"), noBack: true, body: frag(h("div", { class: "done" }, svg("check")), h("p", { class: "hero center", text: T("wl.gotIt") }),
  h("p", { class: "center lead", text: T("wl.replyOneDay") }), h("div", { class: "push" }, btn(T("wl.backToWallet"), "", () => replace("home")))) });

/* ADD AND WITHDRAW */
/* NO SCREENS.add. Putting money into a balance held here is the one thing
   this board must not offer — see the note over the two verbs on home. A
   wallet that already has a balance can still take it out (#withdraw, and the
   button on Close), because stranding somebody's money is worse than any
   tidiness. */

/* NO SCREENS.withdraw EITHER. It was kept for a moment on the grounds that
   an existing balance must never be stranded — but no balance has ever held
   real money on this board: the only provider it has run against is the
   stand-in, and Airwallex was never activated. A screen for taking money out
   of a pot that cannot legally exist and never did is a screen that only
   teaches people the pot is there. */

SCREENS.methods = async ([id]) => {
  const w = W.wallet;
  if (id) {
    const s = w.sources.find((x) => x.id === id);
    if (!s) { replace("methods"); return { title: T("wl.methods"), body: frag() }; }
    return { title: s.label, body: frag(h("div", { class: "sum" }, h("div", {}, h("span", { text: T("wl.feeWhenPay") }), h("span", { text: s.fee ? `${s.fee / 100}%` : T("wl.noFee") })), h("div", {}, h("span", { text: T("wl.default") }), h("span", { text: s.default ? T("wl.yes") : T("wl.no") }))),
      h("div", { class: "push" },
        !s.default ? btn(T("wl.makeDefault"), "ghost", async () => { await api(`/api/wallet/sources/${id}/default`, {}); say(T("wl.defaultChanged")); paint(); }) : null,
        btn(T("wl.remove"), "danger", () => sheet(T("wl.removeWhat", { label: s.label }), T("wl.canConnectAgain"), T("wl.remove"), async () => { await api(`/api/wallet/sources/${id}/remove`, {}); say(T("wl.removed")); replace("methods"); })))) };
  }
  return { title: T("wl.methods"), body: frag(
    h("div", { class: "list" }, ...(w.sources.length ? w.sources.map((s) => row({ lead: badge(s.kind === "card" ? "CARD" : s.kind === "bank" ? "BANK" : s.kind === "paypal" ? "PP" : "WX"), title: s.label, sub: s.default ? T("wl.default") : "", onclick: () => go(`methods/${s.id}`) })) : [row({ title: T("wl.nothingConn") })])),
    h("div", { class: "list" }, row({ lead: badge("+"), title: T("wl.connectCardEtc"), sub: T("wl.onProviderPage"), onclick: () => go("sources") })),
    h("p", { class: "small", text: T("wl.keepsRefOnly") })) };
};

SCREENS.settings = async () => {
  const w = W.wallet;
  return { title: T("wl.settings"), body: frag(
    h("div", { class: "list" },
      row({ title: T("wl.faceForPay"), sub: w.passkeys ? T(w.passkeys > 1 ? "wl.onNDevices2" : "wl.onNDevices", { n: w.passkeys }) : T("wl.notSetUp"), onclick: () => go("security") }),
      row({ title: T("wl.identity"), sub: w.verified === "verified" ? T("wl.confirmed") : T("wl.notConfirmed"), onclick: () => go("verify") }),
      row({ title: T("wl.limits"), sub: T("wl.limitsSub", { day: w.limits.sendDay.text, today: w.limits.sentToday.text }), onclick: () => go("limits") }),
      row({ title: T("wl.moneyReceive"), sub: w.payout === "bank" ? (w.payoutLabel || T("wl.yourBank")) : T("wl.staysInWallet"), onclick: () => go("payout") }),
      row({ title: T("wl.methods"), sub: T("wl.nConnected", { n: w.sources.length }), onclick: () => go("methods") }),
      /* EVERY PAYMENT, WHICH THE HOME SCREEN NO LONGER LISTS.

         somewhere rather than simply stop existing. It is looked for once,
         which is what this list is for. */
      row({ title: T("wl.recent"), sub: T("wl.nothingYetSub"), onclick: () => go("activity") })),
    h("div", { class: "list" },
      row({ title: T("wl.help"), sub: T("wl.helpSub"), onclick: () => go("help") }),
      row({ title: T("wl.closeWallet"), sub: T("wl.withdrawFirst"), onclick: () => go("close") }))) };
};
SCREENS.limits = async () => {

SCREENS.close = async () => {
  const w = W.wallet;

    h("p", { class: "lead", text: T("wl.closeWhat") }),

    h("div", { class: "push" },
      confirmButton(T("wl.closeWallet"), "danger", "close", "wallet", async (confirmation) => { await api("/api/wallet/close", { confirmation }); await load(); say(T("wl.walletClosed")); replace("home"); }))) };

/* THE DEMO'S PEOPLE. Pick who to be; pay as one, accept as another. */
SCREENS.who = async () => {
  if (!W.demo) { replace("home"); return { title: T("wl.title"), body: frag() }; }
  const list = h("div", { class: "list", role: "radiogroup", "aria-label": T("wl.tryItAs") });
  for (const p of W.demo.personas) {
    list.append(row({ radio: p.key === W.demo.as, lead: face(p.handle), title: p.handle, sub: p.role, onclick: () => {
      try { localStorage.setItem("board:device", p.key === "you" ? "" : p.key); } catch { /* private window */ }
      device = p.key === "you" ? "" : p.key;
      sessionStorage.removeItem("wallet:quote"); sessionStorage.removeItem("wallet:draft");
      say(T("wl.nowYouAre", { who: p.handle }));
      replace("home");
    } }));
  }
  return { title: T("wl.tryItAs"), body: frag(
    h("p", { class: "lead", text: T("wl.demoFour") }),
    list,
    h("div", { class: "list" },
      row({ title: T("wl.pYou"), sub: T("wl.pYouSub") }),
      row({ title: T("wl.pMikko"), sub: T("wl.pMikkoSub") }),
      row({ title: T("wl.pMia"), sub: T("wl.pMiaSub") }),
      row({ title: T("wl.pWei"), sub: T("wl.pWeiSub") })),
    h("div", { class: "push" }, btn(T("wl.demoReset"), "ghost", async () => {
      await api("/api/wallet/demo/reset", {});
      sessionStorage.clear();
      try { localStorage.setItem("board:device", ""); } catch { /* private window */ }
      device = "";
      say(T("wl.demoRestarted"));
      replace("home");
    }))) };
};

/* A small confirmation sheet for irreversible taps. */
function sheet(title, text, confirmText, run) {
  const ov = $("overlay"); ov.textContent = "";
  const close = () => { ov.textContent = ""; document.querySelector("main").removeAttribute("inert"); };
  const ok = btn(confirmText, "danger", async () => { ok.disabled = true; try { await run(); close(); } catch (err) { close(); showError(err); } });
  ov.append(h("div", { class: "scrim", onclick: close }), h("div", { class: "sheet", role: "dialog", "aria-modal": "true", "aria-labelledby": "sh" }, h("h2", { id: "sh", tabindex: "-1", text: title }), h("p", { class: "center lead", text }), ok, btn(T("wl.cancel"), "ghost", close)));
  document.querySelector("main").setAttribute("inert", "");
  $("sh").focus();
  document.addEventListener("keydown", function esc(e) { if (e.key === "Escape") { close(); document.removeEventListener("keydown", esc); } });
}

$("back").setAttribute("aria-label", T("wl.back"));
$("title").textContent = T("wl.title");
/* A REPAINT, NOT A RELOAD. Every screen reads T at draw time, so the whole
   page can change language in place — including a half-filled form, which a
   reload would empty. */
$("langslot").append(langButton(() => {
  $("back").setAttribute("aria-label", T("wl.back"));
  paint();
}));

paint();
