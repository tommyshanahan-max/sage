<!doctype html>
<!-- WHOSE HOUSE THIS PAGE IS IN, decided by the hostname and known before a
     byte of script runs — the same {{DEALIO}} the door has used since it had
     two products to greet people for. On paydealio.com it is 1 and this page
     wears its own face. Reached from the board's Money tab it is empty, and
     the palette below turns into the board's. -->
<html lang="en" data-dealio="{{DEALIO}}">
<head>
<meta charset="utf-8">
{{DEMO}}
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#0B0E15">
<title>Dealio</title>
<meta name="description" content="Ask somebody to pay you.">
<meta name="robots" content="noindex">
<meta http-equiv="Cache-Control" content="no-cache">
<meta name="color-scheme" content="dark">
<style>
  /* ITS OWN LOOK, AND ON PURPOSE.
     This is step one of three — a page here, then its own domain, then an app
     if it ever earns one — and a page wearing the board's chrome and the
     board's palette is a page that cannot leave. Dark, one accent, a serif
     for the numbers, rules instead of boxes. Single-theme by choice: it is
     one product with one face rather than a page that borrows whichever the
     phone is set to. */
  :root{
    --bg:#0B0E15; --card:#141924; --ink:#E9EDF5; --ink2:#A3B0C4; --mut:#6F7D92;
    --line:#232B39; --hair:#1C2330; --acc:#D6483B; --accink:#fff; --ok:#3FBE7D;
    /* THE TOP BLOCK RUNS ITS OWN PALETTE, AND IT IS THE PAGE'S OPPOSITE.
       Six variables rather than one, for the same reason the skin above is
       ten: nothing else in this file should have to know which way round the
       screen is. Here the page is dark, so the top is light. */
    --top:#F2F4F9; --topInk:#101623; --topDim:#5A6678;
    --topBtn:#101623; --topBtnInk:#F2F4F9; --topLine:rgba(16,22,35,.20);
    --topAcc:#A8362B;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",
      "Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;
    --serif:Georgia,"Songti SC","Noto Serif CJK SC",'Times New Roman',serif;
  }
  /* THE SAME PAGE IN THE BOARD'S HOUSE.
   *
   * The note above is still right about paydealio.com: a product that will
   * one day be its own app cannot wear somebody else's chrome. It was wrong
   * about the other address. Reached from the Money tab, this is a screen
   * inside The Exchange — and it arrived dark, red and serif in the middle of
   * a light blue app, with no bar at the bottom, so the only way back was the
   * browser's own button. That does not read as a second product. It reads as
   * having been thrown out of the first one.
   *
   * Ten variables, because the palette was written as ten variables. Nothing
   * else in this file knows which skin it is wearing. The values are the
   * board's own, copied from index.html rather than matched by eye — two
   * greys that are nearly the same grey is worse than one that is plainly
   * different. */
  html:not([data-dealio="1"]){
    --bg:#EEF0F4; --card:#F7F8FB; --ink:#151B28; --ink2:#4E5968; --mut:#8A939F;
    --line:#E3E6EC; --hair:#EAECF1; --acc:#3F68D8; --accink:#FFFFFF; --ok:#2A9D63;
    /* And here the page is light, so the top is dark. The accent is the
       board's blue lifted until it reads on it — the page's own #3F68D8 on
       a near-black panel is a link nobody can see. */
    --top:#141A27; --topInk:#F3F5FA; --topDim:#9AA5B8;
    --topBtn:#FFFFFF; --topBtnInk:#141A27; --topLine:rgba(255,255,255,.26);
    --topAcc:#8FB0FF;
  }
  /* The bar itself, in whichever palette is in force — it is drawn from the
     same ten variables, so it is dark on one host and light on the other
     without a second rule. Hidden entirely on Dealio's own domain. */
  .boardbar{position:fixed;left:50%;transform:translateX(-50%);bottom:0;
    z-index:35;display:flex;width:100%;max-width:34rem;
    background:var(--card);border-top:1px solid var(--line);
    padding:.35rem .5rem calc(.35rem + env(safe-area-inset-bottom,0))}
  .boardbar a{flex:1;display:flex;flex-direction:column;align-items:center;
    gap:.15rem;padding:.4rem 0;color:var(--mut);text-decoration:none;
    font-size:.7rem}
  .boardbar a.on{color:var(--acc)}
  .boardbar svg{width:1.35rem;height:1.35rem;fill:none;stroke:currentColor;
    stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
  html[data-dealio="1"] .boardbar{display:none}
  /* And the page pays for it, or the last row sits under it — the same
     mistake the board's own deck made and had measured out of it today. */
  html:not([data-dealio="1"]) body{padding-bottom:5.5rem}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink)}
  body{font-family:var(--sans);font-size:16px;line-height:1.5;
    padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
  main{max-width:34rem;margin:0 auto;padding:1.1rem .9rem 4rem}
  .top{display:flex;align-items:center;gap:.5rem;margin:0 0 1.2rem}
  .dot{width:.55rem;height:.55rem;border-radius:50%;background:var(--acc);
    flex:0 0 auto}
  .wm{font-size:.7rem;letter-spacing:.2em;text-transform:uppercase;color:var(--mut)}
  .lang{margin-left:auto;border:1px solid var(--line);background:none;
    color:var(--ink2);font:inherit;font-size:.78rem;padding:.25rem .7rem;
    border-radius:99px}
  /* SIGN IN, IN THE BANNER. Ordered after the language button in the source
     so `margin-left:auto` on that one still pushes the pair to the right. */
  .signin{border:1px solid var(--line);background:none;color:var(--ink);
    font:inherit;font-size:.78rem;padding:.25rem .8rem;border-radius:99px;
    cursor:pointer}
  /* ---- the front page ---------------------------------------------------
     A page to read, so it is narrower than the app screens and everything on
     it is ranged left. The app is centred because it is a set of controls;
     prose centred down a phone is prose nobody finishes. */
  .front{padding:1.6rem 0 3rem}
  .front .hero{margin:0;font-family:var(--serif);font-weight:400;
    font-size:clamp(2.3rem,11vw,3.2rem);line-height:1.02;letter-spacing:-.02em}
  .front .herosub{margin:1rem 0 0;font-size:1.05rem;line-height:1.5;
    color:var(--ink2);max-width:20rem}
  /* THE PAYER'S SCREEN, DRAWN. Light on this dark page on purpose: it is a
     different screen belonging to a different person, and it should look
     like something being held up rather than part of what you are reading. */
  .demo{margin:2.2rem 0 0;padding:1.3rem 1.2rem 1.4rem;border-radius:1rem;
    background:#F3F4F7;color:#0B0E15}
  .demo .dlab{margin:0;font-size:.68rem;letter-spacing:.14em;
    text-transform:uppercase;color:#6F7D92}
  .demo .damt{margin:.35rem 0 0;font-family:var(--serif);font-size:2.6rem;
    line-height:1}
  .demo .dwhat{margin:.3rem 0 0;font-size:.95rem;color:#44506A}
  .demo .dbtn{margin:1.1rem 0 0;padding:.95rem 1rem;border-radius:99px;
    background:#2F49A6;color:#fff;text-align:center;font-weight:600;
    letter-spacing:.02em}
  /* THE THREE WAYS TO PAY, as marks rather than a footnote. Wrapping, so
     three long Chinese names do not squeeze into unreadable columns. */
  .front .ways{display:flex;flex-wrap:wrap;gap:.5rem;margin:1rem 0 0}
  .front .way{display:inline-flex;align-items:center;gap:.45rem;
    padding:.5rem .85rem;border:1px solid var(--line);border-radius:99px;
    font-size:.88rem;color:var(--ink)}
  .front .wdot{width:.55rem;height:.55rem;border-radius:50%;flex:0 0 auto}
  .front .wx .wdot{background:#07C160}
  .front .ali .wdot{background:#1677FF}
  .front .cd .wdot{background:var(--mut)}
  /* THREE FACTS ON THREE LINES, hairline-separated. A spec row, not prose:
     it is read by glancing down the left edge, which is the only way
     anything on a first screen gets read at all. */
  .front .specs{margin:2rem 0 0;border-top:1px solid var(--hair)}
  /* A row, not a line of text: it opens, so it has to look like it opens. */
  .front .specs .spec{display:flex;align-items:center;gap:.8rem;width:100%;
    margin:0;padding:.95rem 0;border:0;border-bottom:1px solid var(--hair);
    background:none;color:var(--ink);font:inherit;font-size:.95rem;
    line-height:1.4;text-align:left;cursor:pointer}
  .front .specs .spec span{flex:1 1 auto}
  .front .specs .chev{flex:0 0 auto;color:var(--mut);font-style:normal;
    font-size:1.15rem;line-height:1}
  .notep{margin:.6rem 0 0;font-size:.97rem;line-height:1.65;color:var(--ink2)}
  .front .hint{text-align:center}
  /* A button that is a block rather than a thing in a row of things. */
  .go.wide,.ghost2.wide{display:block;width:100%;margin:2rem 0 0;border:0;
    border-radius:99px;background:var(--acc);color:var(--accink);font:inherit;
    font-size:.95rem;font-weight:600;letter-spacing:.08em;
    text-transform:uppercase;padding:1rem 1.2rem;min-height:3.4rem;
    text-align:center;text-decoration:none;cursor:pointer}
  .ghost2.wide{margin:.5rem 0 0;background:none;border:1px solid var(--line);
    color:var(--ink)}
  /* In a sheet these sit under a heading rather than at the end of a page of
     prose, so they do not want the page's breathing room above them. */
  .shc .go.wide{margin-top:.2rem}
  h1{margin:0 0 .15rem;font-size:1.35rem;line-height:1.25}
  /* THE HEADING AND THE WAY OUT OF IT, on one line. A back arrow in the
     corner is a place on a screen; a word beside the heading is a word. */
  .hrow{display:flex;align-items:baseline;gap:.9rem}
  /* Two figures side by side, hairline between, nothing boxed. A card would
     make them a thing to tap; they are only something to read. */
  .mrow{display:flex;gap:2rem;padding:1.1rem .2rem 1.2rem;border-top:1px solid var(--line)}
  .mcol span{display:block;font-size:.72rem;letter-spacing:.11em;text-transform:uppercase;color:var(--muted);margin:0 0 .3rem}
  .mcol b{display:block;font-size:1.75rem;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1}
  .mcol b.pend{font-weight:600;color:var(--muted)}
  .hrow h1{flex:1 1 auto;min-width:0}
  .hlink{flex:0 0 auto;border:0;background:none;color:var(--acc);font:inherit;
    font-size:.88rem;padding:.25rem 0;cursor:pointer}
  /* The invite code, under Continue with Google. A link, not a second button:
     almost nobody meeting that screen has a code, and two buttons of equal
     weight would make it look like a choice worth stopping over. */
  /* A LINK, EVEN WHEN IT IS A BUTTON. In the pinned bar it inherited the
     solid accent style off `.make button` and came out looking like a third
     thing to press — louder than Send money, for something looked for once.
     Declared after those rules and at the same specificity, so it wins. */
  .quietlink{display:inline-block;margin:.9rem 0 0;color:var(--ink2);
    font-size:.88rem}
  .mid .two button.quietlink,.make .two button.quietlink,button.quietlink{
    display:block;width:auto;max-width:none;margin:.6rem auto 0;border:0;
    background:none;color:var(--ink2);font:inherit;font-size:.85rem;
    font-weight:400;letter-spacing:normal;text-transform:none;
    padding:.5rem .6rem;min-height:0;text-decoration:underline;
    text-underline-offset:3px;cursor:pointer}
  /* A MONTH, AS A RULE ACROSS THE LIST. */
  .mo{margin:1.6rem 0 .5rem;padding:0 0 .5rem;border-bottom:1px solid var(--line);
    font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;color:var(--mut)}
  .mo:first-of-type{margin-top:1.1rem}
  /* A SETTLED ROW IS A LINE, NOT A CARD. Everything here is paid, so nothing
     on it needs lifting off the page. */
  .prow{display:grid;grid-template-columns:1fr auto;gap:.1rem .8rem;
    align-items:baseline;width:100%;text-align:left;border:0;background:none;
    color:var(--ink);font:inherit;padding:.75rem 0;cursor:pointer}
  .prow .w{font-weight:600}
  .prow .n{font-family:var(--serif);font-size:1.2rem;text-align:right;
    font-variant-numeric:tabular-nums}
  .prow .t{grid-column:1/-1;color:var(--mut);font-size:.82rem}
  /* ---- THE HERO: what you have earned, and what is still coming ---------
     THE ONE THING SOMEBODY OPENS A MONEY SCREEN TO SEE, at the size that
     says so. Not a balance — this board holds nothing and must not look as
     though it does. Two facts that are true of a wallet holding nothing:
     what has reached you, and what is on its way. */
  .whero{padding:.4rem .1rem 1.2rem}
  .whero .k2{margin:0 0 .45rem;font-size:.72rem;letter-spacing:.14em;
    text-transform:uppercase;color:var(--topDim)}
  .whero .v{margin:0;font-size:3.1rem;font-weight:700;line-height:1;
    letter-spacing:-.035em;font-variant-numeric:tabular-nums;color:var(--topInk)}
  /* .hq AND NOT .q. `.q` is the request card on this same page — declared a
     hundred lines further down, so it wins the cascade and every quiet line
     in the hero came out wearing a grey card. A class name that reads well
     in isolation is not a free choice on a page that already has one. */
  .whero .hq{margin:.7rem 0 0;font-size:.92rem;color:var(--topDim)}
  /* THE BANK LINE IS A BUTTON, because it is the one line on this screen that
     is a thing to go and fix. It reads as a line until it needs pressing. */
  .whero button.hq{display:block;width:100%;text-align:left;border:0;
    background:none;font:inherit;font-size:.86rem;padding:.35rem 0 0;cursor:pointer}
  /* THE WARNING IS A LINE, NOT A SHOUT. Bold accent directly under the
     figure made it the second loudest thing on the screen, in the slot the
     drawing gives to "Still to come". It is a real fault and it stays in the
     accent, but at the weight of the line it sits in. */
  .whero button.hq.warn2{color:var(--topAcc);text-decoration:underline;
    text-underline-offset:3px}
  /* A SHADOW, NOT JUST A SHADE. --card on --bg is four points of lightness
     apart, which is a difference you can measure and not one you can see: the
     block did not divide the page, it just sat on it. The shadow under the
     rounded bottom is what makes the top read as lying over the rest. */
  /* A DIFFERENT SCHEME, NOT A DIFFERENT SHADE. Two surfaces four points of
     lightness apart do not divide a page — they just look like a printing
     fault. The top runs the page's opposite: dark panel on the light skin,
     light panel on the dark one, each with its own text, muted and accent so
     nothing inside has to be special-cased. No hairline: a panel this far
     from the page behind it does not need a line to say where it ends. */
  .topblock{background:var(--top);color:var(--topInk);
    margin:0 -.9rem 1.5rem;padding:1.3rem .9rem 1.35rem;
    border-radius:0 0 1.3rem 1.3rem;
    box-shadow:0 8px 22px rgba(8,12,22,.16)}
  /* THE TWO VERBS, AS TWO MATCHING PILLS. This screen had a number pad, a
     currency dropdown and one blue button stacked under the hero: three
     mismatched controls where the drawing has two matching ones, in a second
     blue fighting the warning line above it. The pad is not lost — both pills
     open the same sheet, and it has always asked for the amount when none was
     typed. Fewer controls, and the screen stops shouting in two colours. */
  .pills{display:grid;grid-template-columns:repeat(2,1fr);gap:.6rem;margin:0 0 .4rem}
  .pills button{border:0;border-radius:999px;padding:1.05rem .6rem;cursor:pointer;
    font:inherit;font-size:1.02rem;font-weight:700;
    background:var(--topBtn);color:var(--topBtnInk)}
  /* ON THE BLOCK, NOT ON THE PAGE. The quiet pill kept taking a page colour
     and vanishing into whichever surface was behind it. It is drawn from the
     block's own palette instead — nothing, outlined — so the pair reads as
     solid-and-outline whichever way round the screen is. */
  .pills button+button{background:transparent;color:var(--topInk);
    border:1px solid var(--topLine)}
  /* .45 WAS FINE ON A PAGE AND NOT ON THE BLOCK. An outlined pill at 45% on
     a near-black panel is a shape you can see and a word you cannot read. */
  .pills button[disabled]{opacity:.58;cursor:not-allowed}
  /* ONE VERB IS NOT HALF A PAIR. Kept for any state that ever draws a single
     pill: alone, it takes the width rather than sitting in the left half
     with a hole beside it. Send is no longer hidden, so today nothing hits
     this — which is the point of it still being here. */
  .pills button:only-child{grid-column:1/-1}
  /* A SMALL WINDOW WITH A FIGURE ON IT. Shut, it is one line: what it holds
     and how much. The figure is the answer most of the time; the list behind
     it is for the times it is not. */
  .fold{background:var(--card);border:1px solid var(--line);border-radius:1rem;
    margin:0 0 .7rem;overflow:hidden}
  .fold>summary{list-style:none;cursor:pointer;display:flex;align-items:center;
    gap:.6rem;padding:.95rem 1rem}
  .fold>summary::-webkit-details-marker{display:none}
  .fold>summary:focus-visible{outline:2px solid var(--acc);outline-offset:-2px}
  .fold .fl{font-size:.74rem;letter-spacing:.14em;text-transform:uppercase;
    color:var(--mut)}
  /* SMALLER THAN THE HERO AND BY A LOT. It is a second figure on a screen
     whose first one is 3.1rem — at anything near that size the screen has
     two headlines and no hierarchy. */
  .fold .ff{margin-left:auto;font-family:var(--serif);font-size:1.3rem;
    font-variant-numeric:tabular-nums;color:var(--ink)}
  .fold .caret{color:var(--mut);display:inline-block;transition:transform .15s ease}
  .fold[open] .caret{transform:rotate(90deg)}
  @media (prefers-reduced-motion:reduce){.fold .caret{transition:none}}
  .finner{padding:.1rem .8rem .8rem}
  /* The rows inside are already cards; on a card they need no second edge. */
  .finner .q{background:none;border-top:1px solid var(--line);border-radius:0;
    margin:0;padding:.85rem .15rem}
  .feet{display:flex;gap:1.1rem;margin:.9rem 0 0;padding:0 .15rem}
  /* ---- THE DEALS COLUMN ------------------------------------------------
     A COLUMN OF SUMMARIES THAT DROP DOWN. Every deal is one line until it is
     asked about, and then it opens where it stands rather than pushing the
     reader onto another screen — so a column can be read down and two deals
     compared without going back and forth.
     NATIVE <details>, NOT A DIV AND A CLICK HANDLER. Open and closed to a
     screen reader without being told, keyboard-operable, and it survives a
     repaint with the right rows still open. Hand-rolling costs all four. */
  .deal{border-bottom:1px solid var(--line)}
  .deal>summary{list-style:none;cursor:pointer;display:grid;
    grid-template-columns:1fr auto;gap:.1rem .8rem;align-items:baseline;
    padding:.85rem .1rem}
  .deal>summary::-webkit-details-marker{display:none}
  .deal>summary:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:.5rem}
  /* ONE LINE PER DEAL. "Beijing producer → Melbourne post house" wrapped onto
     two and shoved the figure down with it, so the column stopped being a
     column you can run your eye down. min-width:0 is the half people forget:
     without it a grid track will not shrink below its content and the
     ellipsis never fires. */
  .deal .who{font-weight:650;min-width:0;overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap}
  .deal .fig{font-family:var(--serif);font-size:1.15rem;
    font-variant-numeric:tabular-nums;text-align:right}
  .deal .meta{grid-column:1/-1;font-size:.78rem;color:var(--mut);
    display:flex;align-items:center;gap:.4rem}
  /* THE MARKER TURNS, and it is the only moving thing on the screen. A column
     that opens with no sign of having opened reads as the page jumping. */
  .deal .caret{display:inline-block;transition:transform .15s ease}
  .deal[open] .caret{transform:rotate(90deg)}
  @media (prefers-reduced-motion:reduce){.deal .caret{transition:none}}
  .deal .inner{padding:.1rem .1rem 1rem}
  .dline{display:flex;justify-content:space-between;gap:1rem;padding:.42rem 0;font-size:.92rem}
  .dline span:first-child{color:var(--mut)}
  .dline span:last-child{font-variant-numeric:tabular-nums;text-align:right}
  /* THE MARGIN IS THE ONE LINE WORTH LIFTING, and it is lifted by weight and
     a rule rather than a colour — it is a figure, not a status. */
  .dline.gap{border-top:1px solid var(--line);margin-top:.3rem;padding-top:.6rem;font-weight:700}
  .dline.gap span:first-child{color:var(--ink)}
  .dpaper{display:flex;gap:.4rem;flex-wrap:wrap;margin:.7rem 0 0}
  .dchip{font-size:.66rem;letter-spacing:.1em;text-transform:uppercase;
    padding:.16rem .55rem;border-radius:999px;background:var(--line);color:var(--ink2)}
  .dchip.ok{background:rgba(63,190,125,.16);color:var(--ok)}
  .dchip.no{background:rgba(217,83,79,.16);color:#E08C89}
  .dacts{display:flex;flex-wrap:wrap;gap:.5rem;margin:.8rem 0 0}
  .dacts button{border:1px solid var(--line);background:var(--card);color:var(--ink);
    font:inherit;font-size:.86rem;padding:.5rem .9rem;border-radius:999px;cursor:pointer}

  /* ---- THE BOOKS: two invoices on one line ------------------------------
     A LEDGER, NOT A DECK OF CARDS. Every row here is the same kind of thing
     and none of them needs lifting off the page; the card treatment on the
     live list earns itself because those rows are things to act on, and
     these are things to read down. */
  .d{display:grid;grid-template-columns:1fr auto;gap:.15rem .8rem;
    align-items:baseline;width:100%;text-align:left;border:0;background:none;
    color:var(--ink);font:inherit;padding:.8rem 0;cursor:pointer;
    border-bottom:1px solid var(--line)}
  .d .w{font-weight:600}
  .d .n{font-family:var(--serif);font-size:1.25rem;text-align:right;
    font-variant-numeric:tabular-nums}
  /* The two figures the margin came out of, in the order money moved. Tabular
     so a column of them lines up under itself — the one place on this app
     where somebody is reading down a column rather than glancing at a row. */
  .d .f{grid-column:1;color:var(--mut);font-size:.84rem;
    font-variant-numeric:tabular-nums}
  .d .p{grid-column:2;justify-self:end;color:var(--mut);font-size:.72rem;
    font-variant-numeric:tabular-nums}
  .d .t{grid-column:1/-1;color:var(--mut);font-size:.78rem;margin:.15rem 0 0}
  /* THE PAPERWORK, AS TWO MARKS AND NOT TWO SENTENCES. A deal is finished
     when the money moved both ways and both documents exist, and the second
     half is the one that costs money later — so it gets a mark on the row
     that can be scanned down rather than a state that has to be read. */
  .paper{grid-column:1/-1;display:flex;gap:.45rem;margin:.3rem 0 0}
  .pchip{font-size:.66rem;letter-spacing:.1em;text-transform:uppercase;
    padding:.14rem .5rem;border-radius:99px;background:var(--line);color:var(--ink2)}
  .pchip.ok{background:rgba(63,190,125,.14);color:var(--ok)}
  .pchip.no{background:rgba(217,83,79,.14);color:#E08C89}
  /* WHY THERE IS NO MARGIN, WHERE THERE IS NONE. A blank in the column the
     screen exists for is the one thing guaranteed to be read as a bug. */
  .dwhy{grid-column:2;justify-self:end;color:var(--mut);font-size:.72rem;
    text-align:right;max-width:9rem;line-height:1.35}
  /* WHAT IS OWED ON PAPER. Loud enough to be seen under the margin and no
     louder — it is a reminder, not a failure. */
  /* .sub AND .owing ARE THE SAME ELEMENT, and .sub is declared after this
