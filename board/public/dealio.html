<main id="root"></main>
<div class="make" id="makebar" hidden></div>
<!-- THE WAY BACK, and only in the board's house.
     This page had no navigation at all. On paydealio.com that is right — a
     payer has nowhere to go and a bar would only offer them somebody else's
     app. Reached from the Money tab it was a dead end: the five tabs a member
     had a second ago were gone, and only the browser's back button returned
     them. Hidden on the Dealio host by the same attribute that picks the
     palette, so neither address grows the other one's furniture. -->
<nav class="boardbar" id="boardbar">
  <a href="/notes"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16v12H4z M4 7l8 6 8-6"/></svg><span id="bbnotes"></span></a>
  <a href="/cards"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18v12H3z M3 10h18"/></svg><span id="bbcards"></span></a>
  <a href="/browse"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4h10a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2Z M9 15c1.5-2 4.5-2 6 0"/><circle cx="12" cy="10" r="2.2"/></svg><span id="bbbrowse"></span></a>
  <a href="/browse"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8Z M4 21a8 8 0 0 1 16 0"/></svg><span id="bbme"></span></a>
  <a href="/dealio?in=1" aria-current="page" class="on"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7h18v10H3z"/><circle cx="12" cy="12" r="2.4"/></svg><span id="bbmoney"></span></a>
</nav>
<script type="module">
/* DEALIO — ASKING SOMEBODY TO PAY YOU
 * ===========================================================================
 *
 * "Two people are chatting, then someone sends them a request to pay." This
 * page is the asking half. The paying half is /pay/<id> and needs no account,
 * no app and no code — which is the whole design.
 *
 * WHY IT IS A SEPARATE PAGE AND NOT A TAB. Step one of three: a page here,
 * then its own domain, then an app if it ever earns one. A page wearing the
 * board's chrome is a page that cannot leave, so this one carries its own
 * layout, its own palette and its own name.
 *
 * WHAT IS DELIBERATELY NOT HERE: any chat. The conversation already exists
 * and it is WeChat. Building a fourth one would mean asking two people to
 * move a conversation they are already having, which nobody does.
 */
import { T, TZh, when, lang, setLang, pickLang, langButton } from "/i18n.js";

const el = (tag, cls, text) => {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text != null) n.textContent = text;
  return n;
};
const root = document.getElementById("root");
const bar = document.getElementById("makebar");

/* MINTED HERE IF IT IS NOT THERE, and that is not tidiness.
 *
 * iOS gives a home-screen app its own storage, separate from Safari. Tom
 * saved Dealio to his home screen, opened it, and the ASK FOR MONEY button
 * was gone — the app was a stranger, because board:device was empty there
 * and every other page on this board is behind a door that already minted
 * one. Without an id of its own there is nothing to hand to the sign-in, and
 * the sign-in refuses a browser it cannot name: it moves an existing person
 * onto this device, so it needs to know which device that is.
 */
let device = "";
try {
  device = localStorage.getItem("board:device") || "";
  if (!device) {
    device = (crypto.randomUUID ? crypto.randomUUID()
      : String(Date.now()) + Math.random().toString(16).slice(2));
    localStorage.setItem("board:device", device);
  }
} catch { /* private window: it still works, it just forgets */ }

/* HOW THE LAST SIGN-IN WENT, read once off the address the callback sent us
   back to and then wiped, so a reload does not repeat a month-old verdict. */
let SIGNIN = "";
try {
  const u = new URL(location.href);
  SIGNIN = String(u.searchParams.get("signin") || "").slice(0, 20);
  if (SIGNIN) { u.searchParams.delete("signin"); history.replaceState(null, "", u); }
} catch { /* nothing to read */ }

let STATE = null;

/* THE SIGN, PUT BACK ON FOR EVERY SCREEN THAT SHOWS AN AMOUNT.
 *
 * The currency picker made the field take bare digits — nobody hunts for ¥ on
 * a phone keyboard — and the list went on printing whatever was typed. So a
 * row read "1" and another read "100", which is not an amount, it is a
 * number. The currency is on the row; using it is the whole point of asking
 * for it.
 *
 * An amount that already carries a sign is left alone: everything made before
 * the picker existed has one, and "¥¥1" would be a worse bug than the one
 * being fixed. */
const CUR_SIGN = { cny: "¥", usd: "$", aud: "A$", hkd: "HK$", eur: "€",
                   gbp: "£", jpy: "¥" };
/* CNY and USD first — the two this is for. The rest under them rather than
   behind an "other" that costs a second press. */
const MONEY = [["cny", "¥ RMB"], ["usd", "$ USD"], ["aud", "A$ AUD"],
               ["hkd", "HK$ HKD"], ["eur", "€ EUR"], ["gbp", "£ GBP"],
               ["jpy", "¥ JPY"]];

/* AND THE ONES THAT CAN ACTUALLY BE PAID TODAY. The server says which money
   its rails can price against yuan; the rest are offered nowhere rather
   than made into a request that can only be refused on somebody else's
   phone an hour after it was sent. No answer from the server means no
   restriction, which is every board but this one. */
const money = () => {
  const ok = Array.isArray(STATE?.curs) ? STATE.curs : [];
  return ok.length ? MONEY.filter(([c]) => ok.includes(c)) : MONEY;
};

/* And what the picker opens on, which must be one of them: a phone that
   remembers pounds from last week would otherwise start on a currency that
   is no longer in the list, and a select with no matching option shows its
   first one while the code still thinks it is pounds. */
const curPick = () => {
  const list = money().map(([c]) => c);
  const want = curNow();
  return list.includes(want) ? want : (list[0] || "cny");
};
/* Remembered per phone: somebody asking in RMB today asks in RMB next week. */
const curNow = () => {
  try { return localStorage.getItem("dealio:cur") || "cny"; } catch { return "cny"; }
};
const curKeep = (v) => { try { localStorage.setItem("dealio:cur", v); } catch { /* fine */ } };
const shown = (q) => {
  const amount = String(q?.amount ?? "").trim();
  if (!amount) return "";
  if (/^[^0-9]/.test(amount)) return amount;
  /* THOUSANDS SEPARATORS BACK ON. "¥2400" is a number somebody has to count
     the digits of; "¥2,400" is a price. The field takes bare digits since
     the currency picker — a phone keyboard has no comma on the number pad —
     and whatever was typed went straight onto every screen.

     Only a run of digits and nothing else. Anything already carrying a comma
     or a decimal point is left exactly as it was: re-grouping somebody's
     "1.5" or "2,400" is how an amount quietly becomes a different amount. */
  const body = /^\d+$/.test(amount)
    ? amount.replace(/\B(?=(\d{3})+(?!\d))/g, ",")
    : amount;
  return (CUR_SIGN[q.cur] || "") + body;
};
/* WHICH OF THE TWO SCREENS. Not a tab bar: two screens do not earn one, and
   a bar across the bottom would sit exactly where the two buttons are. */
let VIEW = "list";
/* Once per load. draw() runs again on every language change, every reload of
   the list and every sheet that closes, and re-focusing the amount each time
   would throw the keyboard up over whatever somebody was reading. */
let SEEN_PAD = false;

/* Copy without the async clipboard, which a phone refuses outside a gesture
   and WeChat's browser refuses entirely. The old trick still works there. */
function copyText(text) {
  try {
    const t = document.createElement("textarea");
    t.value = text;
    t.setAttribute("readonly", "");
    t.style.cssText = "position:fixed;top:0;left:0;opacity:0";
    document.body.append(t);
    t.select();
    t.setSelectionRange(0, text.length);
    const ok = document.execCommand("copy");
    t.remove();
    if (ok) return true;
  } catch { /* fall through */ }
  if (navigator.clipboard) { navigator.clipboard.writeText(text).catch(() => {}); return true; }
  return false;
}

/* SEND IT, RATHER THAN COPY IT AND GO AND FIND THE CHAT.
 *
 * Copy was the only way out of the sheet, which meant: press Copy, leave
 * Dealio, open WeChat, find the person, hold, paste, send. Six steps at the
 * exact moment the thing is finished and wants to be sent.
 *
 * The share sheet is one press and WeChat is in it, on both phones, along
 * with WhatsApp and Messages and everything else somebody might actually be
 * talking in. This board does not know anybody's WeChat and is never going
 * to; handing the message to the phone is the whole of what it can do, and
 * it turns out to be the right thing anyway.
 *
 * Falls back to copy, silently, everywhere it does not exist — desktop
 * browsers mostly, and WeChat's own in-app browser. A cancelled share is not
 * a failure and must not say so: AbortError is somebody changing their mind.
 */
async function shareOrCopy(text, btn, okKey) {
  if (navigator.share) {
    try {
      await navigator.share({ text });
      btn.textContent = T(okKey || "dl.sent");
      return;
    } catch (err) {
      if (err && err.name === "AbortError") return;
      /* Anything else — a browser that lists share and refuses it — falls
         through to copy rather than leaving the person with nothing. */
    }
  }
  btn.textContent = copyText(text) ? T("memo.copied") : T("ask.failed");
}

function top() {
  const b = el("div", "top");
  b.append(el("span", "dot"), el("span", "wm", "Dealio"));
  const slot = el("span", "langslot");
  b.append(slot);
  /* SIGN IN LIVES IN THE BANNER, not across the whole first screen.
     The front page used to be the door: a stranger met a sign-in wall with
     another product's name on it and never saw what the thing was. Signing
     in is what somebody who already belongs here wants, and they know where
     to look for it. Everybody else wants to know what this is. */
  if (STATE && !STATE.you) {
    const go = el("button", "signin", T("dl.signIn"));
    go.type = "button";
    go.addEventListener("click", signInSheet);
    b.append(go);
  }
  return { bar: b, slot };
}

/* THE WAYS IN, IN A SHEET, so the front page can be about the product.
 *
 * GOOGLE IS NOT ENOUGH ON ITS OWN AND THAT IS NOT A DETAIL: accounts.google
 * .com does not answer in the mainland, and the mainland is who this is for.
 * So the invite code is not a footnote under it — it is the road that works
 * for the people most likely to be standing here, and it is drawn the same
 * size. WeChat sign-in belongs beside them and needs a WeChat Open Platform
 * account this board does not have yet; the server says whether it exists
 * rather than the page drawing a button that cannot work, which is the same
 * rule the microphone runs on.
 */
/* ONE FACT, EXPLAINED. The bottom of the tree: a heading, a couple of
   sentences, and a way out. Deliberately the same sheet for all three — a
   thing that opens should always open the same way. */
function note(head, body) {
  const back = el("div", "sh");
  const card = el("div", "shc");
  card.append(el("h2", null, head));
  card.append(el("p", "notep", body));
  const acts = el("div", "acts");
  const shut = el("button", null, T("pay.close"));
  shut.type = "button";
  shut.addEventListener("click", () => back.remove());
  acts.append(shut);
  card.append(acts);
  back.append(card);
  back.addEventListener("click", (e) => { if (e.target === back) back.remove(); });
  document.body.append(back);
}

function signInSheet() {
  const back = el("div", "sh");
  const card = el("div", "shc");
  card.append(el("p", "lab", T("dl.signIn")));
  card.append(el("h2", null, T("dl.signInHead")));

  const say = el("p", "why");

  const g = el("button", "go wide", T("g.in"));
  g.type = "button";
  g.addEventListener("click", async () => {
    g.disabled = true;
    try {
      const r = await fetch("/api/signin/google", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ device, next: "/dealio" }),
      });
      const j = await r.json().catch(() => null);
      if (r.ok && j?.url) { location.href = j.url; return; }
      say.textContent = T(j?.error === "unconfigured" ? "dl.gOff" : "g.failed");
    } catch { say.textContent = T("g.failed"); }
    g.disabled = false;
  });
  card.append(g);

  /* Drawn only where it can work. Until then its absence is honest. */
  if (STATE?.canWeChat) {
    const w = el("button", "ghost2 wide", T("dl.wechatIn"));
    w.type = "button";
    w.addEventListener("click", () => { location.href = "/api/signin/wechat?next=/dealio"; });
    card.append(w);
  }

  const code = el("a", "ghost2 wide", T("dl.haveCode"));
  code.href = "/enter";
  card.append(code);
  card.append(el("p", "hint", T("dl.cnNote")));

  if (["again", "unknown", "here", "other", "failed"].includes(SIGNIN)) {
    say.textContent = T("g." + SIGNIN);
  }
  card.append(say);

  const acts = el("div", "acts");
  const shut = el("button", null, T("pay.close"));
  shut.type = "button";
  shut.addEventListener("click", () => back.remove());
  acts.append(shut);
  card.append(acts);
  back.append(card);
  back.addEventListener("click", (e) => { if (e.target === back) back.remove(); });
  document.body.append(back);
}

/* THREE SCREENS, NOT ONE SCREEN WITH THREE WARNINGS ON IT.
 *
 * It drew the same list every time and pushed whatever was wrong into a red
 * box above it. On a phone that had never signed in that meant a heading, a
 * warning, an empty-list message and no button — three things all saying
 * there is nothing here, floating in a tall black nothing, with not one
 * thing to tap. Tom looked at it and asked why it looked like that.
 *
 * So the state picks the screen. Signed out is a door and nothing else.
 * Empty is an invitation and nothing else. With requests in it, it is a list
 * — and only then is there a list to draw.
 */
/* THE FRONT PAGE IS WHAT /dealio OPENS ON, MEMBER OR NOT.
 *
 * It used to open straight on the pad once you were signed in, and the
 * landing page — the one thing there is to show somebody — became
 * unreachable for the only person who ever has to show it. ?out=1 drew it
 * back, but a parameter is a thing to remember and type, and typing is the
 * expensive part here; it was typed into a shell once and the shell said
 * "no matches found".
 *
 * So the plain address paints the front page and the button on it opens the
 * app. That is the product's own shape — coarse first, the detail one tap
 * in — and it costs a member one tap they take without thinking.
 *
 * Nothing here signs anybody out: it is which of two functions paints. FRONT
 * goes false the moment the button is tapped and stays false for the rest of
 * the visit, so nothing inside the app bounces back out. ?in=1 skips it
 * entirely, and ?out=1 is kept because links have been sent with it. */
let FRONT = (() => {
  try {
    const q = new URL(location.href).searchParams;
    if (q.get("in") === "1") return false;
  } catch { }
  return true;
})();

/* THE BAR'S WORDS, painted from the same keys the board's own bar uses, so
   the five tabs read the same on both sides of the door and a language change
   moves them together. Called from draw(), which is what runs again when the
   language button is pressed. */
function paintBoardBar() {
  /* NOT offsetParent. It is null for anything position:fixed, which this bar
     is, so the first version of this guard hid the words from the one skin
     that shows them. The attribute is what decides the bar either way. */
  const bar = document.getElementById("boardbar");
  if (!bar || document.documentElement.getAttribute("data-dealio") === "1") return;
  const say = (id, key) => { const e = document.getElementById(id); if (e) e.textContent = T(key); };
  say("bbnotes", "note.inbox");
  say("bbcards", "nav.cards");
  say("bbbrowse", "nav.browse");
  say("bbme", "nav.profile");
  say("bbmoney", "nav.money");
}

function draw() {
  paintBoardBar();
  const { bar: head, slot } = top();
  root.textContent = "";
  root.append(head);
  bar.textContent = "";
  bar.hidden = true;

  if (FRONT || (STATE && !STATE.you)) signedOut();
  else if (VIEW === "paid") paid();
  else if (VIEW === "books") booksView();
  else if (!(STATE?.requests || []).length) empty();
  else list();

  slot.replaceWith(langButton(draw));
}

/* ===========================================================================
 * THE HOME SCREEN IS THE AMOUNT
 * ===========================================================================
 *
 * It was two buttons over a list — a menu of destinations. Cash App's home
 * is a number with Request and Pay under it, and that arrangement is the
 * benchmark for this kind of app for a reason: the verb comes after the
 * number, because the number is the thing you already know. Nobody opens
 * this app wondering whether they want to ask or send. They open it knowing
 * "she owes me 2,400".
 *
 * So the amount is typed here, on the way in, and the sheet that follows
 * asks only who and what for. One screen, one thing, and the form lost its
 * biggest field.
 *
 * A NATIVE FIELD, NOT A DRAWN KEYPAD. Cash App draws its own; on the web
 * that means reimplementing a number pad, its backspace, its decimal rules
 * and its accessibility, to arrive back where inputmode="decimal" already
 * is. The phone's pad is also the one the person has used ten thousand
 * times.
 */
function pad() {
  const box = el("div", "pad");

  const row = el("div", "padrow");
  const sign = el("span", "padsign");
  const amount = el("input", "padamt");
  amount.id = "pad-amount";
  amount.type = "text";
  amount.inputMode = "decimal";
  amount.placeholder = "0";
  amount.setAttribute("aria-label", T("ask.amount"));
  /* THE FIELD IS AS WIDE AS THE NUMBER. Fixed width leaves a gap to the
     right of a short amount and drags the sign off centre, so ¥1 sits
     visibly left of the middle of the screen while ¥12,000 sits in it. */
  const fit = () => { amount.size = Math.max(1, (amount.value || "0").length); };
  fit();
  amount.addEventListener("input", fit);
  /* GROUPED WHEN THEY STOP, not as they type: putting separators in under a
     moving caret is how a caret ends up somewhere nobody asked for. */
  amount.addEventListener("blur", () => {
    const raw = amount.value.replace(/,/g, "").trim();
    if (/^\d+$/.test(raw)) amount.value = raw.replace(/\B(?=(\d{3})+(?!\d))/g, ",");
    fit();
  });
  row.append(sign, amount);
  box.append(row);

  const cur = el("select", "padcur");
  cur.id = "pad-cur";
  cur.setAttribute("aria-label", T("dl.cur"));
  for (const [code, label] of money()) {
    const o = el("option", null, label);
    o.value = code;
    cur.append(o);
  }
  cur.value = curPick();
  const paintSign = () => { sign.textContent = CUR_SIGN[cur.value] || ""; };
  paintSign();
  cur.addEventListener("change", () => { curKeep(cur.value); paintSign(); });
  box.append(cur);

  /* THE KEYPAD IS ALREADY UP. Cash App lands with the amount focused and you
     simply type; here it was a tap on the number first, every time, and the
     number is the only reason anybody opened the screen.

     Not on a phone that has just come back from somewhere, though: focusing
     a field throws the keyboard over the list somebody was returning to
     read. Only on a first arrival, and only when there is nothing typed. */
  if (!SEEN_PAD) {
    SEEN_PAD = true;
    queueMicrotask(() => { try { amount.focus({ preventScroll: true }); } catch { /* fine */ } });
  }

  const why = el("p", "why padwhy");
  const open = (way) => {
    const amt = amount.value.trim();
    /* An empty pad is not an error — it is somebody who came to look at the
       list. The sheet opens with the amount blank and asks for it there. */
    form(way, { amount: amt });
  };

  const two = el("div", "two padtwo");
  const ask = el("button", "go", T("dl.make"));
  ask.type = "button";
  ask.addEventListener("click", () => open("in"));
  /* SENDING MONEY IS THE OTHER HALF AND IT IS STRIPE'S. On a box whose
     Connect is not on, it takes a stranger to a button that can only fail,
     about their own bank details — so it is not offered at all there. The
     server says; no answer means yes, which is every board that had this
     before. See canSend in server.js. */
  const canSend = STATE?.canSend !== false;
  const send = canSend ? el("button", "ghost2", T("dl.send")) : null;
  if (send) {
    send.type = "button";
    send.addEventListener("click", () => open("out"));
  }
  two.append(ask, ...(send ? [send] : []));
  box.append(two, why);
  return box;
}

/* ===========================================================================
 * THE FRONT PAGE
 * ===========================================================================
 *
 * FIRST IT WAS A DOOR. A stranger met a sign-in wall carrying another
 * product's name, pressed the one button, was refused, and had nowhere to
 * go — never having seen a request or learned what it cost.
 *
 * THEN IT WAS A BROCHURE, which was worse in a different way: a hundred and
 * fifty words, three headings and two paragraphs of prose on the screen
 * somebody gives four seconds to.
 *
 * So: a headline, the payer's screen, three facts of four words each, and
 * the button. The paragraphs are one tap behind the lines that name them.
 *
 * The card is drawn rather than screenshotted: a screenshot of a dark app on
 * a dark page is a grey rectangle, and it goes stale the first time that
 * screen changes. It carries the whole argument — "they need no account" is
 * a claim, and a picture of their entire screen is the proof.
 */
function signedOut() {
  const box = el("div", "front");

  box.append(el("h1", "hero", T("dl.heroHead")));
  box.append(el("p", "herosub", T("dl.heroSub")));

  const demo = el("div", "demo");
  demo.append(el("p", "dlab", T("dl.demoWho", { who: "Tom" })));
  demo.append(el("p", "damt", "¥2,400"));
  demo.append(el("p", "dwhat", T("dl.demoWhat")));
  demo.append(el("div", "dbtn", T("dl.demoPay", { amount: "¥2,400" })));
  box.append(demo);

  /* HOW THEY PAY, SAID PROPERLY. It was a line of grey eight-point type
     along the bottom of the card, which is where a footnote goes — and this
     is not a footnote, it is the reason somebody in China can use this at
     all. Three marks, named, in the colours people already know them by. No
     logos: a hand-drawn WeChat or Alipay mark is a worse version of a thing
     everybody can recognise from its colour and its name. */
  const ways = el("div", "ways");
  for (const [k, cls] of [["wechat", "wx"], ["alipay", "ali"], ["card", "cd"]]) {
    const w = el("span", "way " + cls);
    w.append(el("i", "wdot"), el("span", null, T("dl.way." + k)));
    ways.append(w);
  }
  box.append(ways);

  /* THREE FACTS, AND THE PARAGRAPHS ONE TAP BEHIND THEM. Coarse first, finer
     when asked: the line names the thing and the sheet explains it, for the
     one person in ten who wants to know. Nothing was lost moving those
     paragraphs a tap deeper — they were not being read where they were. */
  const specs = el("div", "specs");
  for (const k of ["spec1", "spec2", "spec3"]) {
    const r = el("button", "spec");
    r.type = "button";
    r.append(el("span", null, T("dl." + k)));
    r.append(el("i", "chev", "\u203a"));
    r.addEventListener("click", () => note(T("dl." + k), T("dl." + k + ".p")));
    specs.append(r);
  }
  box.append(specs);

  /* ONE BUTTON, TWO MEANINGS, AND THE PERSON DECIDES WHICH. A stranger has
     to get through the door, so it says Sign in. A member is already in and
     is only looking at their own front page, so it says Open Dealio and
     paints the app — anything else would sit them in front of a sign-in
     sheet for an account they are already using. */
  const inAlready = Boolean(STATE && STATE.you);
  const go = el("button", "go wide", T(inAlready ? "dl.enterApp" : "dl.signIn"));
  go.type = "button";
  go.addEventListener("click", inAlready ? () => { FRONT = false; draw(); } : signInSheet);
  box.append(go);
  box.append(el("p", "hint", T("dl.payerNote")));

  root.append(box);
}

/* NOTHING YET IS THE SAME SCREEN WITH NOTHING UNDER IT. It used to be its
   own centred arrangement with its own heading, which meant the first thing
   somebody learned moved the moment they made a request. One screen. */
function empty() {
  /* THE SAME SHAPE WITH NOTHING IN IT. A money screen that opens on a bare
     pad has no answer to "how am I doing" — and zero is an answer. */
  root.append(topBlock());
  root.append(el("p", "none", T("dl.noneHead")));
  root.append(whereLink());
}

/* THE PAYOUT PROBLEM AS A ROW, not a red box across the top of the screen.
   It is a thing to go and fix, and a thing to go and fix is a row with a
   chevron; the explanation is one tap behind it like everything else here.
   The box shouted the same sentence at somebody every time they opened the
   app, which is how a warning becomes furniture. */
/** Earned and still to come, in one currency. */
function moneyRow(m) {
  const box = el("div", "mrow");
  const a = el("div", "mcol");
  a.append(el("span", null, T("earn.lab")));
  a.append(el("b", null, m.earned));
  box.append(a);
  /* Only when there is some. A second figure reading 0 beside the first is
     the empty these screens are already full of. */
  if (m.pendingMinor) {
    const b2 = el("div", "mcol");
    b2.append(el("span", null, T("earn.waiting")));
    b2.append(el("b", "pend", m.pending));
    box.append(b2);
  }
  return box;
}

function payoutRow() {
  const b = el("button", "spec warnrow");
  b.type = "button";
  const done = Boolean(STATE?.ready);
  const half = !done && Boolean(STATE?.started);
  b.append(el("span", null, T(half ? "dl.halfHead" : "dl.notReady")));
  b.append(el("i", "chev", "\u203a"));
  b.addEventListener("click", whereSheet);
  return b;
}

/* The way to your payout settings when nothing is wrong with them — quiet,
   at the foot, looked for once and then never again. */
function whereLink() {
  const a = el("button", "quietlink");
  a.type = "button";
  a.textContent = T("dl.whereMoney");
  a.addEventListener("click", whereSheet);
  return a;
}

function whereSheet() {
  const sheet = el("div", "sh");
  const card = el("div", "shc");
  card.append(el("p", "lab", T("dl.whereMoney")));
  card.append(payoutLine());
  const shut = el("button", null, T("pay.close"));
  shut.type = "button";
  shut.addEventListener("click", () => sheet.remove());
  const acts = el("div", "acts");
  acts.append(shut);
  card.append(acts);
  sheet.append(card);
  sheet.addEventListener("click", (e) => { if (e.target === sheet) sheet.remove(); });
  document.body.append(sheet);
}

/* NOWHERE FOR THE MONEY TO LAND, AND A WAY TO FIX IT.
 *
 * It said "you have not said where the money should land" and gave nothing
 * to press — an instruction about a thing that is not on the screen, which
 * is the same dead end the signed-out state had an hour ago. Stripe takes
 * the bank and the identity on its own pages; this is the door to them, and
 * it comes back here rather than to the board. */
function payoutLine() {
  const box = el("div", "fix");
  /* TWO STATES, NOT ONE. Never started, and started but not finished — and
     the second is the commoner of the two, because Stripe's onboarding is
     several screens and people leave in the middle of it. Telling somebody
     who stopped at the bank page that they have not said where the money
     should land is a sentence they know is wrong, and the button under it
     then looks like it will make them start again. */
  /* THREE STATES NOW, because this is reachable on purpose and not only when
     something is broken: all set, started and not finished, never started. */
  const done = Boolean(STATE?.ready);
  const half = !done && Boolean(STATE?.started);
  if (done) box.classList.add("okfix");
  box.append(el("p", "fixhead",
    T(done ? "dl.payOk" : half ? "dl.halfHead" : "dl.notReady")));
  box.append(el("p", "fixwhy",
    T(done ? "dl.payOkWhy" : half ? "dl.halfWhy" : "dl.notReadyWhy")));
  const b = el("button", "ghost",
    T(done ? "dl.payOkGo" : half ? "dl.halfGo" : "dl.setUp"));
  b.type = "button";
  b.addEventListener("click", async () => {
    b.disabled = true;
    b.textContent = T("dl.setUpGoing");
    try {
      const r = await fetch("/api/pay/onboard", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ device, back: "dealio" }),
      });
      const j = await r.json().catch(() => null);
      if (r.ok && j?.url) { location.href = j.url; return; }
      /* The board no longer guesses that somebody in the mainland cannot be
         paid — see the note over /api/pay/onboard. What is left is whether
         payments are on at all, and anything else Stripe said. */
      /* Stripe refusing to make accounts at all, because the platform behind
         this board has not finished its own activation, is a different thing
         from a payment failing — and it is the first thing a brand new live
         account hits. Named, with the page that fixes it. */
      b.textContent = T(j?.error === "unactivated" ? "dl.notLive"
        /* Refused rather than unfinished — see the note over dl.rejected. */
        : j?.error === "rejected" ? "dl.rejected"
        : j?.error === "off" ? "dl.setUpOff" : "pay.setUpNo");
    } catch { b.textContent = T("pay.setUpNo"); }
    b.disabled = false;
  });
  box.append(b);
  return box;
}

/* THE ONE MONEY SCREEN.
 *
 * It was two: Dealio, which can take money from a stranger with no account,
 * and the wallet, which is member-to-member on a provider nothing is
 * connected to. Both had Send, Request and a list of what is owed. Only one
 * of them worked, and the better-made screens were on the other.
 *
 * So this is the wallet's face on Dealio's rails, in the order Tom drew it:
 * what you have earned, the deals underneath as a column that drops down,
 * and then the pad — the thing that actually takes money — below them.
 *
 * THE FIGURE AND THE COLUMN COME OFF THE SAME DATA. Both are worked out from
 * this person's requests: `money` on /api/requests for the hero, /api/books
 * for the deals. A screen whose headline is fed by one ledger and whose list
 * is fed by another is a screen that will one day show A$0.00 over real
 * money — which is exactly what the wallet did.
 */
function list() {
  root.append(topBlock());

  /* TWO FOLDS, BOTH SHUT.
   *
   * The screen used to end in a list of cards headed "Still to settle" —
   * every open row, always, whether or not anybody wanted to look at one. On
   * a working month that is a wall of cards under the only two numbers
   * anybody opens this screen for.
   *
   * So each becomes a small window with its own figure on it: Pending, and
   * Deals. Shut by default. The figure is the answer; the list behind it is
   * for the times the figure is not.
   *
   * AND THE TWO NUMBERS AGREE WITH THE TWO LISTS, which is the whole reason
   * the split falls where it does. Pending counts money still coming TO you
   * and opens on exactly those rows. The money going OUT is the supplier
   * half of a deal — it is not something you are owed, and a "pending"
   * figure that quietly included it would be wrong in the direction that
   * flatters — so it lives under Deals, where both halves are shown side by
   * side anyway.
   */
  const mine = STATE.requests || [];
  const waiting = mine.filter((q) => q.state !== "paid" && (q.way || "in") !== "out");
  const pot = (STATE.money || [])[0];
  /* THE FIGURE IS MONEY, NOT A COUNT. It fell back to the number of rows
     when nothing was pending, so a settled month read "PENDING 0" — a bare
     zero with no sign, which is a count of something unnamed rather than an
     amount. The currency's own zero says the same thing and says it in the
     units the line above it is in. */
  root.append(fold(T("dl.pending"), pot ? pot.pending : "",
    waiting.length ? waiting.map((q) => row(q)) : [el("p", "none", T("dl.allSettled"))]));

  const deals = BOOKS?.deals || [];
  if (deals.length) {
    root.append(fold(T("bk.head"), String(deals.length), deals.map((d) => dealDrop(d))));
  } else if (BOOKS === null && mine.some((q) => q.deal || q.way === "out")) {
    /* Asked for once per visit, and only where there is something to ask
       about. The screen draws without it rather than waiting. */
    loadBooks();
  }

  /* THE TWO DEEPER SCREENS, at the foot and quiet. Both are looked for once:
     "has this person ever actually paid me", and the file for the
     accountant. Neither is a thing to meet on the way in. */
  const feet = el("div", "feet");
  if (mine.some((q) => q.state === "paid")) {
    const a = el("button", "hlink", T("dl.paidHead"));
    a.type = "button";
    a.addEventListener("click", () => { VIEW = "paid"; draw(); });
    feet.append(a);
  }
  if (mine.some((q) => q.deal || q.way === "out")) {
    const a = el("button", "hlink", T("bk.totals"));
    a.type = "button";
    a.addEventListener("click", () => { VIEW = "books"; BOOKS = null; draw(); });
    feet.append(a);
  }
  if (feet.children.length) root.append(feet);
  root.append(whereLink());
}

/* A SMALL WINDOW WITH ITS OWN FIGURE ON IT, that opens.
 *
 * The same <details> the deal rows use, for the same reasons: a screen
 * reader knows it is shut without being told, it works from the keyboard,
 * and it survives a repaint still open. */
function fold(label, figure, kids) {
  const box = el("details", "fold");
  const sum = el("summary");
  sum.append(el("span", "caret", "›"));
  sum.append(el("span", "fl", label));
  sum.append(el("span", "ff", figure));
  box.append(sum);
  const inner = el("div", "finner");
  for (const k of kids) if (k) inner.append(k);
  box.append(inner);
  return box;
}

/* ===========================================================================
 * PAID — WHAT SETTLED
 * ===========================================================================
 *
 * Both directions, newest first, grouped by the month it was asked. No chips:
 * everything on this screen is paid, and a badge saying so on every row is a
 * word repeated forty times. One line per row rather than a card — a card
 * says "separate object" and these are entries in a ledger.
 *
 * No new route. /api/requests already carries every request this person has,
 * in both directions, with its state on it.
 */
function paid() {
  const h = el("div", "hrow");
  h.append(el("h1", null, T("dl.paidHead")));
  const back = el("button", "hlink", T("dl.back"));
  back.type = "button";
  back.addEventListener("click", () => { VIEW = "list"; draw(); });
  h.append(back);
  root.append(h);
  root.append(el("p", "sub", T("dl.paidSub")));

  /* Sorted here rather than trusting the order it arrived in. /api/requests
     hands them over newest first, which is the same thing right up until a
     row is written out of order — and a ledger in almost-date order is worse
     than one in none, because nobody checks it. */
  const done = (STATE?.requests || []).filter((q) => q.state === "paid")
    .slice().sort((a, b) => String(b.at || "").localeCompare(String(a.at || "")));
  if (!done.length) {
    /* Reachable by pressing back on a phone after the last one was refunded
       or taken back. Empty is a sentence, not a blank screen. */
    root.append(el("p", "none", T("dl.paidNone")));
    return;
  }

  let seen = "";
  for (const q of done) {
    const d = new Date(q.at || Date.now());
    /* MONTH RULES INSTEAD OF A DATE ON EVERY ROW. The month is the thing
       being looked for — "did that August job ever land" — and repeating it
       down forty rows buries it. */
    const key = d.getFullYear() + "-" + d.getMonth();
    if (key !== seen) {
      seen = key;
      root.append(el("p", "mo", monthName(d)));
    }
    root.append(paidRow(q, d));
  }
}

/* The month as each language says it, and the year only when it is not this
   one — "September 2024" earns the year, "September" this year does not. */
function monthName(d) {
  const now = new Date();
  const opts = d.getFullYear() === now.getFullYear()
    ? { month: "long" } : { month: "long", year: "numeric" };
  try { return d.toLocaleDateString(lang() === "zh" ? "zh-CN" : "en-AU", opts); }
  catch { return String(d.getFullYear()); }
}

function paidRow(q, d) {
  const b = el("button", "prow");
  b.type = "button";
  b.append(el("span", "w", q.to || T("dl.someone")), el("span", "n", shown(q)));
  let day = "";
  try { day = d.toLocaleDateString(lang() === "zh" ? "zh-CN" : "en-AU",
    { day: "numeric", month: "short" }); } catch { /* leave it out */ }
  b.append(el("span", "t", [q.what, day,
    T(q.way === "out" ? "dl.rowOut" : "dl.rowIn")].filter(Boolean).join(" · ")));
  b.addEventListener("click", () => one(q));
  return b;
}

/* ===========================================================================
 * THE BOOKS — BOTH INVOICES OF A DEAL ON ONE LINE
 * ===========================================================================
 *
 * A deal through the WFOE is two invoices. The payer is invoiced by the
 * company they paid; the supplier invoices that same company. Nobody is paid
 * across a border in either direction, and what is left between the two
 * numbers is the margin.
 *
 * SO THE ONE THING THIS SCREEN DOES THAT NO OTHER CAN is put the two of them
 * on the same line. The live list has the money and the Paid screen has the
 * history, and neither can answer "what did we actually make on that job",
 * because the answer is a subtraction across two rows that nothing joined.
 *
 * THE MARGIN IS NEVER STORED — see lib/books.js. It is one row minus the
 * other, every time. A stored percentage is a third number that can disagree
 * with the two invoices under it, and on the day it does nothing can say
 * which of the three is lying.
 *
 * AND THE CSV IS NOT AN EXTRA. The person who needs this most does not use
 * this app: an accountant is sent one attachment and opens it in a
 * spreadsheet. A screen that can only be read on a phone is a screen whose
 * numbers get retyped, and retyped numbers are wrong numbers.
 */
let BOOKS = null;

async function loadBooks() {
  try {
    const r = await fetch("/api/books", { cache: "no-store", headers: { "x-board-device": device } });
    BOOKS = await r.json();
  } catch { BOOKS = { deals: [], totals: [], failed: true }; }
  if (VIEW === "books" || VIEW === "list") draw();
}

function booksView() {
  const h = el("div", "hrow");
  h.append(el("h1", null, T("bk.head")));
  const back = el("button", "hlink", T("dl.back"));
  back.type = "button";
  back.addEventListener("click", () => { VIEW = "list"; draw(); });
  h.append(back);
  root.append(h);

  if (!BOOKS) {
    root.append(el("p", "none", T("bk.loading")));
    loadBooks();
    return;
  }
  root.append(el("p", "sub", T("bk.sub")));

  /* THE MARGIN, AS THE NUMBER AT THE TOP, because it is the only figure on
     this screen somebody opens it to see. One per currency and never added
     together — the rule the Earned card has always run on. Only where both
     sides of that currency exist: money in with nothing out has a "margin"
     of 100%, which is not a margin, it is a deal that has not paid out yet. */
  for (const t of (BOOKS.totals || [])) {
    if (t.pct === null) continue;
    const box = el("div", "mrow");
    const a = el("div", "mcol");
    a.append(el("span", null, T("bk.margin")), el("b", null, t.gap));
    box.append(a);
    const b2 = el("div", "mcol");
    b2.append(el("span", null, T("bk.onWhat", { n: t.in })),
      el("b", "pend", t.pct + "%"));
    box.append(b2);
    root.append(box);
  }
  /* YUAN THROUGH THE WFOE, which is the figure its own books are kept in and
     the first one a Chinese auditor asks for. Quiet, under the margin: it is
     a fact to have to hand rather than a thing to watch. */
  /* THE TWO QUIET FACTS ON ONE LINE. Three stacked grey sentences under the
     headline is three things to read where the screen gets one glance — and
     they are both the same kind of fact, a figure to have to hand.
     THE SECOND IS DELIBERATELY NOT IN THE MARGIN ABOVE: counting it there
     made the headline read 32.4% on a book that was mostly jobs with no
     supplier attached yet, and every number in that sentence was
     individually true. */
  const facts = [
    BOOKS.cnyIn ? T("bk.cny", { n: BOOKS.cnyInShown }) : "",
    ...(BOOKS.open || []).filter((o) => o.inMinor).map((o) => T("bk.open", { n: o.in })),
  ].filter(Boolean);
  if (facts.length) root.append(el("p", "sub", facts.join(" \u00b7 ")));

  /* WHAT IS OUTSTANDING ON PAPER, counted on the server so the sentence and
     the list can never disagree. Money without a document is the state that
     costs money later, and it is invisible on every other screen. */
  const owing = [
    BOOKS.needInvoice ? T("bk.needInv", { n: BOOKS.needInvoice }) : "",
    BOOKS.needBill ? T("bk.needBill", { n: BOOKS.needBill }) : "",
  ].filter(Boolean);
  if (owing.length) root.append(el("p", "sub owing", owing.join(" · ")));

  if (!(BOOKS.deals || []).length) {
    root.append(el("p", "none", T("bk.none")));
    return;
  }
  for (const d of BOOKS.deals) root.append(dealRow(d));

  /* ONE BUTTON, AND IT IS A LINK RATHER THAN A FETCH. A blob download built
     in script is the thing that silently does nothing inside WeChat's
     browser; an anchor with a filename on the server is the thing that
     works everywhere. */
  const out = el("a", "quietlink", T("bk.csv"));
  out.href = "/api/books.csv";
  out.setAttribute("download", "");
  root.append(out);
}

/* THE TOP OF THE PAGE IS ITS OWN SURFACE.
 *
 * The money and the two verbs on one shade, the deals on the page under it.
 * Without the divide the screen was one undifferentiated column — a number,
 * some buttons, some rows — and nothing said which part was "how am I doing"
 * and which was "what is outstanding". A shade does that in the glance this
 * screen gets, without a heading to read.
 *
 * IT BLEEDS TO THE EDGES, which is what makes it read as a region of the
 * page rather than another card in a stack of cards. The negative side
 * margin cancels main's own padding; the padding inside puts the text back
 * where it was. No negative top margin — the brand bar is above it.
 */
function topBlock() {
  const box = el("div", "topblock");
  box.append(hero(), verbs());
  return box;
}

/* THE TWO VERBS. Both open the sheet that already asks for the amount when
   none was typed, which is what the pad was doing one step earlier and with
   three controls instead of two.
   SENDING IS STRIPE'S HALF and on a box whose Connect is off it takes a
   person to a button that can only fail, about their own bank details — so
   it is not offered there at all. The server says; no answer means yes,
   which is every board that had this before. See canSend in server.js. */
function verbs() {
  const box = el("div", "pills");
  const ask = el("button", null, T("dl.make"));
  ask.type = "button";
  ask.addEventListener("click", () => form("in", { amount: "" }));
  box.append(ask);
  /* SEND IS ALWAYS DRAWN. It used to be hidden on a board whose Connect is
     off, which is right about the dead end and wrong about the screen: it
     left one dark pill in the left half with a hole beside it, and the pair
     is the shape of this screen. So it is always there and only ever
     disabled — nobody can walk into the dead end, and nobody meets a screen
     that looks like it lost a button. On the real box Connect is on and it
     is simply live. */
  const send = el("button", null, T("dl.send"));
  send.type = "button";
  send.disabled = STATE?.canSend === false;
  send.addEventListener("click", () => form("out", { amount: "" }));
  box.append(send);
  return box;
}

/* THE HERO — WHAT YOU HAVE EARNED, AND WHAT IS STILL COMING.
 *
 * Never a balance. This board holds no money and must not look as though it
 * does: holding other people's money is a licence in Australia and 二清 in
 * China, and a zero in the biggest type on the screen was what the balance
 * actually produced.
 *
 * ONE PAIR PER CURRENCY, NEVER ADDED TOGETHER. ¥30,000 and A$2,000 are two
 * numbers and one of them needs a rate this board would have to invent. The
 * biggest is the hero; the rest get a quiet line BELOW the bank line, not
 * above it — directly under the hero they land where "Still to come" sits
 * and a reader binds them into one pair in the four seconds this gets.
 */
function hero() {
  const box = el("div", "whero");
  const pots = STATE?.money || [];
  const top = pots[0] || null;
  box.append(el("p", "k2", T("earn.lab")));
  box.append(el("p", "v", top ? top.earned : (CUR_SIGN[curPick()] || "") + "0"));
  /* "STILL TO COME" IS NOT HERE ANY MORE. The Pending fold below carries the
     same figure and opens on the rows behind it, so printing it here as well
     put one number on the screen twice, inches apart, with nothing to say
     which of the two was the live one. The hero keeps what has arrived. */

  /* WHERE IT LANDS, AND IT IS THE ONE LINE HERE THAT IS A THING TO GO AND
     FIX. It was a whole warning row across the screen, shouting the same
     sentence at somebody every time they opened the app, which is how a
     warning becomes furniture. As the third line of the hero it is read
     once, in place, next to the money it is about. */
  const ready = STATE?.ready;
  const half = !ready && STATE?.started;
  const b = el("button", "hq" + (ready ? "" : " warn2"));
  b.type = "button";
  b.textContent = ready
    ? T("wl.straightToBank") + " · " + T("wl.yourBank")
    : T(half ? "dl.halfHead" : "dl.notReady");
  b.addEventListener("click", whereSheet);
  box.append(b);

  for (const m of pots.slice(1)) {
    const bits = [m.earnedMinor ? T("earn.lab") + " " + m.earned : "",
      m.pendingMinor ? T("earn.waiting") + " " + m.pending : ""].filter(Boolean).join(" · ");
    if (bits) box.append(el("p", "hq", bits));
  }
  return box;
}

/* ONE DEAL: A SUMMARY LINE THAT DROPS DOWN, with everything it can be acted
   on with inside it. The line carries what a deal is called — the two names —
   and the figure that came in, which is the one somebody remembers it by.
   What has to be worked out is behind the tap. */
function dealDrop(d) {
  const names = [d.in?.who || T("dl.someone"), d.out?.who || T("bk.noOne")].join(" → ");
  const sum = el("summary");
  sum.append(el("span", "who", names));
  sum.append(el("span", "fig", d.in?.amount || d.out?.amount || ""));
  const meta = el("div", "meta");
  meta.append(el("span", "caret", "›"));
  meta.append(el("span", null, [d.no ? T("rq.no", { n: String(d.no).padStart(4, "0") }) : "",
    d.in?.what || "", when(d.at)].filter(Boolean).join(" · ")));
  sum.append(meta);

  const inner = el("div", "inner");
  const line = (k, v, cls) => {
    if (!v) return;
    const r = el("div", "dline" + (cls ? " " + cls : ""));
    r.append(el("span", null, k), el("span", null, v));
    inner.append(r);
  };
  line(T("wl.dIn"), d.in?.amount || "");
  /* WHAT ACTUALLY ARRIVED IN YUAN, at the rate on the day the code was drawn.
     A third number beside the other two rather than folded into them: those
     two are the supplier's currency so that the subtraction means something,
     and this is what was banked. */
  if (d.in?.cny) line(T("wl.dCny"), "¥" + (d.in.cny / 100).toLocaleString("en-US"));
  line(T("wl.dOut"), d.out?.amount || "");
  if (d.gap) line(T("wl.dGap"), d.gap.amount + "  ·  " + d.gap.pct + "%", "gap");
  else line(T("wl.dGap"), T("bk.why." + (d.why || "noCur")), "gap");
  if (d.in?.inv) line(T("wl.dInvTo"), d.in.inv.title);

  /* THE PAPERWORK, ONLY ONCE THE MONEY HAS MOVED. A document that is not
     owed yet is not outstanding, and red marks on a deal nobody has paid is
     a screen that cries wolf. */
  const chips = el("div", "dpaper");
  if (d.in && d.in.state === "paid") chips.append(el("span", "dchip " + (d.in.invoice === "issued" ? "ok" : "no"), T(d.in.invoice === "issued" ? "bk.cIssued" : "bk.cIssue")));
  if (d.out && d.out.state === "paid") chips.append(el("span", "dchip " + (d.out.billed ? "ok" : "no"), T(d.out.billed ? "bk.cBilled" : "bk.cBill")));
  if (chips.children.length) inner.append(chips);

  /* THE TWO TICKS, WHERE THE DEAL IS. Neither can be worked out here — a
     fapiao is issued in the tax bureau's own system and a supplier's invoice
     arrives as a PDF in an inbox — so they are asked for rather than
     guessed, next to the deal they are about. */
  const acts = el("div", "dacts");
  if (d.in && d.in.state === "paid" && d.in.inv) acts.append(tick(d.in.id, d.in.invoice === "issued", "bk.tIssued", "bk.tIssue", null));
  if (d.out && d.out.state === "paid") acts.append(tick(d.out.id, d.out.billed, "bk.tBilled", "bk.tBill", null));
  if (acts.children.length) inner.append(acts);

  const box = el("details", "deal");
  box.append(sum, inner);
  return box;
}

function dealRow(d) {
  const b = el("button", "d");
  b.type = "button";
  /* WHO TO WHO, in the order the money went. Two names is what a deal is
     called in anybody's head — never its id and never its number, which is
     what you look up once you have recognised it. */
  const names = [d.in?.who || T("dl.someone"), d.out?.who || T("bk.noOne")].join(" → ");
  b.append(el("span", "w", names));
  if (d.gap) b.append(el("span", "n", (d.gap.under ? "−" : "") + d.gap.amount));
  else b.append(el("span", "dwhy", T("bk.why." + (d.why || "noCur"))));
  /* THE TWO FIGURES THE MARGIN CAME OUT OF. Shown, always, because a margin
     with nothing under it is a number somebody has to take on trust. */
  b.append(el("span", "f", [d.in?.amount || "—", d.out?.amount || "—"].join(" → ")));
  if (d.gap) b.append(el("span", "p", d.gap.pct + "%"));
  b.append(el("span", "t", [
    d.no ? T("rq.no", { n: String(d.no).padStart(4, "0") }) : "",
    d.in?.what || "", when(d.at),
  ].filter(Boolean).join(" · ")));

  /* THE PAPERWORK. Only once the money has actually moved — a document that
     is not owed yet is not outstanding, and a row of red chips on a deal
     nobody has paid is a screen that cries wolf. */
  const chips = el("div", "paper");
  if (d.in && d.in.state === "paid") {
    chips.append(el("span", "pchip " + (d.in.invoice === "issued" ? "ok" : "no"),
      T(d.in.invoice === "issued" ? "bk.cIssued" : "bk.cIssue")));
  }
  if (d.out && d.out.state === "paid") {
    chips.append(el("span", "pchip " + (d.out.billed ? "ok" : "no"),
      T(d.out.billed ? "bk.cBilled" : "bk.cBill")));
  }
  if (chips.children.length) b.append(chips);
  b.addEventListener("click", () => dealSheet(d));
  return b;
}

/* THE ROW OPENS — the shape of the whole product. The line carries the
   concepts; everything that needs reading is one tap deeper. */
function dealSheet(d) {
  const back = el("div", "sh");
  const card = el("div", "shc");
  card.append(el("p", "lab", d.no ? T("rq.no", { n: String(d.no).padStart(4, "0") }) : T("bk.head")));
  card.append(el("h2", null, d.in?.what || T("bk.head")));

  const dl = el("dl");
  const term = (k, v) => {
    if (!v) return;
    const r2 = el("div", "dr");
    r2.append(el("dt", null, k), el("dd", null, v));
    dl.append(r2);
  };
  term(T("bk.payer"), d.in?.who || "");
  term(T("bk.invoiced"), d.in?.amount || "");
  /* WHAT ACTUALLY ARRIVED IN YUAN, at the rate on the day the code was
     drawn. It is a third number and it belongs beside the other two rather
     than folded into them: the two rows are the supplier's currency so that
     the subtraction means something, and this is what the WFOE banked. */
  if (d.in?.cny) term(T("bk.inCny"), CUR_SIGN.cny + (d.in.cny / 100).toLocaleString("en-US"));
  if (d.in?.inv) {
    term(T("bk.invTo"), d.in.inv.title);
    term(T("bk.invTax"), d.in.inv.taxId);
  }
  term(T("bk.supplier"), d.out?.who || "");
  term(T("bk.paidOut"), d.out?.amount || "");
  if (d.gap) term(T("bk.margin"), d.gap.amount + "  ·  " + d.gap.pct + "%");
  card.append(dl);

  const acts = el("div", "acts");
  /* THE SUPPLIER'S SIDE, MADE FROM THE PAYER'S, AND THE NUMBER IS NOT TYPED.
     That is the whole of why this button exists rather than a second trip
     through the make sheet: typing 1,900 beside 2,000 is how a deal quietly
     ends up at 4.7% and nobody notices for a quarter. */
  if (d.in && !d.out) {
    const add = el("button", null, T("bk.addSupplier"));
    add.type = "button";
    add.addEventListener("click", () => { back.remove(); supplierSheet(d); });
    acts.append(add);
  }
  /* THE TWO TICKS. Neither event touches this board — a fapiao is issued in
     the tax bureau's own system and a supplier's invoice arrives as a PDF in
     somebody's email — so neither can be worked out here, and a books screen
     that guessed would be worse than one that asks. */
  if (d.in && d.in.state === "paid" && d.in.inv) {
    acts.append(tick(d.in.id, d.in.invoice === "issued", "bk.tIssued", "bk.tIssue", back));
  }
  if (d.out && d.out.state === "paid") {
    acts.append(tick(d.out.id, d.out.billed, "bk.tBilled", "bk.tBill", back));
  }
  const shut = el("button", null, T("pay.close"));
  shut.type = "button";
  shut.addEventListener("click", () => back.remove());
  acts.append(shut);
  card.append(acts);
  back.append(card);
  back.addEventListener("click", (e) => { if (e.target === back) back.remove(); });
  document.body.append(back);
}

function tick(id, on, onKey, offKey, sheetBack) {
  const b = el("button", null, T(on ? onKey : offKey));
  b.type = "button";
  b.addEventListener("click", async () => {
    b.disabled = true;
    try {
      await fetch("/api/request/" + id + "/paper", {
        method: "POST", headers: { "content-type": "application/json" },
        body: JSON.stringify({ device, on: !on }),
      });
    } catch { /* the reload below says what actually happened */ }
    if (sheetBack) sheetBack.remove();
    BOOKS = null;
    await loadBooks();
  });
  return b;
}

function supplierSheet(d) {
  const back = el("div", "sh");
  const card = el("div", "shc");
  card.append(el("p", "lab", T("bk.addSupplier")));
  /* THE NUMBER, BEFORE THE NAME, because the number is the thing being
     agreed to and it is already worked out. Nobody opens this wondering how
     much — they open it knowing who. */
  card.append(el("h2", null, T("bk.willPay", {
    n: d.in?.amount || "", pct: String(BOOKS?.feePct ?? 5),
  })));

  const inp = el("input");
  inp.id = "supname";
  inp.type = "text";
  inp.placeholder = T("bk.supplierEg");
  const wrap = el("label");
  wrap.append(el("span", null, T("bk.supplierName")), inp);
  card.append(wrap);

  const bad = el("p", "why");
  bad.hidden = true;
  card.append(bad);

  const acts = el("div", "acts");
  const go = el("button", "go", T("bk.makeIt"));
  go.type = "button";
  go.addEventListener("click", async () => {
    const to = inp.value.trim();
    if (!to) { inp.focus(); return; }
    go.disabled = true;
    try {
      const r = await fetch("/api/request/" + d.in.id + "/supplier", {
        method: "POST", headers: { "content-type": "application/json" },
        body: JSON.stringify({ device, to }),
      });
      const j = await r.json().catch(() => null);
      if (r.ok && j?.ok) {
        back.remove();
        BOOKS = null;
        await load();
        await loadBooks();
        return;
      }
      bad.textContent = T(j?.error === "already" ? "bk.eAlready"
        : j?.error === "amount" ? "bk.eAmount" : "ask.failed");
      bad.hidden = false;
    } catch { bad.textContent = T("ask.failed"); bad.hidden = false; }
    go.disabled = false;
  });
  const no = el("button", null, T("pay.cancel"));
  no.type = "button";
  no.addEventListener("click", () => back.remove());
  acts.append(go, no);
  card.append(acts);
  back.append(card);
  back.addEventListener("click", (e) => { if (e.target === back) back.remove(); });
  document.body.append(back);
  inp.focus();
}

function row(q) {
  const b = el("button", "q");
  b.type = "button";
  /* WHATEVER ACTUALLY NAMES IT, FIRST. Who it is for, and when nobody was
     named, what it is for — most requests go to somebody not on this board
     and the name is optional, so rows read "Somebody" in bold with the one
     useful word ("a test", "12 lessons") buried in the quiet line under it.
     The line below drops what it has already said. */
  const title = q.to || q.what || T("dl.someone");
  b.append(el("span", "w", title), el("span", "n", shown(q)));
  /* Which way, first, because a list of both needs it before anything else:
     "→ Mei" is money leaving and "← Sasha" is money coming. */
  b.append(el("span", "t", [T(q.way === "out" ? "dl.rowOut" : "dl.rowIn"),
    q.what === title ? "" : q.what,
    q.no ? T("rq.no", { n: String(q.no).padStart(4, "0") }) : "",
    when(q.at)].filter(Boolean).join(" · ")));
  const state = q.off ? "off" : q.state;
  b.append(el("span", "c" + (state === "paid" ? " ok" : state === "off" ? " off" : ""),
    T("dl.st." + state)));
  b.addEventListener("click", () => one(q));
  return b;
}

/* MAKING ONE. Three fields and one is optional. Everything else — what is
   covered, what happens if it is called off — is a deal memo, and that lives
   on the board. Most money between two people who have just agreed something
   needs a number and a sentence. */
/* ===========================================================================
 * SAYING IT INSTEAD OF TYPING IT
 * ===========================================================================
 *
 * Press, talk, and the form fills itself. Either language, or both in one
 * sentence, which is what actually gets said around here.
 *
 * NOTHING IS WRITTEN UNTIL THEY SAY YES, and that is not a nicety to be
 * dropped when the extraction gets good — it is the whole safety of the
 * feature. A model pulling money terms out of speech will be wrong
 * eventually and it is money, so what comes back is a guess and a plain
 * sentence, and the person who spoke reads their own words back and confirms
 * them before anything exists.
 *
 * WHY THE SERVER TRANSCRIBES AND NOT THE BROWSER. The same reason lib/hear.js
 * gives: in a standalone iPhone app webkitSpeechRecognition is defined and
 * does nothing, and Chrome's recogniser is Google's, which is not reachable
 * from inside China. Both are exactly the people this is for. getUserMedia
 * and MediaRecorder work in both places; it is only the recogniser that does
 * not.
 */
let recording = null;

function micButton(onHeard) {
  const b = el("button", "mic");
  b.type = "button";
  b.append(el("span", "dotrec"), el("span", "micsay", T("dl.say")));
  b.addEventListener("click", async () => {
    if (recording) { stopRecording(); return; }
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      const bits = [];
      const rec = new MediaRecorder(stream);
      rec.ondataavailable = (e) => { if (e.data && e.data.size) bits.push(e.data); };
      rec.onstop = async () => {
        stream.getTracks().forEach((t) => t.stop());
        recording = null;
        b.classList.remove("on");
        b.querySelector(".micsay").textContent = T("dl.hearing");
        b.disabled = true;
        try {
          const blob = new Blob(bits, { type: rec.mimeType || "audio/webm" });
          const r = await fetch("/api/request/hear", {
            method: "POST",
            headers: { "Content-Type": blob.type, "x-board-device": device },
            body: blob,
          });
          const j = await r.json().catch(() => null);
          if (r.ok && j?.ok) { onHeard(j); b.disabled = false;
            b.querySelector(".micsay").textContent = T("dl.say"); return; }
          /* Each refusal says which, rather than one grey "that did not
             work". "Quiet" and "a key is missing" are different problems and
             only one of them is worth pressing again for. */
          b.querySelector(".micsay").textContent = T(
            j?.error === "quiet" ? "dl.sayQuiet"
            : j?.error === "off" ? "dl.sayOff"
            : j?.error === "long" ? "dl.sayLong" : "dl.sayNo");
        } catch { b.querySelector(".micsay").textContent = T("dl.sayNo"); }
        b.disabled = false;
      };
      rec.start();
      recording = rec;
      b.classList.add("on");
      b.querySelector(".micsay").textContent = T("dl.sayStop");
    } catch {
      /* No microphone, or permission refused. Not an error to shout about —
         the fields are right there and typing them always worked. */
      b.querySelector(".micsay").textContent = T("dl.sayNoMic");
      b.disabled = true;
    }
  });
  return b;
}

function stopRecording() {
  try { if (recording) recording.stop(); } catch { recording = null; }
}

/** HAVE I GOT THIS RIGHT.
 *
 *  The sentence they will confirm, in their own language, containing every
 *  fact that was extracted and no fact that was not. Yes fills the form.
 *  No throws it away and leaves them exactly where they were, with the
 *  fields empty and the microphone ready.
 *
 *  THE ONE QUESTION. When something important is missing — most often the
 *  amount — it asks, once, under the sentence. A form with a blank in it
 *  tells nobody what is missing; a question does.
 */
function heardSheet(j, fill) {
  const back = el("div", "sh");
  const card = el("div", "shc");
  card.append(el("p", "lab", T("dl.right")));
  card.append(el("p", "heard", j.terms.say));
  if (j.terms.ask) card.append(el("p", "askline", j.terms.ask));
  /* Their own words underneath, quieter. What the machine heard is worth
     seeing when what it made of it looks wrong. */
  card.append(el("p", "saidraw", j.said));

  const acts = el("div", "acts");
  const yes = el("button", "go", T("dl.yes"));
  yes.type = "button";
  yes.addEventListener("click", () => { back.remove(); fill(j.terms); });
  const no = el("button", null, T("dl.no"));
  no.type = "button";
  no.addEventListener("click", () => back.remove());
  acts.append(yes, no);
  card.append(acts);
  back.append(card);
  back.addEventListener("click", (e) => { if (e.target === back) back.remove(); });
  document.body.append(back);
}

function form(way, prefill) {
  const out = way === "out";
  const back = el("div", "sh");
  const card = el("div", "shc");
  card.append(el("p", "lab", T(out ? "dl.send" : "dl.make")));
  card.append(el("h2", null, T(out ? "dl.formSend" : "dl.formHead")));

  const field = (name, label, cls, ph) => {
    const l = el("label");
    l.append(el("span", null, label));
    const i = el("input", cls || "");
    i.id = "f-" + name;
    if (ph) i.placeholder = ph;
    l.append(i);
    card.append(l);
    return i;
  };
  /* THE MICROPHONE ABOVE THE FIELDS, not beside one of them: it fills all of
     them, and a button inside the first field would say it fills that one.
     Only when the server has both keys behind it — the page asks rather than
     drawing a microphone that cannot work. */
  let mic = null;
  if (STATE?.canHear) {
    mic = micButton((j) => heardSheet(j, (t) => {
      if (t.amount) amount.value = t.amount;
      if (t.what) what.value = t.what;
      /* Said out loud, so it exists — reveal the field rather than filling
         one nobody can see. */
      if (t.when) { whn.value = t.when; whenWrap.hidden = false; whenAdd.hidden = true; }
      if (t.to && !who.value.trim()) who.value = t.to;
      /* Straight to whatever is still empty. The commonest miss is the
         amount, and it is the one field that cannot be left blank. */
      (!amount.value.trim() ? amount : !what.value.trim() ? what : whn).focus();
    }));
    card.append(mic);
    card.append(el("p", "micor", T("dl.orType")));
  }

  const amtWrap = el("label");
  amtWrap.append(el("span", null, T("ask.amount")));
  const amtRow = el("div", "amtrow");
  const amount = el("input", "amt");
  amount.id = "f-amount";
  amount.placeholder = "2,400";
  amount.inputMode = "decimal";
  /* THE NUMBER CAME FROM THE HOME SCREEN. Cash App's home is the amount and
     the verb comes after it, which is right for this too: you always know
     the number — "she owes me 2,400" — and who it is for is the easy part.
     So the field arrives full and the cursor goes to the name instead. */
  if (prefill && prefill.amount) amount.value = prefill.amount;
  const cur = el("select");
  cur.id = "f-cur";
  cur.setAttribute("aria-label", T("dl.cur"));
  for (const [code, label] of money()) {
    const o = el("option", null, label);
    o.value = code;
    cur.append(o);
  }
  /* Remembered per phone: somebody asking in RMB today is asking in RMB next
     week, and picking it again every time is a step that is only ever needed
     once. Wrapped because a private window throws on read. */
  cur.value = curPick();
  cur.addEventListener("change", () => curKeep(cur.value));
  amtRow.append(amount, cur);
  amtWrap.append(amtRow);
  card.append(amtWrap);
  const who = field("to", T(out ? "dl.whoOut" : "dl.who"), "", T("dl.whoEg"));
  /* SAFARI OFFERED HIM HIS OWN NAME. With no autocomplete hint an iOS text
     field next to the word "Who" is taken for a contact field, so the
     keyboard grew an AutoFill Contact bar over the button and suggested
     "Tom Shanahan" — the one person this can never be for. */
  who.autocomplete = "off";
  who.setAttribute("autocapitalize", "words");
  who.spellcheck = false;

  /* THE PEOPLE YOU ALREADY ASK, as chips under the field. Venmo and Cash App
     both put recent people one tap away, and for good reason: it is the same
     five people over and over, and typing a name into a phone keyboard is
     the longest thing on this screen. Newest first, deduplicated, six at
     most — a row that wraps to three lines is a list, and a list belongs
     somewhere else. */
  const seen = [];
  for (const q of (STATE?.requests || [])) {
    const n = String(q.to || "").trim();
    if (n && !seen.includes(n)) seen.push(n);
    if (seen.length >= 6) break;
  }
  if (seen.length) {
    const chips = el("div", "whos");
    for (const n of seen) {
      const c = el("button", "whochip", n);
      c.type = "button";
      c.addEventListener("click", () => {
        who.value = n;
        /* Straight on to the thing still missing rather than leaving the
           cursor on a field that is now full. */
        (what.value.trim() ? go : what).focus();
      });
      chips.append(c);
    }
    card.append(chips);
  }

  const what = field("what", T("ask.what"), "", T("ask.whatEg"));

  /* WHEN, BEHIND A TAP. It is optional, and an optional field on the screen
     is still a field to read past — four of them on one sheet is what "too
     much" looks like on a form. Most requests do not have a date on them. */
  const whn = el("input");
  whn.id = "f-when";
  whn.placeholder = T("ask.whenEg");
  const whenWrap = el("label");
  whenWrap.hidden = true;
  whenWrap.append(el("span", null, T("ask.when")), whn);
  const whenAdd = el("button", "addwhen", T("dl.addWhen"));
  whenAdd.type = "button";
  whenAdd.addEventListener("click", () => {
    whenWrap.hidden = false;
    whenAdd.hidden = true;
    whn.focus();
  });
  card.append(whenAdd, whenWrap);

  const why = el("p", "why");
  const acts = el("div", "acts");
  const go = el("button", "go", T(out ? "dl.sendMake" : "ask.make"));
  go.type = "button";
  const no = el("button", null, T("pay.cancel"));
  no.type = "button";
  no.addEventListener("click", () => { stopRecording(); back.remove(); });

  go.addEventListener("click", async () => {
    const amt = amount.value.trim();
    if (!amt) { why.textContent = T("ask.needAmount"); amount.focus(); return; }
    go.disabled = true;
    why.textContent = "";
    try {
      const r = await fetch("/api/request", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ device, way: out ? "out" : "in",
          to: who.value.trim(), amount: amt, cur: cur.value,
          what: what.value.trim(), when: whn.value.trim() }),
      });
      const j = await r.json().catch(() => null);
      if (r.ok && j?.ok) {
        back.remove();
        /* THE SIGN GOES BACK ON FOR THE MESSAGE. The field takes bare
           digits now, and "Mei — 2,400 for 12 lessons" pasted into WeChat is
           an amount in no particular currency. */
        sent({ to: who.value.trim(), amount: CUR_SIGN[cur.value] + amt,
               what: what.value.trim(), url: j.url, way: out ? "out" : "in" });
        load();
        return;
      }
      why.textContent = T(j?.error === "profile" ? "deal.needProfile" : "ask.failed");
    } catch { why.textContent = T("ask.failed"); }
    go.disabled = false;
  });

  acts.append(go, no);
  card.append(why, acts);
  back.append(card);
  back.addEventListener("click", (e) => { if (e.target === back) back.remove(); });
  document.body.append(back);
  (amount.value.trim() ? who : amount).focus();
}

/** The message, written. One press made the request and this is the other
 *  half of that press — nobody makes one and then goes looking for what to do
 *  next. This page does not know their WeChat and is not going to: it writes
 *  the words and the person pastes them where they are already talking. */
function sent(q) {
  const back = el("div", "sh");
  const card = el("div", "shc");
  card.append(el("p", "lab", T("ask.ready")));
  card.append(el("h2", null, T("ask.to", { who: q.to || T("dl.someone") })));

  /* TZh, not T — see the note over it. This block is read by the person in
     China, not the person sending it. */
  const text = TZh(q.way === "out" ? "dl.sendBlock" : "ask.block",
    { to: q.to || "", amount: q.amount, what: q.what || "", url: q.url });
  const box = el("textarea", "msg");
  box.readOnly = true;
  box.rows = 7;
  box.value = text;
  box.setAttribute("aria-label", T("ask.ready"));
  card.append(box);
  /* A person who cannot read the thing they are about to send needs to be
     told it is deliberate, once, in their own language. */
  card.append(el("p", "zhnote", T("ask.inZh")));

  const acts = el("div", "acts");
  /* The solid one is Send, not Copy. The request exists; the only thing left
     is getting it to the person, and that is one press now. */
  const go = el("button", "go", T(navigator.share ? "dl.sendIt" : "memo.copy"));
  go.type = "button";
  go.addEventListener("click", () => shareOrCopy(text, go));
  const done = el("button", null, T("ask.shut"));
  done.type = "button";
  done.addEventListener("click", () => back.remove());
  acts.append(go, done);
  card.append(acts);
  card.append(el("p", "hint", T(q.way === "out" ? "dl.sendHint" : "ask.nothingOwed")));
  back.append(card);
  back.addEventListener("click", (e) => { if (e.target === back) back.remove(); });
  document.body.append(back);
}

/** One request, opened from the list: what it says, the message again, and a
 *  way to take it back. Settled ones cannot be withdrawn — the money moved. */
function one(q) {
  const back = el("div", "sh");
  const card = el("div", "shc");
  card.append(el("p", "lab", T("dl.st." + (q.off ? "off" : q.state))));
  card.append(el("h2", null, shown(q) + " · " + (q.to || T("dl.someone"))));

  const dl = el("dl");
  for (const [k, v] of [[T("ask.what"), q.what], [T("rq.when"), q.when],
                        [T("rq.asked"), when(q.at)]]) {
    if (!v) continue;
    const d = el("div", "dr");
    d.append(el("dt", null, k), el("dd", null, v));
    dl.append(d);
  }
  card.append(dl);

  const acts = el("div", "acts");
  if (!q.off && q.state !== "paid") {
    /* SEND AGAIN, because that is what somebody opens an unpaid request to
       do. It was Copy, which is the same six steps as before: copy, leave,
       find the chat, hold, paste, send — at the moment you are trying to
       nudge somebody, which is already an awkward thing to be doing. */
    const text = TZh(q.way === "out" ? "dl.sendBlock" : "ask.block",
      { to: q.to || "", amount: shown(q), what: q.what || "", url: q.url });
    const go = el("button", "go",
      T(navigator.share ? "dl.sendAgain" : "memo.copy"));
    go.type = "button";
    go.addEventListener("click", () => shareOrCopy(text, go));
    acts.append(go);
    const off = el("button", null, T("dl.off"));
    off.type = "button";
    off.addEventListener("click", async () => {
      off.disabled = true;
      try {
        const r = await fetch("/api/request/" + q.id + "/off", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ device }),
        });
        if (r.ok) { back.remove(); load(); return; }
      } catch { /* below */ }
      off.disabled = false;
      off.textContent = T("ask.failed");
    });
    acts.append(off);
  }
  const shut = el("button", null, T("pay.close"));
  shut.type = "button";
  shut.addEventListener("click", () => back.remove());
  acts.append(shut);
  card.append(acts);
  back.append(card);
  back.addEventListener("click", (e) => { if (e.target === back) back.remove(); });
  document.body.append(back);
}

async function load() {
  try {
    const r = await fetch("/api/requests", {
      cache: "no-store", headers: { "x-board-device": device },
    });
    STATE = r.ok ? await r.json() : { requests: [], ready: false };
  } catch { STATE = STATE || { requests: [], ready: false }; }
  draw();
}

/* STRAIGHT TO THE SHEET, FROM PROFILE. The money card on your own page has
   Ask, Send and "Where your money lands" on it, and each of those landing
   here on the pad — to press the same button a second time — is the step the
   card exists to remove. ?ask= names the sheet; it is read once and taken
   off the address so a reload is the ordinary screen. */
let ASK = (() => {
  try {
    const u = new URL(location.href);
    const a = String(u.searchParams.get("ask") || "");
    if (!a) return "";
    u.searchParams.delete("ask");
    history.replaceState(null, "", u);
    return ["in", "out", "where"].includes(a) ? a : "";
  } catch { return ""; }
})();

setLang(pickLang());
load().then(() => {
  if (!ASK || !STATE?.you) return;
  const a = ASK;
  ASK = "";
  if (a === "where") whereSheet();
  else if (a === "in" || STATE.canSend !== false) form(a, { amount: "" });
});
</script>
</body>
</html>
