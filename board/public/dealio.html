<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
{{DEMO}}
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#0B0E15">
<title>Dealio</title>
<meta name="description" content="Ask somebody to pay you.">
<meta name="robots" content="noindex">
<meta http-equiv="Cache-Control" content="no-cache">
<meta name="color-scheme" content="dark">
<style>
  /* ITS OWN LOOK, AND ON PURPOSE.
     This is step one of three — a page here, then its own domain, then an app
     if it ever earns one — and a page wearing the board's chrome and the
     board's palette is a page that cannot leave. Dark, one accent, a serif
     for the numbers, rules instead of boxes. Single-theme by choice: it is
     one product with one face rather than a page that borrows whichever the
     phone is set to. */
  :root{
    --bg:#0B0E15; --card:#141924; --ink:#E9EDF5; --ink2:#A3B0C4; --mut:#6F7D92;
    --line:#232B39; --hair:#1C2330; --acc:#D6483B; --accink:#fff; --ok:#3FBE7D;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",
      "Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;
    --serif:Georgia,"Songti SC","Noto Serif CJK SC",'Times New Roman',serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink)}
  body{font-family:var(--sans);font-size:16px;line-height:1.5;
    padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
  main{max-width:34rem;margin:0 auto;padding:1.1rem .9rem 10rem}
  .top{display:flex;align-items:center;gap:.5rem;margin:0 0 1.2rem}
  .dot{width:.55rem;height:.55rem;border-radius:50%;background:var(--acc);
    flex:0 0 auto}
  .wm{font-size:.7rem;letter-spacing:.2em;text-transform:uppercase;color:var(--mut)}
  .lang{margin-left:auto;border:1px solid var(--line);background:none;
    color:var(--ink2);font:inherit;font-size:.78rem;padding:.25rem .7rem;
    border-radius:99px}
  h1{margin:0 0 .15rem;font-size:1.35rem;line-height:1.25}
  /* THE HEADING AND THE WAY OUT OF IT, on one line. A back arrow in the
     corner is a place on a screen; a word beside the heading is a word. */
  .hrow{display:flex;align-items:baseline;gap:.9rem}
  .hrow h1{flex:1 1 auto;min-width:0}
  .hlink{flex:0 0 auto;border:0;background:none;color:var(--acc);font:inherit;
    font-size:.88rem;padding:.25rem 0;cursor:pointer}
  /* The invite code, under Continue with Google. A link, not a second button:
     almost nobody meeting that screen has a code, and two buttons of equal
     weight would make it look like a choice worth stopping over. */
  .quietlink{display:inline-block;margin:.9rem 0 0;color:var(--ink2);
    font-size:.88rem}
  /* A MONTH, AS A RULE ACROSS THE LIST. */
  .mo{margin:1.6rem 0 .5rem;padding:0 0 .5rem;border-bottom:1px solid var(--line);
    font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;color:var(--mut)}
  .mo:first-of-type{margin-top:1.1rem}
  /* A SETTLED ROW IS A LINE, NOT A CARD. Everything here is paid, so nothing
     on it needs lifting off the page. */
  .prow{display:grid;grid-template-columns:1fr auto;gap:.1rem .8rem;
    align-items:baseline;width:100%;text-align:left;border:0;background:none;
    color:var(--ink);font:inherit;padding:.75rem 0;cursor:pointer}
  .prow .w{font-weight:600}
  .prow .n{font-family:var(--serif);font-size:1.2rem;text-align:right;
    font-variant-numeric:tabular-nums}
  .prow .t{grid-column:1/-1;color:var(--mut);font-size:.82rem}
  .none{margin:2rem 0;color:var(--mut);text-align:center}
  .sub{margin:0 0 1.3rem;color:var(--mut);font-size:.92rem}
  /* A ROW IS A REQUEST. Amount on the right and in the serif, because that is
     what the eye runs down the list looking for. */
  .q{display:grid;grid-template-columns:1fr auto;gap:.1rem .8rem;
    align-items:baseline;width:100%;text-align:left;border:0;
    background:var(--card);color:var(--ink);font:inherit;
    padding:.9rem .95rem;border-radius:.9rem;margin:0 0 .55rem;cursor:pointer}
  .q .w{font-weight:600}
  .q .n{font-family:var(--serif);font-size:1.45rem;text-align:right;
    font-variant-numeric:tabular-nums}
  .q .t{grid-column:1;color:var(--mut);font-size:.84rem}
  .q .c{grid-column:2;justify-self:end;font-size:.66rem;letter-spacing:.12em;
    text-transform:uppercase;padding:.14rem .55rem;border-radius:99px;
    background:var(--line);color:var(--ink2)}
  .q .c.ok{background:rgba(63,190,125,.14);color:var(--ok)}
  .q .c.off{opacity:.55}
  /* THE WHOLE SCREEN, WHEN THE SCREEN HAS ONE THING TO SAY.
     Centred and vertically placed rather than stacked at the top of a tall
     black nothing: a page with one message on it should look composed, not
     abandoned. min-height fills the viewport less the header. */
  .mid{min-height:calc(100dvh - 9rem);display:flex;flex-direction:column;
    align-items:center;justify-content:center;text-align:center;
    padding:1rem 0 3rem}
  .mid .big{margin:0;font-family:var(--serif);font-size:2.7rem;line-height:1;
    letter-spacing:-.01em}
  .mid .line{margin:.6rem 0 0;max-width:19rem;color:var(--ink2);font-size:1rem;
    line-height:1.5}
  .mid hr{width:2.5rem;border:0;border-top:1px solid var(--line);margin:1.8rem 0}
  .mid .mhead{margin:0;font-size:1.05rem;color:var(--ink)}
  .mid .msub{margin:.4rem 0 1.6rem;max-width:19rem;color:var(--mut);
    font-size:.92rem;line-height:1.5}
  .mid .go,.mid button,.mid a.go{display:block;width:100%;max-width:19rem;
    border:0;border-radius:99px;background:var(--acc);color:var(--accink);
    font:inherit;font-size:.95rem;font-weight:600;letter-spacing:.08em;
    text-transform:uppercase;padding:1rem 1.2rem;min-height:3.4rem;
    text-decoration:none;cursor:pointer}
  /* TWO THINGS A PERSON CAN DO, and the second is not hidden behind a menu:
     sending money is half the cases. Stacked rather than side by side —
     at 390px two uppercase labels in one row crush to two lines each. */
  .two{display:flex;flex-direction:column;gap:.5rem;width:100%;
    max-width:19rem;margin:0 auto}
  .mid .two button,.make .two button{max-width:none}
  .two .ghost2{background:none;border:1px solid var(--line);color:var(--ink)}
  /* The one thing standing between somebody and being paid, said with the
     button that fixes it rather than as a line of red text. */
  .fix{margin:1.4rem 0 0;max-width:20rem;padding:.95rem 1rem;border-radius:.9rem;
    background:rgba(214,72,59,.12);text-align:center}
  main > .fix{margin:0 auto 1rem}
  .fixhead{margin:0;font-size:.95rem;color:var(--ink)}
  .fixwhy{margin:.3rem 0 .9rem;font-size:.85rem;line-height:1.5;color:var(--ink2)}
  .fix .ghost{display:block;width:100%;border:1px solid var(--acc);
    background:none;color:var(--ink);font:inherit;font-size:.9rem;
    font-weight:600;letter-spacing:.06em;text-transform:uppercase;
    padding:.8rem 1rem;border-radius:99px;min-height:3rem;cursor:pointer}
  /* THE ONE BUTTON, PINNED. It is the only thing this page is for, so it does
     not scroll away under a list. */
  .make{position:fixed;left:0;right:0;bottom:0;padding:.8rem .9rem
    calc(.8rem + env(safe-area-inset-bottom,0));background:linear-gradient(
      to top, var(--bg) 60%, rgba(11,14,21,0));}
  .make .two{max-width:33rem}
  .make button{display:block;width:100%;max-width:33rem;margin:0 auto;border:0;
    border-radius:99px;background:var(--acc);color:var(--accink);font:inherit;
    font-size:.95rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;
    padding:1rem 1.2rem;min-height:3.4rem;cursor:pointer}
  .warn{margin:0 0 1rem;padding:.8rem .9rem;border-radius:.8rem;
    background:rgba(214,72,59,.12);color:var(--ink2);font-size:.88rem;
    line-height:1.5}
  .warn b{display:block;color:var(--ink);margin:0 0 .2rem}
  /* The sheets. */
  .sh{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.6);
    display:flex;align-items:flex-end;justify-content:center}
  .shc{width:100%;max-width:34rem;background:var(--card);
    border-radius:1.1rem 1.1rem 0 0;padding:1.1rem 1rem
    calc(1.1rem + env(safe-area-inset-bottom,0));max-height:92vh;overflow:auto}
  .lab{margin:0 0 .4rem;font-size:.7rem;letter-spacing:.16em;
    text-transform:uppercase;color:var(--mut)}
  .shc h2{margin:0 0 1rem;font-family:var(--serif);font-weight:400;
    font-size:1.35rem}
  label{display:block;margin:0 0 .8rem}
  label span{display:block;margin:0 0 .25rem;font-size:.76rem;color:var(--mut)}
  input{width:100%;font:inherit;font-size:1rem;padding:.75rem .85rem;
    border:1px solid var(--line);border-radius:.7rem;background:var(--bg);
    color:var(--ink)}
  input.amt{font-family:var(--serif);font-size:2.1rem;padding:.45rem .85rem}
  input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
  .acts{display:flex;flex-wrap:wrap;gap:.5rem;margin:1rem 0 0}
  .acts button{flex:1 1 auto;min-width:7rem;border:1px solid var(--line);
    background:none;color:var(--ink);font:inherit;padding:.85rem 1rem;
    border-radius:99px;cursor:pointer}
  .acts button.go{flex:1 1 100%;border:0;background:var(--acc);
    color:var(--accink);font-weight:600}
  /* SAYING IT INSTEAD OF TYPING IT. Above the fields and full width, because
     it fills all of them — a microphone inside the first field would say it
     fills that one. */
  .mic{display:flex;align-items:center;justify-content:center;gap:.6rem;
    width:100%;margin:0 0 .5rem;padding:.9rem 1rem;border:1px solid var(--line);
    border-radius:99px;background:var(--bg);color:var(--ink);font:inherit;
    font-size:.95rem;cursor:pointer}
  .mic .dotrec{width:.7rem;height:.7rem;border-radius:50%;background:var(--acc);
    flex:0 0 auto}
  .mic.on{border-color:var(--acc);background:rgba(214,72,59,.12)}
  .mic.on .dotrec{animation:beat 1.1s ease-in-out infinite}
  .mic:disabled{opacity:.6}
  @keyframes beat{50%{opacity:.25}}
  @media (prefers-reduced-motion:reduce){.mic.on .dotrec{animation:none}}
  .micor{margin:0 0 1rem;text-align:center;font-size:.78rem;color:var(--mut)}
  /* The sentence they confirm. Serif and large: it is the only thing on that
     sheet that has to be right, and it is read aloud in the head. */
  .heard{margin:.2rem 0 0;font-family:var(--serif);font-size:1.35rem;
    line-height:1.4}
  .askline{margin:.9rem 0 0;font-size:.95rem;color:var(--acc)}
  .saidraw{margin:1rem 0 0;padding-top:.8rem;border-top:1px solid var(--line);
    font-size:.82rem;line-height:1.5;color:var(--mut)}
  .msg{display:block;width:100%;margin:.5rem 0 0;font:inherit;font-size:.88rem;
    line-height:1.65;padding:.75rem .85rem;border-radius:.7rem;
    border:1px solid var(--line);background:var(--bg);color:var(--ink2);
    resize:vertical}
  .why{margin:.6rem 0 0;font-size:.85rem;line-height:1.45;color:var(--acc)}
  .hint{margin:.8rem 0 0;font-size:.8rem;line-height:1.45;color:var(--mut)}
  dl{margin:0}
  .dr{display:grid;grid-template-columns:5.5rem 1fr;gap:0 .9rem;
    padding:.7rem 0;border-top:1px solid var(--hair)}
  .dr:first-child{border-top:0}
  .dr dt{margin:0;font-size:.76rem;color:var(--mut)}
  .dr dd{margin:0;font-size:.95rem}
  button:focus-visible,a:focus-visible{outline:2px solid var(--acc);
    outline-offset:2px}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;
    transition:none!important}}
</style>
</head>
<body>
<main id="root"></main>
<div class="make" id="makebar" hidden></div>
<script type="module">
/* DEALIO — ASKING SOMEBODY TO PAY YOU
 * ===========================================================================
 *
 * "Two people are chatting, then someone sends them a request to pay." This
 * page is the asking half. The paying half is /pay/<id> and needs no account,
 * no app and no code — which is the whole design.
 *
 * WHY IT IS A SEPARATE PAGE AND NOT A TAB. Step one of three: a page here,
 * then its own domain, then an app if it ever earns one. A page wearing the
 * board's chrome is a page that cannot leave, so this one carries its own
 * layout, its own palette and its own name.
 *
 * WHAT IS DELIBERATELY NOT HERE: any chat. The conversation already exists
 * and it is WeChat. Building a fourth one would mean asking two people to
 * move a conversation they are already having, which nobody does.
 */
import { T, when, lang, setLang, pickLang, langButton } from "/i18n.js";

const el = (tag, cls, text) => {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text != null) n.textContent = text;
  return n;
};
const root = document.getElementById("root");
const bar = document.getElementById("makebar");

/* MINTED HERE IF IT IS NOT THERE, and that is not tidiness.
 *
 * iOS gives a home-screen app its own storage, separate from Safari. Tom
 * saved Dealio to his home screen, opened it, and the ASK FOR MONEY button
 * was gone — the app was a stranger, because board:device was empty there
 * and every other page on this board is behind a door that already minted
 * one. Without an id of its own there is nothing to hand to the sign-in, and
 * the sign-in refuses a browser it cannot name: it moves an existing person
 * onto this device, so it needs to know which device that is.
 */
let device = "";
try {
  device = localStorage.getItem("board:device") || "";
  if (!device) {
    device = (crypto.randomUUID ? crypto.randomUUID()
      : String(Date.now()) + Math.random().toString(16).slice(2));
    localStorage.setItem("board:device", device);
  }
} catch { /* private window: it still works, it just forgets */ }

/* HOW THE LAST SIGN-IN WENT, read once off the address the callback sent us
   back to and then wiped, so a reload does not repeat a month-old verdict. */
let SIGNIN = "";
try {
  const u = new URL(location.href);
  SIGNIN = String(u.searchParams.get("signin") || "").slice(0, 20);
  if (SIGNIN) { u.searchParams.delete("signin"); history.replaceState(null, "", u); }
} catch { /* nothing to read */ }

let STATE = null;
/* WHICH OF THE TWO SCREENS. Not a tab bar: two screens do not earn one, and
   a bar across the bottom would sit exactly where the two buttons are. */
let VIEW = "list";

/* Copy without the async clipboard, which a phone refuses outside a gesture
   and WeChat's browser refuses entirely. The old trick still works there. */
function copyText(text) {
  try {
    const t = document.createElement("textarea");
    t.value = text;
    t.setAttribute("readonly", "");
    t.style.cssText = "position:fixed;top:0;left:0;opacity:0";
    document.body.append(t);
    t.select();
    t.setSelectionRange(0, text.length);
    const ok = document.execCommand("copy");
    t.remove();
    if (ok) return true;
  } catch { /* fall through */ }
  if (navigator.clipboard) { navigator.clipboard.writeText(text).catch(() => {}); return true; }
  return false;
}

function top() {
  const b = el("div", "top");
  b.append(el("span", "dot"), el("span", "wm", "Dealio"));
  const slot = el("span", "langslot");
  b.append(slot);
  return { bar: b, slot };
}

/* THREE SCREENS, NOT ONE SCREEN WITH THREE WARNINGS ON IT.
 *
 * It drew the same list every time and pushed whatever was wrong into a red
 * box above it. On a phone that had never signed in that meant a heading, a
 * warning, an empty-list message and no button — three things all saying
 * there is nothing here, floating in a tall black nothing, with not one
 * thing to tap. Tom looked at it and asked why it looked like that.
 *
 * So the state picks the screen. Signed out is a door and nothing else.
 * Empty is an invitation and nothing else. With requests in it, it is a list
 * — and only then is there a list to draw.
 */
function draw() {
  const { bar: head, slot } = top();
  root.textContent = "";
  root.append(head);
  bar.textContent = "";
  bar.hidden = true;

  if (STATE && !STATE.you) signedOut();
  else if (VIEW === "paid") paid();
  else if (!(STATE?.requests || []).length) empty();
  else list();

  slot.replaceWith(langButton(draw));
}

/* TWO THINGS A PERSON CAN DO WITH MONEY AND SOMEBODY ELSE, and they are the
 * same row underneath — see `way` in lib/request.js. Asking is the solid one
 * because it is what most people open this for; sending is outlined beside
 * it, not hidden behind a menu, because it is half the cases.
 *
 * Middle of the page when there is nothing else on it, pinned to the bottom
 * once there is a list to scroll past. */
function makeButtons(where) {
  const wrap = el("div", "two");
  const ask = el("button", "go", T("dl.make"));
  ask.type = "button";
  ask.addEventListener("click", () => form("in"));
  const send = el("button", "ghost2", T("dl.send"));
  send.type = "button";
  send.addEventListener("click", () => form("out"));
  wrap.append(ask, send);
  if (where === "bar") { bar.append(wrap); bar.hidden = false; return null; }
  return wrap;
}

/* SIGNED OUT IS A DOOR, and a door has one handle.
   It said "open your sign-in link on this phone" and gave nothing to open —
   an instruction about a thing that was not on the screen, which is the
   worst kind. The button goes to the door. */
function signedOut() {
  const box = el("div", "mid");
  box.append(el("p", "big", "Dealio"));
  box.append(el("p", "line", T("dl.what")));
  box.append(el("hr"));
  box.append(el("p", "mhead", T("dl.notYou")));
  box.append(el("p", "msub", T("dl.useExchange")));

  /* CONTINUE WITH GOOGLE IS THE HANDLE, and the invite code is a link under
     it rather than a second button.

     It sent people to /enter, which asks for six characters — and Tom, who
     had never been told about a code, asked "what 6 digits". The code is for
     somebody arriving for the first time. Everybody meeting this screen is
     already a member on a phone that has forgotten them, and for them the
     Google account is the thing that finds the person again: the callback
     moves the row onto whatever browser pressed it. That is the whole cure
     for a home-screen app with empty storage. */
  const g = el("button", "go", T("g.in"));
  g.type = "button";
  g.addEventListener("click", async () => {
    g.disabled = true;
    try {
      const r = await fetch("/api/signin/google", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ device, next: "/dealio" }),
      });
      const j = await r.json().catch(() => null);
      if (r.ok && j?.url) { location.href = j.url; return; }
      /* Google is not set up on this board at all. Saying so beats a button
         that does nothing twice before anybody thinks to look. */
      say.textContent = T(j?.error === "unconfigured" ? "dl.gOff" : "g.failed");
    } catch { say.textContent = T("g.failed"); }
    g.disabled = false;
  });
  box.append(g);

  const code = el("a", "quietlink", T("dl.haveCode"));
  code.href = "/enter";
  box.append(code);

  /* WHAT THE LAST ATTEMPT SAID, in its own words. Every one of these means
     something different to do next, and "that did not work" three times over
     is how somebody decides the product is broken. */
  const say = el("p", "why");
  /* A LIST RATHER THAN T("g." + whatever): a missing key renders as the key
     itself, by design, so an unknown word in the address would print
     "g.nonsense" on the one screen that has to look trustworthy. */
  if (["again", "unknown", "here", "other", "failed"].includes(SIGNIN)) {
    say.textContent = T("g." + SIGNIN);
  }
  box.append(say);
  root.append(box);
}

/* NOTHING YET IS AN INVITATION, not an apology. One line saying what will
   happen, and the button in the middle where the eye already is. */
function empty() {
  const box = el("div", "mid");
  box.append(el("p", "big", "Dealio"));
  box.append(el("p", "line", T("dl.what")));
  box.append(el("hr"));
  box.append(el("p", "mhead", T("dl.noneHead")));
  box.append(el("p", "msub", T("dl.noneWhy")));
  box.append(makeButtons());
  if (STATE && !STATE.ready) box.append(payoutLine());
  root.append(box);
}

/* NOWHERE FOR THE MONEY TO LAND, AND A WAY TO FIX IT.
 *
 * It said "you have not said where the money should land" and gave nothing
 * to press — an instruction about a thing that is not on the screen, which
 * is the same dead end the signed-out state had an hour ago. Stripe takes
 * the bank and the identity on its own pages; this is the door to them, and
 * it comes back here rather than to the board. */
function payoutLine() {
  const box = el("div", "fix");
  box.append(el("p", "fixhead", T("dl.notReady")));
  box.append(el("p", "fixwhy", T("dl.notReadyWhy")));
  const b = el("button", "ghost", T("dl.setUp"));
  b.type = "button";
  b.addEventListener("click", async () => {
    b.disabled = true;
    b.textContent = T("dl.setUpGoing");
    try {
      const r = await fetch("/api/pay/onboard", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ device, back: "dealio" }),
      });
      const j = await r.json().catch(() => null);
      if (r.ok && j?.url) { location.href = j.url; return; }
      /* Each refusal says which. A mainland payee cannot be onboarded at all
         and being told so beats four Stripe screens ending in no. */
      b.textContent = T(j?.error === "mainland" ? "dl.setUpCn"
        : j?.error === "off" ? "dl.setUpOff" : "pay.setUpNo");
    } catch { b.textContent = T("pay.setUpNo"); }
    b.disabled = false;
  });
  box.append(b);
  return box;
}

function list() {
  /* THE LIST HOLDS BOTH DIRECTIONS NOW, so it cannot be headed "money you
     have asked somebody to pay" — half of it is money going the other way. */
  const h = el("div", "hrow");
  h.append(el("h1", null, T("dl.head")));
  /* THE ONLY WAY TO THE OTHER SCREEN, and only once there is something on it.
     "Has this person ever actually paid me" is the question that decides
     whether you say yes to the next job, and the live list cannot answer it —
     it empties as things settle. */
  if (STATE.requests.some((q) => q.state === "paid")) {
    const a = el("button", "hlink", T("dl.paidHead"));
    a.type = "button";
    a.addEventListener("click", () => { VIEW = "paid"; draw(); });
    h.append(a);
  }
  root.append(h);
  root.append(el("p", "sub", T("dl.sub")));
  /* Nowhere for the money to land, said above the list rather than found out
     by the person who was sent a link and met a dead button. */
  if (STATE && !STATE.ready) root.append(payoutLine());
  /* SETTLED ROWS COME OFF THIS SCREEN. They were on it, under a green chip,
     and the home screen grew by one line for every job ever done and never
     shrank — so the thing still owed sat further down the page each month.
     Paid is where they went, and the link above is how you get there. */
  const open = STATE.requests.filter((q) => q.state !== "paid");
  if (!open.length) root.append(el("p", "none", T("dl.allSettled")));
  for (const q of open) root.append(row(q));
  makeButtons("bar");
}

/* ===========================================================================
 * PAID — WHAT SETTLED
 * ===========================================================================
 *
 * Both directions, newest first, grouped by the month it was asked. No chips:
 * everything on this screen is paid, and a badge saying so on every row is a
 * word repeated forty times. One line per row rather than a card — a card
 * says "separate object" and these are entries in a ledger.
 *
 * No new route. /api/requests already carries every request this person has,
 * in both directions, with its state on it.
 */
function paid() {
  const h = el("div", "hrow");
  h.append(el("h1", null, T("dl.paidHead")));
  const back = el("button", "hlink", T("dl.back"));
  back.type = "button";
  back.addEventListener("click", () => { VIEW = "list"; draw(); });
  h.append(back);
  root.append(h);
  root.append(el("p", "sub", T("dl.paidSub")));

  /* Sorted here rather than trusting the order it arrived in. /api/requests
     hands them over newest first, which is the same thing right up until a
     row is written out of order — and a ledger in almost-date order is worse
     than one in none, because nobody checks it. */
  const done = (STATE?.requests || []).filter((q) => q.state === "paid")
    .slice().sort((a, b) => String(b.at || "").localeCompare(String(a.at || "")));
  if (!done.length) {
    /* Reachable by pressing back on a phone after the last one was refunded
       or taken back. Empty is a sentence, not a blank screen. */
    root.append(el("p", "none", T("dl.paidNone")));
    return;
  }

  let seen = "";
  for (const q of done) {
    const d = new Date(q.at || Date.now());
    /* MONTH RULES INSTEAD OF A DATE ON EVERY ROW. The month is the thing
       being looked for — "did that August job ever land" — and repeating it
       down forty rows buries it. */
    const key = d.getFullYear() + "-" + d.getMonth();
    if (key !== seen) {
      seen = key;
      root.append(el("p", "mo", monthName(d)));
    }
    root.append(paidRow(q, d));
  }
}

/* The month as each language says it, and the year only when it is not this
   one — "September 2024" earns the year, "September" this year does not. */
function monthName(d) {
  const now = new Date();
  const opts = d.getFullYear() === now.getFullYear()
    ? { month: "long" } : { month: "long", year: "numeric" };
  try { return d.toLocaleDateString(lang() === "zh" ? "zh-CN" : "en-AU", opts); }
  catch { return String(d.getFullYear()); }
}

function paidRow(q, d) {
  const b = el("button", "prow");
  b.type = "button";
  b.append(el("span", "w", q.to || T("dl.someone")), el("span", "n", q.amount));
  let day = "";
  try { day = d.toLocaleDateString(lang() === "zh" ? "zh-CN" : "en-AU",
    { day: "numeric", month: "short" }); } catch { /* leave it out */ }
  b.append(el("span", "t", [q.what, day,
    T(q.way === "out" ? "dl.rowOut" : "dl.rowIn")].filter(Boolean).join(" · ")));
  b.addEventListener("click", () => one(q));
  return b;
}

function row(q) {
  const b = el("button", "q");
  b.type = "button";
  b.append(el("span", "w", q.to || T("dl.someone")), el("span", "n", q.amount));
  /* Which way, first, because a list of both needs it before anything else:
     "→ Mei" is money leaving and "← Sasha" is money coming. */
  b.append(el("span", "t", [T(q.way === "out" ? "dl.rowOut" : "dl.rowIn"),
    q.what, when(q.at)].filter(Boolean).join(" · ")));
  const state = q.off ? "off" : q.state;
  b.append(el("span", "c" + (state === "paid" ? " ok" : state === "off" ? " off" : ""),
    T("dl.st." + state)));
  b.addEventListener("click", () => one(q));
  return b;
}

/* MAKING ONE. Three fields and one is optional. Everything else — what is
   covered, what happens if it is called off — is a deal memo, and that lives
   on the board. Most money between two people who have just agreed something
   needs a number and a sentence. */
/* ===========================================================================
 * SAYING IT INSTEAD OF TYPING IT
 * ===========================================================================
 *
 * Press, talk, and the form fills itself. Either language, or both in one
 * sentence, which is what actually gets said around here.
 *
 * NOTHING IS WRITTEN UNTIL THEY SAY YES, and that is not a nicety to be
 * dropped when the extraction gets good — it is the whole safety of the
 * feature. A model pulling money terms out of speech will be wrong
 * eventually and it is money, so what comes back is a guess and a plain
 * sentence, and the person who spoke reads their own words back and confirms
 * them before anything exists.
 *
 * WHY THE SERVER TRANSCRIBES AND NOT THE BROWSER. The same reason lib/hear.js
 * gives: in a standalone iPhone app webkitSpeechRecognition is defined and
 * does nothing, and Chrome's recogniser is Google's, which is not reachable
 * from inside China. Both are exactly the people this is for. getUserMedia
 * and MediaRecorder work in both places; it is only the recogniser that does
 * not.
 */
let recording = null;

function micButton(onHeard) {
  const b = el("button", "mic");
  b.type = "button";
  b.append(el("span", "dotrec"), el("span", "micsay", T("dl.say")));
  b.addEventListener("click", async () => {
    if (recording) { stopRecording(); return; }
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      const bits = [];
      const rec = new MediaRecorder(stream);
      rec.ondataavailable = (e) => { if (e.data && e.data.size) bits.push(e.data); };
      rec.onstop = async () => {
        stream.getTracks().forEach((t) => t.stop());
        recording = null;
        b.classList.remove("on");
        b.querySelector(".micsay").textContent = T("dl.hearing");
        b.disabled = true;
        try {
          const blob = new Blob(bits, { type: rec.mimeType || "audio/webm" });
          const r = await fetch("/api/request/hear", {
            method: "POST",
            headers: { "Content-Type": blob.type, "x-board-device": device },
            body: blob,
          });
          const j = await r.json().catch(() => null);
          if (r.ok && j?.ok) { onHeard(j); b.disabled = false;
            b.querySelector(".micsay").textContent = T("dl.say"); return; }
          /* Each refusal says which, rather than one grey "that did not
             work". "Quiet" and "a key is missing" are different problems and
             only one of them is worth pressing again for. */
          b.querySelector(".micsay").textContent = T(
            j?.error === "quiet" ? "dl.sayQuiet"
            : j?.error === "off" ? "dl.sayOff"
            : j?.error === "long" ? "dl.sayLong" : "dl.sayNo");
        } catch { b.querySelector(".micsay").textContent = T("dl.sayNo"); }
        b.disabled = false;
      };
      rec.start();
      recording = rec;
      b.classList.add("on");
      b.querySelector(".micsay").textContent = T("dl.sayStop");
    } catch {
      /* No microphone, or permission refused. Not an error to shout about —
         the fields are right there and typing them always worked. */
      b.querySelector(".micsay").textContent = T("dl.sayNoMic");
      b.disabled = true;
    }
  });
  return b;
}

function stopRecording() {
  try { if (recording) recording.stop(); } catch { recording = null; }
}

/** HAVE I GOT THIS RIGHT.
 *
 *  The sentence they will confirm, in their own language, containing every
 *  fact that was extracted and no fact that was not. Yes fills the form.
 *  No throws it away and leaves them exactly where they were, with the
 *  fields empty and the microphone ready.
 *
 *  THE ONE QUESTION. When something important is missing — most often the
 *  amount — it asks, once, under the sentence. A form with a blank in it
 *  tells nobody what is missing; a question does.
 */
function heardSheet(j, fill) {
  const back = el("div", "sh");
  const card = el("div", "shc");
  card.append(el("p", "lab", T("dl.right")));
  card.append(el("p", "heard", j.terms.say));
  if (j.terms.ask) card.append(el("p", "askline", j.terms.ask));
  /* Their own words underneath, quieter. What the machine heard is worth
     seeing when what it made of it looks wrong. */
  card.append(el("p", "saidraw", j.said));

  const acts = el("div", "acts");
  const yes = el("button", "go", T("dl.yes"));
  yes.type = "button";
  yes.addEventListener("click", () => { back.remove(); fill(j.terms); });
  const no = el("button", null, T("dl.no"));
  no.type = "button";
  no.addEventListener("click", () => back.remove());
  acts.append(yes, no);
  card.append(acts);
  back.append(card);
  back.addEventListener("click", (e) => { if (e.target === back) back.remove(); });
  document.body.append(back);
}

function form(way) {
  const out = way === "out";
  const back = el("div", "sh");
  const card = el("div", "shc");
  card.append(el("p", "lab", T(out ? "dl.send" : "dl.make")));
  card.append(el("h2", null, T(out ? "dl.formSend" : "dl.formHead")));

  const field = (name, label, cls, ph) => {
    const l = el("label");
    l.append(el("span", null, label));
    const i = el("input", cls || "");
    i.id = "f-" + name;
    if (ph) i.placeholder = ph;
    l.append(i);
    card.append(l);
    return i;
  };
  /* THE MICROPHONE ABOVE THE FIELDS, not beside one of them: it fills all of
     them, and a button inside the first field would say it fills that one.
     Only when the server has both keys behind it — the page asks rather than
     drawing a microphone that cannot work. */
  let mic = null;
  if (STATE?.canHear) {
    mic = micButton((j) => heardSheet(j, (t) => {
      if (t.amount) amount.value = t.amount;
      if (t.what) what.value = t.what;
      if (t.when) whn.value = t.when;
      if (t.to && !who.value.trim()) who.value = t.to;
      /* Straight to whatever is still empty. The commonest miss is the
         amount, and it is the one field that cannot be left blank. */
      (!amount.value.trim() ? amount : !what.value.trim() ? what : whn).focus();
    }));
    card.append(mic);
    card.append(el("p", "micor", T("dl.orType")));
  }

  const amount = field("amount", T("ask.amount"), "amt", "¥2,400");
  const who = field("to", T(out ? "dl.whoOut" : "dl.who"), "", T("dl.whoEg"));
  const what = field("what", T("ask.what"), "", T("ask.whatEg"));
  const whn = field("when", T("ask.when"), "", T("ask.whenEg"));

  const why = el("p", "why");
  const acts = el("div", "acts");
  const go = el("button", "go", T(out ? "dl.sendMake" : "ask.make"));
  go.type = "button";
  const no = el("button", null, T("pay.cancel"));
  no.type = "button";
  no.addEventListener("click", () => { stopRecording(); back.remove(); });

  go.addEventListener("click", async () => {
    const amt = amount.value.trim();
    if (!amt) { why.textContent = T("ask.needAmount"); amount.focus(); return; }
    go.disabled = true;
    why.textContent = "";
    try {
      const r = await fetch("/api/request", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ device, way: out ? "out" : "in",
          to: who.value.trim(), amount: amt,
          what: what.value.trim(), when: whn.value.trim() }),
      });
      const j = await r.json().catch(() => null);
      if (r.ok && j?.ok) {
        back.remove();
        sent({ to: who.value.trim(), amount: amt, what: what.value.trim(),
               url: j.url, way: out ? "out" : "in" });
        load();
        return;
      }
      why.textContent = T(j?.error === "profile" ? "deal.needProfile" : "ask.failed");
    } catch { why.textContent = T("ask.failed"); }
    go.disabled = false;
  });

  acts.append(go, no);
  card.append(why, acts);
  back.append(card);
  back.addEventListener("click", (e) => { if (e.target === back) back.remove(); });
  document.body.append(back);
  amount.focus();
}

/** The message, written. One press made the request and this is the other
 *  half of that press — nobody makes one and then goes looking for what to do
 *  next. This page does not know their WeChat and is not going to: it writes
 *  the words and the person pastes them where they are already talking. */
function sent(q) {
  const back = el("div", "sh");
  const card = el("div", "shc");
  card.append(el("p", "lab", T("ask.ready")));
  card.append(el("h2", null, T("ask.to", { who: q.to || T("dl.someone") })));

  const text = T(q.way === "out" ? "dl.sendBlock" : "ask.block",
    { to: q.to || "", amount: q.amount, what: q.what || "", url: q.url });
  const box = el("textarea", "msg");
  box.readOnly = true;
  box.rows = 7;
  box.value = text;
  box.setAttribute("aria-label", T("ask.ready"));
  card.append(box);

  const acts = el("div", "acts");
  const cp = el("button", "go", T("memo.copy"));
  cp.type = "button";
  cp.addEventListener("click", () => {
    cp.textContent = copyText(text) ? T("memo.copied") : T("ask.failed");
  });
  const done = el("button", null, T("ask.shut"));
  done.type = "button";
  done.addEventListener("click", () => back.remove());
  acts.append(cp, done);
  card.append(acts);
  card.append(el("p", "hint", T(q.way === "out" ? "dl.sendHint" : "ask.nothingOwed")));
  back.append(card);
  back.addEventListener("click", (e) => { if (e.target === back) back.remove(); });
  document.body.append(back);
}

/** One request, opened from the list: what it says, the message again, and a
 *  way to take it back. Settled ones cannot be withdrawn — the money moved. */
function one(q) {
  const back = el("div", "sh");
  const card = el("div", "shc");
  card.append(el("p", "lab", T("dl.st." + (q.off ? "off" : q.state))));
  card.append(el("h2", null, q.amount + " · " + (q.to || T("dl.someone"))));

  const dl = el("dl");
  for (const [k, v] of [[T("ask.what"), q.what], [T("rq.when"), q.when],
                        [T("rq.asked"), when(q.at)]]) {
    if (!v) continue;
    const d = el("div", "dr");
    d.append(el("dt", null, k), el("dd", null, v));
    dl.append(d);
  }
  card.append(dl);

  const acts = el("div", "acts");
  if (!q.off && q.state !== "paid") {
    const text = T("ask.block", { to: q.to || "", amount: q.amount, what: q.what || "", url: q.url });
    const cp = el("button", "go", T("memo.copy"));
    cp.type = "button";
    cp.addEventListener("click", () => {
      cp.textContent = copyText(text) ? T("memo.copied") : T("ask.failed");
    });
    acts.append(cp);
    const off = el("button", null, T("dl.off"));
    off.type = "button";
    off.addEventListener("click", async () => {
      off.disabled = true;
      try {
        const r = await fetch("/api/request/" + q.id + "/off", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ device }),
        });
        if (r.ok) { back.remove(); load(); return; }
      } catch { /* below */ }
      off.disabled = false;
      off.textContent = T("ask.failed");
    });
    acts.append(off);
  }
  const shut = el("button", null, T("pay.close"));
  shut.type = "button";
  shut.addEventListener("click", () => back.remove());
  acts.append(shut);
  card.append(acts);
  back.append(card);
  back.addEventListener("click", (e) => { if (e.target === back) back.remove(); });
  document.body.append(back);
}

async function load() {
  try {
    const r = await fetch("/api/requests", {
      cache: "no-store", headers: { "x-board-device": device },
    });
    STATE = r.ok ? await r.json() : { requests: [], ready: false };
  } catch { STATE = STATE || { requests: [], ready: false }; }
  draw();
}

setLang(pickLang());
load();
</script>
</body>
</html>
