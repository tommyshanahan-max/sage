<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="/favicon.png" sizes="192x192">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#EEF0F4">
<meta name="theme-color" content="#0B0E15" media="(prefers-color-scheme: dark)">
<!-- iOS reads these rather than the manifest for a home-screen install:
     no browser chrome, and a name short enough not to be truncated under
     the icon. -->
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="留学生">
<title>The Tutor</title>
<!-- What WeChat puts on the card when somebody forwards this into a chat or
     onto Moments. WeChat's crawler reads the title, this description, and the
     first large image in the page — it does not run scripts, so all three have
     to be in the served HTML. The og: tags cost nothing and are what every
     other platform reads. -->
<meta name="description" content="A noticeboard for people living in and visiting China. Anyone can read, anyone can post. No account, no app to install.">
<meta property="og:type" content="website">
<meta property="og:title" content="The Tutor">
<meta property="og:description" content="A noticeboard for people living in and visiting China. Anyone can read, anyone can post.">
<meta property="og:image" content="{{ORIGIN}}/share.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:url" content="{{ORIGIN}}/feed">
<!-- WeChat on iOS caches aggressively against the URL, and a board is the one
     thing that must never be a day old. -->
<meta http-equiv="Cache-Control" content="no-cache">
<meta name="color-scheme" content="light dark">
<style>
  /* No web fonts. fonts.googleapis.com does not answer in the mainland, and a
     page that waits on it is a page that does not load. Everything here is a
     face the device already has, Chinese ones named first for Chinese text. */
  :root{
    --paper:#EEF0F4; --raise:#F7F8FB; --ink:#151B28; --ink-2:#4E5968;
    --muted:#8A939F; --line:#E3E6EC; --hair:#EAECF1;
    --accent:#3F68D8; --accent-ink:#FFFFFF; --accent-soft:#E8ECF7;
    --t1:#3F68D8; --t2:#2A9D63; --t3:#D99038; --t4:#7268C4; --t5:#D4485C; --t6:#2F8C9E;
    --serif:Georgia,"Songti SC","Noto Serif CJK SC",'Times New Roman',serif;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",
      "Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;
    --shadow:0 2px 6px rgba(21,27,40,.07),0 10px 28px rgba(21,27,40,.09);
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --paper:#0B0E15; --raise:#141924; --ink:#E9EDF5; --ink-2:#A3B0C4;
      --muted:#6F7D92; --line:#232B39; --hair:#1E2531;
      --accent:#5C8DFF; --accent-ink:#0B0E15; --accent-soft:#18233D;
      --t1:#5C8DFF; --t2:#4EBE88; --t3:#E4A65A; --t4:#9187E0; --t5:#F0687C; --t6:#4FA9BC;
      --shadow:0 2px 6px rgba(0,0,0,.4),0 12px 32px rgba(0,0,0,.34);
    }
  }
  :root[data-theme="dark"]{
    --paper:#0B0E15; --raise:#141924; --ink:#E9EDF5; --ink-2:#A3B0C4;
    --muted:#6F7D92; --line:#232B39; --hair:#1E2531;
    --accent:#5C8DFF; --accent-ink:#0B0E15; --accent-soft:#18233D;
    --t1:#5C8DFF; --t2:#4EBE88; --t3:#E4A65A; --t4:#9187E0; --t5:#F0687C; --t6:#4FA9BC;
    --shadow:0 2px 6px rgba(0,0,0,.4),0 12px 32px rgba(0,0,0,.34);
  }

  /* WHAT MOVES WHEN THE LANGUAGE DOES.
     This is the half of a translation that is not words, and skipping it is
     what makes a bilingual page look like an English page wearing Chinese.

     The serif goes first. Georgia has no Chinese glyphs, so an English serif
     on Chinese text falls back per-character mid-sentence — the single most
     obvious tell there is. In Chinese the stack leads with faces the device
     actually has.

     Then the spacing. CJK wants more room between lines and none between
     characters, so line-height goes up and letter-spacing goes to zero.

     Then the labels. Chinese has no case, so text-transform:uppercase does
     nothing, and letter-spacing meant to make Latin capitals read as a label
     just pulls Chinese characters apart until they read as broken. */
  :root[data-lang="zh"]{
    --serif:"Songti SC","Noto Serif CJK SC","Source Han Serif SC",
      "STSong",Georgia,serif;
    --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB",
      "Microsoft YaHei","Noto Sans SC","Segoe UI",sans-serif;
  }
  :root[data-lang="zh"] body{line-height:1.75}
  :root[data-lang="zh"] .words,
  :root[data-lang="zh"] .rep p{line-height:1.8}
  :root[data-lang="zh"] .eyebrow span,
  :root[data-lang="zh"] .rule span{text-transform:none;letter-spacing:.02em;font-size:.76rem}
  :root[data-lang="zh"] .line b{letter-spacing:0}
  /* An en dash between two Chinese clauses is an English punctuation habit.
     Nothing to do in CSS, but it is why several strings differ rather than
     translate. */

  /* display:flex and display:grid both outrank the user agent's [hidden] rule,
     so anything laid out that way stays on screen when hidden. Said once here
     rather than remembered at seven call sites. */
  [hidden]{display:none!important}

  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);
    font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
  main{max-width:34rem;margin:0 auto;padding:1.5rem 1.15rem 8rem}
  img{max-width:100%}
  button{font:inherit;cursor:pointer}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}

  /* ---- masthead ---------------------------------------------------------- */
  .top{display:flex;align-items:center;gap:.9rem;margin:.5rem 0 1.6rem}
  #langslot{margin-left:auto;flex:0 0 auto;display:flex}
  /* The mark: a disc with 留 in it, at the same proportions everywhere it is
     drawn. 0.52 of the diameter — a square glyph inscribed in a circle reaches
     the edge at diameter/root2, so anything much past that touches — sans
     rather than serif because it holds together at favicon size, and greyscale
     antialiasing because subpixel rendering paints colour into the strokes. */
  .mark{width:4.1rem;height:4.1rem;border-radius:50%;flex:0 0 auto;overflow:hidden;
    background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;
    font-family:var(--sans);font-weight:500;font-size:2.13rem;line-height:1;
    -webkit-font-smoothing:antialiased;
    box-shadow:0 0 0 3px var(--paper),0 0 0 4px var(--line)}
  /* Also the share thumbnail. It is a real <img> rather than a background so
     WeChat's crawler can find it — a CSS background is invisible to it. */
  .mark img{width:100%;height:100%;display:block;object-fit:cover}
  .top h1{margin:0;font-family:var(--serif);font-size:1.85rem;font-weight:400;
    letter-spacing:-.01em;line-height:1.1}
  .top p{margin:.2rem 0 0;color:var(--muted);font-size:.86rem}

  /* The fold. A control that looks like a control rather than a link, because
     what is behind it is a form and not an explanation. */
  .morego{display:flex;align-items:center;justify-content:space-between;width:100%;
    margin:.7rem 0 0;padding:.7rem .95rem;border:1px dashed var(--line);
    background:none;color:var(--ink-2);border-radius:.7rem;font-size:.9rem;
    text-align:left}
  .morego:hover{border-color:var(--muted);color:var(--ink)}
  .morego i{flex:0 0 auto;font-style:normal;font-size:1.05rem;color:var(--accent)}
  .morego[aria-expanded="true"]{border-style:solid;color:var(--ink)}
  .morego[aria-expanded="true"] i{transform:rotate(45deg)}
  #memore .field:first-child{margin-top:.8rem}
  /* Age is two characters wide and asking for a third of the row for it makes
     the row look broken. */
  #meage{flex:0 0 4.6rem}

  .menote{margin:.5rem 0 0;font-size:.82rem;color:var(--muted);text-align:center;
    max-width:24rem;line-height:1.5}

  /* ---- the key ------------------------------------------------------------
     Shut by default. It is the one string here that is worth stealing, and a
     secret printed on a screen somebody is holding in a lecture theatre is a
     secret printed for whoever is behind them. */
  /* ---- putting yourself on the list --------------------------------------
     The directory only ever lists people who said they were looking, and
     until now nothing could say it — so it could never have anybody in it. */
  /* ---- somebody joining the list, on the board ----------------------------
     Drawn as a card rather than a line of text: it is an introduction, and a
     week of days says when somebody is free faster than a sentence does. */
  /* On a joining the picture is an introduction, not the point — at full
     height it pushed the thing the post is actually saying below the fold. */
  .post.isjoin .pic{max-height:10rem;object-fit:cover}
  .joined{margin:.55rem 0 0;padding:.75rem .85rem;border-radius:.7rem;
    background:var(--accent-soft);border:1px solid var(--line)}
  .joined .say{font-size:.92rem;line-height:1.5;color:var(--ink)}
  .joined .say b{font-weight:400}
  .joined .where{margin:.25rem 0 0;font-size:.82rem;color:var(--muted)}
  .joined .wk{display:flex;gap:.25rem;margin:.5rem 0 0}
  .joined .wk i{flex:1;text-align:center;font-style:normal;font-size:.7rem;
    line-height:1.6;border-radius:.35rem;background:var(--paper);color:var(--muted)}
  .joined .wk i.on{background:var(--accent);color:var(--accent-ink)}
  .joined a{display:inline-block;margin:.6rem 0 0;font-size:.85rem;
    color:var(--accent);text-decoration:none}
  .joined a:hover{text-decoration:underline}

  .looking{margin:1rem 0 0;padding:.9rem 1rem;border-radius:.8rem;
    background:var(--raise);border:1px solid var(--line)}
  .looking label{display:flex;align-items:flex-start;gap:.6rem;cursor:pointer}
  .looking input{margin:.2rem 0 0;flex:0 0 auto;width:1.05rem;height:1.05rem;
    accent-color:var(--accent)}
  .looking b{display:block;font-weight:400;font-size:.95rem;color:var(--ink)}
  .looking .why{display:block;margin:.2rem 0 0;font-size:.8rem;line-height:1.5;
    color:var(--muted)}
  .freewrap{margin:.85rem 0 0}
  .freewrap .lab{font-size:.78rem;color:var(--muted)}
  .days{display:flex;gap:.35rem;margin:.4rem 0 0}
  .days button{flex:1;border:1px solid var(--line);background:var(--paper);
    color:var(--ink-2);border-radius:.5rem;padding:.4rem 0;font-size:.82rem;
    line-height:1}
  .days button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);
    color:var(--accent-ink)}

  .keybox{margin:1.2rem 0 0;padding-top:1rem;border-top:1px solid var(--hair)}
  .keybox h3{margin:0;font-family:var(--serif);font-weight:400;font-size:1.05rem}
  .keybox p{margin:.4rem 0 0;font-size:.85rem;line-height:1.55;color:var(--ink-2)}
  .keybox .warn{color:var(--accent)}
  .keyval{display:flex;gap:.5rem;align-items:center;margin:.7rem 0 0}
  .keyval code{flex:1;min-width:0;overflow-x:auto;white-space:nowrap;
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.82rem;
    background:var(--raise);border:1px solid var(--line);border-radius:.5rem;
    padding:.55rem .7rem;color:var(--ink)}
  .keyrow{display:flex;gap:.5rem;margin:.7rem 0 0;flex-wrap:wrap}
  .keyrow button{border:1px solid var(--line);background:var(--paper);color:var(--ink);
    border-radius:99px;padding:.45rem 1rem;font-size:.88rem}
  .keyrow button.go{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

  /* The same avatar control, inside the editor sheet. Profile is reachable
     from the bar before a profile exists, so the form it opens has to be able
     to add the face it will not save without. */
  .mepic{position:relative;display:block;margin:.2rem auto .1rem;width:4.6rem;
    height:4.6rem;border-radius:50%;background:var(--raise);color:var(--accent);
    font-family:var(--serif);font-size:1.8rem;line-height:1;border:0;padding:0}
  .mepic .in{position:absolute;inset:0;border-radius:50%;overflow:hidden;
    display:grid;place-items:center}
  .mepic img{width:100%;height:100%;object-fit:cover;display:block}
  .mepic .plus{position:absolute;right:-1px;bottom:-1px;width:1.5rem;height:1.5rem;
    border-radius:50%;background:var(--accent);color:var(--accent-ink);
    display:grid;place-items:center;font-size:1rem;font-family:var(--sans);
    box-shadow:0 0 0 3px var(--paper)}

  /* ---- topics ------------------------------------------------------------ */
  /* How many are waiting, on the tab itself. A number rather than a plain
     dot: one introduction and nine are different situations, and the person
     deciding whether to open it should not have to open it to find out. */
  .bar .badge{position:absolute;top:.1rem;left:calc(50% + .35rem);min-width:1.05rem;
    height:1.05rem;padding:0 .28rem;border-radius:99px;background:var(--t5);color:#fff;
    font-size:.68rem;font-weight:700;font-style:normal;line-height:1.05rem;
    text-align:center;box-shadow:0 0 0 2px var(--paper)}
  .bar a{position:relative}

  /* The tutor, asking which of two unbuilt things is worth building.
     Above the topics because it is a question, and a question under the feed
     is a question nobody answers. It removes itself once answered — a board
     that keeps asking after you have replied is not listening. */
  .tutor{background:var(--raise);border:1px solid var(--line);border-radius:1rem;
    padding:1.05rem 1.1rem;margin:0 0 1.4rem}
  .tutor .who{display:flex;align-items:center;gap:.6rem;margin:0 0 .5rem}
  .tutor .who i{width:1.9rem;height:1.9rem;border-radius:50%;flex:0 0 auto;
    background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;
    font-style:normal;font-size:.95rem;font-family:var(--sans)}
  .tutor .who b{font-family:var(--serif);font-weight:400;font-size:1.05rem}
  .tutor .hi{margin:0;font-family:var(--serif);font-size:1.05rem;line-height:1.55;
    color:var(--ink-2)}
  .tutor .opt{margin:.85rem 0 0;padding:.8rem .9rem;border:1px solid var(--line);
    border-radius:.75rem;background:var(--paper)}
  .tutor .opt h4{margin:0;font-family:var(--serif);font-weight:400;font-size:1.05rem}
  .tutor .opt p{margin:.3rem 0 0;font-size:.88rem;line-height:1.55;color:var(--ink-2)}
  .tutor .opt button{margin:.7rem 0 0;border:1px solid var(--accent);
    background:var(--accent);color:var(--accent-ink);border-radius:99px;
    padding:.45rem 1.1rem;font-size:.88rem}
  .tutor .opt button[disabled]{background:var(--raise);border-color:var(--line);
    color:var(--muted)}
  .tutor .grp{margin:1.1rem 0 0;font-size:.7rem;letter-spacing:.14em;
    text-transform:uppercase;color:var(--muted);font-weight:600}
  :root[data-lang="zh"] .tutor .grp{text-transform:none;letter-spacing:.06em}
  .tutor .opt button.go{background:var(--paper);border-color:var(--accent);
    color:var(--accent)}
  .tutor .honest{margin:.85rem 0 0;font-size:.8rem;line-height:1.5;color:var(--muted)}

  /* ---- who followed you ---------------------------------------------------
   * A row each, with the one control that matters on it. Not a card: these are
   * people you have not decided about yet, and giving each one a card the size
   * of a card in the deck would make the decision look bigger than it is. */
  .fols{display:flex;flex-direction:column;gap:.1rem;margin:0 0 1.5rem}
  .folrow{display:flex;align-items:center;gap:.75rem;padding:.7rem 0;
    border-bottom:1px solid var(--hair)}
  .folrow:last-child{border-bottom:0}
  .folrow .av{width:2.9rem;height:2.9rem;font-size:1.1rem}
  .folrow .who{flex:1 1 auto;min-width:0}
  .folrow .who{color:var(--ink);text-decoration:none}
  .folrow .who b{display:block;font-family:var(--serif);font-weight:400;font-size:1.05rem;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .folrow .who span{display:block;font-size:.82rem;color:var(--muted);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .folrow .dot{flex:0 0 auto;width:.45rem;height:.45rem;border-radius:50%;
    background:var(--accent)}
  .folrow button{flex:0 0 auto;border:1px solid var(--accent);background:var(--accent);
    color:var(--accent-ink);border-radius:99px;padding:.5rem 1rem;font-size:.88rem}
  .folrow button.on{background:var(--raise);border-color:var(--line);color:var(--ink-2)}
  .rule .new{flex:0 0 auto;font-weight:400;font-size:.7rem;letter-spacing:.06em;
    background:var(--accent);color:var(--accent-ink);border-radius:99px;
    padding:.15rem .5rem}

  .topics{display:flex;gap:.55rem;overflow-x:auto;padding:0 0 .35rem;
    margin:0 -1.15rem 1.5rem;padding-left:1.15rem;padding-right:1.15rem;
    scrollbar-width:none}
  .topics::-webkit-scrollbar{display:none}
  .chip{display:inline-flex;align-items:center;gap:.45rem;flex:0 0 auto;
    border:1px solid var(--line);background:var(--raise);color:var(--ink);
    border-radius:99px;padding:.6rem 1.15rem;font-size:.98rem;line-height:1;
    white-space:nowrap;transition:background .12s,border-color .12s}
  .chip .dot{width:.5rem;height:.5rem;border-radius:50%;background:var(--muted)}
  .chip .n{color:var(--muted);font-size:.86rem;font-variant-numeric:tabular-nums}
  .chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
  .chip[aria-pressed="true"] .dot{background:var(--accent-ink);opacity:.6}
  .chip[aria-pressed="true"] .n{color:var(--accent-ink);opacity:.75}

  /* ---- the rule that names what you are looking at ----------------------- */
  .rule{display:flex;align-items:center;gap:.9rem;margin:0 0 .4rem}
  .rule span{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;
    color:var(--muted);white-space:nowrap}
  .rule i{flex:1;height:1px;background:var(--line)}

  /* ---- a post ------------------------------------------------------------ */
  .post{display:flex;gap:.9rem;padding:1.35rem 0;border-bottom:1px solid var(--hair)}
  .av{width:3.4rem;height:3.4rem;border-radius:50%;flex:0 0 auto;
    background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;
    font-family:var(--serif);font-size:1.35rem;line-height:1;overflow:hidden;
    box-shadow:0 0 0 3px var(--paper),0 0 0 4px var(--accent-soft)}
  /* A photograph fills the circle rather than sitting in it. Without the crop
     a portrait arrives as a tall image squeezed into a round box, which is the
     one way a real face can look worse than a letter. */
  .av img{width:100%;height:100%;object-fit:cover;display:block}
  a.av{color:var(--accent-ink);text-decoration:none}
  .body{flex:1;min-width:0}

  .eyebrow{display:flex;align-items:center;gap:.45rem;margin:0 0 .3rem}
  .eyebrow i{width:.45rem;height:.45rem;border-radius:50%;flex:0 0 auto}
  .eyebrow span{font-size:.72rem;letter-spacing:.13em;text-transform:uppercase;
    color:var(--muted)}

  .line{display:flex;align-items:baseline;gap:.6rem}
  .line b{font-family:var(--serif);font-weight:400;font-size:1.15rem;
    text-decoration:underline;text-decoration-color:var(--line);
    text-underline-offset:.28em;text-decoration-thickness:1px;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .line time{margin-left:auto;color:var(--muted);font-size:.92rem;
    font-variant-numeric:tabular-nums;flex:0 0 auto}

  .words{margin:.45rem 0 0;font-family:var(--serif);font-size:1.12rem;
    line-height:1.55;overflow-wrap:anywhere}
  .zh{margin:.3rem 0 0;font-family:var(--serif);font-size:1.05rem;color:var(--ink-2)}
  .py{margin:.15rem 0 0;font-size:.88rem;color:var(--muted)}
  .pic{display:block;width:100%;border-radius:.7rem;margin:.65rem 0 0;
    background:var(--raise)}

  /* ---- what you can do to it --------------------------------------------- */
  .acts{display:flex;align-items:center;gap:1.15rem;margin:.85rem 0 0;flex-wrap:wrap}
  .acts button{display:inline-flex;align-items:center;gap:.4rem;border:0;
    background:none;color:var(--ink-2);font-size:.92rem;padding:.15rem 0;
    /* A button holding only an icon is shorter than one holding text, and the
       row centres them — which drops the bare icons a few pixels below the
       labelled ones. One shared height puts every icon on the same line. */
    min-height:1.5rem}
  .acts button:hover{color:var(--accent)}
  .acts button[disabled]{opacity:.45;cursor:default}
  .acts svg{width:1rem;height:1rem;stroke:currentColor;fill:none;
    stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
  .acts .n{color:var(--muted);font-size:.86rem;font-variant-numeric:tabular-nums}
  .acts .liked{color:var(--accent)}
  /* On a 360px phone the English labels are ~30px wider than the row. Chinese
     already fits — two characters says what six letters do — so this is one of
     the places the two languages genuinely need different numbers. */
  @media (max-width:380px){
    .acts{gap:.8rem}
    .acts button{font-size:.87rem}
  }
  .acts button[aria-pressed="true"]{color:var(--accent)}
  .acts .liked svg{fill:currentColor;stroke:currentColor}

  /* ---- the thread underneath --------------------------------------------- */
  .thread{margin:.9rem 0 0;padding-left:.95rem;border-left:2px solid var(--line)}
  .rep{padding:.5rem 0}
  .rep + .rep{border-top:1px solid var(--hair)}
  .rep .line b{font-size:1rem}
  .rep p{margin:.2rem 0 0;font-family:var(--serif);font-size:1rem;line-height:1.5;
    overflow-wrap:anywhere}
  .rbox{display:flex;gap:.5rem;margin:.7rem 0 0}
  .rbox input{flex:1;min-width:0;border:1px solid var(--line);background:var(--raise);
    border-radius:99px;padding:.5rem .9rem;font:inherit;font-size:.95rem;
    color:var(--ink);outline:none}
  .rbox input:focus{border-color:var(--accent)}
  .rbox button{border:0;background:var(--accent);color:var(--accent-ink);border-radius:99px;
    padding:.5rem 1.05rem;font-size:.9rem}

  /* ---- nothing there yet -------------------------------------------------- */
  .none{padding:3.5rem .5rem;text-align:center;color:var(--muted)}
  .none b{display:block;font-family:var(--serif);font-weight:400;font-size:1.3rem;
    color:var(--ink);margin:0 0 .4rem}
  .none p{margin:0;font-size:.95rem;line-height:1.6}

  /* ---- the + ------------------------------------------------------------- */
  /* The language switch. In the masthead rather than in a menu: somebody who
     cannot read the page cannot find a menu labelled in the language they
     cannot read. */
  .lang{margin-left:auto;flex:0 0 auto;border:1px solid var(--line);
    background:var(--raise);color:var(--ink-2);border-radius:99px;
    padding:.42rem .9rem;font-size:.85rem;line-height:1}
  .lang:hover{color:var(--ink);border-color:var(--muted)}

  /* Translate, always in the same place. Above the +, smaller, because
     posting is the primary thing and reading help is the constant one. */
  .tfab{position:fixed;right:1.1rem;bottom:5.6rem;width:3.3rem;height:3.3rem;
    border-radius:50%;border:1px solid var(--line);background:var(--raise);
    color:var(--ink);box-shadow:var(--shadow);display:grid;place-items:center;
    z-index:30;font-family:var(--serif);font-size:1.25rem;line-height:1}
  .tfab:hover{border-color:var(--accent);color:var(--accent)}

  .tout{margin:.9rem 0 0;padding:.9rem 1rem;background:var(--raise);
    border:1px solid var(--line);border-radius:.7rem}
  .tout .said{margin:0;font-family:var(--serif);font-size:1.08rem;line-height:1.6;
    color:var(--ink)}
  .tout .py{margin:.35rem 0 0;font-size:.86rem;color:var(--muted)}
  .tout .note{margin:.6rem 0 0;padding-top:.55rem;border-top:1px solid var(--line);
    font-size:.86rem;line-height:1.55;color:var(--ink-2)}
  .tout .note b{display:block;font-size:.66rem;letter-spacing:.13em;
    text-transform:uppercase;color:var(--muted);margin:0 0 .2rem;font-weight:600}
  :root[data-lang="zh"] .tout .note b{text-transform:none;letter-spacing:.02em}
  .tpost{margin:.6rem 0 0;padding:.7rem .85rem;background:var(--accent-soft);
    border-radius:.6rem}
  .tpost p{margin:0;font-family:var(--serif);font-size:1.02rem;line-height:1.6}
  .tpost .py{margin:.3rem 0 0;font-family:var(--sans);font-size:.82rem;color:var(--muted)}
  .tpost .note{margin:.4rem 0 0;font-family:var(--sans);font-size:.82rem;color:var(--ink-2)}

  /* The bottom bar: Feed, a big +, Profile.
     Three targets on the thumb's arc, the one you press most in the middle
     and larger than the other two — the shape a phone app has, because
     somebody arriving from WeChat has used a hundred of them. */
  /* Held to the same column as the content.
     Left and right at 0 is correct on a phone, where the column IS the
     viewport. On a desktop window it drew a strip across the whole screen
     under a narrow page, which reads as a stretched phone rather than as an
     app. Same width as main, centred, with a border down each side once there
     is room for one. */
  .bar{position:fixed;left:50%;transform:translateX(-50%);bottom:0;z-index:35;
    width:100%;max-width:34rem;display:flex;
    align-items:center;justify-content:space-around;
    padding:.35rem .5rem calc(.35rem + env(safe-area-inset-bottom));
    background:var(--paper);border-top:1px solid var(--line)}
  @media (min-width:36rem) and (max-width:57.99rem){
    .bar{border-left:1px solid var(--line);border-right:1px solid var(--line);
      border-radius:1rem 1rem 0 0}
  }

  .bar a,.bar button{flex:1;min-width:0;border:0;background:none;color:var(--muted);
    display:flex;flex-direction:column;align-items:center;gap:.15rem;
    padding:.45rem .2rem;font-size:.64rem;text-decoration:none;letter-spacing:.02em}
  /* Five destinations now, so a label that will not fit is truncated rather
     than allowed to widen its tab and squeeze the others. */
  .bar a span,.bar button span{max-width:100%;overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap}
  .bar a[aria-current="page"]{color:var(--accent)}
  .bar svg{width:1.5rem;height:1.5rem;stroke:currentColor;fill:none;stroke-width:1.7;
    stroke-linecap:round;stroke-linejoin:round}
  .bar .new{flex:0 0 auto}
  .bar .new i{width:3.4rem;height:3.4rem;border-radius:50%;background:var(--accent);
    color:var(--accent-ink);display:grid;place-items:center;font-style:normal;
    box-shadow:var(--shadow);margin-top:-1.1rem}
  .bar .new i svg{width:1.6rem;height:1.6rem;stroke-width:2.2}
  .bar .new span{margin-top:.1rem}

  /* ---- the same nav, at the top, on a desktop -----------------------------
   *
   * One element, not two. A second copy in the markup would mean two sets of
   * handlers and two things to keep in step, and the first symptom of that is
   * a button that works on one size and not the other.
   *
   * A bar pinned to the bottom of a large screen is a phone idiom: it puts the
   * navigation as far from the pointer as the window allows, and it is where
   * nobody on a desktop looks for it. Above 58rem it becomes a row in the
   * masthead instead — same buttons, same order, same code. */
  @media (min-width:58rem){
    /* Its own row, under the masthead.
       Not beside the title: this column is 34rem wide, so a header holding the
       mark, the name, three nav items and the language button has about eighty
       pixels for the name — the title and the nav simply landed on top of each
       other. A row of its own has room, and a nav under a masthead is what a
       web app looks like anyway. */
    .top{flex-wrap:wrap;margin-bottom:1.2rem}
    .bar{position:static;transform:none;width:auto;max-width:none;
      flex:0 0 100%;order:2;
      margin:.15rem 0 0;padding:.5rem 0 0;background:none;border:0;
      border-top:1px solid var(--hair);border-radius:0;
      gap:.25rem;justify-content:flex-start}
    /* Icon beside the label rather than above it: a row of tall stacks in a
       header makes the header tall. */
    .bar a,.bar button{flex:0 0 auto;flex-direction:row;gap:.4rem;
      padding:.45rem .85rem;border-radius:99px;font-size:.88rem;
      letter-spacing:0;color:var(--ink-2)}
    .bar a:hover,.bar button:hover{background:var(--raise);color:var(--ink)}
    .bar a[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
    .bar svg{width:1.15rem;height:1.15rem}
    /* The + stops being the big round thing lifted out of the bar and becomes
       an ordinary primary button, because on a desktop it is not competing
       with a thumb. */
    .bar .new i{width:auto;height:auto;border-radius:0;background:none;
      color:inherit;box-shadow:none;margin:0;display:inline-grid}
    .bar .new i svg{width:1.15rem;height:1.15rem;stroke-width:2}
    .bar .new{background:var(--accent);color:var(--accent-ink);
      border-radius:99px;padding:.45rem 1rem}
    .bar .new:hover{background:var(--accent);color:var(--accent-ink);filter:brightness(1.05)}
    .bar .new span{margin:0}
    /* The masthead was a two-item row and is a three-item row now. Without a
       basis the title had none: flex shrinks a child to its longest word
       before it takes space from a sibling, so the masthead broke over two lines
       and the tagline came down in a five-line ribbon beside it. */
    .top .name{flex:1 1 auto;min-width:0}
    .top p{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    /* The language button no longer needs to push itself right; the nav does. */
    #langslot{margin-left:.5rem}
    /* Nothing is pinned over the feed any more, so the space kept clear for it
       is space wasted. */
    main{padding-bottom:3rem}
  }

  .fab{position:fixed;right:1.2rem;bottom:1.6rem;width:4rem;height:4rem;
    border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);
    box-shadow:var(--shadow);display:grid;place-items:center;z-index:30}
  .fab svg{width:1.7rem;height:1.7rem;stroke:currentColor;stroke-width:2;
    stroke-linecap:round;fill:none}

  /* ---- putting something up ---------------------------------------------- */
  .sheet{position:fixed;inset:0;z-index:40;display:flex;align-items:flex-end;
    justify-content:center;background:rgba(21,27,40,.42)}
  .sheet .card{width:100%;max-width:34rem;background:var(--paper);
    border-radius:1.1rem 1.1rem 0 0;padding:1.3rem 1.15rem calc(1.3rem + env(safe-area-inset-bottom));
    box-shadow:var(--shadow);overflow-y:auto;
    /* Not 92vh. WeChat's toolbar is inside the viewport on Android and outside
       it on iOS, so vh is wrong by about 60px in one direction or the other and
       the bottom of this sheet ends up under the chrome. --vh is set from
       innerHeight, which is the number that is actually true. */
    max-height:calc(var(--vh, 1vh) * 92)}
  .sheet h2{margin:0 0 1rem;font-family:var(--serif);font-weight:400;font-size:1.35rem}
  .sheet textarea{width:100%;border:1px solid var(--line);background:var(--raise);
    border-radius:.7rem;padding:.85rem;font:inherit;font-family:var(--serif);
    font-size:1.08rem;line-height:1.55;color:var(--ink);resize:vertical;outline:none}
  .sheet textarea:focus{border-color:var(--accent)}
  .field{display:flex;gap:.6rem;margin:.8rem 0 0}
  .field input,.field select{flex:1;min-width:0;border:1px solid var(--line);
    background:var(--raise);border-radius:99px;padding:.6rem .95rem;font:inherit;
    font-size:.95rem;color:var(--ink);outline:none}
  .field input:focus,.field select:focus{border-color:var(--accent)}
  .row{display:flex;align-items:center;gap:.6rem;margin:.9rem 0 0}
  .ghost{border:1px solid var(--line);background:var(--raise);color:var(--ink);
    border-radius:99px;padding:.6rem 1.1rem;font-size:.92rem}
  .go{margin-left:auto;border:0;background:var(--accent);color:var(--accent-ink);
    border-radius:99px;padding:.68rem 1.5rem;font-size:.98rem}
  .go[disabled]{opacity:.5;cursor:default}
  .shot{position:relative;margin:.8rem 0 0}
  .shot img{display:block;width:100%;border-radius:.7rem}
  .shot button{position:absolute;top:.5rem;right:.5rem;width:2rem;height:2rem;
    border-radius:50%;border:0;background:rgba(21,27,40,.72);color:#fff;
    font-size:1.1rem;line-height:1;display:grid;place-items:center}
  .said{margin:.85rem 0 0;font-size:.92rem;line-height:1.5;color:var(--ink-2)}
  /* Above the compose box, not below the send button. Below it the line sat
     under the keyboard on a phone, which is the same as not being there. */
  .orbuddy{display:flex;align-items:center;gap:.6rem;margin:0 0 1rem;
    padding:.6rem .75rem;border:1px solid var(--line);border-radius:.8rem;
    background:var(--raise);font-size:.86rem;color:var(--muted);line-height:1.4}
  .orbuddy span{flex:1 1 auto}
  .orbuddy a{flex:0 0 auto;color:var(--accent);text-decoration:none;
    font-size:.88rem;white-space:nowrap;border:1px solid var(--accent);
    border-radius:99px;padding:.35rem .8rem}
  .hint{margin:0 0 .9rem;font-size:.86rem;line-height:1.55;color:var(--muted)}
  .reasons{display:flex;gap:.4rem;flex-wrap:wrap;margin:0 0 .8rem}
  .reasons button{border:1px solid var(--line);background:var(--raise);color:var(--ink);
    border-radius:99px;padding:.45rem .9rem;font-size:.88rem;line-height:1}
  .reasons button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);
    color:var(--accent-ink)}
  .alsoblock{display:flex;align-items:flex-start;gap:.6rem;margin:.85rem 0 0;
    font-size:.9rem;line-height:1.45;color:var(--ink-2);cursor:pointer}
  .alsoblock input{margin:.15rem 0 0;flex:0 0 auto;width:1.05rem;height:1.05rem;
    accent-color:var(--accent)}
  .alsoblock b{font-weight:400;color:var(--ink)}
  .said.bad{color:var(--accent)}

  .foot{margin:2.5rem 0 0;padding-top:1.3rem;border-top:1px solid var(--line);
    color:var(--muted);font-size:.82rem;line-height:1.65}


  /* ---- the deck, at the top of the feed ---------------------------------
   *
   * Browse used to be its own page. It is now the first thing on this one,
   * because a stack of three cards is exhausted in ten seconds and a page that
   * ends there ends the visit with it. Underneath the last card is the feed,
   * so running out of people starts the next thing rather than finishing.
   *
   * The card catches sideways drags only — `touch-action:pan-y` leaves the
   * vertical gesture to the page, which is the whole idea. */
  /* HEIGHT IS A BUDGET, NOT A PROPORTION.
   *
   * A share of the viewport is the wrong rule here: the card has a masthead, a
   * section rule, the Follow row and the nav bar to fit around, and those are
   * fixed pixels. At 62vh the buttons sat behind the bar on every phone shorter
   * than about 815px of viewport, which is most of them.
   *
   * So: take what is left after everything else, cap it so it does not become a
   * poster on a desktop, and floor it so a short screen still shows a face.
   * --vh is set from innerHeight because 100vh on a phone is the height the page
   * would have if the browser's own chrome were not there. */
  .deck{position:relative;width:100%;
    height:max(13rem, min(62vh, 34rem, calc(var(--vh, 1vh) * 100 - 21rem - env(safe-area-inset-bottom))));
    margin:0 0 .9rem;touch-action:pan-y;overflow:hidden;border-radius:1.3rem}
  /* The row above it is always there now, so the deck always pays for it. */
  #mine:not([hidden]) + .deck{
    height:max(11rem, min(52vh, 30rem, calc(var(--vh, 1vh) * 100 - 26rem - env(safe-area-inset-bottom))))}
  .pc{position:absolute;inset:0;border-radius:1.3rem;overflow:hidden;
    background:var(--raise);box-shadow:var(--shadow);
    display:flex;flex-direction:column;justify-content:flex-end;
    will-change:transform;transition:transform .28s ease,opacity .28s ease}
  .pc.gone{opacity:0}
  .pc img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
  /* No photograph is not a hole: the initial, big, on the accent. */
  .pc .noshot{position:absolute;inset:0;display:grid;place-items:center;
    background:var(--accent);color:var(--accent-ink);
    font-family:var(--serif);font-size:8rem;line-height:1}
  /* Words on a scrim, not straight onto the photograph: white on a picture is
     legible right up until somebody uploads a bright one. */
  .pc .scrim{position:relative;padding:5rem 1.2rem 1.2rem;
    background:linear-gradient(to top,rgba(10,14,22,.86),rgba(10,14,22,.52) 42%,rgba(10,14,22,0))}
  .pc .nameline{display:flex;align-items:baseline;gap:.6rem;flex-wrap:wrap}
  .pc h2{margin:0;font-family:var(--serif);font-weight:400;font-size:1.8rem;
    line-height:1.1;color:#fff}
  /* The four letters, as a badge. Monospaced-feeling by letter-spacing rather
     than by a mono stack, which would not match anything else here. */
  .pc .type{flex:0 0 auto;font-weight:500;font-size:.78rem;letter-spacing:.1em;
    background:rgba(255,255,255,.2);color:#fff;border-radius:99px;
    padding:.25rem .55rem .25rem .65rem}
  .pc .type.you{background:var(--accent);letter-spacing:.06em}
  .pc .where{margin:.3rem 0 0;font-size:.92rem;color:rgba(255,255,255,.82)}
  .pc .goal{margin:.6rem 0 0;font-family:var(--serif);font-size:1.02rem;line-height:1.5;
    color:rgba(255,255,255,.92);display:-webkit-box;-webkit-line-clamp:3;
    -webkit-box-orient:vertical;overflow:hidden}
  .pc .pdays{display:flex;gap:.25rem;margin:.7rem 0 0;flex-wrap:wrap}
  .pc .pdays b{width:1.7rem;height:1.7rem;display:grid;place-items:center;border-radius:.4rem;
    font-size:.7rem;font-weight:500;background:rgba(255,255,255,.16);color:rgba(255,255,255,.6)}
  .pc .pdays b.on{background:#fff;color:#14203a}

  .pacts{display:flex;gap:.6rem;width:100%}
  /* Flex hands a child its longest word before it takes space from a sibling,
     so both need telling they may be narrower than their content. */
  .pacts>*{flex:1 1 0;min-width:0}
  .pacts button,.pacts a{border:1px solid var(--line);background:var(--raise);
    color:var(--ink);border-radius:99px;padding:.8rem 1rem;font-size:1rem;
    text-align:center;text-decoration:none}
  .pacts .primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
  /* Already following: the button is still there to undo it, and stops
     shouting to be pressed. */
  .pacts .primary.on{background:var(--raise);border-color:var(--line);color:var(--ink-2)}
  .pcount{margin:.7rem 0 0;text-align:center;font-size:.82rem;color:var(--muted);
    font-variant-numeric:tabular-nums}
  /* Share, on the face it shares. A pill rather than a bare icon: this is the
     control that puts somebody into a WeChat group, so it is worth a word. It
     sits on its own scrim because it has to stay readable on a photograph
     whatever is behind it. */
  .pc .share{position:absolute;top:.8rem;right:.8rem;z-index:2;
    display:inline-flex;align-items:center;gap:.4rem;border:0;
    background:rgba(10,14,22,.52);color:#fff;border-radius:99px;
    padding:.5rem .9rem .5rem .8rem;font-size:.88rem;line-height:1;
    -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
    box-shadow:0 1px 3px rgba(0,0,0,.35)}
  .pc .share:hover{background:rgba(10,14,22,.72)}
  .pc .share svg{width:1.05rem;height:1.05rem;stroke:currentColor;fill:none;
    stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
  /* Your own missing face, under everybody else's. The circle IS the control:
     one tap opens the picker, which is the shortest route there is. */
  .mine{display:flex;align-items:center;gap:.75rem;width:100%;margin:0 0 .8rem;
    padding:.7rem .85rem;border:1px solid var(--line);background:var(--raise);
    border-radius:.9rem;text-align:left;color:inherit}
  .mine .ring{position:relative;flex:0 0 auto;width:2.6rem;height:2.6rem;
    border-radius:50%;background:var(--paper);color:var(--accent);
    display:grid;place-items:center;font-family:var(--serif);font-size:1.15rem;
    line-height:1;box-shadow:0 0 0 2px var(--line)}
  .mine .ring{overflow:visible}
  .mine .ring img{position:absolute;inset:0;width:100%;height:100%;border-radius:50%;
    object-fit:cover;display:block}
  /* Not .go — that is the sheet's primary button, and this is a chevron. */
  .mine .chev{margin-left:auto;flex:0 0 auto;color:var(--muted);font-size:1.4rem;
    line-height:1;padding-left:.4rem}
  .mine .ring i{position:absolute;right:-2px;bottom:-2px;width:1.15rem;height:1.15rem;
    border-radius:50%;background:var(--accent);color:var(--accent-ink);
    display:grid;place-items:center;font-style:normal;font-size:.8rem;
    font-family:var(--sans);box-shadow:0 0 0 2px var(--raise)}
  .mine b{display:block;font-weight:400;font-size:.98rem;color:var(--ink)}
  .mine span{display:block;margin:.1rem 0 0;font-size:.82rem;color:var(--muted)}
  /* The last card in the deck, when there is no face on this phone. Same shape
     as a person, because it is asking you to become one. */
  .pc.turn .noshot{background:linear-gradient(160deg,var(--accent),var(--t6));
    font-size:6rem}
  .psafety{margin:.5rem 0 1.9rem;text-align:center;font-size:.78rem;line-height:1.5;
    color:var(--muted)}
  .bnone{margin:0 0 1.9rem;padding:1.6rem 1.1rem;text-align:center;color:var(--muted);
    background:var(--raise);border:1px solid var(--line);border-radius:1rem}
  .bnone b{display:block;font-family:var(--serif);font-weight:400;font-size:1.15rem;
    color:var(--ink);margin:0 0 .35rem}
  .bnone p{margin:0 auto 1rem;max-width:24rem;font-size:.9rem;line-height:1.55}
  .bnone a{display:inline-block;border:0;background:var(--accent);color:var(--accent-ink);
    border-radius:99px;padding:.65rem 1.4rem;font-size:.95rem;text-decoration:none}

  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<main>
  <div class="top">
    <!-- The mark itself, square. This used to point at /share.png, which was a
         400px square and is now a 1200x630 link card — a wide image in a round
         container crops to a slice of the middle, which here is the middle of
         a word. -->
    <div class="mark"><img src="/favicon.png" alt="" width="192" height="192"
      onerror="this.replaceWith(document.createTextNode('\u7559'))"></div>
    <div class="name">
      <h1 id="boardname">The Board</h1>
      <p id="count">Anyone can read. Anyone can post.</p>
    </div>
    <nav class="bar" id="bar">
      <a href="/browse" id="navbrowse">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4h10a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2Z M9 15c1.5-2 4.5-2 6 0"/><circle cx="12" cy="10" r="2.2"/></svg>
        <span id="navbrowselabel">Browse</span>
        <i class="badge" id="navbrowsen" hidden></i>
      </a>
      <a href="/feed" id="navfeed" aria-current="page">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
        <span id="navfeedlabel">Feed</span>
      </a>
      <button class="new" id="fab" type="button">
        <i><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></i>
        <span id="navnewlabel">Put something up</span>
      </button>
      <!-- Messages is held back for V1. A private inbox is worth having when
           there are enough people for somebody to write to; until then it is a
           tab that opens an empty room. The routes and the page still work for
           anybody with the address. -->
      <a href="/notes" id="navnotes" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16v12H4z M4 7l8 6 8-6"/></svg>
        <span id="navnoteslabel">Messages</span>
        <i class="badge" id="navnotesn" hidden></i>
      </a>
      <a href="#" id="navme">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8Z M4 21a8 8 0 0 1 16 0"/></svg>
        <span id="navmelabel">Profile</span>
      </a>
    </nav>
    <span id="langslot"></span>
  </div>

  <!-- Browse first, the feed underneath.
       This used to be its own page at /browse. Two tabs now point at the two
       ends of one page, because the deck runs out after a handful of people
       and the thing to do when it does is read what everybody said. -->
  <div class="rule"><span id="brwlabel">Browse students</span><i></i></div>
  <!-- The affordance the profile block used to carry: a missing face with a +
       on it. One row rather than the four hundred pixels it cost before, and
       it is gone the moment there is a photo. -->
  <button class="mine" type="button" id="mine" hidden></button>
  <div class="deck" id="deck"></div>
  <div class="pacts" id="pacts" hidden></div>
