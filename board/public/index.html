  .growrow{display:flex;gap:.8rem;align-items:baseline;padding:.25rem 0;font-size:.86rem;
    color:var(--ink-2)}
  .growrow b{margin-left:auto;font-weight:600;color:var(--accent);
    font-variant-numeric:tabular-nums}
  .growrow.tot{margin-top:.35rem;padding-top:.45rem;border-top:1px solid var(--hair);
    color:var(--muted)}
  .growrow.tot b{color:var(--muted)}
  /* Seven days as seven letters. The shape of a run is the thing worth seeing. */
  .gweek{display:flex;gap:.3rem;margin:.85rem 0 0}
  .gweek i{flex:1;text-align:center;font-style:normal;font-size:.78rem;padding:.28rem 0;
    border-radius:.4rem;background:var(--accent-soft);color:var(--accent);font-weight:600}
  .gweek i.off{background:var(--raise);color:var(--line)}
  .gweek i.now{background:var(--accent);color:var(--accent-ink)}

  /* ---- the report card, as a panel about what happened --------------------- */
  /* THE TITLE. Set as a title and not as a statistic: serif, no number
     anywhere near it, and the sentence under it says what happened rather
     than what it is worth. */
  .rank{padding:.1rem 0 .95rem;border-bottom:1px solid var(--hair);margin-bottom:.85rem}
  .rankcap{display:block;font-size:.68rem;letter-spacing:.16em;
    text-transform:uppercase;color:var(--muted)}
  :root[data-lang="zh"] .rankcap{letter-spacing:.06em;font-size:.74rem}
  .rank b{display:block;margin:.3rem 0 0;font-family:var(--serif);font-weight:400;
    font-size:1.65rem;line-height:1.1;color:var(--accent)}
  .rank p{margin:.4rem 0 0;font-size:.9rem;line-height:1.55;color:var(--ink-2)}
  .rank .ranknext{margin:.5rem 0 0;font-size:.82rem;color:var(--muted)}

  .wonder{padding:.2rem 0 .9rem;border-bottom:1px solid var(--hair);margin-bottom:.2rem}
  .wbig{margin:0;font-family:var(--serif);font-size:1.4rem;line-height:1.3;color:var(--ink)}
  .wfaces{display:flex;align-items:center;margin:.7rem 0 0}
  .wfaces i{width:1.9rem;height:1.9rem;border-radius:50%;background:var(--raise);
    border:2px solid var(--paper);margin-right:-.5rem;display:grid;place-items:center;
    color:var(--muted);font-style:normal;font-size:.9rem}
  .wfaces span{margin-left:1rem;font-size:.78rem;color:var(--muted)}

  .big{display:flex;align-items:flex-end;gap:.8rem;padding:.85rem 0 .3rem}
  .bignum{font-family:var(--serif);font-size:2.2rem;line-height:.95}
  .biglab{flex:1;font-size:.85rem;color:var(--ink-2);line-height:1.35;padding-bottom:.15rem}
  .biglab small{display:block;color:var(--muted);font-size:.75rem;margin-top:.1rem}
  svg.spark{display:block;width:72px;height:25px;overflow:visible;flex:0 0 auto;
    margin-bottom:.25rem}
  svg.spark .ar{fill:var(--accent-soft)}
  svg.spark .ln{fill:none;stroke:var(--accent);stroke-width:1.6;
    stroke-linejoin:round;stroke-linecap:round}
  svg.spark .dot{fill:var(--accent)}

  .newsrows{margin:.4rem 0 0;border-top:1px solid var(--hair)}
  .newsrow{display:flex;gap:.6rem;align-items:flex-start;padding:.62rem 0;
    border-bottom:1px solid var(--hair);font-size:.9rem;line-height:1.45}
  .newsrow:last-child{border-bottom:0}
  .newsrow .nd{width:.42rem;height:.42rem;border-radius:50%;background:var(--accent);
    margin-top:.45rem;flex:0 0 auto}
  .newsrow .nd.q{background:var(--muted)}
  .newsquiet{margin:.6rem 0 0;padding:.85rem .9rem;background:var(--card);
    border:1px dashed var(--line);border-radius:.8rem;font-size:.88rem;
    color:var(--ink-2);line-height:1.55}

  .picgo{display:block}
  /* A result card is drawn on the same paper as the feed, so without an edge
     it reads as loose type in the post rather than as a picture. */
  .picgo .pic{margin-top:.65rem;border:1px solid var(--line)}
  .takeit{display:inline-block;margin:.7rem 0 0;border:1px solid var(--accent);
    background:var(--accent);color:var(--accent-ink);border-radius:99px;
    padding:.55rem 1.2rem;font-size:.95rem;text-decoration:none}
  .takeit:hover{opacity:.92}
  /* A CEILING ON HEIGHT, NOT A FIXED SHAPE.
   *
   * A phone selfie is often 9:16, and most of the top of one is whatever was
   * above the person — a car roof, a sky, a wall. At full height it costs the
   * whole screen to show a face in the lower third.
   *
   * So: nothing taller than five-to-four, cropped from the middle. That is the
   * shape a feed has settled on everywhere, and it is a real cut, not a token
   * one: a 9:16 selfie loses thirty per cent of its height, the 2:3 a camera
   * makes loses seventeen. Landscape and square photographs are under the
   * ceiling already and are shown whole.
   *
   * MEASURED IN cqw, AGAINST THE COLUMN, NOT THE PHONE. A ceiling in vw was
   * tried first and it is not one rule but a different rule per screen: the
   * photograph sits in a column narrower than the window by an avatar and two
   * paddings, and that gap is a bigger share of a small phone than of a wide
   * one. The same 94vw that trimmed a 9:16 selfie sensibly on a 390px phone
   * was also cutting fourteen per cent off an ordinary 2:3 portrait, and on a
   * desktop it clamped everything to something squarer still. 125cqw is one
   * twenty-five per cent of the photograph's own width, which is five-to-four
   * and nothing else, anywhere. A browser too old for container queries drops
   * the line and shows the photograph whole, which is where we were.
   *
   * The trim comes off the top and the bottom equally — deliberately, because
   * the last time I decided which end held the person, a real photograph
   * proved me wrong. */
  .pic{display:block;width:100%;border-radius:.7rem;margin:.65rem 0 0;
    max-height:125cqw;object-fit:cover;background:var(--raise)}

  /* ---- what you can do to it --------------------------------------------- */
  .acts{display:flex;align-items:center;gap:1.15rem;margin:.85rem 0 0;flex-wrap:wrap}
  .acts button{display:inline-flex;align-items:center;gap:.4rem;border:0;
    background:none;color:var(--ink-2);font-size:.92rem;padding:.15rem 0;
    /* A button holding only an icon is shorter than one holding text, and the
       row centres them — which drops the bare icons a few pixels below the
       labelled ones. One shared height puts every icon on the same line. */
    min-height:1.5rem}
  .acts button:hover{color:var(--accent)}
  .acts button[disabled]{opacity:.45;cursor:default}
  .acts svg{width:1rem;height:1rem;stroke:currentColor;fill:none;
    stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
  .acts .n{color:var(--muted);font-size:.86rem;font-variant-numeric:tabular-nums}
  .acts .liked{color:var(--accent)}
  /* On a 360px phone the English labels are ~30px wider than the row. Chinese
     already fits — two characters says what six letters do — so this is one of
     the places the two languages genuinely need different numbers. */
  @media (max-width:380px){
    .acts{gap:.8rem}
    .acts button{font-size:.87rem}
  }
  .acts button[aria-pressed="true"]{color:var(--accent)}
  .acts .liked svg{fill:currentColor;stroke:currentColor}

  /* ---- the thread underneath --------------------------------------------- */
  .thread{margin:.9rem 0 0;padding-left:.95rem;border-left:2px solid var(--line)}
  .rep{padding:.5rem 0}
  .rep + .rep{border-top:1px solid var(--hair)}
  .rep .line b{font-size:1rem}
  .rep p{margin:.2rem 0 0;font-family:var(--serif);font-size:1rem;line-height:1.5;
    overflow-wrap:anywhere}
  .rbox{display:flex;gap:.5rem;margin:.7rem 0 0}
  .rbox input{flex:1;min-width:0;border:1px solid var(--line);background:var(--raise);
    border-radius:99px;padding:.5rem .9rem;font:inherit;font-size:.95rem;
    color:var(--ink);outline:none}
  .rbox input:focus{border-color:var(--accent)}
  .rbox button{border:0;background:var(--accent);color:var(--accent-ink);border-radius:99px;
    padding:.5rem 1.05rem;font-size:.9rem}

  /* ---- nothing there yet -------------------------------------------------- */
  .none{padding:3.5rem .5rem;text-align:center;color:var(--muted)}
  .none b{display:block;font-family:var(--serif);font-weight:400;font-size:1.3rem;
    color:var(--ink);margin:0 0 .4rem}
  .none p{margin:0;font-size:.95rem;line-height:1.6}

  /* ---- the + ------------------------------------------------------------- */
  /* The language switch. In the masthead rather than in a menu: somebody who
     cannot read the page cannot find a menu labelled in the language they
     cannot read. */
  .lang{margin-left:auto;flex:0 0 auto;border:1px solid var(--line);
    background:var(--raise);color:var(--ink-2);border-radius:99px;
    padding:.42rem .9rem;font-size:.85rem;line-height:1}
  .lang:hover{color:var(--ink);border-color:var(--muted)}

  /* Translate, always in the same place. Above the +, smaller, because
     posting is the primary thing and reading help is the constant one. */
  .tfab{position:fixed;right:1.1rem;bottom:5.6rem;width:3.3rem;height:3.3rem;
    border-radius:50%;border:1px solid var(--line);background:var(--raise);
    color:var(--ink);box-shadow:var(--shadow);display:grid;place-items:center;
    z-index:30;font-family:var(--serif);font-size:1.25rem;line-height:1}
  .tfab:hover{border-color:var(--accent);color:var(--accent)}

  .tout{margin:.9rem 0 0;padding:.9rem 1rem;background:var(--raise);
    border:1px solid var(--line);border-radius:.7rem}
  .tout .said{margin:0;font-family:var(--serif);font-size:1.08rem;line-height:1.6;
    color:var(--ink)}
  .tout .py{margin:.35rem 0 0;font-size:.86rem;color:var(--muted)}
  .tout .note{margin:.6rem 0 0;padding-top:.55rem;border-top:1px solid var(--line);
    font-size:.86rem;line-height:1.55;color:var(--ink-2)}
  .tout .note b{display:block;font-size:.66rem;letter-spacing:.13em;
    text-transform:uppercase;color:var(--muted);margin:0 0 .2rem;font-weight:600}
  :root[data-lang="zh"] .tout .note b{text-transform:none;letter-spacing:.02em}
  .tpost{margin:.6rem 0 0;padding:.7rem .85rem;background:var(--accent-soft);
    border-radius:.6rem}
  .tpost p{margin:0;font-family:var(--serif);font-size:1.02rem;line-height:1.6}
  .tpost .py{margin:.3rem 0 0;font-family:var(--sans);font-size:.82rem;color:var(--muted)}
  .tpost .note{margin:.4rem 0 0;font-family:var(--sans);font-size:.82rem;color:var(--ink-2)}

  /* The bottom bar: Feed, a big +, Profile.
     Three targets on the thumb's arc, the one you press most in the middle
     and larger than the other two — the shape a phone app has, because
     somebody arriving from WeChat has used a hundred of them. */
  /* Held to the same column as the content.
     Left and right at 0 is correct on a phone, where the column IS the
     viewport. On a desktop window it drew a strip across the whole screen
     under a narrow page, which reads as a stretched phone rather than as an
     app. Same width as main, centred, with a border down each side once there
     is room for one. */
  .bar{position:fixed;left:50%;transform:translateX(-50%);bottom:0;z-index:35;
    width:100%;max-width:34rem;display:flex;
    align-items:center;justify-content:space-around;
    padding:.35rem .5rem calc(.35rem + env(safe-area-inset-bottom));
    background:var(--paper);border-top:1px solid var(--line)}
  @media (min-width:36rem) and (max-width:57.99rem){
    .bar{border-left:1px solid var(--line);border-right:1px solid var(--line);
      border-radius:1rem 1rem 0 0}
  }

  .bar a,.bar button{flex:1;min-width:0;border:0;background:none;color:var(--muted);
    display:flex;flex-direction:column;align-items:center;gap:.15rem;
    padding:.45rem .2rem;font-size:.64rem;text-decoration:none;letter-spacing:.02em}
  /* Five destinations now, so a label that will not fit is truncated rather
     than allowed to widen its tab and squeeze the others. */
  .bar a span,.bar button span{max-width:100%;overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap}
  .bar a[aria-current="page"]{color:var(--accent)}
  .bar svg{width:1.5rem;height:1.5rem;stroke:currentColor;fill:none;stroke-width:1.7;
    stroke-linecap:round;stroke-linejoin:round}
  /* .bar .new is gone with the middle button — see the markup. */

  /* ---- the same nav, at the top, on a desktop -----------------------------
   *
   * One element, not two. A second copy in the markup would mean two sets of
   * handlers and two things to keep in step, and the first symptom of that is
   * a button that works on one size and not the other.
   *
   * A bar pinned to the bottom of a large screen is a phone idiom: it puts the
   * navigation as far from the pointer as the window allows, and it is where
   * nobody on a desktop looks for it. Above 58rem it becomes a row in the
   * masthead instead — same buttons, same order, same code. */
  @media (min-width:58rem){
    /* Its own row, under the masthead.
       Not beside the title: this column is 34rem wide, so a header holding the
       mark, the name, three nav items and the language button has about eighty
       pixels for the name — the title and the nav simply landed on top of each
       other. A row of its own has room, and a nav under a masthead is what a
       web app looks like anyway. */
    .top{flex-wrap:wrap;margin-bottom:1.2rem}
    .bar{position:static;transform:none;width:auto;max-width:none;
      flex:0 0 100%;order:2;
      margin:.15rem 0 0;padding:.5rem 0 0;background:none;border:0;
      border-top:1px solid var(--hair);border-radius:0;
      gap:.25rem;justify-content:flex-start}
    /* Icon beside the label rather than above it: a row of tall stacks in a
       header makes the header tall. */
    .bar a,.bar button{flex:0 0 auto;flex-direction:row;gap:.4rem;
      padding:.45rem .85rem;border-radius:99px;font-size:.88rem;
      letter-spacing:0;color:var(--ink-2)}
    .bar a:hover,.bar button:hover{background:var(--raise);color:var(--ink)}
    .bar a[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
    .bar svg{width:1.15rem;height:1.15rem}
    /* The + is no longer in the bar at all — it is in the masthead corner with
       the bell. On a desktop there is room for the word beside the sign, and a
       header button that says what it does beats one that has to be hovered. */
    .plus{width:auto;height:auto;border-radius:99px;padding:.45rem .95rem;
      grid-auto-flow:column;align-items:center;gap:.4rem;
      color:var(--accent-ink);font:inherit;font-size:.88rem}
    .plus:hover{filter:brightness(1.05)}
    .plus svg{width:1.15rem;height:1.15rem;stroke-width:2}
    .plus .vh{position:static;width:auto;height:auto;margin:0;overflow:visible;
      clip:auto;clip-path:none;white-space:nowrap}
    /* The masthead was a two-item row and is a three-item row now. Without a
       basis the title had none: flex shrinks a child to its longest word
       before it takes space from a sibling, so the masthead broke over two lines
       and the tagline came down in a five-line ribbon beside it. */
    .top .name{flex:1 1 auto;min-width:0}
    .top p{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    /* The language button no longer needs to push itself right; the nav does. */
    #langslot{margin-left:.5rem}
    /* Nothing is pinned over the feed any more, so the space kept clear for it
       is space wasted. */
    main{padding-bottom:3rem}
  }

  .fab{position:fixed;right:1.2rem;bottom:1.6rem;width:4rem;height:4rem;
    border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);
    box-shadow:var(--shadow);display:grid;place-items:center;z-index:30}
  .fab svg{width:1.7rem;height:1.7rem;stroke:currentColor;stroke-width:2;
    stroke-linecap:round;fill:none}

  /* ---- putting something up ---------------------------------------------- */
  .sheet{position:fixed;inset:0;z-index:40;display:flex;align-items:flex-end;
    justify-content:center;background:rgba(21,27,40,.42)}
  .sheet .card{width:100%;max-width:34rem;background:var(--paper);
    border-radius:1.1rem 1.1rem 0 0;padding:1.3rem 1.15rem calc(1.3rem + env(safe-area-inset-bottom));
    box-shadow:var(--shadow);overflow-y:auto;
    /* Not 92vh. WeChat's toolbar is inside the viewport on Android and outside
       it on iOS, so vh is wrong by about 60px in one direction or the other and
       the bottom of this sheet ends up under the chrome. --vh is set from
       innerHeight, which is the number that is actually true. */
    max-height:calc(var(--vh, 1vh) * 92)}
  .sheet h2{margin:0 0 1rem;font-family:var(--serif);font-weight:400;font-size:1.35rem}


  /* The way out. Not styled as a danger button until the sheet it opens —
     a red control on a form somebody is filling in reads as a warning about
     the form. */
  .gonebox{margin:1.4rem 0 0;padding:.9rem 0 0;border-top:1px solid var(--hair);
    text-align:center}
  .gonebox button{border:0;background:none;padding:.3rem;font:inherit;
    font-size:.84rem;color:var(--muted);text-decoration:underline}
  .gonelist{margin:.9rem 0 0;padding:0 0 0 1.1rem;color:var(--ink-2);
    font-size:.92rem;line-height:1.65}
  .gonelist li{margin:.15rem 0}
  .go.warn{background:var(--bad,#B3261E);color:#fff}
  .sheet textarea{width:100%;border:1px solid var(--line);background:var(--raise);
    border-radius:.7rem;padding:.85rem;font:inherit;font-family:var(--serif);
    font-size:1.08rem;line-height:1.55;color:var(--ink);resize:vertical;outline:none}
  .sheet textarea:focus{border-color:var(--accent)}
  .field{display:flex;gap:.6rem;margin:.8rem 0 0}
  .field input,.field select{flex:1;min-width:0;border:1px solid var(--line);
    background:var(--raise);border-radius:99px;padding:.6rem .95rem;font:inherit;
    font-size:.95rem;color:var(--ink);outline:none}
  .field input:focus,.field select:focus{border-color:var(--accent)}
  .row{display:flex;align-items:center;gap:.6rem;margin:.9rem 0 0}
  .ghost{border:1px solid var(--line);background:var(--raise);color:var(--ink);
    border-radius:99px;padding:.6rem 1.1rem;font-size:.92rem}
  .go{margin-left:auto;border:0;background:var(--accent);color:var(--accent-ink);
    border-radius:99px;padding:.68rem 1.5rem;font-size:.98rem}
  .go[disabled]{opacity:.5;cursor:default}
  .shot{position:relative;margin:.8rem 0 0}
  .shot img{display:block;width:100%;border-radius:.7rem}
  .shot button{position:absolute;top:.5rem;right:.5rem;width:2rem;height:2rem;
    border-radius:50%;border:0;background:rgba(21,27,40,.72);color:#fff;
    font-size:1.1rem;line-height:1;display:grid;place-items:center}
  .said{margin:.85rem 0 0;font-size:.92rem;line-height:1.5;color:var(--ink-2)}
  /* Above the compose box, not below the send button. Below it the line sat
     under the keyboard on a phone, which is the same as not being there. */
  .orbuddy{display:flex;align-items:center;gap:.6rem;margin:0 0 1rem;
    padding:.6rem .75rem;border:1px solid var(--line);border-radius:.8rem;
    background:var(--raise);font-size:.86rem;color:var(--muted);line-height:1.4}
  .orbuddy span{flex:1 1 auto}
  .orbuddy a{flex:0 0 auto;color:var(--accent);text-decoration:none;
    font-size:.88rem;white-space:nowrap;border:1px solid var(--accent);
    border-radius:99px;padding:.35rem .8rem}
  .hint{margin:0 0 .9rem;font-size:.86rem;line-height:1.55;color:var(--muted)}
  .reasons{display:flex;gap:.4rem;flex-wrap:wrap;margin:0 0 .8rem}
  .reasons button{border:1px solid var(--line);background:var(--raise);color:var(--ink);
    border-radius:99px;padding:.45rem .9rem;font-size:.88rem;line-height:1}
  .reasons button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);
    color:var(--accent-ink)}
  .alsoblock{display:flex;align-items:flex-start;gap:.6rem;margin:.85rem 0 0;
    font-size:.9rem;line-height:1.45;color:var(--ink-2);cursor:pointer}
  .alsoblock input{margin:.15rem 0 0;flex:0 0 auto;width:1.05rem;height:1.05rem;
    accent-color:var(--accent)}
  .alsoblock b{font-weight:400;color:var(--ink)}
  .said.bad{color:var(--accent)}

  .foot{margin:2.5rem 0 0;padding-top:1.3rem;border-top:1px solid var(--line);
    color:var(--muted);font-size:.82rem;line-height:1.65}


  /* ---- the deck, at the top of the feed ---------------------------------
   *
   * Browse used to be its own page. It is now the first thing on this one,
   * because a stack of three cards is exhausted in ten seconds and a page that
   * ends there ends the visit with it. Underneath the last card is the feed,
   * so running out of people starts the next thing rather than finishing.
   *
   * The card catches sideways drags only — `touch-action:pan-y` leaves the
   * vertical gesture to the page, which is the whole idea. */
  /* HEIGHT IS A BUDGET, NOT A PROPORTION.
   *
   * A share of the viewport is the wrong rule here: the card has a masthead, a
   * section rule, the Follow row and the nav bar to fit around, and those are
   * fixed pixels. At 62vh the buttons sat behind the bar on every phone shorter
   * than about 815px of viewport, which is most of them.
   *
   * So: take what is left after everything else, cap it so it does not become a
   * poster on a desktop, and floor it so a short screen still shows a face.
   * --vh is set from innerHeight because 100vh on a phone is the height the page
   * would have if the browser's own chrome were not there. */
  .deck{position:relative;width:100%;
    height:max(13rem, min(62vh, 34rem, calc(var(--vh, 1vh) * 100 - 21rem - env(safe-area-inset-bottom))));
    margin:0 0 .9rem;touch-action:pan-y;overflow:hidden;border-radius:1.3rem}
  /* The row above it is always there now, so the deck always pays for it. */
  #mine:not([hidden]) + .deck{
    height:max(11rem, min(52vh, 30rem, calc(var(--vh, 1vh) * 100 - 26rem - env(safe-area-inset-bottom))))}
  /* No photograph: shorter, so the sentence is on the screen — see the note
     where this class is set. Both selectors, because the row above changes
     the height and this has to beat it. */
  .deck.short, #mine:not([hidden]) + .deck.short{
    height:max(9rem, min(34vh, 19rem, calc(var(--vh, 1vh) * 100 - 30rem - env(safe-area-inset-bottom))))}
  .pc{position:absolute;inset:0;border-radius:1.3rem;overflow:hidden;
    background:var(--raise);box-shadow:var(--shadow);
    display:flex;flex-direction:column;justify-content:flex-end;
    will-change:transform;transition:transform .28s ease,opacity .28s ease}
  .pc.gone{opacity:0}
  .pc img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
  /* No photograph is not a hole: the initial, big, on the accent. */
  /* THE LETTER, AT THE SIZE OF A MISSING PICTURE. It was 8rem — a screen with
     one character on it, which is what the card became for anybody who had not
     uploaded a face. It sits behind the words now rather than instead of
     them. */
  .pc .noshot{position:absolute;inset:0;display:grid;place-items:center;
    background:var(--accent);color:var(--accent-ink);
    font-family:var(--serif);font-size:4.5rem;line-height:1;opacity:.55;
    align-content:start;padding-top:1.1rem}
  /* Words on a scrim, not straight onto the photograph: white on a picture is
     legible right up until somebody uploads a bright one. */
  .pc .scrim{position:relative;padding:5rem 1.2rem 1.2rem;
    background:linear-gradient(to top,rgba(10,14,22,.86),rgba(10,14,22,.52) 42%,rgba(10,14,22,0))}
  .pc .nameline{display:flex;align-items:baseline;gap:.6rem;flex-wrap:wrap}
  .pc h2{margin:0;font-family:var(--serif);font-weight:400;font-size:1.8rem;
    line-height:1.1;color:#fff}
  /* The four letters, as a badge. Monospaced-feeling by letter-spacing rather
     than by a mono stack, which would not match anything else here. */
  .pc .type{flex:0 0 auto;font-weight:500;font-size:.78rem;letter-spacing:.1em;
    background:rgba(255,255,255,.2);color:#fff;border-radius:99px;
    padding:.25rem .55rem .25rem .65rem}
  .pc .type.you{background:var(--accent);letter-spacing:.06em}
  /* ALREADY FOLLOWING, as a mark rather than a button — see personCard. It is
     pressable (it is how you undo one from here) so it says so: a cursor, a
     tick, and a focus ring that is visible on a photograph. */
  .pc .type.fol{letter-spacing:.04em;cursor:pointer;background:rgba(255,255,255,.28);
    border:1px solid rgba(255,255,255,.55)}
  .pc .type.fol::before{content:"\2713\00a0"}
  .pc .type.fol:hover{background:rgba(255,255,255,.42)}
  .pc .type.fol:focus-visible{outline:2px solid #fff;outline-offset:2px}
  /* THE MARK, on the photograph beside the name. Same badge family as the four
     letters — it is one more thing about this person, not a decoration on
     them — but it carries its own name in words, because a shape nobody can
     read is a shape that gets asked about once and ignored after. */
  .pc .rank{display:inline-flex;align-items:center;gap:.35rem;flex:0 0 auto;
    font-weight:500;font-size:.78rem;background:rgba(255,255,255,.2);color:#fff;
    border-radius:99px;padding:.25rem .6rem}
  .pc .where{margin:.3rem 0 0;font-size:.92rem;color:rgba(255,255,255,.82)}
  .pc .goal{margin:.6rem 0 0;font-family:var(--serif);font-size:1.02rem;line-height:1.5;
    color:rgba(255,255,255,.92);display:-webkit-box;-webkit-line-clamp:3;
    -webkit-box-orient:vertical;overflow:hidden}
  .pc .pdays{display:flex;gap:.25rem;margin:.7rem 0 0;flex-wrap:wrap}
  .pc .pdays b{width:1.7rem;height:1.7rem;display:grid;place-items:center;border-radius:.4rem;
    font-size:.7rem;font-weight:500;background:rgba(255,255,255,.16);color:rgba(255,255,255,.6)}
  .pc .pdays b.on{background:#fff;color:#14203a}

  .pacts{display:flex;gap:.6rem;width:100%}
  /* Flex hands a child its longest word before it takes space from a sibling,
     so both need telling they may be narrower than their content. */
  .pacts>*{flex:1 1 0;min-width:0}
  .pacts button,.pacts a{border:1px solid var(--line);background:var(--raise);
    color:var(--ink);border-radius:99px;padding:.8rem 1rem;font-size:1rem;
    text-align:center;text-decoration:none}
  .pacts .primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
  /* Already following: the button is still there to undo it, and stops
     shouting to be pressed. */
  .pacts .primary.on{background:var(--raise);border-color:var(--line);color:var(--ink-2)}
  .pcount{margin:.7rem 0 0;text-align:center;font-size:.82rem;color:var(--muted);
    font-variant-numeric:tabular-nums}
  /* THE DOOR, FROM THE INSIDE. Above the first face rather than under the
     deck, and sized to be read rather than found: the queue at full strength,
     the membership after it in the quieter voice. A tinted band rather than a
     line of grey, because it is the one thing on this screen that is about
     the place and not about a person. */
  .atdoor{margin:0 0 .9rem;padding:.6rem .9rem;border-radius:.7rem;
    background:var(--raise);text-align:center;font-size:.86rem;color:var(--muted);
    font-variant-numeric:tabular-nums}
  .atdoor b{display:block;margin:0 0 .1rem;color:var(--ink);font-weight:600;
    font-size:1.05rem}
  /* WITH NOBODY WAITING IT IS NOT A DOOR, IT IS A COUNT. The box and the big
     bold line are for "20 people want in" — the interesting half. Wearing them
     to say "6 people in the room" made the quietest fact on the screen the
     loudest thing on it, louder than the filter above and competing with the
     face below. Same line, said once, in the voice of a caption. */
  .atdoor.just{background:none;padding:.1rem 0 0;margin:0 0 .7rem;text-align:left;
    font-size:.82rem}
  .atdoor.just b{display:inline;margin:0;color:var(--muted);font-weight:400;
    font-size:.82rem}
  /* THE NUMBER IS THE WAY TO THE LIST, for a member. Same line, same weight —
     it is still a fact first — with a chevron in the accent to say it goes
     somewhere. A button rather than a link because it opens something further
     down this page rather than another page. */
  .atdoor .doorgo{display:block;width:100%;margin:0 0 .1rem;padding:0;border:0;
    background:none;font:inherit;font-weight:600;font-size:1.05rem;
    color:var(--ink);text-align:center;cursor:pointer}
  .atdoor .doorcar{display:inline-block;margin-left:.35rem;color:var(--accent);
    font-weight:700;line-height:1}
  .atdoor .doorgo:active .doorcar{transform:translateX(.12rem)}
  /* THE QUEUE AS A LIST, under the deck. Rows and not cards: these are people
     to recognise, not people to choose between, and the deck above is already
     doing the choosing. */
  /* A CARD, THE SHAPE OF THE REPORT CARD. It was a small grey uppercase line
     under the deck, which on a phone is several screens down — findable only
     by somebody who already knew it was there, and reported as exactly that.
     The report card is the one thing on this app people do find, so the queue
     borrows its shape: a raised card, a mark carrying the number, an eyebrow,
     a line of names, and a chevron. Shut until asked for, because thirty-five
     rows is most of a screen. */
  .queue{margin:1.6rem 0 1.2rem;background:var(--raise);
    border:1px solid var(--line);border-radius:1.1rem;box-shadow:var(--shadow);
    overflow:hidden}
  /* A line, not a card. It sits under the rotation and above the room, quiet
     until somebody is looking for it. */
  .backline{display:block;width:100%;margin:.5rem 0 0;padding:.55rem 0;
    border:0;background:none;color:var(--muted);font:inherit;font-size:.88rem;
    text-align:center}
  .backline b{color:var(--accent);font-weight:500;margin-left:.35rem}
  .qtoggle{display:flex;width:100%;align-items:center;gap:.75rem;
    padding:.95rem 1.05rem .8rem;color:var(--ink);text-align:left}
  /* The number, in the accent circle, at the size of a fact. */
  .qmark{width:2rem;height:2rem;border-radius:50%;flex:0 0 auto;font-style:normal;
    background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;
    font-size:.92rem;font-weight:700;line-height:1;font-variant-numeric:tabular-nums;
    -webkit-font-smoothing:antialiased}
  .qmark.wide{font-size:.76rem}
  .qtext{flex:1 1 auto;min-width:0}
  .qtext b{display:block;font-weight:500;font-size:.74rem;letter-spacing:.1em;
    text-transform:uppercase;color:var(--accent)}
  :root[data-lang="zh"] .qtext b{text-transform:none;letter-spacing:.02em}
  .qtext em{display:block;margin:.1rem 0 .05rem;font-family:var(--serif);
    font-style:normal;font-size:1.08rem;line-height:1.2;color:var(--ink);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .qtext span{display:block;font-size:.86rem;color:var(--muted);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  /* The chevron went with the button. Nothing here opens any more. */
  #queuelist{padding:0 1.05rem .5rem}
  /* WAITING FOR YOU. Sits between the head and the list because it is the
     reason to read the list — see drawPairs. Indented to the same gutter as
     the rows so it reads as part of the same block and not a second card. */
  .qpairs{padding:.1rem 1.05rem .55rem;margin:0 0 .2rem}
  .qpairs>b{display:block;font-weight:500;font-size:.74rem;letter-spacing:.1em;
    text-transform:uppercase;color:var(--muted);margin:0 0 .35rem}
  :root[data-lang="zh"] .qpairs>b{text-transform:none;letter-spacing:.02em}
  .qp{margin:.25rem 0;font-size:.92rem;line-height:1.45}
  .qp b{font-weight:650}
  .qp span{color:var(--muted)}
  /* The initial rings sat on --raise, and so does the card now — so they
     disappeared into it. On the card they take the paper behind it. */
  .queue .qav{background:var(--paper)}
  .qrow{display:flex;gap:.7rem;align-items:flex-start;padding:.6rem 0;
    border-bottom:1px solid var(--hair,var(--line))}
  .qrow:last-child{border-bottom:0}
  .qav{width:2.2rem;height:2.2rem;border-radius:50%;flex:0 0 auto;overflow:hidden;
    display:grid;place-items:center;background:var(--raise);color:var(--muted);
    font-weight:700;text-transform:uppercase;font-size:.85rem}
  .qav img{width:100%;height:100%;object-fit:cover}
  .qmid{min-width:0;flex:1}
  .qmid .qn{font-weight:650}
  .qmid em{font-style:normal;color:var(--muted)}
  .qmid small{display:block;color:var(--muted);font-size:.84rem;margin-top:.1rem;
    overflow-wrap:anywhere}
  .qtags{display:flex;flex-wrap:wrap;gap:.3rem;margin-top:.3rem}
  .qtags span{font-size:.7rem;border:1px solid var(--line);border-radius:99px;
    padding:.1rem .45rem;color:var(--muted)}
  .qpl{flex:0 0 auto;color:var(--muted);font-size:.8rem;
    font-variant-numeric:tabular-nums}
  /* The one thing a member can do about somebody waiting. Outlined until it
     is pressed and filled after, so the row says what you already did. */
  .qv{flex:0 0 auto;align-self:center;border:1px solid var(--accent);
    background:none;color:var(--accent);border-radius:99px;padding:.2rem .7rem;
    font:inherit;font-size:.75rem;font-weight:650;cursor:pointer;white-space:nowrap}
  .qv[aria-pressed="true"]{background:var(--accent);color:#fff}
  .qv:disabled{opacity:.55;cursor:default}
  .qnone{color:var(--muted);font-size:.88rem}
  /* On the feed it is a line under the topics, not a band: the feed already
     opens with a row of controls and a second filled block above the first
     post reads as a second bar. */
  #feeddoor{margin:.2rem 0 .9rem;padding:0;background:none}
  /* Share, on the face it shares. A pill rather than a bare icon: this is the
     control that puts somebody into a WeChat group, so it is worth a word. It
     sits on its own scrim because it has to stay readable on a photograph
     whatever is behind it. */
  /* On the photograph, so they sit over the scrim rather than under the fold.
     The shared one is filled; the others are outlines — one glance says what
     you have in common without a second line of text saying it. */
  .pchips{display:flex;flex-wrap:wrap;gap:.3rem;margin:.6rem 0 0}
  .pchip{font-size:.72rem;padding:.22rem .55rem;border-radius:99px;
    border:1px solid rgba(255,255,255,.45);color:#fff;background:rgba(0,0,0,.22)}
  .pchip.on{background:#fff;color:#151B28;border-color:#fff}
  /* THE SENTENCE, ON THE FACE. Set as a line of text with the two roles as
     pills inside it rather than as a row of chips: it is something a person
     wrote, and it should read as words with two of them emphasised. */
  /* ITS OWN SLOT, DIRECTLY UNDER THE NAME. An empty one on a card with no
     sentence (somebody who joined before it existed) would be a gap under
     every such name, so it collapses. */
  .psaywrap:empty{display:none}
  .psay{margin:.45rem 0 0;font-size:.9rem;line-height:1.9;
    color:rgba(255,255,255,.82)}
  /* Now that it sits above the city and the bio rather than at the bottom of
     the card, the space belongs under it. */
  .psaywrap + .where{margin-top:.5rem}
  .psaywrap .pchips{margin-top:.45rem}
  .psay .pchip{display:inline-block;vertical-align:.05em}
  /* The other sentences, as a count rather than as more pills. Quiet enough
     that it reads as a footnote on the one above it. */
  .psay .psaymore{margin-left:.45rem;font-size:.78rem;color:rgba(255,255,255,.6)}

  .pc .share{position:absolute;top:.8rem;right:.8rem;z-index:2;
    display:inline-flex;align-items:center;gap:.4rem;border:0;
    background:rgba(10,14,22,.52);color:#fff;border-radius:99px;
    padding:.5rem .9rem .5rem .8rem;font-size:.88rem;line-height:1;
    -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
    box-shadow:0 1px 3px rgba(0,0,0,.35)}
  .pc .share:hover{background:rgba(10,14,22,.72)}
  .pc .share svg{width:1.05rem;height:1.05rem;stroke:currentColor;fill:none;
    stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
  /* Your own missing face, under everybody else's. The circle IS the control:
     one tap opens the picker, which is the shortest route there is. */
  .mine{display:flex;align-items:center;gap:.75rem;width:100%;margin:0 0 .8rem;
    padding:.7rem .85rem;border:1px solid var(--line);background:var(--raise);
    border-radius:.9rem;text-align:left;color:inherit}
  .mine .ring{position:relative;flex:0 0 auto;width:2.6rem;height:2.6rem;
    border-radius:50%;background:var(--paper);color:var(--accent);
    display:grid;place-items:center;font-family:var(--serif);font-size:1.15rem;
    line-height:1;box-shadow:0 0 0 2px var(--line)}
  .mine .ring{overflow:visible}
  .mine .ring img{position:absolute;inset:0;width:100%;height:100%;border-radius:50%;
    object-fit:cover;display:block}
  /* Not .go — that is the sheet's primary button, and this is a chevron. */
  .mine .chev{margin-left:auto;flex:0 0 auto;color:var(--muted);font-size:1.4rem;
    line-height:1;padding-left:.4rem}
  .mine .ring i{position:absolute;right:-2px;bottom:-2px;width:1.15rem;height:1.15rem;
    border-radius:50%;background:var(--accent);color:var(--accent-ink);
    display:grid;place-items:center;font-style:normal;font-size:.8rem;
    font-family:var(--sans);box-shadow:0 0 0 2px var(--raise)}
  .mine b{display:block;font-weight:400;font-size:.98rem;color:var(--ink)}
  .mine span{display:block;margin:.1rem 0 0;font-size:.82rem;color:var(--muted)}
  /* The last card in the deck, when there is no face on this phone. Same shape
     as a person, because it is asking you to become one. */
  .pc.turn .noshot{background:linear-gradient(160deg,var(--accent),var(--t6));
    font-size:6rem}
  /* .psafety is gone — the safety note lives on /privacy now. */
  .footpriv{color:var(--muted);text-decoration:underline;text-underline-offset:.2em}
  .bnone{margin:0 0 1.9rem;padding:1.6rem 1.1rem;text-align:center;color:var(--muted);
    background:var(--raise);border:1px solid var(--line);border-radius:1rem}
  .bnone b{display:block;font-family:var(--serif);font-weight:400;font-size:1.15rem;
    color:var(--ink);margin:0 0 .35rem}
  .bnone p{margin:0 auto 1rem;max-width:24rem;font-size:.9rem;line-height:1.55}
  .bnone a{display:inline-block;border:0;background:var(--accent);color:var(--accent-ink);
    border-radius:99px;padding:.65rem 1.4rem;font-size:.95rem;text-decoration:none}

  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<main>
  <!-- While it is true. An empty room reads as a dead product unless it says
       it is not open yet. -->
  <p class="invite" id="invite"></p>
  <div class="top">
    <!-- The mark itself, square. This used to point at /share.png, which was a
         400px square and is now a 1200x630 link card — a wide image in a round
         container crops to a slice of the middle, which here is the middle of
         a word. -->
    <div class="mark"><img src="/favicon.png" alt="" width="192" height="192"
      onerror="this.replaceWith(document.createTextNode('\u7559'))"></div>
    <div class="name">
      <h1 id="boardname">The Board</h1>
      <!-- THE LINE UNDER THE NAME IS HIDDEN ON BROWSE AND SAYS THE SAME THING
           TWICE WHEN IT IS NOT. The masthead carried the mark, the name, the
           count and "invite only" — on every tab, every visit, none of it
           changing — and under it Browse already prints "20 want in · 6 are
           in" as a line in the body, which is the same number in the same
           screen. So the count goes back to the body line it came from (see
           drawDoor) and this stays for the pages that have no such line.
           Not deleted: it is still the honest fallback before anybody has been
           counted, and every string that writes to it still works. -->
      <p id="count" hidden>Anyone can read. Anyone can post.</p>
      <!-- The member's own invite, beside the count, because that is where
           somebody looks when they are thinking about who else is here. -->
    </div>
    <nav class="bar" id="bar">
      <!-- FOUR TABS, IN WECHAT'S POSITIONS.
           Not imitation for its own sake. Tom's people open WeChat forty times
           a day, and a thumb that has learned where Chats and Me live does not
           re-read a bar it recognises — it presses. This one had Browse first
           and Messages fourth, which is that order backwards, plus a fifth
           button in the middle of a bar WeChat keeps four wide. Every
           destination is the same one it was; only where the thumb finds it
           has changed.
             Messages ← 微信      Cards ← 通讯录 (the cards people handed you)
             Browse   ← 发现      Profile ← 我
           Putting something up moved to the top right of the screen, which is
           where WeChat keeps its own plus. -->
      <a href="/notes" id="navnotes">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16v12H4z M4 7l8 6 8-6"/></svg>
        <span id="navnoteslabel">Messages</span>
        <i class="badge" id="navnotesn" hidden></i>
      </a>
      <a href="/cards" id="navcards">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18v12H3z M3 10h18"/></svg>
        <span id="navcardslabel">Cards</span>
        <i class="badge" id="navcardsn" hidden></i>
      </a>
      <a href="/browse" id="navbrowse">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4h10a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2Z M9 15c1.5-2 4.5-2 6 0"/><circle cx="12" cy="10" r="2.2"/></svg>
        <span id="navbrowselabel">Browse</span>
        <i class="badge" id="navbrowsen" hidden></i>
      </a>
      <!-- The feed opens on "not yet" until members are posting, so its tab is
           hidden rather than deleted — /feed#id is what a shared post looks
           like, showView still names it, and showTranslate still reads its
           aria-current. -->
      <a href="/feed" id="navfeed" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
        <span id="navfeedlabel">Feed</span>
      </a>
      <a href="#" id="navme">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8Z M4 21a8 8 0 0 1 16 0"/></svg>
        <span id="navmelabel">Profile</span>
      </a>
    </nav>
    <!-- PUTTING SOMETHING UP, out of the bar and into the corner.
         It was the raised disc in the middle of five tabs, which is Instagram's
         shape, not WeChat's — and the bar is the one part of this app that has
         to read as WeChat's, because that is the muscle memory every person
         here arrives with. WeChat keeps its plus top right; so does this. The
         button is the same button: same id, same handler, same sheet. All that
         went is the label under it, which a corner icon does not have room for
         and does not need — it is on the aria-label instead. -->
    <button class="plus" type="button" id="fab">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
      <span class="vh" id="navnewlabel">Put something up</span>
    </button>
    <!-- ONE PLACE FOR WHAT IS ADDRESSED TO YOU. A bell rather than a fifth tab:
         the bar is four wide and this has to be reachable from the top of the
         page where people look. -->
    <button class="bell" type="button" id="bell" aria-controls="notif" aria-expanded="false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4a5 5 0 0 1 5 5v3.5l1.6 2.6H5.4L7 12.5V9a5 5 0 0 1 5-5Z M10 18.4a2 2 0 0 0 4 0"/></svg>
      <i class="badge" id="belln" hidden></i>
    </button>
    <span id="langslot"></span>
    <!-- WHAT THE ＋ OPENS. WeChat's plus is a menu, not a button — new chat,
         add a friend, scan — and this is the same three-line answer to the
         same question: what can I start from here. "Set up your profile" is
         deliberately not on it: the Profile tab does that, and after the first
         time it is an item that means nothing.
         Each line hides itself when it is not available, and if only one is
         left the ＋ does that thing directly rather than opening a menu with
         one line in it. -->
    <div class="plusmenu" id="plusmenu" hidden role="menu">
      <a href="/notes" id="plusnotes" role="menuitem">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16v12H4z M4 7l8 6 8-6"/></svg>
        <span></span>
      </a>
      <button type="button" id="plusinv" role="menuitem">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        <span></span>
      </button>
      <a href="/notes#new" id="pluswrite" role="menuitem">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h4l10-10-4-4L4 16z M14 6l4 4"/></svg>
        <span></span>
      </a>
      <a href="/onboard" id="plusrun" role="menuitem" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 11a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z M2 20a7 7 0 0 1 14 0 M18 8v6M15 11h6"/></svg>
        <span></span>
      </a>
    </div>
  </div>

  <!-- Follows and the card of the day, in the one tray. Anything that is FOR
       you goes here; the report card below is what you ARE. -->
  <section class="notif" id="notif" hidden>
    <!-- TWO THINGS TO DO WITH ONE INVITE, so two controls rather than one
         tap target with two meanings: send the whole letter, or take the six
         characters on their own for somebody who already has the link. -->
    <!-- THREE THINGS, AND THEY GO AWAY WHEN DONE.
         The first thing in the tray because it is the only thing here that is
         asking rather than reporting. Three at a time and never more: a list
         of nine is a chore, and the four remaining are still there tomorrow. -->
    <div class="todo" id="todo" hidden>
      <span class="lab" id="todolab"></span>
      <ul id="todolist"></ul>
      <span class="tap" id="todoleft"></span>
    </div>
    <!-- THE PROFESSOR'S FOLD, MOVED IN HERE.
         It used to stand between the deck and the feed, which on a phone is
         the whole screen twice over before you reach a single post. The room
         is for the room; anything that is a setting, a test or a report is
         behind the bell. -->
    <section class="prof" id="prof" hidden>
    <button class="profhead" type="button" id="profhead" aria-controls="profbody">
    <i class="profmark" aria-hidden="true"><svg viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="7" style="width:1em;height:1em;display:block" aria-hidden="true"><circle cx="38" cy="50" r="24"/><circle cx="62" cy="50" r="24"/></svg></i>
    <span class="proftext">
    <b id="proftitle"></b>
    <em id="profsub"></em>
    <span id="profsum"></span>
    </span>
    <!-- Today's letter, level with the mark at the other end of the row, so
    the one thing worth knowing is readable without opening anything.
    The mark says whose card this is; this says how it is going. -->
    <b class="profgrade" id="profgrade" hidden></b>
    <i class="chev" aria-hidden="true"></i>
    </button>
    <div id="profbody">
    <!-- WHAT HAS HAPPENED SINCE THEY WERE LAST HERE, first. The level used
    to be here and is still drawn below it — but a number that is the
    same every day cannot be the reason somebody opens this. -->
    <div id="profnews"></div>
    <!-- Your level, large. Shown at full size only when there is no news to
    put above it, which is mostly somebody's first week. -->
    <div id="profnow"></div>
    <!-- One card a day, at the reader's own level, drawn here rather than
    posted: a shared board with fifty people on it would carry fifty
    cards a morning and the thing worth reading would be underneath
    them. See daily.js. -->
    <div id="daily"></div>
    <!-- THE TWO TESTS, AND ONLY HERE.
         They were in the rotating bar on the homepage, which meant the first
         thing on the board most days was the board asking somebody to sit a
         Chinese test. A test is a thing you go and take when you want to know
         your level; it is not news, and it does not belong on the page people
         open to read what everybody said. Everything else the Professor
         offers still rotates up there — see drawRot. -->
    <div id="proftests"></div>
    </div>
    </section>

    <!-- SETTINGS, SUCH AS THERE ARE. One row: whether this person is in
         Browse. It said "coming soon" for a day, next to a tick box in the
         profile form that has done exactly this since the form existed —
         which is worse than saying nothing. It reports the real state and
         opens the real control. See drawSetts. -->
    <div class="setts" id="setts">
      <span class="lab" id="settslab"></span>
      <div class="settrow" id="incogrow">
        <div>
          <b id="incoglab"></b>
          <small id="incogwhy"></small>
        </div>
        <button class="settgo" type="button" id="incoggo"></button>
      </div>
      <!-- THE WAY BACK, REPORTED WHERE SETTINGS ARE LOOKED FOR.
           The control is one question at the end of the profile form and stays
           there — two boxes for one address is how a profile ends up
           disagreeing with itself. This is the row that says which state it is
           in and opens that one, the same as the row above it does for Browse.
           It is here because the bell is on every screen and a form is not:
           somebody wanting to check whether they can get back in should not
           have to open an editor to find out. -->
      <div class="settrow">
        <div>
          <b id="maillab"></b>
          <small id="mailwhy"></small>
        </div>
        <button class="settgo" type="button" id="mailgo"></button>
      </div>
    </div>

    <!-- MAKE AN OFFER. Above the invite because it is the stronger version of
         the same act: an invite asks somebody to come and look at a room, an
         offer hands them work and lets accepting be how they get in.

         Hidden for almost everybody, and that is deliberate rather than
         temporary caution — reaching a stranger with money attached is a
         different power from being in the room. It belongs on a matched card
         once anybody can send one; until then it is a short list of people and
         one block in the tray. -->
    <div class="mkoffer" id="mkoffer" hidden>
      <span class="lab" id="mkofferlab"></span>
      <p class="why" id="mkofferwhy"></p>
      <!-- WHICH OF THE TWO. A job is a date and a number; a project is the
           conversation that has to happen before either exists. The switch is
           here rather than inferred from whether the money box is empty,
           because an empty money box on a job is a mistake and on a project is
           a term. -->
      <div class="f"><span id="mkofferkindk"></span>
        <div class="kinds" role="group">
          <button type="button" class="kbtn on" id="mkkjob" data-kind="job"></button>
          <button type="button" class="kbtn" id="mkkproject" data-kind="project"></button>
        </div></div>
      <label class="f"><span id="mkofferwhok"></span>
        <input id="mkofferwho" autocomplete="off" spellcheck="false"></label>
      <label class="f"><span id="mkoffergivek"></span>
        <textarea id="mkoffergive" rows="2"></textarea></label>
      <label class="f"><span id="mkoffermoneyk"></span>
        <input id="mkoffermoney" autocomplete="off"></label>
      <label class="f"><span id="mkofferwantk"></span>
        <textarea id="mkofferwant" rows="2"></textarea></label>
      <button class="sendbtn" type="button" id="mkoffergo"></button>
      <!-- WHAT COMES BACK IS ONE LINE, and it is the whole product of this
           form: an address to paste into WeChat. Tapping it copies it, which
           is the only thing anybody wants to do with it. -->
      <button class="made" type="button" id="mkofferout" hidden></button>
      <p class="why" id="mkoffernote" hidden></p>
    </div>

    <div class="myinv" id="myinv" hidden>
      <span class="lab" id="myinvlab"></span>
      <button class="codebtn" type="button" id="myinvcode"></button>
      <span class="alsocodes" id="myinvextra" hidden></span>
      <!-- The link beside the code, because the two only work together and
           somebody reading their own header should see both. -->
      <span class="url" id="myinvurl"></span>
      <span class="tap" id="myinvtap"></span>
      <button class="sendbtn" type="button" id="myinvsend"></button>
      <button class="feedbtn" type="button" id="myinvfeed"></button>
      <!-- THE OTHER HALF OF INVITING SOMEBODY. The code above lets one person
           through the door, which is right for the one you would vouch for by
           name and useless for the twenty you would happily tell. This is a
           link that can go anywhere: whoever follows it joins the queue, and
           the row says who sent them. Nobody gets in without somebody
           deciding, so it can be posted where a code never could. -->
      <!-- ONE MORE, for a member on an allowance. Hidden for everybody else,
           who have nothing to ask for: their single code is replaced the
           moment it is spent. -->
      <button class="morecode" type="button" id="myinvmore" hidden></button>
      <button class="sharebtn" type="button" id="myinvshare"></button>
      <!-- What is standing between them and a code. Inside the same box, in
           the same place the code would have been: the offer and the reason it
           is not being made are one thing, not two. -->
      <div class="need" id="myinvneed" hidden></div>
    </div>
    <!-- THE SEAT AND THE SHARE.
         Beside the invite box on purpose: bringing somebody in is far and away
         the biggest thing that moves this number, and a member reading what
         their seat is worth should be one thumb away from the thing that grows
         it. Its own request, and the whole block stays away when the board has
         no promise attached to it. -->
    <div class="stake" id="stake" hidden>
      <div class="stakehead">
        <span class="lab" id="stakelab"></span>
        <!-- WHAT IT IS, FOLDED. The two lines under this panel — when the
             counting stops, and that a point is not money — have to be here
             and are read once. Left open they are two paragraphs standing
             between somebody and the thing they came to look at, every time.
             Behind a mark they are one tap away for the one reading that
             wants them. -->
        <button class="info" type="button" id="stakeinfo"
                aria-controls="stakeabout" aria-expanded="false">i</button>
        <!-- How many are left, at the top where it is read first. It is the
             number that makes anybody act, and it was buried at the end of a
             paragraph nobody reaches. -->
        <b class="left" id="stakeleft" hidden></b>
      </div>
      <div class="about" id="stakeabout" hidden>
        <p class="when" id="stakewhen"></p>
        <p class="note" id="stakenote"></p>
      </div>
      <!-- The seat, and then the ring. The big percentage that used to stand
           here said exactly what the ring says four lines below it, which is
           the sort of duplication that makes a panel feel long without
           telling anybody anything twice as well. -->
      <span class="seat" id="stakeseat"></span>
      <!-- The share as a ring. A percentage is a fact and a ring is a
           quantity: it says at a glance whether this is most of the board or
           a sliver of it, which is the thing somebody actually wants to know
           and cannot get from four characters. aria-hidden because the same
           number is already read out above it. -->
      <div class="ring" id="stakering" hidden aria-hidden="true">
        <svg viewBox="0 0 120 120">
          <circle class="track" cx="60" cy="60" r="52"></circle>
          <circle class="fill" id="stakearc" cx="60" cy="60" r="52"></circle>
        </svg>
        <span class="mid"><b id="stakeringpct"></b><i id="stakeringlab"></i></span>
      </div>
      <ul class="parts" id="stakeparts"></ul>
      <p class="total" id="staketotal" hidden></p>
    </div>

    <!-- THE TWO PLACES PEOPLE TALK. They live here rather than in the bar,
         which already has four tabs and a button in it — and this tray is
         where everything addressed to you already is. Hidden until there is a
         profile: a private inbox is not the first thing to show somebody who
         has not put a name up yet. -->
    <div class="talkrow" id="talkrow" hidden>
      <a href="/notes" id="gonotes"><span></span><i class="badge" id="gonotesn" hidden></i></a>
      <a href="/groups" id="gogroups"><span></span></a>
      <!-- Only for somebody who already speaks for somebody. It is the tool
           for a small number of members and a puzzle for everybody else, so it
           appears when there is a roster and not before — see paintRun(). -->
      <a href="/run" id="gorun" hidden><span></span></a>
    </div>
    <!-- MATCHES FIRST. A match is the only thing in this tray that is about
         another person having chosen you back, and it is the only one with
         something to do at the other end of it. -->
    <div id="notifmatch">
      <div class="rule" id="matchrule" hidden><span id="matchlabel"></span><i></i></div>
      <div class="fols" id="matches" hidden></div>
    </div>
    <div id="notifday"></div>
    <div id="notiffol">
      <div class="rule" id="folrule" hidden><span id="follabel"></span><i></i>
        <b class="new" id="folnew" hidden></b>
      </div>
      <div class="fols" id="fols" hidden></div>
    </div>
    <p class="notifnone" id="notifnone" hidden></p>

    <!-- ASK THE PROFESSOR.
         Written answers, not a model. Two of the first three members asked a
         question that turned out to be a bad screen rather than a mystery, and
         a bot would have answered both of those while both stayed broken — a
         help panel is very good at hiding a design fault. It is also the one
         thing that would put members' questions, which have names in them, on
         somebody else's server, on a board whose whole claim is that almost
         nothing is kept and nothing leaves.
         So: the questions people actually ask, answered once, in both
         languages, and every answer that is about a screen opens that screen.
         When the list of things it cannot answer gets long, that list is the

  <div class="bnone" id="bnone" hidden></div>

  </div><!-- /vcards -->

  <p class="foot">
<span id="foottext"></span><span id="contact" hidden></span>
  </p>
</main>

     One line to one person by name; what comes out is a block to paste into
     WeChat, the same shape as the invite message, which is settled. -->
<!-- THE WRITE SHEET IS GONE. Writing to somebody who is not here is writing

         A card is a tall rectangle and a photograph is whatever shape the
         phone took it in, so one of them gets cropped. Centred is right for
         most and wrong for the commonest photograph there is — somebody
         standing, head near the top — which comes out as a picture of a chest.

    <div class="crop" id="crop" hidden>

    <div class="field"><input id="mename" maxlength="40"></div>

    <div class="looking">

    <div id="merooms" hidden>

      <div id="meroomsB"></div>

           They were hidden behind a second + so the form opened on four boxes
           rather than eleven, and so most people never met the word investor.
           That was right for a board for exchange students. It is wrong for a
           place whose whole proposition is finding the person on the other
           side of a business, and it failed the first test: somebody opened
           the form, saw a study partner and a language exchange, and reported

      <p class="roomgroup" id="megroup3"></p>
      <div id="meroomsC"></div>
      <p class="said roomfull" id="meroomfull" hidden></p>

    <p class="roomhead" id="melinkshead"></p>
