/* The tutor's one question: which of two unbuilt things would you use?
 *
 * Not a fake door. The card says plainly that neither exists and that pressing
 * only counts the answer — because a tap that pretends to lead somewhere and
 * does not is a thing you can do to a person once, and this board has about
 * forty people who have ever done anything on it.
 *
 * It also fires the analytics `use` event, so the answer lands in the same
 * day-by-day table every other feature is counted in rather than in a place
 * only this feature knows about.
 */
let WANTED = [];

/* ---- the Professor's offers, one card each ----------------------------------
 *
 * These used to be a single tall block: a heading, three things you can do, and
 * a vote on a fourth. Stacked in a fold that was already long, the last of them
 * was eight hundred pixels below the top of the section.
 *
 * In the strip each one is its own card, which is what somebody pushing
 * sideways is looking for. The group headings are gone with the column they
 * belonged to — a card that says NOT BUILT YET above itself carries that on its
 * own face instead.
 */
async function drawTutor() {
  OFFERS = [];
  if (!device) { drawRot(); return; }
  /* The "留 The Tutor" row and the "I am the Tutor" greeting that used to head
     this block are both gone. It now sits inside a section whose own heading
     says From the Professor, and a block that introduces itself twice under a
     different name reads as two people rather than one. */

  /* A thing that works, with a control that goes there. */
  /* The mark for a function, drawn rather than fetched.
   *
   * Two glyphs at 44px: the level test is 中 and A, which is the whole offer
   * said without words — test the one or the other. The type sort is four
   * pills with a divider in each, which is four axes each with two sides, and
   * is what the four letters ARE.
   *
   * Strokes in currentColor, so they take the accent and hold up on the dark
   * ground. An image would need a request, a second file and a @2x, and would
   * still be the wrong colour in one of the two themes. */
  const MARKS = {
    level: "M3 7.6h7.4v6.2H3z|M6.7 4.4v13|M14.4 17.4 18.4 6.2l4 11.2|M15.8 13.9h5.2",
    type: "M1.6 4.2h9.4v6.4H1.6z|M13 4.2h9.4v6.4H13z|M1.6 13.4h9.4v6.4H1.6z"
        + "|M13 13.4h9.4v6.4H13z|M6.3 5.8v3.2|M17.7 5.8v3.2|M6.3 15v3.2|M17.7 15v3.2",
  };
  const mark = (name) => {
    const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    svg.setAttribute("viewBox", "0 0 24 24");
    svg.setAttribute("aria-hidden", "true");
    for (const d of MARKS[name].split("|")) {
      const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
      path.setAttribute("d", d);
      // The two rounded shapes are rectangles drawn as paths, so one attribute
      // rounds every corner in the icon rather than each rect carrying its own.
      svg.append(path);
    }
    return svg;
  };

  /* 1 for something not done yet, 4 for a thing already behind them. See
     drawRot: an unfinished one is what the bar opens on. */
  const doable = (key, what, act, icon, done) => {
    const wrap = el("div", "opt built tcard");
    wrap.dataset.rank = done ? "4" : "1";
    const head = el("div", "opthead");
    // Node.append returns undefined, so this cannot be written as one chained
    // line — doing that threw before the card was built and took the whole
    // Tutor off the page.
    if (icon) {
      const box = el("span", "mark");
      box.append(mark(icon));
      head.append(box);
    }
    head.append(el("h4", null, T(key)));
    wrap.append(head, el("p", null, T(what)));
    const b = el("button", null, T("tut.go"));
    b.type = "button";
    b.addEventListener("click", act);
    wrap.append(b);
    return wrap;
  };

  /* A thing that does not exist, with a control that only counts the answer.
   * Visibly a different kind of row from the ones above it — same card, two
   * headings, so nobody has to work out which buttons lead somewhere. */
  const vote = (key, what, name) => {
    const wrap = el("div", "opt tcard");
    wrap.append(el("div", "optlab", T("tut.next")));
    wrap.append(el("h4", null, T(key)), el("p", null, T(what)));
    const b = el("button", "want", WANTED.includes(name) ? T("tut.onList") : T("tut.pick"));
    b.type = "button";
    if (WANTED.includes(name)) b.disabled = true;
    else b.addEventListener("click", async () => {
      b.disabled = true;
      b.textContent = T("tut.onList");
      WANTED.push(name);
      try { if (window.lx) window.lx("want-" + name); } catch { /* not fatal */ }
      try {
        await fetch("/api/want", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ device, want: name }),
        });
      } catch { /* the press still showed; the count is the only loss */ }
    });
    wrap.append(b);
    return wrap;
  };

  /* THE WAY BACK, ON THE FIRST SCREEN. Shown on exactly the same condition as
     "set up your page" below, and beside it rather than inside the rotation —
     see the note on the element. */
  const back = $("backline");
  if (back) {
    const nobody = !(ME && ME.handle);
    back.hidden = !nobody;
    if (nobody) {
      fill(back);
      back.append(document.createTextNode(T("tut.back")),
        el("b", null, T("tut.backGo")));
      if (!back.dataset.on) { back.dataset.on = "1"; back.addEventListener("click", openIn); }
    }
  }

  // Only offered while there is nothing there. Telling somebody with a filled
  // profile to fill their profile is the fastest way to stop being read.
  if (!(ME && ME.handle)) {
    OFFERS.push(doable("tut.setup", "tut.setupWhat", () => openMe()));
  }

  /* NOT IN BROWSE, AND NOBODY HAD TOLD HER.
   *
   * Somebody can make a page, put a photograph on a post, be read by everybody
   * on the feed — and not be in Browse at all, because "Show me in Browse" is
   * off. From the inside that is indistinguishable from the app losing her:
   * her face is on the board, and she is not in the list of people. The first
   * time it happened it was reported as a bug.
   *
   * It is not a bug, it is her switch, and the only thing missing was anybody
   * saying so. First card in the strip while it is true, because it is the one
   * thing on this screen with a consequence she cannot see. */
  if (ME && ME.handle && !ME.looking) {
    // Straight to the front: it is the one thing here with a consequence she
    // cannot see.
    OFFERS.unshift(doable("tut.hidden", "tut.hiddenWhat", () => openMe()));
  }
  // Find a study buddy is held back for V1: the deck at the top of this page is
  // the same people, and offering both is offering a choice between a thing and
  // itself. The route still works for anybody with the address.
  // Browse students is not one of the Tutor's offers. The deck is at the top
  // of this same page and there is a tab for it in the bar; a third way in,
  // whose button scrolls you up one screen, is the Tutor offering to take
  // somebody where they already are.

  /* The level test first, the four letters under it.
   *
   * Both are built and offered rather than voted on — the votes that asked for
   * the four letters stay in the file, and they are what said to build that one
   * first. The order here is not about which came first though: the block above
   * these opens with a level and the mark that comes from it, so the test that
   * produces them is the one to offer first. A page that leads with a number
   * and then offers a different test underneath is asking somebody to hunt for
   * the thing it just showed them. */
  const tookLevel = Boolean(learned("board:level"));
  const tookType = Boolean(learned("board:type"));
  /* MARKED AS TESTS, and that keeps them off the homepage. drawRot skips
     anything carrying this and drawTests draws it in the tray instead —
     under the report card, which is the thing both of them produce. */
  const lvl = doable("tut.level", "tut.levelGo",
    () => { location.href = "/level"; }, "level", tookLevel);
  const typ = doable("tut.type", "tut.typeGo",
    () => { location.href = "/type"; }, "type", tookType);
  lvl.dataset.test = "1";
  typ.dataset.test = "1";
  // See LEARNING at the top. Built either way, offered only when it is on —
  // drawTests reads OFFERS, so an empty push is the whole switch.
  if (LEARNING) OFFERS.push(lvl, typ);

  /* "Compare yourself with a friend" was here — an unbuilt thing with a
     button that only counted the press. It was honest about that, and it was
     still the largest block on the page, sitting between the waiting list and
     the posts, asking a member to vote on something instead of doing
     something. The votes it collected are in the file; the card is gone. */
  drawRot();
  drawTests();
}

/* The two tests, in the tray, under the thing they produce.
 *
 * They are the same blocks the rotating bar draws — built once in drawTutor
 * and moved, not copied, so there is one description of each test and one
 * place that decides whether it has been taken. */
function drawTests() {
  const box = $("proftests");
  if (!box) return;
  fill(box);
  const mine = OFFERS.filter((n) => n && n.dataset && n.dataset.test === "1");
  box.hidden = !mine.length;
  for (const n of mine) box.append(n);
}

/* ---- one slot, rotating -----------------------------------------------------
 *
 * WHAT WAS WRONG WITH EVERY OTHER SHAPE. A list inside the tile made the tile
 * long enough that people scrolled past it. A sideways strip put the
 * four-letter test off the edge of the screen, where it was reported missing.
 * Both were trying to show three things at once in a place with room for one.
 *
 * So: room for one, and it takes turns. Anything unfinished comes first —
 * a test somebody has not taken is the only one of these with something to
 * offer — and once everything is done it shows a different one each day,
 * seeded off the date so it is steady all day and different tomorrow.
 *
 * The arrow is there because a rotation nobody can hurry is a rotation that
 * looks broken to whoever wanted the other one.
 */
let OFFERS = [];
let ROTAT = -1;

function drawRot() {
  const bar = $("rotbar");
  fill(bar);
  /* The tests are not news. They live in the tray — see drawTests — and the
     bar carries what is left. */
  const live = OFFERS.filter((n) => n && !(n.dataset && n.dataset.test === "1"));
  if (!live.length) { bar.hidden = true; return; }
  bar.hidden = false;

  if (ROTAT < 0) {
    const undone = live.findIndex((n) => n.dataset.rank === "1");
    if (undone >= 0) ROTAT = undone;
    else {
      // Steady all day, different tomorrow. A bar that changes while somebody
      // is looking at it is a bar nobody trusts.
      const d = new Date();
      const seed = d.getFullYear() * 372 + d.getMonth() * 31 + d.getDate();
      ROTAT = seed % live.length;
    }
  }
  const at = ((ROTAT % live.length) + live.length) % live.length;
  bar.append(live[at]);

  if (live.length > 1) {
    const nav = el("div", "rotnav");
    const dots = el("div", "rotdots");
    for (let i = 0; i < live.length; i++) dots.append(el("i", i === at ? "on" : ""));
    const next = el("button", "rotnext", "›");
    next.type = "button";
    next.setAttribute("aria-label", T("tut.next"));
    next.addEventListener("click", () => { ROTAT = at + 1; drawRot(); });
    nav.append(dots, next);
    bar.append(nav);
  }
}


/* THE MEMBER'S OWN INVITE.
 *
 * One live code each, minted the first time this is asked for and the same one
 * until somebody spends it. Fetched once on load rather than on the tap: a
 * button that says "Invite someone" and then has to go and ask the server what
 * to say is a button people press twice.
 *
 * What gets copied is the whole message, not the code — the failure mode of a
 * bare six characters is somebody pasting them into a chat with no link and no
 * explanation, and the person on the other end having nowhere to put them.
 */
let MYCODE = "";
// Why there is no code today, and how many guests are already in. Both from
// /api/my-invite — see standing() on the server.
let MYNEED = [], MYGUESTS = 0;
/* "", "post" or "read" — what the door is doing, so the board can stop saying
   "anyone can read" on a day when that is not true. */
let MODE = "";
let MYCODES = [];
let MYLEFT = 0;

async function loadMyInvite() {
  if (!device) return;
  try {
    const [mine, who] = await Promise.all([
      fetch("/api/my-invite", { cache: "no-store",
        headers: { "x-board-device": device } }).then((r) => r.json()),
      fetch("/api/admitted", { cache: "no-store",
        headers: { "x-board-device": device } }).then((r) => r.json()),
    ]);
    MYCODE = (mine && mine.code) || "";
    /* EVERY LIVE CODE, not just the first. Most members have one; somebody on
       an allowance holds up to their number, and all of them have to be on
       screen or the second one is a code nobody can spend. */
    MYCODES = (mine && Array.isArray(mine.codes) && mine.codes.length)
      ? mine.codes : (MYCODE ? [MYCODE] : []);
    MYLEFT = Number((mine && mine.left) || 0);
    // Why there is no code, when there is none. Every unmet test, not the
    // first — see standing() on the server.
    MYNEED = (mine && Array.isArray(mine.need)) ? mine.need : [];
    MYGUESTS = Number((mine && mine.guests) || 0);
    MODE = (who && who.mode) || "";
  } catch { MYCODE = ""; MYCODES = []; MYLEFT = 0; MYNEED = []; }
  drawMyInvite();
  drawTodo();
  drawTalk();
  drawAsk();
  countNotes();
  draw();
}

/* THE QUESTIONS PEOPLE ACTUALLY ASK, in the order they ask them.
 *
 * The first two on this list are here because two of the first three members
 * asked them out loud. The rest are the ones this board's design makes
 * unavoidable: it has no accounts, no messages until a match, and a rule about
 * contact details that is unlike anything else people use.
 *
 * An answer that is about a screen carries a link to that screen. An answer
 * about a rule does not, because there is nowhere to send somebody who has
 * just been told how matching works.
 */
function drawAsk() {
  /* Inside the function, not beside it. The tray is drawn from a loader that
     sits above this in the file — a function declaration hoists and a const
     does not, so a list up there threw before the panel ever ran, and took
     the rest of the tray with it. */
  const ASKS = [
    ["linkedin", "/feed?edit=1"],
    ["edit",     "/feed?edit=1"],
    ["seen",     ""],
    ["match",    ""],
    ["talk",     ""],
    ["invite",   ""],
    ["wait",     ""],
    ["wechat",   ""],
    ["key",      ""],
    ["hide",     ""],
  ];
  const box = $("askprof");
  /* Only for members. Somebody with no page has one thing to do and the list
     above is already telling them what it is; ten answers about matching are
     ten answers to questions they have not reached. */
  if (!(ME && ME.handle)) { box.hidden = true; return; }
  box.hidden = false;
  $("asklabel").textContent = T("ask.head");
  const ul = $("asklist");
  fill(ul);
  /* THREE, AND THE REST BEHIND ONE TAP.
   *
   * Ten questions in a tray is not a help panel, it is a wall of text — and a
   * wall of text is read as a chore and closed, which costs the answers to the
   * three questions people actually arrive with. The other seven have not gone
   * anywhere; they are one tap down, for somebody looking for something
   * specific rather than somebody being shown everything at once.
   *
   * The first three are the ones asked out loud: where the LinkedIn goes, how
   * to change the page, and who can see it. */
  const SHOWN = 3;
  const row = ([key, go]) => {
    const li = el("li");
    const q = el("button", "q");
    q.type = "button";
    q.setAttribute("aria-expanded", "false");
    q.append(el("span", null, T("ask.q." + key)), el("b", null, "+"));
    const a = el("div", "a");
    a.hidden = true;
    a.append(el("span", null, T("ask.a." + key)));
    if (go) {
      const link = el("a", null, T("ask.go." + key));
      link.href = go;
      a.append(document.createElement("br"), link);
    }
    q.addEventListener("click", () => {
      const open = !a.hidden;
      a.hidden = open;
      li.className = open ? "" : "on";
      q.setAttribute("aria-expanded", String(!open));
    });
    li.append(q, a);
    return li;
  };

  for (const ask of ASKS.slice(0, SHOWN)) ul.append(row(ask));

  const rest = ASKS.slice(SHOWN);
  if (!rest.length) return;
  /* One way, no way back. Somebody who opened the rest was looking for
     something; closing it again under them is not a thing they asked for. */
  const more = el("li", "askmore");
  const b = el("button", "q");
  b.type = "button";
  b.append(el("span", null, T("ask.more", { n: rest.length })));
  b.addEventListener("click", () => {
    for (const ask of rest) ul.insertBefore(row(ask), more);
    more.remove();
  });
  more.append(b);
  ul.append(more);
}

function drawMyInvite() {
  const b = $("myinv");
  /* AND THE ＋ ITSELF, because it opens this and nothing else now. A button in
     the masthead that opens an empty sheet is the dead button again wearing a
     different coat — so it appears for somebody who has a code, or a reason
     they have not got one, and stays away from everybody else. */
  const fab = $("fab");
  if (fab) fab.hidden = !(MYCODE || MYNEED.length);
  /* THREE STATES, not two. A code; no code and a reason; nothing at all.
     The third is somebody who is not a member — there is nothing to say to
     them here and the box stays away. */
  if (!MYCODE && MYNEED.length) { drawNeed(b); return; }
  if (!MYCODE) { b.hidden = true; return; }
  b.hidden = false;
  for (const id of ["myinvcode", "myinvurl", "myinvtap", "myinvsend", "myinvfeed",
                    "myinvshare"]) {
    $(id).hidden = false;
  }
  // myinvmore and myinvextra decide for themselves below: both are about an
  // allowance most members do not have.
  $("myinvneed").hidden = true;
  $("myinvlab").textContent = T("inv.head");
  $("myinvcode").textContent = MYCODE;
  $("myinvcode").title = T("inv.codeTap");
  /* THE REST OF THEM, under the first. Drawn into the label slot rather than
     as more buttons: one code is the thing to send and the others are the
     ones still in hand, which is a different sentence. */
  const extra = MYCODES.slice(1);
  $("myinvextra").hidden = !extra.length;
  $("myinvextra").textContent = extra.length ? T("inv.also", { codes: extra.join("  ") }) : "";
  /* One more, for a member with an allowance left. Everybody else has nothing
     to ask for and does not see it. */
  $("myinvmore").hidden = MYLEFT < 1;
  $("myinvmore").textContent = T("inv.more", { n: MYLEFT });
  $("myinvurl").textContent = location.host + "/enter";
  $("myinvtap").textContent = T("inv.tap");
  $("myinvsend").textContent = T("inv.send");
  $("myinvfeed").textContent = T("inv.toFeed");
  /* Only once there is a page to credit. The link carries an id and the server
     checks it against the roll, so one sent before the profile exists would
     quietly credit nobody — better no button than a button doing half of what
     it says. */
  // Retired — see the note where its handler used to be.
  $("myinvshare").hidden = true;
}

/* THE SEAT AND THE SHARE.
 *
 * Its own request rather than a field on /api/me, because the whole feature is
 * optional: a board with no promise attached answers 404 and this block never
 * appears. Fetched once and held, so a language change redraws from what is
 * already here instead of asking again.
 *
 * The percentage is the headline and everything under it is the working —
 * somebody who wants to know why theirs is small can read the rows and see
 * exactly which line they have not done. */
let STAKE = null;

function loadStake() {
  fetch("/api/stake", { headers: device ? { "x-board-device": device } : {} })
    .then((r) => (r.ok ? r.json() : null))
    .then((d) => { STAKE = d; drawStake(); })
    .catch(() => { /* the tray works without it */ });
}

function drawStake() {
  // Off — see off.js.
  if (OFF.stake) { const b2 = $("stake"); if (b2) b2.hidden = true; return; }
  const box = $("stake");
  if (!box) return;
  /* Members only, and only where there is a ledger. Somebody with no page has
     one thing to do and Things to do is already telling them what it is. */
  if (!STAKE || !(ME && ME.handle)) { box.hidden = true; return; }
  box.hidden = false;
  $("stakelab").textContent = T("stake.head");

  /* PAST THE LAST SEAT. Nothing, said plainly — not a nought, which reads as a
     number that might move and never does. Everything else about the board is
     the same for them, and the line says so rather than leaving them to
     wonder what they missed. */
  const inCohort = STAKE.seat > 0 && STAKE.seat <= STAKE.seats;
  /* Outside the hundred there is no ring to draw, so the line under the
     heading carries the whole answer instead. */
  $("stakeseat").textContent = inCohort
    ? T("stake.seat", { n: STAKE.seat, seats: STAKE.seats })
    : T("stake.full");

  /* THE COUNTDOWN, at the top. Shown to somebody outside the hundred too:
     they can still tell whoever they were about to invite to hurry. */
  const left = $("stakeleft");
  left.hidden = Boolean(STAKE.shut) || !(STAKE.left > 0);
  left.textContent = STAKE.left === 1
    ? T("stake.last") : T("stake.left", { n: STAKE.left });

  /* THE RING. A percentage is a fact; a ring is a quantity, and the quantity
     is what somebody is actually asking — whether this is most of the board
     or a sliver of it. Drawn as a dash on a circle so one number sets it and
     there is no arithmetic to get wrong at either end. */
  const ring = $("stakering");
  ring.hidden = !inCohort;
  if (inCohort) {
    const round = 2 * Math.PI * 52;
    const share = Math.max(0, Math.min(100, Number(STAKE.share) || 0));
    $("stakearc").style.strokeDashoffset = String(round - (share / 100) * round);
    $("stakeringpct").textContent = share + "%";
    $("stakeringlab").textContent = T("stake.ring");
  }

  const ul = $("stakeparts");
  fill(ul);
  if (inCohort) {
    /* Biggest first: the rows are an argument for what to do next, and the
       one worth most should be the one read first. */
    for (const r of [...(STAKE.parts || [])].sort((a, b) => b.points - a.points)) {
      const li = el("li");
      /* One of a thing is not "1 weeks". The seat row has no count in it and
         so has no singular to pick. */
      const one = r.n === 1 && r.key !== "found";
      li.append(el("span", null, T("stake.p." + r.key + (one ? "1" : ""), { n: r.n })));
      li.append(el("b", null, "+" + r.points));
      ul.append(li);
    }
  }

  /* The points themselves, under the rows they add up to. A share is a
     comparison and a total is a thing you did; both are worth showing. */
  const total = $("staketotal");
  total.hidden = !inCohort;
  if (inCohort) {
    fill(total);
    total.append(document.createTextNode(T("stake.total")));
    total.append(el("b", null, String(STAKE.points)));
  }

  $("stakewhen").textContent = STAKE.shut
    ? T("stake.frozen", { date: STAKE.until })
    : inCohort ? T("stake.moves", { date: STAKE.until }) : T("stake.none");
  /* HOW MANY ARE LEFT, under the working, because it is the reason to move —
     and it is true for somebody outside the cohort too, who can still tell
     the person they were about to invite to hurry. */
  /* The seats left used to be appended to the paragraph above. It is the pill
     at the top now: the number that makes anybody act does not belong at the
     end of the sentence they stopped reading. */
  $("stakenote").textContent = inCohort ? T("stake.note") : "";
  /* The mark goes when there is nothing behind it: somebody outside the
     hundred has the whole answer on the face of the panel already. */
  $("stakeinfo").hidden = !inCohort;
}

/* One tap, and it stays open until it is tapped again — somebody who opened
   this wanted to read it, and closing it under them on a redraw is not a
   thing they asked for. Bound once, outside the drawing. */
$("stakeinfo").addEventListener("click", () => {
  const box = $("stakeabout");
  const open = !box.hidden;
  box.hidden = open;
  $("stakeinfo").setAttribute("aria-expanded", String(!open));
});

/* ---------------------------------------------------------------------------
 * THINGS TO DO
 *
 * One ordered list of everything a member has not done yet, of which THREE are
 * shown. Three because a list of nine reads as a chore and gets closed; the
 * other six are still there tomorrow, and arriving one at a time as the ones
 * above them are ticked is the only version of this anybody finishes.
 *
 * ORDER IS THE WHOLE DESIGN. Cheapest first, and within that, the ones with a
 * consequence they cannot see first of all — being out of Browse is invisible
 * from the inside, which is how somebody ends up thinking the app lost them.
 * Nothing here is a nag: every row is a thing that changes what the board can
 * do for them, and every row goes somewhere when tapped.
 *
 * WHAT IS NOT ON IT. Anything that is not theirs to do. "Be here three days"
 * is not a task, it is a wait; a guest of theirs who never posted is not their
 * work either. Those stay in the invite box, which is where the reasons a code
 * is missing belong.
 */
function todoList() {
  const has = (v) => Boolean(v && String(v).trim());

  /* FIVE THINGS, AND EVERY ONE OF THEM MAKES YOU FINDABLE.
   *
   * It was nine, and four of those had stopped meaning anything. "Take the
   * level test" and "read today's card" belong to the half of this app that is
   * switched off — and with it off they could never be finished, so they sat
   * at the top of a new member's list for ever. "Pick your rooms" is the
   * question the sentence replaced: rooms are derived from what somebody says
   * now, and nobody has picked one in months. "Post two things this week" is
   * the old board asking to be fed; what this place does is match people, and
   * a member who has written their sentence and put a face to it has done the
   * thing that makes that possible.
   *
   * What is left is the shortest path to being matched, in the order it costs
   * anything. Somebody who finishes it is in Browse, says what they want, and
   * can be recognised — and the list then disappears, which is the point. */
  const all = [
    ["name", !(ME && ME.handle), () => openMe()],
    ["photo", !(ME && ME.photo), () => $("mephoto").click()],
    // The sentence. The one thing the matching actually reads.
    ["say", Boolean(ME && ME.handle) && !(ME && Array.isArray(ME.say) && ME.say.length),
      () => { showView("browse"); $("saysay").scrollIntoView({ behavior: "smooth" }); }],
    ["goal", Boolean(ME && ME.handle) && !has(ME && ME.goal), () => openMe()],
    /* THE WAY BACK, ASKED ONCE AND THEN NEVER AGAIN. It is the only row here
       that is not about being found: everything else makes somebody easier to
       match, and this one stops them losing all of it on a new phone. Last,
       because nothing is worth keeping until there is something to keep. */
    ["mail", Boolean(ME && ME.handle) && !has(ME && ME.mail), () => openBack()],
    ["browse", Boolean(ME && ME.handle) && !(ME && ME.looking), () => openMe()],
  ];
  return all.filter((r) => r[1]).map((r) => ({ key: r[0], go: r[2] }));
}

function drawTodo() {
  const box = $("todo");
  const list = todoList();
  // Nothing left is not an empty card. It is no card.
  box.hidden = !list.length;
  if (!list.length) return;
  $("todolab").textContent = T("todo.head");
  const ul = $("todolist");
  fill(ul);
  for (const t of list.slice(0, 3)) {
    const li = el("li");
    const b = el("button");
    b.type = "button";
    b.append(el("i"), el("span", null, T("todo." + t.key)), el("b", null, "\u203a"));
    b.addEventListener("click", t.go);
    li.append(b);
    ul.append(li);
  }
  /* HOW MANY ARE BEHIND THE THREE. Said only when there are some, and said as
     a number rather than a list — the point of showing three is that the rest
     are not on the screen. */
  const rest = list.length - 3;
  $("todoleft").textContent = rest > 0 ? T("todo.more", { n: rest }) : "";
  $("todoleft").hidden = rest <= 0;
}

/** No code, and why. Same box, same place — see the note in the markup.
 *
 *  WHY IT SAYS ALL OF IT. Standing is four small ordinary things, and a member
 *  who is told one of them at a time comes back four times to be turned away
 *  four times. Told all of them at once it reads as what it is: a short list of
 *  what a member does here, which is also the answer to what this place is. */
function drawNeed(b) {
  b.hidden = false;
  for (const id of ["myinvcode", "myinvurl", "myinvtap", "myinvsend", "myinvfeed",
                    "myinvmore", "myinvextra"]) {
    $(id).hidden = true;
  }
  /* THE LINK IS NOT THE CODE, AND ONLY ONE OF THEM NEEDS STANDING.
   *
   * They were gated together, so a new member had nothing at all to send
   * anybody until they had been here a day and posted twice. That is right
   * for the code and wrong for the link, and the difference is what each one
   * does: a code walks one person THROUGH THE DOOR on this member's word. A
   * link puts whoever follows it in the QUEUE, where somebody still has to
   * decide. Nobody gets in off a link.
   *
   * So the link is every member's from the first day — it is how a member who
   * knows fifty useful people is any use to this board at all — and the code
   * stays behind standing, which is the thing worth earning.
   *
   * Still only once there is a page to credit: the link carries an id the
   * server checks against the roll, and one sent before the profile exists
   * would quietly credit nobody. */
  // Retired — see the note where its handler used to be.
  $("myinvshare").hidden = true;
  $("myinvlab").textContent = T("inv.needHead");
  const box = $("myinvneed");
  box.hidden = false;
  fill(box);
  box.append(el("p", null, T(ME && ME.id && ME.handle ? "inv.needWhyLink" : "inv.needWhy")));
  const ul = el("ul");
  /* WHAT THE LIST ABOVE IS ALREADY SAYING. "Be in Browse" and "post 2 things
     this week" are both rows in Things to do, and a member reading the same
     instruction twice in one tray stops reading the tray. Only the reasons
     that are NOT theirs to do are left here — a wait, and a guest of theirs
     who never posted. */
  const said = new Set(todoList().map((t) => t.key));
  const show = MYNEED.filter((k) =>
    !(k === "face" && (said.has("photo") || said.has("browse") || said.has("name")))
    && !(k === "said" && said.has("week")));
  for (const k of show.length ? show : MYNEED) {
    const li = el("li");
    li.append(el("i"));
    li.append(el("span", null, k === "room"
      ? T("inv.needRoom", { n: MYGUESTS }) : T("inv.need" + k[0].toUpperCase() + k.slice(1))));
    ul.append(li);
  }
  box.append(ul);
}

/* THE TRAY, AND THE COUNT ON THE BELL.
 *
 * Two things arrive here: people who followed you, and the card of the day
 * when it is living here rather than in the feed. The count is how many of
 * those are unattended — an unanswered card is one, each new follower is one —
 * because a bell with a number on it that does not go down is a bell people
 * stop looking at.
 */
function drawTray() {
  const box = $("notif");
  const none = $("notifnone");
  const hasDay = Boolean($("notifday").firstChild);
  const hasFol = !$("folrule").hidden;
  const hasMatch = !$("matchrule").hidden;
  none.hidden = hasDay || hasFol || hasMatch;
  none.textContent = T("notif.none");

  /* WHAT THE NUMBER MEANS: things still waiting, not things unread.
   *
   * A follower stops counting once the tray has been opened — that is reading
   * it. The card of the day keeps counting until it is answered, because it is
   * not a message, it is a thing to do, and a bell that went quiet while the
   * card sat there unanswered would be lying about the one item it is best
   * placed to remind somebody about. */
  const fresh = TRAYSEEN ? 0 : FOLLOWERS.filter((f) => FRESH.has(f.id)).length;
  const waiting = (hasDay && !dailyDone() ? 1 : 0) + fresh;
  const b = $("belln");
  b.textContent = waiting > 9 ? "9+" : String(waiting);
  b.setAttribute("aria-label", String(waiting));
  b.hidden = !waiting;
  $("bell").classList.toggle("lit", Boolean(waiting));
  // The tray stays where the reader left it; the bell only says what is in it.
  if (!box.hidden) $("bell").setAttribute("aria-expanded", "true");
}

let TRAYSEEN = false;

$("profhead").addEventListener("click", () => {

    else localStorage.setItem(PROFSHUT, dayStamp());

$("bell").addEventListener("click", () => {
  const box = $("notif");
  box.hidden = !box.hidden;
  $("bell").setAttribute("aria-expanded", String(!box.hidden));
  /* Opening it is reading it — but only for the count. The dots stay on the
     rows so somebody can still see which of them are the new ones while they
     are looking at the list. */
  if (!box.hidden) { TRAYSEEN = true; drawTray(); }
});

/* THE REPORT CARD: one fold over the card of the day and the two tests.
 *
 * WHY A SUMMARY AND NOT JUST A TITLE. Collapsed, this is the only thing three
 * blocks have left on the screen, so it has to say whether there is anything
 * to do inside it. A heading that reads the same whether today's card is
 * waiting or done is a heading nobody opens twice.
 *
 * WHEN IT STARTS OPEN. When there is something to do — nothing taken yet, or
 * today's card unanswered — and closed once both are behind them. That keeps
 * the daily habit in front of somebody without keeping the whole block in
 * front of everybody for ever. Shutting it by hand sticks for the day: the
 * point of a fold nobody can keep shut is lost on the person who wanted it
 * shut.
 */
const PROFSHUT = "board:profshut";
let PROFOPEN = null;   // null until decided once, then whatever it is
const dayStamp = () => {
  const d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0")
    + "-" + String(d.getDate()).padStart(2, "0");
};
const readLocal = (k) => {
  try { return JSON.parse(localStorage.getItem(k) || "null"); } catch { return null; }
};

/* ---- the grade ---------------------------------------------------------------
 *
 * A letter a day, from three places: what you practised, what you did here, and
 * what came back to you. It is the headline of the report card because it is
 * the one line somebody can compare with yesterday without reading anything.
 *
 * THE RULE THAT MAKES POPULARITY SAFE TO INCLUDE: points are only ever EARNED.
 * Nothing subtracts. A quiet day cannot pull a grade down — it can only fail to
 * push it up — and the TARGET moves with what the board actually offered, so on
 * a day when nobody posted there was nothing to react to, the bar drops, and
 * answering your own card is an A. Graded against other people's mood, this
 * would hand somebody a C for a day the board was asleep, which is the fastest
 * way to make a person stop opening it.
 *
 * AND THERE IS NO GRADE FOR ABSENCE. If the points you control come to nothing
 * — no card, no post, no reply — the day has no grade at all, whatever anybody
 * else did. A letter is a judgement on a day somebody spent; a day they did not
 * spend here is not a failing day, it is not a day. F exists and is reachable,
 * but only by turning up and getting almost nothing, never by staying away.
 *
 * IT IS PRIVATE AND IT IS NEVER RANKED. Yours, on your own card, against your
 * own yesterday. A visible grade on a board of twenty-five is a popularity
 * table with a letter on it, and that is a different product.
 *
 * THE BREAKDOWN IS NOT OPTIONAL. Every row below is a real event with a real
 * number beside it, and one tap shows all of them. A grade nobody can take
 * apart is a grade nobody believes past the first week.
 */
const GRADEKEY = "board:grades";

/** Local day, the same shape the rest of the app uses. */
const dayOf = (d) => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0")
  + "-" + String(d.getDate()).padStart(2, "0");

function gradeToday() {
  const today = dayOf(new Date());
  /* EVERY ROW KNOWS WHOSE IT IS. Not for the arithmetic — a point is a point —
     but for the ORDER they are read in, which is the whole difference between
     a card that says you are wanted and a card that says you are trying hard.
     "4 people opened your page" first; "answered your card, followed somebody"
     second. Same points, same letter, and only one of those two readings makes
     somebody close the app. */
  const rows = [];
  const add = (key, n, arg, mine) => { if (n > 0) rows.push({ key, n, arg, mine: Boolean(mine) }); };

  /* ---- what you practised. Entirely yours, and it is most of the grade. */
  const deck = readLocal("board:daily") || {};
  const answered = deck.done === today;
  if (answered) {
    add("grade.card", 3, null, true);
    // "Knew it" without asking to be shown: the deck only moves up on a run of
    // them, so this is the one it is worth paying for.
    if ((deck.run || 0) > 0) add("grade.knew", 2, null, true);
    add("grade.streak", Math.min(3, deck.run || 0), { n: deck.run || 0 }, true);
    if (deck.moved === "up") add("grade.levelUp", 4, null, true);
  }

  /* ---- what you did here. Also yours. */
  const mine = ME && ME.handle ? ME.handle.toLowerCase() : "";
  const todayPost = (p) => String(p.at || "").slice(0, 10) === today;
  const myPosts = posts.filter((p) => (p.handle || "").toLowerCase() === mine && mine);
  add("grade.posted", 3 * myPosts.filter((p) => store_isOwn(p) && todayPost(p)).length, null, true);
  add("grade.replied", 2 * myPosts.filter((p) => p.re && todayPost(p)).length, null, true);
  let followedToday = "";
  try { followedToday = localStorage.getItem("board:didfollow") || ""; } catch { /* fine */ }
  if (followedToday === today) add("grade.followed", 1, null, true);

  /* The half of the grade you control. Read off the flags rather than off the
     position in the list, so the rows can be re-ordered for reading without
     quietly changing what counts as showing up. */
  const own = rows.filter((r) => r.mine).reduce((a, r) => a + r.n, 0);

  /* ---- what came back. Capped, so a busy day for your page cannot become the
     whole grade, and never negative on a day nobody looked. */
  const seen = Number(((ME && ME.views) || {})[today] || 0);
  add("grade.opened", Math.min(4, seen), { n: seen });
  const newFollowers = FOLLOWERS.filter((f) => String(f.at || "").slice(0, 10) === today).length;
  add("grade.gotFollowed", 3 * newFollowers, { n: newFollowers });
  const myIds = new Set(myPosts.filter(store_isOwn).map((p) => p.id));
  const gotReplies = posts.filter((p) => p.re && myIds.has(p.re) && todayPost(p)
    && (p.handle || "").toLowerCase() !== mine).length;
  add("grade.gotReply", 3 * gotReplies, { n: gotReplies });

  /* A match has no date on it, so "new" is the first time this browser has seen
     it — the same way a new follower is worked out. Kept per match rather than
     as a count, so an old match cannot be paid for twice. */
  let sawMatches = [];
  try { sawMatches = JSON.parse(localStorage.getItem("board:sawmatches") || "[]"); } catch { /* fine */ }
  const fresh = MATCHES.filter((m) => !sawMatches.includes(m.id));
  add("grade.match", 5 * fresh.length, { n: fresh.length });
  if (fresh.length) {
    try {
      localStorage.setItem("board:sawmatches",
        JSON.stringify([...sawMatches, ...fresh.map((m) => m.id)].slice(-50)));
    } catch { /* fine */ }
  }

  const pts = rows.reduce((a, r) => a + r.n, 0);

  /* THE TARGET MOVES WITH THE BOARD. Eight on a day nobody posted — a card and
     a streak clears it — rising by one for each post somebody else made, to
     fourteen. On a busy board you are expected to have joined in. */
  const others = posts.filter((p) => store_isOwn(p) && todayPost(p)
    && (p.handle || "").toLowerCase() !== mine).length;
  const target = Math.min(14, 8 + others);

  const letter = !own ? "" : gradeLetter(pts / target);
  return { letter, pts, target, rows, own, today };
}

/** Where the bands sit. A+ is hitting the target, not exceeding it: the target
 *  already moved to meet the day, and a grade nobody can reach is a grade
 *  nobody plays for. */
function gradeLetter(r) {
  if (r >= 1) return "A+";
  if (r >= 0.85) return "A";
  if (r >= 0.7) return "B";
  if (r >= 0.55) return "C";
  if (r >= 0.35) return "D";
  return "F";
}

/** Today's, written down so tomorrow has a yesterday. Fourteen days kept: the
 *  strip shows a week and the comparison needs one more than it shows. */
function saveGrade(g) {
  if (!g.letter) return;
  let all = readLocal(GRADEKEY) || {};
  if (typeof all !== "object" || Array.isArray(all)) all = {};
  all[g.today] = g.letter;
  const keys = Object.keys(all).sort().slice(-14);
  const out = {};
  for (const k of keys) out[k] = all[k];
  try { localStorage.setItem(GRADEKEY, JSON.stringify(out)); } catch { /* fine */ }
}

/** The letters of the last seven days, oldest first, "" for a day with none. */
function gradeWeek() {
  const all = readLocal(GRADEKEY) || {};
  const out = [];
  for (let i = 6; i >= 0; i--) {
    const d = new Date();
    d.setDate(d.getDate() - i);
    out.push({ day: dayOf(d), letter: all[dayOf(d)] || "" });
  }
  return out;
}

let GRADEOPEN = false;

let GRADE = null;

function drawGrade(box) {
  const g = gradeToday();
  GRADE = g;
  saveGrade(g);
  const all = readLocal(GRADEKEY) || {};
  const y = new Date();
  y.setDate(y.getDate() - 1);
  const yest = all[dayOf(y)] || "";

  const wrap = el("div", "grade");
  const top = el("div", "gtop");
  const big = el("b", "gbig" + (g.letter ? "" : " none"), g.letter || "—");
  top.append(big);

  const side = el("div", "gside");
  if (g.letter) {
    side.append(el("p", "gof", T("grade.of", { n: g.pts })));
    if (yest) side.append(el("p", "gyest", T("grade.yesterday", { g: yest })));
  } else {
    side.append(el("p", "gof", T("grade.none")));
    side.append(el("p", "gyest", T("grade.noneWhy")));
  }
  top.append(side);

  /* The arithmetic, one tap away. A question mark rather than an icon: at this
     size an icon is a smudge somebody has to guess at. */
  if (g.letter) {
    const ask = el("button", "gask", "?");
    ask.type = "button";
    ask.setAttribute("aria-expanded", String(GRADEOPEN));
    ask.setAttribute("aria-label", T("grade.why"));
    ask.addEventListener("click", () => { GRADEOPEN = !GRADEOPEN; drawNews(); });
    top.append(ask);
  }
  wrap.append(top);

  if (g.letter && GRADEOPEN) {
    const why = el("div", "gwhy");
    why.append(el("p", "gwhyhead", T("grade.why")));
    // What came back first, what you did second. See the note in gradeToday.
    for (const r of [...g.rows.filter((r) => !r.mine), ...g.rows.filter((r) => r.mine)]) {
      const line = el("div", "growrow");
      line.append(el("span", null, T(r.key, r.arg || {})));
      line.append(el("b", null, "+" + r.n));
      why.append(line);
    }
    const tot = el("div", "growrow tot");
    tot.append(el("span", null, T("grade.target")));
    tot.append(el("b", null, String(g.target)));
    why.append(tot);
    wrap.append(why);
  }

  /* The week, as seven letters. The shape of a run is the thing worth seeing
     and it takes one line to show. */
  const week = gradeWeek();
  if (week.some((d) => d.letter)) {
    const strip = el("div", "gweek");
    const now = dayOf(new Date());
    for (const d of week) {
      // Today filled rather than outlined: seven identical cells is a row
      // somebody has to count along to find themselves in.
      const i = el("i", (d.letter ? "" : "off") + (d.day === now ? " now" : ""));
      i.textContent = d.letter || "·";
      strip.append(i);
    }
    wrap.append(strip);
  }
  box.append(wrap);
}

/* ---- the report card as a panel about what happened -------------------------
 *
 * WHY IT CHANGED. A card that said "you are level 4" said the same thing every
 * day, and a thing that says the same thing every day is a thing nobody opens
 * twice. This says what has happened since somebody was last here, which is
 * the only kind of line that is worth coming back for.
 *
 * TWO RULES, AND THEY MATTER MORE THAN THE LAYOUT:
 *
 *  1. A ROW THAT WOULD READ ZERO IS NOT DRAWN. On a board this size most of
 *     them are zero most days, and a panel listing "0 followers, 0 replies,
 *     0 likes" is a panel telling somebody in numbers that nothing is
 *     happening here. It gets SHORTER on a quiet day, and the space says
 *     something useful instead.
 *
 *  2. NO LINE IS EVER MORE SPECIFIC THAN THE CROWD IT HIDES IN. "Somebody
 *     keeps coming back to your page" with two regulars on a board of eleven
 *     is a name with a thin coat of paint — the reader can open Browse and
 *     work it out. Under REGULARS_FLOOR the line is not drawn at all and the
 *     plain count stands in, which describes nobody.
 *
 * The level and the card of the day are still here. They are one line at the
 * bottom instead of the headline, which is their right size.
 */
const LASTOPEN = "board:lastopen";
const REGULARS_FLOOR = 3;

/* Six hours. Advancing the mark on every load would empty the panel on a
 * refresh thirty seconds later, which reads as a bug; advancing it never would
 * make "since" meaningless by Thursday. Six hours keeps one day's news in
 * place for the day and turns it over by morning. */
const HOLD_HOURS = 6;

let SINCE = "";       // the mark this draw is reporting against
function sinceMark() {
  if (SINCE) return SINCE;
  let was = "";
  try { was = localStorage.getItem(LASTOPEN) || ""; } catch { /* fine */ }
  const now = new Date();
  const old = was && (now - new Date(was)) > HOLD_HOURS * 3600 * 1000;
  if (!was || old) {
    try { localStorage.setItem(LASTOPEN, now.toISOString()); } catch { /* fine */ }
  }
  SINCE = was;
  return SINCE;
}

/** "Since Tuesday" while that still means something, then a date. */
function sinceWords(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  if (isNaN(d)) return "";
  const days = Math.floor((Date.now() - d) / 86400000);
  if (days <= 0) return T("prof.sinceToday");
  if (days === 1) return T("prof.sinceYesterday");
  if (days < 7) {
    return T("prof.since", {
      day: new Intl.DateTimeFormat(lang() === "zh" ? "zh-CN" : "en-GB",
        { weekday: "long" }).format(d),
    });
  }
  return T("prof.sinceLong");
}

/* The admin panel's sparkline, unchanged in shape and in what it refuses to
 * draw: nothing under three days, and nothing on an all-zero series. A flat
 * line along the floor is indistinguishable from a rendering fault. */
function sparkline(series) {
  if (!series || series.length < 3) return null;
  const hi = Math.max(...series);
  if (!hi) return null;
  const NS = "http://www.w3.org/2000/svg";
  const w = 62, h = 22, pad = 2, n = series.length;
  const x = (i) => pad + (i / (n - 1)) * (w - pad * 2);
  const y = (v) => h - pad - (v / hi) * (h - pad * 2);
  const pts = series.map((v, i) => x(i).toFixed(1) + "," + y(v).toFixed(1)).join(" L");
  const svg = document.createElementNS(NS, "svg");
  svg.setAttribute("class", "spark");
  svg.setAttribute("viewBox", "0 0 " + w + " " + h);
  svg.setAttribute("preserveAspectRatio", "none");
  svg.setAttribute("role", "img");
  svg.setAttribute("aria-label", T("prof.sparkAlt", { n, a: series[0], b: series[n - 1] }));
  const mk = (t, a) => { const e = document.createElementNS(NS, t);
    for (const k in a) e.setAttribute(k, a[k]); return e; };
  svg.append(mk("path", { class: "ar", d: "M" + pad + "," + (h - pad) + " L" + pts + " L" + (w - pad) + "," + (h - pad) + " Z" }));
  svg.append(mk("path", { class: "ln", d: "M" + pts }));
  svg.append(mk("circle", { class: "dot", cx: x(n - 1), cy: y(series[n - 1]), r: 1.9 }));
  return svg;
}

/** The last `n` days of a date-keyed count, zeros included. */
function lastDays(views, n) {
  const out = [];
  for (let i = n - 1; i >= 0; i--) {
    const d = new Date();
    d.setDate(d.getDate() - i);
    const k = d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0")
      + "-" + String(d.getDate()).padStart(2, "0");
    out.push(Number((views || {})[k] || 0));
  }
  return out;
}

/** Monday-based week key, matching the server's bucket. */
function weekNow(back) {
  const d = new Date();
  if (back) d.setDate(d.getDate() - back * 7);
  const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  const day = t.getUTCDay() || 7;
  t.setUTCDate(t.getUTCDate() + 4 - day);
  const jan1 = new Date(Date.UTC(t.getUTCFullYear(), 0, 1));
  const n = Math.ceil(((t - jan1) / 86400000 + 1) / 7);
  return t.getUTCFullYear() + "-W" + String(n).padStart(2, "0");
}

/** Everything the panel could say, worked out once. Nothing here is a string —
 *  the drawing decides what is worth saying and in which language. */
function newsSince() {
  const mark = sinceMark();
  const mine = ME && ME.handle ? ME.handle.toLowerCase() : "";
  const after = (p) => mark && (p.at || "") > mark;
  const live = posts.filter((p) => p.state !== "removed");

  const myIds = new Set(live.filter((p) => (p.handle || "").toLowerCase() === mine
    && mine && store_isOwn(p)).map((p) => p.id));
  const replies = live.filter((p) => p.re && myIds.has(p.re) && after(p)
    && (p.handle || "").toLowerCase() !== mine);

  const views = lastDays(ME && ME.views, 7);
  const seen = views.reduce((a, b) => a + b, 0);
  const before = lastDays(ME && ME.views, 14).slice(0, 7).reduce((a, b) => a + b, 0);

  return {
    mark,
    posts: live.filter((p) => store_isOwn(p) && after(p)
      && (p.handle || "").toLowerCase() !== mine).length,
    joined: PEOPLE.filter((q) => !q.mine && after(q)).map((q) => q.handle).filter(Boolean),
    followers: FOLLOWERS.filter((f) => after(f)).length,
    replies,
    matches: MATCHES,
    views, seen, before,
    regulars: Number(((ME && ME.regs) || {})[weekNow(0)] || 0),
    people: PEOPLE.length,
  };
}

/** THE TITLE, AND THE ONE THING THAT WOULD MOVE IT.
 *
 *  Not a number and not a position: five words, each describing something
 *  that happened. See rankOf in server.js for what earns each one.
 *
 *  The next rung is written as the thing to do rather than the score to hit —
 *  "somebody answering you" is an instruction, "1 more reply" is a target, and
 *  a target on a board this small is a thing people play at instead of use. */
const RANKORDER = ["guest", "contact", "regular", "connector", "principal"];
const RANKNEXT = { guest: "toContact", contact: "toRegular",
  regular: "toConnector", connector: "toPrincipal" };

function drawRank(box) {
  const key = RANK && RANKORDER.includes(RANK) ? RANK : "";
  if (!key) return;
  const wrap = el("div", "rank");
  wrap.append(el("span", "rankcap", T("rank.head")));
  wrap.append(el("b", null, T("rank." + key)));
  wrap.append(el("p", null, T("rank." + key + "Why")));
  const next = RANKNEXT[key];
  wrap.append(el("p", "ranknext", next
    ? T("rank.next", { what: T("rank." + next) }) : T("rank.top")));
  box.append(wrap);
}

/** A post somebody made, rather than a reply, a like or a report. */
const store_isOwn = (p) => !p.re && !p.like && !p.report;

function drawNews() {
  const box = $("profnews");
  fill(box);
  if (!ME || !ME.handle) return false;
  const n = newsSince();

  /* THE RANK AND THE LETTER, BEHIND THE SAME SWITCH AS THE REST OF IT.
   *
   * "Where you stand · Extra · Nobody has answered you yet" and "A+ · 11
   * points today" were the first two things in the one place a member goes to
   * find out what happened — a title, a mark out of the day, and a row of
   * letters, on a board of agents and producers. It is the study app's
   * scoring, and it came in on the back of real news: somebody gets a match
   * and is handed a report card with it.
   *
   * They are good things and they are for a different product. One flag, so
   * the day this board wants a grade again it comes back whole. */
  if (LEARNING) {
    drawRank(box);
    drawGrade(box);
  }

  /* THE WONDERING, and the floor under it. Drawn only when there are enough
     regulars for the sentence to describe a crowd rather than a person. */
  if (n.regulars >= REGULARS_FLOOR) {
    const w = el("div", "wonder");
    w.append(el("p", "wbig", T("prof.regulars", { n: n.regulars })));
    const faces = el("div", "wfaces");
    for (let i = 0; i < Math.min(4, n.regulars); i++) faces.append(el("i", null, "?"));
    faces.append(el("span", null, T("prof.noName")));
    w.append(faces);
    box.append(w);
  }

  // The headline number, with the squiggle. Only once there is a week of it:
  // "1 person opened your page" as a headline is not a headline.
  if (n.seen >= 3) {
    const big = el("div", "big");
    big.append(el("span", "bignum", String(n.seen)));
    const sp = sparkline(n.views);
    if (sp) big.append(sp);
    const lab = el("span", "biglab", T("prof.opened"));
    lab.append(el("small", null, n.before
      ? T("prof.vsLast", { n: n.before }) : T("prof.sevenDays")));
    big.append(lab);
    box.append(big);
  }

  /* The rows, most personal first. Anything that would read zero is simply
     absent — see the note at the top of this block. */
  const rows = el("div", "newsrows");
  const row = (text, quiet) => {
    const r = el("div", "newsrow");
    r.append(el("i", "nd" + (quiet ? " q" : "")));
    r.append(el("span", null, text));
    rows.append(r);
  };
  for (const p of n.replies.slice(0, 3)) {
    row(T("prof.replied", { who: p.handle || T("board.someone") }));
  }
  for (const m of n.matches.slice(0, 2)) row(matchLine(m));
  /* "1 people followed you" — one string doing two numbers, in the one place
     a member goes to find out what happened. And the word is followed, not
     connected: Connect is now the press on the Cards shelf that hands over
     contact details, and this counts the smaller thing. */
  if (n.followers) {
    row(T(n.followers === 1 ? "prof.connected1" : "prof.connected",
      { n: n.followers }));
  }
  if (n.joined.length) {
    row(n.joined.length === 1 ? T("prof.joined1", { who: n.joined[0] })
      : T("prof.joined", { n: n.joined.length }), true);
  }
  if (n.posts) row(T("prof.posts", { n: n.posts }), true);
  if (rows.firstChild) box.append(rows);

  /* A QUIET DAY IS NOT AN EMPTY PANEL. Nothing to report is a true thing worth
     saying, and it is the one moment where asking somebody to post is fair —
     they can see for themselves that nobody else has. */
  if (!rows.firstChild && n.mark) {
    box.append(el("p", "newsquiet", n.people > 1
      ? T("prof.quiet", { n: n.people }) : T("prof.quietAlone")));
  }
  return Boolean(box.firstChild);
}

function drawProf() {
  const box = $("prof");
  const body = $("profbody");
  const head = $("profhead");
  /* WHAT MAKES THE TILE WORTH DRAWING. It used to be "the Tutor has something
     to say, or there is a card" — and the Tutor's offers have moved out to the
     rotating bar, so that test went false and took the whole tile with it,
     news and level and all. It is the tile's OWN contents that decide now. */
  const hasCard = Boolean($("daily").firstChild);

  const lvl = learned("board:level");
  const typ = learned("board:type");
  const done = dailyDone();

  /* THE NEWS, AND WHAT IT DEMOTES. Drawn first because it is the reason to
     open this at all. When there is something in it the big medallion stands
     down to one line — two headlines in one fold is no headline — and when
     there is not, the level takes its old place, which is what somebody in
     their first week sees. */
  GRADE = null;
  const hasNews = drawNews();
  if (!hasNews && !hasCard && !learned("board:level") && !learned("board:type")) {
    box.hidden = true;
    return;
  }
  box.hidden = false;

  /* WITH THE LEARNING HALF OFF, THIS FOLD IS ONLY THE NEWS.
   *
   * Everything else in it is the study app's scoring — a letter grade, points
   * today, a ladder of ranks, and a language test somebody is invited to take.
   * On a board of agents, producers and investors that is somebody else's
   * homework stapled to the one place a member looks to find out what
   * happened, and it arrives BECAUSE there is news: a match brings the whole
   * report card in with it.
   *
   * The news is the half worth having and it stays. The rest goes behind the
   * same switch as the language half — one flag, so the day this board wants
   * a level again, it comes back whole rather than in pieces. */
  if (!LEARNING) {
    if (head) head.hidden = true;
    for (const id of ["profnow", "daily", "proftests", "profgrade"]) {
      if ($(id)) { fill($(id)); $(id).hidden = true; }
    }
    const b = $("profbody");
    if (b) b.hidden = false;
    $("profnews").hidden = !hasNews;
    box.hidden = !hasNews;
    return;
  }
  // An empty card holds a slot in the strip and swipes to nothing.
  $("profnews").hidden = !hasNews;
  /* The letter in the header, from the same object the card drew — see GRADE.
     Absent rather than "—" when there is no grade: a dash beside the mark reads
     as something broken, and the card inside says what is missing and why. */
  const gh = $("profgrade");
  gh.textContent = (GRADE && GRADE.letter) || "";
  gh.hidden = !(GRADE && GRADE.letter);


  /* WHERE YOU ARE NOW, large, as the first thing inside the fold.
   *
   * A report card that makes somebody read a summary line to find their own
   * level is burying the one number it is named after. Same shape as the
   * result screen it came from — mark, band, level, ten stops — so opening
   * this and finishing the test show the same object twice.
   */
  const now = $("profnow");
  fill(now);
  now.hidden = false;
  const P = (pair) => (Array.isArray(pair) ? pair[lang() === "zh" ? 1 : 0] : pair);
  /* THE LEVEL KEEPS ITS FULL SIZE. It was squashed to one line when there was
     news above it, which made sense while this was a column and the news was
     the headline. In a strip it is nobody's subtitle — it is its own card with
     a card's worth of room, and a medallion the size of a line of text is a
     runt in a box of its own. */
  if (lvl && lvl.level) {
    const n = Math.max(1, Math.min(10, Number(lvl.level) || 1));
    const w = lvl.which === "en" ? "en" : "zh";
    const medal = el("div", "nowmedal");
    if (!OFF.crowns) medal.append(crownMark(stageFor((w === "zh" ? "ZH " : "EN ") + n), "2.4rem"));
    now.append(medal);
    now.append(el("p", "nowcap", T("prof.now")));
    now.append(el("p", "nowbig", P(BANDS[w][n - 1])));
    now.append(el("p", "nowlvl", T("lvl.n", { n })
      + " \u00b7 " + T(w === "zh" ? "crown.zh" : "crown.en")));
    const dots = el("div", "nowdots");
    for (let i = 1; i <= 10; i++) dots.append(el("i", i <= n ? "on" : ""));
    now.append(dots);
    if (typ && typ.code) now.append(el("p", "nowtype", typ.code));
  } else {
    /* Nothing to show is still worth a line: the invitation goes where the
       number would have been, rather than being hunted for further down. The
       first mark is drawn faint above it — what is on offer, shown rather than
       described, and it fills the hole the medallion would have left. */
    const medal = el("div", "nowmedal empty");
    if (!OFF.crowns) medal.append(crownMark(1, "2.4rem"));
    now.append(medal);
    now.append(el("p", "nowcap", T("prof.now")));
    now.append(el("p", "nowbig none", T("prof.nolevelBig")));
    now.append(el("p", "nowlvl", T("prof.nolevelWhy")));
    const go = el("a", "nowgo", T("day.takeTest"));
    go.href = "/level";
    now.append(go);
  }

  /* Two lines, not one: "From the Professor · Your report card" wrapped on a
     phone and read as one long sentence. Whose it is, then what it is. */
  $("proftitle").textContent = T("prof.title");
  $("profsub").textContent = T("prof.sub");

  /* The line under it, in the order somebody cares: what is waiting first,
     then what they already have. */
  const bits = [];
  if (hasCard) bits.push(T(done ? "prof.cardDone" : "prof.waiting"));
  if (lvl && lvl.level) bits.push(T("day.atLevel", { n: lvl.level }));
  if (typ && typ.code) bits.push(typ.code);
  $("profsum").textContent = bits.length ? bits.join(" \u00b7 ") : T("prof.nothing");
  head.classList.toggle("todo", hasCard && !done);

  /* ONE TILE, WHICH IS WHAT IT LOOKED LIKE BEST AS. Between Browse and the
     feed, shut, it is a single row: the mark, what it is, the summary line and
     today's letter. Open, everything is under it in a list.
     It starts open while there is something to do — nothing tested yet, or
     today's card unanswered — and shut once both are behind them. Shutting it
     by hand sticks for the day, because the point of a fold nobody can keep
     shut is lost on the person who wanted it shut. */
  if (PROFOPEN === null) {
    let shut = "";
    try { shut = localStorage.getItem(PROFSHUT) || ""; } catch { /* fine */ }
    PROFOPEN = shut === dayStamp() ? false
      : (!lvl && !typ) || (hasCard && !done);
  }
  body.hidden = !PROFOPEN;
  head.setAttribute("aria-expanded", String(PROFOPEN));
  $("daily").hidden = !hasCard;
}

/* What this browser has already said. Read once, so the card can say "noted"
 * rather than asking a question somebody has already answered. */
async function loadWanted() {
  if (!device) return;
  try {
    const d = await fetch("/api/want", { cache: "no-store",
      headers: { "x-board-device": device } }).then((r) => r.json());
    WANTED = (d && d.mine) || [];
  } catch { WANTED = []; }
  drawTutor();
}

/* How many introductions are waiting. Its own request rather than a field on
 * the board: the board is public and cached at every layer, and a number that
 * belongs to one browser has no business travelling with it. */
/* THE TWO DOORS, AND THE NUMBER ON ONE OF THEM.
 *
 * This was the count on a Messages tab that was hidden for V1. The tab is
 * still not in the bar — four and a button is enough down there — but messages
 * are real now, so the doors live in the tray with everything else addressed
 * to you, and this puts the unread count on one of them. */
function drawTalk() {
  const row = $("talkrow");
  // Nothing to offer somebody who has not put a name up yet. A private inbox
  // is not the first thing to show on an empty profile.
  row.hidden = !(ME && ME.handle);
  $("gonotes").firstChild.textContent = T("note.inbox");
  // Groups are off — see off.js.
  $("gogroups").hidden = OFF.groups;
  $("gogroups").firstChild.textContent = T("grp.title");
  // Left alone when paintRun has already decided which of the two this is.
  if (!$("gorun").dataset.set) $("gorun").firstChild.textContent = T("run.title");
}

async function countNotes() {
  if (!device) return;
  try {
    const d = await fetch("/api/notes", { cache: "no-store",
      headers: { "x-board-device": device } }).then((r) => r.json());
    const n = (d && d.unread) || 0;
    for (const id of ["navnotesn", "gonotesn"]) {
      const badge = $(id);
      if (!badge) continue;
      badge.textContent = n > 9 ? "9+" : String(n);
      badge.hidden = !n;
    }
  } catch { /* the door is still a door without a number on it */ }
}

/* ---- browse, at the top of this page ---------------------------------------
 *
 * One person, filling the card. A photograph is the reason this exists, so it
 * gets the whole thing and the words sit on top of it.
 *
 * There is no yes and no no here. A flick moves on; it is how you turn the
 * page, not a verdict on somebody's face — which is the whole difference
 * between this and the app it borrows its shape from.
 */
let PEOPLE = [], AT = 0;

/* A FRESH CUT OF THE DECK EVERY TIME IT IS OPENED.
 *
 * The server sends people in the order they joined, and a deck in join order
 * is the same face every single time — which makes a board of a dozen people
 * feel like a board of one, and quietly settles who gets looked at. Whoever
 * arrived last week is the person nobody ever reaches, because reaching them
 * costs eleven flicks and the first three are always the same.
 *
 * Fisher-Yates, on the client, on load. Nothing is carried between opens:
 * no seed, no stored position, so it is a shuffle rather than a rotation
 * somebody could learn. Order is not a signal on this board and it should not
 * accidentally become one.
 */
function shuffled(rows) {
  const out = rows.slice();
  for (let i = out.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [out[i], out[j]] = [out[j], out[i]];
  }
  /* Not your own face first. You are in the deck on purpose — see below — but
     opening the app and being shown yourself reads as the app being broken,
     and it costs one swap to avoid. */
  if (out.length > 1 && out[0].mine) {
    const j = 1 + Math.floor(Math.random() * (out.length - 1));
    [out[0], out[j]] = [out[j], out[0]];
  }
  return out;
}

async function loadPeople() {
  try {
    const d = await fetch("/api/people", { cache: "no-store",
      headers: device ? { "x-board-device": device } : {} }).then((r) => r.json());
    /* Yourself included, for now.
     *
     * The argument for leaving yourself out is that browsing your own
     * photograph is not a feature. The argument against it, which won, is that
     * somebody who has just uploaded a face and cannot find it in the one
     * place the app shows faces concludes the upload failed — and being told
     * "your card is deliberately not in your own deck" answers the question
     * without ever making the screen make sense.
     *
     * Your own card says it is yours and offers the edit rather than a follow
     * button that would refuse itself. */
    PEOPLE = shuffled((d && d.people) || []);
  } catch { PEOPLE = []; }
  drawDeck();
  /* THE PANEL IS BUILT FROM FOUR FETCHES THAT LAND WHEN THEY LAND. Drawn once
     at startup it reported whichever of them had arrived — the row about who
     joined came and went depending on the network. Every loader redraws it. */
  drawProf();
}

/* Whether this phone still owes the board a face.
 *
 * Everything below that asks for one is gated on it, so a settled reader is
 * never asked again — an ask that stays up after it has been answered is how a
 * prompt turns into furniture. */
const needsFace = () => !(ME && ME.photo);

/* How many cards there are: everybody, plus you at the end if you are not on
 * here yet. Never you on your own — "that is everyone" is a strange thing to
 * say about nobody, and an empty list already has its own block that says so
 * and offers the right thing to do about it. */
const deckLen = () => PEOPLE.length + (needsFace() && PEOPLE.length ? 1 : 0);

function nextPerson() {
  const n = deckLen();
  if (!n) return;
  AT = (AT + 1) % n;
  drawDeck();
}

/* The last card. You have just looked at everybody's face, which is the one
 * moment putting your own up needs no explaining. */
function turnCard() {
  const box = el("div", "pc turn");
  box.append(el("div", "noshot", "+"));
  const scrim = el("div", "scrim");
  scrim.append(el("h2", null, T("brw.yourTurn")), el("p", "goal", T("brw.yourTurnWhat")));
  box.append(scrim);
  return box;
}

/* ---- who started following you -------------------------------------------
 *
 * The notification and the answer to it, in one place. Somebody follows you;
 * you find out; you look at them and decide whether to follow back. Three
 * screens for that would be two too many.
 *
 * NEW IS A FACT ABOUT THIS PHONE, not about the board. What counts as new is
 * "since you last had this drawn in front of you", so the newest follower's
 * timestamp is written to local storage as soon as the row is on the screen:
 * the dots show on the load they arrived and are gone on the next one, which
 * is how a since-you-last-looked mark is supposed to behave. The board is not
 * asked to keep a note of when somebody last opened it.
 */
let FOLLOWERS = [], FRESH = new Set();

async function loadFollowers() {
  if (!device) return;
  try {
    const d = await fetch("/api/followers", { cache: "no-store",
      headers: { "x-board-device": device } }).then((r) => r.json());
    FOLLOWERS = (d && d.followers) || [];
  } catch { FOLLOWERS = []; }

  /* Which of them are new is worked out ONCE, here, and not in the draw.
   * This page redraws whenever the language changes or a late fetch lands, and
   * a draw that both read the mark and moved it made the second redraw erase
   * the dots the first one had just put up. */
  let seen = "";
  try { seen = localStorage.getItem("board:sawfollowers") || ""; } catch { /* fine */ }
  FRESH = new Set(FOLLOWERS.filter((f) => (f.at || "") > seen).map((f) => f.id));
  if (FOLLOWERS.length) {
    const newest = FOLLOWERS.map((f) => f.at || "").sort().pop();
    try { localStorage.setItem("board:sawfollowers", newest); } catch { /* fine */ }
  }
  drawFollowers();
  drawProf();
}

/* ---- matches, in the tray --------------------------------------------------
 *
 * THE ROOM IS THE INFORMATION, NOT THE WORD "MATCH". With three picks each out
 * of seven pairings, two people overlap somewhere about nine times in ten — so
 * a line that said MATCH and nothing else would fire constantly and be learned
 * as noise inside a week. "You and Ana both want a language exchange" is
 * pleasant; "you are raising, they are investing" is worth stopping for; and
 * the reader can tell which is which without being told.
 */
let MATCHES = [];
/* Whether I have a card of my own to hand anybody. /api/matches answers it in
   the same request, so the shelf never has to ask a second time to find out
   it cannot do anything. */
let HAVECARD = false;
/* My own card, so the sheet that offers to send it can show what it is about
   to send — and let somebody who has not made one yet type the id right there
   rather than being sent to Profile and losing the match they were looking at. */
let MYCARD = null;
/* Cards I have already looked at, so the tab's number counts what is new
   rather than what exists. Its own key: board:sawmatches belongs to the daily
   summary and counts a different thing. */
let SAWCARDS = [];
try { SAWCARDS = JSON.parse(localStorage.getItem("board:sawcards") || "[]"); }
catch { /* a badge is never worth failing a page load over */ }

async function loadMatches() {
  if (!device) return;
  try {
    const d = await fetch("/api/matches", { cache: "no-store",
      headers: { "x-board-device": device } }).then((r) => r.json());
    MATCHES = (d && d.matches) || [];
    HAVECARD = Boolean(d && d.card);
    MYCARD = (d && d.mine) || null;
  } catch { MATCHES = []; HAVECARD = false; MYCARD = null; }
  drawMatches();
  drawCards();
  /* markCardsSeen, not just badgeCards. showView marks them when a tab is
     tapped, but somebody who arrives straight at /cards — a reload, a
     bookmark — runs showView before this request has answered, so there was
     nothing to mark yet and the number sat there while they read the very
     cards it was counting. markCardsSeen checks the view is on screen itself,
     so calling it here is right in both cases and wrong in neither. */
  markCardsSeen();
  badgeCards();
  drawTray();
  drawProf();
}

function matchLine(m) {
  const first = m.shared[0];
  if (!first) return "";
  return first.mine === first.theirs
    ? T("match.one", { who: m.handle, what: T("room." + first.mine + ".s") })
    : T("match.pair", { who: m.handle, mine: T("room." + first.mine + ".s"),
                        theirs: T("room." + first.theirs + ".s") });
}

/* THE TRAY'S COPY OF THIS LIST IS OFF, and the function is kept as the thing
 * that keeps it off — the same treatment badgeFollowers got when the followers
 * list moved. Matches now have a tab, and two lists of the same rows on two
 * screens is how a reader learns to trust neither of them.
 *
 * loadMatches still runs and MATCHES is still filled: the daily summary reads
 * it for its two-line digest, which is a different surface answering a
 * different question ("what happened today") and is left alone. */
function drawMatches() {
  const box = $("matches");
  const rule = $("matchrule");
  if (box) { fill(box); box.hidden = true; }
  if (rule) rule.hidden = true;
}

/* One face, for a card or a row. Falls back to the initial when the photo is
 * missing or fails, which is the same rule the deck and the followers list
 * already follow. */
function faceInto(av, handle, photo) {
  if (photo) {
    const img = Object.assign(document.createElement("img"),
      { src: "/api/public-media?id=" + encodeURIComponent(photo), alt: "", loading: "lazy" });
    img.addEventListener("error", () => { img.remove(); av.textContent = initial(handle); });
    av.append(img);
  } else {
    av.textContent = initial(handle);
  }
  return av;
}

/* ---- the shelf -------------------------------------------------------------
 *
 * THE CARD IS DRAWN WHETHER OR NOT IT HAS ANYTHING ON IT. An empty shelf slot
 * is the whole point: you can see there is a real person there, what is
 * missing, and what would fill it — which is what makes somebody go and ask.
 *
 * The blank line names them, not us. "Mei has not given you her card yet" is
 * true; "unlock this" would not be, because nothing is being withheld from you
 * by the board — she simply has not handed it to anybody. The server agrees:
 * pairState only ever attaches a card on the last line of its check, so an
 * ungiven id is not in the page at all and cannot be read out of it.
 */
function drawCards() {
  const list = $("cardslist");
  if (!list) return;
  fill(list);

  $("cardshead").textContent = T("cards.head");
  $("cardsn").textContent = MATCHES.length
    ? T(MATCHES.length === 1 ? "cards.n1" : "cards.n", { n: MATCHES.length }) : "";

  /* FOUR SENTENCES BECAME ONE. It read "This is where the fun starts.
     Everyone here is looking for what you've got. Nobody has your WeChat yet.
     Press Connect to send it." — an explanation of a mechanism that is now
     drawn on every row underneath it. */
  const what = $("cardswhat");
  what.hidden = !MATCHES.length;
  if (!what.hidden) what.textContent = T("cards.what");

  const none = $("cardsnone");
  none.hidden = MATCHES.length > 0;
  if (!MATCHES.length) {
    $("cardsnonehead").textContent = T("cards.none");
    $("cardsnonewhy").textContent = T("cards.noneWhy");
    $("cardsnonego").textContent = T("cards.noneGo");
  }

  /* THE "YOU HAVE NO CARD YET" BANNER IS GONE.
   *
   * It sat over a shelf of matches saying you had nothing to give and sent
   * whoever read it to Profile to fill in a form — which read as though a
   * card were a thing you needed in order to match, and it never was. A match
   * is two sentences that answer each other and two people who both followed.
   * A card is your contact details, and it is asked for at the only moment it
   * is needed: inside the Connect sheet, one field, without leaving the row.
   *
   * HAVECARD is still loaded — the sheet prefills from it. */

  for (const m of MATCHES) {
    const card = el("div", "bcard");

    const who = el("a", "who");
    who.href = "/p/" + encodeURIComponent((m.handle || "").toLowerCase());
    who.append(faceInto(el("span", "av"), m.handle, m.photo));
    const t = el("span", "t");
    t.append(el("b", null, m.handle));
    /* WHY THEY ARE A MATCH, AS THE SENTENCE RATHER THAN A PARAGRAPH ABOUT IT.
     *
     * It read "You and Wei: you want people to represent, they want an agent"
     * — two lines of prose under every name on the shelf, describing in the
     * board's own words what the two pills on their card already say in
     * theirs. Browse shows the sentence; this showed an essay about the
     * sentence. Same pills, same shape, so a person recognised on Browse is
     * recognisable here.
     * matchLine is still the fallback: somebody who joined before the
     * sentence existed has rooms and no `say`, and a blank line under their
     * name would be a regression for the people who have been here longest. */
    const pair = Array.isArray(m.say) ? m.say.find((r) => r && r.me && r.want) : null;
    if (pair) {
      const line = el("span", "psay");
      line.append(el("b", "pchip on", T("role.a." + pair.me)));
      line.append(el("i", "to", "\u2192"));
      line.append(el("b", "pchip", T("role.a." + pair.want)));
      t.append(line);
    } else {
      const why = matchLine(m);
      if (why) t.append(el("span", null, why));
    }
    who.append(t);
    card.append(who);

    const foot = el("div", "foot");

    /* THE HANDOVER.
     *
     * "Open WeChat" on its own was a dead button: WeChat has no link that
     * opens a chat with somebody you have never spoken to, so launching the
     * app just abandons the person on whatever screen it was left on. The two
     * things that do work are here instead, in the order they work in —
     *
     *   the code, saved to the photo roll and read back through Scan · from
     *   album, which is how people here actually add each other and the only
     *   half that works from inside WeChat's own browser;
     *
     *   the id underneath it, always, because plenty of people have not put a
     *   code up and a searchable id is better than nothing.
     */
    /* THE SWAP, FINISHED. The third state, and it had no drawing at all: both
     * cards change hands and the row went straight from a dashed outline to a
     * WeChat id and a QR block, with nothing saying the thing everybody came
     * here for had actually happened.
     * Big rather than the small two-card mark used for the other two states.
     * Those are progress; this is the result, and it is the only moment on
     * this board where two people have actually reached each other. */
    if (m.card && m.gave) foot.append(done(m));
    /* AND THE OTHER WAY ROUND. They sent, you have not — so their details are
     * on the screen and there is still something to do. Without this the row
     * looked finished while the other person was still waiting on you. */
    if (m.card && !m.gave) {
      const owe = el("div", "meet");
      owe.append(swapMark(m));
      const go = el("button", "give", T("cards.giveGo"));
      go.type = "button";
      go.addEventListener("click", () => openGive(m));
      owe.append(go);
      foot.append(owe);
    }
    /* AND THE WAY TO SAY SOMETHING, on a row that until now ended in a
     * contact string. Two people who have swapped cards have already agreed
     * to talk; making them go and find each other in another tab was the last
     * thing on this screen still assuming the conversation happens elsewhere.
     * The thread is addressed by person id, which is what /notes reads. */
    if (m.card && m.gave) {
      const talk = el("a", "wxgo", T("cards.talk"));
      talk.href = "/notes#" + encodeURIComponent(m.id);
      foot.append(talk);
    }
    // What they wrote when they handed it over — see .said in the CSS.
    if (m.card && m.note) foot.append(el("p", "said", m.note));

    if (m.card && m.card.qr) {
      const q = el("div", "qr");
      const img = Object.assign(document.createElement("img"), {
        src: "/api/public-media?id=" + encodeURIComponent(m.card.qr),
        alt: "", loading: "lazy",
      });
      q.append(img);
      // No button. Saving a picture is a press-and-hold that no script may
      // perform, and a button that cannot do what it says is the thing this
      // whole block exists to replace.
      q.append(el("p", "how", T(IN_WECHAT ? "cards.qrHowWx" : "cards.qrHow")));
      foot.append(q);
    }

    if (m.card && m.card.wechat) {
      const got = el("div", "got");
      got.append(el("code", null, m.card.wechat));
      const copy = el("button", null, T("cards.copy"));
      copy.type = "button";
      copy.addEventListener("click", async () => {
