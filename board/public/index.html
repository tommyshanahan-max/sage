<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>The Board</title>
<!-- What WeChat puts on the card when somebody forwards this into a chat or
     onto Moments. WeChat's crawler reads the title, this description, and the
     first large image in the page — it does not run scripts, so all three have
     to be in the served HTML. The og: tags cost nothing and are what every
     other platform reads. -->
<meta name="description" content="A noticeboard for people living in and visiting China. Anyone can read, anyone can post. No account, no app to install.">
<meta property="og:type" content="website">
<meta property="og:title" content="The Board">
<meta property="og:description" content="A noticeboard for people living in and visiting China. Anyone can read, anyone can post.">
<meta property="og:image" content="{{ORIGIN}}/share.png">
<meta property="og:url" content="{{ORIGIN}}/">
<!-- WeChat on iOS caches aggressively against the URL, and a board is the one
     thing that must never be a day old. -->
<meta http-equiv="Cache-Control" content="no-cache">
<meta name="color-scheme" content="light dark">
<style>
  /* No web fonts. fonts.googleapis.com does not answer in the mainland, and a
     page that waits on it is a page that does not load. Everything here is a
     face the device already has, Chinese ones named first for Chinese text. */
  :root{
    --paper:#EEF0F4; --raise:#F7F8FB; --ink:#151B28; --ink-2:#4E5968;
    --muted:#8A939F; --line:#E3E6EC; --hair:#EAECF1;
    --accent:#3F68D8; --accent-ink:#FFFFFF; --accent-soft:#E8ECF7;
    --t1:#3F68D8; --t2:#2A9D63; --t3:#D99038; --t4:#7268C4; --t5:#D4485C; --t6:#2F8C9E;
    --serif:Georgia,"Songti SC","Noto Serif CJK SC",'Times New Roman',serif;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",
      "Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;
    --shadow:0 2px 6px rgba(21,27,40,.07),0 10px 28px rgba(21,27,40,.09);
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --paper:#0B0E15; --raise:#141924; --ink:#E9EDF5; --ink-2:#A3B0C4;
      --muted:#6F7D92; --line:#232B39; --hair:#1E2531;
      --accent:#5C8DFF; --accent-ink:#0B0E15; --accent-soft:#18233D;
      --t1:#5C8DFF; --t2:#4EBE88; --t3:#E4A65A; --t4:#9187E0; --t5:#F0687C; --t6:#4FA9BC;
      --shadow:0 2px 6px rgba(0,0,0,.4),0 12px 32px rgba(0,0,0,.34);
    }
  }
  :root[data-theme="dark"]{
    --paper:#0B0E15; --raise:#141924; --ink:#E9EDF5; --ink-2:#A3B0C4;
    --muted:#6F7D92; --line:#232B39; --hair:#1E2531;
    --accent:#5C8DFF; --accent-ink:#0B0E15; --accent-soft:#18233D;
    --t1:#5C8DFF; --t2:#4EBE88; --t3:#E4A65A; --t4:#9187E0; --t5:#F0687C; --t6:#4FA9BC;
    --shadow:0 2px 6px rgba(0,0,0,.4),0 12px 32px rgba(0,0,0,.34);
  }

  /* WHAT MOVES WHEN THE LANGUAGE DOES.
     This is the half of a translation that is not words, and skipping it is
     what makes a bilingual page look like an English page wearing Chinese.

     The serif goes first. Georgia has no Chinese glyphs, so an English serif
     on Chinese text falls back per-character mid-sentence — the single most
     obvious tell there is. In Chinese the stack leads with faces the device
     actually has.

     Then the spacing. CJK wants more room between lines and none between
     characters, so line-height goes up and letter-spacing goes to zero.

     Then the labels. Chinese has no case, so text-transform:uppercase does
     nothing, and letter-spacing meant to make Latin capitals read as a label
     just pulls Chinese characters apart until they read as broken. */
  :root[data-lang="zh"]{
    --serif:"Songti SC","Noto Serif CJK SC","Source Han Serif SC",
      "STSong",Georgia,serif;
    --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB",
      "Microsoft YaHei","Noto Sans SC","Segoe UI",sans-serif;
  }
  :root[data-lang="zh"] body{line-height:1.75}
  :root[data-lang="zh"] .words,
  :root[data-lang="zh"] .rep p{line-height:1.8}
  :root[data-lang="zh"] .eyebrow span,
  :root[data-lang="zh"] .rule span{text-transform:none;letter-spacing:.02em;font-size:.76rem}
  :root[data-lang="zh"] .line b{letter-spacing:0}
  /* An en dash between two Chinese clauses is an English punctuation habit.
     Nothing to do in CSS, but it is why several strings differ rather than
     translate. */

  /* display:flex and display:grid both outrank the user agent's [hidden] rule,
     so anything laid out that way stays on screen when hidden. Said once here
     rather than remembered at seven call sites. */
  [hidden]{display:none!important}

  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);
    font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
  main{max-width:34rem;margin:0 auto;padding:1.5rem 1.15rem 9.5rem}
  img{max-width:100%}
  button{font:inherit;cursor:pointer}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}

  /* ---- masthead ---------------------------------------------------------- */
  .top{display:flex;align-items:center;gap:.9rem;margin:.5rem 0 1.6rem}
  #langslot{margin-left:auto;flex:0 0 auto;display:flex}
  .mark{width:4.1rem;height:4.1rem;border-radius:50%;flex:0 0 auto;overflow:hidden;
    background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;
    font-family:var(--serif);font-size:1.9rem;line-height:1;
    box-shadow:0 0 0 3px var(--paper),0 0 0 4px var(--line)}
  /* Also the share thumbnail. It is a real <img> rather than a background so
     WeChat's crawler can find it — a CSS background is invisible to it. */
  .mark img{width:100%;height:100%;display:block;object-fit:cover}
  .top h1{margin:0;font-family:var(--serif);font-size:1.85rem;font-weight:400;
    letter-spacing:-.01em;line-height:1.1}
  .top p{margin:.2rem 0 0;color:var(--muted);font-size:.86rem}

  /* ---- your own profile, above the feed -----------------------------------
     The shape every social profile has, and it is conventional on purpose:
     somebody who has used a phone knows what a cover with a circle overlapping
     its bottom edge is, and spends no attention learning it.
     One departure: there is no Follow. Nobody follows anybody here — the
     figures are what you have put IN, which is the only number that means
     anything on a board. */
  .me{margin:0 -1.15rem 1.5rem;background:var(--raise);
    border-bottom:1px solid var(--hair)}
  .cover{position:relative;height:8.5rem;background:var(--accent);overflow:hidden}
  .cover img{width:100%;height:100%;object-fit:cover;display:block}
  /* Without a cover photo: a quiet wash rather than a grey hole, so an empty
     profile reads as new and not as broken. */
  .cover.bare{background:linear-gradient(160deg,var(--accent),var(--t6))}
  .cover button{position:absolute;right:.7rem;top:.7rem;border:0;
    background:rgba(0,0,0,.34);color:#fff;border-radius:99px;
    padding:.4rem .85rem;font-size:.8rem;backdrop-filter:blur(4px)}
  .meface{display:flex;flex-direction:column;align-items:center;
    padding:0 1.15rem 1.1rem;margin-top:-2.9rem}
  /* The clip lives on the inner circle, not the button. With overflow:hidden
     on the button itself the + badge — which sits deliberately outside the
     circle's edge — was sliced in half. */
  .meface .shot{position:relative;width:5.8rem;height:5.8rem;border-radius:50%;
    background:var(--paper);color:var(--accent);display:grid;place-items:center;
    font-family:var(--serif);font-size:2.2rem;line-height:1;
    box-shadow:0 0 0 4px var(--raise);border:0;padding:0}
  .meface .shot .in{position:absolute;inset:0;border-radius:50%;overflow:hidden;
    display:grid;place-items:center}
  .meface .shot img{width:100%;height:100%;object-fit:cover;display:block}
  .meface .shot .plus{position:absolute;right:-1px;bottom:-1px;width:1.75rem;
    height:1.75rem;border-radius:50%;background:var(--accent);color:var(--accent-ink);
    display:grid;place-items:center;font-size:1.1rem;font-family:var(--sans);
    box-shadow:0 0 0 3px var(--raise)}
  .meface h2{margin:.7rem 0 0;font-family:var(--serif);font-weight:400;font-size:1.4rem;
    line-height:1.15;text-align:center}
  .meface .facts{margin:.25rem 0 0;font-size:.85rem;color:var(--muted);
    text-align:center;display:flex;gap:.5rem;flex-wrap:wrap;justify-content:center}
  .meface .facts b{font-weight:400;color:var(--ink-2);font-variant-numeric:tabular-nums}
  .meface .bio{margin:.7rem 0 0;font-family:var(--serif);font-size:1.02rem;
    line-height:1.55;color:var(--ink-2);text-align:center;max-width:26rem}
  .meface .pending{margin:.6rem 0 0;font-size:.8rem;color:var(--t3);text-align:center}
  .meface .go{margin:.9rem 0 0;border:1px solid var(--line);background:var(--paper);
    color:var(--ink);border-radius:99px;padding:.5rem 1.4rem;font-size:.9rem}
  .meface .go.primary{background:var(--accent);border-color:var(--accent);
    color:var(--accent-ink)}
  .menote{margin:.5rem 0 0;font-size:.82rem;color:var(--muted);text-align:center;
    max-width:24rem;line-height:1.5}

  /* ---- topics ------------------------------------------------------------ */
  .topics{display:flex;gap:.55rem;overflow-x:auto;padding:0 0 .35rem;
    margin:0 -1.15rem 1.5rem;padding-left:1.15rem;padding-right:1.15rem;
    scrollbar-width:none}
  .topics::-webkit-scrollbar{display:none}
  .chip{display:inline-flex;align-items:center;gap:.45rem;flex:0 0 auto;
    border:1px solid var(--line);background:var(--raise);color:var(--ink);
    border-radius:99px;padding:.6rem 1.15rem;font-size:.98rem;line-height:1;
    white-space:nowrap;transition:background .12s,border-color .12s}
  .chip .dot{width:.5rem;height:.5rem;border-radius:50%;background:var(--muted)}
  .chip .n{color:var(--muted);font-size:.86rem;font-variant-numeric:tabular-nums}
  .chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
  .chip[aria-pressed="true"] .dot{background:var(--accent-ink);opacity:.6}
  .chip[aria-pressed="true"] .n{color:var(--accent-ink);opacity:.75}

  /* ---- the rule that names what you are looking at ----------------------- */
  .rule{display:flex;align-items:center;gap:.9rem;margin:0 0 .4rem}
  .rule span{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;
    color:var(--muted);white-space:nowrap}
  .rule i{flex:1;height:1px;background:var(--line)}

  /* ---- a post ------------------------------------------------------------ */
  .post{display:flex;gap:.9rem;padding:1.35rem 0;border-bottom:1px solid var(--hair)}
  .av{width:3.4rem;height:3.4rem;border-radius:50%;flex:0 0 auto;
    background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;
    font-family:var(--serif);font-size:1.35rem;line-height:1;
    box-shadow:0 0 0 3px var(--paper),0 0 0 4px var(--accent-soft)}
  .body{flex:1;min-width:0}

  .eyebrow{display:flex;align-items:center;gap:.45rem;margin:0 0 .3rem}
  .eyebrow i{width:.45rem;height:.45rem;border-radius:50%;flex:0 0 auto}
  .eyebrow span{font-size:.72rem;letter-spacing:.13em;text-transform:uppercase;
    color:var(--muted)}

  .line{display:flex;align-items:baseline;gap:.6rem}
  .line b{font-family:var(--serif);font-weight:400;font-size:1.15rem;
    text-decoration:underline;text-decoration-color:var(--line);
    text-underline-offset:.28em;text-decoration-thickness:1px;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .line time{margin-left:auto;color:var(--muted);font-size:.92rem;
    font-variant-numeric:tabular-nums;flex:0 0 auto}

  .words{margin:.45rem 0 0;font-family:var(--serif);font-size:1.12rem;
    line-height:1.55;overflow-wrap:anywhere}
  .zh{margin:.3rem 0 0;font-family:var(--serif);font-size:1.05rem;color:var(--ink-2)}
  .py{margin:.15rem 0 0;font-size:.88rem;color:var(--muted)}
  .pic{display:block;width:100%;border-radius:.7rem;margin:.65rem 0 0;
    background:var(--raise)}

  /* ---- what you can do to it --------------------------------------------- */
  .acts{display:flex;align-items:center;gap:1.15rem;margin:.85rem 0 0;flex-wrap:wrap}
  .acts button{display:inline-flex;align-items:center;gap:.4rem;border:0;
    background:none;color:var(--ink-2);font-size:.92rem;padding:.15rem 0;
    /* A button holding only an icon is shorter than one holding text, and the
       row centres them — which drops the bare icons a few pixels below the
       labelled ones. One shared height puts every icon on the same line. */
    min-height:1.5rem}
  .acts button:hover{color:var(--accent)}
  .acts button[disabled]{opacity:.45;cursor:default}
  .acts svg{width:1rem;height:1rem;stroke:currentColor;fill:none;
    stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
  .acts .n{color:var(--muted);font-size:.86rem;font-variant-numeric:tabular-nums}
  .acts .liked{color:var(--accent)}
  /* On a 360px phone the English labels are ~30px wider than the row. Chinese
     already fits — two characters says what six letters do — so this is one of
     the places the two languages genuinely need different numbers. */
  @media (max-width:380px){
    .acts{gap:.8rem}
    .acts button{font-size:.87rem}
  }
  .acts button[aria-pressed="true"]{color:var(--accent)}
  .acts .liked svg{fill:currentColor;stroke:currentColor}

  /* ---- the thread underneath --------------------------------------------- */
  .thread{margin:.9rem 0 0;padding-left:.95rem;border-left:2px solid var(--line)}
  .rep{padding:.5rem 0}
  .rep + .rep{border-top:1px solid var(--hair)}
  .rep .line b{font-size:1rem}
  .rep p{margin:.2rem 0 0;font-family:var(--serif);font-size:1rem;line-height:1.5;
    overflow-wrap:anywhere}
  .rbox{display:flex;gap:.5rem;margin:.7rem 0 0}
  .rbox input{flex:1;min-width:0;border:1px solid var(--line);background:var(--raise);
    border-radius:99px;padding:.5rem .9rem;font:inherit;font-size:.95rem;
    color:var(--ink);outline:none}
  .rbox input:focus{border-color:var(--accent)}
  .rbox button{border:0;background:var(--accent);color:var(--accent-ink);border-radius:99px;
    padding:.5rem 1.05rem;font-size:.9rem}

  /* ---- nothing there yet -------------------------------------------------- */
  .none{padding:3.5rem .5rem;text-align:center;color:var(--muted)}
  .none b{display:block;font-family:var(--serif);font-weight:400;font-size:1.3rem;
    color:var(--ink);margin:0 0 .4rem}
  .none p{margin:0;font-size:.95rem;line-height:1.6}

  /* ---- the + ------------------------------------------------------------- */
  /* The language switch. In the masthead rather than in a menu: somebody who
     cannot read the page cannot find a menu labelled in the language they
     cannot read. */
  .lang{margin-left:auto;flex:0 0 auto;border:1px solid var(--line);
    background:var(--raise);color:var(--ink-2);border-radius:99px;
    padding:.42rem .9rem;font-size:.85rem;line-height:1}
  .lang:hover{color:var(--ink);border-color:var(--muted)}

  /* Translate, always in the same place. Above the +, smaller, because
     posting is the primary thing and reading help is the constant one. */
  .tfab{position:fixed;right:1.55rem;bottom:6.1rem;width:3.3rem;height:3.3rem;
    border-radius:50%;border:1px solid var(--line);background:var(--raise);
    color:var(--ink);box-shadow:var(--shadow);display:grid;place-items:center;
    z-index:30;font-family:var(--serif);font-size:1.25rem;line-height:1}
  .tfab:hover{border-color:var(--accent);color:var(--accent)}

  .tout{margin:.9rem 0 0;padding:.9rem 1rem;background:var(--raise);
    border:1px solid var(--line);border-radius:.7rem}
  .tout .said{margin:0;font-family:var(--serif);font-size:1.08rem;line-height:1.6;
    color:var(--ink)}
  .tout .py{margin:.35rem 0 0;font-size:.86rem;color:var(--muted)}
  .tout .note{margin:.6rem 0 0;padding-top:.55rem;border-top:1px solid var(--line);
    font-size:.86rem;line-height:1.55;color:var(--ink-2)}
  .tout .note b{display:block;font-size:.66rem;letter-spacing:.13em;
    text-transform:uppercase;color:var(--muted);margin:0 0 .2rem;font-weight:600}
  :root[data-lang="zh"] .tout .note b{text-transform:none;letter-spacing:.02em}
  .tpost{margin:.6rem 0 0;padding:.7rem .85rem;background:var(--accent-soft);
    border-radius:.6rem}
  .tpost p{margin:0;font-family:var(--serif);font-size:1.02rem;line-height:1.6}
  .tpost .py{margin:.3rem 0 0;font-family:var(--sans);font-size:.82rem;color:var(--muted)}
  .tpost .note{margin:.4rem 0 0;font-family:var(--sans);font-size:.82rem;color:var(--ink-2)}

  .fab{position:fixed;right:1.2rem;bottom:1.6rem;width:4rem;height:4rem;
    border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);
    box-shadow:var(--shadow);display:grid;place-items:center;z-index:30}
  .fab svg{width:1.7rem;height:1.7rem;stroke:currentColor;stroke-width:2;
    stroke-linecap:round;fill:none}

  /* ---- putting something up ---------------------------------------------- */
  .sheet{position:fixed;inset:0;z-index:40;display:flex;align-items:flex-end;
    justify-content:center;background:rgba(21,27,40,.42)}
  .sheet .card{width:100%;max-width:34rem;background:var(--paper);
    border-radius:1.1rem 1.1rem 0 0;padding:1.3rem 1.15rem calc(1.3rem + env(safe-area-inset-bottom));
    box-shadow:var(--shadow);overflow-y:auto;
    /* Not 92vh. WeChat's toolbar is inside the viewport on Android and outside
       it on iOS, so vh is wrong by about 60px in one direction or the other and
       the bottom of this sheet ends up under the chrome. --vh is set from
       innerHeight, which is the number that is actually true. */
    max-height:calc(var(--vh, 1vh) * 92)}
  .sheet h2{margin:0 0 1rem;font-family:var(--serif);font-weight:400;font-size:1.35rem}
  .sheet textarea{width:100%;border:1px solid var(--line);background:var(--raise);
    border-radius:.7rem;padding:.85rem;font:inherit;font-family:var(--serif);
    font-size:1.08rem;line-height:1.55;color:var(--ink);resize:vertical;outline:none}
  .sheet textarea:focus{border-color:var(--accent)}
  .field{display:flex;gap:.6rem;margin:.8rem 0 0}
  .field input,.field select{flex:1;min-width:0;border:1px solid var(--line);
    background:var(--raise);border-radius:99px;padding:.6rem .95rem;font:inherit;
    font-size:.95rem;color:var(--ink);outline:none}
  .field input:focus,.field select:focus{border-color:var(--accent)}
  .row{display:flex;align-items:center;gap:.6rem;margin:.9rem 0 0}
  .ghost{border:1px solid var(--line);background:var(--raise);color:var(--ink);
    border-radius:99px;padding:.6rem 1.1rem;font-size:.92rem}
  .go{margin-left:auto;border:0;background:var(--accent);color:var(--accent-ink);
    border-radius:99px;padding:.68rem 1.5rem;font-size:.98rem}
  .go[disabled]{opacity:.5;cursor:default}
  .shot{position:relative;margin:.8rem 0 0}
  .shot img{display:block;width:100%;border-radius:.7rem}
  .shot button{position:absolute;top:.5rem;right:.5rem;width:2rem;height:2rem;
    border-radius:50%;border:0;background:rgba(21,27,40,.72);color:#fff;
    font-size:1.1rem;line-height:1;display:grid;place-items:center}
  .said{margin:.85rem 0 0;font-size:.92rem;line-height:1.5;color:var(--ink-2)}
  .hint{margin:0 0 .9rem;font-size:.86rem;line-height:1.55;color:var(--muted)}
  .reasons{display:flex;gap:.4rem;flex-wrap:wrap;margin:0 0 .8rem}
  .reasons button{border:1px solid var(--line);background:var(--raise);color:var(--ink);
    border-radius:99px;padding:.45rem .9rem;font-size:.88rem;line-height:1}
  .reasons button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);
    color:var(--accent-ink)}
  .alsoblock{display:flex;align-items:flex-start;gap:.6rem;margin:.85rem 0 0;
    font-size:.9rem;line-height:1.45;color:var(--ink-2);cursor:pointer}
  .alsoblock input{margin:.15rem 0 0;flex:0 0 auto;width:1.05rem;height:1.05rem;
    accent-color:var(--accent)}
  .alsoblock b{font-weight:400;color:var(--ink)}
  .said.bad{color:var(--accent)}

  .foot{margin:2.5rem 0 0;padding-top:1.3rem;border-top:1px solid var(--line);
    color:var(--muted);font-size:.82rem;line-height:1.65}

  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<main>
  <div class="top">
    <div class="mark"><img src="/share.png" alt="" width="400" height="400"
      onerror="this.replaceWith(document.createTextNode('\u677F'))"></div>
    <div>
      <h1 id="boardname">The Board</h1>
      <p id="count">Anyone can read. Anyone can post.</p>
    </div>
    <span id="langslot"></span>
  </div>

  <div class="me" id="me" hidden></div>

  <div class="topics" id="topics"></div>

  <div class="rule"><span id="rulelabel">Everyone · Newest first</span><i></i></div>

  <div id="board"></div>
  <div class="none" id="none" hidden></div>

  <p class="foot">
<span id="foottext"></span><span id="contact" hidden></span>
  </p>
</main>

<button class="tfab" id="tfab" aria-label="Translate">译</button>

<div class="sheet" id="mesheet" hidden>
  <form class="card" id="meform">
    <h2 id="metitle"></h2>
    <div class="field"><input id="mename" maxlength="40"></div>
    <div class="field"><input id="mecampus" maxlength="60"></div>
    <div class="field"><input id="mehere" maxlength="40"></div>
    <textarea id="megoal" rows="3"></textarea>
    <p class="menote" id="mewhy"></p>
    <div class="row">
      <button class="ghost" type="button" id="meshut"></button>
      <button class="go" type="submit" id="mesave"></button>
    </div>
    <p class="said" id="mesaid" hidden></p>
  </form>
</div>

<input type="file" id="mephoto" hidden accept="image/jpeg,image/png,image/webp">
<input type="file" id="mecover" hidden accept="image/jpeg,image/png,image/webp">

<div class="sheet" id="tsheet" hidden>
  <form class="card" id="tform">

<button class="fab" id="fab" aria-label="Put something up">
  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
</button>

<div class="sheet" id="reportsheet" hidden>
  <form class="card" id="reportform">
    <h2 id="reporttitle">Report this post</h2>
    <p class="hint">A person reads every report. Say what is wrong with it — one
      line is enough, and it is the thing that decides what happens next.</p>
    <div class="reasons" id="reasons"></div>
    <textarea id="why" rows="2" placeholder="Anything else worth knowing…"></textarea>
    <label class="alsoblock">
      <input type="checkbox" id="alsoblock">
      <span>Also hide everything from <b id="blockwho"></b> on this phone</span>
    </label>
    <div class="row">
      <button class="ghost" type="button" id="reportshut">Cancel</button>

<div class="sheet" id="sheet" hidden>
  <form class="card" id="ask">
    <h2>Put something up</h2>
    <textarea id="note" rows="3"
      placeholder="Where to get a SIM without a Chinese bank card, which gate at Renmin, what the label says, a good meal…"></textarea>
    <div class="shot" id="shot" hidden>
      <img id="shotimg" alt=""><button type="button" id="shotoff" aria-label="Remove the photo">×</button>
    </div>
    <div class="field">
      <input id="who" maxlength="40" placeholder="Post as — a name people will see">
    </div>
    <div class="field">
      <input id="topic" maxlength="40" list="topiclist" placeholder="Topic — optional">
      <datalist id="topiclist"></datalist>
    </div>
    <div class="row">
      <button class="ghost" type="button" id="pickpic">Photo</button>
      <input type="file" id="pic" hidden accept="image/jpeg,image/png,image/webp,image/gif">
      <button class="ghost" type="button" id="shut">Cancel</button>
      <button class="go" type="submit" id="send">Put it up</button>
    </div>
    <p class="said" id="said" hidden></p>
  </form>
</div>

<script type="module">
import { T, when, lang, setLang, pickLang, langButton } from "/i18n.js";

const $ = (id) => document.getElementById(id);
const el = (t, c, x) => { const n = document.createElement(t); if (c) n.className = c;
  if (x !== undefined) n.textContent = x; return n; };

/* WHY THIS BLOCK EXISTS
 *
 * This board is meant to be forwarded into a WeChat chat and read where it
 * lands. That means the browser is not Chrome: on Android WeChat renders in
 * Tencent's X5 kernel, which trails Chrome by a long way and varies by
 * WeChat version, and on iOS it is whatever WKWebView the phone shipped with.
 *
 * Four things this page used are too new for that. Each one fails silently —
 * no error the reader would see, just a screen that does nothing — which is
 * the worst way to be broken on someone else's phone in another country.
 */

const IN_WECHAT = /micromessenger/i.test(navigator.userAgent);

/** Element.replaceChildren is Chrome 86. Old X5 does not have it, and the
 *  board is drawn entirely through it, so without this the page renders once
 *  and never updates again. */
function fill(node, ...kids) {
  while (node.firstChild) node.removeChild(node.firstChild);
  for (const k of kids) if (k) node.appendChild(k);
}

/** crypto.randomUUID is Chrome 92 AND only exists in a secure context. Without
 *  a fallback the id is never minted, which quietly costs somebody the ability
 *  to take their own post down. */
function uuid() {
  try { if (crypto.randomUUID) return crypto.randomUUID(); } catch (e) { /* older */ }
  try {
    const b = new Uint8Array(16);
    crypto.getRandomValues(b);
    b[6] = (b[6] & 0x0f) | 0x40; b[8] = (b[8] & 0x3f) | 0x80;
    const h = [...b].map((x) => x.toString(16).padStart(2, "0")).join("");
    return h.slice(0,8)+"-"+h.slice(8,12)+"-"+h.slice(12,16)+"-"+h.slice(16,20)+"-"+h.slice(20);
  } catch (e) { /* no crypto at all */ }
  // Last resort. Weaker, and it only ever identifies this browser to itself.
  return "x" + Date.now().toString(36) + Math.random().toString(36).slice(2, 12);
}

/** navigator.clipboard needs a secure context and is refused outright inside
 *  WeChat. The old textarea trick still works in every webview there is. */
function copyText(text) {
  try {
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text);
      return true;
    }
  } catch (e) { /* fall through */ }
  try {
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.setAttribute("readonly", "");
    ta.style.cssText = "position:absolute;left:-9999px;top:0";
    document.body.appendChild(ta);
    ta.select();
    ta.setSelectionRange(0, text.length);   // iOS ignores select() alone
    const ok = document.execCommand("copy");
    document.body.removeChild(ta);
    return ok;
  } catch (e) { return false; }
}

/* The real height of the window. WeChat's toolbar sits inside the viewport on
   Android and outside it on iOS, so vh is wrong in one direction or the other
   and a sheet sized in vh ends up under the chrome. */
function setVH() {
  document.documentElement.style.setProperty("--vh", (window.innerHeight / 100) + "px");
}
setVH();
window.addEventListener("resize", setVH);
window.addEventListener("orientationchange", setVH);

/** The line icons on each post. Drawn here rather than pulled from anywhere:
 *  four paths are cheaper than a request that would not answer in the mainland. */
const ICON = {
  reply: "M9 14 4 9l5-5 M4 9h8a8 8 0 0 1 8 8v3",
  like: "M12 20s-7-4.6-7-9.4A4 4 0 0 1 12 8a4 4 0 0 1 7-.6c0 4.8-7 12.6-7 12.6Z",
  remove: "M4 7h16 M10 11v6 M14 11v6 M6 7l1 12a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1l1-12 M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2",
  share: "M18 8a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5Z M6 15a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5Z M18 22a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5Z M8.2 11.4l7.6-4 M8.2 13.6l7.6 4",
  flag: "M5 21V4 M5 4h11l-2 3.5L16 11H5",
  globe: "M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18Z M3 12h18 M12 3c2.5 2.4 3.8 5.4 3.8 9S14.5 18.6 12 21c-2.5-2.4-3.8-5.4-3.8-9S9.5 5.4 12 3Z",
};
function icon(name) {
  const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  svg.setAttribute("viewBox", "0 0 24 24");
  svg.setAttribute("aria-hidden", "true");
  for (const d of ICON[name].trim().split(/\s+M/).map((s, i) => (i ? "M" + s : s))) {
    const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
    path.setAttribute("d", d);
    svg.append(path);
  }
  return svg;
}

/** A topic keeps its colour. Picked from the name rather than the order it
 *  happens to appear in, so Food is the same red on every reader's screen and
 *  stays that red when something else is posted above it. */
const TDOT = ["--t1","--t2","--t3","--t4","--t5","--t6"];
function topicColour(name) {
  let h = 0;
  for (const ch of String(name)) h = (h * 31 + ch.codePointAt(0)) >>> 0;
  return "var(" + TDOT[h % TDOT.length] + ")";
}

// A random number this browser made up. Hashed on the server before it is
// written down; it identifies a browser, never a person, and the only thing it
// buys is being able to take your own post back.
let device = "";
try {
  device = localStorage.getItem("board:device") || "";
  if (!device) { device = crypto.randomUUID(); localStorage.setItem("board:device", device); }
} catch { /* private window: it still works, it just forgets */ }

let posts = [], topic = "";
let photo = null;             // { data, type }
let liked = new Set();        // what this browser has already liked
try { liked = new Set(JSON.parse(localStorage.getItem("board:liked") || "[]")); } catch { /* fine */ }

/* People this reader does not want to see, kept in this browser and nowhere
 * else. There are no accounts here, so a block cannot be a thing done TO
 * somebody — it is a thing done to your own copy of the board. That is the
 * honest version and it has a property the server-side kind does not: it
 * cannot be used as a weapon, because nobody else is affected by it.
 *
 * It is per-browser, and it goes when site data goes. Said plainly on the
 * page rather than quietly true. */
let blocked = new Set();
try { blocked = new Set(JSON.parse(localStorage.getItem("board:blocked") || "[]")); } catch { /* fine */ }
const saveBlocked = () => {
  try { localStorage.setItem("board:blocked", JSON.stringify([...blocked])); } catch { /* fine */ }
};
let reported = new Set();
try { reported = new Set(JSON.parse(localStorage.getItem("board:reported") || "[]")); } catch { /* fine */ }


const initial = (name) => (String(name || "?").trim()[0] || "?").toLowerCase();

async function load() {
  try {
    const r = await fetch("/api/board", { headers: device ? { "x-board-device": device } : {} });
    const d = await r.json();
    posts = Array.isArray(d.posts) ? d.posts : [];
  } catch { posts = []; }
  draw();
}

function drawTopics() {
  const box = $("topics"); fill(box);
  const counts = new Map();
  for (const p of posts) if (p.topic) counts.set(p.topic, (counts.get(p.topic) || 0) + 1);

  // The datalist in the compose sheet, so posting under an existing topic is
  // picking one rather than spelling it the same way by luck.
  fill($("topiclist"),
    ...[...counts.keys()].map((t) => Object.assign(document.createElement("option"), { value: t })));

  if (!counts.size) { box.hidden = true; return; }
  box.hidden = false;

  const chip = (label, value, n, colour) => {
    const b = el("button", "chip");
    b.type = "button";
    b.setAttribute("aria-pressed", String(topic === value));
    if (colour) { const i = el("i", "dot"); i.style.background = colour; b.append(i); }
    b.append(el("span", null, label));
    if (n !== undefined) b.append(el("span", "n", String(n)));
    b.addEventListener("click", () => { topic = topic === value ? "" : value; draw(); });
    return b;
  };
  box.append(chip(T("board.everyone"), ""));
  for (const [t, n] of [...counts].sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]))) {
    box.append(chip(t, t, n, topicColour(t)));
  }
}

function draw() {
  drawTopics();
  $("rulelabel").textContent = T("board.newest", { topic: topic || T("board.everyone") });
  $("boardname").textContent = T("board.name");
  $("foottext").textContent = T("board.foot") + " ";
  $("count").textContent = posts.length
    ? T("board.count", { n: posts.length }) : T("board.tagline");

  const box = $("board"); fill(box);
  const list = posts.filter((p) => (!topic || p.topic === topic)
    && !blocked.has((p.handle || "").toLowerCase())
    // Somebody who has said they should not be looking at this should stop
    // looking at it now, not once a person gets round to the queue.
    && !reported.has(p.id));

  $("none").hidden = list.length > 0;
  if (!list.length) {
    fill($("none"),
      el("b", null, T(posts.length ? "board.none.head" : "board.empty.head")),
      el("p", null, T(posts.length ? "board.none.body" : "board.empty.body")));
    return;
  }
  for (const p of list) box.append(card(p));
}

function card(p) {
  const row = el("article", "post");
  row.append(el("div", "av", initial(p.handle)));

  const body = el("div", "body");

  if (p.topic) {
    const eb = el("div", "eyebrow");
    const dot = el("i");
    dot.style.background = topicColour(p.topic);
    eb.append(dot, el("span", null, p.topic));
    body.append(eb);
  }

  const line = el("div", "line");
  line.append(el("b", null, p.handle || T("board.someone")));
  const t = el("time", null, when(p.at));
  if (p.at) t.dateTime = p.at;
  line.append(t);
  body.append(line);

  if (p.photo) {
    const img = Object.assign(document.createElement("img"),
      { className: "pic", src: "/api/public-media?id=" + encodeURIComponent(p.photo),
        alt: "", loading: "lazy" });
    img.addEventListener("error", () => img.remove());
    body.append(img);
  }
  if (p.note) body.append(el("p", "words", p.note));
  // The same thing in Chinese where somebody supplied it: the point of a board
  // for people who cannot read the signs is that the answer can be held up to
  // the person behind the counter.
  if (p.zh) body.append(el("p", "zh", p.zh));
  if (p.py) body.append(el("p", "py", p.py));

  // ---- the actions --------------------------------------------------------
  const acts = el("div", "acts");
  const thread = el("div", "thread");
  thread.hidden = true;

  const act = (name, label, iconOnly) => {
    const b = el("button");
    b.type = "button";
    b.append(icon(name));
    if (iconOnly) { b.setAttribute("aria-label", label); b.title = label; }
    else b.append(el("span", null, label));
    acts.append(b);
    return b;
  };
  // Only the label of a button that has one. Icon-only buttons say it in the
  // aria-label, where a screen reader and a long-press both find it.
  const relabel = (b, words) => {
    if (b.lastChild && b.lastChild.nodeName === "SPAN") b.lastChild.textContent = words;
    else { b.setAttribute("aria-label", words); b.title = words; }
  };

  const nrep = (p.replies || []).length;
  const reply = act("reply", !nrep ? T("act.reply")
    : nrep === 1 ? T("act.reply1") : T("act.replies", { n: nrep }));
  reply.addEventListener("click", () => { thread.hidden = !thread.hidden; });

  const like = act("like", T("act.like"));
  if (p.likes) like.append(el("span", "n", String(p.likes)));
  if (liked.has(p.id)) like.classList.add("liked");
  like.addEventListener("click", async () => {
    // One per browser. Not a rule anybody could enforce — it is a courtesy to
    // the reader, so tapping twice does not read as two people.
    if (liked.has(p.id)) return;
    liked.add(p.id);
    try { localStorage.setItem("board:liked", JSON.stringify([...liked])); } catch { /* fine */ }
    like.classList.add("liked");
    await send({ like: p.id }, null);
  });

  // Only on your own. There are no accounts here, so the server decides this
  // from the browser's hash and sends back nothing but whether it is yours.
  if (p.mine) {
    const rm = act("remove", T("act.remove"));
    rm.addEventListener("click", async () => {
      if (!confirm(T("act.confirmRemove"))) return;
      rm.disabled = true;
      try {
        const r = await fetch("/api/post?id=" + encodeURIComponent(p.id), {
          method: "DELETE",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ device }),
        });
        if (!r.ok) throw new Error();
        await load();
      } catch { rm.disabled = false; relabel(rm, T("act.failed")); }
    });
  }

  if (!p.mine) {
    const rep = act("flag", T(reported.has(p.id) ? "act.reported" : "act.report"));
    rep.disabled = reported.has(p.id);
    rep.addEventListener("click", () => openReport(p));
  }

  let transPanel = null;
  if (translateOn) {
    const tr = act("globe", T("tr.thisPost"), true);
    const shown = el("div", "tpost");
    shown.hidden = true;
    tr.addEventListener("click", async () => {
      if (!shown.hidden) {
        shown.hidden = true; tr.removeAttribute("aria-pressed");
        relabel(tr, T("tr.thisPost")); return;
      }
      const source = [p.note, p.zh].filter(Boolean).join("\n");
      if (!source) return;
      relabel(tr, T("tr.working"));
      const out = await askTranslate(source);
      if (!out.error) tr.setAttribute("aria-pressed", "true");
      relabel(tr, out.error ? T("tr.thisPost") : T("tr.hide"));
      fill(shown);
      shown.hidden = false;
      shown.append(el("p", null, out.error || out.text));
      if (out.pinyin) shown.append(el("p", "py", out.pinyin));
      if (out.note) shown.append(el("p", "note", out.note));
    });
    // Held here and appended after the action row below, not into it: .acts is
    // a flex row, and a panel among the buttons wraps them.
    transPanel = shown;
  }

  const share = act("share", T("act.share"), true);
  share.addEventListener("click", async () => {
    // The board, not the root: the root is the landing page, and somebody sent
    // this link because of the post, not because of the explanation.
    const url = location.origin + "/board#" + p.id;
    const say = (words, hold) => {
      relabel(share, words);
      setTimeout(() => relabel(share, T("act.share")), hold || 2200);
    };
    // Inside WeChat there is no share sheet a page may open. The buttons in the
    // ⋯ menu are the only way, and pretending otherwise gives somebody a button
    // that does nothing. So: put the link on the clipboard, and say where the
    // real control is. Sending the page itself needs an Official Account and
    // the JS-SDK; until there is one, this is the honest version.
    if (IN_WECHAT) {
      say(T(copyText(url) ? "act.wxCopied" : "act.wxUseMenu"), 3600);
      return;
    }
    try {
      if (navigator.share) {
        await navigator.share({ title: T("board.name"), text: (p.note || "").slice(0, 120), url });
        return;
      }
    } catch (e) { /* dismissed: not a failure, say nothing */ return; }
    say(T(copyText(url) ? "act.copied" : "act.copyFail"));
  });

  body.append(acts);
  if (transPanel) body.append(transPanel);

  // ---- the thread, folded until asked for ---------------------------------
  for (const r of (p.replies || [])) {
    const rep = el("div", "rep");
    const rl = el("div", "line");
    rl.append(el("b", null, r.handle || T("board.someone")));
    const rt = el("time", null, when(r.at));
    if (r.at) rt.dateTime = r.at;
    rl.append(rt);
    rep.append(rl);
    if (r.note) rep.append(el("p", null, r.note));
    thread.append(rep);
  }
  const rbox = el("div", "rbox");
  const rin = Object.assign(document.createElement("input"),
    { placeholder: T("act.answer"), maxLength: 2000 });
  const rgo = el("button", null, T("act.send"));
  rgo.type = "button";
  rgo.addEventListener("click", async () => {
    const words = rin.value.trim();
    if (!words) return;
    let who = "";
    try { who = localStorage.getItem("board:who") || ""; } catch { /* fine */ }
    if (!who) { who = (prompt(T("act.answerAs")) || "").trim(); }
    if (!who) return;
    try { localStorage.setItem("board:who", who); } catch { /* fine */ }
    rgo.disabled = true; rgo.textContent = T("act.sending");
    const d = await send({ note: words, re: p.id, handle: who }, null);
    rgo.disabled = false; rgo.textContent = T("act.send");
    if (!d) { rgo.textContent = T("act.again"); return; }
    rin.value = "";
    // Said on the spot. A reply that is held and does not say so reads as a
    // reply that failed, and gets typed again.
    const said = el("p", "py", T(d.state === "published" ? "act.replyUp" : "act.replyHeld"));
    rbox.after(said);
    setTimeout(() => said.remove(), 6000);
  });
  rbox.append(rin, rgo);
  thread.append(rbox);
  body.append(thread);

  row.append(body);
  return row;
}

/** One way in for everything anybody posts — a note, a reply, a like. */
async function send(body, btn) {
  try {
    const r = await fetch("/api/post", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ ...body, device }),
    });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(d.error || "it did not go");
    if (body.like) await load();
    return d;
  } catch (e) {
    if (btn) say(e.message, true);
    return null;
  }
}

function say(msg, bad) {
  const s = $("said");
  s.hidden = !msg;
  s.textContent = msg || "";
  s.classList.toggle("bad", Boolean(bad));
}

// ---- reporting -------------------------------------------------------------

/* The reasons offered, and why these five.
 *
 * A free text box alone gets "this is bad" and nothing actionable. A list alone
 * cannot describe what somebody actually saw. Both, with the list first,
 * because the list is what makes a report legible in three seconds at the top
 * of a queue — and the four categories below are the ones that would actually
 * get a post taken down here. "I disagree with this" is not one of them, on
 * purpose. */
const REASON_KEYS = ["rep.r1", "rep.r2", "rep.r3", "rep.r4", "rep.r5"];
let reporting = null, reason = "";

function openReport(p) {
  reporting = p; reason = "";
  $("reporttitle").textContent = p.handle ? T("rep.title", { who: p.handle }) : T("rep.titleAnon");
  $("blockwho").textContent = p.handle || "them";
  $("alsoblock").checked = false;
  $("why").value = "";
  $("reportsaid").hidden = true;

  const box = $("reasons"); fill(box);
  for (const key of REASON_KEYS) {
    const r = T(key);
    const b = el("button", null, r);
    b.type = "button";
    b.setAttribute("aria-pressed", "false");
    b.addEventListener("click", () => {
      reason = reason === r ? "" : r;
      for (const other of box.children) {
        other.setAttribute("aria-pressed", String(other.textContent === reason));
      }
    });
    box.append(b);
  }
  $("reportsheet").hidden = false;
}
$("reportshut").addEventListener("click", () => { $("reportsheet").hidden = true; });
$("reportsheet").addEventListener("click", (e) => {
  if (e.target === $("reportsheet")) $("reportsheet").hidden = true;
});

$("reportform").addEventListener("submit", async (e) => {
  e.preventDefault();
  const said = $("reportsaid");
  const why = [reason, $("why").value.trim()].filter(Boolean).join(" — ");
  if (!why) {
    said.hidden = false; said.classList.add("bad");
    said.textContent = T("rep.needReason");
    return;
  }
  const p = reporting;
  // Blocking is this browser's own business and needs no server, so it happens
  // whether or not the report goes through.
  if ($("alsoblock").checked && p.handle) { blocked.add(p.handle.toLowerCase()); saveBlocked(); }

  try {
    const r = await fetch("/api/report", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ id: p.id, why, device }),
    });
    if (!r.ok) throw new Error();
    reported.add(p.id);
    try { localStorage.setItem("board:reported", JSON.stringify([...reported])); } catch { /* fine */ }
  } catch (err) {
    said.hidden = false; said.classList.add("bad");
    said.textContent = T("rep.failed");
    // Not sending is not a reason to keep showing it to the person who
    // objected, so it goes from their copy regardless.
    reported.add(p.id);
    await load();
    return;
  }
  said.hidden = false; said.classList.remove("bad");
  said.textContent = T("rep.sent");
  await load();
  setTimeout(() => { $("reportsheet").hidden = true; }, 1800);
});

// ---- putting something up --------------------------------------------------
function openSheet(open) {
  $("sheet").hidden = !open;
  if (open) {
    try { $("who").value = localStorage.getItem("board:who") || ""; } catch { /* fine */ }
    if (topic) $("topic").value = topic;
    $("note").focus();
  }
}
$("fab").addEventListener("click", () => openSheet(true));

/* WeChat on iOS scrolls the page to bring an input above the keyboard and then
   does not scroll back when it closes, leaving the board sitting half off the
   top of the screen with nothing to grab. Every browser gets this reset; it is
   a no-op where the bug does not exist. */
document.addEventListener("focusout", (e) => {
  if (!e.target || !/^(INPUT|TEXTAREA)$/.test(e.target.tagName)) return;
  setTimeout(() => {
    window.scrollTo(0, Math.min(window.scrollY, document.body.scrollHeight));
    document.body.scrollTop = document.body.scrollTop;
  }, 120);
}, true);
$("shut").addEventListener("click", () => openSheet(false));
$("sheet").addEventListener("click", (e) => { if (e.target === $("sheet")) openSheet(false); });
document.addEventListener("keydown", (e) => {
  if (e.key !== "Escape") return;
  openSheet(false);
  $("reportsheet").hidden = true;
});

$("pickpic").addEventListener("click", () => $("pic").click());
$("shotoff").addEventListener("click", () => { photo = null; $("shot").hidden = true; $("pic").value = ""; });
$("pic").addEventListener("change", async (e) => {
  const f = e.target.files && e.target.files[0];
  if (!f) return;
  if (f.size > 25 * 1024 * 1024) return say(T("post.tooBig"), true);
  const bytes = new Uint8Array(await f.arrayBuffer());
  let bin = "";
  // Chunked, because 20 MB spread as one argument list blows the stack.
  for (let i = 0; i < bytes.length; i += 8192) bin += String.fromCharCode(...bytes.subarray(i, i + 8192));
  photo = { data: btoa(bin), type: f.type };
  $("shotimg").src = URL.createObjectURL(f);
  $("shot").hidden = false;
  say("");
});

$("ask").addEventListener("submit", async (e) => {
  e.preventDefault();
  const note = $("note").value.trim();
  const who = $("who").value.trim();
  if (!note && !photo) return say(T("post.needWords"), true);
  if (!who) return say(T("post.needName"), true);
  try { localStorage.setItem("board:who", who); } catch { /* fine */ }

  $("send").disabled = true;
  const d = await send({
    note, handle: who, topic: $("topic").value.trim(),
    photo: photo ? photo.data : "", photoType: photo ? photo.type : "",
  }, $("send"));
  $("send").disabled = false;
  if (!d) return;

  $("note").value = ""; $("topic").value = "";
  photo = null; $("shot").hidden = true; $("pic").value = "";
  await load();
  if (d.state === "published") { openSheet(false); return; }
  // Said plainly and left on screen, because the post will not be on the board
  // and somebody who is not told that assumes it failed and posts it again.
  say(T("post.held"));
});

/* A person a reader can reach who is not this software. Printed only when the
   server was given one — an address that bounces is worse than none. */
fetch("/api/contact").then((r) => r.json()).then((d) => {
  if (!d || !d.contact) return;
  const box = $("contact");
  box.hidden = false;
  box.append(document.createTextNode(" Something wrong that a report cannot cover? "));
  const a = document.createElement("a");
  a.href = /@/.test(d.contact) ? "mailto:" + d.contact : d.contact;
  a.textContent = d.contact;
  a.style.color = "inherit";
  box.append(a, document.createTextNode("."));
}).catch(() => { /* no contact set: say nothing */ });

/* ---- translate -------------------------------------------------------------
 *
 * Always in the same place, above the +. Reading help on a bilingual board is
 * not an occasional need somebody goes looking for in a menu — it is the thing
 * half the readers want on half the posts, so it gets a fixed position and
 * never moves.
 *
 * The button is absent, not broken, when the server has no key for it. */
let translateOn = false;

function tsay(box, out) {
  fill(box);
  box.hidden = false;
  box.append(el("p", "said", out.text));
  if (out.pinyin) box.append(el("p", "py", out.pinyin));
  if (out.note) {
    const n = el("p", "note");
    n.append(el("b", null, T("tr.note")), document.createTextNode(out.note));
    box.append(n);
  }
}

const TR_ERR = { "slow-down": "tr.slow", busy: "tr.busy", unconfigured: "tr.off" };

async function askTranslate(text) {
  const r = await fetch("/api/translate", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ text, lang: lang(), device }),
  });
  const d = await r.json().catch(() => ({}));
  if (!r.ok || d.error) return { error: T(TR_ERR[d.error] || "tr.failed") };
  return d;
}

function openTranslate(prefill) {
  $("ttitle").textContent = T("tr.title");
  $("thint").textContent = T("tr.hint");
  $("tin").placeholder = T("tr.placeholder");
  $("tgo").textContent = T("tr.go");
  $("tshut").textContent = T("post.cancel");
  $("tin").value = prefill || "";
  $("tout").hidden = true;
  $("tsheet").hidden = false;
  if (!prefill) $("tin").focus();
}
$("tfab").addEventListener("click", () => openTranslate(""));
$("tshut").addEventListener("click", () => { $("tsheet").hidden = true; });
$("tsheet").addEventListener("click", (e) => {
  if (e.target === $("tsheet")) $("tsheet").hidden = true;
});
$("tform").addEventListener("submit", async (e) => {
  e.preventDefault();
  const text = $("tin").value.trim();
  const box = $("tout");
  if (!text) { fill(box); box.hidden = false; box.append(el("p", "said", T("tr.empty"))); return; }
  $("tgo").disabled = true; $("tgo").textContent = T("tr.working");
  const out = await askTranslate(text);
  $("tgo").disabled = false; $("tgo").textContent = T("tr.go");
  if (out.error) { fill(box); box.hidden = false; box.append(el("p", "said", out.error)); return; }
  tsay(box, out);
});

/* ---- the language switch ---------------------------------------------------
 *
 * A full repaint rather than walking the DOM swapping text: every string here
 * is already produced by a function, so re-running them is both simpler and
 * the only version that cannot go stale. The scroll position is kept, because
 * losing your place in a feed is what makes people not press it twice. */
function repaint() {
  const y = window.scrollY;
  drawMe();
  draw();
  window.scrollTo(0, y);
}
setLang(pickLang());
$("langslot").append(langButton(repaint));

fetch("/api/contact").then((r) => r.json()).then((d) => {
  translateOn = Boolean(d && d.translate);
  $("tfab").hidden = !translateOn;
  // The board is already drawn by the time this answers, and whether each post
  // gets a translate button depends on it. Without this the button appears or
  // not depending on which of two fetches won, which is how one language ended
  // up with five actions and the other four.
  if (translateOn) repaint();
  if (!d || !d.contact) return;
  const box = $("contact");
  box.hidden = false;
  box.append(document.createTextNode(" " + T("board.contact") + " "));
  const a = document.createElement("a");
  a.href = /@/.test(d.contact) ? "mailto:" + d.contact : d.contact;
  a.textContent = d.contact;
  a.style.color = "inherit";
  box.append(a, document.createTextNode("."));
}).catch(() => { $("tfab").hidden = true; });

/* ---- your own profile ------------------------------------------------------
 *
 * Drawn above the feed on every visit, whether or not there is one yet. A board
 * where the first thing you see is your own face is a different thing from a
 * board where you are anonymous until you post — and the empty state is the
 * important one, because it is what everybody sees first. */
let ME = null, MEPOSTS = 0, MEREPLIES = 0;

function asBase64(file) {
  return file.arrayBuffer().then((buf) => {
    const bytes = new Uint8Array(buf);
    let bin = "";
    for (let i = 0; i < bytes.length; i += 8192) bin += String.fromCharCode(...bytes.subarray(i, i + 8192));
    return btoa(bin);
  });
}

async function saveMe(patch) {
  const r = await fetch("/api/me", {
    method: "PUT",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ ...patch, device }),
  });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) {
    if (d.error === "contact") return { error: T("me.noContact", { what: d.what }) };
    return { error: T(d.error === "tooBig" ? "post.tooBig" : "err.general") };
  }
  ME = d.person;
  drawMe();
  return d;
}

function drawMe() {
  const box = $("me");
  fill(box);
  box.hidden = false;

  const cover = el("div", "cover" + (ME && ME.cover ? "" : " bare"));
  if (ME && ME.cover) {
    const img = Object.assign(document.createElement("img"),
      { src: "/api/public-media?id=" + encodeURIComponent(ME.cover), alt: "" });
    img.addEventListener("error", () => { img.remove(); cover.classList.add("bare"); });
    cover.append(img);
  }
  const cb = el("button", null, T(ME && ME.cover ? "me.edit" : "me.addCover"));
  cb.type = "button";
  cb.addEventListener("click", () => $("mecover").click());
  cover.append(cb);
  box.append(cover);

  const face = el("div", "meface");

  // The photo control IS the avatar. Adding a face should be one tap on the
  // thing that is missing one, not a trip through a settings screen.
  const shot = el("button", "shot");
  shot.type = "button";
  shot.setAttribute("aria-label", T("me.addPhoto"));
  const inner = el("span", "in");
  if (ME && ME.photo) {
    const img = Object.assign(document.createElement("img"),
      { src: "/api/public-media?id=" + encodeURIComponent(ME.photo), alt: "" });
    img.addEventListener("error", () => { img.remove(); inner.textContent = initial(ME && ME.handle); });
    inner.append(img);
  } else {
    inner.textContent = initial(ME && ME.handle);
  }
  shot.append(inner, el("span", "plus", "+"));
  shot.addEventListener("click", () => $("mephoto").click());
  face.append(shot);

  face.append(el("h2", null, (ME && ME.handle) || T("me.newHere")));

  if (ME && (MEPOSTS || MEREPLIES || ME.campus || ME.here)) {
    const facts = el("div", "facts");
    if (ME.campus) facts.append(el("span", null, ME.campus));
    if (ME.here) facts.append(el("span", null, ME.here));
    if (MEPOSTS) { const x = el("span"); x.append(el("b", null, String(MEPOSTS)), document.createTextNode(" " + T("me.posts"))); facts.append(x); }
    if (MEREPLIES) { const x = el("span"); x.append(el("b", null, String(MEREPLIES)), document.createTextNode(" " + T("me.replies"))); facts.append(x); }
    face.append(facts);
  }

  if (ME && ME.goal) face.append(el("p", "bio", ME.goal));
  if (ME && ME.photoPending) face.append(el("p", "pending", T("me.photoHeld")));

  if (!ME || !ME.handle) {
    face.append(el("p", "menote", T("me.setUp")));
    const go = el("button", "go primary", T("me.addPhoto"));
    go.type = "button";
    go.addEventListener("click", () => $("mephoto").click());
    face.append(go);
  } else {
    const go = el("button", "go", T("me.edit"));
    go.type = "button";
    go.addEventListener("click", openMe);
    face.append(go);
  }
  box.append(face);
}

for (const [input, key] of [["mephoto", "photo"], ["mecover", "cover"]]) {
  $(input).addEventListener("change", async (e) => {
    const f = e.target.files && e.target.files[0];
    e.target.value = "";
    if (!f) return;
    if (f.size > 25 * 1024 * 1024) { alert(T("post.tooBig")); return; }
    let who = "";
    try { who = localStorage.getItem("board:who") || ""; } catch { /* fine */ }
    const out = await saveMe({
      [key]: await asBase64(f), [key + "Type"]: f.type,
      ...(ME && ME.handle ? {} : { handle: who }),
    });
    if (out.error) alert(out.error);
    // No handle yet: the picture is up, so ask for the name while they are here.
    else if (!ME || !ME.handle) openMe();
  });
}

function openMe() {
  $("metitle").textContent = T("me.editTitle");
  $("mename").placeholder = T("me.name");
  $("mecampus").placeholder = T("me.campus");
  $("mehere").placeholder = T("me.here");
  $("megoal").placeholder = T("me.goal");
  $("mewhy").textContent = T("me.whyNoContact");
  $("meshut").textContent = T("post.cancel");
  $("mesave").textContent = T("me.save");
  $("mename").value = (ME && ME.handle) || "";
  $("mecampus").value = (ME && ME.campus) || "";
  $("mehere").value = (ME && ME.here) || "";
  $("megoal").value = (ME && ME.goal) || "";
  $("mesaid").hidden = true;
  $("mesheet").hidden = false;
  $("mename").focus();
}
$("meshut").addEventListener("click", () => { $("mesheet").hidden = true; });
$("mesheet").addEventListener("click", (e) => {
  if (e.target === $("mesheet")) $("mesheet").hidden = true;
});
$("meform").addEventListener("submit", async (e) => {
  e.preventDefault();
  const said = $("mesaid");
  const handle = $("mename").value.trim();
  if (!handle) { said.hidden = false; said.classList.add("bad"); said.textContent = T("post.needName"); return; }
  const out = await saveMe({
    handle, campus: $("mecampus").value.trim(),
    here: $("mehere").value.trim(), goal: $("megoal").value.trim(),
  });
  if (out.error) { said.hidden = false; said.classList.add("bad"); said.textContent = out.error; return; }
  // The name here is the name posts go out under, so the two stay in step.
  try { localStorage.setItem("board:who", handle); } catch { /* fine */ }
  said.hidden = false; said.classList.remove("bad"); said.textContent = T("me.saved");
  setTimeout(() => { $("mesheet").hidden = true; }, 900);
});

fetch("/api/me", { headers: device ? { "x-board-device": device } : {} })
  .then((r) => r.json())
  .then((d) => { ME = d.person; MEPOSTS = d.posts || 0; MEREPLIES = d.replies || 0; drawMe(); })
  .catch(() => drawMe());

load();
</script>
</body>
</html>
