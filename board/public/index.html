        try {
          await navigator.clipboard.writeText(m.card.wechat);
          copy.textContent = T("cards.copied");
        } catch {
          /* No clipboard permission, an insecure origin, or an older
             WebView — the id is on the screen either way, and a button that
             quietly did nothing would be worse than one that says so. */
          copy.textContent = m.card.wechat;
        }
      });
      got.append(copy);
      foot.append(got);
      /* Launching WeChat is only worth offering to somebody who is not already
         inside it, and only next to an id they can paste — on its own it is
         the dead button again. */
      /* "OPEN WECHAT" IS GONE. It was always half a button — WeChat has no
         link that opens a chat with somebody you have never spoken to, so all
         it could do was launch the app and abandon the person on whatever
         screen it was left on. It survived because there was nowhere else to
         talk. There is now: Messages is a real messenger, and a pair who have
         swapped cards are a pair who can write to each other here. So the
         button under a card is the conversation, and the id below it is for
         carrying the person off this board when they want to — which is what
         it was always actually for. */
      foot.append(el("p", "how", T("cards.idHow")));
      if (m.card.line) foot.append(el("p", "line", m.card.line));
    } else if (m.card && m.card.qr) {
      if (m.card.line) foot.append(el("p", "line", m.card.line));
    } else {
      /* MATCHED, AND NOBODY HAS MOVED YET.
       *
       * This was a dashed empty square saying their card was blank, which
       * described the wrong half of the situation: the match is the thing
       * that happened, and the reader is the one who can act on it. So it
       * says what the match is and offers the press that ends it — your
       * details and one line about yourself, sent to them.
       *
       * Not a message. It goes one way, it is read once, and there is
       * nothing to reply to; what comes back, if anything, is their card. */
      /* AND IT IS DRAWN, NOT DESCRIBED.
       *
       * This was four lines of prose per row — "You matched", "Neither of you
       * has sent anything yet", a button reading "Connect with Wei", and then
       * "Wei gets your WeChat and a line from you. You get theirs if they send
       * it back." Under a paragraph at the top of the screen saying much the
       * same thing again. Somebody scrolling a shelf of six matches read the
       * same explanation six times and the state of none of them at a glance.
       *
       * The thing being explained is two cards changing hands, which is a
       * picture: your face in a card, an arrow, their face in a card that is
       * still an outline. Sent, yours gets a tick and the arrow fills. Every
       * word under it then becomes a word about something already on screen,
       * so the words go. */
      const meet = el("div", "meet");
      meet.append(swapMark(m));
      if (m.gave) {
        const back = el("button", "back", T("cards.takeBack"));
        back.type = "button";
        back.addEventListener("click", async () => {
          back.disabled = true;
          await giveCard(m, false, "");
        });
        meet.append(back);
      } else {
        // Their name is on the row above it; a button that repeats it is a
        // longer button saying the same thing.
        const go = el("button", "give", T("cards.giveGo"));
        go.type = "button";
        go.addEventListener("click", () => openGive(m));
        meet.append(go);
      }
      foot.append(meet);
    }
    card.append(foot);
    list.append(card);
  }
}

/** THE SWAP, FINISHED — the two of you side by side with a link between.
 *  Only ever drawn when both cards have gone: it is a result, not a state. */
function done(m) {
  const box = el("div", "done2");

  /* TWO FACES OVERLAPPING, AND BOTH NAMES ON ONE LINE.
   *
   * It was two separate cards with an arrow between them, which draws the
   * TRANSACTION — this went there, that came back. The transaction is over.
   * What is true now is that these two people are joined, and two circles
   * overlapping say that in a way an arrow between two boxes cannot: there is
   * no longer a direction to read.
   *
   * "Hugo × Elena" rather than a sentence about them, for the same reason the
   * pills replaced the paragraph on the shelf: their names ARE the fact. */
  const pair = el("div", "pair");
  const faces = el("span", "faces");
  faces.append(faceInto(el("span", "f1"), (ME && ME.handle) || "", (ME && ME.photo) || ""));
  faces.append(faceInto(el("span", "f2"), m.handle, m.photo));
  pair.append(faces);

  const who = el("div", "pwho");
  const line = el("b");
  line.append(document.createTextNode((ME && ME.handle) || T("board.someone")));
  // A multiplication sign, not an ampersand: "&" reads as a list of two, "×"
  // reads as the two of them together, which is the thing that happened.
  line.append(el("i", "x", "\u00d7"));
  line.append(document.createTextNode(m.handle || T("board.someone")));
  who.append(line);
  /* THE TWO ROLES, which is why this pair is a pair at all — and the only
     thing from the old two-card drawing worth keeping, because a name tells
     you who and a role tells you why. */
  const mine = firstRole(ME && ME.say);
  const theirs = firstRole(m.say);
  if (mine && theirs) {
    who.append(el("span", null, mine + " \u00b7 " + theirs));
  }
  pair.append(who);
  box.append(pair);

  const head = el("p", "dhead");
  head.append(el("i", "tick", "\u2713"));
  head.append(document.createTextNode(T("cards.swapDone")));
  box.append(head);
  return box;
}

/** What somebody is, from their sentence — the left half, which is the half
 *  that says what they ARE rather than what they are after. */
function firstRole(say) {
  const r = Array.isArray(say) ? say.find((x) => x && x.me) : null;
  return r ? T("role.a." + r.me) : "";
}

/* oneCard and the link glyph are gone with the two-card drawing they made —
   see done(), which is two overlapping faces now. */

/** TWO CARDS CHANGING HANDS, drawn. Yours on the left, theirs on the right,
 *  an arrow between. Yours is solid once it has gone and carries a tick;
 *  theirs stays an outline until it comes back. Nothing in here is a label —
 *  the whole point is that the state is legible without reading. */
function swapMark(m) {
  /* THREE STATES NOW. `gone` is yours having gone; `back` is theirs having
     arrived while yours has not, which is the same picture read the other way
     — so the tick and the fill are on the other card and the arrow points at
     you. */
  const back = Boolean(m.card && !m.gave);
  const box = el("div", "hands" + (m.gave ? " gone" : back ? " back" : ""));

  const mine = el("span", "cc me");
  if (back) mine.classList.add("wait");
  // Your own face when you have one, so the left-hand card is recognisably
  // YOURS rather than a generic rectangle.
  mine.append(faceInto(el("span", "ph"), (ME && ME.handle) || "", (ME && ME.photo) || ""));
  if (m.gave) mine.append(el("i", "tick", "\u2713"));
  box.append(mine);

  const arw = el("span", "arw");
  arw.setAttribute("aria-hidden", "true");
  box.append(arw);

  const theirs = el("span", "cc them");
  /* THEIR FACE, DIMMED, RATHER THAN A QUESTION MARK. It is a card that has
     not arrived, not an unknown person — they are right there at the top of
     the row. */
  theirs.append(faceInto(el("span", "ph"), m.handle, m.photo));
  box.append(theirs);

  /* One line, and only because the two-card picture cannot say WHOSE move it
     is. Six words where there were forty. */
  if (back) theirs.append(el("i", "tick", "\u2713"));
  box.append(el("span", "cap",
    T(back ? "cards.capTheirs" : m.gave ? "cards.capSent" : "cards.capYours")));
  return box;
}

/* ---------------------------------------------------------------------------
 * Handing your card over, with a line attached
 *
 * WHY A LINE AT ALL. A card arriving on its own is a name and a WeChat id,
 * and the person receiving it has no idea which of their matches it is or
 * what the sender wants. The sender is the one with a reason to move, so the
 * sender is the one who writes it: one line about themselves, sent once,
 * together with the details.
 *
 * WHY IT IS NOT A MESSAGE. There is no reply to it and no second line. The
 * answer to a card is a card, and everything after that happens in WeChat,
 * where these people already are. A board that grows an inbox grows
 * moderation, read receipts and unanswered messages, none of which are the
 * thing this is for.
 *
 * WHY THE ID IS IN THIS SHEET. Somebody with no card of their own used to be
 * told to go to Profile, which meant leaving the match they were looking at
 * to fill in a form and find their way back. The one field it needs is here.
 * ------------------------------------------------------------------------- */

let GIVING = null;

function openGive(m) {
  GIVING = m;
  $("givetitle").textContent = T("give.head", { who: m.handle });
  $("givehint").textContent = matchLine(m) || T("give.hint", { who: m.handle });
  const note = $("givenote");
  note.placeholder = T("give.ph");
  note.value = "";
  $("givecount").textContent = T("give.count", { n: 200 });
  $("givemlbl").textContent = T("give.mine");
  const wx = $("givewx");
  wx.placeholder = T("give.wxPh");
  wx.value = (MYCARD && MYCARD.wechat) || "";
  $("givemhow").textContent = MYCARD && MYCARD.qr
    ? T("give.wxHowQr") : T("give.wxHow");
  $("giveshut").textContent = T("give.no");
  $("givego").textContent = T("give.go");
  $("givego").disabled = false;
  $("givesaid").hidden = true;
  $("givesheet").hidden = false;
  note.focus();
}

$("givenote").addEventListener("input", () => {
  $("givecount").textContent = T("give.count",
    { n: 200 - $("givenote").value.length });
});
$("giveshut").addEventListener("click", () => { $("givesheet").hidden = true; });
$("givesheet").addEventListener("click", (e) => {
  if (e.target === $("givesheet")) $("givesheet").hidden = true;
});

/** Give it, or take it back. One place, so both directions reload the shelf. */
async function giveCard(m, on, note) {
  try {
    const d = await fetch("/api/card/give", {
      method: "POST", headers: { "content-type": "application/json" },
      body: JSON.stringify({ device, who: m.id, on, note }),
    }).then((r) => r.json());
    if (d && d.error) return d.error;
  } catch { return "net"; }
  await loadMatches();
  return "";
}

$("giveform").addEventListener("submit", async (e) => {
  e.preventDefault();
  if (!GIVING) return;
  const go = $("givego");
  const said = $("givesaid");
  go.disabled = true;

  /* THE CARD IS SAVED FIRST, and the grant only if that worked. The other
     order hands somebody a permission to read a card that does not exist. */
  const wx = $("givewx").value.trim();
  if (wx && wx !== ((MYCARD && MYCARD.wechat) || "")) {
    try {
      await fetch("/api/card", {
        method: "PUT", headers: { "content-type": "application/json" },
        body: JSON.stringify({ device, wechat: wx, line: (MYCARD && MYCARD.line) || "" }),
      });
    } catch { /* reported by the give below, which will fail with nocard */ }
  } else if (!wx && !(MYCARD && MYCARD.qr)) {
    said.hidden = false;
    said.textContent = T("give.needWx");
    go.disabled = false;
    return;
  }

  const bad = await giveCard(GIVING, true, $("givenote").value.trim());
  if (bad) {
    said.hidden = false;
    said.textContent = T(bad === "nocard" ? "give.needWx" : "give.failed");
    go.disabled = false;
    return;
  }
  $("givesheet").hidden = true;
  GIVING = null;
});

/* The number on the tab: cards handed to you that you have not opened yet.
 * With no push in the mainland this is the entire notification system, so it
 * counts something that is genuinely new rather than the size of the shelf. */
function badgeCards() {
  const b = $("navcardsn");
  if (!b) return;
  const n = MATCHES.filter((m) => m.card && !SAWCARDS.includes(m.id)).length;
  b.hidden = n < 1;
  b.textContent = n ? String(n) : "";
}

/* SEEN MEANS LOOKED AT, NOT DRAWN.
 *
 * This lived inside drawCards, which runs on every load to fill a view that is
 * usually hidden — so a card was marked as read while its owner was on Browse
 * and the badge could never once appear. Found by opening the screen rather
 * than by reading it: everything rendered correctly and the number simply was
 * not there.
 *
 * So it is its own step, and showView is the only caller: the shelf has to be
 * the thing on screen before anything on it counts as seen. */
function markCardsSeen() {
  if ($("vcards") && $("vcards").hidden) return;
  let add = false;
  for (const m of MATCHES) {
    if (m.card && !SAWCARDS.includes(m.id)) { SAWCARDS.push(m.id); add = true; }
  }
  if (!add) return;
  SAWCARDS = SAWCARDS.slice(-200);
  try { localStorage.setItem("board:sawcards", JSON.stringify(SAWCARDS)); }
  catch { /* a badge is never worth failing on */ }
}

function drawFollowers() {
  const box = $("fols");
  const rule = $("folrule");
  fill(box);
  if (!FOLLOWERS.length) {
    box.hidden = true; rule.hidden = true; badgeFollowers(0);
    return;
  }
  box.hidden = false; rule.hidden = false;
  $("follabel").textContent = T("fol.head");

  const fresh = FOLLOWERS.filter((f) => FRESH.has(f.id));

  const tag = $("folnew");
  tag.hidden = !fresh.length;
  tag.textContent = fresh.length ? T("fol.new", { n: fresh.length }) : "";
  badgeFollowers(fresh.length);

  for (const f of FOLLOWERS) {
    const row = el("div", "folrow");
    const av = el("a", "av");
    av.href = "/p/" + encodeURIComponent((f.handle || "").toLowerCase());
    if (f.photo) {
      const img = Object.assign(document.createElement("img"),
        { src: "/api/public-media?id=" + encodeURIComponent(f.photo), alt: "", loading: "lazy" });
      img.addEventListener("error", () => { img.remove(); av.textContent = initial(f.handle); });
      av.append(img);
    } else {
      av.textContent = initial(f.handle);
    }

    const who = el("a", "who");
    who.href = av.href;
    who.style.textDecoration = "none";
    who.append(el("b", null, f.handle || T("board.someone")),
      el("span", null, [f.campus, f.type].filter(Boolean).join(" · ")));

    row.append(av, who);
    if (FRESH.has(f.id)) row.append(el("i", "dot"));

    const b = el("button", f.following ? "on" : "", T(f.following ? "bud.following" : "fol.back"));
    b.type = "button";
    b.addEventListener("click", async () => {
      const want = !f.following;
      f.following = want;
      b.textContent = T(want ? "bud.following" : "fol.back");
      b.classList.toggle("on", want);
      try {
        const r = await fetch("/api/follow", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ device, who: f.id, on: want }),
        });
        const d = await r.json().catch(() => ({}));
        if (!r.ok) {
          // Not a failure to be swallowed: they pressed Follow and the board
          // is asking for one thing back.
          if (d.error === "hidden" || d.error === "nopage") askToShow(d.error);
          throw new Error("no");
        }
        f.following = Boolean(d.following);
      } catch { f.following = !want; }
      b.textContent = T(f.following ? "bud.following" : "fol.back");
      b.classList.toggle("on", Boolean(f.following));
    });
    row.append(b);
    box.append(row);
  }

}

/** The count, on the tab whose page holds the list.
 *
 *  It was on Profile, which is the tab a person checks when they wonder
 *  whether anything has happened to them — and which opens their own page,
 *  where there is no list of followers. A number that leads somewhere the
 *  thing it counts is not is worse than no number. */
/* THE COUNT LIVES ON THE BELL NOW, and only there.
 *
 * It used to sit on the Browse tab, because the followers list sat under the
 * deck. The list moved into the tray and this did not — leaving a badge on a
 * tab that no longer holds the thing it was counting, and two notification
 * dots on one screen for one event. */
function badgeFollowers() {
  const b = $("navbrowsen");
  if (b) b.hidden = true;
}

/* THE ROW ABOVE THE DECK: your own card, in whichever of three states it is.
 *
 * It began as one thing — an ask for a photograph — and had to become three,
 * because the question it answers changes the moment you upload one. Your own
 * card is deliberately NOT in the deck (browsing your own photograph is not a
 * feature), so without this row there is nowhere in the app to see that your
 * face went up, and the only way to find out is to ask somebody else to look.
 *
 * No photograph        → add one, and the row is the control.
 * One, waiting on us    → say so. Held is not broken, and the difference
 *                         matters more to the person waiting than to anyone.
 * One, up               → their own face, and the way to their own page.
 *
 * Drawn from ME, which arrives after the first paint, so it is redrawn when
 * that lands and again whenever the profile is saved. */
function drawMine() {
  const box = $("mine");
  box.hidden = false;
  fill(box);

  const ring = el("span", "ring");
  const face = ME && ME.photo;
  if (face) {
    const img = Object.assign(document.createElement("img"),
      { src: "/api/public-media?id=" + encodeURIComponent(ME.photo), alt: "" });
    img.addEventListener("error", () => { img.remove(); ring.textContent = initial(ME && ME.handle); });
    ring.append(img);
  } else {
    ring.textContent = initial(ME && ME.handle);
    ring.append(el("i", null, "+"));
  }

  /* THREE STATES, AND IT WAS FOUR.
   *
   * The fourth said "You are in Browse — this is what everybody else sees",
   * to somebody whose face was up and whose switch was on. That is the state
   * where there is nothing to do, and a row at the top of the deck saying so
   * every single visit is the app talking about itself in the place people
   * came to look at other people. Where the fact belongs is the settings row
   * in the tray, which now carries it — and the way to your own page is the
   * Profile tab, which has been there the whole time.
   *
   * The three that survive all ASK FOR SOMETHING: a photograph, patience, or
   * the switch. None of them is a status.
   *
   * The switch state is not a nicety. Being in Browse is off by default on
   * every page made before it was on the form, so somebody with a face and a
   * name can be absent from a deck they think they are in. */
  const listed = Boolean(ME && ME.looking);
  const words = el("span");
  if (!face) {
    box.dataset.go = "photo";
    words.append(el("b", null, T("brw.mine")), el("span", null, T("brw.mineWhy")));
  } else if (ME.photoPending) {
    box.dataset.go = "held";
    words.append(el("b", null, T("brw.mineHeld")), el("span", null, T("brw.mineHeldWhy")));
  } else if (!listed) {
    box.dataset.go = "switch";
    words.append(el("b", null, T("brw.mineOff")), el("span", null, T("brw.mineOffWhy")));
  } else if (!(ME && ME.mail)) {
    /* A FOURTH ASK, AND THE LAST ONE OF THEM CHRONOLOGICALLY.
     *
     * The three above are about being seen; this one is about not losing the
     * page once you are. It comes after them on purpose — nothing is worth
     * keeping until there is something to keep — and it is here rather than
     * only behind the bell because a row in a tray behind an icon is a row
     * nobody finds, which is what happened. It goes the moment an address is
     * saved, like the other three. */
    box.dataset.go = "mail";
    words.append(el("b", null, T("brw.mineBack")), el("span", null, T("brw.mineBackWhy")));
  } else {
    box.hidden = true;
    return;
  }
  box.append(ring, words);
  if (face) box.append(el("span", "chev", "\u2192"));
}
/* One control, two destinations: the picker while there is nothing to look at,
 * their own page once there is. */
$("mine").addEventListener("click", () => {
  /* The row is only drawn when there is something to do, so every branch here
     goes to the thing that does it. Somebody already in Browse never sees it
     — their own page is the Profile tab.
     Read off the row rather than worked out again: the two would drift, and a
     row that asks for one thing and opens another is worse than no row. */
  if ($("mine").dataset.go === "photo") { $("mephoto").click(); return; }
  if ($("mine").dataset.go === "mail") { openBack(); return; }
  openMe();
});

/* ---- TURNED AWAY FOR BEING INVISIBLE -------------------------------------
 *
 * The server refuses a follow from somebody who is not in Browse themselves —
 * see /api/follow. What matters here is that the refusal is not an error
 * message but the next thing to do: one of these is a toggle they already have
 * and the other is a name they have not typed. Both open the same sheet, and
 * the sentence says which.
 */
async function askToShow(kind) {
  const say = T(kind === "nopage" ? "fol.needPage" : "fol.needShow");
  if (!confirm(say)) return;
  openMe();
}

function personCard(q, live) {
  const box = el("div", "pc");
  if (q.photo) {
    const img = Object.assign(document.createElement("img"),
      { src: "/api/public-media?id=" + encodeURIComponent(q.photo), alt: "", loading: "eager" });
    // Where they put the face. Absent or nonsense means the middle, which is
    // what object-fit does on its own.
    if (Number.isFinite(Number(q.photoAt))) img.style.objectPosition = "50% " + Number(q.photoAt) + "%";
    img.addEventListener("error", () => { img.remove(); box.prepend(el("div", "noshot", initial(q.handle))); });
    box.append(img);
  } else {
    box.append(el("div", "noshot", initial(q.handle)));
  }

  const scrim = el("div", "scrim");
  /* The name, the four letters beside it if they put them up, and — on your
     own card — that it is yours. On the same line because they are all things
     about this person, the size of a badge, not sections of their profile. */
  const line = el("div", "nameline");
  line.append(el("h2", null, q.handle || T("board.someone")));
  if (q.mine) line.append(el("b", "type you", T("brw.you")));
  /* ALREADY FOLLOWING THEM, SAID ON THE CARD. It was a button under the deck,
     in the primary slot, reading "Following" — which is a STATE and not an
     act: nothing happens when you press it except undoing something you meant.
     A first-time reader saw two equal buttons of which one was inert. States
     live on the thing they are about, so it is a mark beside the name, and the
     row below is left with the one button that does something. Only when it is
     already true; not following is a decision, and that keeps its button. */
  if (!q.mine && q.following) line.append(el("b", "type fol", T("brw.connected")));
  if (q.type) line.append(el("b", "type", q.type));
  /* Only if they put their level on their page. The mark is the level worn,
     so somebody who kept the number keeps the number. */
  // The crowns are off — see off.js.
  const rank = OFF.crowns ? 0 : stageFor(q.levelBand);
  if (rank) {
    const worn = el("b", "rank");
    worn.append(crownMark(rank, "1rem"));
    worn.append(el("span", null, stageName(rank)));
    line.append(worn);
  }
  scrim.append(line);
  /* THE SENTENCE GOES HERE, DIRECTLY UNDER THE NAME — see the block below that
     builds it, which used to run after the city and the bio and append to the
     bottom of the scrim. It is the one thing on this card that explains the
     whole product ("I am a Producer looking for a Performer"), and it was the
     last line, under a paragraph, where a thumb covers it. Name, then why they
     are on your screen, then the detail: two cards deep and somebody has
     learned how this board works without being told. */
  const psay = el("div", "psaywrap");
  scrim.append(psay);
  /* "BEIJING · BEIJING" WAS ON EVERY OTHER CARD. campus and here are two
     different questions — which campus, and how long they have been in the
     country — and plenty of people answer both with the name of a city. Two
     identical words with a dot between them read as a bug on the one screen
     that is supposed to make a stranger look like a person. */
  const where = [...new Set([q.campus, q.here].filter(Boolean))].join(" · ");
  if (where) scrim.append(el("p", "where", where));
  if (q.goal) scrim.append(el("p", "goal", q.goal));
  /* WHAT THEY ARE LOOKING FOR, ON THE CARD ITSELF. This is the half of the
     feature that works at eight people: a match needs two people to have
     followed each other, which is rare on a small board, but a label saying
     what somebody wants is useful the moment they tick it. What the two of
     you have in common is marked, and the rest is there to read. */
  /* THEIR SENTENCE, NOT THE ROOM'S LABEL.
   *
   * This card carried the rooms a person lands in — "Talent", "Hiring" — which
   * are the board's own words for a filing cabinet, and the same four labels
   * appeared under every face. What somebody actually wrote is "I am an Agent
   * looking for a Performer", and that is both more specific and the only
   * thing on the card a reader can act on.
   *
   * THE HALF THAT ANSWERS YOU IS MARKED. `shared` already says which rooms the
   * two of you have in common; the pill that put you there is the one worth
   * lighting up, because it is the reason this person is on your screen.
   *
   * The rooms stay as the fallback. Somebody who joined before the sentence
   * existed has no `say`, and an empty space under their name would be a
   * regression for the people who have been here longest. */
  if (!q.mine) {
    const shared = new Set((q.shared || []).map((x) => x.theirs));
    const says = Array.isArray(q.say) ? q.say : [];
    if (says.length) {
      /* ONE SENTENCE ON THE CARD, AND IT IS THE ONE THAT CONCERNS YOU.
       *
       * Somebody with two of them printed both, and over a photograph that is
       * four lines of pills wrapping into each other — "I am a Producer
       * looking for an Investor · I am a Performer looking for an Agent" —
       * which is not a sentence anybody reads, it is a shape.
       *
       * The card is answering one question: why is this person on my screen.
       * That has one answer, so the row shown is the one whose second half is
       * something I am, and the rest is a count. Nothing is hidden — their
       * page has all of it — and the count says there is more to see. */
      const mineRoles = new Set((ME && Array.isArray(ME.say) ? ME.say : [])
        .map((r) => r && r.me).filter(Boolean));
      const pick = says.find((r) => mineRoles.has(r.want)) || says[0];
      const line2 = el("p", "psay");
      /* "I am a Agent" — say.iam carries the article because the form after
         it is a dropdown, where the pill is a control rather than a word.
         Here it is prose, so the article travels with the role: role.a.*
         has both halves right for every one of them. */
      line2.append(document.createTextNode(T("brw.iam") + " "));
      line2.append(el("b", "pchip on", T("role.a." + pick.me)));
      line2.append(document.createTextNode(" " + T("say.lookingFor") + " "));
      // Lit when it is what you are: that is why they came up for you.
      line2.append(el("b", "pchip" + (mineRoles.has(pick.want) ? " on" : ""),
        T("role.a." + pick.want)));
      if (says.length > 1) {
        line2.append(el("span", "psaymore", T("brw.sayMore", { n: says.length - 1 })));
      }
      psay.append(line2);
    } else if (Array.isArray(q.rooms) && q.rooms.length) {
      const chips = el("div", "pchips");
      for (const r of q.rooms) chips.append(el("span", "pchip" + (shared.has(r) ? " on" : ""), T("room." + r)));
      psay.append(chips);
    }
  }
  box.append(scrim);

  /* On the card, not in the section header above it: this shares one person,
   * so it belongs on the one person.
   *
   * pointerdown is stopped here because the card is a drag surface — without
   * it, pressing share starts a flick, and the tap that follows lands on
   * whoever comes next. */
  if (live) {
    const sh = el("button", "share");
    sh.type = "button";
    const words = el("span", null, T("act.share"));
    sh.append(icon("share"), words);
    sh.addEventListener("pointerdown", (ev) => ev.stopPropagation());
    sh.addEventListener("click", (ev) => { ev.stopPropagation(); shareCard(q, words); });
    box.append(sh);
  }
  return box;
}

/* Share the person on the card.
 *
 * Their own page, not this one: /p/<name> carries their face and their line in
 * its link card, which is the thing WeChat renders in a chat, and it opens with
 * a Follow button for whoever taps it. Sharing this address instead would send
 * somebody a deck that starts at whoever happens to be first. */
function shareCard(q, label) {
  const url = location.origin + "/p/" + encodeURIComponent((q.handle || "").toLowerCase());
  const say = (words, hold) => {
    label.textContent = words;
    setTimeout(() => { label.textContent = T("act.share"); }, hold || 2200);
  };
  // Inside WeChat a page may not open a share sheet — the ⋯ menu is the only
  // way — so the honest version is to put the link on the clipboard and say
  // where the real control is.
  if (IN_WECHAT) { say(T(copyText(url) ? "act.wxCopied" : "act.wxUseMenu"), 3600); return; }
  if (navigator.share) {
    navigator.share({ title: q.handle || T("board.someone"),
                      text: (q.goal || "").slice(0, 120), url })
      .catch(() => { /* dismissed is not a failure */ });
    return;
  }
  say(T(copyText(url) ? "act.copied" : "act.copyFail"));
}

/** Who is in, and how many are outside. Two facts in one line.
 *
 *  THE POINT OF SHOWING A MEMBER THE QUEUE. Being inside something has no
 *  weight unless you can see the edge of it, and a member who can see the
 *  queue is the member who spends an invitation. It is a number and never a
 *  list: no name, no photograph, nothing that could tell anybody in here who
 *  is waiting — and below the floor the server sends null, so the line simply
 *  says how many people are in and stops. */
/* One person is not "1 people". English needs the second sentence and Chinese
   does not, so the choice is made here and both languages read right. */
const inside = (n) => T(n === 1 ? "brw.inside1" : "brw.inside", { n });
const atdoor = (n) => T(n === 1 ? "brw.atdoor1" : "brw.atdoor", { n });

/* THE QUEUE, DRAWN ONCE THE DECK IS THERE.
 *
 * Its own fetch rather than something bolted onto /api/me: this is the only
 * place that wants it, it is members-only on the server, and a 401 or 403 is
 * the ordinary answer for anybody who is not one — so a failure here leaves
 * the section hidden and says nothing. */
async function drawQueue() {
  const box = $("queue"), list = $("queuelist");
  if (!box) return;
  let d = null;
  try {
    const r = await fetch("/api/queue");
    if (!r.ok) return;
    d = await r.json();
  } catch { return; }
  if (!d || !Array.isArray(d.rows)) return;
  /* Rebuilt each time rather than toggled in place: the order changes when
     somebody vouches, so a list left as it was would show the old one. */
  /* THE HEAD IS THE WHOLE THING WHEN SHUT, so it has to earn the tap: the
     number in the mark, what they are waiting for as the eyebrow, and the
     first few names as the line under it. Names are the reason to open this —
     a member scrolling past "3 waiting" opens nothing, and a member who reads
     "Nadia, Liza, Chen" opens it because one of them might be somebody they
     know. That is the whole point of the list.

     The count is what is BEHIND the button — the people who agreed to be
     listed — and when the queue is longer it says so, rather than letting the
     two numbers on this screen quietly disagree. */
  /* THE HEAD SAYS WHAT THE LIST IS, because the list is under it either way.
     It used to lead with names, which was the right thing when it was a shut
     button somebody had to be persuaded to open — a member scrolling past
     "3 waiting" opens nothing and a member who reads three names opens it.
     Open by default, that job is done by the rows themselves, and the head
     goes back to the one thing nobody should have to work out: these people
     are OUTSIDE, and this is what a member can do about it. */
  const n = d.rows.length;
  fill($("queueh"));
  const mark = el("i", "qmark", String(n));
  if (n > 99) mark.classList.add("wide");
  const text = el("span", "qtext");
  text.append(el("b", null, T("brw.qlab")));
  text.append(el("em", null, n ? T("brw.qh", { n }) : T("brw.qnone")));
  text.append(el("span", null, Number(d.waiting) > n
    ? T("brw.qof", { n: d.waiting })
    : T("brw.qwhy")));
  $("queueh").append(mark, text);
  drawPairs(d.pairs);
  fill(list);
  if (!d.rows.length) {
    list.append(el("p", "qnone", T("brw.qnone")));
  } else {
    for (const w of d.rows) list.append(qRow(w));
  }
  box.hidden = false;
}

/** WHO OF THEM IS WAITING FOR YOU.
 *
 *  The list under this is in queue order, which is the order admission uses
 *  and the only order there should be. It is also thirty names a member
 *  cannot read anything into. This block is the same queue counted against
 *  the one thing that decides everything else here — their own sentence — so
 *  a member sees "three agents are waiting" instead of "thirty people are".
 *
 *  HIDDEN WHEN IT WOULD SAY NOTHING. The server sends a row only where
 *  somebody waiting is actually what this member asked for; no rows, no
 *  block. A panel reading zero three times is worse than no panel, and on a
 *  small board that is the usual case.
 */
function drawPairs(pairs) {
  const box = $("qpairs");
  if (!box) return;
  fill(box);
  const rows = Array.isArray(pairs) ? pairs : [];
  box.hidden = !rows.length;
  if (!rows.length) return;

  // "anyone" has no plural of its own — it is already a crowd. See ANYONE.
  const many = (r) => r === "anyone" ? T("role.a.anyone") : T("role.p." + r);

  box.append(el("b", null, T("brw.qpfor")));
  for (const p of rows) {
    const line = el("p", "qp");
    const n = el("b", null, T("brw.qpn", { n: p.waiting, who: many(p.want) }));
    line.append(n);
    /* The second number is the stronger one and needs the difference said:
       these are the ones whose own sentence points back at this member. */
    if (p.mutual) {
      line.append(el("span", null, " · "
        + T("brw.qpboth", { n: p.mutual, who: T("role.a." + p.me) })));
    }
    line.append(el("span", null, " · "
      + (p.inside ? T("brw.qpin", { n: p.inside }) : T("brw.qpnone"))));
    box.append(line);
  }
  /* NO "vouch and they move up" LINE HERE. The head two lines above this one
     already says it, and said twice in one card it reads as a nag. */
}

function qRow(w) {
  const row = el("div", "qrow");
  const av = el("span", "qav", w.photo ? "" : initial(w.name));
  /* Only released photographs reach this list — the server drops the id
     otherwise — so nothing here decides whether it may be shown. */
  if (w.photo) {
    const img = document.createElement("img");
    img.src = "/api/wait-media?id=" + encodeURIComponent(w.photo);
    img.alt = "";
    img.loading = "lazy";
    img.addEventListener("error", () => { img.remove(); av.textContent = initial(w.name); });
    av.append(img);
  }
  const mid = el("div", "qmid");
  const line = el("div", "qn");
  line.append(document.createTextNode(w.name));
  if (w.room) {
    line.append(document.createTextNode(" · "),
      el("em", null, T("waitroom." + w.room)));
  }
  mid.append(line);
  if (w.why) mid.append(el("small", null, w.why));
  const tags = el("div", "qtags");
  if (w.type) tags.append(el("span", null, w.type));
  if (w.want) tags.append(el("span", null, T("role.p." + w.want)));
  if (w.brought) tags.append(el("span", null, T("brw.qbrought", { n: w.brought })));
  /* WHO VOUCHED, NAMED. A member scrolling past "2 vouched" reads a number;
     the same row saying "Ivy vouched" is somebody they know standing behind a
     stranger, and that is the only thing on this list that moves anybody.
     Two names and then a count — three names is wider than the row. */
  if (w.vouches) {
    const names = (w.vouchedBy || []).map((n) => n || T("board.someone"));
    let tag = T("brw.qvouches", { n: w.vouches });
    if (names.length) {
      const who = names.slice(0, 2).join(T("brw.qjoin"));
      const rest = w.vouches - Math.min(2, names.length);
      tag = rest > 0 ? T("brw.qvplus", { who, n: rest }) : T("brw.qvby", { who });
    }
    tags.append(el("span", null, tag));
  }
  if (tags.childNodes.length) mid.append(tags);

  /* THE VOUCH, and it moves them one place — see queueOrder on the server.
     Optimistic, because the answer is a row in a file and the interesting
     case is the button feeling dead while a phone thinks about it; if the
     server disagrees the button goes back to where it was. */
  const v = el("button", "qv", T(w.mine ? "brw.vouched" : "brw.vouch"));
  v.type = "button";
  v.setAttribute("aria-pressed", w.mine ? "true" : "false");
  v.addEventListener("click", async () => {
    const was = v.getAttribute("aria-pressed") === "true";
    const now = !was;
    v.setAttribute("aria-pressed", now ? "true" : "false");
    v.textContent = T(now ? "brw.vouched" : "brw.vouch");
    v.disabled = true;
    try {
      const r = await fetch("/api/vouch", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ wait: w.id, on: now }),
      });
      if (!r.ok) throw new Error("no");
      /* Redrawn rather than nudged: vouching changes the order, and a list
         that says somebody moved up while leaving them where they were is
         worse than one that takes a moment. */
      drawQueue();
    } catch {
      v.setAttribute("aria-pressed", was ? "true" : "false");
      v.textContent = T(was ? "brw.vouched" : "brw.vouch");
      v.disabled = false;
    }
  });

  row.append(av, mid, el("span", "qpl", String(w.place)), v);
  return row;
}

/* The settings row's words. Static, but they still go through T so the tray
   reads in whichever language the rest of the page is in. */
function drawSetts() {
  if (!$("setts")) return;
  /* ONLY WHEN IT IS NEWS.
   *
   * This row said "You are in Browse · Everybody in here can see your card ·
   * Hide me" to every member on every visit, in a tray whose whole job is
   * telling somebody what has happened. Being in Browse is the ordinary state
   * and the state they chose; saying it every time is a settings page that
   * followed them around, and it was one of four blocks standing between a
   * new member and the one thing the bell is for.
   *
   * Being HIDDEN is worth saying, every time, because it is the state where
   * nothing works and nobody can see why — so the row stays for exactly that
   * case. Turning it back on is in the profile form either way. */
  /* TWO ROWS NOW, AND THEY APPEAR ON DIFFERENT CONDITIONS — so the block is
     shown when either of them has something to say, and each row decides for
     itself. It was one row and one condition, and adding the second under it
     meant the way back in was invisible to everybody who was not also hidden
     from Browse: which is nearly everybody, and exactly the people asking
     where it had gone. */
  const hidden = Boolean(ME && ME.handle && !ME.looking);
  const member = Boolean(ME && ME.handle);
  $("setts").hidden = !member;
  if (!member) return;
  $("incogrow").hidden = !hidden;
  $("settslab").textContent = T("set.head");
  if (hidden) drawIncog();
  drawMailRow();
}

function drawIncog() {
  /* IT SAID "COMING SOON" NEXT TO A CONTROL THAT ALREADY WORKS.
     "Show me in Browse" has been a real tick box in the profile form the
     whole time, so a row in the tray promising the same thing later was the
     tray telling somebody a lie about their own settings. It now says which
     way round they are and opens the box that changes it. */
  /* THE ROW SAYS WHICH WAY ROUND THEY ARE, not what the button does — a
     heading of "Hide me from Browse" above a button reading "Hide me" is the
     same words twice and never tells anybody their current state. This is
     where "You are in Browse" went when it came off the deck. */
  const out = Boolean(ME && ME.handle && !ME.looking);
  $("incoglab").textContent = T(out ? "set.incogOut" : "set.incogIn");
  $("incogwhy").textContent = T(out ? "set.incogOutWhy" : "set.incogInWhy");
  $("incoggo").textContent = T(out ? "set.incogBack" : "set.incogGo");
  /* Wired once. drawSetts runs on every paint and a listener added each time
     would fire the form open as many times as the tray has been drawn. */
  if (!$("incoggo").dataset.on) {
    $("incoggo").dataset.on = "1";
    $("incoggo").addEventListener("click", () => {
      /* THE SWITCH ITSELF IS NOT COPIED HERE. One control, in the form, next
         to the rooms it decides — two tick boxes for the same fact is how a
         profile ends up disagreeing with itself. This opens that one. */
      const tray = $("notif");
      if (tray) tray.hidden = true;
      openMe();
    });
  }

}

/* THE WAY BACK, SAID IN THE STATE IT IS IN. Same shape as the row above it:
 * what is true now, and a button that opens the one control.
 *
 * UNLIKE THAT ROW, IT IS HERE EVERY TIME. The rule next door is "only when it
 * is news", and it is the right rule for a state somebody chose. This is not
 * a state, it is the answer to "can I get back in if I lose this phone" — and
 * a row that only appears while the answer is no is a row nobody can find on
 * the day they want to change the address. The address itself is the label,
 * because "an address is saved" leaves somebody wondering which of theirs, and
 * nobody but its owner ever sees this tray. */
function drawMailRow() {
  // Not `has` — that is a helper this file already has, and shadowing it
  // inside a function that may one day call it is a bug waiting to be written.
  const gotMail = Boolean(ME && ME.mail);
  $("maillab").textContent = gotMail ? ME.mail : T("set.mailNo");
  $("mailwhy").textContent = T(gotMail ? "set.mailYesWhy" : "set.mailNoWhy");
  $("mailgo").textContent = T(gotMail ? "set.mailChange" : "set.mailAdd");
  if (!$("mailgo").dataset.on) {
    $("mailgo").dataset.on = "1";
    $("mailgo").addEventListener("click", () => {
      const tray = $("notif");
      if (tray) tray.hidden = true;
      openBack();
    });
  }
}

function drawDoor(people) {
  const box = $("atdoor");
  fill(box);
  /* Drawn off the numbers, not off the deck. It used to hide itself when
     there were no faces to show, which is exactly the board — nearly empty,
     with a queue outside — where the queue is worth the most. */
  const some = MEMBERS || people;
  box.hidden = !(some || WAITING);
  if (box.hidden) return;
  /* The queue first and in the loud voice. How many are already in is the
     reassuring half; how many want in is the interesting one.

     AND THE NUMBER IS THE WAY TO THE LIST. The list is under the deck, which
     on a phone is several screens down, behind a small grey button — findable
     if you know it is there and not otherwise. This line is at the top, it
     already says the number, and a member reading "35 are waiting to get in"
     is a member who wants to know who. Same words, now the door. */
  /* THE COUNT IS IN THE MASTHEAD NOW, so saying it again here is the same
     number twice on one screen — "2 people in the room. Invite only." above
     "2 people are in." — which reads as the app not knowing what it has just
     said. This line's job was always the QUEUE; how many are in was the
     reassuring half beside it. With nobody waiting there is nothing here to
     say, and the line goes. */
  /* AND IT CARRIES THE COUNT AGAIN. The note above is what was true when the
     masthead printed it: saying it twice on one screen read as the app not
     knowing what it had just said. The masthead does not print it any more —
     the top third of Browse was four things that never change — so this line
     is the only place the number lives, and it is the better one: a line in
     the body somebody reads, not chrome they stop seeing. */
  box.hidden = !(WAITING || some);
  box.classList.toggle("just", !WAITING);
  if (WAITING) {
    box.append(doorGo(atdoor(WAITING)));
    if (some) box.append(document.createTextNode(inside(some)));
  } else if (some) {
    box.append(el("b", null, T("board.inRoom", { n: some })));
  }
  // Kept in step for the screens that still show it — see the note on #count.
  if (some && $("count")) $("count").textContent = T("board.inRoom", { n: some });
}

/* The waiting number, as a way in when there is a list behind it.
 *
 * Plain text for anybody who is not a member: the queue is theirs to be in,
 * not theirs to read, and a control that goes nowhere is worse than a fact. */
function doorGo(words) {
  if (!(ME && ME.handle)) return el("b", null, words);
  const b = el("button", "doorgo", words);
  b.type = "button";
  b.append(el("span", "doorcar", "\u203A"));
  b.addEventListener("click", () => {
    const box = $("queue");
    // Nothing to open any more — the list is always open — so this just
    // takes them down to it.
    if (!box || box.hidden) return;
    box.scrollIntoView({ behavior: "smooth", block: "start" });
  });
  return b;
}

/* THE SAME TWO NUMBERS ON THE FEED.
 *
 * Its own function rather than a second call to drawDoor, because the one
 * above hangs off the deck: no faces drawn, no line. The feed has no deck to
 * wait for, and MEMBERS arrives with /api/me — so this draws as soon as the
 * numbers do, and says nothing until they have. */
function drawFeedDoor() {
  const box = $("feeddoor");
  if (!box) return;
  fill(box);
  if (!MEMBERS && !WAITING) { box.hidden = true; return; }
  /* NOT TWICE ON ONE SCROLL. These two were written as if Browse and the feed
     were separate pages. They are one document — the deck at the top, the
     posts under it — so a member scrolling down read "35 are waiting to get
     in" once above the faces and again above the posts, which makes the
     number look like a banner rather than a fact. Browse owns it when Browse
     is showing it; this is for the reader who has no deck above them. */
  const up = $("atdoor");
  if (up && !up.hidden && up.textContent.trim()) { box.hidden = true; return; }
  box.hidden = false;
  if (WAITING) box.append(el("b", null, atdoor(WAITING)));
  if (MEMBERS) box.append(document.createTextNode(inside(MEMBERS)));
}

function drawDeck() {
  $("brwlabel").textContent = T("brw.title");

  drawMine();
  // The sentence sits above the deck it decides — see the note in the markup.
  drawSays();

  const deck = $("deck");
  fill(deck);
  const people = PEOPLE.length;
  const n = deckLen();
  if (AT >= n) AT = 0;           // a photo arriving takes the last card away
  const mine = needsFace() && people > 0 && AT === people;
  // Nobody on the list is not an empty screen here — the feed is still under
  // it — so the whole block collapses to one small card that says so.
  deck.hidden = !n;
  $("pacts").hidden = !n;
  /* psafety is gone from this page — see the note where it used to be, and
     /privacy, which now carries it. */
  // Counted in people, not in cards: yours is the ask at the end, not the
  // fourth of four students.
  $("pcount").textContent = people && !mine ? T("brw.of", { n: AT + 1, total: people }) : "";
  drawDoor(people);
  drawQueue();
  drawSetts();
  $("bnone").hidden = Boolean(people);

  if (!n) {
    // Nobody to look at yet, so the only useful thing to offer is being the
    // first one. It used to point at the study-buddy list, which is this same
    // empty list with a different layout.
    const go = el("button", null, T("brw.mine"));
    go.type = "button";
    go.addEventListener("click", () => $("mephoto").click());
    fill($("bnone"), el("b", null, T("brw.none")), el("p", null, T("brw.noneBody")), go);
    return;
  }

  const at = (i, live) =>
    (needsFace() && i === people ? turnCard() : personCard(PEOPLE[i], live));

  /* A CARD WITH NO PHOTOGRAPH IS SHORTER.
   *
   * Every card is the same height, which is right when there is a face in it
   * and wrong when there is not: what fills it instead is one letter the size
   * of a hand, and the sentence — the only thing on the card anybody can act
   * on — is pushed under the fold. On a room this new most cards have no photo
   * yet, so that was the ordinary case rather than the exception.
   *
   * The words are the same words. They just have the room they need, and the
   * letter goes back to being the mark of a missing picture instead of the
   * card's whole content. */
  const shot = Boolean(PEOPLE[AT] && PEOPLE[AT].photo) || (needsFace() && AT === people);
  deck.classList.toggle("short", !shot);

  // The one behind, so moving on reveals a card rather than a hole.
  if (n > 1) {
    const behind = at((AT + 1) % n, false);
    behind.style.transform = "scale(.96) translateY(10px)";
    deck.append(behind);
  }
  const top = at(AT, true);
  deck.append(top);
  dragCard(top);

  const acts = $("pacts");
  fill(acts);
  if (mine) {
    // One button, and it is the picker. Nobody to follow on this card.
    const add = el("button", "primary", T("brw.mine"));
    add.type = "button";
    add.addEventListener("click", () => $("mephoto").click());
    acts.append(add);
    return;
  }
  const q = PEOPLE[AT];

  /* Your own card, which is in the deck now. A follow button on it would be a
   * button the server refuses — following yourself is not a thing anybody
   * means to do — so it offers the thing you would actually want from your own
   * card instead. */
  if (q.mine) {
    const ed = el("button", "primary", T("me.edit"));
    ed.type = "button";
    ed.addEventListener("click", () => openMe());
    const on2 = el("button", null, T("brw.next"));
    on2.type = "button";
    on2.addEventListener("click", nextPerson);
    acts.append(ed, on2);
    return;
  }

  /* CONNECT, NOT FOLLOW.
   *
   * THE WORD IS FOLLOW, and it went back and forth before it settled there.
   * It was Follow, then Connect — because "follow" is what you do to a feed
   * and puts whoever presses it a step below the person they pressed it on —
   * and then Connect was needed somewhere else and could not be in two places.
   *
   * This press is one-sided and costs nothing: it says you are interested and
   * waits to see whether they say it back. The press that actually introduces
   * two people is on the Cards shelf, where a card and a line about yourself
   * change hands, and that one is Connect. Two acts, two words, and the
   * bigger word on the bigger act. */
  const fol = el("button", "primary", "");
  fol.type = "button";
  /* THE MARK ON THE CARD IS THE SAME CONTROL. personCard puts "✓ Following"
     beside the name when it is already true, and if that were only a label
     there would be no way to undo a follow from this screen at all — the deck
     card does not open the profile, so the button below was the only path.
     So it is pressable, and it is not a second implementation: it runs the one
     handler below. */
  const chip = top.querySelector(".type.fol");
  if (chip) {
    chip.setAttribute("role", "button");
    chip.setAttribute("tabindex", "0");
    chip.setAttribute("aria-pressed", "true");
    chip.title = T("brw.connected");
    // The card is a drag surface; without this, pressing the mark starts a
    // flick and the tap lands on whoever comes next. Same reason as Share.
    chip.addEventListener("pointerdown", (ev) => ev.stopPropagation());
    chip.addEventListener("click", (ev) => { ev.stopPropagation(); fol.click(); });
    chip.addEventListener("keydown", (ev) => {
      if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); fol.click(); }
    });
  }
  const paintFollow = () => {
    fol.textContent = T(q.following ? "brw.connected" : "brw.connect");
    fol.classList.toggle("on", Boolean(q.following));
    fol.setAttribute("aria-pressed", String(Boolean(q.following)));
  };
  paintFollow();
  fol.addEventListener("click", async () => {
    const want = !q.following;
    // Shown at once, corrected if the box disagrees. A button that waits for a
    // round trip before it changes is a button somebody presses twice.
    q.following = want;
    paintFollow();
    try {
      const r = await fetch("/api/follow", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ device, who: q.id, on: want }),
      });
      const d0 = await r.json().catch(() => ({}));
      if (!r.ok) {
        if (d0.error === "hidden" || d0.error === "nopage") askToShow(d0.error);
        throw new Error("no");
      }
      const d = d0;
      q.following = Boolean(d.following);
      /* Stamped on this phone for the grade. The server knows the follow but
         not the day the reader pressed it — a follow row carries a date, but
         reading everybody's follow dates to score one person is a query this
         board has no business answering. A date in localStorage is all it
         needs and it never leaves the device. */
      if (d.following) {
        try {
          const t = new Date();
          localStorage.setItem("board:didfollow", t.getFullYear() + "-"
            + String(t.getMonth() + 1).padStart(2, "0") + "-"
            + String(t.getDate()).padStart(2, "0"));
        } catch { /* private window */ }
      }
    } catch { q.following = !want; }
    paintFollow();
    /* THE MARK AND THE ROW HAVE TO AGREE. The row used to be the only thing
       that changed, so repainting the button was the whole job; now the card
       carries the state too, and the row is one button or two depending on it.
       Redrawing the deck settles all three from one place — AT has not moved,
       so it is the same card, not the next one. */
    drawDeck();
  });
  const on = el("button", null, T("brw.next"));
  on.type = "button";
  on.addEventListener("click", nextPerson);
  /* TWO BUTTONS WHILE THERE IS A DECISION, ONE WHEN THERE IS NOT.
     Following is on the card now (see personCard), so a row that still carried
     it would be saying the same thing twice with the inert half in the loud
     slot. Somebody not yet followed gets Follow beside Next, as before, and
     Next takes the quiet button. Somebody already followed gets Next alone,
     full width, in the accent — because moving on is then the only thing left
     to do on this card.
     `fol` is still built and still wired either way: unfollowing is done by
     pressing the mark on the card, which calls the same handler. */
  if (q.following) {
    on.className = "primary";
    acts.append(on);
  } else {
    acts.append(fol, on);
  }
}

/* Flick to move on. Pointer events rather than touch events, so a mouse on a
 * laptop behaves the same as a thumb — and the card follows the finger, because
 * a gesture that only acts at the end of itself feels broken on the way. */
function dragCard(box) {
  let x0 = null, dx = 0;
  const go = (e) => {
    if (e.button !== undefined && e.button !== 0) return;
    x0 = e.clientX; dx = 0;
    box.style.transition = "none";
    box.setPointerCapture?.(e.pointerId);
  };
  const move = (e) => {
    if (x0 === null) return;
    dx = e.clientX - x0;
    box.style.transform = `translateX(${dx}px) rotate(${dx / 34}deg)`;
  };
  const end = () => {
    if (x0 === null) return;
    const far = Math.abs(dx) > 90;
    box.style.transition = "";
    if (far) {
      box.style.transform = `translateX(${dx > 0 ? 700 : -700}px) rotate(${dx / 12}deg)`;
      box.classList.add("gone");
      setTimeout(nextPerson, 190);
    } else {
      box.style.transform = "";
    }
    x0 = null;
  };
  box.addEventListener("pointerdown", go);
  box.addEventListener("pointermove", move);
  box.addEventListener("pointerup", end);
  box.addEventListener("pointercancel", end);
}

/* Arrow keys, but only while the deck is the thing on screen and nothing is
 * being typed into. A page-wide arrow handler on a page that is mostly a feed
 * would fight the scroll. */
document.addEventListener("keydown", (e) => {
  if (e.key !== "ArrowRight" && e.key !== "ArrowLeft") return;
  const a = document.activeElement;
  if (a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)) return;
  const r = $("deck").getBoundingClientRect();
  if (r.bottom < 80 || r.top > window.innerHeight - 80) return;
  nextPerson();
});

/* TWO TABS, TWO VIEWS.
 *
 * They were the two ends of one long document and the buttons scrolled
 * between them. That made Browse endless: a deck, the waiting list, then
 * everybody's posts running on underneath, with no point at which a member
 * had finished looking at people. A tab bar whose buttons scroll is not a tab
 * bar, it is a table of contents.
 *
 * One of the two is shown at a time now. The addresses stay real — /browse
 * and /feed are separate routes on the server and both serve this file — so a
 * link to either still lands in the right place, and history.pushState keeps
 * the back button meaning what it looks like it means.
 *
 * A HASH ALWAYS WINS. Shared posts are /feed#<id>, and somebody following one
 * has to land on the posts whatever tab they last had open.
 */
/* Whether this reader asked for the tab they are on, or simply arrived on it.
   The difference decides whether a feed with nothing in it is allowed to be
   the first thing they see. */
let VIEWCHOSE = false;

function viewNow() {
  /* AN ARRIVAL ALWAYS OPENS ON THE PEOPLE.
   *
   * /feed was the front of this board for most of its life, so every
   * home-screen icon added before today still opens there — and an icon opens
   * at the address it was installed with whatever the manifest says now.
   * Changing the manifest fixed nothing, and asking people to delete and
   * re-add an icon is a request rather than a fix.
   *
   * This was tried once as "correct it only when the feed is empty", which
   * was the wrong condition: it made a fix for cold arrivals depend on
   * whether anybody had posted. A cold arrival opens on Browse whether the
   * feed is busy or not.
   *
   * THE HASH IS THE EXCEPTION, and it is the one that matters: a shared post
   * is /feed#id, which is an arrival WITH a destination. Tapping the tab is
   * not an arrival at all — that goes through showView and is honoured. */
  /* /cards is honoured on arrival where /feed is not, and the difference is
     the reason /feed is not: no home-screen icon in the world was installed
     pointing at /cards, so an address bar reading /cards is somebody who
     asked for it just now — a reload, a bookmark, a link — rather than a
     four-year-old shortcut opening where the app used to live. */
  if (location.pathname === "/cards" || location.pathname === "/cards/") return "cards";
  if (location.hash && location.hash.length > 1) return "feed";
  return "browse";
}

/* WHAT THE ADDRESS ASKED FOR, READ BEFORE ANYTHING REWRITES IT.
 *
 * showView runs at the bottom of this script, on load, and an arrival at
 * /feed is corrected to /browse with a replaceState — which drops the query
 * string with it. The one thing that arrives with a query is "Edit your page"
 * on somebody's own profile, which sends them to /feed?edit=1 because the
 * form lives on this page; by the time /api/me lands and the arrival is
 * checked, the ?edit=1 has been gone for a second and the sheet never opens.
 *
 * So the link has been silently doing nothing since Browse became the front
 * of this place — it took somebody to Browse and left them there, which is
 * exactly what it looks like from the outside.
 *
 * Read here, once, above every line that rewrites the address. */
const CAME_TO_EDIT = new URLSearchParams(location.search).get("edit") === "1";

/* The three views and the address each one lives at. It was a boolean —
   feed or not-feed — which had exactly the right shape for two views and none
   at all for three: every line of showView had to name both halves, so adding
   a third meant editing all of them and hoping none was missed. A map is
   edited in one place. */
const VIEWS = { browse: "/browse", feed: "/feed", cards: "/cards" };

function showView(v, push) {
  if (!VIEWS[v]) v = "browse";
  for (const k of Object.keys(VIEWS)) {
    const box = $("v" + k);
    if (box) box.hidden = k !== v;
    const nav = $("nav" + k);
    if (nav) nav.setAttribute("aria-current", k === v ? "page" : "false");
  }
  showTranslate(v === "feed");
  /* Drawn on the way in rather than only when the data lands, so a tab tapped
     before /api/matches has answered shows the shelf it already has instead of
     an empty screen that fills in a second later. */
  if (v === "cards") { drawCards(); markCardsSeen(); badgeCards(); }
  const want = VIEWS[v];
  if (location.pathname !== want) {
    /* A TAP IS A NEW PLACE; AN ARRIVAL IS THE SAME PLACE, NAMED PROPERLY.
       Somebody whose icon opens /feed and lands on Browse should end up with
       /browse in the address bar — otherwise every reload, and every bookmark
       they take from here, keeps the old address alive. replaceState rather
       than push, so the back button does not gain a step nobody took. */
    try { history[push ? "pushState" : "replaceState"]({ v }, "", want); }
    catch { /* fine */ }
  }
  /* Switching a tab is arriving somewhere, and arriving somewhere means the
     top of it. Without this, a reader deep in the posts taps Browse and finds
     the deck already scrolled halfway down. */
  if (push) window.scrollTo(0, 0);
}

/* markNav was here. It watched the scroll position to decide which tab was
   lit, because the two views were one page and the answer changed as you
   moved. Now the view decides, and showView says so directly. */

/* The translate button belongs to the words, not to the faces.
 *
 * It is fixed to the bottom right, which is exactly where the deck's Say
 * hello / Next row lands — a floating button sitting on top of a button is a
 * tap that does the wrong thing. So it appears when the posts do. */
function showTranslate(onFeed) {
  if (onFeed === undefined) onFeed = $("navfeed").getAttribute("aria-current") === "page";
  $("tfab").hidden = !translateOn || !onFeed;
}
$("navbrowse").addEventListener("click", (e) => {
  if (e.metaKey || e.ctrlKey || e.shiftKey) return;
  e.preventDefault();
  VIEWCHOSE = true;
  showView("browse", true);
});
$("cardsnonego").addEventListener("click", () => {
  VIEWCHOSE = true;
  showView("browse", true);
});
$("navcards").addEventListener("click", (e) => {
  if (e.metaKey || e.ctrlKey || e.shiftKey) return;
  e.preventDefault();
  VIEWCHOSE = true;
  showView("cards", true);
});
$("navfeed").addEventListener("click", (e) => {
  if (e.metaKey || e.ctrlKey || e.shiftKey) return;
  e.preventDefault();
  /* Tapping the tab is a choice, and a choice is honoured even when the feed
     has nothing in it — somebody who taps Feed should see why it is quiet,
     not be bounced back to where they came from. */
  VIEWCHOSE = true;
  showView("feed", true);
});
// Back and forward mean the other tab now, which is what they look like they
// mean once the two are separate places.
window.addEventListener("popstate", () => showView(viewNow(), false));
showView(viewNow(), false);

function repaint() {
  const y = window.scrollY;
  paintNav();
  // The tutor's whole card is built in JavaScript, so a language change has to
  // rebuild it like everything else. Left out, he answered in English on a page
  // that had switched to Chinese.
  drawTutor();
  drawDeck();
  drawFollowers();
  drawMatches();
  /* The tray is built in JavaScript too, and the same trap as the tutor: left
     out, the Professor went on answering in English on a page that had
     switched to Chinese. */
  drawTodo();
  drawTalk();
  drawAsk();
  drawMyInvite();
  drawStake();
  draw();
  // Same reason as above: it has to know what Browse is showing, and draw()
  // is what redraws the deck.
  drawFeedDoor();
  window.scrollTo(0, y);
}
setLang(pickLang());
$("langslot").append(langButton(repaint));
paintNav();

fetch("/api/contact").then((r) => r.json()).then((d) => {
  translateOn = Boolean(d && d.translate);
  showTranslate();
  // The board is already drawn by the time this answers, and whether each post
  // gets a translate button depends on it. Without this the button appears or
  // not depending on which of two fetches won, which is how one language ended
  // up with five actions and the other four.
  if (translateOn) repaint();
  if (!d || !d.contact) return;
  const box = $("contact");
  box.hidden = false;
  box.append(document.createTextNode(" " + T("board.contact") + " "));
  const a = document.createElement("a");
  a.href = /@/.test(d.contact) ? "mailto:" + d.contact : d.contact;
  a.textContent = d.contact;
  a.style.color = "inherit";
  box.append(a, document.createTextNode("."));
}).catch(() => { $("tfab").hidden = true; });

/* ---- your own profile ------------------------------------------------------
 *
 * Drawn above the feed on every visit, whether or not there is one yet. A board
 * where the first thing you see is your own face is a different thing from a
 * board where you are anonymous until you post — and the empty state is the
 * important one, because it is what everybody sees first. */

async function saveMe(patch) {
  const payload = JSON.stringify({ ...patch, device });
  const mb = (payload.length / 1024 / 1024).toFixed(2);

  /* TWICE, THEN GIVE UP.
   *
   * A photograph going from a phone here to a box in Tokyo over mobile data
   * does not always arrive. The server's log for it is "request aborted" —
   * the body stopped coming — and what the browser tells the page is "Load
   * failed", which is not a sentence anybody can act on.
   *
   * One retry turns most of those into an upload that worked. The cost is a
   * photograph that arrived on the first attempt after all: its file stays on
   * disk unreferenced while the second one becomes the profile picture. A few
   * stray kilobytes is the right price for not telling somebody their face
   * would not upload when a second attempt would have carried it.
   *
   * Only the throw is retried — a connection that failed. A 4xx or 5xx is an
   * answer, and asking the same question again gets the same answer. */
  let r, err;
  for (let go = 0; go < 2; go++) {
    if (go) await new Promise((ok) => setTimeout(ok, 900));
    try {
      r = await fetch("/api/me", {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: payload,
      });
      err = null;
      break;
    } catch (e) { err = e; }
  }
  if (err) {
    console.error("profile save:", err);
    return { error: T("me.didNotGo", { mb }) };
  }
  const d = await r.json().catch(() => ({}));
  if (!r.ok) {
    // A page is a thing somebody puts up, so it is behind the same door a post
    // is. Taken there rather than told a number.
    if (toDoorIf(d, r.status)) return {};
    if (d.error === "contact") return { error: T("me.noContact", { what: d.what }) };
    /* Passed through as the server's word rather than translated here: the
       form knows which box it belongs under, and this function does not. */
    if (d.error === "mailTaken") return { error: "mailTaken" };
    return { error: T(d.error === "tooBig" ? "post.tooBig" : "err.general") };
  }
  ME = d.person;
  if (typeof d.waiting === "number") WAITING = d.waiting;
  if (typeof d.people === "number") MEMBERS = d.people;
  if (d.rank) RANK = d.rank;
  paintNav();
  // The list is made of what is on their page, so it is redrawn the moment
  // the page changes.
  drawTodo();
  drawTalk();
  /* Same reason as drawTodo above: the panel is only for a member, and
     loadMyInvite draws it before /api/me has landed — so it was deciding on
     an ME that did not exist yet and hiding itself from everybody. */
  drawAsk();
  // A face arriving takes the ask away — the row under the deck and the card
  // at the end of it both go.
  drawDeck();
  // "Set up your page" is only offered while there is no page. Without this it
  // stays on screen telling somebody to do the thing they have just done.
  drawTutor();
  if (!$("mesheet").hidden) drawMePic();
  return d;
}

for (const [input, key] of [["mephoto", "photo"]]) {
  $(input).addEventListener("change", async (e) => {
    const f = e.target.files && e.target.files[0];
    e.target.value = "";
    if (!f) return;
    if (f.size > 40 * 1024 * 1024) { alert(T("post.tooBig")); return; }
    let who = "";
    try { who = localStorage.getItem("board:who") || ""; } catch { /* fine */ }
    // Say something before the wait, not after. Re-encoding a large photo
    // takes a moment on a phone, and a control that does nothing visible is a
    // control somebody presses again.
    let shot;
    try {
      shot = await shrink(f, 1000);
    } catch (err) {
      alert(T("post.badPhoto") + " (" + (err && err.message || "?") + ")");
      drawMePic();
      return;
    }
    if (shot.error) { alert(shot.error); drawMePic(); return; }
    const out = await saveMe({
      [key]: shot.data, [key + "Type"]: shot.type,
      ...(ME && ME.handle ? {} : { handle: who }),
    });
    if (out.error) alert(out.error);
    // No handle yet: the picture is up, so ask for the name while they are here.
    else if ((!ME || !ME.handle) && $("mesheet").hidden) openMe();
  });
}

/* ---- WHERE THE FACE SITS -------------------------------------------------
 *
 * Dragged, not typed. A slider would be a number somebody has to map onto a
 * picture in their head; dragging the picture is the picture moving.
 *
 * SAVED WHEN THE DRAG ENDS, not while it moves — a request per pixel is a
 * request per pixel. The board redraws from the local number immediately, so
 * it is the network that waits, not the person.
 *
 * touch-action:none on the box, so a vertical drag on a phone moves the face
 * instead of scrolling the sheet. That is the one line that makes this work at
 * all on the device most of these photographs were taken on.
 */
let cropAt = 50, cropFrom = 0, cropWas = 50;

function drawCrop() {
  const wrap = $("crop"), img = $("cropimg");
  const has = Boolean(ME && ME.photo);
  wrap.hidden = !has;
  if (!has) return;
  cropAt = Number(ME.photoAt);
  if (!Number.isFinite(cropAt)) cropAt = 50;
  img.src = "/api/public-media?id=" + encodeURIComponent(ME.photo);
  img.style.objectPosition = "50% " + cropAt + "%";
  $("cropsay").textContent = T("me.cropSay");
}

(() => {
  const box = $("cropbox"), img = $("cropimg");
  if (!box) return;
  const at = (v) => {
    cropAt = Math.max(0, Math.min(100, Math.round(v)));
    img.style.objectPosition = "50% " + cropAt + "%";
  };
  box.addEventListener("pointerdown", (e) => {
    if (!(ME && ME.photo)) return;
    box.setPointerCapture(e.pointerId);
    box.classList.add("hold");
    cropFrom = e.clientY; cropWas = cropAt;
  });
  box.addEventListener("pointermove", (e) => {
    if (!box.hasPointerCapture || !box.classList.contains("hold")) return;
    /* Dragging DOWN should bring the top of the photograph into view, which
       means the percentage goes down — the opposite of the finger. Backwards
       once and it feels broken in a way nobody can name. */
    at(cropWas - ((e.clientY - cropFrom) / box.clientHeight) * 100);
  });
  const done = async () => {
    if (!box.classList.contains("hold")) return;
    box.classList.remove("hold");
    if (!ME || cropAt === Number(ME.photoAt)) return;
    const out = await saveMe({ photoAt: cropAt });
    if (out && out.error) alert(out.error);
  };
  box.addEventListener("pointerup", done);
  box.addEventListener("pointercancel", done);
})();

/* The avatar inside the editor. Same picture, same picker, drawn from ME so it
 * updates the moment the upload comes back. */
function drawMePic() {
  drawCrop();
  const box = $("mepicin");
  fill(box);
  if (ME && ME.photo) {
    const img = Object.assign(document.createElement("img"),
      { src: "/api/public-media?id=" + encodeURIComponent(ME.photo), alt: "" });
    img.addEventListener("error", () => { img.remove(); box.textContent = initial(ME && ME.handle); });
    box.append(img);
  } else {
    box.textContent = initial(ME && ME.handle);
  }
  $("mepicgo").setAttribute("aria-label", T("me.addPhoto"));
  /* Three states, not two. A photo that is waiting to be read has to say so
     somewhere, and the block that used to say it is off the page. */
  $("mepicsay").textContent = !(ME && ME.photo) ? T("me.needPhoto")
    : ME.photoPending ? T("me.photoHeld") : "";
}

/* ---- the key: being the same person on a second browser --------------------
 *
 * WeChat's webview and Safari do not share storage, so the same person opening
 * the same link in each is two people to this board — which is the problem an
 * email login would be bought to solve. It does not need one. The identity
 * here is a random number this browser made up; everything on the server hangs
 * off a salted hash of it. Carrying the number to the other browser carries
 * the person, with no email address, no password, and nothing new written down
 * about anybody.
 *
 * The cost is stated where it is shown: whoever has the line IS you, and there
 * is nobody to appeal to if it is lost. That is the price of holding nothing.
 */

/* ---------------------------------------------------------------------------
 * Deleting everything
 *
 * IT LISTS WHAT GOES BEFORE IT GOES. A confirmation that only asks "are you
 * sure?" makes somebody guess at what they are agreeing to, and the guess is
 * usually smaller than the truth — most people think this hides a profile.
 * It does not: it takes out the messages, both sides of them, and every card
 * anybody was given.
 *
 * And it says what stays, in the same breath, because the two rows that stay
 * would otherwise be a surprise found later. See forget() in store.js.
 * ------------------------------------------------------------------------- */
function drawGone() {
  $("gonetitle").textContent = T("gone.head");

  $("gonesaid").hidden = true;
}
$("gonego").addEventListener("click", () => {

  $("gonesheet").hidden = false;
});
$("goneshut").addEventListener("click", () => { $("gonesheet").hidden = true; });
$("gonesheet").addEventListener("click", (e) => {

});
$("goneform").addEventListener("submit", async (e) => {
  e.preventDefault();
  const go = $("gonedo");
  const said = $("gonesaid");
  go.disabled = true;
  said.hidden = false;
  said.textContent = T("gone.going");
  try {
    const r = await fetch("/api/me/forget", {
      method: "POST", headers: { "content-type": "application/json" },
      body: JSON.stringify({ device, sure: "forget" }),
    });
    if (!r.ok) throw new Error("no");
  } catch {
    said.textContent = T("gone.failed");
    go.disabled = false;
    return;
  }
  /* THE BROWSER IS CLEARED TOO, and this is the half people forget. The server
     has nothing left, but the device id in localStorage is the identity — left
     behind, the next visit is a browser claiming to be somebody who no longer
     exists, and every screen would be half-empty rather than new. */
  try { localStorage.clear(); } catch { /* nothing to do about it */ }
  try { sessionStorage.clear(); } catch { /* same */ }
  location.replace("/?gone=1");
});

/* ---------------------------------------------------------------------------
 * The address, and the door on top of the key
 *
 * The key underneath this is the identity and it is not going anywhere. What
 * it is not is a thing most people have met: they do not save it, and they
 * find out what it was for on the day they change phone and everything they
 * wrote is under a hash nobody can produce any more.
 *
 * So an address, optional, never shown to anybody — see shownPerson on the
 * server, which drops it for every reader but its owner. Six digits come back
 * to it and do exactly what pasting a key does: the browser is handed a key
 * and stores it. One mechanism, a door people recognise.
 * ------------------------------------------------------------------------- */
/* ONE QUESTION, ON ITS OWN SCREEN.
 *
 * It was the last block of the profile form, which meant "add a way back in"
 * opened "edit your page" — a long form about a university, languages and a
 * bio, with the one box being asked about at the bottom of it. Those are not
 * the same act and it read as the wrong screen, because it was.
 *
 * Saved through the same route as the rest of a profile: the address is a
 * field on the person row like any other, and a route of its own would be a
 * second way to write the same field. */
function openBack() {

     address lives on the row, and a box that keeps showing what somebody typed
     after the save was refused is a box that lies about what is stored. */
  $("mailin").value = (ME && ME.mail) || "";
  $("backsaid").hidden = true;
  $("backsheet").hidden = false;

}

$("backform").addEventListener("submit", async (e) => {
  e.preventDefault();

    said.textContent = T("mail.bad");

    said.hidden = false; said.classList.add("bad");
    said.textContent = out.error === "mailTaken" ? T("mail.taken") : out.error;
    return;
  }
  said.hidden = false; said.classList.remove("bad");
  said.textContent = T(mail ? "mail.saved" : "mail.cleared");
  setTimeout(() => { $("backsheet").hidden = true; }, 900);
});

/* Which of the two steps the sheet is on, and the address it is working with.
   On the sheet rather than read out of the box each time: the address box is
   hidden once the digits are asked for, and a hidden box is still editable by
   anything that can reach the DOM. */
let INSTEP = "mail", INMAIL = "", INOVER = false;
