/* THE REPORT CARD: one fold over the card of the day and the two tests.
 *
 * WHY A SUMMARY AND NOT JUST A TITLE. Collapsed, this is the only thing three
 * blocks have left on the screen, so it has to say whether there is anything
 * to do inside it. A heading that reads the same whether today's card is
 * waiting or done is a heading nobody opens twice.
 *
 * WHEN IT STARTS OPEN. When there is something to do — nothing taken yet, or
 * today's card unanswered — and closed once both are behind them. That keeps
 * the daily habit in front of somebody without keeping the whole block in
 * front of everybody for ever. Shutting it by hand sticks for the day: the
 * point of a fold nobody can keep shut is lost on the person who wanted it
 * shut.
 */
const PROFSHUT = "board:profshut";
let PROFOPEN = null;   // null until decided once, then whatever it is
const dayStamp = () => {
  const d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0")
    + "-" + String(d.getDate()).padStart(2, "0");
};
const readLocal = (k) => {
  try { return JSON.parse(localStorage.getItem(k) || "null"); } catch { return null; }
};

/* ---- the grade ---------------------------------------------------------------
 *
 * A letter a day, from three places: what you practised, what you did here, and
 * what came back to you. It is the headline of the report card because it is
 * the one line somebody can compare with yesterday without reading anything.
 *
 * THE RULE THAT MAKES POPULARITY SAFE TO INCLUDE: points are only ever EARNED.
 * Nothing subtracts. A quiet day cannot pull a grade down — it can only fail to
 * push it up — and the TARGET moves with what the board actually offered, so on
 * a day when nobody posted there was nothing to react to, the bar drops, and
 * answering your own card is an A. Graded against other people's mood, this
 * would hand somebody a C for a day the board was asleep, which is the fastest
 * way to make a person stop opening it.
 *
 * AND THERE IS NO GRADE FOR ABSENCE. If the points you control come to nothing
 * — no card, no post, no reply — the day has no grade at all, whatever anybody
 * else did. A letter is a judgement on a day somebody spent; a day they did not
 * spend here is not a failing day, it is not a day. F exists and is reachable,
 * but only by turning up and getting almost nothing, never by staying away.
 *
 * IT IS PRIVATE AND IT IS NEVER RANKED. Yours, on your own card, against your
 * own yesterday. A visible grade on a board of twenty-five is a popularity
 * table with a letter on it, and that is a different product.
 *
 * THE BREAKDOWN IS NOT OPTIONAL. Every row below is a real event with a real
 * number beside it, and one tap shows all of them. A grade nobody can take
 * apart is a grade nobody believes past the first week.
 */
const GRADEKEY = "board:grades";

/** Local day, the same shape the rest of the app uses. */
const dayOf = (d) => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0")
  + "-" + String(d.getDate()).padStart(2, "0");

function gradeToday() {
  const today = dayOf(new Date());
  /* EVERY ROW KNOWS WHOSE IT IS. Not for the arithmetic — a point is a point —
     but for the ORDER they are read in, which is the whole difference between
     a card that says you are wanted and a card that says you are trying hard.
     "4 people opened your page" first; "answered your card, followed somebody"
     second. Same points, same letter, and only one of those two readings makes
     somebody close the app. */
  const rows = [];
  const add = (key, n, arg, mine) => { if (n > 0) rows.push({ key, n, arg, mine: Boolean(mine) }); };

  /* ---- what you practised. Entirely yours, and it is most of the grade. */
  const deck = readLocal("board:daily") || {};
  const answered = deck.done === today;
  if (answered) {
    add("grade.card", 3, null, true);
    // "Knew it" without asking to be shown: the deck only moves up on a run of
    // them, so this is the one it is worth paying for.
    if ((deck.run || 0) > 0) add("grade.knew", 2, null, true);
    add("grade.streak", Math.min(3, deck.run || 0), { n: deck.run || 0 }, true);
    if (deck.moved === "up") add("grade.levelUp", 4, null, true);
  }

  /* ---- what you did here. Also yours. */
  const mine = ME && ME.handle ? ME.handle.toLowerCase() : "";
  const todayPost = (p) => String(p.at || "").slice(0, 10) === today;
  const myPosts = posts.filter((p) => (p.handle || "").toLowerCase() === mine && mine);
  add("grade.posted", 3 * myPosts.filter((p) => store_isOwn(p) && todayPost(p)).length, null, true);
  add("grade.replied", 2 * myPosts.filter((p) => p.re && todayPost(p)).length, null, true);
  let followedToday = "";
  try { followedToday = localStorage.getItem("board:didfollow") || ""; } catch { /* fine */ }
  if (followedToday === today) add("grade.followed", 1, null, true);

  /* The half of the grade you control. Read off the flags rather than off the
     position in the list, so the rows can be re-ordered for reading without
     quietly changing what counts as showing up. */
  const own = rows.filter((r) => r.mine).reduce((a, r) => a + r.n, 0);

  /* ---- what came back. Capped, so a busy day for your page cannot become the
     whole grade, and never negative on a day nobody looked. */
  const seen = Number(((ME && ME.views) || {})[today] || 0);
  add("grade.opened", Math.min(4, seen), { n: seen });
  const newFollowers = FOLLOWERS.filter((f) => String(f.at || "").slice(0, 10) === today).length;
  add("grade.gotFollowed", 3 * newFollowers, { n: newFollowers });
  const myIds = new Set(myPosts.filter(store_isOwn).map((p) => p.id));
  const gotReplies = posts.filter((p) => p.re && myIds.has(p.re) && todayPost(p)
    && (p.handle || "").toLowerCase() !== mine).length;
  add("grade.gotReply", 3 * gotReplies, { n: gotReplies });

  /* A match has no date on it, so "new" is the first time this browser has seen
     it — the same way a new follower is worked out. Kept per match rather than
     as a count, so an old match cannot be paid for twice. */
  let sawMatches = [];
  try { sawMatches = JSON.parse(localStorage.getItem("board:sawmatches") || "[]"); } catch { /* fine */ }
  const fresh = MATCHES.filter((m) => !sawMatches.includes(m.id));
  add("grade.match", 5 * fresh.length, { n: fresh.length });
  if (fresh.length) {
    try {
      localStorage.setItem("board:sawmatches",
        JSON.stringify([...sawMatches, ...fresh.map((m) => m.id)].slice(-50)));
    } catch { /* fine */ }
  }

  const pts = rows.reduce((a, r) => a + r.n, 0);

  /* THE TARGET MOVES WITH THE BOARD. Eight on a day nobody posted — a card and
     a streak clears it — rising by one for each post somebody else made, to
     fourteen. On a busy board you are expected to have joined in. */
  const others = posts.filter((p) => store_isOwn(p) && todayPost(p)
    && (p.handle || "").toLowerCase() !== mine).length;
  const target = Math.min(14, 8 + others);

  const letter = !own ? "" : gradeLetter(pts / target);
  return { letter, pts, target, rows, own, today };
}

/** Where the bands sit. A+ is hitting the target, not exceeding it: the target
 *  already moved to meet the day, and a grade nobody can reach is a grade
 *  nobody plays for. */
function gradeLetter(r) {
  if (r >= 1) return "A+";
  if (r >= 0.85) return "A";
  if (r >= 0.7) return "B";
  if (r >= 0.55) return "C";
  if (r >= 0.35) return "D";
  return "F";
}

/** Today's, written down so tomorrow has a yesterday. Fourteen days kept: the
 *  strip shows a week and the comparison needs one more than it shows. */
function saveGrade(g) {
  if (!g.letter) return;
  let all = readLocal(GRADEKEY) || {};
  if (typeof all !== "object" || Array.isArray(all)) all = {};
  all[g.today] = g.letter;
  const keys = Object.keys(all).sort().slice(-14);
  const out = {};
  for (const k of keys) out[k] = all[k];
  try { localStorage.setItem(GRADEKEY, JSON.stringify(out)); } catch { /* fine */ }
}

/** The letters of the last seven days, oldest first, "" for a day with none. */
function gradeWeek() {
  const all = readLocal(GRADEKEY) || {};
  const out = [];
  for (let i = 6; i >= 0; i--) {
    const d = new Date();
    d.setDate(d.getDate() - i);
    out.push({ day: dayOf(d), letter: all[dayOf(d)] || "" });
  }
  return out;
}

let GRADEOPEN = false;

let GRADE = null;

function drawGrade(box) {
  const g = gradeToday();
  GRADE = g;
  saveGrade(g);
  const all = readLocal(GRADEKEY) || {};
  const y = new Date();
  y.setDate(y.getDate() - 1);
  const yest = all[dayOf(y)] || "";

  const wrap = el("div", "grade");
  const top = el("div", "gtop");
  const big = el("b", "gbig" + (g.letter ? "" : " none"), g.letter || "—");
  top.append(big);

  const side = el("div", "gside");
  if (g.letter) {
    side.append(el("p", "gof", T("grade.of", { n: g.pts })));
    if (yest) side.append(el("p", "gyest", T("grade.yesterday", { g: yest })));
  } else {
    side.append(el("p", "gof", T("grade.none")));
    side.append(el("p", "gyest", T("grade.noneWhy")));
  }
  top.append(side);

  /* The arithmetic, one tap away. A question mark rather than an icon: at this
     size an icon is a smudge somebody has to guess at. */
  if (g.letter) {
    const ask = el("button", "gask", "?");
    ask.type = "button";
    ask.setAttribute("aria-expanded", String(GRADEOPEN));
    ask.setAttribute("aria-label", T("grade.why"));
    ask.addEventListener("click", () => { GRADEOPEN = !GRADEOPEN; drawNews(); });
    top.append(ask);
  }
  wrap.append(top);

  if (g.letter && GRADEOPEN) {
    const why = el("div", "gwhy");
    why.append(el("p", "gwhyhead", T("grade.why")));
    // What came back first, what you did second. See the note in gradeToday.
    for (const r of [...g.rows.filter((r) => !r.mine), ...g.rows.filter((r) => r.mine)]) {
      const line = el("div", "growrow");
      line.append(el("span", null, T(r.key, r.arg || {})));
      line.append(el("b", null, "+" + r.n));
      why.append(line);
    }
    const tot = el("div", "growrow tot");
    tot.append(el("span", null, T("grade.target")));
    tot.append(el("b", null, String(g.target)));
    why.append(tot);
    wrap.append(why);
  }

  /* The week, as seven letters. The shape of a run is the thing worth seeing
     and it takes one line to show. */
  const week = gradeWeek();
  if (week.some((d) => d.letter)) {
    const strip = el("div", "gweek");
    const now = dayOf(new Date());
    for (const d of week) {
      // Today filled rather than outlined: seven identical cells is a row
      // somebody has to count along to find themselves in.
      const i = el("i", (d.letter ? "" : "off") + (d.day === now ? " now" : ""));
      i.textContent = d.letter || "·";
      strip.append(i);
    }
    wrap.append(strip);
  }
  box.append(wrap);
}

/* ---- the report card as a panel about what happened -------------------------
 *
 * WHY IT CHANGED. A card that said "you are level 4" said the same thing every
 * day, and a thing that says the same thing every day is a thing nobody opens
 * twice. This says what has happened since somebody was last here, which is
 * the only kind of line that is worth coming back for.
 *
 * TWO RULES, AND THEY MATTER MORE THAN THE LAYOUT:
 *
 *  1. A ROW THAT WOULD READ ZERO IS NOT DRAWN. On a board this size most of
 *     them are zero most days, and a panel listing "0 followers, 0 replies,
 *     0 likes" is a panel telling somebody in numbers that nothing is
 *     happening here. It gets SHORTER on a quiet day, and the space says
 *     something useful instead.
 *
 *  2. NO LINE IS EVER MORE SPECIFIC THAN THE CROWD IT HIDES IN. "Somebody
 *     keeps coming back to your page" with two regulars on a board of eleven
 *     is a name with a thin coat of paint — the reader can open Browse and
 *     work it out. Under REGULARS_FLOOR the line is not drawn at all and the
 *     plain count stands in, which describes nobody.
 *
 * The level and the card of the day are still here. They are one line at the
 * bottom instead of the headline, which is their right size.
 */
const LASTOPEN = "board:lastopen";
const REGULARS_FLOOR = 3;

/* Six hours. Advancing the mark on every load would empty the panel on a
 * refresh thirty seconds later, which reads as a bug; advancing it never would
 * make "since" meaningless by Thursday. Six hours keeps one day's news in
 * place for the day and turns it over by morning. */
const HOLD_HOURS = 6;

let SINCE = "";       // the mark this draw is reporting against
function sinceMark() {
  if (SINCE) return SINCE;
  let was = "";
  try { was = localStorage.getItem(LASTOPEN) || ""; } catch { /* fine */ }
  const now = new Date();
  const old = was && (now - new Date(was)) > HOLD_HOURS * 3600 * 1000;
  if (!was || old) {
    try { localStorage.setItem(LASTOPEN, now.toISOString()); } catch { /* fine */ }
  }
  SINCE = was;
  return SINCE;
}

/** "Since Tuesday" while that still means something, then a date. */
function sinceWords(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  if (isNaN(d)) return "";
  const days = Math.floor((Date.now() - d) / 86400000);
  if (days <= 0) return T("prof.sinceToday");
  if (days === 1) return T("prof.sinceYesterday");
  if (days < 7) {
    return T("prof.since", {
      day: new Intl.DateTimeFormat(lang() === "zh" ? "zh-CN" : "en-GB",
        { weekday: "long" }).format(d),
    });
  }
  return T("prof.sinceLong");
}

/* The admin panel's sparkline, unchanged in shape and in what it refuses to
 * draw: nothing under three days, and nothing on an all-zero series. A flat
 * line along the floor is indistinguishable from a rendering fault. */
function sparkline(series) {
  if (!series || series.length < 3) return null;
  const hi = Math.max(...series);
  if (!hi) return null;
  const NS = "http://www.w3.org/2000/svg";
  const w = 62, h = 22, pad = 2, n = series.length;
  const x = (i) => pad + (i / (n - 1)) * (w - pad * 2);
  const y = (v) => h - pad - (v / hi) * (h - pad * 2);
  const pts = series.map((v, i) => x(i).toFixed(1) + "," + y(v).toFixed(1)).join(" L");
  const svg = document.createElementNS(NS, "svg");
  svg.setAttribute("class", "spark");
  svg.setAttribute("viewBox", "0 0 " + w + " " + h);
  svg.setAttribute("preserveAspectRatio", "none");
  svg.setAttribute("role", "img");
  svg.setAttribute("aria-label", T("prof.sparkAlt", { n, a: series[0], b: series[n - 1] }));
  const mk = (t, a) => { const e = document.createElementNS(NS, t);
    for (const k in a) e.setAttribute(k, a[k]); return e; };
  svg.append(mk("path", { class: "ar", d: "M" + pad + "," + (h - pad) + " L" + pts + " L" + (w - pad) + "," + (h - pad) + " Z" }));
  svg.append(mk("path", { class: "ln", d: "M" + pts }));
  svg.append(mk("circle", { class: "dot", cx: x(n - 1), cy: y(series[n - 1]), r: 1.9 }));
  return svg;
}

/** The last `n` days of a date-keyed count, zeros included. */
function lastDays(views, n) {
  const out = [];
  for (let i = n - 1; i >= 0; i--) {
    const d = new Date();
    d.setDate(d.getDate() - i);
    const k = d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0")
      + "-" + String(d.getDate()).padStart(2, "0");
    out.push(Number((views || {})[k] || 0));
  }
  return out;
}

/** Monday-based week key, matching the server's bucket. */
function weekNow(back) {
  const d = new Date();
  if (back) d.setDate(d.getDate() - back * 7);
  const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  const day = t.getUTCDay() || 7;
  t.setUTCDate(t.getUTCDate() + 4 - day);
  const jan1 = new Date(Date.UTC(t.getUTCFullYear(), 0, 1));
  const n = Math.ceil(((t - jan1) / 86400000 + 1) / 7);
  return t.getUTCFullYear() + "-W" + String(n).padStart(2, "0");
}

/** Everything the panel could say, worked out once. Nothing here is a string —
 *  the drawing decides what is worth saying and in which language. */
function newsSince() {
  const mark = sinceMark();
  const mine = ME && ME.handle ? ME.handle.toLowerCase() : "";
  const after = (p) => mark && (p.at || "") > mark;
  const live = posts.filter((p) => p.state !== "removed");

  const myIds = new Set(live.filter((p) => (p.handle || "").toLowerCase() === mine
    && mine && store_isOwn(p)).map((p) => p.id));
  const replies = live.filter((p) => p.re && myIds.has(p.re) && after(p)
    && (p.handle || "").toLowerCase() !== mine);

  const views = lastDays(ME && ME.views, 7);
  const seen = views.reduce((a, b) => a + b, 0);
  const before = lastDays(ME && ME.views, 14).slice(0, 7).reduce((a, b) => a + b, 0);

  return {
    mark,
    posts: live.filter((p) => store_isOwn(p) && after(p)
      && (p.handle || "").toLowerCase() !== mine).length,
    joined: PEOPLE.filter((q) => !q.mine && after(q)).map((q) => q.handle).filter(Boolean),
    followers: FOLLOWERS.filter((f) => after(f)).length,
    replies,
    matches: MATCHES,
    views, seen, before,
    regulars: Number(((ME && ME.regs) || {})[weekNow(0)] || 0),
    people: PEOPLE.length,
  };
}

/** THE TITLE, AND THE ONE THING THAT WOULD MOVE IT.
 *
 *  Not a number and not a position: five words, each describing something
 *  that happened. See rankOf in server.js for what earns each one.
 *
 *  The next rung is written as the thing to do rather than the score to hit —
 *  "somebody answering you" is an instruction, "1 more reply" is a target, and
 *  a target on a board this small is a thing people play at instead of use. */
const RANKORDER = ["guest", "contact", "regular", "connector", "principal"];
const RANKNEXT = { guest: "toContact", contact: "toRegular",
  regular: "toConnector", connector: "toPrincipal" };

function drawRank(box) {
  const key = RANK && RANKORDER.includes(RANK) ? RANK : "";
  if (!key) return;
  const wrap = el("div", "rank");
  wrap.append(el("span", "rankcap", T("rank.head")));
  wrap.append(el("b", null, T("rank." + key)));
  wrap.append(el("p", null, T("rank." + key + "Why")));
  const next = RANKNEXT[key];
  wrap.append(el("p", "ranknext", next
    ? T("rank.next", { what: T("rank." + next) }) : T("rank.top")));
  box.append(wrap);
}

/** A post somebody made, rather than a reply, a like or a report. */
const store_isOwn = (p) => !p.re && !p.like && !p.report;

function drawNews() {
  const box = $("profnews");
  fill(box);
  if (!ME || !ME.handle) return false;
  const n = newsSince();

  /* WHERE THEY STAND, above the letter.
   *
   * The grade is today; the rank is what they have built. One is a mark that
   * moves every morning and the other is a title that took weeks — so the
   * title goes first, and the mark under it reads as the day rather than as a
   * verdict on the person. */
  drawRank(box);

  // The letter. It is the one line somebody can compare with yesterday
  // without reading anything else on the card.
  drawGrade(box);

  /* THE WONDERING, and the floor under it. Drawn only when there are enough
     regulars for the sentence to describe a crowd rather than a person. */
  if (n.regulars >= REGULARS_FLOOR) {
    const w = el("div", "wonder");
    w.append(el("p", "wbig", T("prof.regulars", { n: n.regulars })));
    const faces = el("div", "wfaces");
    for (let i = 0; i < Math.min(4, n.regulars); i++) faces.append(el("i", null, "?"));
    faces.append(el("span", null, T("prof.noName")));
    w.append(faces);
    box.append(w);
  }

  // The headline number, with the squiggle. Only once there is a week of it:
  // "1 person opened your page" as a headline is not a headline.
  if (n.seen >= 3) {
    const big = el("div", "big");
    big.append(el("span", "bignum", String(n.seen)));
    const sp = sparkline(n.views);
    if (sp) big.append(sp);
    const lab = el("span", "biglab", T("prof.opened"));
    lab.append(el("small", null, n.before
      ? T("prof.vsLast", { n: n.before }) : T("prof.sevenDays")));
    big.append(lab);
    box.append(big);
  }

  /* The rows, most personal first. Anything that would read zero is simply
     absent — see the note at the top of this block. */
  const rows = el("div", "newsrows");
  const row = (text, quiet) => {
    const r = el("div", "newsrow");
    r.append(el("i", "nd" + (quiet ? " q" : "")));
    r.append(el("span", null, text));
    rows.append(r);
  };
  for (const p of n.replies.slice(0, 3)) {
    row(T("prof.replied", { who: p.handle || T("board.someone") }));
  }
  for (const m of n.matches.slice(0, 2)) row(matchLine(m));
  if (n.followers) row(T("prof.followed", { n: n.followers }));
  if (n.joined.length) {
    row(n.joined.length === 1 ? T("prof.joined1", { who: n.joined[0] })
      : T("prof.joined", { n: n.joined.length }), true);
  }
  if (n.posts) row(T("prof.posts", { n: n.posts }), true);
  if (rows.firstChild) box.append(rows);

  /* A QUIET DAY IS NOT AN EMPTY PANEL. Nothing to report is a true thing worth
     saying, and it is the one moment where asking somebody to post is fair —
     they can see for themselves that nobody else has. */
  if (!rows.firstChild && n.mark) {
    box.append(el("p", "newsquiet", n.people > 1
      ? T("prof.quiet", { n: n.people }) : T("prof.quietAlone")));
  }
  return Boolean(box.firstChild);
}

function drawProf() {
  const box = $("prof");
  const body = $("profbody");
  const head = $("profhead");
  /* WHAT MAKES THE TILE WORTH DRAWING. It used to be "the Tutor has something
     to say, or there is a card" — and the Tutor's offers have moved out to the
     rotating bar, so that test went false and took the whole tile with it,
     news and level and all. It is the tile's OWN contents that decide now. */
  const hasCard = Boolean($("daily").firstChild);

  const lvl = readLocal("board:level");
  const typ = readLocal("board:type");
  const done = dailyDone();

  /* THE NEWS, AND WHAT IT DEMOTES. Drawn first because it is the reason to
     open this at all. When there is something in it the big medallion stands
     down to one line — two headlines in one fold is no headline — and when
     there is not, the level takes its old place, which is what somebody in
     their first week sees. */
  GRADE = null;
  const hasNews = drawNews();
  if (!hasNews && !hasCard && !readLocal("board:level") && !readLocal("board:type")) {
    box.hidden = true;
    return;
  }
  box.hidden = false;
  // An empty card holds a slot in the strip and swipes to nothing.
  $("profnews").hidden = !hasNews;
  /* The letter in the header, from the same object the card drew — see GRADE.
     Absent rather than "—" when there is no grade: a dash beside the mark reads
     as something broken, and the card inside says what is missing and why. */
  const gh = $("profgrade");
  gh.textContent = (GRADE && GRADE.letter) || "";
  gh.hidden = !(GRADE && GRADE.letter);


  /* WHERE YOU ARE NOW, large, as the first thing inside the fold.
   *
   * A report card that makes somebody read a summary line to find their own
   * level is burying the one number it is named after. Same shape as the
   * result screen it came from — mark, band, level, ten stops — so opening
   * this and finishing the test show the same object twice.
   */
  const now = $("profnow");
  fill(now);
  now.hidden = false;
  const P = (pair) => (Array.isArray(pair) ? pair[lang() === "zh" ? 1 : 0] : pair);
  /* THE LEVEL KEEPS ITS FULL SIZE. It was squashed to one line when there was
     news above it, which made sense while this was a column and the news was
     the headline. In a strip it is nobody's subtitle — it is its own card with
     a card's worth of room, and a medallion the size of a line of text is a
     runt in a box of its own. */
  if (lvl && lvl.level) {
    const n = Math.max(1, Math.min(10, Number(lvl.level) || 1));
    const w = lvl.which === "en" ? "en" : "zh";
    const medal = el("div", "nowmedal");
    medal.append(crownMark(stageFor((w === "zh" ? "ZH " : "EN ") + n), "2.4rem"));
    now.append(medal);
    now.append(el("p", "nowcap", T("prof.now")));
    now.append(el("p", "nowbig", P(BANDS[w][n - 1])));
    now.append(el("p", "nowlvl", T("lvl.n", { n })
      + " \u00b7 " + T(w === "zh" ? "crown.zh" : "crown.en")));
    const dots = el("div", "nowdots");
    for (let i = 1; i <= 10; i++) dots.append(el("i", i <= n ? "on" : ""));
    now.append(dots);
    if (typ && typ.code) now.append(el("p", "nowtype", typ.code));
  } else {
    /* Nothing to show is still worth a line: the invitation goes where the
       number would have been, rather than being hunted for further down. The
       first mark is drawn faint above it — what is on offer, shown rather than
       described, and it fills the hole the medallion would have left. */
    const medal = el("div", "nowmedal empty");
    medal.append(crownMark(1, "2.4rem"));
    now.append(medal);
    now.append(el("p", "nowcap", T("prof.now")));
    now.append(el("p", "nowbig none", T("prof.nolevelBig")));
    now.append(el("p", "nowlvl", T("prof.nolevelWhy")));
    const go = el("a", "nowgo", T("day.takeTest"));
    go.href = "/level";
    now.append(go);
  }

  /* Two lines, not one: "From the Professor · Your report card" wrapped on a
     phone and read as one long sentence. Whose it is, then what it is. */
  $("proftitle").textContent = T("prof.title");
  $("profsub").textContent = T("prof.sub");

  /* The line under it, in the order somebody cares: what is waiting first,
     then what they already have. */
  const bits = [];
  if (hasCard) bits.push(T(done ? "prof.cardDone" : "prof.waiting"));
  if (lvl && lvl.level) bits.push(T("day.atLevel", { n: lvl.level }));
  if (typ && typ.code) bits.push(typ.code);
  $("profsum").textContent = bits.length ? bits.join(" \u00b7 ") : T("prof.nothing");
  head.classList.toggle("todo", hasCard && !done);

  /* ONE TILE, WHICH IS WHAT IT LOOKED LIKE BEST AS. Between Browse and the
     feed, shut, it is a single row: the mark, what it is, the summary line and
     today's letter. Open, everything is under it in a list.
     It starts open while there is something to do — nothing tested yet, or
     today's card unanswered — and shut once both are behind them. Shutting it
     by hand sticks for the day, because the point of a fold nobody can keep
     shut is lost on the person who wanted it shut. */
  if (PROFOPEN === null) {
    let shut = "";
    try { shut = localStorage.getItem(PROFSHUT) || ""; } catch { /* fine */ }
    PROFOPEN = shut === dayStamp() ? false
      : (!lvl && !typ) || (hasCard && !done);
  }
  body.hidden = !PROFOPEN;
  head.setAttribute("aria-expanded", String(PROFOPEN));
  $("daily").hidden = !hasCard;
}

/* What this browser has already said. Read once, so the card can say "noted"
 * rather than asking a question somebody has already answered. */
async function loadWanted() {
  if (!device) return;
  try {
    const d = await fetch("/api/want", { cache: "no-store",
      headers: { "x-board-device": device } }).then((r) => r.json());
    WANTED = (d && d.mine) || [];
  } catch { WANTED = []; }
  drawTutor();
}

/* How many introductions are waiting. Its own request rather than a field on
 * the board: the board is public and cached at every layer, and a number that
 * belongs to one browser has no business travelling with it. */
/* THE TWO DOORS, AND THE NUMBER ON ONE OF THEM.
 *
 * This was the count on a Messages tab that was hidden for V1. The tab is
 * still not in the bar — four and a button is enough down there — but messages
 * are real now, so the doors live in the tray with everything else addressed
 * to you, and this puts the unread count on one of them. */
function drawTalk() {
  const row = $("talkrow");
  // Nothing to offer somebody who has not put a name up yet. A private inbox
  // is not the first thing to show on an empty profile.
  row.hidden = !(ME && ME.handle);
  $("gonotes").firstChild.textContent = T("note.inbox");
  $("gogroups").firstChild.textContent = T("grp.title");
}

async function countNotes() {
  if (!device) return;
  try {
    const d = await fetch("/api/notes", { cache: "no-store",
      headers: { "x-board-device": device } }).then((r) => r.json());
    const n = (d && d.unread) || 0;
    for (const id of ["navnotesn", "gonotesn"]) {
      const badge = $(id);
      if (!badge) continue;
      badge.textContent = n > 9 ? "9+" : String(n);
      badge.hidden = !n;
    }
  } catch { /* the door is still a door without a number on it */ }
}

/* ---- browse, at the top of this page ---------------------------------------
 *
 * One person, filling the card. A photograph is the reason this exists, so it
 * gets the whole thing and the words sit on top of it.
 *
 * There is no yes and no no here. A flick moves on; it is how you turn the
 * page, not a verdict on somebody's face — which is the whole difference
 * between this and the app it borrows its shape from.
 */
let PEOPLE = [], AT = 0;

/* A FRESH CUT OF THE DECK EVERY TIME IT IS OPENED.
 *
 * The server sends people in the order they joined, and a deck in join order
 * is the same face every single time — which makes a board of a dozen people
 * feel like a board of one, and quietly settles who gets looked at. Whoever
 * arrived last week is the person nobody ever reaches, because reaching them
 * costs eleven flicks and the first three are always the same.
 *
 * Fisher-Yates, on the client, on load. Nothing is carried between opens:
 * no seed, no stored position, so it is a shuffle rather than a rotation
 * somebody could learn. Order is not a signal on this board and it should not
 * accidentally become one.
 */
function shuffled(rows) {
  const out = rows.slice();
  for (let i = out.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [out[i], out[j]] = [out[j], out[i]];
  }
  /* Not your own face first. You are in the deck on purpose — see below — but
     opening the app and being shown yourself reads as the app being broken,
     and it costs one swap to avoid. */
  if (out.length > 1 && out[0].mine) {
    const j = 1 + Math.floor(Math.random() * (out.length - 1));
    [out[0], out[j]] = [out[j], out[0]];
  }
  return out;
}

async function loadPeople() {
  try {
    const d = await fetch("/api/people", { cache: "no-store",
      headers: device ? { "x-board-device": device } : {} }).then((r) => r.json());
    /* Yourself included, for now.
     *
     * The argument for leaving yourself out is that browsing your own
     * photograph is not a feature. The argument against it, which won, is that
     * somebody who has just uploaded a face and cannot find it in the one
     * place the app shows faces concludes the upload failed — and being told
     * "your card is deliberately not in your own deck" answers the question
     * without ever making the screen make sense.
     *
     * Your own card says it is yours and offers the edit rather than a follow
     * button that would refuse itself. */
    PEOPLE = shuffled((d && d.people) || []);
  } catch { PEOPLE = []; }
  drawDeck();
  /* THE PANEL IS BUILT FROM FOUR FETCHES THAT LAND WHEN THEY LAND. Drawn once
     at startup it reported whichever of them had arrived — the row about who
     joined came and went depending on the network. Every loader redraws it. */
  drawProf();
}

/* Whether this phone still owes the board a face.
 *
 * Everything below that asks for one is gated on it, so a settled reader is
 * never asked again — an ask that stays up after it has been answered is how a
 * prompt turns into furniture. */
const needsFace = () => !(ME && ME.photo);

/* How many cards there are: everybody, plus you at the end if you are not on
 * here yet. Never you on your own — "that is everyone" is a strange thing to
 * say about nobody, and an empty list already has its own block that says so
 * and offers the right thing to do about it. */
const deckLen = () => PEOPLE.length + (needsFace() && PEOPLE.length ? 1 : 0);

function nextPerson() {
  const n = deckLen();
  if (!n) return;
  AT = (AT + 1) % n;
  drawDeck();
}

/* The last card. You have just looked at everybody's face, which is the one
 * moment putting your own up needs no explaining. */
function turnCard() {
  const box = el("div", "pc turn");
  box.append(el("div", "noshot", "+"));
  const scrim = el("div", "scrim");
  scrim.append(el("h2", null, T("brw.yourTurn")), el("p", "goal", T("brw.yourTurnWhat")));
  box.append(scrim);
  return box;
}

/* ---- who started following you -------------------------------------------
 *
 * The notification and the answer to it, in one place. Somebody follows you;
 * you find out; you look at them and decide whether to follow back. Three
 * screens for that would be two too many.
 *
 * NEW IS A FACT ABOUT THIS PHONE, not about the board. What counts as new is
 * "since you last had this drawn in front of you", so the newest follower's
 * timestamp is written to local storage as soon as the row is on the screen:
 * the dots show on the load they arrived and are gone on the next one, which
 * is how a since-you-last-looked mark is supposed to behave. The board is not
 * asked to keep a note of when somebody last opened it.
 */
let FOLLOWERS = [], FRESH = new Set();

async function loadFollowers() {
  if (!device) return;
  try {
    const d = await fetch("/api/followers", { cache: "no-store",
      headers: { "x-board-device": device } }).then((r) => r.json());
    FOLLOWERS = (d && d.followers) || [];
  } catch { FOLLOWERS = []; }

  /* Which of them are new is worked out ONCE, here, and not in the draw.
   * This page redraws whenever the language changes or a late fetch lands, and
   * a draw that both read the mark and moved it made the second redraw erase
   * the dots the first one had just put up. */
  let seen = "";
  try { seen = localStorage.getItem("board:sawfollowers") || ""; } catch { /* fine */ }
  FRESH = new Set(FOLLOWERS.filter((f) => (f.at || "") > seen).map((f) => f.id));
  if (FOLLOWERS.length) {
    const newest = FOLLOWERS.map((f) => f.at || "").sort().pop();
    try { localStorage.setItem("board:sawfollowers", newest); } catch { /* fine */ }
  }
  drawFollowers();
  drawProf();
}

/* ---- matches, in the tray --------------------------------------------------
 *
 * THE ROOM IS THE INFORMATION, NOT THE WORD "MATCH". With three picks each out
 * of seven pairings, two people overlap somewhere about nine times in ten — so
 * a line that said MATCH and nothing else would fire constantly and be learned
 * as noise inside a week. "You and Ana both want a language exchange" is
 * pleasant; "you are raising, they are investing" is worth stopping for; and
 * the reader can tell which is which without being told.
 */
let MATCHES = [];

async function loadMatches() {
  if (!device) return;
  try {
    const d = await fetch("/api/matches", { cache: "no-store",
      headers: { "x-board-device": device } }).then((r) => r.json());
    MATCHES = (d && d.matches) || [];
  } catch { MATCHES = []; }
  drawMatches();
  drawTray();
  drawProf();
}

function matchLine(m) {
  const first = m.shared[0];
  if (!first) return "";
  return first.mine === first.theirs
    ? T("match.one", { who: m.handle, what: T("room." + first.mine + ".s") })
    : T("match.pair", { who: m.handle, mine: T("room." + first.mine + ".s"),
                        theirs: T("room." + first.theirs + ".s") });
}

function drawMatches() {
  const box = $("matches");
  const rule = $("matchrule");
  fill(box);
  if (!MATCHES.length) { box.hidden = true; rule.hidden = true; return; }
  box.hidden = false; rule.hidden = false;
  $("matchlabel").textContent = T("match.head0");

  for (const m of MATCHES) {
    const row = el("a", "folrow");
    row.href = "/p/" + encodeURIComponent((m.handle || "").toLowerCase());
    row.style.textDecoration = "none";
    const av = el("span", "av");
    if (m.photo) {
      const img = Object.assign(document.createElement("img"),
        { src: "/api/public-media?id=" + encodeURIComponent(m.photo), alt: "", loading: "lazy" });
      img.addEventListener("error", () => { img.remove(); av.textContent = initial(m.handle); });
      av.append(img);
    } else {
      av.textContent = initial(m.handle);
    }
    const who = el("span", "who");
    who.append(el("b", null, matchLine(m)));
    // What is outstanding, in the row, so nobody has to open a page to find
    // out whether the ball is with them.
    const state = m.card ? T("card.theirs", { who: m.handle })
      : m.gave ? T("card.waiting", { who: m.handle })
      : "";
    if (state) who.append(el("span", null, state));
    row.append(av, who);
    box.append(row);
  }
}

function drawFollowers() {
  const box = $("fols");
  const rule = $("folrule");
  fill(box);
  if (!FOLLOWERS.length) {
    box.hidden = true; rule.hidden = true; badgeFollowers(0);
    return;
  }
  box.hidden = false; rule.hidden = false;
  $("follabel").textContent = T("fol.head");

  const fresh = FOLLOWERS.filter((f) => FRESH.has(f.id));

  const tag = $("folnew");
  tag.hidden = !fresh.length;
  tag.textContent = fresh.length ? T("fol.new", { n: fresh.length }) : "";
  badgeFollowers(fresh.length);

  for (const f of FOLLOWERS) {
    const row = el("div", "folrow");
    const av = el("a", "av");
    av.href = "/p/" + encodeURIComponent((f.handle || "").toLowerCase());
    if (f.photo) {
      const img = Object.assign(document.createElement("img"),
        { src: "/api/public-media?id=" + encodeURIComponent(f.photo), alt: "", loading: "lazy" });
      img.addEventListener("error", () => { img.remove(); av.textContent = initial(f.handle); });
      av.append(img);
    } else {
      av.textContent = initial(f.handle);
    }

    const who = el("a", "who");
    who.href = av.href;
    who.style.textDecoration = "none";
    who.append(el("b", null, f.handle || T("board.someone")),
      el("span", null, [f.campus, f.type].filter(Boolean).join(" · ")));

    row.append(av, who);
    if (FRESH.has(f.id)) row.append(el("i", "dot"));

    const b = el("button", f.following ? "on" : "", T(f.following ? "bud.following" : "fol.back"));
    b.type = "button";
    b.addEventListener("click", async () => {
      const want = !f.following;
      f.following = want;
      b.textContent = T(want ? "bud.following" : "fol.back");
      b.classList.toggle("on", want);
      try {
        const r = await fetch("/api/follow", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ device, who: f.id, on: want }),
        });
        if (!r.ok) throw new Error("no");
        const d = await r.json();
        f.following = Boolean(d.following);
      } catch { f.following = !want; }
      b.textContent = T(f.following ? "bud.following" : "fol.back");
      b.classList.toggle("on", Boolean(f.following));
    });
    row.append(b);
    box.append(row);
  }

}

/** The count, on the tab whose page holds the list.
 *
 *  It was on Profile, which is the tab a person checks when they wonder
 *  whether anything has happened to them — and which opens their own page,
 *  where there is no list of followers. A number that leads somewhere the
 *  thing it counts is not is worse than no number. */
/* THE COUNT LIVES ON THE BELL NOW, and only there.
 *
 * It used to sit on the Browse tab, because the followers list sat under the
 * deck. The list moved into the tray and this did not — leaving a badge on a
 * tab that no longer holds the thing it was counting, and two notification
 * dots on one screen for one event. */
function badgeFollowers() {
  const b = $("navbrowsen");
  if (b) b.hidden = true;
}

/* THE ROW ABOVE THE DECK: your own card, in whichever of three states it is.
 *
 * It began as one thing — an ask for a photograph — and had to become three,
 * because the question it answers changes the moment you upload one. Your own
 * card is deliberately NOT in the deck (browsing your own photograph is not a
 * feature), so without this row there is nowhere in the app to see that your
 * face went up, and the only way to find out is to ask somebody else to look.
 *
 * No photograph        → add one, and the row is the control.
 * One, waiting on us    → say so. Held is not broken, and the difference
 *                         matters more to the person waiting than to anyone.
 * One, up               → their own face, and the way to their own page.
 *
 * Drawn from ME, which arrives after the first paint, so it is redrawn when
 * that lands and again whenever the profile is saved. */
function drawMine() {
  const box = $("mine");
  box.hidden = false;
  fill(box);

  const ring = el("span", "ring");
  const face = ME && ME.photo;
  if (face) {
    const img = Object.assign(document.createElement("img"),
      { src: "/api/public-media?id=" + encodeURIComponent(ME.photo), alt: "" });
    img.addEventListener("error", () => { img.remove(); ring.textContent = initial(ME && ME.handle); });
    ring.append(img);
  } else {
    ring.textContent = initial(ME && ME.handle);
    ring.append(el("i", null, "+"));
  }

  /* FOUR STATES, and the fourth is the one that was lying.
   *
   * "You are in Browse" was said to anybody with a photograph, whether or not
   * they were actually in Browse — and being in it is a switch, off by default
   * on every page made before that switch was put on the form. So somebody
   * with a face, a name and looking:false read a row telling them they were in
   * the deck while the deck showed nobody. */
  const listed = Boolean(ME && ME.looking);
  const words = el("span");
  if (!face) {
    words.append(el("b", null, T("brw.mine")), el("span", null, T("brw.mineWhy")));
  } else if (ME.photoPending) {
    words.append(el("b", null, T("brw.mineHeld")), el("span", null, T("brw.mineHeldWhy")));
  } else if (!listed) {
    words.append(el("b", null, T("brw.mineOff")), el("span", null, T("brw.mineOffWhy")));
  } else {
    words.append(el("b", null, T("brw.mineUp", { name: ME.handle || "" })),
                 el("span", null, T("brw.mineUpWhy")));
  }
  box.append(ring, words);
  if (face) box.append(el("span", "chev", listed ? "\u203a" : "\u2192"));
}
/* One control, two destinations: the picker while there is nothing to look at,
 * their own page once there is. */
$("mine").addEventListener("click", () => {
  if (!(ME && ME.photo)) { $("mephoto").click(); return; }
  // Not in the deck: the useful thing is the switch that puts you in it, not
  // a look at the page nobody can reach.
  if (!ME.looking || !ME.handle) { openMe(); return; }
  location.href = "/p/" + encodeURIComponent(ME.handle.toLowerCase());
});

function personCard(q, live) {
  const box = el("div", "pc");
  if (q.photo) {
    const img = Object.assign(document.createElement("img"),
      { src: "/api/public-media?id=" + encodeURIComponent(q.photo), alt: "", loading: "eager" });
    img.addEventListener("error", () => { img.remove(); box.prepend(el("div", "noshot", initial(q.handle))); });
    box.append(img);
  } else {
    box.append(el("div", "noshot", initial(q.handle)));
  }

  const scrim = el("div", "scrim");
  /* The name, the four letters beside it if they put them up, and — on your
     own card — that it is yours. On the same line because they are all things
     about this person, the size of a badge, not sections of their profile. */
  const line = el("div", "nameline");
  line.append(el("h2", null, q.handle || T("board.someone")));
  if (q.mine) line.append(el("b", "type you", T("brw.you")));
  if (q.type) line.append(el("b", "type", q.type));
  /* Only if they put their level on their page. The mark is the level worn,
     so somebody who kept the number keeps the number. */
  const rank = stageFor(q.levelBand);
  if (rank) {
    const worn = el("b", "rank");
    worn.append(crownMark(rank, "1rem"));
    worn.append(el("span", null, stageName(rank)));
    line.append(worn);
  }
  scrim.append(line);
  const where = [q.campus, q.here].filter(Boolean).join(" · ");
  if (where) scrim.append(el("p", "where", where));
  if (q.goal) scrim.append(el("p", "goal", q.goal));
  /* WHAT THEY ARE LOOKING FOR, ON THE CARD ITSELF. This is the half of the
     feature that works at eight people: a match needs two people to have
     followed each other, which is rare on a small board, but a label saying
     what somebody wants is useful the moment they tick it. What the two of
     you have in common is marked, and the rest is there to read. */
  if (Array.isArray(q.rooms) && q.rooms.length && !q.mine) {
    const chips = el("div", "pchips");
    const shared = new Set((q.shared || []).map((x) => x.theirs));
    for (const r of q.rooms) chips.append(el("span", "pchip" + (shared.has(r) ? " on" : ""), T("room." + r)));
    scrim.append(chips);
  }
  box.append(scrim);

  /* On the card, not in the section header above it: this shares one person,
   * so it belongs on the one person.
   *
   * pointerdown is stopped here because the card is a drag surface — without
   * it, pressing share starts a flick, and the tap that follows lands on
   * whoever comes next. */
  if (live) {
    const sh = el("button", "share");
    sh.type = "button";
    const words = el("span", null, T("act.share"));
    sh.append(icon("share"), words);
    sh.addEventListener("pointerdown", (ev) => ev.stopPropagation());
    sh.addEventListener("click", (ev) => { ev.stopPropagation(); shareCard(q, words); });
    box.append(sh);
  }
  return box;
}

/* Share the person on the card.
 *
 * Their own page, not this one: /p/<name> carries their face and their line in
 * its link card, which is the thing WeChat renders in a chat, and it opens with
 * a Follow button for whoever taps it. Sharing this address instead would send
 * somebody a deck that starts at whoever happens to be first. */
function shareCard(q, label) {
  const url = location.origin + "/p/" + encodeURIComponent((q.handle || "").toLowerCase());
  const say = (words, hold) => {
    label.textContent = words;
    setTimeout(() => { label.textContent = T("act.share"); }, hold || 2200);
  };
  // Inside WeChat a page may not open a share sheet — the ⋯ menu is the only
  // way — so the honest version is to put the link on the clipboard and say
  // where the real control is.
  if (IN_WECHAT) { say(T(copyText(url) ? "act.wxCopied" : "act.wxUseMenu"), 3600); return; }
  if (navigator.share) {
    navigator.share({ title: q.handle || T("board.someone"),
                      text: (q.goal || "").slice(0, 120), url })
      .catch(() => { /* dismissed is not a failure */ });
    return;
  }
  say(T(copyText(url) ? "act.copied" : "act.copyFail"));
}

/** Who is in, and how many are outside. Two facts in one line.
 *
 *  THE POINT OF SHOWING A MEMBER THE QUEUE. Being inside something has no
 *  weight unless you can see the edge of it, and a member who can see the
 *  queue is the member who spends an invitation. It is a number and never a
 *  list: no name, no photograph, nothing that could tell anybody in here who
 *  is waiting — and below the floor the server sends null, so the line simply
 *  says how many people are in and stops. */
/* One person is not "1 people". English needs the second sentence and Chinese
   does not, so the choice is made here and both languages read right. */
const inside = (n) => T(n === 1 ? "brw.inside1" : "brw.inside", { n });
const atdoor = (n) => T(n === 1 ? "brw.atdoor1" : "brw.atdoor", { n });

/* THE QUEUE, DRAWN ONCE THE DECK IS THERE.
 *
 * Its own fetch rather than something bolted onto /api/me: this is the only
 * place that wants it, it is members-only on the server, and a 401 or 403 is
 * the ordinary answer for anybody who is not one — so a failure here leaves
 * the section hidden and says nothing. */
let queueWired = false;
async function drawQueue() {
  const box = $("queue"), list = $("queuelist");
  if (!box) return;
  if (!queueWired) {
    queueWired = true;
    $("queueh").addEventListener("click", () => {
      setQueueOpen($("queuelist").hidden);
    });
  }
  let d = null;
  try {
    const r = await fetch("/api/queue");
    if (!r.ok) return;
    d = await r.json();
  } catch { return; }
  if (!d || !Array.isArray(d.rows)) return;
  /* Rebuilt each time rather than toggled in place: the order changes when
     somebody vouches, so a list left as it was would show the old one. */
  fill($("queueh"));
  $("queueh").append(
    el("span", "qcar", "\u203A"),
    document.createTextNode(T("brw.qh")),
    el("span", "qn2", String(d.rows.length)));
  fill(list);
  if (!d.rows.length) {
    list.append(el("p", "qnone", T("brw.qnone")));
  } else {
    for (const w of d.rows) list.append(qRow(w));
  }
  box.hidden = false;
  /* Shut by default, and it stays however this reader last left it — somebody
     who opens it every day should not have to open it every day. */
  let open = false;
  try { open = localStorage.getItem("board:queue") === "1"; } catch {}
  setQueueOpen(open);
}

function setQueueOpen(open) {
  $("queuelist").hidden = !open;
  $("queueh").setAttribute("aria-expanded", open ? "true" : "false");
  try { localStorage.setItem("board:queue", open ? "1" : "0"); } catch {}
}

function qRow(w) {
  const row = el("div", "qrow");
  const av = el("span", "qav", w.photo ? "" : initial(w.name));
  /* Only released photographs reach this list — the server drops the id
     otherwise — so nothing here decides whether it may be shown. */
  if (w.photo) {
    const img = document.createElement("img");
    img.src = "/api/wait-media?id=" + encodeURIComponent(w.photo);
    img.alt = "";
    img.loading = "lazy";
    img.addEventListener("error", () => { img.remove(); av.textContent = initial(w.name); });
    av.append(img);
  }
  const mid = el("div", "qmid");
  const line = el("div", "qn");
  line.append(document.createTextNode(w.name));
  if (w.room) {
    line.append(document.createTextNode(" · "),
      el("em", null, T("waitroom." + w.room)));
  }
  mid.append(line);
  if (w.why) mid.append(el("small", null, w.why));
  const tags = el("div", "qtags");
  if (w.type) tags.append(el("span", null, w.type));
  if (w.want) tags.append(el("span", null, T("role.p." + w.want)));
  if (w.brought) tags.append(el("span", null, T("brw.qbrought", { n: w.brought })));
  if (w.vouches) tags.append(el("span", null, T("brw.qvouches", { n: w.vouches })));
  if (tags.childNodes.length) mid.append(tags);

  /* THE VOUCH, and it moves them one place — see queueOrder on the server.
     Optimistic, because the answer is a row in a file and the interesting
     case is the button feeling dead while a phone thinks about it; if the
     server disagrees the button goes back to where it was. */
  const v = el("button", "qv", T(w.mine ? "brw.vouched" : "brw.vouch"));
  v.type = "button";
  v.setAttribute("aria-pressed", w.mine ? "true" : "false");
  v.addEventListener("click", async () => {
    const was = v.getAttribute("aria-pressed") === "true";
    const now = !was;
    v.setAttribute("aria-pressed", now ? "true" : "false");
    v.textContent = T(now ? "brw.vouched" : "brw.vouch");
    v.disabled = true;
    try {
      const r = await fetch("/api/vouch", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ wait: w.id, on: now }),
      });
      if (!r.ok) throw new Error("no");
      /* Redrawn rather than nudged: vouching changes the order, and a list
         that says somebody moved up while leaving them where they were is
         worse than one that takes a moment. */
      drawQueue();
    } catch {
      v.setAttribute("aria-pressed", was ? "true" : "false");
      v.textContent = T(was ? "brw.vouched" : "brw.vouch");
      v.disabled = false;
    }
  });

  row.append(av, mid, el("span", "qpl", String(w.place)), v);
  return row;
}

function drawDoor(people) {
  const box = $("atdoor");
  fill(box);
  /* Drawn off the numbers, not off the deck. It used to hide itself when
     there were no faces to show, which is exactly the board — nearly empty,
     with a queue outside — where the queue is worth the most. */
  const some = MEMBERS || people;
  box.hidden = !(some || WAITING);
  if (box.hidden) return;
  /* The queue first and in the loud voice. How many are already in is the
     reassuring half; how many want in is the interesting one. */
  if (WAITING) box.append(el("b", null, atdoor(WAITING)));
  if (some) box.append(document.createTextNode(inside(some)));
}

/* THE SAME TWO NUMBERS ON THE FEED.
 *
 * Its own function rather than a second call to drawDoor, because the one
 * above hangs off the deck: no faces drawn, no line. The feed has no deck to
 * wait for, and MEMBERS arrives with /api/me — so this draws as soon as the
 * numbers do, and says nothing until they have. */
function drawFeedDoor() {
  const box = $("feeddoor");
  if (!box) return;
  fill(box);
  if (!MEMBERS && !WAITING) { box.hidden = true; return; }
  box.hidden = false;
  if (WAITING) box.append(el("b", null, atdoor(WAITING)));
  if (MEMBERS) box.append(document.createTextNode(inside(MEMBERS)));
}

function drawDeck() {
  $("brwlabel").textContent = T("brw.title");

  drawMine();

  const deck = $("deck");
  fill(deck);
  const people = PEOPLE.length;
  const n = deckLen();
  if (AT >= n) AT = 0;           // a photo arriving takes the last card away
  const mine = needsFace() && people > 0 && AT === people;
  // Nobody on the list is not an empty screen here — the feed is still under
  // it — so the whole block collapses to one small card that says so.
  deck.hidden = !n;
  $("pacts").hidden = !n;
  $("psafety").hidden = !n;
  $("psafety").textContent = T("bud.safety");
  // Counted in people, not in cards: yours is the ask at the end, not the
  // fourth of four students.
  $("pcount").textContent = people && !mine ? T("brw.of", { n: AT + 1, total: people }) : "";
  drawDoor(people);
  drawQueue();
  $("bnone").hidden = Boolean(people);

  if (!n) {
    // Nobody to look at yet, so the only useful thing to offer is being the
    // first one. It used to point at the study-buddy list, which is this same
    // empty list with a different layout.
    const go = el("button", null, T("brw.mine"));
    go.type = "button";
    go.addEventListener("click", () => $("mephoto").click());
    fill($("bnone"), el("b", null, T("brw.none")), el("p", null, T("brw.noneBody")), go);
    return;
  }

  const at = (i, live) =>
    (needsFace() && i === people ? turnCard() : personCard(PEOPLE[i], live));

  // The one behind, so moving on reveals a card rather than a hole.
  if (n > 1) {
    const behind = at((AT + 1) % n, false);
    behind.style.transform = "scale(.96) translateY(10px)";
    deck.append(behind);
  }
  const top = at(AT, true);
  deck.append(top);
  dragCard(top);

  const acts = $("pacts");
  fill(acts);
  if (mine) {
    // One button, and it is the picker. Nobody to follow on this card.
    const add = el("button", "primary", T("brw.mine"));
    add.type = "button";
    add.addEventListener("click", () => $("mephoto").click());
    acts.append(add);
    return;
  }
  const q = PEOPLE[AT];

  /* Your own card, which is in the deck now. A follow button on it would be a
   * button the server refuses — following yourself is not a thing anybody
   * means to do — so it offers the thing you would actually want from your own
   * card instead. */
  if (q.mine) {
    const ed = el("button", "primary", T("me.edit"));
    ed.type = "button";
    ed.addEventListener("click", () => openMe());
    const on2 = el("button", null, T("brw.next"));
    on2.type = "button";
    on2.addEventListener("click", nextPerson);
    acts.append(ed, on2);
    return;
  }

  /* Follow, not "say hello".
   *
   * Saying hello is a thing you do to a person and it wants a reply; following
   * is a thing you do to a feed and it does not. The second is what somebody
   * looking at a stranger's face is actually ready for, and it is the one that
   * cannot go wrong in a room full of people who have never met. */
  const fol = el("button", "primary", "");
  fol.type = "button";
  const paintFollow = () => {
    fol.textContent = T(q.following ? "bud.following" : "bud.follow");
    fol.classList.toggle("on", Boolean(q.following));
    fol.setAttribute("aria-pressed", String(Boolean(q.following)));
  };
  paintFollow();
  fol.addEventListener("click", async () => {
    const want = !q.following;
    // Shown at once, corrected if the box disagrees. A button that waits for a
    // round trip before it changes is a button somebody presses twice.
    q.following = want;
    paintFollow();
    try {
      const r = await fetch("/api/follow", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ device, who: q.id, on: want }),
      });
      if (!r.ok) throw new Error("no");
      const d = await r.json();
      q.following = Boolean(d.following);
      /* Stamped on this phone for the grade. The server knows the follow but
         not the day the reader pressed it — a follow row carries a date, but
         reading everybody's follow dates to score one person is a query this
         board has no business answering. A date in localStorage is all it
         needs and it never leaves the device. */
      if (d.following) {
        try {
          const t = new Date();
          localStorage.setItem("board:didfollow", t.getFullYear() + "-"
            + String(t.getMonth() + 1).padStart(2, "0") + "-"
            + String(t.getDate()).padStart(2, "0"));
        } catch { /* private window */ }
      }
    } catch { q.following = !want; }
    paintFollow();
  });
  const on = el("button", null, T("brw.next"));
  on.type = "button";
  on.addEventListener("click", nextPerson);
  acts.append(fol, on);
}

/* Flick to move on. Pointer events rather than touch events, so a mouse on a
 * laptop behaves the same as a thumb — and the card follows the finger, because
 * a gesture that only acts at the end of itself feels broken on the way. */
function dragCard(box) {
  let x0 = null, dx = 0;
  const go = (e) => {
    if (e.button !== undefined && e.button !== 0) return;
    x0 = e.clientX; dx = 0;
    box.style.transition = "none";
    box.setPointerCapture?.(e.pointerId);
  };
  const move = (e) => {
    if (x0 === null) return;
    dx = e.clientX - x0;
    box.style.transform = `translateX(${dx}px) rotate(${dx / 34}deg)`;
  };
  const end = () => {
    if (x0 === null) return;
    const far = Math.abs(dx) > 90;
    box.style.transition = "";
    if (far) {
      box.style.transform = `translateX(${dx > 0 ? 700 : -700}px) rotate(${dx / 12}deg)`;
      box.classList.add("gone");
      setTimeout(nextPerson, 190);
    } else {
      box.style.transform = "";
    }
    x0 = null;
  };
  box.addEventListener("pointerdown", go);
  box.addEventListener("pointermove", move);
  box.addEventListener("pointerup", end);
  box.addEventListener("pointercancel", end);
}

/* Arrow keys, but only while the deck is the thing on screen and nothing is
 * being typed into. A page-wide arrow handler on a page that is mostly a feed
 * would fight the scroll. */
document.addEventListener("keydown", (e) => {
  if (e.key !== "ArrowRight" && e.key !== "ArrowLeft") return;
  const a = document.activeElement;
  if (a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)) return;
  const r = $("deck").getBoundingClientRect();
  if (r.bottom < 80 || r.top > window.innerHeight - 80) return;
  nextPerson();
});

/* Two tabs, one page.
 *
 * Browse and Feed are now the top and the middle of the same document, so the
 * buttons scroll rather than navigate — and which one is lit follows where you
 * actually are, because a bar that says Browse while you are reading posts is
 * worse than no bar. The hrefs stay real: without JavaScript, or on a middle
 * click, they still go somewhere. */
function markNav() {
  const onFeed = $("posts").getBoundingClientRect().top < window.innerHeight * 0.45;
  $("navbrowse").setAttribute("aria-current", onFeed ? "false" : "page");
  $("navfeed").setAttribute("aria-current", onFeed ? "page" : "false");
  showTranslate(onFeed);
}

/* The translate button belongs to the words, not to the faces.

function showTranslate(onFeed) {
  if (onFeed === undefined) onFeed = $("navfeed").getAttribute("aria-current") === "page";

$("navbrowse").addEventListener("click", (e) => {

  // followers list when it was carrying a count; that list is behind the bell
  // now, and the bell is at the top anyway.
  window.scrollTo({ top: 0, behavior: "smooth" });

$("navfeed").addEventListener("click", (e) => {

fetch("/api/contact").then((r) => r.json()).then((d) => {
  translateOn = Boolean(d && d.translate);
  showTranslate();
  // The board is already drawn by the time this answers, and whether each post
  // gets a translate button depends on it. Without this the button appears or
  // not depending on which of two fetches won, which is how one language ended
