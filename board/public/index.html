/* ---- your own profile ------------------------------------------------------
 *
 * Drawn above the feed on every visit, whether or not there is one yet. A board
 * where the first thing you see is your own face is a different thing from a
 * board where you are anonymous until you post — and the empty state is the
 * important one, because it is what everybody sees first. */

async function saveMe(patch) {
  const payload = JSON.stringify({ ...patch, device });
  const mb = (payload.length / 1024 / 1024).toFixed(2);

  /* TWICE, THEN GIVE UP.
   *
   * A photograph going from a phone here to a box in Tokyo over mobile data
   * does not always arrive. The server's log for it is "request aborted" —
   * the body stopped coming — and what the browser tells the page is "Load
   * failed", which is not a sentence anybody can act on.
   *
   * One retry turns most of those into an upload that worked. The cost is a
   * photograph that arrived on the first attempt after all: its file stays on
   * disk unreferenced while the second one becomes the profile picture. A few
   * stray kilobytes is the right price for not telling somebody their face
   * would not upload when a second attempt would have carried it.
   *
   * Only the throw is retried — a connection that failed. A 4xx or 5xx is an
   * answer, and asking the same question again gets the same answer. */
  let r, err;
  for (let go = 0; go < 2; go++) {
    if (go) await new Promise((ok) => setTimeout(ok, 900));
    try {
      r = await fetch("/api/me", {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: payload,
      });
      err = null;
      break;
    } catch (e) { err = e; }
  }
  if (err) {
    console.error("profile save:", err);
    return { error: T("me.didNotGo", { mb }) };
  }
  const d = await r.json().catch(() => ({}));
  if (!r.ok) {
    // A page is a thing somebody puts up, so it is behind the same door a post
    // is. Taken there rather than told a number.
    if (toDoorIf(d, r.status)) return {};
    if (d.error === "contact") return { error: T("me.noContact", { what: d.what }) };
    return { error: T(d.error === "tooBig" ? "post.tooBig" : "err.general") };
  }
  ME = d.person;
  if (typeof d.waiting === "number") WAITING = d.waiting;
  if (typeof d.people === "number") MEMBERS = d.people;
  if (d.rank) RANK = d.rank;
  paintNav();
  // The list is made of what is on their page, so it is redrawn the moment
  // the page changes.
  drawTodo();
  drawTalk();
  /* Same reason as drawTodo above: the panel is only for a member, and
     loadMyInvite draws it before /api/me has landed — so it was deciding on
     an ME that did not exist yet and hiding itself from everybody. */
  drawAsk();
  // A face arriving takes the ask away — the row under the deck and the card
  // at the end of it both go.
  drawDeck();
  // "Set up your page" is only offered while there is no page. Without this it
  // stays on screen telling somebody to do the thing they have just done.
  drawTutor();
  if (!$("mesheet").hidden) drawMePic();
  return d;
}

for (const [input, key] of [["mephoto", "photo"]]) {
  $(input).addEventListener("change", async (e) => {
    const f = e.target.files && e.target.files[0];
    e.target.value = "";
    if (!f) return;
    if (f.size > 40 * 1024 * 1024) { alert(T("post.tooBig")); return; }
    let who = "";
    try { who = localStorage.getItem("board:who") || ""; } catch { /* fine */ }
    // Say something before the wait, not after. Re-encoding a large photo
    // takes a moment on a phone, and a control that does nothing visible is a
    // control somebody presses again.
    let shot;
    try {
      shot = await shrink(f, 1000);
    } catch (err) {
      alert(T("post.badPhoto") + " (" + (err && err.message || "?") + ")");
      drawMePic();
      return;
    }
    if (shot.error) { alert(shot.error); drawMePic(); return; }
    const out = await saveMe({
      [key]: shot.data, [key + "Type"]: shot.type,
      ...(ME && ME.handle ? {} : { handle: who }),
    });
    if (out.error) alert(out.error);
    // No handle yet: the picture is up, so ask for the name while they are here.
    else if ((!ME || !ME.handle) && $("mesheet").hidden) openMe();
  });
}

/* The avatar inside the editor. Same picture, same picker, drawn from ME so it
 * updates the moment the upload comes back. */
function drawMePic() {
  const box = $("mepicin");
  fill(box);
  if (ME && ME.photo) {
    const img = Object.assign(document.createElement("img"),
      { src: "/api/public-media?id=" + encodeURIComponent(ME.photo), alt: "" });
    img.addEventListener("error", () => { img.remove(); box.textContent = initial(ME && ME.handle); });
    box.append(img);
  } else {
    box.textContent = initial(ME && ME.handle);
  }
  $("mepicgo").setAttribute("aria-label", T("me.addPhoto"));
  /* Three states, not two. A photo that is waiting to be read has to say so
     somewhere, and the block that used to say it is off the page. */
  $("mepicsay").textContent = !(ME && ME.photo) ? T("me.needPhoto")
    : ME.photoPending ? T("me.photoHeld") : "";
}
$("mepicgo").addEventListener("click", () => $("mephoto").click());

/* The days somebody is free, 0–6. Drawn rather than a row of checkboxes: seven
 * of those is a wall of text, and a week reads as a shape. */

function openMe(joining) {
  const made = Boolean(ME && ME.handle);
  // Asked once per opening of the sheet, not once ever.
  ASKEDPIC = false;
  $("metitle").textContent = T(made ? "me.editTitle" : "me.newTitle");
  $("mename").placeholder = T("me.name");
  $("mecampus").placeholder = T("me.campus");
  $("meage").placeholder = T("me.age");
  $("melangs").placeholder = T("me.langs");
  $("mehere").placeholder = T("me.here");
  $("meig").placeholder = T("me.ig");
  $("melinkshead").textContent = T("me.linksHead");
  $("melilab").textContent = T("me.liLab");
  $("meli").placeholder = T("me.li");
  $("meliwhy").textContent = T("me.liWhy");
  $("meiglab").textContent = T("me.igLab");
  $("megoallab").textContent = T("me.goalLab");
  $("mecampuslab").textContent = T("me.campusLab");
  $("meigwhy").textContent = T("me.igWhy");
  $("megoal").placeholder = T("me.goal");
  $("mewhy").textContent = T("me.whyNoContact");
  $("meshut").textContent = T("post.cancel");
  // Putting yourself up is not the same act as changing a detail later, and a
  // button that says the same word for both is the reason nobody is sure which
  // one they are doing.
  $("mesave").textContent = T(made ? "me.save" : "me.post");
  $("memorelabel").textContent = T("me.more");
  drawKey();
  $("mename").value = (ME && ME.handle) || "";
  $("mecampus").value = (ME && ME.campus) || "";
  $("meage").value = (ME && ME.age) || "";
  $("melangs").value = (ME && Array.isArray(ME.speaks) ? ME.speaks.join(", ") : "");
  $("mehere").value = (ME && ME.here) || "";
  // Shown back with the @ on it, because that is how somebody reads their own
  // handle; it is stored without one.
  $("meig").value = ME && ME.ig ? "@" + ME.ig : "";
  $("meli").value = (ME && ME.li) || "";
  $("megoal").value = (ME && ME.goal) || "";
  /* Open if there is already something in it, shut otherwise. Somebody who
   * filled these in once should not have to find them again to change one. */
  showMore(Boolean(joining) ||
    Boolean(ME && (ME.campus || ME.age || ME.here || ME.goal ||
      (ME.speaks && ME.speaks.length))));
  $("melookinglabel").textContent = T("bud.lookingLabel");
  $("melookingwhy").textContent = T("bud.lookingWhy");
  // Pressed "join the list", so it starts ticked — the button said what it was
  // going to do and a form that then makes you do it again is a form arguing
  // with its own button.
  /* On by default for a new page, and whatever they last chose for one that
   * exists. Defaulting a returning person back to on would be overruling them
   * every time they opened the form. */
  $("melooking").checked = joining === true ||
    (ME && ME.handle ? Boolean(ME.looking) : true);
  PICKED = (ME && Array.isArray(ME.rooms) ? ME.rooms : []).slice(0, 3);
  SAY = (ME && Array.isArray(ME.say) && ME.say.length)
    ? ME.say.map((r) => ({ me: r.me, want: r.want })) : [{ me: "", want: "" }];
  WHERE = (ME && ME.where) || "cn";
  WANTS = (ME && ME.wants) || "any";
  showRooms();
  $("mesaid").hidden = true;
  drawMePic();
  $("mesheet").hidden = false;
  // Focus the name only when there is already a face — otherwise the keyboard
  // covers the photo control the form is about to insist on.
  if (ME && ME.photo) $("mename").focus();
}
/* ---- the key: being the same person on a second browser --------------------
 *
 * WeChat's webview and Safari do not share storage, so the same person opening
 * the same link in each is two people to this board — which is the problem an
 * email login would be bought to solve. It does not need one. The identity
 * here is a random number this browser made up; everything on the server hangs
 * off a salted hash of it. Carrying the number to the other browser carries
 * the person, with no email address, no password, and nothing new written down
 * about anybody.
 *
 * The cost is stated where it is shown: whoever has the line IS you, and there
 * is nobody to appeal to if it is lost. That is the price of holding nothing.
 */
function drawKey() {
  $("keytitle").textContent = T("key.title");
  $("keybody").textContent = T("key.body");
  $("keywarn").textContent = T("key.warn");
  $("keyshow").textContent = $("keyopen").hidden ? T("key.show") : T("key.hide");
  $("keycopy").textContent = T("key.copy");
  $("keyhave").textContent = T("key.have");
  $("keyval").textContent = device || "—";
  // Nothing to show on a browser that cannot keep one.
  $("keyshow").hidden = !device;
}
$("keyshow").addEventListener("click", () => {
  $("keyopen").hidden = !$("keyopen").hidden;
  $("keyshow").textContent = $("keyopen").hidden ? T("key.show") : T("key.hide");
});
$("keycopy").addEventListener("click", () => {
  $("keycopy").textContent = T(copyText(device) ? "key.copied" : "act.copyFail");
  setTimeout(() => { $("keycopy").textContent = T("key.copy"); }, 2000);
});

$("keyhave").addEventListener("click", () => {
  $("keyEnterTitle").textContent = T("key.enterTitle");
  $("keyEnterBody").textContent = T("key.enterBody");
  $("keyin").placeholder = T("key.enterPlaceholder");
  $("keyshut").textContent = T("key.cancel");
  $("keygo").textContent = T("key.go");
  $("keyin").value = "";
  $("keysaid").hidden = true;
  // Only warned about when there is something to leave behind.
  const has = Boolean(ME && (ME.handle || ME.photo));
  $("keyReplace").hidden = !has;
  $("keyReplace").textContent = has ? T("key.replaceWarn") : "";
  $("keysheet").hidden = false;
  $("keyin").focus();
});
$("keyshut").addEventListener("click", () => { $("keysheet").hidden = true; });
$("keysheet").addEventListener("click", (e) => {
  if (e.target === $("keysheet")) $("keysheet").hidden = true;
});

/** A key from here is a uuid, or the fallback a browser with no crypto gets. */
const looksLikeKey = (k) =>
  /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(k) ||
  /^x[a-z0-9]{8,}$/i.test(k);

$("keyform").addEventListener("submit", async (e) => {
  e.preventDefault();
  const said = $("keysaid");
  const key = $("keyin").value.trim();
  const bad = (msg) => { said.hidden = false; said.classList.add("bad"); said.textContent = msg; };
  if (!looksLikeKey(key)) return bad(T("key.bad"));
  if (key === device) { said.hidden = false; said.classList.remove("bad");
    said.textContent = T("key.done"); return; }

  /* Asked before it is kept. A key with no page behind it is almost always a
   * key copied short, and swallowing that would leave somebody as a stranger
   * on their own board with no way to tell why. */
  let person = null;
  try {
    const d = await fetch("/api/me", { cache: "no-store", headers: { "x-board-device": key } })
      .then((r) => r.json());
    person = d && d.person;
  } catch { return bad(T("err.general")); }
  if (!person) return bad(T("key.bad"));

  try { localStorage.setItem("board:device", key); } catch { /* private window */ }
  try { if (person.handle) localStorage.setItem("board:who", person.handle); } catch { /* fine */ }
  said.hidden = false; said.classList.remove("bad"); said.textContent = T("key.done");
  // Everything on this page was drawn for the other person. Start again as
  // this one rather than repainting eleven things in the right order.
  setTimeout(() => location.reload(), 700);
});

function showMore(on) {
  $("memore").hidden = !on;
  $("memorego").setAttribute("aria-expanded", String(Boolean(on)));
}
$("memorego").addEventListener("click", () => showMore($("memore").hidden));

/* ---- what you are looking for ----------------------------------------------
 *
 * THREE GROUPS AND A FOLD. The first four boxes are what almost everybody on
 * this board wants — a language exchange, somebody to study with, somebody who
 * knows the city, or to be that person for somebody else. The other seven are
 * work, money and trade, and they sit behind their own + because a form that
 * opens on the word "investor" is a different form.
 *
 * MAX THREE, AND THE FORM SAYS SO RATHER THAN SILENTLY REFUSING. A fourth box
 * greys out and one line explains why. Disabling them with no explanation is
 * how a form gets described as broken.
 *
 * The keys here are the server's keys. The pairing lives in store.js and is
 * never shown: you tick "raising money" and come up for somebody who ticked
 * "investing", and nobody needs to be told that is what happened.
 */
const ROOMS_A = ["lang", "study"];
const ROOMS_B = ["new", "host"];
const ROOMS_C = ["job", "hire", "cofound", "raise", "invest", "buy", "sell",
                 "talent", "agent"];
let PICKED = [];
/* Whether the photo has been asked for once already this time the sheet was
   open. Once, then it stops standing in the way — see the note in saving. */
let ASKEDPIC = false;

function drawRooms() {
  const full = PICKED.length >= 3;
  const box = (key) => {
    const lab = el("label", "room" + (PICKED.includes(key) ? " on" : "")
      + (full && !PICKED.includes(key) ? " full" : ""));
    const inp = el("input");
    inp.type = "checkbox";
    inp.checked = PICKED.includes(key);
    inp.addEventListener("change", () => {
      if (inp.checked && PICKED.length >= 3) { inp.checked = false; drawRooms(); return; }
      PICKED = inp.checked ? [...PICKED, key] : PICKED.filter((k) => k !== key);
      drawRooms();
    });
    const txt = el("span", null, T("room." + key));
    const sub = T("room." + key + ".sub");
    // Only two of them carry a second line. T returns the key back when there
    // is no string, which would print "room.job.sub" under a box.
    if (sub && sub !== "room." + key + ".sub") txt.append(el("small", null, sub));
    lab.append(inp, txt);
    return lab;
  };
  for (const [id, keys] of [["meroomsA", ROOMS_A], ["meroomsB", ROOMS_B], ["meroomsC", ROOMS_C]]) {
    const wrap = $(id);
    wrap.textContent = "";
    for (const k of keys) wrap.append(box(k));
  }
  $("meroomfull").hidden = !full;
  $("meroomfull").textContent = T("room.full");
}

/* ---------------------------------------------------------------------------
 * THE SENTENCE
 *
 * "I am a Director looking for an Agent." Two dropdowns, and the sentence is
 * the rule: you come up for people who are what you are looking for and are
 * looking for what you are. Nothing on the screen explains it, because
 * nothing needs to.
 *
 * The room it lands in is worked out on the server from the pair — see
 * roomOfPair in store.js — so the feed filter, the /r/ doors and the matching
 * table go on working on rooms and never learn that the question changed.
 *
 * Sides are for reading. They group the list so it can be scanned, and they
 * decide nothing: a director looking for a writer is two people on the same
 * side and a perfectly good pair.
 */
const MAKE = ["director", "writer", "performer", "crew", "founder", "maker", "student"];
const BACK = ["agent", "producer", "brand", "buyer", "distributor",
              "investor", "lawyer", "recruiter"];
let SAY = [];

/** One dropdown, grouped into the two halves so twelve names can be read. */
function rolePick(now, onPick, wanting) {
  const sel = document.createElement("select");
  /* A PROMPT, NOT AN ELLIPSIS. "…" is honest and says nothing; a pill that
     says what goes in it is the difference between a control somebody
     understands and one they tap to find out. */
  const blank = el("option", null, T(wanting ? "say.pickWant" : "say.pickMe"));
  blank.value = "";
  sel.append(blank);
  for (const [half, keys] of [["say.make", MAKE], ["say.back", BACK]]) {
    const g = document.createElement("optgroup");
    g.label = T(half);
    for (const k of keys) {
      const o = el("option", null, T((wanting ? "role.a." : "role.") + k));
      o.value = k;
      if (k === now) o.selected = true;
      g.append(o);
    }
    sel.append(g);
  }
  sel.addEventListener("change", () => onPick(sel.value));
  return sel;
}

/** A pill that is one of a short closed list — where you are, where they
 *  should be. Same shape as the role pills so the line reads as one sentence
 *  rather than as a sentence with a form in it. */
function scopePick(prefix, keys, now, onPick) {
  const sel = document.createElement("select");
  for (const k of keys) {
    const o = el("option", null, T(prefix + "." + k));
    o.value = k;
    if (k === now) o.selected = true;
    sel.append(o);
  }
  sel.addEventListener("change", () => onPick(sel.value));
  return sel;
}

/** Their sliders mark. Drawn rather than an emoji so it takes the accent and
 *  sits on the baseline of a serif line without wobbling. */
function sayIcon() {
  const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  svg.setAttribute("viewBox", "0 0 24 24");
  svg.setAttribute("aria-hidden", "true");
  svg.setAttribute("class", "sayicon");
  for (const d2 of ["M3 7h13M20 7h1", "M3 12h4M11 12h10", "M3 17h9M16 17h5"]) {
    const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
    path.setAttribute("d", d2);
    svg.append(path);
  }
  for (const [cx, cy] of [[18, 7], [9, 12], [14, 17]]) {
    const c2 = document.createElementNS("http://www.w3.org/2000/svg", "circle");
    c2.setAttribute("cx", cx); c2.setAttribute("cy", cy); c2.setAttribute("r", "2");
    svg.append(c2);
  }
  return svg;
}

function drawSays() {
  const box = $("mesays");
  fill(box);
  box.append(sayIcon());
  if (!SAY.length) SAY = [{ me: "", want: "" }];
  SAY.forEach((row, i) => {
    const line = el("div", "sayrow");
    /* ONE SENTENCE, FOUR PILLS — and the last two are the question that used
     * to be its own block with two labelled rows of buttons under a heading.
     * Where somebody is and where they want people is the same sentence as
     * what they are and what they want; asking it separately was asking twice.
     *
     * Only on the first line. Where you are does not change between one
     * sentence and the next, and a pill that repeats is a pill somebody will
     * eventually set to two different things. */
    line.append(document.createTextNode((i ? T("say.and") : T("say.iam")) + " "));
    line.append(rolePick(row.me, (v) => { row.me = v; drawSays(); }, false));
    line.append(document.createTextNode(" " + T("say.lookingFor") + " "));
    line.append(rolePick(row.want, (v) => { row.want = v; drawSays(); }, true));
    /* TWO PILLS. THAT IS THE WHOLE QUESTION.
     *
     * It was four — what you are, where you are, what you want, where they
     * should be — then three. Both locations are gone from the sentence, and
     * neither is lost: they are filters inside the app, where somebody who
     * has decided to be here can narrow what they are looking at.
     *
     * The difference between the two places is the difference between a
     * question and a control. On the way in, every extra pill is a chance to
     * decide this is not worth the afternoon. Once you are in, a filter is
     * something you reach for because you want it. */
    /* The way out of a line somebody added by mistake. Never on the first —
     * a form whose only field can be deleted is a form that can be empty. */
    if (i > 0) {
      const x = el("button", "drop", T("say.drop"));
      x.type = "button";
      x.addEventListener("click", () => { SAY.splice(i, 1); drawSays(); });
      line.append(x);
    }
    box.append(line);
  });
  /* Offered only once the line above it is finished. "Add another" under a
   * half-filled sentence is an invitation to leave two of them half-filled. */
  const last = SAY[SAY.length - 1];
  const more = $("mesaymore");
  more.textContent = T("say.more");
  /* Not on the way in. A second sentence is a good thing to have and a bad
     thing to be offered before you have finished the first one ever. */
  more.hidden = !(ME && ME.handle) || SAY.length >= 3
    || !(last && last.me && last.want);
}
$("mesaymore").addEventListener("click", () => {
  SAY = [...SAY, { me: "", want: "" }];
  drawSays();
});

/** One row of choices, of which exactly one is on. */
function drawSeg(id, keys, now, pick) {
  const wrap = $(id);
  wrap.textContent = "";
  for (const k of keys) {
    const b = el("button", now === k ? "on" : "", T(wrap.dataset.prefix + "." + k));
    b.type = "button";
    b.addEventListener("click", () => { pick(k); });
    wrap.append(b);
  }
}

let WHERE = "cn", WANTS = "any";
function drawWhere() {
  $("mewhere").dataset.prefix = "room.where";
  $("mewants").dataset.prefix = "room.wants";
  drawSeg("mewhere", ["cn", "out"], WHERE, (k) => { WHERE = k; drawWhere(); });
  drawSeg("mewants", ["cn", "out", "any"], WANTS, (k) => { WANTS = k; drawWhere(); });
}

/* Shown only when they have said they want to be found. Off, the form is
   exactly as long as it was before any of this existed. */
function showRooms() {
  const on = $("melooking").checked;
  $("merooms").hidden = !on;
  if (!on) return;
  drawSays();
  /* THE ELEVEN BOXES ARE STILL HERE, AND STILL OFF.
   * They are what somebody who joined before the sentence existed picked, and
   * their rooms are read from them until they answer the sentence — see
   * roomsFor in store.js. Nobody is shown both questions: two ways to say the
   * same thing on one form is how a profile ends up disagreeing with itself. */
  // Somebody who ticked boxes before the sentence existed. Never a new person.
  const old = !SAY.some((r) => r.me && r.want) && PICKED.length > 0;
  for (const id of ["meroomhead", "meroomwhy", "megroup1", "meroomsA", "megroup2",
    "meroomsB", "megroup3", "meroomsC"]) $(id).hidden = !old;
  /* WHERE IS IN THE SENTENCE NOW. It was a heading and two labelled rows of
     buttons under the rooms; four pills in one line say it, and asking it
     twice on one form is how the two answers come to disagree. The block
     stays for the people still on the tick boxes, who have no sentence to
     carry it. */
  /* ONBOARDING IS ONE SENTENCE AND NOTHING ELSE.
   *
   * Somebody setting up a page for the first time is deciding whether this
   * place is worth their afternoon, and every extra question is a chance to
   * decide it is not. So the first time they see the sentence and that is all
   * — where they should be is a pill in it, and where YOU are defaults to
   * China, which is the premise of the whole board rather than a question.
   *
   * It all comes back the moment they have a page. Editing is a different act
   * from joining: somebody who is already in and has opened their own profile
   * has asked for the controls. */
  const first = !(ME && ME.handle);
  for (const id of ["mewherehead", "mewherelab1", "mewhere", "mewherelab2",
    "mewants", "mewherewhy"]) { const n = $(id); if (n) n.hidden = first; }
  $("meroomhead").textContent = T("room.head");
  $("meroomwhy").textContent = T("room.why");
  $("megroup1").textContent = T("room.groupStudy");
  $("megroup2").textContent = T("room.groupSettle");
  $("megroup3").textContent = T("room.more");
  $("mewherehead").textContent = T("room.whereHead");
  $("mewherelab1").textContent = T("room.whereMe");
  $("mewherelab2").textContent = T("room.whereThem");
  $("mewherewhy").textContent = T("room.whereWhy");
  drawRooms();
  drawWhere();
}
$("melooking").addEventListener("change", showRooms);


$("meshut").addEventListener("click", () => { $("mesheet").hidden = true; });
$("mesheet").addEventListener("click", (e) => {
  if (e.target === $("mesheet")) $("mesheet").hidden = true;
});
$("meform").addEventListener("submit", async (e) => {
  e.preventDefault();
  const said = $("mesaid");
  const handle = $("mename").value.trim();
  if (!handle) { said.hidden = false; said.classList.add("bad"); said.textContent = T("post.needName"); return; }
  /* A PHOTO IS ASKED FOR AND NO LONGER DEMANDED.
   *
   * A profile here has a face on it, and it should — but this refused to
   * finish without one, which put a camera roll between somebody and being in,
   * on a phone, in WeChat's browser, thirty seconds after they were handed a
   * password. Somebody who cannot find a photo they like at that moment does
   * not go and find one; they close it.
   *
   * They are asked once, here, and the picker opens for them. If they save
   * anyway they are in, and "Add your photo" is the first line of Things to do
   * on the other side — which is the right place for it, because by then they
   * have a reason to want to be seen. */
  if (!ME || !ME.photo) {
    if (!ASKEDPIC) {
      ASKEDPIC = true;
      said.hidden = false; said.classList.add("bad");
      said.textContent = T("me.needPhoto");
      $("mephoto").click();
      return;
    }
  }
  const out = await saveMe({
    handle, campus: $("mecampus").value.trim(),
    age: $("meage").value.replace(/\D/g, ""),
    // Typed as a sentence, kept as a list: "English, Spanish, a bit of Chinese"
    // is how somebody answers this, and splitting it here means the profile can
    // show them as separate things later without asking again.
    speaks: $("melangs").value.split(/[,，、]/).map((x) => x.trim()).filter(Boolean).slice(0, 6),
    looking: $("melooking").checked,
    // Sent whether or not the section was open: somebody who unticks "show me
    // in Browse" keeps what they picked, so ticking it again brings their
    // answers back rather than an empty form.
    // Only finished sentences go up. A half-answered line is somebody who
    // opened a dropdown and changed their mind, not a thing they said.
    say: SAY.filter((r) => r.me && r.want),
    rooms: PICKED, where: WHERE, wants: WANTS,
    here: $("mehere").value.trim(), goal: $("megoal").value.trim(),
    ig: $("meig").value.trim(),
    li: $("meli").value.trim(),
  });
  if (out.error) { said.hidden = false; said.classList.add("bad"); said.textContent = out.error; return; }
  // The name here is the name posts go out under, so the two stay in step.
  try { localStorage.setItem("board:who", handle); } catch { /* fine */ }
  said.hidden = false; said.classList.remove("bad"); said.textContent = T("me.saved");
  setTimeout(() => { $("mesheet").hidden = true; }, 900);
});

loadMyInvite();
loadStake();

fetch("/api/me", { headers: device ? { "x-board-device": device } : {} })
  .then((r) => r.json())
  .then((d) => {
    ME = d.person;
    WAITING = typeof d.waiting === "number" ? d.waiting : null;
    MEMBERS = Number(d.people || 0);
    drawFeedDoor();
    drawStake();
    RANK = d.rank || "";
    /* drawTodo BELONGS HERE and was missing. The list is made out of ME, and
       the only other place it is drawn is loadMyInvite, which runs before
       /api/me has landed — so somebody with a page, a photo and rooms was
       being told to make a page, add a photo and pick rooms, on a screen that
       simultaneously showed the Messages door only a named member gets. */
    paintNav(); drawTutor(); drawDeck(); drawTodo(); drawTalk(); drawAsk(); countNotes();
    /* Arrived from "edit" on their own profile. The form lives on this page,
       so the other page sends people here rather than growing a second copy of
       it — and the address is cleaned up afterwards so a reload does not open
       the sheet again over whatever they came back to read. */
    if (new URLSearchParams(location.search).get("edit") === "1") {
      openMe();
      try { history.replaceState(null, "", location.pathname); } catch { /* fine */ }
    }
  })
  .catch(paintNav);

load();
loadPeople();
loadWanted();
loadFollowers();
loadMatches();
</script>

<script>
/* Registering the worker.
 *
 * Classic script rather than a module so this runs before anything else and
 * on browsers that do not do modules — the worker is what makes the board
 * survive a bad connection, which is exactly the browser least likely to be
 * new.
 *
 * Deferred to load: registration competes with the page's own requests, and
 * the first paint matters more than the second visit.
 */
/* The counter. First-party, from this board's own hostname — the same file the
 * brand page loads, proxied by Caddy so nothing here is a third-party request.
 * Deferred: it must never compete with the board's own first paint. */
if (!/[?&]nocount\b/.test(location.search)) {
  const c = document.createElement("script");
  c.src = "/a/lx.js"; c.defer = true;
  document.head.append(c);
}

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("/sw.js").catch(() => { /* not fatal */ });
  });
}
</script>
