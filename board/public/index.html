  }
});

async function inAsk() {
  const mail = $("inmail").value.trim().toLowerCase();
  if (!/^[^@\s]+@[^@\s]+\.[a-z]{2,}$/.test(mail)) return inSaid(T("mail.bad"), true);
  let r;
  try {
    r = await fetch("/api/signin", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ mail }),
    });
  } catch { return inSaid(T("err.general"), true); }
  // The one answer that is about the board rather than about a person.
  if (r.status === 503) return inSaid(T("in.off"), true);
  if (!r.ok) return inSaid(T("err.general"), true);

  /* ON TO THE DIGITS WHETHER OR NOT ANYBODY HERE USES THAT ADDRESS, because
     the server will not say which — see /api/signin. The line under the box
     is true of both cases. */
  INSTEP = "code";
  INMAIL = mail;
  $("inTitle").textContent = T("in.codeTitle");
  $("inBody").textContent = T("in.codeBody", { mail });
  $("inmailwrap").hidden = true;
  $("incodewrap").hidden = false;
  $("ingo").textContent = T("in.go");
  inSaid(T("in.sent"), false);
  $("incode").focus();
}

async function inSpend() {
  const code = $("incode").value.replace(/\D/g, "").slice(0, 6);
  if (code.length !== 6) return inSaid(T("in.bad"), true);
  let r, d;
  try {
    r = await fetch("/api/signin/code", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ mail: INMAIL, code, device, over: INOVER ? "yes" : "" }),
    });
    d = await r.json().catch(() => ({}));
  } catch { return inSaid(T("err.general"), true); }

  /* ALREADY SOMEBODY ON THIS PHONE. Warned once and then allowed, the same
     shape as deleting everything: rebinding moves rather than copies, and the
     person who is here now would be left with no way back. */
  if (r.status === 409 && d.error === "here") {
    INOVER = true;
    $("inHere").hidden = false;
    $("inHere").textContent = T("in.here");
    $("ingo").textContent = T("in.anyway");
    // The warning is the message; a second line under it says nothing.
    $("insaid").hidden = true;
    return;
  }
  if (!r.ok) {
    if (d.error === "old") return inSaid(T("in.old"), true);
    if (d.error === "spent") return inSaid(T("in.spent"), true);
    return inSaid(Number(d.left) > 0 ? T("in.left", { n: d.left }) : T("in.bad"), true);
  }

  /* THE KEY, AND THIS IS THE ONLY PLACE IT WILL EVER EXIST. The server holds
     a salted hash of it and never the line itself, so a browser that drops it
     here is in exactly the position somebody is in when they lose their key —
     which is why it is written before anything else is said on screen. */
  try { localStorage.setItem("board:device", d.key); } catch { /* private window */ }
  try { if (d.handle) localStorage.setItem("board:who", d.handle); } catch { /* fine */ }
  inSaid(T("in.done", { who: d.handle || T("board.someone") }), false);
  /* Everything on this page was drawn for whoever was here before, so it
     starts again rather than repainting eleven things in the right order.
     `where` is set when the address belonged to somebody on the waiting list
     rather than a member: their card is not on this page at all. */
  setTimeout(() => {
    if (d.where) location.replace(d.where);
    else location.reload();
  }, 800);
}

  $("keygo").textContent = T("key.go");

$("keysheet").addEventListener("click", (e) => {
  if (e.target === $("keysheet")) $("keysheet").hidden = true;

/** A key from here is a uuid, or the fallback a browser with no crypto gets. */
const looksLikeKey = (k) =>
  /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(k) ||
  /^x[a-z0-9]{8,}$/i.test(k);

$("keyform").addEventListener("submit", async (e) => {
  e.preventDefault();
  const said = $("keysaid");
  const key = $("keyin").value.trim();
  const bad = (msg) => { said.hidden = false; said.classList.add("bad"); said.textContent = msg; };
  if (!looksLikeKey(key)) return bad(T("key.bad"));
  if (key === device) { said.hidden = false; said.classList.remove("bad");
    said.textContent = T("key.done"); return; }

  /* Asked before it is kept. A key with no page behind it is almost always a
   * key copied short, and swallowing that would leave somebody as a stranger
   * on their own board with no way to tell why. */
  let person = null;
  try {
    const d = await fetch("/api/me", { cache: "no-store", headers: { "x-board-device": key } })
      .then((r) => r.json());
    person = d && d.person;
  } catch { return bad(T("err.general")); }
  if (!person) return bad(T("key.bad"));

  try { localStorage.setItem("board:device", key); } catch { /* private window */ }
  try { if (person.handle) localStorage.setItem("board:who", person.handle); } catch { /* fine */ }
  said.hidden = false; said.classList.remove("bad"); said.textContent = T("key.done");
  // Everything on this page was drawn for the other person. Start again as
  // this one rather than repainting eleven things in the right order.
  setTimeout(() => location.reload(), 700);
});

/* ---- what you are looking for ----------------------------------------------
 *
 * THREE GROUPS AND A FOLD. The first four boxes are what almost everybody on
 * this board wants — a language exchange, somebody to study with, somebody who
 * knows the city, or to be that person for somebody else. The other seven are
 * work, money and trade, and they sit behind their own + because a form that
 * opens on the word "investor" is a different form.
 *
 * MAX THREE, AND THE FORM SAYS SO RATHER THAN SILENTLY REFUSING. A fourth box
 * greys out and one line explains why. Disabling them with no explanation is
 * how a form gets described as broken.
 *
 * The keys here are the server's keys. The pairing lives in store.js and is
 * never shown: you tick "raising money" and come up for somebody who ticked
 * "investing", and nobody needs to be told that is what happened.
 */
const ROOMS_A = ["lang", "study"];
const ROOMS_B = ["new", "host"];
const ROOMS_C = ["job", "hire", "cofound", "raise", "invest", "buy", "sell",
                 "talent", "agent"];
let PICKED = [];
/* Whether the photo has been asked for once already this time the sheet was
   open. Once, then it stops standing in the way — see the note in saving. */
let ASKEDPIC = false;

function drawRooms() {
  const full = PICKED.length >= 3;
  const box = (key) => {
    const lab = el("label", "room" + (PICKED.includes(key) ? " on" : "")
      + (full && !PICKED.includes(key) ? " full" : ""));
    const inp = el("input");
    inp.type = "checkbox";
    inp.checked = PICKED.includes(key);
    inp.addEventListener("change", () => {
      if (inp.checked && PICKED.length >= 3) { inp.checked = false; drawRooms(); return; }
      PICKED = inp.checked ? [...PICKED, key] : PICKED.filter((k) => k !== key);
      drawRooms();
    });
    const txt = el("span", null, T("room." + key));
    const sub = T("room." + key + ".sub");
    // Only two of them carry a second line. T returns the key back when there
    // is no string, which would print "room.job.sub" under a box.
    if (sub && sub !== "room." + key + ".sub") txt.append(el("small", null, sub));
    lab.append(inp, txt);
    return lab;
  };
  for (const [id, keys] of [["meroomsA", ROOMS_A], ["meroomsB", ROOMS_B], ["meroomsC", ROOMS_C]]) {
    const wrap = $(id);
    wrap.textContent = "";
    for (const k of keys) wrap.append(box(k));
  }
  $("meroomfull").hidden = !full;
  $("meroomfull").textContent = T("room.full");
}

/* ---------------------------------------------------------------------------
 * THE SENTENCE
 *
 * "I am a Director looking for an Agent." Two dropdowns, and the sentence is
 * the rule: you come up for people who are what you are looking for and are
 * looking for what you are. Nothing on the screen explains it, because
 * nothing needs to.
 *
 * The room it lands in is worked out on the server from the pair — see
 * roomOfPair in store.js — so the feed filter, the /r/ doors and the matching
 * table go on working on rooms and never learn that the question changed.
 *
 * Sides are for reading. They group the list so it can be scanned, and they
 * decide nothing: a director looking for a writer is two people on the same
 * side and a perfectly good pair.
 */
const MAKE = ["director", "writer", "performer", "crew", "founder", "maker", "student"];
const BACK = ["agent", "producer", "brand", "buyer", "distributor",
              "investor", "lawyer", "recruiter"];
let SAY = [];
/* WHAT THEY SAID THEY WERE ON THE WAY IN, and it does not change here.
 * "" when nobody ever asked — the seven who were here before the list, and
 * anybody admitted without filling in a card — and then the first pill is a
 * dropdown like it always was. Set from /api/me; never from this page.
 * The server stamps it on every save regardless, so this only decides whether
 * to draw a control for something that would be ignored. */
let SAYME = "";
/* Whether this person may make an offer. Told by /api/me, and it decides one
 * thing only: whether the block is drawn. The refusal that matters is on the
 * server, which checks the stored row rather than anything the page says. */
let CANOFFER = false;

/* ---- make an offer, in the tray --------------------------------------------
 *
 * Four fields and one line back. There is no list of sent offers here on
 * purpose: the operator has `make offers` for that, and a member with the flag
 * needs the thing in front of them to be the form, not a history.
 */
function drawMkOffer() {
  // Off — see off.js.
  if (OFF.offers) { const b2 = $("mkoffer"); if (b2) b2.hidden = true; return; }
  const box = $("mkoffer");
  if (!box) return;
  // See MAKE_OFFERS above. The flag still decides who could; this decides
  // whether anybody can find the form at all.
  const on = CANOFFER && MAKE_OFFERS;
  box.hidden = !on;
  if (!on) return;
  $("mkofferlab").textContent = T("mko.lab");
  $("mkofferwhy").textContent = T("mko.why");
  $("mkofferwhok").textContent = T("mko.who");
  $("mkoffergivek").textContent = T("mko.give");
  $("mkoffermoneyk").textContent = T("mko.money");
  $("mkofferwantk").textContent = T("mko.want");
  $("mkoffergo").textContent = T("mko.go");
  $("mkofferwho").placeholder = T("mko.whoHint");
  $("mkoffergive").placeholder = T("mko.giveHint");
  $("mkoffermoney").placeholder = T("mko.moneyHint");
  $("mkofferwant").placeholder = T("mko.wantHint");
  $("mkofferkindk").textContent = T("mko.kind");
  $("mkkjob").textContent = T("mko.kindJob");
  $("mkkproject").textContent = T("mko.kindProject");
  drawKind();
}

/* Which kind is chosen, and the one thing it changes on this form: what the
 * money box says when it is empty. A project's money line is allowed to be
 * "not settled yet" — that is what the thread it opens is for. */
let OKIND = "job";
function drawKind() {
  $("mkkjob").classList.toggle("on", OKIND === "job");
  $("mkkproject").classList.toggle("on", OKIND === "project");
  $("mkoffermoney").placeholder = T(OKIND === "project" ? "mko.moneyOpenHint" : "mko.moneyHint");
  $("mkoffergive").placeholder = T(OKIND === "project" ? "mko.giveProjectHint" : "mko.giveHint");
}
for (const id of ["mkkjob", "mkkproject"]) {
  const el = $(id);
  if (el) el.addEventListener("click", () => { OKIND = el.dataset.kind; drawKind(); });
}

async function makeOffer() {
  const give = $("mkoffergive").value.trim();
  if (!give) { $("mkoffergive").focus(); return; }
  const b = $("mkoffergo");
  b.disabled = true;
  const note = $("mkoffernote");
  try {
    const r = await fetch("/api/offer", {
      method: "POST", headers: { "content-type": "application/json" },
      body: JSON.stringify({
        device, kind: OKIND, who: $("mkofferwho").value.trim(), give,
        money: $("mkoffermoney").value.trim(), want: $("mkofferwant").value.trim(),
      }),
    });
    const d = await r.json().catch(() => ({}));
    if (!r.ok || !d.code) {
      note.hidden = false;
      note.textContent = T(d.error === "nopage" ? "mko.nopage" : "mko.failed");
      b.disabled = false;
      return;
    }
    const url = location.origin + "/o/" + d.code;
    const out = $("mkofferout");
    out.hidden = false;
    out.textContent = url;
    note.hidden = false;
    note.textContent = T("mko.made");
    /* The form empties, because the next thing somebody does here is write a
       different offer to a different person — leaving the last one in the
       boxes is how two people get sent the same words by accident. */
    for (const id of ["mkofferwho", "mkoffergive", "mkoffermoney", "mkofferwant"]) {
      $(id).value = "";
    }
    b.disabled = false;
  } catch {
    note.hidden = false;
    note.textContent = T("mko.failed");
    b.disabled = false;
  }
}

$("mkoffergo").addEventListener("click", makeOffer);
/* SENDING IT, the same way the invite beside it is sent.
 *
 * Outside WeChat the share sheet is the whole point — one tap and WeChat is in
 * the list with everything else. Inside WeChat a page may not open one at all;
 * the ⋯ menu is the only way there, so the clipboard is the honest version,
 * which is what every other share in this app already does.
 *
 * The words carry the link rather than the link travelling bare, because what
 * lands in the chat should say what it is before somebody taps a strange
 * address. */
$("mkofferout").addEventListener("click", () => {
  const url = $("mkofferout").textContent.trim();
  if (!url) return;
  const words = T("mko.share", { url });
  const note = (w) => { $("mkoffernote").textContent = w; };
  if (!IN_WECHAT && navigator.share) {
    navigator.share({ title: T("site.title"), text: words })
      .catch(() => note(copyText(words) ? T("mko.copied") : T("mko.copyfail")));
    return;
  }
  note(copyText(words) ? T("mko.copied") : T("mko.copyfail"));
});

/* The sentence as it stands on the server, copied so the pills can be moved
 * about without touching the profile until a save lands. Called twice: once
 * when /api/me arrives, because the pills are on Browse and draw before
 * anybody opens a form, and again when the form opens, because by then a save
 * may have moved it. */
function seedSay() {
  SAY = (ME && Array.isArray(ME.say) && ME.say.length)
    ? ME.say.map((r) => ({ me: r.me, want: r.want })) : [{ me: "", want: "" }];
}

/** One dropdown, grouped into the two halves so twelve names can be read. */
function rolePick(now, onPick, wanting) {
  const sel = document.createElement("select");
  /* A PROMPT, NOT AN ELLIPSIS. "…" is honest and says nothing; a pill that
     says what goes in it is the difference between a control somebody
     understands and one they tap to find out. */
  const blank = el("option", null, T(wanting ? "say.pickWant" : "say.pickMe"));
  blank.value = "";
  sel.append(blank);
  /* THE OPEN ANSWER, FIRST AND OUTSIDE THE TWO HALVES.
   *
   * The sentence made somebody name one role before it counted as answered,
   * and plenty of people here do not have one in mind — they want to see who
   * is in the room. Forcing a choice to get past the question is how a form
   * collects an answer nobody meant, so "anyone" is a real answer: it puts
   * them in every room they stand in rather than one. See ANYONE in store.js.
   *
   * Only on this side. It is a thing to be looking FOR and never a thing to
   * be, and the server enforces that whatever this page sends. */
  if (wanting) {
    const any = el("option", null, T("role.a.anyone"));
    any.value = "anyone";
    if (now === "anyone") any.selected = true;
    sel.append(any);
  }
  for (const [half, keys] of [["say.make", MAKE], ["say.back", BACK]]) {
    const g = document.createElement("optgroup");
    g.label = T(half);
    for (const k of keys) {
      /* THE ARTICLE COMES WITH THE WORD, on this side too — see say.iam.
         A native select shows the option's own text when it is shut, so the
         pill cannot say one thing in the list and another in the sentence;
         the list reads "a Director / an Agent / Crew" and the sentence reads
         correctly for all three. */
      const o = el("option", null, T("role.a." + k));
      o.value = k;
      if (k === now) o.selected = true;
      g.append(o);
    }
    sel.append(g);
  }
  sel.addEventListener("change", () => onPick(sel.value));
  return sel;
}

/** A pill that is one of a short closed list — where you are, where they
 *  should be. Same shape as the role pills so the line reads as one sentence
 *  rather than as a sentence with a form in it. */
function scopePick(prefix, keys, now, onPick) {
  const sel = document.createElement("select");
  for (const k of keys) {
    const o = el("option", null, T(prefix + "." + k));
    o.value = k;
    if (k === now) o.selected = true;
    sel.append(o);
  }
  sel.addEventListener("change", () => onPick(sel.value));
  return sel;
}

/** Their sliders mark. Drawn rather than an emoji so it takes the accent and
 *  sits on the baseline of a serif line without wobbling. */
function sayIcon() {
  const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  svg.setAttribute("viewBox", "0 0 24 24");
  svg.setAttribute("aria-hidden", "true");
  svg.setAttribute("class", "sayicon");
  for (const d2 of ["M3 7h13M20 7h1", "M3 12h4M11 12h10", "M3 17h9M16 17h5"]) {
    const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
    path.setAttribute("d", d2);
    svg.append(path);
  }
  for (const [cx, cy] of [[18, 7], [9, 12], [14, 17]]) {
    const c2 = document.createElementNS("http://www.w3.org/2000/svg", "circle");
    c2.setAttribute("cx", cx); c2.setAttribute("cy", cy); c2.setAttribute("r", "2");
    svg.append(c2);
  }
  return svg;
}

function drawSays() {
  const box = $("mesays");
  fill(box);
  box.append(sayIcon());
  if (!SAY.length) SAY = [{ me: "", want: "" }];
  SAY.forEach((row, i) => {
    const line = el("div", "sayrow");
    /* ONE SENTENCE, FOUR PILLS — and the last two are the question that used
     * to be its own block with two labelled rows of buttons under a heading.
     * Where somebody is and where they want people is the same sentence as
     * what they are and what they want; asking it separately was asking twice.
     *
     * Only on the first line. Where you are does not change between one
     * sentence and the next, and a pill that repeats is a pill somebody will
     * eventually set to two different things. */
    /* WHEN THEY ALREADY ANSWERED IT, IT IS NOT ON THIS CARD AT ALL.
     *
     * It was a fixed pill saying "I am an Investor" — true, unchangeable, and
     * therefore not a control. A word somebody cannot edit, sitting in the
     * middle of the one thing on this screen they CAN edit, teaches them the
     * card does not respond. They said what they are in the waiting room and
     * it is on their own page; saying it back to them above the deck, every
     * visit, is the app reciting their own form to them.
     *
     * So the card carries only the half that moves. row.me is still set here
     * — the sentence is a pair and the matching needs both — it is just not
     * drawn.
     *
     * THE ONE CASE WHERE IT STAYS. Somebody who never answered it: the
     * handful who were here before the waiting list, whose sentence has no
     * first half and who would otherwise come up for nobody, for ever, with
     * nothing on this screen to say why. They get the full sentence and both
     * dropdowns, and it is theirs to set once. */
    if (SAYME) {
      row.me = SAYME;
      line.append(document.createTextNode(
        (i ? T("say.andOnly") : T("say.want1")) + " "));
    } else {
      line.append(document.createTextNode((i ? T("say.and") : T("say.iam")) + " "));
      line.append(rolePick(row.me, (v) => { row.me = v; drawSays(); saveSay(); }, false));
      line.append(document.createTextNode(" " + T("say.lookingFor") + " "));
    }
    line.append(rolePick(row.want, (v) => { row.want = v; drawSays(); saveSay(); }, true));
    /* TWO PILLS. THAT IS THE WHOLE QUESTION.
     *
     * It was four — what you are, where you are, what you want, where they
     * should be — then three. Both locations are gone from the sentence, and
     * neither is lost: they are filters inside the app, where somebody who
     * has decided to be here can narrow what they are looking at.
     *
     * The difference between the two places is the difference between a
     * question and a control. On the way in, every extra pill is a chance to
     * decide this is not worth the afternoon. Once you are in, a filter is
     * something you reach for because you want it. */
    /* The way out of a line somebody added by mistake. Never on the first —
     * a form whose only field can be deleted is a form that can be empty. */
    if (i > 0) {
      const x = el("button", "drop", T("say.drop"));
      x.type = "button";
      x.addEventListener("click", () => { SAY.splice(i, 1); drawSays(); saveSay(); });
      line.append(x);
    }
    box.append(line);
  });
  /* "AND SOMETHING ELSE" IS NOT OFFERED ANY MORE.
   *
   * A second sentence is a real feature and the invitation to write one is
   * not. This block sits on the home screen, under the faces, and its whole
   * job there is to show in one look what the app does: I am this, looking
   * for that. A second row dropping out underneath the first turns one clear
   * sentence into a form with an Add button, on the screen that has least
   * room to spare for either.
   *
   * NOTHING IS TAKEN FROM ANYBODY. Rows that exist are still drawn, still
   * editable and still removable — see the × on each. Only the way to add a
   * third and a second from here is gone, and it goes back the moment there
   * is a screen for it that is not this one. */
  const more = $("mesaymore");
  more.hidden = true;
  const sec = $("saysay");
  if (sec) sec.hidden = false;
  drawSayHead();
}
/* THE ROW WHEN IT IS SHUT: the icon, what they currently say, and a caret.
 *
 * The sentence in their own words rather than a label, because that is the
 * only thing worth a row here — "Looking for a Founder" tells them whether to
 * open it; "Your sentence" does not. Whoever has not answered it yet gets the
 * ask instead, which is the one case where this should be inviting.
 */
function drawSayHead() {
  const head = $("sayhead");
  if (!head) return;
  fill(head);
  const done = SAY.filter((r) => r.want);
  const words = done.length
    ? done.map((r) => T("role.a." + r.want)).join(T("brw.qjoin") || ", ")
    : "";
  const now = el("span", "saynow");
  if (words) {
    now.append(document.createTextNode(T("say.want1") + " "));
    now.append(el("b", null, words));
  } else {
    now.append(document.createTextNode(T("say.pickWant")));
  }
  head.append(sayIcon(), now, el("i", "saycar"));
  if (head.dataset.on) return;
  head.dataset.on = "1";
  head.addEventListener("click", () => {
    const body = $("saybody");
    const open = body.hidden;
    body.hidden = !open;
    head.setAttribute("aria-expanded", open ? "true" : "false");
    /* However they last left it. Somebody who opens this every week should
       not have to open it every week, and somebody who never touches it
       should not be looking at a form. */
    try { localStorage.setItem("board:say", open ? "1" : "0"); } catch { /* fine */ }
  });
  /* OPEN FOR SOMEBODY WHO HAS NOT ANSWERED IT.
     However they last left it is right for a member who has a sentence and
     changes it twice a year. For somebody filling this form in for the first
     time, a shut fold reading "What are you looking for?" is a question they
     can walk past — and walking past it is the one mistake that leaves them
     matched with nobody. */
  let open = !done.length;
  if (!open) {
    try { open = localStorage.getItem("board:say") === "1"; } catch { /* fine */ }
  }
  $("saybody").hidden = !open;
  head.setAttribute("aria-expanded", open ? "true" : "false");
}

/* THE SENTENCE SAVES ITSELF.
 *
 * It sits in the form now, under the name — but it is not part of the form's
 * own save, and it was written when it lived on Browse with no save button
 * anywhere near it. Every change goes up on its own, to a route that takes
 * the sentence and nothing else. That is still right here: somebody who
 * changes a pill and closes the sheet without pressing the button has still
 * changed their sentence, which is what they meant.
 *
 * HALF-FINISHED LINES DO NOT GO. Somebody who opens the second dropdown and
 * changes their mind has not said anything; the filter is the same one the
 * profile form used.
 *
 * LAST ONE WINS. Two dropdowns changed quickly are two saves in flight, and
 * the order they land in is not the order they were sent in. The counter
 * makes a late answer to an old question do nothing.
 */
let sayN = 0;
async function saveSay() {
  const said = $("saysaid");
  const mine = ++sayN;
  const rows = SAY.filter((r) => r.me && r.want);
  /* NO PAGE YET, NOTHING TO SAVE IT TO. /api/me/say hangs off a person row and
     answers 404 without one — so for somebody filling the form in for the
     first time this would report "could not save" about a sentence that is
     going to be saved a moment later, by the button under it, which sends SAY
     along with everything else. */
  if (!(ME && ME.handle)) {
    if (said) said.hidden = true;
    return;
  }
  if (said) { said.hidden = false; said.classList.remove("bad"); said.textContent = T("say.saving"); }
  let ok = false;
  try {
    const r = await fetch("/api/me/say", {
      method: "PUT", headers: { "content-type": "application/json" },
      body: JSON.stringify({ device, say: rows }),
    });
    ok = r.ok;
  } catch { ok = false; }
  if (mine !== sayN) return;
  if (!said) return;
  /* The profile in hand is now out of date, and opening the form re-seeds the
     pills from it — so it is brought level here rather than re-fetched. */
  if (ok && ME) ME.say = rows.map((r) => ({ me: r.me, want: r.want }));
  said.classList.toggle("bad", !ok);
  said.textContent = T(ok ? "say.saved" : "say.saveno");
  /* The confirmation goes; the failure stays. One is a receipt nobody needs
     to keep reading, the other is a thing they have to do something about. */
  if (ok) setTimeout(() => { if (mine === sayN) said.hidden = true; }, 1600);
}

$("mesaymore").addEventListener("click", () => {
  SAY = [...SAY, { me: "", want: "" }];
  drawSays();
});

/** One row of choices, of which exactly one is on. */
function drawSeg(id, keys, now, pick) {
  const wrap = $(id);
  wrap.textContent = "";
  for (const k of keys) {
    const b = el("button", now === k ? "on" : "", T(wrap.dataset.prefix + "." + k));
    b.type = "button";
    b.addEventListener("click", () => { pick(k); });
    wrap.append(b);
  }
}

let WHERE = "cn", WANTS = "any";
function drawWhere() {
  $("mewhere").dataset.prefix = "room.where";
  $("mewants").dataset.prefix = "room.wants";
  drawSeg("mewhere", ["cn", "out"], WHERE, (k) => { WHERE = k; drawWhere(); });
  drawSeg("mewants", ["cn", "out", "any"], WANTS, (k) => { WANTS = k; drawWhere(); });
}

/* Shown only when they have said they want to be found. Off, the form is
   exactly as long as it was before any of this existed. */
function showRooms() {
  const on = $("melooking").checked;
  $("merooms").hidden = !on;
  if (!on) return;
  drawSays();
  /* THE ELEVEN BOXES ARE STILL HERE, AND STILL OFF.
   * They are what somebody who joined before the sentence existed picked, and
   * their rooms are read from them until they answer the sentence — see
   * roomsFor in store.js. Nobody is shown both questions: two ways to say the
   * same thing on one form is how a profile ends up disagreeing with itself. */
  // Somebody who ticked boxes before the sentence existed. Never a new person.
  const old = !SAY.some((r) => r.me && r.want) && PICKED.length > 0;
  for (const id of ["meroomhead", "meroomwhy", "megroup1", "meroomsA", "megroup2",
    "meroomsB", "megroup3", "meroomsC"]) $(id).hidden = !old;
  /* WHERE IS IN THE SENTENCE NOW. It was a heading and two labelled rows of
     buttons under the rooms; four pills in one line say it, and asking it
     twice on one form is how the two answers come to disagree. The block
     stays for the people still on the tick boxes, who have no sentence to
     carry it. */
  /* ONBOARDING IS ONE SENTENCE AND NOTHING ELSE.
   *
   * Somebody setting up a page for the first time is deciding whether this
   * place is worth their afternoon, and every extra question is a chance to
   * decide it is not. So the first time they see the sentence and that is all
   * — where they should be is a pill in it, and where YOU are defaults to
   * China, which is the premise of the whole board rather than a question.
   *
   * It all comes back the moment they have a page. Editing is a different act
   * from joining: somebody who is already in and has opened their own profile
   * has asked for the controls. */
  const first = !(ME && ME.handle);
  for (const id of ["mewherehead", "mewherelab1", "mewhere", "mewherelab2",
    "mewants", "mewherewhy"]) { const n = $(id); if (n) n.hidden = first; }
  $("meroomhead").textContent = T("room.head");
  $("meroomwhy").textContent = T("room.why");
  $("megroup1").textContent = T("room.groupStudy");
  $("megroup2").textContent = T("room.groupSettle");
  $("megroup3").textContent = T("room.more");
  $("mewherehead").textContent = T("room.whereHead");
  $("mewherelab1").textContent = T("room.whereMe");
  $("mewherelab2").textContent = T("room.whereThem");
  $("mewherewhy").textContent = T("room.whereWhy");
  drawRooms();
  drawWhere();
}
$("melooking").addEventListener("change", showRooms);


$("meshut").addEventListener("click", () => { $("mesheet").hidden = true; });
$("mesheet").addEventListener("click", (e) => {
  if (e.target === $("mesheet")) $("mesheet").hidden = true;
});
$("meform").addEventListener("submit", async (e) => {
  e.preventDefault();
  const said = $("mesaid");
  const handle = $("mename").value.trim();
  if (!handle) { said.hidden = false; said.classList.add("bad"); said.textContent = T("post.needName"); return; }
  /* A PHOTO IS ASKED FOR AND NO LONGER DEMANDED.
   *
   * A profile here has a face on it, and it should — but this refused to
   * finish without one, which put a camera roll between somebody and being in,
   * on a phone, in WeChat's browser, thirty seconds after they were handed a
   * password. Somebody who cannot find a photo they like at that moment does
   * not go and find one; they close it.
   *
   * They are asked once, here, and the picker opens for them. If they save
   * anyway they are in, and "Add your photo" is the first line of Things to do
   * on the other side — which is the right place for it, because by then they
   * have a reason to want to be seen. */
  if (!ME || !ME.photo) {
    if (!ASKEDPIC) {
      ASKEDPIC = true;
      said.hidden = false; said.classList.add("bad");
      said.textContent = T("me.needPhoto");
      /* AND THE BUTTON SAYS SO. The line under it says "you can do it after",
         and then the button somebody just pressed does nothing they can see:
         the picker opens behind the sheet, and on a phone that reads as a
         form refusing to submit. The way through is to press it again, so it
         is the button that says it. */
      $("mesave").textContent = T("me.postAnyway");
      $("mephoto").click();
      return;
    }
  }
  const out = await saveMe({
    handle, campus: $("mecampus").value.trim(),
    age: $("meage").value.replace(/\D/g, ""),
    // Typed as a sentence, kept as a list: "English, Spanish, a bit of Chinese"
    // is how somebody answers this, and splitting it here means the profile can
    // show them as separate things later without asking again.
    speaks: $("melangs").value.split(/[,，、]/).map((x) => x.trim()).filter(Boolean).slice(0, 6),
    looking: $("melooking").checked,
    // Sent whether or not the section was open: somebody who unticks "show me
    // in Browse" keeps what they picked, so ticking it again brings their
    // answers back rather than an empty form.
    // Only finished sentences go up. A half-answered line is somebody who
    // opened a dropdown and changed their mind, not a thing they said.
    say: SAY.filter((r) => r.me && r.want),
    rooms: PICKED, where: WHERE, wants: WANTS,
    here: $("mehere").value.trim(), goal: $("megoal").value.trim(),
    ig: $("meig").value.trim(),
    li: $("meli").value.trim(),
  });
  if (out.error) {
    said.hidden = false; said.classList.add("bad");
    // The one refusal that is about a particular box rather than the save.
    said.textContent = out.error === "mailTaken" ? T("mail.taken") : out.error;
    return;
  }
  // The name here is the name posts go out under, so the two stay in step.
  try { localStorage.setItem("board:who", handle); } catch { /* fine */ }
  said.hidden = false; said.classList.remove("bad"); said.textContent = T("me.saved");
  /* THE BOX BELOW THIS BUTTON DEPENDS ON WHAT THE BUTTON JUST DID. "Someone
     else" is offered to anybody with a page, and somebody filling this in for
     the first time did not have one when the page loaded — so without this it
     appears on their next visit instead of the moment it becomes true. */
  paintRun();
  setTimeout(() => { $("mesheet").hidden = true; }, 900);
});

loadMyInvite();
loadStake();

fetch("/api/me", { headers: device ? { "x-board-device": device } : {} })
  .then((r) => r.json())
  .then((d) => {
    ME = d.person;
    /* THE FIXED HALF, and it arrives before anything draws the sentence. A
       string when they answered it on the way in, "" when nobody asked. */
    SAYME = typeof d.sayMe === "string" ? d.sayMe : "";
    CANOFFER = Boolean(d.canOffer);
    drawMkOffer();
    WAITING = typeof d.waiting === "number" ? d.waiting : null;
    MEMBERS = Number(d.people || 0);
    drawStake();
    RANK = d.rank || "";
    /* drawTodo BELONGS HERE and was missing. The list is made out of ME, and
       the only other place it is drawn is loadMyInvite, which runs before
       /api/me has landed — so somebody with a page, a photo and rooms was
       being told to make a page, add a photo and pick rooms, on a screen that
       simultaneously showed the Messages door only a named member gets. */
    seedSay(); drawSays();
    paintNav(); drawTutor(); drawDeck(); drawTodo(); drawTalk(); drawAsk(); countNotes();
    /* AND THE INVITE BLOCK, which was drawn once by loadMyInvite before this
       landed. The share link needs a page to credit — an id and a name — so
       drawn against a null ME it hid the one thing every member is supposed
       to have. Redrawn here, when there is somebody to draw it for. */
    drawMyInvite();
    /* AFTER drawDeck, ALWAYS. It reads whether Browse is already showing the
       same two numbers, and before the deck is drawn the answer is always no
       — which is how the line ended up on the screen twice. */
    drawFeedDoor();
    /* Arrived from "edit" on their own profile. The form lives on this page,
       so the other page sends people here rather than growing a second copy of
       it — and the address is cleaned up afterwards so a reload does not open
       the sheet again over whatever they came back to read. */
    // Read at load — see CAME_TO_EDIT. The address has already been tidied by
    // then, so there is nothing left here to clean up.
    if (CAME_TO_EDIT) openMe();
  })
  .catch(paintNav);

/* THE WAY IN, AND ONLY FOR PEOPLE WHO HAVE ONE. An agent who has added
   somebody gets a link to the switcher beside their inbox; everybody else
   never learns the page exists, because for them it is a screen that explains
   a feature they are not using. Asked once, quietly, and a failure leaves the
   link hidden — which is the right direction. */
function paintRun() {
  fetch("/api/run", { headers: { "x-board-device": device } })
    .then((r) => r.json())
    .then((d) => {
      if (!d || !d.me) return;
      const runs = (d.run || []).length;
      /* SHOWN TO SOMEBODY WHO SAYS THEY ARE AN AGENT, not only to somebody who
         already runs people. It was the second test alone, which meant an
         agent who had just come through the door — nobody added yet, which is
         every agent for their first ten minutes — had no way back to the
         console they were invited for. A dead end on the one screen the whole
         invite was about. */
      /* THE BOX IN THE PROFILE FORM IS SHOWN TO EVERYBODY WITH A PAGE, which
         is not the same audience as the link in the header. The header link
         is a way back to a console you are already using; the box is how
         somebody finds out the console exists. The one exclusion is a person
         an agent already speaks for — /api/run/add refuses them, so offering
         it would be an offer that fails on press. */
      if (d.me.handle && !d.as) {
        $("runtitle").textContent = T("me.runTitle");
        $("runbody").textContent = T("me.runBody");
        $("rungo").textContent = T("me.runGo");
        // With a roster, the console is the useful screen and the setup page
        // is a detour — so the second line appears only once there is one.
        $("runmore").textContent = T("me.runMore");
        $("runmore").hidden = !runs;
        /* SOMEBODY ALREADY HANDLES THIS. Then neither half of the box is a
           question any more: it is a fact, and the only honest thing to show
           is which. Handing it back is the agent's press, at /run — the row
           is theirs to release, which is the same rule that put the press to
           give it away on this side. */
        /* AND ITS LABEL, which was the whole of it the first time round: an
           empty button has no size, so it was there, unhidden, and could not
           be seen or pressed. */
        $("repgo").textContent = T("me.repGo");
        $("repgo").hidden = d.me.client;
        // And the ＋ menu's third line, which is the same permission.
        CANRUN = !d.me.client;
        drawPlus();
        $("repopen").hidden = true;
        $("rungo").hidden = d.me.client;
        $("runbody").textContent = d.me.client
          ? T("me.client", { who: d.me.agentName || T("board.someone") })
          : T("me.runBody");
        $("runbox").hidden = false;
      }
      if (!runs && !d.me.agent) return;
      const go = $("gorun");
      /* And it points at whichever of the two is useful. With a roster, the
         roster; with nobody yet, there is nothing to manage and the only thing
         to do is put somebody up. */
      go.href = runs ? "/run" : "/onboard";
      go.firstChild.textContent = T(runs ? "run.title" : "ob.title");
      go.dataset.set = "1";
      go.hidden = false;
    })
    .catch(() => { /* no link rather than a broken one */ });
}

/* HANDING YOUR OWN ACCOUNT TO SOMEBODY. Shut until asked for, because it is
   the rarer half of the box and the more consequential press in it. */
$("repgo").addEventListener("click", () => {
  const box = $("repopen");
  box.hidden = !box.hidden;
  if (!box.hidden) {
    $("repsay").textContent = T("me.repSay");
    $("replab").textContent = T("me.repLab");
    $("repdo").textContent = T("me.repDo");
    $("repsaid").hidden = true;
    $("repcode").focus();
  }
});
$("repdo").addEventListener("click", async () => {
  const said = $("repsaid");
  const code = $("repcode").value.trim().toUpperCase();
  const fail = (key) => {
    said.hidden = false; said.classList.add("bad"); said.textContent = T(key);
    $("repdo").disabled = false;
  };
  if (code.length !== 6) return fail("me.repBad");
  $("repdo").disabled = true;
  let d = null;
  try {
    d = await fetch("/api/me/agent", {
      method: "POST", headers: { "content-type": "application/json" },
      body: JSON.stringify({ device, code }),
    }).then((r) => r.json());
  } catch { return fail("act.again"); }
  if (!d || !d.ok) {
    /* EVERY REFUSAL SAYS WHICH ONE. "That did not work" over six different
       causes is the message that makes somebody type the same wrong code
       four times — and two of these ("you speak for other people", "theirs
       is full") are not the person's mistake at all. */
    return fail({
      bad: "me.repBad", old: "me.repOld", self: "me.repSelf",
      already: "me.repAlready", runs: "me.repRuns", chain: "me.repRuns",
      full: "me.repFull", nopage: "post.needName",
    }[d && d.error] || "me.repBad");
  }
  $("repdo").disabled = false;
  said.hidden = false; said.classList.remove("bad");
  said.textContent = T("me.repOk", { who: d.who || T("board.someone") });
  $("repcode").value = "";
  // The box above this is now describing the wrong world — it still offers to
  // add somebody, which this press just made impossible.
  paintRun();
});

/* "#write" used to bring the write sheet up on this page. The ＋ in Messages
   opens it there now, where the conversation is. */

drawBeing();
paintRun();
load();
loadPeople();
loadWanted();
loadFollowers();
loadMatches();
</script>

<script>
/* Registering the worker.
 *
 * Classic script rather than a module so this runs before anything else and
 * on browsers that do not do modules — the worker is what makes the board
 * survive a bad connection, which is exactly the browser least likely to be
 * new.
 *
 * Deferred to load: registration competes with the page's own requests, and
 * the first paint matters more than the second visit.
 */
/* The counter. First-party, from this board's own hostname — the same file the
 * brand page loads, proxied by Caddy so nothing here is a third-party request.
 * Deferred: it must never compete with the board's own first paint. */
if (!/[?&]nocount\b/.test(location.search)) {
  const c = document.createElement("script");
  c.src = "/a/lx.js"; c.defer = true;
  document.head.append(c);
}

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("/sw.js").catch(() => { /* not fatal */ });
  });
}
</script>
</body>
