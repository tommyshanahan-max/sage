<script type="module">
import { T, when, lang, setLang, pickLang, langButton } from "/i18n.js";

const $ = (id) => document.getElementById(id);
const el = (t, c, x) => { const n = document.createElement(t); if (c) n.className = c;
  if (x !== undefined) n.textContent = x; return n; };

/* WHY THIS BLOCK EXISTS
 *
 * This board is meant to be forwarded into a WeChat chat and read where it
 * lands. That means the browser is not Chrome: on Android WeChat renders in
 * Tencent's X5 kernel, which trails Chrome by a long way and varies by
 * WeChat version, and on iOS it is whatever WKWebView the phone shipped with.
 *
 * Four things this page used are too new for that. Each one fails silently —
 * no error the reader would see, just a screen that does nothing — which is
 * the worst way to be broken on someone else's phone in another country.
 */

const IN_WECHAT = /micromessenger/i.test(navigator.userAgent);

/** Element.replaceChildren is Chrome 86. Old X5 does not have it, and the
 *  board is drawn entirely through it, so without this the page renders once
 *  and never updates again. */
function fill(node, ...kids) {
  while (node.firstChild) node.removeChild(node.firstChild);
  for (const k of kids) if (k) node.appendChild(k);
}

/** crypto.randomUUID is Chrome 92 AND only exists in a secure context. Without
 *  a fallback the id is never minted, which quietly costs somebody the ability
 *  to take their own post down. */
function uuid() {
  try { if (crypto.randomUUID) return crypto.randomUUID(); } catch (e) { /* older */ }
  try {
    const b = new Uint8Array(16);
    crypto.getRandomValues(b);
    b[6] = (b[6] & 0x0f) | 0x40; b[8] = (b[8] & 0x3f) | 0x80;
    const h = [...b].map((x) => x.toString(16).padStart(2, "0")).join("");
    return h.slice(0,8)+"-"+h.slice(8,12)+"-"+h.slice(12,16)+"-"+h.slice(16,20)+"-"+h.slice(20);
  } catch (e) { /* no crypto at all */ }
  // Last resort. Weaker, and it only ever identifies this browser to itself.
  return "x" + Date.now().toString(36) + Math.random().toString(36).slice(2, 12);
}

/** navigator.clipboard needs a secure context and is refused outright inside
 *  WeChat. The old textarea trick still works in every webview there is. */
function copyText(text) {
  try {
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text);
      return true;
    }
  } catch (e) { /* fall through */ }
  try {
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.setAttribute("readonly", "");
    ta.style.cssText = "position:absolute;left:-9999px;top:0";
    document.body.appendChild(ta);
    ta.select();
    ta.setSelectionRange(0, text.length);   // iOS ignores select() alone
    const ok = document.execCommand("copy");
    document.body.removeChild(ta);
    return ok;
  } catch (e) { return false; }
}

/* The real height of the window. WeChat's toolbar sits inside the viewport on
   Android and outside it on iOS, so vh is wrong in one direction or the other
   and a sheet sized in vh ends up under the chrome. */
function setVH() {
  document.documentElement.style.setProperty("--vh", (window.innerHeight / 100) + "px");
}
setVH();
window.addEventListener("resize", setVH);
window.addEventListener("orientationchange", setVH);

/** The line icons on each post. Drawn here rather than pulled from anywhere:
 *  four paths are cheaper than a request that would not answer in the mainland. */
const ICON = {
  reply: "M9 14 4 9l5-5 M4 9h8a8 8 0 0 1 8 8v3",
  like: "M12 20s-7-4.6-7-9.4A4 4 0 0 1 12 8a4 4 0 0 1 7-.6c0 4.8-7 12.6-7 12.6Z",
  remove: "M4 7h16 M10 11v6 M14 11v6 M6 7l1 12a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1l1-12 M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2",
  share: "M18 8a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5Z M6 15a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5Z M18 22a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5Z M8.2 11.4l7.6-4 M8.2 13.6l7.6 4",
  flag: "M5 21V4 M5 4h11l-2 3.5L16 11H5",
  globe: "M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18Z M3 12h18 M12 3c2.5 2.4 3.8 5.4 3.8 9S14.5 18.6 12 21c-2.5-2.4-3.8-5.4-3.8-9S9.5 5.4 12 3Z",
};
function icon(name) {
  const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  svg.setAttribute("viewBox", "0 0 24 24");
  svg.setAttribute("aria-hidden", "true");
  for (const d of ICON[name].trim().split(/\s+M/).map((s, i) => (i ? "M" + s : s))) {
    const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
    path.setAttribute("d", d);
    svg.append(path);
  }
  return svg;
}

/** A topic keeps its colour. Picked from the name rather than the order it
 *  happens to appear in, so Food is the same red on every reader's screen and
 *  stays that red when something else is posted above it. */
const TDOT = ["--t1","--t2","--t3","--t4","--t5","--t6"];
function topicColour(name) {
  let h = 0;
  for (const ch of String(name)) h = (h * 31 + ch.codePointAt(0)) >>> 0;
  return "var(" + TDOT[h % TDOT.length] + ")";
}

// A random number this browser made up. Hashed on the server before it is
// written down; it identifies a browser, never a person, and the only thing it
// buys is being able to take your own post back.
let device = "";
try {
  device = localStorage.getItem("board:device") || "";
  // uuid(), not crypto.randomUUID directly. randomUUID is Chrome 92 and only
  // exists in a secure context — the exact reason the helper twenty lines up
  // was written — and calling the raw one here threw on an older WeChat
  // kernel before a single line of the board had been drawn.
  if (!device) { device = uuid(); localStorage.setItem("board:device", device); }
} catch { /* private window: it still works, it just forgets */ }

let posts = [], topic = "", FOLLOWING = [];
// With the rest of the state rather than beside the code that draws it: `let`
// does not hoist a value, so the nav — which paints before the profile block
// is reached — hit a temporal dead zone rather than a null.
let ME = null;
// Declared here with the rest of the state rather than beside the code that
// draws it: `let` does not hoist a value, so anything running earlier — the
// nav, on first paint — hit a temporal dead zone instead of a null.
let photo = null;             // { data, type }
let liked = new Set();        // what this browser has already liked
try { liked = new Set(JSON.parse(localStorage.getItem("board:liked") || "[]")); } catch { /* fine */ }

/* People this reader does not want to see, kept in this browser and nowhere
 * else. There are no accounts here, so a block cannot be a thing done TO
 * somebody — it is a thing done to your own copy of the board. That is the
 * honest version and it has a property the server-side kind does not: it
 * cannot be used as a weapon, because nobody else is affected by it.
 *
 * It is per-browser, and it goes when site data goes. Said plainly on the
 * page rather than quietly true. */
let blocked = new Set();
try { blocked = new Set(JSON.parse(localStorage.getItem("board:blocked") || "[]")); } catch { /* fine */ }
const saveBlocked = () => {
  try { localStorage.setItem("board:blocked", JSON.stringify([...blocked])); } catch { /* fine */ }
};
let reported = new Set();
try { reported = new Set(JSON.parse(localStorage.getItem("board:reported") || "[]")); } catch { /* fine */ }


const initial = (name) => (String(name || "?").trim()[0] || "?").toLowerCase();

async function load() {
  try {
    const r = await fetch("/api/board", { headers: device ? { "x-board-device": device } : {} });
    const d = await r.json();
    posts = Array.isArray(d.posts) ? d.posts : [];
    FOLLOWING = Array.isArray(d.following) ? d.following : [];
  } catch { posts = []; }
  draw();
}

function drawTopics() {
  const box = $("topics"); fill(box);
  const counts = new Map();
  for (const p of posts) if (p.topic) counts.set(p.topic, (counts.get(p.topic) || 0) + 1);

  // The datalist in the compose sheet, so posting under an existing topic is
  // picking one rather than spelling it the same way by luck.
  fill($("topiclist"),
    ...[...counts.keys()].map((t) => Object.assign(document.createElement("option"), { value: t })));

  // Hidden only when there is genuinely nothing to choose between. Everyone on
  // its own is not a choice; Everyone plus the people you follow is.
  if (!counts.size && !FOLLOWING.length) { box.hidden = true; return; }
  box.hidden = false;

  const chip = (label, value, n, colour) => {
    const b = el("button", "chip");
    b.type = "button";
    b.setAttribute("aria-pressed", String(topic === value));
    if (colour) { const i = el("i", "dot"); i.style.background = colour; b.append(i); }
    b.append(el("span", null, label));
    if (n !== undefined) b.append(el("span", "n", String(n)));
    b.addEventListener("click", () => { topic = topic === value ? "" : value; draw(); });
    return b;
  };
  box.append(chip(T("board.everyone"), ""));
  // Only offered once it would do something. A filter that always shows an
  // empty list is a filter that teaches people not to press it.
  if (FOLLOWING.length) box.append(chip(T("feed.onlyFollowing"), "\u0000following"));
  for (const [t, n] of [...counts].sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]))) {
    box.append(chip(t, t, n, topicColour(t)));
  }
}

function draw() {
  drawTopics();
  /* Where the posts begin. Unfiltered, it is named rather than described —
   * "Everyone · Newest first" told a reader how the list was sorted, which is
   * not a thing anybody wanted to know. Filtered, the sort matters again,
   * because then the question is what has been left out. */
  $("rulelabel").textContent = topic
    ? T("board.newest", {
        topic: topic === "\u0000following" ? T("feed.onlyFollowing") : topic,
      })
    : T("board.club");
  $("boardname").textContent = T("board.name");
  $("foottext").textContent = T("board.foot") + " ";
  $("count").textContent = posts.length
    ? T("board.count", { n: posts.length }) : T("board.tagline");

  const box = $("board"); fill(box);
  const list = posts.filter((p) => (
      topic === "\u0000following"
        ? FOLLOWING.indexOf((p.handle || "").toLowerCase()) >= 0
        : (!topic || p.topic === topic))
    && !blocked.has((p.handle || "").toLowerCase())
    // Somebody who has said they should not be looking at this should stop
    // looking at it now, not once a person gets round to the queue.
    && !reported.has(p.id));

  $("none").hidden = list.length > 0;
  if (!list.length) {
    fill($("none"),
      el("b", null, T(posts.length ? "board.none.head" : "board.empty.head")),
      el("p", null, T(posts.length ? "board.none.body" : "board.empty.body")));
    return;
  }
  for (const p of list) box.append(card(p));
}

/* Somebody's face beside what they said, falling back to their initial.
 *
 * The letter is not a placeholder for a missing image, it is what most people
 * on this board have: a face is optional here and always will be. So the
 * letter is drawn first and the picture replaces it, rather than an empty
 * circle waiting on a request that may fail — and if the picture does fail,
 * the letter is already there and nothing flickers. */
function face(p) {
  // A link where there is somebody to open, a plain circle where there is not.
  // The name beside it has always been a link and this was not, which is the
  // wrong way round: the face is the bigger target and the one people press.
  const av = p.handle
    ? Object.assign(document.createElement("a"), {
        className: "av",
        href: "/p/" + encodeURIComponent(p.handle.toLowerCase()),
        textContent: initial(p.handle),
      })
    : el("div", "av", initial(p.handle));
  if (p.handle) av.setAttribute("aria-label", p.handle);
  if (!p.face) return av;
  const img = Object.assign(document.createElement("img"),
    { src: "/api/public-media?id=" + encodeURIComponent(p.face), alt: "", loading: "lazy" });
  img.addEventListener("load", () => { av.textContent = ""; av.append(img); });
  return av;
}

function card(p) {
  const row = el("article", "post" + (p.looking ? " isjoin" : ""));
  row.append(face(p));

  const body = el("div", "body");

  if (p.topic) {
    const eb = el("div", "eyebrow");
    const dot = el("i");
    dot.style.background = topicColour(p.topic);
    eb.append(dot, el("span", null, p.topic));
    body.append(eb);
  }

  const line = el("div", "line");
  // The name is a link to the person. It was plain text, which meant a feed
  // full of people you could not open.
  if (p.handle) {
    const a = document.createElement("a");
    a.href = "/p/" + encodeURIComponent(p.handle.toLowerCase());
    a.textContent = p.handle;
    a.style.textDecoration = "inherit";
    const b = el("b");
    b.append(a);
    line.append(b);
  } else {
    line.append(el("b", null, T("board.someone")));
  }
  const t = el("time", null, when(p.at));
  if (p.at) t.dateTime = p.at;
  line.append(t);
  body.append(line);

  if (p.photo) {
    const img = Object.assign(document.createElement("img"),
      { className: "pic", src: "/api/public-media?id=" + encodeURIComponent(p.photo),
        alt: "", loading: "lazy" });
    img.addEventListener("error", () => img.remove());
    body.append(img);
  }
  /* Somebody joining the study-buddy list.
   *
   * The sentence is written here rather than stored, so it is in whichever
   * language this is being read in — the post carries the facts and nothing
   * else. Their own words, where they wrote any, stay their own and appear
   * below in the ordinary way. */
  if (p.looking) {
    const j = el("div", "joined");
    const say = el("div", "say");
    say.append(el("b", null, p.handle || T("board.someone")),
      document.createTextNode(" " + T("bud.joined")));
    j.append(say);
    if (p.campus) j.append(el("div", "where", p.campus));
    // The link into the study-buddy list came out with the list itself: this
    // person is on the deck at the top of this same page.
    body.append(j);
  }

  if (p.note) body.append(el("p", "words", p.note));
  // The same thing in Chinese where somebody supplied it: the point of a board
  // for people who cannot read the signs is that the answer can be held up to
  // the person behind the counter.
  if (p.zh) body.append(el("p", "zh", p.zh));
  if (p.py) body.append(el("p", "py", p.py));

  // ---- the actions --------------------------------------------------------
  const acts = el("div", "acts");
  const thread = el("div", "thread");
  thread.hidden = true;

  const act = (name, label, iconOnly) => {
    const b = el("button");
    b.type = "button";
    b.append(icon(name));
    if (iconOnly) { b.setAttribute("aria-label", label); b.title = label; }
    else b.append(el("span", null, label));
    acts.append(b);
    return b;
  };
  // Only the label of a button that has one. Icon-only buttons say it in the
  // aria-label, where a screen reader and a long-press both find it.
  const relabel = (b, words) => {
    if (b.lastChild && b.lastChild.nodeName === "SPAN") b.lastChild.textContent = words;
    else { b.setAttribute("aria-label", words); b.title = words; }
  };

  const nrep = (p.replies || []).length;
  const reply = act("reply", !nrep ? T("act.reply")
    : nrep === 1 ? T("act.reply1") : T("act.replies", { n: nrep }));
  reply.addEventListener("click", () => { thread.hidden = !thread.hidden; });

  const like = act("like", T("act.like"));
  if (p.likes) like.append(el("span", "n", String(p.likes)));
  if (liked.has(p.id)) like.classList.add("liked");
  like.addEventListener("click", async () => {
    // One per browser. Not a rule anybody could enforce — it is a courtesy to
    // the reader, so tapping twice does not read as two people.
    if (liked.has(p.id)) return;
    liked.add(p.id);
    try { localStorage.setItem("board:liked", JSON.stringify([...liked])); } catch { /* fine */ }
    like.classList.add("liked");
    await send({ like: p.id }, null);
  });

  // Only on your own. There are no accounts here, so the server decides this
  // from the browser's hash and sends back nothing but whether it is yours.
  if (p.mine) {
    const rm = act("remove", T("act.remove"));
    rm.addEventListener("click", async () => {
      if (!confirm(T("act.confirmRemove"))) return;
      rm.disabled = true;
      try {
        const r = await fetch("/api/post?id=" + encodeURIComponent(p.id), {
          method: "DELETE",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ device }),
        });
        if (!r.ok) throw new Error();
        await load();
      } catch { rm.disabled = false; relabel(rm, T("act.failed")); }
    });
  }

  if (!p.mine) {
    const rep = act("flag", T(reported.has(p.id) ? "act.reported" : "act.report"));
    rep.disabled = reported.has(p.id);
    rep.addEventListener("click", () => openReport(p));
  }

  let transPanel = null;
  if (translateOn) {
    const tr = act("globe", T("tr.thisPost"), true);
    const shown = el("div", "tpost");
    shown.hidden = true;
    tr.addEventListener("click", async () => {
      if (!shown.hidden) {
        shown.hidden = true; tr.removeAttribute("aria-pressed");
        relabel(tr, T("tr.thisPost")); return;
      }
      const source = [p.note, p.zh].filter(Boolean).join("\n");
      if (!source) return;
      relabel(tr, T("tr.working"));
      const out = await askTranslate(source);
      if (!out.error) tr.setAttribute("aria-pressed", "true");
      relabel(tr, out.error ? T("tr.thisPost") : T("tr.hide"));
      fill(shown);
      shown.hidden = false;
      shown.append(el("p", null, out.error || out.text));
      if (out.pinyin) shown.append(el("p", "py", out.pinyin));
      if (out.note) shown.append(el("p", "note", out.note));
    });
    // Held here and appended after the action row below, not into it: .acts is
    // a flex row, and a panel among the buttons wraps them.
    transPanel = shown;
  }

  const share = act("share", T("act.share"), true);
  share.addEventListener("click", async () => {
    // The board, not the root: the root is the landing page, and somebody sent
    // this link because of the post, not because of the explanation.
    const url = location.origin + "/feed#" + p.id;
    const say = (words, hold) => {
      relabel(share, words);
      setTimeout(() => relabel(share, T("act.share")), hold || 2200);
    };
    // Inside WeChat there is no share sheet a page may open. The buttons in the
    // ⋯ menu are the only way, and pretending otherwise gives somebody a button
    // that does nothing. So: put the link on the clipboard, and say where the
    // real control is. Sending the page itself needs an Official Account and
    // the JS-SDK; until there is one, this is the honest version.
    if (IN_WECHAT) {
      say(T(copyText(url) ? "act.wxCopied" : "act.wxUseMenu"), 3600);
      return;
    }
    try {
      if (navigator.share) {
        await navigator.share({ title: T("board.name"), text: (p.note || "").slice(0, 120), url });
        return;
      }
    } catch (e) { /* dismissed: not a failure, say nothing */ return; }
    say(T(copyText(url) ? "act.copied" : "act.copyFail"));
  });

  body.append(acts);
  if (transPanel) body.append(transPanel);

  // ---- the thread, folded until asked for ---------------------------------
  for (const r of (p.replies || [])) {
    const rep = el("div", "rep");
    const rl = el("div", "line");
    rl.append(el("b", null, r.handle || T("board.someone")));
    const rt = el("time", null, when(r.at));
    if (r.at) rt.dateTime = r.at;
    rl.append(rt);
    rep.append(rl);
    if (r.note) rep.append(el("p", null, r.note));
    thread.append(rep);
  }
  const rbox = el("div", "rbox");
  const rin = Object.assign(document.createElement("input"),
    { placeholder: T("act.answer"), maxLength: 2000 });
  const rgo = el("button", null, T("act.send"));
  rgo.type = "button";
  rgo.addEventListener("click", async () => {
    const words = rin.value.trim();
    if (!words) return;
    let who = "";
    try { who = localStorage.getItem("board:who") || ""; } catch { /* fine */ }
    if (!who) { who = (prompt(T("act.answerAs")) || "").trim(); }
    if (!who) return;
    try { localStorage.setItem("board:who", who); } catch { /* fine */ }
    rgo.disabled = true; rgo.textContent = T("act.sending");
    const d = await send({ note: words, re: p.id, handle: who }, null);
    rgo.disabled = false; rgo.textContent = T("act.send");
    if (!d) { rgo.textContent = T("act.again"); return; }
    rin.value = "";
    // Said on the spot. A reply that is held and does not say so reads as a
    // reply that failed, and gets typed again.
    const said = el("p", "py", T(d.state === "published" ? "act.replyUp" : "act.replyHeld"));
    rbox.after(said);
    setTimeout(() => said.remove(), 6000);
  });
  rbox.append(rin, rgo);
  thread.append(rbox);
  body.append(thread);

  row.append(body);
  return row;
}

/** One way in for everything anybody posts — a note, a reply, a like.
 *
 *  A rejected fetch says only "Load failed" on Safari, which is true and
 *  useless: it does not say whether the body was too big, the connection went,
 *  or the server never answered. The size goes in the message, because on a
 *  mobile connection that is nearly always the answer — and one retry, because
 *  the other nearly-always answer is a blip on a link to Tokyo. */
async function send(body, btn) {
  const payload = JSON.stringify({ ...body, device });
  const mb = (payload.length / 1024 / 1024).toFixed(2);

  const once = async () => {
    const r = await fetch("/api/post", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: payload,
    });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error((d.error || "it did not go") + " (" + r.status + ")");
    return d;
  };

  try {
    let d;
    try {
      d = await once();
    } catch (first) {
      // Only a network failure is worth trying twice. A 4xx will say the same
      // thing again and the wait is spent for nothing.
      if (!/load failed|network|fetch/i.test(String(first && first.message))) throw first;
      d = await once();
    }
    if (body.like) await load();
    return d;
  } catch (e) {
    if (btn) say((e && e.message || "?") + " · " + mb + " MB", true);
    return null;
  }
}

function say(msg, bad) {
  const s = $("said");
  s.hidden = !msg;
  s.textContent = msg || "";
  s.classList.toggle("bad", Boolean(bad));
}

// ---- reporting -------------------------------------------------------------

/* The reasons offered, and why these five.
 *
 * A free text box alone gets "this is bad" and nothing actionable. A list alone
 * cannot describe what somebody actually saw. Both, with the list first,
 * because the list is what makes a report legible in three seconds at the top
 * of a queue — and the four categories below are the ones that would actually
 * get a post taken down here. "I disagree with this" is not one of them, on
 * purpose. */
const REASON_KEYS = ["rep.r1", "rep.r2", "rep.r3", "rep.r4", "rep.r5"];
let reporting = null, reason = "";

function openReport(p) {
  reporting = p; reason = "";
  $("reporttitle").textContent = p.handle ? T("rep.title", { who: p.handle }) : T("rep.titleAnon");
  // The same omission as the compose sheet: these were static English in the
  // markup, so a Chinese reader got a Chinese page with an English report box.
  $("reporthint").textContent = T("rep.hint");
  $("why").placeholder = T("rep.more");
  $("blockpre").textContent = T("rep.alsoBlock");
  $("blockpost").textContent = T("rep.alsoBlock2");
  $("reportshut").textContent = T("post.cancel");
  $("reportgo").textContent = T("rep.go");
  $("blockwho").textContent = p.handle || T("board.someone");
  $("alsoblock").checked = false;
  $("why").value = "";
  $("reportsaid").hidden = true;

  const box = $("reasons"); fill(box);
  for (const key of REASON_KEYS) {
    const r = T(key);
    const b = el("button", null, r);
    b.type = "button";
    b.setAttribute("aria-pressed", "false");
    b.addEventListener("click", () => {
      reason = reason === r ? "" : r;
      for (const other of box.children) {
        other.setAttribute("aria-pressed", String(other.textContent === reason));
      }
    });
    box.append(b);
  }
  $("reportsheet").hidden = false;
}
$("reportshut").addEventListener("click", () => { $("reportsheet").hidden = true; });
$("reportsheet").addEventListener("click", (e) => {
  if (e.target === $("reportsheet")) $("reportsheet").hidden = true;
});

$("reportform").addEventListener("submit", async (e) => {
  e.preventDefault();
  const said = $("reportsaid");
  const why = [reason, $("why").value.trim()].filter(Boolean).join(" — ");
  if (!why) {
    said.hidden = false; said.classList.add("bad");
    said.textContent = T("rep.needReason");
    return;
  }
  const p = reporting;
  // Blocking is this browser's own business and needs no server, so it happens
  // whether or not the report goes through.
  if ($("alsoblock").checked && p.handle) { blocked.add(p.handle.toLowerCase()); saveBlocked(); }

  try {
    const r = await fetch("/api/report", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ id: p.id, why, device }),
    });
    if (!r.ok) throw new Error();
    reported.add(p.id);
    try { localStorage.setItem("board:reported", JSON.stringify([...reported])); } catch { /* fine */ }
  } catch (err) {
    said.hidden = false; said.classList.add("bad");
    said.textContent = T("rep.failed");
    // Not sending is not a reason to keep showing it to the person who
    // objected, so it goes from their copy regardless.
    reported.add(p.id);
    await load();
    return;
  }
  said.hidden = false; said.classList.remove("bad");
  said.textContent = T("rep.sent");
  await load();
  setTimeout(() => { $("reportsheet").hidden = true; }, 1800);
});

// ---- putting something up --------------------------------------------------
function openSheet(open) {
  // Everything in the sheet, every time it opens. These were left as static
  // English attributes in the markup, so the language switch moved the page
  // around them and the compose box stayed in English — the exact failure the
  // dictionary exists to prevent, hiding in the one place nothing painted.
  $("posttitle").textContent = T("post.title");
  $("note").placeholder = T("post.placeholder");
  $("who").placeholder = T("post.as");
  $("topic").placeholder = T("post.topic");
  $("pickpic").textContent = T("post.photo");
  $("shut").textContent = T("post.cancel");
  $("send").textContent = T("post.go");
  $("sheet").hidden = !open;
  if (open) {
    try { $("who").value = localStorage.getItem("board:who") || ""; } catch { /* fine */ }
    if (topic) $("topic").value = topic;
    $("note").focus();
  }
}
$("fab").addEventListener("click", () => openSheet(true));

/* WeChat on iOS scrolls the page to bring an input above the keyboard and then
   does not scroll back when it closes, leaving the board sitting half off the
   top of the screen with nothing to grab. Every browser gets this reset; it is
   a no-op where the bug does not exist. */
document.addEventListener("focusout", (e) => {
  if (!e.target || !/^(INPUT|TEXTAREA)$/.test(e.target.tagName)) return;
  setTimeout(() => {
    window.scrollTo(0, Math.min(window.scrollY, document.body.scrollHeight));
    document.body.scrollTop = document.body.scrollTop;
  }, 120);
}, true);
$("shut").addEventListener("click", () => openSheet(false));
$("sheet").addEventListener("click", (e) => { if (e.target === $("sheet")) openSheet(false); });
document.addEventListener("keydown", (e) => {
  if (e.key !== "Escape") return;
  openSheet(false);
  $("reportsheet").hidden = true;
});

$("pickpic").addEventListener("click", () => $("pic").click());
$("shotoff").addEventListener("click", () => { photo = null; $("shot").hidden = true; $("pic").value = ""; });
$("pic").addEventListener("change", async (e) => {
  const f = e.target.files && e.target.files[0];
  if (!f) return;
  if (f.size > 40 * 1024 * 1024) return say(T("post.tooBig"), true);
  // The same treatment a profile picture gets, and for the same three reasons
  // — a photo straight off a phone is megabytes, is HEIC on an iPhone, and
  // carries its rotation in metadata. This was fixed for profile photos and
  // left here, which is why a post with a picture on it failed with the
  // browser's own "Load failed" while one without went straight through.
  //
  // 1600 rather than 1000: a post's photograph is the content, and gets looked
  // at properly. A face is 5.8rem across.
  say(T("me.working"));
  let shot;
  try {
    shot = await shrink(f, 1600);
  } catch (err) {
    // Whatever went wrong, say what it was. A photo that silently does not
    // attach is indistinguishable from an app that is broken.
    return say(T("post.badPhoto") + " (" + (err && err.message || "?") + ")", true);
  }
  if (shot.error) return say(shot.error, true);
  photo = { data: shot.data, type: shot.type };
  $("shotimg").src = URL.createObjectURL(f);
  $("shot").hidden = false;
  say("");
});

$("ask").addEventListener("submit", async (e) => {
  e.preventDefault();
  const note = $("note").value.trim();
  const who = $("who").value.trim();
  if (!note && !photo) return say(T("post.needWords"), true);
  if (!who) return say(T("post.needName"), true);
  try { localStorage.setItem("board:who", who); } catch { /* fine */ }

  $("send").disabled = true;
  const d = await send({
    note, handle: who, topic: $("topic").value.trim(),
    photo: photo ? photo.data : "", photoType: photo ? photo.type : "",
  }, $("send"));
  $("send").disabled = false;
  if (!d) return;

  $("note").value = ""; $("topic").value = "";
  photo = null; $("shot").hidden = true; $("pic").value = "";
  await load();
  if (d.state === "published") { openSheet(false); return; }
  // Said plainly and left on screen, because the post will not be on the board
  // and somebody who is not told that assumes it failed and posts it again.
  say(T("post.held"));
});

/* A person a reader can reach who is not this software. Printed only when the
   server was given one — an address that bounces is worse than none. */
fetch("/api/contact").then((r) => r.json()).then((d) => {
  if (!d || !d.contact) return;
  const box = $("contact");
  box.hidden = false;
  box.append(document.createTextNode(" Something wrong that a report cannot cover? "));
  const a = document.createElement("a");
  a.href = /@/.test(d.contact) ? "mailto:" + d.contact : d.contact;
  a.textContent = d.contact;
  a.style.color = "inherit";
  box.append(a, document.createTextNode("."));
}).catch(() => { /* no contact set: say nothing */ });

/* ---- translate -------------------------------------------------------------
 *
 * Always in the same place, above the +. Reading help on a bilingual board is
 * not an occasional need somebody goes looking for in a menu — it is the thing
 * half the readers want on half the posts, so it gets a fixed position and
 * never moves.
 *
 * The button is absent, not broken, when the server has no key for it. */
let translateOn = false;

function tsay(box, out) {
  fill(box);
  box.hidden = false;
  box.append(el("p", "said", out.text));
  if (out.pinyin) box.append(el("p", "py", out.pinyin));
  if (out.note) {
    const n = el("p", "note");
    n.append(el("b", null, T("tr.note")), document.createTextNode(out.note));
    box.append(n);
  }
}

const TR_ERR = { "slow-down": "tr.slow", busy: "tr.busy", unconfigured: "tr.off" };

async function askTranslate(text) {
  const r = await fetch("/api/translate", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ text, lang: lang(), device }),
  });
  const d = await r.json().catch(() => ({}));
  if (!r.ok || d.error) return { error: T(TR_ERR[d.error] || "tr.failed") };
  return d;
}

function openTranslate(prefill) {
  $("ttitle").textContent = T("tr.title");
  $("thint").textContent = T("tr.hint");
  $("tin").placeholder = T("tr.placeholder");
  $("tgo").textContent = T("tr.go");
  $("tshut").textContent = T("post.cancel");
  $("tin").value = prefill || "";
  $("tout").hidden = true;
  $("tsheet").hidden = false;
  if (!prefill) $("tin").focus();
}
$("tfab").addEventListener("click", () => openTranslate(""));
$("tshut").addEventListener("click", () => { $("tsheet").hidden = true; });
$("tsheet").addEventListener("click", (e) => {
  if (e.target === $("tsheet")) $("tsheet").hidden = true;
});
$("tform").addEventListener("submit", async (e) => {
  e.preventDefault();
  const text = $("tin").value.trim();
  const box = $("tout");
  if (!text) { fill(box); box.hidden = false; box.append(el("p", "said", T("tr.empty"))); return; }
  $("tgo").disabled = true; $("tgo").textContent = T("tr.working");
  const out = await askTranslate(text);
  $("tgo").disabled = false; $("tgo").textContent = T("tr.go");
  if (out.error) { fill(box); box.hidden = false; box.append(el("p", "said", out.error)); return; }
  tsay(box, out);
});

/* ---- the language switch ---------------------------------------------------
 *
 * A full repaint rather than walking the DOM swapping text: every string here
 * is already produced by a function, so re-running them is both simpler and
 * the only version that cannot go stale. The scroll position is kept, because
 * losing your place in a feed is what makes people not press it twice. */
function paintNav() {
  $("navbrowselabel").textContent = T("nav.browse");
  $("navfeedlabel").textContent = T("nav.feed");
  $("navnewlabel").textContent = T("nav.new");
  $("navmelabel").textContent = T("nav.profile");
  // Profile goes to your own page once you have one, and before that it opens
  // the editor. There is nothing on this page to scroll to any more: this tab
  // and the Tutor's first offer are now the only two ways in, which is the
  // point of taking the block off the page.
  const me = $("navme");
  if (ME && ME.handle) {
    me.href = "/p/" + encodeURIComponent(ME.handle.toLowerCase());
    me.onclick = null;
  } else {
    me.href = "#";
    me.onclick = (e) => { e.preventDefault(); openMe(); };
  }
}

/* The tutor's one question: which of two unbuilt things would you use?
 *
 * Not a fake door. The card says plainly that neither exists and that pressing
 * only counts the answer — because a tap that pretends to lead somewhere and
 * does not is a thing you can do to a person once, and this board has about
 * forty people who have ever done anything on it.
 *
 * It also fires the analytics `use` event, so the answer lands in the same
 * day-by-day table every other feature is counted in rather than in a place
 * only this feature knows about.
 */
let WANTED = [];

async function drawTutor() {
  const box = $("tutor");
  if (!device) { box.hidden = true; return; }

  fill(box);
  const who = el("div", "who");
  who.append(el("i", null, "\u7559"), el("b", null, T("tut.name")));
  box.append(who, el("p", "hi", T("tut.hi")));

  /* A thing that works, with a control that goes there. */
  const doable = (key, what, act) => {
    const wrap = el("div", "opt");
    wrap.append(el("h4", null, T(key)), el("p", null, T(what)));
    const b = el("button", "go", T("tut.go"));
    b.type = "button";
    b.addEventListener("click", act);
    wrap.append(b);
    return wrap;
  };

  /* A thing that does not exist, with a control that only counts the answer.
   * Visibly a different kind of row from the ones above it — same card, two
   * headings, so nobody has to work out which buttons lead somewhere. */
  const vote = (key, what, name) => {
    const wrap = el("div", "opt");
    wrap.append(el("h4", null, T(key)), el("p", null, T(what)));
    const b = el("button", null, WANTED.includes(name) ? T("tut.onList") : T("tut.pick"));
    b.type = "button";
    if (WANTED.includes(name)) b.disabled = true;
    else b.addEventListener("click", async () => {
      b.disabled = true;
      b.textContent = T("tut.onList");
      WANTED.push(name);
      try { if (window.lx) window.lx("want-" + name); } catch { /* not fatal */ }
      try {
        await fetch("/api/want", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ device, want: name }),
        });
      } catch { /* the press still showed; the count is the only loss */ }
    });
    wrap.append(b);
    return wrap;
  };

  box.append(el("div", "grp", T("tut.now")));
  // Only offered while there is nothing there. Telling somebody with a filled
  // profile to fill their profile is the fastest way to stop being read.
  if (!(ME && ME.handle)) {
    box.append(doable("tut.setup", "tut.setupWhat", () => openMe()));
  }
  // Find a study buddy is held back for V1: the deck at the top of this page is
  // the same people, and offering both is offering a choice between a thing and
  // itself. The route still works for anybody with the address.
  // Browse students is not one of the Tutor's offers. The deck is at the top
  // of this same page and there is a tab for it in the bar; a third way in,
  // whose button scrolls you up one screen, is the Tutor offering to take
  // somebody where they already are.

  // Built, so it is offered rather than voted on. The votes that asked for it
  // stay in the file — they are what said to build this one first.
  box.append(doable("tut.type", "tut.typeGo", () => { location.href = "/type"; }));

  box.append(el("div", "grp", T("tut.next")));
  box.append(vote("tut.compare", "tut.compareWhat", "compare"));
  box.append(el("p", "honest", T("tut.honest")));
  box.hidden = false;
}

/* What this browser has already said. Read once, so the card can say "noted"
 * rather than asking a question somebody has already answered. */
async function loadWanted() {
  if (!device) return;
  try {
    const d = await fetch("/api/want", { cache: "no-store",
      headers: { "x-board-device": device } }).then((r) => r.json());
    WANTED = (d && d.mine) || [];
  } catch { WANTED = []; }
  drawTutor();
}

/* How many introductions are waiting. Its own request rather than a field on
 * the board: the board is public and cached at every layer, and a number that
 * belongs to one browser has no business travelling with it. */
/* The unread count on the Messages tab. Not called while that tab is hidden
 * for V1 — kept whole, because what it is waiting for is the tab coming back
 * and not a rewrite.
 *
 */
async function countNotes() {
  if (!device) return;
  try {
    const d = await fetch("/api/notes", { cache: "no-store",
      headers: { "x-board-device": device } }).then((r) => r.json());
    const n = (d && d.unread) || 0;
    const badge = $("navnotesn");
    badge.textContent = n > 9 ? "9+" : String(n);
    badge.hidden = !n;
  } catch { /* the tab is still a tab without a number on it */ }
}

/* ---- browse, at the top of this page ---------------------------------------
 *
 * One person, filling the card. A photograph is the reason this exists, so it
 * gets the whole thing and the words sit on top of it.
 *
 * There is no yes and no no here. A flick moves on; it is how you turn the
 * page, not a verdict on somebody's face — which is the whole difference
 * between this and the app it borrows its shape from.
 */
let PEOPLE = [], AT = 0;

async function loadPeople() {
  try {
    const d = await fetch("/api/people", { cache: "no-store",
      headers: device ? { "x-board-device": device } : {} }).then((r) => r.json());
    /* Yourself included, for now.
     *
     * The argument for leaving yourself out is that browsing your own
     * photograph is not a feature. The argument against it, which won, is that
     * somebody who has just uploaded a face and cannot find it in the one
     * place the app shows faces concludes the upload failed — and being told
     * "your card is deliberately not in your own deck" answers the question
     * without ever making the screen make sense.
     *
     * Your own card says it is yours and offers the edit rather than a follow
     * button that would refuse itself. */
    PEOPLE = (d && d.people) || [];
  } catch { PEOPLE = []; }
  drawDeck();
}

/* Whether this phone still owes the board a face.
 *
 * Everything below that asks for one is gated on it, so a settled reader is
 * never asked again — an ask that stays up after it has been answered is how a
 * prompt turns into furniture. */
const needsFace = () => !(ME && ME.photo);

/* How many cards there are: everybody, plus you at the end if you are not on
 * here yet. Never you on your own — "that is everyone" is a strange thing to
 * say about nobody, and an empty list already has its own block that says so
 * and offers the right thing to do about it. */
const deckLen = () => PEOPLE.length + (needsFace() && PEOPLE.length ? 1 : 0);

function nextPerson() {
  const n = deckLen();
  if (!n) return;
  AT = (AT + 1) % n;
  drawDeck();
}

/* The last card. You have just looked at everybody's face, which is the one
 * moment putting your own up needs no explaining. */
function turnCard() {
  const box = el("div", "pc turn");
  box.append(el("div", "noshot", "+"));
  const scrim = el("div", "scrim");
  scrim.append(el("h2", null, T("brw.yourTurn")), el("p", "goal", T("brw.yourTurnWhat")));
  box.append(scrim);
  return box;
}

/* ---- who started following you -------------------------------------------
 *
 * The notification and the answer to it, in one place. Somebody follows you;
 * you find out; you look at them and decide whether to follow back. Three
 * screens for that would be two too many.
 *
 * NEW IS A FACT ABOUT THIS PHONE, not about the board. What counts as new is
 * "since you last had this drawn in front of you", so the newest follower's
 * timestamp is written to local storage as soon as the row is on the screen:
 * the dots show on the load they arrived and are gone on the next one, which
 * is how a since-you-last-looked mark is supposed to behave. The board is not
 * asked to keep a note of when somebody last opened it.
 */
let FOLLOWERS = [], FRESH = new Set();

async function loadFollowers() {
  if (!device) return;
  try {
    const d = await fetch("/api/followers", { cache: "no-store",
      headers: { "x-board-device": device } }).then((r) => r.json());
    FOLLOWERS = (d && d.followers) || [];
  } catch { FOLLOWERS = []; }

  /* Which of them are new is worked out ONCE, here, and not in the draw.
   * This page redraws whenever the language changes or a late fetch lands, and
   * a draw that both read the mark and moved it made the second redraw erase
   * the dots the first one had just put up. */
  let seen = "";
  try { seen = localStorage.getItem("board:sawfollowers") || ""; } catch { /* fine */ }
  FRESH = new Set(FOLLOWERS.filter((f) => (f.at || "") > seen).map((f) => f.id));
  if (FOLLOWERS.length) {
    const newest = FOLLOWERS.map((f) => f.at || "").sort().pop();
    try { localStorage.setItem("board:sawfollowers", newest); } catch { /* fine */ }
  }
  drawFollowers();
}

function drawFollowers() {
  const box = $("fols");
  const rule = $("folrule");
  fill(box);
  if (!FOLLOWERS.length) {
    box.hidden = true; rule.hidden = true; badgeFollowers(0);
    return;
  }
  box.hidden = false; rule.hidden = false;
  $("follabel").textContent = T("fol.head");

  const fresh = FOLLOWERS.filter((f) => FRESH.has(f.id));

  const tag = $("folnew");
  tag.hidden = !fresh.length;
  tag.textContent = fresh.length ? T("fol.new", { n: fresh.length }) : "";
  badgeFollowers(fresh.length);

  for (const f of FOLLOWERS) {
    const row = el("div", "folrow");
    const av = el("a", "av");
    av.href = "/p/" + encodeURIComponent((f.handle || "").toLowerCase());
    if (f.photo) {
      const img = Object.assign(document.createElement("img"),
        { src: "/api/public-media?id=" + encodeURIComponent(f.photo), alt: "", loading: "lazy" });
      img.addEventListener("error", () => { img.remove(); av.textContent = initial(f.handle); });
      av.append(img);
    } else {
      av.textContent = initial(f.handle);
    }

    const who = el("a", "who");
    who.href = av.href;
    who.style.textDecoration = "none";
    who.append(el("b", null, f.handle || T("board.someone")),
      el("span", null, [f.campus, f.type].filter(Boolean).join(" · ")));

    row.append(av, who);
    if (FRESH.has(f.id)) row.append(el("i", "dot"));

    const b = el("button", f.following ? "on" : "", T(f.following ? "bud.following" : "fol.back"));
    b.type = "button";
    b.addEventListener("click", async () => {
      const want = !f.following;
      f.following = want;
      b.textContent = T(want ? "bud.following" : "fol.back");
      b.classList.toggle("on", want);
      try {
        const r = await fetch("/api/follow", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ device, who: f.id, on: want }),
        });
        if (!r.ok) throw new Error("no");
        const d = await r.json();
        f.following = Boolean(d.following);
      } catch { f.following = !want; }
      b.textContent = T(f.following ? "bud.following" : "fol.back");
      b.classList.toggle("on", Boolean(f.following));
    });
    row.append(b);
    box.append(row);
  }

}

/** The count, on the tab whose page holds the list.
 *
 *  It was on Profile, which is the tab a person checks when they wonder
 *  whether anything has happened to them — and which opens their own page,
 *  where there is no list of followers. A number that leads somewhere the
 *  thing it counts is not is worse than no number. */
function badgeFollowers(n) {
  const b = $("navbrowsen");
  if (!b) return;
  b.textContent = n > 9 ? "9+" : String(n);
  b.hidden = !n;
}

/* THE ROW ABOVE THE DECK: your own card, in whichever of three states it is.
 *
 * It began as one thing — an ask for a photograph — and had to become three,
 * because the question it answers changes the moment you upload one. Your own
 * card is deliberately NOT in the deck (browsing your own photograph is not a
 * feature), so without this row there is nowhere in the app to see that your
 * face went up, and the only way to find out is to ask somebody else to look.
 *
 * No photograph        → add one, and the row is the control.
 * One, waiting on us    → say so. Held is not broken, and the difference
 *                         matters more to the person waiting than to anyone.
 * One, up               → their own face, and the way to their own page.
 *
 * Drawn from ME, which arrives after the first paint, so it is redrawn when
 * that lands and again whenever the profile is saved. */
function drawMine() {
  const box = $("mine");
  box.hidden = false;
  fill(box);

  const ring = el("span", "ring");
  const face = ME && ME.photo;
  if (face) {
    const img = Object.assign(document.createElement("img"),
      { src: "/api/public-media?id=" + encodeURIComponent(ME.photo), alt: "" });
    img.addEventListener("error", () => { img.remove(); ring.textContent = initial(ME && ME.handle); });
    ring.append(img);
  } else {
    ring.textContent = initial(ME && ME.handle);
    ring.append(el("i", null, "+"));
  }

  const words = el("span");
  if (!face) {
    words.append(el("b", null, T("brw.mine")), el("span", null, T("brw.mineWhy")));
  } else if (ME.photoPending) {
    words.append(el("b", null, T("brw.mineHeld")), el("span", null, T("brw.mineHeldWhy")));
  } else {
    words.append(el("b", null, T("brw.mineUp", { name: ME.handle || "" })),
                 el("span", null, T("brw.mineUpWhy")));
  }
  box.append(ring, words);
  if (face) box.append(el("span", "chev", "\u203a"));
}
/* One control, two destinations: the picker while there is nothing to look at,
 * their own page once there is. */
$("mine").addEventListener("click", () => {
  if (!(ME && ME.photo)) { $("mephoto").click(); return; }
  if (ME.handle) location.href = "/p/" + encodeURIComponent(ME.handle.toLowerCase());
  else openMe();
});

function personCard(q, live) {
  const box = el("div", "pc");
  if (q.photo) {
    const img = Object.assign(document.createElement("img"),
      { src: "/api/public-media?id=" + encodeURIComponent(q.photo), alt: "", loading: "eager" });
    img.addEventListener("error", () => { img.remove(); box.prepend(el("div", "noshot", initial(q.handle))); });
    box.append(img);
  } else {
    box.append(el("div", "noshot", initial(q.handle)));
  }

  const scrim = el("div", "scrim");
  /* The name, the four letters beside it if they put them up, and — on your
     own card — that it is yours. On the same line because they are all things
     about this person, the size of a badge, not sections of their profile. */
  const line = el("div", "nameline");
  line.append(el("h2", null, q.handle || T("board.someone")));
  if (q.mine) line.append(el("b", "type you", T("brw.you")));
  if (q.type) line.append(el("b", "type", q.type));
  scrim.append(line);
  const where = [q.campus, q.here].filter(Boolean).join(" · ");
  if (where) scrim.append(el("p", "where", where));
  if (q.goal) scrim.append(el("p", "goal", q.goal));
  box.append(scrim);

  /* On the card, not in the section header above it: this shares one person,
   * so it belongs on the one person.
   *
   * pointerdown is stopped here because the card is a drag surface — without
   * it, pressing share starts a flick, and the tap that follows lands on
   * whoever comes next. */
  if (live) {
    const sh = el("button", "share");
    sh.type = "button";
    const words = el("span", null, T("act.share"));
    sh.append(icon("share"), words);
    sh.addEventListener("pointerdown", (ev) => ev.stopPropagation());
    sh.addEventListener("click", (ev) => { ev.stopPropagation(); shareCard(q, words); });
    box.append(sh);
  }
  return box;
}

/* Share the person on the card.
 *
 * Their own page, not this one: /p/<name> carries their face and their line in
 * its link card, which is the thing WeChat renders in a chat, and it opens with
 * a Follow button for whoever taps it. Sharing this address instead would send
 * somebody a deck that starts at whoever happens to be first. */
function shareCard(q, label) {
  const url = location.origin + "/p/" + encodeURIComponent((q.handle || "").toLowerCase());
  const say = (words, hold) => {
    label.textContent = words;
    setTimeout(() => { label.textContent = T("act.share"); }, hold || 2200);
  };
  // Inside WeChat a page may not open a share sheet — the ⋯ menu is the only
  // way — so the honest version is to put the link on the clipboard and say
  // where the real control is.
  if (IN_WECHAT) { say(T(copyText(url) ? "act.wxCopied" : "act.wxUseMenu"), 3600); return; }
  if (navigator.share) {
    navigator.share({ title: q.handle || T("board.someone"),
                      text: (q.goal || "").slice(0, 120), url })
      .catch(() => { /* dismissed is not a failure */ });
    return;
  }
  say(T(copyText(url) ? "act.copied" : "act.copyFail"));
}

function drawDeck() {
  $("brwlabel").textContent = T("brw.title");

  drawMine();

  const deck = $("deck");
  fill(deck);
  const people = PEOPLE.length;
  const n = deckLen();
  if (AT >= n) AT = 0;           // a photo arriving takes the last card away
  const mine = needsFace() && people > 0 && AT === people;
  // Nobody on the list is not an empty screen here — the feed is still under
  // it — so the whole block collapses to one small card that says so.
  deck.hidden = !n;
  $("pacts").hidden = !n;
  $("psafety").hidden = !n;
  $("psafety").textContent = T("bud.safety");
  // Counted in people, not in cards: yours is the ask at the end, not the
  // fourth of four students.
  $("pcount").textContent = people && !mine ? T("brw.of", { n: AT + 1, total: people }) : "";
  $("bnone").hidden = Boolean(people);

  if (!n) {
    // Nobody to look at yet, so the only useful thing to offer is being the
    // first one. It used to point at the study-buddy list, which is this same
    // empty list with a different layout.
    const go = el("button", null, T("brw.mine"));
    go.type = "button";
    go.addEventListener("click", () => $("mephoto").click());
    fill($("bnone"), el("b", null, T("brw.none")), el("p", null, T("brw.noneBody")), go);
    return;
  }

  const at = (i, live) =>
    (needsFace() && i === people ? turnCard() : personCard(PEOPLE[i], live));

  // The one behind, so moving on reveals a card rather than a hole.
  if (n > 1) {
    const behind = at((AT + 1) % n, false);
    behind.style.transform = "scale(.96) translateY(10px)";
    deck.append(behind);
  }
  const top = at(AT, true);
  deck.append(top);
  dragCard(top);

  const acts = $("pacts");
  fill(acts);
  if (mine) {
    // One button, and it is the picker. Nobody to follow on this card.
    const add = el("button", "primary", T("brw.mine"));
    add.type = "button";
    add.addEventListener("click", () => $("mephoto").click());
    acts.append(add);
    return;
  }
  const q = PEOPLE[AT];

  /* Your own card, which is in the deck now. A follow button on it would be a
   * button the server refuses — following yourself is not a thing anybody
   * means to do — so it offers the thing you would actually want from your own
   * card instead. */
  if (q.mine) {
    const ed = el("button", "primary", T("me.edit"));
    ed.type = "button";
    ed.addEventListener("click", () => openMe());
    const on2 = el("button", null, T("brw.next"));
    on2.type = "button";
    on2.addEventListener("click", nextPerson);
    acts.append(ed, on2);
    return;
  }

  /* Follow, not "say hello".
   *
   * Saying hello is a thing you do to a person and it wants a reply; following
   * is a thing you do to a feed and it does not. The second is what somebody
   * looking at a stranger's face is actually ready for, and it is the one that
   * cannot go wrong in a room full of people who have never met. */
  const fol = el("button", "primary", "");
  fol.type = "button";
  const paintFollow = () => {
    fol.textContent = T(q.following ? "bud.following" : "bud.follow");
    fol.classList.toggle("on", Boolean(q.following));
    fol.setAttribute("aria-pressed", String(Boolean(q.following)));
  };
  paintFollow();
  fol.addEventListener("click", async () => {
    const want = !q.following;
    // Shown at once, corrected if the box disagrees. A button that waits for a
    // round trip before it changes is a button somebody presses twice.
    q.following = want;
    paintFollow();
    try {
      const r = await fetch("/api/follow", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ device, who: q.id, on: want }),
      });
      if (!r.ok) throw new Error("no");
      const d = await r.json();
      q.following = Boolean(d.following);
    } catch { q.following = !want; }
    paintFollow();
  });
  const on = el("button", null, T("brw.next"));
  on.type = "button";
  on.addEventListener("click", nextPerson);
  acts.append(fol, on);
}

/* Flick to move on. Pointer events rather than touch events, so a mouse on a
 * laptop behaves the same as a thumb — and the card follows the finger, because
 * a gesture that only acts at the end of itself feels broken on the way. */
function dragCard(box) {
  let x0 = null, dx = 0;
  const go = (e) => {
    if (e.button !== undefined && e.button !== 0) return;
    x0 = e.clientX; dx = 0;
    box.style.transition = "none";
    box.setPointerCapture?.(e.pointerId);
  };
  const move = (e) => {
    if (x0 === null) return;
    dx = e.clientX - x0;
    box.style.transform = `translateX(${dx}px) rotate(${dx / 34}deg)`;
  };
  const end = () => {
    if (x0 === null) return;
    const far = Math.abs(dx) > 90;
    box.style.transition = "";
    if (far) {
      box.style.transform = `translateX(${dx > 0 ? 700 : -700}px) rotate(${dx / 12}deg)`;
      box.classList.add("gone");
      setTimeout(nextPerson, 190);
    } else {
      box.style.transform = "";
    }
    x0 = null;
  };
  box.addEventListener("pointerdown", go);
  box.addEventListener("pointermove", move);
  box.addEventListener("pointerup", end);
  box.addEventListener("pointercancel", end);
}

/* Arrow keys, but only while the deck is the thing on screen and nothing is
 * being typed into. A page-wide arrow handler on a page that is mostly a feed
 * would fight the scroll. */
document.addEventListener("keydown", (e) => {
  if (e.key !== "ArrowRight" && e.key !== "ArrowLeft") return;
  const a = document.activeElement;
  if (a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)) return;
  const r = $("deck").getBoundingClientRect();
  if (r.bottom < 80 || r.top > window.innerHeight - 80) return;
  nextPerson();
});

/* Two tabs, one page.
 *
 * Browse and Feed are now the top and the middle of the same document, so the
 * buttons scroll rather than navigate — and which one is lit follows where you
 * actually are, because a bar that says Browse while you are reading posts is
 * worse than no bar. The hrefs stay real: without JavaScript, or on a middle
 * click, they still go somewhere. */
function markNav() {
  const onFeed = $("posts").getBoundingClientRect().top < window.innerHeight * 0.45;
  $("navbrowse").setAttribute("aria-current", onFeed ? "false" : "page");
  $("navfeed").setAttribute("aria-current", onFeed ? "page" : "false");
  showTranslate(onFeed);
}

/* The translate button belongs to the words, not to the faces.
 *
 * It is fixed to the bottom right, which is exactly where the deck's Say
 * hello / Next row lands — a floating button sitting on top of a button is a
 * tap that does the wrong thing. So it appears when the posts do. */
function showTranslate(onFeed) {
  if (onFeed === undefined) onFeed = $("navfeed").getAttribute("aria-current") === "page";
  $("tfab").hidden = !translateOn || !onFeed;
}
$("navbrowse").addEventListener("click", (e) => {
  if (e.metaKey || e.ctrlKey || e.shiftKey) return;
  e.preventDefault();
  // Carrying a count means it goes to what the count is about; otherwise the
  // top, which is what the tab has always done.
  const go = !$("navbrowsen").hidden && !$("folrule").hidden ? $("folrule") : null;
  if (go) go.scrollIntoView({ behavior: "smooth", block: "start" });
  else window.scrollTo({ top: 0, behavior: "smooth" });
});
$("navfeed").addEventListener("click", (e) => {
  if (e.metaKey || e.ctrlKey || e.shiftKey) return;
  e.preventDefault();
  $("posts").scrollIntoView({ behavior: "smooth", block: "start" });
});
let navTick = false;
window.addEventListener("scroll", () => {
  if (navTick) return;
  navTick = true;
  requestAnimationFrame(() => { navTick = false; markNav(); });
}, { passive: true });
markNav();

function repaint() {
  const y = window.scrollY;
  paintNav();
  // The tutor's whole card is built in JavaScript, so a language change has to
  // rebuild it like everything else. Left out, he answered in English on a page
  // that had switched to Chinese.
  drawTutor();
  drawDeck();
  drawFollowers();
  draw();
  window.scrollTo(0, y);
}
setLang(pickLang());
$("langslot").append(langButton(repaint));
paintNav();

fetch("/api/contact").then((r) => r.json()).then((d) => {
  translateOn = Boolean(d && d.translate);
  showTranslate();
  // The board is already drawn by the time this answers, and whether each post
  // gets a translate button depends on it. Without this the button appears or
  // not depending on which of two fetches won, which is how one language ended
  // up with five actions and the other four.
  if (translateOn) repaint();
  if (!d || !d.contact) return;
  const box = $("contact");
  box.hidden = false;
  box.append(document.createTextNode(" " + T("board.contact") + " "));
  const a = document.createElement("a");
  a.href = /@/.test(d.contact) ? "mailto:" + d.contact : d.contact;
  a.textContent = d.contact;
  a.style.color = "inherit";
  box.append(a, document.createTextNode("."));
}).catch(() => { $("tfab").hidden = true; });

/* ---- your own profile ------------------------------------------------------
 *
 * Drawn above the feed on every visit, whether or not there is one yet. A board
 * where the first thing you see is your own face is a different thing from a
 * board where you are anonymous until you post — and the empty state is the
 * important one, because it is what everybody sees first. */

/* A photograph, made fit to send.
 *
 * Three problems, one answer. An iPhone camera writes HEIC by default, which
 * the server does not accept and which no browser but Safari can display. A
 * photo off a modern phone is four or five megabytes, and base64 makes it a
 * third bigger again — which on a Chinese mobile connection is the difference
 * between a tap and a wait long enough to assume it failed. And a portrait
 * held sideways carries its rotation in EXIF, which some renderers honour and
 * some ignore.
 *
 * Drawing it to a canvas and re-encoding answers all three: whatever went in
 * comes out as JPEG, at a sensible size, already the right way up —
 * createImageBitmap applies the EXIF orientation rather than leaving it as
 * metadata for somebody else to interpret.
 *
 * A profile picture does not need four thousand pixels across. */
/* Getting JPEG bytes out of a canvas, in whichever way this browser can.
 *
 * canvas.toBlob is the good one, and WeChat's Android webview — an old Blink
 * fork — does not always have it. toDataURL is in every browser that has a
 * canvas at all, and since the bytes are going up as base64 anyway, it is
 * arguably the more direct route: it hands back base64 already, so the
 * blob-to-base64 step disappears with it.
 *
 * Returns { data, bytes } where data is base64 with no data: prefix, matching
 * what the server expects. */
async function encodeJpeg(canvas, quality) {
  if (canvas.toBlob) {
    const blob = await new Promise((ok) => canvas.toBlob(ok, "image/jpeg", quality));
    if (blob) return { data: await asBase64(blob), bytes: blob.size };
  }
  let url;
  try {
    url = canvas.toDataURL("image/jpeg", quality);
  } catch { return null; }
  const comma = url.indexOf(",");
  if (comma < 0 || url.slice(0, 11) !== "data:image/") return null;
  const data = url.slice(comma + 1);
  // Base64 is four characters per three bytes, less the padding.
  return { data, bytes: Math.round(data.length * 3 / 4) };
}

async function shrink(file, max) {
  /* Getting the pixels, three ways.
   *
   * createImageBitmap is the good one — it decodes off the main thread and
   * applies the EXIF rotation. But Safari has been fussy about the options
   * argument, and an option it does not know can throw rather than be ignored.
   * So: with options, then without, then an <img> element, which every browser
   * that can show a photograph can do.
   *
   * The first version of this caught the throw and sent the file raw, which
   * put it straight back into the bug it was written to fix — a silent
   * fallback to the broken path is worse than no fallback at all. */
  const draw = async () => {
    try {
      return await createImageBitmap(file, { imageOrientation: "from-image" });
    } catch { /* Safari, probably the option */ }
    try {
      return await createImageBitmap(file);
    } catch { /* no bitmap decoding at all */ }
    // An <img> and an object URL. Slower, and it does not apply EXIF rotation
    // on older browsers, but it produces pixels where the other two did not.
    return await new Promise((ok, no) => {
      const url = URL.createObjectURL(file);
      const img = new Image();
      img.onload = () => { URL.revokeObjectURL(url); ok(img); };
      img.onerror = () => { URL.revokeObjectURL(url); no(new Error("decode")); };
      img.src = url;
    });
  };

  let src;
  try {
    src = await draw();
  } catch {
    // Nothing could read it — a HEIC in a browser that cannot decode HEIC is
    // the real case. Say so rather than pushing 5 MB up a mobile connection
    // and letting it time out.
    return { error: T("post.badPhoto") };
  }

  const iw = src.width || src.naturalWidth, ih = src.height || src.naturalHeight;
  if (!iw || !ih) return { error: T("post.badPhoto") };

  const scale = Math.min(1, max / Math.max(iw, ih));
  const w = Math.round(iw * scale), h = Math.round(ih * scale);
  let shot = null;
  try {
    const canvas = document.createElement("canvas");
    canvas.width = w; canvas.height = h;
    canvas.getContext("2d").drawImage(src, 0, 0, w, h);
    shot = await encodeJpeg(canvas, 0.85);
  } catch { /* a canvas too large for this device, or a tainted one */ }

  if (!shot) {
    // The canvas gave us no JPEG at all. Sending the original is only worth
    // trying if it is small enough to arrive.
    if (file.size > 4 * 1024 * 1024) return { error: T("post.badPhoto") };
    return { data: await asBase64(file), type: file.type };
  }

  /* A hard ceiling, whatever the picture is.
   *
   * The route from a phone in China to a box in Tokyo drops packets, and a
   * large POST over a lossy link does not fail cleanly — it stalls until the
   * browser gives up and says "Load failed", which is indistinguishable from
   * every other network fault. So rather than trusting one resize to be
   * enough, this keeps going until the thing is small enough to arrive.
   *
   * A photograph nobody can upload is worth less than a slightly softer one
   * that arrives. */
  const CEILING = 900 * 1024;
  let side = Math.max(w, h), quality = 0.85;
  for (let pass = 0; shot.bytes > CEILING && pass < 4; pass++) {
    side = Math.round(side * 0.75);
    quality = Math.max(0.5, quality - 0.08);
    try {
      const cv = document.createElement("canvas");
      const r2 = side / Math.max(w, h);
      cv.width = Math.max(1, Math.round(w * r2));
      cv.height = Math.max(1, Math.round(h * r2));
      // Always redrawn from the original source, never from the last pass:
      // re-encoding a JPEG of a JPEG compounds the artefacts, and the source
      // is still in hand.
      cv.getContext("2d").drawImage(src, 0, 0, cv.width, cv.height);
      const next = await encodeJpeg(cv, quality);
      if (!next) break;
      shot = next;
    } catch { break; }
  }
  if (src.close) src.close();
  return { data: shot.data, type: "image/jpeg" };
}

function asBase64(file) {
  return file.arrayBuffer().then((buf) => {
    const bytes = new Uint8Array(buf);
    let bin = "";
    for (let i = 0; i < bytes.length; i += 8192) bin += String.fromCharCode(...bytes.subarray(i, i + 8192));
    return btoa(bin);
  });
}

async function saveMe(patch) {
  const payload = JSON.stringify({ ...patch, device });
  const mb = (payload.length / 1024 / 1024).toFixed(2);

  /* TWICE, THEN GIVE UP.
   *
   * A photograph going from a phone here to a box in Tokyo over mobile data
   * does not always arrive. The server's log for it is "request aborted" —
   * the body stopped coming — and what the browser tells the page is "Load
   * failed", which is not a sentence anybody can act on.
   *
   * One retry turns most of those into an upload that worked. The cost is a
   * photograph that arrived on the first attempt after all: its file stays on
   * disk unreferenced while the second one becomes the profile picture. A few
   * stray kilobytes is the right price for not telling somebody their face
   * would not upload when a second attempt would have carried it.
   *
   * Only the throw is retried — a connection that failed. A 4xx or 5xx is an
   * answer, and asking the same question again gets the same answer. */
  let r, err;
  for (let go = 0; go < 2; go++) {
    if (go) await new Promise((ok) => setTimeout(ok, 900));
    try {
      r = await fetch("/api/me", {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: payload,
      });
      err = null;
      break;
    } catch (e) { err = e; }
  }
  if (err) {
    console.error("profile save:", err);
    return { error: T("me.didNotGo", { mb }) };
  }
  const d = await r.json().catch(() => ({}));
  if (!r.ok) {
    if (d.error === "contact") return { error: T("me.noContact", { what: d.what }) };
    return { error: T(d.error === "tooBig" ? "post.tooBig" : "err.general") };
  }
  ME = d.person;
  paintNav();
  // A face arriving takes the ask away — the row under the deck and the card
  // at the end of it both go.
  drawDeck();
  // "Set up your page" is only offered while there is no page. Without this it
  // stays on screen telling somebody to do the thing they have just done.
  drawTutor();
  if (!$("mesheet").hidden) drawMePic();
  return d;
}

for (const [input, key] of [["mephoto", "photo"]]) {
  $(input).addEventListener("change", async (e) => {
    const f = e.target.files && e.target.files[0];
    e.target.value = "";
    if (!f) return;
    if (f.size > 40 * 1024 * 1024) { alert(T("post.tooBig")); return; }
    let who = "";
    try { who = localStorage.getItem("board:who") || ""; } catch { /* fine */ }
    // Say something before the wait, not after. Re-encoding a large photo
    // takes a moment on a phone, and a control that does nothing visible is a
    // control somebody presses again.
    let shot;
    try {
      shot = await shrink(f, 1000);
    } catch (err) {
      alert(T("post.badPhoto") + " (" + (err && err.message || "?") + ")");
      drawMePic();
      return;
    }
    if (shot.error) { alert(shot.error); drawMePic(); return; }
    const out = await saveMe({
      [key]: shot.data, [key + "Type"]: shot.type,
      ...(ME && ME.handle ? {} : { handle: who }),
    });
    if (out.error) alert(out.error);
    // No handle yet: the picture is up, so ask for the name while they are here.
    else if ((!ME || !ME.handle) && $("mesheet").hidden) openMe();
  });
}

/* The avatar inside the editor. Same picture, same picker, drawn from ME so it
 * updates the moment the upload comes back. */
function drawMePic() {
  const box = $("mepicin");
  fill(box);
  if (ME && ME.photo) {
    const img = Object.assign(document.createElement("img"),
      { src: "/api/public-media?id=" + encodeURIComponent(ME.photo), alt: "" });
    img.addEventListener("error", () => { img.remove(); box.textContent = initial(ME && ME.handle); });
    box.append(img);
  } else {
    box.textContent = initial(ME && ME.handle);
  }
  $("mepicgo").setAttribute("aria-label", T("me.addPhoto"));
  /* Three states, not two. A photo that is waiting to be read has to say so
     somewhere, and the block that used to say it is off the page. */
  $("mepicsay").textContent = !(ME && ME.photo) ? T("me.needPhoto")
    : ME.photoPending ? T("me.photoHeld") : "";
}
$("mepicgo").addEventListener("click", () => $("mephoto").click());

/* The days somebody is free, 0–6. Drawn rather than a row of checkboxes: seven
 * of those is a wall of text, and a week reads as a shape. */

function openMe(joining) {
  const made = Boolean(ME && ME.handle);
  $("metitle").textContent = T(made ? "me.editTitle" : "me.newTitle");
  $("mename").placeholder = T("me.name");
  $("mecampus").placeholder = T("me.campus");
  $("meage").placeholder = T("me.age");
  $("melangs").placeholder = T("me.langs");
  $("mehere").placeholder = T("me.here");
  $("megoal").placeholder = T("me.goal");
  $("mewhy").textContent = T("me.whyNoContact");
  $("meshut").textContent = T("post.cancel");
  // Putting yourself up is not the same act as changing a detail later, and a
  // button that says the same word for both is the reason nobody is sure which
  // one they are doing.
  $("mesave").textContent = T(made ? "me.save" : "me.post");
  $("memorelabel").textContent = T("me.more");
  $("mename").value = (ME && ME.handle) || "";
  $("mecampus").value = (ME && ME.campus) || "";
  $("meage").value = (ME && ME.age) || "";
  $("melangs").value = (ME && Array.isArray(ME.speaks) ? ME.speaks.join(", ") : "");
  $("mehere").value = (ME && ME.here) || "";
  $("megoal").value = (ME && ME.goal) || "";
  /* Open if there is already something in it, shut otherwise. Somebody who
   * filled these in once should not have to find them again to change one. */
  showMore(Boolean(joining) ||
    Boolean(ME && (ME.campus || ME.age || ME.here || ME.goal ||
      (ME.speaks && ME.speaks.length))));
  $("melookinglabel").textContent = T("bud.lookingLabel");
  $("melookingwhy").textContent = T("bud.lookingWhy");
  // Pressed "join the list", so it starts ticked — the button said what it was
  // going to do and a form that then makes you do it again is a form arguing
  // with its own button.
  /* On by default for a new page, and whatever they last chose for one that
   * exists. Defaulting a returning person back to on would be overruling them
   * every time they opened the form. */
  $("melooking").checked = joining === true ||
    (ME && ME.handle ? Boolean(ME.looking) : true);
  $("mesaid").hidden = true;
  drawMePic();
  $("mesheet").hidden = false;
  // Focus the name only when there is already a face — otherwise the keyboard
  // covers the photo control the form is about to insist on.
  if (ME && ME.photo) $("mename").focus();
}
function showMore(on) {
  $("memore").hidden = !on;
  $("memorego").setAttribute("aria-expanded", String(Boolean(on)));
}
$("memorego").addEventListener("click", () => showMore($("memore").hidden));

$("meshut").addEventListener("click", () => { $("mesheet").hidden = true; });
$("mesheet").addEventListener("click", (e) => {
  if (e.target === $("mesheet")) $("mesheet").hidden = true;
});
$("meform").addEventListener("submit", async (e) => {
  e.preventDefault();
  const said = $("mesaid");
  const handle = $("mename").value.trim();
  if (!handle) { said.hidden = false; said.classList.add("bad"); said.textContent = T("post.needName"); return; }
  /* A profile here has a face on it.
   *
   * Checked against the picture the person has, not the one the public can see:
   * a photo waiting for review is still a photo they added, and refusing to
   * save their name until somebody has looked at it would be a strange way to
   * treat them. */
  if (!ME || !ME.photo) {
    said.hidden = false; said.classList.add("bad");
    said.textContent = T("me.needPhoto");
    $("mephoto").click();
    return;
  }
  const out = await saveMe({
    handle, campus: $("mecampus").value.trim(),
    age: $("meage").value.replace(/\D/g, ""),
    // Typed as a sentence, kept as a list: "English, Spanish, a bit of Chinese"
    // is how somebody answers this, and splitting it here means the profile can
    // show them as separate things later without asking again.
    speaks: $("melangs").value.split(/[,，、]/).map((x) => x.trim()).filter(Boolean).slice(0, 6),
    looking: $("melooking").checked,
    here: $("mehere").value.trim(), goal: $("megoal").value.trim(),
  });
  if (out.error) { said.hidden = false; said.classList.add("bad"); said.textContent = out.error; return; }
  // The name here is the name posts go out under, so the two stay in step.
  try { localStorage.setItem("board:who", handle); } catch { /* fine */ }
  said.hidden = false; said.classList.remove("bad"); said.textContent = T("me.saved");
  setTimeout(() => { $("mesheet").hidden = true; }, 900);
});

fetch("/api/me", { headers: device ? { "x-board-device": device } : {} })
  .then((r) => r.json())
  .then((d) => { ME = d.person; paintNav(); drawTutor(); drawDeck(); })
  .catch(paintNav);

load();
loadPeople();
loadWanted();
loadFollowers();
</script>

<script>
/* Registering the worker.
 *
 * Classic script rather than a module so this runs before anything else and
 * on browsers that do not do modules — the worker is what makes the board
 * survive a bad connection, which is exactly the browser least likely to be
 * new.
 *
 * Deferred to load: registration competes with the page's own requests, and
 * the first paint matters more than the second visit.
 */
/* The counter. First-party, from this board's own hostname — the same file the
 * brand page loads, proxied by Caddy so nothing here is a third-party request.
 * Deferred: it must never compete with the board's own first paint. */
if (!/[?&]nocount\b/.test(location.search)) {
  const c = document.createElement("script");
  c.src = "/a/lx.js"; c.defer = true;
  document.head.append(c);
}

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("/sw.js").catch(() => { /* not fatal */ });
  });
}
</script>
</body>
