<script type="module">
import { T, when, lang, setLang, pickLang, langButton, STRINGS } from "/i18n.js";
/* The photograph pipeline lives in its own file now: the waiting room, which
   is in front of the door, needs the same one. See photo.js. */
import { shrink, asBase64 } from "/photo.js";
import { stageFor, stageName, crownMark } from "/crown.js";
import { OFF } from "/off.js";
import { dailyCard, dailyDone } from "/daily.js";
import { BANDS } from "/level-cards.js";

const $ = (id) => document.getElementById(id);
const el = (t, c, x) => { const n = document.createElement(t); if (c) n.className = c;
  if (x !== undefined) n.textContent = x; return n; };

/* WHY THIS BLOCK EXISTS
 *
 * This board is meant to be forwarded into a WeChat chat and read where it
 * lands. That means the browser is not Chrome: on Android WeChat renders in
 * Tencent's X5 kernel, which trails Chrome by a long way and varies by
 * WeChat version, and on iOS it is whatever WKWebView the phone shipped with.
 *
 * Four things this page used are too new for that. Each one fails silently —
 * no error the reader would see, just a screen that does nothing — which is
 * the worst way to be broken on someone else's phone in another country.
 */

const IN_WECHAT = /micromessenger/i.test(navigator.userAgent);

/** Element.replaceChildren is Chrome 86. Old X5 does not have it, and the
 *  board is drawn entirely through it, so without this the page renders once
 *  and never updates again. */
function fill(node, ...kids) {
  while (node.firstChild) node.removeChild(node.firstChild);
  for (const k of kids) if (k) node.appendChild(k);
}

/** crypto.randomUUID is Chrome 92 AND only exists in a secure context. Without
 *  a fallback the id is never minted, which quietly costs somebody the ability
 *  to take their own post down. */
function uuid() {
  try { if (crypto.randomUUID) return crypto.randomUUID(); } catch (e) { /* older */ }
  try {
    const b = new Uint8Array(16);
    crypto.getRandomValues(b);
    b[6] = (b[6] & 0x0f) | 0x40; b[8] = (b[8] & 0x3f) | 0x80;
    const h = [...b].map((x) => x.toString(16).padStart(2, "0")).join("");
    return h.slice(0,8)+"-"+h.slice(8,12)+"-"+h.slice(12,16)+"-"+h.slice(16,20)+"-"+h.slice(20);
  } catch (e) { /* no crypto at all */ }
  // Last resort. Weaker, and it only ever identifies this browser to itself.
  return "x" + Date.now().toString(36) + Math.random().toString(36).slice(2, 12);
}

/** navigator.clipboard needs a secure context and is refused outright inside
 *  WeChat. The old textarea trick still works in every webview there is. */
function copyText(text) {
  try {
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text);
      return true;
    }
  } catch (e) { /* fall through */ }
  try {
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.setAttribute("readonly", "");
    ta.style.cssText = "position:absolute;left:-9999px;top:0";
    document.body.appendChild(ta);
    ta.select();
    ta.setSelectionRange(0, text.length);   // iOS ignores select() alone
    const ok = document.execCommand("copy");
    document.body.removeChild(ta);
    return ok;
  } catch (e) { return false; }
}

/* The real height of the window. WeChat's toolbar sits inside the viewport on
   Android and outside it on iOS, so vh is wrong in one direction or the other
   and a sheet sized in vh ends up under the chrome. */
function setVH() {
  document.documentElement.style.setProperty("--vh", (window.innerHeight / 100) + "px");
}
setVH();
window.addEventListener("resize", setVH);
window.addEventListener("orientationchange", setVH);

/** The line icons on each post. Drawn here rather than pulled from anywhere:
 *  four paths are cheaper than a request that would not answer in the mainland. */
const ICON = {
  reply: "M9 14 4 9l5-5 M4 9h8a8 8 0 0 1 8 8v3",
  like: "M12 20s-7-4.6-7-9.4A4 4 0 0 1 12 8a4 4 0 0 1 7-.6c0 4.8-7 12.6-7 12.6Z",
  remove: "M4 7h16 M10 11v6 M14 11v6 M6 7l1 12a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1l1-12 M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2",
  share: "M18 8a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5Z M6 15a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5Z M18 22a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5Z M8.2 11.4l7.6-4 M8.2 13.6l7.6 4",
  flag: "M5 21V4 M5 4h11l-2 3.5L16 11H5",
  globe: "M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18Z M3 12h18 M12 3c2.5 2.4 3.8 5.4 3.8 9S14.5 18.6 12 21c-2.5-2.4-3.8-5.4-3.8-9S9.5 5.4 12 3Z",
};
function icon(name) {
  const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  svg.setAttribute("viewBox", "0 0 24 24");
  svg.setAttribute("aria-hidden", "true");
  for (const d of ICON[name].trim().split(/\s+M/).map((s, i) => (i ? "M" + s : s))) {
    const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
    path.setAttribute("d", d);
    svg.append(path);
  }
  return svg;
}

/** A topic keeps its colour. Picked from the name rather than the order it
 *  happens to appear in, so Food is the same red on every reader's screen and
 *  stays that red when something else is posted above it. */
const TDOT = ["--t1","--t2","--t3","--t4","--t5","--t6"];
function topicColour(name) {
  let h = 0;
  for (const ch of String(name)) h = (h * 31 + ch.codePointAt(0)) >>> 0;
  return "var(" + TDOT[h % TDOT.length] + ")";
}

// A random number this browser made up. Hashed on the server before it is
// written down; it identifies a browser, never a person, and the only thing it
// buys is being able to take your own post back.
/* Whether this member may put somebody else up — the same test /api/run/add
   applies, answered once by paintRun and read by the ＋ menu. */
let CANRUN = false;
let device = "";
try {
  device = localStorage.getItem("board:device") || "";
  // uuid(), not crypto.randomUUID directly. randomUUID is Chrome 92 and only
  // exists in a secure context — the exact reason the helper twenty lines up
  // was written — and calling the raw one here threw on an older WeChat
  // kernel before a single line of the board had been drawn.
  if (!device) { device = uuid(); localStorage.setItem("board:device", device); }
} catch { /* private window: it still works, it just forgets */ }

/* ---- BEING SOMEBODY YOU SPEAK FOR ---------------------------------------
 *
 * An agent runs several people (see /run, and docs/mockups/agent.html). While
 * they are being one of them, every request this page makes has to say so, and
 * the screen has to say so too.
 *
 * ONE SHIM RATHER THAN FORTY EDITS. There are dozens of fetch calls in this
 * file and each one assembles its own headers; threading an extra header
 * through all of them is forty chances to miss one, and the one missed is a
 * post written as the wrong person. So `fetch` is wrapped once, here, and adds
 * the header to any request that already identifies this browser. A request
 * that does not send x-board-device is a request that does not care who is
 * asking, and it is left alone.
 *
 * THE BAR IS NOT OPTIONAL AND NOT DISMISSABLE. The whole risk this feature
 * carries is writing as the wrong person, so the state is orange, across the
 * top, on every screen, with the name in it and one button out. A dropdown you
 * can forget you are in is the thing this is designed not to be.
 */
const AS_KEY = "board:as";
const beingAs = () => { try { return localStorage.getItem(AS_KEY) || ""; } catch { return ""; } };

const rawFetch = window.fetch.bind(window);
window.fetch = (input, init) => {
  const as = beingAs();
  if (!as) return rawFetch(input, init);
  const h = new Headers((init && init.headers) || (input instanceof Request ? input.headers : undefined));
  /* AND MOST OF THIS FILE DOES NOT USE THAT HEADER. The rule started as "add
     it wherever x-board-device already is", which read as safe and was not:
     about thirty writes in here put the device in the JSON BODY instead —
     the sentence under Browse among them — so they sailed past this shim
     without the as-header, the middleware never entered, and the edit landed
     on the agent's own row rather than the person they were being. Silent,
     and in the one direction this feature must never fail.
     So: every write to the API carries both headers while somebody is being
     somebody. The server decides whether to honour it — an id that is not a
     row this browser runs falls through as themselves, and the door asks
     store.hashDevice about the real browser on purpose. Reads are left alone;
     they are the same either way and a page load is nobody. */
  const url = String(input instanceof Request ? input.url : input || "");
  const way = String((init && init.method) || (input instanceof Request ? input.method : "GET")).toUpperCase();
  const write = way !== "GET" && way !== "HEAD" && /^\/api\//.test(url);
  if (write && device && !h.get("x-board-device")) h.set("x-board-device", device);
  if (h.get("x-board-device")) h.set("x-board-as", as);
  return rawFetch(input, { ...(init || {}), headers: h });
};

/* Drawn before anything else paints, because it is the one thing on the screen
   that has to be true before somebody starts typing. The name is filled in
   from /api/run when that answers; until then the bar says it plainly without
   one rather than waiting and showing nothing. */
function drawBeing() {
  const as = beingAs();
  let bar = document.getElementById("beingbar");
  if (!as) { if (bar) bar.remove(); return; }
  if (!bar) {
    bar = document.createElement("div");
    bar.id = "beingbar";
    bar.innerHTML = '<span id="beingwho"></span>'
      + '<button type="button" id="beingout"></button>';
    document.body.prepend(bar);
    document.getElementById("beingout").onclick = () => {
      try { localStorage.removeItem(AS_KEY); } catch { /* private window */ }
      location.reload();
    };
  }
  document.getElementById("beingout").textContent = T("run.beback");
  fetch("/api/run", { headers: { "x-board-device": device } })
    .then((r) => r.json())
    .then((d) => {
      const who = (d.run || []).find((q) => q.id === d.as);
      // A stale id — the row was handed over, or cleared on another phone —
      // is not an error. Stop sending it and take the bar down.
      if (!who) {
        try { localStorage.removeItem(AS_KEY); } catch { /* private window */ }
        bar.remove();
        return;
      }
      document.getElementById("beingwho").textContent = T("run.being", { who: who.handle });
    })
    .catch(() => { /* offline: the bar stays up, which is the safe direction */ });
}

let posts = [], topic = "", FOLLOWING = [];
/* How many of those posts a member actually wrote — see /api/board. The rest
   is the board talking to itself, and it should not be mistaken for a room
   with people in it. */
let FROMMEMBERS = 0;
// With the rest of the state rather than beside the code that draws it: `let`
// does not hoist a value, so the nav — which paints before the profile block
// is reached — hit a temporal dead zone rather than a null.
/* THE LANGUAGE HALF OF THIS BOARD IS OFF.
 *
 * The phrase of the day, the ten-level test and the four-letter test are
 * heritage: this began as a board for people arriving in China and studying,
 * and those were the right things then. The Exchange is a room where people
 * find each other and make each other offers, and a Chinese flashcard sitting
 * above the waiting list is asking a member to do homework on their way to
 * work.
 *
 * Switched off rather than deleted, because none of it is wrong — it is in
 * the wrong product. The routes, the pages, the levels and everything anybody
 * has already earned are untouched and come back by turning this to true.
 */
const LEARNING = false;

/* THE OFFER COMPOSER, OFF FOR NOW.
 *
 * Not because it is wrong — it works, and offers are the point of this place.
 * It is that nobody in the room has done the first three steps yet: a form
 * for writing somebody a paid job, sitting in the tray of members who have
 * not yet put a sentence up, teaches the wrong thing about what this is for.
 * Offers go out from the box in the meantime — `make offer` — which is one
 * person deciding rather than a button anybody with the flag can find.
 *
 * The whole system stays: the routes, the /o/ pages, the codes already sent,
 * and the flag itself. This hides one form, and one line brings it back.
 *
 * MAKE_OFFERS rather than OFFERS: there is already an OFFERS on this page —
 * the rotating bar's list of things the Tutor is offering to do — and two
 * constants with one name is the kind of collision that only shows up as a
 * blank screen. */
const MAKE_OFFERS = false;

/* Every read of a level or a four-letter code goes through here, so switching
 * LEARNING off is one decision rather than a hunt for the places that show
 * them. Gating the drawing instead missed the collapsed summary row on the
 * report card, which is the one place a level appears without a heading over
 * it saying so — visible only when somebody opened the fold, which no test
 * that reads the page as text will notice. What is stored stays stored. */
const learned = (key) => (LEARNING ? readLocal(key) : null);

let ME = null;
/* How many people are at the door, or null while there are too few for the
   number to be a queue rather than a handful of names. From /api/me, kept
   apart from ME because it is a fact about the board and not about you. */
let WAITING = null, MEMBERS = 0;
// What they have done with people here. One of five words — see rankOf.
let RANK = "";
// Declared here with the rest of the state rather than beside the code that
// draws it: `let` does not hoist a value, so anything running earlier — the
// nav, on first paint — hit a temporal dead zone instead of a null.
let photo = null;             // { data, type }
let liked = new Set();        // what this browser has already liked
try { liked = new Set(JSON.parse(localStorage.getItem("board:liked") || "[]")); } catch { /* fine */ }

/* People this reader does not want to see, kept in this browser and nowhere
 * else. There are no accounts here, so a block cannot be a thing done TO
 * somebody — it is a thing done to your own copy of the board. That is the
 * honest version and it has a property the server-side kind does not: it
 * cannot be used as a weapon, because nobody else is affected by it.
 *
 * It is per-browser, and it goes when site data goes. Said plainly on the
 * page rather than quietly true. */
let blocked = new Set();
try { blocked = new Set(JSON.parse(localStorage.getItem("board:blocked") || "[]")); } catch { /* fine */ }
const saveBlocked = () => {
  try { localStorage.setItem("board:blocked", JSON.stringify([...blocked])); } catch { /* fine */ }
};
let reported = new Set();
try { reported = new Set(JSON.parse(localStorage.getItem("board:reported") || "[]")); } catch { /* fine */ }


const initial = (name) => (String(name || "?").trim()[0] || "?").toLowerCase();

async function load() {
  try {
    const r = await fetch("/api/board", { headers: device ? { "x-board-device": device } : {} });
    const d = await r.json();
    posts = Array.isArray(d.posts) ? d.posts : [];
    FOLLOWING = Array.isArray(d.following) ? d.following : [];
    FROMMEMBERS = Number(d.fromMembers || 0);
  } catch { posts = []; }
  draw();
  /* AFTER draw(), NOT BEFORE IT. draw() fills the board and unhides the rows
     that go with it, so a quiet feed drawn first was immediately undrawn. */
  drawSoon();
}

/* THE FEED SAYS SO WHEN NOBODY HAS SAID ANYTHING.
 *
 * It was never empty and that was the problem. Seeded posts, the board
 * announcing that somebody joined, a card put up from the box — all real
 * rows, none of them a member with something to say. A feed that looks busy
 * while the room is silent is the one thing a member reads as "nobody is
 * here", and it is worse than a blank page because it looks like the answer.
 *
 * So until somebody with a page posts something, the tab says what is true:
 * this half is not open yet. The moment one member posts, the count is no
 * longer nought and the feed appears with their post at the top of it — no
 * switch to remember, nothing to turn off.
 */
function drawSoon() {
  const box = $("soon");
  if (!box) return;
  const quiet = FROMMEMBERS < 1;
  box.hidden = !quiet;
  /* The bounce that used to be here is gone: viewNow settles this before the
     first paint now, for every arrival rather than only a quiet one. */
  /* The posts and everything that files them. Left alone when it is not
     quiet, because each of these has its own reason to be hidden and this
     one must not overrule them. */
  for (const id of ["topics", "posts", "board"]) {
    const e = $(id);
    if (e && quiet) e.hidden = true;
    else if (e && id !== "board") e.hidden = false;
  }
  if (quiet) { const n = $("none"); if (n) n.hidden = true; }
  $("soonlab").textContent = T("soon.lab");
  $("soonhead").textContent = T("soon.head");
  $("soonsay").textContent = T("soon.say");
}

/* THE TOPICS THIS BOARD STARTS WITH.
 *
 * A row of filters that only shows what has already been posted is a row that
 * is empty on the day it matters most: nobody has posted, so there is nothing
 * to file a post under, so nobody posts. These sit there from the start and
 * say what this place is for — which is most of what a new reader learns from
 * the top of a feed.
 *
 * THE KEY IS ENGLISH AND THE LABEL IS NOT. A topic is stored on a post as a
 * plain string, so if the chip's own words went onto the post then an English
 * reader and a Chinese one filing the same thing would make two topics that
 * never meet. The key travels; the label is chosen when it is drawn.
 */
/* ---- ONE VOCABULARY, AND IT IS THE ROOMS ------------------------------------
 *
 * The topics are gone. There were two lists of words in this product — topics
 * on posts (Courses, Near Renmin, Chinese food) and rooms on people (language
 * exchange, study partner, raising money) — and on a board of eleven people two
 * taxonomies is worse than either alone: everything is spread thinly across
 * both and neither ever fills up.
 *
 * So a post is filed under the same words a person is. What somebody is looking
 * for and what a post is about become the same question, which is the question
 * this board exists to answer.
 *
 * "ask" IS THE CATCH-ALL, and it is not a room anybody ticks on their profile.
 * "Where do I get a SIM without a bank card" is nobody's intent — it is a
 * question — and a vocabulary of intentions with nowhere to put a question is a
 * vocabulary people work around.
 *
 * OLD POSTS KEEP THEIR WORDS. Anything filed under a topic that no longer
 * exists still shows that word on the post and is counted under "ask", so
 * nothing that was posted before tonight becomes unreachable. The Professor's
 * notices are filed under "Getting in" and the scripts that match on it keep
 * working.
 */
const ROOMKEYS = ["lang", "study", "new", "host", "job", "hire", "cofound",
                  "raise", "invest", "buy", "sell", "talent", "agent", "ask"];
const ROOMGROUPS = [
  { grp: "room.groupStudy",  keys: ["lang", "study"] },
  { grp: "room.groupSettle", keys: ["new", "host"] },
  { grp: "room.more",        keys: ["job", "hire", "cofound", "raise", "invest",
                                    "buy", "sell", "talent", "agent"] },
  { grp: "room.groupElse",   keys: ["ask"] },
];

/** Which room a post belongs to, or "" for one that was never filed.
 *
 *  Nothing at all is now a real answer: a post made without touching the
 *  dropdown goes to the main feed and belongs to no room, so it shows no room
 *  on the card and appears in the sheet only inside the Everyone total.
 *
 *  An unrecognised topic is different — that is an old post filed under a
 *  word that no longer exists, and it still counts as a question, which is
 *  what "ask" is for. */
const roomOf = (p) => (p.topic ? (ROOMKEYS.includes(p.topic) ? p.topic : "ask") : "");

/** What to print on a post. A room by its name in this language; an old topic
 *  by the word it was actually filed under. */
const roomLabel = (key) => (ROOMKEYS.includes(key) ? T("room." + key) : key);

/** The head of a room's name, for the one line that lists four of them at
 *  once. "Co-founder — building something" is a tick box's worth of words and
 *  four of those on one grey line is a paragraph. Cut at the dash or the comma,
 *  which is where both languages put the qualifier. */
const shortRoom = (key) => roomLabel(key).split(/\s*[—,，、]|——/)[0].trim();

/* WHERE A POST GOES: THE MAIN FEED, UNLESS SOMEBODY SAYS OTHERWISE.
 *
 * This was fourteen chips, then two chips and a link, and both were the same
 * mistake in different sizes: a question asked of everybody, in front of the
 * box they opened the sheet to type in, when the honest answer almost every
 * time is "everyone".
 *
 * So it is one dropdown, closed, reading Everyone. A post with nothing picked
 * goes to the main feed and carries no room at all — no eyebrow on the card,
 * counted only under Everyone in the filter sheet. Filing is a thing somebody
 * does on purpose, not a form they have to clear on the way past.
 *
 * A NATIVE SELECT RATHER THAN CHIPS, because the phone draws it. Fourteen
 * options cost one line here however long the list gets, they are grouped the
 * same way the filter sheet groups them, and the picker is the one the reader
 * already knows how to use.
 */
let POSTROOM = "";
function drawPickRoom() {
  const box = $("pickroom");
  if (!box) return;
  fill(box);
  box.append(el("p", "pickcap", T("post.room")));

  const sel = document.createElement("select");
  sel.className = "roomsel";
  const all = el("option", null, T("board.everyone"));
  all.value = "";
  all.selected = !POSTROOM;
  sel.append(all);
  for (const g of ROOMGROUPS) {
    const grp = document.createElement("optgroup");
    grp.label = T(g.grp);
    for (const k of g.keys) {
      // The short name. A dropdown row is a tag, the same as a chip was.
      const o = el("option", null, T("room.t." + k));
      o.value = k;
      if (k === POSTROOM) o.selected = true;
      grp.append(o);
    }
    sel.append(grp);
  }
  // No redraw: the select holds its own state, and redrawing it mid-choice
  // takes the focus off the control somebody is using.
  sel.addEventListener("change", () => { POSTROOM = sel.value; });
  box.append(sel);
}

/* ---- one button, one sheet --------------------------------------------------
 *
 * WHY NOT A ROW OF CHIPS. Twelve rooms wrap to three lines, which is most of
 * what somebody sees above the first post, and four of those lines are rooms
 * nobody has posted in yet. This is one line, always, however many rooms there
 * are.
 *
 * EVERY ROW CARRIES ITS COUNT, and that is the part that matters at this size.
 * A filter that leads to an empty screen teaches people not to press filters.
 * You can see a room is empty before you spend a tap on it, and the empty ones
 * in a group fold into a single grey line rather than taking a row each.
 */
let SHEETOPEN = false;

function roomCounts() {
  const counts = new Map();
  for (const p of posts) {
    if (!store_isOwn(p)) continue;
    const k = roomOf(p);
    // "" is a real bucket now — a post on the main feed and in no room. It is
    // counted so the Everyone total stays true, and it has no row of its own
    // because it is not a room somebody can go to.
    counts.set(k, (counts.get(k) || 0) + 1);
  }
  return counts;
}

function drawTopics() {
  const box = $("topics"); fill(box);
  box.hidden = false;
  const counts = roomCounts();
  const total = [...counts.values()].reduce((a, b) => a + b, 0);

  const now = topic === "\u0000following" ? T("feed.onlyFollowing")
    : topic ? roomLabel(topic) : T("board.everyone");

  const btn = el("button", "filt");
  btn.type = "button";
  btn.setAttribute("aria-expanded", String(SHEETOPEN));
  btn.append(el("span", null, now));
  btn.append(el("i", "cv", "\u25be"));
  btn.addEventListener("click", () => { SHEETOPEN = !SHEETOPEN; drawTopics(); });
  box.append(btn);

  /* Following stays outside the sheet. It is not a room — it is the other
     question somebody asks of a feed — and it is one tap either way. */
  if (FOLLOWING.length) {
    const f = el("button", "filt quiet" + (topic === "\u0000following" ? " on" : ""));
    f.type = "button";
    f.textContent = T("feed.onlyFollowing");
    f.addEventListener("click", () => {
      topic = topic === "\u0000following" ? "" : "\u0000following";
      SHEETOPEN = false;
      draw();
    });
    box.append(f);
  }

  if (!SHEETOPEN) return;

  const sheet = el("div", "roomsheet");
  sheet.append(el("h4", null, T("room.showMe")));

  const line = (label, key, n, off) => {
    // `on` is passed rather than worked out from the key: the folded lines of
    // empty rooms carry no key, and comparing "" to "" ticked every one of
    // them the moment the feed was unfiltered.
    const on = !off && topic === key;
    const r = el("button", "sh" + (off ? " off" : "") + (on ? " on" : ""));
    r.type = "button";
    r.disabled = Boolean(off);
    r.append(el("i", "tick", on ? "\u2713" : ""));
    r.append(el("span", null, label));
    r.append(el("span", "n", String(n)));
    if (!off) r.addEventListener("click", () => { topic = key; SHEETOPEN = false; draw(); });
    sheet.append(r);
  };

  line(T("board.everyone"), "", total, false);
  for (const g of ROOMGROUPS) {
    const live = g.keys.filter((k) => counts.get(k));
    const dead = g.keys.filter((k) => !counts.get(k));
    if (!live.length && !dead.length) continue;
    sheet.append(el("div", "shgrp", T(g.grp)));
    for (const k of live) line(roomLabel(k), k, counts.get(k), false);
    /* THE EMPTY ONES, FOLDED. Seven rooms nobody has posted in is seven rows
       of nothing; one grey line says the same and says it faster. They are
       still named, because a room somebody cannot see is a room nobody will
       ever be the first to post in. */
    /* Seven names on one grey line is a paragraph again. Two, then a count —
       enough that somebody can see what kind of thing is missing without the
       line becoming the longest one in the sheet. */
    if (dead.length) {
      const say = dead.length > 3
        ? dead.slice(0, 2).map(shortRoom).join(" \u00b7 ")
          + " " + T("room.andMore", { n: dead.length - 2 })
        : dead.map(shortRoom).join(" \u00b7 ");
      line(say, "", 0, true);
    }
  }
  box.append(sheet);
}

/* WHERE THE CARD OF THE DAY GOES.
 *
 * The tray by default, the feed if they say so. One card in one place rather
 * than the same card in two, which would be two states of the same thing
 * disagreeing the moment somebody answered one of them.
 *
 * Asked once, in the tray, next to the card it is about — a preference nobody
 * was offered is a preference nobody has. "" means unasked, which is why the
 * question can be shown exactly once and then become a line they can change
 * their mind on.
 */
const WHEREKEY = "board:dailywhere";
const dailyWhere = () => {
  try { return localStorage.getItem(WHEREKEY) || ""; } catch { return ""; }
};
const setDailyWhere = (v) => {
  try { localStorage.setItem(WHEREKEY, v); } catch { /* private window */ }
  /* Moving it to the feed opens the fold it lands in. Otherwise pressing "yes,
     in my feed" makes the card disappear from the tray and reappear inside a
     collapsed section — which reads as having thrown it away. */
  draw();
};

function draw() {
  /* The Professor's card for today, in whichever of the two places this
     person asked for. Drawn on every pass because the whole page redraws on a
     language change, and it costs one localStorage read to be right in both
     languages. */
  const inFeed = dailyWhere() === "feed";
  const dbox = $("daily");
  const nbox = $("notifday");
  fill(dbox);
  fill(nbox);
  // Bare, because whichever section holds it already carries the mark and name.
  const one = LEARNING ? dailyCard(true) : null;
  if (one) (inFeed ? dbox : nbox).append(one);

  /* The question, once, under the card it is about. After that it is a line
     rather than a choice, because somebody who has answered should be able to
     change their mind without being asked again every day. */
  if (one && !inFeed) {
    const where = dailyWhere();
    if (!where) {
      const ask = el("div", "askfeed");
      ask.append(el("p", null, T("notif.askFeed")));
      const row = el("div", "askrow");
      const yes = el("button", "dgo", T("notif.yesFeed"));
      yes.type = "button";
      yes.addEventListener("click", () => setDailyWhere("feed"));
      const no = el("button", "dquiet", T("notif.noFeed"));
      no.type = "button";
      no.addEventListener("click", () => setDailyWhere("tray"));
      row.append(yes, no);
      ask.append(row);
      nbox.append(ask);
    } else {
      const sw = el("button", "swap", T("notif.inTray"));
      sw.type = "button";
      sw.addEventListener("click", () => setDailyWhere("feed"));
      nbox.append(sw);
    }
  }
  if (one && inFeed) {
    const sw = el("button", "swap", T("notif.inFeed"));
    sw.type = "button";
    sw.addEventListener("click", () => setDailyWhere("tray"));
    dbox.append(sw);
  }

  drawTray();
  drawProf();

  drawTopics();
  /* Where the posts begin. Unfiltered, it is named rather than described —
   * "Everyone · Newest first" told a reader how the list was sorted, which is
   * not a thing anybody wanted to know. Filtered, the sort matters again,
   * because then the question is what has been left out. */
  $("rulelabel").textContent = topic
    ? T("board.newest", {
        topic: topic === "\u0000following" ? T("feed.onlyFollowing") : topic,
      })
    : T("board.club");
  /* THE MASTHEAD IS THE PRODUCT'S NAME, which is site.title. It read
     board.name — "The Tutor" — for as long as that was the name, and it kept
     reading it after the rename, so the front of the app disagreed with the
     front door, the share card and the icon. board.name stays in the strings
     because HOUSE still matches on it: posts the house made under the old
     name keep their mark. See the note above HOUSE. */
  $("boardname").textContent = T("site.title");
  $("foottext").textContent = T("board.foot") + " ";
  /* AND THE WAY TO THE FINE PRINT. It used to be a paragraph under the deck;
     moving it off that screen only helps if there is still a way to reach it,
     and the footer is where somebody looks for one. Wired once. */
  if (!$("footpriv")) {
    const a = document.createElement("a");
    a.id = "footpriv";
    a.href = "/privacy";
    a.className = "footpriv";
    $("foottext").after(a);
  }
  $("footpriv").textContent = T("site.privacy");
  drawMyInvite();
  const shut = MODE === "read";
  /* THE LINE UNDER THE NAME COUNTED POSTS, and posts are not what this is.
   *
   * "3 posts up. Invite only." was the first sentence a new member read, on a
   * board whose whole argument is the people in it — and three is a number
   * that makes a room sound empty whichever way you say it. The count that
   * belongs here is the one the room is: how many are in.
   *
   * Posts still exist and the feed still works. It is the masthead that has
   * to say what the place is for, and it now says the same thing the door
   * said on the way in. */
  const inRoom = MEMBERS || (Array.isArray(PEOPLE) ? PEOPLE.length : 0);
  $("count").textContent = inRoom
    ? T("board.inRoom", { n: inRoom })
    : T(shut ? "inv.taglineShut" : "board.tagline");
  $("invite").textContent = T(shut ? "inv.locked" : "site.invite");
  /* AND ONLY TO SOMEBODY IT IS NEWS TO. "Not public yet — invite only" is the
     first thing a stranger arriving from a shared link should read and the
     four hundredth time a member has read it. It was a full-width band above
     the masthead on every visit. Members know; they let people in. */
  $("invite").hidden = Boolean(ME && ME.handle);

  const box = $("board"); fill(box);
  const list = posts.filter((p) => (
      topic === "\u0000following"
        ? FOLLOWING.indexOf((p.handle || "").toLowerCase()) >= 0
        // roomOf, not p.topic: an old topic counts under "Just asking" in the
      // sheet, so it has to filter there too or the count lies.
      : (!topic || roomOf(p) === topic))
    && !blocked.has((p.handle || "").toLowerCase())
    // Somebody who has said they should not be looking at this should stop
    // looking at it now, not once a person gets round to the queue.
    && !reported.has(p.id));

  $("none").hidden = list.length > 0;
  if (!list.length) {
    fill($("none"),
      el("b", null, T(posts.length ? "board.none.head" : "board.empty.head")),
      el("p", null, T(posts.length ? "board.none.body" : "board.empty.body")));
    return;
  }
  for (const p of list) box.append(card(p));
}

/* Somebody's face beside what they said, falling back to their initial.
 *
 * The letter is not a placeholder for a missing image, it is what most people
 * on this board have: a face is optional here and always will be. So the
 * letter is drawn first and the picture replaces it, rather than an empty
 * circle waiting on a request that may fail — and if the picture does fail,
 * the letter is already there and nothing flickers. */
/* The board's own voice, in either language.
 *
 * A post from the house is not from a person, so it has no photograph and no
 * page to open, and a letter in a circle makes it look like one more student.
 * Matched on the name in both halves of the pair rather than on one string,
 * because the same account posts as The Tutor and as 导师 depending on who is
 * reading. */
const HOUSE = new Set(
  // board.name as well, so notices posted under the app's own name before
  // there was a Professor keep their mark.
  [...(STRINGS["house.name"] || []), ...(STRINGS["board.name"] || [])]
    .map((x) => String(x).toLowerCase()));
const isHouse = (handle) => HOUSE.has(String(handle || "").toLowerCase());

function face(p) {
  /* The mark, for the board's own posts. The same image the masthead uses,
     with the same character behind it when it will not load. */
  if (isHouse(p.handle)) {
    const av = el("div", "av house");
    const img = Object.assign(document.createElement("img"),
      { src: "/favicon.png", alt: "", width: 192, height: 192 });
    img.addEventListener("error", () => { img.remove(); av.textContent = "\u7559"; });
    av.append(img);
    return av;
  }
  // A link where there is somebody to open, a plain circle where there is not.
  // The name beside it has always been a link and this was not, which is the
  // wrong way round: the face is the bigger target and the one people press.
  const av = p.handle
    ? Object.assign(document.createElement("a"), {
        className: "av",
        href: "/p/" + encodeURIComponent(p.handle.toLowerCase()),
        textContent: initial(p.handle),
      })
    : el("div", "av", initial(p.handle));
  if (p.handle) av.setAttribute("aria-label", p.handle);
  if (!p.face) return av;
  const img = Object.assign(document.createElement("img"),
    { src: "/api/public-media?id=" + encodeURIComponent(p.face), alt: "", loading: "lazy" });
  img.addEventListener("load", () => { av.textContent = ""; av.append(img); });
  return av;
}

function card(p) {
  const row = el("article", "post" + (p.looking ? " isjoin" : ""));
  row.append(face(p));

  const body = el("div", "body");

  /* The room, in the language being read. An old topic prints the word it was
     actually filed under — see roomLabel — so nothing posted before the rooms
     existed suddenly claims to be something it is not. */
  if (p.topic) {
    const eb = el("div", "eyebrow");
    const dot = el("i");
    dot.style.background = topicColour(p.topic);
    eb.append(dot, el("span", null, roomLabel(p.topic)));
    body.append(eb);
  }

  const line = el("div", "line");
  /* The house posts under its own name, in the language being read, and it is
     not a link: there is no page behind it and a link to a 404 is worse than
     plain text. Everybody else's name links to them. */
  if (isHouse(p.handle)) {
    line.append(el("b", null, T("house.name")), el("i", "tag", T("house.tag")));
  } else if (p.handle) {
    const a = document.createElement("a");
    a.href = "/p/" + encodeURIComponent(p.handle.toLowerCase());
    a.textContent = p.handle;
    a.style.textDecoration = "inherit";
    const b = el("b");
    b.append(a);
    line.append(b);
  } else {
    line.append(el("b", null, T("board.someone")));
  }
  const t = el("time", null, when(p.at));
  if (p.at) t.dateTime = p.at;
  line.append(t);
  body.append(line);

  if (p.photo) {
    const img = Object.assign(document.createElement("img"),
      { className: "pic", src: "/api/public-media?id=" + encodeURIComponent(p.photo),
        alt: "", loading: "lazy" });
    img.addEventListener("error", () => img.remove());
    /* A result card is a picture of a thing you can do, so the picture opens
       the thing. Wrapped rather than made a link itself, because an <img>
       inside an <a> is the only shape that keeps the rounded corner and the
       tap target the same size as the picture. */
    if (p.go) {
      const to = document.createElement("a");
      to.href = p.go;
      to.className = "picgo";
      to.append(img);
      body.append(to);
    } else {
      body.append(img);
    }
  }
  /* Somebody putting a page up.
   *
   * The sentence is written here rather than stored, so it is in whichever
   * language this is being read in — the post carries the facts and nothing
   * else. Their own words, where they wrote any, stay their own and appear
   * below in the ordinary way.
   *
   * `looking` is the field's old name, from when this announced somebody
   * joining the study-buddy list. That list came out for V1; the flag now
   * means "show me in Browse", and the sentence says that instead. */
  if (p.looking) {
    const j = el("div", "joined");
    const say = el("div", "say");
    say.append(el("b", null, p.handle || T("board.someone")),
      document.createTextNode(" " + T("bud.joined")));
    j.append(say);
    if (p.campus) j.append(el("div", "where", p.campus));
    // The link into the study-buddy list came out with the list itself: this
    // person is on the deck at the top of this same page.
    body.append(j);
  }

  /* A LONG POST OPENS AS ITS FIRST LINE.
   *
   * Anything written as more than one paragraph shows the first and folds the
   * rest — so a notice with a heading on it reads as a heading, and a wall of
   * text does not stand between somebody and the next post.
   *
   * Both languages fold together and both first lines stay up. Folding the
   * Chinese away with the body would leave a Chinese reader looking at an
   * English line and a Show more, which is the one arrangement worse than the
   * wall. The point of a board for people who cannot read the signs is that
   * the answer can be held up to the person behind the counter.
   */
  // Tolerant of CRLF as well as LF: text stored before the server started
     // normalising it still has the old kind in it.
  const split = (t) => {
    const m = /\r?\n\r?\n/.exec(String(t || ""));
    return m ? [t.slice(0, m.index), t.slice(m.index + m[0].length)]
             : [String(t || ""), ""];
  };
  const [head, tail] = split(p.note);
  const [zhHead, zhTail] = split(p.zh);

  if (head) body.append(el("p", "words", head));
  if (zhHead) body.append(el("p", "zh", zhHead));

  if (tail || zhTail) {
    const rest = el("div", "rest");
    rest.hidden = true;
    if (tail) rest.append(el("p", "words", tail));
    if (zhTail) rest.append(el("p", "zh", zhTail));
    const more = el("button", "more", T("act.more"));
    more.type = "button";
    more.setAttribute("aria-expanded", "false");
    more.addEventListener("click", () => {
      rest.hidden = !rest.hidden;
      more.textContent = T(rest.hidden ? "act.more" : "act.less");
      more.setAttribute("aria-expanded", String(!rest.hidden));
    });
    body.append(more, rest);
  }
  if (p.py) body.append(el("p", "py", p.py));

  /* And the same invitation in words, under the words — for a post whose
     picture did not load or was never made, and because a button placed above
     the sentence that explains it asks before it has said why. */
  if (p.go) {
    const go = document.createElement("a");
    go.className = "takeit";
    go.href = p.go;
    go.textContent = T("share.takeIt");
    body.append(go);
  }

  // ---- the actions --------------------------------------------------------
  const acts = el("div", "acts");
  const thread = el("div", "thread");
  thread.hidden = true;

  const act = (name, label, iconOnly) => {
    const b = el("button");
    b.type = "button";
    b.append(icon(name));
    if (iconOnly) { b.setAttribute("aria-label", label); b.title = label; }
    else b.append(el("span", null, label));
    acts.append(b);
    return b;
  };
  // Only the label of a button that has one. Icon-only buttons say it in the
  // aria-label, where a screen reader and a long-press both find it.
  const relabel = (b, words) => {
    if (b.lastChild && b.lastChild.nodeName === "SPAN") b.lastChild.textContent = words;
    else { b.setAttribute("aria-label", words); b.title = words; }
  };

  const nrep = (p.replies || []).length;
  const reply = act("reply", !nrep ? T("act.reply")
    : nrep === 1 ? T("act.reply1") : T("act.replies", { n: nrep }));
  reply.addEventListener("click", () => { thread.hidden = !thread.hidden; });

  const like = act("like", T("act.like"));
  if (p.likes) like.append(el("span", "n", String(p.likes)));
  if (liked.has(p.id)) like.classList.add("liked");
  like.addEventListener("click", async () => {
    // One per browser. Not a rule anybody could enforce — it is a courtesy to
    // the reader, so tapping twice does not read as two people.
    if (liked.has(p.id)) return;
    liked.add(p.id);
    try { localStorage.setItem("board:liked", JSON.stringify([...liked])); } catch { /* fine */ }
    like.classList.add("liked");
    await send({ like: p.id }, null);
  });

  // Only on your own. There are no accounts here, so the server decides this
  // from the browser's hash and sends back nothing but whether it is yours.
  if (p.mine) {
    const rm = act("remove", T("act.remove"));
    rm.addEventListener("click", async () => {
      if (!confirm(T("act.confirmRemove"))) return;
      rm.disabled = true;
      try {
        const r = await fetch("/api/post?id=" + encodeURIComponent(p.id), {
          method: "DELETE",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ device }),
        });
        if (!r.ok) throw new Error();
        await load();
      } catch { rm.disabled = false; relabel(rm, T("act.failed")); }
    });
  }

  if (!p.mine) {
    const rep = act("flag", T(reported.has(p.id) ? "act.reported" : "act.report"));
    rep.disabled = reported.has(p.id);
    rep.addEventListener("click", () => openReport(p));
  }

  let transPanel = null;
  if (translateOn) {
    const tr = act("globe", T("tr.thisPost"), true);
    const shown = el("div", "tpost");
    shown.hidden = true;
    tr.addEventListener("click", async () => {
      if (!shown.hidden) {
        shown.hidden = true; tr.removeAttribute("aria-pressed");
        relabel(tr, T("tr.thisPost")); return;
      }
      const source = [p.note, p.zh].filter(Boolean).join("\n");
      if (!source) return;
      relabel(tr, T("tr.working"));
      const out = await askTranslate(source);
      if (!out.error) tr.setAttribute("aria-pressed", "true");
      relabel(tr, out.error ? T("tr.thisPost") : T("tr.hide"));
      fill(shown);
      shown.hidden = false;
      shown.append(el("p", null, out.error || out.text));
      if (out.pinyin) shown.append(el("p", "py", out.pinyin));
      if (out.note) shown.append(el("p", "note", out.note));
    });
    // Held here and appended after the action row below, not into it: .acts is
    // a flex row, and a panel among the buttons wraps them.
    transPanel = shown;
  }

  const share = act("share", T("act.share"), true);
  share.addEventListener("click", async () => {
    // The board, not the root: the root is the landing page, and somebody sent
    // this link because of the post, not because of the explanation.
    const url = location.origin + "/feed#" + p.id;
    const say = (words, hold) => {
      relabel(share, words);
      setTimeout(() => relabel(share, T("act.share")), hold || 2200);
    };
    // Inside WeChat there is no share sheet a page may open. The buttons in the
    // ⋯ menu are the only way, and pretending otherwise gives somebody a button
    // that does nothing. So: put the link on the clipboard, and say where the
    // real control is. Sending the page itself needs an Official Account and
    // the JS-SDK; until there is one, this is the honest version.
    if (IN_WECHAT) {
      say(T(copyText(url) ? "act.wxCopied" : "act.wxUseMenu"), 3600);
      return;
    }
    try {
      if (navigator.share) {
        await navigator.share({ title: T("site.title"), text: (p.note || "").slice(0, 120), url });
        return;
      }
    } catch (e) { /* dismissed: not a failure, say nothing */ return; }
    say(T(copyText(url) ? "act.copied" : "act.copyFail"));
  });

  body.append(acts);
  if (transPanel) body.append(transPanel);

  // ---- the thread, folded until asked for ---------------------------------
  for (const r of (p.replies || [])) {
    const rep = el("div", "rep");
    const rl = el("div", "line");
    rl.append(el("b", null, r.handle || T("board.someone")));
    const rt = el("time", null, when(r.at));
    if (r.at) rt.dateTime = r.at;
    rl.append(rt);
    rep.append(rl);
    if (r.note) rep.append(el("p", null, r.note));
    thread.append(rep);
  }
  const rbox = el("div", "rbox");
  const rin = Object.assign(document.createElement("input"),
    { placeholder: T("act.answer"), maxLength: 2000 });
  const rgo = el("button", null, T("act.send"));
  rgo.type = "button";
  rgo.addEventListener("click", async () => {
    const words = rin.value.trim();
    if (!words) return;
    let who = "";
    try { who = localStorage.getItem("board:who") || ""; } catch { /* fine */ }
    if (!who) { who = (prompt(T("act.answerAs")) || "").trim(); }
    if (!who) return;
    try { localStorage.setItem("board:who", who); } catch { /* fine */ }
    rgo.disabled = true; rgo.textContent = T("act.sending");
    const d = await send({ note: words, re: p.id, handle: who }, null);
    rgo.disabled = false; rgo.textContent = T("act.send");
    if (!d) { rgo.textContent = T("act.again"); return; }
    rin.value = "";

    /* A reply that went up goes up HERE, not just on the server.
     *
     * The board is drawn from a fetch, and nothing re-fetched it after a
     * reply — so somebody wrote one, was told "Up.", and watched the thread
     * not contain it. Which reads as a reply that failed, and gets typed
     * again. The scroll position is put back because redrawing the feed
     * otherwise throws somebody to the top of it mid-conversation. */
    if (d.state === "published") {
      const y = window.scrollY;
      await load();
      window.scrollTo(0, y);
      return;
    }
    // Held, and saying so. A reply that waits and does not say it is waiting
    // reads the same way.
    const said = el("p", "py", T("act.replyHeld"));
    rbox.after(said);
    setTimeout(() => said.remove(), 6000);
  });
  rbox.append(rin, rgo);
  thread.append(rbox);
  body.append(thread);

  row.append(body);
  return row;
}

/** One way in for everything anybody posts — a note, a reply, a like.
 *
 *  A rejected fetch says only "Load failed" on Safari, which is true and
 *  useless: it does not say whether the body was too big, the connection went,
 *  or the server never answered. The size goes in the message, because on a
 *  mobile connection that is nearly always the answer — and one retry, because
 *  the other nearly-always answer is a blip on a link to Tokyo. */
/* TURNED AWAY AT THE WRITE.
 *
 * In "post" mode anybody can read and a code is needed to put something up, so
 * the first a person hears of the door is when they press Post. A refusal that
 * printed "403" at them would be the app knowing exactly what is wrong and
 * saying none of it — so the server answers with a word and a place, and this
 * takes them there.
 */
function toDoorIf(d, status) {
  if (status !== 403 || !d || d.error !== "invite") return false;
  location.href = (d.where || "/enter") + "?back=" + encodeURIComponent(location.pathname);
  return true;
}

async function send(body, btn) {
  const payload = JSON.stringify({ ...body, device });
  const mb = (payload.length / 1024 / 1024).toFixed(2);

  const once = async () => {
    const r = await fetch("/api/post", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: payload,
    });
    const d = await r.json().catch(() => ({}));
    if (toDoorIf(d, r.status)) return d;
    if (!r.ok) throw new Error((d.error || "it did not go") + " (" + r.status + ")");
    return d;
  };

  try {
    let d;
    try {
      d = await once();
    } catch (first) {
      // Only a network failure is worth trying twice. A 4xx will say the same
      // thing again and the wait is spent for nothing.
      if (!/load failed|network|fetch/i.test(String(first && first.message))) throw first;
      d = await once();
    }
    if (body.like) await load();
    return d;
  } catch (e) {
    if (btn) say((e && e.message || "?") + " · " + mb + " MB", true);
    return null;
  }
}

function say(msg, bad) {
  const s = $("said");
  s.hidden = !msg;
  s.textContent = msg || "";
  s.classList.toggle("bad", Boolean(bad));
}

// ---- reporting -------------------------------------------------------------

/* The reasons offered, and why these five.
 *
 * A free text box alone gets "this is bad" and nothing actionable. A list alone
 * cannot describe what somebody actually saw. Both, with the list first,
 * because the list is what makes a report legible in three seconds at the top
 * of a queue — and the four categories below are the ones that would actually
 * get a post taken down here. "I disagree with this" is not one of them, on
 * purpose. */
const REASON_KEYS = ["rep.r1", "rep.r2", "rep.r3", "rep.r4", "rep.r5"];
let reporting = null, reason = "";

function openReport(p) {
  reporting = p; reason = "";
  $("reporttitle").textContent = p.handle ? T("rep.title", { who: p.handle }) : T("rep.titleAnon");
  // The same omission as the compose sheet: these were static English in the
  // markup, so a Chinese reader got a Chinese page with an English report box.
  $("reporthint").textContent = T("rep.hint");
  $("why").placeholder = T("rep.more");
  $("blockpre").textContent = T("rep.alsoBlock");
  $("blockpost").textContent = T("rep.alsoBlock2");
  $("reportshut").textContent = T("post.cancel");
  $("reportgo").textContent = T("rep.go");
  $("blockwho").textContent = p.handle || T("board.someone");
  $("alsoblock").checked = false;
  $("why").value = "";
  $("reportsaid").hidden = true;

  const box = $("reasons"); fill(box);
  for (const key of REASON_KEYS) {
    const r = T(key);
    const b = el("button", null, r);
    b.type = "button";
    b.setAttribute("aria-pressed", "false");
    b.addEventListener("click", () => {
      reason = reason === r ? "" : r;
      for (const other of box.children) {
        other.setAttribute("aria-pressed", String(other.textContent === reason));
      }
    });

}
$("reportshut").addEventListener("click", () => { $("reportsheet").hidden = true; });
$("reportsheet").addEventListener("click", (e) => {

});

$("reportform").addEventListener("submit", async (e) => {
  e.preventDefault();
  const said = $("reportsaid");
  const why = [reason, $("why").value.trim()].filter(Boolean).join(" — ");
  if (!why) {
    said.hidden = false; said.classList.add("bad");
    said.textContent = T("rep.needReason");
    return;
  }
  const p = reporting;
  // Blocking is this browser's own business and needs no server, so it happens
  // whether or not the report goes through.
  if ($("alsoblock").checked && p.handle) { blocked.add(p.handle.toLowerCase()); saveBlocked(); }

  try {
    const r = await fetch("/api/report", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ id: p.id, why, device }),
    });
    if (!r.ok) throw new Error();
    reported.add(p.id);
    try { localStorage.setItem("board:reported", JSON.stringify([...reported])); } catch { /* fine */ }
  } catch (err) {
    said.hidden = false; said.classList.add("bad");
    said.textContent = T("rep.failed");
    // Not sending is not a reason to keep showing it to the person who
    // objected, so it goes from their copy regardless.
    reported.add(p.id);
    await load();
    return;
  }
  said.hidden = false; said.classList.remove("bad");
  said.textContent = T("rep.sent");
  await load();
  setTimeout(() => { $("reportsheet").hidden = true; }, 1800);
});

// ---- putting something up --------------------------------------------------
function openSheet(open) {

/* THE ＋ OPENS THE INVITE. It opened the post composer, and posts go to

   control in the masthead wrote to a screen nobody could reach. Posting is
   not gone: /feed still works and showView still names it. It is simply not
   what the corner of an invite-only board should be for. */
/** The invite sheet, from wherever it was asked for. */
function openInvite() {
  // Drawn before it is shown: a member may not have had a code when the page
  // loaded, and this is the one screen where a stale code is worse than none.
  loadMyInvite();

/* THE ＋ IS A MENU, which is what a plus in that corner is everywhere else.
   One press, three things you can start: write to somebody, bring somebody in,
   put somebody up. The exception is a member for whom only one of them is
   available — then the menu would be a list of one, so the ＋ just does it. */
function plusItems() {
  const out = [];
  // Writing is always offered: /notes says plainly who you can write to, and
  // says what to do about it when the answer is nobody.
  out.push(["plusnotes", "plus.write", null]);
  // Two different acts with the same verb, and the difference is the whole
  // point: one is a member you matched with, the other is a stranger you know.
  /* IT OPENS MESSAGES, not a sheet on this page. Writing to somebody who is
     not here is writing the first message of a conversation, so it happens on
     the screen conversations happen on — see drawWriteNew in notes.html. The
     sheet that used to be here was four steps: a name, a line, "make the
     note", and then a block of text with a Send button under it. */
  out.push(["pluswrite", "plus.reach", null]);
  out.push(["plusinv", "inv.sheetTitle", openInvite]);
  // Only for somebody who may speak for other people — /api/run/add refuses
  // anybody who is themselves somebody's client. paintRun sets this.
  if (CANRUN) out.push(["plusrun", "plus.run", null]);
  return out;
}

function drawPlus() {
  const items = plusItems();
  for (const id of ["plusnotes", "pluswrite", "plusinv", "plusrun"]) {
    const n = $(id);

    n.hidden = !row;
    if (row) n.querySelector("span").textContent = T(row[1]);

{

/* WeChat on iOS scrolls the page to bring an input above the keyboard and then
   does not scroll back when it closes, leaving the board sitting half off the
   top of the screen with nothing to grab. Every browser gets this reset; it is
   a no-op where the bug does not exist. */
document.addEventListener("focusout", (e) => {
  if (!e.target || !/^(INPUT|TEXTAREA)$/.test(e.target.tagName)) return;
  setTimeout(() => {
    window.scrollTo(0, Math.min(window.scrollY, document.body.scrollHeight));
    document.body.scrollTop = document.body.scrollTop;
  }, 120);
}, true);

$("pickpic").addEventListener("click", () => $("pic").click());
$("shotoff").addEventListener("click", () => { photo = null; $("shot").hidden = true; $("pic").value = ""; });
$("pic").addEventListener("change", async (e) => {
  const f = e.target.files && e.target.files[0];
  if (!f) return;
  if (f.size > 40 * 1024 * 1024) return say(T("post.tooBig"), true);
  // The same treatment a profile picture gets, and for the same three reasons
  // — a photo straight off a phone is megabytes, is HEIC on an iPhone, and
  // carries its rotation in metadata. This was fixed for profile photos and
  // left here, which is why a post with a picture on it failed with the
  // browser's own "Load failed" while one without went straight through.
  //
  // 1600 rather than 1000: a post's photograph is the content, and gets looked
  // at properly. A face is 5.8rem across.
  say(T("me.working"));
  let shot;
  try {
    shot = await shrink(f, 1600);
  } catch (err) {
    // Whatever went wrong, say what it was. A photo that silently does not
    // attach is indistinguishable from an app that is broken.
    return say(T("post.badPhoto") + " (" + (err && err.message || "?") + ")", true);
  }
  if (shot.error) return say(shot.error, true);
  photo = { data: shot.data, type: shot.type };
  $("shotimg").src = URL.createObjectURL(f);
  $("shot").hidden = false;
  say("");
});

$("ask").addEventListener("submit", async (e) => {
  e.preventDefault();
  const note = $("note").value.trim();
  const who = $("who").value.trim();
  if (!note && !photo) return say(T("post.needWords"), true);
  if (!who) return say(T("post.needName"), true);
  try { localStorage.setItem("board:who", who); } catch { /* fine */ }

  $("send").disabled = true;
  const d = await send({
    note, handle: who, topic: POSTROOM,
    photo: photo ? photo.data : "", photoType: photo ? photo.type : "",
  }, $("send"));
  $("send").disabled = false;
  if (!d) return;

  $("note").value = ""; POSTROOM = "";
  photo = null; $("shot").hidden = true; $("pic").value = "";
  await load();
  if (d.state === "published") { openSheet(false); return; }
  // Said plainly and left on screen, because the post will not be on the board
  // and somebody who is not told that assumes it failed and posts it again.
  say(T("post.held"));
});

/* THE CONTACT LINE IS BUILT ONCE, further down, by the fetch that also settles
 * whether translation is on. There were two of them — this one and that one,
 * each appending to the same span — so the footer read "Something wrong that a
 * report cannot cover? tom@… Something wrong that a report cannot cover?
 * tom@…". Once is a footnote; twice reads as the page having lost track of
 * itself. This one is gone; the other says the same thing and its answer also

/* ---- translate -------------------------------------------------------------
 *
 * Always in the same place, above the +. Reading help on a bilingual board is
 * not an occasional need somebody goes looking for in a menu — it is the thing
 * half the readers want on half the posts, so it gets a fixed position and
 * never moves.
 *
 * The button is absent, not broken, when the server has no key for it. */
let translateOn = false;

function tsay(box, out) {
  fill(box);
  box.hidden = false;
  box.append(el("p", "said", out.text));
  if (out.pinyin) box.append(el("p", "py", out.pinyin));
  if (out.note) {
    const n = el("p", "note");
    n.append(el("b", null, T("tr.note")), document.createTextNode(out.note));
    box.append(n);
  }
}

const TR_ERR = { "slow-down": "tr.slow", busy: "tr.busy", unconfigured: "tr.off" };

async function askTranslate(text) {
  const r = await fetch("/api/translate", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ text, lang: lang(), device }),
  });
  const d = await r.json().catch(() => ({}));
  if (!r.ok || d.error) return { error: T(TR_ERR[d.error] || "tr.failed") };
  return d;
}

function openTranslate(prefill) {

}
$("tfab").addEventListener("click", () => openTranslate(""));
$("tshut").addEventListener("click", () => { $("tsheet").hidden = true; });

$("tform").addEventListener("submit", async (e) => {
  e.preventDefault();
  const text = $("tin").value.trim();
  const box = $("tout");
  if (!text) { fill(box); box.hidden = false; box.append(el("p", "said", T("tr.empty"))); return; }
  $("tgo").disabled = true; $("tgo").textContent = T("tr.working");
  const out = await askTranslate(text);
  $("tgo").disabled = false; $("tgo").textContent = T("tr.go");
  if (out.error) { fill(box); box.hidden = false; box.append(el("p", "said", out.error)); return; }
  tsay(box, out);
});

/* ---- the language switch ---------------------------------------------------
 *
 * A full repaint rather than walking the DOM swapping text: every string here
 * is already produced by a function, so re-running them is both simpler and
 * the only version that cannot go stale. The scroll position is kept, because
 * losing your place in a feed is what makes people not press it twice. */
function paintNav() {
  $("invite").textContent = T("site.invite");
  $("invite").hidden = Boolean(ME && ME.handle);
  $("navbrowselabel").textContent = T("nav.browse");
  $("navfeedlabel").textContent = T("nav.feed");
  $("navcardslabel").textContent = T("nav.cards");
  // Read aloud rather than drawn now the button lives in the corner — the
  // title carries it for a pointer, the span for a screen reader.
  $("navnewlabel").textContent = T("nav.new");
  $("feedpost").textContent = T("nav.new");
  // It opens the invite now, not the composer — see the handler.
  $("fab").setAttribute("aria-label", T("inv.sheetTitle"));
  $("fab").title = T("inv.sheetTitle");
  $("navnewlabel").textContent = T("inv.sheetTitle");
  $("navmelabel").textContent = T("nav.profile");
  // Profile goes to your own page once you have one, and before that it opens
  // the editor. There is nothing on this page to scroll to any more: this tab
  // and the Tutor's first offer are now the only two ways in, which is the
  // point of taking the block off the page.
  const me = $("navme");
  if (ME && ME.handle) {
    me.href = "/p/" + encodeURIComponent(ME.handle.toLowerCase());
    me.onclick = null;
  } else {
    me.href = "#";
    me.onclick = (e) => { e.preventDefault(); openMe(); };
