<title>A payment request</title>
<!-- WHAT THE PREVIEW CARD MAY SAY, WHICH IS ALMOST NOTHING.
     This link is pasted into a chat, and WeChat renders the card before
     anybody taps. Whatever is written here is read by every person in that
     chat, including the eleven who were not meant to see a fee. So: no names,
     no amounts, no deal title, and a description that does not even say which
     two people are dealing. The page behind it asks for a code; the card in
     front of it must not be a way round that. -->
<meta name="description" content="Somebody is asking you to pay for something.">
<meta property="og:type" content="website">
<meta property="og:title" content="交换 · The Exchange">
<meta property="og:description" content="Somebody has asked you to pay for something.">
<meta property="og:image" content="{{ORIGIN}}/share.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">

<style>
  :root{
    --paper:#EEF0F4; --raise:#F7F8FB; --ink:#151B28; --ink-2:#4E5968;
    --muted:#8A939F; --line:#E3E6EC; --hair:#EAECF1;
    --accent:#3F68D8; --accent-ink:#FFFFFF; --accent-soft:#E8ECF7;
    --t2:#2A9D63; --t5:#D4485C;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",
      "Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;
    --serif:Georgia,"Songti SC","Noto Serif CJK SC",'Times New Roman',serif;
    --shadow:0 2px 6px rgba(21,27,40,.07),0 10px 28px rgba(21,27,40,.09);
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --paper:#0B0E15; --raise:#141924; --ink:#E9EDF5; --ink-2:#A3B0C4;
      --muted:#6F7D92; --line:#232B39; --hair:#1E2531;
      --accent:#5C8DFF; --accent-ink:#0B0E15; --accent-soft:#18233D;
      --t2:#3FBE7D; --t5:#F06A7C;
      --shadow:0 2px 6px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.4);
    }
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--paper);color:var(--ink)}
  /* 16px and not 15. Everything about this page is read one-handed on a phone
     by somebody who did not choose to be here, and 16 is also the size below
     which iOS zooms the page when a field takes focus — which throws the
     layout sideways on the one screen that has a field. */
  body{font-family:var(--sans);font-size:16px;line-height:1.55;
    padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
  main{max-width:34rem;margin:0 auto;padding:1rem .75rem 2.5rem}
  /* Used by the gate and the four dead-link screens, which have no sheet to
     hang a strip on. The memo itself carries its brand inside the sheet. */
  .brand{display:flex;align-items:center;gap:.55rem;margin:0 0 1rem}
  .brand img{width:1.4rem;height:1.4rem}
  .brand span{font-size:.74rem;letter-spacing:.14em;text-transform:uppercase;
    color:var(--muted)}
  .brand .lang{margin-left:auto}
  /* ONE SHEET. Rules divide it, not gaps: three bordered cards with their own
     shadows were three boxes to cross for one piece of paper. */
  .sheet{background:var(--raise);border:1px solid var(--line);
    border-radius:1.1rem;box-shadow:var(--shadow);overflow:hidden}
  .strip{display:flex;align-items:center;gap:.5rem;padding:.7rem .95rem;
    border-bottom:1px solid var(--line)}
  .strip img{width:1.1rem;height:1.1rem;flex:0 0 auto}
  /* Dealio's mark, the size of the one it replaces in each row. */
  .brand .dot{width:.7rem;height:.7rem;border-radius:50%;background:#D9534F;flex:0 0 auto}
  .strip .dot{width:.55rem;height:.55rem;border-radius:50%;background:#D9534F;flex:0 0 auto}
  .sname{font-size:.68rem;letter-spacing:.16em;text-transform:uppercase;
    color:var(--muted)}
  .sstate{margin-left:auto;font-size:.68rem;letter-spacing:.12em;
    text-transform:uppercase;padding:.2rem .6rem;border-radius:99px;
    background:var(--line);color:var(--ink-2)}
  .sstate.on{background:rgba(42,157,99,.14);color:var(--t2)}
  .lang{border:1px solid var(--line);background:var(--paper);color:var(--ink-2);
    font:inherit;font-size:.78rem;padding:.2rem .6rem;border-radius:99px}
  .body{padding:1.05rem .95rem 1.15rem}
  h1{margin:0 0 .15rem;font-size:1.22rem;line-height:1.3}
  .who{margin:0;color:var(--muted);font-size:.9rem}
  .lab{margin:0 0 .45rem;font-size:.7rem;letter-spacing:.14em;
    text-transform:uppercase;color:var(--muted)}
  /* THE NUMBER, IN THE SERIF AND BIG. It is the one thing on this page
     somebody is deciding about. */
  .dueLab{margin:1rem 0 .05rem;font-size:.7rem;letter-spacing:.14em;
    text-transform:uppercase;color:var(--muted)}
  .dueRow{display:flex;align-items:baseline;gap:.55rem;flex-wrap:wrap;margin:0}
  .dueRow .n{font-family:var(--serif);font-size:2.7rem;font-weight:400;
    line-height:1.08;font-variant-numeric:tabular-nums}
  .dueRow .k{font-size:.88rem;color:var(--muted)}
  .dueWhen{margin:.15rem 0 0;font-size:.86rem;color:var(--muted)}
  .done{margin:1rem 0 0;font-size:1rem;color:var(--ink-2)}
  /* 3.25rem tall and the amount is written on it. A button that says only
     "Pay now" makes somebody look back up the page to check what they are
     about to send. */
  .go{margin:1.1rem 0 0;border:0;border-radius:99px;background:var(--accent);
    color:var(--accent-ink);font:inherit;font-size:.95rem;font-weight:600;
    letter-spacing:.06em;text-transform:uppercase;padding:.9rem 1.4rem;
    min-height:3.25rem;width:100%}
  /* A TABLE WITH RULES. The label column is a fixed 5.5rem rather than sized
     to the longest label: auto-sizing it to "If it is called off" left the
     values about 210px wide on a 390px phone and every sentence over six
     words broke across three lines. Fixed, the long labels wrap instead — a
     label is two words and can afford to — and the values get the room. */
  .terms{margin:0;border-top:1px solid var(--line)}
  .term{display:grid;grid-template-columns:5.5rem 1fr;gap:0 .9rem;
    padding:.62rem .95rem;border-top:1px solid var(--hair)}
  .term:first-child{border-top:0}
  .term dt{margin:0;font-size:.76rem;line-height:1.4;color:var(--muted)}
  .term dd{margin:0;font-size:.93rem;line-height:1.45;white-space:pre-wrap}
  .plan{padding:.9rem .95rem 1rem;border-top:1px solid var(--line)}
  .prow{display:grid;grid-template-columns:1fr auto;gap:.1rem .7rem;
    padding:.55rem 0;border-top:1px solid var(--hair)}
  .prow:first-of-type{border-top:0;padding-top:0}
  .pwhat{font-weight:600;font-size:.95rem}
  .pamt{font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
  .pwhen{color:var(--muted);font-size:.82rem}
  .pchip{justify-self:end;align-self:center;font-size:.68rem;letter-spacing:.1em;
    text-transform:uppercase;padding:.14rem .55rem;border-radius:99px;
    background:var(--line);color:var(--ink-2)}
  .pchip.on{background:rgba(42,157,99,.14);color:var(--t2)}
  .prow .go{grid-column:1/-1;margin:.55rem 0 .15rem}
  .sfoot{padding:.8rem .95rem 1rem;border-top:1px solid var(--line);
    text-align:center}
  .sfoot p{margin:0 0 .5rem;font-size:.78rem;line-height:1.45;color:var(--muted)}
  .clock{display:inline-block;padding:.28rem .7rem;border-radius:99px;
    background:var(--accent-soft);color:var(--accent);font-size:.75rem}
  .clock.soon{background:rgba(212,72,92,.12);color:var(--t5)}
  .foot{margin:1rem 0 0;font-size:.82rem;line-height:1.5;color:var(--muted)}
  /* A touch larger than the note above it and in the reading colour: this is
     an instruction somebody may need to act on, not fine print. */
  .askwx{margin:.55rem 0 0;font-size:.92rem;color:var(--ink-2)}

  /* THE CODE GATE. Big field, because it is typed from a chat message by
     somebody holding the phone in one hand. */
  .gate{text-align:center;padding:2rem 1.15rem}
  .gate h2{margin:0 0 .35rem;font-size:1.15rem}
  .gate p{margin:0 0 1.3rem;color:var(--ink-2);font-size:.92rem}
  .gate input{width:100%;max-width:13rem;margin:0 auto;display:block;
    font:inherit;font-size:1.5rem;letter-spacing:.25em;text-align:center;
    text-transform:uppercase;padding:.7rem .5rem;border-radius:.7rem;
    border:1px solid var(--line);background:var(--paper);color:var(--ink)}
  .gate input:focus-visible{outline:2px solid var(--accent);outline-offset:2px;
    border-color:var(--accent)}
  .gate .go{margin:1rem 0 0;width:100%;max-width:13rem}
  button:focus-visible,a:focus-visible{outline:2px solid var(--accent);
    outline-offset:2px}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;
    transition:none!important}}
  .bad{margin:.9rem 0 0;color:var(--t5);font-size:.88rem;min-height:1.2em}
  .none{text-align:center;padding:3rem 1.15rem;color:var(--ink-2)}
  .none b{display:block;color:var(--ink);font-size:1.1rem;margin:0 0 .4rem}
  /* The payment panel. Same shape as the room's, because it is the same
     thing: a full-height sheet with a way out at the top. */
  .pframe{position:fixed;inset:0;z-index:40;background:var(--paper);
    display:flex;flex-direction:column;
    padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
  .phead{display:flex;align-items:baseline;gap:.55rem;padding:.75rem .95rem;
    border-bottom:1px solid var(--line);flex:0 0 auto}
  .phead b{font-size:.95rem;font-weight:600}
  .phead .psub{font-size:.8rem;color:var(--muted)}
  .pback{margin-left:auto;flex:0 0 auto;border:1px solid var(--line);
    background:var(--raise);color:var(--ink-2);font:inherit;font-size:.85rem;
    padding:.4rem .85rem;border-radius:99px}
  .pslot{flex:1 1 auto;overflow:auto;padding:.7rem}
  .pscan{flex:0 0 auto;margin:0;padding:.55rem .95rem;
    border-top:1px solid var(--line);font-size:.8rem;line-height:1.5;
    color:var(--ink-2)}
  .pnote{flex:0 0 auto;margin:0;padding:.6rem .95rem;
    border-top:1px solid var(--line);font-size:.72rem;line-height:1.5;
    color:var(--muted)}
  /* THE CODE ITSELF. White ground and dark squares in both themes — a QR
     drawn in the page's colours is a QR that will not scan. Sized in rem and
     centred with an explicit width: a grid inside a flex column with only
     max-width collapses to a dot, which is exactly what it did. */
  /* The code block sits in the middle of the sheet, not at the top of a
     screen of nothing: it is the only thing on it. */
  .wallets{margin:.6rem 0 0;text-align:center;font-size:.8rem;color:var(--muted)}
  .pslot.code{display:flex;align-items:center;justify-content:center}
  .codebox{display:flex;flex-direction:column;align-items:center;text-align:center;gap:0}
  .codeWith{margin:0;font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;
    color:var(--muted)}
  .codeAmt{margin:.15rem 0 0;font-size:2rem;line-height:1.1;font-weight:600}
  .codeOrig{margin:.05rem 0 0;font-size:.82rem;color:var(--muted)}
  .codeTo{margin:.1rem 0 0;font-size:.9rem;color:var(--ink-2)}
  .codeDo{margin:.9rem 0 0;font-size:1rem;font-weight:600;color:var(--ink)}
  .codeElse{margin:.3rem 0 0;font-size:.82rem;color:var(--muted)}
  .qr{width:min(15rem,72vw);aspect-ratio:1;margin:1.4rem auto .6rem;
    background:#fff;padding:.5rem;border-radius:.5rem;display:grid;gap:0;
    /* The long-press menu is the whole point: nothing here may take the
       touch away from it. */
    -webkit-touch-callout:default;-webkit-user-select:auto;user-select:auto}
  img.qr{display:block;object-fit:contain}
  .qr i{background:#05070D}
  .qr i.o{background:transparent}
  .pwait{margin:2.5rem auto;max-width:22rem;text-align:center;font-size:.88rem;
    line-height:1.6;color:var(--ink-2)}
  .pwait b{display:block;color:var(--ink);font-size:1.02rem;margin:0 0 .35rem}
  .pwait button{display:block;margin:1rem auto 0}
  .pdemo{margin:1.2rem auto;max-width:22rem;padding:2.2rem 1.2rem;
    text-align:center;border:1px dashed var(--line);border-radius:1rem}
  .pdemo b{display:block;font-size:1.05rem;margin:0 0 .5rem}
  .pdemo span{display:block;font-size:.88rem;line-height:1.6;color:var(--ink-2)}
  .pdemo em{display:block;margin:.9rem 0 0;font-size:.78rem;font-style:normal;
    letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
  /* The method sheet. */
  .rsheet{position:fixed;inset:0;z-index:50;background:rgba(21,27,40,.45);
    display:flex;align-items:flex-end;justify-content:center}
  .rcard{width:100%;max-width:34rem;background:var(--raise);
    border-radius:1.1rem 1.1rem 0 0;padding:1.1rem 1.15rem
    calc(1.1rem + env(safe-area-inset-bottom,0));max-height:88vh;overflow:auto}
  .rtitle{margin:0 0 .9rem;font-size:1.05rem}
  .ways{display:grid;gap:.6rem;margin:0 0 .9rem}
  .way{text-align:left;border:1px solid var(--line);background:var(--paper);
    color:var(--ink);font:inherit;padding:.8rem .9rem;border-radius:.8rem}
  .way b{display:block;font-size:1rem;margin:0 0 .15rem}
  .way span{display:block;font-size:.85rem;color:var(--ink-2)}
  /* A REFUSED WAY HAS TO LOOK REFUSED. It used to change one grey sub-line
     to another grey sub-line of the same size in the same place, with the
     button still live and the untried one beside it looking perfectly well —
     so pressing PAY and getting a refusal was indistinguishable from
     pressing PAY and nothing happening. That is what was reported, and on a
     phone held by somebody who cannot read 0.85rem grey it is not a
     near miss. */
  .way.no{opacity:.55;border-style:dashed}
  .way.no span{color:var(--t5)}
  .waysbad{margin:0 0 .7rem;color:var(--t5);font-size:.9rem;font-weight:650}
  /* THE ASKER'S CODE. Sized to be read across a desk rather than to fit
     neatly — it is the one thing on that screen somebody is holding up. */
  .qrbox{margin:1.1rem 0 0;text-align:center}
  .qrbox img{width:min(14rem,62vw);height:auto;display:block;margin:0 auto;
    border-radius:.7rem;background:#fff;padding:.5rem}
  .qrbox b{display:block;margin:.7rem 0 .2rem;font-size:1rem}
  .qrbox span{display:block;font-size:.85rem;color:var(--t3,#6E7789)}
  .racts{display:grid;gap:.5rem;margin:.9rem 0 0}
  .racts button{border:1px solid var(--line);background:var(--paper);
    color:var(--ink-2);font:inherit;padding:.75rem 1rem;border-radius:99px}
</style></head>
<body>
<main id="root"></main>
<script type="module">
/* A PAYMENT REQUEST, OPENED BY WHOEVER HAS THE LINK
 * ===========================================================================
 *
 * "Two people are chatting, then someone sends them a request to pay."
 *
 * NO CODE, and that is a deliberate difference from the deal memo beside it.
 * The memo carries the full terms of a deal — what is covered, what happens
 * if it is called off — and a code beside the link is worth the friction. A
 * request carries a name, an amount and one line. There is less to protect,
 * and a code standing between a person and paying you costs money.
 *
 * NOTHING IS ASKED OF THE READER. No account, no app, no login, no card on
 * file. That is the whole reason this can live in somebody else's chat.
 *
 * BUILT TO LEAVE, like the page beside it: two fetches and a view that has
 * already been through an allowlist on the server. A standalone version keeps
 * this page and swaps the URLs.
 */
import { T, when, setLang, pickLang, langButton } from "/i18n.js";
import { mountCheckout } from "/pay.js";

/* THE SIGN, PUT BACK ON. The amount field takes bare digits since the
   currency picker landed — nobody hunts for ¥ on a phone keyboard — so the
   currency lives on the row instead and every screen that prints an amount
   has to use it. "Tom is asking for 1" is not an amount, it is a number, and
   this is the screen where getting that wrong costs the most.

   An amount that already carries a sign is left alone: everything made
   before the picker has one, and "¥¥1" is a worse bug than the one fixed. */
const CUR_SIGN = { cny: "\u00a5", usd: "$", aud: "A$", hkd: "HK$",
                   eur: "\u20ac", gbp: "\u00a3", jpy: "\u00a5" };
const shown = (q) => {
  const amount = String(q?.amount ?? "").trim();
  if (!amount) return "";
  if (/^[^0-9]/.test(amount)) return amount;
  /* THOUSANDS SEPARATORS BACK ON. "¥2400" is a number somebody has to count
     the digits of; "¥2,400" is a price. The field takes bare digits since
     the currency picker — a phone keyboard has no comma on the number pad —
     and whatever was typed went straight onto every screen.

     Only a run of digits and nothing else. Anything already carrying a comma
     or a decimal point is left exactly as it was: re-grouping somebody's
     "1.5" or "2,400" is how an amount quietly becomes a different amount. */
  const body = /^\d+$/.test(amount)
    ? amount.replace(/\B(?=(\d{3})+(?!\d))/g, ",")
    : amount;
  return (CUR_SIGN[q.cur] || "") + body;
};

const el = (tag, cls, text) => {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text != null) n.textContent = text;
  return n;
};
/* WHOSE PAGE THIS IS, WHICH IS NOT ALWAYS THE BOARD'S.
 *
 * One container serves thexchange.app and paydealio.com, and this page —
 * the one the payer actually opens — was signed THE EXCHANGE on both. A
 * stranger in WeChat, sent a link about money, met the name of a private
 * networking board they had never heard of at the top of the screen where
 * they decide whether this is a scam. The server knows the hostname and
 * substitutes it; see isDealioHost in server.js. */
const ON_DEALIO = "{{DEALIO}}" === "1";

/** A string in this product's words. The same helper the door has: a key
 *  with a ".dl" twin is said Dealio's way on Dealio's hostname, and one
 *  without is said the same on both. T returns the key itself when it does
 *  not know it, which is how a missing twin is found. */
function D(key, vars) {
  if (ON_DEALIO) {
    const k = key + ".dl";
    if (T(k) !== k) return T(k, vars);
  }
  return T(key, vars);
}

/** The mark and the name, in whichever product's clothes. Dealio's mark is a
 *  plain red dot — see pay.html — and the board's is the two rings. */
function brandInto(box, nameClass) {
  if (ON_DEALIO) {
    box.append(el("i", "dot"), el("span", nameClass, "Dealio"));
    return;
  }
  const mark = el("img");
  mark.src = "/mark.svg";
  mark.alt = "";
  box.append(mark, el("span", nameClass, T("memo.brand")));
}

const root = document.getElementById("root");
const ID = (location.pathname.match(/^\/pay\/([a-f0-9]{20})/) || [])[1] || "";

/* BACK FROM A PAYMENT — the same race as everywhere else. Stripe returns the
   payer here a second after they pay and the webhook has usually, but not
   always, landed first. Two quiet re-reads rather than a page that still says
   Pay under somebody who just did. */
const CAME_BACK = new URLSearchParams(location.search).get("paid") || "";
/* BACK FROM SAYING WHERE THE MONEY LANDS. ?landed=1 is on the address Stripe
   returns to and is not proof of anything — anybody can type it. It only
   prompts the question; the answer comes from Stripe. */
const CAME_LANDED = new URLSearchParams(location.search).get("landed") === "1";

let STATE = null;
let repaint = () => {};

function head() {
  const bar = el("div", "brand");
  brandInto(bar, null);
  const slot = el("span", "langslot");
  bar.append(slot);
  slot.replaceWith(langButton(() => repaint()));
  return bar;
}

function gone() {
  repaint = gone;
  root.textContent = "";
  root.append(head());
  const box = el("div", "none");
  box.append(el("b", null, T("rq.gone")));
  box.append(el("p", null, T("rq.goneWhy")));
  root.append(box);
}

function draw() {
  if (!STATE) return;
  repaint = draw;
  const q = STATE.request;
  root.textContent = "";

  const sheet = el("div", "sheet");
  const strip = el("div", "strip");
  brandInto(strip, "sname");
  /* THE CHIP IS READ FROM THIS SIDE OF THE LINK. "Waiting on them" is what
     the sender's list says and it is exactly wrong here, where the reader IS
     them. Same state, different sentence. */
  strip.append(el("span", "sstate" + (q.state === "paid" ? " on" : ""),
    T(q.state === "asking" ? "rq.needsYou"
      : "dl.st." + (["paid", "waiting"].includes(q.state) ? q.state : "due"))));
  const slot = el("span", "langslot");
  strip.append(slot);
  sheet.append(strip);

  const body = el("div", "body");
  /* WHO AND HOW MUCH, in that order, and nothing above them. Somebody opened
     this from a chat message and the only question they have is whether the
     name and the number are the ones they expect. */
  /* THEIR OWN NAME FIRST, when the asker typed one — the same thing the
     invite does, for the same reason. A payment link opened in WeChat is
     read in about three seconds and the question being answered is "was
     this meant for me". Only on a request coming in: on one going out the
     reader is being paid, and the line already names them as the sender. */
  /* ONE NAME, NOT THE SAME ONE TWICE. A request made to yourself — which is
     every test anybody runs — read "Tom — Tom is asking for". */
  const named = q.way !== "out" && q.to
    && q.to.trim().toLowerCase() !== String(q.from || "").trim().toLowerCase();
  body.append(el("p", "dueLab",
    named
      ? T("rq.askingYou", { you: q.to, who: q.from })
      : T(q.way === "out" ? "rq.sending" : "rq.asking", { who: q.from })));
  const line = el("div", "dueRow");
  line.append(el("span", "n", shown(q)));
  body.append(line);
  /* What it is for, and its number — the one a payer quotes back, and writes
     in their own books. See `no` in lib/request.js. */
  const whatNo = [q.what, q.no ? T("rq.no", { n: String(q.no).padStart(4, "0") }) : ""]
    .filter(Boolean).join(" \u00b7 ");
  if (whatNo) body.append(el("p", "dueWhen", whatNo));

  if (q.state === "paid") {
    body.append(el("p", "done", T("rq.done", { who: q.from })));
  } else if (q.way === "out" && !q.landed) {
    /* SENDING MONEY IS A PROMISE UNTIL THERE IS SOMEWHERE FOR IT TO LAND,
       because this board may never hold it in the meantime. So the reader is
       given the one thing that makes it real: a button that mints an account
       for them and hands them to Stripe, which takes the bank and the
       identity on its own pages.
       THEY NEVER BECOME A MEMBER. No password, no board, no profile — the
       only thing kept about them is Stripe's own id for that account. */
    body.append(el("p", "foot", D("rq.outWhy", { who: q.from })));
    const b = el("button", "go", T("rq.land", { amount: shown(q) }));
    b.type = "button";
    b.addEventListener("click", async () => {
      b.disabled = true;
      b.textContent = T("rq.landGoing");
      try {
        const r = await fetch("/api/request/" + ID + "/land", { method: "POST" });
        const j = await r.json().catch(() => null);
        if (r.ok && j?.url) { location.href = j.url; return; }
        /* A DEAD END IS NOT A RETRY. "That did not work — try again" on a
           button whose rails are off is an invitation to press it twice
           more, on a stranger's phone, about their own money. */
        if (j?.error === "connect" || j?.error === "off") {
          b.remove();
          body.append(el("p", "foot",
            T(j.error === "off" ? "dl.setUpOff" : "rq.outNo", { who: q.from })));
          return;
        }
        b.textContent = T("ask.failed");
      } catch { b.textContent = T("ask.failed"); }
      b.disabled = false;
    });
    body.append(b);
  } else if (!q.payeeReady) {
    body.append(el("p", "foot",
      T(STATE?.why === "cny" ? "rq.onlyYuan" : "rq.notReady", { who: q.from })));
  } else if (q.way === "out" && !STATE.yours) {
    /* SENDING, AND THE READER IS THE ONE BEING SENT TO.
       They said where the money should land, came back from Stripe onto this
       same address, and were handed a PAY button for the money they are
       owed. Nothing for them to do now but wait for it, and saying so is the
       whole of what this screen is for. */
    body.append(el("p", "foot", T("rq.landedWait", { who: q.from })));
  } else {
    const b = el("button", "go", T("memo.pay", { amount: shown(q) }));
    b.type = "button";
    b.addEventListener("click", () => payHow(q));
    body.append(b);
    /* THE WALLETS, NAMED BEFORE THE TAP. Somebody who has never heard of
       this page is deciding whether it can take the money they actually
       have, and the answer was two taps inside a sheet. Their own wallet's
       name under the button answers it in the glance they give this
       screen — and it is the one thing on it they already trust. */
    const names = { wechat: "pay.wechat", alipay: "pay.alipay", card: "pay.card" };
    const has = (Array.isArray(STATE?.ways) ? STATE.ways : []).filter((k) => names[k]);
    if (has.length) body.append(el("p", "wallets", has.map((k) => T(names[k])).join(" · ")));
  }
  /* THE CODE, FOR WHOEVER MADE THIS REQUEST.
     Not a payment code — it encodes this page's own address, so scanning it
     opens exactly what tapping the link opens. It is here because a link can
     only be pasted into a chat, and the asker is often sitting across a desk
     from the person who owes them.
     ONLY ON THEIR OWN REQUEST, AND ONLY WHILE IT IS UNPAID. The payer is
     already looking at this page and a code pointing at it would be furniture;
     a paid row has nothing left to scan for. */
  /* ONLY THE ASKER, AND ONLY ON THE HOST THAT KNOWS THEM.
     `yours` is hashDevice(x-board-device) === q.by, and board:device lives in
     localStorage, which is per origin — so this is true on thexchange.app,
     where the asker is signed in, and never on paydealio.com, where the link
     they send goes. That is correct rather than a bug, and it took a wrong
     fix to see why: ungating it puts a QR on a payment page, and a payer who
     sees a QR on a payment page scans it, because that is what the product
     has trained them to do. It would take them back to the page they are
     already on.
     So the asker reaches the code the way they reach everything else here —
     from the terminal. `make ask` prints its address. */
  if (STATE?.yours && q.state !== "paid") {
    const box = el("div", "qrbox");
    const img = el("img");
    img.src = "/pay/" + ID + ".png";
    img.alt = T("rq.showCode");
    img.loading = "lazy";
    box.append(img, el("b", null, T("rq.showCode")), el("span", null, T("rq.showCodeWhy")));
    body.append(box);
  }

  sheet.append(body);

  /* NOT "For", which is already the line under the amount. It was printed
     twice on one card, three inches apart.
     AND NOT "ASKED · NOW" EITHER. A table with one row in it, telling the
     payer a thing they watched happen — the message they are answering
     arrived in the chat they came from. When it is due is real and stays;
     when it was asked is furniture. */
  const rows = [["rq.when", q.when]].filter(([, v]) => v);
  if (rows.length) {
    const dl = el("dl", "terms");
    for (const [k, v] of rows) {
      const row = el("div", "term");
      row.append(el("dt", null, T(k)), el("dd", null, v));
      dl.append(row);
    }
    sheet.append(dl);
  }

  const foot = el("div", "sfoot");
  /* WHO THE MONEY GOES TO DEPENDS WHICH WAY IT IS GOING, and this said "the
     money goes straight to Claire" on a page telling somebody Claire wants
     to pay THEM. The sentence is about the person receiving it. */
  /* AND WHICH SIDE IS READING IT. "Straight to your account" is true of the
     receiver and false of the sender, who is looking at the same address —
     the same mistake one line up, one person further along. */
  foot.append(el("p", null,
    q.way === "out"
      ? (STATE.yours ? T("rq.straight", { who: q.to || T("dl.someone") })
                     : T("rq.straightOut"))
      : T("rq.straight", { who: q.from })));
  /* AND WHERE TO TAKE A DOUBT — see the note over rq.askThem. Only while
     there is still something to do: on a paid or withdrawn request there is
     no question left to ask, and a line telling somebody to go and ask one
     is noise. MicroMessenger in the agent string is WeChat's own browser. */
  if (q.state !== "paid" && !q.off) {
    const inWx = /MicroMessenger/i.test(navigator.userAgent || "");
    const them = q.way === "out"
      ? (STATE.yours ? (q.to || T("dl.someone")) : q.from)
      : q.from;
    foot.append(el("p", "askwx", T(inWx ? "rq.askBack" : "rq.askThem", { who: them })));
  }
  sheet.append(foot);

  root.append(sheet);
  slot.replaceWith(langButton(() => repaint()));
}

function payHow(q) {
  const back = el("div", "rsheet");
  const card = el("div", "rcard");
  card.append(el("p", "lab", T("pay.how")));
  /* No line about the job, no separator hanging in front of the amount. */
  card.append(el("h3", "rtitle", q.what ? q.what + " · " + shown(q) : shown(q)));

  const ways = el("div", "ways");
  const way = (key, name, why) => {
    const b = el("button", "way");
    b.type = "button";
    b.append(el("b", null, name), el("span", null, why));
    b.addEventListener("click", async () => {
      b.disabled = true;
      let why = "";
      try {
        const r = await fetch("/api/request/" + ID + "/pay", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ method: key }),
        });
        const j = await r.json().catch(() => null);
        /* A CODE, WHICH IS THE WHOLE PRODUCT ON THE PAYER'S SIDE. No frame
           to mount, nothing to load from anybody else, and no card. */
        if (r.ok && j?.qr) {
          back.remove();
          payFrame({ q, how: key, qr: j.qr, amount: j.amount, orig: j.orig });
          return;
        }
        if (r.ok && j?.secret && j?.pk) { back.remove(); payFrame({ secret: j.secret, pk: j.pk, q, how: key }); return; }
        if (r.ok && j?.demo) { back.remove(); payFrame({ q, how: key, demo: true }); return; }
        why = j?.error || "";
      } catch { /* below */ }
      /* NOT RE-ENABLED FOR A REFUSAL THAT WILL NOT CHANGE. Pressing WeChat
         again gets the same 502 from the same dead provider; leaving it live
         invites exactly that. A network blip is the one case worth another
         go, and it is the only one that re-enables. */
      const settled = ["qr", "currency", "already", "payee", "notready"].includes(why);
      b.disabled = settled;
      b.classList.toggle("no", settled);
      /* Each refusal says which. "That did not open" for all three methods,
         on a page showing a perfectly good amount, tells nobody anything. */
      b.querySelector("span").textContent = T(
        why === "currency" ? "rq.noCur"
        : why === "already" ? "rq.alreadyPaid"
        : why === "payee" ? "rq.noPayee"
        /* Stripe refused the destination because its transfers capability is
           not active yet. Nothing the payer can do, and the old text asked
           them to try again — twice more, on the other two buttons. */
        /* The wallet said no to this payment. Not the page failing to
           open, which is what it used to say — and which sent people to
           press the other buttons to find out. */
        : why === "qr" ? T("rq.wayNo", { way: name })
        : why === "notready" ? "rq.halfSet" : "memo.payFailed");
      /* WHEN THE LAST ONE GOES. Told once, at the top, rather than left for
         the payer to discover by pressing every button — and it names the
         asker, who is the only person who can fix it. */
      if (settled && ![...ways.querySelectorAll(".way")].some((w) => !w.disabled)) {
        if (!ways.previousElementSibling?.classList?.contains("waysbad")) {
          ways.before(el("p", "waysbad", T("rq.noneWork", { who: q.from })));
        }
      }
    });
    ways.append(b);
  };
  /* THE WAYS THE SERVER SAYS IT CAN TAKE, in the order they are used here.
     A board with the codes and no card rails draws two buttons, not three
     with a dead one on the end. The default is all three, which is what
     every board that has ever run this page had. */
  const ways_ = Array.isArray(STATE?.ways) && STATE.ways.length
    ? STATE.ways : ["wechat", "alipay", "card"];
  const names = {
    wechat: ["pay.wechat", "pay.wechatWhy"],
    alipay: ["pay.alipay", "pay.alipayWhy"],
    card: ["pay.card", "pay.cardWhy"],
  };
  for (const k of ways_) if (names[k]) way(k, T(names[k][0]), T(names[k][1]));
  card.append(ways);
  card.append(el("p", "foot", D("pay.howNote", { who: q.from })));

  const acts = el("div", "racts");
  const no = el("button", "", T("pay.cancel"));
  no.type = "button";
  no.addEventListener("click", () => back.remove());
  acts.append(no);
  card.append(acts);
  back.append(card);
  back.addEventListener("click", (e) => { if (e.target === back) back.remove(); });
  document.body.append(back);
}

/* THE CODE, DRAWN. White with dark squares whatever the page is doing —
   a themed QR is a QR that does not scan. Nothing is fetched to draw it: the
   server sends the modules as rows of ones and zeros. */
function qrGrid({ size, bits, png }) {
  /* AN IMAGE, BECAUSE A FINGER CAN DO SOMETHING WITH AN IMAGE.
   *
   * This drew the code as a grid of divs and it looked perfect — and WeChat
   * offered nothing at all when you held a finger on it, because 识别图中二维码
   * reads a QR out of an <img>, not out of a page. The way it was found is
   * the way a real payer would have found it: screenshot the screen, open
   * the picture in a chat, long-press that. Three steps nobody will take.
   *
   * The drawn grid stays as the fallback for a server that sent no picture,
   * and it is what the walkthrough and the deck use, where nothing is ever
   * actually scanned. */
  if (png) {
    const i = el("img", "qr");
    i.src = png;
    i.alt = "";
    i.decoding = "async";
    return i;
  }
  const g = el("div", "qr");
  g.setAttribute("aria-hidden", "true");
  g.style.gridTemplate = `repeat(${size},1fr)/repeat(${size},1fr)`;
  for (const row of bits) for (const c of row) g.append(el("i", c === "1" ? "" : "o"));
  return g;
}

/* AND ASKING, WHILE IT IS UP.
 *
 * The payer leaves for their wallet and the money moves somewhere this page
 * cannot see. So it asks — every three seconds while the code is on the
 * screen, and never once it is not. Ten minutes is longer than the code
 * lasts; after that the page is stale and a reload is the honest answer. */
function watchPaid(frame) {
  let left = 200;
  const tick = async () => {
    if (!frame.isConnected || left-- <= 0) return;
    try {
      const r = await fetch("/api/request/" + ID + "/check", { cache: "no-store" });
      const j = await r.json().catch(() => null);
      if (j?.state === "paid") { frame.remove(); load(); return; }
    } catch { /* offline for a moment; ask again */ }
    setTimeout(tick, 3000);
  };
  setTimeout(tick, 3000);
}

async function payFrame({ secret, pk, q, how, demo, qr, amount, orig }) {
  const frame = el("div", "pframe");
  const bar = el("div", "phead");
  bar.append(el("b", null, q.what || q.from));
  bar.append(el("span", "psub", shown(q)));
  const back = el("button", "pback", T("pay.frameBack"));
  back.type = "button";
  bar.append(back);

  const slot = el("div", "pslot");
  const wait = el("p", "pwait", T("pay.frameWait"));
  slot.append(wait);
  /* The same line the room draws, for the same reason: on a phone whose
     handoff into the wallet does not fire, the payer is left holding a code
     on the screen they would otherwise scan it with. Long-pressing it is the
     answer and is an everyday gesture in both wallets — see the note over
     pay.scanSelf in i18n.js for why the line leads with that rather than
     with the screenshot it used to ask for. */
  const scan = (how === "wechat" || how === "alipay")
    ? el("p", "pscan", T("pay.scanSelf." + how)) : null;
  const note = el("p", "pnote", q.way === "out"
    ? (STATE.yours ? T("rq.straight", { who: q.to || T("dl.someone") })
                   : T("rq.straightOut"))
    : T("rq.straight", { who: q.from }));
  frame.append(bar, slot, ...(scan ? [scan] : []), note);
  document.body.append(frame);

  let mounted = null;
  back.addEventListener("click", () => {
    try { if (mounted) mounted.destroy(); } catch { /* already gone */ }
    frame.remove();
    load();
  });

  if (qr) {
    /* WHICH WALLET, HOW MUCH, THE CODE, WHAT TO DO — in that order, because
       that is the order the questions arrive in. It was a bare square with
       one sentence at the bottom of the screen, and "what is this" is not a
       question a payment page should leave anybody holding. */
    wait.remove();
    if (scan) scan.remove();
    /* The amount moves down beside the code, so it is not on the screen
       twice three inches apart. The bar keeps the line about the job and
       the way back. */
    bar.querySelector(".psub")?.remove();
    slot.classList.add("code");
    const box = el("div", "codebox");
    box.append(el("p", "codeWith", T("pay." + how)));
    /* YUAN, BECAUSE THAT IS WHAT SHE IS SENDING. The asker quotes in the
       only money he knows a price in and the payer pays in the only money
       she has; the number above the code is hers. His price goes under it,
       small, so the two can be checked against each other — and so nobody
       thinks they are being shown a different deal from the one on the
       page they arrived at. */
    box.append(el("p", "codeAmt", amount || shown(q)));
    if (orig) box.append(el("p", "codeOrig", orig));
    /* WHOSE MONEY THIS BECOMES, at the moment it leaves. The wallet's own
       sheet names a merchant account, not a person, so this is the last
       place anybody says it. */
    box.append(el("p", "codeTo", T("rq.toWho", { who: q.from })));
    box.append(qrGrid(qr));
    box.append(el("p", "codeDo", T("pay.scanDo")));
    box.append(el("p", "codeElse", T("pay.scanElse")));
    slot.append(box);
    watchPaid(frame);
    return;
  }
  if (demo) {
    wait.remove();
    const box = el("div", "pdemo");
    box.append(el("b", null, T("pay." + (how || "card"))));
    box.append(el("span", null, T("pay.demoHere")));
    box.append(el("em", null, T("pay.demoNot")));
    slot.append(box);
    return;
  }
  try {
    mounted = await mountCheckout(slot, { secret, pk });
    wait.remove();
  } catch {
    slot.textContent = "";
    const box = el("div", "pwait");
    box.append(el("b", null, T("pay.frameBlocked")));
    box.append(el("span", null, T("memo.blockedWhy", { who: q.from })));
    slot.append(box);
  }
}

async function load() {
  try {
    /* THE DEVICE GOES UP, so the server can say which side of this link is
       reading it. A browser that has never been here sends an empty header
       and is told it is not the sender, which is the right answer for
       everybody the link was actually sent to. */
    let device = "";
    try { device = localStorage.getItem("board:device") || ""; } catch { /* private window */ }
    const r = await fetch("/api/request/" + ID, {
      cache: "no-store", headers: { "x-board-device": device },
    });
    const j = await r.json().catch(() => null);
    if (r.ok && j?.ok) {
      STATE = j; draw();
      /* A CODE WAS PUT UP AND THE ROW IS STILL UNPAID. Somebody may have
         paid it on a phone that never came back here — the asker opening
         their own link is one of the two places that finds out. One call,
         and only when there is something to ask about. */
      const rq = j.request || {};
      if (rq.coded && rq.state === "due") {
        try {
          const c = await fetch("/api/request/" + ID + "/check", { cache: "no-store" });
          const cj = await c.json().catch(() => null);
          if (cj?.state === "paid") load();
        } catch { /* the page already drew what the server knew */ }
      }
      return;
    }
  } catch { /* below */ }
  gone();
}

/* Ask Stripe whether they finished, then draw. Onboarding is not one screen
   and somebody who abandoned it halfway comes back to this page with the
   same query string as somebody who finished. */
async function checkLanded() {
  try {
    const r = await fetch("/api/request/" + ID + "/landed", { method: "POST" });
    await r.json().catch(() => null);
  } catch { /* the page still draws from whatever the server knows */ }
}

setLang(pickLang());
if (!ID) gone();
else if (CAME_LANDED) checkLanded().then(load);
else {
  load().then(() => {
    if (CAME_BACK) { setTimeout(load, 2000); setTimeout(load, 6000); }
  });
}

/* Wiped once read, so a reload an hour later is not mistaken for a payment. */
try {
  const u = new URL(location.href);
  if (u.searchParams.has("paid") || u.searchParams.has("landed")) {
    u.searchParams.delete("paid");
    u.searchParams.delete("landed");
    history.replaceState(null, "", u.pathname + u.search + u.hash);
  }
} catch { /* an address bar that will not be rewritten is not worth failing on */ }
</script>
</body>
</html>
