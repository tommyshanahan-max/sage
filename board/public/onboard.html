<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- Empty on every deployment but the demo board, where it pins this
     browser to the one seeded identity. See BOARD_DEMO_DEVICE in server.js. -->
{{DEMO}}
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="/favicon.ico" sizes="any">
<meta name="theme-color" content="#EEF0F4">
<meta name="theme-color" content="#0B0E15" media="(prefers-color-scheme: dark)">
<title>Bring your people on</title>
<link rel="stylesheet" href="/site.css">

<!-- THE LAPTOP SCREEN.
     What an agent actually does is select everything and drag it in: two
     hundred files, IMG_4821.jpg and "headshot final FINAL.pdf" among them, in
     one heap. /run takes a tidy folder-per-person drop on a phone. This takes
     the heap, on a wide screen, and shows the sorting so it can be corrected.

     THE WHOLE ARGUMENT OF THIS PAGE IS THAT THE GROUPING IS VISIBLE. Working
     out whose CV a CV is fails silently and in the worst direction — a CV
     naming a director they worked with, filed under the director — and nobody
     catches that by reading a bio. It is safe here only because the screen
     says WHICH FILES went under WHICH NAME, and fixing it is one drag. A guess
     somebody checks is not the same object as a guess nobody sees.

     Nothing is written until the button at the bottom. The first request
     proposes and keeps nothing — no token, no temp directory, no half-made
     rows to sweep up if the laptop closes. The browser still holds the files. -->

<style>
  body{margin:0}
  .wrap{max-width:76rem;margin:0 auto;padding:0 1.4rem 6rem}
  .rotnav{display:flex;align-items:center;gap:.6rem;justify-content:space-between;padding:1rem 0}
  h1{font-family:var(--serif,Georgia,serif);font-weight:400;font-size:1.9rem;margin:.6rem 0 .3rem}
  .lede{color:var(--muted);margin:0 0 1.4rem;line-height:1.6;max-width:44rem;
    font-size:.95rem}

  /* ---- the two steps ------------------------------------------------------
     Numbered because they are an order, not a menu: your page exists first
     because theirs are built out of it. Step two greys out until step one has
     a name — the form saying what it needs, rather than a rule being read out.
  */
  .step{margin:0 0 1.6rem}
  .step.waiting{opacity:.4;pointer-events:none}
  .stepno{display:flex;align-items:center;gap:.7rem;margin:0 0 .8rem}
  .stepno span{display:grid;place-items:center;width:1.9rem;height:1.9rem;
    border-radius:50%;background:var(--accent);color:#fff;font-weight:700;
    font-size:1rem;font-variant-numeric:tabular-nums;flex:0 0 auto}
  .stepno b{font-family:var(--serif,Georgia,serif);font-weight:400;font-size:1.5rem}

  /* The avatar is the one control every app on earth opens with, and it is the
     same one the board itself uses on a profile — same circle, same plus in
     the corner — so this screen is recognised rather than learnt. */
  .you{display:flex;align-items:center;gap:1.1rem;flex-wrap:wrap}
  .avatar{position:relative;width:5.5rem;height:5.5rem;flex:0 0 auto;padding:0;
    border:0;background:none;cursor:pointer}
  .av-in{position:absolute;inset:0;border-radius:50%;overflow:hidden;
    background:var(--raise);border:1px dashed var(--line);display:grid;
    place-items:center;color:var(--muted);font-size:1.8rem;
    font-family:var(--serif,Georgia,serif)}
  .av-in img{width:100%;height:100%;object-fit:cover;display:block}
  .av-plus{position:absolute;right:0;bottom:0;width:1.8rem;height:1.8rem;
    border-radius:50%;background:var(--accent);color:#fff;display:grid;
    place-items:center;font-weight:700;border:2px solid var(--paper)}
  .yourow{flex:1;min-width:15rem}
  .yourow label{display:block;font-size:.9rem;color:var(--ink-2);margin:0 0 .5rem;
    line-height:1.55}
  .yourow .two{display:flex;gap:.6rem;flex-wrap:wrap}
  .yourow input{flex:1;min-width:11rem;padding:.65rem .8rem;font:inherit;
    border:1px solid var(--line);border-radius:.6rem;background:var(--raise);color:var(--ink)}
  /* ON A PHONE THE AVATAR GOES ON TOP, centred, the way it does in every app
     anybody has set a profile up in. Beside a four-line label it floats in the
     middle of a paragraph, attached to nothing. */
  /* ONE THUMB, HALF AN EYE.
     These people set this up on a phone, badly lit, mid-something-else. So on
     a phone the explanations go — they are true and nobody is reading them —
     and everything you press gets bigger than a thumb. What is left is a face,
     a name, and a button. */
  @media (max-width:640px){
    .step .note{display:none}
    .stepno b{font-size:1.7rem}
    .avatar{width:7rem;height:7rem}
    .av-plus{width:2.2rem;height:2.2rem;font-size:1.1rem}
    .yourow label{font-size:1rem}
    .yourow input{padding:.9rem 1rem;font-size:1.05rem}
    .go{padding:.95rem 1.5rem;font-size:1.05rem}
    .roles button{padding:.6rem 1.1rem;font-size:1rem}
    .field{padding:2.2rem 1rem}
    .you{flex-direction:column;align-items:stretch;gap:.9rem}
    .avatar{margin:0 auto}
    .yourow{min-width:0}
    .yourow .two{flex-direction:column}
    .onerow{align-items:flex-start}
    .onefields{flex-direction:column}
    .onefields input,.onefields button{width:100%}
    .yourow input,.yourow .go{width:100%}
  }
  .note{margin:.8rem 0 0;color:var(--muted);font-size:.92rem;line-height:1.55;max-width:38rem}
  .roles{display:flex;flex-wrap:wrap;gap:.4rem;margin:0 0 1rem;align-items:center}
  .roles b{font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;
    color:var(--muted);margin-right:.4rem;font-weight:600}
  .roles button{border:1px solid var(--line);background:var(--raise);color:var(--ink-2);
    border-radius:99px;padding:.35rem .85rem;font:inherit;font-size:.9rem;cursor:pointer}
  .roles button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);
    color:#fff;font-weight:600}

  /* The drop target is the page, not a box in it: somebody dragging two
     hundred files is not aiming. */
  /* The one-person block. Same shape as step 1's own row, deliberately: the
     agent has just filled that in for themselves, so the second thing they do
     looks like the first thing they did. */
  .one{margin:1.1rem 0 0}
  .onerow{display:flex;align-items:center;gap:1rem}
  .avatar.small{width:4.2rem;height:4.2rem}
  /* Wraps, and the input keeps a floor — "Their name" beside a button reading
     "Put them up" is two words of visible field on a phone, which is the shape
     that makes people think a form is broken. Same arrangement step 1 uses for
     its own name and button, because it is the same row asked twice. */
  .onefields{flex:1;min-width:0;display:flex;gap:.6rem;flex-wrap:wrap}
  .onefields input{flex:1;min-width:9rem;padding:.65rem .8rem;font:inherit;
    border:1px solid var(--line);border-radius:.6rem;background:var(--raise);color:var(--ink)}
  /* Each person as they land, so the board is visibly filling up rather than
     a counter going from 0 to 9 at the end. */
  .done{margin:1rem 0 0;display:flex;flex-direction:column;gap:.5rem}
  .done .row{display:flex;align-items:center;gap:.7rem;padding:.6rem .8rem;
    background:var(--raise);border:1px solid var(--line);border-radius:.9rem}
  .done .row img,.done .row span.no{width:2.1rem;height:2.1rem;flex:0 0 auto;
    border-radius:50%;object-fit:cover;background:var(--line);display:grid;
    place-items:center;font-size:.9rem;color:var(--muted)}
  .done .row b{font-weight:500}
  .done .row i{margin-left:auto;font-style:normal;font-size:.8rem;color:var(--muted)}
  /* The pile's way in: a line, not a field. */
  .asline{border:0;background:none;font:inherit;color:var(--muted);
    text-decoration:underline;text-underline-offset:.2em;cursor:pointer;padding:0}
  .field{border:2px dashed var(--line);border-radius:1.2rem;padding:3.4rem 1.5rem;
    text-align:center;background:var(--raise);transition:background .12s,border-color .12s}
  .field.over{border-color:var(--accent);background:var(--accent-soft)}
  /* ONCE THE PILE IS IN, THE TARGET GETS OUT OF THE WAY. A half-screen of
     empty dashed box above the thing somebody is actually reading is the
     upload form still asking for an upload that has happened. It stays a drop
     target — dropping a second folder on top is a normal thing to do. */
  .field.small{padding:.9rem 1.2rem;display:flex;align-items:center;gap:1rem;text-align:left}
  .field.small b{font-size:1rem;margin:0;flex:1}
  .field.small p{display:none}
  .field.small .drop-pic{display:none}
  /* The line-art rules lived in the block that held the two option cards, and
     went out with it — leaving an SVG with no fill rule, which is a solid
     black folder. Kept here now, beside the only drawing left. */
  .drop-pic{width:100%;max-width:6.5rem;height:auto;margin:0 auto 1rem;display:block}
  .drop-pic .ln{fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
  .drop-pic .ln.hot{stroke:var(--accent)}
  .drop-pic .ln.dim{stroke:var(--line)}
  .field.small .go{margin:0}
  .field b{display:block;font-family:var(--serif,Georgia,serif);font-weight:400;
    font-size:1.5rem;color:var(--ink);margin:0 0 .5rem}
  .field p{margin:.4rem auto 0;max-width:34rem;color:var(--muted);line-height:1.6}
  .field .go{margin-top:1.2rem}
  .go{border:0;border-radius:99px;background:var(--accent);color:#fff;
    padding:.75rem 1.5rem;font:inherit;font-size:1rem;font-weight:600;cursor:pointer}
  .go[disabled]{opacity:.45;cursor:default}
  .flat{background:none;border:1px solid var(--line);color:var(--ink-2)}

  .said{margin:1rem 0 0;padding:.8rem 1rem;border-radius:.7rem;background:var(--accent-soft);
    color:var(--ink-2);line-height:1.6}
  .said.bad{background:#FBEEE4;color:#8A3D14}
  @media (prefers-color-scheme:dark){.said.bad{background:#2A1A10;color:#E8905A}}

  /* ---- one card per person ---------------------------------------------- */
  .people{display:grid;gap:1rem;margin:1.4rem 0 0;
    grid-template-columns:repeat(auto-fill,minmax(20rem,1fr))}
  .who{border:1px solid var(--hair);border-radius:1rem;padding:1rem;background:var(--raise);
    display:flex;flex-direction:column;gap:.6rem}
  .who.over{border-color:var(--accent);background:var(--accent-soft)}
  .who.out{opacity:.4}
  .addwho{border-style:dashed;background:none;color:var(--accent);font:inherit;
    font-size:1rem;font-weight:600;cursor:pointer;align-items:center;justify-content:center;
    min-height:8rem}
  .whohead{display:flex;align-items:center;gap:.7rem}
  .face{width:3rem;height:3rem;border-radius:50%;flex:0 0 auto;display:grid;place-items:center;
    color:#fff;font-family:var(--serif,Georgia,serif);font-size:1.2rem;overflow:hidden;
    background:var(--line)}
  .face img{width:100%;height:100%;object-fit:cover}
  .who input,.who textarea{width:100%;padding:.5rem .7rem;font:inherit;border:1px solid var(--line);
    border-radius:.6rem;background:var(--paper);color:var(--ink)}
  .who input.name{font-size:1.05rem;font-weight:600;border-color:transparent;background:none;padding:.2rem 0}
  .who input.name:focus{border-color:var(--line);background:var(--paper);padding:.5rem .7rem}
  .who textarea{resize:vertical;line-height:1.55;font-size:.92rem}
  .who .two{display:flex;gap:.5rem}
  .who .two input{font-size:.88rem}
  .chips{display:flex;flex-wrap:wrap;gap:.35rem}
  .chip{font-size:.74rem;padding:.22rem .55rem;border-radius:99px;border:1px solid var(--hair);
    background:var(--paper);color:var(--ink-2);cursor:grab;white-space:nowrap}
  .chip.no{color:var(--muted);text-decoration:line-through}
  .chip.pic{border-color:var(--accent);color:var(--accent)}
  .whyrow{display:flex;align-items:center;justify-content:space-between;gap:.5rem;
    font-size:.74rem;color:var(--muted)}
  .whyrow button{border:0;background:none;color:var(--muted);font:inherit;font-size:.74rem;
    cursor:pointer;text-decoration:underline}
  .flag{font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;font-weight:600;
    padding:.16rem .45rem;border-radius:99px;background:#FBEEE4;color:#B4531F}
  @media (prefers-color-scheme:dark){.flag{background:#2A1A10;color:#E8905A}}

  .tray{margin:1.4rem 0 0;padding:.9rem 1rem;border:1px dashed var(--line);border-radius:.9rem;
    background:var(--raise)}
  .tray.over{border-color:var(--accent);background:var(--accent-soft)}
  .tray b{display:block;font-size:.78rem;letter-spacing:.1em;text-transform:uppercase;
    color:var(--muted);margin:0 0 .5rem}
  /* Opaque, and above everything. A translucent action bar drifting over the
     card somebody is reading is worse than one that takes up a line. */
  .bottom{position:sticky;bottom:0;z-index:5;margin:1.6rem 0 0;padding:1rem 0 1.2rem;
    background:var(--paper);border-top:1px solid var(--hair);
    display:flex;align-items:center;gap:1rem;flex-wrap:wrap}
  .bottom p{margin:0;color:var(--muted);font-size:.9rem}
</style>
</head>
<body>
<main class="wrap">
  <div class="rotnav">
    <a href="/run" class="back">&lsaquo; <span id="backlink"></span></a><span id="lang"></span>
  </div>
  <h1 id="head"></h1>
  <p class="lede" id="lede"></p>

  <!-- A SETUP FORM, NOT A FORK.
       This offered two numbered options and asked an agent to choose between
       them before doing anything, which is not how any app they have ever used
       begins. Every one of them does the same three things: a photograph, a
       name, and then the next thing. Choosing between abstractions is what you
       do once you understand a product, not on the screen where you meet it.

       So the two options became what they always were underneath — an order.
       You first, because their pages are built from yours: the sentence, the
       city, and the line that says who represents them. Then them. Step two is
       dimmed until step one has a name, which is the form telling the truth
       about what it needs rather than a rule being enforced. -->
  <section class="step" id="step1">
    <p class="stepno"><span>1</span><b id="s1head"></b></p>

    <div class="you">
      <button class="avatar" type="button" id="avgo" aria-label="Add a photo">
        <span class="av-in" id="avin"></span><span class="av-plus">+</span>
      </button>
      <div class="yourow">
        <label for="myname" id="mylabel"></label>
        <div class="two">
          <input id="myname" autocomplete="name">
          <button class="go" id="mysave" type="button"></button>
        </div>
      </div>
    </div>
    <input type="file" id="avfile" accept="image/*" hidden>
    <p class="note" id="s1say"></p>
  </section>

  <section class="step" id="step2">
    <p class="stepno"><span>2</span><b id="s2head"></b></p>
    <p class="note" id="s2say"></p>

  <div class="roles"><b id="rolehead"></b><span id="roles"></span></div>

  <!-- ONE PERSON, AND THEY GO UP THE MOMENT YOU PRESS IT.
       What was here first was the pile: drag a folder in, wait, then read and
       edit nine drafts before a single row existed. That is nine people times
       four fields of work before anything at all appears on the board, on a
       screen that has so far shown the agent nothing that looks like the
       product — and it assumes an organised folder of headshots on the device
       in their hand, which is a phone.
       So the first ask is one name. They are on the board in one press, the
       agent SEES it, and then they are offered another. The pile is still
       here and still the right tool for somebody with forty performers; it is
       an accelerator now rather than the entrance. -->
  <div class="one" id="onebox">
    <div class="onerow">
      <button class="avatar small" type="button" id="p1go" aria-label="Add a photo">
        <span class="av-in" id="p1in"></span><span class="av-plus">+</span>
      </button>
      <div class="onefields">
        <input id="p1name" autocomplete="off">
        <button class="go" id="p1save" type="button"></button>
      </div>
    </div>
    <input type="file" id="p1file" accept="image/*" hidden>
    <p class="note" id="p1say"></p>
    <div class="done" id="p1done" hidden></div>
  </div>

  <!-- The pile, behind a line, for whoever has a folder. -->
  <p class="skip"><button class="asline" type="button" id="pileopen"
     aria-expanded="false" aria-controls="field"></button></p>

  <div class="field" id="field" hidden>
    <svg class="pic drop-pic" viewBox="0 0 120 84" aria-hidden="true">
      <path class="ln dim" d="M10 74V22a5 5 0 0 1 5-5h26l8 9h56a5 5 0 0 1 5 5v43a5 5 0 0 1-5 5H15a5 5 0 0 1-5-5Z"/>
      <path class="ln hot" d="M60 8v32"/>
      <path class="ln hot" d="M48 29l12 12 12-12"/>
    </svg>
    <b id="fieldhead"></b>
    <p id="fieldsub"></p>
    <button class="go flat" id="browse" type="button"></button>
    <!-- TWO PICKERS, BECAUSE THERE ARE TWO KINDS OF DEVICE.
         A phone has no folders. It has a camera roll, and the agents this is
         for are on one all day — so on a phone the button opens photos and
         nothing else, and the words stop talking about dragging, which is not
         a thing a thumb does. The folder picker is still there on a laptop,
         where the folder-per-person really does exist and is better evidence
         than anything a machine can infer. Same route either way. -->
    <input id="files" type="file" multiple accept="image/*" hidden>
  </div>

  <div id="said"></div>
  <div class="people" id="people"></div>
  <div class="tray" id="tray" hidden><b id="trayhead"></b><div class="chips" id="traychips"></div></div>

  <div class="bottom" id="bottom" hidden>
    <button class="go" id="make" type="button"></button>
    <p id="tally"></p>
  </div>
  </section>

  <!-- THE ONE CASE THIS SCREEN CANNOT HANDLE, said rather than left to be
       discovered. Everything above makes rows for people who have never
       opened the app; somebody who is already on here has to type six
       characters into their own profile instead, and doing it this way round
       would make a second, empty them. One line, to the page that mints the
       code. -->
  <p class="skip"><a href="/run" id="repgo"></a></p>
  <p class="skip"><a href="/browse" id="skipgo"></a></p>
</main>

<script type="module">
import { T, langButton, pickLang } from "/i18n.js";
pickLang();

let device = "";
try { device = localStorage.getItem("board:device") || ""; } catch { /* private window */ }

const $ = (id) => document.getElementById(id);
const el = (tag, props, kids) => {
  const n = Object.assign(document.createElement(tag), props || {});
  for (const k of [].concat(kids || [])) if (k || k === 0) n.append(k);
  return n;
};
const say = (text, bad) => {
  if (!text) return $("said").replaceChildren();
  $("said").replaceChildren(el("p", { className: "said" + (bad ? " bad" : ""), textContent: text }));
};
function wash(name) {
  let h = 0;
  for (const ch of String(name || "?")) h = (h * 31 + ch.codePointAt(0)) % 360;
  return "linear-gradient(150deg,hsl(" + h + " 26% 74%),hsl(" + ((h + 24) % 360) + " 24% 52%))";
}
const isPic = (f) => f && /^image\//.test(f.type || "");

/* Whether this browser has a page with a name on it. Everything here needs
   one: a roster hangs off it, and their people's sentences are built from it.
   Checked once on load and again after they answer. */
/* THE AVATAR, THE SAME ONE THE BOARD USES.
 *
 * Read in the browser and posted as base64 to the route that already takes a
 * profile photograph — no new endpoint, no second queue, and it lands in the
 * same place with the same rules: held until somebody has looked at it, which
 * is true of every face on this board and is not going to stop being true
 * because an agent uploaded it.
 */
$("avgo").onclick = () => $("avfile").click();
$("avfile").onchange = async () => {
  const f = $("avfile").files[0];
  if (!f) return;
  if (f.size > 25 * 1024 * 1024) return say(T("ob.toobig"), true);
  say(T("ob.sending"));
  const b64 = await new Promise((ok) => {
    const r = new FileReader();
    r.onload = () => ok(String(r.result).split(",")[1] || "");
    r.onerror = () => ok("");
    r.readAsDataURL(f);
  });
  if (!b64) return say(T("run.failed"), true);
  const out = await fetch("/api/me", {
    method: "PUT", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ device, photo: b64, photoType: f.type || "image/jpeg" }),
  }).then((x) => x.json()).catch(() => ({ error: "failed" }));
  if (out.error) return say(T("run.failed"), true);
  say("");
  drawYou(out.person);
};

/* Both halves of step one, from whatever /api/me last said. */
function drawYou(person) {
  const box = $("avin");
  box.replaceChildren();
  if (person && person.photo) {
    box.append(el("img", { src: "/api/public-media?id=" + encodeURIComponent(person.photo), alt: "" }));
  } else {
    box.textContent = ((person && person.handle) || "?").trim().slice(0, 1).toUpperCase();
  }
  if (person && person.handle) $("myname").value = person.handle;
  /* Step two waits on a name and nothing else. A photograph is worth asking
     for and is not worth blocking on — plenty of agents will add theirs from a
     phone later, and none of them should be stuck here because of it. */
  $("step2").classList.toggle("waiting", !(person && person.handle));
}

async function askName() {
  const d = await fetch("/api/me", { headers: { "x-board-device": device } })
    .then((r) => r.json()).catch(() => null);
  drawYou(d && d.person);
  if (!(d && d.person && d.person.handle)) $("myname").focus();
  return Boolean(d && d.person && d.person.handle);
}

$("mysave").onclick = async () => {
  const handle = $("myname").value.trim();
  if (!handle) return;
  $("mysave").disabled = true;
  const r = await fetch("/api/me", {
    method: "PUT", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ device, handle }),
  }).then((x) => x.json()).catch(() => ({ error: "failed" }));
  $("mysave").disabled = false;
  if (r.error === "contact") return say(T("run.contact"), true);
  if (r.error) return say(T("run.failed"), true);
  say("");
  drawYou(r.person);
};

/* ---- ONE PERSON, ON THE BOARD, NOW ---------------------------------------
 *
 * The pile below is still the right tool for an agent with forty performers.
 * It is the wrong FIRST tool for all of them, because it asks for everything
 * before it gives anything: nine people, four fields each, read and corrected,
 * and only then does a single row exist. An agent who has so far seen nothing
 * that looks like the product is being asked to do half an hour of data entry
 * on faith.
 *
 * So: one name, one press, they are up. Then another. The agent watches the
 * list grow, which is the same thing the pile does in the end and is the
 * opposite experience of it.
 *
 * THE PHOTO IS HELD, NOT SENT, until the row exists — there is nobody to
 * attach it to before that. Held in memory only, and dropped if they change
 * their mind about the name.
 */
let p1photo = null;   // { b64, type }

$("p1go").onclick = () => $("p1file").click();
$("p1file").onchange = async () => {
  const f = $("p1file").files[0];
  if (!f) return;
  if (f.size > 25 * 1024 * 1024) return say(T("ob.toobig"), true);
  const b64 = await new Promise((ok) => {
    const r = new FileReader();
    r.onload = () => ok(String(r.result).split(",")[1] || "");
    r.onerror = () => ok("");
    r.readAsDataURL(f);
  });
  if (!b64) return say(T("run.failed"), true);
  p1photo = { b64, type: f.type || "image/jpeg" };
  const box = $("p1in");
  box.replaceChildren(el("img", { src: "data:" + p1photo.type + ";base64," + b64, alt: "" }));
  say("");
};

function p1clear() {
  $("p1name").value = "";
  p1photo = null;
  $("p1in").replaceChildren();
  $("p1name").focus();
}

/** One row per person as they land. The board filling up, visibly. */
function p1add(person) {
  const row = el("div", { className: "row" });
  if (person.photo) {
    row.append(el("img", { src: "/api/public-media?id=" + encodeURIComponent(person.photo), alt: "" }));
  } else {
    row.append(el("span", { className: "no",
      textContent: (person.handle || "?").trim().slice(0, 1).toUpperCase() }));
  }
  row.append(el("b", { textContent: person.handle || "" }));
  row.append(el("i", { textContent: T("ob.p1up") }));
  $("p1done").hidden = false;
  $("p1done").prepend(row);
}

$("p1save").onclick = async () => {
  const name = $("p1name").value.trim();
  if (!name) { say(T("ob.p1needName"), true); $("p1name").focus(); return; }
  $("p1save").disabled = true;
  say(T("ob.sending"));
  /* One name, not a list. /api/run/add takes newline-separated names and the
     role picker above decides the left half of their sentence — see the note
     on that route for why the role cannot be inherited from the agent's own. */
  const r = await fetch("/api/run/add", {
    method: "POST",
    headers: { "Content-Type": "application/json", "x-board-device": device },
    body: JSON.stringify({ device, names: name, role }),
  }).then((x) => x.json()).catch(() => ({ error: "failed" }));
  if (r.error === "contact") { $("p1save").disabled = false; return say(T("run.contact"), true); }
  if (r.error === "full") { $("p1save").disabled = false; return say(T("run.full"), true); }
  /* `added`, not `made`. The route's internal variable is `made` and what it
     sends is `added` — read from the source rather than from the response, the
     first press would have said "that did not work" over a person who was
     already on the board. */
  if (r.error || !r.added || !r.added[0]) { $("p1save").disabled = false; return say(T("run.failed"), true); }

  let person = r.added[0];
  /* AND NOW THE FACE, AS THEM. x-board-as is how one browser writes a row it
     does not own — the middleware checks the row really is one this agent
     runs, and every hashDevice below it answers with the represented person.
     Both headers: the device says who is asking, the as says who they are
     asking as, and a write carrying only one of them lands on the wrong row.
     A failed photograph is not a failed person — they are already up. */
  if (p1photo) {
    const out = await fetch("/api/me", {
      method: "PUT",
      headers: { "Content-Type": "application/json",
        "x-board-device": device, "x-board-as": person.id },
      body: JSON.stringify({ device, photo: p1photo.b64, photoType: p1photo.type }),
    }).then((x) => x.json()).catch(() => ({ error: "failed" }));
    if (out && out.person) person = { ...person, ...out.person };
  }
  $("p1save").disabled = false;
  say("");
  p1add(person);
  p1clear();
};

/* The pile, behind a line. Opened once and it stays open. */
$("pileopen").onclick = () => {
  const on = $("field").hidden;
  $("field").hidden = !on;
  $("pileopen").setAttribute("aria-expanded", String(on));
  if (on) $("field").scrollIntoView({ block: "nearest", behavior: "smooth" });
};

const ROLES = ["performer", "director", "writer", "crew"];
let role = "performer";
/* The pile, held here and never uploaded twice. The proposal that comes back
   names files by their position in this array, so moving a chip between people
   is a number changing hands rather than a re-upload. */
let PILE = [];
let GROUPS = [];      // [{ handle, goal, trade, campus, speaks, age, files:[i], out }]
let UNPLACED = [];    // [i]

function drawRoles() {
  $("roles").replaceChildren(...ROLES.map((r) => {
    const b = el("button", { type: "button", textContent: T("role." + r) });
    b.setAttribute("aria-pressed", String(r === role));
    b.onclick = () => { role = r; drawRoles(); };
    return b;
  }));
}

/* ---- moving a file from one person to another --------------------------- */
let dragging = null;
function chip(i, from) {
  const f = PILE[i];
  const c = el("span", {
    className: "chip" + (isPic(f) ? " pic" : ""),
    draggable: true,
    textContent: String(f.webkitRelativePath || f.name).split("/").pop(),
    title: T("ob.movetip"),
  });
  c.ondragstart = () => { dragging = { i, from }; };
  c.ondragend = () => { dragging = null; };
  return c;
}
function moveTo(to) {
  if (!dragging) return;
  const { i, from } = dragging;
  if (from === to) return;
  if (from === "loose") UNPLACED = UNPLACED.filter((x) => x !== i);
  else GROUPS[from].files = GROUPS[from].files.filter((x) => x !== i);
  if (to === "loose") UNPLACED.push(i);
  else GROUPS[to].files.push(i);
  dragging = null;
  drawPeople();
}

function drawPeople() {
  const box = $("people");
  box.replaceChildren(...GROUPS.map((g, gi) => {
    const pic = g.files.map((i) => PILE[i]).find(isPic);
    const faceBox = el("span", { className: "face" });
    if (pic) faceBox.append(el("img", { src: URL.createObjectURL(pic), alt: "" }));
    else { faceBox.style.background = wash(g.handle); faceBox.textContent = (g.handle || "?").slice(0, 1).toLowerCase(); }

    const name = el("input", { className: "name", value: g.handle, placeholder: T("ob.whoph") });
    name.oninput = () => { g.handle = name.value; tally(); };

    const goal = el("textarea", { rows: 4, value: g.goal, placeholder: T("ob.goalph") });
    goal.oninput = () => { g.goal = goal.value; };
    const trade = el("input", { value: g.trade, placeholder: T("ob.tradeph") });
    trade.oninput = () => { g.trade = trade.value; };
    const campus = el("input", { value: g.campus, placeholder: T("ob.cityph") });
    campus.oninput = () => { g.campus = campus.value; };

    const out = el("button", { type: "button", textContent: g.out ? T("ob.keep") : T("ob.drop") });
    out.onclick = () => { g.out = !g.out; drawPeople(); };

    const card = el("div", { className: "who" + (g.out ? " out" : "") }, [
      el("div", { className: "whohead" }, [faceBox, el("span", { style: "flex:1;min-width:0" }, [name])]),
      goal,
      el("div", { className: "two" }, [trade, campus]),
      el("div", { className: "chips" }, g.files.map((i) => chip(i, gi))),
      el("div", { className: "whyrow" }, [
        g.from === "guess" ? el("span", { className: "flag", textContent: T("ob.guessed") })
          : g.from === "folder" ? el("span", { textContent: T("ob.fromfolder") })
          : el("span", { textContent: "" }),
        out,
      ]),
    ]);
    card.ondragover = (e) => { e.preventDefault(); card.classList.add("over"); };
    card.ondragleave = () => card.classList.remove("over");
    card.ondrop = (e) => { e.preventDefault(); card.classList.remove("over"); moveTo(gi); };
    return card;
  }));

  /* ONE MORE PERSON, BY HAND. Two people's files in one pile with no names in
     them arrive as one card; splitting them is a card to drag the second
     person's files onto, and there was nowhere to put them. */
  if (GROUPS.length) {
    const add = el("button", { className: "who addwho", type: "button", textContent: T("ob.addwho") });
    add.onclick = () => {
      GROUPS.push({ handle: "", goal: "", trade: "", campus: "", speaks: [],
                    age: "", guessed: false, from: "", out: false, files: [] });
      drawPeople();
      [...document.querySelectorAll(".who input.name")].pop()?.focus();
    };
    box.append(add);
  }

  const tray = $("tray");
  tray.hidden = !UNPLACED.length;
  $("traychips").replaceChildren(...UNPLACED.map((i) => chip(i, "loose")));
  tray.ondragover = (e) => { e.preventDefault(); tray.classList.add("over"); };
  tray.ondragleave = () => tray.classList.remove("over");
  tray.ondrop = (e) => { e.preventDefault(); tray.classList.remove("over"); moveTo("loose"); };
  // The target shrinks the moment there is something below it to read.
  $("field").classList.toggle("small", GROUPS.length > 0);
  tally();
}

function tally() {
  const n = GROUPS.filter((g) => !g.out && g.handle.trim()).length;
  $("bottom").hidden = !GROUPS.length;
  $("make").textContent = T("ob.make", { n });
  $("make").disabled = !n;
  $("tally").textContent = T("ob.tally", { files: PILE.length, n });
}

/* ---- the pile goes up once, and is proposed back ------------------------ */
async function sort(list) {
  PILE = list.slice(0, 200);
  if (!PILE.length) return;
  const fd = new FormData();
  fd.append("device", device);
  fd.append("role", role);
  fd.append("dry", "1");
  PILE.forEach((f, i) => fd.append("f" + i, f, f.webkitRelativePath || f.name));
  say(T("ob.reading", { n: PILE.length }));
  const r = await fetch("/api/run/drop", { method: "POST", headers: { "x-board-device": device }, body: fd })
    .then((x) => x.json()).catch(() => ({ error: "failed" }));
  if (r.error === "nonames") return say(T("ob.nonames"), true);
  if (r.error === "nopage") return say(T("run.nopage"), true);
  if (r.error === "full") return say(T("run.runfull", { n: r.max }), true);
  if (r.error) return say(T("run.failed"), true);
  GROUPS = (r.people || []).map((p) => ({
    handle: p.handle || "", goal: p.goal || "", trade: p.trade || "", campus: p.campus || "",
    speaks: p.speaks || [], age: p.age || "", guessed: Boolean(p.guessed),
    // Where the NAME came from, which is the only thing the flag is about.
    // A card this page invented came from neither, and saying "from your
    // folder" on one is the screen claiming an authority it does not have.
    from: p.guessed ? "guess" : "folder", out: false,
    files: (p.files || []).map((f) => f.i).filter((i) => Number.isInteger(i)),
  }));
  UNPLACED = (r.unplaced || []).map((f) => f.i).filter((i) => Number.isInteger(i));

  /* NOTHING NAMED IS NOT NOTHING.
   *
   * The first thing anybody does is drag one file in to see what happens, and
   * a file called `resume.pdf` has no name in it — nor does a designed CV
   * whose text cannot be read at all. There is then nobody to propose, and
   * this page used to say so and stop, which is software asking somebody to go
   * away and rename their files.
   *
   * A name is one box and one second. So the files become a card with an empty
   * name on it and the cursor in it, which turns the dead end into the
   * question it always was: who is this? */
  if (!GROUPS.length && UNPLACED.length) {
    GROUPS = [{ handle: "", goal: "", trade: "", campus: "", speaks: [], age: "",
                guessed: false, from: "", out: false, files: UNPLACED }];
    UNPLACED = [];
    say(T("ob.whois"));
  } else {
    say((r.drafting
      ? T("ob.sorted", { n: GROUPS.length })
      : T("ob.sortednokey", { n: GROUPS.length }))
      + (r.already ? " " + T("ob.already", { n: r.already }) : ""));
  }
  drawPeople();
  if (!GROUPS[0]?.handle) document.querySelector(".who input.name")?.focus();
}

$("make").onclick = async () => {
  const keep = GROUPS.filter((g) => !g.out && g.handle.trim());
  if (!keep.length) return;
  $("make").disabled = true;
  const fd = new FormData();
  fd.append("device", device);
  fd.append("role", role);
  fd.append("people", JSON.stringify(keep.map((g) => ({
    handle: g.handle, goal: g.goal, trade: g.trade, campus: g.campus,
    speaks: g.speaks, age: g.age,
  }))));
  // One face each, and nothing else goes up a second time: a CV's job was
  // finished the moment its words were read.
  keep.forEach((g, i) => {
    const pic = g.files.map((x) => PILE[x]).find(isPic);
    if (pic) fd.append("face" + i, pic, "face" + i);
  });
  const r = await fetch("/api/run/make", { method: "POST", headers: { "x-board-device": device }, body: fd })
    .then((x) => x.json()).catch(() => ({ error: "failed" }));
  if (r.error) { $("make").disabled = false; return say(T("run.failed"), true); }
  GROUPS = []; UNPLACED = []; PILE = [];
  drawPeople();
  $("bottom").hidden = true;
  say(T("ob.made", { n: (r.added || []).length }));
};

/* Coarse pointer and no hover is a touch device; it is also what every phone
   answers and no laptop does, including a laptop with a touchscreen, which is
   the case a width test gets wrong. */
const PHONE = window.matchMedia
  && window.matchMedia("(hover: none) and (pointer: coarse)").matches;

const field = $("field");
$("browse").onclick = () => $("files").click();
if (!PHONE) {
  // webkitdirectory on a phone offers nothing and on some it offers a broken
  // sheet, so it is set only where a folder is a real thing.
  $("files").setAttribute("webkitdirectory", "");
  $("files").setAttribute("directory", "");
  $("files").removeAttribute("accept");
}
$("files").onchange = () => sort([...$("files").files]);
for (const e of ["dragenter", "dragover"]) {
  field.addEventListener(e, (ev) => { ev.preventDefault(); field.classList.add("over"); });
}
for (const e of ["dragleave", "drop"]) {
  field.addEventListener(e, (ev) => { ev.preventDefault(); field.classList.remove("over"); });
}
/* A DROPPED FOLDER IS NOT A LIST OF FILES. The drop event gives entries, and
   only walking them recursively keeps `Mia Chen/cv.pdf` — which, where the
   agent's files ARE tidy, is better evidence than anything a model infers. */
field.addEventListener("drop", async (ev) => {
  const roots = [...(ev.dataTransfer?.items || [])]
    .map((i) => i.webkitGetAsEntry && i.webkitGetAsEntry()).filter(Boolean);
  if (!roots.length) return sort([...(ev.dataTransfer?.files || [])]);
  const out = [];
  const walk = (entry, path) => new Promise((done) => {
    if (entry.isFile) {
      return entry.file((f) => { out.push(new File([f], path + entry.name, { type: f.type })); done(); }, done);
    }
    const rdr = entry.createReader();
    const chunk = () => rdr.readEntries(async (list) => {
      if (!list.length) return done();
      for (const e of list) await walk(e, path + entry.name + "/");
      chunk();   // readEntries returns at most a hundred at a time
    }, done);
    chunk();
  });
  for (const r of roots) await walk(r, "");
  sort(out);
});

function paint() {
  document.title = T("ob.title");
  const set = (id, key) => { $(id).textContent = T(key); };
  set("backlink", "run.title");
  // The tab and the links elsewhere keep the plain name; the page itself says
  // hello, because this is the first screen an agent ever sees.
  set("head", "ob.welcome");
  set("lede", "ob.lede");
  set("rolehead", "ob.rolehead");
  set("fieldhead", PHONE ? "ob.phonehead" : "ob.fieldhead");
  set("fieldsub", PHONE ? "ob.phonesub" : "ob.fieldsub");
  set("browse", PHONE ? "ob.phonego" : "ob.choose");
  set("repgo", "run.repTitle");
  set("skipgo", "ob.skip");
  set("s1head", "ob.s1head");
  set("s1say", "ob.s1say");
  set("s2head", "ob.s2head");
  set("s2say", "ob.s2say");
  set("mylabel", "ob.mylabel");
  set("mysave", "ob.mysave");
  set("p1save", "ob.p1save");
  set("p1say", "ob.p1say");
  set("pileopen", "ob.pileOpen");
  $("p1name").placeholder = T("ob.p1ph");
  /* Rows already on screen keep their label through a language switch — the
     list is the record of what the agent has done and redrawing it from
     scratch would lose it. */
  for (const i of $("p1done").querySelectorAll("i")) i.textContent = T("ob.p1up");
  $("myname").placeholder = T("ob.myph");
  set("trayhead", "ob.trayhead");
  drawRoles();
  if (GROUPS.length || PILE.length) drawPeople(); else tally();
}
$("lang").append(langButton(() => paint()));
paint();
$("bottom").hidden = true;
askName();
</script>
</body>
</html>
