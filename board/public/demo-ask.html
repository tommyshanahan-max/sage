<!doctype html>
<html lang="en" data-lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#EEF0F4">
<title>Dealio</title>
<style>
  /* THE ASKING SIDE, WHICH IS THE SIDE WE SELL TO.
     The demo used to open on the payer's screen. That shows the wrong half:
     whoever is being shown this is a sole trader, or somebody deciding
     whether sole traders would use it, and what they need to see is the
     three seconds of work — type an amount, get a link, send it. The payer's
     screen is what happens next and it is one tap from here.
     The amount is the whole home screen, the same decision dealio.html made:
     nothing else on this page is worth a tap first. */
  :root{
    --paper:#EEF0F4; --card:#FFFFFF; --ink:#151B28; --ink-2:#4E5968;
    --dim:#6E7789; --line:#E3E6EC; --accent:#3F68D8; --wx:#07C160;
    --warn-soft:#FFF4DB; --warn:#B8661A;
    --serif:Georgia,"Songti SC","Times New Roman",serif;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 var(--sans);
    -webkit-font-smoothing:antialiased;min-height:100dvh;display:flex;flex-direction:column}
  .flag{background:var(--warn-soft);color:var(--warn);font-size:.82rem;font-weight:650;
    text-align:center;padding:calc(.6rem + env(safe-area-inset-top,0)) 1rem .6rem;
    border-bottom:1px solid #EFDFC2}
  main{flex:1;width:100%;max-width:26rem;margin:0 auto;padding:1.6rem 1.1rem
    calc(1.4rem + env(safe-area-inset-bottom,0))}
  h1{font:400 1.5rem/1.2 var(--serif);margin:0 0 .3rem}
  .lead{color:var(--dim);font-size:.95rem;margin:0 0 1.6rem}
  .amtbox{display:flex;align-items:center;justify-content:center;gap:.2rem;
    background:var(--card);border:1px solid var(--line);border-radius:1rem;
    padding:1.3rem 1rem}
  .amtbox label{font:400 2.4rem/1 var(--serif);color:var(--dim)}
  .amtbox input{border:0;background:transparent;font:400 3.2rem/1 var(--serif);
    color:var(--ink);width:100%;max-width:9rem;outline:none;padding:0}
  .field{margin:.8rem 0 0}
  .field input{width:100%;border:1px solid var(--line);border-radius:.8rem;
    background:var(--card);padding:.85rem .95rem;font:inherit;color:var(--ink)}
  .field input::placeholder{color:#A6AEBC}
  button{font:inherit;color:inherit}
  .go{width:100%;margin-top:1.1rem;border:0;border-radius:99px;padding:1.05rem;
    background:var(--accent);color:#fff;font-weight:700;font-size:1.05rem;cursor:pointer}
  .go:disabled{opacity:.45}
  .out{margin-top:1.4rem;background:var(--card);border:1px solid var(--line);
    border-radius:1.1rem;padding:1.1rem;text-align:center}
  .out img{width:min(13rem,58vw);height:auto;display:block;margin:.2rem auto .9rem;
    border-radius:.6rem}
  .out .link{font-size:.82rem;color:var(--ink-2);word-break:break-all;
    background:var(--paper);border-radius:.6rem;padding:.6rem .7rem;margin:0 0 .8rem}
  .row{display:flex;gap:.55rem}
  .row button,.row a{flex:1;border:1px solid var(--line);background:var(--paper);
    border-radius:99px;padding:.8rem;font-weight:650;font-size:.92rem;text-align:center;
    text-decoration:none;color:var(--ink);cursor:pointer}
  .row .p{background:var(--accent);color:#fff;border-color:var(--accent)}
  .hint{font-size:.82rem;color:var(--dim);margin:.9rem 0 0;text-align:center}
</style>
</head>
<body>
<div class="flag" id="flag"></div>
<main id="main"></main>
<script type="module">
import { T, setLang, pickLang } from "/i18n.js";
setLang(pickLang());

const $ = (id) => document.getElementById(id);
const el = (t, c, x) => { const n = document.createElement(t); if (c) n.className = c; if (x != null) n.textContent = x; return n; };
$("flag").textContent = T("da.flag");

const main = $("main");
main.append(el("h1", null, T("da.head")), el("p", "lead", T("da.lead")));

const box = el("div", "amtbox");
const sym = el("label", null, "¥");
const amt = el("input", null);
amt.type = "text"; amt.inputMode = "decimal"; amt.placeholder = "0";
amt.setAttribute("aria-label", T("da.amount"));
box.append(sym, amt);
main.append(box);

const what = el("input");
what.placeholder = T("da.forEg");
what.maxLength = 60;
const f = el("div", "field"); f.append(what);
main.append(f);

const go = el("button", "go", T("da.go"));
go.type = "button"; go.disabled = true;
main.append(go);
main.append(el("p", "hint", T("da.hint")));

const clean = (v) => String(v).replace(/[^\d.]/g, "").replace(/(\..*)\./g, "$1").slice(0, 9);
amt.addEventListener("input", () => { amt.value = clean(amt.value); go.disabled = !(Number(amt.value) > 0); });
amt.focus();

go.addEventListener("click", async () => {
  go.disabled = true; go.textContent = T("da.going");
  try {
    const r = await fetch("/api/demo/ask", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ amount: "¥" + amt.value, what: what.value }),
    });
    const j = await r.json().catch(() => null);
    if (!r.ok || !j?.ok) throw new Error("no");
    done(j);
  } catch {
    go.disabled = false; go.textContent = T("da.go");
  }
});

function done(j) {
  main.textContent = "";
  main.append(el("h1", null, T("da.ready")), el("p", "lead", T("da.readyWhy")));
  const out = el("div", "out");
  const img = el("img"); img.src = j.png; img.alt = T("da.code");
  out.append(img, el("p", "link", j.url));
  const row = el("div", "row");
  const copy = el("button", "p", T("da.copy"));
  copy.type = "button";
  copy.addEventListener("click", async () => {
    try { await navigator.clipboard.writeText(j.url); copy.textContent = T("da.copied"); }
    catch { copy.textContent = T("da.copyNo"); }
  });
  const open = el("a", null, T("da.open"));
  open.href = j.url;
  row.append(copy, open);
  out.append(row);
  main.append(out);
  const again = el("button", "go", T("da.again"));
  again.type = "button";
  again.style.background = "transparent";
  again.style.color = "var(--ink-2)";
  again.style.border = "1px solid var(--line)";
  again.addEventListener("click", () => location.reload());
  main.append(again);
}
</script>
</body>
</html>
