<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Where your money lands</title>
<meta name="robots" content="noindex">
<!--
  WHERE A STOREFRONT'S COMMISSION LANDS. One form, once, ever.

  The details go straight to Airwallex and what comes back is an id and
  "Bank account ···· 3333". Nothing of the account is kept here — see the
  note on `payout` in lib/store.js — and this page says so, because a form
  asking for a bank account without saying where it goes is a form people
  close.

  NO ABN, NO PAYMENT: paying a business without one means withholding nearly
  half and sending that to the tax office. Refused here rather than
  discovered afterwards.
-->
<style>
  :root{
    --bg:#0B0E15; --card:#141924; --ink:#E9EDF5; --ink2:#A3B0C4; --mut:#6F7D92;
    --line:#232B39; --acc:#D6483B; --ok:#3FBE7D;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",
      "Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;
    --serif:Georgia,"Songti SC","Noto Serif CJK SC",'Times New Roman',serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink)}
  body{font-family:var(--sans);font-size:16px;line-height:1.5;
    padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
  main{max-width:30rem;margin:0 auto;padding:1.2rem .95rem 3rem}
  .top{display:flex;align-items:center;gap:.5rem;margin:0 0 1.6rem}
  .dot{width:.55rem;height:.55rem;border-radius:50%;background:var(--acc)}
  .top span{font-size:.7rem;letter-spacing:.18em;color:var(--mut)}
  h1{font-size:1.45rem;margin:0 0 .3rem}
  .sub{margin:0 0 1.5rem;font-size:.95rem;line-height:1.6;color:var(--ink2)}
  .owed{background:var(--card);border:1px solid var(--line);border-radius:1rem;
    padding:1rem 1.1rem;margin:0 0 1.4rem;display:flex;align-items:baseline;
    justify-content:space-between;gap:1rem}
  .owed span{font-size:.75rem;letter-spacing:.1em;text-transform:uppercase;color:var(--mut)}
  .owed b{font-family:var(--serif);font-size:1.7rem;font-weight:400}
  label{display:block;font-size:.78rem;color:var(--ink2);margin:0 0 .35rem}
  .fld{margin:0 0 .9rem}
  input{width:100%;font:inherit;font-size:1rem;padding:.8rem .85rem;border-radius:.75rem;
    border:1px solid var(--line);background:var(--card);color:var(--ink)}
  .two{display:flex;gap:.6rem}
  .two>div{flex:1 1 0;min-width:0}
  .two>div.bsb{flex:0 0 7.5rem}
  .agree{display:flex;gap:.7rem;align-items:flex-start;margin:.3rem 0 1.3rem}
  .agree input{width:1.25rem;height:1.25rem;flex:0 0 auto;margin:.15rem 0 0;
    accent-color:var(--acc)}
  .agree label{font-size:.85rem;line-height:1.55;color:var(--ink2);margin:0}
  .go{width:100%;border:0;border-radius:999px;background:var(--acc);color:#fff;
    font:inherit;font-size:1rem;font-weight:600;letter-spacing:.04em;padding:1.05rem}
  .go:disabled{background:var(--line);color:var(--mut)}
  .said{margin:.9rem 0 0;font-size:.9rem;color:var(--acc);text-align:center}
  .note{margin:1.1rem 0 0;font-size:.78rem;line-height:1.6;color:var(--mut);text-align:center}
  .done{background:var(--card);border:1px solid var(--line);border-radius:1rem;
    padding:1.2rem;display:flex;flex-direction:column;gap:.5rem}
  .done b{font-size:1.05rem}
  .done span{font-size:.9rem;color:var(--ink2)}
  .off{color:var(--mut);font-size:.95rem;line-height:1.7}
</style>

<main id="root"></main>

<script type="module">
const $ = (id) => document.getElementById(id);
const el = (t, cls, text) => {
  const n = document.createElement(t);
  if (cls) n.className = cls;
  if (text != null) n.textContent = text;
  return n;
};
const device = () => { try { return localStorage.getItem("board:device") || ""; } catch { return ""; } };

function head(root) {
  const top = el("div", "top");
  top.append(el("span", "dot"), el("span", null, "DEALIO"));
  root.append(top);
}

function draw(d) {
  const root = $("root");
  root.textContent = "";
  head(root);

  if (!d.on) {
    root.append(el("h1", null, "Not yet"));
    root.append(el("p", "off",
      "Paying people out is not switched on here yet. Nothing you type would go anywhere, so the form is not shown."));
    return;
  }

  if (d.payout) {
    root.append(el("h1", null, "That is the last form."));
    root.append(el("p", "sub", "Your share goes straight there when somebody buys from your shop."));
    const box = el("div", "done");
    box.append(el("b", null, d.payout.label || "Your bank account"));
    box.append(el("span", null, d.payout.name));
    root.append(box);
    if (d.owed) {
      const owed = el("div", "owed");
      owed.append(el("span", null, "Owed to you"));
      owed.append(el("b", null, d.owed));
      root.append(owed);
    }
    root.append(el("p", "note", "Change it by filling it in again."));
    return;
  }

  root.append(el("h1", null, "Where should your money land?"));
  root.append(el("p", "sub",
    "Your share of anything sold from your shop. Once, and never again."));

  if (d.owed && d.sold) {
    const owed = el("div", "owed");
    owed.append(el("span", null, "Waiting for this"));
    owed.append(el("b", null, d.owed));
    root.append(owed);
  }

  const f = (id, label, opts = {}) => {
    const wrap = el("div", opts.bare ? null : "fld");
    const l = el("label", null, label);
    l.htmlFor = id;
    const i = el("input");
    i.id = id;
    if (opts.mode) i.inputMode = opts.mode;
    if (opts.hint) i.placeholder = opts.hint;
    if (opts.auto) i.autocomplete = opts.auto;
    wrap.append(l, i);
    return wrap;
  };

  root.append(f("nm", "Name on the account", { auto: "name" }));
  root.append(f("abn", "ABN", { mode: "numeric", hint: "11 digits" }));
  const two = el("div", "fld two");
  const bsb = f("bsb", "BSB", { mode: "numeric", hint: "083-004", bare: true });
  bsb.className = "bsb";
  const acct = f("acct", "Account number", { mode: "numeric", bare: true });
  two.append(bsb, acct);
  root.append(two);

  const agree = el("div", "agree");
  const box = el("input");
  box.type = "checkbox";
  box.id = "agree";
  const lab = el("label", null,
    "I am doing this work as my own business, and I will invoice for it.");
  lab.htmlFor = "agree";
  agree.append(box, lab);
  root.append(agree);

  const go = el("button", "go", "SAVE AND GET PAID");
  go.type = "button";
  root.append(go);
  const said = el("p", "said");
  said.hidden = true;
  root.append(said);
  root.append(el("p", "note",
    "Your bank details go to Airwallex, not to us. We keep the last four digits and nothing else."));

  go.addEventListener("click", async () => {
    const body = {
      device: device(),
      name: $("nm").value.trim(), abn: $("abn").value.trim(),
      bsb: $("bsb").value.trim(), account: $("acct").value.trim(),
    };
    /* Said as itself and one at a time: the commonest way this form is
       wrong is one box, and "check your details" is no help at all. */
    const miss = !box.checked ? "Tick the line above first."
      : body.name.split(/\s+/).filter(Boolean).length < 2 ? "Both names, as the bank has them."
      : body.abn.replace(/\D/g, "").length !== 11 ? "An ABN is eleven digits."
      : body.bsb.replace(/\D/g, "").length !== 6 ? "A BSB is six digits."
      : body.account.replace(/\D/g, "").length < 5 ? "That account number looks short."
      : "";
    if (miss) { said.textContent = miss; said.hidden = false; return; }
    go.disabled = true;
    go.textContent = "SAVING…";
    said.hidden = true;
    try {
      const r = await fetch("/api/paid", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body),
      });
      const j = await r.json().catch(() => null);
      if (r.ok && j?.ok) { load(); return; }
      said.textContent = {
        refused: "The bank would not take those details. Check the BSB and the number.",
        abn: "An ABN is eleven digits.",
        off: "Paying out is not switched on here yet.",
      }[j?.error] || "That did not save — try again.";
    } catch {
      said.textContent = "That did not go through. Try again.";
    }
    said.hidden = false;
    go.disabled = false;
    go.textContent = "SAVE AND GET PAID";
  });
}

async function load() {
  try {
    const r = await fetch("/api/paid", { cache: "no-store", headers: { "x-board-device": device() } });
    const j = await r.json();
    draw(j);
  } catch {
    $("root").append(el("p", "off", "That did not load. Try again."));
  }
}
load();
</script>
