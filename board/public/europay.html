<!doctype html>
<!-- THE WHITE LABEL'S FRONT DOOR.
     "/" on a partner's own hostname used to open on dealio.html — the money
     screen — on the reasoning that his clients arrive from a link on his own
     page and a second front page is a second thing to get past. That is still
     right for a LIVE partner. It was wrong for this one: europay.paydealio.com
     is the demo, the thing sent to somebody who has not agreed to anything
     yet, and opening it on a payment form tells them nothing about what they
     are looking at.
     So the hostname opens here, and the money screen is one button away at
     /dealio. When a partner goes live on a name of his own, BOARD_WHITELABEL_
     FRONT=off puts it back. -->
<html lang="en" data-skin="{{SKIN}}" data-label="{{LABEL}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#0B0E15">
<title>Europay</title>
<meta name="description" content="Your clients in China can pay you.">
<meta name="robots" content="noindex">
<style>
  :root{
    --bg:#0B0E15; --card:#141A27; --ink:#EDF1F8; --ink2:#AEBACD; --mut:#7E8CA3;
    --line:#242C3D; --acc:#2E7BF6; --ok:#3FBF7F;
    --top:#141A27; --topInk:#EDF1F8;
    --l0:#b7d3f6; --l1:#86b6ef; --l2:#3987e5; --l3:#256abf;
  }
  {{SKINCSS}}
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);
    font:400 17px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,
      "PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    padding:0 16px;-webkit-text-size-adjust:100%}
  .wrap{max-width:860px;margin:0 auto;
    padding-block:calc(2.2rem + env(safe-area-inset-top,0px))
                 calc(3rem + env(safe-area-inset-bottom,0px))}

  .name{font-size:.78rem;font-weight:800;letter-spacing:.16em;text-transform:uppercase;
    color:var(--mut);margin:0 0 1.4rem}
  h1{font-size:clamp(2.1rem,7.5vw,3.4rem);line-height:1.06;letter-spacing:-.025em;
    font-weight:700;margin:0 0 .5rem;text-wrap:balance}
  .sub{font-size:clamp(1.05rem,3.6vw,1.3rem);color:var(--ink2);margin:0;max-width:22ch}

  /* The shape, given the room it needs. It is the only thing on this page
     nobody else shows them, so it gets the screen rather than a corner. */
  /* --card, not a colour of my own. The skin repaints --ink, --card and the
     rest from the partner's two hex values and has never heard of a --stage,
     so a stage painted outside that palette is dark text on dark ground the
     moment somebody sets a light paper. Anything the skin does not define
     must not sit behind anything it does. */
  .stage{position:relative;background:var(--card);border:1px solid var(--line);
    border-radius:1.1rem;margin:1.6rem 0 0;overflow:hidden;touch-action:none;
    aspect-ratio:10/7}
  .stage canvas{display:block;width:100%;height:100%}
  .stage .amt{position:absolute;left:1rem;top:.9rem;pointer-events:none}
  .stage .amt b{display:block;color:var(--ink);font-size:clamp(1.6rem,6vw,2.4rem);line-height:1;
    letter-spacing:-.035em;font-variant-numeric:tabular-nums}
  .stage .amt span{display:block;font-size:.85rem;color:var(--mut);margin-top:.25rem;
    max-width:18ch}
  .stage .turn{position:absolute;right:.9rem;bottom:.75rem;font-size:.8rem;
    color:var(--mut);pointer-events:none}

  .go{display:block;width:100%;border:0;border-radius:999px;background:var(--acc);
    color:#fff;font:inherit;font-size:1.08rem;font-weight:700;padding:1.02rem;
    margin:1.3rem 0 0;text-align:center;text-decoration:none;
    letter-spacing:.02em}
  .under{font-size:.88rem;color:var(--mut);text-align:center;margin:.7rem 0 0}

  /* WHAT IT LOOKS LIKE, three screens, below the fold on purpose. The page
     has to work for somebody who reads the headline, presses the button and
     never scrolls — so nothing above this line depends on it. */
  .shots{display:grid;gap:1.1rem;margin:2.8rem 0 0;
    grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
  .phone{background:#000;border-radius:1.6rem;padding:.42rem}
  .scr{background:var(--card);border-radius:1.3rem;overflow:hidden;
    height:22rem;display:flex;flex-direction:column;padding:.85rem}
  .eyebrow{font-size:.66rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase;
    color:var(--mut);margin:.2rem 0 .3rem}
  .big{font-size:1.9rem;line-height:1;letter-spacing:-.035em;margin:0;
    font-variant-numeric:tabular-nums}
  .cap{font-size:.82rem;color:var(--ink2);margin:.3rem 0 0}
  .r{display:flex;align-items:center;gap:.5rem;padding:.55rem 0;
    border-bottom:1px solid var(--line);font-size:.88rem}
  .r:last-child{border-bottom:0}
  .r .nm{flex:1;min-width:0;font-weight:600;overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap}
  .r .vv{font-variant-numeric:tabular-nums;font-weight:700}
  .r small{display:block;font-weight:400;color:var(--mut);font-size:.72rem}
  .pill{display:inline-block;font-size:.78rem;font-weight:700;padding:.35rem .7rem;
    border-radius:999px;background:var(--line);color:var(--ink2);margin:.2rem .3rem 0 0}
  .shots figcaption{font-size:.88rem;color:var(--mut);margin:.6rem 0 0}

  .foot{margin:2.6rem 0 0;padding-top:1.2rem;border-top:1px solid var(--line);
    font-size:.86rem;color:var(--mut)}
  .lang{position:absolute;right:16px;top:calc(1.5rem + env(safe-area-inset-top,0px));
    background:none;border:1px solid var(--line);color:var(--ink2);
    font:inherit;font-size:.82rem;padding:.3rem .75rem;border-radius:999px}
</style>
</head>
<body>
<button class="lang" id="lang" type="button">中文</button>
<div class="wrap">

  <p class="name" id="brand">EUROPAY</p>
  <h1 id="head"></h1>
  <p class="sub" id="sub"></p>

  <div class="stage" id="stage">
    <canvas id="cv"></canvas>
    <div class="amt"><b id="amt">$134,860</b><span id="amtSub"></span></div>
    <div class="turn" id="turn"></div>
  </div>

  <a class="go" href="/dealio" id="go"></a>
  <p class="under" id="under"></p>

  <div class="shots" id="shots"></div>

  <p class="foot" id="foot"></p>

</div>

<script type="module">
import { T, lang, setLang } from "/i18n.js";

const $ = (id) => document.getElementById(id);
const LABEL = document.documentElement.getAttribute("data-label") || "";
if (LABEL) $("brand").textContent = LABEL.toUpperCase();

/* THREE SCREENS, BUILT FROM STRINGS RATHER THAN WRITTEN INTO THE MARKUP, so
   the language button repaints them like everything else. */
function shots() {
  const box = $("shots");
  box.innerHTML = "";
  const make = (inner, cap) => {
    const f = document.createElement("figure");
    f.style.margin = "0";
    f.innerHTML = '<div class="phone"><div class="scr">' + inner + '</div></div>'
      + '<figcaption>' + cap + '</figcaption>';
    box.append(f);
  };
  make('<p class="eyebrow">' + T("ep.sBalance") + '</p>'
     + '<p class="big">$4,182</p>'
     + '<p class="cap">' + T("ep.sAvailable") + '</p>'
     + '<div style="margin-top:.9rem">'
     + '<span class="pill">' + T("ep.sRequest") + '</span>'
     + '<span class="pill">' + T("ep.sSend") + '</span></div>'
     + '<p class="eyebrow" style="margin-top:1rem">' + T("ep.sActivity") + '</p>'
     + '<div class="r"><span class="nm">Lin · Shanghai<small>' + T("ep.sToday") + '</small></span>'
     + '<span class="vv" style="color:var(--ok)">+$310</span></div>'
     + '<div class="r"><span class="nm">' + T("ep.sCut") + '<small>' + T("ep.sYesterday") + '</small></span>'
     + '<span class="vv" style="color:var(--ok)">+$92</span></div>',
     T("ep.cWallet"));

  make('<p class="eyebrow">' + T("ep.sPeople") + ' · 3</p>'
     + '<p class="big">$33,100</p>'
     + '<p class="cap">' + T("ep.sBetween") + '</p>'
     + '<div style="margin-top:.7rem">'
     + '<div class="r"><span class="nm">Algotech<small>12</small></span><span class="vv">$18,400</span></div>'
     + '<div class="r"><span class="nm">Meili Store<small>7</small></span><span class="vv">$9,100</span></div>'
     + '<div class="r"><span class="nm">Kwong Trading<small>5</small></span><span class="vv">$5,600</span></div>'
     + '</div>',
     T("ep.cPeople"));

  make('<p class="eyebrow">' + T("ep.sPaid") + '</p>'
     + '<p class="big" style="font-size:1.15rem;line-height:1.25">' + T("ep.sWhere") + '</p>'
     + '<div style="margin-top:.9rem">'
     + '<div class="r"><span class="nm">' + T("ep.sBank") + '<small>' + T("ep.sBankSub") + '</small></span><span>›</span></div>'
     + '<div class="r"><span class="nm">' + T("ep.sStripe") + '<small>' + T("ep.sStripeSub") + '</small></span><span>›</span></div>'
     + '</div>',
     T("ep.cPaid"));
}

function paint() {
  $("head").textContent = T("ep.head");
  $("sub").textContent = T("ep.sub");
  $("amtSub").textContent = T("ep.beneath");
  $("turn").textContent = T("ep.turn");
  $("go").textContent = T("ep.go");
  $("under").textContent = T("ep.under");
  $("foot").textContent = T("ep.foot");
  $("lang").textContent = lang() === "zh" ? "English" : "中文";
  document.documentElement.lang = lang() === "zh" ? "zh" : "en";
  shots();
}
$("lang").addEventListener("click", () => { setLang(lang() === "zh" ? "en" : "zh"); paint(); });
paint();

/* ---- the pyramid ---------------------------------------------------------
 *
 * The same hand-written projection as the prototype in docs/prototypes: a
 * stack of boxes, every face sorted far-to-near and painted in that order.
 * No library, deliberately — a page whose whole job is to make somebody
 * trust the thing behind it cannot have a script that might 404, and the
 * only thing a 3D library would save here is eighty lines of arithmetic.
 *
 * The numbers are a stand-in. This is the front of a demo; there is no
 * signed-in person to have a real tree.
 */
const ROWS = [{ id: "r", own: 0 }];
(function seed() {
  let id = 0, rnd = 7;
  const next = () => (rnd = (rnd * 1103515245 + 12345) % 2147483648) / 2147483648;
  [18400, 9100, 5600].forEach((v) => ROWS.push({ id: "a" + (++id), own: v, parent: "r" }));
  const p1 = ROWS.filter((x) => x.parent === "r");
  [6200, 4900, 3100, 2600, 3800, 2400, 3300].forEach((v, i) =>
    ROWS.push({ id: "b" + (++id), own: v, parent: p1[i % 3].id }));
  for (const p of ROWS.filter((x) => String(x.id)[0] === "b")) {
    const n = 2 + Math.floor(next() * 3);
    for (let k = 0; k < n; k++)
      ROWS.push({ id: "c" + (++id), own: 250 + Math.round(next() * 1400), parent: p.id });
  }
})();
const depthOf = (id) => { let d = 0, c = ROWS.find((r) => r.id === id);
  while (c && c.parent) { d++; c = ROWS.find((r) => r.id === c.parent); } return d; };

const css = (n) => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const cv = $("cv"), ctx = cv.getContext("2d");
const CELL = 0.92, GAP = 0.11, LIFT = 1.05, CAMZ = 11, FOCAL = 8.4;
let boxes = [], W = 0, H = 0, DPR = 1, rotY = 0.62, rotX = 0.36, SPAN = 8;

function build() {
  boxes = [];
  const cols = [css("--l0"), css("--l1"), css("--l2"), css("--l3")];
  const max = Math.max.apply(null, ROWS.map((r) => r.own).concat([1]));
  for (let d = 0; d <= 3; d++) {
    const at = ROWS.filter((r) => depthOf(r.id) === d);
    if (!at.length) continue;
    /* Each plane split into exactly as many squares as there are people on
       it, every square the same size everywhere — so volume means the same
       thing at the top of the pyramid as at the bottom. */
    const perRow = Math.ceil(Math.sqrt(at.length));
    const nRows = Math.ceil(at.length / perRow);
    at.forEach((r, i) => {
      const rowI = Math.floor(i / perRow);
      const inRow = Math.min(perRow, at.length - rowI * perRow);
      const side = Math.max(CELL - GAP, 0.03);
      boxes.push({
        x: ((i - rowI * perRow) - (inRow - 1) / 2) * CELL,
        z: (rowI - (nRows - 1) / 2) * CELL,
        y: 1.45 - d * LIFT,
        sx: side, sz: side,
        sy: d === 0 ? 0.30 : 0.14 + 0.95 * (r.own / max),
        col: cols[d],
      });
    });
  }
  const wide = Math.max.apply(null, boxes.map((b) => Math.abs(b.x) + b.sx).concat([2]));
  SPAN = Math.max(6.4, wide * 1.8);
}
function project(p) {
  const cy = Math.cos(rotY), sy = Math.sin(rotY);
  let x = p[0] * cy - p[2] * sy, z = p[0] * sy + p[2] * cy;
  const cx = Math.cos(rotX), sx = Math.sin(rotX);
  let y = p[1] * cx - z * sx; z = p[1] * sx + z * cx;
  const k = FOCAL / (CAMZ - z);
  return { x: W / 2 + x * k * (W / SPAN), y: H * 0.47 - y * k * (H / (SPAN * 0.76)), z };
}
const FACES = [[4,5,6,7,0,0,1],[1,0,3,2,0,0,-1],[5,1,2,6,1,0,0],
               [0,4,7,3,-1,0,0],[7,6,2,3,0,1,0],[0,1,5,4,0,-1,0]];
const LIT = (() => { const v = [0.38,0.86,0.34], m = Math.hypot(v[0],v[1],v[2]);
  return v.map((n) => n / m); })();
function corners(b) {
  const x0=b.x-b.sx/2,x1=b.x+b.sx/2,z0=b.z-b.sz/2,z1=b.z+b.sz/2,y0=b.y-b.sy,y1=b.y;
  return [[x0,y0,z0],[x1,y0,z0],[x1,y1,z0],[x0,y1,z0],
          [x0,y0,z1],[x1,y0,z1],[x1,y1,z1],[x0,y1,z1]];
}
function rotN(n) {
  const cy=Math.cos(rotY),sy=Math.sin(rotY);
  let x=n[0]*cy-n[2]*sy, z=n[0]*sy+n[2]*cy;
  const cx=Math.cos(rotX),sx=Math.sin(rotX);
  return [x, n[1]*cx-z*sx, n[1]*sx+z*cx];
}
function hexv(c) {
  const h=c.replace("#",""); const v=h.length===3?h.split("").map((x)=>x+x).join(""):h;
  return [parseInt(v.slice(0,2),16),parseInt(v.slice(2,4),16),parseInt(v.slice(4,6),16)];
}
function shade(c,k) {
  const [r,g,b]=hexv(c); const f=(n)=>Math.max(0,Math.min(255,Math.round(n*k)));
  return "rgb("+f(r)+","+f(g)+","+f(b)+")";
}
function draw() {
  ctx.setTransform(DPR,0,0,DPR,0,0); ctx.clearRect(0,0,W,H);
  const q = [];
  for (const b of boxes) {
    const c = corners(b).map(project);
    for (const f of FACES) {
      const p = [c[f[0]],c[f[1]],c[f[2]],c[f[3]]];
      const n = rotN([f[4],f[5],f[6]]);
      const lit = 0.58 + 0.42*Math.max(0, n[0]*LIT[0]+n[1]*LIT[1]+n[2]*LIT[2]);
      q.push({ p, zz:(p[0].z+p[1].z+p[2].z+p[3].z)/4, fill: shade(b.col, lit) });
    }
  }
  q.sort((a,b) => a.zz - b.zz);
  for (const o of q) {
    ctx.beginPath(); ctx.moveTo(o.p[0].x, o.p[0].y);
    for (let i=1;i<4;i++) ctx.lineTo(o.p[i].x, o.p[i].y);
    ctx.closePath(); ctx.fillStyle = o.fill; ctx.fill();
  }
}
function size() {
  const r = $("stage").getBoundingClientRect();
  DPR = Math.min(devicePixelRatio || 1, 2); W = r.width; H = r.height;
  cv.width = Math.round(W*DPR); cv.height = Math.round(H*DPR);
}
size(); build(); draw();
addEventListener("resize", () => { size(); draw(); });

let spin = true, down = false, lx = 0, ly = 0;
const st = $("stage");
st.addEventListener("pointerdown", (e) => { down = true; spin = false;
  lx = e.clientX; ly = e.clientY;
  if (st.setPointerCapture) st.setPointerCapture(e.pointerId); });
st.addEventListener("pointermove", (e) => { if (!down) return;
  rotY += (e.clientX - lx) * 0.009;
  rotX = Math.max(-0.1, Math.min(1.0, rotX + (e.clientY - ly) * 0.006));
  lx = e.clientX; ly = e.clientY; draw(); });
const up = () => { down = false; };
st.addEventListener("pointerup", up);
st.addEventListener("pointercancel", up);
if (matchMedia("(prefers-reduced-motion: reduce)").matches) spin = false;
(function loop(){ requestAnimationFrame(loop);
  if (spin && !down) { rotY += 0.0024; draw(); } })();
</script>
</body>
</html>
