<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="/favicon.png" sizes="192x192">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#EEF0F4">
<meta name="theme-color" content="#0B0E15" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="交换">
<title>Your level</title>
<meta name="description" content="Four questions, one minute, and roughly where your Chinese or your English sits.">
<meta property="og:type" content="website">
<meta property="og:title" content="Your level">
<meta property="og:description" content="Four questions. It finds your level by halving the range each time.">
<meta property="og:image" content="{{ORIGIN}}/share.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:url" content="{{ORIGIN}}/level">
<meta name="robots" content="noindex">
<meta http-equiv="Cache-Control" content="no-cache">
<meta name="color-scheme" content="light dark">
<style>
  :root{
    --card:#FCFCFD; --paper:#EEF0F4; --raise:#F7F8FB; --ink:#151B28; --ink-2:#4E5968;
    --muted:#8A939F; --line:#E3E6EC; --hair:#EAECF1;
    --accent:#3F68D8; --accent-ink:#FFFFFF; --accent-soft:#E8ECF7;
    --t3:#D99038; --t6:#2F8C9E;
    --serif:Georgia,"Songti SC","Noto Serif CJK SC",'Times New Roman',serif;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",
      "Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;
    --shadow:0 2px 6px rgba(21,27,40,.07),0 10px 28px rgba(21,27,40,.09);
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --card:#1B212D; --paper:#0B0E15; --raise:#141924; --ink:#E9EDF5; --ink-2:#A3B0C4;
      --muted:#6F7D92; --line:#232B39; --hair:#1E2531;
      --accent:#5C8DFF; --accent-ink:#0B0E15; --accent-soft:#18233D;
      --t3:#E4A65A; --t6:#4FA9BC;
      --shadow:0 2px 6px rgba(0,0,0,.4),0 12px 32px rgba(0,0,0,.34);
    }
  }
  :root[data-theme="dark"]{
    --card:#1B212D; --paper:#0B0E15; --raise:#141924; --ink:#E9EDF5; --ink-2:#A3B0C4;
    --muted:#6F7D92; --line:#232B39; --hair:#1E2531;
    --accent:#5C8DFF; --accent-ink:#0B0E15; --accent-soft:#18233D;
    --t3:#E4A65A; --t6:#4FA9BC;
    --shadow:0 2px 6px rgba(0,0,0,.4),0 12px 32px rgba(0,0,0,.34);
  }
  :root[data-lang="zh"]{
    --serif:"Songti SC","Noto Serif CJK SC","Source Han Serif SC","STSong",Georgia,serif;
    --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB",
      "Microsoft YaHei","Noto Sans SC","Segoe UI",sans-serif;
  }
  :root[data-lang="zh"] body{line-height:1.75}
  :root[data-lang="zh"] .eyebrow,
  :root[data-lang="zh"] .pole{text-transform:none;letter-spacing:.02em}
  [hidden]{display:none!important}

  *{box-sizing:border-box}
  /* One size up, the same as everywhere else — see the note in index.html. */
  html{font-size:17px;-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);
    font-size:1rem;line-height:1.5;-webkit-font-smoothing:antialiased}
  main{max-width:34rem;margin:0 auto;padding:0 1.15rem 4rem}
  button{font:inherit;cursor:pointer}
  a{color:inherit}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}

  /* The strip that says this is not open yet. Quiet, full width, above
     everything — it is a status, not an announcement, and it is the first
     thing somebody arriving from a friend's link should read. */
  .invite{margin:0 -1.15rem .9rem;padding:.5rem 1.15rem;background:var(--accent-soft);
    color:var(--accent);font-size:.78rem;letter-spacing:.02em;text-align:center}
  .bar{display:flex;align-items:center;gap:.7rem;padding:.9rem 0 1.2rem}
  .bar a.back{color:var(--ink);text-decoration:none;display:grid;place-items:center;
    margin-left:-.3rem}
  .bar svg{width:1.5rem;height:1.5rem;stroke:currentColor;fill:none;stroke-width:1.8;
    stroke-linecap:round;stroke-linejoin:round}
  .bar .lang{margin-left:auto;border:1px solid var(--line);background:var(--raise);
    color:var(--ink-2);border-radius:99px;padding:.42rem .9rem;font-size:.85rem;line-height:1}

  .eyebrow{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
  h1{margin:.5rem 0 0;font-family:var(--serif);font-weight:400;font-size:2rem;
    line-height:1.12}
  .egs{margin:.55rem 0 0;font-family:var(--serif);font-size:1.25rem;
    letter-spacing:.06em;color:var(--accent)}
  .lede{margin:.8rem 0 0;font-size:1.02rem;line-height:1.65;color:var(--ink-2)}
  /* The reason to take this one and not another. Set apart, because it is the
     claim the rest of the page has to make good on. */
  .lede.lean{margin-top:1rem;padding-left:.95rem;border-left:2px solid var(--accent);
    font-size:.98rem}
  .go{margin:1.6rem 0 0;border:0;background:var(--accent);color:var(--accent-ink);
    border-radius:99px;padding:.85rem 1.9rem;font-size:1.05rem}
  .quiet{margin:.8rem 0 0;border:1px solid var(--line);background:var(--raise);
    color:var(--ink);border-radius:99px;padding:.7rem 1.4rem;font-size:.95rem;
    text-decoration:none;display:inline-block}
  /* One loud button on this screen, and it is Share. Two would be a screen
     that has not decided what it wants. */
  .quiet.wide{display:block;width:100%;text-align:center;padding:.8rem 1rem;
    font-size:1rem}
  .go.wide{display:block;width:100%;margin:1.4rem 0 0;padding:.85rem 1rem;
    font-size:1.02rem}
  .note{margin:1.4rem 0 0;font-size:.86rem;line-height:1.6;color:var(--muted)}

  /* ---- PK ------------------------------------------------------------------
   * The challenge on arrival, and the comparison on the way out. Accent
   * ground on both, so the thing that brought somebody here is the thing they
   * see first on each screen. */
  .pkcard{margin:1.6rem 0 0;padding:1.3rem 1.2rem 1.4rem;background:var(--accent-soft);
    border-radius:1.3rem;text-align:center}
  .pkcap{margin:0;font-size:.72rem;letter-spacing:.22em;text-transform:uppercase;
    color:var(--accent);font-weight:500}
  :root[data-lang="zh"] .pkcap{letter-spacing:.06em}
  .pkfrom{margin:.7rem 0 0;font-family:var(--serif);font-weight:400;
    font-size:clamp(1.4rem,6.4vw,1.8rem);line-height:1.25;text-wrap:balance}
  .pkbeat{margin:.5rem 0 0;font-size:.95rem;color:var(--ink-2)}
  .pkcard .go{margin-top:1.2rem}
  .pkalt{display:block;width:100%;margin:.7rem 0 0;border:0;background:none;
    color:var(--accent);font-size:.9rem;padding:.4rem 0}

  .pkres{margin:1.2rem 0 0;padding:1.2rem 1.15rem 1.3rem;background:var(--accent-soft);
    border-radius:1.3rem;text-align:center}
  /* Two numbers, side by side, and nothing between them but a dash. A bar
     chart of two four-question placements would be a graph of a rumour. */
  .pkpair{display:flex;align-items:center;justify-content:center;gap:1.1rem;
    margin:.9rem 0 0}
  .pkside{flex:0 1 8rem;min-width:0}
  .pkside b{display:block;font-family:var(--serif);font-weight:400;font-size:2.6rem;
    line-height:1;color:var(--muted)}
  .pkside.me b{color:var(--accent)}
  .pkside span{display:block;margin:.3rem 0 0;font-size:.85rem;color:var(--ink-2);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pkv{font-style:normal;color:var(--muted);font-size:1.2rem}
  .pkverdict{margin:1rem 0 0;font-family:var(--serif);font-size:1.2rem}
  .pkres .go{margin-top:1.1rem}

  /* ---- the result, as a card ---------------------------------------------
   * Raised off the paper and centred, because this is the screen that gets
   * screenshotted and sent to somebody. Everything on it is one object: a
   * medallion, what it is called, what it lets you do, and how the run went.
   */
  .rcard{margin:1.2rem 0 0;padding:1.6rem 1.15rem 1.3rem;background:var(--raise);
    border:1px solid var(--line);border-radius:1.4rem;box-shadow:var(--shadow);
    text-align:center}
  .medal{width:5rem;height:5rem;margin:0 auto;border-radius:50%;display:grid;
    place-items:center;background:var(--accent-soft);color:var(--accent);
    box-shadow:inset 0 0 0 2px var(--accent)}
  .head1{margin:1rem 0 0;font-family:var(--serif);font-weight:400;
    font-size:clamp(1.7rem,7.6vw,2.2rem);line-height:1.15;text-wrap:balance}
  /* Ten stops as dots rather than bars: a row of dots reads as a scale
     somebody is standing on, a row of bars reads as a meter filling up, and
     this is a place on a range and not a percentage of anything. */
  .dots{display:flex;justify-content:center;gap:.5rem;margin:1rem 0 0}
  .dots i{width:.68rem;height:.68rem;border-radius:50%;background:var(--line)}
  .dots i.on{background:var(--accent)}
  .dots i.here{box-shadow:0 0 0 3px var(--accent-soft)}
  .markname{margin:1rem 0 0;font-size:1.05rem;font-weight:500}
  .marknext{margin:.25rem 0 0;font-size:.85rem;color:var(--muted)}

  .did{display:flex;gap:.8rem;text-align:left;margin:1.3rem 0 0;padding:1rem 1.05rem;
    background:var(--accent-soft);border-top:2px solid var(--accent);
    border-radius:.4rem .4rem 1rem 1rem}
  .did .tick{flex:0 0 auto;width:1.9rem;height:1.9rem;border-radius:50%;
    background:var(--accent);display:grid;place-items:center}
  .did .tick svg{width:1.1rem;height:1.1rem;fill:none;stroke:var(--accent-ink);
    stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
  .did .cap{margin:0;font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;
    color:var(--accent)}
  :root[data-lang="zh"] .did .cap{text-transform:none;letter-spacing:.02em}
  .did h2{margin:.2rem 0 0;font-family:var(--serif);font-weight:400;font-size:1.2rem;
    line-height:1.25}
  .did p:not(.cap){margin:.35rem 0 0;font-size:.9rem;line-height:1.5;color:var(--ink-2)}

  .stats{display:flex;margin:1.4rem 0 0}
  .stats div{flex:1 1 0;min-width:0}
  .stats b{display:block;font-family:var(--serif);font-weight:400;font-size:1.5rem;
    line-height:1.1;font-variant-numeric:tabular-nums}
  .stats span{display:block;margin:.3rem 0 0;font-size:.68rem;letter-spacing:.12em;
    text-transform:uppercase;color:var(--muted)}
  :root[data-lang="zh"] .stats span{text-transform:none;letter-spacing:.02em}

  .unlock{display:flex;align-items:center;gap:.7rem;text-align:left;margin:1.3rem 0 0;
    padding:.8rem 1rem;background:var(--accent-soft);border-radius:.9rem;
    color:var(--accent)}
  .unlock b{display:block;font-weight:500;font-size:.95rem}
  .unlock span{display:block;margin:.1rem 0 0;font-size:.82rem;color:var(--ink-2)}

  /* ---- the rung above -----------------------------------------------------
   * Not "your mistakes": these are the cards from the levels the search ruled
   * out, and getting them wrong is how it found the answer. */
  .above{margin:1.4rem 0 0;padding:1rem 1.15rem 1.1rem;border:1px solid var(--line);
    border-radius:1.1rem}
  .above .cap{margin:0 0 .5rem;font-size:.7rem;letter-spacing:.14em;
    text-transform:uppercase;color:var(--muted)}
  :root[data-lang="zh"] .above .cap{text-transform:none;letter-spacing:.02em}
  .arow{display:flex;align-items:center;gap:.8rem;padding:.55rem 0;
    border-top:1px solid var(--hair)}
  .arow .aw{flex:1 1 auto;min-width:0}
  .arow b{display:block;font-family:var(--serif);font-weight:400;font-size:1.15rem}
  .arow span{display:block;font-size:.88rem;color:var(--ink-2)}
  .ahear{flex:0 0 auto;width:2.1rem;height:2.1rem;border-radius:50%;
    border:1px solid var(--line);background:var(--raise);color:var(--accent);
    font-size:.7rem;line-height:1}
  .awhy{margin:.7rem 0 0;font-size:.8rem;line-height:1.5;color:var(--muted)}

  .nextup{margin:0 0 .3rem;font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;
    color:var(--muted)}
  :root[data-lang="zh"] .nextup{text-transform:none;letter-spacing:.02em}

  /* The one line left from that block: whether the mark is already beside
     their name, or one button away. */
  .wornnote{margin:.7rem 0 0;font-size:.82rem;line-height:1.5;color:var(--muted);
    text-align:center}
  .feedwhat{margin:.5rem 0 0;font-size:.82rem;line-height:1.5;color:var(--muted);
    text-align:center}

  /* THE CLASS. A card rather than another button, because it is not one more
     thing to do with the result — it is the thing the result was for, and it
     leaves this site for the one next door. */
  .klass{margin:1.5rem 0 0;padding:1.1rem 1.15rem 1.2rem;background:var(--raise);
    border:1px solid var(--line);border-radius:1.1rem;box-shadow:var(--shadow)}
  .klass h2{margin:0;font-family:var(--serif);font-weight:400;font-size:1.35rem;
    line-height:1.2}
  .klass .at{margin:.45rem 0 0;font-size:.78rem;letter-spacing:.1em;
    text-transform:uppercase;color:var(--accent)}
  :root[data-lang="zh"] .klass .at{text-transform:none;letter-spacing:.02em}
  .klass p{margin:.7rem 0 0;font-size:.95rem;line-height:1.6;color:var(--ink-2)}
  .klass .go{margin-top:1.1rem;display:block;width:100%;text-align:center;
    padding:.8rem 1rem;font-size:1rem;text-decoration:none}
  .klass .away{margin:.7rem 0 0;font-size:.78rem;color:var(--muted);text-align:center}

  /* ---- one question at a time --------------------------------------------
   * A forced choice is the whole instrument, so the two options are the whole
   * screen: same size, same weight, nothing between them that could read as a
   * middle. */
  .count{font-size:.78rem;color:var(--muted);font-variant-numeric:tabular-nums}
  .track{height:3px;background:var(--line);border-radius:99px;margin:.5rem 0 1.8rem;
    overflow:hidden}
  .track i{display:block;height:100%;background:var(--accent);border-radius:99px;
    transition:width .22s ease}
  .ask{margin:0;font-family:var(--serif);font-weight:400;font-size:1.5rem;
    line-height:1.25;text-wrap:balance}
  .picks{display:grid;gap:.75rem;margin:1.7rem 0 0}
  .pick{border:1px solid var(--line);background:var(--raise);color:var(--ink);
    border-radius:1rem;padding:1.15rem 1.2rem;font-size:1.06rem;line-height:1.5;
    text-align:left;box-shadow:var(--shadow)}
  .pick:hover{border-color:var(--accent);color:var(--accent)}
  .undo{margin:1.4rem 0 0;border:0;background:none;color:var(--muted);
    font-size:.88rem;padding:.3rem 0}
  .undo:hover{color:var(--ink)}

  /* ---- the result --------------------------------------------------------
   * The four letters are what gets screenshotted, so they are set big — and
   * the caveat sits directly under them at a size nobody can skip. A giant
   * serif code with the qualification below the fold would be a better-looking
   * screen and a worse product. */
  .code{margin:.6rem 0 0;font-family:var(--serif);font-weight:400;
    font-size:clamp(3.4rem,17vw,5rem);line-height:1;letter-spacing:.06em;
    color:var(--accent)}
  .title{margin:.4rem 0 0;font-family:var(--serif);font-size:1.5rem;line-height:1.2}
  .caveat{margin:.9rem 0 0;padding:.85rem 1rem;background:var(--raise);
    border:1px solid var(--line);border-left:3px solid var(--t3);border-radius:.6rem;
    font-size:.9rem;line-height:1.6;color:var(--ink-2)}

  .axis{margin:1.6rem 0 0;padding-top:1.1rem;border-top:1px solid var(--hair)}
  .poles{display:flex;align-items:baseline;gap:1rem}
  .pole{font-size:.72rem;letter-spacing:.13em;text-transform:uppercase;color:var(--muted)}
  .pole.on{color:var(--ink)}
  .poles .sp{flex:1}
  /* The position, drawn. The dot is where five forced choices put them; the
     line is the axis. Never a percentage — five items cannot carry one. */
  .line{position:relative;height:2px;background:var(--line);margin:.85rem 0 0;
    border-radius:99px}
  .line .mid{position:absolute;left:50%;top:-3px;width:1px;height:8px;
    background:var(--muted);opacity:.5}
  .line .dot{position:absolute;top:-5px;width:12px;height:12px;margin-left:-6px;
    border-radius:50%;background:var(--accent);box-shadow:0 0 0 3px var(--paper)}
  .said{margin:.7rem 0 0;font-size:.9rem;color:var(--ink-2)}
  .said b{font-weight:400;color:var(--ink)}

  .row{display:flex;gap:.6rem;margin:1.8rem 0 0;flex-wrap:wrap}
  .row>*{flex:1 1 0;min-width:9rem;margin:0;text-align:center}
  .said.ok{color:var(--accent)}

  /* ---- the card ----------------------------------------------------------
   * One word, set large, and three ways to read it. The word is the whole
   * question, so it gets the room a question would get. */
  .word{margin:1.6rem 0 0;font-family:var(--serif);font-weight:400;
    font-size:clamp(2.6rem,13vw,3.6rem);line-height:1.1;text-align:center;
    word-break:break-word}
  /* Under the word, centred, quiet. It is an offer, not the question. */
  .hear{display:flex;align-items:center;gap:.45rem;margin:.9rem auto 0;
    border:1px solid var(--line);background:var(--raise);color:var(--ink-2);
    border-radius:99px;padding:.45rem 1.05rem;font-size:.9rem}
  .hear:hover{border-color:var(--accent);color:var(--accent)}
  .hear svg{width:1.05rem;height:1.05rem;stroke:currentColor;fill:none;
    stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
  .picks{margin:1.5rem 0 0}
  .pick{text-align:center}

  /* ---- the result --------------------------------------------------------
   * The number is not the answer; what somebody can do is. So the band and the
   * sentence are set together and the digit is the small part. */
  .which{display:flex;gap:.6rem;margin:1.6rem 0 0}
  .which button{flex:1 1 0;min-width:0;border:1px solid var(--line);
    background:var(--raise);color:var(--ink);border-radius:1rem;
    padding:1.1rem .8rem;font-size:1.05rem;box-shadow:var(--shadow)}
  .which button:hover{border-color:var(--accent);color:var(--accent)}

  /* ---- the waiting list, under a result ------------------------------------
     Drawn by wait.js, which the public page also uses — but that page loads
     site.css and this one has never loaded anything but its own block, so the
     box is dressed here too. Same shape, so the two screens do not disagree
     about what it looks like. */
  /* THE FEED, OUT OF FOCUS. Grey blocks where the words are — see feedPeek in
     wait.js for why the words are not here at all. Fades out at the bottom so
     it reads as something continuing rather than a list that stopped. */
  .peek{margin:1.6rem 0 0}
  .peekhead{display:block;margin:0 0 .7rem;font-size:.72rem;font-weight:600;
    letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
  .peekstack{position:relative;filter:blur(3.5px);opacity:.75;
    -webkit-mask-image:linear-gradient(180deg,#000 0%,#000 52%,transparent 100%);
    mask-image:linear-gradient(180deg,#000 0%,#000 52%,transparent 100%);
    pointer-events:none;user-select:none}
  .peekpost{display:flex;gap:.7rem;padding:.75rem 0;align-items:flex-start}
  .peekav{flex:0 0 auto;width:2.1rem;height:2.1rem;border-radius:50%;
    background:var(--accent);opacity:.55}
  .peekwords{display:flex;flex-wrap:wrap;gap:.34rem .3rem;padding-top:.35rem}
  .peekwords b{display:block;height:.62rem;border-radius:.31rem;background:var(--ink);
    opacity:.16}
  @media (prefers-reduced-motion:reduce){.peekstack{filter:blur(3.5px)}}
  .waitbox{max-width:28rem;margin:2rem auto 0;padding:1.3rem 1.2rem 1.4rem;
    background:var(--card);border:1px solid var(--line);border-radius:1.2rem;
    text-align:left;box-shadow:var(--shadow)}
  /* WHICH ROOM. Four chips in a row that wraps to two — small enough that the
     question does not become the form. */
  .waitbox .waitask{margin:0 0 .55rem;font-size:.9rem;color:var(--ink-2)}
  .waitbox .waitrooms{display:flex;flex-wrap:wrap;gap:.45rem;margin:0 0 .3rem}
  .waitbox .waitrm{padding:.5rem .85rem;border:1px solid var(--line);border-radius:99px;
    background:var(--raise);color:var(--ink-2);font-size:.92rem}
  .waitbox .waitrm.on{background:var(--accent);border-color:var(--accent);
    color:var(--accent-ink)}
  .waitbox form{display:flex;flex-direction:column;gap:.6rem;margin:1.1rem 0 0}
  .waitbox input,.waitbox textarea{width:100%;padding:.75rem .9rem;font:inherit;
    font-size:1rem;border:1px solid var(--line);border-radius:.7rem;
    background:var(--paper);color:var(--ink);resize:vertical}
  /* The button that opens the form. Sits directly under the count with room
     around it — collapsed, this and the number are the whole box. */
  /* INVITE ONLY, then the figure. The eyebrow is small and wide-tracked so it
     reads as a stamp rather than a heading; the number is the largest thing in
     the box because it is the only evidence on the page that anybody else
     wants in. */
  .waiteyebrow{display:block;margin:0 0 .5rem;font-size:.72rem;font-weight:600;
    letter-spacing:.16em;text-transform:uppercase;color:var(--accent)}
  :root[data-lang="zh"] .waiteyebrow{letter-spacing:.08em;font-size:.78rem}
  .waitcount{display:flex;gap:.7rem;align-items:baseline;margin:.9rem 0 0}
  .waitcount b{font-family:var(--serif);font-weight:400;font-size:3.2rem;
    line-height:.9;color:var(--accent);font-variant-numeric:tabular-nums}
  .waitcount span{font-size:.95rem;line-height:1.35;color:var(--ink-2);
    white-space:pre-line}
  .waitbox .btn{width:100%;margin:.2rem 0 0;padding:.75rem 1rem;border:0;
    border-radius:99px;background:var(--accent);color:var(--accent-ink);
    font-size:1rem;font-weight:500}
  .waitbox .said{margin:.8rem 0 0;font-size:.92rem;color:var(--accent)}
  .waitbox .said.bad{color:var(--t5)}

</style>
</head>
<body>
<main>
  <p class="invite" id="invite"></p>
  <div class="bar">
    <a class="back" href="/browse" id="back" aria-label="Back">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 19l-7-7 7-7"/></svg>
    </a>
    <span id="langslot" style="margin-left:auto;display:flex"></span>
  </div>
  <div id="body"></div>
</main>

<script type="module">
import { T, lang, setLang, pickLang, langButton } from "/i18n.js";
import { waitBox, admitted, feedPeek } from "/wait.js";
import { CARDS, BANDS, CAN, STEPS, firstStep, nextStep } from "/level-cards.js";
import { stageFor, stageName, crownMark, crownOnCanvas } from "/crown.js";

const $ = (id) => document.getElementById(id);
const el = (t, c, x) => { const n = document.createElement(t); if (c) n.className = c;
  if (x !== undefined) n.textContent = x; return n; };
const fill = (n, ...kids) => { while (n.firstChild) n.removeChild(n.firstChild);
  for (const k of kids) if (k) n.appendChild(k); };
const P = (pair) => (Array.isArray(pair) ? pair[lang() === "zh" ? 1 : 0] : pair);

const IN_WECHAT = /micromessenger/i.test(navigator.userAgent);

/* The clipboard API where there is one and a secure context, an off-screen
 * textarea where there is not — which is most of the browsers this has to work
 * in. Same two routes as everywhere else on this board. */
function copyText(text) {
  try {
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text);
      return true;
    }
  } catch (e) { /* fall through */ }
  try {
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.setAttribute("readonly", "");
    ta.style.cssText = "position:absolute;left:-9999px;top:0";
    document.body.appendChild(ta);
    ta.select();
    ta.setSelectionRange(0, text.length);   // iOS ignores select() alone
    const ok = document.execCommand("copy");
    document.body.removeChild(ta);
    return ok;
  } catch (e) { return false; }
}

let device = "";
try { device = localStorage.getItem("board:device") || ""; } catch { /* private window */ }

const KEY = "board:level";
const load = () => { try { return JSON.parse(localStorage.getItem(KEY) || "null"); }
                     catch { return null; } };
const save = (r) => { try { localStorage.setItem(KEY, JSON.stringify(r)); } catch { /* fine */ } };

/* Whether the mark is already beside their name.
 *
 * Kept here rather than asked of the server: there are no accounts, the answer
 * is only used to choose between two sentences, and a page that has to wait on
 * a fetch to draw a caption is a page that draws late. It can be wrong after
 * somebody clears their browser, and the cost of that is one sentence offering
 * them something they already have.
 */
/* WHERE THE CLASS IS.
 *
 * Study Pal is not on this box. liuxuesheng.help resolves to an older machine
 * where it shares a container with Fern behind one Caddy, so a path that is
 * not deployed there does not 404 in Study Pal's voice — it 404s in Fern's,
 * with Fern's own navigation at the bottom of it. That is exactly what
 * happened when this pointed straight at /study: the route exists in Study
 * Pal's source and not yet in what is running.
 *
 * So the link goes to the front door, which is deployed, and DEEP stays false
 * until the lesson route is live on that machine. Flipping it is one word here
 * and nothing else — and until it is flipped the copy under the button says
 * what actually happens, because a card that promises a class at your level
 * and lands somewhere else is worse than one that says "open it and press
 * Take a lesson".
 */
const STUDYPAL = "https://liuxuesheng.help/";
const DEEP = false;
/* AND THE DOOR ITSELF IS SHUT. Pointing at the front page instead of /study
 * did not help: that host answers with a 404 carrying Fern's own navigation at
 * the bottom of it, which means the whole hostname is being served by Fern on
 * that shared box rather than by Study Pal. It is not a wrong path, it is a
 * wrong site — nothing in this repository can fix it, because the routing is
 * on the other machine.
 *
 * So the card is off. An offer whose button lands on somebody else's 404 costs
 * more than not making the offer: it is the first thing a new person presses
 * on the screen where they were just told something good about themselves.
 *
 * ON is the one word to flip back once liuxuesheng.help serves Study Pal
 * again, and DEEP is the second, once /study is deployed there.
 */
const CLASS_ON = false;
const classLink = (band) =>
  DEEP ? STUDYPAL + "study?lesson=1&level=" + encodeURIComponent(band) : STUDYPAL;

/* PK: A CHALLENGE THAT TRAVELS AS A LINK.
 *
 * No inbox, and nothing stored on the server. The challenge IS the address —
 * "?pk=zh8~Mei" is somebody's name and where they landed — so it goes wherever
 * a link goes: into a WeChat group, to a friend who has never opened this, to
 * three people at once. An inbox would only reach people already inside, which
 * is the half of the audience that does not need reaching.
 *
 * It is not evidence and does not pretend to be. Anybody can type a ten into
 * their own URL, and if two friends want to lie to each other about their
 * Chinese, this is not the thing standing in the way. What it has to do is
 * carry a name and a number into the four questions, and it does.
 */
function readPk() {
  try {
    const raw = new URLSearchParams(location.search).get("pk") || "";
    const m = /^(zh|en)(10|[1-9])~(.{1,24})$/.exec(raw.trim());
    return m ? { which: m[1], level: Number(m[2]), who: m[3] } : null;
  } catch { return null; }
}
const PK = readPk();

/** The link that carries this result to somebody else. */
const pkLink = (which, n, who) =>
  "/level?pk=" + which + n + "~" + encodeURIComponent(who);

/* The name to send it under. The one this browser already posts with, asked
   for once if there is not one yet — the same way a reply asks. */
function pkName() {
  let who = "";
  try { who = localStorage.getItem("board:who") || ""; } catch { /* private window */ }
  if (!who) who = (prompt(T("act.answerAs")) || "").trim();
  if (!who) return "";
  try { localStorage.setItem("board:who", who); } catch { /* fine */ }
  // The separator is the one character the link cannot carry in a name.
  return who.replace(/~/g, " ").slice(0, 24);
}

const PUTKEY = "board:levelput";
const putUp = () => { try { return localStorage.getItem(PUTKEY) === "1"; } catch { return false; } };

let RESULT = load();
let WHICH = "";          // "zh" or "en" — the language being ranked
let STATE = null;        // the search
let CARD = null;
/* What they came out at before this run, kept apart from RESULT because
   "Try again" clears RESULT to get back to the start — and clearing the thing
   that remembers last time is how "last time" quietly became blank on every
   retake, which is the one moment somebody most wants to see it. */
let LAST = RESULT ? { which: RESULT.which, level: Number(RESULT.level) || 0 } : null;
let BEGAN = 0;           // when they started, for the one honest number on the result
let MISSED = [];         // the cards that were above them
/* Whether the result on screen was arrived at just now, rather than read back
   from the last visit. Only a run that happened decides whether a mark is new:
   a page reopened a week later showing "new mark" would be a lie the second
   time it was read. */
let JUST = false;

const shuffle = (xs) => {
  const out = xs.slice();
  for (let i = out.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [out[i], out[j]] = [out[j], out[i]];
  }
  return out;
};

/** One of the three at this level, and its options in an order nobody can
 *  learn: the right answer is not always in the same place. */
function drawCard() {
  const pool = CARDS[WHICH][STATE.level - 1];
  const c = pool[Math.floor(Math.random() * pool.length)];
  CARD = { ...c, options: shuffle([c.a, ...c.w]) };
}

function start(which) {
  WHICH = which;
  STATE = firstStep();
  BEGAN = Date.now();
  MISSED = [];
  drawCard();
  try { if (window.lx) window.lx("level-start"); } catch { /* not fatal */ }
  paint();
}

function answer(pick) {
  const right = pick === CARD.a;
  // Kept for the end of the run: these are the cards from the levels the
  // search ruled out above them, which is the useful half of a wrong answer.
  if (!right) MISSED.push({ q: CARD.q, a: CARD.a });
  const next = nextStep(STATE, right);
  if (next.done) {
    RESULT = {
      at: new Date().toISOString(), which: WHICH, level: next.level,
      secs: Math.max(1, Math.round((Date.now() - BEGAN) / 1000)),
      missed: MISSED.slice(0, 4),
      // What they came out at before today, so the result can say whether
      // anything moved. Zero the first time, which is not a number to show.
      was: LAST && LAST.which === WHICH ? LAST.level : 0,
    };
    JUST = true;
    LAST = { which: WHICH, level: RESULT.level };
    save(RESULT);
    try { if (window.lx) window.lx("level-done"); } catch { /* not fatal */ }
    STATE = null;
  } else {
    STATE = next;
    drawCard();
  }
  paint();
}


/* SHARING THE TEST ITSELF, before anybody has taken it.
 *
 * A result is worth sending because of what it says about the sender; the test
 * is worth sending because of what it asks of the person who gets it. They are
 * different shares and the second one is the one that brings somebody new —
 * which is the whole of how this board grows, since there is no feed to be
 * recommended by and no app store to be found in.
 *
 * So it is on the first screen, where somebody who has not started yet can
 * send it to the friend they were going to compare with anyway.
 */
function inviteTo(path, words, btn, labelKey) {
  const url = location.origin + path;
  // Whatever this button says, it says again afterwards. It was hardcoded to
  // "Send this to a friend", which is wrong on every other button that shares.
  const back = (w, hold) => {
    btn.textContent = w;
    setTimeout(() => { btn.textContent = T(labelKey || "share.invite"); }, hold || 2200);
  };
  // Inside WeChat a page may not open a share sheet — the ⋯ menu is the only
  // way — so the honest version is the clipboard and where the real control is.
  if (IN_WECHAT) {
    back(T(copyText(words + " " + url) ? "act.wxCopied" : "act.wxUseMenu"), 3600);
    return;
  }
  if (navigator.share) {
    navigator.share({ title: T("site.title"), text: words, url })
      .catch(() => { /* dismissed is not a failure */ });
    return;
  }
  back(T(copyText(words + " " + url) ? "act.copied" : "act.copyFail"));
}

function drawIntro(box) {
  /* ARRIVING ON A CHALLENGE.
   *
   * Somebody who opened this from a friend's message is not choosing between
   * two tests — they are answering one. So the two language buttons collapse
   * into the one that matches the challenge, and the other stays reachable
   * underneath for anybody who followed the link and wants their own thing.
   */
  if (PK) {
    const c = el("div", "pkcard");
    c.append(el("p", "pkcap", T("pk.title")));
    c.append(el("p", "pkfrom", T("pk.from", {
      who: PK.who, n: PK.level,
      lang: T(PK.which === "zh" ? "crown.zh" : "crown.en"),
    })));
    c.append(el("p", "pkbeat", T("pk.beat")));
    const go = el("button", "go wide", T("pk.take"));
    go.type = "button";
    go.addEventListener("click", () => start(PK.which));
    c.append(go);
    const other = PK.which === "zh" ? "en" : "zh";
    const alt = el("button", "pkalt", T("pk.other", {
      lang: T(other === "zh" ? "crown.zh" : "crown.en"),
    }));
    alt.type = "button";
    alt.addEventListener("click", () => start(other));
    c.append(alt);
    box.append(c);
    box.append(el("p", "note", T("lvl.honest")));
    return;
  }

  box.append(el("p", "eyebrow", T("lvl.eyebrow")));
  box.append(el("h1", null, T("lvl.title")));
  box.append(el("p", "lede", T("lvl.lede")));
  box.append(el("p", "lede lean", T("lvl.how")));
  const row = el("div", "which");
  for (const [w, key] of [["zh", "lvl.myChinese"], ["en", "lvl.myEnglish"]]) {
    const b = el("button", null, T(key));
    b.type = "button";
    b.addEventListener("click", () => start(w));
    row.append(b);
  }
  box.append(row);
  const inv = el("button", "quiet wide", T("share.invite"));
  inv.type = "button";
  inv.addEventListener("click", () => inviteTo("/level", T("share.inviteLevel"), inv));
  box.append(inv);
  box.append(el("p", "note", T("lvl.honest")));
  if (RESULT) {
    const again = el("p", "note", T("lvl.had", { n: RESULT.level }));
    box.append(again);
  }
}

/* HEARING THE CARD.
 *
 * The browser's own voice, not a request. speechSynthesis is on every phone
 * this has to work on, costs nothing, needs no key on a public page and works
 * with the network having a bad minute — which is the whole argument, because
 * the alternative is an audio file per card fetched from a box in Tokyo.
 *
 * Never on its own. Audio that starts without being asked for is the reason
 * people mute a page, and iOS will not allow it without a tap anyway.
 *
 * The button is only offered where there is a voice for the language: hiding
 * it is better than a control that does nothing, and a phone with no Chinese
 * voice installed is a real phone somebody is holding.
 */
const canSpeak = () => typeof window !== "undefined" && "speechSynthesis" in window;

function voiceFor(tag) {
  if (!canSpeak()) return null;
  const want = tag.slice(0, 2).toLowerCase();
  // Loaded asynchronously in most browsers, so this is asked each time rather
  // than once at startup — the first call often returns an empty list.
  const all = window.speechSynthesis.getVoices() || [];
  return all.find((v) => String(v.lang || "").toLowerCase().startsWith(want)) || null;
}

function say(text, tag) {
  if (!canSpeak()) return;
  try {
    window.speechSynthesis.cancel();      // a second tap restarts rather than queues
    const u = new SpeechSynthesisUtterance(text);
    u.lang = tag;
    const v = voiceFor(tag);
    if (v) u.voice = v;
    // Slower than speech, because this is a word being learned rather than a
    // sentence being read.
    u.rate = 0.85;
    window.speechSynthesis.speak(u);
  } catch { /* a browser that has the object but not the voice */ }
}

function drawAsk(box) {
  box.append(el("p", "count", T("lvl.count", { n: STATE.asked + 1, total: STEPS })));
  const track = el("div", "track");
  const bar = el("i");
  bar.style.width = Math.round((STATE.asked / STEPS) * 100) + "%";
  track.append(bar);
  box.append(track);

  const tag = WHICH === "zh" ? "zh-CN" : "en-US";
  const word = el("p", "word", CARD.q);
  box.append(word);
  if (voiceFor(tag)) {
    const hear = el("button", "hear");
    hear.type = "button";
    hear.setAttribute("aria-label", T("lvl.hear"));
    const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    svg.setAttribute("viewBox", "0 0 24 24");
    svg.setAttribute("aria-hidden", "true");
    for (const d of ["M4 9.5h3.5L12 5.5v13L7.5 14.5H4z", "M16 9.2a4 4 0 0 1 0 5.6",
                     "M18.8 6.4a8 8 0 0 1 0 11.2"]) {
      const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
      path.setAttribute("d", d);
      svg.append(path);
    }
    hear.append(svg, el("span", null, T("lvl.hear")));
    hear.addEventListener("click", () => say(CARD.q, tag));
    box.append(hear);
  }
  const picks = el("div", "picks");
  for (const opt of CARD.options) {
    const b = el("button", "pick", opt);
    b.type = "button";
    b.addEventListener("click", () => answer(opt));
    picks.append(b);
  }
  box.append(picks);
  box.append(el("p", "note", T("lvl.guess")));
}


/* PUTTING A RESULT ON THE FEED.
 *
 * A result somebody is pleased with is the one thing they will happily write a
 * post about, and a board with four people on it needs posts more than it
 * needs anything else. So the button is here, on the screen where they have
 * just been told something about themselves.
 *
 * It posts as them, under their own name — not as the house and not
 * anonymously. Their name is the one this browser already posts under; if
 * there is not one yet it is asked for once, the same way a reply asks.
 */
/* `go` is where the picture takes a reader who taps it, and `pic` is the card
 * drawn above. Both are optional: a post with neither is still a post. */
async function toFeed(words, topic, btn, say, go, pic) {
  let who = "";
  try { who = localStorage.getItem("board:who") || ""; } catch { /* private window */ }
  if (!who) who = (prompt(T("act.answerAs")) || "").trim();
  if (!who) return;
  try { localStorage.setItem("board:who", who); } catch { /* fine */ }

  btn.disabled = true;
  btn.textContent = T("act.sending");
  try {
    const r = await fetch("/api/post", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ note: words, handle: who, topic, device,
        go: go || "",
        photo: pic ? pic.data : "", photoType: pic ? pic.type : "" }),
    });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(d.error || "no");
    // Held and published are different outcomes and the words say which. A
    // post that is waiting and does not say so reads as one that failed.
    say.className = "said ok";
    say.textContent = T(d.state === "published" ? "share.up" : "act.replyHeld");
    btn.hidden = true;
  } catch {
    btn.disabled = false;
    btn.textContent = T("act.again");
  }
}


/* THE PICTURE THAT GOES WITH A RESULT.
 *
 * Drawn here, on a canvas, and sent up as the post's photograph — so the feed
 * carries a card somebody stops at rather than another paragraph of text.
 *
 * Why not a file on the server: there are sixteen type codes and twenty level
 * results, in two languages, and every one of them would need making, storing
 * and keeping in step with the words. The browser has the result and can draw
 * it in a millisecond, and the bytes it makes are the same bytes a photograph
 * would be.
 *
 * 1000x1000. Square survives every crop a chat app applies to a shared image,
 * and the feed shows it full width either way.
 */
function resultPicture(draw) {
  const S = 1000;
  const c = document.createElement("canvas");
  c.width = S; c.height = S;
  const x = c.getContext("2d");
  if (!x) return null;

  // Read the page's own tokens, so the card is the same colour as the app it
  // came from — including when somebody takes the test in the dark.
  const css = getComputedStyle(document.documentElement);
  const tok = (n, fallback) => (css.getPropertyValue(n) || "").trim() || fallback;
  const paper = tok("--paper", "#EEF0F4");
  const ink = tok("--ink", "#151B28");
  const muted = tok("--muted", "#8A939F");
  const accent = tok("--accent", "#3F68D8");
  const line = tok("--line", "#E3E6EC");
  const serif = 'Georgia, "Songti SC", "Noto Serif CJK SC", serif';
  const sans = '-apple-system, "PingFang SC", "Noto Sans SC", sans-serif';

  x.fillStyle = paper;
  x.fillRect(0, 0, S, S);
  draw({ x, S, paper, ink, muted, accent, line, serif, sans });

  // The board's own name along the bottom, because this picture will be seen
  // in places that do not say where it came from.
  x.fillStyle = muted;
  x.font = "28px " + sans;
  x.textAlign = "center";
  x.fillText("liuxuesheng.io", S / 2, S - 54);

  try {
    const url = c.toDataURL("image/jpeg", 0.9);
    const comma = url.indexOf(",");
    return comma < 0 ? null : { data: url.slice(comma + 1), type: "image/jpeg" };
  } catch { return null; }
}

/** A rounded rectangle, since older webviews have no roundRect. */
function pill(x, left, top, w, h, r) {
  x.beginPath();
  x.moveTo(left + r, top);
  x.arcTo(left + w, top, left + w, top + h, r);
  x.arcTo(left + w, top + h, left, top + h, r);
  x.arcTo(left, top + h, left, top, r);
  x.arcTo(left, top, left + w, top, r);
  x.closePath();
}

/* THE CARD THE RESULT IS SHARED AS.
 *
 * The same object as the screen it came from: medallion, headline, ten stops,
 * and the sentence about what you can do — in that order, because somebody who
 * has seen one and then the other should not have to work out that they are
 * the same result. When the screen changed and this did not, the feed carried
 * a card nobody recognised from the page that made it.
 */
function levelPicture(w, n, band, can) {
  return resultPicture(({ x, S, paper, ink, muted, accent, line, serif, sans }) => {
    x.textAlign = "center";

    /* Hand-wrapped, since canvas has no line breaking. Returns where it got
       to, so the block underneath starts below the text rather than on top of
       a second line that was not there yesterday. */
    const wrap = (text, y, font, colour, width, step) => {
      x.font = font;
      x.fillStyle = colour;
      const words = String(text || "").split(" ");
      let row = "", at = y;
      for (const word of words) {
        const test = row ? row + " " + word : word;
        if (x.measureText(test).width > width && row) {
          x.fillText(row, S / 2, at);
          at += step; row = word;
        } else { row = test; }
      }
      if (row) { x.fillText(row, S / 2, at); at += step; }
      return at;
    };

    // The medallion, drawn as it is on the screen: the mark in a soft disc
    // with a ring round it.
    const cy = 200, r = 82;
    x.beginPath();
    x.arc(S / 2, cy, r, 0, Math.PI * 2);
    x.fillStyle = line;
    x.fill();
    x.lineWidth = 5;
    x.strokeStyle = accent;
    x.stroke();
    crownOnCanvas(x, Math.ceil(n / 2), S / 2 - 47, cy - 44, 94, accent);

    // "Upper intermediate — Level 8 of 10", which is the whole answer.
    const after = wrap(T("lvl.headline", { band, n }), 372, "62px " + serif, ink, S - 150, 76);

    const dots = 10, dr = 11, gap = 40;
    const left = S / 2 - ((dots - 1) * gap) / 2;
    for (let i = 1; i <= dots; i++) {
      x.beginPath();
      x.arc(left + (i - 1) * gap, after + 26, dr, 0, Math.PI * 2);
      x.fillStyle = i <= n ? accent : line;
      x.fill();
    }

    /* What they can do, in the tinted block it sits in on the screen. Measured
       first so the block is the height of its own text: a fixed box either
       clips the long sentences or leaves a hole under the short ones. */
    const top = after + 76;
    x.font = "44px " + serif;
    const words = String(can || "").split(" ");
    let row = "", lines = 1;
    for (const word of words) {
      const test = row ? row + " " + word : word;
      if (x.measureText(test).width > S - 300 && row) { lines++; row = word; } else { row = test; }
    }
    const step = 62;
    const boxH = 62 + lines * step;
    const mid = top + boxH / 2;
    pill(x, 80, top, S - 160, boxH, 30);
    x.fillStyle = line;
    x.fill();
    // The tick and the sentence both centred on the block rather than hung
    // from its top: one line was sitting high with a hole underneath it.
    x.beginPath();
    x.arc(146, mid, 30, 0, Math.PI * 2);
    x.fillStyle = accent;
    x.fill();
    x.strokeStyle = paper;
    x.lineWidth = 6;
    x.lineCap = "round";
    x.lineJoin = "round";
    x.beginPath();
    x.moveTo(132, mid);
    x.lineTo(143, mid + 11);
    x.lineTo(161, mid - 12);
    x.stroke();
    wrap(can, mid - ((lines - 1) * step) / 2 + 16, "44px " + serif, ink, S - 300, step);

    // The invitation, on the picture itself — a card in a chat is seen by
    // people who never opened the app, and the post makes it tappable.
    x.fillStyle = accent;
    x.font = "36px " + sans;
    x.fillText(T("share.cardTap"), S / 2, 880);
  });
}

function drawResult(box) {
  const n = RESULT.level;
  const w = RESULT.which;
  /* THE RESULT, AS ONE CARD.
   *
   * Read top to bottom it answers four questions in the order somebody asks
   * them: what am I, what does that let me do, how did the run go, and what
   * changed. Everything on it is measured or stored — there is no score here
   * and there is not going to be one, for the reason under the stats.
   */
  /* THE PK, ABOVE THE RESULT.
   *
   * They came here because somebody said a number at them, so the answer to
   * that goes first and their own result underneath it. Both levels, side by
   * side, and one line saying which way it went — no percentages, because two
   * four-question placements are not a scoreline.
   *
   * Only when the languages match. Somebody who took the challenge in English
   * against a Chinese level has two facts, not a comparison, and saying who
   * won would be inventing a result out of two different tests.
   */
  if (PK && PK.which === w) {
    const pk = el("div", "pkres");
    pk.append(el("p", "pkcap", T("pk.title")));
    const pair = el("div", "pkpair");
    const side = (name, num, mine) => {
      const d = el("div", mine ? "pkside me" : "pkside");
      d.append(el("b", null, String(num)));
      d.append(el("span", null, name));
      return d;
    };
    pair.append(side(PK.who, PK.level, false));
    pair.append(el("i", "pkv", "\u2013"));
    pair.append(side(T("pk.you"), n, true));
    pk.append(pair);
    pk.append(el("p", "pkverdict", n > PK.level ? T("pk.won")
      : n < PK.level ? T("pk.lost", { who: PK.who }) : T("pk.tie")));

    // Straight back into the same chat, with their own number on it.
    const back = el("button", "go wide", T("pk.back"));
    back.type = "button";
    back.addEventListener("click", () => {
      const who = pkName();
      if (!who) return;
      inviteTo(pkLink(w, n, who),
        T("pk.words", { n, lang: T(w === "zh" ? "crown.zh" : "crown.en") }),
        back, "pk.back");
    });
    pk.append(back);
    box.append(pk);
  }

  const stage = Math.ceil(n / 2);
  const card = el("div", "rcard");

  const medal = el("div", "medal");
  medal.append(crownMark(stage, "2.9rem"));
  card.append(medal);

  card.append(el("h1", "head1", T("lvl.headline", { band: P(BANDS[w][n - 1]), n })));

  const dots = el("div", "dots");
  for (let i2 = 1; i2 <= 10; i2++) {
    dots.append(el("i", i2 === n ? "on here" : (i2 < n ? "on" : "")));
  }
  card.append(dots);

  /* NOTHING ABOUT LEARNING CHINESE NEXT TO THE INVITE.
   *
   * This board is a place for people connecting in China, not a language app,
   * and the test is the way in rather than the thing being sold. Everything on
   * a stranger's result that frames it as a language product — the mark's
   * name and its language, what two more levels unlocks, what they can order
   * in a shop, the HSK band — is a pitch for a different product, made at the
   * exact moment they are deciding about this one.
   *
   * What is left is their number and the dots. That is their result, which is
   * what they came for and what they will screenshot; underneath it is the
   * board out of focus and the way in. Members keep all of it. */
  if (ADMITTED) {
    card.append(el("p", "markname", stageName(stage)
      + " \u00b7 " + T(w === "zh" ? "crown.zh" : "crown.en")));
    card.append(el("p", "marknext", T(stage >= 5 ? "crown.top" : "crown.next")));
  }

  /* WHAT THEY CAN DO, which is the half of a result anybody actually wanted.
     The sentence is already written per level; its first clause is the heading
     and whatever follows is the description, so one string serves both without
     a second one to keep in step. */
  const can = P(CAN[w][n - 1]);
  const cut = can.indexOf(". ");
  const did = el("div", "did");
  const tick = el("div", "tick");
  const tsvg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  tsvg.setAttribute("viewBox", "0 0 24 24");
  tsvg.setAttribute("aria-hidden", "true");
  const tp = document.createElementNS("http://www.w3.org/2000/svg", "path");
  tp.setAttribute("d", "M5 12.6 10 17.4 19.4 7.4");
  tsvg.append(tp);
  tick.append(tsvg);
  const didsay = el("div", "didsay");
  didsay.append(el("p", "cap", T("lvl.canNow")));
  didsay.append(el("h2", null, cut < 0 ? can : can.slice(0, cut + 1)));
  if (cut >= 0) didsay.append(el("p", null, can.slice(cut + 2)));
  did.append(tick, didsay);
  // "What you can do now" is what you can do in a SHOP. Members only — see
  // the note above the mark name.
  if (ADMITTED) card.append(did);

  /* THREE FACTS, AND NOT A SCORE.
   *
   * The obvious thing to put here is accuracy, and it would be the worst
   * number on the page. This is a binary search: somebody placed correctly
   * gets about half of them wrong BY DESIGN, because a wrong answer is how the
   * range halves. "2 of 4" printed under the word Score reads as fifty per
   * cent to every person alive, and would make a correct result look like a
   * failed one.
   *
   * So: how long it took, which is measured; the band on the scale they are
   * actually asked about, hedged with the word Roughly because four questions
   * point at a band rather than place anybody on one; and what they came out
   * at last time, which is the only real progress this app can show.
   */
  const rough = w === "zh"
    ? T(n <= 3 ? "lvl.hsk1" : n <= 7 ? "lvl.hsk23" : "lvl.hsk4")
    : ["A1", "A1", "A2", "A2", "B1", "B1", "B2", "B2", "C1", "C1"][n - 1];
  const secs = Number(RESULT.secs) || 0;
  const stats = el("div", "stats");
  const stat = (value, label) => {
    const d = el("div");
    d.append(el("b", null, value));
    d.append(el("span", null, label));
    stats.append(d);
  };
  if (secs) {
    stat(Math.floor(secs / 60) + ":" + String(secs % 60).padStart(2, "0"), T("lvl.stTime"));
  }
  stat(rough, T("lvl.stRough"));
  if (RESULT.was) stat(T("lvl.stWasN", { n: RESULT.was }), T("lvl.stWas"));
  // The HSK band is the plainest statement on the page that this is a
  // language product. Members only.
  if (ADMITTED) card.append(stats);

  /* Only when a run just happened AND it moved them into a different mark.
     A ribbon that fires on every result is a ribbon nobody reads twice. */
  if (JUST && RESULT.was && Math.ceil(RESULT.was / 2) !== stage) {
    const un = el("div", "unlock");
    un.append(crownMark(stage, "1.6rem"));
    const uns = el("div");
    uns.append(el("b", null, T("crown.newMark", { name: stageName(stage) })));
    uns.append(el("span", null, T("crown.newMarkWhy")));
    un.append(uns);
    card.append(un);
  }

  /* Four answers cannot be more certain than four answers. Inside the card and
     directly under the number, because a rank printed bare invites somebody to
     defend it — and a qualification below the fold is one nobody reads. */
  /* The caveat is honesty about a number a MEMBER is going to carry around.
     For somebody who has not come in yet it is the fourth block of small type
     on a screen asking them to make one decision. */
  if (ADMITTED) card.append(el("p", "caveat", T("lvl.rough")));
  box.append(card);
  /* "It appears beside your name once your level is on your page" is a
     sentence about a page a stranger does not have. Members only. */
  if (ADMITTED) box.append(el("p", "wornnote", T(putUp() ? "crown.is" : "crown.shown")));

  /* WHAT THE NUMBER IS FOR.
   *
   * Somebody who has just been told they are a four wants the next hour, not
   * the number. Study Pal writes that hour already — a short conversation in a
   * situation they will stand in, the words lifted out of it, then two more
   * ways to use them — and it takes the level as a parameter, so the link can
   * carry this result straight into it.
   *
   * Only for Chinese. Study Pal teaches Chinese to foreigners and has nothing
   * to offer somebody who just ranked their English; sending them anyway would
   * be the app talking about itself rather than about them.
   *
   * Ten levels into its three, and the band is named here in the same words it
   * uses at the other end — a link that lands on "Getting by" after promising
   * something else reads as the wrong link.
   */
  if (CLASS_ON && w === "zh") {
    const band = n <= 3 ? "new" : n <= 7 ? "getting_by" : "comfortable";
    const named = band === "new" ? "lvl.spNew"
                : band === "getting_by" ? "lvl.spGetting" : "lvl.spComfortable";

    const k = el("div", "klass");
    k.append(el("p", "nextup", T("lvl.nextUp")));
    k.append(el("h2", null, T("lvl.classTitle")));
    k.append(el("p", "at", T(named)));
    k.append(el("p", null, T(DEEP ? "lvl.classSay" : "lvl.classSayDoor", { band: T(named) })));

    const go = el("a", "go", T("lvl.classGo"));
    go.href = classLink(band);
    // Another site, so another tab: somebody who came here from a friend's
    // message should still have this page when they come back.
    go.target = "_blank";
    go.rel = "noopener";
    k.append(go);
    k.append(el("p", "away", T("lvl.classAway")));
    box.append(k);
  }

  /* THE CARDS THAT WERE ABOVE THEM.
   *
   * The reference screen this follows calls the same section "review your
   * mistakes", and that framing would be wrong here: in a search that halves
   * the range on every answer, the ones somebody got wrong are the ones from
   * the levels above the one they landed on. Getting them wrong is the
   * instrument working. Shown as what they are — the next rung — with the
   * answer, and the same voice button the questions had, because a word you
   * nearly knew is the one worth hearing said properly.
   */
  /* NOT FOR A STRANGER. The rungs above somebody's level are a lesson, and a
     lesson is for a member — it is the reason to come back, and it belongs
     behind the door with everything else that is. Somebody who arrived from a
     WeChat message wants their level and then the one decision this page is
     asking them to make; a column of vocabulary between those two is the page
     teaching when it should be inviting. */
  const missed = ADMITTED && Array.isArray(RESULT.missed) ? RESULT.missed : [];
  if (missed.length) {
    const tag = w === "zh" ? "zh-CN" : "en-US";
    const ab = el("div", "above");
    ab.append(el("p", "cap", T("lvl.above")));
    for (const m of missed) {
      const row = el("div", "arow");
      const words = el("div", "aw");
      words.append(el("b", null, m.q));
      words.append(el("span", null, m.a));
      row.append(words);
      if (voiceFor(tag)) {
        const h = el("button", "ahear");
        h.type = "button";
        h.setAttribute("aria-label", T("lvl.hear"));
        h.textContent = "\u25b6";
        h.addEventListener("click", () => say(m.q, tag));
        row.append(h);
      }
      ab.append(row);
    }
    ab.append(el("p", "awhy", T("lvl.aboveWhy")));
    box.append(ab);
  }

  const feedRow = el("div", "row");
  /* Quiet, now that the class above it is the loud one. Two full-width accent
     buttons in a column is a screen that has not decided what it wants, and
     between "learn something" and "tell everybody" the first is what somebody
     who just found out their level came for. */
  const toBoard = el("button", "quiet wide", T("share.feed"));
  toBoard.type = "button";
  const fsaid = el("p", "said");
  toBoard.addEventListener("click", () => toFeed(
    T(w === "zh" ? "share.levelZh" : "share.levelEn",
      { n, band: P(BANDS[w][n - 1]), can: P(CAN[w][n - 1]) }),
    "Tests", toBoard, fsaid, "/level",
    levelPicture(w, n, P(BANDS[w][n - 1]), P(CAN[w][n - 1]))));
  /* A STRANGER GETS THE LIST INSTEAD OF THE BUTTONS.
   *
   * This page is outside the door — it is what a shared result links to, and
   * the point is that anybody can take it. But everything below here posts to
   * a feed they cannot read, so for them it is replaced by the one thing that
   * is any use: their result, and a way onto the list under it. */
  if (!ADMITTED) {
    /* WHAT IS BEHIND THE DOOR, SHOWN RATHER THAN DESCRIBED. A paragraph
       saying "there is a board in here with people on it" is a claim; five
       posts out of focus is the thing itself, and it is read in a glance
       instead of a sentence. No words in it — see feedPeek. */
    if (PEEK.length) box.append(feedPeek(PEEK, T("peek.head")));
    box.append(waitBox());
    return;
  }

  feedRow.append(toBoard);
  box.append(feedRow);
  /* What the post will look like, in one line, before they press it. The
     button names the thing; this says what lands. */
  box.append(el("p", "feedwhat", T("share.feedLvl")));
  box.append(fsaid);

  /* AND THE WAY THIS TRAVELS. A result is worth sending because of what it
     says about the sender — so the challenge sits beside the feed post rather
     than under it, and it reaches the group chat the feed cannot. */
  if (!(PK && PK.which === w)) {
    const pkgo = el("button", "quiet wide", T("pk.challenge"));
    pkgo.type = "button";
    pkgo.addEventListener("click", () => {
      const who = pkName();
      if (!who) return;
      inviteTo(pkLink(w, n, who),
        T("pk.words", { n, lang: T(w === "zh" ? "crown.zh" : "crown.en") }),
        pkgo, "pk.challenge");
    });
    box.append(pkgo);
  }

  const row = el("div", "row");
  const again = el("button", "quiet", T("lvl.again"));
  again.type = "button";
  again.addEventListener("click", () => { RESULT = null; paint(); });
  const done = el("a", "quiet", T("type.done"));
  done.href = "/browse";
  row.append(again, done);
  box.append(row);

  const put = el("button", "quiet wide", T("lvl.put"));
  put.type = "button";
  const say = el("p", "said");
  put.addEventListener("click", async () => {
    put.disabled = true;
    put.textContent = T("me.working");
    try {
      const out = await fetch("/api/me", {
        method: "PUT", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ device, levelBand: (w === "zh" ? "ZH" : "EN") + " " + n }),
      }).then((x) => x.json());
      if (out && out.person) {
        try { localStorage.setItem(PUTKEY, "1"); } catch { /* fine */ }
        say.className = "said ok";
        say.textContent = T("type.puton");
        put.hidden = true;
        return;
      }
    } catch { /* fall through */ }
    put.disabled = false;
    put.textContent = T("act.again");
  });
  box.append(put, say);
  box.append(el("p", "note", T("lvl.honest")));
}

function paint() {
  $("invite").textContent = T("site.invite");
  const box = $("body");
  fill(box);
  if (STATE) drawAsk(box);
  else if (RESULT) drawResult(box);
  else drawIntro(box);
  window.scrollTo(0, 0);
}

/* The voice list is empty on the first call in most browsers and arrives a
 * moment later, so the card is drawn again when it does — otherwise the button
 * is missing on the one card somebody sees first and present on every card
 * after it. */
if (canSpeak()) {
  window.speechSynthesis.addEventListener?.("voiceschanged", () => { if (STATE) paint(); });
}

/* Whether this browser is through the door, worked out once. The page draws
   the same either way until the result, where the difference is the whole
   point — see the note beside waitBox below. */
let ADMITTED = true;
// The shape of the newest posts, for the out-of-focus stack a stranger sees.
let PEEK = [];
/* Resolved on load, and the result is four questions away — so the answer is
   always in before anything depends on it. Defaulting to "in" rather than
   "out" is the safe way round: the worst case is a member seeing their own
   buttons a moment late, where the other way round would offer somebody the
   waiting list they are already on. */
admitted().then((yes) => { ADMITTED = yes; });
fetch("/api/hello").then((r) => r.json())
  .then((d) => { PEEK = Array.isArray(d && d.peek) ? d.peek : []; })
  .catch(() => { /* the box below still works without it */ });

setLang(pickLang());
$("langslot").append(langButton(paint));
$("back").setAttribute("aria-label", T("nav.back"));
paint();
</script>

<script>
if (!/[?&]nocount\b/.test(location.search)) {
  const c = document.createElement("script");
  c.src = "/a/lx.js"; c.defer = true;
  document.head.append(c);
}
</script>
