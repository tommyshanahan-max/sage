<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="/favicon.png" sizes="192x192">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#EEF0F4">
<meta name="theme-color" content="#0B0E15" media="(prefers-color-scheme: dark)">
<!-- iOS reads these rather than the manifest for a home-screen install:
     no browser chrome, and a name short enough not to be truncated under
     the icon. -->
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="留学生">
<title>Study buddies</title>
<meta name="description" content="Exchange students in China looking for someone to study with.">
<meta property="og:type" content="website">
<meta property="og:title" content="Study buddies">
<meta property="og:description" content="Say your level, what you are working towards and when you are free.">
<meta property="og:image" content="{{ORIGIN}}/share.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:url" content="{{ORIGIN}}/buddies">
<meta http-equiv="Cache-Control" content="no-cache">
<meta name="color-scheme" content="light dark">
<style>
  :root{
    --paper:#EEF0F4; --raise:#F7F8FB; --ink:#151B28; --ink-2:#4E5968;
    --muted:#8A939F; --line:#E3E6EC; --hair:#EAECF1;
    --accent:#3F68D8; --accent-ink:#FFFFFF; --accent-soft:#E8ECF7;
    --t1:#3F68D8; --t2:#2A9D63; --t3:#D99038; --t4:#7268C4; --t5:#D4485C; --t6:#2F8C9E;
    --serif:Georgia,"Songti SC","Noto Serif CJK SC",'Times New Roman',serif;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",
      "Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;
    --shadow:0 2px 6px rgba(21,27,40,.07),0 10px 28px rgba(21,27,40,.09);
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --paper:#0B0E15; --raise:#141924; --ink:#E9EDF5; --ink-2:#A3B0C4;
      --muted:#6F7D92; --line:#232B39; --hair:#1E2531;
      --accent:#5C8DFF; --accent-ink:#0B0E15; --accent-soft:#18233D;
      --t1:#5C8DFF; --t2:#4EBE88; --t3:#E4A65A; --t4:#9187E0; --t5:#F0687C; --t6:#4FA9BC;
      --shadow:0 2px 6px rgba(0,0,0,.4),0 12px 32px rgba(0,0,0,.34);
    }
  }
  :root[data-theme="dark"]{
    --paper:#0B0E15; --raise:#141924; --ink:#E9EDF5; --ink-2:#A3B0C4;
    --muted:#6F7D92; --line:#232B39; --hair:#1E2531;
    --accent:#5C8DFF; --accent-ink:#0B0E15; --accent-soft:#18233D;
    --t1:#5C8DFF; --t2:#4EBE88; --t3:#E4A65A; --t4:#9187E0; --t5:#F0687C; --t6:#4FA9BC;
    --shadow:0 2px 6px rgba(0,0,0,.4),0 12px 32px rgba(0,0,0,.34);
  }
  :root[data-lang="zh"]{
    --serif:"Songti SC","Noto Serif CJK SC","Source Han Serif SC","STSong",Georgia,serif;
    --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB",
      "Microsoft YaHei","Noto Sans SC","Segoe UI",sans-serif;
  }
  :root[data-lang="zh"] body{line-height:1.75}
  :root[data-lang="zh"] .rule span,
  :root[data-lang="zh"] .fact dt{text-transform:none;letter-spacing:.02em}
  [hidden]{display:none!important}

  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);
    font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
  main{max-width:34rem;margin:0 auto;padding:1.4rem 1.15rem 5rem}
  button{font:inherit;cursor:pointer}
  a{color:inherit}
  img{max-width:100%}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}

  .top{display:flex;align-items:center;gap:.8rem;margin:0 0 1.3rem}
  .top h1{margin:0;font-family:var(--serif);font-weight:400;font-size:1.75rem;line-height:1.1}
  .top p{margin:.15rem 0 0;font-size:.85rem;color:var(--muted)}
  .back{border:0;background:none;color:var(--ink);padding:.2rem;margin-left:-.3rem;
    display:grid;place-items:center;flex:0 0 auto}
  .back svg{width:1.5rem;height:1.5rem;stroke:currentColor;fill:none;stroke-width:1.8;
    stroke-linecap:round;stroke-linejoin:round}
  .lang{margin-left:auto;flex:0 0 auto;border:1px solid var(--line);background:var(--raise);
    color:var(--ink-2);border-radius:99px;padding:.42rem .9rem;font-size:.85rem;line-height:1}

  /* Whether you are in the list, and the one control that changes it. Above
     the list rather than in a settings screen, because being findable is the
     decision this page is actually about. */
  .mine{background:var(--raise);border:1px solid var(--line);border-radius:.8rem;
    padding:1rem 1.05rem;margin:0 0 1.4rem}
  .mine .row{display:flex;align-items:center;gap:.8rem}
  .mine b{font-family:var(--serif);font-weight:400;font-size:1.08rem;flex:1}
  .mine button{flex:0 0 auto;border:1px solid var(--line);background:var(--paper);
    color:var(--ink);border-radius:99px;padding:.5rem 1.1rem;font-size:.88rem}
  .mine button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
  .mine p{margin:.6rem 0 0;font-size:.82rem;line-height:1.55;color:var(--muted)}

  .rule{display:flex;align-items:center;gap:.9rem;margin:0 0 .3rem}
  .rule span{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;
    color:var(--muted);white-space:nowrap}
  .rule i{flex:1;height:1px;background:var(--line)}

  /* A person in the list. The same row the feed uses, so the two read as one
     product rather than two screens that happen to share a palette. */
  .who{display:flex;gap:.9rem;padding:1.2rem 0;border-bottom:1px solid var(--hair);
    width:100%;text-align:left;background:none;border-left:0;border-right:0;border-top:0;
    align-items:flex-start}
  .av{width:3.4rem;height:3.4rem;border-radius:50%;flex:0 0 auto;background:var(--accent);
    color:var(--accent-ink);display:grid;place-items:center;font-family:var(--serif);
    font-size:1.35rem;line-height:1;overflow:hidden;
    box-shadow:0 0 0 3px var(--paper),0 0 0 4px var(--accent-soft)}
  .av img{width:100%;height:100%;object-fit:cover;display:block}
  .m{flex:1;min-width:0}
  .nameline{display:flex;align-items:baseline;gap:.5rem}
  .nameline b{font-family:var(--serif);font-weight:400;font-size:1.15rem;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .nameline .lv{margin-left:auto;flex:0 0 auto;font-size:.72rem;letter-spacing:.05em;
    border:1px solid var(--line);border-radius:99px;padding:.16rem .55rem;color:var(--muted)}
  .where{margin:.15rem 0 0;font-size:.83rem;color:var(--muted)}
  .goal{margin:.45rem 0 0;font-family:var(--serif);font-size:1rem;line-height:1.5;
    color:var(--ink-2);overflow-wrap:anywhere}
  .days{display:flex;gap:.25rem;margin:.55rem 0 0;flex-wrap:wrap}
  .days b{width:1.75rem;height:1.75rem;display:grid;place-items:center;border-radius:.4rem;
    font-size:.72rem;font-weight:500;background:var(--paper);border:1px solid var(--line);
    color:var(--muted)}
  .days b.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

  .none{padding:3rem .5rem;text-align:center;color:var(--muted)}
  .none b{display:block;font-family:var(--serif);font-weight:400;font-size:1.3rem;
    color:var(--ink);margin:0 0 .4rem}
  .none p{margin:0 auto 1.3rem;max-width:26rem;font-size:.95rem;line-height:1.6}
  .none button{border:0;background:var(--accent);color:var(--accent-ink);border-radius:99px;
    padding:.75rem 1.6rem;font-size:1rem}

  /* A profile opens over the list rather than as its own page: you are
     comparing people, and losing your place in the list to read one of them
     is how somebody gives up halfway down. */
  .sheet{position:fixed;inset:0;z-index:40;display:flex;align-items:flex-end;
    background:rgba(21,27,40,.42)}
  .sheet .card{width:100%;max-width:34rem;margin:0 auto;background:var(--paper);
    border-radius:1.1rem 1.1rem 0 0;padding:1.4rem 1.15rem calc(1.4rem + env(safe-area-inset-bottom));
    box-shadow:var(--shadow);max-height:88vh;overflow-y:auto}
  .pf{display:flex;flex-direction:column;align-items:center;text-align:center}
  .pf .av{width:5.4rem;height:5.4rem;font-size:2.1rem;margin:0 0 .8rem}
  .pf h2{margin:0;font-family:var(--serif);font-weight:400;font-size:1.6rem;line-height:1.15}
  .pf .where{margin:.3rem 0 0;font-size:.9rem}
  .pf .goal{margin:1rem 0 0;text-align:left;width:100%;font-size:1.06rem}
  .fact{display:flex;gap:1rem;padding:.7rem 0;border-top:1px solid var(--hair);
    align-items:baseline;width:100%;text-align:left}
  .fact dt{flex:0 0 6.4rem;font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;
    color:var(--muted);margin:0}
  .fact dd{margin:0;flex:1;font-size:.95rem}
  .facts{margin:1.1rem 0 0;width:100%}
  .theirs{margin:1.2rem 0 0;width:100%;text-align:left}
  .theirs h3{margin:0 0 .5rem;font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;
    color:var(--muted);font-weight:600}
  :root[data-lang="zh"] .theirs h3{text-transform:none;letter-spacing:.02em}
  .theirs p{margin:0;padding:.6rem 0;border-top:1px solid var(--hair);
    font-family:var(--serif);font-size:1rem;line-height:1.5;color:var(--ink-2)}
  .theirs .no{color:var(--muted);font-family:var(--sans);font-size:.9rem}
  .pfacts{display:flex;gap:.5rem;margin:1.3rem 0 0;flex-wrap:wrap;width:100%}
  .pfacts button{flex:1;min-width:8rem;border:1px solid var(--line);background:var(--raise);
    color:var(--ink);border-radius:99px;padding:.65rem 1rem;font-size:.9rem}
  .pfacts button.warn{color:var(--t5);border-color:var(--line)}

  .safety{margin:2rem 0 0;padding:.95rem 1.05rem;background:var(--raise);
    border:1px solid var(--line);border-left:3px solid var(--t3);border-radius:.6rem;
    font-size:.86rem;line-height:1.6;color:var(--ink-2)}
</style>
</head>
<body>
<main>
  <div class="top">
    <button class="back" id="back" aria-label="Back">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 19l-7-7 7-7"/></svg>
    </button>
    <div>
      <h1 id="title"></h1>
      <p id="sub"></p>
    </div>
    <span id="langslot"></span>
  </div>

  <div class="mine" id="mine" hidden></div>

  <div class="rule"><span id="rulelabel"></span><i></i></div>
  <div id="list"></div>
  <div class="none" id="none" hidden></div>

  <p class="safety" id="safety"></p>
</main>

<div class="sheet" id="sheet" hidden>
  <div class="card" id="card"></div>
</div>
<div id="tail"></div>

<script type="module">
import { T, lang, setLang, pickLang, langButton } from "/i18n.js";

const $ = (id) => document.getElementById(id);
const el = (t, c, x) => { const n = document.createElement(t); if (c) n.className = c;
  if (x !== undefined) n.textContent = x; return n; };
const fill = (n) => { while (n.firstChild) n.removeChild(n.firstChild); };
const initial = (name) => (String(name || "?").trim()[0] || "?").toLowerCase();

let device = "";
try { device = localStorage.getItem("board:device") || ""; } catch { /* private window */ }

let PEOPLE = [], MINE = null;

async function load() {
  try {
    const [people, me] = await Promise.all([
      fetch("/api/people", { headers: device ? { "x-board-device": device } : {} }).then((r) => r.json()),
      fetch("/api/me", { headers: device ? { "x-board-device": device } : {} }).then((r) => r.json()),
    ]);
    PEOPLE = (people && people.people) || [];
    MINE = (me && me.person) || null;
  } catch { PEOPLE = []; MINE = null; }
  paint();
}

/** In or out of the list, which is the decision this page is about. */
async function setLooking(on) {
  await fetch("/api/me", {
    method: "PUT",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ device, looking: on }),
  });
  await load();
}

function paint() {
  $("title").textContent = T("bud.title");
  $("rulelabel").textContent = T("bud.title");
  $("safety").textContent = T("bud.safety");
  $("back").setAttribute("aria-label", T("bud.back"));

  const n = PEOPLE.length;
  $("sub").textContent = n === 1 ? T("bud.subOne") : T("bud.sub", { n });

  // Your own row first: whether you are findable, and the one tap that changes
  // it. Only shown once there is a profile to list — asking somebody with no
  // name to join a directory is asking the wrong question first.
  const mine = $("mine");
  if (MINE && MINE.handle) {
    fill(mine);
    mine.hidden = false;
    const row = el("div", "row");
    row.append(el("b", null, MINE.looking ? T("bud.youAreIn") : T("bud.lookingLabel")));
    const b = el("button", MINE.looking ? "on" : "", T(MINE.looking ? "bud.takeMeOut" : "bud.putMeIn"));
    b.type = "button";
    b.addEventListener("click", () => setLooking(!MINE.looking));
    row.append(b);
    mine.append(row, el("p", null, T("bud.lookingWhy")));
  } else {
    mine.hidden = true;
  }

  const box = $("list");
  fill(box);
  $("none").hidden = n > 0;
  if (!n) {
    fill($("none"));
    $("none").append(el("b", null, T("bud.empty.head")), el("p", null, T("bud.empty.body")));
    if (MINE && MINE.handle && !MINE.looking) {
      const go = el("button", null, T("bud.beFirst"));
      go.type = "button";
      go.addEventListener("click", () => setLooking(true));
      $("none").append(go);
    }
    return;
  }
  for (const q of PEOPLE) box.append(row(q));
}

function row(q) {
  // A link rather than a div: a directory you cannot open is a list of names.
  const a = document.createElement("a");
  a.className = "who";
  a.href = "/p/" + encodeURIComponent((q.handle || "").toLowerCase());
  a.style.textDecoration = "none";
  a.style.color = "inherit";

  const av = el("div", "av");
  if (q.photo) {
    const img = Object.assign(document.createElement("img"),
      { src: "/api/public-media?id=" + encodeURIComponent(q.photo), alt: "", loading: "lazy" });
    img.addEventListener("error", () => { img.remove(); av.textContent = initial(q.handle); });
    av.append(img);
  } else {
    av.textContent = initial(q.handle);
  }
  a.append(av);

  const m = el("div", "m");
  const nl = el("div", "nameline");
  nl.append(el("b", null, q.handle));
  if (q.level) nl.append(el("span", "lv", q.level));
  m.append(nl);

  const where = [q.campus, q.here].filter(Boolean).join(" · ");
  if (where) m.append(el("p", "where", where));
  if (q.goal) m.append(el("p", "goal", q.goal));

  // When they are free, as a week. A grid of seven says it faster than a
  // sentence, and it is the thing that decides whether it is worth asking.
  if (q.free && q.free.length) {
    const days = el("div", "days");
    T("bud.days").split(",").forEach((d, i) => {
      days.append(el("b", q.free.indexOf(i) >= 0 ? "on" : "", d));
    });
    m.append(days);
  }
  a.append(m);
  return a;
}

$("back").addEventListener("click", () => { location.href = "/feed"; });
setLang(pickLang());
$("langslot").append(langButton(paint));
load();
</script>

<script>
/* Registering the worker.
 *
 * Classic script rather than a module so this runs before anything else and
 * on browsers that do not do modules — the worker is what makes the board
 * survive a bad connection, which is exactly the browser least likely to be
 * new.
 *
 * Deferred to load: registration competes with the page's own requests, and
 * the first paint matters more than the second visit.
 */
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("/sw.js").catch(() => { /* not fatal */ });
  });
}
</script>
</body>
</html>
