<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<!-- Empty on every deployment but the demo board, where it pins this
     browser to the one seeded identity. See BOARD_DEMO_DEVICE in server.js. -->
{{DEMO}}
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="/favicon.png" sizes="192x192">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#EEF0F4">
<meta name="theme-color" content="#0B0E15" media="(prefers-color-scheme: dark)">
<title>交换 · 给经纪人</title>
<meta name="description" content="让经纪人直接对上艺人和导演。不只是国内。名额有限。">

<!-- THE CARD IS THE HALF THAT GETS READ.
     WeChat's crawler fetches this once and runs no JavaScript, so everything
     the page does with the language switch happens after the decision has
     already been made. It was English here while the page it opened was
     Chinese — which is the wrong way round twice over: the group this link is
     sent to reads Chinese, and the card is what they see first.
     Written, not translated. 名额有限 is the whole pitch in four characters. -->
<meta property="og:type" content="website">
<meta property="og:title" content="交换 · 名额有限">
<meta property="og:description" content="让经纪人直接对上艺人和导演，不只是国内。留个名字。">
<meta property="og:image" content="{{ORIGIN}}/share.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:url" content="{{HERE}}">
<meta name="twitter:card" content="summary_large_image">
<meta name="color-scheme" content="light dark">
<link rel="stylesheet" href="/site.css">

<style>
  /* ONE PAGE FOR ONE GROUP.
   *
   * Pasted into a WeChat group of two hundred agents, where the reader has
   * scrolled past forty other messages to get here and will give this about
   * eight seconds. So: who is talking and why they should be listened to, the
   * thing itself in one sentence, two pictures of it, and the form.
   *
   * NOT THE PUBLIC PAGE. That one is written for somebody who arrived on a
   * name they trust and already half wants in. This one is written for
   * somebody who was in a group chat about something else.
   *
   * The pictures are MOCK-UPS, drawn with invented people. Two hundred agents
   * is a public, and the twenty-three people actually on the board did not
   * agree to have their faces posted into it. Nothing here is a real member.
   */
  .aw{max-width:27rem;margin:0 auto;padding:2rem 1.15rem 3rem}
  .abrand{display:flex;align-items:center;gap:.6rem;margin:0 0 1.8rem}
  .abrand i{width:2.1rem;height:2.1rem;border-radius:.55rem;background:var(--ink);
    color:var(--paper);display:grid;place-items:center;font-style:normal;
    font:400 1rem/1 var(--serif)}
  .abrand b{font:400 1.05rem/1.15 var(--serif);color:var(--ink)}
  .abrand small{display:block;font-size:.7rem;color:var(--muted)}
  .abrand .l{margin-left:auto}

  .alede{font:400 clamp(1.7rem,7vw,2.3rem)/1.18 var(--serif);color:var(--ink);
    margin:0 0 .8rem;text-wrap:balance}
  .asub{font-size:1rem;line-height:1.65;color:var(--ink-2);margin:0 0 1rem}
  .asub b{color:var(--ink);font-weight:650}

  /* THE ONE SENTENCE, SET AS THE SENTENCE. The pills are what the app looks
     like, so the page says it in the app's own grammar rather than describing
     a feature. */
  .asay{margin:1.6rem 0 0;padding:1rem .95rem;background:var(--raise);
    border:1px solid var(--hair);border-radius:.85rem;
    display:flex;flex-wrap:wrap;align-items:center;gap:.4rem;
    font-size:1.05rem;line-height:1.9;color:var(--ink)}
  .asay em{font-style:normal;font-weight:650;font-size:.98rem;
    padding:.18rem .72rem;border-radius:99px;background:var(--accent-soft);
    color:var(--accent)}
  .asay b{font-weight:400;color:var(--ink-2)}

  /* ONE COLUMN ON A PHONE. Two app screenshots side by side on a 390px screen
     are 170px wide each, which is a picture of an interface rather than a
     readable one — and the whole reason they are here is that somebody can
     see the sentence on the card. */
  .ashots{display:grid;gap:1.2rem;margin:1.4rem 0 0}
  @media (min-width:560px){.ashots{grid-template-columns:1fr 1fr}}
  .ashots figure{min-width:0;margin:0}
  .ashots img{display:block;width:100%;border-radius:.8rem;
    border:1px solid var(--line)}
  .ashots figcaption{margin:.5rem 0 0;font-size:.78rem;line-height:1.5;
    color:var(--muted)}

  .arule{margin:1.8rem 0 0;padding-top:1.3rem;border-top:1px solid var(--hair)}
  .arule p{margin:0 0 .6rem;font-size:.95rem;line-height:1.6;color:var(--ink-2)}
  .arule p:last-child{margin-bottom:0}
  .arule b{color:var(--ink);font-weight:650}

  .aask{margin:2rem 0 0}
  .aask h2{margin:0 0 .9rem;font:400 1.35rem/1.2 var(--serif);color:var(--ink)}

  .ahas{display:block;margin:1.6rem 0 0;text-align:center;font-size:.82rem;
    color:var(--muted);text-decoration:none}
  .ahas b{color:var(--accent);font-weight:650}
</style>
</head>
<body>

<div class="aw">
  <div class="abrand">
    <i><svg viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="7" style="width:1em;height:1em;display:block" aria-hidden="true"><circle cx="38" cy="50" r="24"/><circle cx="62" cy="50" r="24"/></svg></i>
    <span><b>The Exchange</b><small>交换</small></span>
    <span class="l" id="langslot"></span>
  </div>

  <!-- IT OPENS ON A QUESTION THEY CANNOT ANSWER.
       This said "Agents, in front of the people casting" — true, and a
       description. Read in a group chat, a description is scrolled past. The
       question is the sell: every agent in that room knows the answer is not
       zero and has no way to find out what it is. Everything under it is
       there to be the answer. -->
  <h1 class="alede" id="aghead"></h1>

  <p class="asub" id="agp1"></p>
  <p class="asub" id="agp2"></p>

  <div class="asay">
    <b id="agsay1"></b> <em id="agsay2"></em>
    <b id="agsay3"></b> <em id="agsay4"></em>
  </div>
  <p class="asub" style="margin-top:.8rem" id="agafter"></p>

  <!-- THE PICTURES ARE IN A LANGUAGE TOO, and that was missed: the page moved
       to Chinese and the two screenshots of the app stayed in English, which
       is the one place on the page a reader would look to check the app is
       actually in their language. Swapped with everything else — see paint. -->
  <div class="ashots">
    <figure>
      <img id="agshot1" src="/a-browse.png" alt="" loading="lazy">
    </figure>
    <figure>
      <img id="agshot2" src="/a-say.png" alt="" loading="lazy">
    </figure>
  </div>

  <div class="arule">
    <p><b id="agruleA"></b> <span id="agruleB"></span></p>
  </div>

  <div class="aask">
    <h2 id="agask"></h2>
    <div id="waitslot"></div>
  </div>

  <a class="ahas" id="has" href="/enter"></a>
</div>

<script type="module">
import { T, lang, setLang, pickLang, langButton } from "/i18n.js";
import { waitBox, tally } from "/wait.js";

const $ = (id) => document.getElementById(id);

/* EVERY WORD ON THIS PAGE COMES FROM THE STRINGS.
 *
 * It was written once in English on the reasoning that it is one person
 * talking to one group. The group is Chinese. So the 中文 button moved the
 * form and left the page it was on in English, which is worse than either
 * language on its own — see ag.* in i18n.js. */
function paint() {
  document.title = T("ag.tab");
  document.documentElement.lang = lang();
  for (const k of ["head", "p1", "p2", "say1", "say2", "say3", "say4",
                   "after", "ruleA", "ruleB", "ask"]) {
    $("ag" + k).textContent = T("ag." + k);
  }
  const zh = lang() === "zh";
  $("agshot1").src = zh ? "/a-browse-zh.png" : "/a-browse.png";
  $("agshot2").src = zh ? "/a-say-zh.png" : "/a-say.png";
  $("agshot1").alt = T("ag.shot1");
  $("agshot2").alt = T("ag.shot2");
  $("has").textContent = "";
  $("has").append(document.createTextNode(T("join.has") + " "));
  const b = document.createElement("b");
  b.textContent = T("join.hasGo");
  $("has").append(b);
}

/* CHINESE UNLESS SOMEBODY HAS SAID OTHERWISE. This page is one link sent to
   one group, and that group is Chinese — an English default here is the app
   guessing wrong for almost everybody who opens it. A saved choice still wins
   inside pickLang, so the 中文 / EN switch sticks. */
setLang(pickLang("zh"));
paint();
$("langslot").append(langButton(() => {
  paint();
  $("waitslot").textContent = "";
  $("waitslot").append(waitBox());
}));

$("waitslot").append(waitBox());
tally("door");
</script>
</body>
</html>
