<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>订单</title>
<meta name="robots" content="noindex">
<!--
  ONE ORDER, IN THE FOUR WORDS SHE ALREADY KNOWS.

  待付款 · 待发货 · 待收货 · 完成 — see lib/shop.js. The screen is one state
  and what to do about it: a code to long-press while it is 待付款, a
  tracking number once it has gone, and nothing at all in between, because
  in between there is nothing for her to do.

  The code is a PNG, not a drawn grid — WeChat's 长按二维码识别 reads a QR
  out of an image and nothing out of a page. See lib/qr.js.
-->
<style>
  :root{
    --bg:#F5F5F7; --card:#FFFFFF; --ink:#111214; --ink2:#5B6170; --mut:#8A8F9C;
    --line:#E7E8EC; --acc:#D6483B; --ok:#1FA463;
    --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB",
      "Microsoft YaHei","Noto Sans SC",sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink)}
  body{font-family:var(--sans);font-size:16px;line-height:1.5;
    padding:env(safe-area-inset-top,0) 0 calc(2rem + env(safe-area-inset-bottom,0))}
  main{max-width:34rem;margin:0 auto;padding:1rem .8rem}
  .head{display:flex;align-items:baseline;gap:.8rem;
    padding:.2rem .3rem 1rem}
  .head b{font-size:1.15rem}
  .head span{font-size:.85rem;color:var(--acc)}
  .head span.ok{color:var(--ok)}
  /* Pushed to the far end so the state sits beside the word it qualifies
     rather than drifting to the middle of the row. */
  .head .mine{margin-left:auto;font-size:.8rem;color:var(--mut);
    text-decoration:none;align-self:center}
  .head .lang{border:1px solid var(--line);background:var(--card);
    color:var(--mut);font:inherit;font-size:.75rem;border-radius:999px;
    padding:.2rem .6rem;align-self:center}
  .box{background:var(--card);border-radius:.9rem;padding:.9rem;margin:0 0 .7rem}
  /* 确认收货, and the review that hangs off it. One button, full width,
     because it is the only thing to do on the screen when it is there. */
  .did{width:100%;border:0;border-radius:999px;background:var(--acc);color:#fff;
    font:inherit;font-size:1rem;font-weight:600;padding:.9rem;margin:.2rem 0 .7rem}
  .did.quiet{background:var(--card);color:var(--acc)}
  .did:disabled{background:var(--line);color:var(--mut)}
  .stars{display:flex;gap:.35rem;justify-content:center;margin:.2rem 0 .8rem}
  .stars button{border:0;background:none;font-size:1.9rem;line-height:1;
    padding:0;color:var(--line)}
  .stars button.on{color:#F5A623}
  .rev textarea{width:100%;font:inherit;font-size:1rem;padding:.7rem;
    border-radius:.7rem;border:1px solid var(--line);background:var(--bg);
    color:var(--ink);resize:none;height:4.5rem;line-height:1.5}
  .rev .lab{margin:0 0 .5rem;font-size:.9rem;text-align:center}
  .said{margin:.6rem 0 0;font-size:.85rem;color:var(--acc);text-align:center}
  .thanks{text-align:center;color:var(--ok);font-size:.95rem;padding:.6rem 0}
  .lab{font-size:.75rem;color:var(--mut);margin:0 0 .35rem}
  .addr{font-size:.95rem;line-height:1.6}
  .addr b{font-weight:600}
  .ln{display:flex;justify-content:space-between;gap:.8rem;font-size:.9rem;
    padding:.25rem 0}
  .ln span{color:var(--ink2);min-width:0;overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap}
  .tot{display:flex;justify-content:space-between;border-top:1px solid var(--line);
    margin-top:.6rem;padding-top:.6rem}
  .tot b{color:var(--acc);font-size:1.2rem}

  .pay{text-align:center;padding:1.2rem .9rem 1.4rem}
  .pay .amt{font-size:2rem;line-height:1.1;margin:.2rem 0 .1rem}
  .pay .to{font-size:.9rem;color:var(--ink2)}
  .qr{width:min(15rem,70vw);aspect-ratio:1;display:block;margin:1.1rem auto .7rem;
    background:#fff;border-radius:.5rem;
    -webkit-touch-callout:default;-webkit-user-select:auto;user-select:auto}
  .do{font-size:1rem;font-weight:600}
  .else{font-size:.82rem;color:var(--mut);margin:.25rem 0 0}
  .ways{display:flex;gap:.6rem;justify-content:center;margin:.2rem 0 0}
  .ways button{flex:1 1 0;max-width:10rem;border:0;border-radius:999px;font:inherit;
    font-size:1rem;font-weight:600;padding:.85rem 1rem;background:var(--acc);color:#fff}
  .ways button.alt{background:#1677FF}
  .track{font-size:1.05rem;letter-spacing:.04em}
  .foot{padding:1rem .4rem 0;font-size:.75rem;line-height:1.7;color:var(--mut)}
</style>

<main id="root"></main>

<script type="module">
import { T, setLang, pickLang, langButton } from "/i18n.js";
import { mountCheckout } from "/pay.js";

/* Chinese unless the reader has said otherwise — see pickLang. */
setLang(pickLang("zh"));

const $ = (id) => document.getElementById(id);
const el = (t, cls, text) => {
  const n = document.createElement(t);
  if (cls) n.className = cls;
  if (text != null) n.textContent = text;
  return n;
};
const ID = (location.pathname.match(/^\/order\/([a-f0-9]{20})/) || [])[1] || "";
const yuan = (n) => "¥" + (n / 100).toLocaleString("zh-CN", {
  minimumFractionDigits: (n % 100) ? 2 : 0, maximumFractionDigits: 2,
});
/* THE FOUR WORDS ARE NOT OURS — see the note in lib/shop.js. Looked up
   rather than held, so a flip moves them with everything else. */
const WORD = (state) => T("od." + state);

/* The same string the shopfront minted — see device() in shop.html. */
function device() {
  try { return localStorage.getItem("board:device") || ""; } catch { return ""; }
}

let O = null;

function draw() {
  const root = $("root");
  root.textContent = "";

  const head = el("div", "head");
  head.append(el("b", null, T("od.title")));
  const st = el("span", O.state === "done" ? "ok" : null, WORD(O.state));
  head.append(st);
  /* THE WAY BACK TO THE LIST, on the page she actually lands on. A list
     nobody can find is a list nobody has. */
  const mine = el("a", "mine", T("od.back"));
  mine.href = "/orders";
  head.append(mine);
  /* The switch goes on the one row that is on every state of this page. */
  head.append(langButton(() => draw()));
  root.append(head);
  document.title = T("od.title");

  /* WHAT TO DO, FIRST AND ONLY. Everything below it is the receipt. */
  if (O.state === "due") root.append(payBox());
  if (O.state === "shipped" || O.state === "done") root.append(trackBox());
  /* 确认收货 while it is on its way, and the review once it has arrived —
     in that order, because one leads to the other. */
  if (O.state === "shipped") root.append(gotButton());
  if (O.state === "done") root.append(reviewBox());

  const addr = el("div", "box");
  addr.append(el("p", "lab", T("od.addr")));
  const a = el("div", "addr");
  a.append(el("b", null, O.ship.name + "  " + O.ship.phone));
  a.append(document.createElement("br"));
  a.append(document.createTextNode(
    [O.ship.province, O.ship.city, O.ship.district, O.ship.detail].filter(Boolean).join(" ")));
  addr.append(a);
  root.append(addr);

  const box = el("div", "box");
  box.append(el("p", "lab", T("od.goods")));
  for (const l of O.lines) {
    const row = el("div", "ln");
    row.append(el("span", null, l.name + " ×" + l.n));
    row.append(el("b", null, yuan(l.price * l.n)));
    box.append(row);
  }
  const post = el("div", "ln");
  post.append(el("span", null, T("od.post")));
  post.append(el("b", null, yuan(O.post)));
  box.append(post);
  const tot = el("div", "tot");
  tot.append(el("span", null, T("od.total")));
  tot.append(el("b", null, yuan(O.total)));
  box.append(tot);
  root.append(box);

  root.append(el("p", "foot", T("od.foot", { who: O.shop })));
}

function payBox() {
  const box = el("div", "box pay");
  box.append(el("p", "lab", T("od.pay")));
  box.append(el("div", "amt", yuan(O.total)));
  box.append(el("p", "to", T("od.to", { who: O.shop })));
  const ways = el("div", "ways");
  const wx = el("button", null, T("od.wechat"));
  const ali = el("button", "alt", T("od.alipay"));
  wx.type = ali.type = "button";
  wx.addEventListener("click", () => code("wechat", box, wx, ali));
  ali.addEventListener("click", () => code("alipay", box, wx, ali));
  ways.append(wx, ali);
  box.append(ways);
  return box;
}

async function code(how, box, wx, ali) {
  wx.disabled = ali.disabled = true;
  wx.textContent = how === "wechat" ? T("od.making") : wx.textContent;
  ali.textContent = how === "alipay" ? T("od.making") : ali.textContent;
  try {
    const r = await fetch("/api/order/" + ID + "/pay", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ method: how }),
    });
    const j = await r.json().catch(() => null);
    /* STRIPE INSTEAD OF A WALLET CODE. The route hands back one or the other
       and never both — a real 收款码 where the WFOE's bank is connected, and
       Stripe's own form where it is not; see the note over the fallback in
       /api/order/:id/pay. The form is mounted in the page rather than
       redirected to, so the address bar still says this shop: the same reason
       the deal rooms mount it, written up over `ui_mode` in lib/stripe.js. */
    if (r.ok && j?.secret) {
      box.querySelector(".ways").remove();
      const slot = el("div", "frame");
      box.append(slot);
      await mountCheckout(slot, { secret: j.secret, pk: j.pk });
      watch();
      return;
    }
    if (r.ok && j?.qr) {
      box.querySelector(".ways").remove();
      const img = el("img", "qr");
      img.src = j.qr.png;
      img.alt = "";
      box.append(img);
      box.append(el("p", "do", T("od.scan")));
      box.append(el("p", "else", T("od.orShot")));
      watch();
      return;
    }
    wx.textContent = T("od.wechat"); ali.textContent = T("od.alipay");
    wx.disabled = ali.disabled = false;
    box.append(el("p", "else", T(j?.error === "already" ? "od.already" : "od.noQr")));
  } catch {
    wx.textContent = T("od.wechat"); ali.textContent = T("od.alipay");
    wx.disabled = ali.disabled = false;
  }
}

/* Asking, while the code is on the screen — she pays inside her wallet and
   nothing comes back to this page. Ten minutes is longer than a code lasts. */
function watch() {
  let left = 200;
  const tick = async () => {
    if (left-- <= 0) return;
    try {
      const r = await fetch("/api/order/" + ID + "/check", { cache: "no-store" });
      const j = await r.json().catch(() => null);
      if (j?.state && j.state !== "due") { load(); return; }
    } catch { }
    setTimeout(tick, 3000);
  };
  setTimeout(tick, 3000);
}

/* THE ONE CLICK THAT SAYS SHE WAS LOOKED AFTER, and only she can make it.
   The seller marking somebody else's parcel as arrived is the thing this
   route refuses — see /api/order/:id/got. */
function gotButton() {
  const b = el("button", "did", T("od.got"));
  b.type = "button";
  b.addEventListener("click", async () => {
    b.disabled = true;
    b.textContent = T("od.gotting");
    try {
      const r = await fetch("/api/order/" + encodeURIComponent(ID) + "/got", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ device: device() }),
      });
      if (r.ok) { load(); return; }
    } catch { /* fall through to the sentence below */ }
    b.textContent = T("od.gotNo");
    b.disabled = false;
  });
  return b;
}

/* 评价, one line per thing she bought. Opened from a button rather than
   shown open: a form waiting on the screen is a chore, and the same form
   behind one tap is a thing she chose to do. */
function reviewBox() {
  const box = el("div", "box rev");
  const open = el("button", "did quiet", T("od.rate"));
  open.type = "button";
  box.append(open);
  open.addEventListener("click", () => { open.remove(); box.append(form()); });

  function form() {
    const wrap = el("div");
    /* One line at a time. Most orders are one thing, and a page of forms
       for the rare three-line order is a page nobody finishes. */
    let which = O.lines[0]?.id || "";
    if (O.lines.length > 1) {
      const pick = document.createElement("select");
      for (const l of O.lines) {
        const o = document.createElement("option");
        o.value = l.id;
        o.textContent = l.name;
        pick.append(o);
      }
      pick.addEventListener("change", () => { which = pick.value; });
      wrap.append(pick);
    }
    wrap.append(el("p", "lab", T("od.stars")));

    let stars = 5;
    const row = el("div", "stars");
    const btns = [];
    for (let i = 1; i <= 5; i += 1) {
      const b = el("button", i <= stars ? "on" : null, "★");
      b.type = "button";
      b.addEventListener("click", () => {
        stars = i;
        btns.forEach((x, n) => x.classList.toggle("on", n < stars));
      });
      btns.push(b);
      row.append(b);
    }
    wrap.append(row);

    const say = document.createElement("textarea");
    say.placeholder = T("od.saySome");
    wrap.append(say);

    const go = el("button", "did", T("od.send"));
    go.type = "button";
    const said = el("p", "said");
    said.hidden = true;
    go.addEventListener("click", async () => {
      go.disabled = true;
      go.textContent = T("od.posting");
      said.hidden = true;
      try {
        const r = await fetch("/api/order/" + encodeURIComponent(ID) + "/review", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ device: device(), product: which,
            stars, text: say.value.trim() }),
        });
        const j = await r.json().catch(() => null);
        if (r.ok && j?.ok) {
          wrap.textContent = "";
          wrap.append(el("p", "thanks", T("od.rateDone")));
          return;
        }
        said.textContent = T(j?.error === "already" ? "od.rated" : "od.rateNo");
      } catch { said.textContent = T("od.rateNo"); }
      said.hidden = false;
      go.disabled = false;
      go.textContent = T("od.send");
    });
    wrap.append(go, said);
    return wrap;
  }
  return box;
}

function trackBox() {
  const box = el("div", "box");
  box.append(el("p", "lab", T("od.track")));
  box.append(el("div", "track", (O.sent?.courier ? O.sent.courier + " " : "") + (O.sent?.tracking || "")));
  return box;
}

async function load() {
  try {
    const r = await fetch("/api/order/" + ID, { cache: "no-store" });
    const j = await r.json().catch(() => null);
    if (r.ok && j?.ok) { O = j.order; draw(); return; }
  } catch { }
  $("root").append(el("p", "foot", T("od.gone")));
}

if (!ID) $("root").append(el("p", "foot", T("od.gone")));
else load();
</script>
