<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Exchange</title>
<meta name="description" content="A room at The Exchange.">
<meta property="og:title" content="交换 · The Exchange">
<meta property="og:description" content="Somebody sent you into this room.">
<meta property="og:image" content="{{ORIGIN}}/share.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:url" content="{{HERE}}">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="/favicon.png">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="stylesheet" href="/site.css">
<style>
  /* THE LINK OPENS THE ROOM.
   *
   * It opened the page that sells the board — a headline, a pitch and two
   * buttons — which is the right page for somebody who found the address cold
   * and the wrong one for somebody a friend put into a conversation. This page
   * is the conversation, and the only thing under it is a name.
   *
   * Deliberately small. It is the first thing most people will ever see of
   * this, it is read on a phone in a taxi, and everything on it that is not
   * the room or the box is something between the two. */
  body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);
    font-size:1rem;line-height:1.5;-webkit-font-smoothing:antialiased}
  main{max-width:34rem;margin:0 auto;min-height:100dvh;
    display:flex;flex-direction:column;padding:0 1.15rem}
  .head{position:sticky;top:0;z-index:20;background:var(--paper);
    display:flex;align-items:center;gap:.7rem;padding:1.1rem 0 .7rem;
    border-bottom:1px solid var(--hair)}
  .head .mk{width:2.2rem;height:2.2rem;border-radius:50%;flex:0 0 auto;
    display:grid;place-items:center;background:var(--accent);color:#fff;
    font-size:.95rem}
  .head b{display:block;font-family:var(--serif);font-weight:400;font-size:1.15rem;
    line-height:1.2}
  .head span{display:block;font-size:.76rem;color:var(--muted)}
  .head .nm{flex:1;min-width:0;text-decoration:none;color:inherit}
  /* WHERE ELSE THERE IS TO GO, and for most of the time there is nowhere.
   *
   * This page is the whole app for somebody at the door, and that is the rule
   * rather than an omission: there is no profile to make until they are let
   * in. What they can do is see where they stand, and the one line under the
   * room is that — not a menu, because a menu of one thing is a menu that
   * teases four things that are not there. */
  /* The bar, the same shape a member's four tabs have — see notes.html. Fixed
     to the bottom, above the box, because it is where a thumb already is and
     where every other app on this phone puts it. */
  .bar{position:fixed;left:50%;transform:translateX(-50%);bottom:0;z-index:35;
    width:100%;max-width:34rem;display:flex;
    padding:.1rem .5rem calc(.35rem + env(safe-area-inset-bottom));
    background:var(--paper);border-top:1px solid var(--line)}
  .bar a{flex:1;text-align:center;padding:.65rem .2rem;font-size:.82rem;
    font-weight:600;color:var(--muted);text-decoration:none}
  .bar a.on{color:var(--accent)}
  /* The bar sits over the bottom of the page, so the box has to clear it. */
  body.withbar .foot{padding-bottom:calc(4.2rem + env(safe-area-inset-bottom))}

  .talk{flex:1;display:flex;flex-direction:column;justify-content:flex-end;
    gap:.55rem;padding:1rem 0 .8rem}
  .said{display:flex;gap:.55rem;align-items:flex-start}
  .said .av{width:2rem;height:2rem;font-size:.85rem;flex:0 0 auto;border-radius:50%;
    display:grid;place-items:center;color:#fff}
  .said .col{display:flex;flex-direction:column;min-width:0;max-width:82%}
  .who{margin:0 0 .2rem;font-size:.72rem;color:var(--muted)}
  .bub{padding:.6rem .8rem;border-radius:1.05rem;font-size:.95rem;line-height:1.5;
    background:var(--raise);color:var(--ink);border:1px solid var(--line);
    border-bottom-left-radius:.35rem;white-space:pre-wrap;overflow-wrap:anywhere}
  .bub.hear{cursor:pointer;text-decoration:underline dotted var(--t3);
    text-underline-offset:4px}
  .bub.hearing{border-color:var(--t3);box-shadow:0 0 0 2px var(--t3)}
  .said.mine{flex-direction:row-reverse}
  .said.mine .bub{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);
    border-bottom-left-radius:1.05rem;border-bottom-right-radius:.35rem}
  .when{align-self:center;font-size:.7rem;color:var(--muted);margin:.2rem 0}

  /* WHERE THE COMPOSER GOES, BECAUSE IT IS WHAT THE COMPOSER BECOMES. The ask
     is not a sign-up page in front of the room: it is the box you type in,
     asking for a name the first time. */
  .foot{position:sticky;bottom:0;background:var(--paper);
    padding:.5rem 0 calc(.9rem + env(safe-area-inset-bottom));
    border-top:1px solid var(--hair)}
  .foot .row{display:flex;gap:.5rem;align-items:stretch}
  .foot input{flex:1;min-width:0;font:inherit;font-size:1rem;padding:.7rem .9rem;
    border:1px solid var(--line);border-radius:1.1rem;background:var(--raise);
    color:var(--ink)}
  .foot button{flex:0 0 auto;font:inherit;font-size:.95rem;padding:.7rem 1.1rem;
    border:0;border-radius:1.1rem;background:var(--accent);color:var(--accent-ink);
    cursor:pointer;white-space:nowrap}
  .foot button:disabled{opacity:.5}
  .foot .ask{margin:0 0 .45rem;font-size:.86rem;color:var(--ink)}
  .foot .ask b{font-weight:700}
  .foot .note{margin:.5rem 0 0;font-size:.74rem;color:var(--muted)}
  .foot .note.bad{color:var(--t5)}
  .foot .lang{margin-left:auto}
  .ins{margin:.6rem 0 0}
</style>
</head>
<body>
<main>
  <div class="head">
    <div class="mk">交</div>
    <a class="nm" id="rlink" href="/room"><b id="rname">—</b><span id="rsub"></span></a>
    <span id="langslot"></span>
  </div>
  <div class="talk" id="talk"></div>
  <!-- THE THREE PLACES THIS PERSON HAS, AS A BAR.
       This was two lines of small grey text under the box, and small grey text
       is where I keep putting things that matter — it reads as a footnote and
       gets scrolled past. A member has four tabs along the bottom of every
       screen; somebody at the door has three, and they belong in the same
       place, at the same weight, doing the same thing. -->
  <nav class="bar" id="bar" hidden>
    <a class="on" href="#" id="barRoom"></a>
    <!-- WHO IS INSIDE, which they could not reach from here at all.
         A few members are browsable from outside the door — chosen one at a
         time by whoever runs the board — and the whole point of them is that
         somebody standing at the door can see who is worth waiting for. There
         was no way to. See the peek branch in /api/people. -->
    <a href="/browse" id="barIn"></a>
    <a href="/room" id="barQueue"></a>
    <a href="/room#you" id="barYou"></a>
  </nav>
  <div class="foot">
    <!-- THE NAME STEP SAYS SO, ABOVE THE BOX. It said so in the placeholder,
         which vanishes the moment somebody types — so the first thing typed
         became their name, and somebody who meant to say "Amazing" to the room
         is now called Amazing in it. A label does not vanish. -->
    <p class="ask" id="ask" hidden></p>
    <div class="row">
      <input id="box" maxlength="600" autocomplete="off">
      <button id="go" type="button">—</button>
    </div>
    <p class="note" id="note" hidden></p>
    <p class="ins" id="install" hidden></p>

  </div>
</main>

<script type="module">
import { T, when, setLang, pickLang, langButton } from "/i18n.js";
import { device, roomFromPath, viaFromUrl, wFromUrl } from "/wait.js";
import { offerInstall } from "/install.js";
import { moHear } from "/mo.js";

setLang(pickLang());
const $ = (id) => document.getElementById(id);
const KEY = roomFromPath() || "other";
let ROOM = null;
/* Whether this browser is in the room yet. The one bit that decides what the
   box at the bottom is: a name, or a message. */
let IN = false;
/* His name comes from the room he is a member of, so the two screens cannot
   disagree about what he is called. */
let MO_NAME = "Mo";

$("langslot").append(langButton(() => { paint(); }));

const wash = (s) => {
  let h = 0;
  for (const ch of String(s)) h = (h * 31 + ch.codePointAt(0)) % 360;
  return "hsl(" + h + " 34% 55%)";
};

async function load() {
  try {
    ROOM = await fetch("/api/door?room=" + encodeURIComponent(KEY), {
      cache: "no-store", headers: { "x-board-device": device() },
    }).then((r) => (r.ok ? r.json() : null));
  } catch { ROOM = null; }
  IN = Boolean(ROOM && ROOM.how && ROOM.how !== "peek");
  for (const m of (ROOM && ROOM.says) || []) if (m.bot && m.handle) MO_NAME = m.handle;
  paint();
}

function paint() {
  $("rname").textContent = T("waitroom." + KEY)
    + (ROOM ? "  (" + ROOM.n + ")" : "");
  $("rsub").textContent = T("dr.sub");
  $("go").textContent = T(IN ? "note.send" : "wait.goRoom");
  $("box").placeholder = T(IN ? "dr.say" : "wait.name");
  $("box").maxLength = IN ? 600 : 40;
  /* The one line that stops somebody naming themselves after the first thing
     they meant to say. Gone the moment they are in, because from then on the
     box is what it looks like. */
  $("ask").hidden = IN;
  if (!IN) $("ask").textContent = T("dr.askName");
  /* Only once they are in it: somebody who has not given a name has no place
     to go and look at, and a link to one would be a dead end with a word on
     it. The header carries it too, which is where a person looks. */
  /* Only once they are in the room: somebody who has not given a name has no
     queue to look at and no page to fill in, and two tabs that lead to empty
     screens are worse than a screen with no tabs. */
  $("bar").hidden = !IN;
  document.body.classList.toggle("withbar", IN);
  $("barRoom").textContent = T("dr.barRoom");
  $("barIn").textContent = T("dr.barIn");
  $("barQueue").textContent = T("dr.barQueue");
  $("barYou").textContent = T("dr.barYou");
  $("rlink").removeAttribute("href");
  if (IN) $("rlink").href = "/room";

  const talk = $("talk");
  talk.textContent = "";
  if (!ROOM || !ROOM.says.length) {
    const p = document.createElement("p");
    p.className = "when";
    p.textContent = T("dr.quiet");
    talk.append(p);
    return;
  }
  let day = "";
  for (const m of ROOM.says) {
    const dd = String(m.at).slice(0, 10);
    if (dd !== day) {
      day = dd;
      const w = document.createElement("p");
      w.className = "when";
      w.textContent = when(m.at);
      talk.append(w);
    }
    /* WHAT HAPPENED TO THE ROOM, drawn as a line across it rather than a
       bubble from anybody — the room reporting itself, which is what every
       group chat on this phone does with it. See moSays. */
    /* A line across the room for what happened to it; a bubble from him for
       what he said to somebody. See moSays. */
    if (m.evt && m.evt.kind !== "welcome") {
      const e = document.createElement("p");
      e.className = "when";
      e.textContent = T("mo." + m.evt.kind, { who: m.evt.who });
      talk.append(e);
      continue;
    }
    const said = m.evt ? T("mo.welcome", { who: m.evt.who }) : (m.text || "");
    const row = document.createElement("div");
    row.className = "said" + (m.mine ? " mine" : "");
    if (!m.mine) {
      const av = document.createElement("span");
      av.className = "av";
      av.textContent = (m.handle || "?").slice(0, 1).toUpperCase();
      av.style.background = wash(m.handle || "?");
      row.append(av);
    }
    const col = document.createElement("div");
    col.className = "col";
    if (!m.mine) {
      const who = document.createElement("p");
      who.className = "who";
      who.textContent = (m.handle || T("board.someone"))
        + (m.bot ? "" : " · " + T(m.inside ? "dr.inside" : "dr.waiting"));
      col.append(who);
    }
    const bub = document.createElement("div");
    bub.className = "bub";
    bub.textContent = said;
    // His lines are tappable and nobody else's are — see hearable().
    if (m.bot && said) hearable(bub, said);
    col.append(bub);
    row.append(col);
    talk.append(row);
  }
  /* HIS WELCOME IS IN THE ROOM NOW, not drawn here for one pair of eyes —
     see moSays. What stays theirs alone is the home-screen line under the box,
     which knows which phone they are holding. */
  window.scrollTo(0, document.body.scrollHeight);
}

/* Tap his line to hear it. Asked for, one at a time, and the cue goes for good
   on a box with no voice — see moHear. */
function hearable(bub, text) {
  bub.classList.add("hear");
  bub.setAttribute("role", "button");
  bub.setAttribute("tabindex", "0");
  const go = () => moHear(text, (on) => {
    if (on === "off") { bub.classList.remove("hear", "hearing"); return; }
    bub.classList.toggle("hearing", Boolean(on));
  });
  bub.addEventListener("click", go);
  bub.addEventListener("keydown", (e) => {
    if (e.key === "Enter" || e.key === " ") { e.preventDefault(); go(); }
  });
}

const tell = (key, bad) => {
  const n = $("note");
  n.hidden = false;
  n.classList.toggle("bad", Boolean(bad));
  n.textContent = T(key);
};

$("go").addEventListener("click", async () => {
  const v = $("box").value.trim();
  if (!v) { $("box").focus(); return; }
  $("go").disabled = true;
  try {
    if (!IN) {
      /* A NAME AND NOTHING ELSE. Not an email, not a WeChat id, not a sentence
         about themselves — see cleanWait. The room is how they are reached and
         what they are looking for is the next thing they will type anyway. */
      const r = await fetch("/api/wait", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ name: v, room: KEY, viaRoom: 1, device: device(),
                               via: viaFromUrl(), w: wFromUrl() }),
      });
      if (!r.ok) throw new Error("no");
      $("box").value = "";
      IN = true;
      $("note").hidden = true;
      /* The home screen, asked for once, at the only moment it is obviously
         worth it: they are in a room and about to want to come back to it. */
      offerInstall($("install"), true);
      await load();
      $("box").focus();
    } else {
      const r = await fetch("/api/group/say", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ device: device(), group: ROOM.id, text: v }),
      });
      const d = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(d.error || "no");
      $("box").value = "";
      $("note").hidden = true;
      await load();
    }
  } catch (e) {
    tell(String(e.message) === "contact" ? "note.noContact" : "act.again", true);
  }
  $("go").disabled = false;
});

$("box").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("go").click(); }
});

load();

/* THE ROOM KEEPS BEING TRUE WHILE IT IS OPEN. Twenty seconds, and again the
   moment somebody comes back to it — which is the one that matters, because a
   phone puts this tab to sleep the instant they switch to WeChat. */
setInterval(() => { if (!document.hidden) load(); }, 20000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) load(); });
</script>
</body>
</html>
