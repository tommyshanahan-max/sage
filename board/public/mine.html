<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>我的小店</title>
<meta name="robots" content="noindex">
<!--
  THE REPRESENTATIVE'S OWN SHOP.

  She sold it, so she is the one asked where it is — and until now she had a
  number on /paid and nothing else.

  THE LINK IS FIRST, because sharing it is the only thing she does here that
  makes money. The orders are the record; the link is the job.

  NO ADDRESS AND NO PHONE. She is not shipping anything — the stock and the
  distributor are his — so an address in her hands is a liability she was
  never asked whether she wanted. A first name so she knows which friend it
  was, a tracking number so she can answer the question, and nothing further.
  The page says so at the bottom, because a thing not shown looks like a
  thing missing unless somebody says it was a decision.
-->
<style>
  :root{
    --bg:#F5F5F7; --card:#FFFFFF; --ink:#111214; --ink2:#5B6170; --mut:#8A8F9C;
    --line:#E7E8EC; --acc:#D6483B; --ok:#1FA463;
    --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB",
      "Microsoft YaHei","Noto Sans SC",sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink)}
  body{font-family:var(--sans);font-size:16px;line-height:1.55;
    padding:env(safe-area-inset-top,0) 0 calc(1rem + env(safe-area-inset-bottom,0))}
  main{max-width:34rem;margin:0 auto;padding:.9rem .8rem 1rem}
  .head{display:flex;align-items:center;gap:.8rem;padding:.2rem .3rem 1rem}
  .head b{font-size:1.15rem}
  .lang{margin-left:auto;border:1px solid var(--line);background:var(--card);
    color:var(--ink2);font:inherit;font-size:.75rem;border-radius:999px;
    padding:.25rem .65rem}

  /* The link, and the button that is the whole job. */
  .box{background:var(--card);border-radius:.9rem;padding:1rem;margin:0 0 .7rem}
  .box .lab{margin:0 0 .4rem;font-size:.78rem;color:var(--mut)}
  .url{font-size:.95rem;word-break:break-all;margin:0 0 .8rem}
  .copy{width:100%;border:0;border-radius:999px;background:var(--acc);color:#fff;
    font:inherit;font-size:1rem;font-weight:600;padding:.85rem}
  .copy.done{background:var(--ok)}
  .why{margin:.7rem 0 0;font-size:.78rem;color:var(--mut);text-align:center}

  /* Two numbers, because "you have earned X" with X in somebody else's
     account is the sentence that loses somebody. */
  .money{display:flex;gap:.7rem;margin:0 0 .7rem}
  .money>div{flex:1 1 0;background:var(--card);border-radius:.9rem;padding:.9rem}
  .money span{display:block;font-size:.75rem;color:var(--mut)}
  .money b{display:block;font-size:1.35rem;margin:.15rem 0 0}
  .money .owe b{color:var(--acc)}
  a.setup{display:block;background:var(--card);border-radius:.9rem;padding:.9rem;
    margin:0 0 .7rem;text-align:center;text-decoration:none;color:var(--acc);
    font-size:.95rem}

  .row{background:var(--card);border-radius:.9rem;padding:.85rem .9rem;margin:0 0 .6rem}
  .top{display:flex;align-items:baseline;justify-content:space-between;gap:.8rem}
  .top .who{font-size:.8rem;color:var(--mut)}
  .top .st{font-size:.82rem;color:var(--acc);flex:0 0 auto}
  .top .st.ok{color:var(--ok)}
  .nm{margin:.3rem 0 0;font-size:.95rem;display:-webkit-box;-webkit-line-clamp:1;
    -webkit-box-orient:vertical;overflow:hidden}
  .bot{display:flex;align-items:baseline;justify-content:space-between;
    gap:.8rem;margin:.35rem 0 0}
  .bot .cut{font-size:.8rem;color:var(--ok)}
  .bot .cut.wait{color:var(--mut)}
  .bot b{font-size:1rem}
  .track{margin:.4rem 0 0;font-size:.78rem;color:var(--ink2)}
  /* The assistant switch. A row with a state on it, not a checkbox — she
     has to be able to see which way it is set at a glance. */
  .ai{display:flex;align-items:center;gap:.8rem;background:var(--card);
    border-radius:.9rem;padding:.9rem 1rem;margin:0 0 .7rem}
  .ai>div{flex:1 1 auto;min-width:0}
  .ai b{display:block;font-size:.95rem}
  .ai span{display:block;font-size:.75rem;color:var(--mut);line-height:1.5}
  .ai button{flex:0 0 auto;border:1px solid var(--line);background:var(--bg);
    color:var(--ink2);font:inherit;font-size:.85rem;border-radius:999px;
    padding:.35rem 1rem}
  .ai button.on{background:var(--ok);border-color:var(--ok);color:#fff}

  /* Messages. The tail of the last line is how anybody picks a thread out
     of a list — she has no name for the buyer and does not need one. */
  .msgs{margin:0 0 .7rem}
  .msgs>.lab{margin:1.2rem .3rem .5rem;font-size:.8rem;color:var(--mut);
    display:flex;align-items:center;gap:.5rem}
  .msgs>.lab i{font-style:normal;background:var(--acc);color:#fff;font-size:.7rem;
    border-radius:999px;padding:.05rem .45rem}
  .chat{display:flex;align-items:center;gap:.8rem;width:100%;text-align:left;
    background:var(--card);border:0;border-radius:.9rem;padding:.85rem .9rem;
    margin:0 0 .6rem;font:inherit;color:inherit}
  .chat .tail{flex:1 1 auto;min-width:0;font-size:.92rem;overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap}
  .chat .dot{flex:0 0 auto;width:.5rem;height:.5rem;border-radius:50%;
    background:var(--acc)}

  /* The thread, in a sheet. The same shape as the buyer's side of it, and
     mirrored: hers is on the left here because she is the other person. */
  .sh{position:fixed;inset:0;background:rgba(17,18,20,.45);z-index:9;
    display:flex;align-items:flex-end}
  .shc{background:var(--card);width:100%;border-radius:1.1rem 1.1rem 0 0;
    padding:1.2rem 1rem calc(1.2rem + env(safe-area-inset-bottom,0));
    max-height:88vh;overflow:auto;text-align:center}
  .shc h2{margin:0 0 1rem;font-size:1.05rem;font-weight:600}
  .thread{text-align:left;max-height:46vh;overflow:auto;margin:0 0 .8rem;
    display:flex;flex-direction:column;gap:.5rem}
  .msg{max-width:82%;padding:.55rem .75rem;border-radius:.9rem;font-size:.92rem;
    line-height:1.5;white-space:pre-wrap;word-break:break-word}
  .msg.them{align-self:flex-start;background:var(--bg)}
  .msg.me{align-self:flex-end;background:var(--acc);color:#fff}
  .msg.bot{align-self:flex-start;background:var(--bg);border:1px dashed var(--line)}
  .msg .who{display:block;font-size:.68rem;opacity:.65;margin:0 0 .15rem}
  .say{display:flex;gap:.5rem;align-items:flex-end}
  .say textarea{flex:1 1 auto;min-width:0;font:inherit;font-size:1rem;
    padding:.6rem .7rem;border-radius:.7rem;border:1px solid var(--line);
    background:var(--bg);color:var(--ink);resize:none;height:2.7rem;
    max-height:7rem;line-height:1.4}
  .say button{flex:0 0 auto;border:0;border-radius:999px;background:var(--acc);
    color:#fff;font:inherit;font-size:.95rem;padding:.65rem 1.1rem}
  .say button:disabled{background:var(--line);color:var(--mut)}
  .shc .shut{margin:1rem 0 0;border:0;background:none;color:var(--mut);
    font:inherit;font-size:.9rem}

  /* This month's board. A rank, a name, and the one number it is ranked on
     — the money sits under it because she will look for it, not because it
     decides the order. */
  /* NOT .top — that is already the order row's header on this page, and two
     rules over one name quietly turned the whole board into one wide row. */
  .rank{background:var(--card);border-radius:.9rem;padding:.3rem .2rem;margin:0 0 .7rem}
  .rank .r{display:flex;align-items:center;gap:.7rem;padding:.6rem .8rem}
  .rank .r+.r{border-top:1px solid var(--line)}
  .rank .n{flex:0 0 1.6rem;text-align:center;font-size:.95rem;color:var(--mut)}
  .rank .r.win .n{color:var(--acc);font-weight:700}
  .rank .r.me{background:var(--bg);border-radius:.6rem}
  .rank .who{flex:1 1 auto;min-width:0;font-size:.95rem;overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap}
  .rank .who i{font-style:normal;font-size:.7rem;color:#fff;background:var(--ink2);
    border-radius:999px;padding:.05rem .4rem;margin-left:.4rem}
  .rank .num{flex:0 0 auto;text-align:right}
  .rank .num b{display:block;font-size:.95rem}
  .rank .num span{display:block;font-size:.72rem;color:var(--mut)}

  .none{padding:2.5rem 1rem;text-align:center;color:var(--mut)}
  .foot{padding:1.2rem .4rem 0;font-size:.75rem;line-height:1.7;color:var(--mut);
    text-align:center}
</style>

<main id="root"></main>

<script type="module">
import { T, setLang, pickLang, langButton } from "/i18n.js";

/* Chinese unless the reader has said otherwise — every representative is in
   mainland China. See pickLang. */
setLang(pickLang("zh"));

const $ = (id) => document.getElementById(id);
const el = (t, cls, text) => {
  const n = document.createElement(t);
  if (cls) n.className = cls;
  if (text != null) n.textContent = text;
  return n;
};
const device = () => { try { return localStorage.getItem("board:device") || ""; } catch { return ""; } };

let D = null, CHATS = [], TOP = [];

function linkBox() {
  const box = el("div", "box");
  box.append(el("p", "lab", T("mn.link")));
  const url = location.origin + "/shop/" + encodeURIComponent(D.handle);
  box.append(el("p", "url", url));
  const b = el("button", "copy", T("mn.copy"));
  b.type = "button";
  b.addEventListener("click", async () => {
    /* The old execCommand trick first: the async clipboard is refused inside
       WeChat's browser, which is where she is. */
    let done = false;
    try {
      const ta = document.createElement("textarea");
      ta.value = url;
      ta.style.position = "fixed";
      ta.style.opacity = "0";
      document.body.append(ta);
      ta.select();
      done = document.execCommand("copy");
      ta.remove();
    } catch { done = false; }
    if (!done) { try { await navigator.clipboard.writeText(url); done = true; } catch { } }
    if (done) { b.textContent = T("mn.copied"); b.classList.add("done"); }
  });
  box.append(b);
  box.append(el("p", "why", T("mn.share")));
  return box;
}

/* This month's board. Top three marked, hers highlighted wherever it is —
   a leaderboard that does not show you your own line is a leaderboard you
   scroll past. */
function topBoard() {
  const wrap = el("div", "msgs");
  const lab = el("div", "lab");
  lab.append(el("span", null, T("mn.top")));
  wrap.append(lab);

  if (!TOP.length) {
    wrap.append(el("p", "none", T("mn.topNone")));
    return wrap;
  }

  const box = el("div", "rank");
  for (const r of TOP.slice(0, 10)) {
    const row = el("div", "r" + (r.rank <= 3 ? " win" : "") + (r.you ? " me" : ""));
    row.append(el("span", "n", String(r.rank)));
    const who = el("span", "who", r.name);
    if (r.you) who.append(el("i", null, T("mn.you")));
    row.append(who);
    const num = el("span", "num");
    num.append(el("b", null, T("mn.buyers", { n: r.buyers })));
    num.append(el("span", null, r.sold));
    row.append(num);
    box.append(row);
  }
  wrap.append(box);
  wrap.append(el("p", "foot", T("mn.topWhy")));
  return wrap;
}

/* AI 客服, on or off, by her, now. */
function aiRow() {
  const box = el("div", "ai");
  const words = el("div");
  words.append(el("b", null, T("mn.ai")));
  words.append(el("span", null, T("mn.aiWhy")));
  box.append(words);
  const b = el("button", D.ai ? "on" : null, T(D.ai ? "mn.aiOn" : "mn.aiOff"));
  b.type = "button";
  b.addEventListener("click", async () => {
    const want = !D.ai;
    b.disabled = true;
    try {
      const r = await fetch("/api/mine/ai", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ device: device(), on: want }),
      });
      const j = await r.json().catch(() => null);
      if (r.ok && j?.ok) {
        D.ai = j.ai;
        b.textContent = T(D.ai ? "mn.aiOn" : "mn.aiOff");
        b.classList.toggle("on", D.ai);
      }
    } catch { /* leave it as it was; the state on screen is still true */ }
    b.disabled = false;
  });
  box.append(b);
  return box;
}

/* Her messages. A thread opens in place — a second page for a list of two
   lines is a page nobody needed. */
function msgs() {
  const wrap = el("div", "msgs");
  const lab = el("div", "lab");
  lab.append(el("span", null, T("mn.chats")));
  if (D.unread) lab.append(el("i", null, String(D.unread)));
  wrap.append(lab);

  if (!CHATS.length) {
    wrap.append(el("p", "none", T("mn.chatNone")));
    return wrap;
  }
  for (const c of CHATS) {
    const b = el("button", "chat");
    b.type = "button";
    if (c.unread) b.append(el("span", "dot"));
    b.append(el("span", "tail", c.tail));
    b.addEventListener("click", () => openChat(c.id));
    wrap.append(b);
  }
  return wrap;
}

function openChat(id) {
  const sheet = el("div", "sh");
  const card = el("div", "shc");
  card.append(el("h2", null, T("mn.buyer")));
  const thread = el("div", "thread");
  card.append(thread);

  const paint = (lines) => {
    thread.textContent = "";
    for (const l of lines) {
      const m = el("div", l.who === "buyer" ? "msg them" : l.who === "ai" ? "msg bot" : "msg me");
      m.append(el("span", "who",
        l.who === "buyer" ? T("mn.buyer") : l.who === "ai" ? T("sh.robot") : T("sh.me")));
      m.append(document.createTextNode(l.text));
      thread.append(m);
    }
    thread.scrollTop = thread.scrollHeight;
  };

  const row = el("div", "say");
  const box = document.createElement("textarea");
  box.rows = 1;
  box.placeholder = T("mn.reply");
  const send = el("button", null, T("sh.send"));
  send.type = "button";
  send.addEventListener("click", async () => {
    const text = box.value.trim();
    if (!text) return;
    send.disabled = true;
    try {
      const r = await fetch("/api/mine/chat/" + encodeURIComponent(id), {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ device: device(), text }),
      });
      const j = await r.json().catch(() => null);
      if (r.ok && j?.ok) { box.value = ""; paint(j.lines); }
    } catch { /* the line stays in the box, which is the right place for it */ }
    send.disabled = false;
  });
  row.append(box, send);
  card.append(row);

  const shut = el("button", "shut", T("sh.close"));
  shut.type = "button";
  shut.addEventListener("click", () => { sheet.remove(); load(); });
  card.append(shut);
  sheet.append(card);
  sheet.addEventListener("click", (e) => { if (e.target === sheet) { sheet.remove(); load(); } });
  document.body.append(sheet);

  fetch("/api/mine/chat/" + encodeURIComponent(id),
    { cache: "no-store", headers: { "x-board-device": device() } })
    .then((r) => r.json())
    .then((j) => paint(j?.lines || []))
    .catch(() => {});
}

function draw() {
  const root = $("root");
  root.textContent = "";
  document.title = T("mn.title");

  const head = el("div", "head");
  head.append(el("b", null, D?.name || T("mn.title")));
  head.append(langButton(() => draw()));
  root.append(head);

  if (!D?.handle) {
    root.append(el("h1", null, T("mn.nobody.h")));
    root.append(el("p", "none", T("mn.nobody.p")));
    return;
  }

  root.append(linkBox());

  const money = el("div", "money");
  const a = el("div");
  a.append(el("span", null, T("mn.earned")), el("b", null, D.earned));
  const c = el("div", "owe");
  c.append(el("span", null, T("mn.owed")), el("b", null, D.owed));
  money.append(a, c);
  root.append(money);

  /* Only when there is money to land and nowhere for it to go — a standing
     row telling somebody to do a thing they have done is noise. */
  if (!D.paid) {
    const s = el("a", "setup", T("mn.setUp"));
    s.href = "/paid";
    root.append(s);
  }

  root.append(topBoard());
  root.append(aiRow());
  root.append(msgs());

  if (!D.orders.length) {
    root.append(el("p", "none", T("mn.none")));
    return;
  }

  for (const o of D.orders) {
    const row = el("div", "row");
    const top = el("div", "top");
    top.append(el("span", "who", o.who));
    top.append(el("span", o.state === "done" ? "st ok" : "st", T("od." + o.state)));
    row.append(top);
    row.append(el("p", "nm", o.first));
    const bot = el("div", "bot");
    if (o.cut) {
      bot.append(el("span", o.cutPaid ? "cut" : "cut wait",
        T(o.cutPaid ? "mn.cutPaid" : "mn.cut", { amount: o.cut })));
    } else {
      bot.append(el("span", "cut wait", ""));
    }
    bot.append(el("b", null, o.total));
    row.append(bot);
    if (o.tracking) {
      row.append(el("p", "track",
        T("mn.track", { courier: o.courier || "", number: o.tracking })));
    }
    root.append(row);
  }

  root.append(el("p", "foot", T("mn.privacy")));
}

async function load() {
  try {
    const r = await fetch("/api/mine", { cache: "no-store",
      headers: { "x-board-device": device() } });
    D = await r.json();
  } catch { D = null; }
  try {
    const r = await fetch("/api/mine/chats", { cache: "no-store",
      headers: { "x-board-device": device() } });
    CHATS = (await r.json())?.chats || [];
  } catch { CHATS = []; }
  try {
    const r = await fetch("/api/mine/top", { cache: "no-store",
      headers: { "x-board-device": device() } });
    TOP = (await r.json())?.rows || [];
  } catch { TOP = []; }
  draw();
}
load();
</script>
