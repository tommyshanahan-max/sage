<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="/favicon.png" sizes="192x192">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#EEF0F4">
<meta name="theme-color" content="#0B0E15" media="(prefers-color-scheme: dark)">
<!-- iOS reads these rather than the manifest for a home-screen install:
     no browser chrome, and a name short enough not to be truncated under
     the icon. -->
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="交换">
<title>Messages</title>
<meta name="description" content="Introductions people sent you, and the ones you sent.">
<meta property="og:type" content="website">
<meta property="og:title" content="Messages">
<meta property="og:description" content="One message, answered once, and then you carry on somewhere else.">
<meta property="og:image" content="{{ORIGIN}}/share.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:url" content="{{ORIGIN}}/notes">
<meta name="robots" content="noindex">
<meta http-equiv="Cache-Control" content="no-cache">
<meta name="color-scheme" content="light dark">
<style>
  :root{
    --paper:#EEF0F4; --raise:#F7F8FB; --ink:#151B28; --ink-2:#4E5968;
    --muted:#8A939F; --line:#E3E6EC; --hair:#EAECF1;
    --accent:#3F68D8; --accent-ink:#FFFFFF; --accent-soft:#E8ECF7;
    --t1:#3F68D8; --t2:#2A9D63; --t3:#D99038; --t4:#7268C4; --t5:#D4485C; --t6:#2F8C9E;
    --serif:Georgia,"Songti SC","Noto Serif CJK SC",'Times New Roman',serif;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",
      "Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;
    --shadow:0 2px 6px rgba(21,27,40,.07),0 10px 28px rgba(21,27,40,.09);
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --paper:#0B0E15; --raise:#141924; --ink:#E9EDF5; --ink-2:#A3B0C4;
      --muted:#6F7D92; --line:#232B39; --hair:#1E2531;
      --accent:#5C8DFF; --accent-ink:#0B0E15; --accent-soft:#18233D;
      --t1:#5C8DFF; --t2:#4EBE88; --t3:#E4A65A; --t4:#9187E0; --t5:#F0687C; --t6:#4FA9BC;
      --shadow:0 2px 6px rgba(0,0,0,.4),0 12px 32px rgba(0,0,0,.34);
    }
  }
  :root[data-theme="dark"]{
    --paper:#0B0E15; --raise:#141924; --ink:#E9EDF5; --ink-2:#A3B0C4;
    --muted:#6F7D92; --line:#232B39; --hair:#1E2531;
    --accent:#5C8DFF; --accent-ink:#0B0E15; --accent-soft:#18233D;
    --t1:#5C8DFF; --t2:#4EBE88; --t3:#E4A65A; --t4:#9187E0; --t5:#F0687C; --t6:#4FA9BC;
    --shadow:0 2px 6px rgba(0,0,0,.4),0 12px 32px rgba(0,0,0,.34);
  }
  :root[data-lang="zh"]{
    --serif:"Songti SC","Noto Serif CJK SC","Source Han Serif SC","STSong",Georgia,serif;
    --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB",
      "Microsoft YaHei","Noto Sans SC","Segoe UI",sans-serif;
  }
  :root[data-lang="zh"] body{line-height:1.75}
  :root[data-lang="zh"] .rule span,
  :root[data-lang="zh"] .fact dt{text-transform:none;letter-spacing:.02em}
  [hidden]{display:none!important}

  *{box-sizing:border-box}
  /* One size up, the same as everywhere else — see the note in index.html. */
  html{font-size:17px;-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);
    font-size:1rem;line-height:1.5;-webkit-font-smoothing:antialiased}
  main{max-width:34rem;margin:0 auto;padding:1.4rem 1.15rem 5rem}
  /* The bar, copied from index.html so the four tabs sit in the same places on
     every screen that has them. Same rules, same breakpoints. */
  .bar{position:fixed;left:50%;transform:translateX(-50%);bottom:0;z-index:35;
    width:100%;max-width:34rem;display:flex;
    align-items:center;justify-content:space-around;
    padding:.35rem .5rem calc(.35rem + env(safe-area-inset-bottom));
    background:var(--paper);border-top:1px solid var(--line)}
  @media (min-width:36rem) and (max-width:57.99rem){
    .bar{border-left:1px solid var(--line);border-right:1px solid var(--line);
      border-radius:1rem 1rem 0 0}
  }
  .bar a{flex:1;min-width:0;color:var(--muted);
    display:flex;flex-direction:column;align-items:center;gap:.15rem;
    padding:.45rem .2rem;font-size:.64rem;text-decoration:none;letter-spacing:.02em}
  .bar a span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .bar a[aria-current="page"]{color:var(--accent)}
  .bar svg{width:1.5rem;height:1.5rem;stroke:currentColor;fill:none;stroke-width:1.7;
    stroke-linecap:round;stroke-linejoin:round}
  /* On a wide screen index.html moves its bar into the masthead. This page has
     no masthead to move it into, so it stays where it is and simply stops
     being full-bleed. */
  @media (min-width:58rem){ .bar{border-radius:1rem 1rem 0 0;
    border-left:1px solid var(--line);border-right:1px solid var(--line)} }
  button{font:inherit;cursor:pointer}
  a{color:inherit}
  img{max-width:100%}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}

  .top{display:flex;align-items:center;gap:.8rem;margin:0 0 1.3rem}
  .top h1{margin:0;font-family:var(--serif);font-weight:400;font-size:1.75rem;line-height:1.1}
  .top p{margin:.15rem 0 0;font-size:.85rem;color:var(--muted)}
  .back{border:0;background:none;color:var(--ink);padding:.2rem;margin-left:-.3rem;
    display:grid;place-items:center;flex:0 0 auto}
  .back svg{width:1.5rem;height:1.5rem;stroke:currentColor;fill:none;stroke-width:1.8;
    stroke-linecap:round;stroke-linejoin:round}
  .lang{margin-left:auto;flex:0 0 auto;border:1px solid var(--line);background:var(--raise);
    color:var(--ink-2);border-radius:99px;padding:.42rem .9rem;font-size:.85rem;line-height:1}

  .rule{display:flex;align-items:center;gap:.9rem;margin:0 0 .3rem}
  .rule span{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;
    color:var(--muted);white-space:nowrap}
  .rule i{flex:1;height:1px;background:var(--line)}

  /* A person in the list. The same row the feed uses, so the two read as one
     product rather than two screens that happen to share a palette. */
  .who{display:flex;gap:.9rem;padding:1.2rem 0;border-bottom:1px solid var(--hair);
    width:100%;text-align:left;background:none;border-left:0;border-right:0;border-top:0;
    align-items:flex-start}
  .av{width:3.4rem;height:3.4rem;border-radius:50%;flex:0 0 auto;background:var(--accent);
    color:var(--accent-ink);display:grid;place-items:center;font-family:var(--serif);
    font-size:1.35rem;line-height:1;overflow:hidden;
    box-shadow:0 0 0 3px var(--paper),0 0 0 4px var(--accent-soft)}
  .av img{width:100%;height:100%;object-fit:cover;display:block}
  .m{flex:1;min-width:0}
  .nameline{display:flex;align-items:baseline;gap:.5rem}
  .nameline b{font-family:var(--serif);font-weight:400;font-size:1.15rem;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .nameline .lv{margin-left:auto;flex:0 0 auto;font-size:.72rem;letter-spacing:.05em;
    border:1px solid var(--line);border-radius:99px;padding:.16rem .55rem;color:var(--muted)}
  .where{margin:.15rem 0 0;font-size:.83rem;color:var(--muted)}
  .goal{margin:.45rem 0 0;font-family:var(--serif);font-size:1rem;line-height:1.5;
    color:var(--ink-2);overflow-wrap:anywhere}
  .days{display:flex;gap:.25rem;margin:.55rem 0 0;flex-wrap:wrap}
  .days b{width:1.75rem;height:1.75rem;display:grid;place-items:center;border-radius:.4rem;
    font-size:.72rem;font-weight:500;background:var(--paper);border:1px solid var(--line);
    color:var(--muted)}
  .days b.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

  .none{padding:3rem .5rem;text-align:center;color:var(--muted)}
  .none b{display:block;font-family:var(--serif);font-weight:400;font-size:1.3rem;
    color:var(--ink);margin:0 0 .4rem}
  .none p{margin:0 auto 1.3rem;max-width:26rem;font-size:.95rem;line-height:1.6}
  .none button{border:0;background:var(--accent);color:var(--accent-ink);border-radius:99px;
    padding:.75rem 1.6rem;font-size:1rem}

  .safety{margin:2rem 0 0;padding:.95rem 1.05rem;background:var(--raise);
    border:1px solid var(--line);border-left:3px solid var(--t3);border-radius:.6rem;
    font-size:.86rem;line-height:1.6;color:var(--ink-2)}

  /* A note. Two shapes, not one with a modifier: what somebody sent you is a
     thing to decide about, what you sent is a receipt. Making them look the
     same made a page where you could not tell at a glance which was which. */
  .note{padding:1.15rem 0;border-bottom:1px solid var(--hair);display:flex;gap:.9rem;
    align-items:flex-start}
  .note .m{flex:1 1 auto;min-width:0}
  .note .line{display:flex;align-items:baseline;gap:.5rem;flex-wrap:wrap}
  .note .line b{font-family:var(--serif);font-weight:400;font-size:1.08rem}
  .note .line time{margin-left:auto;font-size:.78rem;color:var(--muted);flex:0 0 auto}
  .note .text{margin:.45rem 0 0;font-family:var(--serif);font-size:1.02rem;line-height:1.55;
    overflow-wrap:anywhere;white-space:pre-wrap}
  .note.mine .text{color:var(--ink-2)}
  .note .acts{display:flex;gap:.5rem;margin:.75rem 0 0;flex-wrap:wrap}
  .note .acts button,.note .acts a{border:1px solid var(--line);background:var(--raise);
    color:var(--ink);border-radius:99px;padding:.5rem 1.05rem;font-size:.87rem;
    text-decoration:none;display:inline-block}
  .note .acts button.primary{background:var(--accent);border-color:var(--accent);
    color:var(--accent-ink)}
  .note .acts button.warn{color:var(--t5)}
  .note .said{margin:.55rem 0 0;font-size:.83rem;color:var(--muted)}

  /* The terms an accepted offer put over the thread. Bordered in the accent
     rather than tucked into the muted voice: it is the thing on this screen
     that both people are working from. */
  .note .pin{margin:.6rem 0 0;border:1px solid var(--accent);border-radius:.55rem;
    padding:.45rem .55rem;background:var(--paper)}
  .note .pin .k{display:block;font-size:.6rem;letter-spacing:.12em;
    text-transform:uppercase;font-weight:700;color:var(--accent);margin:0 0 .25rem}
  .note .pin p{margin:0;font-size:.86rem;line-height:1.5;color:var(--ink)}
  .note .pin p.money{margin-top:.2rem;font-weight:700}
  .note .left{margin:.5rem 0 0;font-size:.76rem;color:var(--muted)}
  .note .left.spent{color:var(--ink-2)}
  .note .said.bad{color:var(--t5)}
  /* Unread. A dot rather than a colour wash: the message is what should be
     read, not the fact that it is new. */
  /* A ROW OF FACES, SCROLLED SIDEWAYS. Down the page they would push the
     conversations that already exist off the screen, which gets the priority
     backwards — the inbox is what somebody opened this for. */
  .cansub{margin:.1rem 0 .7rem;font-size:.82rem;line-height:1.5;color:var(--muted)}
  .can{display:flex;gap:.9rem;overflow-x:auto;padding:.1rem .1rem 1.1rem;
    margin:0 0 .4rem;scrollbar-width:none;-webkit-overflow-scrolling:touch}
  .can::-webkit-scrollbar{display:none}
  .can .one{flex:0 0 auto;width:4.4rem;border:0;background:none;padding:0;
    font:inherit;cursor:pointer;text-align:center;color:var(--ink)}
  .can .one b{display:block;margin:.4rem 0 0;font-size:.78rem;font-weight:600;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .can .one i{display:block;font-style:normal;font-size:.66rem;color:var(--accent);
    letter-spacing:.06em;text-transform:uppercase;font-weight:700}
  /* The ring is the whole affordance: these are faces you may write to, and a
     face on this board is otherwise a link to a profile. */
  .can .av{width:3.5rem;height:3.5rem;font-size:1.35rem;margin:0 auto;
    box-shadow:0 0 0 2px var(--paper),0 0 0 4px var(--accent)}
  .can .one.on .av{box-shadow:0 0 0 2px var(--paper),0 0 0 4px var(--ink)}

  /* Writing the first one, in the same place the reply box appears — so the
     two halves of this screen behave the same way. */
  .newnote{margin:0 0 1.4rem;padding:.9rem;border:1px solid var(--line);
    border-radius:.8rem;background:var(--raise)}
  .newnote b{display:block;font-size:.95rem}
  .newnote .how{margin:.45rem 0 0;font-size:.82rem;line-height:1.55;color:var(--muted)}
  .newnote textarea{width:100%;min-height:5.5rem;resize:vertical;font:inherit;
    margin:.6rem 0 0;padding:.7rem;border:1px solid var(--line);border-radius:.6rem;
    background:var(--paper);color:var(--ink)}
  .newnote .acts{display:flex;gap:.5rem;margin:.6rem 0 0;flex-wrap:wrap}
  .newnote .acts button{border:1px solid var(--line);background:var(--paper);
    color:var(--ink);border-radius:99px;padding:.5rem .95rem;font:inherit;
    font-size:.86rem;cursor:pointer}
  .newnote .acts button.primary{background:var(--accent);border-color:var(--accent);
    color:var(--accent-ink)}
  .newnote .said{margin:.5rem 0 0;font-size:.83rem;color:var(--muted)}
  .newnote .said.bad{color:var(--t5)}

  .dot{width:.55rem;height:.55rem;border-radius:50%;background:var(--accent);
    flex:0 0 auto;margin-top:.5rem}
  .dot.spent{background:transparent}
  a.av{color:var(--accent-ink);text-decoration:none}
  .av.small{width:2.8rem;height:2.8rem;font-size:1.1rem;box-shadow:none}

  /* Answering, in place. There is only ever one answer, so a sheet with its
     own screen would be more ceremony than the thing deserves. */
  .reply{margin:.75rem 0 0}
  .reply textarea{width:100%;min-height:5.5rem;resize:vertical;font:inherit;
    padding:.65rem .75rem;border-radius:.7rem;border:1px solid var(--line);
    background:var(--raise);color:var(--ink)}
  .reply .how{margin:.5rem 0 0;font-size:.82rem;line-height:1.55;color:var(--muted)}
</style>

</head>
<body>
<main>
  <div class="top">
    <button class="back" id="back" aria-label="Back">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 19l-7-7 7-7"/></svg>
    </button>
    <div>
      <h1 id="title"></h1>
      <p id="sub"></p>
    </div>
    <span id="langslot"></span>
  </div>

  <!-- WHO YOU CAN WRITE TO, ABOVE WHAT YOU HAVE ALREADY SAID.
       The inbox could only be replied to: starting a conversation meant
       remembering a name, finding the profile and pressing hello there, so
       somebody who opened this tab with nothing in it got a screen that said
       "no messages" and offered no way to have any. These are the people the
       server would already say yes to — nothing new is permitted here, it is
       the existing rule made visible. -->
  <div id="canwrap" hidden>
    <div class="rule"><span id="canlabel"></span><i></i></div>
    <p class="cansub" id="cansub"></p>
    <div class="can" id="can"></div>
  </div>

  <div class="rule"><span id="rulelabel"></span><i></i></div>
  <div id="list"></div>
  <div class="none" id="none" hidden></div>

  <p class="safety" id="safety"></p>
</main>

<!-- THE SAME FOUR TABS, SO THIS IS NOT A PLACE YOU LEAVE THE APP TO REACH.
     Messages is a tab in the bar now, and a tab that opens a screen with a
     back arrow and no bar on it is a link dressed as a tab — the bar vanishes
     under the thumb that just used it, which is exactly the disorientation
     four familiar positions were meant to remove.
     Markup and links only. index.html's bar is wired to a view switcher
     because three of its tabs are the same document; here there is nothing to
     switch, so a copy with the current one marked is the whole of it and
     there is no second set of handlers to keep in step. -->
<nav class="bar">
  <a href="/notes" aria-current="page">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16v12H4z M4 7l8 6 8-6"/></svg>
    <span id="tabnotes"></span>
  </a>
  <a href="/cards">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18v12H3z M3 10h18"/></svg>
    <span id="tabcards"></span>
  </a>
  <a href="/browse">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4h10a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2Z M9 15c1.5-2 4.5-2 6 0"/><circle cx="12" cy="10" r="2.2"/></svg>
    <span id="tabbrowse"></span>
  </a>
  <a href="/browse" id="tabmego">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8Z M4 21a8 8 0 0 1 16 0"/></svg>
    <span id="tabme"></span>
  </a>
</nav>

<script type="module">
import { T, when, lang, setLang, pickLang, langButton } from "/i18n.js";

const $ = (id) => document.getElementById(id);
const el = (t, c, x) => { const n = document.createElement(t); if (c) n.className = c;
  if (x !== undefined) n.textContent = x; return n; };
const fill = (n) => { while (n.firstChild) n.removeChild(n.firstChild); };
const initial = (name) => (String(name || "?").trim()[0] || "?").toLowerCase();

/* A COLOUR PER PERSON, FROM THEIR OWN NAME — the same routine, and so the
   same colour, as the card in room.html. Every letter avatar in a thread was
   the one accent blue, so two people who had not uploaded a photo were two
   identical blue circles and the only thing telling them apart was a letter.
   Not random: it has to be the same tomorrow, and the same to them as it is
   to the person reading. */
function wash(name) {
  let h = 0;
  for (const ch of String(name || "?")) h = (h * 31 + ch.codePointAt(0)) % 360;
  return "linear-gradient(150deg,hsl(" + h + " 26% 74%),hsl(" + ((h + 24) % 360) + " 24% 52%))";
}

let device = "";
try { device = localStorage.getItem("board:device") || ""; } catch { /* private window */ }

let NOTES = [], UNREAD = 0, YOU = { handle: "", photo: "" };
/* The people this person may start a conversation with, and which of them is
   open. One at a time: two compose boxes on a screen is two half-written
   messages and no way to tell which send button belongs to which. */
let CAN = [], WRITING = "";

async function load() {
  try {
    const d = await fetch("/api/notes", { cache: "no-store",
      headers: device ? { "x-board-device": device } : {} }).then((r) => r.json());
    NOTES = d.notes || [];
    CAN = d.can || [];
    YOU = d.you || { handle: "", photo: "" };
    UNREAD = d.unread || 0;
  } catch { NOTES = []; CAN = []; UNREAD = 0; YOU = { handle: "", photo: "" }; }
  paint();

  /* Marked read after they are on the screen, not before. Doing it in the
   * same breath as the fetch means a page that failed to render still
   * counted as read, and the message is then gone from the count with
   * nobody having seen it. */
  if (UNREAD && device) {
    fetch("/api/note/seen", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ device }),
    }).catch(() => { /* it stays unread, which is the safe way to be wrong */ });
  }
}

function paint() {
  $("title").textContent = T("note.inbox");
  $("rulelabel").textContent = T("note.inbox");
  $("safety").textContent = T("note.safety");
  $("tabnotes").textContent = T("note.inbox");
  $("tabcards").textContent = T("nav.cards");
  $("tabbrowse").textContent = T("nav.browse");
  $("tabme").textContent = T("nav.profile");
  /* PROFILE GOES TO YOUR OWN PAGE, and this screen already knows the handle —
     /api/notes sends it so the lines you wrote can carry your face. Without a
     page yet there is nowhere to send anybody, so it falls back to Browse,
     where the Professor's first card is the offer to make one. */
  $("tabmego").href = YOU.handle
    ? "/p/" + encodeURIComponent(YOU.handle.toLowerCase()) : "/browse";
  $("back").setAttribute("aria-label", T("nav.back"));
  $("sub").textContent = UNREAD ? T("note.newOnes", { n: UNREAD }) : T("note.inboxSub");

  drawCan();

  const box = $("list");
  fill(box);
  $("none").hidden = NOTES.length > 0;
  if (!NOTES.length) {
    fill($("none"));
    /* TWO EMPTY INBOXES, AND THEY ARE NOT THE SAME SCREEN. With nobody to
       write to, "no messages" is the whole truth and the answer is to go and
       follow people. With a row of faces above it, saying nothing is here
       reads as a dead end directly underneath the way out of it. */
    $("none").append(el("b", null, T("note.none")),
      el("p", null, T(CAN.length ? "note.noneYet" : "note.noneBody")));
    return;
  }
  for (const n of NOTES) box.append(row(n));
}

/** One face in the strip: their picture, their name, and what puts them on
 *  the list. Pressing opens the box under it. */
function drawCan() {
  $("canwrap").hidden = !CAN.length;
  if (!CAN.length) { WRITING = ""; return; }
  $("canlabel").textContent = T("note.canHead");
  $("cansub").textContent = T("note.canSub");
  const strip = $("can");
  fill(strip);
  for (const q of CAN) {
    const b = el("button", "one" + (WRITING === q.who ? " on" : ""));
    b.type = "button";
    const av = el("span", "av");
    av.textContent = initial(q.handle);
    av.style.background = wash(q.handle);
    if (q.photo) {
      const img = Object.assign(document.createElement("img"),
        { src: "/api/public-media?id=" + encodeURIComponent(q.photo), alt: "", loading: "lazy" });
      img.addEventListener("load", () => { av.textContent = ""; av.append(img); });
    }
    b.append(av, el("b", null, q.handle));
    // Only the deal is worth a word. "Matched" under every face is a label on
    // the one thing every face on this strip has in common.
    if (q.why === "deal") b.append(el("i", null, T("note.canDeal")));
    b.addEventListener("click", () => {
      // Pressing the open one shuts it, which is what a person expects of a
      // thing that toggled open.
      WRITING = WRITING === q.who ? "" : q.who;
      drawCan();
      drawNew();
    });
    strip.append(b);
  }
  drawNew();
}

/** The box for a first message. Same shape and same route as a reply — this
 *  screen should not have two ways of typing on it. */
function drawNew() {
  const old = document.getElementById("newnote");
  if (old) old.remove();
  const q = CAN.find((x) => x.who === WRITING);
  if (!q) return;

  const wrap = el("div", "newnote");
  wrap.id = "newnote";
  wrap.append(el("b", null, T("note.canTo", { who: q.handle })));
  wrap.append(el("p", "how", T(q.why === "deal" ? "note.openHow" : "note.canHow")));
  const ta = document.createElement("textarea");
  ta.maxLength = 600;
  ta.placeholder = T("note.placeholder");
  wrap.append(ta);
  const said = el("p", "said");
  const acts = el("div", "acts");
  const send = el("button", "primary", T("note.send"));
  send.type = "button";
  const go = el("a", null, T("note.openProfile"));
  go.href = "/p/" + encodeURIComponent((q.handle || "").toLowerCase());
  send.addEventListener("click", async () => {
    const text = ta.value.trim();
    if (!text) { ta.focus(); return; }
    send.disabled = true;
    said.classList.remove("bad");
    said.textContent = T("note.sending");
    try {
      const r = await fetch("/api/note", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ device, who: q.who, text }),
      });
      const d = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(d.error || "no");
      // Sent: they are a thread now, not a face on the strip, and load()
      // redraws both halves off one answer.
      WRITING = "";
      await load();
    } catch (err) {
      said.classList.add("bad");
      const known = { profile: "note.needProfile", enough: "note.enough",
                      gone: "note.gone", closed: "note.closed",
                      spent: "note.linesSpent" };
      said.textContent = T(known[String(err.message)] || "note.failed", { who: q.handle });
      send.disabled = false;
    }
  });
  acts.append(send, go);
  wrap.append(acts, said);
  $("canwrap").append(wrap);
  ta.focus();
}

function row(n) {
  const box = el("div", "note" + (n.mine ? " mine" : ""));
  box.append(el("div", "dot" + (n.mine || n.seen ? " spent" : "")));

  /* WHOEVER WROTE THE LINE, and it opens them. A list of messages from names
     you cannot put a face to is the same problem the feed had.
     On the lines you sent that is YOU. It was the other person on every row,
     which drew the same initial twice down a thread and read as one person
     talking to themselves — while the line beside it said "You wrote to Wei".
     A picture that contradicts the sentence next to it makes a screen feel
     broken without anybody being able to say why. */
  const face = n.mine ? YOU : n;
  if (face.handle) {
    const av = Object.assign(document.createElement("a"), {
      className: "av small",
      href: "/p/" + encodeURIComponent(face.handle.toLowerCase()),
      textContent: initial(face.handle),
    });
    av.setAttribute("aria-label", face.handle);
    av.style.background = wash(face.handle);
    if (face.photo) {
      const img = Object.assign(document.createElement("img"),
        { src: "/api/public-media?id=" + encodeURIComponent(face.photo), alt: "", loading: "lazy" });
      img.addEventListener("load", () => { av.textContent = ""; av.append(img); });
    }
    box.append(av);
  }

  const m = el("div", "m");
  const line = el("div", "line");
  line.append(el("b", null,
    T(n.mine ? "note.toThem" : "note.fromThem", { who: n.handle || "—" })));
  const t = el("time", null, when(n.at));
  t.dateTime = n.at;
  line.append(t);
  m.append(line, el("div", "text", n.text));

  /* WHAT WAS AGREED, ABOVE THE TALK.
   *
   * On the newest line of the thread only — the terms are a fact about the two
   * of you, not about each message, and repeating them under every line turns
   * the one thing worth reading into wallpaper.
   *
   * This is the only reason to type in here rather than in WeChat: the offer
   * somebody accepted sits over the conversation and cannot scroll away from
   * either of them. */
  if (n.deal && n.last !== false) {
    const pin = el("div", "pin");
    pin.append(el("span", "k",
      T(n.deal.kind === "project" ? "note.dealProject" : "note.dealJob")));
    pin.append(el("p", null, n.deal.give));
    if (n.deal.money) pin.append(el("p", "money", n.deal.money));
    m.append(pin);
  }

  const acts = el("div", "acts");
  if (n.handle) {
    const go = el("a", null, T("note.openProfile"));
    go.href = "/p/" + encodeURIComponent(n.handle.toLowerCase());
    acts.append(go);
  }

  const said = el("p", "said");

  /* THE BOX TO WRITE IN, on the newest message of the thread and nowhere else.
     A reply box under every line of a conversation is five boxes that all do
     the same thing, and in an open thread there are lines. */
  /* HOW MANY LINES ARE LEFT, said before they are spent rather than after.
     A box that refuses the seventh message without ever having mentioned six
     is a bug the person blames on themselves. */
  if (typeof n.left === "number" && n.last !== false) {
    const cap = el("p", "left" + (n.left ? "" : " spent"),
      T(n.left ? "note.linesLeft" : "note.linesSpent", { n: n.left }));
    m.append(cap);
  }

  if (n.canAnswer && n.last !== false) {
    const ans = el("button", "primary", T(n.open ? "note.write" : "note.answerIt"));
    ans.type = "button";
    ans.addEventListener("click", () => {
      ans.remove();
      const wrap = el("div", "reply");
      const ta = document.createElement("textarea");
      ta.maxLength = 600;
      ta.placeholder = T("note.placeholder");
      wrap.append(ta, el("p", "how", T(n.open ? "note.openHow" : "note.answerHow")));
      const send = el("button", "primary", T("note.send"));
      send.type = "button";
      send.addEventListener("click", async () => {
        const text = ta.value.trim();
        if (!text) { ta.focus(); return; }
        send.disabled = true;
        said.classList.remove("bad");
        said.textContent = T("note.sending");
        try {
          const r = await fetch("/api/note", {
            method: "POST", headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ device, who: n.who, text }),
          });
          const d = await r.json().catch(() => ({}));
          if (!r.ok) throw new Error(d.error || "no");
          await load();
        } catch (err) {
          said.classList.add("bad");
          const known = { profile: "note.needProfile", enough: "note.enough",
                          gone: "note.gone", closed: "note.closed",
                          spent: "note.linesSpent" };
          said.textContent = T(known[String(err.message)] || "note.failed", { who: n.handle });
          send.disabled = false;
        }
      });
      const acts2 = el("div", "acts");
      acts2.append(send);
      wrap.append(acts2);
      m.append(wrap);
      ta.focus();
    });
    acts.append(ans);
  }

  /* THE WAY OUT, on an open conversation and on its newest line so it sits
     where the person is already looking. One press and no reason asked: a
     private room is only safe if leaving it costs nothing and needs no
     sentence. The other person is never told who left. */
  if (n.open && n.last !== false && n.who) {
    const out = el("button", "warn", T("note.leave"));
    out.type = "button";
    out.addEventListener("click", async () => {
      if (!window.confirm(T("note.leaveSure", { who: n.handle || "—" }))) return;
      out.disabled = true;
      try {
        const r = await fetch("/api/note/shut", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ device, who: n.who }),
        });
        if (!r.ok) throw new Error("no");
        await load();
      } catch {
        out.disabled = false;
        said.classList.add("bad");
        said.textContent = T("note.failed");
      }
    });
    acts.append(out);
  }

  // Reporting, and only on something you received. Reporting your own message
  // is not a thing, and offering it would suggest it was.
  if (!n.mine) {
    if (n.reported) {
      acts.append(el("span", null, T("note.reported")));
    } else {
      const rep = el("button", "warn", T("note.report"));
      rep.type = "button";
      rep.addEventListener("click", async () => {
        const why = window.prompt(T("note.reportWhy"), "");
        if (why === null) return;
        rep.disabled = true;
        try {
          await fetch("/api/note/report", {
            method: "POST", headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ device, id: n.id, why }),
          });
          said.textContent = T("note.reported");
          rep.remove();
        } catch {
          rep.disabled = false;
          said.classList.add("bad");
          said.textContent = T("note.failed");
        }
      });
      acts.append(rep);
    }
  }

  m.append(acts, said);
  box.append(m);
  return box;
}

$("back").addEventListener("click", () => {
  if (history.length > 1) history.back(); else location.href = "/browse";
});

setLang(pickLang());
$("langslot").append(langButton(paint));
load();
</script>
