<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- Empty on every deployment but the demo board, where it pins this
     browser to the one seeded identity. See BOARD_DEMO_DEVICE in server.js. -->
{{DEMO}}
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="/favicon.png" sizes="192x192">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#EEF0F4">
<meta name="theme-color" content="#0B0E15" media="(prefers-color-scheme: dark)">
<!-- iOS reads these rather than the manifest for a home-screen install:
     no browser chrome, and a name short enough not to be truncated under
     the icon. -->
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<meta name="description" content="Introductions people sent you, and the ones you sent.">

<meta property="og:title" content="Messages">
<meta property="og:description" content="One message, answered once, and then you carry on somewhere else.">
<meta property="og:image" content="{{ORIGIN}}/share.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:url" content="{{ORIGIN}}/notes">
<meta name="robots" content="noindex">
<meta http-equiv="Cache-Control" content="no-cache">
<meta name="color-scheme" content="light dark">
<style>
  :root{
    --paper:#EEF0F4; --raise:#F7F8FB; --ink:#151B28; --ink-2:#4E5968;
    --muted:#8A939F; --line:#E3E6EC; --hair:#EAECF1;
    --accent:#3F68D8; --accent-ink:#FFFFFF; --accent-soft:#E8ECF7;
    --t1:#3F68D8; --t2:#2A9D63; --t3:#D99038; --t4:#7268C4; --t5:#D4485C; --t6:#2F8C9E;
    --serif:Georgia,"Songti SC","Noto Serif CJK SC",'Times New Roman',serif;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",
      "Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;
    --shadow:0 2px 6px rgba(21,27,40,.07),0 10px 28px rgba(21,27,40,.09);
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --paper:#0B0E15; --raise:#141924; --ink:#E9EDF5; --ink-2:#A3B0C4;
      --muted:#6F7D92; --line:#232B39; --hair:#1E2531;
      --accent:#5C8DFF; --accent-ink:#0B0E15; --accent-soft:#18233D;
      --t1:#5C8DFF; --t2:#4EBE88; --t3:#E4A65A; --t4:#9187E0; --t5:#F0687C; --t6:#4FA9BC;
      --shadow:0 2px 6px rgba(0,0,0,.4),0 12px 32px rgba(0,0,0,.34);
    }
  }
  :root[data-theme="dark"]{
    --paper:#0B0E15; --raise:#141924; --ink:#E9EDF5; --ink-2:#A3B0C4;
    --muted:#6F7D92; --line:#232B39; --hair:#1E2531;
    --accent:#5C8DFF; --accent-ink:#0B0E15; --accent-soft:#18233D;
    --t1:#5C8DFF; --t2:#4EBE88; --t3:#E4A65A; --t4:#9187E0; --t5:#F0687C; --t6:#4FA9BC;
    --shadow:0 2px 6px rgba(0,0,0,.4),0 12px 32px rgba(0,0,0,.34);
  }
  :root[data-lang="zh"]{
    --serif:"Songti SC","Noto Serif CJK SC","Source Han Serif SC","STSong",Georgia,serif;
    --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB",
      "Microsoft YaHei","Noto Sans SC","Segoe UI",sans-serif;
  }
  :root[data-lang="zh"] body{line-height:1.75}
  :root[data-lang="zh"] .rule span,
  :root[data-lang="zh"] .fact dt{text-transform:none;letter-spacing:.02em}
  [hidden]{display:none!important}

  *{box-sizing:border-box}
  /* One size up, the same as everywhere else — see the note in index.html. */
  html{font-size:17px;-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);
    font-size:1rem;line-height:1.5;-webkit-font-smoothing:antialiased}
  main{max-width:34rem;margin:0 auto;padding:1.4rem 1.15rem 5rem}
  /* ---- the list of people -------------------------------------------------
     One row per PERSON, not per message: avatar, name, the last line, the
     time, and a dot if it is unread. Everything a WeChat row has and nothing
     else — the buttons that used to sit under every message live inside the
     conversation now, which is where you are when you want them. */
  /* THE ROW SITS ON TOP OF THE WAY OUT. Dragging it left uncovers the button
     underneath rather than moving a button in from the side: one element
     moves, the thing revealed was always there, and nothing has to be
     measured. */
  .swipe{position:relative;overflow:hidden;border-bottom:1px solid var(--hair)}
  .swipe:last-child{border-bottom:0}
  .swipe .wipe{position:absolute;top:0;right:0;bottom:0;width:6rem;border:0;
    background:var(--t5);color:#fff;font:inherit;font-size:.88rem;
    cursor:pointer;padding:0}
  /* IT SHRINKS RATHER THAN SLIDING. Translating the whole row took its left
     edge off the screen — the face and the name went with it, so the thing
     you were about to leave was the one thing you could no longer see. */
  .trow{position:relative;display:flex;align-items:center;gap:.8rem;width:100%;
    border:0;background:var(--paper);padding:.75rem .1rem;text-align:left;
    font:inherit;color:var(--ink);cursor:pointer;
    transition:width .16s ease;touch-action:pan-y}
  .swipe.open .trow{width:calc(100% - 6.4rem)}
  @media (prefers-reduced-motion:reduce){.trow{transition:none}}
  .trow:hover{background:var(--raise)}
  /* The row has to be opaque or the button under it shows through. */
  .swipe.open .trow{background:var(--paper)}
  .trow .avwrap{position:relative;flex:0 0 auto}
  /* A rounded SQUARE, which is what a messenger uses and what tells this row
     apart at a glance from the round faces in the strip above it. */
  .trow .av{width:2.9rem;height:2.9rem;border-radius:.7rem;display:grid;
    place-items:center;color:#fff;font-family:var(--serif);font-size:1.25rem;
    overflow:hidden}
  .trow .av img{width:100%;height:100%;object-fit:cover;display:block}
  .trow .dot{position:absolute;top:-.15rem;right:-.15rem;min-width:.62rem;
    height:.62rem;border-radius:99px;background:var(--t5);
    box-shadow:0 0 0 2px var(--paper)}
  .trow .mid{flex:1;min-width:0}
  .trow .nm{display:flex;align-items:baseline;gap:.5rem}
  .trow .nm b{flex:1;min-width:0;font-family:var(--serif);font-weight:400;
    font-size:1.02rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .trow .nm time{flex:0 0 auto;font-size:.72rem;color:var(--muted)}
  .trow .prev{margin:.15rem 0 0;font-size:.85rem;color:var(--muted);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .trow .prev .k{color:var(--accent);font-weight:600}

  /* ---- the conversation ---------------------------------------------------
     Bubbles, because a conversation is two people and the side of the screen
     is how you tell at a glance which of them is talking. */
  .thead{display:flex;align-items:center;gap:.6rem;padding:.2rem 0 .9rem;
    border-bottom:1px solid var(--hair);margin:0 0 .9rem}
  .thead .tname{flex:1;min-width:0;text-decoration:none;color:var(--ink)}
  .thead .tname b{display:block;font-family:var(--serif);font-weight:400;
    font-size:1.15rem;line-height:1.2;overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap}
  .thead .tname span{display:block;font-size:.76rem;color:var(--muted)}
  /* The name, as a box, on the screen where a conversation's name would be. */
  .tnew{flex:1;min-width:0}
  .tnew span{display:block;font-size:.66rem;letter-spacing:.1em;
    text-transform:uppercase;color:var(--muted);font-weight:700}
  .tnew input{width:100%;border:0;background:none;font:inherit;
    font-family:var(--serif);font-size:1.2rem;color:var(--ink);padding:.1rem 0}
  .tnew input:focus{outline:none}
  .tnew input::placeholder{color:var(--muted)}
  .more{border:0;background:none;padding:.3rem;color:var(--ink-2);cursor:pointer}
  .more svg{width:1.35rem;height:1.35rem;fill:currentColor;stroke:none}
  .menu{margin:-.5rem 0 .9rem;padding:.3rem;border:1px solid var(--line);
    border-radius:.7rem;background:var(--raise);display:flex;flex-direction:column}
  .menu button,.menu a{border:0;background:none;padding:.6rem .7rem;font:inherit;
    font-size:.9rem;text-align:left;color:var(--ink);cursor:pointer;
    text-decoration:none;border-radius:.5rem}
  .menu button:hover,.menu a:hover{background:var(--paper)}
  .menu .warn{color:var(--t5)}

  /* THE CONVERSATION FILLS THE SCREEN, so the box is at the bottom of it and
     not floating under the last bubble. A short thread otherwise put the
     thing you type into halfway up a phone, with nothing under it. */
  #threadview{display:flex;flex-direction:column;
    min-height:calc(100dvh - 7.6rem)}
  .talk{flex:1;display:flex;flex-direction:column;justify-content:flex-end;
    gap:.55rem;padding:.2rem 0 .6rem}
  .bub{max-width:82%;padding:.6rem .8rem;border-radius:1.05rem;font-size:.95rem;
    line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere}
  /* Theirs on the left in the raised surface, yours on the right in the accent.
     Same convention as every messenger on the phone this is read on. */
  .bub.them{align-self:flex-start;background:var(--raise);color:var(--ink);
    border:1px solid var(--line);border-bottom-left-radius:.35rem}
  .bub.mine{align-self:flex-end;background:var(--accent);color:var(--accent-ink);
    border-bottom-right-radius:.35rem}
  .when{align-self:center;font-size:.7rem;color:var(--muted);margin:.4rem 0 .1rem}
  .bub.flag{outline:1px solid var(--t5);outline-offset:2px}

  .pinwrap{margin:0 0 .9rem;border:1px solid var(--accent);border-radius:.6rem;
    padding:.5rem .6rem;background:var(--raise)}
  .pinwrap .k{display:block;font-size:.6rem;letter-spacing:.12em;
    text-transform:uppercase;font-weight:700;color:var(--accent);margin:0 0 .25rem}
  .pinwrap p{margin:0;font-size:.88rem;line-height:1.5}
  .pinwrap p.money{margin-top:.2rem;font-weight:700}
  .left{margin:.2rem 0 .6rem;font-size:.78rem;color:var(--muted);text-align:center}
  .shut{margin:.6rem 0;padding:.7rem;border-radius:.7rem;background:var(--raise);
    font-size:.86rem;color:var(--ink-2);text-align:center}

  /* The box, at the bottom, above the tabs — where a thumb already is. */
  .write{position:sticky;bottom:4.6rem;display:flex;align-items:flex-end;gap:.5rem;
    padding:.5rem 0 .2rem;background:var(--paper)}
  .write textarea{flex:1;min-width:0;resize:none;font:inherit;font-size:.95rem;
    overflow:hidden;
    padding:.6rem .8rem;border:1px solid var(--line);border-radius:1.1rem;
    background:var(--raise);color:var(--ink);max-height:8rem}
  .send{flex:0 0 auto;width:2.4rem;height:2.4rem;border:0;border-radius:50%;
    background:var(--accent);color:var(--accent-ink);display:grid;
    place-items:center;cursor:pointer}
  .send svg{width:1.1rem;height:1.1rem;fill:currentColor;stroke:none;
    margin-left:-.1rem}
  .send:disabled{opacity:.45}

  /* The bar, copied from index.html so the four tabs sit in the same places on
     every screen that has them. Same rules, same breakpoints. */
  .bar{position:fixed;left:50%;transform:translateX(-50%);bottom:0;z-index:35;
    width:100%;max-width:34rem;display:flex;
    align-items:center;justify-content:space-around;
    padding:.35rem .5rem calc(.35rem + env(safe-area-inset-bottom));
    background:var(--paper);border-top:1px solid var(--line)}
  @media (min-width:36rem) and (max-width:57.99rem){
    .bar{border-left:1px solid var(--line);border-right:1px solid var(--line);
      border-radius:1rem 1rem 0 0}
  }
  .bar a{flex:1;min-width:0;color:var(--muted);
    display:flex;flex-direction:column;align-items:center;gap:.15rem;
    padding:.45rem .2rem;font-size:.64rem;text-decoration:none;letter-spacing:.02em}
  .bar a span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .bar a[aria-current="page"]{color:var(--accent)}
  /* The one line a waiting person gets instead of three tabs they cannot use. */
  .bar a.waitbar{flex:1;flex-direction:row;justify-content:center;
    font-size:.82rem;color:var(--ink-2);letter-spacing:0}
  .bar svg{width:1.5rem;height:1.5rem;stroke:currentColor;fill:none;stroke-width:1.7;
    stroke-linecap:round;stroke-linejoin:round}
  /* On a wide screen index.html moves its bar into the masthead. This page has
     no masthead to move it into, so it stays where it is and simply stops
     being full-bleed. */
  @media (min-width:58rem){ .bar{border-radius:1rem 1rem 0 0;
    border-left:1px solid var(--line);border-right:1px solid var(--line)} }
  button{font:inherit;cursor:pointer}
  a{color:inherit}
  img{max-width:100%}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}

  .top{display:flex;align-items:center;gap:.8rem;margin:0 0 1.3rem}
  .top h1{margin:0;font-family:var(--serif);font-weight:400;font-size:1.75rem;line-height:1.1}
  .top p{margin:.15rem 0 0;font-size:.85rem;color:var(--muted)}
  .back{border:0;background:none;color:var(--ink);padding:.2rem;margin-left:-.3rem;
    display:grid;place-items:center;flex:0 0 auto}
  .back svg{width:1.5rem;height:1.5rem;stroke:currentColor;fill:none;stroke-width:1.8;
    stroke-linecap:round;stroke-linejoin:round}
  .lang{margin-left:auto;flex:0 0 auto;border:1px solid var(--line);background:var(--raise);
    color:var(--ink-2);border-radius:99px;padding:.42rem .9rem;font-size:.85rem;line-height:1}

  /* THE HOME SCREEN, OFFERED ONCE. Same strip and same words as the one on
     Browse — install.js holds both, because a sentence that differs between
     two tabs of the same app reads as two different apps. Inside #listview so
     it goes away with the list when a conversation opens: an ask about the
     home screen on top of somebody's message is an ask in the wrong place. */
  .ins{display:flex;align-items:center;justify-content:center;gap:.5rem;
    margin:0 -1.15rem .9rem;padding:.5rem 1.15rem;background:var(--accent-soft);
    color:var(--accent);font-size:.78rem;letter-spacing:.02em;text-align:left}
  .ins button{border:0;background:none;color:inherit;font:inherit;padding:0;
    flex:0 0 auto;cursor:pointer}
  .insgo{background:var(--accent);color:var(--accent-ink);border-radius:99px;
    padding:.2rem .8rem;font-size:.78rem}
  .insno{font-size:1.1rem;line-height:1;opacity:.7;padding:0 .2rem}
  .insico{width:1em;height:1em;vertical-align:-.2em;display:inline-block}
  .rule{display:flex;align-items:center;gap:.9rem;margin:0 0 .3rem}
  .rule span{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;
    color:var(--muted);white-space:nowrap}
  .rule i{flex:1;height:1px;background:var(--line)}

  /* A person in the list. The same row the feed uses, so the two read as one
     product rather than two screens that happen to share a palette. */
  .who{display:flex;gap:.9rem;padding:1.2rem 0;border-bottom:1px solid var(--hair);
    width:100%;text-align:left;background:none;border-left:0;border-right:0;border-top:0;
    align-items:flex-start}
  .av{width:3.4rem;height:3.4rem;border-radius:50%;flex:0 0 auto;background:var(--accent);
    color:var(--accent-ink);display:grid;place-items:center;font-family:var(--serif);
    font-size:1.35rem;line-height:1;overflow:hidden;
    box-shadow:0 0 0 3px var(--paper),0 0 0 4px var(--accent-soft)}
  .av img{width:100%;height:100%;object-fit:cover;display:block}
  .m{flex:1;min-width:0}
  .nameline{display:flex;align-items:baseline;gap:.5rem}
  .nameline b{font-family:var(--serif);font-weight:400;font-size:1.15rem;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .nameline .lv{margin-left:auto;flex:0 0 auto;font-size:.72rem;letter-spacing:.05em;
    border:1px solid var(--line);border-radius:99px;padding:.16rem .55rem;color:var(--muted)}
  .where{margin:.15rem 0 0;font-size:.83rem;color:var(--muted)}
  .goal{margin:.45rem 0 0;font-family:var(--serif);font-size:1rem;line-height:1.5;
    color:var(--ink-2);overflow-wrap:anywhere}
  .days{display:flex;gap:.25rem;margin:.55rem 0 0;flex-wrap:wrap}
  .days b{width:1.75rem;height:1.75rem;display:grid;place-items:center;border-radius:.4rem;
    font-size:.72rem;font-weight:500;background:var(--paper);border:1px solid var(--line);
    color:var(--muted)}
  .days b.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

  .none{padding:3rem .5rem;text-align:center;color:var(--muted)}
  .none b{display:block;font-family:var(--serif);font-weight:400;font-size:1.3rem;
    color:var(--ink);margin:0 0 .4rem}
  .none p{margin:0 auto 1.3rem;max-width:26rem;font-size:.95rem;line-height:1.6}
  .none button{border:0;background:var(--accent);color:var(--accent-ink);border-radius:99px;
    padding:.75rem 1.6rem;font-size:1rem}

  .safety{margin:2rem 0 0;padding:.95rem 1.05rem;background:var(--raise);
    border:1px solid var(--line);border-left:3px solid var(--t3);border-radius:.6rem;
    font-size:.86rem;line-height:1.6;color:var(--ink-2)}

  /* A note. Two shapes, not one with a modifier: what somebody sent you is a
     thing to decide about, what you sent is a receipt. Making them look the
     same made a page where you could not tell at a glance which was which. */
  .note{padding:1.15rem 0;border-bottom:1px solid var(--hair);display:flex;gap:.9rem;
    align-items:flex-start}
  .note .m{flex:1 1 auto;min-width:0}
  .note .line{display:flex;align-items:baseline;gap:.5rem;flex-wrap:wrap}
  .note .line b{font-family:var(--serif);font-weight:400;font-size:1.08rem}
  .note .line time{margin-left:auto;font-size:.78rem;color:var(--muted);flex:0 0 auto}
  .note .text{margin:.45rem 0 0;font-family:var(--serif);font-size:1.02rem;line-height:1.55;
    overflow-wrap:anywhere;white-space:pre-wrap}
  .note.mine .text{color:var(--ink-2)}
  .note .acts{display:flex;gap:.5rem;margin:.75rem 0 0;flex-wrap:wrap}
  .note .acts button,.note .acts a{border:1px solid var(--line);background:var(--raise);
    color:var(--ink);border-radius:99px;padding:.5rem 1.05rem;font-size:.87rem;
    text-decoration:none;display:inline-block}
  .note .acts button.primary{background:var(--accent);border-color:var(--accent);
    color:var(--accent-ink)}
  .note .acts button.warn{color:var(--t5)}
  .note .said{margin:.55rem 0 0;font-size:.83rem;color:var(--muted)}

  /* The terms an accepted offer put over the thread. Bordered in the accent
     rather than tucked into the muted voice: it is the thing on this screen
     that both people are working from. */
  .note .pin{margin:.6rem 0 0;border:1px solid var(--accent);border-radius:.55rem;
    padding:.45rem .55rem;background:var(--paper)}
  .note .pin .k{display:block;font-size:.6rem;letter-spacing:.12em;
    text-transform:uppercase;font-weight:700;color:var(--accent);margin:0 0 .25rem}
  .note .pin p{margin:0;font-size:.86rem;line-height:1.5;color:var(--ink)}
  .note .pin p.money{margin-top:.2rem;font-weight:700}
  .note .left{margin:.5rem 0 0;font-size:.76rem;color:var(--muted)}
  .note .left.spent{color:var(--ink-2)}
  .note .said.bad{color:var(--t5)}
  /* Unread. A dot rather than a colour wash: the message is what should be
     read, not the fact that it is new. */
  /* A ROW OF FACES, SCROLLED SIDEWAYS. Down the page they would push the
     conversations that already exist off the screen, which gets the priority
     backwards — the inbox is what somebody opened this for. */
  .cansub{margin:.1rem 0 .7rem;font-size:.82rem;line-height:1.5;color:var(--muted)}
  .can{display:flex;gap:.9rem;overflow-x:auto;padding:.1rem .1rem 1.1rem;
    margin:0 0 .4rem;scrollbar-width:none;-webkit-overflow-scrolling:touch}
  .can::-webkit-scrollbar{display:none}
  .can .one{flex:0 0 auto;width:4.4rem;border:0;background:none;padding:0;
    font:inherit;cursor:pointer;text-align:center;color:var(--ink)}
  .can .one b{display:block;margin:.4rem 0 0;font-size:.78rem;font-weight:600;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .can .one i{display:block;font-style:normal;font-size:.66rem;color:var(--accent);
    letter-spacing:.06em;text-transform:uppercase;font-weight:700}
  /* Waiting on them is a state, not a thing to do — so it is said in the
     quiet voice, and the ring around the face comes off with it. */
  .can .one i.quiet{color:var(--muted)}
  .can .one.hold .av{box-shadow:0 0 0 2px var(--paper),0 0 0 4px var(--line)}
  /* The ＋ at the head of the strip. A dashed ring rather than a filled disc:
     it is the space a person goes in, not a person. */
  .can a.one{text-decoration:none}
  .can .one.add .av{background:none;border:2px dashed var(--line);
    color:var(--accent);font-size:1.5rem;font-family:var(--sans);box-shadow:none}
  .can .one.add:hover .av{border-color:var(--accent)}
  /* The ring is the whole affordance: these are faces you may write to, and a
     face on this board is otherwise a link to a profile. */
  .can .av{width:3.5rem;height:3.5rem;font-size:1.35rem;margin:0 auto;
    box-shadow:0 0 0 2px var(--paper),0 0 0 4px var(--accent)}
  .can .one.on .av{box-shadow:0 0 0 2px var(--paper),0 0 0 4px var(--ink)}

  /* Writing the first one, in the same place the reply box appears — so the
     two halves of this screen behave the same way. */
  /* .newnote is gone with the inline first-message box — see drawCan. */

  .dot{width:.55rem;height:.55rem;border-radius:50%;background:var(--accent);
    flex:0 0 auto;margin-top:.5rem}
  .dot.spent{background:transparent}
  a.av{color:var(--accent-ink);text-decoration:none}
  .av.small{width:2.8rem;height:2.8rem;font-size:1.1rem;box-shadow:none}

  /* Answering, in place. There is only ever one answer, so a sheet with its
     own screen would be more ceremony than the thing deserves. */
  .reply{margin:.75rem 0 0}
  .reply textarea{width:100%;min-height:5.5rem;resize:vertical;font:inherit;
    padding:.65rem .75rem;border-radius:.7rem;border:1px solid var(--line);
    background:var(--raise);color:var(--ink)}
  .reply .how{margin:.5rem 0 0;font-size:.82rem;line-height:1.55;color:var(--muted)}
</style>

</head>
<body>
<main>
  <!-- TWO SCREENS IN ONE PAGE, because that is the shape of every messenger
       anybody here already uses: a list of PEOPLE, and a conversation that
       opens on top of it. What was here was an email inbox — a flat list of
       individual messages, each with four buttons under it — which is a shape
       nobody has to learn and nobody recognises either.
       The thread lives at #<person id> so the phone's own back gesture works
       and a reload keeps you where you were. -->
  <div class="top" id="listtop">
    <div>
      <h1 id="title"></h1>
      <p id="sub"></p>
    </div>
    <span id="langhome"></span>
  </div>

  <div id="listview">
    <p class="ins" id="install" hidden></p>
    <!-- And the second half of that ask. On iOS this only appears once the app
         IS on the home screen — Safari has no web push in a browser tab — so
         the two strips are never up together and never compete. -->
    <p class="ins" id="notify" hidden></p>
    <!-- WHO YOU CAN WRITE TO. WeChat hides starting a chat behind the ＋ in
         the corner, and its billion users know it is there. Nobody here does,
         and this strip is the whole reason the inbox stopped being a dead end,
         so it stays visible. The one deliberate departure on this page.
         EVERYBODY, including people you already have a thread with — see the
         note in /api/notes. It is the stories row it looks like: your people.
         The list underneath is your conversations, which is a different
         question, and the same face appearing in both is how every messenger
         with a row at the top already works. -->
    <div id="canwrap" hidden>
      <div class="rule"><span id="canlabel"></span><i></i></div>
      <p class="cansub" id="cansub"></p>
      <div class="can" id="can"></div>
    </div>

    <div class="rule" id="listrule"><span id="rulelabel"></span><i></i></div>
    <div id="list"></div>
    <div class="none" id="none" hidden></div>
    <p class="safety" id="safety"></p>
  </div>

  <!-- THE CONVERSATION. Header with the way back and their name, the lines as
       bubbles, and the box at the bottom where a thumb already is. -->
  <div id="threadview" hidden>
    <div class="thead">
      <button class="back" id="back" aria-label="Back">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 19l-7-7 7-7"/></svg>
      </button>
      <a class="tname" id="twho" href="#"><b id="twhoname"></b><span id="twhosub"></span></a>
      <!-- WRITING TO SOMEBODY WHO IS NOT HERE. The same screen, with the one
           thing that differs: there is no name yet, so the name is a box.
           Everything else — the bubbles, the composer, the send arrow — is the
           conversation view, because it IS one: you are writing the first
           message of a thread that does not exist yet. -->
      <label class="tnew" id="tnew" hidden>
        <span id="tnewk"></span>
        <input id="tnewname" maxlength="40" autocomplete="off">
      </label>
      <!-- THE LANGUAGE BUTTON LIVES IN WHICHEVER HEADER IS UP. It was in the
           list's header only, which this screen hides — so opening a
           conversation, or the screen where you write a note that is about to
           go to somebody in Chinese, took the toggle away. One button, moved
           between the two slots on every paint, rather than two buttons to
           keep in step. -->
      <span id="langaway"></span>
      <button class="more" id="tmore" aria-label="More" aria-expanded="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="19" cy="12" r="1.4"/></svg>
      </button>
    </div>
    <!-- Leaving and reporting are behind the ⋯, as they are in every app that
         has them: they are rare, permanent, and do not belong beside the box
         somebody types in. -->
    <div class="menu" id="tmenu" hidden></div>
    <div class="pinwrap" id="tpin" hidden></div>
    <div class="talk" id="talk"></div>
    <p class="left" id="tleft" hidden></p>
    <p class="shut" id="tshut" hidden></p>
    <div class="write" id="twrite" hidden>
      <textarea id="tbox" rows="1" maxlength="600"></textarea>
      <button class="send" id="tsend" aria-label="Send">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4l16 8-16 8 3-8z"/></svg>
      </button>
    </div>
    <p class="said" id="tsaid" hidden></p>
  </div>
</main>

<!-- THE SAME FOUR TABS, SO THIS IS NOT A PLACE YOU LEAVE THE APP TO REACH.
     Messages is a tab in the bar now, and a tab that opens a screen with a
     back arrow and no bar on it is a link dressed as a tab — the bar vanishes
     under the thumb that just used it, which is exactly the disorientation
     four familiar positions were meant to remove.
     Markup and links only. index.html's bar is wired to a view switcher
     because three of its tabs are the same document; here there is nothing to
     switch, so a copy with the current one marked is the whole of it and
     there is no second set of handlers to keep in step. -->
<nav class="bar">
  <a href="/notes" aria-current="page">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16v12H4z M4 7l8 6 8-6"/></svg>
    <span id="tabnotes"></span>
  </a>
  <a href="/cards" id="tabcardsgo">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18v12H3z M3 10h18"/></svg>
    <span id="tabcards"></span>
  </a>
  <a href="/browse" id="tabbrowsego">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4h10a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2Z M9 15c1.5-2 4.5-2 6 0"/><circle cx="12" cy="10" r="2.2"/></svg>
    <span id="tabbrowse"></span>
  </a>
  <a href="/browse" id="tabmego">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8Z M4 21a8 8 0 0 1 16 0"/></svg>
    <span id="tabme"></span>
  </a>
  <!-- In place of the three tabs, for somebody on the list. -->
  <a class="waitbar" href="/waiting" id="waitbar" hidden></a>
</nav>

<script type="module">
import { T, when, lang, setLang, pickLang, langButton } from "/i18n.js";
import { offerInstall } from "/install.js";
import { offerNotify } from "/notify.js";

const $ = (id) => document.getElementById(id);
const el = (t, c, x) => { const n = document.createElement(t); if (c) n.className = c;
  if (x !== undefined) n.textContent = x; return n; };
const fill = (n) => { while (n.firstChild) n.removeChild(n.firstChild); };
const initial = (name) => (String(name || "?").trim()[0] || "?").toLowerCase();

/* A COLOUR PER PERSON, FROM THEIR OWN NAME — the same routine, and so the
   same colour, as the card in room.html. Every letter avatar in a thread was
   the one accent blue, so two people who had not uploaded a photo were two
   identical blue circles and the only thing telling them apart was a letter.
   Not random: it has to be the same tomorrow, and the same to them as it is
   to the person reading. */
function wash(name) {
  let h = 0;
  for (const ch of String(name || "?")) h = (h * 31 + ch.codePointAt(0)) % 360;
  return "linear-gradient(150deg,hsl(" + h + " 26% 74%),hsl(" + ((h + 24) % 360) + " 24% 52%))";
}

/* WeChat's own browser will not open a share sheet — the ⋯ menu at the top of
   ITS window is the only way — so the honest fallback there is the clipboard
   and a line saying where the real control is. Same test the rest of the app
   uses. */
const IN_WECHAT = /micromessenger/i.test(navigator.userAgent);

/** Put something on the clipboard, and say whether it worked. The modern API
 *  needs a secure context and a permission; the old one needs a node in the
 *  document. Both are tried because half the phones here are on one and half
 *  on the other. */
function copyText(text) {
  try {
    const t = document.createElement("textarea");
    t.value = text;
    t.setAttribute("readonly", "");
    t.style.position = "fixed";
    t.style.opacity = "0";
    document.body.append(t);
    t.select();
    const ok = document.execCommand && document.execCommand("copy");
    t.remove();
    if (ok) return true;
  } catch { /* fall through to the async one */ }
  if (navigator.clipboard) {
    navigator.clipboard.writeText(text).catch(() => {});
    return true;
  }
  return false;
}

let device = "";
try {
  device = localStorage.getItem("board:device") || "";
  /* MADE HERE IF IT IS NOT THERE, which it is not for exactly one visitor:
     somebody arriving on /w/<code> who has never opened this board. Every
     other page assumes a device because every other page is behind the door.
     Their answer is written against it, so without this the reply was refused
     for having nobody behind it — which is how it failed the first time. */
  if (!device) {
    device = (crypto.randomUUID ? crypto.randomUUID()
      : String(Date.now()) + Math.random().toString(16).slice(2));
    localStorage.setItem("board:device", device);
  }
} catch { /* private window: it still works, it just forgets */ }

let NOTES = [], UNREAD = 0, YOU = { handle: "", photo: "" };
/* SOMEBODY A MEMBER WROTE TO, WHO IS ON THE LIST AND NOT THROUGH THE DOOR.
   They have one conversation and nothing else, so the other three tabs would
   send them to a password box. */
let WAITING = false;
/* The people this person may start a conversation with, and which of them is
   open. One at a time: two compose boxes on a screen is two half-written
   messages and no way to tell which send button belongs to which. */
let CAN = [];

async function load() {
  /* AN INVITED ARRIVAL HAS NO INBOX YET. They are nobody to this server until
     they answer, so asking for one would be a 403 before the screen has drawn
     — and the screen is the whole point. The note itself is public to whoever
     holds the link; that is all this needs. */
  if (INVITED) {
    try {
      NOTE = await fetch("/api/write/" + encodeURIComponent(INVITED),
        { cache: "no-store" }).then((r) => (r.ok ? r.json() : { gone: "bad" }));
    } catch { NOTE = { gone: "bad" }; }
    paint();
    return;
  }
  try {
    const d = await fetch("/api/notes", { cache: "no-store",
      headers: device ? { "x-board-device": device } : {} }).then((r) => r.json());
    NOTES = d.notes || [];
    WAITING = Boolean(d.waiting);
    CAN = d.can || [];
    YOU = d.you || { handle: "", photo: "" };
    UNREAD = d.unread || 0;
  } catch { NOTES = []; CAN = []; UNREAD = 0; YOU = { handle: "", photo: "" }; }
  paint();

  /* Marked read after they are on the screen, not before. Doing it in the
   * same breath as the fetch means a page that failed to render still
   * counted as read, and the message is then gone from the count with
   * nobody having seen it. */
  if (UNREAD && device) {
    fetch("/api/note/seen", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ device }),
    }).catch(() => { /* it stays unread, which is the safe way to be wrong */ });
  }
}

/* WHICH SCREEN IS UP. The person id of the open conversation, or "" for the
   list. It lives in the hash so the phone's own back gesture closes a thread
   instead of leaving the app, and a reload puts you back in it. */
const openWho = () => (location.hash || "").replace(/^#/, "");

/* ---- ARRIVING ON A WRITTEN NOTE ------------------------------------------
 *
 * /w/<code> is THIS page. It was a screen of its own that explained the board
 * and had a form on it, which is a page ABOUT an app; what somebody should get
 * when a friend sends them a message is the app, with the message in it.
 *
 * So they land in the messenger: the line written to them as the first
 * bubble, the person who wrote it at the top, a box at the bottom, and the
 * same four tabs everybody else has. Answering is sending a message. There is
 * no form, and the name is the one the member wrote on the note — they knew
 * who they were writing to.
 */
const INVITED = /^\/w\//.test(location.pathname)
  ? decodeURIComponent(location.pathname.split("/").filter(Boolean)[1] || "").toUpperCase()
  : "";
let NOTE = null;

/** The flat list of messages, grouped into one entry per person. The server
 *  sends messages because that is what they are; a messenger shows people. */
function threads() {
  const by = new Map();
  for (const n of NOTES) {
    if (!n.who) continue;
    let t = by.get(n.who);
    if (!t) {
      t = { who: n.who, handle: n.handle, photo: n.photo, notes: [], unread: 0 };
      by.set(n.who, t);
    }
    // The newest name and face win: a thread carries several messages and the
    // person may have changed either since the first of them.
    if (n.handle) t.handle = n.handle;
    if (n.photo) t.photo = n.photo;
    t.notes.push(n);
    if (!n.mine && !n.seen) t.unread += 1;
  }
  for (const t of by.values()) {
    t.notes.sort((a, b) => String(a.at).localeCompare(String(b.at)));
    t.last = t.notes[t.notes.length - 1];
  }
  return [...by.values()].sort((a, b) =>
    String(b.last.at).localeCompare(String(a.last.at)));
}

/** Somebody on the can-write-to list with no thread yet, in the shape the
 *  thread screen expects. `last` is what drawThread reads the rules off; for a
 *  first message they are the server's own answer — it said yes to this person
 *  by putting them on the list at all. */
function blank(who) {
  const q = CAN.find((x) => x.who === who);
  if (!q) return null;
  return {
    who, handle: q.handle, photo: q.photo, notes: [], unread: 0, fresh: true,
    last: { canAnswer: true, open: q.why === "deal", deal: undefined, at: "" },
  };
}

/** The one language button, put in whichever header is on screen. */
function homeLang() {
  const slot = openWho() ? $("langaway") : $("langhome");
  if (LANGBTN && LANGBTN.parentNode !== slot) slot.append(LANGBTN);
}
let LANGBTN = null;

function paint() {
  const who = openWho();
  homeLang();
  if (INVITED) return drawInvited();
  const T0 = threads();
  /* A CONVERSATION THAT HAS NOT HAPPENED YET IS STILL A CONVERSATION.
     Tapping a face in the strip opens this screen with nothing in it and the
     box at the bottom — which is what every messenger does and what the inline
     box under the strip was standing in for. */
  /* "#new" IS A CONVERSATION WITH NOBODY YET. Writing to somebody who is not
     on the board used to be a sheet on another screen with four steps in it —
     name, line, make the note, then a block of text and a Send button. It is
     this screen now, with the name as a box, because what you are doing is
     writing the first message of a thread. */
  if (who === "new") { drawWriteNew(); return; }
  const here = who && (T0.find((t) => t.who === who) || blank(who));
  $("listview").hidden = Boolean(here);
  $("listtop").hidden = Boolean(here);
  $("threadview").hidden = !here;
  document.title = T("note.inbox");
  $("tabnotes").textContent = T("note.inbox");
  $("tabcards").textContent = T("nav.cards");
  $("tabbrowse").textContent = T("nav.browse");
  $("tabme").textContent = T("nav.profile");
  /* THE BAR IS FOR MEMBERS. Somebody on the list has one conversation and
     three tabs that would bounce them off a door, so they get the one line
     that is true for them instead: where they stand, and how to get in. */
  /* THE ANCHORS, NOT THE LABELS INSIDE THEM. tabcards and tabbrowse are the
     <span>s that hold the words — hiding those left two tabs that were still
     there, still tappable, and now wordless. */
  for (const id of ["tabcardsgo", "tabbrowsego", "tabmego"]) $(id).hidden = WAITING;
  $("waitbar").hidden = !WAITING;
  /* Not for the waiting list and not for an invited arrival: both are being
     asked to get in, and two asks at once is neither. */
  offerInstall($("install"), !WAITING);
  // Deliberately not awaited: it asks the board for the key and the browser
  // for its registration, and the list must not wait on either.
  offerNotify($("notify"), !WAITING);
  if (WAITING) $("waitbar").textContent = T("note.onList");
  $("tabmego").href = YOU.handle
    ? "/p/" + encodeURIComponent(YOU.handle.toLowerCase()) : "/browse";
  $("back").setAttribute("aria-label", T("nav.back"));
  if (here) { drawThread(here); return; }
  /* A HASH NAMING A CONVERSATION THAT IS NOT THERE. Left over from a thread
     somebody walked out of, or a stale link — the list is the honest answer
     rather than an empty screen with a back arrow. */
  if (who) history.replaceState(null, "", location.pathname);
  drawList(T0);
}

function drawList(T0) {
  $("title").textContent = T("note.inbox");
  $("rulelabel").textContent = T("note.inbox");
  $("safety").textContent = T("note.safety");
  const unread = T0.reduce((n, t) => n + t.unread, 0);
  $("sub").textContent = unread ? T("note.newOnes", { n: unread }) : T("note.inboxSub");

  drawCan();

  const box = $("list");
  fill(box);
  $("listrule").hidden = !T0.length;
  $("none").hidden = T0.length > 0;
  if (!T0.length) {
    fill($("none"));
    $("none").append(el("b", null, T("note.none")),
      el("p", null, T(CAN.length ? "note.noneYet" : "note.noneBody")));
    return;
  }
  for (const t of T0) box.append(listRow(t));
}

/** One person, one row.
 *
 *  DRAG IT LEFT TO LEAVE THE CONVERSATION. The way out was three taps down
 *  inside the thread, behind the ⋯ — which is where it belongs for something
 *  permanent, and is also where nobody looks when they are clearing a list.
 *  Every messenger on this phone does it with a swipe, so this does too.
 *
 *  It is the same act as "Leave this chat" and just as permanent: both sides
 *  lose it, and neither is told who left. So the swipe reveals a button and
 *  does not do it — a gesture that deletes on release is a gesture that
 *  deletes by accident in a pocket.
 */
function listRow(t) {
  const wrap = el("div", "swipe");
  const out = el("button", "wipe", T("note.leaveShort"));
  out.type = "button";
  out.addEventListener("click", async () => {
    if (!window.confirm(T("note.leaveSure", { who: t.handle || "—" }))) return;
    out.disabled = true;
    try {
      const r = await fetch("/api/note/shut", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ device, who: t.who }),
      });
      if (!r.ok) throw new Error("no");
      await load();
    } catch { out.disabled = false; }
  });
  wrap.append(out);

  const b = el("button", "trow");
  b.type = "button";
  const wrap2 = el("div", "avwrap");
  const av = el("div", "av", initial(t.handle));
  av.style.background = wash(t.handle);
  if (t.photo) {
    const img = Object.assign(document.createElement("img"),
      { src: "/api/public-media?id=" + encodeURIComponent(t.photo), alt: "", loading: "lazy" });
    img.addEventListener("load", () => { av.textContent = ""; av.append(img); });
  }
  wrap2.append(av);
  if (t.unread) wrap2.append(el("span", "dot"));
  const mid = el("div", "mid");
  const nm = el("div", "nm");
  nm.append(el("b", null, t.handle || "—"));
  const time = el("time", null, when(t.last.at));
  time.dateTime = t.last.at;
  nm.append(time);
  const prev = el("p", "prev");
  /* "You:" IN FRONT OF YOUR OWN LAST LINE. Without it a row whose newest
     message is one you sent reads as one they sent, and the whole list is a
     guess about who spoke last. */
  if (t.last.mine) prev.append(el("span", "k", T("note.youSaid") + " "));
  prev.append(document.createTextNode(t.last.text || ""));
  mid.append(nm, prev);
  b.append(wrap2, mid);
  b.addEventListener("click", () => {
    if (dragged) { dragged = false; return; }
    // A row that is open is a row somebody dragged. Tapping it puts it back
    // rather than opening the conversation, which is what a thumb expects.
    if (wrap.classList.contains("open")) { wrap.classList.remove("open"); return; }
    openThread(t.who);
  });

  /* THE DRAG. Pointer events, so a mouse on a laptop behaves like a thumb.
     Horizontal only: a list is scrolled vertically far more often than a row
     is swiped, and stealing that is the way to make a list feel broken. */
  let x0 = 0, y0 = 0, decided = "", dragged = false;
  b.addEventListener("pointerdown", (e) => {
    x0 = e.clientX; y0 = e.clientY; decided = ""; dragged = false;
  });
  b.addEventListener("pointermove", (e) => {
    if (!x0) return;
    const dx = e.clientX - x0, dy = e.clientY - y0;
    if (!decided) {
      if (Math.abs(dx) < 8 && Math.abs(dy) < 8) return;
      decided = Math.abs(dx) > Math.abs(dy) ? "x" : "y";
    }
    if (decided !== "x") return;
    e.preventDefault();
    wrap.classList.toggle("open", dx < -34);
  });
  /* A DRAG THAT STARTS AND ENDS ON THE SAME ELEMENT STILL FIRES A CLICK. So
     the row opened and the click that ended the drag immediately closed it
     again — the swipe looked like it did nothing at all. The flag survives
     until the next press, which is the only thing it has to outlive. */
  const done = () => { dragged = decided === "x"; x0 = 0; decided = ""; };
  b.addEventListener("pointerup", done);
  b.addEventListener("pointercancel", done);
  wrap.append(b);
  return wrap;
}

function openThread(who) {
  location.hash = "#" + who;   // a real history entry, so Back closes it
}

/* The phone's own back gesture, and the arrow in the header, are the same
   thing: they change the hash, and this redraws. */
window.addEventListener("hashchange", () => { paint(); window.scrollTo(0, 0); });

/** THE SCREEN SOMEBODY SEES WHEN A FRIEND SENDS THEM A NOTE.
 *
 *  The app, with the message in it. Their friend's name at the top, the line
 *  as the first bubble, a box at the bottom, and the same four tabs everybody
 *  else has — which for them lead to the door, and that is the honest next
 *  step for somebody who is not in yet.
 *
 *  No name asked for. The member wrote the note to a person by name; asking
 *  them to type it back is a form pretending to be a conversation. */
function drawInvited() {
  $("listview").hidden = true;
  $("listtop").hidden = true;
  $("threadview").hidden = false;
  $("tnew").hidden = true;
  $("tmore").hidden = true;
  $("tmenu").hidden = true;
  $("tpin").hidden = true;
  $("tleft").hidden = true;
  $("back").hidden = true;          // there is nothing behind this
  $("twho").hidden = false;
  $("twho").href = "#";

  const talk = $("talk");
  fill(talk);

  if (!NOTE || NOTE.gone) {
    $("twhoname").textContent = T("wn.title");
    $("twhosub").textContent = "";
    const key = (NOTE && NOTE.gone) || "bad";
    talk.append(el("p", "when",
      T({ spent: "wn.spentBody", old: "wn.oldBody" }[key] || "wn.badBody")));
    $("twrite").hidden = true;
    $("tshut").hidden = false;
    $("tshut").textContent = T({ spent: "wn.spentHead", old: "wn.oldHead" }[key]
      || "wn.badCode");
    drawInvitedTabs();
    return;
  }

  $("twhoname").textContent = NOTE.from || T("board.someone");
  $("twhosub").textContent = T("wn.onThe");
  talk.append(el("p", "when", T("wn.wrote", { who: NOTE.from || T("board.someone") })));
  const bub = el("div", "bub them");
  bub.textContent = NOTE.line;
  talk.append(bub);
  /* WHAT ANSWERING DOES, before they answer. A queue is not a door, and
     somebody who writes back expecting to be let in has been misled by
     leaving it out. One line, where a message would be. */
  talk.append(el("p", "when", T("wn.next", { who: NOTE.from || T("board.someone") })));

  $("twrite").hidden = false;
  $("tshut").hidden = true;
  /* SHORT. wn.replyPh is an example of what to say — two lines, right in a
     form with room for it and clipped mid-word in a one-line composer. Two
     words here, and the line above the box already says what to write. */
  $("tbox").placeholder = T("wn.answerHead");
  $("tsaid").hidden = true;
  drawInvitedTabs();
}

/** The bar, for somebody who has not answered yet. All four, because the
 *  point of arriving here is seeing what this is — and three of them lead to
 *  the door, which is what there is for them until somebody vouches. */
function drawInvitedTabs() {
  $("tabnotes").textContent = T("note.inbox");
  $("tabcards").textContent = T("nav.cards");
  $("tabbrowse").textContent = T("nav.browse");
  $("tabme").textContent = T("nav.profile");
  for (const id of ["tabcardsgo", "tabbrowsego", "tabmego"]) $(id).hidden = false;
  $("waitbar").hidden = true;
  $("tabmego").href = "/waiting";
}

/** Answering is sending a message. It writes their waiting row, turns the
 *  note into a thread, and reloads onto the real conversation. */
async function sendInvited() {
  const text = $("tbox").value.trim();
  if (!text) { $("tbox").focus(); return; }
  $("tsend").disabled = true;
  say(T("wn.sending"));
  let d = null;
  try {
    d = await fetch("/api/write/reply", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ device, code: INVITED, name: NOTE.to, reply: text }),
    }).then((r) => r.json());
  } catch { d = null; }
  $("tsend").disabled = false;
  if (!d || (!d.ok && !d.already)) {
    return say(T({ spent: "wn.spentHead", old: "wn.oldHead", bad: "wn.badCode" }[d && d.error]
      || "act.again"), true);
  }
  if (d.already) { location.href = "/browse"; return; }
  // Onto the thread it just became — same screen, real conversation.
  location.href = d.who ? "/notes#" + encodeURIComponent(d.who) : "/notes";
}

/* ---- WRITING TO SOMEBODY WHO IS NOT HERE ---------------------------------
 *
 * Type a name, type a message, press send. The board mints a one-person link,
 * and the phone's own share sheet opens with the whole thing ready for WeChat.
 * Three taps, on the screen they already know how to use.
 *
 * What was sent stays on screen as a bubble afterwards — the sheet can be
 * dismissed by accident, and a message you cannot get back is worse than an
 * extra button. */
let MADE = null;

function drawWriteNew() {
  $("listview").hidden = true;
  $("listtop").hidden = true;
  $("threadview").hidden = false;
  $("twho").hidden = true;
  $("tmore").hidden = true;
  $("tmenu").hidden = true;
  $("tpin").hidden = true;
  $("tleft").hidden = true;
  $("tnew").hidden = false;
  $("tnewk").textContent = T("wn.mkTo");
  $("tnewname").placeholder = T("wn.mkName");

  const talk = $("talk");
  fill(talk);
  if (MADE) {
    /* SENT. The block as it went, as a bubble — because that is what it is —
       with the two ways to send it again underneath. */
    const bub = el("div", "bub mine");
    bub.textContent = MADE.words;
    talk.append(bub);
    const row = el("div", "again");
    if (!IN_WECHAT && navigator.share) {
      const b2 = el("button", "primary", T("wn.mkShare"));
      b2.type = "button";
      b2.addEventListener("click", () => {
        navigator.share({ text: MADE.words }).catch(() => {});
      });
      row.append(b2);
    }
    const cp = el("button", null, T("cards.copy"));
    cp.type = "button";
    cp.addEventListener("click", () => {
      cp.textContent = T(copyText(MADE.words)
        ? (IN_WECHAT ? "act.wxCopied" : "cards.copied") : "act.copyFail");
    });
    row.append(cp);
    talk.append(row);
    talk.append(el("p", "when", T("wn.mkTill")));
  } else {
    // One line, where the first bubble will be, saying what pressing send does.
    talk.append(el("p", "when", T("wn.mkHint")));
  }

  $("twrite").hidden = false;
  $("tshut").hidden = true;
  $("tbox").placeholder = T("wn.mkLine");
  $("tsaid").hidden = true;
}

/** Mint the note and hand it straight to the share sheet. */
async function sendNew() {
  const to = $("tnewname").value.trim();
  const line = $("tbox").value.trim();
  if (!to) { $("tnewname").focus(); return; }
  if (!line) { $("tbox").focus(); return; }
  $("tsend").disabled = true;
  say(T("wn.sending"));
  let d = null;
  try {
    d = await fetch("/api/write", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ device, to, line }),
    }).then((r) => r.json());
  } catch { d = null; }
  $("tsend").disabled = false;
  if (!d || !d.ok) {
    const known = { contact: "wn.mkNoContact", standing: "wn.mkStanding",
                    nopage: "note.needProfile" };
    return say(T(known[d && d.error] || "act.again", { what: (d && d.what) || "" }), true);
  }
  MADE = { words: T("wn.mkBlock", { who: d.to, line,
    url: location.origin + "/w/" + d.code }) };
  $("tbox").value = "";
  $("tbox").style.height = "auto";
  $("tsaid").hidden = true;
  drawWriteNew();
  /* STRAIGHT INTO THE SHEET. This is the whole point of the change: the note
     is made and sent in one press rather than made, displayed, and then sent
     from a second screen. */
  if (!IN_WECHAT && navigator.share) {
    navigator.share({ text: MADE.words }).catch(() => { /* dismissed is fine */ });
  } else {
    copyText(MADE.words);
    say(T(IN_WECHAT ? "act.wxCopied" : "cards.copied"));
  }
}

function drawThread(t) {
  $("twho").hidden = false;
  $("tmore").hidden = false;
  $("tnew").hidden = true;
  $("twhoname").textContent = t.handle || "—";
  // No page to open for somebody on the list — see drawMenu.
  const onList = String(t.who || "").startsWith("w:");
  $("twho").href = onList ? "#"
    : "/p/" + encodeURIComponent((t.handle || "").toLowerCase());
  $("tmenu").hidden = true;
  $("tmore").setAttribute("aria-expanded", "false");
  const last = t.last;
  /* WHAT KIND OF CONVERSATION THIS IS, under their name. An open thread, a
     counted one an offer opened, or an introduction with one answer in it —
     three different rules, and somebody typing deserves to know which. */
  /* A SHORT LABEL UP HERE, THE EXPLANATION DOWN THERE. Both were coming out
     of the same two-way choice, so a finished introduction said "This
     conversation is closed" at the top and a paragraph about following each
     other at the bottom — two different accounts of one state. */
  $("twhosub").textContent = last.deal ? T("note.dealOpen")
    : last.open ? T("note.openSub")
    : last.canAnswer ? T("note.oneSub")
    : T({ shut: "note.shut", waiting: "note.waitSub" }[last.why] || "note.doneSub");

  const pin = $("tpin");
  pin.hidden = !last.deal;
  if (last.deal) {
    fill(pin);
    pin.append(el("span", "k",
      T(last.deal.kind === "project" ? "note.dealProject" : "note.dealJob")));
    pin.append(el("p", null, last.deal.give));
    if (last.deal.money) pin.append(el("p", "money", last.deal.money));
  }

  const talk = $("talk");
  fill(talk);
  let day = "";
  for (const n of t.notes) {
    // A date only where it changes. A stamp on every line is a column of
    // grey down the side of a conversation nobody is reading it for.
    const d = String(n.at).slice(0, 10);
    if (d !== day) { day = d; talk.append(el("p", "when", when(n.at))); }
    const bub = el("div", "bub " + (n.mine ? "mine" : "them") + (n.reported ? " flag" : ""));
    bub.textContent = n.text || "";
    talk.append(bub);
  }

  const left = $("tleft");
  left.hidden = typeof last.left !== "number";
  if (!left.hidden) {
    left.textContent = T(last.left ? "note.linesLeft" : "note.linesSpent", { n: last.left });
  }
  const can = Boolean(last.canAnswer);
  $("twrite").hidden = !can;
  $("tshut").hidden = can;
  /* FOUR KINDS OF SHUT, FOUR SENTENCES. It picked between two off `open`, so a
     thread that had spent its one message each read "Carry on where you
     swapped" — advice about a swap that had never happened, on a screen where
     there was nothing else to go on. */
  if (!can) {
    $("tshut").textContent = T({
      shut: "note.shut",            // somebody walked out
      waiting: "note.waiting",      // you wrote, they have not answered
      spent: "note.linesSpent",     // an offer's lines are used up
    }[last.why] || "note.closed", { who: t.handle || "—", n: 0 });
  }
  /* A SHORT PROMPT, NOT THE EXAMPLE. note.placeholder is two lines of "Hi —
     performer, Sydney, free from March…", which is the right thing in a form
     with room for it and wrong in a one-line box, where it is clipped in the
     middle of a word. The example still does its work where it belongs: on a
     conversation with nothing in it yet. */
  $("tbox").placeholder = T(t.fresh ? "note.placeholder" : "note.boxPh");
  $("tsaid").hidden = true;

  /* AND IT IS READ NOW. Opening the conversation is what reading it means —
     the list marks nothing, so the dot beside a name survives until somebody
     actually goes in. */
  if (t.unread && device) {
    fetch("/api/note/seen", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ device, who: t.who }),
    }).then(() => { for (const n of t.notes) n.seen = true; })
      .catch(() => { /* it stays unread, which is the safe way to be wrong */ });
  }

  drawMenu(t);
}

/** Leaving, reporting, and their page: rare, permanent or elsewhere, so none
 *  of them sits beside the box somebody types in. */
function drawMenu(t) {
  const menu = $("tmenu");
  fill(menu);
  /* SOMEBODY ON THE LIST HAS NO PAGE, so there is nothing to open and nothing
     to share. Their whole account of themselves is the answer they wrote in
     this conversation, which is already on the screen. */
  const onList = String(t.who || "").startsWith("w:");
  if (!onList) {
    const go = el("a", null, T("note.openProfile"));
    go.href = "/p/" + encodeURIComponent((t.handle || "").toLowerCase());
    menu.append(go);
  }

  /* SHARING THEM, from inside the conversation. Every other screen that shows
     a person can send their page to somebody; this one could not, which is
     odd on the screen where you are most likely to be thinking about who else
     should know them — and it is the only thing left to do on a conversation
     that has run out of messages. The phone's own sheet, so WeChat and
     WhatsApp are one tap. */
  const sh = el("button", null, T("act.share"));
  sh.type = "button";
  sh.hidden = onList;
  sh.addEventListener("click", () => {
    const url = location.origin + "/p/"
      + encodeURIComponent((t.handle || "").toLowerCase());
    const done = (key) => {
      sh.textContent = T(key);
      setTimeout(() => { sh.textContent = T("act.share"); }, 2600);
    };
    if (IN_WECHAT) return done(copyText(url) ? "act.wxCopied" : "act.wxUseMenu");
    if (navigator.share) {
      navigator.share({ title: t.handle || "", url })
        .catch(() => { /* dismissed is not a failure */ });
      return;
    }
    done(copyText(url) ? "act.copied" : "act.copyFail");
  });
  menu.append(sh);

  if (t.last.open) {
    const out = el("button", "warn", T("note.leave"));
    out.type = "button";
    out.addEventListener("click", async () => {
      if (!window.confirm(T("note.leaveSure", { who: t.handle || "—" }))) return;
      out.disabled = true;
      try {
        const r = await fetch("/api/note/shut", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ device, who: t.who }),
        });
        if (!r.ok) throw new Error("no");
        await load();
      } catch { out.disabled = false; say(T("note.failed"), true); }
    });
    menu.append(out);
  }

  // Reporting is of one message, and only one you received: the newest of
  // theirs, which is what somebody pressing this means.
  const theirs = [...t.notes].reverse().find((n) => !n.mine);
  if (theirs) {
    if (theirs.reported) {
      menu.append(el("span", null, T("note.reported")));
    } else {
      const rep = el("button", "warn", T("note.report"));
      rep.type = "button";
      rep.addEventListener("click", async () => {
        const why = window.prompt(T("note.reportWhy"), "");
        if (why === null) return;
        rep.disabled = true;
        try {
          await fetch("/api/note/report", {
            method: "POST", headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ device, id: theirs.id, why }),
          });
          theirs.reported = true;
          say(T("note.reported"));
          drawMenu(t);
        } catch { rep.disabled = false; say(T("note.failed"), true); }
      });
      menu.append(rep);
    }
  }
}

const say = (text, bad) => {
  const p = $("tsaid");
  p.hidden = false;
  p.classList.toggle("bad", Boolean(bad));
  p.textContent = text;
};

$("tmore").addEventListener("click", () => {
  const m = $("tmenu");
  m.hidden = !m.hidden;
  $("tmore").setAttribute("aria-expanded", String(!m.hidden));
});
$("back").addEventListener("click", () => {
  // history.back rather than clearing the hash, so the entry this made is
  // spent rather than stacked — otherwise the phone's own Back walks through
  // every thread that was opened.
  if (history.length > 1) history.back();
  else history.replaceState(null, "", location.pathname), paint();
});

/* The box grows with what is typed, to a limit, because a one-line box for a
   paragraph is a box people give up on. */
$("tbox").addEventListener("input", () => {
  const b = $("tbox");
  b.style.height = "auto";
  b.style.height = Math.min(b.scrollHeight, 128) + "px";
});

$("tsend").addEventListener("click", async () => {
  const who = openWho();
  // Writing to somebody who is not here yet is the same button on the same
  // screen — see drawWriteNew.
  if (who === "new") return sendNew();
  if (INVITED) return sendInvited();
  const b = $("tbox");
  const text = b.value.trim();
  if (!who || !text) { b.focus(); return; }
  $("tsend").disabled = true;
  say(T("note.sending"));
  try {
    const r = await fetch("/api/note", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ device, who, text }),
    });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(d.error || "no");
    b.value = "";
    b.style.height = "auto";
    $("tsaid").hidden = true;
    await load();
    // Newest line at the bottom, which is where a conversation is read from.
    window.scrollTo(0, document.body.scrollHeight);
  } catch (err) {
    const known = { profile: "note.needProfile", enough: "note.enough",
                    gone: "note.gone", closed: "note.closed",
                    spent: "note.linesSpent" };
    say(T(known[String(err.message)] || "note.failed", { who: $("twhoname").textContent }), true);
  }
  $("tsend").disabled = false;
});

/** One face in the strip: their picture, their name, and what puts them on
 *  the list. Pressing opens the conversation, empty, with the box at the
 *  bottom — the same screen an existing thread opens. */
function drawCan() {
  /* THE STRIP IS THERE FOR A MEMBER EVEN WITH NOBODY IN IT, because the first
     thing in it is the ＋. Messages had no way to start anything at all —
     WeChat's own ＋ is top right on this screen and this is the same answer in
     the place the eye is already going. Not in the tab bar: four tabs in
     WeChat's positions is the whole point of that bar, and a fifth thing in it
     is the recognition gone.
     Somebody on the list does not get it — they cannot write notes, and the
     one conversation they have is the one they are in. */
  $("canwrap").hidden = WAITING || (!CAN.length && !YOU.handle);
  if ($("canwrap").hidden) return;
  $("canlabel").textContent = T("note.canHead");
  $("cansub").textContent = T(CAN.length ? "note.canSub" : "note.canNone");
  const strip = $("can");
  fill(strip);

  if (YOU.handle) {
    /* FIRST, and it is a person-shaped hole rather than a face: the dashed
       ring says the circle is empty and the ＋ says what fills it. */
    const add = el("a", "one add");
    add.href = "#new";
    const plus = el("span", "av", "\uFF0B");
    add.append(plus, el("b", null, T("note.canNew")));
    strip.append(add);
  }
  for (const q of CAN) {
    const b = el("button", "one" + (q.why === "wait" ? " hold" : ""));
    b.type = "button";
    const av = el("span", "av");
    av.textContent = initial(q.handle);
    av.style.background = wash(q.handle);
    if (q.photo) {
      const img = Object.assign(document.createElement("img"),
        { src: "/api/public-media?id=" + encodeURIComponent(q.photo), alt: "", loading: "lazy" });
      img.addEventListener("load", () => { av.textContent = ""; av.append(img); });
    }
    b.append(av, el("b", null, q.handle));
    // Only the deal is worth a word. "Matched" under every face is a label on
    // the one thing every face on this strip has in common.
    /* A word under the face only where it says something. "Matched" under
       every one of them is a label on the thing they all have in common; a
       deal and an unanswered introduction are not. */
    if (q.why === "deal") b.append(el("i", null, T("note.canDeal")));
    else if (q.why === "wait") b.append(el("i", "quiet", T("note.canWait")));
    b.addEventListener("click", () => openThread(q.who));
    strip.append(b);
  }
}

/* The box for a first message used to live here, under the strip. It is the
   thread screen now — see blank() and drawThread — so that writing the first
   line and writing the fifth are the same screen rather than two, and a
   conversation never has two places to type into it. */


/* THE OLD BACK HANDLER WAS HERE and it survived the rewrite, so one press ran
   history.back() TWICE — out of the thread, then out of /notes entirely, and
   the button that closes a conversation dropped you on Browse. The arrow has
   one listener, above, beside the thread it belongs to. */

setLang(pickLang());
LANGBTN = langButton(paint);
load();

/* THE WORKER, REGISTERED FROM HERE TOO — and this page is now the one that
 * matters most for it. Only index.html did this, which was right when Browse
 * was the front of the app. Messages is the front now and the manifest's
 * start_url points here, so a home-screen icon opened the app on the one
 * document that never installed a worker: no offline shell until the person
 * happened to visit Browse, and a first launch with no signal showing the
 * browser's own error page instead of the app.
 *
 * Deferred to load for the same reason as on Browse: registration competes
 * with this page's own requests, and the first paint matters more. */
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("/sw.js").catch(() => { /* not fatal */ });
  });
}
</script>
</body>
