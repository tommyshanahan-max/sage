 *  no handle for. A face that does nothing is not given the ring that says it
 *  would. */
/* WHICH OF THE TWO A READER SEES, and it is a choice between two strings the
   message already carries — rendered once when it was said, see renderSay.
   The original when there is no rendering yet, or when it is already in the
   reader's language: what was typed is always right and sometimes unreadable
   to the person looking at it, which is the state this is fixing and the
   honest version of it while a render is in flight. */
function saidIn(m) {
  const words = m.text || "";
  /* NOT YOUR OWN. You wrote it, you know what it says, and reading your own
     English sentence handed back to you in Chinese is the app correcting you
     rather than helping. WeChat leaves yours alone for the same reason. */
  if (m.mine) return words;
  return pick(words, m.alt, m.alt2, m.lang);
}

function doorWhere(m) {
  if (m.bot) return "";
  if (m.inside && m.handle) return "/p/" + encodeURIComponent(m.handle.toLowerCase());
  /* AND A PERSON AT THE DOOR HAS A PAGE TOO NOW.
     It used to open the conversation with them — better than nothing, and
     still landing a member in a chat with somebody they knew nothing about.
     Everything a page is made of was already on the board; see /q/:id. The
     conversation is a button on it, which is the profile-then-write shape
     everybody already knows.
     `wid` reaches a member and nobody else — see named() in /api/door —
     so without it there is nothing to open, which is the honest state
     rather than a link that lands on a refusal. */
  if (m.wid) return "/q/" + encodeURIComponent(m.wid);
  /* And a room-mate reaches the same page, reduced — see the branch in
     /api/queue/:id. The id is already on the row as `fid`, because that is
     what the follow is addressed to, so linking it discloses nothing new. */
  if (m.fid && m.fid.startsWith("w:")) return "/q/" + encodeURIComponent(m.fid.slice(2));
  return "";
}

function doorFace(m) {
  const name = m.handle || "?";
  const to = doorWhere(m);
  const av = el(to ? "a" : "span", "av small" + (to ? " go" : ""), initial(name));
  if (to) av.href = to;
  av.style.background = wash(name);
  const w = m.wid && QUEUE.find((x) => x.id === m.wid);
  if (w && w.photo) {
    const img = Object.assign(document.createElement("img"),
      { src: "/api/wait-media?id=" + encodeURIComponent(w.photo), alt: "", loading: "lazy" });
    img.addEventListener("load", () => { av.textContent = ""; av.append(img); });
  }
  return av;
}

/* The name over the bubble, and which side of the door they are on. A name
 * alone is not enough in here: the same sentence from somebody inside and
 * somebody waiting means two different things to whoever is reading it.
 *
 * For a member it is also the way to reach them. The room only holds people
 * who have spoken; the ones who have not are behind ⋯ — so without this, the
 * moment somebody at the door said something they became the one person in
 * the room nobody could write to, which is backwards: they had just given a
 * reason to. `wid` reaches a member and nobody else; see /api/door.
 */
function doorName(m) {
  const who = el("p", "dwho");
  /* NAME · WHAT THEY ARE · WHICH SIDE OF THE DOOR — see the same line in
     door.html. The role is the fact a reader is deciding on; the side of the
     door is the qualifier on it. */
  const label = [m.handle || T("board.someone"),
    m.bot ? "" : (m.role ? T("role." + m.role) : ""),
    m.bot ? "" : T(m.inside ? "dr.inside" : "dr.waiting"),
  ].filter(Boolean).join(" \u00B7 ");
  /* A MEMBER'S NAME WAS THE ONE THING IN HERE THAT WENT NOWHERE. This linked
     for somebody at the door — the way to write to them — and was plain text
     for a member, who is the one person in the room with a page to open. Both
     now, through doorWhere, which is also what the face uses. */
  const to = doorWhere(m);
  if (to) {
    const a = el("a", "reach");
    a.href = to;
    a.textContent = label;
    who.append(a);
  } else {
    who.append(document.createTextNode(label));
  }
  return who;
}

/* WHO IS IN THE ROOM, BEHIND ⋯ AND NOT IN FRONT OF THE CONVERSATION.
 *
 * This was under the talk, and on the real board that meant Film & TV opened
 * as eighteen strangers with the box to type in below all of them. A WeChat
 * group of four hundred opens as the conversation and nothing else: the count
 * is in the title and the members are one tap away. A room is the talk. The
 * people in it are something you check.
 *
 * Everybody, not the front six — a screen somebody opened on purpose to see
 * who is here should show who is here. Queue order, the board's own: first
 * come, one place up per person somebody brought in, decided in queueOrder and
 * not worked out again on this screen.
 */
/** WHO IS IN THIS ROOM, AND THE ONE THING TO DO ABOUT THEM.
 *
 *  This screen listed the queue and nothing else, so a room with people
 *  talking in it showed none of them — and the thing you want when you have
 *  just read somebody's line was two screens away behind a face nobody knew
 *  was tappable.
 *
 *  EVERYBODY WHO HAS SPOKEN, inside or out. There is no membership list for a
 *  door room: who is "in this room" is who has said something in it, which is
 *  also the only people you would have a reason to follow.
 *
 *  FOLLOWING IS SILENT AND ONE-SIDED and none of that changes here. They are
 *  not told, nothing opens, and a thread only appears when both of them have
 *  done it. Seeing somebody in a room has never meant being inside and it
 *  still does not — what this opens is one conversation between two people
 *  who chose each other, which is the alternative to a WeChat id in a message.
 */
function doorInside(key) {
  const seen = new Map();
  for (const m of DOOR.says || []) {
    if (m.bot || m.mine || !m.handle || !m.fid) continue;
    if (!seen.has(m.fid)) seen.set(m.fid, m);
  }
  if (!seen.size) return null;
  const wrap = el("div", "dinside");
  wrap.append(el("p", "dhead", T("dr.inHere")));
  for (const m of seen.values()) {
    const row = el("div", "drow");
    /* A LINK ONLY WHERE ONE LEADS SOMEWHERE. A member's page for a member;
       a door person's page for a member reading them. Otherwise the name is
       a name, which is the truth rather than a link onto a refusal. */
    const to = m.inside && m.handle ? "/p/" + encodeURIComponent(m.handle)
      : m.wid ? "/q/" + encodeURIComponent(m.wid)
      /* A room-mate can open it too now — see the reduced branch in
         /api/queue/:id. The id is already here for the follow. */
      : (m.fid && m.fid.startsWith("w:")) ? "/q/" + encodeURIComponent(m.fid.slice(2))
      : "";
    const a = el(to ? "a" : "div", "dwho");
    if (to) a.href = to;
    const av = el("span", "av small", (m.handle || "?").slice(0, 1).toUpperCase());
    av.style.background = wash(m.handle || "?");
    if (m.photo) {
      const img = Object.assign(document.createElement("img"),
        { src: "/api/public-media?id=" + encodeURIComponent(m.photo), alt: "", loading: "lazy" });
      img.addEventListener("load", () => { av.textContent = ""; av.append(img); });
    }
    const mid = el("div", "wm");
    mid.append(el("b", null, m.handle));
    /* What they are, then which side of the door they are on. The role leads,
       because that is what a reader is deciding about — same order the name
       above a message uses. */
    const bits = [];
    if (m.role) bits.push(T("role.a." + m.role));
    bits.push(T(m.inside ? "dr.barIn" : "wr.flag"));
    mid.append(el("span", null, bits.join(" · ")));
    a.append(av, mid);
    row.append(a);

    let on = Boolean(m.iFollow);
    const b = el("button", "dfollow" + (on ? " on" : ""), T(on ? "bud.following" : "bud.follow"));
    b.type = "button";
    const note = el("p", "dboth");
    note.hidden = true;
    b.addEventListener("click", async (e) => {
      e.preventDefault();
      b.disabled = true;
      try {
        const r = await fetch("/api/follow", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ device, who: m.fid, on: !on, room: key }),
        });
        const d = await r.json().catch(() => ({}));
        if (r.ok) {
          on = !on;
          b.classList.toggle("on", on);
          b.textContent = T(on ? "bud.following" : "bud.follow");
          /* THE MOMENT IT BECOMES A CONVERSATION, said once and where it
             happened. Without this, both of them have pressed a button and
             nothing on either screen says the thing they can now do. */
          note.hidden = !d.both;
          if (d.both) note.textContent = T("dr.bothNow", { who: m.handle });
        } else if (d.error === "nopage" || d.error === "hidden") {
          note.hidden = false;
          note.textContent = T(d.error === "hidden" ? "brw.followHidden" : "brw.followNoPage");
        }
      } catch { /* the button comes back and they can press it again */ }
      b.disabled = false;
    });
    row.append(b);
    wrap.append(row);
    wrap.append(note);
  }
  return wrap;
}

function doorPeople(key) {
  const box = el("div", "dinfo");
  const inside = doorInside(key);
  if (inside) box.append(inside);
  const said = new Set((DOOR.says || []).map((m) => m.wid).filter(Boolean));
  const rows = QUEUE.filter((w) =>
    (WAITROOMS.includes(w.room) ? w.room : "other") === key)
    .sort((a, b) => (a.place ?? 1e9) - (b.place ?? 1e9)
      || String(a.at).localeCompare(String(b.at)));
  /* SENDING SOMEBODY THIS DOOR.
   *
   * The ＋ that was missing. A group room's is an invite with a code in it,
   * because a room has a cap and a seat to hold; a door has neither — joining
   * a queue is open, and the link is the public door for this room. So there
   * is nothing to mint: a name, the link, and the phone's own share sheet.
   *
   * Their name goes in the message rather than in the link. The door page
   * greets everybody the same, and a name in a query string is a name on a
   * page anybody could open.
   */
  /* A FIELD AND A BUTTON, NOT A PROMPT.
   *
   * It was window.prompt, and on a phone that is the end of the gesture: the
   * share sheet may only be opened from inside the tap that asked for it, and
   * a prompt ends that tap. So the sheet was refused, the refusal was caught,
   * and the button did nothing at all — the worst possible failure, because
   * nothing on the screen said so.
   *
   * The Send press IS the gesture now. And if the sheet is still refused, the
   * words are copied and the button says which happened, rather than leaving
   * somebody to press it again.
   */
  const send = el("div", "sendbox");
  const nameIn = document.createElement("input");
  nameIn.className = "fld";
  nameIn.maxLength = 40;
  nameIn.placeholder = T("dr.sendWho");
  const go = el("button", "sendlink");
  go.type = "button";
  go.textContent = T("dr.sendLink");
  const sendSaid = el("p", "sendsaid");
  go.addEventListener("click", async () => {
    const nm = nameIn.value.trim().slice(0, 40);
    const url = location.origin + "/r/" + encodeURIComponent(key);
    /* NO NAME IS A WECHAT GROUP, NOT A MISTAKE.
     *
     * The link never carried a name — it is the door for the room and every
     * person who opens it types their own. Only the message was addressed, so
     * pasting it into a group of forty read as a note to one person who was
     * not there. Empty, and it says what the room is and who it is for. */
    const words = nm
      ? T(IN_WECHAT ? "dr.sendWordsWx" : "dr.sendWords",
          { name: nm, room: T("waitroom." + key), url })
      : T("dr.sendWordsMany", { room: T("waitroom." + key), url });
    if (!IN_WECHAT && navigator.share) {
      try {
        /* THE LINK GOES IN `url`, NOT INSIDE THE TEXT.
         *
         * It was one blob — the words with the address in the middle of them
         * — and that is a message, not a link. WeChat and everything else
         * build their card from the `url` field: given only text, they have
         * nothing to fetch, so the card comes out as the pasted sentence with
         * a grey square where the picture goes. The page's own og: tags were
         * right the whole time and were never asked for.
         *
         * The address comes out of the words for this path so it is not said
         * twice. The copy-and-paste path below still carries it inline, where
         * it has to be, because nothing is going to fetch anything there. */
        await navigator.share({
          title: T("site.title"),
          text: words.split(url).join("").replace(/\n{3,}/g, "\n\n").trim(),
          url,
        });
        sendSaid.textContent = nm ? T("dr.sendGone", { name: nm }) : T("dr.sendGoneMany");
        nameIn.value = "";
        return;
      } catch {
        /* Dismissed, or refused by the browser. Either way the copy below is
           the thing that still works, and silence is not an option. */
      }
    }
    sendSaid.textContent = T(copyText(words)
      ? (IN_WECHAT ? "act.wxCopied" : "cards.copied") : "act.copyFail");
  });
  send.append(nameIn, go);
  box.append(send, sendSaid);

  /* THE QUEUE IS A MEMBER'S TO READ, and so is its count. /api/queue refuses
     anybody else, so `rows` is empty for them — and "0 at this door", printed
     under a room they are standing in with four other people, is the screen
     telling them something false. */
  if (DOOR.how === "member") {
    box.append(el("p", "when", T("dr.here", { n: rows.length })));
  }
  for (const w of rows) {
    /* THE ROW AND ITS ACTION ARE ONE THING. Drawn as siblings, the rule under
       the row fell between the person and their own button, so "Let in ·
       waiting for them to turn up" read as belonging to the person below it.
       One wrapper, one rule, under both. */
    const wrap = el("div", "dperson");
    const a = el("a", "wperson");
    a.href = "#w:" + w.id;
    const av = el("span", "av small", initial(w.name));
    av.style.background = wash(w.name);
    if (w.photo) {
      const img = Object.assign(document.createElement("img"),
        { src: "/api/wait-media?id=" + encodeURIComponent(w.photo), alt: "", loading: "lazy" });
      img.addEventListener("load", () => { av.textContent = ""; av.append(img); });
    }
    const m = el("div", "wm");
    m.append(el("b", null, w.name));
    /* What they wrote on the way in, which is the whole of what anybody knows
       about them — and "said something in here", which is the other half of
       what this screen is for. */
    if (w.why) {
      // In the reader's language where there is one — see pick in i18n.js.
      m.append(el("span", null, pick(w.why, w.whyAlt, w.whyAlt2, w.whyLang)));
    }
    a.append(av, m);
    /* THE END OF THE ROW IS WHERE THEY STAND, which is the thing a member
       reading this queue is deciding about and the reason the list beat a
       grid of faces: who has been vouched for, and who is next through the
       door. Stacked, because they are two answers and not one.
       `place` is the board's own order and arrives on the row — see
       queueOrder; nothing about the queue is worked out in a browser. */
    const end = el("div", "wend");
    /* ONLY THE FRONT OF THE QUEUE CARRIES A NUMBER. Eighteen rows each saying
       which one they are is eighteen facts nobody asked for; the question is
       who is getting in soon, and that is answered by the top of the list
       saying so and the rest saying nothing. */
    /* SOMEBODY ALREADY LET IN IS NOT IN A QUEUE. "no. 2 in line" on a person
       who is through the door and deciding whether to make a page is the
       screen contradicting the line under it. */
    if (w.up) { /* nothing: where they stand is said below */ }
    else if (w.place === 1) end.append(el("span", "next", T("dr.next")));
    else if (w.place && w.place <= 3) end.append(el("span", null, T("dr.place", { n: w.place })));
    if (w.vouches) end.append(el("span", "vou", T("note.waitVouched", { n: w.vouches })));
    if (said.has(w.id)) end.append(el("span", null, T("dr.spoke")));
    if (end.childNodes.length) a.append(end);
    wrap.append(a);

    /* LETTING THEM IN, FROM HERE.
     *
     * This is where the decision is actually made: in the room, next to what
     * they wrote and who spoke for them. It used to be a command on the box,
     * which meant reading happened on a phone and acting happened on a laptop
     * — and the second one mostly did not happen.
     *
     * Under the row rather than on it, because the row is a link to a
     * conversation and a button inside a link is a tap nobody can aim. Staff
     * only; the route says so too. */
    if (DOOR.staff && !w.up) {
      const go = el("button", "letin");
      go.type = "button";
      go.textContent = T("dr.letIn", { who: w.name });
      go.addEventListener("click", async () => {
        if (!window.confirm(T("dr.letInSure", { who: w.name }))) return;
        go.disabled = true;
        try {
          const r = await fetch("/api/door/up", {
            method: "POST", headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ device, id: w.id }),
          });
          if (!r.ok) throw new Error("no");
          /* The queue row this button reads from lives on the Messages load,
             so the whole screen is refetched rather than the flag flipped
             here — one account of who is in, not two. */
          await load();
          drawDoor(key);
        } catch { go.disabled = false; go.textContent = T("act.again"); }
      });
      wrap.append(go);
    } else if (DOOR.staff && w.up) {
      wrap.append(el("p", "letsaid", T("dr.letInDone")));
    }
    box.append(wrap);
  }
  return box;
}

/* WHO CAN BE @'D IN A DOOR ROOM: everybody at that door, and everybody inside
 * who has said something in it. Not every member on the board — the point of
 * the name is that the person can read the room it is said in.
 *
 * A waiting person's own view has no queue, so for them it is whoever has
 * spoken. That is the honest list for somebody who cannot see the rest.
 */
function doorNames(key) {
  const here = QUEUE.filter((w) =>
    (WAITROOMS.includes(w.room) ? w.room : "other") === key).map((w) => w.name);
  const spoke = (DOOR && DOOR.says || []).filter((m) => !m.bot).map((m) => m.handle);
  /* AND THE DOORMAN, FIRST. He is in every room and he was the one person in
     it the @ picker would not offer — so the gesture the room teaches did not
     work on the one who answers. First because he is who somebody reaches for
     when they are stuck, which is when they go looking for the picker at all.
     His name comes off the bot line rather than being written here: it is an
     env var on the box and can be something other than Mo. */
  const mo = ((DOOR && DOOR.says) || []).find((m) => m.bot);
  return [...new Set([...(mo && mo.handle ? [mo.handle] : []), ...here, ...spoke])]
    .filter(Boolean);
}

/* The room whose people are open. One room, not a flag — opening another shuts
   it, and `back` shuts it before it leaves the room, the way a phone's back
   button behaves everywhere else. */
let DOORINFO = "";

async function drawDoor(key) {
  $("listview").hidden = true;
  $("listtop").hidden = true;
  $("threadview").hidden = false;
  $("tnew").hidden = true;
  $("tmenu").hidden = true;
  /* THE PIN IS NOT BLANKED HERE ANY MORE. It was, because the only thing that
     ever went in it was a deal on a thread, and arriving at a door meant there
     was none. The ledger lives in the same slot now and survives a redraw, so
     hiding it on the way in made it flicker out and back on every refresh of
     a room somebody was reading. mountLedgerPin decides; this does not. */
  $("tleft").hidden = true;
  $("twho").href = "#";
  $("twhoname").textContent = T("waitroom." + key);
  $("twhosub").textContent = "";

  const talk = $("talk");
  fill(talk);
  try {
    const d = await fetch("/api/door?room=" + encodeURIComponent(key), { cache: "no-store",
      headers: device ? { "x-board-device": device } : {} }).then((r) =>
        (r.ok ? r.json() : null));
    DOOR = d;
  } catch { DOOR = null; }
  if (!DOOR) {
    $("twhosub").textContent = T("note.gone", { who: "" });
    $("twrite").hidden = true;
    $("tmore").hidden = true;
    return;
  }
  /* THE COUNT IN THE TITLE AND NOT THE LINE UNDER IT — "Beijing Apt Rentals
     (406)", which is the shape of every group on the phone this is read on.
     With ⋯ now in the corner, the old one-line sub wrapped to two and pushed
     the conversation down; and the count belongs to the room's name anyway.
     What is left under it is the one thing somebody needs told. */
  $("twhoname").textContent = T("waitroom." + key) + "  (" + DOOR.n + ")";
  $("twhosub").textContent = T("dr.sub");

  /* THE LEDGER, ACROSS THE TOP OF THE ROOM. Dark unless the box has
     BOARD_LEDGER_GOAL set, in which case this is silent and the room is
     exactly what it was. It redraws only when a number changed — see the note
     in ledger-pin.js about the twenty-second refresh and screen readers. */
  pin().then((m) => m && m.mountLedgerPin($("tpin"), key, device));

  /* ⋯ IN THE TOP RIGHT, which is where somebody looks for the people in a
     room because it is where every messenger on their phone keeps them.
     IT WAS MEMBERS ONLY, because the only thing behind it was the queue, and
     the queue is not a waiting person's to read. It still is not — /api/queue
     refuses them and QUEUE is empty for them. But the screen has a second
     half now: who is in this room, and the follow that goes with it, which is
     everybody's. So it opens when there is either. */
  const act = $("tmore");
  const anyHere = (DOOR.says || []).some((m) => m.fid && !m.mine && !m.bot);
  act.hidden = !((DOOR.how === "member" && QUEUE.length) || anyHere);
  act.onclick = () => { DOORINFO = DOORINFO === key ? "" : key; drawDoor(key); };

  fill(talk);
  talk.classList.remove("top");
  if (DOORINFO === key) {
    act.hidden = true;                 // back is the way out, as in groups.html
    talk.classList.add("top");
    // Not the room, so not the room's pin. See hideLedgerPin.
    pin().then((m) => m && m.hideLedgerPin($("tpin")));
    talk.append(doorPeople(key));
    $("twrite").hidden = true;
    $("tshut").hidden = true;
    $("tsaid").hidden = true;
    window.scrollTo(0, 0);
    return;
  }

  if (!DOOR.says.length) talk.append(el("p", "when", T("dr.quiet")));
  let day = "";
  // Which of Mo's six welcomes the last one used, so the next is never it.
  let lastWel = -1;
  for (const m of DOOR.says) {
    const dd = String(m.at).slice(0, 10);
    if (dd !== day) { day = dd; talk.append(el("p", "when", when(m.at))); }
    /* The room reporting itself — who came in, who went out. A line across the
       room, not a bubble from him: see moSays, and the same shape groups.html
       draws. Without this branch these arrived as empty bubbles. */
    /* WHAT HAPPENED TO THE ROOM is a line across it; WHAT HE SAID TO SOMEBODY
       is a bubble from him. Same mechanism, two shapes, because one is the
       room reporting itself and the other is a member talking. */
    /* Two of his lines are bubbles rather than a rule across the room:
       the welcome, and the nudge to write a page. Both are him talking to
       somebody; everything else here is the room reporting itself. */
    if (m.evt && m.evt.kind !== "welcome" && m.evt.kind !== "page") {
      talk.append(el("p", "when", T("mo." + m.evt.kind, { who: m.evt.who })));
      continue;
    }
    /* SIX WELCOMES, AND NO TWO RUNNING THE SAME. Five people walking in got
       five identical bubbles, which is the loudest "a machine did this" on
       the first screen anybody sees; one in six then put the same sentence
       under itself twice, which reads the same way. The slot the last one
       landed in is carried down the room — see moWelcome. */
    let said;
    if (m.evt && m.evt.kind === "page") {
      said = T("mo.page", { who: m.evt.who });
    } else if (m.evt) {
      const w = moWelcome(m.evt.who, m.id, lastWel);
      lastWel = w.at;
      said = w.text;
    } else said = saidIn(m);
    const row = el("div", "said" + (m.mine ? " mine" : ""));
    if (!m.mine) row.append(doorFace(m));
    const col = el("div", "col");
    if (!m.mine) col.append(doorName(m));
    const bub = el("div", "bub " + (m.mine ? "mine" : "them")
      + (m.reported ? " flag" : "") + (m.bot ? " bot" : ""));
    /* @somebody drawn as a mention rather than as the characters they typed.
       Never innerHTML: the text is somebody else's typing — see at.js. */
    atText(bub, said, doorNames(key));
    /* HIS LINES ARE TAPPABLE AND NOBODY ELSE'S ARE.
       He has a voice and it was only ever reachable inside his own panel,
       which is off. A person's message read aloud by a machine is a different
       and worse idea — it is his line, in his voice, or nothing. */
    if (m.bot && said) hearable(bub, said);
    col.append(bub);
    row.append(col);
    talk.append(row);
  }
  $("twrite").hidden = false;
  $("tshut").hidden = true;
  $("tsaid").hidden = true;
  window.scrollTo(0, document.body.scrollHeight);
  doorWatch(key);
}

/* A ROOM THAT IS OPEN HAS TO KEEP BEING TRUE.
 *
 * It was drawn once and never again. Somebody said something in a room while
 * it was on the screen and the screen did not know; coming back to the app
 * from WeChat showed whatever was there when it was last opened, which is how
 * a chat that works looks like a chat that has lost a message.
 *
 * Every twenty seconds while the room is in front of somebody, and once the
 * moment they come back to it — the second is what matters on a phone, where
 * a person is away for two minutes and the timer is asleep for all of it.
 * Only while the hash still names this room: a timer outliving the screen it
 * belongs to is a fetch nobody asked for, for ever.
 */
let DOORTICK = 0;
function doorWatch(key) {
  clearInterval(DOORTICK);
  const alive = () => openWho() === "d:" + key && !document.hidden;
  DOORTICK = setInterval(() => {
    if (openWho() !== "d:" + key) { clearInterval(DOORTICK); return; }
    if (alive() && !DOORINFO) drawDoor(key);
  }, 20000);
}
document.addEventListener("visibilitychange", () => {
  if (document.hidden) return;
  const who = openWho();
  if (who.startsWith("d:") && !DOORINFO) drawDoor(who.slice(2));
});

function drawThread(t) {
  $("twho").hidden = false;
  $("tmore").hidden = false;
  $("tnew").hidden = true;
  $("twhoname").textContent = t.handle || "—";
  // No page to open for somebody on the list — see drawMenu.
  const onList = String(t.who || "").startsWith("w:");
  $("twho").href = onList ? "#"
    : "/p/" + encodeURIComponent((t.handle || "").toLowerCase());
  $("tmenu").hidden = true;
  $("tmore").setAttribute("aria-expanded", "false");
  const last = t.last;
  /* WHAT KIND OF CONVERSATION THIS IS, under their name. An open thread, a
     counted one an offer opened, or an introduction with one answer in it —
     three different rules, and somebody typing deserves to know which. */
  /* A SHORT LABEL UP HERE, THE EXPLANATION DOWN THERE. Both were coming out
     of the same two-way choice, so a finished introduction said "This
     conversation is closed" at the top and a paragraph about following each
     other at the bottom — two different accounts of one state. */
  $("twhosub").textContent = last.deal ? T("note.dealOpen")
    : last.open ? T("note.openSub")
    : last.canAnswer ? T("note.oneSub")
    : T({ shut: "note.shut", waiting: "note.waitSub" }[last.why] || "note.doneSub");

  /* WHO THEY ARE, ON THE SCREEN THAT OPENS WHEN YOU TAP THEIR FACE.
   *
   * Somebody at the door has no page, so a face in a room opens the
   * conversation with them — see doorWhere. That landed on a name, a grey
   * "waiting", and an empty box: tapping a person and arriving somewhere that
   * says nothing about them is worse than the face doing nothing at all.
   *
   * Everything needed is already on this screen. /api/queue sends the row —
   * their photograph, their sentence, the line they wrote on the way in — and
   * the queue on Browse has been drawing it all along. It goes here, above
   * the conversation, so the tap lands on the person and the way to answer
   * them is directly underneath.
   */
  const card = $("tcard");
  const w = onList && QUEUE.find((x) => "w:" + x.id === t.who);
  card.hidden = !w;
  if (w) {
    fill(card);
    const av = el("span", "qav", w.photo ? "" : initial(w.name));
    if (w.photo) {
      const img = document.createElement("img");
      img.src = "/api/wait-media?id=" + encodeURIComponent(w.photo);
      img.alt = ""; img.loading = "lazy";
      img.addEventListener("error", () => { img.remove(); av.textContent = initial(w.name); });
      av.append(img);
    }
    const mid = el("div", "qmid");
    /* THE SENTENCE, WHOLE. It is the only thing on this board that decides
       anything, and a card showing half of it says less than the name. */
    if (w.me && w.want) {
      const say = el("p", "tsay");
      say.append(el("em", null, T("say.iam")), el("b", null, T("role.a." + w.me)),
        el("em", null, T("say.lookingFor")), el("b", null, T("role.a." + w.want)));
      mid.append(say);
    }
    /* Their own words, in the reader's language where there is a rendering —
       see whyAlt in cleanWait. */
    if (w.why) {
      mid.append(el("p", "twhy", pick(w.why, w.whyAlt, w.whyAlt2, w.whyLang)));
    }
    const tags = el("div", "qtags");
    if (w.room) tags.append(el("span", null, T("waitroom." + w.room)));
    if (w.type) tags.append(el("span", null, w.type));
    if (w.vouches) tags.append(el("span", null, T("brw.qvouches", { n: w.vouches })));
    if (tags.childNodes.length) mid.append(tags);
    card.append(av, mid);
  }

  const pin = $("tpin");
  pin.hidden = !last.deal;
  if (last.deal) {
    fill(pin);
    pin.append(el("span", "k",
      T(last.deal.kind === "project" ? "note.dealProject" : "note.dealJob")));
    pin.append(el("p", null, last.deal.give));
    if (last.deal.money) pin.append(el("p", "money", last.deal.money));
  }

  const talk = $("talk");
  fill(talk);
  let day = "";
  for (const n of t.notes) {
    // A date only where it changes. A stamp on every line is a column of
    // grey down the side of a conversation nobody is reading it for.
    const d = String(n.at).slice(0, 10);
    if (d !== day) { day = d; talk.append(el("p", "when", when(n.at))); }
    const bub = el("div", "bub " + (n.mine ? "mine" : "them") + (n.reported ? " flag" : ""));
    bub.textContent = n.text || "";
    talk.append(bub);
  }

  const left = $("tleft");
  left.hidden = typeof last.left !== "number";
  if (!left.hidden) {
    left.textContent = T(last.left ? "note.linesLeft" : "note.linesSpent", { n: last.left });
  }
  const can = Boolean(last.canAnswer);
  $("twrite").hidden = !can;
  $("tshut").hidden = can;
  /* FOUR KINDS OF SHUT, FOUR SENTENCES. It picked between two off `open`, so a
     thread that had spent its one message each read "Carry on where you
     swapped" — advice about a swap that had never happened, on a screen where
     there was nothing else to go on. */
  if (!can) {
    $("tshut").textContent = T({
      shut: "note.shut",            // somebody walked out
      waiting: "note.waiting",      // you wrote, they have not answered
      spent: "note.linesSpent",     // an offer's lines are used up
    }[last.why] || "note.closed", { who: t.handle || "—", n: 0 });
  }
  /* A SHORT PROMPT, NOT THE EXAMPLE. note.placeholder is two lines of "Hi —
     performer, Sydney, free from March…", which is the right thing in a form
     with room for it and wrong in a one-line box, where it is clipped in the
     middle of a word. The example still does its work where it belongs: on a
     conversation with nothing in it yet. */
  $("tbox").placeholder = T(t.fresh ? "note.placeholder" : "note.boxPh");
  $("tsaid").hidden = true;

  /* AND IT IS READ NOW. Opening the conversation is what reading it means —
     the list marks nothing, so the dot beside a name survives until somebody
     actually goes in. */
  if (t.unread && device) {
    fetch("/api/note/seen", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ device, who: t.who }),
    }).then(() => { for (const n of t.notes) n.seen = true; })
      .catch(() => { /* it stays unread, which is the safe way to be wrong */ });
  }

  drawMenu(t);
}

/** Leaving, reporting, and their page: rare, permanent or elsewhere, so none
 *  of them sits beside the box somebody types in. */
function drawMenu(t) {
  const menu = $("tmenu");
  fill(menu);
  /* SOMEBODY ON THE LIST HAS NO PAGE, so there is nothing to open and nothing
     to share. Their whole account of themselves is the answer they wrote in
     this conversation, which is already on the screen. */
  const onList = String(t.who || "").startsWith("w:");
  if (!onList) {
    const go = el("a", null, T("note.openProfile"));
    go.href = "/p/" + encodeURIComponent((t.handle || "").toLowerCase());
    menu.append(go);
  }

  /* A THIRD PERSON, FROM THE CONVERSATION THE TWO OF YOU ARE ALREADY HAVING.
   *
   * This is where somebody goes looking for it and it was not here. In WeChat
   * the ⋯ of a one-to-one opens the two of you and a ＋, and tapping the ＋
   * makes it a group — so "I should get Keith in on this" is one gesture from
   * inside the thread that made you think it. Ours sent you to Messages, to a
   * circle, to a picker, to find the person whose conversation you had just
   * been reading.
   *
   * It opens the picker with them already added. Nothing is made here: a room
   * still takes three, and the screen that makes one is the screen that makes
   * every other one. */
  if (!OFF.groups && !onList && t.last && t.last.open) {
    const grp = el("a", null, T("note.startGroup"));
    grp.href = "/groups?with=" + encodeURIComponent(t.who || "");
    menu.append(grp);
  }

  /* SHARING THEM, from inside the conversation. Every other screen that shows
     a person can send their page to somebody; this one could not, which is
     odd on the screen where you are most likely to be thinking about who else
     should know them — and it is the only thing left to do on a conversation
     that has run out of messages. The phone's own sheet, so WeChat and
     WhatsApp are one tap. */
  const sh = el("button", null, T("act.share"));
  sh.type = "button";
  sh.hidden = onList;
  sh.addEventListener("click", () => {
    const url = location.origin + "/p/"
      + encodeURIComponent((t.handle || "").toLowerCase());
    const done = (key) => {
      sh.textContent = T(key);
      setTimeout(() => { sh.textContent = T("act.share"); }, 2600);
    };
    if (IN_WECHAT) return done(copyText(url) ? "act.wxCopied" : "act.wxUseMenu");
    if (navigator.share) {
      navigator.share({ title: t.handle || "", url })
        .catch(() => { /* dismissed is not a failure */ });
      return;
    }
    done(copyText(url) ? "act.copied" : "act.copyFail");
  });
  menu.append(sh);

  if (t.last.open) {
    const out = el("button", "warn", T("note.leave"));
    out.type = "button";
    out.addEventListener("click", async () => {
      if (!window.confirm(T("note.leaveSure", { who: t.handle || "—" }))) return;
      out.disabled = true;
      try {
        const r = await fetch("/api/note/shut", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ device, who: t.who }),
        });
        if (!r.ok) throw new Error("no");
        await load();
      } catch { out.disabled = false; say(T("note.failed"), true); }
    });
    menu.append(out);
  }

  /* CLEARING IT OFF YOUR OWN LIST, and it is not the button above it.
   *
   * Leaving closes the conversation for both of you. This closes nothing,
   * tells nobody, and takes the rows off your screen — which is the gesture
   * people actually mean by deleting a chat, and the only one that could ever
   * clear a thread somebody ELSE walked out of. Those were permanent: an ended
   * conversation you cannot reopen and cannot put away.
   *
   * Under leave and above report, because it is the least severe of the three
   * and the list runs in that order. */
  const del = el("button", null, T("note.clear"));
  del.type = "button";
  del.addEventListener("click", async () => {
    if (!window.confirm(T("note.clearSure"))) return;
    del.disabled = true;
    try {
      const r = await fetch("/api/note/hide", {
        method: "POST", headers: { "Content-Type": "application/json" },
        // A waiting person's thread is addressed by their row — see blank().
        body: JSON.stringify({ device, who: String(t.who || "").replace(/^w:/, "") }),
      });
      if (!r.ok) throw new Error("no");
      /* Back to the list, because the thread this menu is attached to is about
         to not be there. Replace rather than push: the entry that opened it
         now points at a conversation this browser cannot see. */
      history.replaceState(null, "", location.pathname);
      await load();
    } catch { del.disabled = false; say(T("note.failed"), true); }
  });
  menu.append(del);

  // Reporting is of one message, and only one you received: the newest of
  // theirs, which is what somebody pressing this means.
  const theirs = [...t.notes].reverse().find((n) => !n.mine);
  if (theirs) {
    if (theirs.reported) {
      menu.append(el("span", null, T("note.reported")));
    } else {
      const rep = el("button", "warn", T("note.report"));
      rep.type = "button";
      rep.addEventListener("click", async () => {
        const why = window.prompt(T("note.reportWhy"), "");
        if (why === null) return;
        rep.disabled = true;
        try {
          await fetch("/api/note/report", {
            method: "POST", headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ device, id: theirs.id, why }),
          });
          theirs.reported = true;
          say(T("note.reported"));
          drawMenu(t);
        } catch { rep.disabled = false; say(T("note.failed"), true); }
      });
      menu.append(rep);
    }
  }
}

const say = (text, bad) => {
  const p = $("tsaid");
  p.hidden = false;
  p.classList.toggle("bad", Boolean(bad));
  p.textContent = text;
};

$("tmore").addEventListener("click", () => {
  const m = $("tmenu");
  m.hidden = !m.hidden;
  $("tmore").setAttribute("aria-expanded", String(!m.hidden));
});
$("back").addEventListener("click", () => {
  /* THE PEOPLE SCREEN IS A SCREEN, so back shuts it rather than leaving the
     room out from under it. It is opened from inside a room and has no hash
     of its own — there is nothing for history.back to undo. */
  if (DOORINFO) { const k = DOORINFO; DOORINFO = ""; drawDoor(k); return; }
  // history.back rather than clearing the hash, so the entry this made is
  // spent rather than stacked — otherwise the phone's own Back walks through
  // every thread that was opened.
  if (history.length > 1) history.back();
  else history.replaceState(null, "", location.pathname), paint();
});

/* @ IN A ROOM, and only in a room: a two-person thread has one other person
   in it and typing their name at them says nothing. openWho tells which. */
atPicker($("tbox"), () => {
  const who = openWho();
  return who.startsWith("d:") ? doorNames(who.slice(2)) : [];
});

/* The box grows with what is typed, to a limit, because a one-line box for a
   paragraph is a box people give up on. */
$("tbox").addEventListener("input", () => {
  const b = $("tbox");
  b.style.height = "auto";
  b.style.height = Math.min(b.scrollHeight, 128) + "px";
});

$("tsend").addEventListener("click", async () => {
  const who = openWho();
  // Writing to somebody who is not here yet is the same button on the same
  // screen — see drawWriteNew. A room at the door is the same again.
  if (who === "new") return sendNew();
  if (who.startsWith("d:")) return sendDoor(who.slice(2));
  if (INVITED) return sendInvited();
  const b = $("tbox");
  const text = b.value.trim();
  if (!who || !text) { b.focus(); return; }
  $("tsend").disabled = true;
  say(T("note.sending"));
  try {
    const r = await fetch("/api/note", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ device, who, text }),
    });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(d.error || "no");
    b.value = "";
    b.style.height = "auto";
    $("tsaid").hidden = true;
    await load();
    // Newest line at the bottom, which is where a conversation is read from.
    window.scrollTo(0, document.body.scrollHeight);
  } catch (err) {
    const known = { profile: "note.needProfile", enough: "note.enough",
                    gone: "note.gone", closed: "note.closed",
                    spent: "note.linesSpent",
                    // See the note in /api/group/say: the one refusal that
                    // points at a way of doing the thing rather than at a rule.
                    contact: "note.noContact" };
    say(T(known[String(err.message)] || "note.failed", { who: $("twhoname").textContent }), true);
  }
  $("tsend").disabled = false;
});

/** Saying something in a room at the door. The same route a group uses — a
 *  door room's lines live in `says` beside everybody else's, which is why the
 *  contact rule and the doorman's tripwire apply to it without a line of new
 *  code here. */
async function sendDoor(key) {
  const b = $("tbox");
  const text = b.value.trim();
  if (!text || !DOOR) { b.focus(); return; }
  $("tsend").disabled = true;
  say(T("note.sending"));
  try {
    const r = await fetch("/api/group/say", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ device, group: DOOR.id, text }),
    });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(d.error || "no");
    b.value = "";
    b.style.height = "auto";
    $("tsaid").hidden = true;
    await drawDoor(key);
    /* IT WENT, AND SOMETHING CAME OUT OF IT. Said after the redraw so they see
       their own message land first and then what is missing from it — the
       other order reads as a refusal. Not red: nothing failed. */
    if (Array.isArray(d.took) && d.took.length) say(T("note.tookOut"));
  } catch (err) {
    const known = { contact: "note.noContact", gone: "note.gone" };
    say(T(known[String(err.message)] || "note.failed", { who: "" }), true);
  }
  $("tsend").disabled = false;
}

/** One face in the strip: their picture, their name, and what puts them on
 *  the list. Pressing opens the conversation, empty, with the box at the
 *  bottom — the same screen an existing thread opens. */
function drawCan() {
  /* THE STRIP IS THERE FOR A MEMBER EVEN WITH NOBODY IN IT, because the first
     thing in it is the ＋. Messages had no way to start anything at all —
     WeChat's own ＋ is top right on this screen and this is the same answer in
     the place the eye is already going. Not in the tab bar: four tabs in
     WeChat's positions is the whole point of that bar, and a fifth thing in it
     is the recognition gone.
     Somebody on the list does not get it — they cannot write notes, and the
     one conversation they have is the one they are in. */
  $("canwrap").hidden = WAITING || (!CAN.length && !YOU.handle);
  if ($("canwrap").hidden) return;
  $("canlabel").textContent = T("note.canHead");
  $("cansub").textContent = T(CAN.length ? "note.canSub" : "note.canNone");
  const strip = $("can");
  fill(strip);

  if (YOU.handle) {
    /* FIRST, and it is a person-shaped hole rather than a face: the dashed
       ring says the circle is empty and the ＋ says what fills it. */
    const add = el("a", "one add");
    add.href = "#new";
    const plus = el("span", "av", "\uFF0B");
    add.append(plus, el("b", null, T("note.canNew")));
    strip.append(add);

    /* AND A GROUP, BESIDE IT. Two circles at the front of the strip, in the
       place the eye already goes for "start something": one person, or three
       to five. It used to be a link in a tray on Browse, which is the wrong
       tab and a tray nobody opens — a room with people in it is a
       conversation, and conversations are here.
       Only where there is somebody to put in one: an empty group is a room
       with you in it, and the page would refuse it anyway. */
    if (!OFF.groups && CAN.length) {
      const grp = el("a", "one add");
      grp.href = "/groups";
      const face = el("span", "av pile two");
      face.append(el("i"), el("i"));
      grp.append(face, el("b", null, T("grp.title")));
      strip.append(grp);
    }
  }
  for (const q of CAN) {
    const b = el("button", "one" + (q.why === "wait" ? " hold" : ""));
    b.type = "button";
    const av = el("span", "av");
    av.textContent = initial(q.handle);
    av.style.background = wash(q.handle);
    if (q.photo) {
      const img = Object.assign(document.createElement("img"),
        { src: "/api/public-media?id=" + encodeURIComponent(q.photo), alt: "", loading: "lazy" });
      img.addEventListener("load", () => { av.textContent = ""; av.append(img); });
    }
    b.append(av, el("b", null, q.handle));
    // Only the deal is worth a word. "Matched" under every face is a label on
    // the one thing every face on this strip has in common.
    /* A word under the face only where it says something. "Matched" under
       every one of them is a label on the thing they all have in common; a
       deal and an unanswered introduction are not. */
    if (q.why === "deal") b.append(el("i", null, T("note.canDeal")));
    else if (q.why === "wait") b.append(el("i", "quiet", T("note.canWait")));
    b.addEventListener("click", () => openThread(q.who));
    strip.append(b);
  }
}

/* The box for a first message used to live here, under the strip. It is the
   thread screen now — see blank() and drawThread — so that writing the first
   line and writing the fifth are the same screen rather than two, and a
   conversation never has two places to type into it. */


/* THE OLD BACK HANDLER WAS HERE and it survived the rewrite, so one press ran
   history.back() TWICE — out of the thread, then out of /notes entirely, and
   the button that closes a conversation dropped you on Browse. The arrow has
   one listener, above, beside the thread it belongs to. */

setLang(pickLang());
LANGBTN = langButton(paint);
load();

/* THE WORKER, REGISTERED FROM HERE TOO — and this page is now the one that
 * matters most for it. Only index.html did this, which was right when Browse
 * was the front of the app. Messages is the front now and the manifest's
 * start_url points here, so a home-screen icon opened the app on the one
 * document that never installed a worker: no offline shell until the person
 * happened to visit Browse, and a first launch with no signal showing the
 * browser's own error page instead of the app.
 *
 * Deferred to load for the same reason as on Browse: registration competes
 * with this page's own requests, and the first paint matters more. */
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("/sw.js").catch(() => { /* not fatal */ });
  });
}
</script>
