<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sage</title>
<!--
  No web fonts, no CDN, no analytics. Google Fonts and most CDNs are
  unreachable from mainland China, and one blocked stylesheet leaves a reader
  on an unstyled page. The display face is ui-serif — New York on Apple
  devices, Georgia elsewhere. Same palette as the launcher, so the two read as
  one product.
-->
<style>
  :root{
    --paper:#eef1f5;
    --card:#fbfcfd;
    --card-2:#f4f6f9;
    --ink:#10192b;
    --ink-2:#45536b;
    --muted:#7d8ba0;
    --rule:#dae0e9;
    --gold:#a8761f;
    --gold-soft:#f6efdf;
    --gold-line:#e6d3ab;
    --said:#eef2f8;
    --down:#a8442f;
    --down-soft:#f8e9e5;
    --serif:ui-serif,"New York",Georgia,"Times New Roman",serif;
    --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,
           "Helvetica Neue",Arial,"PingFang SC","Hiragino Sans GB",
           "Microsoft YaHei",sans-serif;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --paper:#0e1219; --card:#161b24; --card-2:#1b2029; --ink:#e8ecf3;
      --ink-2:#a6b1c2; --muted:#77839a; --rule:#242b36; --gold:#d9a94e;
      --gold-soft:#2a2213; --gold-line:#4b3d1d; --said:#1e242f;
      --down:#e08a72; --down-soft:#2c1a16;
    }
  }
  :root[data-theme="dark"]{
    --paper:#0e1219; --card:#161b24; --card-2:#1b2029; --ink:#e8ecf3;
    --ink-2:#a6b1c2; --muted:#77839a; --rule:#242b36; --gold:#d9a94e;
    --gold-soft:#2a2213; --gold-line:#4b3d1d; --said:#1e242f;
    --down:#e08a72; --down-soft:#2c1a16;
  }

  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;background:var(--paper);color:var(--ink);
    font-family:var(--sans);font-size:16px;line-height:1.6;
    display:flex;flex-direction:column;-webkit-font-smoothing:antialiased;
  }

  /* ---------- masthead ---------- */
  header{
    flex:none;display:flex;align-items:baseline;gap:.7rem;flex-wrap:wrap;
    padding:.9rem clamp(1rem,4vw,1.6rem);
    background:var(--card);border-bottom:1px solid var(--rule);
  }
  .mark{
    font-family:var(--serif);font-size:1.4rem;line-height:1;letter-spacing:-.01em;
    color:var(--gold);font-style:italic;
  }
  .by{font-size:.72rem;color:var(--muted)}

  /* Past conversations.
     A panel over the thread rather than a column beside it: this is read on a
     phone as often as a laptop, and a sidebar there either squeezes the
     conversation or hides itself anyway. Over-and-away keeps one behaviour on
     both. */
  #path,#mockups,#docs{
    position:fixed;inset:0;z-index:20;overflow-y:auto;
    background:var(--paper);
    padding:1rem 1rem calc(2rem + env(safe-area-inset-bottom));
    -webkit-overflow-scrolling:touch;
  }
  .path-head{
    display:flex;align-items:baseline;gap:.75rem;
    max-width:44rem;margin:0 auto .9rem;
  }
  .path-head h2{
    font-family:var(--serif);font-size:1.35rem;font-weight:500;margin:0;
    letter-spacing:-.01em;
  }
  .path-head button{margin-left:auto}
  #path-list,#mockups-list,#docs-list{max-width:44rem;margin:0 auto;display:flex;flex-direction:column;gap:.6rem}
  .entry{
    background:var(--card);border:1px solid var(--rule);border-radius:12px;
    padding:.85rem .95rem;
  }
  .entry h3{
    font-family:var(--serif);font-size:1rem;font-weight:500;margin:0;
    letter-spacing:-.01em;line-height:1.35;
  }
  .entry .when{font-size:.72rem;color:var(--muted);margin:.2rem 0 0}
  /* Not called .opening: the welcome block already owns that name and styles it
     centred with heading spacing, which a card excerpt inherited. */
  .entry .excerpt{
    font-size:.82rem;color:var(--ink-2);margin:.45rem 0 0;line-height:1.5;
  }
  .entry .acts{display:flex;gap:.5rem;margin-top:.7rem}
  .entry .acts button{flex:1;font-size:.76rem;padding:.45rem .6rem}
  .entry .acts .go{
    color:var(--gold);border-color:var(--gold-line);background:var(--gold-soft);
  }
  .analysis{
    margin-top:.65rem;background:var(--card-2);border-radius:10px;
    padding:.75rem .8rem;display:flex;flex-direction:column;gap:.7rem;
  }
  /* display:flex above outranks the browser's own rule for [hidden], so an
     unopened analysis showed as an empty grey bar under every card. */
  .analysis[hidden]{display:none}
  .analysis h4{
    font-family:var(--sans);font-size:.66rem;font-weight:700;margin:0;
    text-transform:uppercase;letter-spacing:.07em;color:var(--gold);
  }
  .analysis p{font-size:.82rem;line-height:1.55;margin:.2rem 0 0;color:var(--ink-2)}
  .analysis .lead p{color:var(--ink);font-weight:500}
  /* The one section people act on, so it is the one that is boxed. */
  .analysis .note{
    background:var(--gold-soft);border:1px solid var(--gold-line);
    border-radius:8px;padding:.55rem .6rem;
  }
  a.entry{display:block;text-decoration:none;color:inherit}
  a.entry:hover{border-color:var(--gold-line)}
  a.entry:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
  a.entry h3{color:var(--gold)}

  .path-empty,.path-error{
    font-size:.85rem;color:var(--muted);line-height:1.6;
    max-width:44rem;margin:0 auto;
  }
  .path-error{color:var(--down)}
  .status{margin-left:auto;font-size:.76rem;color:var(--muted);
    font-variant-numeric:tabular-nums}
  header button{
    font:inherit;font-size:.76rem;color:var(--ink-2);background:none;
    border:1px solid var(--rule);border-radius:6px;padding:.22rem .6rem;cursor:pointer;
  }
  header button:hover{color:var(--gold);border-color:var(--gold)}
  header button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

  /* ---------- thread ---------- */
  #log{flex:1;overflow-y:auto;padding:clamp(1.4rem,4vw,2.2rem) clamp(1rem,4vw,1.6rem) 2.5rem}
  .thread{max-width:44rem;margin:0 auto;display:flex;flex-direction:column;gap:1.5rem}

  .msg{display:flex;flex-direction:column;gap:.45rem}
  .msg.you{align-items:flex-end}
  .said{
    background:var(--said);border:1px solid var(--rule);
    padding:.6rem .9rem;border-radius:12px;max-width:85%;
    white-space:pre-wrap;overflow-wrap:anywhere;font-size:.95rem;
  }
  /* Serif for Sage, sans for you — the typeface says who is speaking. */
  .sage .body{
    font-family:var(--serif);font-size:1.06rem;line-height:1.62;
    white-space:pre-wrap;overflow-wrap:anywhere;color:var(--ink);
  }
  .sage .body:empty::after{
    content:"▍";color:var(--gold);animation:blink 1.1s steps(2) infinite;
  }
  @keyframes blink{50%{opacity:0}}

  /* ---------- what it did ---------- */
  details.tool{
    border:1px solid var(--rule);border-radius:9px;background:var(--card);
    font-family:var(--sans);font-size:.85rem;
  }
  details.tool > summary{
    cursor:pointer;padding:.45rem .75rem;list-style:none;
    display:flex;gap:.55rem;align-items:baseline;color:var(--ink-2);
  }
  details.tool > summary::-webkit-details-marker{display:none}
  details.tool > summary b{font-weight:600;color:var(--gold);flex:none}
  details.tool > summary code{
    font-family:var(--mono);font-size:.82em;color:var(--muted);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  details.tool pre{
    margin:0;padding:.6rem .75rem;border-top:1px solid var(--rule);
    font-family:var(--mono);font-size:.78rem;line-height:1.5;
    color:var(--ink-2);white-space:pre-wrap;overflow-wrap:anywhere;
    max-height:22rem;overflow:auto;
  }
  .err{
    border:1px solid var(--down);background:var(--down-soft);color:var(--down);
    border-radius:9px;padding:.6rem .85rem;font-size:.9rem;white-space:pre-wrap;
  }

  /* ---------- opening ---------- */
  .opening{text-align:center;padding:clamp(3rem,12vh,6rem) 1rem;display:flex;
    flex-direction:column;gap:.5rem;align-items:center}
  .opening h1{
    margin:0;font-family:var(--serif);font-weight:400;font-style:italic;
    font-size:clamp(2.2rem,7vw,3rem);line-height:1;color:var(--gold);
  }
  .opening p{margin:0;color:var(--muted);font-size:.92rem;max-width:26rem}

  /* ---------- composer ---------- */
  footer{
    flex:none;background:var(--card);border-top:1px solid var(--rule);
    padding:.85rem clamp(1rem,4vw,1.6rem) 1.05rem;
  }
  .composer{max-width:44rem;margin:0 auto;display:flex;gap:.6rem;align-items:flex-end}
  textarea{
    flex:1;resize:none;font:inherit;color:var(--ink);background:var(--paper);
    border:1px solid var(--rule);border-radius:10px;padding:.65rem .85rem;
    min-height:2.9rem;max-height:12rem;
  }
  textarea:focus{outline:2px solid var(--gold);outline-offset:-1px;border-color:transparent}
  #send{
    font:inherit;font-weight:600;font-size:.88rem;cursor:pointer;color:#fff;
    background:var(--gold);border:0;border-radius:10px;padding:.7rem 1.15rem;
  }
  #send:disabled{opacity:.45;cursor:default}
  #send:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

  /* The circle. A round target at the left of the composer, sized to a thumb
     rather than a cursor — this gets used on a phone at least as often as a
     laptop, and 44px is the smallest a touch target should be. */
  .mic{
    flex:none;width:2.9rem;height:2.9rem;min-width:44px;min-height:44px;
    border-radius:50%;cursor:pointer;padding:0;
    display:grid;place-items:center;
    background:var(--card);border:1px solid var(--rule);
    transition:border-color .15s,background .15s,transform .15s;
  }
  .mic[hidden]{display:none}
  .mic:hover{border-color:var(--gold-line)}
  .mic:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
  .mic-dot{
    width:.62rem;height:.62rem;border-radius:50%;background:var(--muted);
    transition:background .15s,transform .15s;
  }
  .mic:hover .mic-dot{background:var(--gold)}

  /* Listening. The ring pulses rather than the dot: a dot that grows and
     shrinks reads as a loading spinner, a ring opening outward reads as
     something receiving. */
  .mic.live{border-color:var(--gold);background:var(--gold-soft)}
  .mic.live .mic-dot{background:var(--gold);transform:scale(1.25)}
  .mic.live::after{
    content:"";position:absolute;width:2.9rem;height:2.9rem;border-radius:50%;
    border:1px solid var(--gold);animation:ring 1.6s ease-out infinite;
  }
  .mic{position:relative}
  @keyframes ring{
    from{transform:scale(1);opacity:.55}
    to{transform:scale(1.45);opacity:0}
  }

  /* Sending the audio up. Not a spinner — the circle stays the circle. */
  .mic.thinking .mic-dot{background:var(--gold);animation:fade 1s ease-in-out infinite alternate}
  @keyframes fade{from{opacity:.35}to{opacity:1}}

  /* While Sage is speaking, the circle becomes the way to cut her off.
     Tapping it stops her AND starts listening, which is what
     "actually, hang on—" looks like as a gesture. */
  .mic.speaking{border-color:var(--gold);background:var(--gold-soft)}
  .mic.speaking .mic-dot{
    width:.7rem;height:.7rem;border-radius:2px;background:var(--gold);
  }

  .mic.denied{opacity:.5}

  @media (prefers-reduced-motion:reduce){
    .mic.live::after{animation:none;opacity:.5}
    .mic.thinking .mic-dot{animation:none}
    .mic{transition:none}
  }
  .hint{max-width:44rem;margin:.5rem auto 0;font-size:.74rem;color:var(--muted)}

  @media (prefers-reduced-motion:reduce){.sage .body:empty::after{animation:none}}
</style>
</head>
<body>

<header>
  <span class="mark">Sage</span>
  <span class="by">powered by Claude</span>
  <span class="status" id="status">ready</span>
  <button type="button" id="path-toggle" aria-expanded="false">Path</button>
  <button type="button" id="docs-toggle" aria-expanded="false" hidden>Documents</button>
  <button type="button" id="mockups-toggle" aria-expanded="false" hidden>Mockups</button>
  <button type="button" id="reset">New conversation</button>
  <form method="post" action="/logout" style="display:contents">
    <button type="submit">Sign out</button>
  </form>
</header>

<!--
  Past conversations. One list, following the same reading as journey's Path
  tab: the conversations are the history, so there is no second place to look.
  Hidden until asked for — the thing you came here to do is talk, and a
  permanent sidebar on a phone takes the screen away from that.
-->
<section id="path" hidden aria-label="Past conversations">
  <div class="path-head">
    <h2>Path</h2>
    <button type="button" id="path-close" aria-label="Close">Close</button>
  </div>
  <div id="path-list"></div>
</section>

<!--
  What a partner has made. Same panel shape as Path: over the thread rather
  than beside it, so it behaves the same on a phone.
-->
<section id="docs" hidden aria-label="Documents">
  <div class="path-head">
    <h2>Documents</h2>
    <button type="button" id="docs-close" aria-label="Close">Close</button>
  </div>
  <div id="docs-list"></div>
</section>

<section id="mockups" hidden aria-label="Mockups">
  <div class="path-head">
    <h2>Mockups</h2>
    <button type="button" id="mockups-close" aria-label="Close">Close</button>
  </div>
  <div id="mockups-list"></div>
</section>

<main id="log">
  <div class="thread" id="thread">
    <div class="opening" id="opening">
      <h1>Sage</h1>
      <p>Ask for something and it gets built. Files live in the workspace on the
      server — the same ones the editor opens.</p>
    </div>
  </div>
</main>

<footer>
  <form class="composer" id="composer">
    <!-- Drawn only if a voice key is configured. See /api/voice. -->
    <button id="mic" type="button" class="mic" hidden
            aria-label="Speak to Sage" title="Speak to Sage">
      <span class="mic-dot" aria-hidden="true"></span>
    </button>
    <textarea id="input" rows="1" placeholder="What would you like to do?" autofocus></textarea>
    <button id="send" type="submit">Send</button>
  </form>
  <p class="hint">Enter to send · Shift+Enter for a new line</p>
</footer>

<script>
const thread  = document.getElementById("thread");
const opening = document.getElementById("opening");
const input   = document.getElementById("input");
const sendBtn = document.getElementById("send");
const status  = document.getElementById("status");

let sessionId = null;
let busy = false;

// Friendlier names than the raw tool identifiers, and the one input field
// worth showing on the summary line for each.
const TOOLS = {
  Read:      ["Read",     i => i.file_path],
  Write:     ["Wrote",    i => i.file_path],
  Edit:      ["Edited",   i => i.file_path],
  Bash:      ["Ran",      i => i.command],
  Glob:      ["Searched", i => i.pattern],
  Grep:      ["Searched", i => i.pattern],
  WebFetch:  ["Fetched",  i => i.url],
  WebSearch: ["Searched the web", i => i.query],
};

const el = (tag, cls, text) => {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text !== undefined) n.textContent = text;
  return n;
};
const scroll = () => {
  const log = document.getElementById("log");
  log.scrollTop = log.scrollHeight;
};

function addYou(text) {
  opening?.remove();
  const wrap = el("div", "msg you");
  wrap.append(el("div", "said", text));
  thread.append(wrap);
  scroll();
}

function startSage() {
  const wrap = el("div", "msg sage");
  const body = el("div", "body", "");
  wrap.append(body);
  thread.append(wrap);
  scroll();
  return { wrap, body };
}

function addTool(wrap, body, name, inputObj) {
  const [label, pick] = TOOLS[name] || [name, () => ""];
  let detail = "";
  try { detail = pick(inputObj || {}) || ""; } catch { detail = ""; }

  const d = el("details", "tool");
  const s = el("summary");
  s.append(el("b", null, label), el("code", null, String(detail)));
  d.append(s, el("pre", null, JSON.stringify(inputObj, null, 2)));

  // Activity goes above the reply still being written, so the words stay at
  // the bottom where the eye already is.
  wrap.insertBefore(d, body);
  scroll();
  return d;
}

function setBusy(state, label) {
  busy = state;
  sendBtn.disabled = state;
  status.textContent = label;
}

async function send(prompt) {
  addYou(prompt);
  const { wrap, body } = startSage();
  setBusy(true, "working…");

  // Tool results arrive separately from the calls they belong to, so keep a
  // map from tool_use id to its <details> element to attach the output.
  const pending = new Map();

  let res;
  try {
    res = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ prompt, sessionId }),
    });
  } catch (e) {
    thread.append(el("div", "err", "Could not reach the server: " + e.message));
    setBusy(false, "ready");
    return;
  }
  if (res.status === 401) {
    // The session lapsed mid-visit; the login page is a redirect away.
    window.location.href = "/login";
    return;
  }
  if (!res.ok || !res.body) {
    thread.append(el("div", "err", "Server returned " + res.status + "."));
    setBusy(false, "ready");
    return;
  }

  const reader = res.body.getReader();
  const decoder = new TextDecoder();
  let buffer = "";

  const handle = (event, data) => {
    if (event === "session")  { sessionId = data.sessionId; return; }
    if (event === "text")     { body.textContent += data.text; scroll(); return; }
    if (event === "tool_use") { pending.set(data.id, addTool(wrap, body, data.name, data.input)); return; }
    if (event === "tool_result") {
      const d = pending.get(data.toolUseId);
      if (!d) return;
      const out = typeof data.content === "string"
        ? data.content : JSON.stringify(data.content, null, 2);
      d.append(el("pre", null, out));
      return;
    }
    if (event === "error") { thread.append(el("div", "err", data.message)); scroll(); }
  };

  while (true) {
    const { done, value } = await reader.read();
    if (done) break;
    buffer += decoder.decode(value, { stream: true });

    // SSE frames are separated by a blank line. Whatever follows the last
    // blank line is a partial frame and waits for the next chunk.
    const frames = buffer.split("\n\n");
    buffer = frames.pop();

    for (const frame of frames) {
      let event = "message", payload = "";
      for (const line of frame.split("\n")) {
        if (line.startsWith("event:")) event = line.slice(6).trim();
        else if (line.startsWith("data:")) payload += line.slice(5).trim();
      }
      if (!payload) continue;
      try { handle(event, JSON.parse(payload)); } catch { /* skip a malformed frame */ }
    }
  }

  if (!body.textContent) body.textContent = "(no reply)";
  setBusy(false, "ready");
  input.focus();
  // Said aloud without being asked for. A conversation where you tap to hear
  // each answer is not a conversation — and the circle stops her at any point.
  speak(body.textContent);
}

document.getElementById("composer").addEventListener("submit", (e) => {
  e.preventDefault();
  const text = input.value.trim();
  if (!text || busy) return;
  input.value = "";
  input.style.height = "auto";
  send(text);
});

input.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    document.getElementById("composer").requestSubmit();
  }
});

input.addEventListener("input", () => {
  input.style.height = "auto";
  input.style.height = Math.min(input.scrollHeight, 192) + "px";
});

// ---------------------------------------------------------------------------
// Which seat this is
//
// Only ever changes how the page dresses itself. Nothing is gated on it — the
// server checks the role on every route that matters, because a browser is not
// somewhere to keep a permission.
// ---------------------------------------------------------------------------

let seatRole = "owner";
const mockupsToggle = document.getElementById("mockups-toggle");
const mockupsPanel  = document.getElementById("mockups");
const mockupsList   = document.getElementById("mockups-list");

fetch("/api/seat")
  .then((r) => r.json())
  .then((d) => {
    seatRole = d.role || "owner";
    if (seatRole === "partner") {
      mockupsToggle.hidden = false;
      // Only offered when there is something in it — an empty panel on the
      // masthead is a promise the seat does not keep.
      if (d.hasDocs) docsToggle.hidden = false;
      // Past conversations are the owner's; a partner seat has its own
      // transcripts but no reason for a Path tab, and the route is theirs
      // alone anyway.
      pathToggle.hidden = true;
      document.title = "Sage · " + (d.project || "review");
      const lead = document.querySelector("#opening p");
      if (lead) {
        lead.textContent =
          "Ask about " + (d.project || "the app") + ", or ask for a mockup of a change. " +
          "Mockups appear under Mockups above. Nothing here changes the real thing.";
      }
    }
  })
  .catch(() => {});

const docsToggle = document.getElementById("docs-toggle");
const docsPanel  = document.getElementById("docs");
const docsList   = document.getElementById("docs-list");

async function openDocs() {
  docsPanel.hidden = false;
  docsToggle.setAttribute("aria-expanded", "true");
  docsList.replaceChildren(el("p", "path-empty", "Looking…"));
  try {
    const res = await fetch("/api/docs");
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || "could not read the documents");
    if (!data.docs.length) {
      docsList.replaceChildren(
        el("p", "path-empty", "No documents have been shared yet.")
      );
      return;
    }
    docsList.replaceChildren(
      ...data.docs.map((d) => {
        const a = el("a", "entry");
        a.href = "/docs/" + encodeURIComponent(d.id);
        a.target = "_blank";
        a.rel = "noopener";
        a.append(el("h3", null, d.title));
        // The path, not a date: which file this is matters more than when it
        // was last touched, and it is what to name in a reply.
        a.append(el("p", "when", d.rel));
        return a;
      })
    );
  } catch (err) {
    docsList.replaceChildren(el("p", "path-error", err.message || "could not read the documents"));
  }
}

function closeDocs() {
  docsPanel.hidden = true;
  docsToggle.setAttribute("aria-expanded", "false");
}

docsToggle.addEventListener("click", () => {
  docsPanel.hidden ? openDocs() : closeDocs();
});
document.getElementById("docs-close").addEventListener("click", closeDocs);

async function openMockups() {
  mockupsPanel.hidden = false;
  mockupsToggle.setAttribute("aria-expanded", "true");
  mockupsList.replaceChildren(el("p", "path-empty", "Looking…"));
  try {
    const res = await fetch("/api/mockups");
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || "could not read the mockups folder");
    if (!data.mockups.length) {
      mockupsList.replaceChildren(
        el("p", "path-empty",
          "Nothing yet. Ask Sage for a mockup of a change and it will appear here.")
      );
      return;
    }
    mockupsList.replaceChildren(
      ...data.mockups.map((m) => {
        // A link rather than a button: it opens a page, and a new tab keeps
        // the conversation where it was.
        const a = el("a", "entry");
        a.href = "/mockups/" + encodeURIComponent(m.name);
        a.target = "_blank";
        a.rel = "noopener";
        a.append(el("h3", null, m.name.replace(/\.html$/, "").replace(/[-_]/g, " ")));
        a.append(el("p", "when", whenText(m.updatedAt)));
        return a;
      })
    );
  } catch (err) {
    mockupsList.replaceChildren(el("p", "path-error", err.message || "could not read the mockups folder"));
  }
}

function closeMockups() {
  mockupsPanel.hidden = true;
  mockupsToggle.setAttribute("aria-expanded", "false");
}

mockupsToggle.addEventListener("click", () => {
  mockupsPanel.hidden ? openMockups() : closeMockups();
});
document.getElementById("mockups-close").addEventListener("click", closeMockups);

// ---------------------------------------------------------------------------
// Voice
//
// Speaking and typing are the same conversation arriving through two doors.
// What the microphone produces is text, and it travels the ordinary path from
// there — same agent, same tools, same everything. The voice provider is never
// asked to think.
// ---------------------------------------------------------------------------

const mic = document.getElementById("mic");
let recorder = null;
let chunks = [];
let speech = null;      // the audio element currently speaking, if any
let voiceReady = false;

// Offered only when the server has a key. An absent one should look like a
// feature that is switched off, not one that is broken.
fetch("/api/voice")
  .then((r) => r.json())
  .then((d) => {
    voiceReady = !!d.available;
    mic.hidden = !voiceReady;
  })
  .catch(() => {});

function micState(cls) {
  mic.classList.remove("live", "thinking", "speaking");
  if (cls) mic.classList.add(cls);
}

/** Cuts Sage off mid-sentence and leaves it there. */
function stopSpeaking() {
  if (!speech) return;
  speech.pause();
  speech.src = "";
  speech = null;
  micState(null);
}

/** Sage says her reply aloud. Silence on failure: a voice that does not
 *  arrive should cost the reply nothing, and the text is already on screen. */
async function speak(text) {
  if (!voiceReady || !text.trim()) return;
  try {
    const res = await fetch("/api/voice/tts", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ text }),
    });
    if (!res.ok) return;
    const url = URL.createObjectURL(await res.blob());
    stopSpeaking();
    speech = new Audio(url);
    micState("speaking");
    speech.addEventListener("ended", () => { URL.revokeObjectURL(url); stopSpeaking(); });
    // Autoplay can be refused until the page has been interacted with. Not
    // worth a dialog — the reply is already readable.
    await speech.play().catch(() => stopSpeaking());
  } catch {
    stopSpeaking();
  }
}

async function startListening() {
  // Cutting Sage off happens first, before the permission prompt or anything
  // else. Someone reaching for the circle mid-sentence wants the talking to
  // stop now, not once the browser has finished asking about microphones.
  stopSpeaking();
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    chunks = [];
    recorder = new MediaRecorder(stream);
    recorder.addEventListener("dataavailable", (e) => { if (e.data.size) chunks.push(e.data); });
    recorder.addEventListener("stop", async () => {
      // The track has to be released explicitly or the browser keeps showing
      // a recording indicator long after this is finished with it.
      stream.getTracks().forEach((t) => t.stop());
      const blob = new Blob(chunks, { type: recorder.mimeType || "audio/webm" });
      recorder = null;
      if (!blob.size) { micState(null); return; }
      micState("thinking");
      try {
        const res = await fetch("/api/voice/stt", {
          method: "POST",
          headers: { "Content-Type": blob.type },
          body: blob,
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || "could not transcribe that");
        const text = (data.text || "").trim();
        micState(null);
        // Nothing intelligible. Say nothing and send nothing — a blank message
        // to the agent is worse than silence.
        if (!text) return;
        input.value = text;
        input.dispatchEvent(new Event("input"));
        // Not sent automatically: a mis-heard word is easy to fix before it
        // becomes a turn, and impossible after.
        input.focus();
      } catch (err) {
        micState(null);
        setBusy(false, err.message || "could not transcribe that");
      }
    });
    recorder.start();
    micState("live");
  } catch {
    // Permission refused, or no microphone. Not worth a dialog — the keyboard
    // is right there.
    mic.classList.add("denied");
    mic.title = "Microphone unavailable";
  }
}

mic.addEventListener("click", () => {
  if (recorder) { recorder.stop(); return; }
  if (busy) { stopSpeaking(); return; }
  startListening();
});

// ---------------------------------------------------------------------------
// Path — past conversations
// ---------------------------------------------------------------------------

const pathPanel  = document.getElementById("path");
const pathList   = document.getElementById("path-list");
const pathToggle = document.getElementById("path-toggle");

function whenText(iso) {
  const then = new Date(iso);
  if (Number.isNaN(then.getTime())) return "";
  const mins = Math.round((Date.now() - then.getTime()) / 60000);
  if (mins < 1) return "just now";
  if (mins < 60) return mins + " min ago";
  const hours = Math.round(mins / 60);
  if (hours < 24) return hours + "h ago";
  const days = Math.round(hours / 24);
  if (days === 1) return "yesterday";
  if (days < 7) return days + " days ago";
  return then.toLocaleDateString(undefined, { month: "short", day: "numeric" });
}

// Reopens a conversation: the turns are drawn back into the thread and the id
// is put back, so the next message continues it rather than starting over.
async function resume(id) {
  if (busy) return;
  setBusy(true, "opening…");
  try {
    const res = await fetch("/api/conversations/" + encodeURIComponent(id));
    if (!res.ok) throw new Error("that conversation could not be opened");
    const data = await res.json();

    thread.replaceChildren();
    for (const turn of data.turns) {
      if (turn.role === "user") {
        addYou(turn.text);
      } else {
        const { body } = startSage();
        body.textContent = turn.text;
      }
    }
    // Only now — a half-drawn thread with a live id would let the next message
    // continue a conversation the reader cannot see.
    sessionId = id;
    closePath();
    input.focus();
    scroll();
  } catch (err) {
    alert(err.message || "could not open that conversation");
  } finally {
    setBusy(false, "ready");
  }
}

// The analysis is a model call, so it happens on request and the result is
// kept. Asking twice costs nothing; the server only regenerates when the
// conversation has moved on since.
async function analyse(id, host, button) {
  if (host.dataset.loaded === "1") { host.hidden = !host.hidden; return; }
  host.hidden = false;
  host.replaceChildren(el("p", null, "Reading back through the conversation…"));
  button.disabled = true;
  try {
    const res = await fetch("/api/conversations/" + encodeURIComponent(id) + "/analysis", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: "{}",
    });
    const data = await res.json();
    if (!res.ok || !data.analysis) throw new Error(data.error || "analysis failed");

    const a = data.analysis;
    host.replaceChildren();
    const section = (cls, heading, text) => {
      const d = el("div", cls);
      d.append(el("h4", null, heading), el("p", null, text));
      host.append(d);
    };
    section("lead", "Summary", a.summary);
    section(null, "What changed", a.changed);
    section(null, "Still open", a.open);
    section("note", "Worth noting", a.worthNoting);
    host.dataset.loaded = "1";
  } catch (err) {
    // Named, not silent — a blank card reads as a broken feature.
    host.replaceChildren(el("p", "path-error", err.message || "analysis failed"));
  } finally {
    button.disabled = false;
  }
}

function renderEntry(c) {
  const card = el("div", "entry");
  card.append(el("h3", null, c.title));
  card.append(el("p", "when", whenText(c.updatedAt)));
  // Shown only when the title came from somewhere else, so the same sentence
  // never appears twice in one card.
  if (c.opening && c.opening !== c.title) {
    card.append(el("p", "excerpt", c.opening));
  }

  const acts = el("div", "acts");
  const go = el("button", "go", "Continue");
  go.type = "button";
  const dig = el("button", null, "Analysis");
  dig.type = "button";
  acts.append(go, dig);
  card.append(acts);

  const host = el("div", "analysis");
  host.hidden = true;
  card.append(host);

  go.addEventListener("click", () => resume(c.id));
  dig.addEventListener("click", () => analyse(c.id, host, dig));
  return card;
}

async function openPath() {
  pathPanel.hidden = false;
  pathToggle.setAttribute("aria-expanded", "true");
  pathList.replaceChildren(el("p", "path-empty", "Looking…"));
  try {
    const res = await fetch("/api/conversations");
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || "could not read past conversations");
    if (!data.conversations.length) {
      pathList.replaceChildren(
        el("p", "path-empty",
          "Nothing here yet. Conversations appear once you've had one — they're kept on the server, so this list is the same on your phone and your laptop.")
      );
      return;
    }
    pathList.replaceChildren(...data.conversations.map(renderEntry));
  } catch (err) {
    pathList.replaceChildren(el("p", "path-error", err.message || "could not read past conversations"));
  }
}

function closePath() {
  pathPanel.hidden = true;
  pathToggle.setAttribute("aria-expanded", "false");
}

pathToggle.addEventListener("click", () => {
  pathPanel.hidden ? openPath() : closePath();
});
document.getElementById("path-close").addEventListener("click", closePath);
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && !pathPanel.hidden) closePath();
});

document.getElementById("reset").addEventListener("click", () => {
  if (busy) return;
  sessionId = null;
  thread.replaceChildren();
  const o = el("div", "opening");
  o.append(el("h1", null, "Sage"));
  o.append(el("p", null, "New conversation. The workspace is unchanged."));
  thread.append(o);
  input.focus();
});
</script>
</body>
