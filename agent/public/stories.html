<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stories · Study Pal</title>
<style>
  /* Study Pal's story desk, in this seat's own palette. Same tokens as the
     chat page — one product, and a second colour scheme in the same seat would
     read as a different application. */
  :root{
    --paper:#eef1f5; --card:#fbfcfd; --card-2:#f4f6f9;
    --ink:#10192b; --ink-2:#45536b; --muted:#7d8ba0; --rule:#dae0e9;
    --gold:#a8761f; --gold-soft:#f6efdf; --gold-line:#e6d3ab;
    --good:#1f6b52; --good-soft:#e4efea;
    --down:#a8442f; --down-soft:#f8e9e5;
    --serif:ui-serif,"New York",Georgia,"Times New Roman",serif;
    --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,
           "Helvetica Neue",Arial,"PingFang SC","Hiragino Sans GB",
           "Microsoft YaHei",sans-serif;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --paper:#0e1219; --card:#161b24; --card-2:#1b2029; --ink:#e8ecf3;
      --ink-2:#a6b1c2; --muted:#77839a; --rule:#242b36;
      --gold:#d9a94e; --gold-soft:#2a2213; --gold-line:#4b3d1d;
      --good:#5cc39c; --good-soft:#12261f;
      --down:#e08a72; --down-soft:#2c1a16;
    }
  }
  :root[data-theme="dark"]{
    --paper:#0e1219; --card:#161b24; --card-2:#1b2029; --ink:#e8ecf3;
    --ink-2:#a6b1c2; --muted:#77839a; --rule:#242b36;
    --gold:#d9a94e; --gold-soft:#2a2213; --gold-line:#4b3d1d;
    --good:#5cc39c; --good-soft:#12261f;
    --down:#e08a72; --down-soft:#2c1a16;
  }

  *{box-sizing:border-box}
  body{
    margin:0; background:var(--paper); color:var(--ink);
    font-family:var(--sans); font-size:16px; line-height:1.55;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:64rem; margin:0 auto; padding:1.4rem 1.2rem 5rem}

  header.top{
    display:flex; align-items:center; gap:1rem; flex-wrap:wrap;
    padding-bottom:1rem; border-bottom:1px solid var(--rule); margin-bottom:1.6rem;
  }
  .mark{font-family:var(--serif); font-size:2rem; line-height:1; color:var(--gold)}
  .sub{color:var(--muted); font-size:.9rem}
  .spacer{flex:1}

  button{font:inherit; cursor:pointer}
  .btn{
    background:var(--card); color:var(--ink); border:1px solid var(--rule);
    border-radius:9px; padding:.5rem .9rem; font-size:.88rem; font-weight:500;
  }
  .btn:hover{border-color:var(--gold-line)}
  .btn.primary{background:var(--gold); border-color:var(--gold); color:#fff}
  .btn.publish{background:var(--good); border-color:var(--good); color:#fff}
  .btn.danger{color:var(--down); border-color:var(--rule)}
  .btn:disabled{opacity:.5; cursor:default}
  .btn.small{padding:.3rem .6rem; font-size:.78rem}

  h2{font-family:var(--serif); font-weight:400; font-size:1.5rem; margin:0 0 .8rem}

  /* ---------- the shelf ---------- */
  .shelf{display:grid; gap:.7rem; grid-template-columns:repeat(auto-fill,minmax(16rem,1fr))}
  .card{
    background:var(--card); border:1px solid var(--rule); border-radius:12px;
    padding:.9rem 1rem; text-align:left; width:100%;
  }
  .card:hover{border-color:var(--gold-line)}
  .card .t{font-family:var(--serif); font-size:1.15rem; line-height:1.2}
  .card .zh{color:var(--ink-2); font-size:.92rem; margin-top:.1rem}
  .card .meta{
    display:flex; gap:.45rem; flex-wrap:wrap; margin-top:.6rem;
    font-size:.72rem; color:var(--muted);
  }
  .pill{
    border:1px solid var(--rule); border-radius:99px; padding:.05rem .5rem;
    background:var(--card-2);
  }
  .pill.on{background:var(--good-soft); border-color:var(--good); color:var(--good); font-weight:600}
  .pill.off{color:var(--muted)}
  .pill.draft{background:var(--gold-soft); border-color:var(--gold-line); color:var(--gold); font-weight:600}

  /* ---------- the editor ---------- */
  .fields{
    display:grid; gap:.7rem; grid-template-columns:repeat(auto-fit,minmax(11rem,1fr));
    background:var(--card); border:1px solid var(--rule); border-radius:12px;
    padding:1rem; margin-bottom:1rem;
  }
  .fields .wide{grid-column:1 / -1}
  label{display:flex; flex-direction:column; gap:.25rem; font-size:.72rem;
        letter-spacing:.08em; text-transform:uppercase; color:var(--muted); font-weight:600}
  input,textarea,select{
    font:inherit; font-size:.92rem; color:var(--ink); background:var(--paper);
    border:1px solid var(--rule); border-radius:8px; padding:.45rem .6rem;
    text-transform:none; letter-spacing:0; font-weight:400; width:100%;
  }
  textarea{resize:vertical; min-height:3.2rem; line-height:1.45}
  input:focus,textarea:focus,select:focus{outline:2px solid var(--gold); outline-offset:1px}
  .check-row{display:flex; align-items:center; gap:.5rem; font-size:.85rem;
             text-transform:none; letter-spacing:0; color:var(--ink-2); font-weight:400}
  .check-row input{width:auto}

  /* ---------- cover art ----------
     A drop target that shows the crop rather than describing it. The frame is
     the shape the card will be, so what is on screen is what ships. */
  .cover{display:grid; gap:.8rem; grid-template-columns:auto 1fr; align-items:start}
  @media (max-width:34rem){ .cover{grid-template-columns:1fr} }
  .drop{
    width:11rem; aspect-ratio:1; border:2px dashed var(--rule); border-radius:12px;
    background:var(--card-2); display:flex; align-items:center; justify-content:center;
    text-align:center; padding:.8rem; cursor:pointer; overflow:hidden; position:relative;
    color:var(--muted); font-size:.78rem; line-height:1.4;
  }
  .drop.tall{aspect-ratio:3/4}
  .drop.wide{aspect-ratio:16/9; width:16rem}
  .drop:hover,.drop.over{border-color:var(--gold); color:var(--gold)}
  .drop img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover}
  .cover-side{display:grid; gap:.55rem; align-content:start}
  .ratios{display:flex; gap:.35rem}
  .ratios button{
    text-transform:none; letter-spacing:0;
    background:var(--card); border:1px solid var(--rule); border-radius:7px;
    padding:.25rem .6rem; font-size:.76rem; color:var(--ink-2);
  }
  .ratios button[aria-pressed="true"]{
    background:var(--gold-soft); border-color:var(--gold); color:var(--gold); font-weight:600;
  }
  .cover-where{
    /* The label rule uppercases its contents, which is right for a field name
       and wrong for a path — a file path in the wrong case is one somebody
       types wrong. Reset here rather than loosening the rule for everything. */
    text-transform:none; letter-spacing:0;
    font-family:var(--mono); font-size:.74rem; color:var(--muted);
    background:var(--card-2); border:1px solid var(--rule); border-radius:6px;
    padding:.25rem .45rem; overflow-x:auto; white-space:nowrap;
  }

  /* ---------- the three-act check ---------- */
  .shape{
    background:var(--card); border:1px solid var(--rule); border-radius:12px;
    padding:1rem; margin-bottom:1rem;
  }
  .acts{display:flex; height:2.2rem; border-radius:8px; overflow:hidden; margin-bottom:.8rem}
  .acts span{
    display:flex; align-items:center; justify-content:center; color:#fff;
    font-size:.75rem; font-weight:600; min-width:2px;
  }
  .acts .a1{background:var(--gold)}
  .acts .a2{background:var(--ink-2)}
  .acts .a3{background:var(--good)}
  .checks{display:grid; gap:.35rem; grid-template-columns:repeat(auto-fit,minmax(15rem,1fr))}
  .chk{display:flex; align-items:baseline; gap:.5rem; font-size:.85rem; color:var(--ink-2)}
  .chk .dot{
    flex:none; width:.62rem; height:.62rem; border-radius:50%; margin-top:.35rem;
    background:var(--good);
  }
  .chk.bad .dot{background:var(--down)}
  .chk.bad{color:var(--down)}

  /* ---------- beats ---------- */
  .beat{
    background:var(--card); border:1px solid var(--rule); border-radius:12px;
    padding:.85rem 1rem; margin-bottom:.6rem;
    display:grid; gap:.6rem; grid-template-columns:3.2rem 1fr;
  }
  .beat .n{
    font-family:var(--serif); font-size:1.6rem; color:var(--muted); line-height:1;
    padding-top:.2rem;
  }
  .beat .body{display:grid; gap:.55rem}
  .beat .row{display:grid; gap:.55rem; grid-template-columns:1fr 6rem 11rem}
  @media (max-width:44rem){ .beat .row{grid-template-columns:1fr} }
  .tried{
    background:var(--card-2); border:1px solid var(--rule); border-radius:9px;
    padding:.7rem .85rem; font-size:.9rem; line-height:1.6;
  }
  .tried .line{margin:0 0 .25rem}
  /* A clip made for a beat, shown against the beat it is for. Small: this is
     a check that the shot works, not a viewing experience — the full-size
     version is on the Video page and in the project. */
  .tried video{
    width:9rem; border-radius:9px; background:#000; display:block; margin-top:.4rem;
  }
  .tried .where{
    font-family:var(--mono); font-size:.72rem; color:var(--ink-2);
    margin:.35rem 0 0; overflow-wrap:anywhere;
  }
  .tried .who{color:var(--gold); font-weight:600}
  .tried .waiting{color:var(--muted); font-style:italic}

  .toast{
    position:fixed; left:50%; bottom:1.2rem; transform:translateX(-50%);
    background:var(--ink); color:var(--paper); border-radius:99px;
    padding:.5rem 1.1rem; font-size:.86rem; box-shadow:0 4px 18px rgba(0,0,0,.2);
    z-index:20;
  }
  .toast.bad{background:var(--down); color:#fff}
  .note{color:var(--muted); font-size:.85rem; margin:.4rem 0 1.2rem}
  .note b{color:var(--ink-2)}
  [hidden]{display:none !important}
</style>
</head>
<body>
<div class="wrap">

  <header class="top">
    <span class="mark">Stories</span>
    <span class="sub" id="where">Study Pal</span>
    <span class="spacer"></span>
    <button class="btn" id="back" hidden>← All stories</button>
    <button class="btn primary" id="new">New series</button>
    <a class="btn" href="/" id="to-sage">← Sage</a>
  </header>

  <!-- the shelf -->
  <section id="list">
    <div class="shelf" id="shelf"></div>
    <p class="note" id="list-note"></p>
  </section>

  <!-- the editor -->
  <section id="editor" hidden>
    <div class="fields">
      <label class="wide">Title<input id="f-title" placeholder="Autumn in Wudaokou"></label>
      <label>Chinese title<input id="f-zh" placeholder="五道口的秋天"></label>
      <label>Id (permanent)<input id="f-id" placeholder="wudaokou"></label>
      <label>Teaches
        <select id="f-lang"><option value="zh">Chinese</option><option value="en">English</option></select>
      </label>
      <label>Category<input id="f-cat" placeholder="Campus romance"></label>
      <label>Planned episodes<input id="f-planned" type="number" min="1" max="60"></label>
      <label class="wide">Blurb — what makes somebody press play
        <textarea id="f-blurb"></textarea></label>
      <label class="wide">Cast — the two people, described once, used in every episode
        <textarea id="f-cast"></textarea></label>
      <label class="wide">Cover art
        <div class="cover">
          <div class="drop" id="drop" tabindex="0" role="button"
               aria-label="Drop a cover image here, or click to choose one">
            <span id="drop-hint">Drop an image<br>or click to choose</span>
          </div>
          <div class="cover-side">
            <div class="ratios" id="ratios">
              <button type="button" data-r="square" aria-pressed="true">Square</button>
              <button type="button" data-r="tall" aria-pressed="false">3:4</button>
              <button type="button" data-r="wide" aria-pressed="false">16:9</button>
            </div>
            <div style="display:flex; gap:.5rem; flex-wrap:wrap">
              <button type="button" class="btn small" id="cover-up" disabled>Send to Study Pal</button>
              <button type="button" class="btn small" id="cover-dl" disabled>Download cover.jpg</button>
            </div>
            <div class="cover-where" id="cover-where">public/series/&lt;id&gt;/cover.jpg</div>
            <span class="check-row"><input type="checkbox" id="f-cover"> Art is in place on the server</span>
          </div>
        </div>
      </label>
    </div>

    <div class="shape">
      <div class="acts" id="acts"></div>
      <div class="checks" id="checks"></div>
    </div>

    <div id="beats"></div>

    <div style="display:flex; gap:.6rem; flex-wrap:wrap; margin-top:1rem">
      <button class="btn primary" id="save">Save draft</button>
      <button class="btn publish" id="publish">Publish</button>
      <button class="btn" id="add-beat">Add a beat</button>
      <span class="spacer"></span>
      <button class="btn danger" id="delete">Delete</button>
    </div>
    <p class="note" id="edit-note"></p>
  </section>

</div>

<script type="module">
import { FUNCTIONS, checkShape, blankBeats } from "./three-act.js";

// ---------------------------------------------------------------------------
// The story desk.
//
// Every call goes to this origin. Study Pal's endpoints are on another host
// behind a shared secret with no CORS headers, so the seat's server proxies
// them and the key never reaches this page — see agent/lib/studypal.js.
// ---------------------------------------------------------------------------

// Inside Sage's writing panel, or on its own page. The difference is only what
// happens after a publish: embedded, the stage beside us shows it; standalone,
// a tab does. Everything else is identical, which is the point of there being
// one page rather than two.
const EMBEDDED = new URLSearchParams(location.search).get("embed") === "1";

const el = (tag, cls, text) => {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text !== undefined) n.textContent = text;
  return n;
};
const $ = (id) => document.getElementById(id);

function toast(message, bad) {
  document.querySelectorAll(".toast").forEach((t) => t.remove());
  const t = el("div", "toast" + (bad ? " bad" : ""), message);
  document.body.append(t);
  setTimeout(() => t.remove(), bad ? 6000 : 2600);
}

// The word this seat is asked for before anything reaches readers. Held for one
// call and then forgotten: a variable that survived would turn "enter it before
// it goes live" into "enter it once a day", which is not what it is for.
let publishWord = "";

async function api(path, options) {
  const opts = { ...(options || {}) };
  if (publishWord) {
    opts.headers = { ...(opts.headers || {}), "x-publish-word": publishWord };
  }
  const res = await fetch(path, opts);
  let body = null;
  try { body = await res.json(); } catch { /* an empty or non-JSON reply */ }
  if (!res.ok) {
    const why = body?.error || res.status + " from the story desk";
    const err = new Error(why);
    // Carried on the error so the caller can ask for the word rather than
    // showing a refusal nobody can act on.
    if (body?.needWord) err.needWord = true;
    throw err;
  }
  return body;
}

/** Runs something that may be gated. On a first refusal it asks for the word
 *  and tries once more; a second refusal is a wrong word and says so.
 *
 *  The seat that needs no word never sees any of this — the first attempt
 *  succeeds and nothing is asked. */
async function guarded(run) {
  try {
    return await run();
  } catch (err) {
    if (!err.needWord) throw err;
    const given = window.prompt(
      "This goes live to readers.\n\nEnter the publish word to continue:"
    );
    if (!given || !given.trim()) throw new Error("Not published — no word entered");
    publishWord = given.trim();
    try {
      return await run();
    } catch (again) {
      if (again.needWord) throw new Error("That word was not right — nothing was published");
      throw again;
    } finally {
      // Deliberately not kept. The next publish asks again.
      publishWord = "";
    }
  }
}

// ---------------------------------------------------------------------------
// The shelf
// ---------------------------------------------------------------------------
let all = [];
// Whether this seat may generate video. The desk and the video routes are
// separate grants — a partner can have the desk without it — so the button is
// drawn from what the server says rather than assumed from being here at all.
let canVideo = false;

async function loadList() {
  $("list-note").textContent = "Reading the catalogue…";
  try {
    const data = await api("/sp/series");
    // The payload's shape is the other side's to choose; take the array
    // wherever it is rather than assuming one wrapper.
    all = Array.isArray(data) ? data
        : Array.isArray(data?.series) ? data.series
        : Array.isArray(data?.items) ? data.items : [];
    drawShelf();
  } catch (err) {
    $("list-note").innerHTML = "<b>Could not read the catalogue.</b> " + err.message;
    $("shelf").replaceChildren();
  }
}

function drawShelf() {
  const shelf = $("shelf");
  shelf.replaceChildren();

  for (const s of all) {
    const written = (s.episodes || []).filter((e) => (e.beat || "").trim()).length;
    const card = el("button", "card");
    card.append(el("div", "t", s.title || s.id || "Untitled"));
    if (s.zh) card.append(el("div", "zh", s.zh));

    const meta = el("div", "meta");
    meta.append(el("span", "pill", s.lang === "en" ? "teaches English" : "teaches Chinese"));
    if (s.cat) meta.append(el("span", "pill", s.cat));
    meta.append(el("span", "pill", written + " of " + (s.planned || written) + " beats"));
    meta.append(el("span", "pill " + (s.published ? "on" : "draft"),
      s.published ? "on the shelf" : "draft"));
    if (!s.cover) meta.append(el("span", "pill off", "no cover"));
    card.append(meta);

    card.addEventListener("click", () => openEditor(s));
    shelf.append(card);
  }

  $("list-note").innerHTML = all.length
    ? "<b>" + all.length + " series.</b> Drafts are visible here and not to readers."
    : "<b>Nothing yet.</b> Start one with <i>New series</i>.";
}

// ---------------------------------------------------------------------------
// The editor
// ---------------------------------------------------------------------------
let current = null;

function openEditor(series) {
  current = JSON.parse(JSON.stringify(series));
  current.episodes = current.episodes || [];
  $("list").hidden = true;
  $("editor").hidden = false;
  $("back").hidden = false;
  $("new").hidden = true;
  $("where").textContent = current.title || "New series";

  $("f-title").value = current.title || "";
  $("f-zh").value = current.zh || "";
  $("f-id").value = current.id || "";
  $("f-lang").value = current.lang === "en" ? "en" : "zh";
  $("f-cat").value = current.cat || "";
  $("f-planned").value = current.planned || current.episodes.length || 12;
  $("f-blurb").value = current.blurb || "";
  $("f-cast").value = current.cast || "";
  $("f-cover").checked = Boolean(current.cover);
  coverBlob = null; lastPicked = null;
  $("cover-up").disabled = true; $("cover-dl").disabled = true;
  coverBox().replaceChildren(Object.assign(document.createElement("span"),
    { id: "drop-hint", innerHTML: "Drop an image<br>or click to choose" }));
  showCoverPath();
  $("edit-note").innerHTML = "";

  drawBeats();
}

// ---------------------------------------------------------------------------
// Cover art
//
// Cropped and resized here rather than on the way in, so what the writer sees
// in the frame is exactly the file that ships — a server-side crop would be a
// second opinion about which part of the photograph mattered.
//
// The upload endpoint does not exist on the other side yet; the spec lists it
// as the missing piece. So the finished file is also offered as a download,
// named and with its destination path shown. The work of choosing and framing
// an image survives either way, which is the point.
// ---------------------------------------------------------------------------
const RATIOS = { square: [1, 1], tall: [3, 4], wide: [16, 9] };
let coverRatio = "square";
let coverBlob = null;

function coverBox() { return document.getElementById("drop"); }

function setRatio(name) {
  coverRatio = name;
  const box = coverBox();
  box.classList.remove("tall", "wide");
  if (name !== "square") box.classList.add(name);
  document.querySelectorAll("#ratios button").forEach((b) => {
    b.setAttribute("aria-pressed", String(b.dataset.r === name));
  });
  if (lastPicked) renderCover(lastPicked);
}

let lastPicked = null;

/** Draw the image into the chosen frame, cover-fitting and centred, then keep
 *  the result as a JPEG. 1200 on the long edge: sharp on a retina card and a
 *  fraction of the megabytes a phone photograph arrives as. */
function renderCover(img) {
  lastPicked = img;
  const [rw, rh] = RATIOS[coverRatio];
  const long = 1200;
  const W = rw >= rh ? long : Math.round((long * rw) / rh);
  const H = rh >= rw ? long : Math.round((long * rh) / rw);

  const c = document.createElement("canvas");
  c.width = W; c.height = H;
  const ctx = c.getContext("2d");
  const scale = Math.max(W / img.width, H / img.height);
  const dw = img.width * scale, dh = img.height * scale;
  ctx.drawImage(img, (W - dw) / 2, (H - dh) / 2, dw, dh);

  c.toBlob((blob) => {
    coverBlob = blob;
    const box = coverBox();
    box.replaceChildren();
    const preview = document.createElement("img");
    preview.src = URL.createObjectURL(blob);
    preview.alt = "";
    box.append(preview);
    $("cover-up").disabled = false;
    $("cover-dl").disabled = false;
  }, "image/jpeg", 0.86);
}

function pickCover(file) {
  if (!file || !/^image\//.test(file.type)) return toast("That is not an image", true);
  const img = new Image();
  img.onload = () => renderCover(img);
  img.onerror = () => toast("Could not read that image", true);
  img.src = URL.createObjectURL(file);
}

function wireCover() {
  const box = coverBox();
  const input = document.createElement("input");
  input.type = "file";
  input.accept = "image/*";
  input.hidden = true;
  document.body.append(input);

  box.addEventListener("click", () => input.click());
  box.addEventListener("keydown", (e) => {
    if (e.key === "Enter" || e.key === " ") { e.preventDefault(); input.click(); }
  });
  input.addEventListener("change", () => { if (input.files[0]) pickCover(input.files[0]); });

  ["dragenter", "dragover"].forEach((t) => box.addEventListener(t, (e) => {
    e.preventDefault(); box.classList.add("over");
  }));
  ["dragleave", "drop"].forEach((t) => box.addEventListener(t, (e) => {
    e.preventDefault(); box.classList.remove("over");
  }));
  box.addEventListener("drop", (e) => pickCover(e.dataTransfer?.files?.[0]));

  document.querySelectorAll("#ratios button").forEach((b) => {
    b.addEventListener("click", () => setRatio(b.dataset.r));
  });

  $("cover-dl").addEventListener("click", () => {
    if (!coverBlob) return;
    const a = document.createElement("a");
    a.href = URL.createObjectURL(coverBlob);
    a.download = "cover.jpg";
    a.click();
    toast("Put it at " + ($("cover-where").textContent));
  });

  $("cover-up").addEventListener("click", async () => {
    const id = $("f-id").value.trim();
    if (!id) return toast("Give the series an id first", true);
    if (!coverBlob) return;
    const button = $("cover-up");
    button.disabled = true;
    const was = button.textContent;
    button.textContent = "Sending…";
    try {
      const image = await new Promise((ok) => {
        const r = new FileReader();
        r.onload = () => ok(String(r.result).split(",")[1]);
        r.readAsDataURL(coverBlob);
      });
      await api("/sp/cover", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ id, image }),
      });
      $("f-cover").checked = true;
      toast("Cover sent");
    } catch (err) {
      // Expected until that endpoint exists. Say which it is rather than
      // "failed", because one of these is a bug and the other is a Tuesday.
      toast("Study Pal has no cover endpoint yet — use Download instead", true);
      $("edit-note").innerHTML = "<b>Cover upload is not available on Study Pal yet.</b> "
        + "Download the file and place it at <code>" + $("cover-where").textContent
        + "</code> in that repo. The endpoint this expects is "
        + "<code>POST /api/cover</code> with <code>{ id, image }</code>, image being base64 JPEG.";
    } finally {
      button.disabled = false;
      button.textContent = was;
    }
  });
}

function collect() {
  return {
    id: $("f-id").value.trim(),
    title: $("f-title").value.trim(),
    zh: $("f-zh").value.trim(),
    lang: $("f-lang").value,
    cat: $("f-cat").value.trim(),
    blurb: $("f-blurb").value.trim(),
    cast: $("f-cast").value.trim(),
    cover: $("f-cover").checked,
    published: Boolean(current.published),
    soon: Boolean(current.soon),
    planned: Number($("f-planned").value) || current.episodes.length,
    episodes: current.episodes,
  };
}

function drawBeats() {
  const box = $("beats");
  box.replaceChildren();

  current.episodes.forEach((ep, i) => {
    const row = el("div", "beat");
    row.append(el("div", "n", String(ep.n ?? i + 1)));

    const body = el("div", "body");
    const top = el("div", "row");

    const title = el("input");
    title.placeholder = "Episode title";
    title.value = ep.title || "";
    title.addEventListener("input", () => { ep.title = title.value; });

    const act = el("select");
    for (const a of [1, 2, 3]) {
      const o = el("option", null, "Act " + a);
      o.value = String(a);
      act.append(o);
    }
    act.value = String(ep.act || 1);
    act.addEventListener("change", () => { ep.act = Number(act.value); drawShape(); });

    const fn = el("select");
    for (const f of FUNCTIONS) {
      const o = el("option", null, f);
      o.value = f;
      fn.append(o);
    }
    fn.value = FUNCTIONS.includes(ep.function) ? ep.function : "rising";
    fn.addEventListener("change", () => { ep.function = fn.value; drawShape(); });

    top.append(title, act, fn);

    const beat = el("textarea");
    beat.placeholder = "What happens in this episode.";
    beat.value = ep.beat || "";
    beat.addEventListener("input", () => { ep.beat = beat.value; drawShape(); });

    const hook = el("input");
    hook.placeholder = "The hook — the line that makes them tap the next one.";
    hook.value = ep.hook || "";
    hook.addEventListener("input", () => { ep.hook = hook.value; });

    const tools = el("div", "row");
    tools.style.gridTemplateColumns = "auto auto auto 1fr";
    const tryIt = el("button", "btn small", "Try this beat");
    const film = el("button", "btn small", "Make the clip");
    const drop = el("button", "btn small danger", "Remove");
    tools.append(tryIt, film, drop, el("span"));
    if (!canVideo) film.hidden = true;

    const out = el("div", "tried");
    out.hidden = true;

    tryIt.addEventListener("click", () => tryBeat(ep, tryIt, out));
    film.addEventListener("click", () => makeClip(ep, film, out));
    drop.addEventListener("click", () => {
      current.episodes.splice(i, 1);
      current.episodes.forEach((e, k) => { e.n = k + 1; });
      drawBeats();
    });

    body.append(top, beat, hook, tools, out);
    row.append(body);
    box.append(row);
  });

  drawShape();
}

// ---------------------------------------------------------------------------
// The three-act check, rendered
//
// The rules live in three-act.js and are shared with Study Pal's own writing
// screen — the same judgements, rendered however each side likes. Sharing the
// markup instead would have meant sharing a design system, which is how one
// module becomes two that disagree.
// ---------------------------------------------------------------------------
function drawShape() {
  const { n, perAct, checks } = checkShape(current.episodes);
  const bar = $("acts");
  const list = $("checks");
  bar.replaceChildren();
  list.replaceChildren();
  if (!n) return;

  perAct.forEach((count, i) => {
    if (!count) return;
    const seg = el("span", "a" + (i + 1), "Act " + (i + 1) + " · " + count);
    seg.style.width = (count / n) * 100 + "%";
    bar.append(seg);
  });

  for (const c of checks) {
    const row = el("div", "chk" + (c.ok ? "" : " bad"));
    row.append(el("span", "dot"), el("span", null, c.text));
    list.append(row);
  }
}

// ---------------------------------------------------------------------------
// Trying one beat
//
// A beat that reads well and generates thin dialogue is worth finding out about
// at episode one rather than episode twelve. It is a model call: slow on
// purpose, so the button says so rather than appearing to have done nothing.
// ---------------------------------------------------------------------------
/** Generates the clip for one beat.
 *
 *  The prompt is the beat itself, prefixed with the series and episode number.
 *  That prefix is doing two jobs: it gives the model the setting, and it makes
 *  the clip findable afterwards — the Video page lists jobs by prompt, so
 *  "Wudaokou — episode 3 — …" identifies itself without this desk having to
 *  write anything into the catalogue. Nothing here adds a field to the series,
 *  because that payload belongs to Study Pal's schema and not to this page.
 */
async function makeClip(ep, button, out) {
  const beat = (ep.beat || "").trim();
  if (beat.length < 8) return toast("Write the beat first — that is the prompt", true);

  const parts = [($("f-title").value || "").trim(), "episode " + (ep.n || ""), beat];
  const prompt = parts.filter(Boolean).join(" — ");
  let project = "";
  try { project = localStorage.getItem("sage_project") || ""; } catch { /* private window */ }

  button.disabled = true;
  const was = button.textContent;
  button.textContent = "Filming…";
  out.hidden = false;
  out.replaceChildren(el("p", "line waiting", "Generating — a minute or two."));

  try {
    const started = await api("/api/video", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({
        prompt,
        ratio: "9:16", seconds: 5, resolution: "720p",
        watermark: true, project,
      }),
    });

    // Polled here rather than left to the Video page: the point of the button
    // is watching the beat you just wrote turn into a shot.
    const id = started.job.id;
    for (let i = 0; i < 90; i++) {
      await new Promise((r) => setTimeout(r, 5000));
      let job;
      try {
        job = (await api("/api/video/" + encodeURIComponent(id))).job;
      } catch {
        continue;                       // a bad minute is not a failed job
      }
      if (job.status === "running") continue;
      if (job.status === "failed") throw new Error(job.error || "the provider could not make it");

      out.replaceChildren();
      const v = document.createElement("video");
      v.src = "/api/video/" + encodeURIComponent(id) + "/file";
      v.controls = true;
      v.preload = "metadata";
      v.playsInline = true;
      out.append(v);
      out.append(el("p", "where", job.file || ""));
      return;
    }
    throw new Error("still going after several minutes — check the Video page");
  } catch (err) {
    out.replaceChildren(el("p", "line waiting", "Could not film it: " + err.message));
  } finally {
    button.disabled = false;
    button.textContent = was;
  }
}

async function tryBeat(ep, button, out) {
  const id = $("f-id").value.trim();
  if (!id) return toast("Give the series an id first", true);

  button.disabled = true;
  const was = button.textContent;
  button.textContent = "Writing…";
  out.hidden = false;
  out.replaceChildren(el("p", "line waiting", "Writing this beat — about ten seconds."));

  try {
    // Saved first, so the beat being tried is the beat on the box rather than
    // the one in this browser. Generating from unsaved text tests something
    // nobody can reproduce.
    await api("/sp/series", {
      method: "PUT",
      headers: { "content-type": "application/json" },
      body: JSON.stringify(collect()),
    });

    const data = await api("/sp/episode", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ series: id, episode: ep.n, level: 2 }),
    });

    const lines = data?.lines || data?.dialogue || data?.script || [];
    out.replaceChildren();
    if (!lines.length) {
      out.append(el("p", "line waiting", "It answered, but with no lines in it."));
    }
    for (const line of lines) {
      const p = el("p", "line");
      const who = line.who || line.speaker || line.name;
      if (who) p.append(el("span", "who", who + " "));
      p.append(document.createTextNode(line.zh || line.text || line.line || String(line)));
      out.append(p);
    }
  } catch (err) {
    out.replaceChildren(el("p", "line waiting", "Could not write it: " + err.message));
  } finally {
    button.disabled = false;
    button.textContent = was;
  }
}

// ---------------------------------------------------------------------------
// Saving, and publishing, which are deliberately two buttons
//
// Saving means a writer started. Publishing means somebody decided it was
// ready. Share a button and half-written stories reach readers.
// ---------------------------------------------------------------------------
async function save(publish, tab) {
  const payload = collect();
  if (!payload.id) { tab?.close(); return toast("An id is required", true); }
  if (publish) payload.published = true;

  try {
    await guarded(() => api("/sp/series", {
      method: "PUT",
      headers: { "content-type": "application/json" },
      body: JSON.stringify(payload),
    }));
    current.published = payload.published;
    toast(publish
      ? (EMBEDDED ? "Published — see it on the right" : "Published — opening the app")
      : "Draft saved");
    $("edit-note").innerHTML = publish
      ? "<b>On the shelf.</b> Readers see this version."
      : "<b>Saved as a draft.</b> Readers still see the last published version, if there is one.";

    if (publish) {
      const where = await api("/sp/where").catch(() => null);
      if (EMBEDDED) {
        // Inside Sage: hand it to the stage beside us rather than opening a
        // tab. Watching it appear there is the whole reason for writing here.
        tab?.close();
        if (where?.shelf) parent.postMessage({ type: "story-published", url: where.shelf }, location.origin);
      } else if (tab) {
        if (where?.shelf) tab.location = where.shelf;
        else tab.close();
      }
    }
  } catch (err) {
    // The tab was opened on the click and is now pointing at nothing. Close it
    // rather than leaving a blank window as the only sign anything happened.
    tab?.close();
    toast(err.message, true);
  }
}

$("save").addEventListener("click", () => save(false));

// Publishing opens the readers' copy so somebody can look at what they just
// did. The tab is opened HERE, inside the click, and navigated afterwards:
// a window.open on the far side of an await has lost the user gesture and is
// blocked as a popup, which is a silent failure rather than a visible one.
$("publish").addEventListener("click", () => {
  // Embedded, the stage next door does the showing and a second window would
  // be the thing this arrangement exists to avoid.
  const tab = EMBEDDED ? null : window.open("", "_blank");
  save(true, tab);
});

$("add-beat").addEventListener("click", () => {
  current.episodes.push({
    n: current.episodes.length + 1, act: 3, function: "rising",
    title: "", beat: "", hook: "",
  });
  drawBeats();
});

$("delete").addEventListener("click", async () => {
  const id = $("f-id").value.trim();
  if (!id) return;
  if (!confirm("Delete “" + ($("f-title").value || id) + "”?\n\nA built-in series reverts to the version in Study Pal's code rather than vanishing.")) return;
  try {
    await guarded(() =>
      api("/sp/series?id=" + encodeURIComponent(id), { method: "DELETE" }));
    toast("Deleted");
    backToList();
  } catch (err) { toast(err.message, true); }
});

function backToList() {
  $("editor").hidden = true;
  $("list").hidden = false;
  $("back").hidden = true;
  $("new").hidden = false;
  $("where").textContent = "Study Pal";
  current = null;
  loadList();
}
$("back").addEventListener("click", backToList);

$("new").addEventListener("click", () => openEditor({
  id: "", title: "", zh: "", lang: "zh", cat: "", blurb: "", cast: "",
  cover: false, published: false, planned: 12, episodes: blankBeats(12),
}));

function showCoverPath() {
  const id = $("f-id").value.trim() || "<id>";
  $("cover-where").textContent = "public/series/" + id + "/cover.jpg";
}
$("f-id").addEventListener("input", showCoverPath);

if (EMBEDDED) {
  // Already inside Sage — a link back to it would reload this page into
  // itself, which is the sort of thing that only reads as broken.
  $("to-sage").hidden = true;
  document.querySelector(".wrap").style.padding = ".9rem 1rem 3rem";
}

/** Whether this seat may film. Asked once; the button is redrawn with the
 *  beats, so a slow answer only means the first draw has it hidden. */
async function askSeat() {
  try {
    const res = await fetch("/api/seat");
    if (!res.ok) return;
    canVideo = Boolean((await res.json()).video);
    if (canVideo && !$("beats").hidden) drawBeats();
  } catch { /* no button, which is the safe direction */ }
}

wireCover();
askSeat();
loadList();
</script>
