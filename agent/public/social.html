<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Social</title>
<!--
  Who this project shares its work with, and what has gone to them.

  Same constraints as every other page here: one file, no web fonts, no CDN,
  no build step. It is shown inside the stage as often as it is opened on its
  own, so the layout has to work at 24rem and at 70rem without a rail eating
  a third of the narrow case.

  What is real: people, their codes, the links, what was sent, and whether it
  was passed on. What is not: arrivals. Study Pal does not keep the ?via= code
  a visitor lands with, so nothing on this box can know — and the page says
  "not measured" rather than nought, because those are opposite facts.
-->
<style>
  :root{
    --bg:#eef0f4; --card:#fcfcfd; --sunk:#f2f4f8; --ink:#151b28; --ink-2:#4e5968;
    --muted:#8a939f; --rule:#e3e6ec;
    --shadow:0 1px 2px rgba(20,26,40,.04),0 6px 18px rgba(20,26,40,.05);
    --blue:#3f68d8; --blue-soft:#e8ecf7;
    --green:#2a9d63; --red:#d4485c; --amber:#d99038; --violet:#7268c4;
    --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,
           "Helvetica Neue",Arial,"PingFang SC","Microsoft YaHei",sans-serif;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  @media (prefers-color-scheme:dark){:root:not([data-theme=light]){
    --bg:#0b0e15; --card:#141924; --sunk:#1b212d; --ink:#e9edf5; --ink-2:#a3b0c4;
    --muted:#6f7d92; --rule:#232b39;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.32);
    --blue:#5c8dff; --blue-soft:#18233d;
  }}
  *{box-sizing:border-box}
  [hidden]{display:none !important}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);
    font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;
    padding:clamp(.9rem,2.5vw,1.8rem) clamp(.8rem,2.5vw,1.8rem) 4rem}
  main{max-width:62rem;margin:0 auto;display:flex;flex-direction:column;gap:1.05rem}
  .card{background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:1.05rem 1.15rem}
  h2{margin:0 0 .85rem;font-size:.68rem;font-weight:700;letter-spacing:.13em;
     text-transform:uppercase;color:var(--muted)}
  button{font:inherit}

  header{display:flex;align-items:center;gap:.8rem;flex-wrap:wrap}
  .ava{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;flex:none;
    font-size:1rem;font-weight:800;color:#fff;
    background:linear-gradient(140deg,var(--blue),var(--violet))}
  header h1{margin:0;font-size:1.1rem;font-weight:700;letter-spacing:-.01em}
  header p{margin:.05rem 0 0;font-size:.8rem;color:var(--muted)}
  .tabs{display:flex;gap:.35rem;margin-left:auto;flex-wrap:wrap}
  .tab{font-size:.82rem;font-weight:600;padding:.35rem .85rem;border-radius:99px;cursor:pointer;
    background:var(--card);border:1px solid var(--rule);color:var(--ink-2)}
  .tab[aria-selected=true]{background:var(--blue);border-color:var(--blue);color:#fff}

  .tone-green{--tone:var(--green)} .tone-red{--tone:var(--red)}
  .tone-amber{--tone:var(--amber)} .tone-violet{--tone:var(--violet)}
  .tone-blue{--tone:var(--blue)}

  /* ---- compose ---- */
  /* Shut until asked for. The form is five fields and it was the first thing on
     the page whether or not anybody was about to write anything — which pushed
     the feed and the people below the fold on the seat that opens straight
     onto this. The + is the whole of the closed state. */
  /* Two things can be made here and the + only ever offered one. They sit
     side by side rather than behind a menu: two options is not a menu, it is
     two buttons, and a menu would hide the one nobody thinks to look for. */
  .openrow{display:flex;align-items:center;gap:1rem;flex-wrap:wrap}
  .opener{display:flex;align-items:center;gap:1rem;cursor:pointer;background:none;
    border:0;padding:0;text-align:left;color:inherit;font:inherit;flex:1;min-width:14rem}
  .opener .say{display:block;font-size:1rem;font-weight:700}
  .opener .sub{display:block;font-size:.82rem;color:var(--muted)}
  .alt{display:flex;align-items:center;gap:.7rem;cursor:pointer;font:inherit;
    padding:.7rem .95rem;border-radius:14px;text-align:left;
    background:var(--sunk);border:1px solid var(--rule);color:var(--ink-2)}
  .alt:hover{border-color:var(--blue);color:var(--blue)}
  .alt .ring2{width:38px;height:38px;border-radius:50%;flex:none;display:grid;
    place-items:center;font-size:1.1rem;background:var(--card);border:1px solid var(--rule)}
  .alt .say{display:block;font-size:.92rem;font-weight:700}
  .alt .sub{display:block;font-size:.76rem;color:var(--muted)}
  /* One column. It was two while the + lived inside it; with the + moved out
     to the opener the first column had nothing in it and sized to content,
     which squeezed every field to half the panel. */
  .compose{display:block}
  .plus{width:76px;height:76px;border-radius:50%;border:0;cursor:pointer;flex:none;
    background:linear-gradient(140deg,var(--blue),#5478d8);color:#fff;font-size:2rem;font-weight:300;
    display:grid;place-items:center;box-shadow:0 6px 16px rgba(63,104,216,.24);line-height:1;
    transition:transform .18s ease}
  .opener:hover .plus{transform:scale(1.04)}
  .shut{margin-left:auto;font-size:.8rem;font-weight:600;color:var(--muted);
    background:none;border:0;cursor:pointer;padding:.3rem .5rem}
  .shut:hover{color:var(--blue)}
  .grp + .grp{margin-top:1.1rem}
  .grp > .lab{display:block;margin:0 0 .5rem;font-size:.64rem;font-weight:700;
    letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
  /* Four coloured squares with an emoji in each said nothing about what they
     were for. Bigger, and labelled: a picture of a clapperboard is not the word
     "clip" to somebody who has not been told it is. */
  .kinds{display:flex;gap:.6rem;flex-wrap:wrap}
  .kbtn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.25rem;
    width:5.4rem;padding:.7rem .4rem;border-radius:14px;cursor:pointer;
    background:var(--sunk);border:2px solid var(--rule);color:var(--ink-2)}
  .kbtn .ic{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;
    font-size:1.1rem;color:#fff}
  .kbtn .nm{font-size:.76rem;font-weight:700;letter-spacing:.01em}
  .kbtn[aria-pressed=true]{border-color:var(--blue);background:var(--blue-soft);color:var(--blue)}
  .k-clip .ic{background:var(--violet)} .k-image .ic{background:var(--amber)}
  .k-poster .ic{background:var(--red)} .k-text .ic{background:var(--green)}
  textarea,input[type=text],select{width:100%;padding:.55rem .7rem;font:inherit;font-size:.9rem;
    color:var(--ink);background:var(--sunk);border:1px solid var(--rule);border-radius:9px}
  /* The typed field survives behind the list. A destination the app has and
     has not yet reported would otherwise be unreachable, and a list that
     cannot be escaped is worse than the box it replaced. */
  #points{margin-top:.5rem}
  textarea{min-height:5rem;resize:vertical}
  .forrow{display:flex;gap:.5rem;flex-wrap:wrap}
  .pchip{display:flex;align-items:center;gap:.45rem;padding:.3rem .85rem .3rem .3rem;cursor:pointer;
    border-radius:99px;background:var(--sunk);font-size:.8rem;font-weight:600;
    border:1.5px solid transparent;color:var(--ink-2)}
  .pchip[aria-pressed=true]{border-color:var(--blue);background:var(--blue-soft);color:var(--blue)}
  .pchip i{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;
    font-size:.62rem;font-weight:800;color:#fff;font-style:normal;background:var(--tone,var(--muted))}
  /* A label carries a few words. Where those were not enough — "what it points
     at" was read as a question rather than as a field, by the person who asked
     for it — the line under it does the rest, once, instead of every reader
     guessing separately. */
  .hint{margin:.4rem 0 0;font-size:.76rem;color:var(--muted);line-height:1.5}
  /* The file. A drop target that is also a button, because half the people
     using this are on a phone where there is nothing to drop. */
  .drop{display:flex;align-items:center;gap:.9rem;padding:.8rem .9rem;cursor:pointer;
    border:2px dashed var(--rule);border-radius:12px;background:var(--sunk);width:100%;
    text-align:left;color:var(--ink-2)}
  .drop:hover,.drop.over{border-color:var(--blue);color:var(--blue)}
  .drop .big{font-size:1.5rem;line-height:1}
  .drop .say{font-size:.86rem;font-weight:600;display:block}
  .drop .sub{font-size:.75rem;color:var(--muted);display:block}
  .shot-prev{margin-top:.6rem;display:flex;gap:.8rem;align-items:flex-start}
  .shot-prev img,.shot-prev video{width:8rem;height:6rem;object-fit:cover;border-radius:10px;
    background:var(--sunk);display:block}
  .shot-prev .drop-off{font:inherit;font-size:.78rem;font-weight:600;color:var(--muted);
    background:none;border:0;cursor:pointer;padding:.2rem 0}
  .shot-prev .drop-off:hover{color:var(--red)}
  .post .media{width:100%;display:block;background:var(--sunk)}
  .post .media img,.post .media video{width:100%;display:block;max-height:22rem;object-fit:cover}
  .via{font-family:var(--mono);font-size:.75rem;color:var(--blue);background:var(--blue-soft);
    display:inline-block;padding:.4rem .75rem;border-radius:9px;word-break:break-all;
    border:0;cursor:pointer;text-align:left}
  .go{margin-top:1.1rem;font-size:.88rem;font-weight:700;padding:.55rem 1.3rem;border-radius:10px;
    border:0;cursor:pointer;background:var(--blue);color:#fff}
  .go:disabled{opacity:.45;cursor:default}

  /* ---- feed ---- */
  .masonry{columns:2;column-gap:1rem}
  @media (max-width:44rem){.masonry{columns:1}}
  @media (min-width:70rem){.masonry{columns:3}}
  .post{break-inside:avoid;margin:0 0 1rem;background:var(--card);border-radius:16px;
    box-shadow:var(--shadow);overflow:hidden}
  .shot{height:5.5rem;display:grid;place-items:center;color:#fff;font-size:1.8rem;
    background:linear-gradient(135deg,var(--tone,var(--blue)),var(--blue))}
  .post .in{padding:.8rem .9rem;display:flex;flex-direction:column;gap:.5rem}
  .byline{display:flex;align-items:center;gap:.4rem;font-size:.76rem;font-weight:600}
  .byline i{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-style:normal;
    font-size:.6rem;font-weight:800;color:#fff;background:var(--tone,var(--muted))}
  .byline span{color:var(--muted);font-weight:400}
  .cap{margin:0;font-size:.84rem;color:var(--ink-2);line-height:1.45;white-space:pre-wrap}
  .tagrow{display:flex;gap:.35rem;flex-wrap:wrap}
  .tag{font-size:.7rem;font-weight:700;padding:.18rem .5rem;border-radius:99px;
    background:var(--blue-soft);color:var(--blue)}
  .meta{padding-top:.5rem;border-top:1px solid var(--rule);display:flex;gap:.7rem;
    font-size:.73rem;color:var(--muted);align-items:center;flex-wrap:wrap}
  .meta b{color:var(--ink);font-variant-numeric:tabular-nums}
  .tick{font:inherit;font-size:.72rem;font-weight:700;padding:.15rem .55rem;border-radius:99px;
    cursor:pointer;border:1px solid var(--rule);background:var(--card);color:var(--muted)}
  .tick[aria-pressed=true]{background:rgba(42,157,99,.13);border-color:var(--green);color:var(--green)}
  .del{margin-left:auto;border:0;background:none;color:var(--muted);cursor:pointer;font-size:.73rem}
  .del:hover{color:var(--red)}

  /* ---- people ---- */
  .searchbar{display:flex;gap:.55rem;align-items:center;background:var(--card);
    border:1px solid var(--rule);border-radius:11px;padding:.5rem .75rem;box-shadow:var(--shadow)}
  .searchbar input{flex:1;border:0;background:none;font-size:.9rem;padding:0;outline:none}
  .people{display:grid;grid-template-columns:repeat(auto-fill,minmax(14.5rem,1fr));gap:.9rem;margin-top:.9rem}
  .mate{background:var(--card);border-radius:15px;box-shadow:var(--shadow);padding:.9rem 1rem;
    border:1.5px solid transparent;cursor:pointer}
  .mate:hover{border-color:var(--blue)}
  .mate[aria-expanded=true]{border-color:var(--blue);background:var(--blue-soft)}
  .mate .hd{display:flex;align-items:center;gap:.6rem}
  .mate .hd i{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;flex:none;
    font-style:normal;font-size:.85rem;font-weight:800;color:#fff;background:var(--tone,var(--muted))}
  .mate h3{margin:0;font-size:.92rem;font-weight:700}
  .mate .ch{font-size:.72rem;color:var(--muted)}
  .flow{display:flex;align-items:center;gap:.35rem;margin:.8rem 0 0}
  .flow .st{flex:1;text-align:center}
  .flow .st b{display:block;font-size:1rem;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
  .flow .st b.dim{color:var(--muted);font-weight:600}
  .flow .st span{font-size:.55rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
  .flow .ar{color:var(--muted);font-size:.75rem}
  .code{margin-top:.6rem;font-family:var(--mono);font-size:.7rem;color:var(--blue)}
  .none{color:var(--muted);font-size:.86rem;padding:1.2rem 0;text-align:center}
  /* The catalogue, as it is on the other side. Read here and edited there:
     one writer for one shelf, or two surfaces eventually disagree about what
     is published. */
  .series{background:var(--card);border-radius:15px;box-shadow:var(--shadow);
    padding:.9rem 1rem;margin-top:.9rem}
  .series .hd{display:flex;align-items:baseline;gap:.6rem;flex-wrap:wrap}
  .series h3{margin:0;font-size:.98rem;font-weight:700}
  .series .st{font-size:.7rem;font-weight:700;padding:.15rem .55rem;border-radius:99px}
  .series .st.live{background:rgba(42,157,99,.12);color:var(--green)}
  .series .st.draft{background:var(--sunk);color:var(--muted)}
  .series .meta{margin-left:auto;font-size:.74rem;color:var(--muted);
    font-variant-numeric:tabular-nums}
  .eps{margin:.7rem 0 0;display:flex;flex-direction:column}
  .ep{display:grid;grid-template-columns:2.6rem 1fr auto;gap:.7rem;align-items:baseline;
    padding:.4rem 0;border-top:1px solid var(--rule);font-size:.85rem}
  .ep .n{font-family:var(--mono);font-size:.76rem;color:var(--muted)}
  .ep .ti{font-weight:600}
  .ep .bt{color:var(--muted);font-size:.78rem}
  .ep .use{font-family:var(--mono);font-size:.74rem;color:var(--blue);cursor:pointer;
    background:none;border:0;white-space:nowrap}
  .ep .use:hover{text-decoration:underline}

  .thin{margin:.9rem 0 0;padding:.1rem 0 .1rem 1rem;border-left:2px solid var(--rule);
    font-size:.8rem;color:var(--ink-2);line-height:1.6}
  .thin code{font-family:var(--mono);font-size:.88em}
  .err{background:rgba(212,72,92,.1);border-left:3px solid var(--red);border-radius:0 9px 9px 0;
    padding:.7rem .9rem;font-size:.84rem;margin:0 0 1rem}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:.6rem}
  @media (max-width:34rem){.row2{grid-template-columns:1fr}}
  .add{border:1px dashed var(--rule);background:none;border-radius:15px;padding:.9rem;
    color:var(--muted);font-size:.85rem;font-weight:600;cursor:pointer;width:100%}
  .add:hover{border-color:var(--blue);color:var(--blue)}
</style>
</head>
<body>
<main>
  <header>
    <div class="ava" id="ava">·</div>
    <div>
      <h1 id="title">Social</h1>
      <p id="sub">Loading…</p>
    </div>
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" id="t-share"  aria-selected="true">Share</button>
      <button class="tab" role="tab" id="t-feed"   aria-selected="false">Feed</button>
      <!-- People retired: the audience is the app's users, and a list of
           names kept on this box was never one of them. The tab, its view and
           its editor stay in the file rather than being torn out, because the
           other reading of this panel — outside collaborators sharing inward,
           with ?via= codes — is a real feature that may come back, and it is
           cheaper to unhide than to rebuild. -->
      <button class="tab" role="tab" id="t-people" aria-selected="false" hidden>People</button>
      <button class="tab" role="tab" id="t-content" aria-selected="false">Content</button>
      <button class="tab" role="tab" id="t-users" aria-selected="false">Users</button>
    </div>
  </header>

  <p class="err" id="err" hidden></p>

  <!-- ============ SHARE ============ -->
  <section class="card" id="v-share">
    <div class="openrow" id="openrow">
      <button class="opener" type="button" id="opener" aria-expanded="false" aria-controls="composer">
        <span class="plus" aria-hidden="true">+</span>
        <span>
          <span class="say">Make something</span>
          <span class="sub">Goes to the social feed in Study Pal</span>
        </span>
      </button>
      <!-- Also retired with the People tab: adding a name here made sense when
           the audience lived on this box. It does not now. -->
      <button class="alt" type="button" id="addhere" hidden>
        <span class="ring2" aria-hidden="true">👤</span>
        <span>
          <span class="say">Add someone</span>
          <span class="sub">Somebody who shares your work</span>
        </span>
      </button>
    </div>
    <div class="compose" id="composer" hidden>
      <div style="display:flex;align-items:center;margin-bottom:.9rem">
        <h2 style="margin:0">Make something</h2>
        <button class="shut" type="button" id="shut">Close</button>
      </div>
      <div>
        <div class="grp">
          <span class="lab">What it is</span>
          <div class="kinds" id="kinds"></div>
        </div>
        <div class="grp">
          <span class="lab">The file</span>
          <button class="drop" type="button" id="drop">
            <span class="big" aria-hidden="true">⬆</span>
            <span>
              <span class="say">Choose an image or a video</span>
              <span class="sub">Or drag one here. Up to 25 MB.</span>
            </span>
          </button>
          <input type="file" id="file" hidden
                 accept="image/jpeg,image/png,image/gif,image/webp,video/mp4,video/quicktime,video/webm">
          <div class="shot-prev" id="prev" hidden></div>
          <p class="hint" id="filehint"></p>
        </div>
        <div class="grp">
          <span class="lab">What it says</span>
          <textarea id="body" placeholder="Write it, or paste what you are sending."></textarea>
        </div>
        <!-- No destination field. Everything made here goes to Study Pal's
             social feed, so a menu of thirty screens and episodes was asking a
             question with one answer. Hidden rather than deleted: the selector
             is built from the app's real catalogue and would be the right
             control again the day anything here can go somewhere else. -->
        <div class="grp" hidden>
          <span class="lab">Where it goes in the app</span>
          <select id="points-pick"></select>
          <input type="text" id="points" hidden>
          <p class="hint" id="hint-points"></p>
        </div>
        <div class="grp" id="fromgrp" hidden>
          <span class="lab">Posts to the feed as</span>
          <select id="from"></select>
          <p class="hint" id="fromhint"></p>
        </div>
        <!-- And no audience. A post on a social feed is for whoever reads the
             feed; picking one user was the last of the borrowed ideas from the
             forwarding model. The one thing that varies is the account it goes
             out from, which is the field above. -->
        <div class="grp" hidden>
          <span class="lab">Who it is for</span>
          <div class="forrow" id="forrow"></div>
        </div>
        <div class="grp" id="linkgrp" hidden>
          <span class="lab">Their link — press to copy</span>
          <button class="via" type="button" id="link"></button>
        </div>
        <button class="go" type="button" id="record" disabled>Record the share</button>
      </div>
    </div>
    <p class="thin" id="sharenote"></p>
  </section>

  <!-- ============ FEED ============ -->
  <section id="v-feed" hidden>
    <h2 id="feedhead">What has gone out</h2>
    <div class="masonry" id="feed"></div>
    <p class="none" id="feednone" hidden>Nothing recorded yet. The first share you
      record here shows up on this wall.</p>
  </section>

  <!-- ============ CONTENT ============ -->
  <section id="v-content" hidden>
    <div class="searchbar">
      <span aria-hidden="true">🔍</span>
      <input type="text" id="cq" placeholder="Search the catalogue — series or episode">
    </div>
    <div id="catalogue"></div>
    <p class="none" id="catnone" hidden></p>
    <p class="thin" id="catnote"></p>
  </section>

  <!-- ============ USERS ============ -->
  <section id="v-users" hidden>
    <div class="searchbar">
      <span aria-hidden="true">🔍</span>
      <input type="text" id="uq" placeholder="Search the app's users — name or handle">
    </div>
    <div class="people" id="users"></div>
    <p class="none" id="usersnone" hidden></p>
    <p class="thin" id="usersnote"></p>
  </section>

  <!-- ============ PEOPLE ============ -->
  <section id="v-people" hidden>
    <div class="searchbar">
      <span aria-hidden="true">🔍</span>
      <input type="text" id="q" placeholder="Find someone — by name, channel or code">
    </div>
    <div class="people" id="people"></div>
    <p class="none" id="peoplenone" hidden>Nobody matches that.</p>
    <div style="margin-top:.9rem"><button class="add" type="button" id="addperson">+ Add someone</button></div>
    <p class="thin" id="peoplenote"></p>
  </section>
</main>

<script>
const $ = (id) => document.getElementById(id);
const el = (t, c, x) => { const n = document.createElement(t); if (c) n.className = c;
  if (x !== undefined) n.textContent = x; return n; };

// The project is in the query string, because this page is opened from the
// stage against whichever project is selected — not from a global setting.
const PROJECT = new URLSearchParams(location.search).get("project") || "";

// Labels rather than titles: a tooltip is not a label on a touchscreen, and
// this panel is read on a phone as often as not.
const KINDS = [["clip","🎬","Clip"],["image","🖼","Image"],
               ["poster","📄","Poster"],["text","📝","Words"]];
const TONES = ["green","red","amber","violet","blue"];

let state = { people: [], posts: [], base: "", arrivals: null, counter: false,
              sameApp: false, destinations: { episodes: [], screens: [] } };
// The one option that is not a destination: it opens the typed field instead.
//
// A plain string, and deliberately. The first version used a NUL character on
// the reasoning that no screen could ever be named one — but an option value
// goes through the DOM, and the browser rewrites a NUL to a replacement
// character, so the value read back never equalled the constant and the typed
// field could not be opened at all. A sentinel has to survive the round trip
// before it has to be unlikely; anything arriving from the app that happens to
// match it is dropped below.
const OTHER = "__somewhere_else__";
let kind = "clip", forCode = "", tab = "share", query = "", opened = "";
// The uploaded file for the share being written: { id, type }. Uploaded when
// chosen rather than when recorded, so a slow upload happens while somebody is
// still typing rather than after they have pressed the button.
let media = null;
// Which of the app's accounts the share goes out as. Empty until Study Pal
// serves a user list; the field hides itself rather than offering a menu of
// nothing.
let fromId = "";

function fail(msg) { const e = $("err"); e.hidden = !msg; e.textContent = msg || ""; }

async function load() {
  if (!PROJECT) return fail("No project. Open this from a project in the workspace.");
  try {
    const r = await fetch("/api/social?project=" + encodeURIComponent(PROJECT));
    const d = await r.json();
    if (!r.ok) return fail(d.error || "Could not load it.");
    state = { ...state, ...d };
    fail("");
    draw();
  } catch (e) { fail("Could not reach the server: " + e.message); }
}

async function save() {
  try {
    const r = await fetch("/api/social?project=" + encodeURIComponent(PROJECT), {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ people: state.people, posts: state.posts }),
    });
    const d = await r.json();
    if (!r.ok) return fail(d.error || "Could not save it.");
    state.people = d.people; state.posts = d.posts;
    fail("");
    draw();
  } catch (e) { fail("Could not save: " + e.message); }
}

const person = (code) => state.people.find((p) => p.code === code) || null;

/** Sent and passed-on, counted off the posts rather than stored beside them:
 *  two counters kept in step drift the first time one of them throws. */
function tally(code) {
  let sent = 0, passed = 0;
  for (const s of state.posts) if (s.to === code) { sent += 1; if (s.passedOn) passed += 1; }
  return { sent, passed };
}

/** Arrivals for a code, or null when nothing measures them. Null and nought
 *  are opposite facts and render differently everywhere below. */
const arrivedFor = (code) => (state.arrivals ? (state.arrivals[code] || 0) : null);

function linkFor(code, points) {
  const root = (state.base || "").replace(/\/+$/, "");
  if (!root || !code) return "";
  const q = new URLSearchParams({ via: code });
  if (points) q.set("to", points.trim().slice(0, 60));
  return root + "/?" + q;
}

// ---- share ----------------------------------------------------------------
function drawKinds() {
  const box = $("kinds"); box.replaceChildren();
  for (const [id, icon, label] of KINDS) {
    const b = el("button", "kbtn k-" + id);
    b.type = "button";
    b.setAttribute("aria-pressed", String(kind === id));
    b.append(el("span", "ic", icon), el("span", "nm", label));
    b.addEventListener("click", () => { kind = id; drawKinds(); });
    box.append(b);
  }
}

/** Who inside the app this is for.
 *
 *  The app's own users, not a list kept here. That distinction is the whole
 *  shape of this panel: content is made here and goes to people using Study
 *  Pal, and a name that only exists on this box could never be one of them.
 *
 *  "Everyone" is always offered and is the ordinary case — most content is for
 *  the audience rather than for one person. It is also what keeps the form
 *  usable while the app serves no user list at all. */
function drawFor() {
  const box = $("forrow"); box.replaceChildren();
  const list = Array.isArray(users) ? users : [];

  const everyone = el("button", "pchip");
  everyone.type = "button";
  everyone.setAttribute("aria-pressed", String(forCode === ""));
  everyone.append(el("i", null, "∀"), document.createTextNode("Everyone"));
  everyone.addEventListener("click", () => { forCode = ""; drawShare(); });
  box.append(everyone);

  for (const u of list) {
    const name = u.name || u.handle || u.id || "unknown";
    const b = el("button", "pchip tone-blue");
    b.type = "button";
    b.setAttribute("aria-pressed", String(forCode === u.id));
    b.append(el("i", null, String(name).slice(0, 1).toUpperCase()), document.createTextNode(name));
    b.addEventListener("click", () => { forCode = forCode === u.id ? "" : u.id; drawShare(); });
    box.append(b);
  }

  if (!list.length) {
    // Said once, where somebody would otherwise wonder where the users are.
    box.append(el("span", "none",
      users === null ? "Reading the app's users…" : "The app serves no user list yet."));
  }
}

/** The list of places a share can land, built from what the app actually has.
 *
 *  Rebuilt on every draw rather than once, because the selection has to survive
 *  it: somebody who picked episode three and then typed in the caption box must
 *  not find the destination reset underneath them. */
function drawPoints() {
  const pick = $("points-pick");
  const current = $("points").value.trim();
  const d = state.destinations || { episodes: [], screens: [] };
  pick.replaceChildren();

  const opt = (value, label) => {
    const o = document.createElement("option");
    o.value = value; o.textContent = label;
    return o;
  };
  const group = (label, rows) => {
    if (!rows.length) return null;
    const g = document.createElement("optgroup");
    g.label = label;
    for (const r of rows) g.append(opt(r.value, r.label));
    return g;
  };

  // The app's own names, minus anything colliding with the sentinel: two
  // options with one value is a list where picking one selects the other.
  const real = (rows) => (rows || []).filter((r) => r && r.value !== OTHER);

  pick.append(opt("", "The home screen"));
  const eps = group("Episodes", real(d.episodes));
  if (eps) pick.append(eps);
  const scr = group("Screens and features", real(d.screens));
  if (scr) pick.append(scr);
  pick.append(opt(OTHER, "Somewhere else…"));

  // A value typed before the list existed, or one the app has stopped
  // reporting, still has to show as chosen rather than silently becoming the
  // home screen — which would change where a share lands without saying so.
  const known = [...pick.querySelectorAll("option")].some((o) => o.value === current);
  if (current && !known) {
    pick.value = OTHER;
    $("points").hidden = false;
  } else {
    pick.value = current;
    $("points").hidden = pick.value !== OTHER;
  }

  // Nothing to choose between: one option is a menu with a single item, which
  // is a worse way of saying "the home screen" than the sentence below it.
  const empty = !real(d.episodes).length && !real(d.screens).length;
  pick.hidden = empty;
  if (empty) $("points").hidden = false;

  // Placement, not navigation. The field was written as "which screen the link
  // opens", which is the same value described from the wrong end: everything
  // made here is going to the app, so the question is which part of it this
  // belongs to, not where a visitor is steered afterwards.
  $("hint-points").innerHTML = empty
    ? "Which part of the app this belongs to &mdash; an episode, or a screen. "
      + "Nothing is reporting the app's parts yet, so type it: <b>ep 3</b> for "
      + "the third episode. Leave it blank for the app in general."
    : "Which part of the app this belongs to. Leave it on the home screen if it "
      + "is about the app in general rather than one episode or feature.";
}

/** The account a share is published under, from the app's own user list.
 *
 *  Not the same as the person it is addressed to, and not the same as the seat
 *  that recorded it. Three names get confused the moment two people share one
 *  panel, so each has its own field and its own word for what it means. */
function drawFrom() {
  const grp = $("fromgrp");
  const pick = $("from");
  const list = Array.isArray(users) ? users : [];
  // The only thing that varies about a post now, so it is always shown — even
  // with nothing to choose yet, because an absent field would leave the form
  // looking like it has no author at all rather than one it cannot name.
  grp.hidden = false;
  if (!list.length) {
    pick.replaceChildren();
    const only = document.createElement("option");
    only.value = ""; only.textContent = "No account yet";
    pick.append(only);
    pick.disabled = true;
    $("fromhint").innerHTML = "The account this posts from is the one thing that varies, "
      + "and Study Pal serves no user list yet. See <code>docs/for-studypal-users.md</code>.";
    return;
  }
  pick.disabled = false;

  pick.replaceChildren();
  const blank = document.createElement("option");
  blank.value = ""; blank.textContent = "No account — just recorded here";
  pick.append(blank);
  for (const u of list) {
    const o = document.createElement("option");
    o.value = u.id || "";
    o.textContent = u.name || u.handle || u.id || "unknown";
    pick.append(o);
  }
  pick.value = list.some((u) => u.id === fromId) ? fromId : "";
  fromId = pick.value;
  $("fromhint").textContent = pick.value
    ? "The feed shows this account as the author."
    : "Pick the account this posts from.";
}

$("from").addEventListener("change", () => { fromId = $("from").value; drawFrom(); });

function drawShare() {
  drawKinds(); drawFor(); drawPoints(); drawFrom();
  // No share link. It carried a ?via= code for somebody outside forwarding it
  // inward; the audience here is inside the app already, and a user id in that
  // position would be an address that means nothing to anyone.
  $("linkgrp").hidden = true;
  $("record").disabled = !$("body").value.trim() && !media;
  // Said plainly, because the gap between what this does and what it looks
  // like it does is the whole risk of the panel: it writes things down, and
  // nothing has reached the app.
  // One destination and one variable, said where somebody is about to use it.
  $("sharenote").innerHTML = "<b>One destination, one constraint.</b> Everything here "
    + "goes to Study Pal's social feed; the only choice is the account it posts from. "
    + "Recorded on this box for now \u2014 Study Pal has no way to receive a post yet, "
    + "and when it does, what is on this form is what gets sent.";
}

// ---- the file -------------------------------------------------------------
const MEDIA_MAX = 25 * 1024 * 1024;

function drawPrev() {
  const box = $("prev");
  box.replaceChildren();
  box.hidden = !media;
  $("drop").hidden = Boolean(media);
  if (!media) return;
  const url = "/api/social/media/" + media.id + "?project=" + encodeURIComponent(PROJECT);
  const el2 = media.type.startsWith("video/")
    ? Object.assign(document.createElement("video"), { src: url, muted: true, controls: true })
    : Object.assign(document.createElement("img"), { src: url, alt: "" });
  const off = el("button", "drop-off", "Remove");
  off.type = "button";
  off.addEventListener("click", () => { media = null; drawPrev(); });
  box.append(el2, off);
}

async function upload(file) {
  if (!file) return;
  if (file.size > MEDIA_MAX) {
    return fail("That file is " + Math.round(file.size / 1048576) + " MB. The limit is 25 MB.");
  }
  $("filehint").textContent = "Uploading…";
  try {
    // Read as base64 rather than posted as a form: the server takes JSON
    // everywhere else and one body shape is one thing to get wrong.
    const data = await new Promise((ok, no) => {
      const r = new FileReader();
      r.onload = () => ok(String(r.result).split(",")[1] || "");
      r.onerror = () => no(new Error("could not read the file"));
      r.readAsDataURL(file);
    });
    const r = await fetch("/api/social/media?project=" + encodeURIComponent(PROJECT), {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ type: file.type, data }),
    });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || "upload failed");
    media = { id: d.id, type: d.type };
    // The kind follows the file rather than being asked for twice.
    kind = d.type.startsWith("video/") ? "clip" : "image";
    fail("");
    $("filehint").textContent = "";
    drawKinds();
    drawPrev();
  } catch (e) {
    $("filehint").textContent = "";
    fail(e.message);
  }
}

$("drop").addEventListener("click", () => $("file").click());
$("file").addEventListener("change", (e) => upload(e.target.files?.[0]));
for (const ev of ["dragenter", "dragover"]) {
  $("drop").addEventListener(ev, (e) => { e.preventDefault(); $("drop").classList.add("over"); });
}
for (const ev of ["dragleave", "drop"]) {
  $("drop").addEventListener(ev, (e) => { e.preventDefault(); $("drop").classList.remove("over"); });
}
$("drop").addEventListener("drop", (e) => upload(e.dataTransfer?.files?.[0]));

$("record").addEventListener("click", () => {
  const body = $("body").value.trim();
  if (!body && !media) return;
  state.posts.unshift({
    id: String(Date.now()) + Math.random().toString(36).slice(2, 7),
    body, kind, to: forCode, points: $("points").value.trim(),
    media: media ? media.id : "",
    // No audience: a feed post is for the feed. The field stays in the stored
    // shape so older records still read, and nothing new writes it.
    to: "",
    toName: "",
    // Both names again, for the account it goes out as.
    fromId,
    fromName: (Array.isArray(users) ? users : []).find((u) => u.id === fromId)?.name || "",
    passedOn: false, at: new Date().toISOString().slice(0, 10),
  });
  $("body").value = ""; $("points").value = "";
  media = null; drawPrev();
  // Shut afterwards: the share is recorded and the wall below is where the
  // answer to "did that work" lives.
  openCompose(false);
  save();
});
// Open and shut. The + used to double as the save button, which made the
// biggest thing on the panel do the least obvious of the two things it could.
function openCompose(on) {
  $("composer").hidden = !on;
  // The whole row, not just the +: leaving "Add someone" beside an open form
  // offers a second thing to start before the first is finished.
  $("openrow").hidden = on;
  $("opener").setAttribute("aria-expanded", String(on));
  if (on) $("body").focus();
}
$("opener").addEventListener("click", () => openCompose(true));
$("shut").addEventListener("click", () => openCompose(false));
$("body").addEventListener("input", () => {
  $("record").disabled = !$("body").value.trim() && !media;
});
$("points").addEventListener("input", () => {
  // The link redraws, but not the list — rebuilding it mid-keystroke would
  // steal focus back to the select on every character.
  // The link is gone with the forwarding model; only the button state still
  // depends on what has been typed.
  $("record").disabled = !$("body").value.trim() && !media;
});
$("points-pick").addEventListener("change", () => {
  const v = $("points-pick").value;
  if (v === OTHER) {
    $("points").hidden = false;
    $("points").value = "";
    $("points").focus();
  } else {
    $("points").hidden = true;
    $("points").value = v;
  }
  drawShare();
});
$("link").addEventListener("click", async () => {
  try { await navigator.clipboard.writeText($("link").textContent); $("link").textContent += "  ✓"; }
  catch { /* a browser that refuses the clipboard still shows the text to select */ }
  setTimeout(drawShare, 900);
});

// ---- feed -----------------------------------------------------------------
function drawFeed() {
  const box = $("feed"); box.replaceChildren();
  $("feednone").hidden = state.posts.length > 0;
  $("feedhead").textContent = state.posts.length
    ? "What has gone out · " + state.posts.length : "What has gone out";
  for (const s of state.posts) {
    // The audience, as recorded. Read from the share itself rather than looked
    // up: the name was stored precisely so the row still reads after the
    // account is gone from the app.
    const who = s.toName ? { name: s.toName, tone: "blue" } : null;
    const icon = (KINDS.find((k) => k[0] === s.kind) || KINDS[3])[1];
    const a = el("article", "post " + (who ? "tone-" + who.tone : "tone-blue"));
    // The thing itself where there is one, and the coloured block only where
    // there is not: a wall of identical gradients is a filing system, and a
    // wall of the actual clips is a library.
    let shot;
    if (s.media) {
      shot = el("div", "media");
      const url = "/api/social/media/" + s.media + "?project=" + encodeURIComponent(PROJECT);
      shot.append(/\.(mp4|mov|webm)$/.test(s.media)
        ? Object.assign(document.createElement("video"), { src: url, controls: true, preload: "metadata" })
        : Object.assign(document.createElement("img"), { src: url, alt: "", loading: "lazy" }));
    } else {
      shot = el("div", "shot", icon);
    }
    const inn = el("div", "in");
    const by = el("div", "byline");
    // Two names, and they are different questions: who it went to, and who
    // sent it. One seat made both obvious; two seats made neither.
    by.append(el("i", null, (who ? who.name : "∀").slice(0, 1).toUpperCase()),
      document.createTextNode(who ? who.name : "Everyone"),
      el("span", null, " · " + (s.at || "undated")
        + (s.fromName ? " · as " + s.fromName : "")
        + (s.by ? " · by " + s.by : "")));
    inn.append(by, el("p", "cap", s.body));
    if (s.points) { const t = el("div", "tagrow"); t.append(el("span", "tag", s.points)); inn.append(t); }

    const meta = el("div", "meta");
    const arrived = arrivedFor(s.to);
    // No "passed on" tick and no arrivals figure: both belonged to the reading
    // where somebody outside forwarded a link. Content that goes to a user
    // inside the app is either delivered or it is not, and that is the app's
    // answer to give, not something to tick here.
    meta.append(el("span", null, "recorded here — not yet delivered to the app"));
    const del = el("button", "del", "Remove");
    del.type = "button";
    del.addEventListener("click", () => {
      state.posts = state.posts.filter((x) => x.id !== s.id); save();
    });
    meta.append(del);
    inn.append(meta);
    a.append(shot, inn);
    box.append(a);
  }
}

// ---- people ---------------------------------------------------------------
function drawPeople() {
  const box = $("people"); box.replaceChildren();
  const q = query.toLowerCase();
  const list = state.people.filter((p) => !q
    || p.name.toLowerCase().includes(q) || p.channel.toLowerCase().includes(q) || p.code.includes(q));
  $("peoplenone").hidden = list.length > 0 || !state.people.length;

  for (const p of list) {
    const t = tally(p.code);
    const arrived = arrivedFor(p.code);
    const d = el("div", "mate tone-" + p.tone);
    d.setAttribute("aria-expanded", String(opened === p.code));
    const hd = el("div", "hd");
    hd.append(el("i", null, p.name.slice(0, 1).toUpperCase()));
    const nm = el("div");
    nm.append(el("h3", null, p.name), el("div", "ch", p.channel || "no channel noted"));
    hd.append(nm);
    d.append(hd);

    const flow = el("div", "flow");
    const step = (n, label, dim) => {
      const s = el("div", "st");
      const b = el("b", dim ? "dim" : null, n);
      s.append(b, el("span", null, label));
      return s;
    };
    flow.append(step(t.sent, "sent"), el("span", "ar", "→"),
      step(t.passed, "passed on"), el("span", "ar", "→"),
      step(arrived === null ? "—" : arrived, "arrived", arrived === null));
    d.append(flow, el("div", "code", "?via=" + p.code));

    if (opened === p.code) {
      const note = el("p", "thin");
      // Three different silences, and they need three different people to act.
      note.innerHTML = arrived !== null
        ? "<b>" + arrived + " arrived through this code.</b> Passed-on is something you tick "
          + "when you see it happen — no API reports a forward."
        : state.counter
          ? "<b>Arrivals are not measured yet.</b> Study Pal does not keep the "
            + "<code>?via=</code> code a visitor arrives with, so nothing on this box can "
            + "know. The dash is not a nought — see <code>docs/for-studypal-via.md</code>."
          : "<b>This seat cannot reach the counter.</b> Everything else here is recorded "
            + "locally and works; arrivals need the counter's address, which is granted "
            + "seat by seat.";
      d.append(note);
      const row = el("div", "row2");
      const rename = el("button", "add", "Rename or edit");
      rename.type = "button";
      rename.addEventListener("click", (e) => { e.stopPropagation(); editPerson(p); });
      const drop = el("button", "add", "Remove");
      drop.type = "button";
      drop.addEventListener("click", (e) => {
        e.stopPropagation();
        const t2 = tally(p.code);
        const warn = t2.sent
          ? `${p.name} has ${t2.sent} share${t2.sent === 1 ? "" : "s"} recorded. Those stay on the `
            + `wall and keep the code, because the links are already out there. Remove them?`
          : `Remove ${p.name}?`;
        if (!confirm(warn)) return;
        state.people = state.people.filter((x) => x.code !== p.code);
        opened = "";
        save();
      });
      row.append(rename, drop);
      d.append(row);
    }
    d.addEventListener("click", () => { opened = opened === p.code ? "" : p.code; drawPeople(); });
    box.append(d);
  }

  $("peoplenote").innerHTML = "<b>Sent → passed on → arrived.</b> Only the last one is out "
    + "of your hands, and it is the one that says whether any of this worked. Passed-on is "
    + "an observation you record rather than a measurement: nothing reports a WeChat forward, "
    + "and a figure that looks automatic and is not would be worse than ticking a box.";
}

function editPerson(existing) {
  const name = prompt("Their name", existing ? existing.name : "");
  if (name === null || !name.trim()) return;
  const suggested = existing ? existing.code
    : name.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 32);
  const code = prompt(
    "Their code. It goes in every link they share, so keep it short and never change it "
    + "once links are out.\n\nLetters, digits and hyphens only.", suggested);
  if (code === null) return;
  if (!/^[a-z0-9][a-z0-9-]{0,31}$/.test(code)) {
    return fail('"' + code + '" is not a usable code — lowercase letters, digits and hyphens.');
  }
  if (state.people.some((p) => p.code === code && p !== existing)) {
    return fail("Somebody already has the code " + code + ".");
  }
  const channel = prompt("Where do they share? (WeChat, 小红书, print…)",
    existing ? existing.channel : "") ?? "";
  if (existing) {
    // The code changing means every link already sent stops matching. Said
    // plainly rather than prevented: it is occasionally the right thing to do.
    if (existing.code !== code && tally(existing.code).sent
        && !confirm("Changing the code breaks every link already sent under the old one. Continue?")) return;
    const wasCode = existing.code;
    Object.assign(existing, { name: name.trim(), code, channel: channel.trim() });
    for (const s of state.posts) if (s.to === wasCode) s.to = code;
  } else {
    state.people.push({
      code, name: name.trim(), channel: channel.trim(), note: "",
      tone: TONES[state.people.length % TONES.length],
      addedAt: new Date().toISOString().slice(0, 10),
    });
  }
  save();
}
$("addperson").addEventListener("click", () => editPerson(null));
// The same action from the Share tab, where somebody notices they have nobody
// to address a share to. It lands them on People afterwards, because that is
// where the person they just made now lives.
$("addhere").addEventListener("click", () => { show("people"); editPerson(null); });
$("q").addEventListener("input", (e) => { query = e.target.value.trim(); drawPeople(); });

// ---- tabs -----------------------------------------------------------------
const TABS = { share: "v-share", feed: "v-feed", people: "v-people",
               content: "v-content", users: "v-users" };
function show(name) {
  tab = TABS[name] ? name : "share";
  for (const [k, id] of Object.entries(TABS)) $(id).hidden = k !== tab;
  for (const k of Object.keys(TABS)) $("t-" + k).setAttribute("aria-selected", String(k === tab));
}
for (const k of Object.keys(TABS)) $("t-" + k).addEventListener("click", () => {
  show(k);
  // Read once, when first asked for. The catalogue is another service's and
  // fetching it on every tab press would put this panel's browsing habits on
  // somebody else's request log.
  if (k === "content" && catalogue === null) loadCatalogue();
  if (k === "users" && users === null) loadUsers();
});

// Read once at startup rather than only when the Users tab is opened: the
// "posts as" field is on the Share tab, and a field that appears only after
// somebody happens to visit another tab is a field nobody finds.
loadUsers().then(drawFrom).catch(() => {});

// ---------------------------------------------------------------------------
// The app's users
//
// Read from Study Pal, never stored here. An admin panel that kept its own
// copy of somebody else's user list would be a second place for it to be wrong
// and a second place for it to leak.
//
// The endpoint does not exist yet — see docs/for-studypal-users.md. Until it
// does this says so, rather than rendering an empty list: an app with no users
// and an app that does not report them are opposite facts and an empty grid
// states the wrong one.
// ---------------------------------------------------------------------------
let users = null, uquery = "";

async function loadUsers() {
  const note = $("usersnote");
  try {
    const r = await fetch("/sp/users");
    const d = await r.json().catch(() => ({}));
    if (r.status === 404) {
      users = [];
      note.innerHTML = "<b>The app does not serve a user list yet.</b> The panel is "
        + "built and waiting for it &mdash; the shape it expects is written up in "
        + "<code>docs/for-studypal-users.md</code>. This is a dash, not a zero: "
        + "nobody can tell an app with no users from one that does not report them.";
      drawUsers();
      return;
    }
    if (!r.ok) throw new Error(d.error || "the app said " + r.status);
    users = Array.isArray(d) ? d : Array.isArray(d?.users) ? d.users : [];
    note.innerHTML = "<b>Read from the app, never stored here.</b> A second copy of "
      + "somebody else's user list is a second place for it to be wrong and a second "
      + "place for it to leak.";
    drawUsers();
  } catch (e) {
    users = [];
    note.innerHTML = "<b>Could not read the users.</b> " + e.message;
    drawUsers();
  }
}

function drawUsers() {
  const box = $("users");
  const none = $("usersnone");
  box.replaceChildren();
  if (users === null) { none.hidden = false; none.textContent = "Reading…"; return; }

  const q = uquery.toLowerCase();
  const hit = (t) => String(t || "").toLowerCase().includes(q);
  const list = users.filter((u) => !q || hit(u.name) || hit(u.handle) || hit(u.id));
  none.hidden = list.length > 0;
  if (!list.length) {
    none.textContent = users.length ? "Nobody matches that." : "No users to show.";
    return;
  }

  for (const u of list) {
    const name = u.name || u.handle || u.id || "unknown";
    const card = el("div", "mate tone-blue");
    const hd = el("div", "hd");
    hd.append(el("i", null, String(name).slice(0, 1).toUpperCase()));
    const who = el("div");
    who.append(el("h3", null, name));
    who.append(el("div", "ch", [u.handle, u.id].filter(Boolean).join(" · ") || ""));
    hd.append(who);
    card.append(hd);

    // Whatever the app chose to send, and nothing invented to fill a gap.
    const flow = el("div", "flow");
    const cell = (v, k) => { const c = el("div", "st");
      c.append(el("b", v === undefined || v === null ? "dim" : null,
        v === undefined || v === null ? "—" : String(v)), el("span", null, k));
      return c; };
    flow.append(cell(u.sessions, "sessions"), cell(u.joined, "joined"), cell(u.lastSeen, "last seen"));
    card.append(flow);
    if (u.note) card.append(el("div", "code", String(u.note).slice(0, 120)));
    box.append(card);
  }
}

$("uq").addEventListener("input", (e) => { uquery = e.target.value.trim(); drawUsers(); });

// ---------------------------------------------------------------------------
// The catalogue, read from the app rather than kept here
//
// What the other repository has actually published: series, their episodes,
// and whether each is live. Read-only on purpose — the story desk is where a
// series is written and published, and two surfaces writing one shelf is how
// they end up disagreeing about what is on it. This one answers "what is
// there", which is the question an admin asks far more often than "change it".
// ---------------------------------------------------------------------------
let catalogue = null, cquery = "";

async function loadCatalogue() {
  const note = $("catnote");
  try {
    const r = await fetch("/sp/series");
    if (r.status === 404) {
      catalogue = [];
      note.innerHTML = "<b>Not on this seat.</b> Reading the catalogue needs the story-desk "
        + "grant, which this seat has not been given.";
      drawCatalogue();
      return;
    }
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || "the app said " + r.status);
    // The payload's shape is the other side's to choose — take the array
    // wherever it is, the same reading the story desk uses.
    catalogue = Array.isArray(d) ? d
      : Array.isArray(d?.series) ? d.series
      : Array.isArray(d?.items) ? d.items : [];
    note.innerHTML = "<b>Read from the app, not from here.</b> This is what Study Pal "
      + "has published. Writing a series is the story desk's job — one writer for one "
      + "shelf, or the two eventually disagree about what is live.";
    drawCatalogue();
  } catch (e) {
    catalogue = [];
    note.innerHTML = "<b>Could not read the catalogue.</b> " + e.message;
    drawCatalogue();
  }
}

function drawCatalogue() {
  const box = $("catalogue");
  const none = $("catnone");
  box.replaceChildren();
  if (catalogue === null) { none.hidden = false; none.textContent = "Reading the catalogue…"; return; }

  const q = cquery.toLowerCase();
  const hit = (t) => String(t || "").toLowerCase().includes(q);
  const list = catalogue.filter((se) => !q
    || hit(se.title) || hit(se.id)
    || (Array.isArray(se.episodes) && se.episodes.some((e) => hit(e.title) || hit(e.beat))));

  none.hidden = list.length > 0;
  if (!list.length) {
    none.textContent = catalogue.length
      ? "Nothing in the catalogue matches that."
      : "The catalogue is empty, or this seat cannot read it.";
    return;
  }

  for (const se of list) {
    const eps = Array.isArray(se.episodes) ? se.episodes : [];
    // Matching on the series name shows all of it; matching on an episode
    // shows the ones that matched, since a hit buried in twelve rows is a
    // search result nobody finds.
    const seriesHit = !q || hit(se.title) || hit(se.id);
    const shown = seriesHit ? eps : eps.filter((e) => hit(e.title) || hit(e.beat));
    const written = eps.filter((e) => String(e.beat || "").trim()).length;

    const card = el("div", "series");
    const hd = el("div", "hd");
    hd.append(el("h3", null, se.title || se.id || "Untitled"));
    hd.append(el("span", "st " + (se.published ? "live" : "draft"),
      se.published ? "live" : "draft"));
    hd.append(el("span", "meta", written + " of " + eps.length + " written"));
    card.append(hd);

    const list2 = el("div", "eps");
    for (const e of shown) {
      const row = el("div", "ep");
      row.append(el("span", "n", "ep " + (e.n ?? "?")));
      const mid = el("div");
      mid.append(el("div", "ti", e.title || "(untitled)"));
      if (e.beat) mid.append(el("div", "bt", String(e.beat).slice(0, 140)));
      row.append(mid);
      // The one thing this tab does besides answer: hand an episode straight to
      // the share form, which is the reason somebody looked it up.
      const use = el("button", "use", "Share this →");
      use.type = "button";
      use.addEventListener("click", () => {
        $("points").value = "ep " + (e.n ?? "");
        openCompose(true);
        show("share");
        drawShare();
      });
      row.append(use);
      list2.append(row);
    }
    card.append(list2);
    box.append(card);
  }
}

$("cq").addEventListener("input", (e) => { cquery = e.target.value.trim(); drawCatalogue(); });

function draw() {
  // The two tabs that read the app rather than this project's own file. Drawn
  // only where they mean something: the catalogue and the users belong to the
  // app these credentials point at, and this panel opens against whichever
  // project is selected. A tab that shows another product's content under this
  // project's name is worse than an absent tab.
  for (const k of ["content", "users"]) {
    $("t-" + k).hidden = !state.sameApp;
    if (!state.sameApp && tab === k) show("share");
  }

  const n = state.people.length, s = state.posts.length;
  $("title").textContent = PROJECT || "Social";
  $("ava").textContent = (PROJECT || "?").slice(0, 2).toUpperCase();
  const u = Array.isArray(users) ? users.length : 0;
  $("sub").textContent = `${s} ${s === 1 ? "post" : "posts"} recorded`
    + (u ? ` · ${u} ${u === 1 ? "user" : "users"} in the app` : " · no user list yet");
  drawShare(); drawFeed(); drawPeople();
}

show(new URLSearchParams(location.search).get("tab") || "share");
load();
</script>
</body>
</html>
