<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Feed</title>
<meta name="color-scheme" content="light dark">
<style>
  /* The same design system as the other panel — same tokens, same header, same
     tab row, same counts strip. A second admin surface that looked like a
     different product would be a second thing to learn for no reason. */
  :root{
    --bg:#eef0f4; --card:#fcfcfd; --sunk:#f2f4f8; --ink:#151b28; --ink-2:#4e5968;
    --muted:#8a939f; --rule:#e3e6ec;
    --shadow:0 1px 2px rgba(20,26,40,.04),0 6px 18px rgba(20,26,40,.05);
    --blue:#3f68d8; --blue-soft:#e8ecf7;
    --green:#2a9d63; --red:#d4485c; --amber:#d99038; --violet:#7268c4;
    --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,
           "Helvetica Neue",Arial,"PingFang SC","Microsoft YaHei",sans-serif;
  }
  @media (prefers-color-scheme:dark){:root:not([data-theme=light]){
    --bg:#0b0e15; --card:#141924; --sunk:#1b212d; --ink:#e9edf5; --ink-2:#a3b0c4;
    --muted:#6f7d92; --rule:#232b39;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.32);
    --blue:#5c8dff; --blue-soft:#18233d;
  }}
  *{box-sizing:border-box}
  [hidden]{display:none !important}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);
    font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;
    padding:clamp(.9rem,2.5vw,1.8rem) clamp(.8rem,2.5vw,1.8rem) 5rem}
  main{max-width:62rem;margin:0 auto;display:flex;flex-direction:column;gap:1.05rem}
  button{font:inherit}

  header{display:flex;align-items:center;gap:.8rem;flex-wrap:wrap}
  .ava{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;flex:none;
    font-size:1.25rem;color:#fff;background:linear-gradient(140deg,var(--blue),var(--violet))}
  header h1{margin:0;font-size:1.1rem;font-weight:700;letter-spacing:-.01em}
  header p{margin:.05rem 0 0;font-size:.8rem;color:var(--muted)}
  .tabs{display:flex;gap:.35rem;margin-left:auto;flex-wrap:wrap}
  .tab{font-size:.82rem;font-weight:600;padding:.35rem .85rem;border-radius:99px;cursor:pointer;
    background:var(--card);border:1px solid var(--rule);color:var(--ink-2)}
  .tab[aria-selected=true]{background:var(--blue);border-color:var(--blue);color:#fff}
  /* A reported post has a clock on it in a way a new one does not. */
  .tab.urgent{border-color:var(--red);color:var(--red)}
  .tab.urgent[aria-selected=true]{background:var(--red);border-color:var(--red);color:#fff}

  .counts{display:flex;gap:1.6rem;flex-wrap:wrap;align-items:baseline;
    padding:.9rem 1.1rem;border-radius:14px;background:var(--card);
    box-shadow:var(--shadow);border:1px solid var(--rule)}
  .counts .n{display:flex;flex-direction:column;gap:.15rem}
  .counts .n b{font-size:1.5rem;font-weight:700;line-height:1;
    font-variant-numeric:tabular-nums;color:var(--ink)}
  .counts .n b.dim{color:var(--muted);font-weight:600}
  .counts .n b.task{color:var(--amber)}
  .counts .n span{font-size:.6rem;font-weight:700;letter-spacing:.11em;
    text-transform:uppercase;color:var(--muted)}
  .counts .more{margin-left:auto;align-self:center;font-size:.76rem;font-weight:700;
    cursor:pointer;color:var(--blue);background:var(--blue-soft);border:1px solid transparent;
    border-radius:99px;padding:.32rem .85rem;text-decoration:none}
  .counts .more:hover{border-color:var(--blue)}

  .post{background:var(--card);border-radius:16px;box-shadow:var(--shadow);
    padding:1rem 1.15rem;border-left:3px solid var(--tone,var(--rule))}
  .list{display:flex;flex-direction:column;gap:.85rem}
  .tone-amber{--tone:var(--amber)} .tone-red{--tone:var(--red)}
  .tone-green{--tone:var(--green)} .tone-violet{--tone:var(--violet)}
  .tone-grey{--tone:var(--muted)}
  /* The waiting pane. .who and .none are the panel's own and are reused rather
     than rivalled — a second class doing what one already does is how a
     stylesheet starts fighting itself. */
  .who .when{margin-left:auto;font-variant-numeric:tabular-nums}
  .why{margin:.45rem 0 0;line-height:1.55;word-break:break-word}
  .reach{display:inline-block;margin:.5rem 0 0;color:var(--blue);
    font-size:.86rem;word-break:break-all}
  .tags{margin:.5rem 0 0;display:flex;gap:.4rem;flex-wrap:wrap}
  .tag{padding:.1rem .5rem;border-radius:99px;background:var(--rule);
    color:var(--ink-2);font-size:.72rem;font-weight:600}
  .tag.off{background:none;border:1px solid var(--rule);color:var(--muted);
    font-weight:400}
  .rule{margin:1.1rem 0 .3rem;font-size:.7rem;letter-spacing:.12em;
    text-transform:uppercase;color:var(--muted)}
  .rule:first-child{margin-top:.2rem}
  .who{font-size:.78rem;color:var(--muted);display:flex;gap:.5rem;flex-wrap:wrap;
    align-items:center}
  .who b{font-weight:700;color:var(--ink-2)}
  .body{margin:.45rem 0 0;line-height:1.6;white-space:pre-wrap;word-break:break-word}
  .shot{margin:.7rem 0 0;display:block;max-width:100%;max-height:18rem;border-radius:10px;
    border:1px solid var(--rule)}
  .missing{margin:.7rem 0 0;padding:.7rem .85rem;border-radius:10px;font-size:.85rem;
    background:var(--sunk);border:1px dashed var(--rule);color:var(--muted)}
  .flag{margin:.55rem 0 0;font-size:.85rem;color:var(--red)}
  .acts{display:flex;gap:.5rem;margin:.9rem 0 0;flex-wrap:wrap}
  .acts button{border:1px solid var(--rule);background:var(--sunk);color:var(--ink-2);
    border-radius:99px;padding:.4rem 1rem;font-size:.85rem;font-weight:600;cursor:pointer}
  .acts button.go{background:var(--blue);border-color:var(--blue);color:#fff}
  .acts button.bad:hover{border-color:var(--red);color:var(--red)}
  .acts button:disabled{opacity:.5;cursor:default}
  .said{margin:.55rem 0 0;font-size:.83rem;color:var(--muted)}

  /* A person, and the picture they have. Wide row rather than a card stack:
     the point of this list is comparing faces to names, and a column of
     full-width cards puts one face on screen at a time. */
  .person{display:flex;gap:.9rem;align-items:center}
  .face{width:60px;height:60px;border-radius:50%;flex:0 0 auto;object-fit:cover;
    background:var(--sunk);border:1px solid var(--rule);display:block}
  .noface{width:60px;height:60px;border-radius:50%;flex:0 0 auto;display:grid;
    place-items:center;background:var(--sunk);border:1px dashed var(--rule);
    color:var(--muted);font-size:.6rem;font-weight:700;letter-spacing:.08em;
    text-transform:uppercase;text-align:center;line-height:1.2}
  /* Flex shrinks a child to its longest word before it takes space from a
     sibling, so the name column says how to share it. */
  .pinfo{flex:1 1 auto;min-width:0}
  .pname{font-weight:700}
  .pmeta{font-size:.78rem;color:var(--muted)}
  .pick{flex:0 0 auto;border:1px solid var(--rule);background:var(--sunk);
    color:var(--ink-2);border-radius:99px;padding:.4rem 1rem;font-size:.85rem;
    font-weight:600;cursor:pointer;display:inline-block}
  .pick:hover{border-color:var(--blue);color:var(--blue)}
  .pick input{display:none}
  /* Dropping a file anywhere on the row works too, and has to look like it
     does before the file is over it. */
  .post.over{outline:2px dashed var(--blue);outline-offset:3px}
  .said.bad{color:var(--red)}
  .none{padding:2.2rem 1rem;text-align:center;color:var(--muted);font-size:.9rem;
    background:var(--card);border-radius:16px;box-shadow:var(--shadow)}
  .frame{border-radius:16px;overflow:hidden;background:var(--card);
    border:1px solid var(--rule);box-shadow:var(--shadow);height:min(76vh,50rem)}
  .frame iframe{width:100%;height:100%;border:0;display:block;background:var(--sunk)}

  /* The assistant, one pull away rather than a page you navigate to.
     Three addresses to remember was two too many. */
  .pull{position:fixed;right:1.2rem;bottom:1.2rem;z-index:40;display:flex;
    align-items:center;gap:.5rem;cursor:pointer;font:inherit;border:0;
    padding:.7rem 1.1rem;border-radius:99px;color:#fff;font-weight:700;
    font-size:.88rem;background:linear-gradient(140deg,var(--blue),#5478d8);
    box-shadow:0 8px 22px rgba(63,104,216,.3)}
  .pull:hover{transform:translateY(-1px)}

  /* Docked, not laid over. A conversation about the thing behind it should not
     cover the thing behind it — asking for a change to a screen while that
     screen is hidden. So it takes a column and the page keeps the rest. */
  .drawer{position:fixed;top:0;left:0;bottom:0;z-index:60;
    width:min(34rem,46vw);display:flex}
  .drawer[hidden]{display:none}
  .drawerbox{background:var(--card);width:100%;height:100%;
    border-right:1px solid var(--rule);box-shadow:14px 0 40px rgba(17,24,33,.13);
    display:flex;flex-direction:column;overflow:hidden}
  body.with-sage{padding-left:calc(min(34rem,46vw) + 1.2rem)}
  /* Too narrow to be two things at once: back to a sheet over the top, which
     is the honest answer on a phone. */
  @media (max-width:64rem){
    .drawer{inset:0;width:auto;justify-content:center;align-items:flex-start;
      background:rgba(17,24,33,.42)}
    .drawerbox{width:min(60rem,100%);height:min(88vh,54rem);border-right:0;
      border-radius:0 0 20px 20px;box-shadow:0 24px 60px rgba(17,24,33,.3)}
    body.with-sage{padding-left:clamp(.8rem,2.5vw,1.8rem)}
  }
  .drawerhd{display:flex;align-items:center;gap:.7rem;padding:.8rem 1.1rem;
    border-bottom:1px solid var(--rule);flex:none}
  .drawerhd h2{margin:0;font-size:1rem}
  .drawerhd .mini{margin-left:auto;font-size:.76rem;font-weight:600;
    color:var(--muted);text-decoration:none;padding:.3rem .7rem;border-radius:99px;
    border:1px solid var(--rule)}
  .drawerhd .mini:hover{border-color:var(--blue);color:var(--blue)}
  .drawerhd .shut{font-size:.8rem;font-weight:600;color:var(--muted);
    background:none;border:0;cursor:pointer;padding:.3rem .5rem}
  .drawerhd .shut:hover{color:var(--blue)}
  .drawerbox iframe{flex:1;width:100%;border:0;display:block;background:var(--sunk)}
</style>
</head>
<body>
<main>
  <header>
    <div class="ava">留</div>
    <div>
      <h1 id="title">The Feed</h1>
      <p id="sub">Reading…</p>
    </div>
    <div class="tabs" role="tablist">
      <button class="tab" id="tab-queue" role="tab" aria-selected="true" aria-controls="pane-queue">Queue</button>
      <button class="tab" id="tab-live"  role="tab" aria-selected="false" aria-controls="pane-live">Live</button>
      <button class="tab" id="tab-people" role="tab" aria-selected="false" aria-controls="pane-people">People</button>
      <button class="tab" id="tab-waiting" role="tab" aria-selected="false" aria-controls="pane-waiting">Waiting</button>
      <button class="tab" id="tab-app"   role="tab" aria-selected="false" aria-controls="pane-app">The app</button>
    </div>
  </header>

  <div class="counts" id="counts" hidden></div>

  <section id="pane-queue" role="tabpanel" aria-labelledby="tab-queue">
    <div class="list" id="queue"></div>
  </section>

  <section id="pane-live" role="tabpanel" aria-labelledby="tab-live" hidden>
    <div class="list" id="live"></div>
  </section>

  <section id="pane-people" role="tabpanel" aria-labelledby="tab-people" hidden>
    <div class="list" id="people"></div>
  </section>

  <section id="pane-waiting" role="tabpanel" aria-labelledby="tab-waiting" hidden>
    <div class="list" id="waiting"></div>
  </section>

  <section id="pane-app" role="tabpanel" aria-labelledby="tab-app" hidden>
    <div class="frame"><iframe id="appframe" title="The Feed" src="about:blank"></iframe></div>
  </section>
</main>

<button class="pull" id="pull" type="button" aria-expanded="false" aria-controls="drawer">
  ✦ <span id="pullname">Sage</span>
</button>

<div class="drawer" id="drawer" hidden>
  <div class="drawerbox" role="dialog" aria-label="The assistant">
    <div class="drawerhd">
      <h2 id="drawername">Sage</h2>
      <a class="mini" id="drawerout" href="/sage" target="_blank" rel="noreferrer">Open in a tab</a>
      <button class="shut" type="button" id="drawershut">Close</button>
    </div>
    <!-- Loaded the first time it is opened, not on every page load: it is a
         model session and starting one nobody asked for is a turn nobody
         wanted to pay for. -->
    <iframe id="sageframe" title="The assistant"></iframe>
  </div>
</div>

<script type="module">
const $ = (id) => document.getElementById(id);
const el = (t, c, x) => { const n = document.createElement(t); if (c) n.className = c;
  if (x !== undefined) n.textContent = x; return n; };
const fill = (n) => { while (n.firstChild) n.removeChild(n.firstChild); };
const when = (iso) => { const d = new Date(iso); return Number.isNaN(+d) ? "" : d.toLocaleString(); };

/* Two different things, and treating them as one broke both.
 *
 * APP is wherever the app should be OPENED — configured, and it may well point
 * at a path rather than a bare host, because the useful page to land on is the
 * feed rather than the front door. Appending "/feed" to it produced /feed/feed.
 *
 * ORIGIN is the scheme and host on their own, which is what an API path has to
 * be joined to. Every photograph in this panel was being asked for at
 * /feed/api/public-media and quietly failing, which is why they "would not
 * load". */
let APP = "";
let ORIGIN = "";
let LOADED_FRAME = false;

/* ---- tabs ---------------------------------------------------------------- */
const PANES = ["queue", "live", "people", "waiting", "app"];
function show(which) {
  for (const k of PANES) {
    $("tab-" + k).setAttribute("aria-selected", String(k === which));
    $("pane-" + k).hidden = k !== which;
  }
  // The frame loads the first time it is asked for, not on every page load: it
  // is somebody else's page and it should not be fetched by a panel nobody
  // opened that tab on.
  if (which === "app" && APP && !LOADED_FRAME) {
    $("appframe").src = APP;
    LOADED_FRAME = true;
  }
}
for (const k of PANES) $("tab-" + k).addEventListener("click", () => show(k));

/* ---- acting -------------------------------------------------------------- */
/* Every action asks first. Releasing puts something in front of readers and
 * taking it down takes it away from them; neither is a press worth making by
 * accident, and there is no undo on the first. */
/* `after` is which list to redraw when it worked. It defaults to the queue,
   which is what every caller wanted until the waiting list grew buttons of
   its own — redrawing the queue after releasing a waiting person's photograph
   would leave the row that was just acted on exactly as it was. */
async function act(btn, url, opts, confirmText, after) {
  if (confirmText && !window.confirm(confirmText)) return;
  const row = btn.closest(".post");
  const said = row.querySelector(".said");
  row.querySelectorAll("button").forEach((b) => { b.disabled = true; });
  said.classList.remove("bad");
  said.textContent = "Working…";
  try {
    const r = await fetch(url, opts);
    const d = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(d.error || ("the server said " + r.status));
    await (after || load)();
  } catch (err) {
    said.classList.add("bad");
    said.textContent = String(err.message || err);
    row.querySelectorAll("button").forEach((b) => { b.disabled = false; });
  }
}

/* A photograph, or an honest note that it could not be shown.
 *
 * The first version removed a broken image and left an empty card, which is
 * the worst of both: nothing to look at and no sign that anything is missing.
 * Deciding whether to publish a picture you cannot see is not a decision. */
/* `where` is which of the board's two media routes to read from. A member's
   photograph lives behind the door on /api/public-media and is fetched by a
   browser that has been through it; a waiting person's is on /api/wait-media,
   which is open and serves wait rows only. Defaulted, so every existing
   caller is untouched. */
function picture(box, id, where) {
  const img = document.createElement("img");
  img.className = "shot";
  img.loading = "lazy";
  img.alt = "";
  img.src = ORIGIN + (where || "/api/public-media") + "?id=" + encodeURIComponent(id);
  img.addEventListener("error", () => {
    const note = el("div", "missing",
      "There is a photograph on this and it would not load from " + (ORIGIN || "the app")
      + ". Do not release it until you have seen it.");
    img.replaceWith(note);
  });
  box.append(img);
}

function drawPost(p, live) {
  const box = el("div", "post " + (p.reports ? "tone-red" : live ? "tone-green" : "tone-amber"));
  const who = el("div", "who");
  who.append(el("b", null, p.handle || "somebody"), el("span", null, when(p.at)));
  if (p.topic) who.append(el("span", null, "· " + p.topic));
  box.append(who);
  if (p.note) box.append(el("div", "body", p.note));
  if (p.photo) picture(box, p.photo);
  if (!p.note && !p.photo) box.append(el("div", "missing", "This post has no words and no picture."));
  if (p.reports) {
    box.append(el("div", "flag", p.reports + (p.reports === 1 ? " person" : " people")
      + " reported this" + (p.reportedFor ? ": " + p.reportedFor : "")));
  }

  const acts = el("div", "acts");
  if (!live) {
    const ok = el("button", "go", "Let it through");
    ok.addEventListener("click", () => act(ok,
      "/api/feed/release?id=" + encodeURIComponent(p.id), { method: "POST" },
      "Put this in front of readers?"));
    acts.append(ok);
  }
  const no = el("button", "bad", "Take it down");
  no.addEventListener("click", () => {
    const why = window.prompt("Why? The person who wrote it sees this.", "");
    if (why === null) return;
    act(no, "/api/feed/post?id=" + encodeURIComponent(p.id)
      + (why ? "&why=" + encodeURIComponent(why) : ""), { method: "DELETE" });
  });
  acts.append(no);
  box.append(acts, el("div", "said"));
  return box;
}

function drawFace(q) {
  const box = el("div", "post tone-violet");
  const who = el("div", "who");
  who.append(el("b", null, q.handle || "somebody"), el("span", null, when(q.at)),
    el("span", null, "· profile photograph"));
  box.append(who);
  for (const id of [q.photo, q.cover]) if (id) picture(box, id);

  const acts = el("div", "acts");
  const ok = el("button", "go", "Let it through");
  ok.addEventListener("click", () => act(ok,
    "/api/feed/face/release?id=" + encodeURIComponent(q.id), { method: "POST" },
    "Put this photograph in front of readers? It cannot be taken back once somebody has saved it."));
  const no = el("button", "bad", "Refuse it");
  no.addEventListener("click", () => {
    const why = window.prompt("Why? The person sees this.", "That photo was not put up.");
    if (why === null) return;
    act(no, "/api/feed/face?id=" + encodeURIComponent(q.id)
      + (why ? "&why=" + encodeURIComponent(why) : ""), { method: "DELETE" });
  });
  acts.append(ok, no);
  box.append(acts, el("div", "said"));
  return box;
}

/* ---- people, and the pictures they have ---------------------------------- */
/* Why this exists: a photograph could only reach a profile by being uploaded
 * from that person's own phone, in that person's own browser, with that
 * person's device id in it. For anybody the operator made — the demo people,
 * or somebody who wrote in because their upload failed — there was no way at
 * all, and the answer was a shell on the server. This is that, as a button. */

/* One person's picture, replaced. Not routed through act(): that reloads the
 * whole panel on success, and after an upload the useful thing to see is the
 * new face appearing in this row. */
async function sendPhoto(row, id, file) {
  const said = row.querySelector(".said");
  said.classList.remove("bad");

  // Refused here rather than after the upload. The board takes jpeg, png,
  // webp and gif; sending it a HEIC off a Mac and reading the 415 two minutes
  // later is a worse way to find that out.
  if (!/^image\//.test(file.type)) {
    said.classList.add("bad");
    said.textContent = "That is not an image. If it came off an iPhone as HEIC, "
      + "open it in Preview and export a JPEG.";
    return;
  }

  said.textContent = `Sending ${file.name}…`;
  row.classList.remove("over");
  try {
    const form = new FormData();
    form.append("id", id);
    form.append("file", file, file.name);
    const r = await fetch("/api/feed/face", { method: "POST", body: form });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(d.error || ("the server said " + r.status));
    said.textContent = "Done — it is on their profile now.";
    await loadPeople();
    await loadWaiting();
  } catch (err) {
    said.classList.add("bad");
    said.textContent = String(err.message || err);
  }
}

function drawPerson(q) {
  const box = el("div", "post " + (q.photo ? "tone-green" : "tone-amber"));
  const row = el("div", "person");

  if (q.photo) {
    const img = document.createElement("img");
    img.className = "face";
    img.loading = "lazy";
    img.alt = "";
    // Cache-busted on the id, which changes every time a new file is stored,
    // so a replaced picture does not keep showing the old one.
    img.src = ORIGIN + "/api/public-media?id=" + encodeURIComponent(q.photo);
    img.addEventListener("error", () => img.replaceWith(el("div", "noface", "would not load")));
    row.append(img);
  } else {
    row.append(el("div", "noface", "no photo"));
  }

  const info = el("div", "pinfo");
  info.append(el("div", "pname", q.handle || "somebody"));
  const bits = [];
  if (q.campus) bits.push(q.campus);
  bits.push(q.looking ? "on the study buddy list" : "not on the list");
  if (q.photoState && q.photoState !== "published" && q.photo) bits.push("photo waiting in the queue");
  if (q.state !== "published") bits.push("profile not published");
  info.append(el("div", "pmeta", bits.join(" · ")));
  row.append(info);

  // A label wrapping a hidden input: the same press, without a button that has
  // to reach across to find the file box it belongs to.
  const pick = el("label", "pick", q.photo ? "Replace photo" : "Add photo");
  const input = document.createElement("input");
  input.type = "file";
  input.accept = "image/*";
  input.addEventListener("change", () => {
    if (input.files && input.files[0]) sendPhoto(box, q.id, input.files[0]);
    input.value = "";
  });
  pick.append(input);
  row.append(pick);

  box.append(row, el("div", "said"));

  // Dragging a file onto the row does the same thing. Every default is
  // cancelled, because a file dropped on a page the browser handles itself
  // means navigating away from the panel to the image.
  const stop = (e) => { e.preventDefault(); e.stopPropagation(); };
  box.addEventListener("dragover", (e) => { stop(e); box.classList.add("over"); });
  box.addEventListener("dragleave", (e) => { stop(e); box.classList.remove("over"); });
  box.addEventListener("drop", (e) => {
    stop(e);
    const file = e.dataTransfer?.files?.[0];
    if (file) sendPhoto(box, q.id, file);
    else box.classList.remove("over");
  });

  return box;
}

/* Read on its own rather than inside load(): an upload changes one person and
 * nothing else, and redrawing the queue underneath somebody who is working
 * through it is its own small hostility. */
/* WHO IS AT THE DOOR.
 *
 * Grouped by room and, inside a room, whoever has been standing there longest
 * first — that is the person this pane exists to remind somebody of. Answered
 * rows stay, faded, because "we already said no to her" is worth knowing when
 * the same name comes back.
 *
 * Their line about themselves and the way to reach them, and nothing else.
 * There is no button here on purpose: letting somebody in mints a code that
 * has to be handed over in a chat, and a panel that admits people without
 * sending them anything creates a member who was never told they were one.
 * That still belongs at a terminal, where make admit prints the message.
 */
const WAITROOMS = [
  ["film", "Film & TV"], ["invest", "Investing"], ["raise", "Raising"],
  ["trade", "Factories & buyers"], ["other", "Something else"],
];

function ago(iso) {
  const then = Date.parse(iso || "");
  if (!then) return "";
  const days = Math.floor((Date.now() - then) / 86400000);
  if (days <= 0) return "today";
  if (days === 1) return "yesterday";
  if (days < 14) return days + " days";
  return Math.floor(days / 7) + " weeks";
}

function drawWaiting(w) {
  /* Green for somebody still waiting, grey once they have been answered: the
     same colour language the queue above uses for a thing that needs a hand. */
  const box = el("div", "post " + (w.done ? "tone-grey" : "tone-green"));
  const head = el("div", "who");
  head.append(el("b", null, w.name || "—"));
  head.append(el("span", "when", ago(w.at)));
  box.append(head);
  if (w.why) box.append(el("p", "why", w.why));
  const reach = String(w.reach || "").trim();
  if (reach) {
    if (/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(reach)) {
      const a = el("a", "reach", reach);
      a.href = "mailto:" + reach;
      box.append(a);
    } else {
      box.append(el("span", "reach", reach));
    }
  }
  const tags = el("div", "tags");
  if (w.viaName) tags.append(el("span", "tag", "sent by " + w.viaName));
  /* WHAT THEY FILLED IN WHILE THEY WAITED. The three things a member gets to
     decide on, on the row where the deciding happens. */
  if (w.levelBand) {
    const [which, n] = String(w.levelBand).split(" ");
    tags.append(el("span", "tag", (which === "ZH" ? "Chinese " : "English ") + n + "/10"));
  }
  if (w.type) tags.append(el("span", "tag", w.type));
  if (w.want) tags.append(el("span", "tag", "wants " + w.want));
  if (w.done) tags.append(el("span", "tag off", w.done === "in" ? "let in" : "turned down"));
  if (tags.childNodes.length) box.append(tags);

  /* THEIR PHOTOGRAPH, AND THE ONE DECISION IT NEEDS.
   *
   * A waiting person's picture is held whatever the board's setting says —
   * see the note on `photo` in store.js — so it needs a person to look at it,
   * and this is where that person already is. Released ones are shown too,
   * without buttons: seeing who has a face on their card is half of knowing
   * whether the queue is worth going through. */
  if (w.photo) {
    picture(box, w.photo, "/api/wait-media");
    if (w.photoState !== "published") {
      const acts = el("div", "acts");
      const ok = el("button", "go", "Let it through");
      ok.addEventListener("click", () => act(ok,
        "/api/feed/waiting/face?id=" + encodeURIComponent(w.id) + "&ok=1", { method: "POST" },
        "Show this photograph to members and to the others waiting?", loadWaiting));
      const no = el("button", "bad", "Refuse it");
      no.addEventListener("click", () => act(no,
        "/api/feed/waiting/face?id=" + encodeURIComponent(w.id), { method: "POST" },
        "Clear this photograph? They stay on the list and can put up another.",
        loadWaiting));
      acts.append(ok, no);
      box.append(acts);
    } else {
      box.append(el("span", "tag", "photo shown"));
    }
    box.append(el("div", "said"));
  }
  return box;
}

async function loadWaiting() {
  const box = $("waiting");
  try {
    const r = await fetch("/api/feed/waiting", { cache: "no-store" });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || ("the server said " + r.status));
    const rows = Array.isArray(d.waits) ? d.waits : [];
    const open = rows.filter((w) => !w.done);
    $("tab-waiting").textContent = "Waiting" + (open.length ? " \u00b7 " + open.length : "");
    fill(box);
    if (!rows.length) {
      box.append(el("div", "none", "Nobody has put their name down yet."));
      return;
    }
    for (const [key, label] of WAITROOMS) {
      const some = rows.filter((w) => (w.room || "other") === key);
      if (!some.length) continue;
      /* A FULLER CARD COMES FIRST, and the longest wait wins between equals.
       *
       * Somebody who added a photograph and took the tests is genuinely
       * easier to decide about than a name and a line, so the order says so
       * — which is the incentive to fill the card in, stated by the software
       * rather than by a rule. Answered rows sink to the bottom whatever they
       * carry, and within one score it is still first come first served, so
       * nobody who waited is buried by somebody who arrived this morning and
       * filled in three boxes. */
      const worth = (w) => (w.photo && w.photoState === "published" ? 2 : 0)
        + (w.levelBand ? 1 : 0) + (w.type ? 1 : 0) + (w.want ? 1 : 0);
      some.sort((a, b) => (Number(Boolean(a.done)) - Number(Boolean(b.done)))
        || (worth(b) - worth(a))
        || String(a.at).localeCompare(String(b.at)));
      const n = some.filter((w) => !w.done).length;
      box.append(el("div", "rule", label + (n ? "  ·  " + n + " waiting" : "")));
      for (const w of some) box.append(drawWaiting(w));
    }
  } catch (err) {
    fill(box);
    box.append(el("div", "none", "Could not read the list: " + (err.message || err)));
  }
}

async function loadPeople() {
  const box = $("people");
  try {
    const r = await fetch("/api/feed/people", { cache: "no-store" });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || ("the server said " + r.status));
    const people = d.people || [];
    $("tab-people").textContent = "People" + (people.length ? " \u00b7 " + people.length : "");
    fill(box);
    if (!people.length) {
      box.append(el("div", "none", "Nobody has made a profile yet."));
      return;
    }
    for (const q of people) box.append(drawPerson(q));
  } catch (err) {
    fill(box);
    box.append(el("div", "none", "Could not read the people: " + (err.message || err)));
  }
}

/* ---- the figures --------------------------------------------------------- */
function drawCounts(c) {
  const box = $("counts");
  fill(box);
  const n = (v, label, cls) => {
    const d = el("div", "n");
    const known = typeof v === "number" && Number.isFinite(v);
    d.append(el("b", known ? (cls || null) : "dim", known ? String(v) : "—"),
             el("span", null, label));
    return d;
  };
  const waiting = (c.held || 0) + (c.facesHeld || 0);
  box.append(
    n(c.count, "people, ever"),
    n(c.today, "posted today"),
    n(c.week, "this week"),
    n(c.returningToday, "came back today"),
    // The only figure here that is a task rather than a result, so it is the
    // only one with a colour.
    n(waiting, "waiting", waiting ? "task" : null),
  );
  if (APP) {
    const a = el("a", "more", "Open the feed");
    a.href = APP; a.target = "_blank"; a.rel = "noopener";
    box.append(a);
  }
  box.hidden = false;
}

/* ---- loading ------------------------------------------------------------- */
async function load() {
  try {
    const [qr, cr] = await Promise.all([
      fetch("/api/feed/queue", { cache: "no-store" }),
      fetch("/api/feed/count", { cache: "no-store" }).catch(() => null),
    ]);
    const d = await qr.json();
    if (!qr.ok) throw new Error(d.error || ("the server said " + qr.status));

    const held = d.posts || [], faces = d.faces || [], live = d.live || [];
    const reported = held.filter((p) => p.reports).length;

    $("tab-queue").textContent = "Queue" + (held.length + faces.length ? " · " + (held.length + faces.length) : "");
    $("tab-queue").classList.toggle("urgent", reported > 0);
    $("tab-live").textContent = "Live" + (live.length ? " · " + live.length : "");
    $("sub").textContent = `${live.length} live · ${held.length + faces.length} waiting`
      + (reported ? ` · ${reported} reported` : "");

    const q = $("queue");
    fill(q);
    if (!held.length && !faces.length) {
      q.append(el("div", "none", "Nothing waiting. Everything anybody has put up has been read."));
    } else {
      // Reported first: a held post is not live and nobody is waiting on it; a
      // reported one is live and somebody has objected.
      for (const p of [...held].sort((a, b) => (b.reports || 0) - (a.reports || 0))) q.append(drawPost(p, false));
      for (const f of faces) q.append(drawFace(f));
    }

    const l = $("live");
    fill(l);
    if (!live.length) l.append(el("div", "none", "Nothing is live yet."));
    else for (const p of live.slice(0, 60)) l.append(drawPost(p, true));

    if (cr && cr.ok) drawCounts(await cr.json());
  } catch (err) {
    $("sub").textContent = "Could not read the queue: " + (err.message || err);
  }
}

/* ---- the assistant, docked ------------------------------------------------ */
let SAGE_LOADED = false;
function sage(on) {
  $("drawer").hidden = !on;
  document.body.classList.toggle("with-sage", Boolean(on));
  $("pull").setAttribute("aria-expanded", String(Boolean(on)));
  if (on && !SAGE_LOADED) { $("sageframe").src = "/sage?bare=1"; SAGE_LOADED = true; }
  // Coming back from a conversation, the queue may have moved — it can act on
  // it now. Cheap, and it stops the panel disagreeing with what was just done.
  if (!on) { load(); loadPeople(); loadWaiting(); }
}
$("pull").addEventListener("click", () => sage($("drawer").hidden));
$("drawershut").addEventListener("click", () => sage(false));
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && !$("drawer").hidden) sage(false);
});

fetch("/api/seat").then((r) => r.json()).then((d) => {
  APP = (d && d.feedBase) || "";
  // The host on its own, for API paths. Falls back to the string itself if it
  // is not a URL we can parse, which is the honest failure rather than a crash.
  try { ORIGIN = APP ? new URL(APP).origin : ""; } catch { ORIGIN = APP; }
  if (d && d.project) { $("title").textContent = d.project; document.title = d.project; }
  if (d && d.assistant) {
    $("pullname").textContent = d.assistant;
    $("drawername").textContent = d.assistant;
  }
  load();
  // After ORIGIN is known: the pictures in this list are served by the board,
  // not by this seat, so a list drawn before the address is read draws every
  // face as broken.
  loadPeople();
  loadWaiting();
}).catch(() => { load(); loadPeople(); loadWaiting(); });
</script>
