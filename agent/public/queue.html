<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The queue</title>
<meta name="color-scheme" content="light dark">
<style>
  :root{
    --paper:#F6F4EF; --card:#FFFDF8; --ink:#1C1A17; --ink-2:#4A453D; --muted:#8B8579;
    --line:#E4DFD4; --hair:#EEEAE1; --accent:#9A6B2F; --accent-ink:#fff;
    --ok:#2F7D4F; --bad:#B4453A;
    --serif:Georgia,"Songti SC","Noto Serif CJK SC",serif;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Noto Sans SC",sans-serif;
  }
  @media (prefers-color-scheme:dark){
    :root{--paper:#14120F; --card:#1D1A16; --ink:#EFEAE1; --ink-2:#B8B1A4;
      --muted:#8A8377; --line:#2C2822; --hair:#241F1A; --accent:#C79A5B;}
  }
  *{box-sizing:border-box;margin:0}
  body{background:var(--paper);color:var(--ink);font-family:var(--sans);
    font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
  .wrap{max-width:44rem;margin:0 auto;padding:2rem 1.15rem 5rem}
  h1{font-family:var(--serif);font-weight:400;font-size:1.9rem;line-height:1.15}
  .sub{margin:.4rem 0 0;color:var(--muted);font-size:.92rem}
  .bar{display:flex;gap:.6rem;align-items:center;margin:1.4rem 0 0}
  .bar button,.bar a{border:1px solid var(--line);background:var(--card);
    color:var(--ink);border-radius:99px;padding:.45rem 1rem;font:inherit;
    font-size:.9rem;text-decoration:none;cursor:pointer}
  h2{margin:2.4rem 0 0;font-family:var(--serif);font-weight:400;font-size:1.25rem}
  .none{margin:.8rem 0 0;color:var(--muted);font-size:.92rem}
  .item{margin:.9rem 0 0;background:var(--card);border:1px solid var(--line);
    border-radius:.85rem;padding:.95rem 1rem}
  .item .who{font-size:.82rem;color:var(--muted)}
  .item p{margin:.4rem 0 0;line-height:1.6;white-space:pre-wrap;word-break:break-word}
  .item img{margin:.6rem 0 0;max-width:100%;max-height:16rem;border-radius:.5rem;
    display:block;border:1px solid var(--hair)}
  .flag{margin:.5rem 0 0;font-size:.85rem;color:var(--bad)}
  .acts{display:flex;gap:.5rem;margin:.85rem 0 0;flex-wrap:wrap}
  .acts button{border:1px solid var(--line);background:var(--paper);color:var(--ink);
    border-radius:99px;padding:.4rem .95rem;font:inherit;font-size:.88rem;cursor:pointer}
  .acts button.go{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
  .acts button:disabled{opacity:.5;cursor:default}
  .said{margin:.6rem 0 0;font-size:.86rem;color:var(--muted)}
  .said.bad{color:var(--bad)}
  .faces{display:grid;gap:.9rem;grid-template-columns:repeat(auto-fill,minmax(13rem,1fr))}
</style>
</head>
<body>
<div class="wrap">
  <h1>The queue</h1>
  <p class="sub" id="sub">Reading…</p>
  <div class="bar">
    <button id="reload" type="button">Reload</button>
    <a id="applink" href="#" target="_blank" rel="noopener">Open the feed</a>
    <a href="/sage" id="asksage">Ask Sage</a>
  </div>

  <h2>Posts waiting</h2>
  <div id="posts"></div>

  <h2>Photographs waiting</h2>
  <div class="faces" id="faces"></div>
</div>

<script type="module">
const $ = (id) => document.getElementById(id);
const el = (t, c, x) => { const n = document.createElement(t); if (c) n.className = c;
  if (x !== undefined) n.textContent = x; return n; };
const fill = (n) => { while (n.firstChild) n.removeChild(n.firstChild); };

let BASE = "";

const when = (iso) => {
  const d = new Date(iso);
  return Number.isNaN(+d) ? "" : d.toLocaleString();
};

/* Every action asks first. Releasing puts something in front of readers and
 * removing takes it away from them; neither is a press worth making by
 * accident, and there is no undo on the first one. */
async function act(btn, url, opts, confirmText) {
  if (confirmText && !window.confirm(confirmText)) return;
  const row = btn.closest(".item");
  const said = row.querySelector(".said");
  row.querySelectorAll("button").forEach((b) => { b.disabled = true; });
  said.classList.remove("bad");
  said.textContent = "Working…";
  try {
    const r = await fetch(url, opts);
    const d = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(d.error || ("the server said " + r.status));
    row.remove();
    load();
  } catch (err) {
    said.classList.add("bad");
    said.textContent = String(err.message || err);
    row.querySelectorAll("button").forEach((b) => { b.disabled = false; });
  }
}

function drawPost(p) {
  const box = el("div", "item");
  box.append(el("div", "who", (p.handle || "somebody") + " · " + when(p.at)
    + (p.topic ? " · " + p.topic : "")));
  if (p.note) box.append(el("p", null, p.note));
  if (p.photo) {
    const img = document.createElement("img");
    img.src = BASE + "/api/public-media?id=" + encodeURIComponent(p.photo);
    img.alt = "";
    img.addEventListener("error", () => img.remove());
    box.append(img);
  }
  // Why it is here, when it is here because somebody objected rather than
  // because it is new. That is the more urgent of the two.
  if (p.reports) {
    box.append(el("p", "flag", p.reports + (p.reports === 1 ? " person" : " people")
      + " reported this" + (p.reportedFor ? ": " + p.reportedFor : "")));
  }

  const acts = el("div", "acts");
  const ok = el("button", "go", "Let it through");
  ok.addEventListener("click", () => act(ok,
    "/api/feed/release?id=" + encodeURIComponent(p.id), { method: "POST" },
    "Put this in front of readers?"));
  const no = el("button", null, "Take it down");
  no.addEventListener("click", () => {
    const why = window.prompt("Why? The person sees this.", "");
    if (why === null) return;
    act(no, "/api/feed/post?id=" + encodeURIComponent(p.id)
      + (why ? "&why=" + encodeURIComponent(why) : ""), { method: "DELETE" });
  });
  acts.append(ok, no);
  box.append(acts, el("p", "said"));
  return box;
}

function drawFace(q) {
  const box = el("div", "item");
  box.append(el("div", "who", (q.handle || "somebody") + " · " + when(q.at)));
  for (const id of [q.photo, q.cover]) {
    if (!id) continue;
    const img = document.createElement("img");
    img.src = BASE + "/api/public-media?id=" + encodeURIComponent(id);
    img.alt = "";
    img.addEventListener("error", () => img.remove());
    box.append(img);
  }
  const acts = el("div", "acts");
  const ok = el("button", "go", "Let it through");
  ok.addEventListener("click", () => act(ok,
    "/api/feed/face/release?id=" + encodeURIComponent(q.id), { method: "POST" },
    "Put this photograph in front of readers?"));
  const no = el("button", null, "Refuse it");
  no.addEventListener("click", () => {
    const why = window.prompt("Why? The person sees this.", "That photo was not put up.");
    if (why === null) return;
    act(no, "/api/feed/face?id=" + encodeURIComponent(q.id)
      + (why ? "&why=" + encodeURIComponent(why) : ""), { method: "DELETE" });
  });
  acts.append(ok, no);
  box.append(acts, el("p", "said"));
  return box;
}

async function load() {
  const posts = $("posts"), faces = $("faces");
  try {
    const r = await fetch("/api/feed/queue", { cache: "no-store" });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || ("the server said " + r.status));

    fill(posts); fill(faces);
    const held = d.posts || [], waiting = d.faces || [];
    $("sub").textContent = held.length + (held.length === 1 ? " post" : " posts")
      + " and " + waiting.length + (waiting.length === 1 ? " photograph" : " photographs")
      + " waiting. " + (d.live || []).length + " live.";
    if (!held.length) posts.append(el("p", "none", "Nothing waiting."));
    else for (const p of held) posts.append(drawPost(p));
    if (!waiting.length) faces.append(el("p", "none", "Nothing waiting."));
    else for (const q of waiting) faces.append(drawFace(q));
  } catch (err) {
    $("sub").textContent = "Could not read the queue: " + (err.message || err);
  }
}

$("reload").addEventListener("click", load);

fetch("/api/seat").then((r) => r.json()).then((d) => {
  BASE = (d && d.feedBase) || "";
  const a = $("applink");
  if (BASE) a.href = BASE; else a.remove();
  // Whatever the assistant on this seat is called, rather than a literal.
  if (d && d.assistant) $("asksage").textContent = "Ask " + d.assistant;
}).catch(() => {});

load();
</script>
</body>
</html>
