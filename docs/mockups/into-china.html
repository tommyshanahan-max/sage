<!doctype html><meta charset="utf-8">
<title>收款 · Into China</title>
<style>
  :root{--bg:#0B0E15;--card:#141924;--ink:#E9EDF5;--ink2:#A3B0C4;--mut:#6F7D92;
    --line:#232B39;--acc:#1E9E5A;--accink:#fff;
    --sans:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    --serif:Georgia,"Songti SC",serif}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 var(--sans)}
  .ph{width:390px;min-height:844px;padding:1.4rem 1.3rem 2rem}
  .top{display:flex;align-items:center;justify-content:space-between;margin:0 0 2.2rem}
  .mark{display:flex;align-items:center;gap:.5rem;font-size:.78rem;letter-spacing:.22em;color:var(--ink2)}
  .dot{width:.55rem;height:.55rem;border-radius:50%;background:var(--acc)}
  .lang{border:1px solid var(--line);border-radius:99px;padding:.35rem .8rem;font-size:.85rem;color:var(--ink2)}
  h1{font:400 2.15rem/1.15 var(--serif);margin:0 0 .7rem;letter-spacing:-.01em}
  .lede{color:var(--ink2);margin:0 0 2rem;font-size:1.02rem}
  .box{background:#F4F6FA;color:#151B28;border-radius:1.15rem;padding:1.3rem 1.2rem;margin:0 0 1rem}
  .who{font-size:.72rem;letter-spacing:.14em;color:#6F7D92;margin:0 0 .5rem}
  .amt{font:400 2.9rem/1 var(--serif);margin:0 0 .4rem}
  .for{color:#4E5968;margin:0 0 1.15rem;font-size:.95rem}
  .pay{width:100%;padding:1rem;border:0;border-radius:99px;background:#2F4BC4;color:#fff;
    font:700 1.05rem var(--sans)}
  .ways{display:flex;gap:.5rem;margin:0 0 1.9rem;flex-wrap:wrap}
  .way{border:1px solid var(--line);border-radius:99px;padding:.5rem .85rem;font-size:.9rem;color:var(--ink2);
    display:flex;align-items:center;gap:.45rem}
  .pip{width:.5rem;height:.5rem;border-radius:50%}
  .r{display:flex;align-items:center;justify-content:space-between;gap:1rem;
    padding:1.05rem 0;border-top:1px solid var(--line);font-size:1rem}
  .r i{color:var(--mut);font-style:normal}
  .go{width:100%;margin:2rem 0 .8rem;padding:1.15rem;border:0;border-radius:99px;
    background:var(--acc);color:var(--accink);font:700 1.05rem var(--sans);letter-spacing:.06em}
  .foot{text-align:center;color:var(--mut);font-size:.88rem;margin:0}
</style>
<div class="ph">
  <div class="top">
    <div class="mark"><span class="dot"></span>收款 · INTO CHINA</div>
    <div class="lang">EN</div>
  </div>

  <h1>收国外的钱，<br>到你的银行卡。</h1>
  <p class="lede">对方在国外用卡付，你收人民币。不用注册，不用装 App。</p>

  <div class="box">
    <div class="who">你向 MICHAEL 收款</div>
    <div class="amt">¥2,400</div>
    <div class="for">12 节课</div>
    <button class="pay">付 US$340</button>
  </div>

  <div class="ways">
    <span class="way"><span class="pip" style="background:#1A73E8"></span>Visa</span>
    <span class="way"><span class="pip" style="background:#E8A317"></span>Mastercard</span>
    <span class="way"><span class="pip" style="background:#6F7D92"></span>银行转账</span>
  </div>

  <div class="r"><span>到账人民币，直接进你的卡</span><i>›</i></div>
  <div class="r"><span>对方付多少，页面上写清楚</span><i>›</i></div>
  <div class="r"><span>要一张银行卡，其他什么都不用</span><i>›</i></div>

  <button class="go">开始收款</button>
  <p class="foot">要付钱给别人？打开对方发你的链接。</p>
</div>
