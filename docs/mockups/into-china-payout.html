<!doctype html><meta charset="utf-8">
<style>
  :root{--paper:#EEF0F4;--raise:#F7F8FB;--card:#FCFCFD;--ink:#151B28;--ink2:#4E5968;
    --mut:#8A939F;--line:#E3E6EC;--acc:#3F68D8;--accink:#fff;--ok:#2A9D63;
    --sans:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    --serif:Georgia,"Songti SC",serif}
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 var(--sans)}
  .ph{width:390px;min-height:844px;background:var(--paper);position:relative;padding:1.1rem 1.1rem 6rem}
  h1{font:600 1.55rem/1.25 var(--serif);margin:.4rem 0 .35rem}
  .sub{color:var(--ink2);margin:0 0 1.5rem;font-size:.95rem}
  label{display:block;margin:0 0 1rem}
  label span{display:block;font-size:.8rem;color:var(--mut);margin:0 0 .3rem}
  input{width:100%;font:inherit;font-size:1.05rem;padding:.8rem .85rem;
    border:1px solid var(--line);border-radius:.8rem;background:var(--card);color:var(--ink)}
  .go{width:100%;padding:.95rem;border:0;border-radius:99px;background:var(--acc);
    color:var(--accink);font:600 1rem var(--sans);margin:.4rem 0 0}
  .row{display:flex;align-items:center;justify-content:space-between;gap:.6rem;
    padding:.95rem 0;border-top:1px solid var(--line);color:var(--ink);font-size:.95rem}
  .row i{color:var(--mut);font-style:normal}
  .note{color:var(--mut);font-size:.86rem;margin:1.1rem 0 0;line-height:1.5}
  .done{background:var(--card);border-radius:1rem;padding:1.1rem;margin:0 0 1.2rem;
    box-shadow:0 1px 3px rgba(21,27,40,.07)}
  .done b{display:block;font:600 1.15rem/1.3 var(--sans);margin:0 0 .25rem}
  .done .card{font:1.05rem/1.4 var(--serif);color:var(--ink2)}
  .tick{color:var(--ok);font-weight:600;font-size:.9rem;letter-spacing:.04em}
  .bar{position:absolute;left:0;right:0;bottom:0;display:flex;background:var(--card);
    border-top:1px solid var(--line);padding:.5rem .5rem 1.1rem}
  .bar a{flex:1;text-align:center;color:var(--mut);font-size:.7rem;text-decoration:none}
  .bar a.on{color:var(--acc)}
  .bar svg{display:block;margin:0 auto .15rem;width:1.35rem;height:1.35rem;
    fill:none;stroke:currentColor;stroke-width:1.7}
</style>
<div class="ph">
  <h1>钱打到哪里</h1>
  <p class="sub">收到的钱当天转给你。</p>

  <label><span>姓名（和银行卡一致）</span><input value="" placeholder="张伟"></label>
  <label><span>开户银行</span><input value="" placeholder="招商银行"></label>
  <label><span>银行卡号</span><input value="" placeholder="6214 •••• •••• ••••" inputmode="numeric"></label>

  <button class="go">保存</button>

  <div class="row"><span>有营业执照？用公司账户到账更快</span><i>›</i></div>
  <div class="row"><span>卡号怎么保存的</span><i>›</i></div>

  <p class="note">卡号加密存放，只有转账时用到。页面上只显示后四位。</p>

  <hr style="border:0;border-top:1px dashed var(--line);margin:2.4rem 0 1.4rem">
  <p style="color:var(--mut);font-size:.8rem;margin:0 0 1rem">↓ 存好以后（同一个页面的另一个状态）</p>
<div class="done">
    <span class="tick">已设置</span>
    <b>张伟</b>
    <div class="card">招商银行 •••• 8821</div>
  </div>

  <div class="row"><span>换一张卡</span><i>›</i></div>
  <div class="row"><span>有营业执照？用公司账户到账更快</span><i>›</i></div>
  <div class="row"><span>卡号怎么保存的</span><i>›</i></div>

  <p class="note">卡号加密存放，只有转账时用到。页面上只显示后四位。</p>

    <a><svg viewBox="0 0 24 24"><path d="M3 6h18v12H3z M3 10h18"/></svg>名片</a>

  </nav>
</div>
