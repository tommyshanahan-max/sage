<!doctype html>
<!-- WATCHING A BROADCAST — see lib/cast.mjs. One person on camera; this page
     only watches. The subtitles arrive as data from the broadcaster's phone,
     {type:"sub", zh, en, pinyin, at}, and are drawn here, large, in the
     language this viewer picked — never burned into the picture. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Live</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#000;color:#fff;overflow:hidden;
    font:17px/1.4 -apple-system,BlinkMacSystemFont,"PingFang SC","Segoe UI",Helvetica,Arial,sans-serif}
  button{font-family:inherit}
  #v{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000}
  @media (orientation:portrait){#v{object-fit:cover}}
  .top{position:absolute;left:14px;right:14px;top:max(14px,env(safe-area-inset-top));display:flex;align-items:center;gap:10px}
  .live{background:#d93025;border-radius:8px;padding:3px 9px;font-weight:800;font-size:14px;letter-spacing:.04em}
  /* The title on its own line under the buttons: beside them, on a phone,
     it was squeezed to nothing. */
  .top{flex-wrap:wrap}
  .title{order:9;flex-basis:100%;font-weight:700;font-size:17px;text-shadow:0 1px 5px rgba(0,0,0,.7);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .langs{display:flex;gap:6px}
  .langs button{border:0;border-radius:10px;padding:6px 11px;font-size:15px;font-weight:800;background:rgba(0,0,0,.5);color:#fff;cursor:pointer}
  .langs button.on{background:#fff;color:#111}
  /* The bottom third, large: somebody holding a phone at arm's length. */
  .subs{position:absolute;left:12px;right:12px;bottom:max(28px,env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;pointer-events:none}
  .sub{background:rgba(0,0,0,.66);border-radius:14px;padding:8px 16px;max-width:100%}
  .sub .py{display:block;font-size:17px;opacity:.85}
  .sub b{display:block;font-size:28px;line-height:1.3;font-weight:700}
  .sub .second{display:block;font-size:19px;font-weight:500;opacity:.85}
  .sub.old{opacity:.6}
  .sub.old b{font-size:21px}
  .veil{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;padding:24px;background:rgba(0,0,0,.55)}
  .veil h1{margin:0;font-size:26px}
  .go{border:0;border-radius:18px;padding:18px 48px;background:#fff;color:#111;font-size:21px;font-weight:800;cursor:pointer;text-decoration:none}
  .brand{color:#fff;text-decoration:none;font-weight:800;font-size:14px;background:rgba(0,0,0,.5);border-radius:8px;padding:3px 9px}
  .more{position:absolute;right:12px;top:calc(max(14px,env(safe-area-inset-top)) + 42px);background:rgba(20,20,20,.94);border-radius:16px;padding:8px;display:grid;grid-template-columns:1fr 1fr;gap:6px;min-width:230px}
  .more button{border:0;border-radius:10px;padding:10px 12px;background:rgba(255,255,255,.1);color:#fff;font-size:17px;font-weight:700;text-align:left;cursor:pointer}
  .more button.on{background:#fff;color:#111}
  .share{border:0;border-radius:10px;padding:6px 10px;background:rgba(0,0,0,.5);color:#fff;font-size:15px;cursor:pointer}
  /* PRODUCTS UNDER THE VIDEO: the seller holds it up, the viewer taps it. */
  body.shop .subs{bottom:calc(max(12px,env(safe-area-inset-bottom)) + 104px)}
  .row{position:absolute;left:0;right:0;bottom:max(10px,env(safe-area-inset-bottom));display:flex;gap:8px;padding:0 10px;overflow-x:auto;-webkit-overflow-scrolling:touch}
  .it{flex:none;width:118px;background:#fff;color:#111;border:0;border-radius:14px;padding:6px;text-align:left}
  .it img,.it .ph{width:100%;height:52px;object-fit:cover;border-radius:9px;display:block;background:#e7e2da}
  .it .nm{font-size:12px;font-weight:700;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .it .pr{font-size:14px;font-weight:800;background:#111;color:#fff;border-radius:8px;text-align:center;padding:4px;margin-top:4px}
  .sheet{position:absolute;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end}
  .card{background:#faf7f1;color:#1c1917;width:100%;border-radius:22px 22px 0 0;padding:16px 16px max(18px,env(safe-area-inset-bottom))}
  .card h2{margin:0 0 2px;font-size:21px}.card .zh{color:#78716c;font-size:15px}
  .card .price{font-size:26px;font-weight:800;margin:6px 0 8px}
  .card input{width:100%;font-size:18px;padding:12px 14px;border:1.5px solid #d6d3d1;border-radius:12px;margin:5px 0;background:#fff}
  .card .want{width:100%;border:0;border-radius:14px;padding:15px;background:#1c1917;color:#fff;font-size:19px;font-weight:800;margin-top:6px}
  .card .msg{color:#c8261e;min-height:1.3em}.card .done{font-size:20px;font-weight:700;text-align:center;padding:16px 0}
  [hidden]{display:none!important}
</style>
</head>
<body>
<video id="v" autoplay playsinline></video>
<div class="top"><span class="live">LIVE</span><a class="brand" id="brand" target="_blank" rel="noopener">Laonei</a><span class="title" id="title"></span>
  <button class="share" id="share" aria-label="Share">⤴</button>
  <div class="langs" id="langs"><button data-l="zh">中</button><button data-l="py">拼</button><button data-l="en">EN</button><button data-l="more" id="globe" aria-label="More languages">🌐</button></div></div>
<div class="more" id="more" hidden></div>
<div class="subs" id="subs"></div>
<div class="row" id="row" hidden></div>
<div class="sheet" id="sheet" hidden><div class="card" id="card"></div></div>
<div class="veil" id="veil"><h1 id="msg"></h1><button class="go" id="go" hidden></button><a class="go" id="getapp" target="_blank" rel="noopener" hidden></a></div>
<script src="livekit.js"></script>
<script>
(() => {
  const zhUI = (navigator.language || "").startsWith("zh");
  const W = zhUI
    ? { watch: "▶ 观看", soon: "马上开始…", over: "直播已结束", gone: "找不到这个直播", full: "观看人数已满", net: "连不上，检查一下网络再试。", sound: "🔈 点一下开声音", app: "打开 Laonei", copied: "链接已复制", want: "我想要", name: "名字", reach: "邮箱或微信", country: "国家", sent: "收到了，我们会联系你。", need: "留个联系方式吧", retry: "没发出去，再试一次。" }
    : { watch: "▶ Watch", soon: "Starting soon…", over: "This live has ended", gone: "This live doesn't exist", full: "This live is full", net: "Can't connect — check the network and try again.", sound: "🔈 Tap for sound", app: "Get Laonei", copied: "Link copied", want: "I want this", name: "Your name", reach: "Email or WhatsApp", country: "Country", sent: "Got it — we'll be in touch.", need: "How do we reach you?", retry: "Didn't send — try again." };
  const $ = (id) => document.getElementById(id);
  const store = { get: (k) => { try { return localStorage.getItem(k) || ""; } catch { return ""; } },
    set: (k, v) => { try { localStorage.setItem(k, v); } catch { /* private window */ } } };
  const id = (location.pathname.match(/\/cast\/([a-f0-9]{16})$/) || [])[1] || "";
  const BASE = location.pathname.replace(/\/cast\/[a-f0-9]{16}$/, "");

  /* EVERY VIEWER IS A FRIEND OF A USER — the best way anybody arrives. So
     the page says whose it is (the Laonei badge), lets a viewer pass the live
     on, and when it ends offers the app. ?from=cast so the Numbers page can
     tell these arrivals from Instagram's. */
  const APP = "https://liuxuesheng.help/?from=cast";
  $("brand").href = APP;
  $("getapp").href = APP; $("getapp").textContent = W.app;
  $("share").onclick = async () => {
    const url = location.origin + location.pathname;
    try { if (navigator.share) { await navigator.share({ url }); return; } } catch { return; }
    try { await navigator.clipboard.writeText(url); $("share").textContent = "✓"; } catch { /* nothing to copy with */ }
  };

  /* WHICH LANGUAGE TO READ: 中 (characters), 拼 (characters with pinyin
     above — for learners), EN. Guessed from the phone, remembered once
     changed, and changeable any time: it only redraws. */
  const q = new URLSearchParams(location.search);
  /* ANY OTHER LANGUAGE behind 🌐: the broadcaster sends Chinese and
     English, and a viewer in Moscow reads Russian — each line translated by
     the server once per language (lib/cast.mjs), shown in English until it
     arrives. Each name is written in its own language: whoever needs it can
     read it. Codes match lib/speak.mjs. */
  const MORE = { ru: "Русский", ja: "日本語", ko: "한국어", es: "Español", fr: "Français", de: "Deutsch",
    pt: "Português", vi: "Tiếng Việt", th: "ไทย", id: "Indonesia", ar: "العربية" };
  const guess = () => { const l = (navigator.language || "").slice(0, 2); return l === "zh" ? "zh" : MORE[l] ? l : "en"; };
  const ok = (l) => ["zh", "py", "en"].includes(l) || MORE[l];
  let read = ok(q.get("lang")) ? q.get("lang") : ok(store.get("cast:read")) ? store.get("cast:read") : guess();
  for (const [code, name] of Object.entries(MORE)) {
    const b = document.createElement("button"); b.dataset.l = code; b.textContent = name; $("more").append(b);
  }
  const drawLangs = () => {
    [...$("langs").children, ...$("more").children].forEach((b) => b.classList.toggle("on", b.dataset.l === read || (b.dataset.l === "more" && !!MORE[read])));
    $("globe").textContent = MORE[read] ? read.toUpperCase() : "🌐";
  };
  const pick = (e) => {
    const l = e.target.dataset && e.target.dataset.l;
    if (!l) return;
    if (l === "more") { $("more").hidden = !$("more").hidden; return; }
    read = l; store.set("cast:read", l); $("more").hidden = true; drawLangs();
    lines.slice(-2).forEach(need); redraw();
  };
  $("langs").onclick = pick; $("more").onclick = pick;
  drawLangs();

  // ---- SUBTITLES: the last two lines, the newest large. -------------------
  const lines = [];
  let fade = 0;
  /* The line in the viewer's other language, asked for once. */
  function need(s) {
    if (!MORE[read] || s.x[read] !== undefined) return;
    const to = read;
    s.x[to] = null; // asked
    fetch(`${BASE}/api/cast/${id}/tr`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ text: s.en || s.zh, to }) })
      .then((r) => (r.ok ? r.json() : {})).then((j) => { s.x[to] = j.text || ""; if (read === to) redraw(); })
      .catch(() => { s.x[to] = ""; });
  }
  function redraw() {
    const box = $("subs");
    box.replaceChildren();
    lines.slice(-2).forEach((s, i, all) => {
      const d = document.createElement("div");
      d.className = "sub" + (i < all.length - 1 ? " old" : "");
      const main = MORE[read] ? s.x[read] || s.en || s.zh : read === "en" ? s.en || s.zh : s.zh || s.en;
      if (read === "py" && s.pinyin && s.zh) { const p = document.createElement("span"); p.className = "py"; p.textContent = s.pinyin; d.append(p); }
      const b = document.createElement("b"); b.textContent = main; d.append(b);
      box.append(d);
    });
  }
  function sub(m) {
    const clip = (v) => String(v || "").slice(0, 300);
    const s = { zh: clip(m.zh), en: clip(m.en), pinyin: clip(m.pinyin), x: {} };
    if (!s.zh && !s.en) return;
    lines.push(s);
    need(s);
    if (lines.length > 20) lines.shift();
    redraw();
    clearTimeout(fade);
    fade = setTimeout(() => { lines.length = 0; redraw(); }, 9000);
  }

  // ---- WATCHING ----------------------------------------------------------
  const LK = window.LivekitClient;
  let room = null;
  const veil = (msg, button) => {
    $("veil").hidden = false; $("msg").textContent = msg || "";
    $("go").hidden = !button; if (button) $("go").textContent = button;
    // Over, or never was: the moment to offer what it was made with.
    $("getapp").hidden = !(msg === W.over || msg === W.gone);
  };
  /* ONE TAP FIRST: a phone plays a page's sound only after a tap, and a
     broadcast without its voice is half a broadcast. */
  veil("", W.watch);
  $("go").onclick = start;

  async function start() {
    veil(W.soon);
    let r;
    try { r = await fetch(`${BASE}/api/cast/${id}/watch`, { method: "POST" }); } catch { return veil(W.net, W.watch); }
    if (!r.ok) return veil(({ 404: W.gone, 410: W.over, 409: W.full })[r.status] || W.net, r.status === 410 || r.status === 404 ? "" : W.watch);
    const j = await r.json();
    $("title").textContent = j.title || j.name || "";
    document.title = j.title || j.name || "Live";
    room = new LK.Room({ adaptiveStream: true });
    room.on(LK.RoomEvent.TrackSubscribed, (track) => {
      if (track.kind === "video") { track.attach($("v")); $("veil").hidden = true; }
      else document.body.append(track.attach());
    });
    room.on(LK.RoomEvent.TrackUnsubscribed, (track) => track.detach().forEach((e) => { if (e !== $("v")) e.remove(); }));
    // Only the broadcaster can send anything, and LiveKit sees to that; the
    // identity check is so a server message never draws as a subtitle.
    room.on(LK.RoomEvent.DataReceived, (payload, p) => {
      if (!p || p.identity !== "host") return;
      try { const m = JSON.parse(new TextDecoder().decode(payload)); if (m && m.type === "sub") sub(m); } catch { /* not a subtitle */ }
    });
    room.on(LK.RoomEvent.ParticipantDisconnected, (p) => { if (p.identity === "host") { $("v").srcObject = null; veil(W.soon); } });
    room.on(LK.RoomEvent.Disconnected, () => veil(W.over));
    room.on(LK.RoomEvent.AudioPlaybackStatusChanged, () => { if (!room.canPlaybackAudio) veil("", W.sound); });
    try { await room.connect(j.url, j.token); } catch { room = null; return veil(W.net, W.watch); }
    room.startAudio().catch(() => {});
    const host = [...room.remoteParticipants.values()].find((p) => p.identity === "host");
    if (!host || !host.videoTrackPublications.size) veil(W.soon); else $("veil").hidden = true;
    $("go").onclick = () => { room.startAudio().catch(() => {}); $("veil").hidden = true; };
  }
  $("v").onclick = () => { $("more").hidden = true; };
  /* THE PRODUCTS (lib/shop.mjs): the shop's own items in a row under the
     video. A tap opens "I want this" over the live, which keeps playing —
     no money yet; asking is the test. Hidden when the shop is empty. */
  fetch(`${BASE}/api/shop`).then((r) => r.json()).then((j) => {
    const items = (j.items || []).slice(0, 12);
    if (!items.length) return;
    document.body.classList.add("shop");
    const nameOf = (x) => (zhUI ? x.zh : x.en || x.zh);
    for (const x of items) {
      const b = document.createElement("button"); b.className = "it";
      const img = x.photo ? Object.assign(document.createElement("img"), { src: x.photo, alt: "", loading: "lazy", referrerPolicy: "no-referrer" }) : Object.assign(document.createElement("div"), { className: "ph" });
      img.onerror = () => img.replaceWith(Object.assign(document.createElement("div"), { className: "ph" }));
      b.append(img, Object.assign(document.createElement("div"), { className: "nm", textContent: nameOf(x) }),
        Object.assign(document.createElement("div"), { className: "pr", textContent: zhUI ? `¥${x.cny}` : `A$${x.aud}` }));
      b.onclick = () => want(x, nameOf(x));
      $("row").append(b);
    }
    $("row").hidden = false;
  }).catch(() => { /* no shop: just the live */ });
  function want(x, nm) {
    const c = $("card"); c.replaceChildren();
    c.append(Object.assign(document.createElement("h2"), { textContent: nm }));
    if (!zhUI && x.en) c.append(Object.assign(document.createElement("div"), { className: "zh", textContent: x.zh }));
    c.append(Object.assign(document.createElement("div"), { className: "price", textContent: zhUI ? `¥${x.cny}` : `A$${x.aud}  ·  ¥${x.cny}` }));
    const f = (ph, ac) => Object.assign(document.createElement("input"), { placeholder: ph, autocomplete: ac });
    const n = f(W.name, "name"), r = f(W.reach, "email"), co = f(W.country, "country-name");
    const msg = Object.assign(document.createElement("div"), { className: "msg" });
    r.oninput = () => { msg.textContent = ""; };
    const go = Object.assign(document.createElement("button"), { className: "want", textContent: W.want });
    go.onclick = async () => {
      if (!r.value.trim()) { msg.textContent = W.need; r.focus(); return; }
      go.disabled = true;
      try {
        const res = await fetch(`${BASE}/api/shop/want`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ item: x.id, name: n.value, reach: r.value, country: co.value }) });
        if (!res.ok) throw 0;
        c.replaceChildren(Object.assign(document.createElement("div"), { className: "done", textContent: W.sent }));
        setTimeout(() => { $("sheet").hidden = true; }, 1800);
      } catch { msg.textContent = W.retry; go.disabled = false; }
    };
    c.append(n, r, co, msg, go);
    $("sheet").hidden = false;
  }
  $("sheet").onclick = (e) => { if (e.target === $("sheet")) $("sheet").hidden = true; };
  addEventListener("pagehide", () => { if (room) room.disconnect(); });
})();
</script>
</body>
</html>
