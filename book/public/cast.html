<!doctype html>
<!-- WATCHING A BROADCAST — see lib/cast.mjs. One person on camera; this page
     only watches. The subtitles arrive as data from the broadcaster's phone,
     {type:"sub", zh, en, pinyin, at}, and are drawn here, large, in the
     language this viewer picked — never burned into the picture. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Live</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#000;color:#fff;overflow:hidden;
    font:17px/1.4 -apple-system,BlinkMacSystemFont,"PingFang SC","Segoe UI",Helvetica,Arial,sans-serif}
  button{font-family:inherit}
  #v{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000}
  @media (orientation:portrait){#v{object-fit:cover}}
  .top{position:absolute;left:14px;right:14px;top:max(14px,env(safe-area-inset-top));display:flex;align-items:center;gap:10px}
  .live{background:#d93025;border-radius:8px;padding:3px 9px;font-weight:800;font-size:14px;letter-spacing:.04em}
  .title{flex:1;font-weight:700;font-size:17px;text-shadow:0 1px 5px rgba(0,0,0,.7);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .langs{display:flex;gap:6px}
  .langs button{border:0;border-radius:10px;padding:6px 11px;font-size:15px;font-weight:800;background:rgba(0,0,0,.5);color:#fff;cursor:pointer}
  .langs button.on{background:#fff;color:#111}
  /* The bottom third, large: somebody holding a phone at arm's length. */
  .subs{position:absolute;left:12px;right:12px;bottom:max(28px,env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;pointer-events:none}
  .sub{background:rgba(0,0,0,.66);border-radius:14px;padding:8px 16px;max-width:100%}
  .sub .py{display:block;font-size:17px;opacity:.85}
  .sub b{display:block;font-size:28px;line-height:1.3;font-weight:700}
  .sub .second{display:block;font-size:19px;font-weight:500;opacity:.85}
  .sub.old{opacity:.6}
  .sub.old b{font-size:21px}
  .veil{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;padding:24px;background:rgba(0,0,0,.55)}
  .veil h1{margin:0;font-size:26px}
  .go{border:0;border-radius:18px;padding:18px 48px;background:#fff;color:#111;font-size:21px;font-weight:800;cursor:pointer;text-decoration:none}
  .brand{color:#fff;text-decoration:none;font-weight:800;font-size:14px;background:rgba(0,0,0,.5);border-radius:8px;padding:3px 9px}
  .share{border:0;border-radius:10px;padding:6px 10px;background:rgba(0,0,0,.5);color:#fff;font-size:15px;cursor:pointer}
  [hidden]{display:none!important}
</style>
</head>
<body>
<video id="v" autoplay playsinline></video>
<div class="top"><span class="live">LIVE</span><a class="brand" id="brand" target="_blank" rel="noopener">Laonei</a><span class="title" id="title"></span>
  <button class="share" id="share" aria-label="Share">⤴</button>
  <div class="langs" id="langs"><button data-l="zh">中</button><button data-l="py">拼</button><button data-l="en">EN</button></div></div>
<div class="subs" id="subs"></div>
<div class="veil" id="veil"><h1 id="msg"></h1><button class="go" id="go" hidden></button><a class="go" id="getapp" target="_blank" rel="noopener" hidden></a></div>
<script src="livekit.js"></script>
<script>
(() => {
  const zhUI = (navigator.language || "").startsWith("zh");
  const W = zhUI
    ? { watch: "▶ 观看", soon: "马上开始…", over: "直播已结束", gone: "找不到这个直播", full: "观看人数已满", net: "连不上，检查一下网络再试。", sound: "🔈 点一下开声音", app: "打开 Laonei", copied: "链接已复制" }
    : { watch: "▶ Watch", soon: "Starting soon…", over: "This live has ended", gone: "This live doesn't exist", full: "This live is full", net: "Can't connect — check the network and try again.", sound: "🔈 Tap for sound", app: "Get Laonei", copied: "Link copied" };
  const $ = (id) => document.getElementById(id);
  const store = { get: (k) => { try { return localStorage.getItem(k) || ""; } catch { return ""; } },
    set: (k, v) => { try { localStorage.setItem(k, v); } catch { /* private window */ } } };
  const id = (location.pathname.match(/\/cast\/([a-f0-9]{16})$/) || [])[1] || "";
  const BASE = location.pathname.replace(/\/cast\/[a-f0-9]{16}$/, "");

  /* EVERY VIEWER IS A FRIEND OF A USER — the best way anybody arrives. So
     the page says whose it is (the Laonei badge), lets a viewer pass the live
     on, and when it ends offers the app. ?from=cast so the Numbers page can
     tell these arrivals from Instagram's. */
  const APP = "https://liuxuesheng.help/?from=cast";
  $("brand").href = APP;
  $("getapp").href = APP; $("getapp").textContent = W.app;
  $("share").onclick = async () => {
    const url = location.origin + location.pathname;
    try { if (navigator.share) { await navigator.share({ url }); return; } } catch { return; }
    try { await navigator.clipboard.writeText(url); $("share").textContent = "✓"; } catch { /* nothing to copy with */ }
  };

  /* WHICH LANGUAGE TO READ: 中 (characters), 拼 (characters with pinyin
     above — for learners), EN. Guessed from the phone, remembered once
     changed, and changeable any time: it only redraws. */
  const q = new URLSearchParams(location.search);
  let read = ["zh", "py", "en"].includes(q.get("lang")) ? q.get("lang") : store.get("cast:read") || (zhUI ? "zh" : "en");
  const drawLangs = () => [...$("langs").children].forEach((b) => b.classList.toggle("on", b.dataset.l === read));
  $("langs").onclick = (e) => { const l = e.target.dataset && e.target.dataset.l; if (l) { read = l; store.set("cast:read", l); drawLangs(); redraw(); } };
  drawLangs();

  // ---- SUBTITLES: the last two lines, the newest large. -------------------
  const lines = [];
  let fade = 0;
  function redraw() {
    const box = $("subs");
    box.replaceChildren();
    lines.slice(-2).forEach((s, i, all) => {
      const d = document.createElement("div");
      d.className = "sub" + (i < all.length - 1 ? " old" : "");
      const main = read === "en" ? s.en || s.zh : s.zh || s.en;
      if (read === "py" && s.pinyin && s.zh) { const p = document.createElement("span"); p.className = "py"; p.textContent = s.pinyin; d.append(p); }
      const b = document.createElement("b"); b.textContent = main; d.append(b);
      box.append(d);
    });
  }
  function sub(m) {
    const clip = (v) => String(v || "").slice(0, 300);
    const s = { zh: clip(m.zh), en: clip(m.en), pinyin: clip(m.pinyin) };
    if (!s.zh && !s.en) return;
    lines.push(s);
    if (lines.length > 20) lines.shift();
    redraw();
    clearTimeout(fade);
    fade = setTimeout(() => { lines.length = 0; redraw(); }, 9000);
  }

  // ---- WATCHING ----------------------------------------------------------
  const LK = window.LivekitClient;
  let room = null;
  const veil = (msg, button) => {
    $("veil").hidden = false; $("msg").textContent = msg || "";
    $("go").hidden = !button; if (button) $("go").textContent = button;
    // Over, or never was: the moment to offer what it was made with.
    $("getapp").hidden = !(msg === W.over || msg === W.gone);
  };
  /* ONE TAP FIRST: a phone plays a page's sound only after a tap, and a
     broadcast without its voice is half a broadcast. */
  veil("", W.watch);
  $("go").onclick = start;

  async function start() {
    veil(W.soon);
    let r;
    try { r = await fetch(`${BASE}/api/cast/${id}/watch`, { method: "POST" }); } catch { return veil(W.net, W.watch); }
    if (!r.ok) return veil(({ 404: W.gone, 410: W.over, 409: W.full })[r.status] || W.net, r.status === 410 || r.status === 404 ? "" : W.watch);
    const j = await r.json();
    $("title").textContent = j.title || j.name || "";
    document.title = j.title || j.name || "Live";
    room = new LK.Room({ adaptiveStream: true });
    room.on(LK.RoomEvent.TrackSubscribed, (track) => {
      if (track.kind === "video") { track.attach($("v")); $("veil").hidden = true; }
      else document.body.append(track.attach());
    });
    room.on(LK.RoomEvent.TrackUnsubscribed, (track) => track.detach().forEach((e) => { if (e !== $("v")) e.remove(); }));
    // Only the broadcaster can send anything, and LiveKit sees to that; the
    // identity check is so a server message never draws as a subtitle.
    room.on(LK.RoomEvent.DataReceived, (payload, p) => {
      if (!p || p.identity !== "host") return;
      try { const m = JSON.parse(new TextDecoder().decode(payload)); if (m && m.type === "sub") sub(m); } catch { /* not a subtitle */ }
    });
    room.on(LK.RoomEvent.ParticipantDisconnected, (p) => { if (p.identity === "host") { $("v").srcObject = null; veil(W.soon); } });
    room.on(LK.RoomEvent.Disconnected, () => veil(W.over));
    room.on(LK.RoomEvent.AudioPlaybackStatusChanged, () => { if (!room.canPlaybackAudio) veil("", W.sound); });
    try { await room.connect(j.url, j.token); } catch { room = null; return veil(W.net, W.watch); }
    room.startAudio().catch(() => {});
    const host = [...room.remoteParticipants.values()].find((p) => p.identity === "host");
    if (!host || !host.videoTrackPublications.size) veil(W.soon); else $("veil").hidden = true;
    $("go").onclick = () => { room.startAudio().catch(() => {}); $("veil").hidden = true; };
  }
  addEventListener("pagehide", () => { if (room) room.disconnect(); });
})();
</script>
</body>
</html>
