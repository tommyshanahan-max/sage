<!doctype html>
<!-- THE LIVE CLASS. One teacher on camera, the group watching. The #key in
     the link says which: the teacher's link sends, the group's link watches.
     The video goes through LiveKit on the box — see lib/live.mjs for why a
     class of ten cannot go phone to phone the way a lesson does. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Live</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#111;color:#fff;
    font:17px/1.4 -apple-system,BlinkMacSystemFont,"PingFang SC","Segoe UI",Helvetica,Arial,sans-serif}
  .pre{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:14px;padding:24px;text-align:center;background:#faf7f1;color:#1c1917}
  .pre h1{margin:0;font:700 28px/1.2 Georgia,"Songti SC",serif}
  .pre p{margin:0;color:#57504a}
  .pre video{width:220px;height:290px;object-fit:cover;border-radius:18px;background:#e8e2d8;transform:scaleX(-1)}
  .go{border:0;border-radius:16px;padding:16px 40px;background:#c8261e;color:#fff;font-weight:700;font-size:18px;
    font-family:inherit;cursor:pointer}
  .err{color:#b3261e;min-height:1.2em}
  .live{position:fixed;inset:0;background:#111}
  #v{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#111}
  .me #v{object-fit:cover;transform:scaleX(-1)}
  .me.back #v{transform:none}
  .top{position:absolute;left:14px;top:max(14px,env(safe-area-inset-top));display:flex;gap:8px;align-items:center}
  .pill{border-radius:8px;padding:5px 10px;font-weight:700;font-size:15px;background:rgba(0,0,0,.45);backdrop-filter:blur(8px)}
  .pill.on{background:#d93025}
  .pill svg{width:16px;height:16px;vertical-align:-3px;margin-right:4px;fill:none;stroke:currentColor;stroke-width:2}
  .state{position:absolute;left:0;right:0;top:40%;padding:0 24px;text-align:center;font-size:20px;font-weight:600;
    text-shadow:0 1px 6px rgba(0,0,0,.6)}
  .state button{margin-top:16px}
  .bar{position:absolute;left:0;right:0;bottom:max(22px,env(safe-area-inset-bottom));
    display:flex;justify-content:center;gap:18px}
  .bar button{width:62px;height:62px;border-radius:50%;border:0;background:rgba(255,255,255,.18);
    color:#fff;display:grid;place-items:center;cursor:pointer;backdrop-filter:blur(8px)}
  .bar button.off{background:#fff;color:#111}
  .bar button.end{background:#d93025}
  .bar svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  [hidden]{display:none!important}
</style>
</head>
<body>
<div class="pre" id="pre">
  <h1 id="title"></h1>
  <p id="sub"></p>
  <video id="preview" autoplay playsinline muted hidden></video>
  <button class="go" id="go"></button>
  <p class="err" id="err"></p>
</div>
<div class="live" id="live" hidden>
  <video id="v" autoplay playsinline muted></video>
  <div class="top">
    <span class="pill" id="badge"></span>
    <span class="pill" id="count"><svg viewBox="0 0 24 24"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg><b id="n">0</b></span>
  </div>
  <div class="state" id="state"></div>
  <div class="bar">
    <button id="mic" aria-label="Microphone" hidden><svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
    <button id="cam" aria-label="Camera" hidden><svg viewBox="0 0 24 24"><rect x="3" y="7" width="13" height="10" rx="2"/><path d="M16 11l5-3v8l-5-3"/></svg></button>
    <button id="flip" aria-label="Flip camera" hidden><svg viewBox="0 0 24 24"><path d="M4 9a8 8 0 0 1 14-3l2 2M20 15a8 8 0 0 1-14 3l-2-2M20 4v4h-4M4 20v-4h4"/></svg></button>
    <button id="end" class="end" aria-label="Leave"><svg viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
  </div>
</div>
<script src="../livekit.js"></script>
<script>
(() => {
  const zh = (navigator.language || "").startsWith("zh");
  const W = zh ? {
    hostTitle: "你的直播课", go: "开始直播", watch: "观看", live: "直播中", ready: "未开播",
    title: "{who}的直播课", notYet: "{who}还没开播", left: "{who}已下播", ended: "直播已结束",
    again: "重新开始", back: "重新观看", sound: "点一下打开声音", conn: "正在连接…", lost: "连接断了，正在重连…",
    cam: "请允许使用摄像头和麦克风，再试一次。", key: "这个链接打不开直播。", over: "这节直播课已经结束了。",
    full: "人数已满。", net: "连不上，检查一下网络再试。", today: "今天",
  } : {
    hostTitle: "Your live class", go: "Go live", watch: "Watch", live: "LIVE", ready: "Not live",
    title: "{who} · live class", notYet: "{who} isn't live yet", left: "{who} has ended the live", ended: "Live ended",
    again: "Go live again", back: "Watch again", sound: "Tap for sound", conn: "Connecting…", lost: "Connection dropped — reconnecting…",
    cam: "Allow the camera and microphone, then try again.", key: "This link doesn't open a live class.", over: "This live class is over.",
    full: "This class is full.", net: "Can't connect — check the network and try again.", today: "Today",
  };
  const fill = (s, v) => s.replace(/\{(\w+)\}/g, (_, k) => v[k] ?? "");
  const $ = (id) => document.getElementById(id);
  const LK = window.LivekitClient;

  const id = location.pathname.split("/").pop();
  const key = location.hash.slice(1);
  const BASE = location.pathname.replace(/\/live\/[a-f0-9]+$/, "");
  const api = (what) => fetch(`${BASE}/api/live/${id}/${what}`, {
    method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ key }),
  });

  let info = null, room = null, tracks = [], front = true;

  const whenWord = (iso) => {
    const d = new Date(iso);
    const today = new Date().toDateString() === d.toDateString();
    return (today ? W.today + " " : d.toLocaleDateString([], { weekday: "short", day: "numeric" }) + " ")
      + d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
  };
  const stop = (txt) => { $("title").textContent = txt; $("sub").textContent = ""; $("go").hidden = true; };

  // Before anybody presses anything: whose class, and when. The teacher also
  // sees their own camera, so the first time they are on is not the first
  // time they see themself.
  (async () => {
    try {
      const r = await api("info");
      if (r.status === 403) return stop(W.key);
      if (r.status === 410) return stop(W.over);
      info = await r.json();
    } catch { $("go").textContent = W.watch; return; }
    $("title").textContent = info.host ? W.hostTitle : fill(W.title, { who: info.name });
    const soon = Date.parse(info.start) > Date.now();
    $("sub").textContent = [info.title, soon ? whenWord(info.start) : ""].filter(Boolean).join(" · ");
    $("go").textContent = info.host ? W.go : W.watch;
    if (info.host) {
      try {
        tracks = await LK.createLocalTracks({ audio: true, video: { facingMode: "user", resolution: LK.VideoPresets.h720.resolution } });
        const v = tracks.find((t) => t.kind === "video");
        if (v) { v.attach($("preview")); $("preview").hidden = false; }
      } catch { /* asked again on the press, which is a tap and allowed to prompt */ }
    }
  })();

  const say = (txt, button) => {
    $("state").textContent = txt || "";
    if (button) $("state").append(document.createElement("br"), button);
  };
  const count = () => {
    if (!room) return;
    // Viewers only: the teacher is not their own audience.
    const n = [...room.remoteParticipants.values()].filter((p) => p.identity !== "host").length + (info.host ? 0 : 1);
    $("n").textContent = n;
  };
  const badge = (on) => { $("badge").textContent = on ? W.live : W.ready; $("badge").classList.toggle("on", on); };

  function showHost(track) {
    track.attach($("v"));
    say("");
    badge(true);
  }

  async function start() {
    $("err").textContent = "";
    if (info && info.host && !tracks.length) {
      try { tracks = await LK.createLocalTracks({ audio: true, video: { facingMode: "user", resolution: LK.VideoPresets.h720.resolution } }); }
      catch { $("err").textContent = W.cam; return; }
    }
    let r;
    try { r = await api("join"); } catch { $("err").textContent = W.net; return; }
    if (!r.ok) { $("err").textContent = ({ 410: W.over, 403: W.key, 409: W.full })[r.status] || W.net; return; }
    info = await r.json();

    room = new LK.Room({ adaptiveStream: true, dynacast: true });
    room.on(LK.RoomEvent.TrackSubscribed, (track, pub, p) => {
      if (p.identity !== "host") return;
      if (track.kind === "video") showHost(track);
      else document.body.append(track.attach());
    });
    room.on(LK.RoomEvent.TrackUnsubscribed, (track) => track.detach().forEach((el) => { if (el !== $("v")) el.remove(); }));
    room.on(LK.RoomEvent.ParticipantConnected, count);
    room.on(LK.RoomEvent.ParticipantDisconnected, (p) => {
      count();
      if (!info.host && p.identity === "host") { badge(false); say(fill(W.left, { who: info.name })); }
    });
    room.on(LK.RoomEvent.Reconnecting, () => say(W.lost));
    room.on(LK.RoomEvent.Reconnected, () => say(""));
    room.on(LK.RoomEvent.Disconnected, () => { if (room) ended(); });
    // A phone that will not play sound until it is touched: say so, once.
    room.on(LK.RoomEvent.AudioPlaybackStatusChanged, () => {
      if (room.canPlaybackAudio) return;
      const b = document.createElement("button");
      b.className = "go"; b.textContent = W.sound;
      b.onclick = () => room.startAudio().then(() => say(""));
      say("", b);
    });

    $("pre").hidden = true;
    $("live").hidden = false;
    $("live").classList.toggle("me", info.host);
    badge(false);
    say(W.conn);
    try {
      await room.connect(info.url, info.token);
    } catch {
      room = null;
      $("live").hidden = true; $("pre").hidden = false;
      $("err").textContent = W.net;
      return;
    }
    count();
    if (info.host) {
      for (const t of tracks) await room.localParticipant.publishTrack(t, t.kind === "video" ? { simulcast: true } : {});
      const v = tracks.find((t) => t.kind === "video");
      if (v) showHost(v);
      ["mic", "cam", "flip"].forEach((b) => { $(b).hidden = false; });
    } else {
      const h = room.remoteParticipants.get("host");
      if (!h) say(fill(W.notYet, { who: info.name }));
      else say("");
      room.startAudio().catch(() => {});
    }
  }
  $("go").addEventListener("click", start);

  function ended() {
    const was = room;
    room = null;
    if (was) was.disconnect();
    $("live").hidden = true;
    $("pre").hidden = false;
    $("preview").hidden = true;
    $("title").textContent = W.ended;
    $("sub").textContent = "";
    $("go").textContent = info && info.host ? W.again : W.back;
  }

  const toggle = (kind, btn) => {
    const t = tracks.find((x) => x.kind === kind);
    if (!t) return;
    if (t.isMuted) t.unmute(); else t.mute();
    $(btn).classList.toggle("off", t.isMuted);
  };
  $("mic").addEventListener("click", () => toggle("audio", "mic"));
  $("cam").addEventListener("click", () => toggle("video", "cam"));
  $("flip").addEventListener("click", async () => {
    const v = tracks.find((t) => t.kind === "video");
    if (!v) return;
    front = !front;
    try { await v.restartTrack({ facingMode: front ? "user" : "environment" }); } catch { front = !front; }
    $("live").classList.toggle("back", !front);
  });
  $("end").addEventListener("click", () => {
    if (info && info.host) tracks.forEach((t) => t.stop());
    tracks = [];
    ended();
  });
  addEventListener("pagehide", () => { if (room) room.disconnect(); });
})();
</script>
</body>
</html>
