<!doctype html>
<!-- A TRANSLATED CALL. Start one, send the link, talk: whatever the other
     person says appears under their video in your language, a second after
     they say it. See lib/calls.mjs for how the pieces fit.

     Each phone hears ITS OWN speaker, with the browser's built-in dictation
     (the same thing behind the microphone key on the keyboard) — so no audio
     is sent anywhere to be transcribed, and there is nothing to pay for until
     a finished sentence is translated. Where the browser has no dictation,
     the call still works; that side's words just carry no subtitles. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Call</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#111;color:#fff;
    font:17px/1.4 -apple-system,BlinkMacSystemFont,"PingFang SC","Segoe UI",Helvetica,Arial,sans-serif}
  button,input{font-family:inherit}
  .pre{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:18px;padding:24px;text-align:center;background:#faf7f1;color:#1c1917}
  .pre h1{margin:0;font:700 34px/1.15 Georgia,"Songti SC",serif}
  .pre p{margin:0;color:#57504a;font-size:19px}
  .pre video{width:200px;height:260px;object-fit:cover;border-radius:18px;background:#e8e2d8;transform:scaleX(-1)}
  .langs{display:flex;gap:10px}
  .langs button{border:2px solid #d8d2c8;background:#fff;border-radius:14px;padding:12px 22px;font-size:19px;font-weight:700;cursor:pointer;color:#1c1917}
  .langs button.on{border-color:#1c1917;background:#1c1917;color:#fff}
  .go{border:0;border-radius:16px;padding:17px 44px;background:#c8261e;color:#fff;font-weight:700;font-size:19px;cursor:pointer}
  .go.dark{background:#1c1917}
  .link{width:100%;max-width:420px;background:#fff;border:2px solid #e5e2dc;border-radius:14px;padding:14px;font-size:16px;word-break:break-all;color:#1c1917}
  .row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
  .err{color:#b3261e;min-height:1.2em}
  .call{position:fixed;inset:0;background:#111}
  #them{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#111}
  #me{position:absolute;right:14px;top:max(14px,env(safe-area-inset-top));width:26vw;max-width:140px;
    aspect-ratio:3/4;object-fit:cover;border-radius:14px;border:2px solid rgba(255,255,255,.7);transform:scaleX(-1);background:#333}
  .state{position:absolute;left:0;right:0;top:38%;padding:0 24px;text-align:center;font-size:20px;font-weight:600;text-shadow:0 1px 6px rgba(0,0,0,.6)}
  .mine{position:absolute;left:14px;top:max(14px,env(safe-area-inset-top));max-width:60%;font-size:16px;
    background:rgba(0,0,0,.55);border-radius:10px;padding:7px 12px;opacity:.95;cursor:pointer}
  .bar{position:absolute;left:0;right:0;bottom:max(22px,env(safe-area-inset-bottom));display:flex;justify-content:center;gap:12px}
  .bar button{width:60px;height:60px;border-radius:50%;border:0;background:rgba(255,255,255,.18);color:#fff;display:grid;place-items:center;cursor:pointer;backdrop-filter:blur(8px)}
  .bar button.off{background:#fff;color:#111}
  .bar button.end{background:#d93025}
  .bar #lng{font-size:19px;font-weight:800}
  .bar svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  /* THE CARD — every word in the call, in one place. */
  .card{position:absolute;left:10px;right:10px;bottom:calc(max(22px,env(safe-area-inset-bottom)) + 76px);
    background:rgba(255,255,255,.96);color:#1c1917;border-radius:22px;display:flex;flex-direction:column;cursor:pointer}
  .card.open{top:max(20%,env(safe-area-inset-top));cursor:default}
  .ctop{flex:none;display:flex;align-items:center;justify-content:center;position:relative;height:26px}
  .ctop .grab{width:44px;height:5px;border-radius:3px;background:#d6d3d1}
  .ctop button{position:absolute;right:10px;top:6px;border:1.5px solid #d6d3d1;background:#fff;color:#57534e;border-radius:10px;
    font-size:13px;font-weight:800;padding:3px 8px;cursor:pointer}
  .card.both .ctop button{background:#1c1917;border-color:#1c1917;color:#fff}
  .lines{padding:0 16px 12px}
  /* Small: the newest two lines, whole — a height cut them in half. */
  .card:not(.open) .ln:not(:nth-last-child(-n+2)){display:none}
  .card.open .lines{flex:1;max-height:none;overflow-y:auto;-webkit-overflow-scrolling:touch}
  .ln{margin:6px 0;font-size:22px;line-height:1.3;font-weight:700}
  .ln.me{text-align:right;font-size:17px;font-weight:500;color:#57534e}
  .ln.live .t{opacity:.6}
  .ln .alt{display:none;font-size:15px;font-weight:500;color:#78716c}
  .card.both .ln .alt:not(:empty){display:block}
  .ok{color:#16a34a;font-weight:900;margin-left:6px}
  .callshare{position:absolute;left:24px;right:24px;top:52%;width:auto;background:#fff!important;color:#1c1917}
  [hidden]{display:none!important}
</style>
</head>
<body>
<div class="pre" id="pre">
  <h1 id="title"></h1>
  <p id="sub"></p>
  <div class="langs" id="langs"><button data-l="en">English</button><button data-l="zh">中文</button></div>
  <video id="preview" autoplay playsinline muted hidden></video>
  <div class="link" id="link" hidden></div>
  <div class="row" id="share" hidden><button class="go dark" id="send"></button></div>
  <button class="go" id="go"></button>
  <p class="err" id="err"></p>
</div>
<div class="call" id="call" hidden>
  <video id="them" autoplay playsinline></video>
  <video id="me" autoplay playsinline muted></video>
  <div class="state" id="state"></div>
  <div class="mine" id="mine" hidden></div>
  <button class="go dark callshare" id="send2" hidden></button>
  <div class="card" id="card" hidden>
    <div class="ctop"><i class="grab"></i><button id="both" aria-label="Both languages">文A</button></div>
    <div class="lines" id="lines"></div>
  </div>
  <div class="bar">
    <button id="mic" aria-label="Microphone"><svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
    <button id="cam" aria-label="Camera"><svg viewBox="0 0 24 24"><rect x="3" y="7" width="13" height="10" rx="2"/><path d="M16 11l5-3v8l-5-3"/></svg></button>
    <button id="lng" aria-label="Language"></button>
    <button id="shr" aria-label="Share link"><svg viewBox="0 0 24 24"><path d="M12 3v12M7 8l5-5 5 5"/><path d="M5 12v7h14v-7"/></svg></button>
    <button id="end" class="end" aria-label="Leave"><svg viewBox="0 0 24 24"><path d="M3 15c5-5 13-5 18 0l-3 3-3-2v-3c-2-1-4-1-6 0v3l-3 2z"/></svg></button>
  </div>
</div>
<script src="livekit.js"></script>
<script>
(() => {
  const zhUI = (navigator.language || "").startsWith("zh");
  const W = zhUI ? {
    start: "跟谁都能聊", startSub: "对方说什么，都会变成你的语言字幕。", startGo: "发起通话",
    link: "把链接发给对方", send: "分享链接", copied: "已复制", join: "加入通话", joinTitle: "视频通话",
    joinSub: "字幕会翻译成你的语言。", wait: "等对方加入…", conn: "正在连接…", left: "对方挂断了", you: "通话已结束",
    again: "重新加入", cam: "请允许使用摄像头和麦克风，再试一次。", key: "这个链接打不开通话。", over: "这个通话已过期。",
    full: "这个通话已经有两个人了。", net: "连不上，检查一下网络再试。", noSubs: "这个浏览器不支持字幕，换 Safari 或 Chrome。",
    lost: "连接断了，正在重连…", tapSubs: "🎙 点这里打开字幕", subsOff: "字幕暂时不可用", tapGo: "🎙 点一下开始字幕",
  } : {
    start: "Talk to anyone.", startSub: "What they say appears in your language.", startGo: "Start a call",
    link: "Send them this link", send: "Share link", copied: "Copied", join: "Join call", joinTitle: "Video call",
    joinSub: "Subtitles in your language.", wait: "Waiting for them to join…", conn: "Connecting…", left: "They left the call", you: "Call ended",
    again: "Join again", cam: "Allow the camera and microphone, then try again.", key: "This link doesn't open a call.", over: "This call link has expired.",
    full: "This call already has two people.", net: "Can't connect — check the network and try again.", noSubs: "No subtitles in this browser — try Safari or Chrome.",
    lost: "Connection dropped — reconnecting…", tapSubs: "🎙 Tap to turn on subtitles", subsOff: "Subtitles are off right now", tapGo: "🎙 Tap to start subtitles",
  };
  const $ = (id) => document.getElementById(id);
  const LK = window.LivekitClient;
  const store = { get: (k) => { try { return localStorage.getItem(k) || ""; } catch { return ""; } },
    set: (k, v) => { try { localStorage.setItem(k, v); } catch { /* private window */ } } };

  const m = location.pathname.match(/\/call\/([a-f0-9]{16})$/);
  let id = m ? m[1] : "";
  let key = location.hash.slice(1);
  const BASE = location.pathname.replace(/\/call(\/[a-f0-9]{16})?$/, "");
  const api = (what, body) => fetch(`${BASE}/api/call/${id}/${what}`, {
    method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ key, ...body }),
  });

  /* I SPEAK — the one choice on the screen: it decides what the dictation
     listens for and what the other person's words are translated into.
     Guessed from the phone's language; remembered once changed. */
  /* AN APP CARRYING THIS PAGE (Laonei, in a frame) says who is calling and
     in what language: /call?name=Tom&lang=zh. Both optional; a person who
     opened a link from a chat gets the guesses below. */
  const q = new URLSearchParams(location.search);
  const myName = (q.get("name") || store.get("call:name") || "").slice(0, 30);
  let lang = (q.get("lang") === "zh" || q.get("lang") === "en") ? q.get("lang") : store.get("call:lang") || (zhUI ? "zh" : "en");
  /* AND IS TOLD WHAT HAPPENED, so it can offer "Save Julia?" after a call:
     created (with the link to share), joined, ended — with the other
     person's name. postMessage to the frame's parent only; standing alone,
     nothing is sent anywhere. */
  let them = "", themUid = "";
  const uid = /^[A-Za-z0-9_-]{1,64}$/.test(q.get("uid") || "") ? q.get("uid") : "";
  const meet = (p) => {
    if (p.name) them = p.name;
    try { const m = JSON.parse(p.metadata || "{}"); if (m.uid) themUid = String(m.uid); } catch { /* none */ }
  };
  const tellApp = (type, extra) => {
    if (window.parent === window) return;
    try { window.parent.postMessage({ source: "book-call", type, id, them: them || themUid ? { name: them, ...(themUid ? { uid: themUid } : {}) } : null, ...extra }, "*"); } catch { /* */ }
  };
  const drawLangs = () => [...$("langs").children].forEach((b) => b.classList.toggle("on", b.dataset.l === lang));
  $("langs").onclick = (e) => { const l = e.target.dataset && e.target.dataset.l; if (l) { lang = l; store.set("call:lang", l); drawLangs(); } };
  drawLangs();

  let room = null, tracks = [], me = "", ended = false;

  // ---- THE START PAGE: make a call, send the link ------------------------
  const linkOf = () => `${location.origin}${BASE}/call/${id}#${key}`;
  if (!id) {
    $("title").textContent = W.start;
    $("sub").textContent = W.startSub;
    $("go").textContent = W.startGo;
    $("go").onclick = async () => {
      $("err").textContent = "";
      const r = await fetch(`${BASE}/api/call`, { method: "POST" }).catch(() => null);
      if (!r || !r.ok) { $("err").textContent = W.net; return; }
      ({ id, key } = await r.json());
      history.replaceState(null, "", `${BASE}/call/${id}#${key}`);
      made = true;
      $("sub").textContent = W.link;
      $("link").textContent = linkOf();
      $("link").hidden = false;
      $("share").hidden = false;
      $("send").textContent = W.send;
      $("go").textContent = W.join;
      $("go").onclick = start;
      tellApp("created", { link: linkOf() });
    };
  } else {
    $("title").textContent = W.joinTitle;
    $("sub").textContent = W.joinSub;
    $("go").textContent = W.join;
    $("go").onclick = start;
  }
  const share = async (btn) => {
    try { if (navigator.share) { await navigator.share({ url: linkOf() }); return; } } catch { /* cancelled */ }
    try {
      await navigator.clipboard.writeText(linkOf());
      if (!btn.querySelector("svg")) btn.textContent = W.copied;
      else { const was = $("state").textContent; say(W.copied); setTimeout(() => say(was), 1500); }
    } catch { /* the link is on screen */ }
  };
  $("send").onclick = () => share($("send"));
  $("send2").onclick = () => share($("send2"));
  /* THE LINK, ALWAYS ONE TAP AWAY. Going straight into the call dropped the
     screen the link was on, and the big Share only shows while waiting —
     so once anybody had joined, or on the joining phone, there was no way
     to pass the call on. The bar keeps one. */
  $("shr").onclick = () => share($("shr"));

  /* STRAIGHT IN, when the app already asked. Laonei opens this with ?lang=
     after the person picked their language on its own Call tab, and this
     page asking again was a second question for the same answer. So: no
     intro — the call is made, joined, and waiting, with Share on screen.

     ONE TAP STILL NEEDED, for the subtitles and the other person's sound:
     an iPhone lets a page start dictation and play audio only inside a tap,
     and dictation started without one fails without a word (the first
     phone test showed nothing at all). So the corner asks for a tap, and
     the first tap anywhere — usually Share, which the caller presses
     anyway — turns both on. */
  const AUTO = q.get("lang") === "zh" || q.get("lang") === "en";
  let tapped = false, made = false;
  function waitTap() {
    const go = () => {
      if (tapped) return;
      tapped = true;
      document.removeEventListener("click", go, true);
      if (room) room.startAudio().catch(() => {});
      if ($("mine").textContent === W.tapGo) $("mine").textContent = "🎙";
      listen();
    };
    document.addEventListener("click", go, true);
  }
  if (AUTO) {
    $("langs").hidden = true;
    $("sub").textContent = "";
    $("title").textContent = W.conn;
    $("go").hidden = true;
    (async () => {
      await null; // after the rest of this script has run: start() needs all of it
      if (!id) {
        const r = await fetch(`${BASE}/api/call`, { method: "POST" }).catch(() => null);
        if (!r || !r.ok) { $("title").textContent = ""; $("err").textContent = W.net; return; }
        ({ id, key } = await r.json());
        history.replaceState(null, "", `${BASE}/call/${id}#${key}`);
        made = true;
        tellApp("created", { link: linkOf() });
      }
      await start();
      // Refused (camera, network, full): the ordinary Join button, which is a tap.
      if ($("call").hidden) { $("title").textContent = ""; $("go").hidden = false; $("go").textContent = W.join; $("go").onclick = start; }
    })();
  }

  // ---- THE CARD -----------------------------------------------------------
  /* EVERY WORD IN ONE PLACE. Two calls taught this: English and Chinese
     stacked read as broken, and then my words in a corner with theirs at
     the bottom was two places to watch. So one white card above the
     buttons, like the end of a chat: their line big, mine small on the
     right with a tick once it has reached them, both in my language. It
     shows the newest two; tapped or pulled up it is the whole call, and
     tapping the video or pulling it down shrinks it again.

     文A shows the other language under each line — what they actually said,
     and what they saw of mine — for whoever wants it; it stays off unless
     turned on, and is remembered. Memory only: nothing on the card is kept
     anywhere once the page closes. */
  let pThem = null, pMe = null; // the rows still being spoken
  const tick = (row) => { const t = row && row.querySelector(".t"); if (t && !t.querySelector(".ok")) { const k = document.createElement("b"); k.className = "ok"; k.textContent = "✓"; t.append(k); } };
  const setAlt = (row, text) => { if (row) row.querySelector(".alt").textContent = text || ""; };
  function line(mine, text, live) {
    const box = $("lines");
    const near = box.scrollHeight - box.scrollTop - box.clientHeight < 60;
    let row = mine ? pMe : pThem;
    if (!row || !row.isConnected) {
      row = document.createElement("div");
      row.className = "ln" + (mine ? " me" : "");
      const t = document.createElement("span"); t.className = "t";
      const a = document.createElement("div"); a.className = "alt";
      row.append(t, a);
      box.append(row);
    }
    row.classList.toggle("live", live);
    row.querySelector(".t").textContent = text;
    if (mine) pMe = live ? row : null; else pThem = live ? row : null;
    $("card").hidden = false;
    if (near || !$("card").classList.contains("open")) box.scrollTop = box.scrollHeight;
    return row;
  }
  function openCard(on) {
    $("card").classList.toggle("open", on);
    $("lines").scrollTop = $("lines").scrollHeight;
  }
  $("card").onclick = (e) => { if (!$("card").classList.contains("open")) openCard(true); else if (e.target.closest(".ctop")) openCard(false); };
  $("both").onclick = (e) => {
    e.stopPropagation();
    const on = $("card").classList.toggle("both");
    store.set("call:both", on ? "1" : "");
  };
  if (store.get("call:both")) $("card").classList.add("both");
  $("them").onclick = () => openCard(false);
  let y0 = null;
  $("card").addEventListener("touchstart", (e) => { y0 = e.touches[0].clientY; }, { passive: true });
  $("card").addEventListener("touchend", (e) => {
    if (y0 === null) return;
    const dy = e.changedTouches[0].clientY - y0, open = $("card").classList.contains("open");
    if (dy < -50 && !open) openCard(true);
    if (dy > 70 && open && $("lines").scrollTop + $("lines").clientHeight >= $("lines").scrollHeight - 4) openCard(false);
    y0 = null;
  });

  function hear(msg, fromServer) {
    if (msg.t === "live" && !fromServer) line(false, !msg.lang || msg.lang === lang ? msg.text : "…", true);
    if (msg.t === "cap" && fromServer && msg.who !== me) {
      const tr = msg.lang === lang ? "" : (msg.tr && msg.tr[lang]) || "";
      const row = line(false, tr || msg.text, false);
      setAlt(row, tr ? msg.text : "");
    }
  }

  /* MY OWN WORDS, as the phone heard them, on the card — so a
     speaker can see it is listening, and catch it mishearing. */
  let lastLive = 0;
  const HAN = /[\u3400-\u9fff\uf900-\ufaff]/; // same test as lib/calls.mjs
  const enc = new TextEncoder();
  /* SENT ON A PAUSE, NOT ON "FINAL". Waiting for the phone to call a
     sentence finished was most of the delay: iPhone Safari in continuous
     mode often does not say so until dictation stops, and sometimes keeps
     one result growing for the whole call. So a sentence goes when the words
     have not changed for PAUSE_MS, and only the part not already sent —
     "hello there" went, so "hello there how are you" sends "how are you". */
  const PAUSE_MS = 650;
  let sent = new Map(), pauseT = 0;
  // The phone's own final version often only re-capitalises or adds a full
  // stop to what already went; that is compared without either, and not sent.
  const bare = (t) => t.toLowerCase().replace(/[^\p{L}\p{N}]/gu, "");
  const after = (text, was) => (text.startsWith(was) || bare(text).startsWith(bare(was)) ? text.slice(was.length) : text).trim();
  function send(i, text) {
    clearTimeout(liveT); liveText = ""; // the finished sentence supersedes it
    const part = after(text, sent.get(i) || "");
    sent.set(i, text);
    if (!/[\p{L}\p{N}]/u.test(part)) return;
    const row = line(true, part, false);
    api("say", { me, text: part, lang }).then(async (r) => {
      if (!r.ok) return;
      // Said into the room — the other phone has it. The tick is what tells
      // the speaker to stop and wait, which nothing on screen did before.
      tick(row);
      const j = await r.json().catch(() => ({}));
      setAlt(row, Object.values(j.tr || {}).find(Boolean) || ""); // what they saw
    }).catch(() => {});
  }
  function heard(text, final, i = 0) {
    text = String(text || "").trim();
    if (!text || !room) return;
    $("mine").hidden = false;
    // Only the sentence being said now, not the whole growing transcript,
    // so the tick lands on the words it belongs to.
    const now = after(text, sent.get(i) || "");
    if (/[\p{L}\p{N}]/u.test(now)) line(true, now, true);
    clearTimeout(pauseT);
    if (final) return send(i, text);
    pauseT = setTimeout(() => send(i, text), PAUSE_MS);
    /* At most five a second, and THE LAST ONE ALWAYS GOES. It used to drop
       whatever arrived inside the 200ms, so the words said just before a
       pause never reached the other screen until the finished sentence did:
       Tom's corner read "…how are you" while the other phone still showed
       "…Tom how", and the other phone's subtitle looked slow. */
    liveText = after(text, sent.get(i) || "");
    const wait = 200 - (Date.now() - lastLive);
    clearTimeout(liveT);
    if (wait > 0) liveT = setTimeout(pushLive, wait); else pushLive();
  }
  let liveText = "", liveT = 0;
  function pushLive() {
    lastLive = Date.now();
    if (liveText && room) room.localParticipant.publishData(enc.encode(JSON.stringify({ t: "live", text: liveText, lang: HAN.test(liveText) ? "zh" : "en" })), { reliable: false, topic: "call" }).catch(() => {});
  }
  window.__heard = heard; // for tests: what the dictation would have said

  /* THE DICTATION. Chrome and Safari call it (webkit)SpeechRecognition. It
     stops by itself after a pause, so it is restarted for as long as the call
     is on and the microphone is open.

     STARTED IN THE TAP. iPhone Safari lets a page start dictation only while
     handling a tap; started a few seconds later, after the call connected,
     it refused without a word and the first real test showed nothing at all.
     So `listen` runs first thing in the Join press, before anything waits,
     and if the phone still refuses — or refuses a restart later — the corner
     says so and becomes the button that turns it back on, since that tap is
     one the phone will accept. */
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  let rec = null, listening = false, blocked = false;
  const corner = (t) => { $("mine").hidden = false; $("mine").textContent = t; };
  function listen() {
    if (!SR || ended || !micOn()) return;
    if (!rec) {
      rec = new SR();
      rec.continuous = true;
      rec.interimResults = true;
      rec.onstart = () => { blocked = false; sent = new Map(); corner("🎙"); };
      rec.onresult = (e) => {
        for (let i = e.resultIndex; i < e.results.length; i++) heard(e.results[i][0].transcript, e.results[i].isFinal, i);
      };
      rec.onend = () => { listening = false; if (!blocked) setTimeout(listen, 300); };
      rec.onerror = (e) => {
        // Refused — not a pause. Waiting for a tap, not retrying in a loop.
        if (/not-allowed|service-not-allowed|audio-capture/.test(e.error || "")) { blocked = true; corner(W.tapSubs); }
      };
    }
    rec.lang = lang === "zh" ? "zh-CN" : "en-US";
    if (listening) return;
    try { rec.start(); listening = true; } catch { /* already started */ }
  }
  $("mine").onclick = () => { if (blocked) { blocked = false; listening = false; listen(); } };
  /* THE LANGUAGE, CHANGEABLE IN THE CALL. The first phone test had the wrong
     one picked on one side, and the only way out was to hang up. One tap
     swaps it: my dictation listens for the other language and the server
     sends me translations into it. */
  const drawLng = () => { $("lng").textContent = lang === "zh" ? "中" : "EN"; };
  drawLng();
  $("lng").onclick = () => {
    lang = lang === "zh" ? "en" : "zh";
    store.set("call:lang", lang); drawLangs(); drawLng();
    if (me) api("say", { me, text: "", lang }).catch(() => {});
    // Stopped, it restarts by itself in the new language (rec.onend); and
    // this is a tap, so a phone that had refused will accept it now.
    if (blocked) { blocked = false; listening = false; listen(); }
    else try { rec && rec.stop(); } catch { /* not running */ }
  };
  const micOn = () => { const a = tracks.find((t) => t.kind === "audio"); return !a || !a.isMuted; };

  // ---- THE CALL -----------------------------------------------------------
  const say = (t) => { $("state").textContent = t || ""; };
  async function start() {
    $("err").textContent = "";
    ended = false;
    drawLng();
    if (!AUTO || tapped) listen(); // now, inside the tap — see THE DICTATION above
    try {
      if (!tracks.length) tracks = await LK.createLocalTracks({ audio: true, video: { facingMode: "user", resolution: LK.VideoPresets.h540.resolution } });
    } catch { $("err").textContent = W.cam; return; }
    let r;
    try { r = await api("join", { lang, name: myName, uid }); } catch { $("err").textContent = W.net; return; }
    if (!r.ok) { $("err").textContent = ({ 403: W.key, 410: W.over, 409: W.full })[r.status] || W.net; return; }
    const j = await r.json();
    me = j.me;
    ended = false;
    room = new LK.Room({ adaptiveStream: true, dynacast: true });
    room.on(LK.RoomEvent.TrackSubscribed, (track) => {
      if (track.kind === "video") { track.attach($("them")); say(""); }
      else document.body.append(track.attach());
    });
    room.on(LK.RoomEvent.TrackUnsubscribed, (track) => track.detach().forEach((e) => { if (e !== $("them")) e.remove(); }));
    room.on(LK.RoomEvent.ParticipantDisconnected, () => { $("them").srcObject = null; say(W.left); });
    room.on(LK.RoomEvent.ParticipantConnected, (p) => { say(W.conn); meet(p); $("send2").hidden = true; tellApp("joined"); });
    room.on(LK.RoomEvent.DataReceived, (payload, p, kind, topic) => {
      try { hear(JSON.parse(new TextDecoder().decode(payload)), !p); } catch { /* not ours */ }
    });
    room.on(LK.RoomEvent.Reconnecting, () => say(W.lost));
    room.on(LK.RoomEvent.Reconnected, () => say(""));
    room.on(LK.RoomEvent.Disconnected, () => { if (!ended) finish(); });
    $("pre").hidden = true;
    $("call").hidden = false;
    say(W.conn);
    try { await room.connect(j.url, j.token); }
    catch { room = null; $("call").hidden = true; $("pre").hidden = false; $("err").textContent = W.net; return; }
    for (const t of tracks) await room.localParticipant.publishTrack(t);
    const v = tracks.find((t) => t.kind === "video");
    if (v) v.attach($("me"));
    for (const p of room.remoteParticipants.values()) meet(p);
    say(room.remoteParticipants.size ? "" : W.wait);
    if (made && !room.remoteParticipants.size) { $("send2").textContent = W.send; $("send2").hidden = false; }
    room.startAudio().catch(() => {});
    if (!SR) corner(W.noSubs);
    else if (!j.subtitles) { blocked = true; try { rec && rec.stop(); } catch { /* */ } corner(W.subsOff); }
    else if (!AUTO || tapped) listen();
    else { corner(W.tapGo); waitTap(); }
  }

  function finish() {
    if (!ended) tellApp("ended");
    ended = true;
    try { rec && rec.stop(); } catch { /* not running */ }
    const was = room; room = null;
    if (was) was.disconnect();
    tracks.forEach((t) => t.stop()); tracks = [];
    $("call").hidden = true;
    $("pre").hidden = false;
    $("link").hidden = true; $("share").hidden = true;
    $("title").textContent = W.you;
    $("sub").textContent = "";
    $("go").textContent = W.again;
    $("go").onclick = start;
  }
  $("end").onclick = finish;
  $("mic").onclick = () => {
    const a = tracks.find((t) => t.kind === "audio");
    if (!a) return;
    if (a.isMuted) { a.unmute(); listen(); } else { a.mute(); try { rec && rec.stop(); } catch { /* */ } }
    $("mic").classList.toggle("off", a.isMuted);
  };
  $("cam").onclick = () => {
    const v = tracks.find((t) => t.kind === "video");
    if (!v) return;
    if (v.isMuted) v.unmute(); else v.mute();
    $("cam").classList.toggle("off", v.isMuted);
  };
  addEventListener("pagehide", () => { if (room) room.disconnect(); });
})();
</script>
</body>
</html>
