<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ClaireTv · partner</title>
<style>
  /* A working surface, not a shop window: lighter than the app on purpose, so
     nobody confuses the console with the thing the audience sees. */
  :root{
    --ink:#15100F; --sheet:#FBF8F6; --line:#E2D9D4; --soft:#F2EBE7;
    --ember:#C4243A; --gold:#8A6A20; --mute:#7C6F6A; --text:#1C1613;
  }
  *{box-sizing:border-box}
  body{
    margin:0;background:var(--sheet);color:var(--text);
    font:400 15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
    padding:28px 20px 80px;
  }
  .wrap{max-width:880px;margin-inline:auto}
  h1{font:700 26px/1.1 Georgia,serif;margin:0 0 4px;letter-spacing:-.01em}
  h1 i{color:var(--ember)}
  .sub{margin:0 0 26px;color:var(--mute);font-size:14px}
  h2{font:600 15px/1.2 inherit;margin:34px 0 12px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute)}
  label{display:block;font-size:12px;font-weight:600;color:var(--mute);margin:0 0 5px}
  input,select,textarea{
    width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;
    font:inherit;background:#fff;color:inherit;
  }
  textarea{min-height:64px;resize:vertical}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--ember);outline-offset:1px}
  .row{display:flex;flex-wrap:wrap;gap:12px}
  .row>div{flex:1 1 150px;min-width:0}
  button{
    font:inherit;font-weight:600;cursor:pointer;border:1px solid var(--line);
    background:#fff;color:inherit;padding:9px 15px;border-radius:8px;
  }
  button.go{background:var(--ember);border-color:var(--ember);color:#fff}
  button.small{padding:5px 10px;font-size:13px;font-weight:500}
  .card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
  .head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
  .head h3{margin:0;font:700 17px/1.2 Georgia,serif}
  .pill{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
    padding:3px 9px;border-radius:99px;background:var(--soft);color:var(--mute)}
  .pill.live{background:#E8F3EC;color:#1F6B3C}
  .pill.feat{background:#FBF0D8;color:var(--gold)}
  /* THE THREE NUMBERS THE WALL IS JUDGED BY. Reached, paid, coins — in that
     order, because the ratio between the first two is the only feedback the
     freeThrough setting ever gets. */
  .nums{display:flex;gap:26px;margin:14px 0 0;flex-wrap:wrap}
  .num{min-width:74px}
  .num b{display:block;font:700 22px/1 Georgia,serif;font-variant-numeric:tabular-nums}
  .num span{font-size:11px;color:var(--mute);letter-spacing:.04em;text-transform:uppercase}
  .eps{margin-top:14px;border-top:1px solid var(--line);padding-top:12px}
  .ep{display:flex;align-items:center;gap:10px;padding:6px 0;font-size:14px;border-bottom:1px solid var(--soft)}
  .ep .n{flex:0 0 34px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--mute)}
  .ep .t{flex:1;min-width:0}
  .ep .t b{display:block;font-weight:500}
  .ep .t span{font-size:12px;color:var(--mute)}
  .ep.wall{border-bottom:2px solid var(--ember)}
  .wallnote{font-size:12px;color:var(--ember);font-weight:600;padding:8px 0 0}
  .gate{max-width:380px;margin:60px auto;text-align:center}
  .gate input{text-align:center;letter-spacing:.1em;margin:14px 0}
  .say{font-size:13px;color:var(--ember);min-height:19px;margin:8px 0 0}
  .muted{color:var(--mute);font-size:13px}
  details summary{cursor:pointer;font-weight:600;font-size:14px;padding:4px 0}
  .huge{
    display:block;width:100%;padding:20px;margin:6px 0;font-size:19px;font-weight:700;
    background:var(--ember);border-color:var(--ember);color:#fff;border-radius:12px;
  }
  .maker{margin:10px 0 0}
  .maker textarea{min-height:150px;font-size:14px;line-height:1.5}
  .money{background:#fff;border:1px solid var(--line);border-radius:12px;padding:20px;margin:24px 0 10px}
  .mhead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
  .mlab{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);margin-bottom:5px}
  .mbig{font:700 42px/1 Georgia,serif;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
  .pill.demo{background:#F2EBE7;color:var(--mute)}
  .chart{display:flex;align-items:flex-end;gap:10px;height:140px;margin:34px 0 6px}
  .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;height:100%}
  .barwrap{flex:1;width:100%;display:flex;align-items:flex-end;justify-content:center;position:relative}
  .bar{width:100%;max-width:46px;background:#E7CFD4;border-radius:4px 4px 0 0;position:relative}
  .bar.top{background:var(--ember)}
  .peak{position:absolute;bottom:calc(100% + 4px);left:50%;transform:translateX(-50%);
    white-space:nowrap;font-size:11px;font-weight:700;color:var(--ember);
    font-variant-numeric:tabular-nums}
  .dlab{font-size:11px;color:var(--mute)}
  .mnums{border-top:1px solid var(--soft);padding-top:16px;margin-top:20px}
  .shape{display:flex;flex-wrap:wrap;gap:6px 18px;margin:14px 0 2px;padding-top:12px;border-top:1px solid var(--soft)}
  .chk{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--ember)}
  .chk.ok{color:var(--mute)}
  .chk i{width:14px;height:2px;border-radius:2px;background:var(--ember);flex:0 0 14px}
  .chk.ok i{background:#3E9B62}
  .gridwrap{margin-top:14px}
  .grow{display:grid;grid-template-columns:44px 56px 140px 1fr 1.6fr 1.4fr 30px;gap:6px;align-items:start;padding:5px 0}
  .ghead{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);border-bottom:1px solid var(--line);padding-bottom:6px}
  .grow input,.grow select,.grow textarea{padding:6px 8px;font-size:13px;min-height:0}
  .grow textarea{min-height:54px;line-height:1.35}
  .grow.wallrow{background:#FFF5F6;border-radius:8px;padding:8px 6px}
  @media (max-width:820px){
    .grow{grid-template-columns:44px 1fr 30px}
    .ghead{display:none}
  }
</style>
</head>
<body>
<div class="wrap" id="wrap"></div>

<script type="module">
/* The shape check is the agent's own, copied rather than reimplemented — see
   the header of three-act.js. It is the thing a writer cannot see while
   writing: anyone can fill ten boxes, but whether act one turns where it
   should is only visible once somebody counts. */
import { FUNCTIONS, checkShape } from "/three-act.js";

/* The key lives in this browser and nowhere else. It is sent on a header, not
   a cookie, so nothing a stranger links to can carry it. Clearing site data
   logs the partner out, which is the right behaviour on a shared laptop. */
const KEYSTORE = "claire:partnerkey";
let key = "";
try { key = sessionStorage.getItem(KEYSTORE) || ""; } catch { key = ""; }

const api = async (path, body) => {
  const r = await fetch(path, {
    method: body ? "POST" : "GET",
    headers: { "x-claire-key": key, ...(body ? { "Content-Type": "application/json" } : {}) },
    body: body ? JSON.stringify(body) : undefined,
    cache: "no-store",
  });
  return { status: r.status, data: await r.json().catch(() => ({})) };
};
const el = (t, c, txt) => { const n = document.createElement(t); if (c) n.className = c; if (txt != null) n.textContent = txt; return n; };
const field = (label, name, value, type = "text", extra = {}) => {
  const d = el("div");
  d.append(Object.assign(el("label"), { textContent: label, htmlFor: name }));
  const i = document.createElement(extra.tag || "input");
  if (!extra.tag) i.type = type;
  i.id = name; i.name = name; i.value = value ?? "";
  Object.assign(i, extra.props || {});
  d.append(i);
  return d;
};
const money = (c) => "$" + (c / 100).toFixed(2);

/* ---- the door ------------------------------------------------------------ */
async function gate(msg) {
  const w = document.getElementById("wrap"); w.textContent = "";
  const hello = await fetch("/api/partner/hello").then((r) => r.json()).catch(() => ({}));
  const box = el("div", "gate");
  box.append(Object.assign(el("h1"), { innerHTML: "<i>Claire</i>Tv" }));
  if (!hello.configured) {
    box.append(el("p", "sub", "No partner key is set on this server, so the console is closed. Set CLAIRE_PARTNER_KEY and restart."));
    w.append(box); return;
  }
  box.append(el("p", "sub", "Partner console"));
  const i = document.createElement("input");
  i.type = "password"; i.id = "key"; i.placeholder = "key"; i.autocomplete = "off";
  const go = el("button", "go", "Open");
  go.type = "button";
  const say = el("p", "say", msg || "");
  const tryIt = async () => {
    key = i.value.trim();
    const r = await api("/api/partner/catalogue");
    if (r.status === 200) { try { sessionStorage.setItem(KEYSTORE, key); } catch {} return draw(r.data); }
    say.textContent = "That key was not accepted.";
  };
  go.addEventListener("click", tryIt);
  i.addEventListener("keydown", (e) => { if (e.key === "Enter") tryIt(); });
  box.append(i, go, say);
  w.append(box);
  i.focus();
}

/* ---- the catalogue ------------------------------------------------------- */
async function refresh() {
  const r = await api("/api/partner/catalogue");
  if (r.status !== 200) return gate("Signed out.");
  draw(r.data);
}

async function draw(data) {
  const w = document.getElementById("wrap"); w.textContent = "";
  w.append(Object.assign(el("h1"), { innerHTML: "<i>Claire</i>Tv" }));
  w.append(el("p", "sub", "Welcome, Claire. What do you want to do?"));

  /* THE ONE THING SOMEBODY CAME HERE TO DO, at the size of the decision.
     Every other control on this page edits something that already exists;
     this is the only one that makes something, so it is the only one big
     enough to press without reading first. */
  const make = el("button", "huge", "\uFF0B  Create a new show");
  make.type = "button";
  const maker = el("div", "maker"); maker.hidden = true;
  make.addEventListener("click", () => {
    maker.hidden = !maker.hidden;
    if (!maker.hidden) maker.querySelector("input")?.focus();
  });
  w.append(make, maker);
  maker.append(newShowForm());

  w.append(await moneyCard());

  w.append(el("h2", null, "Catalogue"));
  if (!data.series.length) w.append(el("p", "muted", "Nothing yet."));
  for (const s of data.series) w.append(seriesCard(s, data.featured));

  const grant = el("details");
  grant.append(el("summary", null, "Top up a viewer"));
  const g = el("div", "card");
  const row = el("div", "row");
  row.append(field("Viewer id", "gv", ""), field("Coins", "gc", "100", "number"));
  const gb = el("button", "go", "Grant"); gb.type = "button";
  const gsay = el("p", "say");
  gb.addEventListener("click", async () => {
    const r = await api("/api/partner/grant", {
      viewer: document.getElementById("gv").value.trim(),
      coins: Number(document.getElementById("gc").value),
    });
    gsay.textContent = r.status === 200 ? "Balance is now " + r.data.coins : "No viewer with that id.";
  });
  g.append(row, el("div", null, " "), gb, gsay);
  g.append(el("p", "muted", "Coins are granted, not sold. There is no payment on this build — this is how you comp a reviewer or make a refund good."));
  grant.append(g);
  w.append(el("h2", null, "Coins"), grant);
}

function seriesCard(s, featured) {
  const c = el("div", "card");
  const head = el("div", "head");
  const left = el("div");
  left.append(el("h3", null, s.title));
  const tags = el("div"); tags.style.marginTop = "6px";
  tags.append(el("span", s.live ? "pill live" : "pill", s.live ? "Live" : "Draft"));
  if (featured === s.id) tags.append(document.createTextNode(" "), el("span", "pill feat", "Featured"));
  left.append(tags);
  head.append(left);

  const acts = el("div");
  const feat = el("button", "small", featured === s.id ? "Unfeature" : "Feature");
  feat.type = "button";
  feat.addEventListener("click", async () => {
    await api("/api/partner/feature", { id: featured === s.id ? "" : s.id });
    refresh();
  });
  acts.append(feat);
  head.append(acts);
  c.append(head);

  if (s.blurb) c.append(el("p", "muted", s.blurb));

  const nums = el("div", "nums");
  const n = (v, label) => { const d = el("div", "num"); d.append(el("b", null, String(v)), el("span", null, label)); return d; };
  nums.append(n(s.made + (s.totalPlanned ? " / " + s.totalPlanned : ""), "episodes"));
  nums.append(n(s.freeThrough, "free through"));
  nums.append(n(s.reached, "reached the wall"));
  nums.append(n(s.paid, "paid"));
  nums.append(n(s.coins, "coins taken"));
  c.append(nums);

  const edit = el("details");
  edit.append(el("summary", null, "Edit series"));
  edit.append(seriesForm(s));
  c.append(edit);

  c.append(shapeRow(s));

  const eps = el("details");
  eps.append(el("summary", null, "Beats and episodes (" + s.made + ")"));
  eps.append(beatGrid(s));
  eps.append(bulkBox(s));
  c.append(eps);
  return c;
}

function seriesForm(s) {
  const f = el("div", "card");
  const r1 = el("div", "row");
  r1.append(field("Title", "t" + (s ? s.id : "new"), s?.title || ""));
  f.append(r1);
  const r2 = el("div", "row");
  r2.append(field("One line about it", "b" + (s ? s.id : "new"), s?.blurb || "", "text"));
  f.append(r2);
  const r3 = el("div", "row");
  r3.append(field("Free through episode", "f" + (s ? s.id : "new"), s?.freeThrough ?? 7, "number"));
  r3.append(field("Coins per episode", "c" + (s ? s.id : "new"), s?.coinsPerEpisode ?? 60, "number"));
  r3.append(field("Whole series (cents)", "p" + (s ? s.id : "new"), s?.bundleCents ?? 1999, "number"));
  r3.append(field("Episodes planned", "n" + (s ? s.id : "new"), s?.totalPlanned ?? 84, "number"));
  f.append(r3);

  const r4 = el("div", "row");
  const gd = el("div");
  gd.append(Object.assign(el("label"), { textContent: "Genre" }));
  const g = document.createElement("select"); g.id = "g" + (s ? s.id : "new");
  for (const [v, label] of [["billionaire", "Billionaire"], ["alpha", "Alpha"], ["revenge", "Revenge"], ["other", "Other"]]) {
    const o = document.createElement("option"); o.value = v; o.textContent = label;
    if ((s?.genre || "billionaire") === v) o.selected = true;
    g.append(o);
  }
  gd.append(g); r4.append(gd);

  const ad = el("div");
  ad.append(Object.assign(el("label"), { textContent: "Key art" }));
  const a = document.createElement("select"); a.id = "a" + (s ? s.id : "new");
  for (const v of ["1", "2", "3", "4", "5", "6"]) {
    const o = document.createElement("option"); o.value = v; o.textContent = "Ground " + v;
    if ((s?.art || "1") === v) o.selected = true;
    a.append(o);
  }
  ad.append(a); r4.append(ad);

  const ld = el("div");
  ld.append(Object.assign(el("label"), { textContent: "Live" }));
  const l = document.createElement("select"); l.id = "l" + (s ? s.id : "new");
  for (const [v, label] of [["0", "Draft"], ["1", "Live"]]) {
    const o = document.createElement("option"); o.value = v; o.textContent = label;
    if (String(s?.live ? 1 : 0) === v) o.selected = true;
    l.append(o);
  }
  ld.append(l); r4.append(ld);
  f.append(r4);

  const save = el("button", "go", s ? "Save" : "Add series"); save.type = "button";
  const say = el("p", "say");
  save.addEventListener("click", async () => {
    const k = s ? s.id : "new";
    const v = (p) => document.getElementById(p + k).value;
    const r = await api("/api/partner/series", {
      id: s?.id, title: v("t"), blurb: v("b"),
      freeThrough: Number(v("f")), coinsPerEpisode: Number(v("c")),
      bundleCents: Number(v("p")), totalPlanned: Number(v("n")),
      genre: v("g"), art: v("a"), live: v("l") === "1",
    });
    if (r.status === 200) refresh();
    else say.textContent = r.data.error === "title" ? "It needs a title." : "That did not save.";
  });
  f.append(el("div", null, " "), save, say);
  return f;
}

/* ---- the money ---------------------------------------------------------- */
async function moneyCard() {
  const box = el("div", "money");
  const r = await api("/api/partner/stats");
  if (r.status !== 200) return box;
  const d = r.data;
  const cash = (c) => "$" + (c / 100).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });

  const head = el("div", "mhead");
  const left = el("div");
  left.append(el("div", "mlab", "Last 7 days"));
  left.append(el("div", "mbig", cash(d.cents)));
  head.append(left);
  if (d.demo) head.append(el("span", "pill demo", "Demo data"));
  box.append(head);

  /* ONE SCALE, ONE HUE, AND THE ONLY NUMBER WRITTEN ON THE CHART IS THE DAY
     THAT EARNED MOST. Seven bars of one series need no legend, and seven
     numbers on seven bars is a table with extra steps. */
  const max = Math.max(1, ...d.days.map((x) => x.cents));
  const best = d.days.reduce((a, b) => (b.cents > a.cents ? b : a), d.days[0]);
  const chart = el("div", "chart");
  for (const day of d.days) {
    const col = el("div", "col");
    const wrapb = el("div", "barwrap");
    const bar = el("div", "bar" + (day === best ? " top" : ""));
    bar.style.height = Math.max(3, (day.cents / max) * 100) + "%";
    if (day === best) bar.append(el("span", "peak", cash(day.cents)));
    wrapb.append(bar);
    col.append(wrapb);
    col.append(el("span", "dlab", new Date(day.day + "T12:00:00").toLocaleDateString(undefined, { weekday: "short" })));
    chart.append(col);
  }
  box.append(chart);

  const nums = el("div", "nums mnums");
  const n = (v, label) => { const x = el("div", "num"); x.append(el("b", null, v), el("span", null, label)); return x; };
  nums.append(n(d.viewers.toLocaleString(), "viewers"));
  nums.append(n(d.plays.toLocaleString(), "episodes played"));
  nums.append(n(d.reached.toLocaleString(), "reached the wall"));
  nums.append(n(d.unlocks.toLocaleString(), "unlocked"));
  nums.append(n(d.reached ? Math.round((d.unlocks / d.reached) * 100) + "%" : "\u2014", "paid at the wall"));
  box.append(nums);
  return box;
}

/* ---- making a show -------------------------------------------------------
   Title, logline, and the episodes underneath, in that order and on one
   screen. A show is one idea; splitting it over three forms is how the idea
   arrives in three pieces. */
function newShowForm() {
  const f = el("div", "card");
  f.append(field("Title", "nsTitle", ""));
  f.append(field("Logline \u2014 one sentence, and it is the thing that sells it", "nsLog", ""));
  const r = el("div", "row");
  r.append(field("Free through episode", "nsFree", 10, "number"));
  r.append(field("Coins per episode", "nsCoins", 60, "number"));
  r.append(field("Whole series (cents)", "nsBundle", 1999, "number"));
  r.append(field("Episodes planned", "nsTotal", 60, "number"));
  f.append(r);

  f.append(Object.assign(el("label"), { textContent: "Episodes \u2014 one per line. Title, a pipe, then the line it ends on." }));
  const ta = document.createElement("textarea");
  ta.id = "nsEps"; ta.rows = 8;
  ta.placeholder = "Double Shift | Eleven weeks, and a number at the bottom of the page she reads twice.\nBooth Nine | Ninety days. Say yes before I change my mind.";
  f.append(ta);

  const go = el("button", "go", "Create the show"); go.type = "button";
  const say = el("p", "say");
  go.addEventListener("click", async () => {
    const v = (id) => document.getElementById(id).value;
    const made = await api("/api/partner/series", {
      title: v("nsTitle"), blurb: v("nsLog"),
      freeThrough: Number(v("nsFree")), coinsPerEpisode: Number(v("nsCoins")),
      bundleCents: Number(v("nsBundle")), totalPlanned: Number(v("nsTotal")),
      genre: "billionaire", art: String(1 + Math.floor(Math.random() * 6)), live: false,
    });
    if (made.status !== 200) { say.textContent = "It needs a title."; return; }
    if (v("nsEps").trim()) await api("/api/partner/bulk", { series: made.data.id, lines: v("nsEps") });
    refresh();
  });
  f.append(go, say);
  f.append(el("p", "muted", "Created as a draft. Set it live from its card below once the episodes have film on them."));
  return f;
}

/* ---- the shape --------------------------------------------------------- */
function shapeRow(s) {
  const wrap = el("div", "shape");
  for (const check of checkShape(s.episodes, s.totalPlanned).checks) {
    const line = el("div", "chk" + (check.ok ? " ok" : ""));
    line.append(el("i"), el("span", null, check.text));
    wrap.append(line);
  }
  return wrap;
}

/* ---- the beat grid ------------------------------------------------------
   One table, every episode, saved in one go. A writer moves three beats and
   renumbers two; five separate saves is five chances for the screen to stop
   matching the disk, and the grid is the unit of work. */
function beatGrid(s) {
  const g = el("div", "gridwrap");
  const head = el("div", "grow ghead");
  for (const h of ["#", "Act", "Function", "Title", "Beat", "Ends on", ""]) head.append(el("div", null, h));
  g.append(head);

  for (const e of s.episodes) {
    const row = el("div", "grow" + (e.n === s.freeThrough ? " wallrow" : ""));
    const box = (tag, val, k) => {
      const i = document.createElement(tag);
      if (tag === "input") i.type = "text";
      i.value = val ?? ""; i.dataset.ep = e.id; i.dataset.k = k;
      return i;
    };
    row.append(box("input", e.n, "n"));
    const pick = (k, values, current) => {
      const sel = document.createElement("select");
      sel.dataset.ep = e.id; sel.dataset.k = k;
      for (const v of values) {
        const o = document.createElement("option");
        o.value = v; o.textContent = v === "" ? "\u2014" : v;
        if (String(current || "") === String(v)) o.selected = true;
        sel.append(o);
      }
      return sel;
    };
    row.append(pick("act", ["", "1", "2", "3"], e.act || ""));
    row.append(pick("function", ["", ...FUNCTIONS], e.function || ""));
    row.append(box("input", e.title, "title"));
    row.append(box("textarea", e.beat, "beat"));
    row.append(box("textarea", e.hook, "hook"));
    const del = el("button", "small", "\u00D7"); del.type = "button"; del.title = "Remove";
    del.addEventListener("click", async () => {
      await api("/api/partner/delete-episode", { id: e.id });
      refresh();
    });
    row.append(del);
    g.append(row);
    if (e.n === s.freeThrough) {
      g.append(el("p", "wallnote", "\u2191 THE WALL. The last free episode, so that closing line is the one that has to be worth " + s.coinsPerEpisode + " coins. Everything under it is paid for."));
    }
  }

  const save = el("button", "go", "Save all beats"); save.type = "button";
  const say = el("p", "say");
  save.addEventListener("click", async () => {
    const by = new Map();
    for (const node of g.querySelectorAll("[data-ep]")) {
      const id = node.dataset.ep;
      if (!by.has(id)) by.set(id, { id });
      const k = node.dataset.k;
      by.get(id)[k] = (k === "n" || k === "act") ? Number(node.value) : node.value;
    }
    const r = await api("/api/partner/beats", { series: s.id, episodes: [...by.values()] });
    if (r.status === 200) refresh();
    else say.textContent = r.data.error === "taken" ? "Two episodes numbered " + r.data.n + "." : "That did not save.";
  });
  g.append(el("div", null, " "), save, say);
  return g;
}

/* ---- ten at once --------------------------------------------------------
   The form was the problem: the same five fields, ten times, for somebody who
   has just worked out what ten episodes are. */
function bulkBox(s) {
  const d = el("details");
  d.append(el("summary", null, "Paste a list of episodes"));
  const box = el("div", "card");
  const ta = document.createElement("textarea");
  ta.id = "bulk" + s.id; ta.rows = 6;
  ta.placeholder = "Booth Nine | Ninety days. Say yes before I change my mind.\nNo | She threw the card away. Then the hospital called.";
  box.append(ta);
  box.append(el("p", "muted", "One per line. Title, a pipe, then the line it ends on \u2014 no pipe is fine, it is all title and the hook can wait. Numbered on from wherever this series has got to."));
  const add = el("button", "go", "Add them"); add.type = "button";
  const say = el("p", "say");
  add.addEventListener("click", async () => {
    const r = await api("/api/partner/bulk", { series: s.id, lines: ta.value });
    if (r.status === 200) refresh();
    else say.textContent = r.data.error === "empty" ? "Nothing in the box." : "That did not save.";
  });
  box.append(add, say);
  d.append(box);
  return d;
}

/* ---- start --------------------------------------------------------------- */
if (key) {
  const r = await api("/api/partner/catalogue");
  if (r.status === 200) draw(r.data); else gate();
} else {
  gate();
}
