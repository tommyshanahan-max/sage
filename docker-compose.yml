name: tomscoding

services:
  workspace:
    build:
      context: ./docker/workspace
    image: tomscoding-workspace:latest
    container_name: tomscoding-workspace
    restart: unless-stopped
    command:
      - --bind-addr
      - 0.0.0.0:8080
      - --disable-telemetry
      - --disable-update-check
      - /home/coder/projects
    environment:
      PASSWORD: ${TOMSCODING_PASSWORD:?set TOMSCODING_PASSWORD in .env}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GIT_AUTHOR_NAME: ${GIT_AUTHOR_NAME:-}
      GIT_AUTHOR_EMAIL: ${GIT_AUTHOR_EMAIL:-}
      GIT_COMMITTER_NAME: ${GIT_AUTHOR_NAME:-}
      GIT_COMMITTER_EMAIL: ${GIT_AUTHOR_EMAIL:-}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - home:/home/coder
    expose:
      - "8080"
    networks:
      - tomscoding
    # A relative weight, not a cap. It only has any effect while both seats
    # want CPU at the same moment: then the scheduler splits time in
    # proportion to these numbers. Whenever one seat is idle the other gets
    # the whole box, which is why this is shares rather than a hard quota —
    # a quota would throttle a seat even on an otherwise empty machine.
    cpu_shares: ${TOMSCODING_CPU_SHARES:-1024}
    # The IDE terminal runs real builds; give it room but don't let it OOM the box.
    deploy:
      resources:
        limits:
          memory: ${TOMSCODING_WORKSPACE_MEMORY:-3g}

  # A second, fully separate seat. Same image, own home volume, own password,
  # own hostname — the two workspaces cannot see each other's files, terminals
  # or editor state. Runs only when COMPOSE_PROFILES includes seat2 (set in
  # .env), so a single-seat deployment spends nothing on it.
  #
  # Same build context and image tag as the primary on purpose: the layer cache
  # makes the second build instant, and it removes any ordering assumption
  # about which service tags the image first.
  workspace-2:
    profiles: ["seat2"]
    build:
      context: ./docker/workspace
    image: tomscoding-workspace:latest
    container_name: tomscoding-workspace-2
    restart: unless-stopped
    command:
      - --bind-addr
      - 0.0.0.0:8080
      - --disable-telemetry
      - --disable-update-check
      - /home/coder/projects
    environment:
      # Not marked required here. Compose interpolates every service before it
      # filters by profile, so a `:?` on this would break single-seat
      # deployments that never start this container. `make up` checks it
      # instead, where the check can be conditional on the profile.
      PASSWORD: ${TOMSCODING_PASSWORD_2:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - home_2:/home/coder
    expose:
      - "8080"
    networks:
      - tomscoding
    # Half the primary's weight: under contention this seat gets roughly a
    # third of the CPU and the primary two thirds. With the primary idle it
    # still gets everything available.
    cpu_shares: ${TOMSCODING_CPU_SHARES_2:-512}
    deploy:
      resources:
        limits:
          memory: ${TOMSCODING_WORKSPACE_2_MEMORY:-1500m}

  # A real browser running on the VPS, with its screen delivered to you over
  # HTTPS. Pages are fetched from Tokyo, so anything the server can reach, you
  # can reach — without a second device.
  #
  # KasmVNC (what this image serves) streams over HTTP and WebSocket, i.e. TCP.
  # That matters here: the WebRTC-based alternatives are lower latency on a good
  # link but run over UDP, which is the unreliable transport on this route.
  #
  # Off unless COMPOSE_PROFILES includes "browser" — a browser is the heaviest
  # thing on this box and most days you will not want it running.
  browser:
    profiles: ["browser"]
    image: lscr.io/linuxserver/firefox:latest
    container_name: tomscoding-browser
    restart: unless-stopped
    environment:
      PUID: 1000
      PGID: 1000
      TZ: ${TZ:-Asia/Shanghai}
      # The image's own HTTP basic auth. Checked by make up, same as the seats.
      CUSTOM_USER: ${TOMSCODING_BROWSER_USER:-tom}
      PASSWORD: ${TOMSCODING_BROWSER_PASSWORD:-}
    volumes:
      - browser_config:/config
    # Browsers put tab memory in /dev/shm and Docker's 64 MB default is far too
    # small — without this, pages crash rather than load slowly. But shm counts
    # against the container's memory limit, so this and the ceiling below are
    # one budget, not two: 1g of shm against a 1g ceiling lets a few heavy tabs
    # fill the whole allowance on their own, and the kernel then kills Firefox
    # while the container keeps running. That is what a black screen is.
    shm_size: ${TOMSCODING_BROWSER_SHM:-512m}
    expose:
      - "3000"
    networks:
      - tomscoding
    deploy:
      resources:
        limits:
          memory: ${TOMSCODING_BROWSER_MEMORY:-1g}
    cpu_shares: ${TOMSCODING_BROWSER_CPU_SHARES:-512}
    # The failure mode is Firefox dying while the container stays up: the web
    # server keeps answering, so you get a black screen rather than an error.
    # Probing the HTTP port would report healthy through exactly that. This
    # walks /proc for a firefox process instead — the thing that actually went
    # away — written against /proc rather than pgrep because the image is not
    # guaranteed to carry procps.
    #
    # It reads comm and exe, never cmdline: this check's own command line
    # contains the word "firefox", so a cmdline match would find itself and
    # report healthy forever.
    healthcheck:
      test:
        - CMD-SHELL
        - 'for p in /proc/[0-9]*; do case "$$(cat $$p/comm 2>/dev/null)" in firefox*) exit 0;; esac; case "$$(readlink $$p/exe 2>/dev/null)" in */firefox*) exit 0;; esac; done; exit 1'
      interval: 30s
      timeout: 10s
      retries: 3
      # A cold start brings up a desktop session before the browser appears.
      start_period: 120s
    labels:
      # Read by autoheal, below. Nothing else acts on health status.
      autoheal: "true"

  # Compose, unlike Swarm, does nothing when a container goes unhealthy — it
  # records the status and leaves it running. This is the small daemon that
  # acts on it: every 30s it asks Docker for unhealthy containers labelled
  # autoheal=true and restarts them. In practice that is the same
  # `docker compose restart browser` you would otherwise type, done for you.
  #
  # It needs the Docker socket, which is root on the host — mounting it into a
  # container gives that container full control of the daemon. That is accepted
  # here because this one publishes no port, has no inbound path and has a
  # fixed job; it is not somewhere to add things casually. See docs/security.md.
  autoheal:
    profiles: ["browser"]
    # Pinned, not :latest. Everything else here can float; a container holding
    # the Docker socket should not change under you without your saying so.
    image: willfarrell/autoheal:1.2.0
    container_name: tomscoding-autoheal
    restart: unless-stopped
    environment:
      AUTOHEAL_CONTAINER_LABEL: autoheal
      AUTOHEAL_INTERVAL: 30
      # Leave a restarted container alone long enough to come back, so a slow
      # start is never read as a second failure and restarted again.
      AUTOHEAL_START_PERIOD: 120
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - tomscoding
    deploy:
      resources:
        limits:
          memory: 64m

  # A chat interface of our own, in front of the Claude Agent SDK. The browser
  # talks only to this container; this container calls Anthropic with an API
  # key. Nothing about the agent reaches the internet from the viewer's side.
  #
  # Off unless COMPOSE_PROFILES includes "agent", and useless without
  # ANTHROPIC_API_KEY — `make up` checks for it.
  agent:
    profiles: ["agent"]
    build:
      context: ./agent
    image: tomscoding-agent:latest
    container_name: tomscoding-agent
    restart: unless-stopped
    # Runs as the workspace's own user so that files the agent creates are
    # owned by `coder` and stay editable in the IDE. Root-owned files in a
    # shared workspace look fine until the editor refuses to save.
    user: "1000:1000"
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AGENT_MODEL: ${TOMSCODING_AGENT_MODEL:-}
      AGENT_PASSWORD: ${TOMSCODING_AGENT_PASSWORD:-}
      # Voice, both directions. Optional: with no key the microphone is simply
      # not offered, and everything else is unchanged. The browser never talks
      # to the speech provider — this server does, from Tokyo, which is the
      # only reason it is reachable at all.
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
      AGENT_VOICE_ID: ${TOMSCODING_AGENT_VOICE_ID:-}
      # Today's numbers in the masthead. Reached over the Docker network, so
      # this is the container name rather than the public hostname — the
      # request never leaves the box.
      AGENT_NUMBERS_URL: ${TOMSCODING_AGENT_NUMBERS_URL:-}
      AGENT_NUMBERS_TOKEN: ${TOMSCODING_STATS_INTERNAL_TOKEN:-}
      AGENT_NUMBERS_LINK: ${TOMSCODING_STATS_DOMAIN:+https://${TOMSCODING_STATS_DOMAIN}}
      # Study Pal's admin key, for the story desk. Deliberately on THIS service
      # and not on the partner seats below: they run the same image, and a
      # variable added to the wrong block is a business partner with publish
      # rights over a live catalogue. The route checks the seat as well — two
      # locks, because this one is easy to copy-paste into the wrong place.
      STUDYPAL_ADMIN_KEY: ${TOMSCODING_STUDYPAL_KEY:-}
      STUDYPAL_BASE: ${TOMSCODING_PARTNER_APP_URL:-https://liuxuesheng.help}
      # The live application, beside the conversation. This was missing, and the
      # panel had an "App" tab that could never load anything: the tab was drawn
      # unconditionally, appUrl was always empty, and the resulting blank frame
      # read as a site refusing to be framed. Defaulted rather than left unset,
      # because the answer for this deployment is not in doubt.
      AGENT_APP_URL: ${TOMSCODING_AGENT_APP_URL:-https://liuxuesheng.help}
      # Where each project can be seen running, as name=url pairs. Clicking a
      # project opens its own app rather than the seat's one address — which
      # could only ever be right for one project. A project with no entry falls
      # back to AGENT_APP_URL, and the panel says so rather than showing a blank
      # frame.
      #
      #   TOMSCODING_PROJECT_APPS="study-pal=https://liuxuesheng.help"
      #
      # A map and not a guess: a dev server started inside that container has no
      # host port and is not reachable from a browser, so an inferred address
      # would be exactly the plausible wrong URL that becomes a bug report.
      AGENT_PROJECT_APPS: ${TOMSCODING_PROJECT_APPS:-}
      # Video generation — Seedance, on ByteDance's international arm.
      #
      # BytePlus rather than Volcengine: the mainland console wants a Chinese
      # entity and real-name verification, and the international one takes a
      # foreign company and an ordinary card. Same models either way.
      #
      # The base URL and the model are configuration and not constants because
      # the API shape here was assembled from secondary sources — the official
      # reference was unreachable when this was written — so a change on their
      # side should be a line in .env, not a deploy.
      ARK_API_KEY: ${TOMSCODING_ARK_API_KEY:-}
      ARK_BASE: ${TOMSCODING_ARK_BASE:-https://ark.ap-southeast.bytepluses.com}
      # An endpoint id (`ep-m-…`), not a model name. A model name is refused even
      # when the console says the model is activated — see env.tomscoding for
      # the two error messages and where to find the endpoint. No default,
      # because a wrong default here looks like a working configuration.
      ARK_VIDEO_MODEL: ${TOMSCODING_ARK_VIDEO_MODEL:-}
      # Job records and the day's counter. The videos themselves are written
      # into the project they are for, not here.
      AGENT_VIDEO_DIR: /home/coder/.sage/video
      # A ceiling on clips per day. This is the one feature that costs real
      # money per press, and a retry loop with no ceiling is an invoice rather
      # than a message.
      AGENT_VIDEO_DAILY_LIMIT: ${TOMSCODING_VIDEO_DAILY_LIMIT:-20}
      # The word the owner's seat asks for when it reaches a decision that is
      # his rather than its own. Not a permission — this seat could already do
      # everything, and a partner seat still cannot whatever it is told, because
      # the limits are mounts and a tool deny list. It exists so a judgement
      # call is one question instead of a negotiation. Deliberately NOT on the
      # partner seats below: they run the same image, and a seat that could be
      # talked into another seat's access is the one thing this design is for.
      AGENT_CLEARANCE_WORD: ${TOMSCODING_AGENT_CLEARANCE_WORD:-}
      # Where the deploy leaves its account of what changed. `make up` writes
      # .platform-state/changes.json and mounts that directory below, so the
      # agent knows the platform's recent history instead of waking up with no
      # idea what moved. Deliberately not on the partner seats: it describes
      # how this box is built.
      AGENT_PLATFORM_DIR: /srv/platform
      # Same home as the IDE, so the SDK picks up ~/.claude/CLAUDE.md — the
      # agent works to the same instructions as the CLI rather than to none.
      HOME: /home/coder
      AGENT_WORKSPACE: /home/coder/projects
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      # The same volume the IDE uses, not a private one. An agent that cannot
      # reach your projects can code, but never on anything you care about;
      # git is what protects the files, not a wall between containers.
      - home:/home/coder
      # One generated file, read-only: the deploy's list of recent commits.
      #
      # This is a directory and not the repository on purpose. Mounting the
      # repository would have told the agent everything it needs and also
      # handed it `.env`, which holds every secret on this box — the API keys,
      # the partner passwords, Study Pal's admin key. A digest with commit
      # subjects and paths in it carries none of that.
      - ./.platform-state:/srv/platform:ro
    expose:
      - "3000"
    networks:
      - tomscoding
    deploy:
      resources:
        limits:
          memory: ${TOMSCODING_AGENT_MEMORY:-1g}
    cpu_shares: ${TOMSCODING_AGENT_CPU_SHARES:-512}

  # A seat for someone who is not you.
  #
  # Same image as the agent, configured as a partner: it can read a snapshot of
  # one project and write mockups, and that is the whole of it. The limits are
  # in this block, not in a prompt —
  #
  #   * the source is bind-mounted `:ro`, so a write to it fails at the kernel
  #   * the only writable path is the mockups volume
  #   * its home is its own volume, not the workspace's, so there are no git
  #     credentials in it and nothing to push with
  #   * no host ports, same as everything else — only Caddy can reach it
  #
  # The snapshot only moves when you move it: `make partner-sync` replaces it
  # with a chosen branch and records which commit that was. Nothing the partner
  # does can advance it, and nothing you do here reaches your workspace.
  partner:
    profiles: ["partner"]
    build:
      context: ./agent
    image: tomscoding-agent:latest
    container_name: tomscoding-partner
    restart: unless-stopped
    user: "1000:1000"
    environment:
      AGENT_ROLE: partner
      # The story desk, granted rather than inherent. Set
      # TOMSCODING_PARTNER_STORIES=1 to let this seat write and publish stories;
      # delete the line to take it back. Note what the second variable does: the
      # key is passed ONLY while the grant is on, so with it off the credential
      # is not in this container at all. The route checks the flag too — code
      # can be edited, but an absent secret cannot be argued with.
      AGENT_STORIES: ${TOMSCODING_PARTNER_STORIES:-}
      STUDYPAL_ADMIN_KEY: ${TOMSCODING_PARTNER_STORIES:+${TOMSCODING_STUDYPAL_KEY}}
      STUDYPAL_BASE: ${TOMSCODING_PARTNER_APP_URL:-https://liuxuesheng.help}
      # Asked for before anything on this seat reaches readers — publishing a
      # series or deleting one. Checked by the route, not by the page and not by
      # a prompt, so the browser console cannot skip it and the agent cannot be
      # argued out of it. Not passed to the owner's seat: he is not asked for a
      # word before publishing his own catalogue.
      AGENT_PUBLISH_WORD: ${TOMSCODING_PARTNER_PUBLISH_WORD:-}
      # The numbers, granted the same way as the desk. Set
      # TOMSCODING_PARTNER_NUMBERS=1 to show this seat the readout and the full
      # dashboard behind it; delete the line to take it back.
      #
      # Note what the second and third variables do: the address and the shared
      # token are passed ONLY while the grant is on, so with it off this
      # container cannot reach the counter at all — the seat check is code, and
      # code gets edited, but an absent credential cannot be argued with.
      #
      # Be clear what this hands over. Not just today's count: where people are,
      # how they arrived, which share link sent them, day by day, for both
      # products. For a marketing partner that is the job; for anyone else it is
      # the business's state of health.
      # Video generation, granted the same way. The reason here is money rather
      # than secrecy: every press costs at the provider, and a seat held by
      # someone else spending on your card is a decision, not a default. The
      # key is passed only while the grant is on, so with it off that container
      # cannot generate anything even if the check were edited away.
      AGENT_VIDEO: ${TOMSCODING_PARTNER_VIDEO:-}
      ARK_API_KEY: ${TOMSCODING_PARTNER_VIDEO:+${TOMSCODING_ARK_API_KEY}}
      ARK_BASE: ${TOMSCODING_ARK_BASE:-https://ark.ap-southeast.bytepluses.com}
      ARK_VIDEO_MODEL: ${TOMSCODING_ARK_VIDEO_MODEL:-}
      # Its own state directory and its own ceiling — a partner's clips do not
      # come out of the owner's day.
      AGENT_VIDEO_DIR: /work/mockups/.video
      AGENT_VIDEO_DAILY_LIMIT: ${TOMSCODING_PARTNER_VIDEO_LIMIT:-6}
      AGENT_NUMBERS: ${TOMSCODING_PARTNER_NUMBERS:-}
      AGENT_NUMBERS_URL: ${TOMSCODING_PARTNER_NUMBERS:+${TOMSCODING_AGENT_NUMBERS_URL}}
      AGENT_NUMBERS_TOKEN: ${TOMSCODING_PARTNER_NUMBERS:+${TOMSCODING_STATS_INTERNAL_TOKEN}}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AGENT_MODEL: ${TOMSCODING_AGENT_MODEL:-}
      AGENT_USER: ${TOMSCODING_PARTNER_USER:-Brendan}
      AGENT_PASSWORD: ${TOMSCODING_PARTNER_PASSWORD:-}
      AGENT_PROJECT_LABEL: ${TOMSCODING_PARTNER_PROJECT:-Liuxuesheng}
      # Its own home, deliberately empty of everything: no ~/.claude from the
      # workspace, no git identity, no API keys but the one above.
      HOME: /work/home
      AGENT_WORKSPACE: /work
      AGENT_MOCKUPS_DIR: /work/mockups
      # Documents he may read, named one by one. A list, never a folder scan:
      # a docs directory holds working notes as readily as it holds anything
      # meant for someone else, and under a scan every new file publishes
      # itself. See lib/docs.js.
      AGENT_DOCS_ROOT: /work/app
      AGENT_DOCS: ${TOMSCODING_PARTNER_DOCS:-}
      # The live app, shown beside the conversation. Optional.
      AGENT_APP_URL: ${TOMSCODING_PARTNER_APP_URL:-}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
      AGENT_VOICE_ID: ${TOMSCODING_AGENT_VOICE_ID:-}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      # The snapshot. Read-only is the control; everything else is convenience.
      - ./partner/source:/work/app:ro
      - partner_mockups:/work/mockups
      - partner_home:/work/home
    expose:
      - "3000"
    networks:
      # Deliberately NOT on the tomscoding network. Everything else here can
      # reach everything else by service name; this seat reaches nothing. Its
      # agent has no tool that opens a socket, but that is a soft control — the
      # network is the hard one, and a partner container that cannot resolve
      # `workspace` cannot be talked into reaching it.
      - partner_net
    deploy:
      resources:
        limits:
          memory: ${TOMSCODING_PARTNER_MEMORY:-768m}
    cpu_shares: ${TOMSCODING_PARTNER_CPU_SHARES:-256}

  # A second partner seat. Same image, own everything: own login, own snapshot,
  # own mockups, own hostname. The two cannot see each other's work or each
  # other's repositories — which is the reason to run two containers rather
  # than two accounts in one.
  #
  # Same shape as workspace-2 next to workspace, for the same reason: when a
  # second one is a copy rather than a fork, a fix to either is a fix to both.
  partner-2:
    profiles: ["partner2"]
    build:
      context: ./agent
    image: tomscoding-agent:latest
    container_name: tomscoding-partner-2
    restart: unless-stopped
    user: "1000:1000"
    environment:
      # "partner" or "prospect". Same limits either way — the mounts and the
      # deny list do not change — but a prospect seat is a link given to
      # somebody deciding whether to work with you at all, so Sage makes the
      # case for the product and refuses the commercial questions that are the
      # owner's to answer.
      AGENT_ROLE: ${TOMSCODING_PARTNER2_ROLE:-partner}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AGENT_MODEL: ${TOMSCODING_AGENT_MODEL:-}
      AGENT_USER: ${TOMSCODING_PARTNER2_USER:-}
      AGENT_PASSWORD: ${TOMSCODING_PARTNER2_PASSWORD:-}
      AGENT_PROJECT_LABEL: ${TOMSCODING_PARTNER2_PROJECT:-the project}
      HOME: /work/home
      AGENT_WORKSPACE: /work
      AGENT_MOCKUPS_DIR: /work/mockups
      AGENT_DOCS_ROOT: /work/app
      AGENT_DOCS: ${TOMSCODING_PARTNER2_DOCS:-}
      AGENT_APP_URL: ${TOMSCODING_PARTNER2_APP_URL:-}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
      AGENT_VOICE_ID: ${TOMSCODING_AGENT_VOICE_ID:-}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - ./partner/source-2:/work/app:ro
      - partner2_mockups:/work/mockups
      - partner2_home:/work/home
    expose:
      - "3000"
    networks:
      # Its own network, not the first partner's. Two seats that cannot reach
      # the estate should not be able to reach each other either.
      - partner2_net
    deploy:
      resources:
        limits:
          memory: ${TOMSCODING_PARTNER2_MEMORY:-768m}
    cpu_shares: ${TOMSCODING_PARTNER2_CPU_SHARES:-256}

  caddy:
    image: caddy:2-alpine
    container_name: tomscoding-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      TOMSCODING_DOMAIN: ${TOMSCODING_DOMAIN:?set TOMSCODING_DOMAIN in .env}
      TOMSCODING_ACME_EMAIL: ${TOMSCODING_ACME_EMAIL:?set TOMSCODING_ACME_EMAIL in .env}
      # The fallbacks live here, not in the Caddyfile. Caddy's {$VAR:default}
      # substitutes the default only when the variable is *unset* — a variable
      # that is set to an empty string stays empty, and an empty site address
      # is a config error that stops Caddy serving anything at all, including
      # the sites that were configured correctly. Compose cannot omit a
      # variable conditionally, so it supplies a real hostname instead.
      # These are .localhost names: Caddy treats them as internal, never takes
      # them to Let's Encrypt, and they must stay distinct from each other.
      TOMSCODING_LANDING_DOMAIN: ${TOMSCODING_LANDING_DOMAIN:-landing.localhost}
      TOMSCODING_DOMAIN_2: ${TOMSCODING_DOMAIN_2:-seat2.localhost}
      TOMSCODING_BROWSER_DOMAIN: ${TOMSCODING_BROWSER_DOMAIN:-browser.localhost}
      TOMSCODING_AGENT_DOMAIN: ${TOMSCODING_AGENT_DOMAIN:-agent.localhost}
      TOMSCODING_PARTNER_DOMAIN: ${TOMSCODING_PARTNER_DOMAIN:-partner.localhost}
      TOMSCODING_PARTNER2_DOMAIN: ${TOMSCODING_PARTNER2_DOMAIN:-partner2.localhost}
      TOMSCODING_BRAND_DOMAIN: ${TOMSCODING_BRAND_DOMAIN:-brand.localhost}
      TOMSCODING_BRAND_WWW: ${TOMSCODING_BRAND_WWW:-www.brand.localhost}
      TOMSCODING_STATS_DOMAIN: ${TOMSCODING_STATS_DOMAIN:-stats.localhost}
      # Not an address — the brand page's template reads it to decide whether
      # to include the counting snippet at all. Empty means nothing is counted,
      # which is exactly when the snippet should not be on the page.
      TOMSCODING_STATS_SITES: ${TOMSCODING_STATS_SITES:-}
      # Read by the brand page's template rather than by a site address, so an
      # empty value here is harmless — the page falls back in its own markup.
      TOMSCODING_BRAND_APP_DOMAIN: ${TOMSCODING_BRAND_APP_DOMAIN:-}
      TOMSCODING_BRAND_NAME: ${TOMSCODING_BRAND_NAME:-}
      TOMSCODING_BRAND_HANZI: ${TOMSCODING_BRAND_HANZI:-}
      TOMSCODING_BRAND_TAGLINE: ${TOMSCODING_BRAND_TAGLINE:-}
      TOMSCODING_BRAND_BLURB: ${TOMSCODING_BRAND_BLURB:-}
      # The seats' names appear on the brand page's admin list, so a person
      # sees their own name on the door rather than a numbered slot.
      TOMSCODING_PARTNER_USER: ${TOMSCODING_PARTNER_USER:-}
      TOMSCODING_PARTNER2_USER: ${TOMSCODING_PARTNER2_USER:-}
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./docker/conf.d:/etc/caddy/conf.d:ro
      - ./docker/sites:/etc/caddy/sites:ro
      - ./landing:/srv/landing:ro
      - ./brand:/srv/brand:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - workspace
    networks:
      # The only thing on both. It is the single path in to the partner seat,
      # and the seat has no path onward.
      - tomscoding
      - partner_net
      - partner2_net

  # The counter.
  #
  # Its own container rather than a route on the agent: this is the one endpoint
  # here that has to answer an unauthenticated request from the open internet,
  # and the agent is a password away from an API key and a partner's seat.
  #
  # Caddy reaches it two ways — the whole app on the stats hostname, behind a
  # password, and just the two public paths under /a/ on the brand page, so a
  # page can report without the dashboard being on that origin at all.
  analytics:
    profiles: ["analytics"]
    build:
      context: ./analytics
    image: tomscoding-analytics:latest
    container_name: tomscoding-analytics
    restart: unless-stopped
    # Not root. The image creates /data owned by this uid, and Docker carries
    # that ownership into a fresh named volume — without it the first write to
    # a root-owned volume fails and every count is silently lost.
    user: "1000:1000"
    environment:
      ANALYTICS_USER: ${TOMSCODING_STATS_USER:-}
      ANALYTICS_PASSWORD: ${TOMSCODING_STATS_PASSWORD:-}
      # The sites allowed to report. An origin not on this list is not counted,
      # which is what stops someone else's page appearing in your numbers.
      ANALYTICS_SITES: ${TOMSCODING_STATS_SITES:-}
      # "Today" means the owner's day. A UTC boundary in Asia cuts the evening
      # in half, which is the busiest part of it.
      ANALYTICS_TZ: ${TZ:-Asia/Shanghai}
      ANALYTICS_RETAIN_DAYS: ${TOMSCODING_STATS_RETAIN_DAYS:-400}
      # Lets the agent read the numbers for its masthead, over the Docker
      # network. Never sent to a browser.
      ANALYTICS_INTERNAL_TOKEN: ${TOMSCODING_STATS_INTERNAL_TOKEN:-}
      # The app's own count, read from its public endpoint and shown beside
      # this counter's — never merged into it. The app counts itself because a
      # page in mainland China cannot rely on reaching anything else.
      ANALYTICS_APP_COUNT_URL: ${TOMSCODING_APP_COUNT_URL:-}
      # The app's second endpoint: which features were called, on how many
      # days, by how many separate people, and how many of them ever came
      # back. Everything the count endpoint cannot say.
      #
      # Secret-gated, so it is read here and never by a browser — the same key
      # the agent uses for the story desk, reused rather than issued twice
      # because it is the same app and a second key is a second thing to
      # rotate. Unset, the panels report a switch that is off rather than a
      # product nobody uses.
      #
      # Defaulted rather than left blank, because .env on a running box was
      # copied from the preset once and does not grow a new line when the
      # preset does. A setting that only works after somebody edits a file on
      # the server is a setting that is off — which looks exactly like a
      # product nobody uses. Overridable in .env for any other deployment,
      # and the key below is still the lock: no key, no read.
      ANALYTICS_APP_USAGE_URL: ${TOMSCODING_APP_USAGE_URL:-https://liuxuesheng.help/api/usage?app=studypal}
      ANALYTICS_APP_USAGE_KEY: ${TOMSCODING_STUDYPAL_KEY:-}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - analytics_data:/data
    expose:
      - "3000"
    networks:
      - tomscoding
      # And the partner network, so a seat granted the numbers can actually
      # reach the counter. The grant alone was not enough: that seat is on a
      # network of its own precisely so it can resolve nothing, and the readout
      # failed silently because the address did not exist for it.
      #
      # This is the narrow way round. The alternative — putting the partner on
      # the main network — would hand it `workspace`, `agent` and every other
      # service by name, which is what that network exists to prevent. Reaching
      # in from this side adds exactly one reachable address to that seat and
      # leaves the rest unresolvable.
      #
      # Attached whether or not the grant is on, because a network cannot be
      # switched by a variable. That costs nothing: /api/stats needs the shared
      # token, which compose passes only while the grant is on, and the
      # collection endpoint is public to any browser already.
      - partner_net
    deploy:
      resources:
        limits:
          memory: ${TOMSCODING_STATS_MEMORY:-256m}
    cpu_shares: ${TOMSCODING_STATS_CPU_SHARES:-128}

networks:
  tomscoding:
    driver: bridge
  # Caddy, the partner seat, and the counter — the last of those so a seat
  # granted the numbers can read them. The partner still joins nothing else, and
  # nothing else joins this: `workspace`, `agent` and the second partner remain
  # names that do not resolve from in there, which is the whole point.
  partner_net:
    driver: bridge
  partner2_net:
    driver: bridge

volumes:
  home:
  home_2:
  partner_mockups:
  partner_home:
  partner2_mockups:
  partner2_home:
  browser_config:
  caddy_data:
  caddy_config:
  analytics_data:
