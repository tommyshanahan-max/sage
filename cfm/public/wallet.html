<body>
<main>
  <div class="top">
    <button class="ib hide" type="button" id="back" aria-label="Back"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 19l-7-7 7-7"/></svg></button>
    <h1 id="title" tabindex="-1">Wallet</h1>

  </div>

<script type="module">
/* The wallet's screens, over the wallet API (board/lib/wallet/routes.js).
   A screen is a function returning { title, body, back?, action? }; the hash
   is the address; the server is the only thing that decides anything. */

const $ = (id) => document.getElementById(id);
let device = "";
try { device = localStorage.getItem("board:device") || ""; } catch { /* private window */ }

function h(tag, attrs, ...kids) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v === false || v == null) continue;
    if (k === "class") n.className = v; else if (k === "text") n.textContent = v;

  for (const c of kids.flat()) if (c != null && c !== false) n.append(c instanceof Node ? c : document.createTextNode(c));
  return n;
}
const ICON = {
  chev: '<path d="M9 5l7 7-7 7"/>', check: '<path d="M5 12.5l4.5 4.5L19 7.5"/>', gear: '<circle cx="12" cy="12" r="3.2"/><path d="M12 2.8v2.4M12 18.8v2.4M4.2 7.5l2.1 1.2M17.7 15.3l2.1 1.2M4.2 16.5l2.1-1.2M17.7 8.7l2.1-1.2"/>',
  send: '<path d="M5 12h14M13 6l6 6-6 6"/>', req: '<path d="M12 5v14M6 13l6 6 6-6"/>', add: '<path d="M12 5v14M5 12h14"/>', out: '<path d="M4 20h16M12 16V4M7 9l5-5 5 5"/>',
};
const svg = (name, cls) => { const s = document.createElementNS("http://www.w3.org/2000/svg", "svg"); s.setAttribute("viewBox", "0 0 24 24"); s.setAttribute("aria-hidden", "true"); if (cls) s.setAttribute("class", cls); s.innerHTML = ICON[name]; return s; };
const say = (t) => { const n = $("live"); n.textContent = ""; setTimeout(() => { n.textContent = t; }, 50); };
const frag = (...k) => { const f = document.createDocumentFragment(); for (const x of k.flat()) if (x) f.append(x); return f; };
const btn = (text, cls, onclick, extra = {}) => h("button", { class: "btn" + (cls ? " " + cls : ""), type: "button", onclick, ...extra, text });
const note = (cls, ...kids) => h("p", { class: "note " + cls }, ...kids);
const badge = (text, cls) => h("span", { class: "badge" + (cls ? " " + cls : ""), "aria-hidden": "true", text });
const face = (name) => badge([...String(name || "?")][0].toUpperCase(), "face");
function row(o) {
  if (!o.onclick && o.radio === undefined) {
    return h("div", { class: "row" }, o.lead, h("span", { class: "m" }, h("b", { text: o.title }), o.sub ? h("span", { text: o.sub }) : null), o.end ? h("span", { class: "e" + (o.in ? " in" : ""), text: o.end }) : null);
  }
  const b = h("button", { class: "row", type: "button", onclick: o.onclick, role: o.radio !== undefined ? "radio" : null, "aria-checked": o.radio !== undefined ? String(o.radio) : null, disabled: o.disabled });
  b.append(...[o.lead, h("span", { class: "m" }, h("b", { text: o.title }), o.sub ? h("span", { text: o.sub }) : null), o.end ? h("span", { class: "e" + (o.in ? " in" : ""), text: o.end }) : null].filter(Boolean));
  b.append(o.radio !== undefined ? svg("check", "tick") : svg("chev", "chev"));
  return b;
}
const steps = (n, of) => h("div", { class: "steps", role: "img", "aria-label": `Step ${n} of ${of}` }, ...Array.from({ length: of }, (_, i) => h("i", { class: i < n ? "on" : "" })));
const spinner = (label) => frag(h("div", { class: "spin", role: "img", "aria-label": label }), h("p", { class: "center lead", text: label }));

/* ---- talking to the server ---- */
class ApiError extends Error { constructor(status, body) { super(body?.message || "Something went wrong."); this.status = status; this.code = body?.error; } }
async function api(path, body, method) {
  const res = await fetch(path, {
    method: method || (body ? "POST" : "GET"), cache: "no-store",
    headers: { "x-board-device": device, ...(body ? { "Content-Type": "application/json" } : {}) },
    body: body ? JSON.stringify(body) : undefined,
  });
  const d = await res.json().catch(() => ({}));
  if (!res.ok) throw new ApiError(res.status, d);
  return d;
}
let W = null;  // the last /api/wallet
async function load() { W = await api("/api/wallet"); return W; }

/* ---- passkeys: Face ID or the phone's passcode ---- */
const b64u = { enc: (buf) => btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, ""),
  dec: (s) => { s = s.replace(/-/g, "+").replace(/_/g, "/"); while (s.length % 4) s += "="; return Uint8Array.from(atob(s), (c) => c.charCodeAt(0)); } };
const canPasskey = () => Boolean(window.PublicKeyCredential && navigator.credentials);
async function addPasskey() {
  const { challengeId, options: o } = await api("/api/wallet/passkey/options", {});
  const cred = await navigator.credentials.create({ publicKey: {
    ...o, challenge: b64u.dec(o.challenge), user: { ...o.user, id: b64u.dec(o.user.id) },
    excludeCredentials: (o.excludeCredentials || []).map((c) => ({ ...c, id: b64u.dec(c.id) })),
  } });
  const r = cred.response;
  await api("/api/wallet/passkey/register", { challengeId, response: {
    id: cred.id, rawId: b64u.enc(cred.rawId), type: cred.type, clientExtensionResults: cred.getClientExtensionResults(),
    response: { clientDataJSON: b64u.enc(r.clientDataJSON), attestationObject: b64u.enc(r.attestationObject), transports: r.getTransports ? r.getTransports() : [] },
  } });
}
/** A confirmation for exactly this action, or null if the person backed out. */
async function confirmFor(action, ref) {
  if (W.testConfirm && (!canPasskey() || !W.wallet?.passkeys)) return { test: true };
  if (!W.wallet?.passkeys) {
    if (!canPasskey()) throw new ApiError(400, { message: "This browser can't use Face ID. Open the Exchange in Safari or Chrome to pay." });
    await addPasskey(); await load();
  }
  const { challengeId, options: o, needsPasskey } = await api("/api/wallet/confirm/options", { action, ref });
  if (needsPasskey) throw new ApiError(400, { message: "Set up Face ID for the wallet first." });
  let a;
  try {
    a = await navigator.credentials.get({ publicKey: { ...o, challenge: b64u.dec(o.challenge), allowCredentials: (o.allowCredentials || []).map((c) => ({ ...c, id: b64u.dec(c.id) })) } });
  } catch { return null; }
  const r = a.response;
  return { challengeId, response: { id: a.id, rawId: b64u.enc(a.rawId), type: a.type, clientExtensionResults: a.getClientExtensionResults(),
    response: { clientDataJSON: b64u.enc(r.clientDataJSON), authenticatorData: b64u.enc(r.authenticatorData), signature: b64u.enc(r.signature), userHandle: r.userHandle ? b64u.enc(r.userHandle) : undefined } } };
}
function confirmButton(label, cls, action, ref, run) {
  const words = W.testConfirm && (!canPasskey() || !W.wallet?.passkeys) ? "Confirm (test mode)" : "Confirm with Face ID";
  const b = btn(words, cls, async () => {
    b.disabled = true; const was = b.textContent; b.textContent = "Confirming…"; say("Confirming.");
    try {
      const c = await confirmFor(action, ref);
      if (!c) { b.disabled = false; b.textContent = was; say("Not confirmed."); return; }
      await run(c);
    } catch (err) { b.disabled = false; b.textContent = was; showError(err); }
  });
  b.setAttribute("aria-label", `${label}. ${words}`);
  return b;
}

/* ---- errors, said where they happened ---- */
let errBox = null;
function showError(err) {
  const msg = err instanceof ApiError ? err.message : "Couldn't reach the Exchange. Check your connection and try again.";
  if (errBox && document.contains(errBox)) errBox.remove();
  errBox = note("bad", msg);
  errBox.setAttribute("role", "alert");
  $("screen").prepend(errBox);
  $("screen").scrollTop = 0; window.scrollTo(0, 0);
  // Some refusals are a step to take, not a dead end.
  if (err.code === "not_verified") errBox.append(" ", h("button", { type: "button", class: "chip", onclick: () => go("verify"), text: "Confirm identity" }));
  if (err.code === "no_payout") errBox.append(" ", h("button", { type: "button", class: "chip", onclick: () => go("payout"), text: "Add bank account" }));
  if (err.code === "no_wallet") errBox.append(" ", h("button", { type: "button", class: "chip", onclick: () => go("setup"), text: "Set up wallet" }));
  if (["quote_expired", "quote_used", "quote_unknown"].includes(err.code)) errBox.append(" ", h("button", { type: "button", class: "chip", onclick: () => history.back(), text: "Check the amount again" }));
}

/* ---- router ---- */
const route = () => { const raw = location.hash.replace(/^#/, ""); const [path, qs] = raw.split("?"); return { parts: (path || "home").split("/"), q: new URLSearchParams(qs || "") }; };
const go = (path) => { location.hash = path; };
const replace = (path) => { history.replaceState(null, "", "#" + path); paint(); };
window.addEventListener("hashchange", () => paint());
$("back").addEventListener("click", () => history.back());

/* Coming back from the provider's own page lands on #…&back=ref; drop that
   and pick up where the person left off. */
function returning() {
  if (!/(^|[#&?])back=/.test(location.hash)) return false;
  const where = sessionStorage.getItem("wallet:return") || "home";
  sessionStorage.removeItem("wallet:return");
  history.replaceState(null, "", "#" + where);
  return true;
}
function leaveFor(url, returnTo) {
  sessionStorage.setItem("wallet:return", returnTo);
  location.assign(url);
}

async function paint() {
  const back = returning();
  const { parts, q } = route();
  const name = parts[0];
  const scr = SCREENS[name] || SCREENS.home;
  $("screen").textContent = "";
  $("screen").append(spinner("Loading"));
  let out;
  try {
    if (!W || back || scr.fresh !== false) await load();
    out = await scr(parts.slice(1), q);
  } catch (err) {
    if (err instanceof ApiError && err.status === 401) out = { title: "Wallet", body: frag(note("info", "The wallet is for members. Once your page is up on the board, it's here."), h("a", { class: "btn ghost", href: "/notes", text: "Back to Messages" })) };
    else if (err instanceof ApiError && err.status === 404) out = { title: "Wallet", body: frag(note("info", "The wallet isn't switched on here yet.")) };
    else { out = { title: "Wallet", body: frag() }; setTimeout(() => showError(err)); }
  }

/* ---- words for states ---- */
const STEP = {
  sent: "Sent", charged: "Paid", accepted: "Accepted", in_review: "Being checked", paying_out: "On its way to the bank",
  completed: "Done", declined: "Declined — money returned", cancelled: "Cancelled — money returned", returned: "Not accepted in 24 hours — money returned",
  failed: "Payment didn't go through", payout_failed: "The bank payment failed — we'll be in touch", started: "Started",
};
const STATUS = {
  charging: ["Waiting for the bank's approval", "wait"], waiting: ["Waiting to be accepted", "wait"], paying_out: ["On its way", "wait"], processing: ["On its way", "wait"],
  completed: ["Done", ""], declined: ["Declined", "bad"], cancelled: ["Cancelled", "bad"], returned: ["Returned", "bad"], failed: ["Failed", "bad"], payout_failed: ["Needs attention", "bad"],
  open: ["Open", "wait"], paid: ["Paid", ""],
};
const when = (iso) => { const d = new Date(iso); const today = new Date().toDateString() === d.toDateString(); return today ? d.toLocaleTimeString(undefined, { hour: "2-digit", minute: "2-digit" }) : d.toLocaleDateString(undefined, { day: "numeric", month: "short" }); };
const sym = () => ({ EUR: "€", AUD: "A$", CNY: "¥", HKD: "HK$", USD: "US$" }[W.wallet?.currency] || "");

function amountEntry(initial, onChange, label) {
  let v = initial || "";
  const clean = (s) => { s = String(s).replace(/[^\d.]/g, ""); const i = s.indexOf("."); if (i >= 0) s = s.slice(0, i + 1) + s.slice(i + 1).replace(/\./g, "").slice(0, 2); if (s.length > 1 && s[0] === "0" && s[1] !== ".") s = s.replace(/^0+/, ""); return s.slice(0, 9); };
  const inp = h("input", { id: "amt", inputmode: "decimal", autocomplete: "off", placeholder: "0", "aria-label": label });
  inp.value = v;
  const set = (nv, speak) => { v = clean(nv); inp.value = v; onChange(v); if (speak) say(v || "zero"); };
  inp.addEventListener("input", () => set(inp.value));
  const keys = h("div", { class: "keys" });
  for (const k of ["1", "2", "3", "4", "5", "6", "7", "8", "9", ".", "0", "⌫"]) keys.append(h("button", { type: "button", text: k, "aria-label": k === "⌫" ? "Delete" : k === "." ? "Point" : k, onclick: () => set(k === "⌫" ? v.slice(0, -1) : v + k, true) }));
  setTimeout(() => onChange(v));
  return frag(h("div", { class: "amountbox" }, h("label", { for: "amt", text: sym() }), inp), keys);
}

}

SCREENS.amount = async ([to], q, known) => {
  const w = W.wallet;
  if (!w) { replace("setup"); return { title: "Wallet", body: frag() }; }
  const people = known || (await api("/api/wallet/people")).people;
  const p = people.find((x) => x.id === to);
  if (!p) return { title: "Send", body: note("bad", "That member isn't here any more.") };
  if (!p.hasWallet) return { title: `Pay ${p.handle}`, body: frag(note("info", `${p.handle} hasn't set up a wallet yet, so there's nowhere for the money to go. Ask them to set one up — it's under their Profile.`), h("div", { class: "push" }, btn("Back", "ghost", () => history.back()))) };
  const draft = JSON.parse(sessionStorage.getItem("wallet:draft") || "{}");
  const d = draft.to === to ? draft : { to, amount: "", note: "", reason: "", source: (w.sources.find((s) => s.default) || {}).id || (w.holdsBalance ? "wallet" : "") };
  const chinese = p.region === "CN";
  const cont = btn("Continue", "", async () => {
    cont.disabled = true;
    sessionStorage.setItem("wallet:draft", JSON.stringify(d));
    try {
      const quote = await api("/api/wallet/quote", { to, amount: d.amount, source: d.source });
      sessionStorage.setItem("wallet:quote", JSON.stringify({ ...quote, note: d.note, reason: d.reason, room: q.get("room") || "" }));

  }, { disabled: true });
  const reasonIn = h("input", { id: "reason", maxlength: "80", placeholder: "e.g. Consulting fee" });
  const noteIn = h("input", { id: "note", maxlength: "60", placeholder: "e.g. Script read-through" });
  noteIn.value = d.note; reasonIn.value = d.reason;
  const check = () => { cont.disabled = !(Number(d.amount) > 0) || !d.source || (chinese && d.reason.trim().length < 3); };
  noteIn.addEventListener("input", () => { d.note = noteIn.value; });
  reasonIn.addEventListener("input", () => { d.reason = reasonIn.value; check(); });
  const sources = [...(w.holdsBalance ? [{ id: "wallet", label: "Wallet balance", kind: "wallet", sub: `${w.balance.text} · no fee` }] : []), ...w.sources.map((s) => ({ ...s, sub: s.fee ? `${s.fee / 100}% fee` : "No fee" }))];

  drawSrc();
  return { title: `Pay ${p.handle}`, body: frag(
    w.verified !== "verified" ? note("warn", "Confirm your identity before you can send. ", h("button", { type: "button", class: "chip", onclick: () => go("verify"), text: "Confirm now" })) : null,
    amountEntry(d.amount, (v) => { d.amount = v; check(); }, `Amount to send to ${p.handle}, in ${w.currency}`),
    h("div", { class: "field" }, h("label", { for: "note", text: "What's it for?" }), noteIn),
    chinese ? h("div", { class: "field" }, h("label", { for: "reason", text: "Reason for the payment (required for China)" }), reasonIn, h("span", { class: "hint", text: "Payments into mainland China are checked, and need a stated reason." })) : null,
    h("p", { class: "k", text: "Pay from" }),
    sources.length ? srcList : note("warn", "Connect a card or bank to pay from. ", h("button", { type: "button", class: "chip", onclick: () => go("sources"), text: "Connect" })),
    h("div", { class: "push" }, cont)) };

SCREENS.review = async () => {
  const qt = JSON.parse(sessionStorage.getItem("wallet:quote") || "null");
  if (!qt) { replace("home"); return { title: "Wallet", body: frag() }; }
  const expires = Date.parse(qt.expiresAt);
  const left = h("span", { text: "" });
  const tick = setInterval(() => { const s = Math.max(0, Math.round((expires - Date.now()) / 1000)); left.textContent = s ? `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}` : "expired"; if (!document.contains(left)) clearInterval(tick); }, 1000);
  const sendIt = confirmButton(`Send ${qt.total.text} to ${qt.to.handle}`, "money", "send", qt.quoteId, async (confirmation) => {
    const r = await api("/api/wallet/send", { quoteId: qt.quoteId, note: qt.note, reason: qt.reason, room: qt.room, confirmation, returnUrl: "/wallet#sent" });
    sessionStorage.removeItem("wallet:quote"); sessionStorage.removeItem("wallet:draft");
    sessionStorage.setItem("wallet:last", r.id);
    if (r.next) { say("Your bank needs to approve this."); leaveFor(r.next, `activity/transfer/${r.id}`); return; }
    say(`Sent ${qt.send.text} to ${qt.to.handle}.`);
    go(`activity/transfer/${r.id}?just=1`);
  });
  return { title: "Check and send", body: frag(
    h("p", { class: "big", text: qt.send.text }),
    h("p", { class: "center lead", text: `to ${qt.to.handle}${qt.note ? " · " + qt.note : ""}` }),
    h("div", { class: "sum" },
      h("div", {}, h("span", { text: "Fee" }), h("span", { text: qt.fee.text })),
      h("div", { class: "tot" }, h("span", { text: "You pay" }), h("span", { text: qt.total.text })),
      h("div", { class: "tot" }, h("span", { text: `${qt.to.handle} receives` }), h("span", { text: qt.receive.text })),
      qt.rateText ? h("div", {}, h("span", { text: "Exchange rate" }), h("span", { text: qt.rateText })) : null,
      qt.rateText ? h("div", {}, h("span", { text: "Rate held for" }), left) : null,
      h("div", {}, h("span", { text: "Arrives" }), h("span", { text: qt.arrives })),
      h("div", {}, h("span", { text: "If not accepted" }), h("span", { text: "Back to you in 24 hours" }))),
    qt.overBalance ? note("bad", "That's more than your balance. Go back and pay from a card or bank.") : null,
    qt.overLimit ? note("bad", "That's over your daily sending limit.") : null,
    qt.firstTime ? note("warn", `You haven't paid ${qt.to.handle} before. Only send money to someone you've actually dealt with. Once they accept, it can't be reversed.`) : null,
    qt.reasonRequired ? h("p", { class: "small", text: `Reason given: ${qt.reason}` }) : null,
    h("div", { class: "push" }, qt.overBalance || qt.overLimit ? btn("Back", "ghost", () => history.back()) : sendIt)) };
};

/* REQUESTS */
SCREENS.request = async (_, q) => {
  const { people } = await api("/api/wallet/people");
  const to = q.get("to");
  const room = q.get("room") || "";
  if (!to) {
    const list = h("div", { class: "list" }, ...people.map((p) => row({ lead: face(p.handle), title: p.handle, sub: p.role, onclick: () => go(`request?to=${p.id}${room ? "&room=" + encodeURIComponent(room) : ""}`) })));
    return { title: "Request from", body: frag(h("p", { class: "lead", text: "They'll see what you're asking for, and can pay it in one tap." }), list) };
  }
  const p = people.find((x) => x.id === to);
  const d = { amount: "", note: "" };
  const noteIn = h("input", { id: "note", maxlength: "60", placeholder: "e.g. Script coverage" });
  const post = btn("Send request", "", async () => {
    post.disabled = true;
    try { await api("/api/wallet/requests", { to, amount: d.amount, note: d.note, room }); say("Request sent."); await load(); replace("home"); }
    catch (err) { post.disabled = false; showError(err); }
  }, { disabled: true });
  const check = () => { post.disabled = !(Number(d.amount) > 0) || d.note.trim().length < 2; };
  noteIn.addEventListener("input", () => { d.note = noteIn.value; check(); });
  return { title: `Request from ${p?.handle || "member"}`, body: frag(
    amountEntry("", (v) => { d.amount = v; check(); }, `Amount to request, in ${W.wallet?.currency || ""}`),
    h("div", { class: "field" }, h("label", { for: "note", text: "What's it for?" }), noteIn),
    h("p", { class: "small", text: "A request can't take money on its own. It only shows what you're asking for." }),
    h("div", { class: "push" }, post)) };
};

/* ACTIVITY, AND ONE PAYMENT */
SCREENS.activity = async ([kind, id], q) => {
  if (kind && id) return detailScreen(kind, id, q);
  const { rows } = await api("/api/wallet/activity");
  let f = q.get("f") || "all";
  const seg = h("div", { class: "seg", role: "group", "aria-label": "Show" }, ...[["all", "All"], ["in", "In"], ["out", "Out"]].map(([k, t]) =>
    h("button", { class: "chip", type: "button", "aria-pressed": String(f === k), text: t, onclick: () => replace(`activity?f=${k}`) })));
  const shown = rows.filter((r) => f === "all" || r.direction === f);
  return { title: "Activity", body: frag(seg, h("div", { class: "list" }, ...(shown.length ? shown.map(activityRow) : [row({ title: "Nothing here yet" })]))) };
};

async function detailScreen(kind, id, q) {
  const x = await api(`/api/wallet/activity/${kind}/${id}`);
  const [status, tone] = STATUS[x.state] || [x.state, ""];
  const tl = h("ol", { class: "timeline" }, ...(x.timeline || []).map((s) => h("li", { class: /declined|cancelled|returned|failed/.test(s.state) ? "bad" : "" }, h("b", { text: STEP[s.state] || s.state }), h("span", { text: new Date(s.at).toLocaleString() }))));
  const refresh = () => paint();
  const body = frag(
    q.get("just") === "1" ? note("good", x.direction === "out" ? `Sent. ${x.with.handle} has 24 hours to accept.` : "Done.") : null,
    h("p", { class: "big", text: x.amount.text }),
    h("p", { class: "center" }, h("span", { class: "pill " + tone, text: status })),
    x.with ? h("p", { class: "center lead", text: (x.direction === "out" ? "to " : "from ") + x.with.handle + (x.note ? " · " + x.note : "") }) : null,
    tl.children.length ? tl : null,
    kind === "transfer" ? h("div", { class: "sum" },
      x.direction === "out" ? h("div", {}, h("span", { text: "They receive" }), h("span", { text: x.received.text })) : h("div", {}, h("span", { text: "They sent" }), h("span", { text: x.sent.text })),
      x.fee.text && x.direction === "out" ? h("div", {}, h("span", { text: "Fee" }), h("span", { text: x.fee.text })) : null,
      x.rateText ? h("div", {}, h("span", { text: "Exchange rate" }), h("span", { text: x.rateText })) : null,
      x.sourceLabel ? h("div", {}, h("span", { text: "Paid from" }), h("span", { text: x.sourceLabel })) : null,
      x.payoutTo ? h("div", {}, h("span", { text: "Paid to" }), h("span", { text: x.payoutTo })) : null,
      x.reason ? h("div", {}, h("span", { text: "Reason" }), h("span", { text: x.reason })) : null,
      h("div", {}, h("span", { text: "Reference" }), h("span", { text: x.id }))) : null,
    kind === "topup" ? h("div", { class: "sum" }, h("div", {}, h("span", { text: "From" }), h("span", { text: x.sourceLabel })), x.fee.text ? h("div", {}, h("span", { text: "Fee" }), h("span", { text: x.fee.text })) : null) : null,
    kind === "withdrawal" ? h("div", { class: "sum" }, h("div", {}, h("span", { text: "To" }), h("span", { text: x.payoutTo }))) : null,
  );
  const acts = h("div", { class: "push" });
  const doIt = (label, cls, path, doneMsg) => btn(label, cls, async (e) => { e.target.disabled = true; try { await api(path, {}); say(doneMsg); await refresh(); } catch (err) { e.target.disabled = false; showError(err); } });
  if (kind === "transfer" && x.canAccept) acts.append(doIt(`Accept ${x.amount.text}`, "money", `/api/wallet/transfers/${id}/accept`, "Accepted."), doIt("Decline and send it back", "ghost", `/api/wallet/transfers/${id}/decline`, "Declined. The money went back."));
  if (kind === "transfer" && x.canCancel) acts.append(doIt("Cancel payment", "danger", `/api/wallet/transfers/${id}/cancel`, "Cancelled. The money is back with you."));
  if (kind === "request" && x.state === "open" && x.direction === "in") {
    acts.append(btn(`Pay ${x.amount.text}`, "money", async (e) => {
      e.target.disabled = true;
      try {
        const w = W.wallet;
        const source = (w.sources.find((s) => s.default) || {}).id || (w.holdsBalance ? "wallet" : "");
        const qt = await api(`/api/wallet/requests/${id}/quote`, { source });
        sessionStorage.setItem("wallet:quote", JSON.stringify({ ...qt, note: x.note, reason: qt.reasonRequired ? x.note : "", room: x.room }));
        go("review");
      } catch (err) { e.target.disabled = false; showError(err); }
    }), doIt("Decline", "ghost", `/api/wallet/requests/${id}/decline`, "Request declined."));
  }
  if (kind === "request" && x.state === "open" && x.direction === "out") acts.append(doIt("Cancel request", "danger", `/api/wallet/requests/${id}/cancel`, "Request cancelled."));
  if (kind === "transfer") acts.append(btn("Report a problem", "ghost", () => go(`report/${id}`)));
  body.append(acts);
  // Keep a payment that is still moving up to date while it's on screen.
  if (["charging", "paying_out", "processing"].includes(x.state)) setTimeout(() => { if (location.hash.includes(id)) paint(); }, 2500);
  const title = kind === "transfer" ? (x.direction === "out" ? `To ${x.with.handle}` : `From ${x.with.handle}`) : kind === "request" ? "Request" : kind === "topup" ? "Added money" : "Withdrawal";
  return { title, body };
}

SCREENS.report = async ([id]) => {
  const reasons = ["I didn't make this payment", "I was asked to pay to unlock something", "I paid but didn't get what was agreed", "Something else"];
  let pick = "";
  const list = h("div", { class: "list", role: "radiogroup", "aria-label": "What happened" });
  const text = h("input", { id: "more", maxlength: "600" });
  const send = btn("Send report", "", async () => {
    send.disabled = true;
    try { await api("/api/wallet/report", { ref: id, reason: pick, text: text.value }); say("Report sent."); replace(`reported`); }
    catch (err) { send.disabled = false; showError(err); }
  }, { disabled: true });
  const draw = () => { list.textContent = ""; for (const r of reasons) list.append(row({ radio: pick === r, title: r, onclick: () => { pick = r; send.disabled = false; draw(); list.querySelector('[aria-checked="true"]').focus(); } })); };
  draw();
  return { title: "Report a problem", body: frag(h("p", { class: "lead", text: "What happened?" }), list,
    h("div", { class: "field" }, h("label", { for: "more", text: "Anything else we should know (optional)" }), text),
    note("warn", "If you think it's a scam, don't send any more money, and don't move the conversation to another app."), h("div", { class: "push" }, send)) };
};
SCREENS.reported = async () => ({ title: "Reported", noBack: true, body: frag(h("div", { class: "done" }, svg("check")), h("p", { class: "hero center", text: "Thanks, we've got it" }),
  h("p", { class: "center lead", text: "Someone from the Exchange will reply in Messages within one working day." }), h("div", { class: "push" }, btn("Back to wallet", "", () => replace("home")))) });

/* ADD AND WITHDRAW */
SCREENS.add = async () => {
  const w = W.wallet;
  const cards = w.sources.filter((s) => s.kind !== "wallet");
  const d = { amount: "", source: (cards.find((s) => s.default) || cards[0] || {}).id || "" };
  if (!cards.length) return { title: "Add money", body: frag(note("info", "Connect a card or bank to add money from."), h("div", { class: "push" }, btn("Connect", "", () => go("sources")))) };
  const list = h("div", { class: "list", role: "radiogroup", "aria-label": "From" });
  const drawSrc = () => { list.textContent = ""; for (const s of cards) list.append(row({ radio: d.source === s.id, title: s.label, sub: s.fee ? `${s.fee / 100}% fee` : "No fee", onclick: () => { d.source = s.id; drawSrc(); } })); };
  drawSrc();
  const holder = h("div");
  const drawConfirm = () => {
    holder.textContent = "";
    if (!(Number(d.amount) > 0)) { holder.append(btn("Enter an amount", "", null, { disabled: true })); return; }
    holder.append(confirmButton(`Add ${sym()}${d.amount}`, "money", "topup", `${d.source}:${d.amount}`, async (confirmation) => {
      const r = await api("/api/wallet/topup", { amount: d.amount, source: d.source, confirmation, returnUrl: "/wallet#home" });
      if (r.next) { leaveFor(r.next, `activity/topup/${r.id}`); return; }
      say("Money added."); go(`activity/topup/${r.id}`);
    }));
  };
  return { title: "Add money", body: frag(amountEntry("", (v) => { d.amount = v; drawConfirm(); }, `Amount to add, in ${w.currency}`), h("p", { class: "k", text: "From" }), list, h("div", { class: "push" }, holder)) };
};

SCREENS.withdraw = async () => {
  const w = W.wallet;
  if (!w.payoutLabel) return { title: "Withdraw", body: frag(note("info", "Add the bank account to withdraw to."), h("div", { class: "push" }, btn("Add bank account", "", () => go("payout")))) };
  const d = { amount: "" };
  const holder = h("div");
  const drawConfirm = () => {
    holder.textContent = "";
    const n = Number(d.amount);
    if (!(n > 0)) { holder.append(btn("Enter an amount", "", null, { disabled: true })); return; }
    if (n * 100 > w.balance.minor) { holder.append(note("bad", "That's more than your balance.")); return; }
    holder.append(confirmButton(`Withdraw ${sym()}${d.amount} to ${w.payoutLabel}`, "", "withdraw", d.amount, async (confirmation) => {
      const r = await api("/api/wallet/withdraw", { amount: d.amount, confirmation });
      say("Withdrawal started."); go(`activity/withdrawal/${r.id}`);
    }));
  };
  return { title: "Withdraw", body: frag(h("p", { class: "center lead", text: `Available ${w.balance.text}` }), amountEntry("", (v) => { d.amount = v; drawConfirm(); }, `Amount to withdraw, in ${w.currency}`),
    h("div", { class: "list" }, row({ lead: badge("BANK"), title: `To ${w.payoutLabel}`, sub: "No fee · usually the next working day" })), h("div", { class: "push" }, holder)) };
};

/* PAYMENT METHODS AND SETTINGS */
SCREENS.methods = async ([id]) => {
  const w = W.wallet;
  if (id) {
    const s = w.sources.find((x) => x.id === id);
    if (!s) { replace("methods"); return { title: "Payment methods", body: frag() }; }
    return { title: s.label, body: frag(h("div", { class: "sum" }, h("div", {}, h("span", { text: "Fee when you pay" }), h("span", { text: s.fee ? `${s.fee / 100}%` : "No fee" })), h("div", {}, h("span", { text: "Default" }), h("span", { text: s.default ? "Yes" : "No" }))),
      h("div", { class: "push" },
        !s.default ? btn("Make default", "ghost", async () => { await api(`/api/wallet/sources/${id}/default`, {}); say("Default changed."); paint(); }) : null,
        btn("Remove", "danger", () => sheet(`Remove ${s.label}?`, "You can connect it again later.", "Remove", async () => { await api(`/api/wallet/sources/${id}/remove`, {}); say("Removed."); replace("methods"); })))) };
  }
  return { title: "Payment methods", body: frag(
    h("div", { class: "list" }, ...(w.sources.length ? w.sources.map((s) => row({ lead: badge(s.kind === "card" ? "CARD" : s.kind === "bank" ? "BANK" : s.kind === "paypal" ? "PP" : "WX"), title: s.label, sub: s.default ? "Default" : "", onclick: () => go(`methods/${s.id}`) })) : [row({ title: "Nothing connected" })])),
    h("div", { class: "list" }, row({ lead: badge("+"), title: "Connect a card, bank or PayPal", sub: "On the provider's own page", onclick: () => go("sources") })),
    h("p", { class: "small", text: "The Exchange keeps a reference to each account and its last four digits. Never a login, password or full card number." })) };
};

SCREENS.settings = async () => {
  const w = W.wallet;
  return { title: "Wallet settings", body: frag(
    h("div", { class: "list" },
      row({ title: "Face ID for payments", sub: w.passkeys ? `On · ${w.passkeys} device${w.passkeys > 1 ? "s" : ""}` : "Not set up", onclick: () => go("security") }),
      row({ title: "Identity", sub: w.verified === "verified" ? "Confirmed" : "Not confirmed", onclick: () => go("verify") }),
      row({ title: "Limits", sub: `Send up to ${w.limits.sendDay.text} a day · ${w.limits.sentToday.text} sent today`, onclick: () => go("limits") }),
      row({ title: "Money you receive", sub: w.payout === "bank" ? (w.payoutLabel || "Your bank") : "Stays in your wallet", onclick: () => go("payout") }),
      row({ title: "Payment methods", sub: `${w.sources.length} connected`, onclick: () => go("methods") })),
    h("div", { class: "list" },
      row({ title: "Help and safety", sub: "Report a payment, spot a scam", onclick: () => go("help") }),
      row({ title: "Close wallet", sub: "Withdraw your balance first", onclick: () => go("close") }))) };
};
SCREENS.limits = async () => {
  const w = W.wallet;
  return { title: "Limits", body: frag(h("div", { class: "sum" },
    h("div", {}, h("span", { text: "Send per day" }), h("span", { text: w.verified === "verified" ? w.limits.sendDay.text : "After confirming identity" })),
    h("div", {}, h("span", { text: "Sent in the last 24 hours" }), h("span", { text: w.limits.sentToday.text })),
    h("div", {}, h("span", { text: "Receive per month" }), h("span", { text: w.limits.receiveMonth.text }))),
    h("p", { class: "small", text: "Test limits. The real ones depend on the provider and its licence." })) };
};
SCREENS.help = async () => ({ title: "Help and safety", body: frag(
  note("warn", h("b", { text: "The Exchange will never ask you to send money " }), "to unlock an introduction, a seat, or a feature. Anyone who does is not us."),
  h("div", { class: "list" },
    row({ title: "Report a payment", sub: "Open it from Activity, then Report a problem", onclick: () => go("activity") }),
    row({ title: "Someone asked to move to another app to pay", sub: "That's the most common start of a scam" }),
    row({ title: "Sent to the wrong person", sub: "If they haven't accepted, cancel it from the payment" }))) });
SCREENS.close = async () => {
  const w = W.wallet;
  const has = w.balance.minor > 0;
  return { title: "Close wallet", body: frag(
    h("p", { class: "lead", text: "Closing removes your payment methods and stops payments to and from you. Your payment history is kept, as the law requires." }),
    has ? note("warn", `You still have ${w.balance.text}. Withdraw it first.`) : null,
    h("div", { class: "push" }, has ? btn("Withdraw balance", "", () => go("withdraw")) : null,
      confirmButton("Close wallet", "danger", "close", "wallet", async (confirmation) => { await api("/api/wallet/close", { confirmation }); await load(); say("Wallet closed."); replace("home"); }))) };
};

/* THE DEMO'S PEOPLE. Pick who to be; pay as one, accept as another. */
SCREENS.who = async () => {
  if (!W.demo) { replace("home"); return { title: "Wallet", body: frag() }; }
  const list = h("div", { class: "list", role: "radiogroup", "aria-label": "Who you're trying it as" });
  for (const p of W.demo.personas) {
    list.append(row({ radio: p.key === W.demo.as, lead: face(p.handle), title: p.handle, sub: p.role, onclick: () => {
      try { localStorage.setItem("board:device", p.key === "you" ? "" : p.key); } catch { /* private window */ }
      device = p.key === "you" ? "" : p.key;
      sessionStorage.removeItem("wallet:quote"); sessionStorage.removeItem("wallet:draft");
      say(`You're now ${p.handle}.`);
      replace("home");
    } }));
  }
  return { title: "Try it as", body: frag(
    h("p", { class: "lead", text: "Four invented people, each with their own wallet. Send money as one, then switch and accept it as the other." }),
    list,
    h("div", { class: "list" },
      row({ title: "You", sub: "Starts with no wallet — try setting one up" }),
      row({ title: "Mikko in Helsinki", sub: "Pays in euros by card. His bank asks him to approve card payments." }),
      row({ title: "Mia in Sydney", sub: "Has Australian dollars, and has asked Mikko for A$80" }),
      row({ title: "Wei in Shanghai", sub: "Paid straight to his bank in yuan, after a check" })),
    h("div", { class: "push" }, btn("Start the demo again", "ghost", async () => {
      await api("/api/wallet/demo/reset", {});
      sessionStorage.clear();
      try { localStorage.setItem("board:device", ""); } catch { /* private window */ }
      device = "";
      say("The demo has started again.");
      replace("home");
    }))) };
};

/* A small confirmation sheet for irreversible taps. */
function sheet(title, text, confirmText, run) {
  const ov = $("overlay"); ov.textContent = "";
  const close = () => { ov.textContent = ""; document.querySelector("main").removeAttribute("inert"); };
  const ok = btn(confirmText, "danger", async () => { ok.disabled = true; try { await run(); close(); } catch (err) { close(); showError(err); } });
  ov.append(h("div", { class: "scrim", onclick: close }), h("div", { class: "sheet", role: "dialog", "aria-modal": "true", "aria-labelledby": "sh" }, h("h2", { id: "sh", tabindex: "-1", text: title }), h("p", { class: "center lead", text }), ok, btn("Cancel", "ghost", close)));
  document.querySelector("main").setAttribute("inert", "");
  $("sh").focus();
  document.addEventListener("keydown", function esc(e) { if (e.key === "Escape") { close(); document.removeEventListener("keydown", esc); } });
}
